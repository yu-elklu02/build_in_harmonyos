# software-registry.yaml — 软件元数据注册表
# 用于 ohc-run.py init-build 自动查找下载 URL 和构建信息
---
#
# 字段说明:
#   name:         软件名（小写）
#   display:      显示名
#   category:     阶段分类（foundation / toolchain / compress / ssl / db / network / advanced / doc）
#   build_system: autotools | cmake | meson | makefile | custom-perl | script
#   url_template: 下载 URL 模板，{version} 会被替换为实际版本号
#   url_fallback: 备用 URL 模板
#   checksum_url: SHA256 校验文件 URL（可选，留空则跳过校验）
#   tar_format:   tar.gz | tar.xz | tar.bz2 | zip（用于解压命令选择）
#   static_build: 是否建议静态编译（见 dependencies.md 危险库分级）
#   known_issues: 已知鸿蒙适配问题
#
# 维护规则:
#   - 新增软件时在此注册
#   - URL 变更时更新对应条目
#   - 不确定的 URL 留空，ohc-run.py init-build 会降级到 --ask 模式
#   - 此文件主要用于 init-build 自动下载，软件元数据以 archives/ 中的 manifest.yaml 为准

registry:
  perl:
    display: "perl"
    category: auto-discovered
    build_system: unknown
    url_template: "https://www.cpan.org/src/5.0/perl-5.42.2.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  # ═══ 第零阶段：编译基石 ═══
  pkg-config:
    display: "pkg-config"
    category: foundation
    build_system: autotools
    url_template: "https://pkg-config.freedesktop.org/releases/pkg-config-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "内嵌 glib 2.38.2，需单独打补丁"
      - "--with-internal-glib 是唯一可行选项"

  # ═══ 第一阶段：基础工具链 ═══
  sed:
    display: "GNU sed"
    category: toolchain
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/sed/sed-{version}.tar.xz"
    url_fallback: "https://alpha.gnu.org/gnu/sed/sed-{version}.tar.xz"
    checksum_url: "https://ftp.gnu.org/gnu/sed/sed-{version}.tar.xz.sig"
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  coreutils:
    display: "GNU coreutils"
    category: toolchain
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/coreutils/coreutils-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues:
      - "可能需要按可用命令逐个打包"

  gawk:
    display: "GNU awk"
    category: toolchain
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/gawk/gawk-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  # ═══ 第二阶段：Autotools 工具链 ═══
  automake:
    display: "GNU automake"
    category: toolchain
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/automake/automake-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues:
      - "鸡生蛋问题：编译 automake 需要 automake"
      - "需要 ACLOCAL=/bin=true AUTOHEADER=/bin=true AUTOMAKE=/bin/null 绕过"

  libtool:
    display: "GNU libtool"
    category: toolchain
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/libtool/libtool-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues:
      - "依赖 automake"

  # ═══ 第三阶段-A：压缩/基础库 ═══
  zlib:
    display: "zlib"
    category: compress
    build_system: makefile
    url_template: "https://www.zlib.net/zlib-{version}.tar.gz"
    url_fallback: "https://github.com/madler/zlib/releases/download/v{version}/zlib-{version}.tar.gz"
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: true
    known_issues:
      - "⚠️ 建议静态编译（LD_LIBRARY_PATH 陷阱）"

  bzip2:
    display: "bzip2"
    category: compress
    build_system: makefile
    url_template: "https://sourceware.org/pub/bzip2/bzip2-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  xz:
    display: "XZ Utils"
    category: compress
    build_system: autotools
    url_template: "https://tukaani.org/xz/xz-{version}.tar.xz"
    url_fallback: "https://github.com/tukaani-project/xz/releases/download/v{version}/xz-{version}.tar.xz"
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  gzip:
    display: "GNU gzip"
    category: compress
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/gzip/gzip-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  # ═══ 第三阶段-B：SSL/加密/终端 ═══
  openssl:
    display: "OpenSSL"
    category: ssl
    build_system: custom-perl
    url_template: "https://www.openssl.org/source/openssl-{version}.tar.gz"
    url_fallback: "https://github.com/openssl/openssl/releases/download/openssl-{version}/openssl-{version}.tar.gz"
    checksum_url: "https://www.openssl.org/source/openssl-{version}.tar.gz.sha256"
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "依赖 zlib"
      - "必须 --no-asm（无汇编支持）"
      - "使用 ./Configure 而非 ./configure"

  ncurses:
    display: "ncurses"
    category: ssl
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/ncurses/ncurses-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: true
    known_issues:
      - '🔴 必须 --without-shared（否则系统 zsh 崩溃）'

  libffi:
    display: "libffi"
    category: ssl
    build_system: autotools
    url_template: "https://github.com/libffi/libffi/releases/download/v{version}/libffi-{version}.tar.gz"
    url_fallback: "https://ftp.gnu.org/gnu/libffi/libffi-{version}.tar.gz"
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "取最新版 3.5.2"

  libpst:
    display: "libpst"
    category: advanced
    build_system: cmake
    url_template: "http://www.five-ten-sg.com/libpst/packages/libpst-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: true
    known_issues:
      - "⚠️ 必须使用 cmake 构建（autotools 在 HMDFS 上失败）"
      - "⚠️ 建议静态编译"
      - "缺少 libgsf 依赖，无法构建 readpst 等工具"

  # ═══ 第三阶段-C：数据库/终端编辑 ═══
  gdbm:
    display: "GDBM"
    category: db
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/gdbm/gdbm-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  readline:
    display: "GNU readline"
    category: db
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/readline/readline-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: true
    known_issues:
      - "依赖 ncurses"
      - "⚠️ 建议静态编译"

  # ═══ 第四阶段：网络/文件工具 ═══
  wget:
    display: "GNU wget"
    category: network
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/wget/wget-{version}.tar.gz"
    url_fallback: "https://github.com/wget/wget/releases/download/v{version}/wget-{version}.tar.gz"
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "依赖 openssl"

  rsync:
    display: "rsync"
    category: network
    build_system: autotools
    url_template: "https://download.samba.org/pub/rsync/rsync-{version}.tar.gz"
    url_fallback: "https://github.com/WayneD/rsync/releases/download/v{version}/rsync-{version}.tar.gz"
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  jq:
    display: "jq"
    category: network
    build_system: autotools
    url_template: "https://github.com/jqlang/jq/releases/download/jq-{version}/jq-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  file:
    display: "file"
    category: network
    build_system: autotools
    url_template: "https://astron.com/pub/file/file-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "建议 --enable-static"

  tar:
    display: "GNU tar"
    category: network
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/tar/tar-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  dos2unix:
    display: "dos2unix"
    category: network
    build_system: autotools
    url_template: "https://waterlan.home.xs4all.nl/dos2unix/dos2unix-{version}.tar.gz"
    url_fallback: "https://github.com/wtk/dos2unix/releases/download/{version}/dos2unix-{version}.tar.gz"
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  # ═══ 第五阶段：高级系统工具 ═══
  bash:
    display: "GNU bash"
    category: advanced
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/bash/bash-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - '--without-bash-malloc'

  htop:
    display: "htop"
    category: advanced
    build_system: autotools
    url_template: "https://github.com/htop-dev/htop/releases/download/{version}/htop-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues:
      - "依赖 ncurses"

  strace:
    display: "strace"
    category: advanced
    build_system: autotools
    url_template: "https://strace.io/files/{version}/strace-{version}.tar.xz"
    url_fallback: "https://github.com/strace/strace/releases/download/v{version}/strace-{version}.tar.xz"
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues:
      - "ptrace 受限，可能不打包"
      - "--disable-mpers"

  patch:
    display: "GNU patch"
    category: advanced
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/patch/patch-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  # ═══ 第六阶段：文档/辅助工具 ═══
  texinfo:
    display: "GNU texinfo"
    category: doc
    build_system: autotools
    url_template: "https://ftp.gnu.org/gnu/texinfo/texinfo-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues: []

  help2man:
    display: "help2man"
    category: doc
    build_system: script
    url_template: "https://download.savannah.gnu.org/releases/help2man/help2man-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "脚本类型（Perl），非 C 编译"

  libpipeline:
    display: "libpipeline"
    category: doc
    build_system: autotools
    url_template: "https://download.savannah.nongnu.org/releases/libpipeline/libpipeline-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues:
      - "man-db 核心依赖"

  # ═══ 第七阶段：文档系统 ═══
  man-db:
    display: "man-db"
    category: doc
    build_system: autotools
    url_template: "https://download.savannah.nongnu.org/releases/man-db/man-db-{version}.tar.xz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.xz"
    static_build: false
    known_issues:
      - "依赖 libpipeline + gdbm"
      - "⚠️ VPATH 构建（避免 autotools 重生成）"
      - "ACLOCAL=/bin=true 绕过"

  rhash:
    display: "RHash"
    category: advanced
    build_system: makefile
    url_template: "https://github.com/rhash/RHash/archive/refs/tags/v{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

  knock:
    display: "knock"
    category: network
    build_system: autotools
    url_template: "https://distfiles.alpinelinux.org/distfiles/v3.24/knock-{version}.tar.gz"
    url_fallback: ""
    checksum_url: ""
    tar_format: "tar.gz"
    static_build: false
    known_issues: []

# ═══ URL 搜索策略（当注册表中没有 URL 时使用）═══
search_strategies:
  - name: "gnu_ftp"
    pattern: "https://ftp.gnu.org/gnu/{name}/{name}-{version}.tar.*"
    priority: 1
  - name: "github_releases"
    pattern: "https://github.com/{org}/{repo}/releases/download/v{version}/{name}-{version}.tar.*"
    priority: 2
  - name: "freedesktop"
    pattern: "https://{name}.freedesktop.org/releases/{name}-{version}.tar.*"
    priority: 3
  - name: "savannah"
    pattern: "https://download.savannah.nongnu.org/releases/{name}/{name}-{version}.tar.*"
    priority: 4
  - name: "sourceforge"
    pattern: "https://downloads.sourceforge.net/project/{name}/{name}/{version}/{name}-{version}.tar.*"
    priority: 5
