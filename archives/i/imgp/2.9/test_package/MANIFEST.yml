# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: imgp/2.9
homepage: "https://github.com/jarun/imgp"

# 上游测试命令
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: imgp.py
    source: imgp-2.9/imgp.py
    description: "主程序模块（自包含，无独立测试套件）"
    command: "imgp --help"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.py
    description: "Python 模块导入 + CLI 命令验证 + 图片处理测试"
    command: "python3 test.py"

# 测试断言总数
assertion_count: 2