  url: "https://github.com/iortcw/iortcw/archive/refs/tags/1.51c.tar.gz"
  # sha256 已实测验证（2026-08-07 完整下载 27MB 源码包计算），为真实哈希
  sha256: "0f6c136db1e5c6115e044190655163b9784bbef9b0667ec2a8900abd79565e83"
# aireview P0: 删 "1.51.c" 版本键包装 — sources 下直接放 url/sha256（参照 kubetui），避 get(self, **) TypeError
# aireview P1: 删 mirror_url 个人 fork — CI 自动为 GitHub URL 添加 gh-proxy/ghproxy 镜像 fallback（R13/R39），勿硬编码个人 fork

# CI #16936/#16942/#16946: q_platform.h:184 'ARCH_STRING should be defined by the
# Makefile'——Makefile 只在 PLATFORM=linux 分支的 BASE_CFLAGS 定义 ARCH_STRING
# （L378-379），iortcw 用 PLATFORM=ohos 时未定义。CFLAGS 注入 -DARCH_STRING 经
# make 两次 shell 解析引号不可靠（三次 CI 失败）→ 补丁把 "ohos" 加入 PLATFORM
# linux 分支，复用原生 -DARCH_STRING=\"$(FILE_ARCH)\"（FILE_ARCH=$(ARCH)=arm64）。
patches:
  "1.51.c":
    - patch_file: "patches/0001-ohos-arch-string.patch"
