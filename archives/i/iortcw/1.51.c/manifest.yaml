software: iortcw
# 版本级 manifest 模板
# 文件位置: archives/i/iortcw/1.51.c/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.51.c"

# 编译状态
# published | built | failed | archived
status: failed

# 构建系统类型
# cmake | autotools | makefile | meson | cargo | custom
build_system: makefile

# 构建日期
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/iortcw/iortcw/archive/refs/tags/1.51c.tar.gz"
  mirror_url: "https://gitcode.com/aurawalker/iortcw/archive/refs/tags/1.51c.tar.gz"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: makefile
  configure_options:
    - "make ARCH=arm64 PLATFORM=ohos BUILD_CLIENT=1 BUILD_SERVER=1 BUILD_GAME_SO=1"
  dependencies:
    - "SDL2/2.30.0"
    - "openal/1.25.2"
    - "opus/1.4"
    - "opusfile/0.12"
    - "libogg/1.3.5"
    - "libvorbis/1.3.7"
    - "libjpeg/10"
    - "freetype/2.14.3"
    - "curl/8.15.0"
    - "zlib/1.3.1.1.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []
patch_classification: []

# ============================================================
# 适配知识
# ============================================================
knowledge_gained:
  - "iortcw 用 make 构建（非 CMake/autotools），HOWTO-Build.txt 真构建命令参考"
  - "交叉编译: ARCH=arm64 + PLATFORM=ohos + CC/CXX 注入 Conan 解析的 clang"
  - "依赖 include/lib 路径手动注入 CFLAGS/LDFLAGS（make 不走 pkg-config）"

# ============================================================
# 上游测试信息
# ============================================================
upstream_tests:
  total: 0
  passed: 0
  skipped: 0
  notes: "iortcw 上游无独立 tests/ 目录（游戏引擎非库，无单元测试框架），靠运行时游戏验证需 RTCW 游戏数据"
