package: imgui/1.92.2b
homepage: https://github.com/ocornut/imgui
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_notes: "The exact v1.92.2b release archive contains no formal upstream test directory or test runner; upstream pass rate is N/A rather than 0/0."
test_package_tests:
  - file: test_imgui.cpp
    description: "Public version/layout check plus context, IO-state, style, and destruction lifecycle checks; OHOS runs the core executable to avoid requiring application-only Ace/NAPI runtime libraries in the PC emulator shell"
    command: "./test_imgui_core on OHOS, ./test_imgui otherwise"
  - file: test_imgui_ohos.cpp
    description: "On OHOS, compile and link NativeXComponent input mapping plus GLES3 EGL pbuffer backend coverage"
    command: "cmake --build . --target test_imgui_ohos_backend"
  - file: test_imgui.cpp
    description: "Fault injection requires the public compatibility check to reject an intentionally mismatched version"
    command: "./test_imgui_core --fault-version on OHOS, ./test_imgui --fault-version otherwise"
assertion_count: 10
