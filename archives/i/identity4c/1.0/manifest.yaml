# identity4c 1.0 编译档案
software: identity4c
version: "1.0"
status: built
build_system: manual
build_date: "2026-07-28"

dependencies:
  required:
    - openssl/3.5.6
    - libxml2/2.15.3

build_config:
  configure_options:
    - --enable-shared=no
    - --enable-static=yes
  env:
    CC: clang
    CXX: clang++


compatibility:
  level: medium
  issues: []
  notes: |
    - UFP Identity C library, provides SSL/TLS identity verification
    - Uses OpenSSL for TLS/crypto and libxml2 for XML parsing
    - Bundles strmap (LGPL-3) and picohttpparser (MIT) as source
    - Build system: manual Makefile (autotools not available on CI runners)
    - Test package verifies strmap API (sm_new/put/get/delete) and library linking (R34)

test_results:
  type: conan
  passed: 3
  failed: 0
  note: |
    - 3/3 tests passed: identity_context_t type, API symbol resolution, strmap put/get round-trip

knowledge_gained:
  - "identity4c upstream uses autotools but CI runners lack automake/libtool, so manual Makefile is used"
  - "strmap API (sm_new/sm_put/sm_get/sm_delete) is bundled as source and can be tested directly"
  - "openssl::openssl CMake target has empty INTERFACE_INCLUDE_DIRECTORIES (openssl package_info defect)"

references:
  - https://github.com/ufpidentity/identity4c
