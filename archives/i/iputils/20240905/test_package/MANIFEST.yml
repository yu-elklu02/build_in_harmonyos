package: iputils/20240905
homepage: "https://iputils.org"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test (native device builds; skipped on cross-compiling CI workers)"

excluded_upstream_tests:
  - command: "meson test"
    reason: "The upstream meson test suite is compiled and executed during build when running natively on the HarmonyOS device (35 tests: 22 OK + 13 EXPECTEDFAIL; ping -6 -c1 localhost is expected-fail because the device /etc/hosts maps localhost only to IPv4, so IPv6 name resolution for localhost is unavailable while ::1 ping itself works). On cross-compiling CI workers without an exe_wrapper it is skipped, since the network tests also require Linux capabilities, namespaces, and raw sockets unavailable in the isolated worker. Packaged tools are additionally validated with version smoke tests in test_package."

upstream_tests:
  - path: test/arping
    type: upstream arping tests
  - path: test/clockdiff
    type: upstream clockdiff tests
  - path: test/ping
    type: upstream ping tests
  - path: test/tracepath
    type: upstream tracepath tests

test_package_tests:
  - file: test_iputils.sh
    description: "Execute ping, tracepath, arping and clockdiff with -V from the packaged bin directory"
    command: "sh test_iputils.sh <package_folder>"

assertion_count: 8
