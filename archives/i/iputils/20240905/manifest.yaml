# iputils 20240905 编译记录
# 由 OpenHarmony 编译智能体生成

software: iputils
version: 20240905
status: built

build_info:
  build_system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-DBUILD_PING=true"
    - "-DBUILD_TRACEPATH=true"
    - "-DBUILD_ARPING=true"
    - "-DBUILD_CLOCKDIFF=true"
    - "-DNO_SETCAP_OR_SUID=true"
    - "-DUSE_CAP=false"
    - "-DUSE_IDN=false"
    - "-DSKIP_TESTS=false"
    - "-DUSE_GETTEXT=false"

  compiler: clang 15.0.4
  target_platform: HarmonyOS aarch64

  build_tools:
    - ping
    - tracepath
    - arping
    - clockdiff

  ipv6_support:
    ping: true
    tracepath: true
    note: "ping 和 tracepath 统一支持 IPv4/IPv6，使用 -4/-6 选项切换"

patches:
  - name: "0001-harmonyos-compatibility.patch"
    description: "修复 HarmonyOS/musl 平台兼容性问题"
    fixes:
      - "program_invocation_short_name 未定义（glibc 特有）"
      - "sockaddr_storage 重定义冲突"
  - name: "0002-meson-test-ping-uid-safety.patch"
    description: "Handle empty/missing id -u output in test/ping/meson.build so upstream meson tests can run on device"
    fixes:
      - "configure-time to_int() failure on empty id -u output"

dependencies:
  required:
    - meson >= 0.44
    - ninja
    - clang/gcc
  optional:
    - libcap (未安装，禁用 USE_CAP)
    - libidn2 (未安装，禁用 USE_IDN)
    - gettext (未安装，禁用 USE_GETTEXT)

test_results:
  ping_ipv4:
    test: "ping -c 1 127.0.0.1"
    result: "PASS"
    output: "64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.097 ms"

  ping_ipv6:
    test: "ping -c 1 ::1"
    result: "PASS"
    output: "64 bytes from ::1: icmp_seq=1 ttl=64 time=0.081 ms"

  tracepath_ipv4:
    test: "tracepath 127.0.0.1"
    result: "PASS"
    output: "1: localhost 0.227ms reached"

  tracepath_ipv6:
    test: "tracepath ::1"
    result: "PASS"
    output: "1: ip6-localhost 0.202ms reached"

  arping:
    test: "arping -V"
    result: "PASS"
    output: "arping from iputils 20240905"

  clockdiff:
    test: "clockdiff -V"
    result: "PASS"
    output: "clockdiff from iputils 20240905"

binary_info:
  ping:
    size: 262KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/ping

  tracepath:
    size: 50KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/tracepath

  arping:
    size: 66KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/arping

  clockdiff:
    size: 51KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/clockdiff

knowledge_gained:
  platform_specific:
    - issue: "program_invocation_short_name glibc-only"
      solution: "使用 __progname 替代"
      applicability: "所有使用 error() 函数的软件"

    - issue: "sockaddr_storage 重定义冲突"
      solution: "调整头文件包含顺序，使用宏重命名"
      applicability: "包含 linux/rtnetlink.h 的网络软件"

  build_specific:
    - issue: "meson vcs_tag 需要 git 或 meson 内部命令"
      solution: "创建符号链接使 meson 可执行"
      applicability: "仅本软件"

notes:
  - "iputils 20240905 统一了 ping 和 ping6，使用单一 ping 工具支持 IPv4/IPv6"
  - "禁用了 capability 和 IDN 支持（无 libcap/libidn2）"
  - "所有工具均未进行 ELF 签名（需要在打包时处理）"

compile_date: 2026-05-06
compile_duration: "约 20 分钟（包含调试和修复）"
