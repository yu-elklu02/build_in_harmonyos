# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ioping/1.3
homepage: https://github.com/koct9i/ioping

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
# ioping 上游 Makefile 中的 test 目标：运行 3 组 I/O 延迟测试
upstream_tests:
  - file: Makefile
    source: ioping-1.3/Makefile
    description: "ioping 官方测试 — 磁盘 I/O 延迟/速率/顺序读写（3 组）"
    command: "make test"
    condition: "native 编译时执行，交叉编译跳过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/src/test_ioping.c
    description: "验证 ioping 二进制存在、--help 输出、--version 输出（共 3 项）"
    command: "./test_ioping"
  - file: test_package/conanfile.py
    description: "交叉编译时验证二进制产物存在于 package 中"
    command: "conan create (test_package _check_binary_exists)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
