# test_package/MANIFEST.yml — igmpproxy 0.4
# CI L0e requires this file to exist.

package: igmpproxy/0.4
homepage: "https://github.com/pali/igmpproxy"

# igmpproxy has no upstream test suite (autotools project, no make check target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs igmpproxy -h and verifies version string 'igmpproxy 0.4' in output"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 1
