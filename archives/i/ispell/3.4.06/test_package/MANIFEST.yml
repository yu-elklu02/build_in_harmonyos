# MANIFEST.yml — ispell/3.4.06 test_package
# R34: tests must actually exercise the package binary

test_sources:
  - test_ispell.sh

binaries_under_test:
  - ispell
  - buildhash

test_assertions:
  - ispell binary is present and executable
  - ispell -v prints version string containing "ispell"
  - ispell -a pipe mode emits "@(#)" version header line
  - ispell -a pipeline executes without crash

upstream_tests: []
upstream_test_in_build: false
upstream_test_note: "ispell 3.4.06 has no upstream make test, make check, or other automated test target."

test_package_tests:
  - file: "test_ispell.sh"
    cases: 4
    passed: 4
    description: "Adapted package test: executable presence, version output, ispell -a header, and pipe-mode execution."

hongmeng_validation:
  platform: "HarmonyOS HongMeng Kernel 1.12.0 aarch64, clang 15.0.4"
  conan_create: "PASS — exit 0, All ispell tests PASSED"
  ispell_v: 'PASS — @(#) International Ispell Version 3.4.06 30 Oct 2023'
  ispell_a: "PASS — pipe mode emits @(#) header"
  elf_codesign: "present — llvm-readelf -S shows [25] .codesign PROGBITS"
  environment:
    ISPELL_DICTDIR: "<package_folder>/usr/local/lib  # ispell reads dict dir from LIBRARYVAR env (config.X:608), hardcoded name ISPELL_DICTDIR not LIBDIR"
  notes: "test() prefixes the zsh call with `env ISPELL_DICTDIR=...` so ispell finds english.hash inside the conan cache package folder instead of the hardcoded /usr/local/lib real-machine root. ispell ELF is re-signed in package() (llvm-objcopy + binary-sign-tool -selfSign 1) so HongMeng MAC accepts exec from conan cache p/."
