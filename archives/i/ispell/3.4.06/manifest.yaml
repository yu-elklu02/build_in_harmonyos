version: "3.4.06"
software: ispell
status: adapting
build_date: "2026-07-31"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/i/ispell/ispell_3.4.06.orig.tar.gz"
  sha256: "17c91633d4c8075acc503163a16463fc54ab1c7453280ad39cd3db75c783eba6"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang (from Conan toolchain conf)"
    - "TERMLIB=-lncursesw"
    - "TERMINCLUDE=-I<ncurses_pkg>/include/ncursesw"
    - "LANGUAGES= (skip English dictionary build)"
  dependencies:
    - "ncurses/6.5"
