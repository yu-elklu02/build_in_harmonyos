version: "3.4.06"
software: ispell
status: passed
build_date: "2026-08-10"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/i/ispell/ispell_3.4.06.orig.tar.gz"
  sha256: "17c91633d4c8075acc503163a16463fc54ab1c7453280ad39cd3db75c783eba6"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang (from Conan toolchain conf)"
    - "TERMLIB=-lncursesw"
    - "TERMINCLUDE=-I<ncurses_pkg>/include/ncursesw"
    - "LANGUAGES= (skip English dictionary build)"
  dependencies:
    - "ncurses/6.5"

hongmeng_patches:
  - "rindex→strrchr (8 sites in buildhash.c + ispell.c; HongMeng libc dropped BSD rindex)"
  - "config.sh CC='cc'→'clang' + TERMLIB='-lncurses'→'-L<dir> -lncursesw' (sed extracts from config.X not make cmdline)"
  - "ispell.h EXTERN char *BC → ispell_BC (rename; tentative definition clashes with ncurses lib_termcap.o)"
  - "term.c sigsetmask/sigblock → (void)0 (4 sites; HongMeng libc dropped BSD signal API)"
  - "build() make target programs ispell.1 ispell.5 (skip all-languages → munchlist hardlink fails)"
  - "package() install targets install-basic install-deformatters install-dictbuild (skip install-languages)"
  - "package() ELF re-sign: llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 (HongMeng MAC rejects unsigned exec from conan cache p/)"
  - "package() buildhash english.aff+english.{0,1,2} → english.hash at <pkg>/usr/local/lib/ (bypass munchlist softlink)"
  - "test_package test() env ISPELL_DICTDIR=<pkg>/usr/local/lib (ispell reads dict dir from LIBRARYVAR env, hardcoded name is ISPELL_DICTDIR not LIBDIR)"

tests:
  upstream:
    command: "No upstream automated test target is provided by ispell 3.4.06"
    cases: 0
    passed: 0
  adapted:
    command: "test_package/test_ispell.sh"
    cases: 4
    passed: 4
    pass_rate: "4/4 (100%)"

verification:
  conan_create: "PASS — exit 0, package built, test_package All ispell tests PASSED"
  test_package:
    ispell_v: 'PASS — @(#) International Ispell Version 3.4.06 30 Oct 2023'
    ispell_a: 'PASS — pipe mode emits @(#) header'
  final_binary_codesign: "present — llvm-readelf -S shows [25] .codesign PROGBITS"
  platform: "HarmonyOS HongMeng Kernel 1.12.0 aarch64, clang 15.0.4"

