package: i2pd/2.58.0-r1
homepage: "https://github.com/PurpleI2P/i2pd"

upstream_check_command: "cmake -S build -B build-tests -DBUILD_TESTING=ON && ctest --test-dir build-tests --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build-tests --output-on-failure"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: i2pd-2.58.0/tests/CMakeLists.txt
    description: "13 upstream HTTP, Base64 and cryptographic unit-test executables; require Check >= 0.9.10"
    command: "ctest --test-dir build-tests --output-on-failure"

test_package_tests:
  - file: conanfile.py
    description: "Runs packaged i2pd --version and --help, then verifies real configuration parsing rejects an unknown option"
    command: "conan create ."

assertion_count: 3
