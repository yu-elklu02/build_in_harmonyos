# test_package/MANIFEST.yml
# Upstream test declaration file
# CI (build_and_test.sh L0e) requires this file to exist

package: isa-l_crypto/2.26
homepage: "https://github.com/intel/isa-l_crypto"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (not run in Conan CI, but documented for reference)
upstream_tests:
  - file: md5_mb/md5_mb_test.c
    source: isa-l_crypto-2.26/md5_mb/md5_mb_test.c
    description: "MD5 multi-buffer test with reference vectors"
    command: "./md5_mb_test"
  - file: sha256_mb/sha256_mb_test.c
    source: isa-l_crypto-2.26/sha256_mb/sha256_mb_test.c
    description: "SHA256 multi-buffer test with reference vectors"
    command: "./sha256_mb_test"

# Consumer test in test_package/
test_package_tests:
  - file: test.c
    description: "Consumer test: compute MD5(\"abc\") via isa-l_crypto multi-buffer API and compare to known digest"
    command: "./test_isal_crypto"

# Approximate assertion count
assertion_count: 2
