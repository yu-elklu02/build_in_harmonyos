knowledge_gained:
  - "isa-l_crypto 支持 CMake 构建，对 aarch64 架构有原生 ASIMD/SVE/SVE2 优化"
  - "aarch64 SVE 汇编使用 .req 寄存器别名语法，需要 -fno-integrated-as 使用外部 GNU 汇编器"
  - "aes/aarch64/gcm_common.S 中 FN_NAME 宏使用 #### (双 ##) GNU 扩展，clang 预处理器不支持，改为 ## 产生相同结果"
  - "CMakeLists.txt 自动将 CMAKE_C_FLAGS 传播到 CMAKE_ASM_FLAGS，通过 CMAKE_C_FLAGS 传递 -fno-integrated-as"
  - "BUILD_TESTS=OFF 和 BUILD_PERF=OFF 可避免 OpenSSL 头文件依赖"

