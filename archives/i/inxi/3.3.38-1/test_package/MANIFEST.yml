# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: inxi/3.3.38-1
homepage: "https://github.com/smxi/inxi"

# Upstream test command（纯 Perl 脚本，无独立测试套件）
upstream_check_command: "inxi -v"

# Upstream tests not run in build（单文件脚本，无随包测试套件）
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_inxi.sh
    description: "Run inxi -v to verify tool executes and reports system info"

# Test assertion count
assertion_count: 1
