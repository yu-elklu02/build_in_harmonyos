software: ipsumdump
name: ipsumdump
version: "1.86"
status: built
build_date: "2026-07-28"
build_system: autotools

source:
  url: "https://read.seas.harvard.edu/~kohler/ipsumdump/ipsumdump-1.86.tar.gz"
  sha256: "e114cd01b04238b42cd1d0dc6cfb8086a6b0a50672a866f3d0d1888d565e3b9c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=\$DEFAULT_PREFIX"

  dependencies:
    - "libpcap/1.10.6"

  cc: clang
  cxx: clang++

patches_applied:
  - description: "OHOS 兼容补丁由 conanfile.py build() 方法内联应用（config.guess/sub OHOS 识别、SIOCGSTAMP 回退、umask 077→022、_IOC_DIRSHIFT 定义、install-man 禁用），无需独立 patch 文件。"
    type: portability

knowledge_gained:
  - "E007/E072: config.guess/sub 2010版需echo+exit风格补丁"
  - "E002/E011: umask 077→022 for HMDFS"
  - "SIOCGSTAMP未定义需回退定义"
  - "OHOS使用libc++，configure中-force-linux-check绕过"
  - "OHOS缺少_IOC_DIRSHIFT宏需在llrpc.h中回退定义"
