# test_package/MANIFEST.yml — ipsumdump 1.86
package: ipsumdump/1.86
homepage: "https://read.seas.harvard.edu/~kohler/ipsumdump/"

# 测试数据说明
# 测试使用的 PCAP 文件由 test.c 运行时内嵌生成（embedded byte array），
# 不提交二进制测试数据文件到仓库，避免 git apply 时 binary patch 失败。

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 测试
test_package_tests:
  - file: test.c
    description: "验证 ipsumdump --version 和 ipsumdump -c -r 解析 PCAP（PCAP 数据运行时内嵌生成）"
    command: "./test_ipsumdump"
    type: smoke
    source: "Homebrew pcap smoke 移植"

assertion_count: 2
