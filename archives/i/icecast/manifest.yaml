software: icecast
display: "Icecast"
description: "流媒体服务器（Ogg Vorbis/Theora、MP3、AAC、Opus 互联网电台广播）"
category: audio
homepage: "https://icecast.org"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 增加 HarmonyOS 识别分支，输出 aarch64-unknown-linux-ohos 三元组（E007）"
    - "config.sub 增加 linux-ohos* KERNEL-OS 组合与 -linux-ohos/-ohos OS 列表（E007）"
    - "configure heredoc 中 config.status 的 umask 077 改为 022，解决 HMDFS setgid 下 confXXXXXX/subs1.awk Permission denied（E129）"
    - "src/thread/thread.c 的 pthread_setcancelstate 调用改为 HAVE_PTHREAD_SETCANCELSTATE 功能检测守卫（configure AC_CHECK_FUNCS 检测，OHOS musl libc 未实现该函数自动跳过，E085/E127，符合 R8 功能检测规范）"
    - "依赖 libdir 以 RPATH 嵌入二进制，libcurl AC_RUN_IFELSE 探测与 L2 smoke 裸跑通过"
  common_dependencies:
    - "libxml2/2.15.3"
    - "libxslt/1.1.45.1"
    - "libvorbis/1.3.7"
    - "libogg/1.3.6"
    - "curl/8.15.0"
    - "openssl/3.5.6.1"
    - "zlib/1.3.1.1"

versions:
  "2.4.4":
    status: built
    build_date: "2026-08-08"
