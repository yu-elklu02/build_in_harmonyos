# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: icecast/2.4.4
homepage: "https://icecast.org/"

# 上游测试命令 — icecast 2.4.4 autotools 无 TESTS/check 目标
# (Makefile.am 只有 bin_PROGRAMS, 无 TESTS; src/avl/test.c、src/log/test.c、
#  src/net/test_resolver.c 存在但未挂接到 make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (icecast 无上游自动化测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "端到端功能测试: --version 输出 + 最小配置启动服务器 + curl /status.xsl 验证 XSLT 渲染 + 干净关闭"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
