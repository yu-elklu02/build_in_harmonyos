# test_package/MANIFEST.yml
# inih r58 — official tests/unittest.sh contains 15 compile/run cases whose
# output must match the checked-in baseline_*.txt files.

package: inih/r58
homepage: https://github.com/benhoyt/inih

upstream_tests_exist: true
upstream_test_audit: "r58 官方 tests/unittest.sh 定义 15 组编译配置，并提供对应 baseline_*.txt"
upstream_check_command: "compile the 15 official tests/unittest.sh variants and compare output with baseline_*.txt"
upstream_test_in_build: false
upstream_test_command: "test_package/conanfile.py::_run_upstream_tests"

upstream_tests:
  - multi
  - multi_max_line
  - single
  - disallow_inline_comments
  - stop_on_first_error
  - handler_lineno
  - string
  - heap
  - heap_max_line
  - heap_realloc
  - heap_realloc_max_line
  - heap_string
  - call_handler_on_new_section
  - allow_no_value
  - alloc

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_inih.c
    description: "inih API 验证: ini_parse_string 基本解析 / 多 section / 注释忽略 / 错误检测 / 空输入处理"
    command: "./test_inih"

# 测试断言总数 (6 组测试, 每组多个断言)
assertion_count: 15
