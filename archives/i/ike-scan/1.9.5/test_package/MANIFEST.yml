package: ike-scan/1.9.5
homepage: https://github.com/royhills/ike-scan

upstream_check_command: "check-sizes && check-hash"
upstream_test_in_build: true
upstream_test_command: "compiled and executed from conanfile.py build() when the target binary can run"

upstream_tests:
  - file: check-sizes.c
    source: ike-scan-1.9.5/check-sizes.c
    description: Upstream deterministic ABI/size validation helper.
    command: check-sizes
  - file: check-hash.c
    source: ike-scan-1.9.5/check-hash.c
    description: Upstream deterministic hash implementation validation helper.
    command: check-hash

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes upstream tests but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test_ike_scan.sh
    description: Consumer smoke test executes ike-scan --version and psk-crack --help from the packaged binaries.
    command: sh test_ike_scan.sh

assertion_count: 4
