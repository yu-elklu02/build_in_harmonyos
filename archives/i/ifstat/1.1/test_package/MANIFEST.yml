# test_package/MANIFEST.yml
package: ifstat/1.1
homepage: https://gael.roualland.free.fr/ifstat/

upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Validate the packaged executable and official version output"
    command: "ifstat -v"
  - file: test.sh
    description: "Exercise the proc network driver for one sampling interval"
    command: "ifstat -a 0.1 1"
  - file: test.sh
    description: "Validate inbound and outbound rate columns in sampled output"
    command: "grep 'KB/s in|KB/s out'"

assertion_count: 5
