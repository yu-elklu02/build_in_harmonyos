software: inotify-tools
version: "4.25.9.0"
build_system: makefile  # aireview P2: 上游 Autotools 链缺 aclocal 不可用，conanfile 手写极简 Makefile 直接编译
status: built
build_date: "2026-07-17"

source:
  url: "https://github.com/inotify-tools/inotify-tools/archive/refs/tags/4.25.9.0.tar.gz"
  tar_format: tar.gz

build:
  system: makefile  # conanfile.py build() 手写 Makefile 绕开 autotools 链
  configure_options: []  # 上游 configure 不运行（aclocal 缺失），手写 Makefile 直接编译
  cc: clang

patches_applied: []  # fanotify 禁用由 conanfile.py build() 手写 config.h + fanotify.h shim 完成，无运行时 patch

knowledge_gained:
  - "inotify-tools 4.25.9.0 上游为 Autotools 构建，但 CI 缺 aclocal 链不可用"
  - "conanfile.py 手写极简 Makefile + config.h 直接编译（绕开 autotools）"
  - "fanotify 接口在 OHOS 上不可用，由 conanfile.py 手写 config.h（不定义 HAVE_SYS_FANOTIFY_H）+ fanotify.h shim（bundled fallback）禁用（非 configure 探测、非补丁机制）"
  - "inotifywait 和 inotifywatch 命令行工具提供文件系统监控"
