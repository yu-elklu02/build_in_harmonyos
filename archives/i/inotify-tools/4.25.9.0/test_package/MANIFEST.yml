# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: inotify-tools/4.25.9.0
homepage: https://github.com/inotify-tools/inotify-tools

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件（inotify-tools 仓库 t/ 目录，14 个 .t 测试脚本）
upstream_tests:
  - name: "inotifywait"
    source: inotify-tools-4.25.9.0/t/inotifywait.t
    description: "inotifywait 命令集成测试"
  - name: "inotifywatch"
    source: inotify-tools-4.25.9.0/t/inotifywatch.t
    description: "inotifywatch 命令集成测试"
  - name: "lib-inotifytools"
    source: inotify-tools-4.25.9.0/libinotifytools/src/test.cpp
    description: "libinotifytools API 单元测试"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：inotifywait 监听临时文件 create 事件验证 inotify 内核接口可用性；CI_SKIP_INOTIFY_FUNCTIONAL 环境下降级为 --help 冒烟"
    command: ""

# 测试断言总数 (近似值)
assertion_count: 2
