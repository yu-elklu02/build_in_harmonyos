software: ixwebsocket
display: "IXWebSocket"
description: "Lightweight WebSocket client and server library for C++ with TLS support and very few dependencies (no Boost)"
category: network
homepage: "https://github.com/machinezone/IXWebSocket"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建系统，使用 Conan CMakeToolchain + CMakeDeps 交叉编译"
    - "CMakeLists.txt 使用 CMake 内置模块目标名 (ZLIB::ZLIB, OPENSSL_LIBRARIES)，需补丁改为 Conan 小写目标名 (zlib::zlib, openssl::openssl)"
    - "默认静态编译 (BUILD_SHARED_LIBS=OFF)，符合 R26 系统同名库隔离要求"
    - "USE_WS/USE_TEST 依赖 FetchContent 从网络拉取 spdlog，Conan 配方中禁用以避免构建时网络依赖"
    - "CMake 不识别 HarmonyOS 平台 (System is unknown)，非阻塞警告，不影响编译"
    - "核心功能在 OHOS 平台正常工作：URL 解析、WebSocket 客户端/服务器对象创建、Socket 创建、TLS 配置"
    - "上游 v12.0.1 tag 中 IX_WEBSOCKET_VERSION 宏仍为 11.4.6，属上游问题不影响功能"
  common_dependencies:
    - zlib/1.3.1
    - openssl/3.5.6

versions:
  "12.0.1":
    status: built
    build_date: "2026-07-22"
    notes: "首次适配，CMake 目标名兼容补丁，静态库构建"
