# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ixwebsocket/12.0.1
homepage: "https://github.com/machinezone/IXWebSocket"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# IXWebSocket tests are in test/ directory, built with USE_TEST=ON
# They require spdlog via FetchContent and network access
# For the conan recipe, tests are disabled (USE_TEST=OFF) to avoid network dependencies
upstream_tests:
  - file: test/UrlParserTest.cpp
    source: ixwebsocket-12.0.1/test/UrlParserTest.cpp
    description: "URL parser unit test"
    command: "ctest -R UrlParser"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: IXUrlParser::parse() API + IX_WEBSOCKET_VERSION"
    command: "./test_ixwebsocket"

# 测试断言总数
assertion_count: 4
