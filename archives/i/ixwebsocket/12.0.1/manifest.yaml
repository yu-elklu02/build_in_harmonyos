knowledge_gained:
  - "IXWebSocket CMakeLists.txt uses CMake built-in module targets (ZLIB::ZLIB, OPENSSL_LIBRARIES) which don't match Conan CMakeDeps generated lowercase targets (zlib::zlib, openssl::openssl). A patch is needed to use Conan-compatible target names."
  - "IXWebSocket bundles spdlog via FetchContent when USE_WS or USE_TEST is ON. For the conan recipe, these are disabled to avoid network dependencies during build."
  - "IXWebSocket builds as a static library by default (BUILD_SHARED_LIBS=OFF), suitable for OHOS platform."

