software: irrlicht
version: "1.8.5"
status: draft
build_system: makefile
compile_date: 2026-08-05

source:
  url: "https://sourceforge.net/projects/irrlicht/files/Irrlicht%20SDK/1.8/1.8.5/irrlicht-1.8.5.zip/download"
  sha256: "effb7beed3985099ce2315a959c639b4973aac8210f61e354475a84105944f3d"

dependencies:
  required:
    - zlib/1.3.1.1
    - libpng/1.6.58
    - libjpeg/10
    - bzip2/1.0.8

build_config:
  system: makefile
  targets:
    - sharedlib
    - staticlib
  ohos_mode: "headless/null-device; X11/OpenGL/SDL/FB/D3D/OSX/Windows backends disabled via NO_IRR_COMPILE_WITH_* macros"

patches_applied:
  - "0001-makefile-drop-linux-x11-opengl-link-flags.patch"

test_results:
  type: test_package
  command: "test_irrlicht"
  assertions:
    - "createDevice(video::EDT_NULL) returns a valid IrrlichtDevice"
    - "device->getVideoDriver() is non-null"
    - "video driver type is video::EDT_NULL"
  passed: 0
  failed: 0
  note: "Recipe created; OHOS conan create validation pending."

knowledge_gained:
  - "Irrlicht 1.8.5 upstream uses source/Irrlicht/Makefile with sharedlib/staticlib targets."
  - "The upstream Linux Makefile branch hard-links X11/OpenGL libraries; OHOS validation uses headless/null-device mode and drops desktop link flags."
  - "IrrCompileConfig.h supports NO_IRR_COMPILE_WITH_* compiler definitions, so platform/render backends can be disabled without invasive source edits."
