package: igraph/1.0.0
homepage: "https://igraph.org"

# 上游测试命令（上游用 CMake ctest 套件，非单条命令）
# NB: 本配方 build() 并不调用 ctest — upstream legacy wrapper
# (etc/cmake/run_legacy_test.cmake) 在 OHOS 交叉编译下用空
# CROSSCOMPILING_EMULATOR 执行二进制 → ENOENT 全红。配方绕开 wrapper，
# 由 self.run() 直接 exec 每个 test/example 二进制取真实 exit code
# (0=PASS / 77=SKIP / 非0=FAIL)。详见 conanfile.py _run_upstream_tests()。
upstream_check_command: "ctest --progress --output-on-failure -C Release"

# conanfile.py build() 中启用并运行上游测试
# BUILD_TESTING=ON 让上游 add_subdirectory(tests) 注册 ctest 用例，
# build() 末尾由 _run_upstream_tests() 通过 self.run() 直接执行每个
# 上游 test/example 二进制（绕开 ctest legacy wrapper），非 cmake.test()。
upstream_test_in_build: true
upstream_test_command: "self.run() direct binary execution (see _run_upstream_tests in conanfile.py)"

# 上游 tests/ 目录（igraph 1.0.0 实际存在，非空）
# 上游 tests/CMakeLists.txt 通过 add_legacy_tests/add_examples 注册数百个
# ctest 用例，分三个子目录：
#   tests/unit/      — 单元测试（数百个 *.c 源文件，配 *.out 期望输出）
#   tests/benchmarks/ — 性能基准
#   tests/regression/ — 回归测试
# 之前声明 upstream_tests: [] 属于少报为 0，现如实登记。
upstream_tests:
  - dir: "tests/"
    type: cmake-ctest
    description: "上游 igraph 1.0.0 CTest 套件（tests/CMakeLists.txt 通过 add_legacy_tests/add_examples 注册数百个单元/回归/基准用例，由 ctest 执行）"
    subdirs:
      - "tests/unit/"
      - "tests/benchmarks/"
      - "tests/regression/"
    run_via: "self.run() direct binary execution in conanfile.py build() (see _run_upstream_tests)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 igraph 核心 API（igraph_small/igraph_vcount/igraph_ecount）"
    command: "./test_igraph"

# 测试断言总数（test.c 中 3 个 igraph_small/vcount/ecount 断言）
assertion_count: 3
