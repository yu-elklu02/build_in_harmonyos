software: icu4c
display: "ICU4C"
description: "International Components for Unicode - C/C++ Unicode and globalization library"
category: i18n
homepage: "https://icu.unicode.org/"
license: Unicode-DFS-2016
build_system: autotools

ohos_adaptation:
  key_points:
    - "必须静态编译（--disable-shared --enable-static），stubdata .so 导致 OHOS 动态链接器崩溃"
    - "--with-data-packaging=static 将 ~33MB Unicode 数据嵌入 libicudata.a"
    - "HMDFS 不支持 umask 077 目录写入，需 patch configure umask 077→022"
    - "HMDFS 不支持 make jobserver mkfifo，编译使用 -j1"
    - "14 个补丁全部为平台适配（config.guess/config.sub/autotools 宏/HMDFS umask 修复）"
    - "源码包结构 icu/source/ 需移动 source/ 内容到根目录匹配补丁路径"

versions:
  - version: "77"
    status: built
    build_date: "2026-07-24"
    notes: 静态编译并执行上游测试套件与消费者测试
  - version: "78"
    status: built
    build_date: "2026-07-22"
    notes: 14 个 OHOS 平台适配补丁，静态编译，UMASK 修复，上游测试套件执行
