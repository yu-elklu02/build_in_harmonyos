# 版本级 manifest
# 文件位置: archives/i/icu4c/78/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "78"
software: "icu4c"

# published | built | failed | archived
status: built

build_date: "2026-07-22"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz"
  sha256: "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--with-data-packaging=static"
    - "--disable-layoutex"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Doxyfile.in.patch"
  - "0002-Makefile.in.patch"
  - "0003-configure.ac.patch"
  - "0004-icudefs.mk.patch"
  - "0005-icudefs.mk.in.patch"
  - "0006-.clang-format.patch"
  - "0007-acinclude.m4.patch"
  - "0008-aclocal.m4.patch"
  - "0009-config.guess.patch"
  - "0011-config.sub.patch"
  - "0012-install-sh.patch"
  - "0013-mkinstalldirs.patch"
  - "0014-runConfigureICU.patch"
  - "0015-configure-umask-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ICU 必须静态编译（--disable-shared --enable-static），OHOS 动态链接器对 stubdata .so 崩溃"
  - "--with-data-packaging=static 将 ~33MB Unicode 数据嵌入 libicudata.a，避免运行时数据文件加载"
  - "HMDFS 文件系统不支持 umask 077 创建的目录写入，需将 configure 中 umask 077 改为 022"
  - "HMDFS 不支持 make jobserver mkfifo，编译使用 -j1"
  - "源码包结构 icu/source/ 需将 source/ 内容移到根目录以匹配补丁路径"
  - "Makefile 引用 $(srcdir)/../LICENSE，源码移动后需复制 LICENSE 到父目录"
  - "u_init() 声明在 unicode/uclean.h 而非 unicode/uinit.h"
  - "14 个补丁全部为 OHOS 平台适配（config.guess/config.sub/autotools 宏/umask 修复），无功能性修改"
  - "ICU 编译耗时 12-15 分钟，超出 SKILL 框架 W3 步骤 600s 超时限制"

# ============================================================
# 产物清单
# ============================================================

artifacts:
  - "lib/libicudata.a (33MB) — ICU 数据库"
  - "lib/libicuuc.a (4.6MB) — 通用库"
  - "lib/libicui18n.a (9.4MB) — 国际化库"
  - "lib/libicuio.a (113KB) — I/O 库"
  - "lib/libicutu.a (460KB) — 工具库"
  - "include/unicode/*.h — 头文件 (38+ 个)"
