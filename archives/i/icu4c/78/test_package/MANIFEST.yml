# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: icu4c/78
homepage: https://icu.unicode.org/

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_icu4c.cpp
    description: "ICU C API verification: u_init(), u_getUnicodeVersion(), u_errorName(), u_isalpha()"
    command: "./test_icu4c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
