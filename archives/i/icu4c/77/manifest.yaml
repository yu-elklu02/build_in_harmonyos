software: "icu4c"
version: "77"
status: built
build_date: "2026-07-18"
build_system: autotools

source:
  url: "https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-src.tgz"
  sha256: "588e431f77327c39031ffbb8843c0e3bc122c211374485fa87dc5f3faff24061"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-samples"
    - "--enable-tests"
    - "--disable-extras"
    - "--disable-layout"
    - "--disable-layoutex"
    - "--disable-shared"
    - "--enable-static"
    - "--with-data-packaging=static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-use-readable-umask-for-configure.patch"
  - "patches/0002-use-tmpdir-for-ucptrie-golden-tempfile.patch"

knowledge_gained:
  - "ICU source archives place the build system under the source/ subdirectory."
  - "Static data packaging avoids separate runtime data file handling."
  - "ICU is packaged as a static-only library to avoid colliding with the OpenHarmony system ICU shared libraries."
  - "The OHOS armv8 worker is a native build environment, so build and host both use aarch64-unknown-linux-ohos."
  - "Matching build and host prevents ICU from requiring an external --with-cross-build tool tree."
  - "Running the out-of-tree Autotools build under $HOME/tmp avoids HMDFS temporary-directory permission failures without modifying generated configure files."
  - "On OHOS, the upstream ucptrietest golden-data helper must fall back to the recipe's writable TMPDIR when libc tmpfile() is unavailable."
