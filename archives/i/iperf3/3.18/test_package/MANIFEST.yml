# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: iperf3/3.18
homepage: "https://software.es.net/iperf/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# iperf3 上游使用 t/ 目录下的 shell 脚本测试，需要运行 iperf3 server/client
# 在 Conan 环境中无法启动 server/client，所以使用 --version 冒烟测试
upstream_tests:
  - file: "test_commands.sh"
    source: "iperf-3.18/test_commands.sh"
    description: "上游命令行测试脚本（需要 server/client 环境）"
    command: "./test_commands.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_iperf3.sh
    description: "运行 iperf3 --version 验证二进制可用性"
    command: "./test_iperf3.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
