package: isl25/0.25
homepage: "https://libisl.sourceforge.io/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: isl_test.c
    source: isl-0.25/isl_test.c
    description: "Upstream ISL API validation suite"
    command: "make check"
  - file: codegen_test.sh
    source: isl-0.25/codegen_test.sh
    description: "Code generation regression tests"
    command: "make check"
  - file: pip_test.sh
    source: isl-0.25/pip_test.sh
    description: "PIP scheduling regression tests"
    command: "make check"
  - file: bound_test.sh
    source: isl-0.25/bound_test.sh
    description: "Bound computation regression tests"
    command: "make check"
  - file: isl_test_int.c
    source: isl-0.25/isl_test_int.c
    description: "Integer backend API validation"
    command: "make check"
  - file: flow_test.sh
    source: isl-0.25/flow_test.sh
    description: "Flow analysis regression tests"
    command: "make check"
  - file: schedule_test.sh
    source: isl-0.25/schedule_test.sh
    description: "Schedule generation regression tests"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Allocates an ISL context and validates an integer value through the public API"
    command: "ctest --output-on-failure"

assertion_count: 3
