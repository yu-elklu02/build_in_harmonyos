sources:
  url: "https://libisl.sourceforge.io/isl-0.25.tar.xz"
  sha256: "be7b210647ccadf90a2f0b000fca11a4d40546374a850db67adb32fad4b230d9"

patches:
  - patch_file: "patches/0001-config.sub.patch"
    patch_description: "Recognize the linux-ohos host triplet"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "Report an OHOS-compatible host triplet"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-tmpdir.patch"
    patch_description: "Honor TMPDIR when creating configure scratch files"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-ffs-ohos.patch"
    patch_description: "Expose ffs declaration on OHOS libc during configure"
    patch_type: "portability"
  - patch_file: "patches/0005-configure-status-umask.patch"
    patch_description: "Avoid unwritable config.status temporary directories on OHOS"
    patch_type: "portability"
