package: iir1/1.10.0
homepage: "https://github.com/berndporr/iir1"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.ctest(cli_args=['--output-on-failure'])"

upstream_tests:
  - file: "test/butterworth.cpp"
    source: "iir1-1.10.0/test/butterworth.cpp"
    description: "Butterworth response and stability test"
    command: "ctest -R '^TestButterworth$'"
  - file: "test/chebyshev1.cpp"
    source: "iir1-1.10.0/test/chebyshev1.cpp"
    description: "Chebyshev Type I response test"
    command: "ctest -R '^TestChebyshev1$'"
  - file: "test/chebyshev2.cpp"
    source: "iir1-1.10.0/test/chebyshev2.cpp"
    description: "Chebyshev Type II response test"
    command: "ctest -R '^TestChebyshev2$'"
  - file: "test/rbj.cpp"
    source: "iir1-1.10.0/test/rbj.cpp"
    description: "RBJ response and notch rejection test"
    command: "ctest -R '^TestRBJ$'"
  - file: "test/custom.cpp"
    source: "iir1-1.10.0/test/custom.cpp"
    description: "Custom coefficient cascade test"
    command: "ctest -R '^TestCUSTOM$'"
  - file: "test/badparam.cpp"
    source: "iir1-1.10.0/test/badparam.cpp"
    description: "Invalid filter parameter exception test"
    command: "ctest -R '^TestBadParam$'"
  - file: "test/state.cpp"
    source: "iir1-1.10.0/test/state.cpp"
    description: "Direct-form state management test"
    command: "ctest -R '^TestState$'"
  - file: "test/assignment.cpp"
    source: "iir1-1.10.0/test/assignment.cpp"
    description: "Copy and assignment state isolation test"
    command: "ctest -R '^TestOperator=$'"

test_package_tests:
  - file: test_package.cpp
    description: "46 independent installed-package API commands"
    cases:
      - butterworth-lowpass-2
      - butterworth-lowpass-4
      - butterworth-highpass-2
      - butterworth-highpass-4
      - butterworth-bandpass-2
      - butterworth-bandpass-4
      - butterworth-bandstop-2
      - butterworth-bandstop-4
      - butterworth-lowshelf-2
      - butterworth-lowshelf-4
      - butterworth-highshelf-2
      - butterworth-highshelf-4
      - butterworth-bandshelf-2
      - butterworth-bandshelf-4
      - chebyshev1-lowpass-2
      - chebyshev1-lowpass-4
      - chebyshev1-highpass-2
      - chebyshev1-highpass-4
      - chebyshev1-bandpass-2
      - chebyshev1-bandpass-4
      - chebyshev1-bandstop-2
      - chebyshev1-bandstop-4
      - chebyshev1-lowshelf-2
      - chebyshev1-lowshelf-4
      - chebyshev1-highshelf-2
      - chebyshev1-highshelf-4
      - chebyshev1-bandshelf-2
      - chebyshev1-bandshelf-4
      - chebyshev2-lowpass-2
      - chebyshev2-highpass-2
      - chebyshev2-bandpass-2
      - chebyshev2-bandstop-2
      - chebyshev2-lowshelf-2
      - chebyshev2-highshelf-2
      - chebyshev2-bandshelf-2
      - rbj-lowpass
      - rbj-highpass
      - rbj-bandpass1
      - rbj-bandpass2
      - rbj-bandstop
      - rbj-notch
      - rbj-lowshelf
      - rbj-highshelf
      - rbj-bandshelf
      - rbj-allpass
      - invalid-parameters
    command: "./iir1_consumer <case>"

test_flow_count: 46
assertion_count: 91
