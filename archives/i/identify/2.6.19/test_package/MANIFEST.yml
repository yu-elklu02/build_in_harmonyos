package: identify/2.6.19
homepage: "https://github.com/pre-commit/identify"

# 上游测试命令 — identify 上游使用 pytest
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: identify-2.6.19/tests/
    description: "上游 pytest 测试套件"
    command: "python3 -m pytest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 模块导入 + tags_from_path + tags_from_filename + tags_from_interpreter + ALL_TAGS + file_is_text"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
