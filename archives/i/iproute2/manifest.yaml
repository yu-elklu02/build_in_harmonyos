software: iproute2
display: "iproute2"
description: "Linux 网络配置工具集（ip/tc/bridge/ss 等）"
category: network
homepage: "https://wiki.linuxfoundation.org/networking/iproute2"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "R26 命令行工具静态编译：LDFLAGS=-static"
    - "getpass 补声明 + 静态链接（libc.a 有真实现，libc.so 未导出）——见 E215"
    - "内核 UAPI in6_addr/sockaddr_in6/ipv6_mreq 重定义用 -D__UAPI_DEF_*=0 + 先包含 netinet/in.h——见 E216"
    - "核心 8 工具不依赖 libmnl；tipc/devlink/rdma/dcb 依赖 libmnl（依赖链边界）"
  common_dependencies: []

versions:
  "6.11.0":
    status: built
    build_date: "2026-07-16"
    conan_ref: "iproute2/6.11.0"
