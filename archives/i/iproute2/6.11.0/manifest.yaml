version: "6.11.0"
status: built
build_date: "2026-07-16"
conan_ref: "iproute2/6.11.0"

source:
  url: "https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-6.11.0.tar.xz"
  sha256: "1f795398a04aeaacd06a8f6ace2cfd913c33fa5953ca99daae83bb5c534611c3"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "./configure (iproute2 自带特性探测，生成 config.mk)"
  make_vars:
    - 'SUBDIRS="lib ip tc bridge misc genl"  # 核心工具集；剔除 netem(host 工具) 与 tipc/devlink/rdma/dcb(依赖 libmnl)'
    - 'CCOPTS="-O2 -pipe -include include/ohos_compat.h -Wno-implicit-function-declaration -Wno-int-conversion -D__UAPI_DEF_IN6_ADDR=0 ...(7 项 UAPI guard)"'
    - 'LDFLAGS="-static"  # R26 命令行工具静态链接，同时解析 getpass(E215)'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-musl-compat.patch"

test_results:
  type: manual
  total: 15          # test.c(1) + test.sh(4×版本 -V + 10×netlink 只读查询)
  passed: 1          # 仅 test.c 的 ip -V 接入 ctest，已在 CI build #6566(aarch64, results:0) 执行验证
  pending: 14        # test.sh(4×版本自检 + 10×netlink 查询) 未接入 conan 自动测试流程，需 aarch64 真机手动运行
  failed: 0
  note: "仅 test.c(ip -V) 注册为 ctest 并随 conan create 在 CI 执行；test.sh 为独立验证脚本(CMakeLists/conanfile 未引用)，需 aarch64 真实内核；上游 testsuite 需 root+netns，CI 不可运行"

# R40：iproute2 经 netlink 与内核网络栈交互，属「系统底层：procfs/sysfs/netlink/dl」范畴
adaptation_review:
  rule: R40
  category: "系统底层：netlink"
  completeness: "需人工确认适配完整性"
  runtime_verification:
    build_and_version: "已验证 —— CI build #6566 / aarch64, ip -V 输出 iproute2-6.11.0, results:0"
    netlink_functional: "待人工确认 —— 需在 OHOS aarch64 真机运行 test.sh，验证 ip link/addr/route show、ss -s 等只读 netlink 查询正常往返"
    netlink_write_ops: "待人工确认 —— ip link add/set、ip addr add 等写操作需 root/CAP_NET_ADMIN，应在受控 aarch64 环境单独验证"
    blocker: "两种本地环境均无法完成运行期验证：(1)DevEco PC 模拟器实测 x86_64，无法执行 aarch64 交付物(not executable)；(2)鸿蒙手机真机为 aarch64(内核1.12.0)且二进制推送正常，但消费机 SELinux(enforcing,非root)禁止 sh 域执行 data_local_tmp，ip -V 即 Permission denied、chcon 无权限。功能验证需 root/eng 版 aarch64 设备或官方 aarch64 CI 运行 test_package/test.sh"

knowledge_ref:
  - E215
  - E216

knowledge_gained:
  - "getpass: OHOS libc.so 未导出、静态 libc.a 有真实现(T getpass)，静态链接补声明即可(E215)"
  - "内核 UAPI in6_addr/sockaddr_in6/ipv6_mreq 与 musl netinet/in.h 重定义，-D__UAPI_DEF_*=0 + 先 include <netinet/in.h> 解决(E216)"
  - "核心 8 工具(ip/tc/bridge/ss/lnstat/nstat/rtacct/genl)不依赖 libmnl，完整可适配"
  - "tipc/devlink/rdma/dcb 依赖外部库 libmnl(OHOS sysroot 未含)，属依赖链边界，待 libmnl 先适配"
