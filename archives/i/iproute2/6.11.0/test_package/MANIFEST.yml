# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iproute2/6.11.0
homepage: "https://wiki.linuxfoundation.org/networking/iproute2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 testsuite/ 需要 root + network namespace + veth 等内核网络设施，
# 交叉/无特权的 conan create 环境无法运行，故未集成到 build()。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# iproute2 的测试套件位于 testsuite/ 目录，由 shell 脚本驱动，依赖
# root 权限与 netns/veth；在 OHOS conan 构建环境下不具备运行条件（平台限制）。
upstream_tests:
  - file: testsuite/Makefile
    source: iproute2-6.11.0/testsuite/
    description: "上游功能测试套件（ip/tc 命令行为），需 root + netns，CI 环境不可运行"
    command: "make -C testsuite alltests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "通过 popen() 调用 ip -V 验证版本号输出（R34 合规，检查 iproute2-6.11.0）"
    command: "./test_iproute2"
  - file: test.sh
    description: "版本 -V(ip/tc/bridge/ss) + netlink 只读功能查询(ip link/addr/route/neigh/rule show、bridge link、tc qdisc、ss -s/-tan)，验证与 OHOS 内核 netlink 通信"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# test.c: 1 (版本号匹配)；test.sh: 4 (版本 -V) + 10 (netlink 只读查询)
assertion_count: 15
