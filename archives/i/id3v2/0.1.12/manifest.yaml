software: id3v2
version: "0.1.12"
status: built
build_date: "2026-07-15"
build_system: makefile

source:
  url: "https://downloads.sourceforge.net/project/id3v2/id3v2/0.1.12/id3v2-0.1.12.tar.gz"
  sha256: "8105fad3189dbb0e4cb381862b4fa18744233c3bbe6def6f81ff64f5101722bf"
  tar_format: tar.gz

vendored_sources:
  - name: id3lib
    version: "3.8.3"
    url: "https://downloads.sourceforge.net/project/id3lib/id3lib/3.8.3/id3lib-3.8.3.tar.gz"
    sha256: "2749cc3c0cd7280b299518b1ddf5a5bcfe2d1100614519b68702230e26c7d079"
    reason: "id3lib 未发布到制品仓，作为静态库随 id3v2 一起构建（superbuild）"

build:
  system: makefile
  configure_options:
    - "id3lib: --build/--host=aarch64-unknown-linux-ohos --disable-shared --enable-static --disable-cxx-warnings"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-id3lib-config.guess.patch"
  - "0002-id3lib-config.sub.patch"
  - "0003-id3lib-configure.patch"
  - "0004-id3lib-include-id3-id3lib_bitset.patch"

knowledge_gained:
  - "id3v2 依赖 id3lib，但 id3lib 归档为 stub 未发布；本配方 vendor id3lib 3.8.3 源码静态编译"
  - "hnp clang 默认无 C++ 头搜索路径，id3lib configure 需显式 CXXFLAGS/LDFLAGS=-stdlib=libc++ 与 CXXCPP"
  - "2003 版 config.guess/config.sub 不识 aarch64/HarmonyOS，需补丁且必须传带 vendor 的三元组 aarch64-unknown-linux-ohos"
  - "id3v2 上游 Makefile 链接顺序 -lz -lid3 对静态库错误，改手工编译按 -lid3 -lz 链接"
  - "上游 tarball 含过期 .o 与预编译二进制，构建前需清理"
  - "真实 worker config.status 受 HMDFS umask 077 影响（E011），补丁改 umask 022（保持默认 TMPDIR，不重定向）"
