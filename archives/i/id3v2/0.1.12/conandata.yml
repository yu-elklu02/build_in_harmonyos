# conandata.yml — id3v2 0.1.12
#
# id3v2 is a thin CLI on top of id3lib. id3lib is not published to the
# artifact registry, so this recipe vendors id3lib 3.8.3 (second source,
# extracted to _id3lib/) and builds it statically as part of the id3v2 build.
# All patches below target the vendored id3lib tree (a/_id3lib/... paths).

sources:
  # id3v2 sources → recipe source root
  - url: "https://downloads.sourceforge.net/project/id3v2/id3v2/0.1.12/id3v2-0.1.12.tar.gz"
    sha256: "8105fad3189dbb0e4cb381862b4fa18744233c3bbe6def6f81ff64f5101722bf"
  # vendored id3lib → _id3lib/
  - url: "https://downloads.sourceforge.net/project/id3lib/id3lib/3.8.3/id3lib-3.8.3.tar.gz"
    sha256: "2749cc3c0cd7280b299518b1ddf5a5bcfe2d1100614519b68702230e26c7d079"

patches:
  - patch_file: "patches/0001-id3lib-config.guess.patch"
    patch_description: "0001 id3lib config.guess add HarmonyOS detection"
    patch_type: "portability"
  - patch_file: "patches/0002-id3lib-config.sub.patch"
    patch_description: "0002 id3lib config.sub accept linux-ohos triplet"
    patch_type: "portability"
  - patch_file: "patches/0003-id3lib-configure.patch"
    patch_description: "0003 id3lib configure drop iomanip.h check and fix umask"
    patch_type: "portability"
  - patch_file: "patches/0004-id3lib-include-id3-id3lib_bitset.patch"
    patch_description: "0004 id3lib id3lib_bitset iostream.h to iostream"
    patch_type: "portability"
