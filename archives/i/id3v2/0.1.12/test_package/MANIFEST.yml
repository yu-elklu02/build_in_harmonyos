# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: id3v2/0.1.12
homepage: "https://id3v2.sourceforge.net/"

# id3v2 上游为平 Makefile 工程，无 check 目标，无自带测试套件
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_id3v2.py
    description: "写 ID3 artist 标签到最小 MP3 并读回校验 TPE1 帧"
    command: "id3v2 --artist HarmonyTest sample.mp3 && id3v2 -l sample.mp3"

# 测试断言总数（近似值，用于质量评估）
# 1) --version 正常退出  2) 写 tag 成功  3) 读回包含 artist
assertion_count: 3
