name: iml
description: Integer Matrix Library —— 整数矩阵的精确解法（零空间 / 线性方程组 / 行列式）
category: math
license: GPL-2.0-or-later
website: https://www.cs.uwaterloo.ca/~astorjoh/iml.html
source_url: https://www.cs.uwaterloo.ca/~astorjoh/
build_system: autotools
versions:
  - version: "1.0.5"
    status: built
    build_date: "2026-08-12"
    notes: >-
      linbox / SageMath / passagemath 计算代数栈的依赖。BLAS 走 --with-cblas
      指向 openblas（configure 默认找 ATLAS，直接报 "ATLAS not found!"，
      但它接受任意 CBLAS）；GMP 要用 --with-gmp-include / --with-gmp-lib
      分开的开关，不接受 --with-gmp=<prefix>。
      test_package 做真实计算断言（nullspaceMP 求零空间并验算 A·N==0）。
