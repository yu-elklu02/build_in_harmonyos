# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: i2util/1.2
homepage: "http://software.internet2.edu/sources/I2util/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/sha1test.c
    source: i2util-1.2/test/sha1test.c
    description: "SHA-1 官方测试向量 (FIPS 180-1: abc / 56-byte message / 1,000,000 a's)"
    command: "./sha1test"
  - file: test/hmac-sha1test.c
    source: i2util-1.2/test/hmac-sha1test.c
    description: "HMAC-SHA1 RFC 2202 测试向量 (7 组)"
    command: "./hmac-sha1test"
  - file: test/pbkdf2test.c
    source: i2util-1.2/test/pbkdf2test.c
    description: "PBKDF2 RFC 2898/6070 测试向量 (15 组, 含 1 组 UNCHECKED 无参考值)"
    command: "./pbkdf2test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libI2util 并验证 I2Sha1 官方测试向量"
    command: "./test_i2util"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
