software: ipinfo
# 版本级 manifest
# 文件位置: archives/i/ipinfo/1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://kyberdigi.cz/projects/ipinfo/files/ipinfo-1.2.tar.gz"

  # 源码校验和（从 .tarball-sha256 读取）
  sha256: "19e6659f781a48b56062a5527ff463a29c4dcc37624fab912d1dce037b1ddf2d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 源码包大小
  size_kb: 15

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2"

  # 编译命令
  build_command: "make -j2"

  # 安装命令
  install_command: "make install PREFIX=$DEFAULT_PREFIX DESTDIR=$TEST_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 编译耗时（秒）
  build_time_seconds: 5

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-ipinfo.c.patch"
  - "0003-ipmatch.c.patch"

# 补丁详情
patch_details:
  - file: "0001-Makefile.patch"
    description: "修复 Makefile 硬编码路径，添加 OpenHarmony 支持"
    changes:
      - "CC: /usr/bin/gcc → CC?=clang"
      - "INSTALL: /usr/bin/install → INSTALL?=install"
      - "添加 PREFIX 变量支持（默认 /usr/local）"
      - "添加 DESTDIR 支持（用于打包）"
      - "CFLAGS: 空 → -fPIC -O2"
    type: platform
    guard: none
  - file: "0002-ipinfo.c.patch"
    description: "修复 ipinfo --help 退出码为 0"
    changes:
      - "usage() 函数添加 exit_code 参数"
      - "--help/-h/--usage 调用改为 exit(0)"
      - "无参数调用保持 exit(1)"
    type: portability
    guard: none
  - file: "0003-ipmatch.c.patch"
    description: "修复 ipmatch --help 退出码为 0"
    changes:
      - "usage() 函数添加 exit_code 参数"
      - "--help/--usage 调用改为 exit(0)"
      - "无参数调用保持 exit(1)"
    type: portability
    guard: none

# ============================================================
# 产物信息
# ============================================================

# 预编译包
package:
  file: "ipinfo-1.2-ohos-aarch64.tar.gz"
  size_kb: 100
  contents:
    - "bin/ipinfo"
    - "bin/ipmatch"
    - "man/man1/ipinfo.1"
    - "man/man1/ipmatch.1"

  # ELF 签名状态
  elf_signed: true

  # 安装验证
  verified: true

# ============================================================
# 测试信息
# ============================================================

test:
  # 测试报告路径
  report: "reports/test-report.md"

  # 测试结果
  passed: 6
  failed: 0
  skipped: 0

  # 功能验证
  functional_tests:
    - "CIDR 格式输入"
    - "网掩码格式输入"
    - "A/B/C 类网络计算"
    - "单项输出选项"
    - "IP 范围检查（IN）"
    - "IP 范围检查（OUT）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile 项目无 configure 步骤，直接编译"
  - "Makefile 硬编码路径需改为可配置变量"
  - "DESTDIR 支持需要修改 install 目标"
  - "纯 C 项目，无需 C++ 编译器"

# ============================================================
# 编译过程记录
# ============================================================

# 问题记录
issues:
  - problem: "Makefile 硬编码 /usr/bin/gcc"
    cause: "原始 Makefile 假设 Linux 环境"
    solution: "修改为 CC?=clang，支持环境变量覆盖"
    severity: high

  - problem: "Makefile 硬编码 /usr/bin/install"
    cause: "原始 Makefile 假设 Linux 环境"
    solution: "修改为 INSTALL?=install"
    severity: medium

  - problem: "DESTDIR 不生效"
    cause: "install 目标未使用 DESTDIR"
    solution: "修改 install 目标为 $(DESTDIR)$(BINDIR)"
    severity: high

# 补丁生成信息
patch_generation:
