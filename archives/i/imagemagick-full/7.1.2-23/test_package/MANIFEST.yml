# test_package/MANIFEST.yml
package: imagemagick-full/7.1.2-23
homepage: "https://imagemagick.org"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: tests/validate.c
    source: imagemagick-full-7.1.2-23/tests/validate.c
    description: "ImageMagick validation suite"
    command: "./utilities/magick validate tests/validate.c"
test_package_tests:
  - file: test.c
    description: "MagickWand API test - creates a 1x1 image and queries version"
    command: "./test_imagemagick_full"
assertion_count: 5
