software: imagemagick-full
version: "7.1.2-23"
status: built
build_date: "2026-08-07"
build_system: autotools
source:
  url: "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-23.tar.gz"
  sha256: "f129f7d87fc21da453d032dd291b80ea13faf2497f13ef8279d97759ed7d5c46"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--with-jpeg"
    - "--with-png"
    - "--with-tiff"
    - "--with-freetype"
    - "--with-fontconfig"
    - "--with-openjp2"
    - "--with-webp"
    - "--with-xml"
    - "--without-heic"
    - "--disable-openmp"
  dependencies:
    - libjpeg-turbo/3.2.0
    - libpng/1.6.58
    - libtiff/4.7.2
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - openjpeg/2.5.4
    - libwebp/1.6.0
    - libxml2/2.15.3.1
    - lcms2/2.19
    - xz/5.6.2
    - bzip2/1.0.8
    - zstd/1.5.7
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++
patches_applied:
  - "0003-config-config.guess.patch"
  - "0004-config-config.sub.patch"
  - "0006-configure.patch"
knowledge_gained:
  - "HMDFS上config.status创建临时目录需将umask 077改为022"
  - "autotools项目需添加__OHOS__/ohos-linux triplet检测"
  - "OHOS上LD_LIBRARY_PATH设置Conan依赖库路径会导致lld链接器冲突，使用RPATH代替"
  - "Conan包xz提供xz.pc而非liblzma.pc，openjpeg提供openjpeg.pc而非libopenjp2.pc"
  - "zlib在OHOS SDK sysroot中，非Conan包，需手动创建zlib.pc"
  - "2026-08-07：webp和xml依赖已发布，启用--with-webp和--with-xml"
