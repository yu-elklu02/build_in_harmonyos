# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: imagemagick/7.1.2.29
homepage: "https://imagemagick.org"

# 上游测试命令
upstream_check_command: "make check"

# 上游 make check 超时（ImageMagick 测试套件较大，5min 超时）
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: utilities/magick.c
    source: ImageMagick-7.1.2-29/utilities/magick.c
    description: "magick command-line tool (identify/convert/etc)"
    command: "./utilities/magick --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_imagemagick.c
    description: "Verify MagickWand can create and query image dimensions"
    command: "./test_imagemagick"

# 测试断言总数
assertion_count: 3
