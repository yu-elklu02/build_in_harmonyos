# test_package/MANIFEST.yml
package: wireguard-tools/1.0.20250521
homepage: "https://www.wireguard.com/"

upstream_check_command: "make -C src check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test.c
    source: contrib/embeddable-wg-library/test.c
    description: "Embeddable library self-test (not part of main build)"
    command: "cd contrib/embeddable-wg-library && make && ./test"

test_package_tests:
  - file: test.sh
    description: "Smoke test: wg --version"
    command: "./test.sh"

assertion_count: 1
