version: "2.4"
software: "wego"
status: built
build_date: "2026-08-04"
build_system: "go"

source:
  url: "https://github.com/schachmat/wego/archive/refs/tags/2.4.tar.gz"
  sha256: "5ae1c76a322ff2e295034a801755c42b0cb6bdef5ab205af42cf95dbf7c570f4"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS pre-adaptation strategy)"
    - "GOARCH=<target arch>"
    - "GOTOOLCHAIN=local"
    - "Go 1.24.0 SDK auto-bootstrap when GO/GOROOT/PATH lacks a usable Go"
  dependencies: []
  tool_dependencies:
    - "go >= 1.24 (auto-downloaded from golang.google.cn with dl.google.com fallback when missing)"
    - "binary-sign-tool"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "wego 2.4 is a Go module CLI; command entry is ./main.go (root package github.com/schachmat/wego)."
  - "Go linker requires /data/storage/el2 tmpfs workspace on HarmonyOS to avoid HMDFS mmap permission denied."
  - "OHOS Go executables must be self-signed with binary-sign-tool before package/test execution."
  - "wego upstream 2.4 ships no *_test.go files; TestXxx/BenchmarkXxx/ExampleXxx all 0; CI runs 'go test -v ./...' but every package prints [no test files]."
  - "CGO_ENABLED=0 static build succeeds; wego -h exits 0 on signed OHOS arm64 binary."
  - "Available backends: caiyunapp.com, json, openmeteo, openweathermap, smhi, weatherapi, worldweatheronline."
  - "Available frontends: ascii-art-table, emoji, json, markdown."
