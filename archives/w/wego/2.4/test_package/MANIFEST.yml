package: wego/2.4
homepage: https://github.com/schachmat/wego

# wego 2.4 upstream ships no *_test.go files; TestXxx/BenchmarkXxx/ExampleXxx
# all count 0. CI runs `go test -v ./...` but every package prints
# `[no test files]`. Therefore upstream_tests is empty (0 real tests).
upstream_test_in_build: false
upstream_tests: []

# Consumer test: run packaged `wego -h` and assert exit 0 + stable keywords.
test_package_tests:
  - file: test.sh
    description: "Run wego -h against the packaged binary; assert exit 0 and stable backend/frontend keywords"
    command: "bash test.sh <bin/wego>"

# Assertions in test.sh:
#   1. exit code of `wego -h` is 0
#   2. stdout contains "openweathermap"
#   3. stdout contains "weatherapi"
#   4. stdout contains "ascii-art-table"
#   5. stdout contains "markdown"
#   6. stdout contains "Available backends:"
assertion_count: 6
