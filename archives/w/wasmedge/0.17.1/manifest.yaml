software: wasmedge
version: "0.17.1"
status: built
build_system: cmake
build_date: "2026-07-16"

source:
  url: "https://github.com/WasmEdge/WasmEdge/archive/refs/tags/0.17.1.tar.gz"
  sha256: "b2da5bc43a6e11305ddffc7afa1d67c647fd49e34d334fc810ff63783fb52a25"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - WASMEDGE_USE_LLVM=OFF
    - WASMEDGE_BUILD_PLUGINS=OFF
    - WASMEDGE_BUILD_TESTS=ON
    - WASMEDGE_BUILD_EXAMPLES=OFF
    - WASMEDGE_BUILD_TOOLS=OFF
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fallback-o-symlink-on-ohos.patch"
  - "0002-use-find-for-static-archive-objects.patch"
  - "0003-use-standard-time-t-in-wasi-test.patch"
knowledge_gained:
  - "WasmEdge core runtime can be built without LLVM/AOT, plugins, tools, and examples while still enabling upstream test targets."
  - "GTest v1.15.2 must be provided through conandata.yml and FETCHCONTENT_SOURCE_DIR_GTEST because upstream test/CMakeLists.txt otherwise tries to clone googletest during configure."
  - "The upstream WASI linuxTest.cpp used glibc-private __time_t; replacing it with standard time_t keeps the test portable on the OHOS libc."
  - "R38 commands.json is not required for this library package; package_info no longer declares bindirs, avoiding static CLI-tool misclassification."

test_results:
  type: ctest
  upstream_subset_total: 10
  package_total: 6
  failed: 0
  pass_rate: "OpenDesk validates 10 upstream portable CTest targets plus 6 package runtime checks when target execution is available."
  note: "Upstream CTest subset covers expected/span/po helpers, common, loader file manager, validator regression, executor regression, thread, memory instance, and host mock tests. Full unfiltered upstream CTest was probed separately; host/WASI/socket and several runtime targets are excluded because they fail, timeout, or segfault on the reduced OHOS package profile."
knowledge_ref: []
