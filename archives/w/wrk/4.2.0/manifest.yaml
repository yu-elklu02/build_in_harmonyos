build:
  cc: clang
  configure_options: []
  cxx: clang++
  dependencies: []
  system: makefile
build_date: '2026-07-15'
build_system: makefile
knowledge_gained:
- Add HarmonyOS platform support in Makefile (TARGET=harmonyos with POSIX C source
  definitions)
- Add signal.h header to src/wrk.h for struct sigaction support
- LuaJIT needs CC=clang TARGET_SYS=Linux XCFLAGS+=-DLUAJIT_DISABLE_PROFILE to build
  on HarmonyOS
- 'LuaJIT lib_io.c needs #include <unistd.h> for popen/pclose on musl libc'
- OpenSSL Configure needs linux-aarch64 target and env -u CFLAGS to avoid inheriting
  parent CFLAGS
- ELF binaries need binary-sign-tool signing (remove .codesign first, then sign, then
  chmod) to execute on HarmonyOS
- wrk is a command-line tool (package_type=application), not a library
patch_classification:
- file: 0001-Makefile.patch
