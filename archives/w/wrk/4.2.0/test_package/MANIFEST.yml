# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wrk/4.2.0
homepage: "https://github.com/wg/wrk"

# 上游测试命令 (wrk没有标准测试套件)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (wrk是工具，无单元测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "wrk --version smoke test"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
