# wolfssl 4.6.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "4.6.0"
software: wolfssl
status: built
build_date: "2026-08-10"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/wolfSSL/wolfssl/archive/refs/tags/v4.6.0-stable.tar.gz"
  sha256: "053aefbb02d0b06b27c5e2df6875b4b587318755b7db9d6aa8d72206b310a848"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - knowledge_ref: E011
    description: "HMDFS umask 077 导致 config.status 创建临时目录权限问题，需将 configure 和 config.status 中 umask 077 改为 umask 022"
  - knowledge_ref: E010
    description: "toybox sh 不兼容 libtool 生成的脚本语法，需使用 CONFIG_SHELL=bash（由 Conan profile buildenv 处理）"
  - knowledge_ref: E004
    description: "OHOS SDK lld 需要 LD_LIBRARY_PATH 包含 SDK 的 llvm/lib 目录以加载 libxml2.so.16"
