# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wxWidgets/3.2.6
homepage: https://www.wxwidgets.org/

# 上游测试命令 (wxWidgets 使用 CMake, 测试在 test/ 目录下)
upstream_check_command: "cmake --build . --target test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
# 说明: wxWidgets 上游测试需要 GUI 支持 (wxUSE_GUI=ON),
# 当前 OHOS 适配仅编译非 GUI 基础库, 故跳过上游测试套件

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "wxString 构造/大小写/数值转换/UTF-8 往返/版本号/wxMutex API 验证"
    command: "./test_wxwidgets"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
