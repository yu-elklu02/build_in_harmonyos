software: wxWidgets
version: 3.2.6
status: built
build_date: "2026-05-20"

source:
  url: "https://github.com/wxWidgets/wxWidgets"
  tag: v3.2.6
  method: git
  archive_sha256: "46372b2dbf976521e1d7cca22afc3d3542d171a488b391444cf89aba87ea7d16"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DwxBUILD_SHARED=OFF"
    - "-DwxBUILD_TESTS=OFF"
    - "-DwxUSE_GUI=OFF"
    - "-DwxUSE_XLOCALE=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    # Compiler paths set via Conan conf (R33), not hardcoded

patches_applied:
  - 0001-harmonyos-socket-fix.patch

conan_recipe:
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package:
    exists: true
    files:
      - conanfile.py
      - CMakeLists.txt
      - test.cpp
      - MANIFEST.yml
  package_type: library
  build_type: static  # R26: system same-name library

artifacts:
  packaging:
    - wxWidgets-3.2.6-ohos-aarch64.tar.gz
  patches:
    - 0001-harmonyos-socket-fix.patch

quality_gates:
  G0_recipe_integrity: PASS
  G1_binary_integrity: PASS
  G2_functional: PASS
  G3_portability: PASS
  G4_archive: PASS
  L0a_test_package_dir: PASS
  L0b_conanfile_exists: PASS
  L0c_test_source_exists: PASS
  L0d_MANIFEST_exists: PASS
  L0e_test_uses_api: PASS  # R34: test.cpp calls wxString/wxVersion/wxThread API

libraries:
  - name: libwx_baseu-3.2.a
    type: static
    conan_lib_name: wx_baseu-3.2
    size: "5.4MB"
    description: "wxWidgets 核心基础库（字符串、数据结构、线程、文件系统等）"
  - name: libwx_baseu_net-3.2.a
    type: static
    conan_lib_name: wx_baseu_net-3.2
    size: "648KB"
    description: "网络库（socket、TCP/IP、HTTP/FTP 协议）"
  - name: libwxregexu-3.2.a
    type: static
    conan_lib_name: wxregexu-3.2
    size: "372KB"
    description: "正则表达式库（PCRE 引擎）"
  - name: libwxzlib-3.2.a
    type: static
    conan_lib_name: wxzlib-3.2
    size: "126KB"
    description: "zlib 压缩库（内置）"

knowledge_gained:
  - category: platform
    content: "HarmonyOS 使用 musl libc，不支持 glibc 扩展函数如 gethostbyname_r"
  - category: build_system
    content: "autotools 在 HarmonyOS 上失败，必须使用 CMake"
  - category: type
    content: "socklen_t 在 HarmonyOS 上是 unsigned int，而非 int"
  - category: conan_recipe
    content: "R26: wxWidgets 是系统同名库，必须静态编译 BUILD_SHARED_LIBS=OFF"
  - category: conan_recipe
    content: "R32: settings.os 判断用 in (\"Linux\", \"OHOS\") 而非 == \"Linux\""
  - category: conan_recipe
    content: "R33: 编译器路径从 Conan conf 获取，禁止使用裸 ${CC} shell 变量"
