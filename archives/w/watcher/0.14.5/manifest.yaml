software: watcher
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.14.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.14.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/e-dant/watcher/archive/refs/tags/0.14.5.tar.gz"

  # 源码校验和
  sha256: "190bbe5e19923083db2beb3aa68f4e99a563c8f685d8037b0536780b0116c4d3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-include-wtr-watcher.hpp.patch"
  - "0002-CMakeLists.txt.patch"
  - "0003-devel-fanotify-constants.patch"
  - "0004-linux-drain-events-before-close.patch"
  - "0005-tool-test-rename-timeout.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS sys/fanotify.h 缺少 Linux 5.9+ 常量 (FAN_REPORT_DIR_FID, FAN_REPORT_NAME, FAN_EVENT_INFO_TYPE_DFID_NAME), 使用 #ifndef 保护定义可兼容编译"
  - "watcher 运行时自动 fallback 到 inotify (fanotify_init 失败时), 无需修改适配器选择逻辑"
  - "LINUX_VERSION_CODE 在 HarmonyOS 为 330240 (5.13.0), 但实际内核为 HongMeng Kernel 1.12.0, fanotify 新特性不可用"
  - "MSVC/Ninja 同时生成 watcher-c shared/static 时 import library 名称同为 watcher-c.lib，需按 BUILD_SHARED_LIBS 二选一避免 multiple rules generate watcher-c.lib"
  - "Conan 2 在 Windows profile 下直接比较 self.settings.os 与 OHOS 会触发 settings 校验，package_info 中改用 str(self.settings.os) 做跨平台判断"
  - "本机 MinGW GCC 8.1.0 win32-thread 工具链不能可靠编译 watcher 所需的 std::filesystem/std::future/std::thread，Windows 本地验证采用 MSVC 19.43"
  - "上游测试目标使用 devel/include/detail/.../fanotify/watch.hpp，而非发布用 single-header；OHOS fanotify 常量补丁需同时覆盖 devel header"

conan_validation:
  windows_msvc:
    date: "2026-07-25"
    profile: "H:/OpenHarmonyOsCompetition/.tools/profiles/win-msvc"
    command: "conan create archives/w/watcher/0.14.5 --profile:host H:/OpenHarmonyOsCompetition/.tools/profiles/win-msvc --profile:build H:/OpenHarmonyOsCompetition/.tools/profiles/win-msvc --build=missing"
    result: PASS
    evidence:
      - "watcher-c-static, wtr.watcher.exe, tw.exe built with MSVC 19.43.34809 and Ninja"
      - "package contains include/wtr/watcher.hpp, include/wtr/watcher-c.h, lib/watcher-c.lib, bin/wtr.watcher.exe, bin/tw.exe, pkg-config files"
      - "test_package CTest: 1/1 passed (test_watcher)"
      - "wtr.watcher.exe --version prints 0.14.5"
  windows_mingw:
    date: "2026-07-25"
    profile: "H:/OpenHarmonyOsCompetition/.tools/profiles/win-mingw"
    result: BLOCKED_TOOLCHAIN
    evidence:
      - "E:/mingw64/bin/g++.exe is GCC 8.1.0 with win32 thread model"
      - "compiler probe and Conan build fail in C++17 filesystem/future/thread support before recipe-specific validation"

