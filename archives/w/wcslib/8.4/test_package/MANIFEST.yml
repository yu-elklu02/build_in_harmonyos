# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wcslib/8.4
homepage: "https://www.atnf.csiro.au/people/mcalabre/WCS/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (来自 C/test/ 目录)
upstream_tests:
  - file: tfitshdr.c
    source: wcslib-8.4/C/test/tfitshdr.c
    description: "FITS image header parser test"
    command: "./tfitshdr"
  - file: tunits.c
    source: wcslib-8.4/C/test/tunits.c
    description: "FITS unit specification parser test"
    command: "./tunits"
  - file: twcsfix.c
    source: wcslib-8.4/C/test/twcsfix.c
    description: "WCSLIB translator for non-standard usage test"
    command: "./twcsfix"
  - file: twcscompare.c
    source: wcslib-8.4/C/test/twcscompare.c
    description: "WCSLIB comparison routine test"
    command: "./twcscompare"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "WCSLIB prj TAN projection round-trip closure test"
    command: "./test_wcslib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
