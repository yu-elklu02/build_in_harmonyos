software: wavpack
display: "WavPack"
description: "Hybrid lossless/lossy audio compression codec"
category: compress
homepage: "https://www.wavpack.com/"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "5.7.0 使用 autotools，需修补 config.guess/config.sub 添加 HarmonyOS 平台识别"
    - "5.8.1 和 5.9.0 使用 CMake，无需 config.guess/config.sub 补丁"
    - "5.9.0 使用 libdeflate 模式 (自发现 ohos.toolchain.cmake + 裸 cmake)，禁用命令行工具消除 iconv 依赖"
  common_dependencies: []

versions:
  "5.7.0":
    status: published
    build_date: "2026-04-22"
  "5.8.1":
    status: published
    build_date: "2026-04-24"
  "5.9.0":
    status: built
    build_date: "2026-07-17"
