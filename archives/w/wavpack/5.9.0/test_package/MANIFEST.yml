# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: wavpack/5.9.0
homepage: https://www.wavpack.com/

# build() 为裸 cmake,只编库,未集成上游测试套件 (BUILD_TESTING=OFF,交叉编译无法运行)
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试(消费者视角,链接 libwavpack 真实调用公开 C API)
test_package_tests:
  - file: test_wavpack.c
    description: "WavPack 编码→解码 roundtrip: 获取版本 → 创建 WavPack 文件(100采样/44100Hz/mono/16bit) → 读回验证数据一致"
    command: "ctest test_wavpack"

# 测试断言总数 (近似值)
assertion_count: 12
