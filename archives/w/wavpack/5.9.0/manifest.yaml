software: wavpack
version: "5.9.0"
build_system: cmake
status: built
build_date: "2026-07-17"

source:
  url: "https://github.com/dbry/WavPack/releases/download/5.9.0/wavpack-5.9.0.tar.xz"
  sha256: "b5291bc4e6d69ebbd3da3800c5bf4a70f19bb92679b23e09b3b612c1e648d1ff"
  tar_format: tar.xz

build:
  system: cmake
  toolchain: "自发现 ohos.toolchain.cmake + 裸 cmake (同 libdeflate 模式)"
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DWAVPACK_BUILD_PROGRAMS=OFF"
    - "-DWAVPACK_ENABLE_THREADS=ON"
    - "-DWAVPACK_ENABLE_DSD=ON"
    - "-DWAVPACK_INSTALL_CMAKE_MODULE=ON"
    - "-DWAVPACK_INSTALL_PKGCONFIG_MODULE=ON"
    - "-DWAVPACK_INSTALL_DOCS=OFF"
    - "-DBUILD_TESTING=ON"
  dependencies: []
  cc: clang
  sign_so: true

patches_applied: []

knowledge_gained:
  - "WavPack 5.9.0 同时支持 CMake 和 autotools,选用 CMake 避免 config.guess/config.sub 补丁"
  - "WAVPACK_BUILD_PROGRAMS=OFF 禁用命令行工具构建,消除 iconv 依赖"
  - "aarch64 无汇编优化代码(x86/x64/ARM32 only),WAVPACK_ENABLE_ASM 自动 OFF"
  - "共享库 libwavpack.so 需 _sign_shared_libs() 重签 (同 libdeflate)"
