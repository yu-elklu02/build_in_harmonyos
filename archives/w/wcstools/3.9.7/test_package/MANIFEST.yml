# test_package/MANIFEST.yml — wcstools 3.9.7
package: wcstools/3.9.7
homepage: "http://tdc-www.harvard.edu/wcstools/"

# 上游测试入口核验：
# - 顶层 Makefile 只有 `all` 构建目标，没有 `check`/`test` 目标
# - 没有 test/ 或 tests/ 目录
# - wcstools.test 是 FITS 样本数据文件（非可执行测试）
# - testhtml 是 HTML 样本数据文件（非可执行测试）
# - testrot.c 是辅助源码（未挂到 Makefile all/check/test 目标）
# - 上游无自动化测试入口，总计 0/0（N/A）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.py
    description: "运行时 smoke：执行 imhead 和 gethead（无参），断言输出包含命令名，记录真实退出码；artifact 验证全部 51 个命令 + wcstools 脚本"
    command: "python3 test.py"
    runtime_smoke:
      - cmd: imhead (no-arg)
        expected: output contains IMHEAD
      - cmd: gethead (no-arg)
        expected: output contains GETHEAD

# 测试断言总数（运行时 2 个断言 + artifact 52 个文件检查）
assertion_count: 54
