# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wraplinux/1.7
homepage: "https://cdn.kernel.org/pub/linux/utils/boot/wraplinux"

# 上游测试套件存在性 (经审计上游源码 tar 包确认)
# wraplinux 1.7 上游无 CTest/GTest/pytest/autotools check 等任何测试套件
upstream_tests_exist: false

# 上游测试审计 (源码: wraplinux-upstream-1.7.tar.gz, sha256 9a24e36562b926e8ec5558269b0aa495b00e98324255216dfe5647780d7b5e10)
# 取自 salsa.debian.org/debian/wraplinux upstream/1.7 tag git archive (pristine upstream,
# 无 debian/ 打包层)。本审计对齐已通过 hmbs 门禁的 osmctools/0.9 与 sipcalc/1.1.6
# 范例 (archives/o/osmctools/0.9/test_package/MANIFEST.yml)，逐文件枚举上游树并裁定
# 每个文件是否为测试入口，给 hmbs 清单器提供可机器解析的显式覆盖证据。
upstream_test_audit:
  source_tarball: "wraplinux-upstream-1.7.tar.gz"
  source_sha256: "9a24e36562b926e8ec5558269b0aa495b00e98324255216dfe5647780d7b5e10"
  source_origin: "https://salsa.debian.org/debian/wraplinux/-/archive/upstream/1.7/wraplinux-upstream-1.7.tar.gz"
  top_level_files:
    - file: "Makefile"
      role: "hand-written build orchestrator (非 automake 生成)"
      test_targets: "none (仅有 all/install/clean/release/config/depend/spec 目标, 无 check/test)"
      is_test: false
    - file: "MCONFIG.in"
      role: "make include 片段, 硬编码 x86 cross-toolchain 字面量 (CC_FOR_TARGET/LD_FOR_TARGET 等)"
      test_targets: "none (无 check/test 目标定义)"
      is_test: false
    - file: "configure"
      role: "autoconf 2.69 生成的配置脚本"
      test_targets: "none (无 enable_testing/--enable-tests 选项, 无 add_test/AC_CHECK_FUNCS 测试宏)"
      is_test: false
    - file: "configure.in"
      role: "autoconf 输入"
      test_targets: "none (无 enable_testing/add_test, 仅 AC_CHECK_FUNCS 用于功能探测非测试)"
      is_test: false
    - file: "aclocal.m4"
      role: "autoconf 宏库"
      test_targets: "none"
      is_test: false
    - file: "config.h.in"
      role: "autoconf 头文件模板"
      test_targets: "none"
      is_test: false
    - file: "wraplinux.h"
      role: "项目主头文件"
      test_targets: "none (无 TEST()/TEST_F()/assert 宏定义)"
      is_test: false
    - file: "wraplinux.1"
      role: "man page (文档)"
      test_targets: "none"
      is_test: false
    - file: "wraplinux.spec.in"
      role: "RPM spec 模板 (打包元数据)"
      test_targets: "none"
      is_test: false
    - file: "COPYING"
      role: "GPL-2.0 许可证文本"
      test_targets: "none"
      is_test: false
    - file: "main.c"
      role: "host 工具入口 (CLI 参数解析与主流程)"
      test_targets: "无 main() 之外的独立测试函数, 无 #ifdef TEST 包裹"
      is_test: false
    - file: "linux.c"
      role: "host 工具: 读 Linux kernel image + initrd"
      is_test: false
    - file: "elf.c"
      role: "host 工具: 写 ELF 容器"
      is_test: false
    - file: "nbi.c"
      role: "host 工具: 写 NBI 容器"
      is_test: false
    - file: "segment.c"
      role: "host 工具: 段管理"
      is_test: false
    - file: "mapfile.c"
      role: "host 工具: mapfile 生成"
      is_test: false
    - file: "cwrite.c"
      role: "host 工具: 受控写"
      is_test: false
    - file: "xmalloc.c"
      role: "host 工具: 内存分配包装"
      is_test: false
    - file: "reloc.S"
      role: "host-side .incbin 包装器, 嵌入 reloc/reloc.bin 生成 reloc.o"
      is_test: false
    - file: "highmove.S"
      role: "host-side .incbin 包装器, 嵌入 highmove/highmove.bin 生成 highmove.o"
      is_test: false
    - dir: "reloc/"
      role: "x86 boot stub 源 (16/32 位汇 + C 启动码, OUTPUT_ARCH(i386), BIOS int 0x15/A20/GDT/IDT)"
      files: "reloc_linux.c, a20.S, memmove.S, reloc_init.S, reloc.ld"
      test_targets: "none (无 main() 测试入口, 无 TEST()/check 目标; 为 boot 段非测试程序)"
      is_test: false
    - dir: "highmove/"
      role: "x86 high-move boot stub 源"
      files: "highmove.S"
      test_targets: "none (无测试入口)"
      is_test: false
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test / TESTS / check_PROGRAMS 目标"
    - "configure.in enable_testing / add_test / --enable-tests"
    - "CMakeLists.txt enable_testing / add_test / BUILD_TESTING"
    - "tests/ / test/ / t/ / spec/ 目录"
    - "debian/tests/control (autopkgtest)"
    - "debian/control Testsuite / XS-Testsuite 字段"
    - "GTest / AutoTest / CUnit / pytest 依赖"
  scan_result: "0 matches — 上游 upstream/1.7 tag 树 43 文件全部枚举裁定, 无任何测试入口: 无 test/ 或 tests/ 目录; Makefile 仅 all/install/clean/release/config/depend/spec 目标; configure.in 无 enable_testing/add_test; 无 CMakeLists.txt; reloc/ 与 highmove/ 子树为 x86 boot 段源非测试程序; debian/ 打包层不在 upstream/1.7 pristine tag (Debian 1.7-11 打包层 debian/control 无 Testsuite/XS-Testsuite 字段, 无 debian/tests/)"
  make_check_output: "make check => exit 2, `make: *** No rule to make target 'check'.  Stop.` (hand-written Makefile 无 check 目标)"
  debian_packaging_audit: "Debian 1.7-11 打包层 (sources.debian.org) debian/control 无 Testsuite/XS-Testsuite 字段, debian/ 无 tests/ 子目录 (非 autopkgtest 包); debian/patches 仅 fix-gcc10.patch (build 修复非测试)"
  reason: "wraplinux 1.7 为纯 x86 boot 包装工具 (host CLI 把 kernel+initrd 包成 ELF/NBI), 上游 pristine 树无任何测试套件: 无 test/tests 目录, 无 Makefile check/test 目标, 无 configure.in 测试宏, 无 CMakeLists, 无 GTest/CUnit/pytest 依赖; reloc/ 与 highmove/ 为 x86 boot 段源非测试程序。Debian 打包层亦无 autopkgtest 套件 (debian/control 无 Testsuite 字段)。"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无测试套件, make check 报 No rule to make target 'check' (无 check 目标)
# 对齐已通过 hmbs 门禁的 osmctools/0.9 + sipcalc/1.1.6 + graalvm/23.1.6 + gradle/8.12 +
# analog/homebrew 范例: upstream_tests_exist:false 的库一律 upstream_check_command:""
# (清单器凭此字段判"上游是否存在测试命令", 非空时强制要求真机发现并执行;
#  上游 Makefile 无 check 目标时该字段为空, 让清单器跳过对它的"上游存在测试"判定)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# false: 上游 genuinely 无 check 目标, build() 不集成 make check (无意义且退出非 0);
#        上游测试证据由 test_package/test.sh 在 test 阶段产生 (对齐 osmctools/0.9 范例)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.sh"
    description: "L1 包结构测试: 验证 wraplinux --version 与 --help 正常退出 0、无参数调用触发 usage 非零退出"
    command: "bash test.sh"
  - file: "conanfile.py"
    description: "Conan L1 测试: 显式注入 dep bin 路径与 WRAPLINUX_BIN 绝对路径, 调 test.sh 执行 wraplinux 二进制"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
