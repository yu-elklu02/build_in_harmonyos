# conandata.yml — wraplinux 1.7
# Upstream homepage: https://cdn.kernel.org/pub/linux/utils/boot/wraplinux
# The kernel.org archive directory currently serves no tarball (404 on
# wraplinux_1.7.orig.tar.{gz,xz}). The authoritative VCS mirror is the Debian
# source repository on salsa.debian.org (Debian QA Group maintainer); its
# upstream/1.7 tag archives the pristine upstream 1.7 tree (no debian/ packaging).

sources:
  url: "https://salsa.debian.org/debian/wraplinux/-/archive/upstream/1.7/wraplinux-upstream-1.7.tar.gz"
  sha256: "9a24e36562b926e8ec5558269b0aa495b00e98324255216dfe5647780d7b5e10"

# patches must be a LIST of entries each carrying patch_file (Conan 2.30
# apply_conandata_patches(): a dict here is read as a {version: [entries]}
# mapping and looked up by conanfile.version; without a "1.7" key every
# patch is silently skipped — the upstream source then builds unpatched
# and fails at link time with `duplicate symbol: opt` (fix-gcc10 not applied).
patches:
  - patch_file: "patches/001-fix-gcc10.patch"
    patch_type: "bugfix"
    patch_source: "https://salsa.debian.org/debian/wraplinux/-/blob/debian/1.7-11/debian/patches/fix-gcc10.patch"
    patch_description: "Fix FTBFS with GCC-10+: extern opt global storage"
