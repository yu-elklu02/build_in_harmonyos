package: words-gb/2.1
homepage: "http://wordlist.aspell.net/"

upstream_check_command: "none (the upstream dictionary release has no test target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "No upstream test program or test target is shipped"
  total: 0

test_package_tests:
  - file: test_words_gb.cpp
    scenario: normal
    description: "Parse the installed list; verify count, ordering, uniqueness, and British spellings"
    command: "./test_words_gb <path-to-words-gb>"
  - file: test_words_gb.cpp
    scenario: fault-injection
    description: "Verify that a missing word-list path is rejected"
    command: "./test_words_gb --expect-missing <missing-path>"

assertion_count: 8
