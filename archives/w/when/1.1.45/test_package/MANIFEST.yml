package: when/1.1.45
homepage: "http://www.lightandmatter.com/when/when.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: when-1.1.45/Makefile
    description: "Perl expression tests (44 cases) + accent filtering test"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify when --version output"
    command: "when --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 45
