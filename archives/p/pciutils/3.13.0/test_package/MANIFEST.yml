# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pciutils/3.13.0
homepage: "https://mj.ucw.cz/sw/pciutils/"

upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: example.c
    source: pciutils-3.13.0/example.c
    description: "Upstream example program that lists PCI devices using libpci"
    command: "./example"

test_package_tests:
  - file: test.c
    description: "Consumer test: verify pci_alloc/pci_cleanup API and library version"
    command: "./test_pciutils"

assertion_count: 3
