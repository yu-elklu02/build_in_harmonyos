package: petsc/3.25.3
homepage: "https://petsc.org/"

upstream_check_command: "make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: src/vec/vec/tutorials/ex1.c
    source: petsc-3.25.3/src/vec/vec/tutorials/ex1.c
    description: "PETSc upstream vector tutorial smoke test representative"
    command: "make PETSC_DIR=$PETSC_DIR PETSC_ARCH=$PETSC_ARCH check"

test_package_tests:
  - file: test.c
    description: "Creates a PETSc sequential vector, sets values, computes VecNorm, and checks the result"
    command: "./test_petsc"

assertion_count: 1
