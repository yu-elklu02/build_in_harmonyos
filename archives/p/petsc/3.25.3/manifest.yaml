version: "3.25.3"
software: "petsc"
status: built
build_date: "2026-07-17"
build_system: custom

source:
  url: "https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-3.25.3.tar.gz"
  sha256: "95ce60df2c7f9c5044d6a544c41e996a512557f91df1a60bdb690b332904ebb5"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--with-cc=clang"
    - "--with-cxx=clang++"
    - "--with-fc=0"
    - "--with-mpi=0"
    - "--with-shared-libraries=0"
    - "--with-debugging=0"
    - "--download-f2cblaslapack=1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PETSc uses a Python configure script; generic autotools clean-verify is not suitable."
  - "Serial PETSc can be built self-contained with MPIUNI using --with-mpi=0."
  - "For OpenHarmony without Fortran compiler, PETSc can use --with-fc=0 and --download-f2cblaslapack=1."

conan:
  ref: "petsc/3.25.3"
  verify: pass
  package_type: library

test:
  smoke: pass
  test_package: pass
