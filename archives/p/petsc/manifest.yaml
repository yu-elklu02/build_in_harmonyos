software: petsc
display: "PETSc"
description: "Portable, Extensible Toolkit for Scientific Computation"
category: scientific-computing
homepage: "https://petsc.org/"
license: BSD-2-Clause
build_system: custom

versions:
  "3.25.3":
    status: built
    build_date: "2026-07-17"
    notes: "Serial static PETSc using MPIUNI and downloaded f2cblaslapack; Conan verify and local CI simulation passed."

ohos_adaptation:
  key_points:
    - "Use PETSc Python configure instead of generic autotools flow."
    - "Use --with-mpi=0 for MPIUNI to avoid unpublished MPI dependency."
    - "Use --download-f2cblaslapack=1 to keep recipe self-contained."
    - "Build static library with --with-shared-libraries=0."
  common_dependencies: []
