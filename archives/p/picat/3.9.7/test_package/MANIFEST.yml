# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: picat/3.9.7
homepage: "https://picat-lang.org"

# 上游测试命令 (picat 无标准测试套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (picat 无标准测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_picat.sh
    description: "消费者 smoke test wrapper: 验证 picat 二进制可执行，测试算术、列表、sum 等基本功能"
    command: "sh test_picat.sh"
  - file: test_picat.pi
    description: "Picat 测试脚本: 算术、列表、sum"
    command: "picat test_picat.pi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
