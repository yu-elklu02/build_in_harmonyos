software: picat
display: "Picat"
description: "Simple, and yet powerful, logic-based multi-paradigm programming language"
category: language
homepage: "https://picat-lang.org"
license: MPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "picat 使用自定义 Makefile（Makefile.linux64），需创建 Makefile.ohos 适配 clang/OpenHarmony"
    - "musl libc 不暴露 struct _IO_FILE 内部字段，需用 fileno() 替代 f->_fileno（__OHOS__ 守卫）"
    - "picat 的 -DGCC 宏启用 computed goto 等 GCC 扩展，clang 兼容这些扩展，应保留"
    - "无外部依赖（自包含 espresso/kissat/fann）"
  common_dependencies: []

versions:
  "3.9.7":
    status: published
    build_date: "2026-07-15"
    published_as: picat
    source_url: "https://picat-lang.org/download/picat397_src.tar.gz"
