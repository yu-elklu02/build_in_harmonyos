# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pidof/2.86
homepage: "https://github.com/drmrboy/pidof"

# 上游 Makefile 只有 all/clean/install/uninstall 目标，没有 check/test 目标，
# 也没有测试源码或测试脚本（源码包仅含 pidof.c / Makefile / README.md）。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_pidof.sh
    description: "运行 pidof 查找自身进程，验证可正常读取 /proc 并返回 PID"
    command: "sh test_pidof.sh <pidof-bin>"
  - file: test_pidof.sh
    description: "用 pidof 查找 init 进程，验证可正常匹配系统进程名并返回 PID"
    command: "sh test_pidof.sh <pidof-bin>"
  - file: test_pidof.sh
    description: "查询不存在的程序名，验证返回空且退出码非 0"
    command: "sh test_pidof.sh <pidof-bin>"

# 测试断言总数 (test_pidof.sh 中 check 调用数)
assertion_count: 3
