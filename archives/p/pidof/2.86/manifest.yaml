# 版本级 manifest — pidof 2.86
# 遵循 ARCHIVE-SPEC v3.0

version: "2.86"
software: "pidof"

# built = 配方完成、测试用例本地验证通过，尚未由 CI upload 到制品仓
status: built

build_date: "2026-07-15"
build_system: "makefile"

source:
  url: "https://github.com/drmrboy/pidof/archive/refs/tags/v2.86.tar.gz"
  sha256: "04ce1a52a77be3594543819dbf8439fbd3b91e1ddea1413ef268c20d6e1143c8"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CC=<tools.build:compiler_executables.c>'
    - 'CFLAGS=-O2 -fPIE -D_GNU_SOURCE'
    - 'LDFLAGS=-pie -Wl,-z,relro,-z,now'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 使用 $(CC)/$(CFLAGS)/$(LDFLAGS) 标准变量，从 Conan 注入 clang 即可编译，无需补丁"
  - "pidof 直接读取 /proc 文件系统，纯 POSIX 接口，无 glibc 特定依赖"
  - "鸿蒙 libc(musl) 已包含所有需要的标准库函数，无额外链接依赖"
  - "上游无测试套件，test_package 通过后台启动 sleep 进程并用 pidof 查找来验证功能（R34）"
