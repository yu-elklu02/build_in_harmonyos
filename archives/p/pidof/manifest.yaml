# 软件级 manifest — pidof
# 遵循 ARCHIVE-SPEC v3.0

software: pidof
display: "pidof"
description: "查找正在运行程序的进程 ID（从 sysvinit 剥离的独立实现）"
category: system
homepage: "https://github.com/drmrboy/pidof"
license: GPL-2.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 使用 $(CC)/$(CFLAGS)/$(LDFLAGS) 标准变量，从 Conan 注入 clang 即可编译"
    - "pidof 直接读取 /proc 文件系统，纯 POSIX 接口，无 glibc 特定依赖"
    - "上游 Makefile install 目标硬编码路径，由 package() 手动安装 bin/pidof"
    - "无补丁：源码使用标准 POSIX 接口，鸿蒙 libc(musl) 完全兼容"
  common_dependencies: []

versions:
  "2.86":
    status: built
    build_date: 2026-07-15
