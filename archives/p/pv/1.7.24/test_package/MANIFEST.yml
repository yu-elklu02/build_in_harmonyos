# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pv/1.7.24
homepage: "https://github.com/a-j-wood/pv"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/016-unix-socket.sh
    source: pv-1.7.24/tests/016-unix-socket.sh
    description: "Unix socket test"
    command: "sh tests/016-unix-socket.sh"
  - file: tests/001-main-stdout-file.sh
    source: pv-1.7.24/tests/001-main-stdout-file.sh
    description: "Basic stdout/file test"
    command: "sh tests/001-main-stdout-file.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: pv --version + 功能测试"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
