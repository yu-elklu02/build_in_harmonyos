software: perl-socket
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.040-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.040-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Socket-2.040.tar.gz"

  # 源码校验和
  sha256: "be0102fdcea8d43f1b02ef2ef94345ac4bbc7b6c66ece2ddd1a3593d8371ba1b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块使用 Makefile.PL + ExtUtils::MakeMaker 构建"
  - "sa_len 是 BSD 特有字段，Linux/鸿蒙 struct sockaddr 无此字段，perl Makefile.PL 特性探测正确处理"
  - "Conan 2.x ConanOutput 没有 warn() 方法，应使用 warning()"
  - "test_package 必须使用 Perl 测试，不能用 C/CMake (R28)"
  - "Conan 2.x ConanFile.run() 的 env 参数必须为 list 类型 (如 [\"conanrun\"])，不能传 dict"
  - "test_package/MANIFEST.yml 是 CI L0e 门禁必需文件，需声明上游测试和 test_package 测试"
  - "鸿蒙 SELinux 策略阻止从 HMDFS 标签路径加载 .so，需安装到 /data/service/hnp/ (hnp_file 标签)"
  - "Socket 2.040 与系统自带 2.038 的导出符号完全一致 (34 个全局 FUNC 符号)，功能等价"
