# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-socket/2.040-r0
homepage: "https://metacpan.org/dist/Socket"

# 上游测试命令 (Perl XS 模块使用 make test)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
# 注: 鸿蒙平台 SELinux HMDFS 限制导致 make test 无法从用户目录加载 Socket.so
# 测试在模块安装到 /data/service/hnp/ 后可正常运行
upstream_tests:
  - file: t/Socket.t
    source: Socket-2.040.tar.gz/t/Socket.t
    description: "Socket 模块综合测试 (6 项断言: socket创建, PF_INET连接, inet_aton, pack/unpack_sockaddr_in, getpeername)"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/Socket.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_socket.py
    description: "Conan L1 测试: 包结构验证 + ELF 静态分析 + 依赖检查 + Perl 模块加载测试 (best-effort, SELinux fallback)"
    command: "python3 test_package/test_socket.py <so_path> <pm_path>"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 Socket.t 有 6 个 Test::More 断言
# 功能测试覆盖 26 项 (常量、地址函数、sockaddr pack/unpack、getaddrinfo、multicast)
assertion_count: "6 (上游) + 26 (鸿蒙功能测试)"
