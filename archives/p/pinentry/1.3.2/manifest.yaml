software: pinentry
version: "1.3.2"
status: built
build_date: "2026-08-08T01:50"
build_system: autotools

source:
  url: "https://gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.2.tar.bz2"
  sha256: "8e986ed88561b4da6e9efe0c54fa4ca8923035c99264df0b0464497c5fb94e9e"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--enable-pinentry-curses"
    - "--enable-pinentry-tty"
    - "--disable-pinentry-efl"
    - "--disable-pinentry-qt"
    - "--disable-pinentry-qt4"
    - "--disable-pinentry-qt5"
    - "--disable-pinentry-tqt"
    - "--disable-inside-emacs"
    - "--disable-fallback-curses"
  dependencies:
    - "libgpg-error/1.55"
    - "libassuan/3.0.2"
    - "ncurses/6.6"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

knowledge_gained:
  - "config.sub/config.guess需要添加HarmonyOS平台识别（ohos*和linux-ohos*）"
  - "configure脚本中umask 077在HMDFS上导致Permission denied，需在build()中使用replace_in_file改为umask 022"
  - "gpgrt-config和libassuan-config使用#!/bin/sh，在HarmonyOS上需要修复shebang为/data/service/hnp/bin/bash"
  - "使用Conan管理的libgpg-error/1.55解决了之前预编译包的libgpg-error符号缺失问题"
  - "GPG_ERROR_CONFIG和LIBASSUAN_CONFIG环境变量可绕过configure的config脚本自动检测逻辑"

packaging:
  package_file: "pinentry-1.3.2-ohos-aarch64.tar.gz"
  package_size: 591985
  created_at: "2026-08-08"
  signed: false
  contents:
    - "bin/pinentry-curses"
    - "bin/pinentry-tty"
    - "bin/pinentry"
    - "share/info/pinentry.info"
  install_verified: true
  runtime_verified: true
