software: perl-par-dist
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.53-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.53-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RS/RSCHUPP/PAR-Dist-0.53.tar.gz"

  # 源码校验和
  sha256: "04cbc81e786968f9a4109ad6c2f9b81e879ac0c6b6080a9d217443b61dfd2498"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (MakeMaker)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无需补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上编译无需特殊处理，Makefile.PL + make 即可直接通过"
  - "PAR::Dist blib_to_par 不传 dist 参数时自动生成包含平台架构的文件名（aarch64-linux-5.42.0.par）"
  - "uninstall_par 使用自定义 prefix 时 packlist 查找路径仍指向系统默认路径（PAR::Dist 已知行为）"
  - "sign_par/verify_par 依赖可选模块 Module::Signature，未安装不影响核心功能"
