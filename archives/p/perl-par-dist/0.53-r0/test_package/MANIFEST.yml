# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-par-dist/0.53-r0
homepage: "https://metacpan.org/dist/PAR-Dist"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-basic.t
    source: perl-par-dist-0.53-r0/t/00-basic.t
    description: "基本功能测试：模块加载和 parse_dist_name"
    command: "perl -Iblib/lib t/00-basic.t"
  - file: t/01-parse_dist_name.t
    source: perl-par-dist-0.53-r0/t/01-parse_dist_name.t
    description: "parse_dist_name 函数测试"
    command: "perl -Iblib/lib t/01-parse_dist_name.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.sh
    description: "Conan L1 消费者测试：验证 PAR::Dist 模块可加载和 parse_dist_name 可用"
    command: "sh test_package/test.sh <perl_lib_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 23
