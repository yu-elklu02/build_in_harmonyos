# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-params-validationcompiler/0.31
homepage: https://metacpan.org/dist/Params-ValidationCompiler

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (Perl Test::More 套件)
upstream_tests:
  - name: "moose"
    source: Params-ValidationCompiler-0.31/t/moose.t
    description: "Moose 类型约束集成测试"
  - name: "name"
    source: Params-ValidationCompiler-0.31/t/name.t
    description: "验证器命名测试"
  - name: "name-fails"
    source: Params-ValidationCompiler-0.31/t/name-fails.t
    description: "验证器命名失败处理"
  - name: "named-args-check"
    source: Params-ValidationCompiler-0.31/t/named/args-check.t
    description: "命名参数检查"
  - name: "named-const-hash"
    source: Params-ValidationCompiler-0.31/t/named/const-hash.t
    description: "命名参数常量哈希 (需 Const::Fast)"
  - name: "named-locked-hash"
    source: Params-ValidationCompiler-0.31/t/named/locked-hash.t
    description: "命名参数锁定哈希"
  - name: "named-required"
    source: Params-ValidationCompiler-0.31/t/named/required.t
    description: "命名参数必填检查"
  - name: "named-return-object"
    source: Params-ValidationCompiler-0.31/t/named/return-object.t
    description: "命名参数返回对象模式"
  - name: "named-slurpy"
    source: Params-ValidationCompiler-0.31/t/named/slurpy.t
    description: "命名参数 slurpy 模式"
  - name: "pairs-to-value-list"
    source: Params-ValidationCompiler-0.31/t/pairs-to-value-list.t
    description: "键值对转值列表"
  - name: "positional-default"
    source: Params-ValidationCompiler-0.31/t/positional/default.t
    description: "位置参数默认值"
  - name: "positional-required"
    source: Params-ValidationCompiler-0.31/t/positional/required.t
    description: "位置参数必填检查"
  - name: "positional-slurpy"
    source: Params-ValidationCompiler-0.31/t/positional/slurpy.t
    description: "位置参数 slurpy 模式"
  - name: "self-check"
    source: Params-ValidationCompiler-0.31/t/self-check.t
    description: "自检测试"
  - name: "source_for"
    source: Params-ValidationCompiler-0.31/t/source_for.t
    description: "source_for 方法测试"
  - name: "specio"
    source: Params-ValidationCompiler-0.31/t/specio.t
    description: "Specio 类型约束集成"
  - name: "type-tiny"
    source: Params-ValidationCompiler-0.31/t/type-tiny.t
    description: "Type::Tiny 类型约束集成"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Perl 模块加载、命名参数验证、默认值、return_object 模式"
    command: "sh test.sh"

# 测试断言总数 (20 个测试文件, 87 个测试)
assertion_count: 87
