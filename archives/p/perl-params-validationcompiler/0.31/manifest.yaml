software: perl-params-validationcompiler
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.31/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.31"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# 构建系统 (顶层字段，自检门禁要求)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Params-ValidationCompiler-0.31.tar.gz"

  # 源码校验和
  sha256: "7b6497173f1b6adb29f5d51d8cf9ec36d2f1219412b4b2410e9d77a901e84a6d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS）在鸿蒙平台编译无需特殊链接参数，不受 CRT 文件缺失影响"
  - "Params::ValidationCompiler 使用 Makefile.PL (ExtUtils::MakeMaker) 构建系统，与 perl-dbd-pg 的 XS 模块不同"
  - "conan create 验证通过，test_package 中的 Perl 模块加载测试成功"
  - "模块自带测试套件 87 个测试全部通过（仅 1 个因 Const::Fast 未安装跳过）"
  - "与 perl-dbd-pg 的关键区别：纯 Perl 模块不需要 musl C 库头文件、不需要 -nostartfiles 链接参数、不受 SELinux HMDFS 动态库加载限制"
