# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-crypt-eksblowfish/0.009-r15
homepage: "https://metacpan.org/dist/Crypt-Eksblowfish"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/eksblowfish.t
    source: Crypt-Eksblowfish-0.009/t/eksblowfish.t
    description: "Eksblowfish block cipher test suite — encryption/decryption with known vectors"
    command: "make test"
  - file: t/bcrypt.t
    source: Crypt-Eksblowfish-0.009/t/bcrypt.t
    description: "bcrypt hash test suite — known hash vector verification"
    command: "make test"
  - file: t/blowfish.t
    source: Crypt-Eksblowfish-0.009/t/blowfish.t
    description: "Blowfish cipher test suite — standard Blowfish encryption tests"
    command: "make test"
  - file: t/family.t
    source: Crypt-Eksblowfish-0.009/t/family.t
    description: "Cipher family test suite — family key setup and operations"
    command: "make test"
  - file: t/subkey.t
    source: Crypt-Eksblowfish-0.009/t/subkey.t
    description: "Subkeyed cipher test suite — subkey handling and operations"
    command: "make test"
  - file: t/uklblowfish.t
    source: Crypt-Eksblowfish-0.009/t/uklblowfish.t
    description: "Uklblowfish cipher test suite — unkeyed Blowfish operations"
    command: "make test"
  - file: t/base64.t
    source: Crypt-Eksblowfish-0.009/t/base64.t
    description: "Base64 encoding test suite — bcrypt base64 encoding/decoding"
    command: "make test"
  - file: t/bcrypt_hash.t
    source: Crypt-Eksblowfish-0.009/t/bcrypt_hash.t
    description: "bcrypt hash generation test suite — full hash generation tests"
    command: "make test"
  - file: t/utf8.t
    source: Crypt-Eksblowfish-0.009/t/utf8.t
    description: "UTF-8 encoding test suite — UTF-8 key/salt handling"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_eksblowfish.sh
    description: "消费者测试脚本 — 验证 Eksblowfish.so/.pm 存在、ELF 有效性；调用 Blowfish->encrypt()/decrypt() 加密 API (R34)"
    command: "bash test_eksblowfish.sh"
  - file: test_package/conanfile.py
    description: "消费者测试 conanfile — 调用 test_eksblowfish.sh 执行上述验证"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
