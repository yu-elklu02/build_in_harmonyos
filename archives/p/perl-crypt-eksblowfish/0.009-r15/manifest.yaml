# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl Module::Build 在 Perl 5.39+ 已从核心模块移除，CI worker (Perl 5.42.0) 上不可用"
  - "解决方案：用 ExtUtils::MakeMaker (Makefile.PL) 替代 Module::Build (Build.PL)"
  - "ExtUtils::MakeMaker 仍然是 Perl 核心模块，通过修改 %Config 清理 -fstack-protector-strong"
  - "CPATH/LIBRARY_PATH 需指向 OHOS SDK sysroot 以获取 musl 头文件"
  - "SELinux HMDFS 文件系统限制动态库加载，需要将模块安装到系统目录"
  - "Makefile.PL 补丁方式优于运行时修改生成的 Makefile（R6 合规）"
  - "conan-verify 8 道门禁全部通过（G0-G4, L2-L5）"
  - "Eksblowfish.so 安全特性: NX + PIE + RELRO + BIND_NOW 全部启用"
  - "boot_Crypt__Eksblowfish 导出符号正确，Perl XS API 引用完整"
