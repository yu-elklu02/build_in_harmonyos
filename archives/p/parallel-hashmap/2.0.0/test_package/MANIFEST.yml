# test_package/MANIFEST.yml — parallel-hashmap/2.0.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: parallel-hashmap/2.0.0
homepage: "https://github.com/greg7mdp/parallel-hashmap"

# parallel-hashmap is header-only. The upstream test suite is compiled and run
# during the build() phase (PHMAP_BUILD_TESTS=ON). The consumer test exercises
# the key phmap APIs (flat_hash_map, flat_hash_set, btree_map, btree_set,
# parallel_flat_hash_map) plus version macros.
upstream_check_command: "ctest --output-on-failure -j20"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - "test_flat_hash_map"
  - "test_flat_hash_set"
  - "test_node_hash_map"
  - "test_node_hash_set"
  - "test_parallel_flat_hash_map"
  - "test_parallel_flat_hash_set"
  - "test_parallel_node_hash_map"
  - "test_parallel_node_hash_set"
  - "test_parallel_flat_hash_map_mutex"
  - "test_raw_hash_set"
  - "test_raw_hash_set_allocator"
  - "test_container_memory"
  - "test_hash_policy_testing"
  - "test_node_hash_policy"
  - "test_btree"
  - "test_dump_load"
  - "test_erase_if"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: flat_hash_map, flat_hash_set, btree_map, btree_set, parallel_flat_hash_map, version macros"
    command: "./phmap_test"

upstream_test_count: 17
test_package_test_count: 1
assertion_count: 30
