# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pyvolumio/0.1.5
homepage: "https://github.com/OnFreund/PyVolumio"

# 上游 PyPI sdist / GitHub tag v0.1.5 均无 tests/ 目录，无官方 pytest/unittest 套件。
# TEST_QUALITY_SPEC §3.3 sanctioned exemption: build() 中以离线 smoke
# (import/construct/canonic_url) 作为构建期验证替代。
upstream_check_command: "python3 _upstream_smoke.py"
upstream_test_in_build: true
upstream_test_command: "env PYTHONPATH=$site python3 _upstream_smoke.py"

# 双重证据: PyPI sdist 与 GitHub tag v0.1.5 均无任何测试/CI 文件
upstream_test_exemption: >-
  pyvolumio 0.1.5 上游未提供任何自动化测试套件:
  PyPI sdist (SHA256=13249169451b46f3759622169de917b6ebd769865a899cee01f848a4c4bd6c69)
  与 GitHub codeload tarball refs/tags/v0.1.5 文件清单均不含 tests/ 或 test/ 目录、
  不含 pytest.ini/tox.ini/noxfile.py、不含 .github/ CI 工作流;
  setup.py 用 setuptools.find_packages(exclude=['tests', '*.tests', '*.tests.*', 'tests.*'])
  主动排除; MANIFEST.in 仅 include README.md LICENSE。

upstream_tests: []  # 上游无官方测试;build smoke 见下

# 构建期离线 smoke (替代上游缺失的测试套件)
build_phase_smoke:
  - file: _upstream_smoke.py
    source: archives/p/pyvolumio/0.1.5/conanfile.py (build())
    description: "Offline smoke: import Volumio/CannotConnectError, construct, canonic_url (3 helpers × 13 asserts)"
    command: "env PYTHONPATH=$staging_site python3 _upstream_smoke.py"
    asserts: 13

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pyvolumio.py
    description: "Import/construct/canonic_url + mock-session async API (get_state/play/queue/browse/replaceAndPlay)"
    command: "python3 test_pyvolumio.py"
    asserts: 28

# build smoke 13 + consumer 28 = 41
assertion_count: 41
