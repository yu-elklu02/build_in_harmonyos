package: python-cairo/1.29.0
homepage: https://pycairo.readthedocs.io

upstream_test_in_build: true
upstream_check_command: "meson test"
upstream_test_command: "python -m pytest"

upstream_tests:
  - source: tests/test_*.py
    description: "All 20 upstream pytest modules, including the compiled tests/cmodule helper"
    command: "meson test --print-errorlogs"

optional_test_modules:
  - module: numpy
    source: tests/test_surface_numpy.py
    behavior: "pytest.importorskip; absence is reported as an upstream skip"
  - module: pygame
    source: tests/test_surface_pygame.py
    behavior: "pytest.importorskip; absence is reported as an upstream skip"

upstream_test_modifications: []
exemptions: []

test_package:
  type: python
  files:
    - conanfile.py
    - test_pycairo_import.py
