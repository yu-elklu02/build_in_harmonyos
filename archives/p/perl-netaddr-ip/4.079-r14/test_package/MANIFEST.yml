# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-netaddr-ip/4.079-r14
homepage: "https://metacpan.org/dist/NetAddr-IP"

# 上游测试命令 (用于 make test 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
# Lite/Util: 39 个测试文件, 1528 个测试
# 主模块: 32 个测试文件, 9538 个测试
upstream_tests:
  - file: t/00init.t
    source: NetAddr-IP-4.079.tar.gz/t/00init.t
    description: "初始化测试"
    command: "perl t/00init.t"
  - file: t/01handler.t
    source: NetAddr-IP-4.079.tar.gz/t/01handler.t
    description: "处理器测试"
    command: "perl t/01handler.t"
  - file: t/02new.t
    source: NetAddr-IP-4.079.tar.gz/t/02new.t
    description: "地址创建测试"
    command: "perl t/02new.t"
  - file: t/03split.t
    source: NetAddr-IP-4.079.tar.gz/t/03split.t
    description: "子网划分测试"
    command: "perl t/03split.t"
  - file: t/04numeric.t
    source: NetAddr-IP-4.079.tar.gz/t/04numeric.t
    description: "数值操作测试"
    command: "perl t/04numeric.t"
  - file: t/05compv6.t
    source: NetAddr-IP-4.079.tar.gz/t/05compv6.t
    description: "IPv6 压缩测试"
    command: "perl t/05compv6.t"
  - file: t/06range.t
    source: NetAddr-IP-4.079.tar.gz/t/06range.t
    description: "范围操作测试"
    command: "perl t/06range.t"
  - file: t/07wildcard.t
    source: NetAddr-IP-4.079.tar.gz/t/07wildcard.t
    description: "通配符测试"
    command: "perl t/07wildcard.t"
  - file: t/08delete.t
    source: NetAddr-IP-4.079.tar.gz/t/08delete.t
    description: "删除操作测试"
    command: "perl t/08delete.t"
  - file: t/09several.t
    source: NetAddr-IP-4.079.tar.gz/t/09several.t
    description: "多地址操作测试"
    command: "perl t/09several.t"
  - file: Lite/Util/t/00init.t
    source: NetAddr-IP-4.079.tar.gz/Lite/Util/t/00init.t
    description: "Util 模块初始化测试"
    command: "perl Lite/Util/t/00init.t"
  - file: Lite/Util/t/01addr.t
    source: NetAddr-IP-4.079.tar.gz/Lite/Util/t/01addr.t
    description: "Util 地址操作测试"
    command: "perl Lite/Util/t/01addr.t"
  - file: Lite/Util/t/02incr.t
    source: NetAddr-IP-4.079.tar.gz/Lite/Util/t/02incr.t
    description: "Util 地址递增测试"
    command: "perl Lite/Util/t/02incr.t"
  - file: Lite/Util/t/03arith.t
    source: NetAddr-IP-4.079.tar.gz/Lite/Util/t/03arith.t
    description: "Util 128位算术测试"
    command: "perl Lite/Util/t/03arith.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Perl XS 模块加载 + IPv4/IPv6 地址操作验证"
    command: "perl -I<lib>/aarch64-linux -MNetAddr::IP -e 'use NetAddr::IP::Util_IS; die if NetAddr::IP::Util_IS->pure()'"
  - file: test_netaddr_ip.pl
    description: "NetAddr::IP 完整功能测试 (IPv4创建 + IPv6创建 + XS模式验证)"
    command: "perl test_netaddr_ip.pl"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: ~11066 subtests (Lite/Util 1528 + 主模块 9538) + test_package: 5 assertions
assertion_count: 11071
