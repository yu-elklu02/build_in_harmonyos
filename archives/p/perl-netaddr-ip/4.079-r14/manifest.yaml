software: perl-netaddr-ip
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/4.079-r14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.079-r14"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/MI/MIKER/NetAddr-IP-4.079.tar.gz"

  # 源码校验和
  sha256: "ec5a82dfb7028bcd28bb3d569f95d87dd4166cc19867f2184ed3a59f6d6ca0e7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL --xs (Lite/Util)"
    - "perl Makefile.PL INSTALL_BASE=/usr/local (main)"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS模块NetAddr::IP::Util的configure.gcc在HMDFS上config.status无法创建临时子目录文件，需手动创建config.h"
  - "Lite/Util/Makefile.PL接受--xs参数强制XS模式，否则在C编译器检测失败时回退到PurePerl"
  - "XS编译成功，Util.so为ELF 64-bit AArch64，链接libc.so，30KB，具备BIND_NOW(Full RELRO)安全特性"
  - "Conan包的test_package测试通过：NetAddr::IP XS模块可正常加载，IPv4/IPv6地址操作功能正常"
  - "系统安装版本因Socket6 0.29不导出gethostbyname2/getipnodebyname而加载失败，Conan包因PERL5LIB不包含Socket6路径而正常工作（优雅回退到标准gethostbyname）"
  - "SELinux HMDFS限制：Util.so的SELinux context为hmdfs:s0，hishell_hap域下DynaLoader直接加载会失败，但Perl通过use机制加载正常"
  - "参考perl-dbd-pg编译经验：Perl XS模块在鸿蒙平台编译模式一致，需手动创建config.h绕过HMDFS限制"
