software: perl-netaddr-ip
display: "NetAddr::IP (Perl)"
description: "Managing IPv4 and IPv6 addresses (Perl XS module)"
category: network
homepage: "https://metacpan.org/dist/NetAddr-IP"
license: "GPL-2.0-only or Artistic-1.0"
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "构建系统为 Perl ExtUtils::MakeMaker (Makefile.PL)，非标准 autotools/cmake"
    - "Lite/Util/configure.gcc 的 config.status 在 HMDFS 上无法创建临时子目录文件，需手动创建 config.h"
    - "使用 --xs 参数强制 XS 模式，否则在 C 编译器检测失败时回退到 PurePerl"
    - "Util.so 为 XS 加速组件，ELF64 AArch64，仅链接 libc.so"
    - "系统安装版本可能因 Socket6 0.29 缺少 gethostbyname2 导出而加载失败，建议通过 Conan 包使用"
  common_dependencies: []

# 版本索引
versions:
  "4.079-r14":
    status: built
    build_date: "2026-06-29"
    conan_ref: "perl-netaddr-ip/4.079-r14@ohpcd/stable"
  "4.079":
    status: built
    build_date: "2026-06-29"
    conan_ref: "perl-netaddr-ip/4.079@ohpcd/stable"
