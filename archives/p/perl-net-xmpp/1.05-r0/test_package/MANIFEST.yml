# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-net-xmpp/1.05-r0
homepage: https://metacpan.org/dist/Net-XMPP

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# make test 实际运行的测试程序
upstream_tests:
  - file: t/1_load.t
    source: Net-XMPP-1.05.tar.gz/t/1_load.t
    description: "模块加载测试"
    command: "perl t/1_load.t"
  - file: t/2_client_jabberd1.4.t
    source: Net-XMPP-1.05.tar.gz/t/2_client_jabberd1.4.t
    description: "jabberd1.4 客户端协议测试"
    command: "perl t/2_client_jabberd1.4.t"
  - file: t/3_client_jabberd2.t
    source: Net-XMPP-1.05.tar.gz/t/3_client_jabberd2.t
    description: "jabberd2 客户端协议测试"
    command: "perl t/3_client_jabberd2.t"
  - file: t/iq.t
    source: Net-XMPP-1.05.tar.gz/t/iq.t
    description: "IQ (Info/Query) 处理测试"
    command: "perl t/iq.t"
  - file: t/jid.t
    source: Net-XMPP-1.05.tar.gz/t/jid.t
    description: "JID 解析测试"
    command: "perl t/jid.t"
  - file: t/message.t
    source: Net-XMPP-1.05.tar.gz/t/message.t
    description: "消息处理测试"
    command: "perl t/message.t"
  - file: t/packet_iqauth.t
    source: Net-XMPP-1.05.tar.gz/t/packet_iqauth.t
    description: "IQ 认证包测试"
    command: "perl t/packet_iqauth.t"
  - file: t/packet_iqroster.t
    source: Net-XMPP-1.05.tar.gz/t/packet_iqroster.t
    description: "IQ 花名册包测试"
    command: "perl t/packet_iqroster.t"
  - file: t/presence.t
    source: Net-XMPP-1.05.tar.gz/t/presence.t
    description: "在线状态测试"
    command: "perl t/presence.t"
  - file: t/rawxml.t
    source: Net-XMPP-1.05.tar.gz/t/rawxml.t
    description: "原始 XML 处理测试"
    command: "perl t/rawxml.t"
  - file: t/roster.t
    source: Net-XMPP-1.05.tar.gz/t/roster.t
    description: "花名册测试"
    command: "perl t/roster.t"
  - file: t/memory_cycle.t
    source: Net-XMPP-1.05.tar.gz/t/memory_cycle.t
    description: "内存循环测试 (跳过: 需要 Test::Memory::Cycle)"
    command: "perl t/memory_cycle.t"
  - file: t/memory_leak.t
    source: Net-XMPP-1.05.tar.gz/t/memory_leak.t
    description: "内存泄漏测试 (跳过: 需要 Devel::LeakGuard::Object)"
    command: "perl t/memory_leak.t"
  - file: t/gtalk.t
    source: Net-XMPP-1.05.tar.gz/t/gtalk.t
    description: "Google Talk 连接测试 (失败: 需要网络连接)"
    command: "perl t/gtalk.t"
  - file: t/srv.t
    source: Net-XMPP-1.05.tar.gz/t/srv.t
    description: "SRV 记录测试 (失败: 需要 LWP::Online)"
    command: "perl t/srv.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Net::XMPP 模块加载 + 版本验证 (perl test.sh)"
    command: "perl test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 656 subtests + 功能测试: 20 assertions
assertion_count: 676
