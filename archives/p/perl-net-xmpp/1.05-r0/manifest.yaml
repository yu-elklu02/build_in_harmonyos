software: perl-net-xmpp
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.05-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.05-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DA/DAPATRICK/Net-XMPP-1.05.tar.gz"

  # 源码校验和
  sha256: "4c02200577c2b235a163a09bfaa152bf000fe5f1499ad80ce16ab66808949362"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"

  # 运行时依赖（这些模块在运行时也需要，不仅是构建期依赖）
  runtime_dependencies:
    - "perl-xml-stream/1.24"
    - "perl-authen-sasl/2.2000"
    - "perl-digest-sha/6.04"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-replace-Makefile.PL-with-ExtUtils-MakeMaker.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上可直接编译，无需修改源码或添加补丁"
  - "Perl Module::Build 已从 Perl 5.39.0 核心移除，Perl 5.42+ 需用 ExtUtils::MakeMaker 替换 Makefile.PL"
  - "ExtUtils::MakeMaker 可作为 Module::Build::Compat 的替代方案用于纯 Perl 模块安装"
  - "XML::Stream 1.24 运行时会产生 'Possible precedence problem' 警告，非阻塞"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响（对比 XS 模块如 perl-dbd-pg）"
  - "Net::XMPP 的 AUTOLOAD 机制生成的动态方法在 OHOS Perl 5.42.0 上正常工作"
  - "R26/R32 合规: 纯 Perl 模块无 .so 输出，不涉及系统同名库冲突"
