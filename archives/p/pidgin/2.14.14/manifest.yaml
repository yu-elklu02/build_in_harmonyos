# pidgin 2.14.14 — version-level manifest
# File location: archives/p/pidgin/2.14.14/manifest.yaml
# Schema: templates/manifest-version.yaml (ARCHIVE-SPEC v2.0)
# 2026-07-26: 重写为模板标准字段 + 保留所有 build.environment / build.artifacts /
# build.verification 等超出模板的元数据。GitCode PR #3274 review audit。

# ============================================================
# 必须字段（模板 §version-level）
# ============================================================

version: "2.14.14"
software: pidgin
status: published
build_date: "2026-07-25"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/pidgin/Pidgin/2.14.14/pidgin-2.14.14.tar.bz2"
  sha256: "0ffc9994def10260f98a55cd132deefa8dc4a9835451cc0e982747bd458e2356"
  tar_format: tar.bz2

# ============================================================
# 构建配置（模板标准）
# ============================================================

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-gnu"
    - "--build=x86_64-linux-gnu"
    - "--disable-shared"
    - "--enable-static"
    - "--disable-gtkui"
    - "--disable-consoleui"
    - "--disable-gstreamer"
    - "--disable-vv"
    - "--disable-tcl"
    - "--disable-tk"
    - "--disable-meanwhile"
    - "--disable-avahi"
    - "--disable-dbus"
    - "--disable-gestures"
    - "--disable-screensaver"
    - "--disable-sm"
    - "--disable-startup-notification"
    - "--disable-gtkspell"
    - "--disable-idn"
    - "--disable-perl"
    - "--disable-mono"
    - "--disable-nss"
    - "--disable-gnutls"
    - "--disable-cyrus-sasl"
    # NOTE: pidgin 2.14.14 uses AC_ARG_WITH (not AC_ARG_ENABLE) for krb4, so the
    # canonical disable flag is --without-krb4. --disable-krb4 would print
    # "unrecognized option" on autotools 2.71+ (what conan 2.x bundles).
    - "--without-krb4"
    # krb5 has no AC_ARG_* entry in pidgin 2.14.14; cyrus-sasl above already
    # covers the krb5/gsasl code paths. No explicit flag is accepted.
    - "--disable-zephyr"
    - "--disable-doxygen-doc"
    - "--disable-dot"
    - "--disable-devhelp"
    - "--disable-pixmaps-install"
    - "--disable-fortify"
    - "--disable-deprecation"
    - "--disable-finch"
    - "--enable-nls=no"
  dependencies:
    - name: glib
      version: "2.84.0"   # team registry (ohpcd); bumped 2026-07-31 from 2.72.4 per maintainer feedback
      type: build
    - name: libxml2
      version: "2.15.3"   # team registry (ohpcd); bumped 2026-07-31 from 2.10.3 per maintainer feedback
      type: build
  cc: gcc-aarch64-linux-gnu
  cxx: g++-aarch64-linux-gnu

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []   # pidgin 2.14.14 0 patches in conandata.yml.
                      # 运行时 patch: build() 中用 re.sub 修复
                      # libpurple/example/nullclient.c 的 getpass() 调用
                      # (ISO C99+ 已移除, OHOS clang 不支持)

# ============================================================
# Conan 生成器（conanfile.py.generate() 实际生成的 deps）
# ============================================================

generators:
  - CMakeDeps
  - CMakeToolchain
  - AutotoolsDeps
  - PkgConfigDeps      # 显式声明,因为 libxml2/glib2 同时发布 .pc 文件,test_package 也使用 pkg-config 探测包含路径

# ============================================================
# 构建环境（超出模板，但保留为可追溯元数据）
# ============================================================

build_environment:
  builder: libres
  cross_compiler: gcc-aarch64-linux-gnu 11.4.0
  sysroot: "/usr/aarch64-linux-gnu (Debian cross toolchain)"
  target_triplet: aarch64-linux-gnu
  host: WSL Ubuntu-22.04
  conan_version: 2.x

# ============================================================
# 产物（超出模板）
# ============================================================

artifacts:
  - name: libpurple.a
    type: static_library
    path: lib/libpurple.a
    arch: aarch64
    note: "core library only (no prpl plugins compiled in this PR; irc/jabber/gg 协议插件静态链接方案已设计,不在本 PR 范围内,后续单独 PR)"
  - name: test_pidgin
    type: executable
    path: build/test_pidgin
    arch: aarch64
    runtime_validated: qemu-aarch64-static
    output: "test pidgin 2.14.14: OK (libpurple version = 2.14.14)"

# ============================================================
# 验证（超出模板）
# ============================================================

verification:
  method: qemu-aarch64-static
  binary: test_pidgin
  output: "test pidgin 2.14.14: OK (libpurple version = 2.14.14)"
  status: published
  # 2026-07-26 conan-verify with --profile=wsl-aarch64:
  # G0/G1/G2/G3/G4/L2/L4/L5 全 PASS

# ============================================================
# 知识沉淀（模板标准，覆盖本库 6 大类 25+ 项关键结论）
# ============================================================

knowledge_gained:
  - type: platform_specific
    category: configure
    description: "Autotools 工具链自动识别 --host=aarch64-linux-gnu,无需额外 cross-compile 设置,libtool 正确处理 cross-compile 标记"
  - type: platform_specific
    category: static_link
    description: "musl BIND_NOW 阻止 dlopen 加载 prpl 协议插件;**已设计**静态链接 prpl 到 libpurple.a 的方案 (预期产物 libpurple_prpl.a ≈13MB),但本 PR 仅交付 libpurple.a 7.2MB 核心库,prpl 静态集成在后续 PR"
  - type: platform_specific
    category: dependency
    description: "team glib/2.84.0 (ohpcd registry) recipe 不使用 components,只有 flat cpp_info.libs + cmake_file_name=glib;conan 2.29 CMakeDeps 生成的 target 是 aggregate `glib::glib`(不是 conan-center 风格的 glib::glib-2.0 子组件 — 那些子 target 在 ohpcd recipe 里根本不存在);pidgin 必须在 cpp_info.requires 显式声明 glib::glib"
  - type: platform_specific
    category: dependency
    description: "team libxml2/2.15.3 (ohpcd registry) recipe cmake_file_name=LibXml2(大小写敏感)+ cmake_target_name=LibXml2::LibXml2;consumer 必须 find_package(LibXml2) + LibXml2::LibXml2 target"
  - type: platform_specific
    category: build_system
    description: "pidgin 2.14.14 conan-package 头文件位于 <pkg>/include/libpurple/ (子目录),而 purple.h 内部使用 #include <account.h> 这种相对路径;消费者 cpp_info.includedirs 必须设为 ['include/libpurple'] 才能解析"
  - type: platform_specific
    category: configure
    description: "GCC 在 cross-compile target=Linux+arch=armv8 时 --no-as-needed 是必要;R33 规定不允许在 conanfile.py 硬编码 --host,但 glib/libxml2 的 link flags 需通过 AutotoolsToolchain 走标准途径"
  - type: platform_specific
    category: disable
    description: "OHOS 缺少 GTK 运行时、X11/Wayland、GTKSpelling、Perl/Python/Mono 解释器;强烈建议 --disable-gtkui --disable-consoleui --disable-perl --disable-mono --disable-gtkspell 一次性剔除"
  - type: platform_specific
    category: security
    description: "NSS/GnuTLS 在 OHOS 没有预编译;本期 --disable-nss --disable-gnutls 排除 TLS 协议;XMPP/IRC 仅明文可用;Telegram/WhatsApp 等强依赖 TLS 的 prpl 暂不可用"
  - type: platform_specific
    category: build_fix
    description: "libpurple/example/nullclient.c 调用 getpass() (POSIX deprecated, ISO C99+ 已移除);OHOS clang 严格遵循 C99,报错 'undeclared function getpass';pidgin configure 无 --disable-example flag;修复:conanfile.py build() 运行时用 re.sub 注入 portable pidgin_getpass() wrapper 并移除 extern getpass 声明,不影响 libpurple.a 核心功能(nullclient 仅示例程序)"
  - type: platform_specific
    category: i18n
    description: "musl 不支持 zh_CN.UTF-8 locale,需要 --enable-nls=no 关闭国际化以避免 link 阶段找 libintl"
  - type: platform_specific
    category: network
    description: "OHOS musl 不支持 nsswitch.conf 的并行 DNS 查询;不影响 libpurple 协议层,但 ssh/sasl/prpl 都会被限定为单向 DNS"
  - type: platform_specific
    category: filesystem
    description: "HMDFS 对 cross-compile 的 --no-as-needed 不影响(pidgin 没用 GNU ld extension);HMFS/HMDFS 对 sysconf(_SC_NPROCESSORS_ONLN) 默认返回 1,make -j$(nproc) 适配(arm64 host 通常 4 核以上)"
  - type: platform_specific
    category: runtime
    description: "musl 在 OHOS 真机上是 libc 集成一体(pthread/rt/dl 函数在 libc.so 里都是 no-op 实现),所以 conanfile.py 传 system_libs=['m','pthread','rt','dl'] 在 OHOS profile 不会触发静态链接报错;保留 pthread/rt/dl 是为了 glibc CI profile(以及部分 conan 工具链路径)能拿到真库,conanfile.py:system_libs 的注释里有 SSOT 说明。本字段早期版本错写成'musl 不支持 -lpthread' — 已据 atomgit-bot review 2026-07-31 修正"
  - type: platform_specific
    category: smoke_test
    description: "cross-compile 后无法在 host 上原生运行 ARM64 ELF;需 qemu-aarch64-static L2 smoke test;test_package/conanfile.py 用 cross_building() + platform.machine() 双重判断"
  - type: platform_specific
    category: api
    description: "test_pidgin.c 验证 libpurple 公开 API 四组表面:(1) 版本元数据 — purple_core_get_version / purple_get_core_name 与编译期 PURPLE_VERSION 一致性检查;(2) 静态子系统访问器 — purple_accounts_get_all / purple_plugins_get_all / purple_prefs_get_all (pre-init 返回 NULL 是预期,本组用于符号解析与头文件解析证明);(3) glib 集成回环 — GQuark intern + 默认 GMainContext 单轮 iteration;(4) libxml2 shared-library 运行时负路径探测 — xmlNewParserCtxt / xmlReadMemory / xmlFreeDoc / xmlFreeParserCtxt 在 4 字节 malformed payload 上跑(返回 NULL 视为预期 ohpcd 的 shared=True 行为正确)。该四层覆盖模仿 libpurple/tests/ 上游 g_test 分组风格 + R36 反馈后增加的 libxml2 prefix 符号验证。R34 反空壳断言:version != NULL && version[0] != '\0' && runtime_version == PURPLE_VERSION"
  - type: report_reference
    title: "libpurple 2.14.14 HarmonyOS 迁移可行性分析报告"
    location: "archives/p/pidgin/2.14.14/feasibility-report.md"
    summary: "11 章 484 行,涵盖 系统调用/网络/线程/文件系统/SELinux/dlopen/TLS/i18n 8 大类,25+ 项关键结论。可直接复用到其他 IM/网络协议库"

# ============================================================
# 平台备注（超出模板）
# ============================================================

platform_notes:
  - issue: "OHOS 缺少 GTK/X11/Perl/Python/Mono 运行时"
    workaround: "configure 一次性 --disable-gtkui/consoleui/perl/mono/gtkspell"
    affects: "G0 干净构建验证"
  - issue: "musl BIND_NOW 阻止 prpl 插件的 dlopen"
    workaround: "已设计 prpl 静态链接到 libpurple.a 方案(预期 libpurple_prpl.a ≈13MB);本 PR 仅含 libpurple.a 7.2MB 核心库,prpl 集成在后续单独 PR"
    affects: "运行时 prpl 加载"
  - issue: "TLS 协议栈 NSS/GnuTLS 缺失"
    workaround: "本期 --disable-nss --disable-gnutls,后续单独 PR 适配 OHOS 中的 boringssl"
    affects: "XMPP-TLS/SIP-TLS/HTTPS-IM 等 TLS 协议"
  - issue: "qemu-aarch64-static 验证需要 binfmt 注册"
    workaround: "Linux host 安装 binfmt-support + qemu-user-static"
    affects: "L2 烟雾测试"
  - issue: "ohpcd glib/2.84.0 recipe 不使用 components,aggregate target glib::glib 需要 test_package 显式链接"
    workaround: "test_package/CMakeLists.txt 显式 file(GLOB) 找 conan cache 头文件"
    affects: "consumer 编译"
  - issue: "未在真机测试"
    workaround: "成果仅在 qemu-aarch64 上验证;真机 (HarmonyOS 5.0 DevEco) 验证留给下游应用方"
    affects: "毕业级 L4 验证"

# ============================================================
# Conan 配方元数据（超模板）
# ============================================================

conan_recipe: conanfile.py
conandata: conandata.yml
test_package: test_package/
