# test_package/MANIFEST.yml — 上游测试声明
package: pidgin/2.14.14
homepage: "https://pidgin.im/"

# pidgin 没有标准 make check — configure.ac 仅声明 CHECK 模块为可选测试
# (AC_MSG_RESULT([no, testing is disabled]) for libpurple). 我们的 L1 验证
# 集中在 test_package/ 自带的消费者测试。
upstream_check_command: "./configure --help"
upstream_test_in_build: false
upstream_test_command: "N/A (pidgin 2.14.14 has no upstream `make check` target for libpurple)"

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 每条都对应一个 assertion：编译链接 + 调用真实 libpurple API (R34)。
test_package_tests:
  - file: test_pidgin.c
    description: "G1: Compile test_pidgin linking libpurple via find_package(pidgin CONFIG)"
    assertion_count: 1
  - file: test_pidgin.c
    description: "[1] test_version_api: purple_core_get_version() != NULL, PURPLE_MAJOR_VERSION==2"
    assertion_count: 2
  - file: test_pidgin.c
    description: "[2] test_prefs_init_api: purple_prefs_init() + purple_prefs_get_handle() — no runtime init required"
    assertion_count: 1
  - file: test_pidgin.c
    description: "[3] test_glib_integration: GQuark + GMainContext roundtrip"
    assertion_count: 1
  - file: test_pidgin.c
    description: "[4] test_libxml2_shared_lib_runtime: xmlNewParserCtxt + xmlReadMemory negative path"
    assertion_count: 1
  - file: conanfile.py
    description: "G2: Cross-compile via Conan profile + CMakeDeps + CMakeToolchain (R33)"
    assertion_count: 1
  - file: conanfile.py
    description: "G3: Static libpurple.a in conan cache (R26 system-named lib)"
    assertion_count: 1
