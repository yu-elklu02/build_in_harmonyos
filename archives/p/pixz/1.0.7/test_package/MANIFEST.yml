package: pixz/1.0.7
homepage: "https://github.com/vasi/pixz"

upstream_test_in_build: true
upstream_tests:
  - file: test/*.sh
    description: "Upstream pixz shell tests run by make check"
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "pixz text compress/decompress round-trip"
    command: "conan test"

assertion_count: 1
