software: pixz
display: "pixz"
description: "Parallel indexed xz compressor and decompressor"
category: compress
homepage: "https://github.com/vasi/pixz"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools configure needs linux-ohos recognition in config.guess/config.sub."
    - "Upstream configure requires pkg-config modules libarchive and liblzma."
    - "Conan xz package exports xz.pc, so recipe creates liblzma.pc alias for pixz configure."
    - "make check needs pixz and xz runtime paths in PATH/LD_LIBRARY_PATH."
  common_dependencies:
    - "libarchive/3.8.7"
    - "xz/5.6.2"

versions:
  "1.0.7":
    status: adapting
    build_date: "2026-08-17"
