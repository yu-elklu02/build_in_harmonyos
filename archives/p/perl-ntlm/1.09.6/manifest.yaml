software: perl-ntlm

version: "1.09.6"
status: built
build_date: "2026-06-29"
conan_ref: "perl-ntlm/1.09.6@ohpcd/stable"

source:
  url: "https://cpan.metacpan.org/authors/id/N/NB/NBEBOUT/NTLM-1.09.tar.gz"
  sha256: "c823e30cda76bc15636e584302c960e2b5eeef9517c2448f7454498893151f85"
  tar_format: tar.gz

build:
  system: perl
  configure_options:
    - "perl Makefile.PL"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker 构建: perl Makefile.PL + make + make install DESTDIR"
  - "Conan 2 中 deps_cpp_info 已废弃，需使用 self.dependencies[name].package_folder"
  - "os.path.join 与绝对路径参数会导致 src==dst，需避免"
  - "Conan package() 使用 blib/lib 目录直接 copy 替代 make install DESTDIR"
  - "test_package Perl -e 命令需使用 shell 单引号防止 $ 变量被 shell 展开"
  - "纯 Perl 模块无 .so 文件，不受 SELinux HMDFS 限制，可在用户目录直接加载"
