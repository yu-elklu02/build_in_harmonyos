# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-ntlm/1.09.6
homepage: https://metacpan.org/dist/NTLM

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# make test 实际运行的测试程序
upstream_tests:
  - file: t/01_load.t
    source: NTLM-1.09.tar.gz/t/01_load.t
    description: "模块加载测试"
    command: "perl t/01_load.t"
  - file: t/02_ntlm.t
    source: NTLM-1.09.tar.gz/t/02_ntlm.t
    description: "NTLMv1 认证流程测试 (12 assertions: user/domain/password 设置 + Type1/Type3 消息生成 + challenge 解码)"
    command: "perl t/02_ntlm.t"
  - file: t/03_oo.t
    source: NTLM-1.09.tar.gz/t/03_oo.t
    description: "OO 接口测试"
    command: "perl t/03_oo.t"
  - file: t/04_v2.t
    source: NTLM-1.09.tar.gz/t/04_v2.t
    description: "NTLMv2 认证流程测试 (9 assertions: Type1/Type3 消息生成 + challenge 解码)"
    command: "perl t/04_v2.t"
  - file: t/99_pod.t
    source: NTLM-1.09.tar.gz/t/99_pod.t
    description: "POD 文档测试 (跳过: 需要 Test::Pod)"
    command: "perl t/99_pod.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Perl 模块加载 + 版本验证 (perl -MAuthen::NTLM)"
    command: "perl -I<lib> -MAuthen::NTLM -e 'print $Authen::NTLM::VERSION'"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 34 subtests + test_package: 1 assertion
assertion_count: 35
