software: perl-ntlm
display: "Perl NTLM (Authen::NTLM)"
description: "Perl module for NTLM (NT LAN Manager) authentication protocol"
category: network
homepage: "https://metacpan.org/dist/NTLM"
license: "Artistic-1.0 OR GPL-1.0-or-later"
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C 编译器，使用 ExtUtils::MakeMaker 构建"
    - "使用 perl Makefile.PL + make + make install 构建流程"
    - "Conan 打包使用 blib/lib 目录直接 copy，避免 DESTDIR 路径问题"
    - "test_package 使用 VirtualRunEnv 生成器，非 CMake"
    - "Perl -e 命令需使用单引号防止 shell 变量展开"
  common_dependencies:
    - "Perl 5.x (系统自带)"
    - "MIME::Base64 (Perl 核心模块)"
    - "Digest::HMAC_MD5 (Perl 核心模块)"

versions:
  "1.09.6":
    status: built
    build_date: "2026-06-29"
    conan_ref: "perl-ntlm/1.09.6@ohpcd/stable"
