software: pngcrush
# 版本级 manifest
# 文件位置: archives/p/pngcrush/1.8.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.8.13"
status: built
build_date: "2026-07-15"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/pmt/pngcrush/1.8.13/pngcrush-1.8.13.tar.xz"
  sha256: "8fc18bcbcc65146769241e20f9e21e443b0f4538d581250dce89b1e969a30705"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "-f Makefile"
    - "CC=/data/service/hnp/bin/clang"
    - "LD=/data/service/hnp/bin/clang"
    - "-j1"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - ref: E081
    note: "Plain Makefile project with bundled libpng-1.6.32 + zlib-1.2.11, no configure/autotools; built as a single static executable (no external shared deps)"
  - ref: E081
    note: "Default Makefile enables INTEL SSE, MIPS MSA and POWERPC VSX intrinsics simultaneously; the unified libpng build #includes the matching filter_*.c, which fail to compile on aarch64 - patch comments out all but ARM NEON"
  - ref: E082
    note: "HarmonyOS requires ELF signing for binary execution; signing is guarded on tool availability so the local container can still build/run"
