# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pngcrush/1.8.13
homepage: "https://pmt.sourceforge.io/pngcrush/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# test.c 由 test_package/conanfile.py 的 build() 编译为 ./test 并在 test() 中执行
test_package_tests:
  - file: test.c
    description: "C 功能测试: 写入 PNG → 调 pngcrush 无损重压缩 → 校验输出 PNG 签名"
    command: "./test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
