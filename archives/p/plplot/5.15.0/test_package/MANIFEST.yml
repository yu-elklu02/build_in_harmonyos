package: plplot/5.15.0
homepage: "https://plplot.sourceforge.net/"

upstream_check_command: "ctest -R 'examples_c|examples_cxx'"
upstream_test_in_build: true
upstream_test_command: "ctest -R 'examples_c|examples_cxx'"
upstream_tests:
  - name: "examples_c"
    description: "Run upstream C examples through the PLplot test driver using the psc file device"
    expected_assertions: 1
  - name: "examples_cxx"
    description: "Run upstream C++ examples through the PLplot test driver using the psc file device"
    expected_assertions: 1

test_package_tests:
  - file: test.cpp
    description: "Compile and run a C++ consumer that checks the C API version and C++ plstream wrapper"
    command: "test_plplot"

assertion_count: 4
