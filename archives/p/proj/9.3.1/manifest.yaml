build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTING=OFF"
    - "-DENABLE_TIFF=OFF"
    - "-DENABLE_CURL=OFF"
    - "-DBUILD_PROJSYNC=OFF"
    - "-DNLOHMANN_JSON_ORIGIN=internal"
    - "-DCMAKE_C_FLAGS=-fPIC -O2 -fuse-ld=bfd"
    - "-DCMAKE_CXX_FLAGS=-fPIC -O2 -fuse-ld=bfd"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sqlite3/3.49.1

  # 编译器
  cc: clang
  cxx: clang++

