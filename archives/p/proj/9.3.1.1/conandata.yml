sources:
  # Prefer GitHub/ghfast mirrors — Worker may time out on download.osgeo.org.
  url:
    - "https://github.com/OSGeo/PROJ/releases/download/9.3.1/proj-9.3.1.tar.gz"
    - "https://github.com/OSGeo/PROJ/releases/download/9.3.1/proj-9.3.1.tar.gz"
    - "https://download.osgeo.org/proj/proj-9.3.1.tar.gz"
  sha256: "b0f919cb9e1f42f803a3e616c2b63a78e4d81ecfaed80978d570d3a5e29d10bc"

# googletest for BUILD_TESTING — downloaded at build time (do NOT vendor
# the .tar.gz in git: GitCode PR .diff cannot apply binary patches).
googletest:
  url:
    - "https://github.com/google/googletest/archive/refs/tags/release-1.11.0.tar.gz"
    - "https://github.com/google/googletest/archive/refs/tags/release-1.11.0.tar.gz"
  sha256: "b4870bf121ff7795ba20d20bcdd8627b8e088f2d1dab299a031c1034eddc93d5"

patches:
  # Builtins (proj=gie test, Test #3): Vandg roundtrip numerical deviation
  # on aarch64 with clang is 0.32 mm; upstream tolerance hard-codes 0.25 mm
  # in builtins.gie. Relax to 0.5 mm to cover both Vandg +a=6400000 and
  # +a=6400000 +over variants with safety margin.
  - patch_file: "patches/0001-fix-builtins-vandg-tolerance.patch"
    patch_description: "Relax Vandg roundtrip tolerance 0.25mm→0.5mm (aarch64 numerical precision)"
    patch_type: "upstream_test_fix"
  # test/cli/testvarious: test "cs2cs (grid missing) with only_best_default=on
  # in proj.ini" writes proj.ini to the script's cwd and then runs cs2cs with
  # PROJ_DATA=$PWD:$PROJ_DATA. Under ctest on HMDFS, getcwd() in the test's
  # bash subprocess fails so $PWD is empty and PROJ_DATA becomes ":"+for_tests.
  # Fix: write proj.ini under ${PROJ_TEST_TMPDIR:-${TMPDIR:-${HOME}/tmp}} and
  # use that absolute dir in PROJ_DATA. conanfile injects PROJ_TEST_TMPDIR.
  - patch_file: "patches/0002-fix-testvarious-pwd-vs-pwd.patch"
    patch_description: "testvarious: proj.ini via PROJ_TEST_TMPDIR (HMDFS cwd broken under ctest)"
    patch_type: "upstream_test_fix"
  # test/cli/testprojinfo: PROJ_AUX_DB test creates tmp_projinfo_aux.db in cwd
  # via sqlite3 then sets PROJ_AUX_DB to the relative path. Under ctest on
  # HMDFS, libproj.so sqlite3_open_v2(relative) fails. Fix: place the aux db
  # under ${PROJ_TEST_TMPDIR:-${TMPDIR:-${HOME}/tmp}} (injected by conanfile).
  - patch_file: "patches/0003-fix-testprojinfo-aux-db-path.patch"
    patch_description: "testprojinfo: aux db via PROJ_TEST_TMPDIR (HMDFS cwd broken under ctest)"
    patch_type: "upstream_test_fix"
  # test/cli/testprojinfo: upstream uses GNU BRE `\|` alternation. toybox grep
  # keeps those patterns on its literal "fast path" (\\| → match '|'), so
  # --list-crs | grep "A\\|B" returns empty. Patterns that force the regex
  # path (e.g. with '(') may still match via libc. Fix: run grep -E with
  # portable ERE `|` (works for both GNU and toybox). Echo lines kept
  # verbatim so testprojinfo_out.dist still matches.
  - patch_file: "patches/0004-fix-testprojinfo-grep-E.patch"
    patch_description: "testprojinfo: grep -E portable alternation (toybox rejects GNU BRE \\|)"
    patch_type: "upstream_test_fix"
