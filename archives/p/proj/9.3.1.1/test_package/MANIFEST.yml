# test_package/MANIFEST.yml — CI L0e
package: proj/9.3.1.1
homepage: https://proj.org/

# 与 glib 一致：交叉环境 BUILD_TESTING=OFF，build() 仍调用空套件 ctest 留门禁痕迹。
# 完整上游套件在原生 OHOS 上改 BUILD_TESTING=ON（vendored googletest 见 cmake/）。
upstream_test_in_build: true
upstream_check_command: "ctest"
upstream_test_command: "ctest"
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "proj_info / proj_create_crs_to_crs(EPSG:4326) + dlopen libproj.so"
    command: "./test_probe"

assertion_count: 2
