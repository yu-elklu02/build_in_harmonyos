software: proj
display: "PROJ"
description: "Cartographic projections and coordinate transformation library"
category: geo
homepage: "https://proj.org/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "PROJ 需要 sqlite3 命令在构建期生成 proj.db，同时需要 sqlite3 目标库参与链接"
    - "首版 Conan 固化关闭 TIFF/CURL/projsync，先交付核心库和常用坐标转换命令"
    - "使用静态 libproj 避免 OpenHarmony 上 $ORIGIN/../lib RPATH 解析问题"
  common_dependencies:
    - sqlite3/3.49.1

versions:
