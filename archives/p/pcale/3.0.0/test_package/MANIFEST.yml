# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcale/3.0.0
homepage: "https://github.com/Alex-Pennington/PC-ALE"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --verbose"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_fsk_core.cpp
    source: PC-ALE-913edbd/tests/test_fsk_core.cpp
    description: "8-FSK Modem Core tests (Phase 1)"
    command: "./test_fsk_core"
  - file: tests/test_protocol.cpp
    source: PC-ALE-913edbd/tests/test_protocol.cpp
    description: "Protocol parser tests (Phase 2)"
    command: "./test_protocol"
  - file: tests/test_state_machine.cpp
    source: PC-ALE-913edbd/tests/test_state_machine.cpp
    description: "Link State Machine tests (Phase 3)"
    command: "./test_state_machine"
  - file: tests/test_aqc_parser.cpp
    source: PC-ALE-913edbd/tests/test_aqc_parser.cpp
    description: "AQC-ALE parser tests (Phase 4)"
    command: "./test_aqc_parser"
  - file: tests/test_aqc_crc.cpp
    source: PC-ALE-913edbd/tests/test_aqc_crc.cpp
    description: "AQC-ALE CRC validation tests (Phase 4)"
    command: "./test_aqc_crc"
  - file: tests/test_fs1052_frames.cpp
    source: PC-ALE-913edbd/tests/test_fs1052_frames.cpp
    description: "FS-1052 frame formatting tests (Phase 5)"
    command: "./test_fs1052_frames"
  - file: tests/test_fs1052_arq.cpp
    source: PC-ALE-913edbd/tests/test_fs1052_arq.cpp
    description: "FS-1052 ARQ state machine tests (Phase 5)"
    command: "./test_fs1052_arq"
  - file: tests/test_lqa_database.cpp
    source: PC-ALE-913edbd/tests/test_lqa_database.cpp
    description: "LQA database tests (Phase 6)"
    command: "./test_lqa_database"
  - file: tests/test_lqa_metrics.cpp
    source: PC-ALE-913edbd/tests/test_lqa_metrics.cpp
    description: "LQA metrics collection tests (Phase 6)"
    command: "./test_lqa_metrics"
  - file: tests/test_lqa_analyzer.cpp
    source: PC-ALE-913edbd/tests/test_lqa_analyzer.cpp
    description: "LQA channel analysis tests (Phase 6)"
    command: "./test_lqa_analyzer"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：验证 MessageAssembler 创建和基本 API 调用"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 9 个测试套件共 91 个断言 (fsk_core/protocol/state_machine/aqc_parser/aqc_crc/fs1052_frames/fs1052_arq/lqa_database/lqa_metrics/lqa_analyzer)
# + test_package 3 个隐式断言 (MessageAssembler 创建/独立默认构造/不抛异常)
assertion_count: 94
