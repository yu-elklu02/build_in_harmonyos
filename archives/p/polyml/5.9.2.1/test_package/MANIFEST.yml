package: polyml/5.9.2.1
homepage: https://polyml.org/
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests:
  - type: regression
    count: 273
    framework: "Poly/ML Tests/RunTests.sml"
    description: "202 个预期成功文件与 71 个预期静态失败文件"
test_package_tests:
  - file: test_static.cpp
    description: "通过 CMakeDeps 生成的 polyml::polyml target 编译链接 libpolymain + libpolyml，并运行检查运行时版本号"
    command: "cmake --build build && ./polyml_static_consumer"
  - file: test_polyml.ML
    description: "运行安装后的 poly，验证算术、datatype/pattern、IntInf 和高阶列表处理"
    command: "/usr/bin/sh test_polyml.sh <package>/bin/poly test_polyml.ML"
  - file: arm64_save_set_regression.ML
    description: "运行安装后的 poly 执行 ARM64 GC save set 回归（0002-arm64-allocate-live-save-registers.patch）：跨分配密集列表构造保留 tagged 值并校验 checksum"
    command: "/usr/bin/sh test_polyml.sh <package>/bin/poly arm64_save_set_regression.ML"
assertion_count: 6
