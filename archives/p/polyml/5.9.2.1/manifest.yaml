version: 5.9.2.1
status: built
conan_ref: polyml/5.9.2.1
source:
  url: https://github.com/polyml/polyml/archive/refs/tags/v5.9.2.tar.gz
  sha256: 5cf5f77767568c25cf880acc2d0a32ee3d399e935475ab1626e8192fc3b07390
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
  - --disable-shared
  - --enable-static
  - --without-gmp
  - --without-x
  dependencies:
  - automake/1.18
  - libtool/2.5.4
  cc: clang
  cxx: clang++
patches_applied:
- 0001-ohos-autotools-platform-and-tmpdir.patch
- 0002-arm64-allocate-live-save-registers.patch
knowledge_gained:
- HarmonyOS 的 /tmp 只读，运行时临时文件需优先使用 TMPDIR
- alternate signal stack 需由拥有者线程注销后再释放
- pathname AF_UNIX bind 在当前用户沙盒返回 EPERM
- ARM64 GC save set 中尚未分配的 tagged PReg 必须通过同一冲突感知分配器建立 GenReg 映射
