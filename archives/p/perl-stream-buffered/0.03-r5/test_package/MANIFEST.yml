# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-stream-buffered/0.03-r5
homepage: "https://metacpan.org/dist/Stream-Buffered"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/print.t
    source: Stream-Buffered-0.03/t/print.t
    description: "测试 Stream::Buffered 的 print/size/rewind 基本功能"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/print.t"
  - file: t/subclass.t
    source: Stream-Buffered-0.03/t/subclass.t
    description: "测试 Stream::Buffered 子类化功能"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/subclass.t"
  - file: t/release-pod-syntax.t
    source: Stream-Buffered-0.03/t/release-pod-syntax.t
    description: "POD 语法检查（release 测试，通常 skipped）"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/release-pod-syntax.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试：验证 Stream::Buffered 模块可加载并执行 print/size/rewind 操作"
    command: "conan create . --build=missing"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
