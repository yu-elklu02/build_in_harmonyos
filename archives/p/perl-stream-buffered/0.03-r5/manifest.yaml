software: perl-stream-buffered
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.03-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.03-r5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DO/DOY/Stream-Buffered-0.03.tar.gz"

  # 源码校验和
  sha256: "9b2d4390b5de6b0cf4558e4ad04317a73c5e13dd19af29149c4e47c37fb2423b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 扩展）在鸿蒙平台编译无需任何特殊处理，ExtUtils::MakeMaker 完全兼容"
  - "conanfile.py 的 package() 方法需要将 .pm 文件从 DESTDIR 路径复制到标准 lib/ 目录，确保 Conan G4 产物完整性检查通过"
  - "纯 Perl 模块使用 settings = ('os', 'arch') 即可，无需 compiler 设置"
  - "与 perl-dbd-pg (XS 模块) 不同，纯 Perl 模块不涉及 CRT 文件缺失、SELinux/HMDFS 限制等问题"
  - "Stream::Buffered API: new($length) 接受数字参数选择后端（PerlIO/File/Auto），非后端名称字符串"
