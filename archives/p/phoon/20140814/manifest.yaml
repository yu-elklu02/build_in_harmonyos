# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.acme.com/software/phoon/phoon_14Aug2014.tar.gz"

  # 源码校验和
  sha256: "bad9b5e37ccaf76a10391cc1fa4aff9654e54814be652b443853706db18ad7c1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项（纯Makefile项目，通过补丁修改Makefile实现适配）
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2 -DOS_BSD -ansi -pedantic -U__STRICT_ANSI__"
    - "LDFLAGS=(空，原版-s已移除)"
    - "DESTDIR模式: --prefix=$DEFAULT_PREFIX + DESTDIR=$TEST_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 仅依赖系统 libc (musl) 和 libm

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Makefile项目无configure脚本，需手动修改Makefile适配平台"
  - "原版Makefile无DESTDIR支持，需修改install目标添加DESTDIR变量"
  - "原版LDFLAGS=-s会提前strip，移除后由打包流程统一处理"
  - "phoon仅支持特定日期格式(DD Mon YYYY)，ISO格式不被接受"
  - "系统无cc命令，需将CC=cc改为CC=clang"

