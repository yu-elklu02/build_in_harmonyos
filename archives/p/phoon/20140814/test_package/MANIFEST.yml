# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: phoon/20140814
homepage: "https://www.acme.com/software/phoon/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (phoon has no upstream test suite)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_phoon.c
    description: "Run phoon binary and verify moon phase output contains 'Moon'"
    command: "./test_phoon"

# 测试断言总数
assertion_count: 2
