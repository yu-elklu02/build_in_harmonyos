package: pass-otp/1.2.0
homepage: "https://github.com/tadfisher/pass-otp"

# pass-otp is a password-store shell extension. The upstream repository does
# not provide a standalone test target in the release artifact used here.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: check_pass_otp.sh
    description: "Verify the packaged otp.bash extension exists, passes bash syntax validation, and exposes cmd_otp"
    command: "bash check_pass_otp.sh <otp.bash>"

assertion_count: 3
