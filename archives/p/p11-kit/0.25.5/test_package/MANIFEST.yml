# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: p11-kit/0.25.5
homepage: "https://github.com/p11-glue/p11-kit"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 说明: build() 末尾执行 `make check`（见 conanfile.py build()），但 OHOS 环境固有失败
# （getauxval/secure_getenv/setuid/TAP 计数等 62 项）不阻塞打包，结果仅记录到日志。
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test-messages.c
    source: p11-kit-0.25.5/p11-kit/test-messages.c
    description: "p11-kit 消息/错误处理单元测试"
    command: "./p11-kit/test-messages"
  - file: test-compat.c
    source: p11-kit-0.25.5/p11-kit/test-compat.c
    description: "兼容层测试（getauxval/secure_getenv 在 musl 上环境固有失败）"
    command: "./p11-kit/test-compat"

# test_package 中自带的测试 (消费者视角验证)
# R34 反空壳: dlopen 被测包 .so + dlsym 真实导出符号（p11_kit_modules_load 等）
test_package_tests:
  - file: test.c
    description: "dlopen libp11-kit.so + dlsym p11_kit_modules_load/p11_kit_message/p11_kit_config_option（R34 反空壳）"
    command: "./test_probe"

# 测试断言总数 (test_package 实际执行的断言: 3 个符号检查)
assertion_count: 3
