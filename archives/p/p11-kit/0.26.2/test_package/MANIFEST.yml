package: p11-kit/0.26.2
homepage: "https://github.com/p11-glue/p11-kit"

upstream_check_command: "meson test -C <build> --print-errorlogs test-version test-uri test-rpc test-rpc-message"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build> --print-errorlogs test-version test-uri test-rpc test-rpc-message"

upstream_tests:
  - file: test-version.c
    source: p11-kit/test-version.c
    description: "Compile-time and runtime version checks"
    command: "meson test test-version"
  - file: test-uri.c
    source: p11-kit/test-uri.c
    description: "PKCS#11 URI parsing and formatting"
    command: "meson test test-uri"
  - file: test-rpc.c
    source: p11-kit/test-rpc.c
    description: "RPC client and server call handling"
    command: "meson test test-rpc"
  - file: test-rpc-message.c
    source: p11-kit/test-rpc-message.c
    description: "RPC message encoding, decoding, and bounds checks"
    command: "meson test test-rpc-message"

test_package_tests:
  - file: test.c
    description: "Consumer links the exported CMake target and exercises version and URI APIs"
    command: "./test_package"

assertion_count: 11
