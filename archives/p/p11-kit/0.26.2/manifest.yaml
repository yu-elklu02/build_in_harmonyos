version: "0.26.2"
software: p11-kit
status: built
build_date: "2026-08-12"
build_system: meson

source:
  url: "https://github.com/p11-glue/p11-kit/releases/download/0.26.2/p11-kit-0.26.2.tar.xz"
  sha256: "09fd9f44da4813a3141e73d5e7cf7008e5660d0405f13d56c15e1da9dcecf828"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dlibexecdir=libexec"
    - "-Dhash_impl=internal"
    - "-Denv_override_paths=enabled"
    - "-Dlibffi=disabled"
    - "-Dclosures=64"
    - "-Dtrust_module=disabled"
    - "-Dsystemd=disabled"
    - "-Dtest=true"
  dependencies: []
  cc: clang
  cxx: none

patches_applied:
  - "0001-run-shell-scripts-via-sh.patch"
  - "0002-export-check-version.patch"
knowledge_gained:
  - "The core library can use precompiled closures and has no required third-party dependencies"
  - "Private server commands are excluded and owned by the p11-kit-server package"
  - "Shared-object aliases are materialized when the device filesystem cannot create links"
  - "p11_kit_check_version must be added to the upstream LIBP11_KIT_1.0 symbol map"
  - "The OHOS SDK llvm/lib must precede ambient library paths so lld loads its matching libxml2.so.16"

test_results:
  type: shadow_ci
  total: 5
  passed: 5
  failed: 0
  reason: "Four focused upstream Meson tests and the Conan consumer test package passed on a HarmonyOS aarch64 device"
