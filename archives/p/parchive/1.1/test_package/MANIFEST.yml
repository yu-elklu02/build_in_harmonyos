package: "parchive/1.1"
homepage: "https://parchive.sourceforge.net/"
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test.sh
    description: "Creates a PAR archive, asserts its recovery volume, and verifies it with par check."
    command: "par add -n1 archive.par input.txt && test -f archive.P01 && par check archive.par"
assertion_count: 3
