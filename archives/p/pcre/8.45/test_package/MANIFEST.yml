# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcre/8.45
homepage: "https://www.pcre.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: pcrecpp_unittest
    source: pcre-8.45/pcrecpp_unittest.cc
    description: "C++ wrapper unit tests"
    command: "./pcrecpp_unittest"
  - file: pcre_scanner_unittest
    source: pcre-8.45/pcre_scanner_unittest.cc
    description: "Scanner unit tests"
    command: "./pcre_scanner_unittest"
  - file: pcre_stringpiece_unittest
    source: pcre-8.45/pcre_stringpiece_unittest.cc
    description: "StringPiece unit tests"
    command: "./pcre_stringpiece_unittest"
  - file: RunTest
    source: pcre-8.45/RunTest
    description: "Main PCRE library test suite"
    command: "./RunTest"
  - file: RunGrepTest
    source: pcre-8.45/RunGrepTest
    description: "pcregrep test suite"
    command: "./RunGrepTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: compile regex, match, capture groups, version check"
    command: "./test_pcre"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
