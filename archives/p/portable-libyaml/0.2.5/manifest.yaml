software: portable-libyaml
# 版本级 manifest
# 文件位置: archives/p/portable-libyaml/0.2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/yaml/libyaml/archive/refs/tags/0.2.5.tar.gz"

  # 源码校验和
  sha256: "fa240dbf262be053f3898006d502d514936c818e422afdcf33921c63bed9bf2e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 需要 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 cmake_minimum_required(VERSION 3.0)"
  - "Autotools 构建受 E046 SELinux 限制阻塞，使用 CMake 构建替代"
  - "Conan CMakeDeps 生成的 target 名为 yaml（非 yaml::yaml）"
