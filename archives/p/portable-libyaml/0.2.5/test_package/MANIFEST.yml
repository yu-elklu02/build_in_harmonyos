# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: portable-libyaml/0.2.5
homepage: "https://github.com/yaml/libyaml"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-version.c
    source: portable-libyaml-0.2.5/tests/test-version.c
    description: "Version test - checks yaml_get_version"
    command: "./test-version"
  - file: tests/test-reader.c
    source: portable-libyaml-0.2.5/tests/test-reader.c
    description: "Reader test - checks yaml_parser functionality"
    command: "./test-reader"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 yaml_parser_initialize/scan/delete API"
    command: "./test_portable_libyaml"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
