# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcsc-lite/2.4.0
homepage: "https://pcsclite.apdu.fr/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# pcsc-lite 的 meson 构建未注册 test() 目标 → meson test 报 "No tests defined"
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
# meson.build 无 test() 目标，故未集成；上游自检为 pcsc-wirecheck ABI 检查
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试/自检程序
upstream_tests:
  - file: pcsc-wirecheck-main.c
    source: pcsc-lite-2.4.0/src/pcsc-wirecheck-main.c
    description: "PC/SC wire 协议 ABI 常量自检（无需硬件，输出 Checking ABI... OK）"
    command: "./pcsc-wirecheck"
  - file: pcsc-wirecheck-gen.c
    source: pcsc-lite-2.4.0/src/pcsc-wirecheck-gen.c
    description: "生成 pcsc-wirecheck-dist.c（pcsc-wirecheck 的输入）"
    command: "./pcsc-wirecheck-gen"
  - file: testpcsc.c
    source: pcsc-lite-2.4.0/src/testpcsc.c
    description: "PC/SC unitary test program（需要运行中的 pcscd + 读卡器，本平台不可运行）"
    command: "./testpcsc"

# 本平台不可运行的上游测试（记录原因）
blocked_tests:
  - name: "UnitaryTests/* (SCard*.c / *.py)"
    reason: "需要 pcscd 守护进程 + 智能卡读卡器硬件；且鸿蒙沙箱 AF_UNIX socket bind 返回 EPERM（最小复现确认），pcscd 无法启动"

# test_package 中自带的测试 (消费者视角验证, R34: 真实调用 SCard API)
test_package_tests:
  - file: test.c
    description: "消费者视角: 链接 -lpcsclite 并调用 SCardEstablishContext（无服务时预期返回 SCARD_E_NO_SERVICE=0x8010001D）"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
