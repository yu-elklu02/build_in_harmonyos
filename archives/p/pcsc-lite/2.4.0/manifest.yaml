  sha256: "22307017a99e123dbecb991136783beca07966f1376d74d9ad0004ba5f81c4f1"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - -Dlibsystemd=false
    - -Dlibudev=false
