knowledge_gained:
  - "ref: E258. meson.options 与 meson_options.txt 在手工复制源码树（HMDFS）时符号链接退化为普通文件，meson>=1.5 报错 'both exist, but are not the same file'；conan get() 的 tarfile 提取保留符号链接，配方不受影响"
  - "ref: E077. meson install 重写 rpath 会使链接器自签的 .codesign 失效，安装后必须用 binary-sign-tool 重新签名"
  - "ref: E024. pcscd 守护进程需要 /run/pcscd IPC 目录，且 AF_UNIX socket bind 在鸿蒙沙箱被 EPERM 拒绝，完整端到端测试受平台限制"
  - "ref: E012. meson 在鸿蒙上探测不到归档器（llvm-ar 不在 PATH），需在 conan_meson_native.ini 注入 ar/ranlib 全路径"
  - "ref: reports/test-report.md. pcsc-lite meson 构建未注册 test() 目标，meson test 报 No tests defined；上游自检为 pcsc-wirecheck ABI 检查"

description: "Middleware to access a smart card using SCard API (PC/SC)"
license: GPL-3.0
homepage: "https://pcsclite.apdu.fr/"
features:
  - USB
  - serial
  - libusb
  - filter_names

