# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: physfs/3.2.0
homepage: "https://icculus.org/physfs/"

# 上游测试命令
upstream_check_command: "make check"

# 上游 test_physfs.c 为交互式测试，不适用于 CI 自动化
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带测试（消费者视角：init + 版本验证 + deinit）
test_package_tests:
  - file: test.c
    description: "physfs 初始化 + 版本号验证 + 清理测试"
    command: "./test_physfs"

assertion_count: 3
