# conandata.yml — pagodacf 0.1
# pagodacf = OCaml NAE Core Foundation (Cf) library by James H. Woodyatt.
# Upstream tarball is the Debian "orig" archive, which repackages the
# original Cf 0.10 source distribution. The SHA256 below is the real hash
# of the orig tarball published in the Debian pool.

sources:
  url: "https://ftp-nyc.osuosl.org/debian/pool/main/p/pagodacf/pagodacf_0.10.orig.tar.gz"
  sha256: "0ae3e6afafa28637a2ae2ea7cac29e3f92f9b47d4617f6fea9e739fee7cc9508"

# Patch the upstream Makefile so a missing `.depend` is non-fatal: GNU make
# aborts on `include <missing>` but only warns on `-include <missing>`.  The
# pre-shipped `.depend` hard-codes `/usr/local/lib/ocaml/caml/*.h` absolute
# paths that don't exist on OHOS, so we delete it and regenerate it with the
# host's real OCaml prefix via `make depend` before building.
#
# NOTE: `patches:` must be a YAML **list** (each entry under `- patch_file:`).
# Conan 2's apply_conandata_patches / export_conandata_patches iterate a list;
# a map form is silently ignored and the patch is never applied — which was
# the root cause of `Makefile:237: .depend: No such file or directory` (the
# unpatched `include $(DEPEND_FILE)` aborts make before `depend` can run).
patches:
  - patch_file: "patches/fix-depend-include.patch"
    patch_type: "conan"
    patch_description: "Make `.depend` optional (`-include`) so the build can regenerate it from the host's real OCaml include paths"
  - patch_file: "patches/0002-makefile-no-findlib.patch"
    patch_type: "conan"
    patch_description: "Drop the ocamlfind/findlib wrapper: this recipe's ocaml/4.14.1 toolchain ships the OCaml compiler but not the findlib front-end, so `ocamlfind ocamlc ...` fails with `ocamlfind: inaccessible or not found`. Calls ocamlc/ocamlopt/ocamlmktop/ocamldoc directly with an explicit `-I +unix` include (the exact substitution findlib's `-package unix` performs), and replaces `ocamlfind install/remove cf` with a manual `cp`/`rm` into `$(DESTDIR)/cf` so the library still installs without a findlib registry."
  - patch_file: "patches/0003-legacy-ocaml-int-typedefs.patch"
    patch_type: "conan"
    patch_description: "Restore the OCaml 3.x short integer typedef aliases (uint64/int64/uint32/int32) that cf_*_p.[ch] (2004-era code) uses, but that OCaml 4.14.1's caml/config.h no longer provides (only the C99 uint64_t/int64_t/uint32_t/int32_t remain). Without this, `make default opt` fails with `error: unknown type name 'uint64'; did you mean 'uint64_t'?` in cf_tai64_p.c. The typedef block is inserted into cf_common_p.h after the caml includes, guarded by CF_LEGACY_INT_TYPES against double-definition."
  - patch_file: "patches/0004-ocaml-bytes-string-compat.patch"
    patch_type: "conan"
    patch_description: "Fix OCaml 4.06+ string/bytes type split in cf_seq.ml and cf_message.ml. String.unsafe_set now requires bytes (cf_seq.ml:389 to_substring loop), String.blit requires bytes src/dst (cf_message.ml:58 sub_blit_loop_), and String.create returns bytes (cf_message.ml:79 contents). Convert at the API boundary via Bytes.unsafe_of_string and freeze mutable buffers back to string via Bytes.unsafe_to_string, preserving the pre-4.06 in-place mutation semantics the 2004-era code relies on."
