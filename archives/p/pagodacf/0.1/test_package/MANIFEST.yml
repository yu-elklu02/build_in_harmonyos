package: pagodacf/0.1
homepage: "https://tracker.debian.org/pkg/pagodacf"

# 上游测试套件 — pagodacf 上游自带 TAP 风格自测套件 t/t_cf.ml,
# 由 Makefile 的 `test`/`test.opt` 目标驱动。主配方 build() 通过
# `make -j1 t.cf t-opt.cf` 构建测试二进制，package() 把 t.cf/t-opt.cf/t_cf.ml
# 装到 lib/cf/tests/，test_package 的 test() 运行两个二进制（bytecode 经显式
# ocamlrun 绕过坏 shebang，native 直接执行），13 个测试函数 × 2 模式 = 26 次
# 断言执行，并输出 HMBS_UPSTREAM_TEST_RESULT JSON 标记（discovered/executed/
# passed/failed/skipped 由真机 TAP 输出实时统计，非硬编码）。
#
# 上游测试放在 test_package 而非 build() 末尾的原因：`conan create` 在包已
# 缓存时跳过 build()（R26 真机日志 `pagodacf/0.1: Already installed!`），
# 导致上游测试不执行、HMBS_UPSTREAM_TEST_RESULT 缺失（discovered=0
# executed=0）。test_package 阶段每次 `conan create` 都执行，不受缓存命中
# 影响。
upstream_check_command: "make test test.opt"
upstream_test_in_build: false
upstream_test_command: "ocamlrun t.cf ; ./t-opt.cf (in test_package)"

upstream_tests:
  - file: t/t_cf.ml
    source: pagodacf_0.10.orig.tar.gz:t/t_cf.ml
    description: "上游 TAP 风格自测套件：13 个测试函数（T1..T13），覆盖 Cf_rbtree.Map/Set、Cf_seq、Cf_deque、Cf_dfa、Cf_regex、Cf_parser 等核心数据结构与解析器"
    command: "make -j1 test test.opt"

# 适配后新增的 test_package — 调用真实 Cf API 断言
# test_package_tests 列两条源：
#   - t_pagodacf.ml   真正的 OCaml 测试源（编译+运行由 conanfile.py::test() 驱动，
#                     产出 HMBS_TEST_PACKAGE_RESULT JSON 标记）
#   - run_pagodacf_tests.sh  L0c 接受后缀的 shell 包装（E230 fallback），真实复刻
#                     conanfile.py 编译+运行链，可独立跑；不产 HMBS 标记（避免双源）
test_package_tests:
  - file: t_pagodacf.ml
    description: "Conan test_package：调用 Cf_rbtree.Map/Set、Cf_seq、Cf_deque、Unix.getpid 的真实 API 并断言计算结果，5 个子测试"
    command: "ocamlc -I <cf_libdir> -I +unix -o t_pagodacf unix.cma cf.cma t_pagodacf.ml && ocamlrun t_pagodacf"
  - file: run_pagodacf_tests.sh
    description: "E230 fallback：L0c 接受的 .sh 包装源，真实调 ocamlc 编译 + ocamlrun 运行 t_pagodacf.ml 并解析 TAP；CI L0c 只认 .c/.cpp/.cc/.cxx/.sh/.py，.ml 不在其列故需此包装"
    command: "./run_pagodacf_tests.sh <cf_libdir> <ocaml_pkg>"

assertion_count: 5
