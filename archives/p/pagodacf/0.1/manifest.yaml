# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "pagodacf = OCaml NAE Core Foundation (Cf) 库，作者 James H. Woodyatt；上游 cf-0.10 由 Debian 打包为 pagodacf_0.10.orig.tar.gz"
  - "上游为纯 Makefile + ocamlfind/ocamlmklib 构建，无 configure 脚本；bytecode 产物 cf.cma，native 产物 cf.cmxa"
  - "上游自带 TAP 风格自测套件 t/t_cf.ml，含 13 个测试函数（T1..T13，T14/T15 在源中注释掉），通过 `make test test.opt` 执行，打印 1..13 与 ok N"
  - "Cf 库 API 经 .mli 校验：Cf_rbtree.Map(Set) 函子配 Cf_ordered.Int_order，map 用 nil/replace/search/member/size/delete，deque 用 nil/push/pop/empty/fold/length"
  - "配方依赖 ocaml/4.14.1 提供 ocamlc/ocamlopt/ocamlmklib/ocamldep 工具链；**该 ocaml 配方不含 findlib/ocamlfind**（findlib 是独立 OCaml 项目，上游 ocaml tarball 不带），故 pagodacf 上游 Makefile 的 `ocamlfind ocamlc -package unix` 必须用补丁改写成 `ocamlc -I +unix`（findlib `-package unix` 的等价物），`ocamlfind install/remove cf` 改成手动 `cp`/`rm` 到 `$(DESTDIR)/cf`"
  - "OCaml 4.14.1 上游 `otherlibs/unix/` 经本仓 ocaml 配方 `make install` 装到 `<prefix>/lib/ocaml/unix/`，`ocamlc -I +unix` 可解析 unix.cma/cmxa + .cmi；本仓其他 OCaml 库配方若需 findlib 可复用同一去 findlib 补丁模式"
  - "package 通过 DESTDIR 暂存 `make install` 的产物（去 findlib 后 Makefile 用 `cp` 落文件到 `$(DESTDIR)/cf/`）到 lib/cf"

patch_generation:
