# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pugixml/1.15-r0
homepage: "https://pugixml.org/"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中未集成上游测试（CI 环境无法运行完整的 979 测试）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/main.cpp
    source: pugixml-1.15/tests/main.cpp
    description: "pugixml 上游测试套件（979 个测试用例，已验证通过）"
    command: "./pugixml-check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：解析 XML 字符串并验证节点内容"
    command: "./test_pugixml"

# 测试断言总数
assertion_count: 3