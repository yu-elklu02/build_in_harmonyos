# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: proftpd-mod_radius/1.3.9c
homepage: "https://github.com/proftpd/proftpd"

# 上游测试命令 (make check 无正式测试目标，tests/ 为 perl 集成脚本)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（proftpd 上游测试为 tests/tests.pl perl 集成套件，
# 依赖完整 FTP 服务环境，不适合 DSO 模块适配阶段运行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 mod_radius.so)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 校验 mod_radius.so ELF 有效性与 radius_module 符号"
    command: "sh test.sh"

# 测试断言总数（存在性 + ELF 魔数 + 符号校验）
assertion_count: 3
