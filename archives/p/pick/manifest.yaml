software: pick
display: "pick"
description: "Fuzzy selection tool for the terminal"
category: cli
homepage: "https://github.com/mptre/pick"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools project; ncurses headers are consumed from DEFAULT_PREFIX or bundled headers, with the pick terminfo fallback built from source."
    - "GitHub API asset download is kept as a fallback for release asset download timeouts."
    - "Old config.guess/config.sub scripts are patched through conandata patches for OHOS triplet recognition."
    - "Automake shell tests use a job-local shell on OHOS because system shell shebang execution is denied."
  common_dependencies:
    - ncurses

versions:
  "2.0.2":
    status: built
    build_date: "2026-08-01"
    conan_ref: "pick/2.0.2"
