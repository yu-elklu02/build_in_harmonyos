  - "0002-ohos-autotools-config-scripts.patch"
  - "0003-ohos-test-runner-shell.patch"

knowledge_gained:
  - "Upstream uses Autotools and ncurses/terminfo APIs."
  - "A ncurses Conan recipe is not available in the current local/remote package set, so the recipe uses DEFAULT_PREFIX paths plus a source-built fallback for the terminfo subset used by pick."
  - "GitHub API release asset download works as a fallback when the direct browser download URL times out."
  - "OHOS worker shell shebang execution can be denied for system shell paths; Automake test runners should call the script through a job-local shell."
  - "The source-built terminfo fallback must include the key and numeric capabilities used by upstream pick tests, including khome/kend and tigetnum(cols/lines)."

