patches:
  - patch_file: "patches/0001-use-curses-header-with-tigetstr-caps.patch"
    patch_description: "Use curses.h declarations and tigetstr capability lookups when term.h is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-autotools-config-scripts.patch"
    patch_description: "Patch generated Autotools config scripts for OHOS triplet recognition and worker-compatible temp directory modes"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-test-runner-shell.patch"
    patch_description: "Run Automake tests through CONFIG_SHELL and provide a writable TMPDIR fallback"
    patch_type: "portability"
