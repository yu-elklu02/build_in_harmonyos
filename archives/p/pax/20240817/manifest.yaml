version: "20240817"
software: "pax"
status: "built"
build_date: "2026-08-07"
build_system: "makefile"

source:
  url: "https://launchpadlibrarian.net/744756412/pax_20240817.orig.tar.gz"
  upstream_repository: "https://launchpad.net/pax"
  sha256: "e955d5d3af97aede0a3f463a9a59b83e8d1083aaf142eb6f388c549a7d182e6b"
  tar_format: "tar.gz"

build:
  system: "makefile"
  configure_options:
    - 'CC=<profile compiler>'
    - 'CFLAGS=<build_type flags> -fPIC -Wall -fwrapv'
  dependencies: []

patches:
  - file: "patches/0001-Build.sh.patch"
    type: "portability"
    guard: "none"
    description: "0001 Add fts.c to SRCS list for portable fts implementation"
  - file: "patches/0002-tar.c.patch"
    type: "portability"
    guard: "none"
    description: "0002 Fallback to uid/gid 65534 when nobody user is unavailable"

knowledge_gained:
  - "OHOS lacks fts.h (BSD file tree traversal); added portable fts.c/fts.h implementation"
  - "OHOS has large uids (>2M) that don't fit in ustar header; fallback to 65534 when nobody user not found"
  - "pax uses custom Build.sh script, not autotools"
