# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-specio-library-path-tiny

# 软件描述
description: "Path::Tiny types and coercions for Specio (Pure Perl module)"

# 分类
category: perl

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.05"
    status: built
    build_date: "2026-07-02"
    path: archives/p/perl-specio-library-path-tiny/0.05

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Specio-Library-Path-Tiny

# 源码仓库
repository: https://github.com/houseabsolute/Specio-Library-Path-Tiny

# 许可证
license: Apache-2.0

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl
  - perl-specio (>=0.29)
  - Path::Tiny (>=0.087)
  - Scalar::Util
  - Specio::Declare
  - Specio::Library::Builtins
  - Specio::PartialDump
  - Specio::Exporter

# 编译依赖
build_dependencies:
  - perl (ExtUtils::MakeMaker)
