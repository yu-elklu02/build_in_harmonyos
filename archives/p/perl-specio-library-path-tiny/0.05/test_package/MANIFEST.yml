# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-specio-library-path-tiny/0.05
homepage: https://metacpan.org/dist/Specio-Library-Path-Tiny

# 上游测试命令 (Perl 标准 make test)
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游源码自带的测试 (t/ 目录)
upstream_tests:
  - file: t/00-report-prereqs.t
    description: "前置依赖检查"
    command: "perl -Iblib/lib t/00-report-prereqs.t"
  - file: t/basic.t
    description: "基本类型约束和强制转换测试 (Path/AbsPath/RealPath/File/Dir 等)"
    command: "perl -Iblib/lib t/basic.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_specio_library_path_tiny.pl
    description: "模块加载 + 版本验证 + Path::Tiny 类型约束功能测试"
    command: "perl test_specio_library_path_tiny.pl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
