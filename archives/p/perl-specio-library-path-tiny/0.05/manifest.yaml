software: perl-specio-library-path-tiny
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.05"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Specio-Library-Path-Tiny-0.05.tar.gz"

  # 源码校验和
  sha256: "60df0bb9bcdaeb2c66a078bf6df9954ea4f9433d6cb680889942e542c7c27a51"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译参数
  make_options:
    - "-j1"

  # 平台必需环境变量
  env_vars:
    - "SPECIO_IMPLEMENTATION=PP"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (ExtUtils::MakeMaker)
    - perl-specio/0.53 (Specio, 运行时)
    - Path::Tiny/0.087 (运行时)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
