# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，无需 C/XS 编译，不需要 CRT 链接参数"
  - "Perl EUMM 构建使用 INSTALLDIRS=site 安装到 site_perl 目录"
  - "HarmonyOS SELinux 限制 FIFO，make 需使用 -j1（E074）"
  - "依赖 Specio，需继承 SPECIO_IMPLEMENTATION=PP 环境变量"
  - "PERL5LIB 需包含系统 Perl site_perl 路径以加载运行时依赖"
  - "Path::Tiny 是运行时必需依赖，需系统预装"
