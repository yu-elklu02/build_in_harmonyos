# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-number-bytes-human/0.11-r2
homepage: https://metacpan.org/dist/Number-Bytes-Human

# 纯Perl模块，上游测试通过 make test 执行（207个测试全部通过）
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - name: "t/01-basic.t"
    description: "基本格式化测试"
  - name: "t/02-si.t"
    description: "SI模式测试"
  - name: "t/03-binary.t"
    description: "二进制模式测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_module.sh
    description: "模块加载与版本号验证"
    command: "./test_module.sh"

# 测试断言总数
assertion_count: 1
