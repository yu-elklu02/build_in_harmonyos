software: perl-number-bytes-human
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.11-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.11-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/F/FE/FERREIRA/Number-Bytes-Human-0.11.tar.gz"

  # 源码校验和
  sha256: "5fc79c49b0b40df780479c43696381343e2b6ad1fe52859f60bc65b66ebe6f2c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块编译: 使用 perl Makefile.PL + make 构建，无需C编译器"
  - "Conan配方适配: conan-init默认生成autotools模板，需手动重写为Perl Makefile.PL构建系统"
  - "Conan env参数: Conan 2.x要求env为列表而非字典，改用 os.environ 设置环境变量"
  - "Conan layout: basic_layout导致source和build目录分离，移除layout()方法解决"
  - "PERL_CANARY_STABILITY_NOPROMPT=1: 避免Perl模块安装时的交互式稳定性提示"
  - "SSL证书问题: 鸿蒙环境CA证书不完整，使用 curl -kL 绕过SSL验证下载源码（安全风险: 禁用TLS验证存在中间人攻击风险，conandata.yml中已配置sha256校验作为补偿措施，正式环境应配置正确CA证书）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
