# test_package/MANIFEST.yml
# Upstream test declaration file
# Required by CI (build_and_test.sh L0e)

package: poco/1.14.2
homepage: "https://pocoproject.org"

# Upstream test command (from poco source: ctest or make check)
upstream_check_command: "ctest"

# conanfile.py build() method integrates upstream tests?
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (poco has extensive test suites in each module's testsuite/)
upstream_tests:
  - file: Foundation/testsuite/src/DateTimeTest.cpp
    source: poco-1.14.2/Foundation/testsuite/src/DateTimeTest.cpp
    description: "Foundation DateTime test suite"
    command: "ctest -R DateTimeTest"

# test_package consumer-side test
test_package_tests:
  - file: test.cpp
    description: "Consumer test: verify Poco::DateTime API works"
    command: "./test_poco"

# Test assertion count (approximate)
assertion_count: 3
