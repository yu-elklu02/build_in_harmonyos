  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

