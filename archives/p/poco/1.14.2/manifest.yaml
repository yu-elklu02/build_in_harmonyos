software: poco
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.14.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.14.2"

# 编译状态
# published | built | failed | archived
