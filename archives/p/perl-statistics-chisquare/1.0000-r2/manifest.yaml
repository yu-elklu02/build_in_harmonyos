software: perl-statistics-chisquare
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.0000-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0000-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# 构建系统类型（顶层字段，供 submit 自检 flat parser 读取）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DC/DCANTRELL/Statistics-ChiSquare-1.0000.tar.gz"

  # 源码校验和
  sha256: "255a5a38336d048ddb9077222691e000984e907aae09a4ea695a9cfd49a1ddd0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在鸿蒙平台上可直接编译，无需 C 编译器或 CRT 文件绕过"
  - "test_package 的测试脚本应写入 build folder 而非 tempfile.gettempdir()，避免 /tmp 只读问题 (E002)"
  - "与 XS 模块（如 perl-dbd-pg）不同，纯 Perl 模块无需处理 SELinux HMDFS 限制"
  - "Conan 配方中通过 runenv_info.append_path('PERL5LIB', ...) 管理 Perl 模块搜索路径"
