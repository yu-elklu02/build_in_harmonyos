# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-statistics-chisquare/1.0000-r2
homepage: "https://github.com/DrHyde/perl-modules-Statistics-ChiSquare"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/chisquare.t
    source: perl-statistics-chisquare-1.0000/t/chisquare.t
    description: "上游自带 chi-square 统计测试"
    command: "perl -Iblib/lib -Iblib/arch t/chisquare.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_chisquare.pl
    description: "消费者测试：验证 Statistics::ChiSquare 模块加载和 chisquare() 函数调用"
    command: 'PERL5LIB="$PERL5LIB" perl test_chisquare.pl'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
