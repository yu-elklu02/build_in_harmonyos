# manifest.yaml — perl-server-starter (软件级)
# 遵循 ARCHIVE-SPEC v2.0

software: perl-server-starter
display: "Server::Starter (Perl)"
description: "热部署超级守护进程，通过 prefork + 套接字传递实现服务无停机重启"
category: perl
homepage: "https://github.com/kazuho/p5-Server-Starter"
license: perl_5
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
    - "源码仅含 Build.PL (Module::Build)，需动态生成 Makefile.PL"
    - "无 XS 代码，不受鸿蒙 SELinux .so 加载限制影响"
    - "参考 perl-dbd-pg 编译经验：Module::Build 不可用时生成 Makefile.PL"
    - "conanfile.py package_info() 设置 PERL5LIB 环境变量"
    - "start_server 脚本需 BEGIN 块自定位补丁以在非 conan 环境中找到模块"
  common_dependencies:
    - "perl 5.42.0 (系统预装)"

versions:
  "0.35-r4":
    status: published
    build_date: "2026-06-29"
    conan_ref: "perl-server-starter/0.35-r4@ohpcd/stable"
    source_url: "https://cpan.metacpan.org/authors/id/K/KA/KAZUHO/Server-Starter-0.35.tar.gz"
