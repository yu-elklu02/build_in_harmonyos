software: perl-server-starter
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.35-r4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.35-r4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/K/KA/KAZUHO/Server-Starter-0.35.tar.gz"

  # 源码校验和
  sha256: "676dc0d6cff4648538332c63c32fb88ad09ed868213ea9e62e3f19fad41b9c40"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL (生成式，非源码自带)"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 纯 Perl 模块，无第三方编译依赖

  # 编译器 (纯 Perl 模块，无需 C/C++ 编译器)
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁，conanfile.py 的 package() 和 package_info() 方法内含运行时补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Module::Build 不可用（未安装），需在 conanfile.py build() 中动态生成 Makefile.PL 使用 ExtUtils::MakeMaker（参考 perl-dbd-pg 经验）"
  - "package() 必须使用 os.walk+shutil.copy2 而非 conan copy()，否则 .pm 文件不会出现在顶层 lib 目录"
  - "start_server 脚本需要 BEGIN 块自定位补丁，在非 conan 环境中正确找到 lib/perl5 模块路径"
  - "package_info() 应设置 runenv_info.append_path('PERL5LIB', ...) 而非 subprocess 调用 Perl Config"
  - "纯 Perl 模块无需 C 编译器，conan-verify L4 安全扫描 0 个 ELF 文件"
