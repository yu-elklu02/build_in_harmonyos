# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-server-starter/0.35-r4
homepage: https://github.com/kazuho/p5-Server-Starter

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
# 纯 Perl 模块，make test 依赖 Test::TCP 等未安装的测试框架，仅基础测试可运行

# 上游测试套件 (源码 t/ 目录)
upstream_tests:
  - name: "00-base"
    source: "t/00-base.t"
    description: "模块加载基础测试"
  - name: "08-wait3"
    source: "t/08-wait3.t"
    description: "信号处理和非阻塞 wait"
  - name: "09-guard"
    source: "t/09-guard.t"
    description: "Server::Starter::Guard 功能测试"
  - name: "14-without-port"
    source: "t/14-without-port.t"
    description: "无端口模式测试"

# test_package 中自带的测试
test_package_tests:
  - file: test_server_starter.sh
    description: "Server::Starter 模块加载 + start_server --version + 导出函数验证"
    command: "sh test_server_starter.sh"

# 测试断言总数 (近似值)
assertion_count: 4
