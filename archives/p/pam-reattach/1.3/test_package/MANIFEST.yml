# test_package/MANIFEST.yml — pam-reattach 1.3
package: pam-reattach/1.3
homepage: "https://github.com/fabianishere/pam_reattach"

# 上游源码未提供独立测试套件；CMakeLists.txt 不定义 enable_testing/add_test。
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/main.c
    description: "消费者测试：链接 libreattach 并验证 OHOS stub 返回 ENOTSUP"
    command: "./test_pam_reattach"

# 测试断言总数 (近似值)
assertion_count: 1
