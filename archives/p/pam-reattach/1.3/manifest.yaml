software: pam-reattach
# 版本级 manifest 模板
# 文件位置: archives/p/pam-reattach/1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"

# 构建系统
build_system: cmake

# Conan 引用
conan_ref: "pam-reattach/1.3"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/fabianishere/pam_reattach/archive/refs/tags/v1.3.tar.gz"

  # 源码校验和
  sha256: "b1b735fa7832350a23457f7d36feb6ec939e5e1de987b456b6c28f5738216570"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DENABLE_PAM=OFF"
    - "-DENABLE_CLI=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-include-reattach.h.patch"
  - "0002-src-reattach.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pam-reattach 的核心 reattach_aqua 依赖 Darwin Mach/XPC API，OHOS 无等价 API，无法提供实质功能，仅保留 API 桩并返回 ENOTSUP (knowledge_ref: knowledge/graph/E092.kv)"
  - "该库的 PAM 模块和 CLI 均绑定 macOS Aqua 会话语义，OHOS 包仅发布基础 libreattach API 桩 (knowledge_ref: knowledge/graph/E092.kv)"
  - "⛔ 不满足实质适配要求：该库的核心功能是 macOS 平台特有的会话重连接，OHOS 无对应概念，实质适配不可行"
  - "CMAKE_SYSTEM_NAME 不应硬编码为 Linux，应由 Conan toolchain 根据 settings.os 自动映射（os=OHOS → CMAKE_SYSTEM_NAME=HarmonyOS）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/pam-reattach-1.3.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/pam-reattach-1.3.work
  source_orig_hash: 858dc8e27d6ff411
  source_work_hash: 53742f50cbeb71c0
  generated_at: '2026-07-17T04:24:03'
  patches_count: 2

patch_classification:
