# 版本级 manifest — pstree 23.7
# 遵循 ARCHIVE-SPEC v3.0

version: "23.7"
software: "pstree"

# built = 配方完成、测试用例本地验证通过，尚未由 CI upload 到制品仓
status: built

build_date: "2026-08-08"
build_system: "single_file"

source:
  url: "https://gitlab.com/psmisc/psmisc/-/archive/v23.7/psmisc-v23.7.tar.gz"
  sha256: "8f2526ce7ac6ef4976454cd63095fa10e467ef745cf33dc4f91df0bd7b10b905"
  tar_format: tar.gz

build:
  system: single_file
  configure_options:
    - 'CC=<tools.build:compiler_executables.c>'
    - 'CFLAGS=-O2 -fPIE -DVERSION="23.7"'
    - 'LDFLAGS=-pie -Wl,-z,relro,-z,now'
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "psmisc 的 autotools 构建需要 automake，鸿蒙环境不可用"
  - "pstree.c 可单独编译，仅需 ncursesw 库（curses.h + term.h + libncursesw.a）"
  - "不定义 HAVE_CONFIG_H 可跳过 config.h 依赖，手动定义 VERSION 宏即可"
  - "SELinux/AppArmor 支持默认关闭，不影响编译"
  - "ncurses/6.6 从 OHPCD 制品仓获取，提供静态库 libncursesw.a"
