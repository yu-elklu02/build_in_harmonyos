# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pstree/23.7
homepage: "https://gitlab.com/psmisc/psmisc"

# psmisc uses autotools with a testsuite/ directory (dejagnu), but we compile
# only pstree.c directly (no autotools), so the upstream test suite is not
# applicable.
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_pstree.sh
    description: "运行 pstree --version 验证版本输出正确"
    command: "sh test_pstree.sh <pstree-bin>"
  - file: test_pstree.sh
    description: "运行 pstree -p 验证能读取 /proc 并显示进程树（含 PID）"
    command: "sh test_pstree.sh <pstree-bin>"
  - file: test_pstree.sh
    description: "运行 pstree -p 1 验证能显示指定 PID 的进程树"
    command: "sh test_pstree.sh <pstree-bin>"

# 测试断言总数 (test_pstree.sh 中 check 调用数)
assertion_count: 3
