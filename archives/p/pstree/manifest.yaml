# 软件级 manifest — pstree
# 遵循 ARCHIVE-SPEC v3.0

software: pstree
display: "pstree"
description: "以树状结构显示运行中的进程（来自 psmisc 工具包）"
category: system
homepage: "https://gitlab.com/psmisc/psmisc"
license: GPL-2.0-only

build_system: single_file

ohos_adaptation:
  key_points:
    - "psmisc autotools 构建需要 automake（鸿蒙不可用），采用单文件编译"
    - "pstree.c 仅依赖 ncursesw（curses.h + term.h + libncursesw.a）"
    - "不定义 HAVE_CONFIG_H，跳过 config.h，手动定义 VERSION 宏"
    - "SELinux/AppArmor 支持默认关闭，不影响编译"
    - "ncurses/6.6 从 OHPCD 制品仓获取，静态链接 libncursesw.a"
  common_dependencies:
    - ncurses/6.6

versions:
  "23.7":
    status: built
    build_date: 2026-08-08
