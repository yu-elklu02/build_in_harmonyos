# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-ole-storage_lite/0.24-r0
homepage: "https://metacpan.org/dist/OLE-Storage_Lite"

# 上游测试命令 (Perl 模块使用 make test)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00_load.t
    source: OLE-Storage_Lite-0.24/t/00_load.t
    description: "模块加载测试"
    command: "perl t/00_load.t"
  - file: t/01_date_conversion.t
    source: OLE-Storage_Lite-0.24/t/01_date_conversion.t
    description: "OLE日期转换测试 (198个子测试)"
    command: "perl t/01_date_conversion.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Conan L1 消费者测试 - 验证模块可加载并输出版本号"
    command: 'perl -e "use OLE::Storage_Lite; print OLE::Storage_Lite->VERSION"'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 199
