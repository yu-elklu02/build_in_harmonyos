package: pcre2/10.45.1.1
homepage: "https://www.pcre.org/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - name: pcre2posix_test
    source: pcre2-10.45/src/pcre2posix_test.c
    description: "POSIX wrapper API unit test"
    command: "./pcre2posix_test"
  - name: RunTest
    source: pcre2-10.45/RunTest
    description: "Core 8/16/32-bit PCRE2 regression suite over 29 testinput data sets"
    command: "./RunTest"
  - name: RunGrepTest
    source: pcre2-10.45/RunGrepTest
    description: "pcre2grep integration and regression suite"
    command: "./RunGrepTest"

test_package_tests:
  - file: test.c
    description: "Compile, match, capture, and free through the pcre2-8 consumer API"
    command: "./test_pcre2"

# Three upstream Automake suites plus one consumer result. RunTest internally
# exercises the complete upstream testdata matrix.
assertion_count: 4
