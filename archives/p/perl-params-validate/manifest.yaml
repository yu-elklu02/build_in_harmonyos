# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-params-validate

# 软件描述
description: "Validate method/function parameters (Perl XS module)"

# 分类
category: perl

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "1.31"
    status: built
    build_date: "2026-07-08"
    path: archives/p/perl-params-validate/1.31

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/release/Params-Validate

# 源码仓库
repository: https://github.com/houseabsolute/params-validate

# 许可证
license: Artistic-2.0

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl (>= 5.42.0)
  - musl (C 标准库头文件)

# 编译依赖
build_dependencies:
  - perl (ExtUtils::MakeMaker，随 Perl 核心提供)
  - musl (提供标准 C 库头文件: stdio.h, ctype.h 等)
  - clang (鸿蒙系统编译器)
