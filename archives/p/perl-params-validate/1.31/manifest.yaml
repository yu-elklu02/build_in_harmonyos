software: perl-params-validate
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.31/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.31"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶层字段，G4门禁检查）
build_system: perl-makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Params-Validate-1.31.tar.gz"

  # 源码校验和
  sha256: "1bf2518ef2c4869f91590e219f545c8ef12ed53cf313e0eb5704adf7f1b2961e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (ExtUtils::MakeMaker)
    - musl/1.2.x (C 标准库头文件)
    - clang (鸿蒙编译器)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无外部补丁文件
# conanfile.py 在 build() 中生成 Makefile.PL 并手动编译 XS（内联 clang 标志）
patches_applied:
  - "Makefile.PL: conanfile.py 内联生成 (源码仅有 Build.PL, Module::Build 在 CI 不可用)"
  - "XS 编译: 内联 clang -shared -nostartfiles -nodefaultlibs -lc 修复 E137 CRT 缺失"
  - "XS 编译: 内联 -I musl 头文件路径"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl 5.42.0 on OHOS 的 lddlflags 包含 -fstack-protector-strong (E137)"
  - "Module::Build 不在 CI worker Perl 安装中，需改用 ExtUtils::MakeMaker (Makefile.PL)"
  - "ExtUtils::MakeMaker 自动处理 .xs 文件编译 (xsubpp + cc + ld)"
  - "musl C 库头文件不在默认搜索路径，需通过 INC 添加 -I 参数"
  - "鸿蒙系统库在 /system/lib64，需通过 LDDLFLAGS 的 -L 参数添加"
  - "LDDLFLAGS 添加 -nostartfiles -nodefaultlibs -lc 解决 CRT 缺失问题"
  - "PP 模式功能测试全部通过 (validate, validate_pos, validate_with, 正则约束, 类型检查)"
  - "XS 模式受 SELinux HMDFS 限制，Module::Implementation 自动降级到 PP 模式"
