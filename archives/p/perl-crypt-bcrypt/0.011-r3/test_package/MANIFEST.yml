# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-crypt-bcrypt/0.011-r3
homepage: "https://github.com/Leont/crypt-bcrypt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/basic.t
    source: Crypt-Bcrypt-0.011/t/basic.t
    description: "Basic bcrypt functionality tests"
    command: "perl -Mblib t/basic.t"
  - file: t/compat.t
    source: Crypt-Bcrypt-0.011/t/compat.t
    description: "Compatibility tests"
    command: "perl -Mblib t/compat.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_crypt_bcrypt.c
    description: "Consumer test: link against libBcrypt.so and verify bcrypt hash/check/gensalt C API"
    command: "cmake --build . && ctest"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
