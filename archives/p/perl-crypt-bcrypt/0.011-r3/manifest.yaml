software: perl-crypt-bcrypt
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.011-r3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.011-r3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/L/LE/LEONT/Crypt-Bcrypt-0.011.tar.gz"

  # 源码校验和
  sha256: "67fca68b0526e734e2d95bc6b32bad01c319e587abf63e4cf3422da66bbea3a0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块在 OpenHarmony 上编译成功，但 make test 因 HMDFS dlopen 限制失败"
  - "conanfile.py 需手动改为 Perl Makefile.PL 构建系统（非 autotools）"
  - "test_package 需用文件存在性检查 + 功能测试容错策略应对平台 dlopen 限制"
  - "Crypt::Bcrypt 使用 ExtUtils::MakeMaker，非 Module::Build，不受 E137 影响"
  - "根因确认: musl libc 的 dlopen_config_abs_path_policy 路径策略阻止从 HNP 启动的进程 dlopen HMDFS 上的 .so"
  - "SELinux 阻止 mmap(PROT_EXEC) 文件映射 (HMDFS)，但匿名 mmap(PROT_EXEC) 允许"
  - "C 库 (crypt_blowfish) 16/16 功能测试全部通过，可作为 C 库使用"
  - "Perl XS 模块受平台限制不可用，建议作为 C 库依赖引用"

# 功能测试结果
functional_test:
  date: "2026-07-02"
  c_library: "PASS (16/16)"
  perl_xs_module: "FAIL (platform dlopen restriction)"
  result: "C library usable, Perl XS module not loadable"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
