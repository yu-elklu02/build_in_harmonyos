# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: pgpdump/0.37
homepage: "https://github.com/kazu-yamamoto/pgpdump"

# pgpdump 上游无 make check 目标；源码 data/ 目录包含手动验证样例。
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: null
upstream_tests:
  - file: "data/pub"
    source: "pgpdump-0.37/data/pub"
    description: "OpenPGP public key sample; manual validation via pgpdump -u data/pub"
    command: "pgpdump -u data/pub"
  - file: "data/enc"
    source: "pgpdump-0.37/data/enc"
    description: "Encrypted OpenPGP sample; manual validation via pgpdump data/enc"
    command: "pgpdump data/enc"

test_package_tests:
  - file: "test_pgpdump.sh"
    description: "通过 bash 执行 pgpdump -v 验证二进制可运行"
    command: "bash test_pgpdump.sh <pgpdump_bin>"

assertion_count: 1
