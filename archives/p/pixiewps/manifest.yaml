software: pixiewps
display: "Pixiewps"
description: "Offline WPS brute-force utility exploiting low-entropy PRNGs (pixie-dust attack)"
category: security
homepage: "https://github.com/wiire-a/pixiewps"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure Makefile 项目，加密库（libtomcrypt + tomsfastmath）已内置源码树，无外部 Conan 依赖"
    - "仅需系统 pthread（musl libc 内置），无 configure 步骤"
    - "R33: CC 通过 make 命令行变量传递（从 Conan conf 获取），不依赖 shell 环境变量"
    - "R38/E082: 构建产物为可执行二进制，package() 中调用 binary-sign-tool 进行 ELF 签名"
    - "命令行工具，已声明 commands.json（R38）"
  common_dependencies: []

versions:
  "1.4.2":
    status: built
    build_date: "2026-07-27"
