# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pixiewps/1.4.2
homepage: https://github.com/wiire-a/pixiewps

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试套件 (Makefile 无 check/test target)
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "pixiewps -V 版本字符串验证 + -h 用法屏幕验证"
    command: "sh test.sh"

# 测试断言总数
assertion_count: 4
