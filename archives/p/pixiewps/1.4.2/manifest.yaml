version: "1.4.2"
status: built
build_date: "2026-07-27"

source:
  url: "https://github.com/wiire-a/pixiewps/releases/download/v1.4.2/pixiewps-1.4.2.tar.xz"
  tar_format: tar.xz

build:
  system: makefile
  configure_options: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "pixiewps 1.4.2 加密库（libtomcrypt + tomsfastmath）已内置源码树，无外部 Conan 依赖"
  - "纯 Makefile 项目，无 configure 步骤，make 直接构建"
  - "R33: CC 通过 make 命令行变量传递 (从 Conan conf 获取)，不依赖 shell 环境变量"
  - "R38/E082: 构建产物为可执行二进制，package() 中调用 binary-sign-tool 进行 ELF 签名"
  - "上游无自动化测试套件（无 make check/test target），test_package 以 -V/-h 烟雾测试覆盖"
