# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pika/1.14.0
homepage: https://github.com/pikasTech/PikaPython

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游 release tarball 无 test/ 目录 (无正式单测)
# 自补测试写入 test_package/ 和 reports/
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "PikaPython core data-layer API tests (arg_newInt/arg_newStr/Stack/strsCopy/pika_platform_malloc)"
    command: "./test_pika"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
