# conandata.yml — pika (PikaPython) 1.14.0
# Source: GitHub release tag v1.14.0

sources:
  url: "https://github.com/pikasTech/PikaPython/archive/refs/tags/v1.14.0.tar.gz"
  sha256: "920dd983879f3fa1666a04b74a1c7704262273664d3ff8389d225aa9dcba8542"

patches:
  - patch_file: "patches/0001-add-root-cmakelists.patch"
    patch_description: "Add root CMakeLists.txt: upstream v1.14.0 lacks a root CMakeLists (only src/CMakeLists.txt exists); provide one to build src/*.c into static lib pika-core and install headers to include/pika"
    patch_type: "build"
  - patch_file: "patches/0002-fix-clang-label-decl.patch"
    patch_description: "Fix clang error 'expected expression': C does not allow a declaration directly after a label (GCC accepts it, clang rejects); insert null statement after __unpack: label in PikaVM.c. Root cause is a single label-directly-followed-by-declaration; the 9 cascading 'use of undeclared identifier stack_tmp' errors all stem from this one site."
    patch_type: "portability"
