  cxx: clang++

patches_applied:
  - "0001-add-root-cmakelists.patch"
  - "0002-fix-clang-label-decl.patch"

knowledge_gained:
  - "PikaPython 上游 release tarball 无根级 CMakeLists.txt，需补丁补充后按 CMake 构建 pika-core 静态库"
  - "clang 不允许 C 标签后直接声明（GCC 允许），PikaVM.c __unpack: 标签后需插入空语句"
  - "PikaPython 标准库绑定（New_builtins_object 等）由上游 pikaCompiler 从 .pyi 生成，不在 release tarball 内；test_package 用最小桩仅满足静态链接，数据层 API 测试不触碰 VM 路径"
