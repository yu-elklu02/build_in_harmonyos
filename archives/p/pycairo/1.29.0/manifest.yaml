# 版本级 manifest — pycairo 1.29.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.29.0"
software: "pycairo"

# 编译状态: built (真机验证通过未 upload；由 HMBS 门禁后统一更新)
status: built

build_date: "2026-08-11"

# 构建系统 (必填顶层字段)
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/pygobject/pycairo/archive/refs/tags/v1.29.0.tar.gz"
  sha256: "25c6a8a5a488afdd21208b5a71f95796891cceb2ee94f2ec1c51fdf0735eab0b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # meson 构建的 CPython 扩展绑定
  system: meson

  configure_options:
    - "-Dtests=true"
    - "-Dwrap_mode=nodownload"
    - "-Dpython=<HMBS_PYTHON3 或设备 python3>"

  # 编译依赖列表 (格式: name/version)
  dependencies:
    - cairo/1.18.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "pycairo 是 CPython 扩展绑定：meson python.extension_module 产物 _cairo.so + cairo/ 纯 Python 包，用 PYTHONPATH 直接导入"
  - "Python 解释器由设备/HMBS 提供（HMBS_PYTHON3 优先），meson -Dpython=<绝对路径> 锁定；扩展运行依赖 libcairo 需 LD_LIBRARY_PATH 前置 conan 依赖 lib 目录"
  - "上游 pytest 288 用例，3 个 numpy/pygame 门控用例在真机必然 importorskip 跳过（无 aarch64 wheel），按 hmbs 硬门禁以 --ignore 排除并如实声明 excluded_cases，不计入 discovered"
  - "包布局 lib/pythonX.Y/site-packages/cairo/ + include/pycairo/py3cairo.h + lib/pkgconfig/py3cairo.pc；runenv PYTHONPATH 便于 test_package 导入"
