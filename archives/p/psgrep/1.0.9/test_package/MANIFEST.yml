# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: psgrep/1.0.9
homepage: "https://jvz.github.io/psgrep/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "N/A — upstream provides no make check target or test directory"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash -n psgrep && bash -n install.sh && bash install.sh --help (expects usage + exit 1)"

# 上游实际运行的测试程序
upstream_tests:
  - file: psgrep
    source: psgrep-1.0.9/psgrep
    description: "Bash syntax validation for packaged psgrep executable"
    command: "bash -n psgrep"
  - file: install.sh
    source: psgrep-1.0.9/install.sh
    description: "Bash syntax and usage validation for upstream installer"
    command: "bash -n install.sh && bash install.sh --help"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: psgrep help/version, simplified process search, PID-only output validation"
    command: "bash test.sh"
  - file: conanfile.py (inline Python assertions)
    description: "消费者测试: 校验 psgrep -v 返回码/版本文本，以及 psgrep -d 输出格式"
    command: "conan test (psgrep -v, psgrep -n -s, psgrep -d)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
