software: psgrep
display: "psgrep"
description: "Shortcut shell utility for searching the process list with grep"
category: utility
homepage: "https://jvz.github.io/psgrep/"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Bash script package: install script and executable already use #!/usr/bin/env bash"
    - "Runtime relies on system ps, grep, awk and head commands; no compiled objects or Conan library dependencies"
    - "psgrep -v intentionally exits with status 2 after printing version information"
  common_dependencies: []

versions:
  "1.0.9":
    status: built
    build_date: "2026-07-14"
    conan_ref: "psgrep/1.0.9"
