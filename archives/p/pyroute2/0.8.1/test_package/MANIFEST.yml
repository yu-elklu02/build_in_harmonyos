# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pyroute2/0.8.1
homepage: "https://github.com/svinota/pyroute2"

# 上游测试命令 (用于分析)
# cwd=tests; PYTHONPATH=.. 使源码根目录可被 import pyroute2 解析
upstream_check_command: "python3 -m pytest test_unit"
upstream_test_in_build: true
upstream_test_command: >-
  env PYTHONPATH=.. python3 -m pytest test_unit -q
  --deselect tests/test_unit/test_entry_points/test_basic.py::test_exceptions

# TEST_QUALITY_SPEC §3.3 平台限制豁免
# 1 个用例因 AF_NETLINK 套接字不可用而在 OHOS 容器中无法运行
# (详见下方 exempted_tests)
upstream_test_exemption: >-
  tests/test_unit/test_entry_points/test_basic.py::test_exceptions
  opens a real AF_NETLINK socket to verify NetlinkError alias parity
  at runtime. The OHOS worker container has no CAP_NET_ADMIN and no
  AF_NETLINK in the unprivileged harness, so the test raises
  AttributeError: _sproxy at context-manager setup time. Its first
  assertion (E1 == E2 == E3 class identity) needs no socket and is
  independently verified by
  test_package/test_pyroute2.py::test_netlink_error_aliases. The
  AF_NETLINK catch path remains exempt; filtered via pytest
  --deselect in conanfile.py.

exempted_tests:
  - file: tests/test_unit/test_entry_points/test_basic.py
    name: test_exceptions
    reason: >-
      AF_NETLINK socket (ipr.get_links(-1)) requires CAP_NET_ADMIN /
      root privileges that are unavailable in the OHOS worker container.
    evidence: "pytest -v produces:
      AttributeError: _sproxy (pyroute2/netlink/nlsocket.py:1391)"

# 上游实际运行的单元测试 (tests/test_unit，不依赖真机 netlink 写操作)
upstream_tests:
  - file: tests/test_unit/test_common.py
    source: pyroute2-0.8.1/tests/test_unit/test_common.py
    description: "common helpers (hexdump/uuid32/dqn2int)"
    command: "python3 -m pytest test_unit/test_common.py"
  - file: tests/test_unit/test_config.py
    source: pyroute2-0.8.1/tests/test_unit/test_config.py
    description: "kernel version parsing"
    command: "python3 -m pytest test_unit/test_config.py"
  - file: tests/test_unit/test_nlmsg/test_marshal.py
    source: pyroute2-0.8.1/tests/test_unit/test_nlmsg/test_marshal.py
    description: "netlink message marshal/unmarshal"
    command: "python3 -m pytest test_unit/test_nlmsg/"
  - file: tests/test_unit/test_requests/test_link.py
    source: pyroute2-0.8.1/tests/test_unit/test_requests/test_link.py
    description: "request field filters for links/routes/addrs"
    command: "python3 -m pytest test_unit/test_requests/"
  - file: tests/test_unit/test_iproute_match/test_match.py
    source: pyroute2-0.8.1/tests/test_unit/test_iproute_match/test_match.py
    description: "IPRoute match helpers against dumped messages"
    command: "python3 -m pytest test_unit/test_iproute_match/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pyroute2.py
    description: "Import API + NetlinkError aliases + helpers + CLI entry points"
    command: "python3 test_pyroute2.py"

# upstream pytest result on OHOS worker (post-patch, post-deselect)
upstream_pytest_result: >-
  Round 1: 103 discovered, 102 passed, 0 failed, 0 errors,
  1 deselected (test_exceptions) — 100% pass rate among executed

# 测试断言总数 (近似值, 用于质量评估)
# - upstream unit: 102 executed + 1 deselected = 103
# - consumer (test_package): 5
# - total: 108
assertion_count: 108
