# conandata.yml — pyroute2 0.8.1
# Use PyPI sdist (official release) — GitHub tag tarball omits
# pyroute2/config/version.py (gitignored; generated at release time).
sources:
  url: "https://files.pythonhosted.org/packages/4d/04/c9060b6cb024d05467e17ea93d3ca4bd2f3b05deb2372b7f79321640e8ad/pyroute2-0.8.1.tar.gz"
  sha256: "b91f4a1f7abb9824637b1fe67e6e4a0a071d98d4a1a1b47ef792304ff3adad11"

patches:
  - patch_file: "patches/0001-fix-config-kernel-empty.patch"
    patch_description: >-
      config.kernel may be [] when platform.uname().release does not start
      with [0-9.]+ (e.g. OHOS reports 'HongMeng Kernel 1.12.0'); fall back
      to [99, 0, 0] so consumers that index config.kernel[0] do not
      IndexError. Preserves parse_kernel_version('test.10.12') == [].
    patch_type: "portability"
