knowledge_gained:
  - "pyroute2 是纯 Python netlink 库，pip install --prefix 即可打包"
  - "上游单元测试需在 tests/ 目录下执行 pytest test_unit（相对路径加载 dump 文件）"
  - "完整 make test 走 nox 且含 Linux 集成测试；适配使用 test_unit 作为上游官方单元测试"
  - "GitHub tag 不含 config/version.py（gitignore）；应优先用 PyPI sdist 或从 VERSION 生成"
  - "Debian pip --prefix 可能装到 local/lib/.../dist-packages，package() 需归一化布局"
  - "platform.uname() 在 OHOS 容器中返回 'HongMeng Kernel 1.12.0'，使 parse_kernel_version 解析为空 → 需补 0001 补丁保证 config.kernel 非空"
  - "test_exceptions 需要 AF_NETLINK 套接字（CAP_NET_ADMIN）；OHOS worker 容器无权限 → conanfile.py 用 --deselect 豁免，MANIFEST 中声明"

