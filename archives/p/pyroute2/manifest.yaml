software: pyroute2
display: "pyroute2"
description: "Pure Python netlink library (RTNL, nfnetlink, ipset, nftables, …) with CLI tools"
category: network
homepage: "https://github.com/svinota/pyroute2"
license: GPL-2.0-or-later OR Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Python 包，pip install --prefix 打包；无 C/C++ 编译"
    - "优先使用 PyPI sdist（含 config/version.py）；GitHub tag 缺该文件时由配方从 VERSION 生成"
    - "OHOS uname release 非数字开头时 config.kernel 为空，需 0001 补丁回退到 [99,0,0]"
    - "test_exceptions 依赖 AF_NETLINK/CAP_NET_ADMIN，OHOS worker 用 --deselect 豁免；类同一性由 test_netlink_error_aliases 覆盖"
  common_dependencies: []

versions:
  "0.8.1":
    status: built
    build_date: "2026-07-31"
    conan_ref: "pyroute2/0.8.1"
