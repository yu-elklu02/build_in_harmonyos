# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: proxychains-ng/4.16
homepage: "https://github.com/rofl0r/proxychains-ng"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# proxychains-ng has no make check target; tests/ dir contains standalone
# test programs that require network and a running proxy daemon.
upstream_tests:
  - file: tests/test_getaddrinfo.c
    source: proxychains-ng-4.16/tests/test_getaddrinfo.c
    description: "Test getaddrinfo() through proxychains (requires proxy)"
    command: "./test_getaddrinfo"
  - file: tests/test_gethostbyname.c
    source: proxychains-ng-4.16/tests/test_gethostbyname.c
    description: "Test gethostbyname() through proxychains (requires proxy)"
    command: "./test_gethostbyname"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify libproxychains4.so is linkable and dalias_hash() works"
    command: "./test_proxychains_ng"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
