package: pug/0.6.5
homepage: "https://github.com/leg100/pug"

upstream_check_command: "go test -short non-integration packages"
upstream_test_in_build: true
upstream_test_command: "go test -short non-integration packages compiled with -c, signed, and executed directly"

upstream_tests:
  - file: internal/**/*_test.go
    source: "leg100/pug v0.6.5"
    description: "CI-safe short Go unit suite excluding Terraform integration tests and TestConfig, which depends on testing.TempDir using /tmp on OHOS"
    command: "go test -short non-integration packages with TestConfig excluded on OHOS"

test_package_tests:
  - file: conanfile.py
    description: "Runs pug --version and validates the package version"
    command: "conan test"
  - file: version_smoke.sh
    description: "Executes the packaged pug binary and checks the version output"
    command: "pug --version"

assertion_count: 5
