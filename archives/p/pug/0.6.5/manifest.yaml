knowledge_gained:
  - "pug 0.6.5 is a pure Go TUI application; release builds set github.com/leg100/pug/internal/version.Version through ldflags."
  - "The upstream integration package requires a provider mirror plus Terraform/Terragrunt/Infracost tools, so the CI-safe suite uses go test -short semantics and excludes internal/integration."
  - "Use the standard github.com archive URL so CI can apply GitHub mirror fallback; OHOS validation downloaded through gh-proxy with the same SHA256."
  - "TestConfig uses testing.TempDir; with the OHOS Go runtime it still attempts /tmp even when TMPDIR points at ext2, so it is excluded from direct signed test-binary execution."
  - "Upstream test fixture scripts that use #!/usr/bin/env bash are switched to sh inside the copied OHOS Go workspace because the runner does not provide bash."
  - "On OHOS, Go test binaries must be compiled with go test -c, signed, and executed directly instead of relying on go test temporary exec."
