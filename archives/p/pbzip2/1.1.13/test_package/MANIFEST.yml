# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pbzip2/1.1.13
homepage: "https://launchpad.net/pbzip2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# pbzip2 1.1.13 的 Makefile 不包含 check 目标，无上游测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 pbzip2 压缩/解压文件并验证内容完整性"
    command: "pbzip2 -z file && pbzip2 -d file.bz2"
  - file: test_pbzip2.sh
    description: "功能测试：创建文件→压缩→解压→验证内容一致"
    command: "sh test_pbzip2.sh pbzip2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
