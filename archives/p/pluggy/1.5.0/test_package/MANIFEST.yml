package: pluggy/1.5.0
homepage: "https://github.com/pytest-dev/pluggy"

# 上游测试命令 — pluggy 上游使用 pytest
upstream_check_command: "python3 -m pytest testing/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testing/test_hookcaller.py
    source: pluggy-1.5.0/testing/test_hookcaller.py
    description: "上游 pytest 测试 — hook caller 调用/排序/historic"
    command: "python3 -m pytest testing/test_hookcaller.py"
  - file: testing/test_pluginmanager.py
    source: pluggy-1.5.0/testing/test_pluginmanager.py
    description: "上游 pytest 测试 — PluginManager 注册/卸载/blocked"
    command: "python3 -m pytest testing/test_pluginmanager.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 模块导入 + 版本断言 + HookspecMarker/HookimplMarker + PluginManager 1:N hook 调用 + call_historic + tryfirst/trylast 排序 + PluginValidationError"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
