# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pgformatter/5.10
homepage: "https://github.com/darold/pgFormatter"

# 上游测试命令 (pgFormatter 使用 perl make test，依赖测试数据集，不适用于 Conan 测试环境)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01_lint.t
    source: pgFormatter-5.10/t/01_lint.t
    description: "pgFormatter 语法检查测试（需 perl 测试环境）"
    command: "make test"
  - file: t/02_regress.t
    source: pgFormatter-5.10/t/02_regress.t
    description: "pgFormatter 回归测试套件（需测试数据集）"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "烟雾+功能测试：pg_format --version 及格式化一条 SQL"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
