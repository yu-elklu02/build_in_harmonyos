software: prefixsuffix
# 版本级 manifest
# 文件位置: archives/p/prefixsuffix/homebrew/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "0.6.9"

# 编译状态
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/prefixsuffix/0.6/prefixsuffix-0.6.9.tar.xz"
  sha256: "fc3202bddf2ebbb93ffd31fc2a079cfc05957e4bf219535f26e6d8784d859e9b"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-silent-rules"
    - "--disable-schemas-compile"
  dependencies:
    required:
      - "gtkmm-3.0 (missing)"
      - "glibmm-2.4 (missing)"
      - "atkmm-1.6 (missing)"
      - "cairomm-1.0 (missing)"
      - "pangomm-1.4 (missing)"
    optional:
      - "intltool (构建期, 国际化工具)"
      - "gettext (构建期)"
      - "pkg-config (构建期)"
  cc: N/A
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "prefixsuffix 0.6.9 是 GNOME 的 GUI 批量重命名工具，使用 gtkmm3（C++ GTK 绑定）开发"
  - "上游使用 Autotools 构建系统，Release tarball 已预生成 configure/Makefile.in"
  - "CI #3074 中编译器、CONFIG_SHELL 和交叉编译平台检测均通过"
  - "configure 在 PKG_CHECK_MODULES(DEPS, gtkmm-3.0) 处失败"
  - "上游不提供禁用 GUI 或 gtkmm 的构建选项"
  - "仓库和 CI 缺少 gtkmm3 所需的完整 GTK3 C++ 依赖链，当前无法适配"

test_results:
  total: 0
  passed: 0
  failed: 0
  skipped: "configure 失败：缺少 gtkmm-3.0"

failure_reason: "gtkmm-3.0 及其 GTK3 C++ 依赖链缺失，上游不支持无 GUI 构建"
