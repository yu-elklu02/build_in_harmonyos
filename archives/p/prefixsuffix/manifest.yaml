software: prefixsuffix
display: "prefixsuffix"
description: "prefixsuffix - GNOME 桌面环境下的 GUI 批量文件重命名工具，基于 gtkmm3"
category: tools
homepage: "https://github.com/murraycu/prefixsuffix"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游使用 Autotools 构建系统，C++ GUI 应用程序，依赖 gtkmm3（C++ GTK 绑定）"
    - "Homebrew formula 使用 ./configure --disable-silent-rules --disable-schemas-compile + make install 标准流程"
    - "CI #3074 的 configure 阶段确认 OHOS 环境缺少 gtkmm-3.0"
    - "上游不提供禁用 GUI 或 gtkmm 的构建选项"
    - "仓库和 CI 缺少 gtkmm3 所需的完整 GTK3 C++ 依赖链，当前无法适配"
  common_dependencies:
    - "glib-2.0 (pkg-config)"
    - "gtk+-3.0 (pkg-config)"
    - "gtkmm-3.0 (pkg-config)"
    - "glibmm-2.4 (pkg-config)"
    - "atkmm-1.6 (pkg-config)"
    - "cairomm-1.0 (pkg-config)"
    - "pangomm-1.4 (pkg-config)"
    - "libsigc++-2.0 (pkg-config)"

versions:
  "0.6.9":
    status: failed
    build_date: "2026-07-15"
