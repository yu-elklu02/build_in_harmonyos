# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: php/8.5.8
homepage: "https://www.php.net"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (PHP test suite, 13929 tests)
upstream_tests:
  - file: run-tests.php
    source: php-8.5.8/run-tests.php
    description: "PHP 官方测试套件 (13929 个测试)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "执行 php --version 验证 CLI 可执行"
    command: "php --version"
  - file: conanfile.py
    description: "执行 php -r 'var_dump(1+1);' 验证算术运算"
    command: "php -r 'var_dump(1+1);'"
  - file: conanfile.py
    description: "执行 php -r 'var_dump(strtoupper(\"hello\"));' 验证字符串操作"
    command: "php -r 'var_dump(strtoupper(\"hello\"));'"
  - file: test_script.php
    description: "执行 PHP 脚本文件验证数组、字符串操作"
    command: "php test_script.php"
  - file: test_runner.sh
    description: "Shell 包装脚本,集成所有 smoke test"
    command: "bash test_runner.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13929
