# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.5.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.5.8"

# 软件名
software: "php"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-21"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # Note: php.net tarball includes pre-generated Zend scanner/parser files
  # which GitHub tarball lacks (would require re2c otherwise)
  url: "https://www.php.net/distributions/php-8.5.8.tar.gz"

  # 源码校验和
  sha256: "6ebc55e52af4396385e689f7af0f28944fbbf966843433b573e9dc1dc03df539"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-all"
    - "--enable-cli"
    - "--disable-phpdbg"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-config.guess.patch"
  - "0002-build-config.sub.patch"
  - "0003-configure.patch"
  - "0004-main-php_config.h.in.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PHP buildconf --force 必须在打补丁之前运行，否则 configure 补丁会被覆盖"
  - "php.net tar.gz 包含 gen_stub.php 和预生成的 Zend scanner/parser 文件（zend_language_scanner.c 等）"
  - "GitHub tarball 包含完整 build 目录(46个文件)但缺少预生成的 Zend scanner/parser .c 文件，会导致 configure 报 re2c 缺失错误"
  - "configure 中的 umask 077 需要修改为 umask 022（E011），通过 patch 0003 实现"
  - "config.guess 和 config.sub 需要添加 OHOS 平台识别（通过 patch 0001/0002）"
  - "PHP 使用 INSTALL_ROOT 而非 DESTDIR 进行 staging 安装"
  - "build() 方法禁止依赖 SKILL_ROOT 环境变量（R33违规），补丁应通过 conandata 声明"
  - "autoconf 2.72 生成的 php_config.h.in 中 #undef PACKAGE_* 需改为 /* #undef */ 注释风格（patch 0004）"

patch_generation:
