# conandata.yml — php 8.5.8
# Note: Using php.net URL because it includes pre-generated Zend scanner/parser
# files (zend_language_scanner.c etc.) which the GitHub tarball lacks.
# The GitHub tarball has 46 build/ files vs php.net's 19, but both include
# gen_stub.php - the essential file for buildconf --force.
# Without the pre-generated scanner files, configure requires re2c (not available).

sources:
  url: "https://www.php.net/distributions/php-8.5.8.tar.gz"
  sha256: "6ebc55e52af4396385e689f7af0f28944fbbf966843433b573e9dc1dc03df539"

patches:
  - patch_file: "patches/0001-build-config.guess.patch"
    patch_description: "0001 build config.guess HarmonyOS detection"
    patch_type: "portability"
  - patch_file: "patches/0002-build-config.sub.patch"
    patch_description: "0002 build config.sub HarmonyOS support"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "0003 configure umask 077 to 022 fix"
    patch_type: "portability"
  - patch_file: "patches/0004-main-php_config.h.in.patch"
    patch_description: "0004 php_config.h.in undef style fix"
    patch_type: "portability"
