  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.PL.patch"
  - "0002-src-ref.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Dist::Build 不可用时可用 ExtUtils::MakeMaker (Makefile.PL) 替代，需 postamble 自定义 C 编译规则"
  - "aarch64 无 SSE3/AVX，ref.c 的 fill_segment 与 switch.c 符号冲突，需重命名"
  - "HNP Perl (hnp_file:s0) 无法 dlopen HMDFS .so (hmdfs:s0)，属平台级限制，影响所有 Perl XS 模块 (E073/E131)"
  - "已排除 E131 (LD 环境变量干扰): env -u LD -u CC 和 env -i 均仍 Permission denied"
  - "鸿蒙缺少 CRT 文件 (E173/E208)，本软件通过 postamble 自定义规则绕过，其他 Perl XS 模块可能需 -nostartfiles -nodefaultlibs -lc"
  - "ELF 签名限制 (E166): 复制 Perl 到 HMDFS 无法执行"
  - "Conan 补丁文件不能含绝对路径，新文件用 --- /dev/null 格式"

# ============================================================
# 功能测试结果
# ============================================================
functional_test:
  test_date: "2026-07-02"
  report: "reports/functional-test-report.md"
  algorithm_test: PASS
  algorithm_details: "11/11 测试通过: argon2id/i/d hash_raw, hash_encoded, verify, ctx, 确定性, 区分性, 错误处理"
  perl_xs_load: BLOCKED
  perl_xs_block_reason: "HNP Perl (hnp_file:s0) 无法 dlopen HMDFS .so (hmdfs:s0), OpenHarmony hmmac 安全策略限制"
  perl_xs_e131_excluded: "env -u LD -u CC 和 env -i 均仍 Permission denied, 排除 LD 环境变量干扰"
  perl_xs_workaround_attempted:
    - "env -u LD -u CC: 失败 (E131 排除)"
    - "env -i 完全清空环境: 失败"
    - "LD_PRELOAD: 失败"
    - "复制 .so 到其他目录: 失败 (标签不变)"
    - "安装到 HNP 目录: 失败 (目录不可写)"
    - "复制 Perl 到 HMDFS: 失败 (缺少 ELF 签名, E166)"
    - "chcon 修改标签: 失败 (命令不可用)"
  conclusion: "Argon2 算法功能正常, Perl XS 模块受平台安全策略限制无法加载"
  knowledge_graph_refs:
    - E073 (HMDFS 运行时加载, 不同场景)
    - E078 (musl dlopen 符号解析)
    - E131 (LD 环境变量, 已排除)
    - E166 (ELF 签名限制)
    - E173 (CRT 文件缺失)
    - E208 (Makefile.PL OTHERLDFLAGS)

patch_generation:
  method: refresh-patch --auto
  source_orig_dir: /storage/Users/currentUser/tmp/builds/perl-crypt-argon2-0.030.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/perl-crypt-argon2-0.030.work
  source_orig_hash: 98426a1882f25e7d
  source_work_hash: d705d8780b8f0095
  generated_at: '2026-07-02T16:16:01'
  patches_count: 2

patch_classification:
  - file: 0001-Makefile.PL.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-ref.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
