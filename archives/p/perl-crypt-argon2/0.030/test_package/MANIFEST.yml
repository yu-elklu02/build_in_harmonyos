# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-crypt-argon2/0.030
homepage: "https://metacpan.org/dist/Crypt-Argon2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/argon2.t
    source: Crypt-Argon2-0.030/t/argon2.t
    description: "上游 Argon2 算法功能测试 (hash/verify/ctx)"
    command: "perl -Ilib t/argon2.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_argon2.sh
    description: "消费者测试：加载 Crypt::Argon2 模块并调用 argon2id_pass + argon2_verify API"
    command: "sh test_argon2.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
