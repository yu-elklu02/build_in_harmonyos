software: perl-crypt-argon2
display: "Crypt::Argon2"
description: "Perl interface to the Argon2 key derivation functions (argon2id/argon2i/argon2d)"
category: security
homepage: "https://metacpan.org/dist/Crypt-Argon2"
license: Apache-2.0
build_system: perl
compile_date: "2026-07-02"

ohos_adaptation:
  key_points:
    - "Dist::Build 不可用，需创建 Makefile.PL (ExtUtils::MakeMaker) 替代"
    - "aarch64 无 SSE3/AVX，ref.c 的 fill_segment 与 switch.c 符号冲突，需重命名"
    - "HMDFS 安全策略限制 .so dlopen (hnp_file:s0 vs hmdfs:s0)，影响所有 Perl XS 模块 (E073/E131)"
    - "已排除 E131 (LD 环境变量干扰)：env -u LD -u CC 和 env -i 均仍 Permission denied"
    - "鸿蒙缺少 CRT 文件 (E173/E208)，本软件通过 postamble 自定义规则绕过"
    - "Argon2 C 算法功能验证通过 (11/11 测试)，算法本身在 aarch64/OHOS 上完全正常"
  common_dependencies:
    - perl
    - musl (headers)

versions:
  "0.030":
    status: built
    build_date: "2026-07-02"
