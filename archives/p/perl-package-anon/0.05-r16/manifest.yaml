software: perl-package-anon
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.05-r16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.05-r16"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# 构建系统类型 (顶层字段，submit 检查要求)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AU/AUGGY/Package-Anon-0.05.tar.gz"

  # 源码校验和
  sha256: "15d0285e628a721138bcb1c36dea934379a89fdbc450fd79148e4e37a77241ba"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 特殊链接参数（绕过 CRT 文件缺失，perl-dbd-pg 经验）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "Makefile 运行时补丁: CCFLAGS 添加 -isystem sysroot include 路径"
  - "Makefile 运行时补丁: LDDLFLAGS 添加 --sysroot, -L 路径和 -nostartfiles -nodefaultlibs -lc"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要 OHOS SDK sysroot include 路径 (-isystem)，因为 Perl Config 的 incpth 指向不存在的路径"
  - "鸿蒙系统缺少 CRT 文件 (crti.o, crtn.o, crtbeginS.o, crtendS.o)，链接需要 -nostartfiles -nodefaultlibs -lc 参数（perl-dbd-pg 经验）"
  - "SELinux HMDFS 限制动态库加载，XS 模块需安装到 /data/service/hnp 系统目录才能正常加载"
  - "Makefile 运行时补丁方式: 在 conanfile.py build() 中用正则替换 Makefile 的 CCFLAGS 和 LDDLFLAGS"
  - "Anon.so 编译产物 17792 bytes，ELF64 AArch64 共享对象，仅依赖 libc.so"
  - "binary-sign-tool 可签名 .so 文件，但 HMDFS 上的 SELinux 上下文 (hmdfs:s0) 仍阻止加载"
