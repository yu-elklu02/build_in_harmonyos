# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-package-anon/0.05-r16
homepage: "https://metacpan.org/dist/Package-Anon"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/basic.t
    source: perl-package-anon-0.05-r16/t/basic.t
    description: "上游 Perl 测试: Package::Anon 基本功能"
    command: "perl -Iblib/lib -Iblib/arch t/basic.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Perl XS 模块功能测试 (通过 test.pl 调用 Package::Anon API)"
    command: "bash test.sh"
  - file: test.pl
    description: "Perl 功能测试脚本 (创建匿名包、添加方法、调用验证)"
    command: "perl test.pl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
