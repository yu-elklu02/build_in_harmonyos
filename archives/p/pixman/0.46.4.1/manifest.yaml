software: pixman
name: pixman
version: '0.46.4.1'
status: published
build_date: '2026-07-13'
build_system: meson

source:
  url: 'https://cairographics.org/releases/pixman-0.46.4.tar.gz'
  sha256: 'd09c44ebc3bd5bee7021c79f922fe8fb2fb57f7320f55e97ff9914d2346a591c'
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - '-Dtests=disabled'
    - '-Ddemos=disabled'
    - '-Dgtk=disabled'
    - '-Dlibpng=disabled'
    - '-Dopenmp=disabled'
  cc: clang

patches_applied: []

knowledge_gained:
  - '库 libpixman-1.so、pkg-config pixman-1、头 include/pixman-1/pixman.h'
  - 'cpp_info.includedirs=["include/pixman-1","include"]（pixman.h 内部 #include <pixman-version.h>）'
  - 'meson ar 须注入 conan_meson_native.ini（conan 不写 compiler_executables 的 ar）'
