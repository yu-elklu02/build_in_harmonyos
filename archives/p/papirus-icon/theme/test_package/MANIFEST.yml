# test_package/MANIFEST.yml

package: papirus-icon/theme
homepage: "https://github.com/PapirusDevelopmentTeam/papirus-icon-theme"

upstream_check_command: "make test_short"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_rendering_glitches"
    command: "make test_rendering_glitches"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_optimization"
    command: "make test_optimization"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_svg_elems"
    command: "make test_svg_elems"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_symlinks"
    command: "make test_symlinks"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_filenames"
    command: "make test_filenames"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_decimal_size"
    command: "make test_decimal_size"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_lengths_units"
    command: "make test_lengths_units"
  - file: Makefile
    source: papirus-icon-theme-20250501/Makefile
    description: "test_xml_struct（需 xmlstarlet）"
    command: "make test_xml_struct"

test_package_tests:
  - file: conanfile.py
    description: "消费者验证 — index.theme/SVG/PNG/symlink 分类/样本图标/环境变量"
    command: "conan create . -tf test_package"

assertion_count: 130000
