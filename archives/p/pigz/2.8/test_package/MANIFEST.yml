# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pigz/2.8
homepage: "https://zlib.net/pigz/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: pigz-2.8/Makefile
    description: "pigz make test: compress/decompress round-trip with various options (-kf, -kfb 32, -kfp 1, -kfz, -kfK)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 pigz 二进制进行压缩/解压缩往返测试"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
