software: perl-sql-translator
# 版本级 manifest
# 文件位置: archives/p/perl-sql-translator/1.66-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.66-r0"
status: built
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/V/VE/VEESH/SQL-Translator-1.66.tar.gz"
  sha256: "f7ff7e369d8293a394cb3783b54b745e7faf44422e8a83bfcc359378a6e56145"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: perl
  build_system: perl
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=/storage/Users/currentUser/usr/local/perl5"
  dependencies:
    - "perl 5.42.0 (系统 Perl)"
    - "Moo 2.005005 (local::lib)"
    - "Parse::RecDescent (local::lib)"
    - "Try::Tiny (local::lib)"
    - "Sub::Quote (local::lib)"
    - "Package::Variant (local::lib)"
    - "File::ShareDir (local::lib)"
    - "YAML::Tiny 1.74 (local::lib, 作为 YAML 后端)"
    - "JSON::PP (Perl 核心模块, 通过 JSON::MaybeXS 桩)"
    - "DBI 1.643 (纯 Perl 桩, 仅 SQL 类型常量)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 纯 Perl 模块，无需源码补丁

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SQL::Translator 是纯 Perl 模块，无需 C 编译，构建系统为 ExtUtils::MakeMaker"
  - "SQL::Translator 的 Schema::Field 无条件 use DBI qw(:sql_types)，需 DBI 可用"
  - "鸿蒙 SELinux HMDFS 限制阻止从用户目录加载 .so 共享库（与 perl-dbd-pg 相同问题）"
  - "创建纯 Perl DBI 桩模块可解决 SQL 类型常量依赖，DBI 解析器模块也可正常加载"
  - "YAML::Tiny 可作为 YAML 后端的替代方案，需处理 scalar references 限制"
  - "JSON::PP（Perl 核心模块）可通过 JSON::MaybeXS 桩作为 JSON 后端，需处理 scalar references"
  - "PERL5LIB 环境变量必须包含 local::lib 路径和 aarch64-linux 子目录"
  - "sqlt 命令行工具需要 PERL5LIB 设置才能找到依赖模块"
  - "SQLServer 解析器要求 dbo.table 格式、IDENTITY 无参数、CONSTRAINT 声明 PK、分号结尾"
  - "scalar references (\\1, \\0) 在 YAML::Tiny 和 JSON::PP 中都不被原生支持，需递归转换"

# ============================================================
# 功能测试
# ============================================================

test_results:
  total: 21
  passed: 21
  failed: 0
  skipped: 0
  pass_rate: "100.0%"
  report: "reports/test-report.md"

# ============================================================
# 平台适配文件
# ============================================================

platform_adaptations:
  - file: "DBI.pm (纯 Perl 桩)"
    path: "local::lib/aarch64-linux/DBI.pm"
    purpose: "提供 SQL 类型常量，替代被 SELinux 阻止的 DBI.so"
  - file: "YAML.pm (包装器)"
    path: "local::lib/YAML.pm"
    purpose: "包装 YAML::Tiny，处理 scalar references"
  - file: "JSON/MaybeXS.pm (纯 Perl 桩)"
    path: "local::lib/JSON/MaybeXS.pm"
    purpose: "委托 JSON::PP，处理 scalar references"
