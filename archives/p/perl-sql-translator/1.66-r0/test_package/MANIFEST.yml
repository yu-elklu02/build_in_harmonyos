# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: perl-sql-translator/1.66-r0
homepage: https://metacpan.org/release/SQL-Translator

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (77 个 .t 文件)
upstream_tests:
  - file: t/02mysql-parser.t
    source: perl-sql-translator-1.66-r0/t/02mysql-parser.t
    description: "MySQL 解析器测试"
    command: "perl t/02mysql-parser.t"
  - file: t/03mysql-to-oracle.t
    source: perl-sql-translator-1.66-r0/t/03mysql-to-oracle.t
    description: "MySQL 到 Oracle 转换测试"
    command: "perl t/03mysql-to-oracle.t"
  - file: t/08postgres-to-mysql.t
    source: perl-sql-translator-1.66-r0/t/08postgres-to-mysql.t
    description: "PostgreSQL 到 MySQL 转换测试"
    command: "perl t/08postgres-to-mysql.t"
  - file: t/14postgres-parser.t
    source: perl-sql-translator-1.66-r0/t/14postgres-parser.t
    description: "PostgreSQL 解析器测试"
    command: "perl t/14postgres-parser.t"
  - file: t/23json.t
    source: perl-sql-translator-1.66-r0/t/23json.t
    description: "JSON producer 测试"
    command: "perl t/23json.t"
  - file: t/24yaml.t
    source: perl-sql-translator-1.66-r0/t/24yaml.t
    description: "YAML producer 测试"
    command: "perl t/24yaml.t"
  - file: t/27sqlite-parser.t
    source: perl-sql-translator-1.66-r0/t/27sqlite-parser.t
    description: "SQLite 解析器测试"
    command: "perl t/27sqlite-parser.t"
  - file: t/47postgres-producer.t
    source: perl-sql-translator-1.66-r0/t/47postgres-producer.t
    description: "PostgreSQL producer 测试"
    command: "perl t/47postgres-producer.t"
  - file: t/56-sqlite-producer.t
    source: perl-sql-translator-1.66-r0/t/56-sqlite-producer.t
    description: "SQLite producer 测试"
    command: "perl t/56-sqlite-producer.t"
  - file: t/60roundtrip.t
    source: perl-sql-translator-1.66-r0/t/60roundtrip.t
    description: "往返转换测试"
    command: "perl t/60roundtrip.t"
  - file: t/50-sqlserver-parser.t
    source: perl-sql-translator-1.66-r0/t/50-sqlserver-parser.t
    description: "SQLServer 解析器测试"
    command: "perl t/50-sqlserver-parser.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Conan L1-L2 测试: 文件完整性检查 + MySQL→PostgreSQL 功能转换"
    command: "conan create . && conan test test_package"

# 测试断言总数 (近似值)
assertion_count: 300
