package: plog/1.1.11
homepage: "https://github.com/SergiusTheBest/plog"

upstream_check_command: >-
  cmake -S . -B build -DPLOG_BUILD_SAMPLES=OFF
  -DPLOG_BUILD_TESTS=ON -DPLOG_INSTALL=ON &&
  cmake --build build --parallel &&
  ctest --test-dir build --output-on-failure
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  counting_basis: "8 CTest entries; 11 doctest cases per entry"
  ctest_entries:
    - PlogTest
    - PlogTest_wchar
    - PlogTest_cxx_std_11
    - PlogTest_cxx_std_14
    - PlogTest_cxx_std_17
    - PlogTest_cxx_std_20
    - PlogTest_cxx_std_23
    - PlogTest_cxx_std_23_wchar
  ctest_entry_count: 8
  native_doctest_case_executions: 88
  native_assertion_executions: 570
  ohos_emulator_doctest_case_executions: 88
  ohos_emulator_assertion_executions: 570
  ohos_emulator_failed: 0
  ohos_emulator_skipped: 0

test_package_tests:
  - file: test_plog.cpp
    scenario: "normal"
    description: "Consume plog::plog, capture INFO output, verify severity filtering, then enable DEBUG"
    command: "./test_plog"
  - file: test_plog.cpp
    scenario: "fault-injection"
    description: "Pass an invalid severity string and verify that plog rejects it as plog::none"
    command: "./test_plog --invalid-severity"

assertion_count: 9
