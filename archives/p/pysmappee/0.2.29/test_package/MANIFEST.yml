# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pysmappee/0.2.29
homepage: "https://github.com/smappee/pysmappee"

# TEST_QUALITY_SPEC §3.3 (上游无测试用例) — sanctioned exemption path.
# 上游 0.2.29 sdist 含 test/ 目录但仅有一个 0 字节的 __init__.py:
#   $ ls -la test/
#   -rw-r--r-- 1 user user 0  ...  __init__.py
# 通过 GitHub API 在 tag 0.2.29 上确认:
#   $ curl .../contents/test?ref=0.2.29
#   => [{"name":"__init__.py","size":0,...}]
#   $ curl .../contents/tests?ref=0.2.29
#   => 404 Not Found
# 此外 setup.py 显式 exclude=['test'] 并无 test_suite 声明,
# examples/example.py 0 字节 (empty placeholder)。
# 详见 exempted upstream 章节 + notes.md「Upstream Tests」。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_exemption: >-
  pysmappee 0.2.29 上游未提供任何自动化测试套件:
  test/ 目录仅含 0 字节的 __init__.py,不存在 tests/ 目录,
  setup.py 用 setuptools.find_packages(exclude=['test']) 主动排除,
  无 test_suite / pytest.ini / tox.ini / noxfile.py / CI 工作流,
  examples/example.py 为 0 字节占位文件。Conan 适配侧的
  build() 主动生成的 _upstream_smoke.py 是离线构建期验证,
  不属于上游官方测试,不能计入「上游测试用例」。

# build-phase verification (NOT upstream test):
# recipe 在 build() 末尾生成 _upstream_smoke.py 并执行。
# 该脚本覆盖 urljoin、5 个 serialnumber 探测、config 3 个 farm、
# Smappee / SmappeeApi 公开符号。共 10 个 assert。
build_phase_smoke:
  - file: build-time-generated (_upstream_smoke.py in build_folder)
    description: >-
      Build-phase offline smoke: helper.urljoin + 5 serial-number
      detectors + config farms (API_URL/MQTT) + Smappee / SmappeeApi
      symbols importable. Not upstream test; substitute for missing
      upstream test suite (see upstream_test_exemption).
    command: "python3 _upstream_smoke.py"
    assertion_count: 10

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pysmappee.py
    description: "Import API + helpers + config + construct SmappeeApi/LocalApi/Smappee"
    command: "python3 test_pysmappee.py"

# 上游 pytest 结果 (OHOS worker 容器)
upstream_pytest_result: "N/A — upstream ships 0 tests; exemption declared above"

# 断言总数 (用于质量评估)
# - build-phase smoke: 10
# - consumer (test_package): 26
# - 总: 36
assertion_count: 36
