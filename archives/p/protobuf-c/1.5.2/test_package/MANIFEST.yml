# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: protobuf-c/1.5.2
homepage: "https://github.com/protobuf-c/protobuf-c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/generated-code/test-generated-code.c
    source: protobuf-c-1.5.2/t/generated-code/test-generated-code.c
    description: "Generated code round-trip test (requires protoc-gen-c)"
    command: "./test-generated-code"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verify protobuf-c library version and buffer API"
    command: "./test_protobuf-c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
