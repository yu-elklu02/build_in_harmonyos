software: protobuf-c
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# 构建系统（顶层字段，用于自检）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/protobuf-c/protobuf-c/releases/download/v1.5.2/protobuf-c-1.5.2.tar.gz"

  # 源码校验和
  sha256: "e2c86271873a79c92b58fef7ebf8de1aa0df4738347a8bd5d4e65a80a16d0d24"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_PROTOC=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # protoc-gen-c requires protobuf/33.6 but it is not yet published to ohpcd.
  # BUILD_PROTOC=OFF builds only the C runtime library (libprotobuf-c).

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-cmake-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Autotools config.status fails with Permission denied on HarmonyOS (E002-like issue); CMake build-cmake/ subdirectory works"
  - "CMakeLists.txt unconditionally requires find_package(Protobuf); patch to make it conditional on BUILD_PROTOC option"
  - "protoc-gen-c requires protobuf (C++) which is not yet published to ohpcd; BUILD_PROTOC=OFF builds only the C library"

patch_generation:
  method: per-file-difflib
  patches_count: 2

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-build-cmake-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
