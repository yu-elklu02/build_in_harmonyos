# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: potrace/1.16
homepage: "https://potrace.sourceforge.net"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check TEMPDIR=$HOME/tmp"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: check/input-check.sh
    source: potrace-1.16/check/input-check.sh
    description: "Verify potrace can read different input file formats"
    command: "./check/input-check.sh"
  - file: check/backend-check.sh
    source: potrace-1.16/check/backend-check.sh
    description: "Verify potrace output backends (EPS, SVG, PDF, etc.)"
    command: "./check/backend-check.sh"
  - file: check/potrace-check.sh
    source: potrace-1.16/check/potrace-check.sh
    description: "Verify potrace tracing algorithm correctness"
    command: "./check/potrace-check.sh"
  - file: check/binary-check.sh
    source: potrace-1.16/check/binary-check.sh
    description: "Verify binary output format"
    command: "./check/binary-check.sh"
  - file: check/mkbitmap-check.sh
    source: potrace-1.16/check/mkbitmap-check.sh
    description: "Verify mkbitmap tool functionality"
    command: "./check/mkbitmap-check.sh"
  - file: check/mkbitmap-input-check.sh
    source: potrace-1.16/check/mkbitmap-input-check.sh
    description: "Verify mkbitmap input format handling"
    command: "./check/mkbitmap-input-check.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verify potrace library API (potrace_version, potrace_param_default)"
    command: "./test_potrace"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
