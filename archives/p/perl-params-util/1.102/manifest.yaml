software: perl-params-util
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.102/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.102"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# 构建系统 (顶层字段，submit 自检需要)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RE/REHSACK/Params-Util-1.102.tar.gz"

  # 源码校验和
  sha256: "499bb1b482db24fda277a51525596ad092c2bd51dd508fa8fec2e9f849097402"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - musl/1.2.x (提供标准 C 库头文件)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "perl Makefile.PL: 传入 INC='-I$MUSL_PREFIX/include' 添加 musl 头文件路径（仅 MUSL_PREFIX 设置时）"
  - "make OTHERLDFLAGS: 添加 -nostartfiles -nodefaultlibs -lc 到链接参数 (CRT 文件缺失绕过)"

# 补丁方式: conanfile.py build() 内联参数注入 (R3: 探索阶段不生成 .patch)
patch_method: inline-conanfile-build

patch_generation:
  method: inline-conanfile-build
  source_orig_hash: 499bb1b482db24fda277a51525596ad092c2bd51dd508fa8fec2e9f849097402
  source_work_hash: 46c587c0d69874ed5fa3243aa90260d5899704bb6f84d23bf742eb91f6d198f3
  generated_at: '2026-07-03T16:57:40'
  patches_count: 0
  note: "补丁通过 conanfile.py build() 方法内联实现 (perl Makefile.PL INC 参数 + make OTHERLDFLAGS)，无独立 .patch 文件"

patch_classification:
  - file: "N/A (inline in conanfile.py build())"
    type: inline
    platform_only: True
    guard: 'none'
    description: "Makefile.PL: 传入 INC 参数添加 musl 头文件路径; make OTHERLDFLAGS 添加 CRT 绕过链接参数"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要标准 C 库头文件（musl 提供的 sys/types.h 等）"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），链接需要 -nostartfiles -nodefaultlibs -lc 参数"
  - "SELinux HMDFS 文件系统限制动态库加载，XS .so 无法从用户目录加载"
  - "Params::Util 提供纯 Perl 回退模块 (Params::Util::PP)，通过 PERL_PARAMS_UTIL_PP=1 环境变量激活"
  - "通过 perl Makefile.PL INC 参数添加头文件路径，make OTHERLDFLAGS 命令行参数添加 CRT 绕过链接参数"
  - "参考 perl-dbd-pg 3.18.0 的编译经验：相同的 CRT 绕过方案和 musl 头文件依赖"
