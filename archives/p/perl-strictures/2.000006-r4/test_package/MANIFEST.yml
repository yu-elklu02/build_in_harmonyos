# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: perl-strictures/2.000006-r4
homepage: "https://metacpan.org/dist/strictures"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/crash.t
    source: strictures-2.000006/t/crash.t
    description: "Test crash handling"
    command: "perl -Iblib/lib -Iblib/arch t/crash.t"
  - file: t/extras.t
    source: strictures-2.000006/t/extras.t
    description: "Test extra strictures checks"
    command: "perl -Iblib/lib -Iblib/arch t/extras.t"
  - file: t/strictures.t
    source: strictures-2.000006/t/strictures.t
    description: "Test strictures main functionality"
    command: "perl -Iblib/lib -Iblib/arch t/strictures.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：验证 strictures 模块可加载"
    command: "perl -I<lib_path> -Mstrictures -e 'strictures->import'"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 42
