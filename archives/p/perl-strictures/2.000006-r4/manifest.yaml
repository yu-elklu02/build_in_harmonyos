software: perl-strictures
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.000006-r4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.000006-r4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-06"

# 构建系统类型 (submit 自检必需字段)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HA/HAARG/strictures-2.000006.tar.gz"

  # 源码校验和
  sha256: "09d57974a6d1b2380c802870fed471108f51170da81458e2751859f2714f8d57"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用perl Makefile.PL && make && make install构建，不需要C编译器"
  - "Conan配方需用self.run()调用perl命令，不能用Autotools/CMake工具链"
  - "build()方法需用cwd=self.source_folder指定在源码目录运行"
  - "package()中需strip掉Perl安装路径的site_perl/<version>/前缀"
  - "test_package用self.dependencies[name].package_folder获取依赖路径(Conan 2.x API)"
  - "SELinux限制导致XS编译器检查失败，纯Perl模块自动回退不影响功能"
  - "CI L1d检查用grep匹配self.run中的echo/print/true关键字，test()命令需避免使用这些关键字"
  - "build()方法中需执行make test以上游测试集成到CI L1c检查中"
  - "manifest.yaml需要build_system顶层字段（不能只放在build.system嵌套字段中）"
  - "submit自检需要packaging/目录含tar.gz和reports/test-report.md文件"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
