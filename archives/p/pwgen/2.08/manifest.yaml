knowledge_gained:
  - "configure config.status 临时目录创建失败：zsh 环境下 mktemp -d \"./confXXXXXX\" 创建临时目录后，后续文件写入失败"
  - "根因：HarmonyOS 上 mktemp -d 配合 umask 077 创建的目录权限为 drwx--S--- (2700)，无法写入文件"
  - "解决方案：移除 umask 077，改为使用 ${TMPDIR} 创建临时目录并 chmod 755"
  - "pwgen 编译简单，仅需 6 个源文件，无外部依赖"
