# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pwgen/2.08
homepage: "https://github.com/tytso/pwgen"

# pwgen 上游无 make check 测试套件
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无正式测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 pwgen 二进制，验证密码生成功能"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
