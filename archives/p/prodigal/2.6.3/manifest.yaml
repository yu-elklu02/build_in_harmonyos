software: prodigal
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.6.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hyattpd/Prodigal/archive/refs/tags/v2.6.3.tar.gz"

  # 源码校验和
  sha256: "89094ad4bff5a8a8732d899f31cec350f5a4c27bcbdd12663f87c9d1f0ec599f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（Makefile项目，通过make变量传递）
  configure_options:
    - "CC=clang"
    - "LDFLAGS=-fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "INSTALLDIR=$DEFAULT_PREFIX/bin"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Makefile项目，无configure脚本，需通过make变量(CC/LDFLAGS/INSTALLDIR)传递编译参数"
  - "必须使用GNU ld(-fuse-ld=/data/service/hnp/bin/ld.bfd)替代lld"
  - "Makefile不支持DESTDIR，需直接修改INSTALLDIR实现staging安装"
  - "prodigal使用-v而非--version显示版本信息"
  - "无make check测试目标"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
