software: primecount
display: "primecount"
description: "primecount 是一个用于计算不超过 x 的素数个数 pi(x) 的高性能 C/C++ 库"
category: math
homepage: "https://github.com/kimwalisch/primecount"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "源码自带 vendored libprimesieve（lib/primesieve），默认 BUILD_LIBPRIMESIEVE=ON 从源码构建，无外部 Conan 依赖"
    - "默认构建静态库 libprimecount.a 与命令行 primecount 二进制（混合类型，需 commands.json，R38）"
    - "禁用 WITH_OPENMP（OHOS 可能无 libomp，禁用后退化为串行实现，功能完整）"
    - "禁用 WITH_MULTIARCH（关闭运行期 SVE/AVX512 CPU 分发，避免额外指令集编译标志）"
    - "纯计算库，不涉及图形/HAL/系统底层，无需平台适配补丁"
  common_dependencies: []

versions:
  "8.5":
    status: built
    build_date: "2026-07-14"
    conan_ref: "primecount/8.5"
