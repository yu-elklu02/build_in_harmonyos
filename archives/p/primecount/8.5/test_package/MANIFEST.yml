# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: primecount/8.5
homepage: "https://github.com/kimwalisch/primecount"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# primecount 上游测试 (BUILD_TESTS) 未启用，由 test_package 承担 L1 验证
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# primecount 上游测试位于 test/ 目录，本配方 BUILD_TESTS=False 未启用其构建，
# 故运行的上游测试为空（test_package/test.cpp 是本项目自写的消费者测试，
# 已在下方 test_package_tests 中声明，不在此重复）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 链接 libprimecount，调用 C API 验证 pi(100)=25、pi(1000)=168、nth_prime(1)=2"
    command: "./test_primecount"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
