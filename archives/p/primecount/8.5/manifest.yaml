version: "8.5"
status: built
build_date: "2026-07-14"
conan_ref: "primecount/8.5"

source:
  url: "https://github.com/kimwalisch/primecount/archive/refs/tags/v8.5.tar.gz"
  sha256: "a2dd9714e723388987183776d068d6845b82b2cf8ea44ecb6cea3fd9dde938ea"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=False"
    - "BUILD_TESTS=False"
    - "WITH_OPENMP=False"
    - "WITH_MULTIARCH=False"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

patches_description: {}

knowledge_gained:
  - "primecount 源码自带 vendored libprimesieve (lib/primesieve)，默认从源码构建，无需外部依赖"
  - "默认产物为静态库 libprimecount.a + 命令行 primecount，属混合类型需 commands.json (R38)"
  - "禁用 WITH_OPENMP 后退化为串行实现，功能完整，规避 OHOS 可能缺失的 libomp"
  - "禁用 WITH_MULTIARCH 关闭 SVE 运行期分发，避免额外指令集编译标志风险"
  - "纯计算库，aarch64/musl/libc++ 下无需平台适配补丁"

ci_verification:
  environment: "Python 3.12.9, Conan 2.29.1, Clang 15 (OHOS aarch64)"
  L0: "PASS — 结构完整（conanfile/conandata/test_package/MANIFEST 齐全），无依赖（L0i/R36 不适用），首次发布（L0j ok），commands.json 已声明（L0k ok）"
  L1: "PASS — test_primecount 通过：primecount 8.5: pi(100)=25 pi(1000)=168 nth_prime(1)=2 OK"
  L1e: "PASS — 破坏性反向验证（移除 lib/include 后链接失败，确认真实依赖）"
  L2: "PASS — primecount --version OK"
  L4: "PASS — 无补丁"
  L5: "PASS — bin/ 与 lib/ 有产物"
