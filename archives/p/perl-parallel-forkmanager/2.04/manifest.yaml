software: perl-parallel-forkmanager
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.04/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.04"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/modules/by-module/Parallel/Parallel-ForkManager-2.04.tar.gz"

  # 源码校验和
  sha256: "606894fc2e9f7cd13d9ec099aaac103a8f0943d1d80c2c486bae14730a39b7fc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 代码）在鸿蒙平台可直接编译，无需特殊链接参数"
  - "Perl ExtUtils::MakeMaker 构建系统（Makefile.PL）在鸿蒙平台兼容性良好"
  - "Parallel::ForkManager 的 fork() 系统调用在鸿蒙 OHOS 平台正常工作"
  - "纯 Perl 模块不受 SELinux HMDFS 限制（无 .so 动态库加载问题）"
  - "test_package 必须包含 .sh/.py 等测试源文件才能通过 CI L0c 质量门禁"
  - "test_package/conanfile.py 的 test() 中 self.run 行不应包含 print/echo 关键字，否则会触发 CI L1d 假测试检测"
  - "鸿蒙系统 /bin/bash 不存在，shell 脚本 shebang 应使用 /data/service/hnp/bin/bash 或通过 bash 显式调用"
  - "纯 Perl 模块可在 conanfile.py build() 中集成 make test 运行上游测试（Test::Harness）"
  - "conan test_package 在 HMDFS 上无法直接执行脚本（无执行权限），需用 bash 显式调用"
