# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-parallel-forkmanager/2.04
homepage: "https://metacpan.org/release/Parallel-ForkManager"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01-basic.t
    source: Parallel-ForkManager-2.04/t/01-basic.t
    description: "基本功能测试：模块加载、构造、fork、wait_all_children"
    command: "make test"
  - file: t/02-callbacks.t
    source: Parallel-ForkManager-2.04/t/02-callbacks.t
    description: "回调测试：run_on_start, run_on_finish, run_on_wait"
    command: "make test"
  - file: t/03-data.t
    source: Parallel-ForkManager-2.04/t/03-data.t
    description: "数据结构返回测试：子进程向父进程返回复杂数据"
    command: "make test"
  - file: t/04-usage.t
    source: Parallel-ForkManager-2.04/t/04-usage.t
    description: "使用模式测试：典型并行处理场景"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_forkmanager.sh
    description: "功能测试套件（7项）：模块加载、fork、回调、退出码、数据返回、并行时序"
    command: "./test_forkmanager.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
