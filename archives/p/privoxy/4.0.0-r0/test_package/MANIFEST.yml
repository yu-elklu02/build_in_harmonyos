# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: privoxy/4.0.0-r0
homepage: "https://www.privoxy.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# privoxy 没有标准 make check 测试套件，上游通过运行 privoxy --version 验证
upstream_tests:
  - file: privoxy
    source: privoxy-4.0.0-stable/privoxy
    description: "验证 privoxy 二进制可执行并输出版本信息"
    command: "privoxy --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：验证 privoxy --version 和 --help 输出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
