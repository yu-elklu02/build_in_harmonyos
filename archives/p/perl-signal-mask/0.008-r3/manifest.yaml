software: perl-signal-mask
# 版本级 manifest
# 文件位置: archives/p/perl-signal-mask/0.008-r3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.008-r3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/L/LE/LEONT/Signal-Mask-0.008.tar.gz"

  # 源码校验和
  sha256: "043d995b6b249d9ebc04c467db31bb7ddc2e55faa08e885bdb050b1f2336b73f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 代码）在鸿蒙平台无需特殊适配，直接 perl Makefile.PL + make 即可"
  - "Signal::Mask 运行时依赖 IPC::Signal，需在 conanfile.py 中构建 PERL5LIB 环境变量指向系统 site_perl 路径"
  - "纯 Perl 模块的 conanfile.py generate() 方法可以为空（pass），不需要 C 编译器工具链"
  - "信号掩码（sigprocmask）和待处理信号（sigpending）在 OpenHarmony 6.0 上行为与标准 Linux 一致"
  - "与 XS 模块（如 perl-dbd-pg）不同，纯 Perl 模块不涉及 CRT 链接问题"
