# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-signal-mask/0.008-r3
homepage: https://metacpan.org/dist/Signal-Mask

# 上游测试命令 (Perl 标准 make test)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游源码自带的测试 (t/ 目录)
upstream_tests:
  - file: t/00-load.t
    description: "Signal::Mask 模块加载测试"
  - file: t/signal-mask.t
    description: "Signal::Mask 信号掩码功能测试"
  - file: t/signal-pending.t
    description: "Signal::Pending 待处理信号测试"
  - file: t/pod.t
    description: "POD 文档格式测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_signal_mask.sh
    description: "Shell 脚本: 5 项 Perl 测试 (load Mask, load Pending, version, functional mask, pending interface)"
    command: "sh test_signal_mask.sh"
  - file: conanfile.py
    description: "Conan L1 测试: 查找 Mask.pm，设置 PERL5LIB，通过 self.run() 调用 test_signal_mask.sh"
    command: "conan test test_package/conanfile.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
