# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: prettyping/1.1.0
homepage: "https://github.com/denilsonsa/prettyping"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "N/A — upstream provides no make check target or test directory"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash -n prettyping && bash prettyping --help"

# 上游实际运行的测试程序
upstream_tests:
  - file: prettyping
    source: prettyping-1.1.0/prettyping
    description: "Bash syntax validation for packaged prettyping executable"
    command: "bash -n prettyping"
  - file: prettyping
    source: prettyping-1.1.0/prettyping
    description: "Help output validation, including v1.1.0 recent/global stats options"
    command: "bash prettyping --help"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: prettyping help, missing-parameter failure, deterministic mock ping rendering"
    command: "bash test.sh"
  - file: mock-ping.sh
    description: "Deterministic ping fixture used through prettyping --pingbin"
    command: "prettyping --pingbin mock-ping.sh example.test"
  - file: tput
    description: "Minimal tput fixture for terminal-size probes on reduced OHOS images"
    command: "PATH=test_package:$PATH prettyping --columns/--lines fallback path"
  - file: conanfile.py (inline Python assertions)
    description: "消费者测试: 校验 help 输出、v1.1.0 参数与 mock ping 统计输出"
    command: "conan test (prettyping --help + prettyping --pingbin mock-ping.sh)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
