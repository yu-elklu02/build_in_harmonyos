# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/25.12.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "25.12.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://poppler.freedesktop.org/poppler-25.12.0.tar.xz"

  # 源码校验和
  sha256: "c18b40eb36b1a0c5b86e29ca054bf0770304583da4f2cdd42fe86eca6a20de48"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

# 兼容旧版本验证脚本
build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DFONT_CONFIGURATION=generic"
    - "-DENABLE_BOOST=OFF"
    - "-DENABLE_CPP=ON"
    - "-DENABLE_GLIB=OFF"
    - "-DENABLE_GOBJECT_INTROSPECTION=OFF"
    - "-DENABLE_GTK_DOC=OFF"
    - "-DENABLE_QT5=OFF"
    - "-DENABLE_QT6=OFF"
    - "-DENABLE_UNSTABLE_API_ABI_HEADERS=ON"
    - "-DENABLE_NSS3=OFF"
    - "-DENABLE_GPGME=OFF"
    - "-DENABLE_LIBCURL=OFF"
    - "-DENABLE_LIBTIFF=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - freetype/2.14.3@ohpcd/stable

  # 编译器
  cc: clang
  cxx: clang++

