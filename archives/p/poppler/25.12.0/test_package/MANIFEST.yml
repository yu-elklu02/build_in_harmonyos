# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: poppler/25.12.0
homepage: "https://poppler.freedesktop.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 注: poppler 测试数据需要单独从 git clone 获取，源码包不包含
upstream_tests:
  - file: test/CMakeFiles/pdf-fullrewrite.dir/pdf-fullrewrite.cc.o
    source: poppler-25.12.0/test/pdf-fullrewrite.cc
    description: "PDF full rewrite test"
    command: "./pdf-fullrewrite"
  - file: test/CMakeFiles/image-embedding.dir/image-embedding.cc.o
    source: poppler-25.12.0/test/image-embedding.cc
    description: "Image embedding test"
    command: "./image-embedding"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 - 验证 poppler 库可链接且头文件可包含"
    command: "./test_poppler"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
