software: poppler
# 软件级 manifest
# 文件位置: archives/p/poppler/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件描述
# ============================================================

description: "PDF 渲染库，提供 PDF 文档处理功能"

# 软件主页
homepage: https://poppler.freedesktop.org/

# 源码仓库
repository: https://gitlab.freedesktop.org/poppler/poppler

# 许可证
license: GPL-2.0-or-later

# ============================================================
# 分类信息
# ============================================================

# 软件分类
category: library

# 标签
tags:
  - pdf
  - document
  - rendering

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "25.12.0.2"
    status: built
    build_date: "2026-08-04"
    notes: >-
      在 25.12.0.1 基础上启用 glib 前端（ENABLE_GLIB=ON），供 graphviz 的 poppler
      插件使用——它按 pkg-config 名 poppler-glib 查找。25.12.0.1 只编了核心库。
      另修复 fontconfig 欠链接：上游判全大写 FONTCONFIG_FOUND，而 conan 的 config
      设的是 Fontconfig_FOUND，导致代码编进去了库却没链上，libpoppler.so 的
      DT_NEEDED 缺 libfontconfig，bin/ 下 12 个 CLI 全部 symbol not found。
  - version: "25.12.0.1"
    status: built
    build_date: "2026-07-28"
    notes: >-
      25.12.0 的构建方式修复版（源码/补丁/功能开关不变）：改用自发现 SDK ohos.toolchain
      + 裸 cmake，恢复被 conan CMakeToolchain 丢掉的 SONAME（poppler=155、poppler-cpp=2）
      与版本软链；补 ELF 代码签名（lib/*.so* 与 bin/ 下 11 个 CLI 工具）；
      test_package 改为真实解析 PDF 的 8 条断言且不再吞掉运行期失败
  - version: "25.12.0"
    status: published
    build_date: "2026-07-08"
    notes: >-
      37 补丁 C++23 std::ranges 兼容性修复 + OHOS 平台适配, CI SUCCESS。
      已知缺陷：产物无 SONAME，libpoppler-cpp.so 的 DT_NEEDED 为相对路径
      ../libpoppler.so；且未做 ELF 代码签名。已由 25.12.0.1 修复
