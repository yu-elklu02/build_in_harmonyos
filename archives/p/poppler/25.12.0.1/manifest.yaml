software: poppler
version: "25.12.0.1"
status: built
build_date: "2026-07-28"
build_system: cmake

source:
  url: "https://poppler.freedesktop.org/poppler-25.12.0.tar.xz"
  sha256: "c18b40eb36b1a0c5b86e29ca054bf0770304583da4f2cdd42fe86eca6a20de48"
  tar_format: tar.xz

build:
  system: cmake
  cc: clang
  cxx: clang++
  # 走「自发现 SDK ohos.toolchain + 裸 cmake」，不用 conan 的 CMakeToolchain
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<SDK>/ohos/native/build/cmake/ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_RANLIB=/data/service/hnp/bin/llvm-ranlib"
    - "-DFONT_CONFIGURATION=generic"
    - "-DENABLE_CPP=ON"
    - "-DENABLE_BOOST=OFF"
    - "-DENABLE_GLIB=OFF"
    - "-DENABLE_QT5=OFF"
    - "-DENABLE_QT6=OFF"
    - "-DENABLE_NSS3=OFF"
    - "-DENABLE_GPGME=OFF"
    - "-DENABLE_LIBCURL=OFF"
    - "-DENABLE_LIBTIFF=OFF"
    - "-DENABLE_LCMS=OFF"
    - "-DENABLE_DCTDECODER=none"
    - "-DENABLE_LIBOPENJPEG=none"
    - "-DENABLE_UNSTABLE_API_ABI_HEADERS=ON"
  dependencies:
    - freetype/2.14.3
    - zlib/1.3.1.1

# 39 个补丁与 25.12.0 完全一致（C++23 std::ranges 兼容 + iconv 可选化），本次未增删
patches_count: 39

knowledge_gained:
  - "conan 的 CMakeToolchain 在 os=OHOS 下把 CMAKE_SYSTEM_NAME 映射成 cmake 不认的 HarmonyOS（ML-0035），产出的 .so 既无 SONAME 也无版本软链——哪怕上游 CMakeLists 明确设了 SOVERSION（poppler=155、poppler-cpp=2）也会被丢掉。改用 SDK 的 ohos.toolchain + 裸 cmake 即恢复正常。"
  - "缺 SONAME 的后果落在消费方：链接器把被链库的路径原样写进 DT_NEEDED。libpoppler-cpp.so 因此得到 `../libpoppler.so` 这种相对路径，加载器按进程 CWD 解析，基本不可能命中。"
  - "cmake install 是复制、不重链，会破坏链接器自签；改走 SDK ohos.toolchain 后自签更是无效，故 package() 里须对 lib/*.so* 与 bin/ 下的真实 ELF 一并重签。（据实记录：25.12.0 的产物带 .codesign 段且能 exec，其 CLI 失败是 SONAME 缺陷所致、非签名问题。）"
  - "test_package 若用 try/except 把运行期失败降级成 warning，会让上述缺陷长期隐身——运行失败必须判失败。"
