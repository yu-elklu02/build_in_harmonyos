# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: poppler/25.12.0.1
homepage: "https://poppler.freedesktop.org/"

upstream_check_command: "ctest"

# 上游 ctest 需单独 git clone 测试数据（源码包不含），故未在 build() 中集成
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/pdf-fullrewrite.cc
    source: poppler-25.12.0/test/pdf-fullrewrite.cc
    description: "PDF full rewrite test（需外部测试数据，未运行）"
    command: "./pdf-fullrewrite"
  - file: test/image-embedding.cc
    source: poppler-25.12.0/test/image-embedding.cc
    description: "Image embedding test（需外部测试数据，未运行）"
    command: "./image-embedding"

test_package_tests:
  - file: test.cpp
    description: "直接链接 poppler-cpp 并做真实解析：运行时生成一份合法单页 PDF（xref 偏移动态计算），经 document::load_from_file 与 load_from_data 两条入口解析，校验页数/加密状态/页面尺寸，并抽取页面文本核对内容"
    command: "./test_poppler"

assertion_count: 8
