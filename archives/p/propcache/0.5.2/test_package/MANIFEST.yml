# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: propcache/0.5.2
homepage: "https://github.com/aio-libs/propcache"

# 上游测试命令 — 上游测试依赖 pytest，构建阶段不纳入
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — 构建阶段不运行上游测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试 — 验证 propcache 可导入且核心 API 可用"
    command: "python3 -c 'import propcache'"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2