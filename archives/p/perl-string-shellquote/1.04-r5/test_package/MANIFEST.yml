# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-string-shellquote/1.04-r5
homepage: "https://metacpan.org/dist/String-ShellQuote"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "perl -Iblib/lib test.t"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.t
    source: String-ShellQuote-1.04/test.t
    description: "上游官方测试套件，覆盖 shell_quote、shell_quote_best_effort、shell_comment_quote 三个函数及 shell-quote CLI 工具"
    command: "perl -Iblib/lib test.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Conan 消费者测试：验证模块加载、shell_quote/shell_quote_best_effort/shell_comment_quote 函数正确性、null 字节异常处理、shell-quote CLI 工具"
    command: "conan test test_package perl-string-shellquote/1.04-r5"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 33
