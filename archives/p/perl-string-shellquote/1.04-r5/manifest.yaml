software: perl-string-shellquote
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.04-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.04-r5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RO/ROSCH/String-ShellQuote-1.04.tar.gz"

  # 源码校验和
  sha256: "e606365038ce20d646d255c805effdd32f86475f18d43ca75455b00e4d86dd35"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 代码）在鸿蒙平台可直接编译，无需处理 CRT 文件缺失或 SELinux 限制"
  - "Perl ExtUtils::MakeMaker 构建系统在鸿蒙平台兼容性良好"
  - "上游 test.t 中 fork 子进程的测试需要设置 PERL5LIB 环境变量才能找到模块"
  - "test_package 测试应避免复杂的 shell 转义，使用临时 Perl 脚本文件更可靠"
  - "与 perl-dbd-pg 等 XS 模块不同，纯 Perl 模块无需补丁和特殊链接参数"
