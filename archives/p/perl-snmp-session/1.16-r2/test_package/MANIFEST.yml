# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-snmp-session/1.16-r2
homepage: https://github.com/sleinen/snmp-session

# 源码自带测试: make test 运行 t/00ber.t (15 项 BER 编解码测试)
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: t/00ber.t
    description: "BER 编解码基础测试 (15 项断言)"
    command: "perl -Iblib/lib t/00ber.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_snmp_session.sh
    description: "L0c wrapper: runs test_snmp_session.pl (SNMP_Session 模块加载 + 版本验证 + BER encode_oid 编码测试)"
    command: "sh test_snmp_session.sh"

# 测试断言总数
assertion_count: 17
