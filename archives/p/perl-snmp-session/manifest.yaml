# 软件级 manifest
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-snmp-session

# 软件描述
description: "Perl SNMP Session module - SNMP protocol access for Perl"

# 分类
category: network

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "1.16-r2"
    status: built
    build_date: "2026-06-29"
    path: archives/p/perl-snmp-session/1.16-r2

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://github.com/sleinen/snmp-session

# 源码仓库
repository: https://github.com/sleinen/snmp-session

# 许可证
license: Artistic-2.0

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl (>= 5.6.0)

# 可选依赖
optional_dependencies:
  - IO::Socket::INET6 (IPv6 支持)
  - Net::SNMP (Net_SNMP_util.pm 需要)
  - Socket6 (IPv6 支持)

# 编译依赖
build_dependencies:
  - perl (ExtUtils::MakeMaker)
