test_type: conan_test_package
assertion_count: 5
assertions:
  - "tool_requires exposes perl on PATH through VirtualBuildEnv"
  - "PERL environment variable points at the packaged interpreter"
  - "perl reports version 5.42.2"
  - "core modules Config and File::Spec can be loaded from the packaged core library"
  - "perl can execute a small script, covering the Open MPI and MPICH configure-time tool use case"
upstream_tests:
  available: true
  command: "make test_harness_notty"
  notes: "The full Perl upstream suite is large; run it only in an explicitly scheduled device/shadow CI slot."
consumers:
  - "open-mpi/5.0.10 configure requires perl"
  - "mpich/4.0.3 build/configure flow also needs perl available as a build tool"
