consumers:
  - "open-mpi/5.0.10: configure requires perl"
  - "mpich/4.0.3: build/configure flow needs perl available as a build tool"

known_limits:
  - "Full upstream Perl make test_harness_notty was run on true device and ended Result: FAIL. The remaining known failures are concentrated in OHOS filesystem/POSIX semantic gaps such as symlink/hardlink, chmod/-w/access, termios/signal behavior, Unix socket path length, locale/timezone checks, and direct shell-script execution. The latest true-device Conan rerun after -Ud_prctl_set_name and IPC/SysV exclusion passed L0 including commands.json and created package revision d8f9b5d50161ac009ed647586fab2d9a, then failed only because the device work copy's test_perl.sh had CRLF line endings. The LF-normalized smoke test passed against that generated package; a fresh full Conan rerun is paused per user instruction after the failed build."
