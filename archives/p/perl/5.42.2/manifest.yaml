software: perl
version: "5.42.2"
status: built
build_date: "2026-07-26"
issue: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/1478"

source:
  url: "https://www.cpan.org/src/5.0/perl-5.42.2.tar.gz"
  mirrors:
    - "https://mirrors.tuna.tsinghua.edu.cn/CPAN/src/5.0/perl-5.42.2.tar.gz"
    - "https://mirrors.ustc.edu.cn/CPAN/src/5.0/perl-5.42.2.tar.gz"
    - "https://mirrors.aliyun.com/CPAN/src/5.0/perl-5.42.2.tar.gz"
  sha256: "9384e8deb75b7b1695e5637971b752281aaecd025a3d5d4734d33c1d0adfee47"
  analysis_tar_xz_sha256: "0a585eeb9e363c0f80482ddb3571625250c2c86aeb408853e8ea50805cfb14bb"

build:
  system: "perl Configure"
  target: "OHOS/aarch64 native"
  dependencies: []
  configuration:
    - "-des"
    - "-Dprefix=/"
    - "-Dsiteprefix=/"
    - "-Dvendorprefix=/"
    - "-Uuseshrplib"
    - "-Dusethreads"
    - "-Dusemymalloc=n"
    - "-Dlibswanted=pthread dl m c"
    - "-Dnoextensions=GDBM_File NDBM_File ODBM_File DB_File IPC/SysV"
    - "-Dosname=linux"
    - "-Darchname=aarch64-linux"
    - "-Dlns=<build-folder>/ohos-ln-copy.sh"
    - "-Ui_langinfo"
    - "-Ud_nl_langinfo"
    - "-Ud_nl_langinfo_l"
    - "-Ud_prctl_set_name"
  patches:
    - "patches/0001-miniperl-touch-noop.patch"
    - "patches/0002-extutils-install-write-probe.patch"
    - "patches/0003-installperl-write-probe.patch"

test_package:
  type: "tool smoke"
  requires_runtime: true
  commands:
    - "perl version check"
    - "perl -MConfig -MFile::Spec"
    - "small strict/warnings script execution"

