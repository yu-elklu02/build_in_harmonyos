software: perl-starlet
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.31-r3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.31-r3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# 功能验证日期
test_date: "2026-07-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://cpan.metacpan.org/authors/id/K/KA/KAZUHO/Starlet-0.31.tar.gz"

  # 源码校验和
  sha256: "b9603b8e62880cb4582f6a7939eafec65e6efd3d900f2c7dd342e5f4c68d62d8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl -I. Makefile.PL"

  # 运行时依赖（已安装验证）
  runtime_dependencies:
    - "Parallel::Prefork 0.18"
    - "Plack 1.0054"
    - "Server::Starter 0.35"

  # 编译依赖（纯 Perl 模块无 C 编译依赖）
  dependencies: []

  # 编译器
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁。MYMETA.json/yml 差异为 perl Makefile.PL 运行时自动生成的元数据，
# 非源码补丁，构建时由 Makefile.PL 重新生成，已在 notes.md 中记录。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Starlet 是纯 Perl 模块（Module::Install 构建系统），不需要 C 编译器"
  - "Perl 5.26+ 移除了 '.' from @INC，需要 perl -I. Makefile.PL"
  - "MYMETA.json/yml 文件是 Makefile.PL 运行时自动生成的元数据，不应作为补丁应用"
  - "Starlet 运行时依赖 Parallel::Prefork、Plack、Server::Starter，共需安装 29 个 CPAN 模块"
  - "OpenHarmony 上 sudo 无法提权，Perl 模块需安装到用户本地目录 + PERL5LIB"
  - "XS 模块 .so 文件无法从用户目录加载（SELinux/HMDFS 限制），需创建纯 Perl 替代"
  - "Proc::Wait3 可用 waitpid() 纯 Perl 替代；Clone 可用递归深拷贝替代"
  - "Starlet HTTP 服务器在 OpenHarmony 上功能正常（GET/POST/路由全部通过）"
  - "Plack 1.0054 依赖链包括 HTTP::Message、URI、File::ShareDir 等 20+ 纯 Perl 模块"

# MYMETA.json/yml 差异为 perl Makefile.PL 运行时自动生成的元数据，
# 非源码补丁，已在 notes.md 中记录，不作为补丁文件保留。
patch_generation:
  method: none
  patches_count: 0
