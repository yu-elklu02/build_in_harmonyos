# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-starlet/0.31-r3
homepage: "https://metacpan.org/dist/Starlet"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
# Starlet 上游测试套件位于 t/ 目录，需要 Test::TCP、LWP::UserAgent、
# Server::Starter (start_server 命令) 和 plackup 命令才能运行
upstream_tests:
  - file: t/00base.t
    source: perl-starlet-0.31-r3/t/00base.t
    description: "基础 HTTP 请求测试，验证 GET / 返回 hello"
    command: "perl -Ilib t/00base.t"
  - file: t/01plack-test.t
    source: perl-starlet-0.31-r3/t/01plack-test.t
    description: "Plack::Test 集成测试"
    command: "perl -Ilib t/01plack-test.t"
  - file: t/02graceful.t
    source: perl-starlet-0.31-r3/t/02graceful.t
    description: "优雅关闭测试"
    command: "perl -Ilib t/02graceful.t"
  - file: t/03post.t
    source: perl-starlet-0.31-r3/t/03post.t
    description: "POST 请求处理测试"
    command: "perl -Ilib t/03post.t"
  - file: t/05server-header.t
    source: perl-starlet-0.31-r3/t/05server-header.t
    description: "服务器响应头测试"
    command: "perl -Ilib t/05server-header.t"
  - file: t/06harakiri.t
    source: perl-starlet-0.31-r3/t/06harakiri.t
    description: "Harakiri (进程自杀) 测试"
    command: "perl -Ilib t/06harakiri.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "模块加载验证：perl -MStarlet -e 'print Starlet->VERSION'"
    command: "perl -MStarlet -e 'print Starlet->VERSION . qq(\\n)'"

# 测试断言总数 (近似值, 用于质量评估)
# 上游测试约 15 个测试文件，每个含多个断言，但无法在当前环境运行
# test_package 验证 1 个断言（版本号输出）
assertion_count: 1
