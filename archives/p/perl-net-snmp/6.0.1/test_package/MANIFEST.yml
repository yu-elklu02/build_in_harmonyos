# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-net-snmp/6.0.1
homepage: https://metacpan.org/release/DTOWN/Net-SNMP-v6.0.1

# Net::SNMP 无独立测试套件，验证通过 test_package 消费者测试完成
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_snmp.sh
    description: "Net::SNMP 模块加载 + 版本验证 + session() 对象创建验证"
    command: "sh test_snmp.sh"

# 测试断言总数
assertion_count: 3
