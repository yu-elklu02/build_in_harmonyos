version: "6.0.1"
status: built
build_date: "2026-06-26"

source:
  url: "https://cpan.metacpan.org/authors/id/D/DT/DTOWN/Net-SNMP-v6.0.1.tar.gz"
  sha256: "14c37bc1cbb3f3cdc7d6c13e0f27a859f14cdcfd5ea54a0467a88bc259b0b741"
  tar_format: tar.gz

build:
  system: perl
  configure_options:
    - "perl Makefile.PL"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "纯 Perl 模块无需 C/XS 编译，不受 OpenHarmony SELinux HMDFS 限制，可通过 PERL5LIB 直接加载"
  - "SNMPv3 USM 的可选依赖 (Crypt::DES, Digest::SHA1) 可通过纯 Perl 包装器解决: Crypt::DES_PP 提供 DES 加密, Digest::SHA 核心模块提供 SHA1"
  - "IPv6 传输的可选依赖 Socket6 可通过纯 Perl 包装器解决: Perl 5.42 核心 Socket v2.038 已有完整 IPv6 支持 (AF_INET6/getaddrinfo/inet_pton/inet_ntop/pack_sockaddr_in6)"
  - "XS 模块 .so 文件在 OpenHarmony 上无法从 HMDFS 用户目录加载 (SELinux Permission denied), 系统目录 /data/service/hnp 无写入权限, 纯 Perl 包装器是唯一可行方案"
  - "Crypt::DES XS 编译需要 musl 头文件 (-I~/usr/local/include) 和修复 DES.xs 中 perl_ 前缀函数名为 _des_ 前缀, 链接需 -L~/usr/local/lib -lc -l:libunwind.a"
  - "PERL5LIB 环境变量覆盖会丢失已有路径, 需使用 export PERL5LIB=$NEW_PATH:$PERL5LIB 追加而非覆盖"
  - "conan create 验证通过，test_package 输出 Net::SNMP version: v6.0.1, conan-verify 8 道门禁全部 PASS"
