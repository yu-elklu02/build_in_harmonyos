software: perl-net-snmp
display: "Net::SNMP — Perl SNMP Client"
description: "面向对象的 SNMP 接口模块，支持 SNMPv1/v2c/v3 协议、UDP/TCP 传输、IPv4/IPv6"
category: perl
homepage: "https://metacpan.org/release/DTOWN/Net-SNMP-v6.0.1"
license: GPL-1.0-or-later OR Artistic-1.0-Perl
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C/XS 编译，不受 SELinux HMDFS 限制"
    - "通过 PERL5LIB 加载，无需安装到系统目录"
    - "SNMPv3 USM 可选依赖通过纯 Perl 包装器解决: Crypt::DES→Crypt::DES_PP, Digest::SHA1→Digest::SHA"
    - "IPv6 传输可选依赖通过纯 Perl 包装器解决: Socket6→核心 Socket v2.038"
    - "XS 模块 .so 在 OpenHarmony 无法从 HMDFS 加载,纯 Perl 包装器是唯一可行方案"
  common_dependencies: []
  optional_dependencies:
    - name: "Crypt::DES"
      solution: "Crypt::DES_PP 纯 Perl 包装器"
      source: "CPAN Crypt-DES_PP-1.00"
    - name: "Digest::SHA1"
      solution: "Digest::SHA 核心模块包装器"
      source: "Perl 5.42 核心"
    - name: "Socket6"
      solution: "Socket 核心模块包装器"
      source: "Perl 5.42 核心"

versions:
  "6.0.1":
    status: built
    build_date: "2026-06-26"
    published_as: perl-net-snmp
    source_url: "https://cpan.metacpan.org/authors/id/D/DT/DTOWN/Net-SNMP-v6.0.1.tar.gz"
