# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-orlite/2.00-r0
homepage: "https://metacpan.org/dist/ORLite"

# 上游测试命令 (Perl MakeMaker: make test)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (t/*.t)
upstream_tests:
  - file: t/01_compile.t
    source: perl-orlite-2.00-r0/t/01_compile.t
    description: "模块编译测试"
    command: "perl -Iblib/lib t/01_compile.t"
  - file: t/02_basics.t
    source: perl-orlite-2.00-r0/t/02_basics.t
    description: "基本功能测试"
    command: "perl -Iblib/lib t/02_basics.t"

# test_package 中自带的测试 (消费者视角验证)
# 使用 mock DBD::SQLite 注入 %INC，实际 use ORLite 并调用 API 方法 (R34)
test_package_tests:
  - file: test_orlite.sh
    description: "ORLite.pm 文件存在性验证"
    command: "perl -e 'grep { -f \"$_/ORLite.pm\" } @INC'"
  - file: test_orlite.sh
    description: "ORLite API 调用验证 (mock DBD::SQLite + use ORLite + 9 核心方法 can() 检查)"
    command: "sh test_orlite.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 文件存在(1) + 版本(1) + TestDB生成(1) + 9方法can()(9) = 12
assertion_count: 12
