software: perl-orlite
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.00-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.00-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# 构建系统类型 (顶层字段，供自检脚本检查)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/ORLite-2.00.tar.gz"

  # 源码校验和
  sha256: "dd4bc23ab4c87c5096a406aaa03c75e2f9e48f858c7283d84cff8af24b82defa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E155: 纯 Perl 模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无 C 编译"
  - "E046: DBD::SQLite .so 在 OHOS 上受 SELinux 限制无法加载 (hmdfs:s0)，影响运行时测试但不影响编译"
  - "DBI 1.637 内置 PurePerl 自动回退机制，.so 加载失败时可用；DBD::SQLite 是纯 XS 模块无回退"
  - "CPAN 作者可能变更，需通过 fastapi.metacpan.org API 查询正确下载 URL"
  - "Conan 配方需从 Autotools 模板适配为 Perl 构建系统 (perl Makefile.PL && make)"
  - "test_package 应使用 mock 机制注入 DBD::SQLite stub 到 %INC，绕过 .so 加载限制验证 API 接口"
  - "参考 perl-dbd-pg 经验: XS 模块 .so 需安装到 /data/service/hnp 系统目录获得 hnp_file:s0 SELinux 类型"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
