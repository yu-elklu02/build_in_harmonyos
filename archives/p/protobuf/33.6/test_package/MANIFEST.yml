package: protobuf/33.6
homepage: "https://github.com/protocolbuffers/protobuf"

upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"
upstream_test_reason: "The recipe runs the four upstream CTest entries whenever Conan can execute target binaries; a Windows cross build only produces the AArch64 test programs, which are then executed on HarmonyOS PC."
upstream_tests:
  - file: cmake/tests.cmake
    source: protobuf-33.6/cmake/tests.cmake
    description: "Registers lite-test, full-test, lazily-build-dependencies-test, and upb-test; 3175 gtest macro occurrences were counted in 170 test source/header files."
    command: "ctest --output-on-failure --no-tests=error"

test_package_tests:
  - file: test_protobuf.cpp
    description: "Any pack/unpack, binary serialization, JSON conversion, and Arena allocation/reset"
    command: "ctest --output-on-failure --no-tests=error"
  - file: CMakeLists.txt
    description: "Runs the packaged protobuf::protoc imported executable with --version"
    command: "ctest --output-on-failure --no-tests=error"

assertion_count: 19
