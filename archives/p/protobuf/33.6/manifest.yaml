software: protobuf
version: "33.6"
status: built
build_date: "2026-08-05"
build_system: cmake
source:
  url: "https://github.com/protocolbuffers/protobuf/archive/refs/tags/v33.6.tar.gz"
  sha256: "e825cac584256f88840ab6cf37add69ba0c6145811329d75642698a622d13498"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-Dprotobuf_BUILD_TESTS=ON"
    - "-Dprotobuf_BUILD_CONFORMANCE=OFF"
    - "-Dprotobuf_BUILD_EXAMPLES=OFF"
    - "-Dprotobuf_BUILD_SHARED_LIBS=OFF"
    - "-Dprotobuf_BUILD_PROTOC_BINARIES=ON"
    - "-Dprotobuf_BUILD_LIBUPB=ON"
    - "-Dprotobuf_LOCAL_DEPENDENCIES_ONLY=ON"
    - "-Dprotobuf_WITH_ZLIB=ON"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
  dependencies:
    - abseil-cpp/20260107.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-use-local-googletest-source.patch"
knowledge_gained:
  - "Cross builds package target protobuf libraries and target protoc without executing them on the Windows build machine."
  - "Protobuf's upstream component-rich CMake config must remain installed so utf8_range and libprotoc targets keep their transitive contracts."
  - "Installed pkg-config files must use pcfiledir-relative prefixes so Windows Conan cache paths do not leak into target packages."
  - "OHOS must not be added to Protobuf's Android-only liblog branch."
  - "CMake requires build-with-install RPATH for target executables when the OHOS system name is not classified as ELF on a Windows host."
