# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-object-event/1.23-r0
homepage: "https://metacpan.org/dist/Object-Event"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# make test 已移除: 上游测试依赖 common::sense/AnyEvent，CI worker 无此模块
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01-load.t
    source: Object-Event-1.23/t/01-load.t
    description: "Module loading test"
    command: "perl -Mblib t/01-load.t"
  - file: t/02-api.t
    source: Object-Event-1.23/t/02-api.t
    description: "Event API (reg_cb/event/unreg_cb) tests"
    command: "perl -Mblib t/02-api.t"
  - file: t/03-order.t
    source: Object-Event-1.23/t/03-order.t
    description: "Event callback ordering tests"
    command: "perl -Mblib t/03-order.t"
  - file: t/04-before.t
    source: Object-Event-1.23/t/04-before.t
    description: "before callback priority tests"
    command: "perl -Mblib t/04-before.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_object_event.sh
    description: "Consumer test: load Object::Event, verify version, reg_cb/event/unreg_cb API, guard auto-unregister"
    command: "bash test_object_event.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
