software: perl-object-event
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.23-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.23-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/EL/ELMEX/Object-Event-1.23.tar.gz"

  # 源码校验和
  sha256: "ab6bb80508f4fddaf2d51b20ca876aab038582a86b5228e6435411348af53c82"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "INSTALL_BASE=/"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 运行时依赖（补丁移除了 common::sense 和 AnyEvent，模块自包含）
  runtime_dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: "patches/0001-remove-common-sense-anyevent-deps.patch"
    description: "Replace common::sense and AnyEvent::Util::guard with self-contained equivalents"
    type: portability

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 Makefile.PL + INSTALL_BASE=/ + DESTDIR 模式安装，无需 C 编译"
  - "Object::Event 原依赖 common::sense 和 AnyEvent::Util::guard，通过补丁替换为标准 pragma 和内联 guard 实现，使模块自包含"
  - "common::sense 等价于 use strict (不含 refs) + use warnings + feature say/state/switch + no warnings uninitialized"
  - "AnyEvent::Util::guard 可用最小 DESTROY 对象替代，实现 scope-guard 自动注销回调"
  - "纯 Perl 模块无 SELinux 限制问题（与 perl-dbd-pg 的 XS 模块不同）"
