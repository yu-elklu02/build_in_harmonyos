# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-package-stash-xs

# 软件描述
description: "Package::Stash::XS - Faster and more correct implementation of the Package::Stash API (XS)"

# 分类
category: perl-library

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
