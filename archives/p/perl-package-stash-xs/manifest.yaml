    status: built
    build_date: "2026-07-02"
    path: archives/p/perl-package-stash-xs/0.30-r5

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Package-Stash-XS

# 源码仓库
repository: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Package-Stash-XS-0.30.tar.gz

# 许可证
license: perl_5

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl
  - perl-package-stash

# 编译依赖
build_dependencies:
  - musl (提供标准 C 库头文件)
  - clang
