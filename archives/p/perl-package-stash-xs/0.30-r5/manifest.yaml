# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.30-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.30-r5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/Package-Stash-XS-0.30.tar.gz"

  # 源码校验和
  sha256: "26bad65c1959c57379b3e139dc776fbec5f702906617ef27cdc293ddf1239231"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -L/system/lib64 -lc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (Perl 运行时)
    - perl-package-stash/0.40 (Package::Stash 纯 Perl 版本)
    - musl/1.2.x (提供标准 C 库头文件)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.PL.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），Perl XS 模块链接需要 -nostartfiles -nodefaultlibs -L/system/lib64 -lc"
  - "鸿蒙系统缺少标准 C 头文件（sys/types.h, endian.h），需要通过 INC 指向 _sysheaders_backup 目录"
  - "SELinux HMDFS 限制导致用户目录下的 .so 无法被 dlopen 加载，需安装到 /data/service/hnp 系统目录"
  - "Makefile.PL 中可通过 dynamic_lib => { OTHERLDFLAGS => ... } 和 INC 参数添加鸿蒙适配"
  - "XS 模块编译产物已包含 .codesign section（已签名），binary-sign-tool 可用于重新签名"
  - "HNP 包可通过 hnpcli pack 命令创建，安装需要 installs 用户权限"

