# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-package-stash-xs/0.30-r5
homepage: "https://metacpan.org/dist/Package-Stash-XS"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-report-prereqs.t
    source: perl-package-stash-xs-0.30-r5/t/00-report-prereqs.t
    description: "检查编译依赖是否满足"
    command: "perl t/00-report-prereqs.t"
  - file: t/zzz-check-breaks.t
    source: perl-package-stash-xs-0.30-r5/t/zzz-check-breaks.t
    description: "检查模块兼容性"
    command: "perl t/zzz-check-breaks.t"
  - file: t/stash.t
    source: perl-package-stash-xs-0.30-r5/t/stash.t
    description: "Package::Stash::XS 核心功能测试"
    command: "perl t/stash.t"
  - file: t/magic.t
    source: perl-package-stash-xs-0.30-r5/t/magic.t
    description: "变量魔术处理测试"
    command: "perl t/magic.t"
  - file: t/leak.t
    source: perl-package-stash-xs-0.30-r5/t/leak.t
    description: "内存泄漏测试"
    command: "perl t/leak.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xs.sh
    description: "Perl XS 模块加载与 API 验证"
    command: "sh test_xs.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
