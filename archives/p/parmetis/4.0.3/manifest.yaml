software: parmetis
version: 4.0.3
status: built
build_system: cmake
created_at: 2026-08-10
dependencies:
  required:
    - open-mpi/5.0.10
  optional: []
source_url: https://karypis.github.io/glaros/files/sw/parmetis/parmetis-4.0.3.tar.gz
source_sha256: f2d9a231b7cf97f1fee6e8c9663113ebf6c240d407d3c118c55b3633d6be6e5f
patches_applied: []
configure_options:
  - "-DGKLIB_PATH=<source>/metis/GKlib"
  - "-DMETIS_PATH=<source>/metis"
  - "-DSHARED=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DMPI_INCLUDE_PATH=<openmpi>/include"
  - "-DMPI_LIBRARIES=mpi"
  - "-DMPI_LINK_FLAGS=-L<openmpi>/lib"
  - "-DCMAKE_EXE_LINKER_FLAGS=-L<openmpi>/lib"
knowledge_gained:
  - ParMETIS bundles METIS and GKlib internally (no external METIS dep needed)
  - CMakeLists.txt FindMPI commented out, tried mpicc first but OPAL_PREFIX not in buildenv
  - mpicc approach abandoned: OPAL_PREFIX env propagation unreliable through Conan self.run()
  - Explicit MPI_INCLUDE_PATH + MPI_LIBRARIES=mpi + CMAKE_EXE_LINKER_FLAGS works
  - CMAKE_EXE_LINKER_FLAGS needed because LINK_FLAGS on static library target does NOT propagate to executables in CMake
  - libmetis.a built but not installed by upstream CMake (needs manual copy in package())
  - metis.h not installed either (same root cause: add_subdirectory bypasses metis/CMakeLists.txt)
  - No upstream test suite distributed in release tarball
test_results:
  type: explicit
  total: 1
  passed: 1
  failed: 0
