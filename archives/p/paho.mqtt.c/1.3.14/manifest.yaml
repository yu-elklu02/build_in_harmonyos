version: "1.3.14"
software: paho.mqtt.c
status: built
build_date: "2026-07-25"
build_system: cmake

source:
  url: "https://github.com/eclipse/paho.mqtt.c/archive/refs/tags/v1.3.14.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DPAHO_WITH_SSL=FALSE"
    - "-DPAHO_BUILD_STATIC=TRUE"
    - "-DPAHO_BUILD_SHARED=TRUE"
    - "-DPAHO_BUILD_SAMPLES=FALSE"

conan_verify:
  g1: pass
  g2: pass
  g3: pass
  g4: pass
  date: "2026-07-25"

notes: "No patches required. Native HarmonyOS compatibility. Static + shared libraries."
