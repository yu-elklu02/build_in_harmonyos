software: pdnsd
version: "1.2.9.a"
status: built
build_date: "2026-07-30"

source:
  url: "https://github.com/kwarunek/pdnsd/archive/c77e16f2c0c5bd146de181c0a507c38a437b6f7d.tar.gz"
  sha256: "44533225e19a2ba94e65dce989482542d7e6a5ebf710de430219bfc47ffa31ed"
  tar_format: tar.gz

build:
  system: autotools on Linux, direct clang compile on OHOS cross builds
  configure_options:
    - "--with-target=Linux"
    - "--with-thread-lib=NPTL"
    - "--with-default-id=root"
    - "--with-cachedir=/var/cache/pdnsd"
    - "--sysconfdir=/etc"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "recipe patch: include net/if.h before linux/icmp.h in src/icmp.c to avoid glibc/linux if.h redefinitions"
  - "OHOS recipe path: use static configure-equivalent config.h and direct clang compile because Windows host cannot execute Autotools configure"
  - "test_package: locate bash from CONFIG_SHELL, PATH, or OHOS /data/service/hnp/bin/bash instead of hard-coding /bin/bash"

upstream_tests:
  framework: autotools
  count: 4
  command: "make check, then run src/test/if_up lo, is_local_addr 127.0.0.1, tping 127.0.0.1, random"
  basis: "src/test/Makefile.am noinst_PROGRAMS = if_up is_local_addr tping random"

binaries:
  - pdnsd
  - pdnsd-ctl
