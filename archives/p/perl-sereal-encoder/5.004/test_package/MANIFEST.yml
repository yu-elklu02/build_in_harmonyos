# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-sereal-encoder/5.004
homepage: https://metacpan.org/dist/Sereal-Encoder

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# make test 需要 .so runtime 加载，OHOS HMDFS/SELinux 限制 (E046) 阻止 dlopen
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (Perl .t 文件)
# 所有测试依赖 use Sereal::Encoder 触发 .so 加载，因 E046 无法在 conan 缓存中运行
upstream_tests:
  - file: t/001_basic.t
    source: Sereal-Encoder-5.004/t/001_basic.t
    description: "基本编码功能测试"
  - file: t/002_flags.t
    source: Sereal-Encoder-5.004/t/002_flags.t
    description: "编码标志测试"
  - file: t/003_roundtrip.t
    source: Sereal-Encoder-5.004/t/003_roundtrip.t
    description: "编码-解码往返测试"
  - file: t/004_nesting.t
    source: Sereal-Encoder-5.004/t/004_nesting.t
    description: "嵌套数据结构编码测试"
  - file: t/005_options.t
    source: Sereal-Encoder-5.004/t/005_options.t
    description: "编码器选项测试"
  - file: t/006_freeze.t
    source: Sereal-Encoder-5.004/t/006_freeze.t
    description: "FREEZE/THAW 钩子测试"
  - file: t/007_scalars.t
    source: Sereal-Encoder-5.004/t/007_scalars.t
    description: "标量编码测试"
  - file: t/008_aliases.t
    source: Sereal-Encoder-5.004/t/008_aliases.t
    description: "别名引用编码测试"
  - file: t/009_tied.t
    source: Sereal-Encoder-5.004/t/009_tied.t
    description: "tied 变量编码测试"
  - file: t/010_objects.t
    source: Sereal-Encoder-5.004/t/010_objects.t
    description: "Perl 对象编码测试"

# test_package 中自带的测试 (消费者视角验证)
# 使用文件验证模式：.pm 语法检查 + ELF 验证 + 签名验证 + 符号表检查
test_package_tests:
  - file: test_encoder.py
    description: "文件验证 + Perl 语法检查 + ELF 签名 + 符号表"
    command: "conan test"

# 测试断言总数 (近似值)
# test_package: 7 项断言 (文件存在 + 语法 + ELF + 签名 + 符号 + 版本)
# 上游测试: ~100 项 (因 E046 无法运行，仅声明)
assertion_count: 7
