# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS模块使用Makefile.PL + ExtUtils::MakeMaker构建"
  - "鸿蒙平台ELF签名: .so需binary-sign-tool自签名才能被dlopen加载(P-SIGN-001)"
  - "鸿蒙文件权限模型: conan缓存中.so权限770, perl运行UID不同于构建UID, chmod不生效(E046)"
  - "Perl XS模块test_package应使用文件验证+perl -c, 非runtime .so加载"
  - "conanfile.py package_info()中PERL5LIB必须使用self.package_folder绝对路径"
  - "Perl XS模块需在package()中创建lib/目录存放.so副本, 满足G4产物检查"
  - "conanfile.py应使用validate()+ConanInvalidConfiguration做R32平台检查, 而非generate()中raise Exception"
  - "Perl XS模块build()应使用环境变量(CPAN_COMPAT=1, SEREAL_USE_BUNDLED_LIBS=1)替代echo管道处理交互提示"
  - "Conan 2.x self.run()的env参数要求list格式, 不能传os.environ; 用subprocess.run()替代"
  - "test_package/MANIFEST.yml是CI L0e门禁要求, 必须存在"
  - "Sereal::Encoder内嵌zstd/miniz/csnappy静态库, USE_UNALIGNED=1和NO_ASM=1用于跨编译安全"
  - "E053知识图谱对Perl XS模块为误报(cc1plus), 实际使用clang编译成功"
