package: pygments/2.20.0.1
homepage: "https://pygments.org"

upstream_check_command: "python3 -m pytest -q --randomly-seed=1 tests"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest -q --randomly-seed=1 tests"

upstream_tests:
  - file: tests/test_basic_api.py
    source: Pygments 2.20.0 official PyPI sdist
    description: "Public API, lexer, formatter, and filter registration behavior."
    command: "python3 -m pytest -q tests/test_basic_api.py"
  - file: tests/test_cmdline.py
    source: Pygments 2.20.0 official PyPI sdist
    description: "pygmentize option parsing, input, output, and error behavior."
    command: "python3 -m pytest -q tests/test_cmdline.py"
  - file: tests/examplefiles
    source: Pygments 2.20.0 official PyPI sdist
    description: "Golden token streams for upstream language examples."
    command: "python3 -m pytest -q tests/examplefiles"
  - file: tests/snippets
    source: Pygments 2.20.0 official PyPI sdist
    description: "Generated lexer tests for upstream snippets."
    command: "python3 -m pytest -q tests/snippets"
  - file: tests/contrast
    source: Pygments 2.20.0 official PyPI sdist
    description: "Style contrast regression tests."
    command: "python3 -m pytest -q tests/contrast"

test_package_tests:
  - file: test_pygments.py
    description: "Consumer test with 20 assertions against the packaged API and CLI."
    command: "python3 test_pygments.py"

upstream_case_count: 5224
