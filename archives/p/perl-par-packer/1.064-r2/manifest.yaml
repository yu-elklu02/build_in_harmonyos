software: perl-par-packer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.064-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.064-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RS/RSCHUPP/PAR-Packer-1.064.tar.gz"

  # 源码校验和
  sha256: "0fc063e448e34f7cb5c69c6be5b2258f7150187b33140dedabd53a2c34ca3cba"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (静态链接, libperl.a)
    - PAR/1.021
    - Archive-Zip/1.68
    - Getopt-ArgvFile/1.11
    - ExtUtils-Depends/0.8002
    - Module-ScanDeps/1.37
    - ohos-sdk/26.0.0.18 (sysroot)

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊环境变量
  env:
    PAR_GLOBAL_TEMP: "绕过 HMDFS isSafeDir() 检查，生成 parl/parldyn"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.PL.patch"
  - "0002-myldr-Makefile.PL.patch"
  - "0003-t-data-XSBar-Makefile.PL.patch"
  - "0004-t-data-XSFoo-Makefile.PL.patch"
  - "0005-t-data-XSQuux-Makefile.PL.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PAR_GLOBAL_TEMP 环境变量可绕过 par_mktmpdir() 的 isSafeDir() 检查（par_init_env 将其复制为 PAR_TEMP）"
  - "OHOS ELF 签名在数据追加后失效，binary-sign-tool 无法重新签名（.codesign section 已存在）"
  - "Perl XS 模块编译需要 -nostartfiles -nodefaultlibs -lc 参数绕过 CRT 文件缺失（同 perl-dbd-pg）"
  - "-fstack-protector-strong 需从 ldflags 中移除（ld.lld 不识别）"
  - "off64_t 在 OHOS musl libc 中未定义，需 -Doff64_t=off_t"
  - "ldd 命令缺失时可用 readelf -d 创建 wrapper 脚本"
  - "ExtUtils::CBuilder 编译器检测在 OHOS 上失败，需强制 \$have_cc = 1"
  - "pp -p 创建 .par 文件 + par.pl 运行是替代独立可执行文件的可行方案"

