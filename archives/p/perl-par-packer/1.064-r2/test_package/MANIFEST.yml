# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-par-packer/1.064-r2
homepage: "https://metacpan.org/release/PAR-Packer"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-load.t
    source: PAR-Packer-1.064/t/00-load.t
    description: "上游测试: 验证 PAR::Packer 模块加载"
    command: "perl -Iblib/lib t/00-load.t"
  - file: t/30-current-exec.t
    source: PAR-Packer-1.064/t/30-current-exec.t
    description: "上游测试: 当前执行器测试"
    command: "perl -Iblib/lib t/30-current-exec.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 验证包文件完整性、模块语法检查、模块加载"
    command: "sh test.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
