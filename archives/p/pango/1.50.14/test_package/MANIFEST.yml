# test_package/MANIFEST.yml — CI L0e
package: pango/1.50.14
homepage: https://www.pango.org/

# ── 上游测试声明（TEST_QUALITY_SPEC §4.3） ───────────────────────
# Upstream suite is part of the meson project (no -Dtests off switch in 1.50.14).
# 26 cases enumerated from `tests/meson.build` (build_pangoft2=true + cairo=enabled
# + host_system != darwin). `testrandom` is gated by `if false` → never built.
upstream_test_in_build: true
# Native OHOS：与 glib 一致，排除 failing suite（fontconfig 环境失败用例）
upstream_check_command: "meson test -C build --timeout-multiplier=16 --no-rebuild --no-suite=failing"
upstream_test_command: "meson test -C build --timeout-multiplier=16 --no-rebuild --no-suite=failing"

upstream_tests:
  # ── 基础 8 例 (always enabled) ──
  - file: test-coverage.c
    source: pango-1.50.14/tests/test-coverage.c
    description: "GLib test harness 覆盖率桩，验证 PangoCoverageLevel 枚举到级别映射"
    command: "./test-coverage -k --tap"
  - file: testboundaries.c
    source: pango-1.50.14/tests/testboundaries.c
    description: "GraphemeBreakTest/WordBreakTest 等 ICU 边界样本的字符边界推进"
    command: "./testboundaries -k --tap"
  - file: testboundaries_ucd.c
    source: pango-1.50.14/tests/testboundaries_ucd.c
    description: "Unicode 标准附件字符边界推进（与 testboundaries 互为补充）"
    command: "./testboundaries_ucd -k --tap"
  - file: testcolor.c
    source: pango-1.50.14/tests/testcolor.c
    description: "PangoColor / parse API 颜色解析与转换"
    command: "./testcolor -k --tap"
  - file: testscript.c
    source: pango-1.50.14/tests/testscript.c
    description: "ISO 15924 script 代码识别"
    command: "./testscript -k --tap"
  - file: testlanguage.c
    source: pango-1.50.14/tests/testlanguage.c
    description: "ISO 639 / BCP-47 language tag 解析"
    command: "./testlanguage -k --tap"
  - file: testmatrix.c
    source: pango-1.50.14/tests/testmatrix.c
    description: "PangoMatrix 线性代数运算（rotate/scale/concat）"
    command: "./testmatrix -k --tap"
  - file: testtabs.c
    source: pango-1.50.14/tests/testtabs.c
    description: "PangoTabStop 解析、对齐与位置计算"
    command: "./testtabs -k --tap"
  # ── pangoft2 1 例 ──
  - file: test-ot-tags.c
    source: pango-1.50.14/tests/test-ot-tags.c
    description: "OpenType 标签枚举（FT_Face 服务查询）"
    command: "./test-ot-tags -k --tap"
  # ── pangocairo 12 例 ──
  - file: test-bidi.c
    source: pango-1.50.14/tests/test-bidi.c
    description: "PangoBidiType 与 fribidi 双向文本分类"
    command: "./test-bidi -k --tap"
  - file: testcontext.c
    source: pango-1.50.14/tests/testcontext.c
    description: "PangoContext / PangoFont / PangoGlyphString 创建、度量与渲染"
    command: "./testcontext -k --tap"
  - file: testiter.c
    source: pango-1.50.14/tests/testiter.c
    description: "PangoGlyphIter / PangoLayoutIter 像素级迭代"
    command: "./testiter -k --tap"
  - file: test-ellipsize.c
    source: pango-1.50.14/tests/test-ellipsize.c
    description: "PangoLayout 省略号（start/middle/end/none）布局"
    command: "./test-ellipsize -k --tap"
  - file: markup-parse.c
    source: pango-1.50.14/tests/markup-parse.c
    description: "PangoMarkup 解析：markups/{valid,fail}-* 用例集"
    command: "./markup-parse -k --tap"
  - file: test-itemize.c
    source: pango-1.50.14/tests/test-itemize.c
    description: "PangoLayout itemize：itemize/{one,two}.items 文本分词"
    command: "./test-itemize -k --tap"
  - file: test-shape.c
    source: pango-1.50.14/tests/test-shape.c
    description: "pango_shape / pango_shape_full HarfBuzz 整形结果回归"
    command: "./test-shape -k --tap"
  - file: test-font.c
    source: pango-1.50.14/tests/test-font.c
    description: "PangoFont / PangoFontMap / PangoFontDescription 查找与覆盖"
    command: "./test-font -k --tap"
  - file: testattributes.c
    source: pango-1.50.14/tests/testattributes.c
    description: "PangoAttrList / pango_attr_list_filter 属性过滤回归"
    command: "./testattributes -k --tap"
  - file: cxx-test.cpp
    source: pango-1.50.14/tests/cxx-test.cpp
    description: "pangomm C++ 包装层的 smoke test"
    command: "./cxx-test -k --tap"
  - file: test-harfbuzz.c
    source: pango-1.50.14/tests/test-harfbuzz.c
    description: "Pango-HarfBuzz 桥接（hb_buffer / pango_shape）"
    command: "./test-harfbuzz -k --tap"
  - file: test-break.c
    source: pango-1.50.14/tests/test-break.c
    description: "log attrs 推进 + validate-log-attrs.c 比对 breaks/{one,two,three,nine,ten,eleven}.expected"
    command: "./test-break -k --tap"
  # ── pangocairo + pangoft2 2 例 ──
  - file: testmisc.c
    source: pango-1.50.14/tests/testmisc.c
    description: "字体度量、baseline、extent 与 cairo 渲染对齐"
    command: "./testmisc -k --tap"
  - file: testserialize.c
    source: pango-1.50.14/tests/testserialize.c
    description: "PangoContext / Layout / AttrList 的 serialize→deserialize 往返"
    command: "./testserialize -k --tap"
  # ── pangocairo + pangoft2 + 非 darwin 3 例 ──
  - file: test-layout.c
    source: pango-1.50.14/tests/test-layout.c
    description: "PangoLayout 整行布局（layouts/*.layout 集）"
    command: "./test-layout -k --tap"
  - file: test-fonts.c
    source: pango-1.50.14/tests/test-fonts.c
    description: "FontConfig / fonts.conf 多字体回退与字形覆盖"
    command: "./test-fonts -k --tap"
  - file: test-no-fonts.c
    source: pango-1.50.14/tests/test-no-fonts.c
    description: "无字体配置下的错误路径（nofonts/fonts.conf）"
    command: "./test-no-fonts -k --tap"

# ── 平台豁免（交叉：未执行验证，勿宣称通过率） ─────────────────
# 交叉构建中 OHOS 二进制无法在 Linux build host 上运行。
# recipe 在 cross_building 时跳过 meson.test()（同 glib）；即使跑也会因
# needs_exe_wrapper=true 全部 exit 77 SKIP。SKIP ≠ PASS；0 执行 → 0/0 未定义。
platform_exemptions:
  - test: ALL 26 cases
    source: "conanfile.py build() + tests/meson.build"
    assertion: "cross_building → skip meson.test()；或 needs_exe_wrapper 全 SKIP"
    reason: "OHOS 交叉（host=Linux x86_64, target=OHOS aarch64）无法执行宿主测试二进制"
    verdict: "26 例全部未执行（0 executed）；交叉未验证，以 native 实测为准。禁止将 SKIP 计入 PASS"
    category: platform-exempt-cross
    applies_to: "W3 Docker 交叉（-pr:h=ohos-aarch64 -pr:b=default）"

# ── 依赖豁免（字体环境 → Meson failing suite + --no-suite=failing） ──
# OHOS CI worker 无 fonts.conf：下列用例 ERROR（stderr 均含
# "Fontconfig error: Cannot load default config file"）。
# patches/0001 标入 Meson failing suite；--no-suite=failing 排除。
# test-shape / test-itemize / cxx-test 上游自 SKIP（exit 0），不中断 meson。
dependency_exemptions:
  - suite: pango:test-font
    count: 1
    reason: "无 fonts.conf → fontconfig 失败。已标 failing suite。"
    assertion: "Fontconfig error: Cannot load default config file"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:test-fonts
    count: 1
    reason: "同 test-font。已标 failing suite。"
    assertion: "Fontconfig error: Cannot load default config file"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:test-layout
    count: 1
    reason: "同 test-font。已标 failing suite。"
    assertion: "Fontconfig error: Cannot load default config file"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:test-bidi
    count: 1
    reason: "CI：test_move_cursor_para 断言失败（无可用字体）。已标 failing suite。"
    assertion: "ERROR:test-bidi.c:447 + Fontconfig error"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:testiter
    count: 1
    reason: "CI：pango_font_describe font!=NULL 断言失败（SIGTRAP）。已标 failing suite。"
    assertion: "Pango-FATAL-CRITICAL: pango_font_describe + Fontconfig error"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:test-ellipsize
    count: 1
    reason: "CI：height1==height2 断言失败（无字体度量）。已标 failing suite。"
    assertion: "ERROR:test-ellipsize.c:55 + Fontconfig error"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:test-harfbuzz
    count: 1
    reason: "CI：pango_font_get_hb_font 断言失败（SIGTRAP）。已标 failing suite。"
    assertion: "Pango-FATAL-CRITICAL: pango_font_get_hb_font + Fontconfig error"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:testmisc
    count: 1
    reason: "CI：test_line_height height>0 失败（无字体）。已标 failing suite。"
    assertion: "ERROR:testmisc.c:122 + Fontconfig error"
    verdict: "--no-suite=failing 排除"
    category: dependency-disabled
  - suite: pango:test-shape
    count: 1
    reason: "fontconfig 失败时上游 subtests 隐式 SKIP，exit 0。"
    assertion: "Fontconfig error: Cannot load default config file"
    verdict: "上游自 SKIP（exit 0）；计入 upstream_skipped"
    category: upstream-skip
  - suite: pango:test-itemize
    count: 1
    reason: "上游 g_test_skip()（Cantarell 不可用），exit 0。"
    assertion: "# SKIP Cantarell font not available"
    verdict: "上游自 SKIP（exit 0）；计入 upstream_skipped"
    category: upstream-skip
  - suite: pango:cxx-test
    count: 1
    reason: "pangomm 未适配；GLib 宏空桩，exit 0 / meson SKIP。"
    assertion: "SKIP / exit 0"
    verdict: "上游/桩；计入 upstream_skipped"
    category: upstream-skip

# ── 消费者视角测试（test_package/，R34 / TEST_QUALITY_SPEC 层 2） ──
test_package_tests:
  - file: test.c
    description: "pango_version_string / pango_cairo_font_map_get_default + dlopen libpangocairo-1.0.so"
    command: "./test_probe"

assertion_count: 2

