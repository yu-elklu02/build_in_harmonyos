# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: primesieve/12.13
homepage: "https://github.com/kimwalisch/primesieve"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
# build() 中 BUILD_TESTS=ON 启用 test/ 目录, 非交叉编译时调用 cmake.test() 运行 CTest
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序
# primesieve 上游 test/ 目录含 15 个独立测试程序 (不依赖 Catch2), 通过 BUILD_TESTS=ON + cmake.test() 运行 CTest
# 完整列表见 notes.md
upstream_tests:
  - file: test/count_primes1.cpp
    source: primesieve-12.13/test/count_primes1.cpp
    description: "统计 10^1 到 10^9 范围内的质数"
    command: "ctest"
  - file: test/count_primes2.cpp
    source: primesieve-12.13/test/count_primes2.cpp
    description: "质数计数变体测试"
    command: "ctest"
  - file: test/count_primes3.cpp
    source: primesieve-12.13/test/count_primes3.cpp
    description: "质数计数变体测试"
    command: "ctest"
  - file: test/count_twins.cpp
    source: primesieve-12.13/test/count_twins.cpp
    description: "质数孪生对计数"
    command: "ctest"
  - file: test/count_triplets.cpp
    source: primesieve-12.13/test/count_triplets.cpp
    description: "质数三元组计数"
    command: "ctest"
  - file: test/count_quadruplets.cpp
    source: primesieve-12.13/test/count_quadruplets.cpp
    description: "质数四元组计数"
    command: "ctest"
  - file: test/count_quintuplets.cpp
    source: primesieve-12.13/test/count_quintuplets.cpp
    description: "质数五元组计数"
    command: "ctest"
  - file: test/count_sextuplets.cpp
    source: primesieve-12.13/test/count_sextuplets.cpp
    description: "质数六元组计数"
    command: "ctest"
  - file: test/Riemann_R.cpp
    source: primesieve-12.13/test/Riemann_R.cpp
    description: "Riemann R 函数近似测试"
    command: "ctest"
  - file: test/floorPow2.cpp
    source: primesieve-12.13/test/floorPow2.cpp
    description: "floorPow2 数学函数测试"
    command: "ctest"
  - file: test/calculator.cpp
    source: primesieve-12.13/test/calculator.cpp
    description: "计算器功能测试"
    command: "ctest"
  - file: test/clear_primesieve_iterator1.cpp
    source: primesieve-12.13/test/clear_primesieve_iterator1.cpp
    description: "迭代器清除测试 (C++)"
    command: "ctest"
  - file: test/clear_primesieve_iterator2.c
    source: primesieve-12.13/test/clear_primesieve_iterator2.c
    description: "迭代器清除测试 (C)"
    command: "ctest"
  - file: test/cpu_info.cpp
    source: primesieve-12.13/test/cpu_info.cpp
    description: "CPU 信息检测测试"
    command: "ctest"
  - file: test/cpuid.cpp
    source: primesieve-12.13/test/cpuid.cpp
    description: "CPUID 检测测试（aarch64 下空操作）"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_primesieve.cpp
    description: "消费者测试: 验证质数生成、计数、第 N 个质数功能"
    command: "./test_primesieve"

# 测试场景总数 (上游 15 个 CTest 测试程序各计 1 个场景 + test_package 4 个消费者测试场景)
# 注: 本字段按"测试场景/程序数"统计, 不等同于每个程序内部的断言数
assertion_count: 19
