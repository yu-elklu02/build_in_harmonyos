software: primesieve
# 版本级 manifest
# 文件位置: archives/p/primesieve/12.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "12.13"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（G4 检查字段）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kimwalisch/primesieve/archive/refs/tags/v12.13.tar.gz"

  # 源码校验和
  sha256: "4cd3f1b70f6b02d695e6495e6a0fc0fa99b4dc043e0f21686d2cf409e98295c9"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_PRIMESIEVE=OFF"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_DOC=OFF"
    - "-DBUILD_MANPAGE=OFF"
    - "-DWITH_MULTIARCH=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "primesieve 是无第三方依赖的 C++ 质数筛分库, 仅需系统 pthread"
  - "CMake 构建系统, 支持 BUILD_STATIC_LIBS/BUILD_SHARED_LIBS 双库模式"
  - "WITH_MULTIARCH 启用 ARM SVE 运行时分发, 适用于 aarch64 平台"
  - "上游 test/ 目录含 15 个独立测试程序, 不依赖 Catch2, 通过 BUILD_TESTS=ON + cmake.test() 运行 CTest"
