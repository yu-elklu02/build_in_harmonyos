# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-string-format/1.18-r1
homepage: "https://metacpan.org/dist/String-Format"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01load.t
    source: String-Format-1.18/t/01load.t
    description: "模块加载测试，验证 use_ok 和无警告"
    command: "perl -Iblib/lib -Iblib/arch t/01load.t"
  - file: t/02basic.t
    source: String-Format-1.18/t/02basic.t
    description: "基本格式化测试，8个断言覆盖标准替换、缺失元素、大小写、字段宽度、对齐、特殊字符"
    command: "perl -Iblib/lib -Iblib/arch t/02basic.t"
  - file: t/03multiple.t
    source: String-Format-1.18/t/03multiple.t
    description: "多字符格式串测试，验证未定义格式字符原样保留"
    command: "perl -Iblib/lib -Iblib/arch t/03multiple.t"
  - file: t/04subrefs.t
    source: String-Format-1.18/t/04subrefs.t
    description: "子例程引用测试，验证 strftime 和 getpwuid 回调"
    command: "perl -Iblib/lib -Iblib/arch t/04subrefs.t"
  - file: t/05stringfactory.t
    source: String-Format-1.18/t/05stringfactory.t
    description: "stringfactory 类方法测试，验证实例方法格式化"
    command: "perl -Iblib/lib -Iblib/arch t/05stringfactory.t"
  - file: t/06slash-n.t
    source: String-Format-1.18/t/06slash-n.t
    description: "%n 换行处理测试，验证未知格式字符原样保留"
    command: "perl -Iblib/lib -Iblib/arch t/06slash-n.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "L1 消费者测试: 模块加载 + stringf 替换 + 缺失键 + 截断 + stringfactory (5个断言)"
    command: "sh test.sh"
  - file: test.pl
    description: "Perl 测试脚本: Test::More 5个断言 (由 test.sh 调用)"
    command: "perl test.pl"

# 测试断言总数 (近似值, 用于质量评估)
# 01load.t: 2, 02basic.t: 8, 03multiple.t: 3, 04subrefs.t: 2, 05stringfactory.t: 1, 06slash-n.t: 4+
assertion_count: 20
