software: perl-string-format
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.18-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.18-r1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# 构建系统类型 (顶层字段，供 submit 自检解析)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SR/SREZIC/String-Format-1.18.tar.gz"

  # 源码校验和
  sha256: "9e417a8f8d9ea623beea2d13a47c0d5a696fc8602c0509b826cd45f97b76e778"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=perl_install"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 纯 Perl 模块，无外部依赖（Test::More 为测试依赖，Perl 核心自带）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无需任何补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "String::Format 是纯 Perl 模块，无需 C/XS 编译，无 CRT 文件依赖问题"
  - "纯 Perl 模块使用 INSTALL_BASE 参数安装到隔离目录，避免污染系统 Perl"
  - "conanfile.py 的 package_info() 对纯 Perl 模块应设置 cpp_info.libs=[] 而非虚构库名"
  - "test_package 不应包含 CMakeLists.txt/test.c，应使用 Perl 脚本进行功能验证"
  - "参考 perl-dbd-pg 经验：XS 模块需要 -nostartfiles -nodefaultlibs -lc 绕过 CRT 缺失，纯 Perl 模块无此问题"
