software: psmisc
version: "23.6"
status: built
build_system: custom
build_date: "2026-08-08"
conan_ref: "psmisc/23.6"

source:
  url: "https://gitlab.com/psmisc/psmisc/-/archive/v23.6/psmisc-v23.6.tar.gz"
  sha256: "58022dc47e0fb855468ba6c3c36af225b2caa79b61c8d68132438004fe8b79f3"
  tar_format: tar.gz

dependencies:
  required:
    - ncurses/6.6
  optional: []

build_config:
  target: aarch64-unknown-linux-gnu
  build_notes: |
    Source from GitLab tag archive does NOT include pre-generated configure.
    Recipe builds binaries directly with compiler, bypassing autotools bootstrap.
    config.h is provided as a patch (pre-generated for OHOS aarch64).
    ncurses linked statically (conan dependency ncurses/6.6).
    HMDFS workaround: umask 022 for directory write permissions.
    Binaries: killall, fuser (with statx.c), pstree (links ncurses), pslog, prtstat, peekfd (with -DARM64).

patches:
  - "patches/0001-add-config-h.patch"

knowledge_gained:
  - "GitLab tag archives lack pre-generated configure; need autogen.sh or manual build"
  - "HMFS requires umask 022 for directory writes (umask 077 causes Permission denied)"
  - "config.guess does not recognize HarmonyOS; must patch to map to Linux"
  - "autopoint from gettext 0.26 has hardcoded prefix; needs path fix"
  - "ncurses conan package provides libncursesw.a, not libncurses.a"
  - "fuser needs statx.c compiled when HAVE_DECL_SYS_STATX is defined"
