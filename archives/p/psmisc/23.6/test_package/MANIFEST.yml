# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: psmisc/23.6
homepage: "https://gitlab.com/psmisc/psmisc"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# psmisc uses DejaGnu (runtest) for tests, which is not available on OHOS.
# The build() method directly compiles all binaries; verification is via
# the test_package smoke tests (pstree --version, killall --version).
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# psmisc testsuite requires DejaGnu (runtest) which is unavailable on OHOS.
# The testsuite tests (killall, pslog, fuser) are skipped on OHOS.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: run pstree --version (ncurses-linked binary)"
    command: "pstree --version"
  - file: conanfile.py
    description: "Smoke test: run killall --version"
    command: "killall --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
