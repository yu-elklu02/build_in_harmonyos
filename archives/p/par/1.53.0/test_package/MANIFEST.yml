# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: par/1.53.0
homepage: "https://bitbucket.org/amc-nicemice/par"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -f protoMakefile test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make -f protoMakefile test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test-par
    source: par-1.53.0/test-par
    description: "par 自带测试套件（36 项通过 + 3 项 locale 测试在 musl 上失败）"
    command: "make -f protoMakefile test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 par version 验证版本，运行基本段落重排验证功能"
    command: "conan test test_package par/1.53.0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 38
