# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: proftpd-mod-procfs/0.1
homepage: "https://github.com/Castaglia/proftpd-mod_procfs"

# 上游测试命令 (上游仓库含 tests.pl，需完整 ProFTPD 运行环境)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游 tests.pl 依赖完整 ProFTPD 服务环境，
# 不适合 DSO 模块适配阶段运行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 mod_procfs.so)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 校验 mod_procfs.so ELF 有效性与 procfs_module 符号"
    command: "sh test.sh"

# 测试断言总数（存在性 + ELF 魔数 + 符号校验）
assertion_count: 3
