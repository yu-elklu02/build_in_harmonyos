# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: pkcs11-helper/1.30.0
homepage: "https://github.com/OpenSC/pkcs11-helper"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test-basic/test-basic.c
    source: pkcs11-helper-1.30.0/tests/test-basic/test-basic.c
    description: "Basic pkcs11-helper initialization and version test"
    command: "./test-basic"

test_package_tests:
  - file: test.c
    description: "Smoke test: call pkcs11h_getVersion() and pkcs11h_getFeatures()"
    command: "./test_pkcs11-helper"

assertion_count: 2
