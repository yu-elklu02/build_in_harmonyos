# manifest.yaml — pcalc 软件级元数据
# 交叉校验用，CI 不依赖此文件

software: pcalc
display: "pcalc"
description: "程序员命令行计算器，支持十六进制、十进制、八进制、二进制混合运算"
category: calculator
homepage: "https://github.com/vapier/pcalc"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "pcalc 是工具而非库，package_info 不应设置 libs"
    - "Makefile 构建，需要 flex/bison 作为构建依赖"
    - "源码包需要 strip_root 解压"
    - "R26 规则要求终端工具静态链接，build() 传递 LDFLAGS=-static"
  common_dependencies:
    - flex
    - bison

versions:
  "3.0.0":
    status: pending
    build_date: "2026-07-14"
    published_as: pcalc
    source_url: "https://github.com/vapier/pcalc/archive/refs/tags/v3.tar.gz"
