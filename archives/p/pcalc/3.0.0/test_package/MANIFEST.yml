# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: pcalc/3.0.0
homepage: "https://github.com/vapier/pcalc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# pcalc 使用 autotest 框架，测试用例位于 ptest/ 目录
upstream_tests:
  - file: ptest
    source: pcalc-3/ptest
    description: "pcalc autotest suite (14 test cases)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pcalc.c
    description: "验证 pcalc 二进制可执行，运行 1+1 计算"
    command: "cmake . && make && ./test_pcalc"

# 测试断言总数 (test_pcalc.c 中的断言数)
assertion_count: 1
