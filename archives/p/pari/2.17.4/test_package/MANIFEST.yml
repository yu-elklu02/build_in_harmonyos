package: pari/2.17.4
homepage: https://pari.math.u-bordeaux.fr/
upstream_check_command: "make bench"
upstream_test_in_build: true
upstream_test_command: "make bench"
upstream_tests:
  - file: src/test/in/number
    source: pari-2.17.4.tar.gz/src/test/in/number
    description: "Number-theoretic functions: primality, factorization, arithmetic"
    command: "make bench"
  - file: src/test/in/elliptic
    source: pari-2.17.4.tar.gz/src/test/in/elliptic
    description: "Elliptic curve routines (ellinit, ellisogeny, point arithmetic)"
    command: "make bench"
  - file: src/test/in/linear
    source: pari-2.17.4.tar.gz/src/test/in/linear
    description: "Linear algebra over Z/Q: matrices, determinants, kernels"
    command: "make bench"
  - file: src/test/dotest
    source: pari-2.17.4.tar.gz/src/test/dotest
    description: "Test driver; exits 1 when any case reports BUG (dotest:150)"
    command: "make bench"
test_package_tests:
  - file: test_package.cpp
    description: "Init PARI stack, round-trip stoi/itos, evaluate 2^64 and nextprime(1000), verify exact values"
    command: "./test_package"
assertion_count: 3
