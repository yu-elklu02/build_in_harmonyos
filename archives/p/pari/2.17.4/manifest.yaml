software: pari
version: "2.17.4"
status: built
build_date: "2026-08-14"

source:
  url: "https://pari.math.u-bordeaux.fr/pub/pari/unix/pari-2.17.4.tar.gz"
  sha256: "02651d99c391007d384b3fadbc20abc6916b77036f9e496c99e9ce8688ca4b53"
  tar_format: tar.gz

build:
  system: custom-configure     # PARI 自研 Configure，非 autotools
  configure_options:
    - "--with-gmp"             # GMP 内核：与 soname 绑定，非可选优化
    - "--enable-tls"           # 线程局部栈：soname 里的 -tls 由它而来
    - "--graphic=none"
    - "--without-readline"     # 故不引 ncurses
  dependencies: ["gmp/6.3.0.1"]
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-recognize-harmonyos.patch"   # arch-osname 认不出 HarmonyOS → arch=none → 不产共享库

knowledge_gained:
  - "库名由 Configure 按内核拼出：gmp→pari-gmp，tls→追加 -tls；与上游 wheel 一致"
  - "链接名是 pari（libpari.so），SONAME 是 libpari-gmp-tls.so.9，两者不同"
  - "平台 libc 无 pthread_cancel/pthread_setcanceltype，不能开 --mt=pthread"
  - "uname 垫片会被 conan 的环境脚本重设 PATH 盖掉，须改源码"
