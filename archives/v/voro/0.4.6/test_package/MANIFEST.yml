# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: voro/0.4.6
homepage: "https://github.com/chr1shr/voro"

# 上游测试命令
# voro++ 使用 GNU Make 构建，examples/ 目录的示例通过 make 编译
# Conan 配方仅构建 libvoro++.a 静态库，不编译示例
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游示例程序（位于源码 examples/ 目录）
upstream_tests:
  - file: examples/basic/single_cell.cc
    source: voro-0.4.6/examples/basic/single_cell.cc
    description: "单个 Voronoi 单元计算"
    command: "./single_cell"
  - file: examples/basic/random_points.cc
    source: voro-0.4.6/examples/basic/random_points.cc
    description: "随机点 Voronoi 泰森多边形"
    command: "./random_points"
  - file: examples/fractal/fractal.cc
    source: voro-0.4.6/examples/fractal/fractal.cc
    description: "分形 Voronoi 计算"
    command: "./fractal"
  - file: examples/interface/gnuplot.cc
    source: voro-0.4.6/examples/interface/gnuplot.cc
    description: "Gnuplot 接口示例"
    command: "./gnuplot"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_voro.cpp
    description: "消费者测试: voronoicell 初始化/面数/边数/体积, container 粒子添加/总体积, 5个断言"
    command: "./test_voro"

# 测试断言总数（近似值）
# 上游示例 upstream_test_in_build=false 不运行，仅计 test_package 5 个断言
assertion_count: 5
