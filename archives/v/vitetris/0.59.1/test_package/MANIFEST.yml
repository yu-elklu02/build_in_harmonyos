# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: vitetris/0.59.1
homepage: "https://victornils.net/tetris/"

# vitetris 上游不提供 make check / ctest 等测试套件
# 上游验证方式: 运行 ./tetris 进入游戏 (交互式, 不适合 CI)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 通过运行 tetris 的非交互式入口验证安装产物
test_package_tests:
  - file: test.sh
    description: |
      运行 tetris -help 验证二进制可执行并打印版本横幅与选项列表；
      运行 tetris -hiscores 验证高分榜入口在 fresh install 下输出
      "No saved scores" 并 exit 0。断言 -help 输出包含版本号
      "vitetris 0.59.1"、"-hiscores"、"-nomenu" 关键字。
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# - tetris -help 输出包含版本号 "vitetris 0.59.1"
# - tetris -help 输出包含 "-hiscores" 选项
# - tetris -help 输出包含 "-nomenu" 选项
# - tetris -hiscores 退出码为 0
# - tetris -hiscores 输出包含 "scores" 关键字
assertion_count: 5
