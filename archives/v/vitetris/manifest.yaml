software: vitetris
display: "vitetris"
description: "终端俄罗斯方块游戏，支持单人/双人模式和网络对战"
category: games
homepage: "https://victornils.net/tetris/"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "自定义 configure 脚本（非 autotools），通过 --prefix 写入 config.mk"
    - "Makefile in-source build，通过 SHELL= 变量驱动子脚本"
    - "OHOS 无 /bin/sh，需 CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "补丁预置 CC=clang CFLAGS=-fPIC -O2 BACKEND=ansi，避免交互式配置"
    - "仅依赖 libc.so，无外部 Conan 依赖"
  common_dependencies: []

versions:
  "0.59":
    status: built
    build_date: "2026-06-08"
    build_system: makefile
  "0.59.1":
    status: built
    build_date: "2026-06-03"
    build_system: makefile
