software: variant-lite
category: cpp
description: "A C++17-like variant for C++98, C++11 and later in a single-file header-only library"
homepage: "https://github.com/martinmoene/variant-lite"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only 库（CMake INTERFACE library），无任何依赖，仅包含 include/nonstd/variant.hpp"
    - "CMake 目标命名空间：nonstd::variant-lite"
    - "E092: CMake 不识别 OHOS 平台，需设置 CMAKE_SYSTEM_NAME=Linux；OHOS 的 arch=armv8 需映射为 CMAKE_SYSTEM_PROCESSOR=aarch64，Linux 保留 str(self.settings.arch)"
    - "上游测试使用 lest 测试框架，83 个测试用例，clang 15+ 下 CTest 运行 cpp98/cpp11/cpp14/cpp17 四个目标"
    - "OHOS clang 15 libc++ 的 std::variant 与上游测试用例 (issue 31, convert-copy-construct) 不兼容，需强制 VARIANT_LITE_OPT_SELECT_NONSTD=ON 使用 nonstd 实现"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: ""
