software: variant-lite
# 版本级 manifest
# 文件位置: archives/v/variant-lite/2.0.0/manifest.yaml

version: "2.0.0"
status: built
build_date: ""
build_system: cmake

source:
  url: "https://github.com/martinmoene/variant-lite/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "70c1509e24d03abfd22d2e702ab398238e69658b7b2890ce1d7e9731d6b5a7cb"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DVARIANT_LITE_OPT_BUILD_TESTS=ON"
    - "-DVARIANT_LITE_OPT_BUILD_EXAMPLES=OFF"
    - "-DVARIANT_LITE_OPT_SELECT_NONSTD=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "variant-lite 是 header-only 库（CMake INTERFACE library）"
  - "无任何依赖，仅包含头文件 include/nonstd/variant.hpp"
  - "CMake 命名空间：nonstd::variant-lite"
  - "上游测试使用 lest 测试框架，83 个测试用例"
  - "clang 15+ 下 CTest 运行 4 个测试: cpp98/cpp11/cpp14/cpp17"
  - "OHOS clang 15 libc++ std::variant 与上游测试用例 (issue 31, convert-copy-construct) 不兼容，需强制 VARIANT_LITE_OPT_SELECT_NONSTD=ON"
