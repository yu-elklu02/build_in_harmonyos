# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: variant-lite/2.0.0
homepage: "https://github.com/martinmoene/variant-lite"

upstream_check_command: "ctest -N"

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17)
# 每个可执行文件包含 83 个 lest 测试用例
upstream_tests:
  - file: test/variant.t.cpp
    source: variant-lite-2.0.0/test/variant.t.cpp
    description: "variant 核心单元测试 (83 个 lest 用例: 构造/赋值/get/index/visit 等)"
    command: "ctest -R test-cpp11"
  - file: test/variant-main.t.cpp
    source: variant-lite-2.0.0/test/variant-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

test_package_tests:
  - file: test_variant_lite.cpp
    description: "消费者测试: 验证 variant-lite 库链接、variant 构造/get/index/holds_alternative/visit API"
    command: "./test_variant_lite"

assertion_count: 7
