software: virtualpg
display: "VirtualPG"
description: "SQLite virtual table extension for accessing PostgreSQL tables"
category: database
homepage: "https://www.gaia-gis.it/fossil/virtualpg/index"
license: "MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later"
build_system: autotools
ohos_adaptation:
  key_points:
    - "Recognize the native aarch64 HarmonyOS triplet without Linux masquerading"
    - "Resolve SQLite3 and libpq exclusively through Conan"
    - "Use unversioned Libtool SONAMEs on OHOS HMDFS"
    - "Keep Autoconf config.status temporary directories writable on HMDFS"
  common_dependencies:
    - sqlite3
    - libpq
versions:
  "2.0.1.1":
    status: built
    build_date: "2026-07-31"
    conan_ref: "virtualpg/2.0.1.1"
