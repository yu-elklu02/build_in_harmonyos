  make_check_output: "make check 执行 Automake 空 check 目标（无 TESTS）退出码 0，无任何用例"
  reason: "virtualpg 2.0.1 上游发布包不含测试套件：Makefile.am 无 TESTS/check_PROGRAMS，configure.ac 无测试框架，tar 包无 tests/ 目录或测试源码，make check 为空目标"

# 无测试套件，故 check 命令不适用（hmbs 清单器凭非空 upstream_check_command
# 判「上游存在测试命令」并要求真机发现/执行；置空以对齐 osmctools/sipcalc/
# libdvdnav/most/analog 等已过门禁的 no_tests 库写法）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游注册零 Automake TESTS，make check 为空目标（配方仍真跑 make check
# 并在其后输出 HMBS_UPSTREAM_TEST_RESULT no_tests 机器证据标记），
# 无实际上游用例可集成，故声明 false 并对齐已过门禁范例
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []
test_package_tests:
