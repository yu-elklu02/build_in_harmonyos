  top_level_files:
    - Makefile.am     # 仅 lib_LTLIBRARIES = libvirtualpg.la mod_virtualpg.la + pkgconfig/header, 无 TESTS / check_PROGRAMS / check-local
    - configure.ac    # 仅 AC_CHECK_LIB(sqlite3)/pg_config 探测, 无 test 框架、无 AC_CONFIG 测试目录
    - Doxyfile.in     # 文档
  scanned_for:
    - "Makefile.am TESTS / check_PROGRAMS / check-local / test 目标"
