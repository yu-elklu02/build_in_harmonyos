# R54: sqlite3/3.49.1 official amalgamation source, recompiled by this recipe with
# -fPIC so the single shared libsqlite3.so actually links on aarch64. The ohpcd
# static archive's amalgamation member is built without -fPIC (conan-center CMake
# static library) and with -fvisibility=hidden, so neither extraction nor any
# linker flag can turn it into an exporting shared object. Building from the
# official amalgamation source gives both PIC relocations and default symbol
# visibility. Mirror (viaduck.org, official sqlite mirror) first, official URL
# last; sha256 identical for both (verified 2026-08-11).
sqlite3_sources:
  url:
    - "https://mirror.viaduck.org/sqlite/sqlite-amalgamation-3490100.zip"
