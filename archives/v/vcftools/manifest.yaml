software: vcftools
display: "VCFtools"
description: "C++ and Perl command-line tools for working with VCF files"
category: bioinformatics
homepage: "https://vcftools.github.io/"
license: LGPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Use Conan PkgConfigDeps to provide the zlib.pc file required by configure"
    - "Install Perl modules below lib/perl5/site_perl and export PERL5LIB to consumers"
    - "Use htslib bgzip/tabix commands for the official upstream Perl test suite"
    - "Fetch the official test.t omitted from the 0.1.17 release tarball with a pinned SHA256"
  common_dependencies:
    - zlib
    - htslib

versions:
  "0.1.17":
    status: built
    build_date: "2026-07-25"
