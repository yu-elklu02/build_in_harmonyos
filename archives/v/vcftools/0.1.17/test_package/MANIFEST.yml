package: vcftools/0.1.17
homepage: "https://vcftools.github.io/"

upstream_check_command: "perl src/perl/test.t"
upstream_test_in_build: true
upstream_test_command: "perl src/perl/test.t"

upstream_tests:
  - file: src/perl/test.t
    source: "https://github.com/vcftools/vcftools/blob/v0.1.17/src/perl/test.t"
    description: "Official upstream Perl suite with 75 assertions; fetched separately because the release tarball omits test.t"
    command: "perl src/perl/test.t"

test_package_tests:
  - file: test.sh
    description: "Verify version reporting, calculate expected allele frequencies from a real VCF, and validate that VCF with the packaged Perl tool"
    command: "bash test.sh"

assertion_count: 4
