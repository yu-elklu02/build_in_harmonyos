# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: v4l/1.32.0
homepage: "https://linuxtv.org/wiki/index.php/V4l-utils"

upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "utils/edid-decode/test/*.test"
    source: "v4l-utils-1.32.0/utils/edid-decode/test"
    description: "EDID parser input corpus; 23/24 raw pass on OHOS, with the single non-zero sample documented upstream as not yet parsable"
    command: "edid-decode <sample>"
  - file: "utils/v4l2-compliance"
    source: "v4l-utils-1.32.0/utils/v4l2-compliance"
    description: "V4L2 compliance tests, device-dependent and not executable on the current worker"
    command: "v4l2-compliance"

test_package_tests:
  - file: test_v4l.c
    description: "Consumer test: include libv4l2.h, link API symbols, and execute the v4l2_open negative path without requiring a video device"
    command: "./test_v4l"

assertion_count: 4
