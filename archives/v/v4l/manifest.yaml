software: v4l
display: "v4l-utils"
description: "Video4Linux userspace libraries and utilities"
category: system
homepage: "https://linuxtv.org/wiki/index.php/V4l-utils"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Minimal default build focuses on libv4l libraries"
    - "Requires Linux-compatible V4L2/media headers and ioctl support"
    - "Device-level runtime tests require /dev/video* or /dev/media* nodes"
    - "Optional Qt/BPF/DVB/gconv/JPEG/tracer pieces are disabled by default"
  common_dependencies:
    - "system V4L2/media kernel headers"

versions:
  "1.32.0":
    status: built
    build_date: "2026-07-30"
