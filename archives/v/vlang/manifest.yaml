software: vlang
display: "V"
description: "Self-hosted V programming language compiler and toolchain"
category: programming-language
homepage: "https://vlang.io"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Contest library is named v, but Conan package name is vlang because Conan 2 rejects single-character package names"
    - "Build uses deterministic source-only bootstrap from pinned vlang/v and vlang/vc tarballs"
    - "Package keeps v, cmd, vlib, and thirdparty together under share/v so the compiler can discover its vroot"
  common_dependencies: []

versions:
  "0.5.2":
    status: pending
    path: "0.5.2"
    issue: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/1341"
