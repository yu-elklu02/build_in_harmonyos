knowledge_gained:
  - "libvips 8.18.4 remains Meson-based and requires glib-2.0, gio-2.0, gobject-2.0, expat, threads, and libm for the core build."
  - "Optional image backends should stay disabled until their Conan packages are confirmed in the product registry."
  - "PkgConfig aliases for gio-2.0 and gobject-2.0 are needed when consuming the local glib2/2.88.0 package through Meson."
  - "Conan-generated glib-2.0.pc needs staged glib-mkenums/glib-genmarshal wrappers for libvips Meson code generation on OHOS."
  - "When libintl/ngettext is unavailable, libvips builds on OHOS with generated config.h gettext/ngettext fallbacks under !ENABLE_NLS."
  - "The release PR avoids unpublished follow-up dependency versions by using expat/2.8.2.1 directly and letting glib2 keep its published pcre2/10.45 transitive dependency."
