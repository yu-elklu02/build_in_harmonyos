version: '2026.07.07'
status: pending
build_date: ''

source:
  url: 'https://github.com/pwmt/girara/archive/refs/tags/2026.07.07.tar.gz'
  sha256: 'a114954f5a0cf8d06245181dc83876ae9d5c7715d94096fa85403d04e600ab46'
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - '--wrap-mode=nodownload'
    - '-Ddocs=disabled'
    - '-Dtests=false'
  dependencies:
    - 'glib/2.84.0 (Conan, provides glib-2.0/gobject-2.0/gio-2.0 >=2.72)'
  cc: clang

patches_applied:
  - '0001-make-tests-conditional.patch'

knowledge_gained:
  - 'glib/gobject/gio 由 Conan 依赖 glib/2.84.0 聚合提供，经 PkgConfigDeps 暴露给 meson，受 R36 发布顺序约束'
  - '库 libgirara.so.5.0、头 include/girara/ → includedirs=["include/girara","include"]'
  - '上游 tests subdir 无条件构建，补丁新增 tests 选项（默认 false）条件化，避免交叉编译环境构建/签名测试可执行文件'
  - 'meson install 重写 rpath 破坏自签 → package() 后 binary-sign-tool -selfSign 1 重签 .so'
  - 'test_package 用 dlsym 调 girara_list_new/size/free（真实 API），避开 glib.h 系统头依赖'
