# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: girara/2026.07.07
homepage: https://pwmt.org/projects/girara

# 上游测试情况：tests/meson.build 注册 3 个测试目标；包构建中通过补丁条件化并禁用
# （-Dtests=false），避免在交叉编译环境执行目标测试程序。
upstream_test_in_build: false
upstream_tests:
  - name: datastructures
    source: tests/test_datastructures.c
  - name: template
    source: tests/test_template.c
  - name: utils-with-home
    source: tests/test_utils.c

# test_package 自带测试（消费者视角：dlopen libgirara.so + dlsym 调用真实 API）
# runtime: native-only — 运行期 dlopen 验证仅在本机（非交叉编译）构建时执行；
# CI 交叉编译场景下 test() 因 cross_building 跳过运行期，仅验证编译+链接。
test_package_tests:
  - file: test.c
    description: "本机构建时 dlopen libgirara.so 运行期可加载，调用 girara_list_new(NULL)/size/free 验证真实 API 签名"
    command: "./test_probe"
    runtime: native-only

assertion_count: 2
