# 软件级 manifest — git-town
# 文件位置: archives/g/git-town/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: git-town

display: "Git Town"

description: "Branching and workflow support for Git"

category: utility

homepage: "https://github.com/git-town/git-town"

license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "Go application built with 'go build -ldflags=-s -w'"
    - "GOWORK=off required due to go.work file in source"
    - "GOPROXY=https://goproxy.cn,direct needed (proxy.golang.org blocked)"
    - "CGO_ENABLED=0 produces static binary"

  common_dependencies: []

versions:
  "16.4.1":
    status: built
    build_date: 2026-08-06
