# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "git-town is a Go application built with 'go build -ldflags=-s -w'"
  - "GOWORK=off required because go.work conflicts with conan's source extraction"
  - "GOPROXY=https://goproxy.cn,direct needed for HarmonyOS (proxy.golang.org blocked)"
  - "CGO_ENABLED=0 produces static binary, no C dependencies"
  - "Go 1.22+ required (go.mod specifies go 1.22)"
