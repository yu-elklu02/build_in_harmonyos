software: gtkdatabox
version: "1.0.0"
status: partial
build_date: "2026-07-19"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/gtkdatabox/gtkdatabox-1.0.0.tar.gz"
  sha256: "8bee70206494a422ecfec9a88d32d914c50bb7a0c0e8fedc4512f5154aa9d3e3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-glade"
    - "--disable-gtk-doc"
    - "--disable-gtk-doc-html"
    - "--disable-gtk-doc-pdf"
  dependencies:
    - gtk+-3.0/3.24.38 (system installation)
    - glib-2.0/2.88.0 (system installation)
    - pango/1.50.14 (system installation)
    - cairo/1.18.2 (system installation)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gtkdatabox 1.0.0 is an Autotools GTK+ 3 widget library and consumes gtk+-3.0 through pkg-config."
  - "The OHPCD Conan remote does not publish the complete GTK+ 3 dependency chain, so the recipe discovers the OpenHarmony GTK+ stack from GTK_PREFIX, DEFAULT_PREFIX, /storage/Users/currentUser/usr/local, or /data/service/hnp package roots."
  - "Glade catalog and gtk-doc generation are optional and disabled for CI-friendly package builds."
  - "The recipe runs upstream make check, builds all 14 upstream examples, and launches every example with timeout when target execution is available."
  - "CI verifies build, linkage, type registration, GtkDataboxPoints graph creation, graph hide and size accessors, and display-backed widget construction; interactive GTK rendering and input behavior require manual validation on an OpenHarmony PC display session before claiming complete UI adaptation."

test_package:
  framework: cmake
  tests:
    - "Compile and link a consumer executable through the packaged gtkdatabox pkg-config file."
    - "Run a widget smoke check when the target binary can execute, creating all GtkDatabox graph types (points, lines, bars, offset bars, regions, markers, cross, grid, grid array, ruler), checking graph properties and extrema, and exercising GtkDatabox widget APIs when a GTK display backend is available."
    - "R40 manual validation marker: Headless CI covers build/linkage/graph creation/graph property/non-rendering smoke checks; GtkDatabox interactive plotting, pointer input, and GTK backend rendering require an OpenHarmony PC display session. Keep status partial until manual validation is complete."
  assertion_count: 93
  pass_rate: "OpenDesk 20260814-030728-8a33ba-3056-expanded-tests2: conan create passed; upstream make check 0/0; all 14 upstream examples built and each startup probe reached GTK init (headless display exit accepted); test_package passed 76/76 assertions on headless OpenDesk (93 assertions total when a display is available)."
