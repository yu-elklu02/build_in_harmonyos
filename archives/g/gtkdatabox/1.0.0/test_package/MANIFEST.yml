package: gtkdatabox/1.0.0
homepage: "https://sourceforge.net/projects/gtkdatabox/"

upstream_check_command: "make check && make -C examples"
upstream_test_in_build: true
upstream_test_command: "recipe build() runs make check, builds all 14 upstream examples, and launches every executable example with timeout when target binaries can execute"

upstream_tests:
  - file: examples/
    source: gtkdatabox-1.0.0/examples/
    description: "Interactive GTK+ examples supplied by upstream; all 14 are built by the recipe and each is launched with timeout when target execution is available. Timeout after startup is accepted because the examples are interactive GTK programs."
    command: "make -C examples && GDK_BACKEND=wayland,x11,broadway timeout 5s <example> || test $? -eq 124 || test $? -eq 1"
    status: enabled
  - file: autotools check target
    source: gtkdatabox-1.0.0/Makefile
    description: "Upstream Autotools check target executed by the recipe."
    command: "make check"
    status: enabled

test_package_tests:
  - file: test_gtkdatabox.c
    description: "Consumer smoke test that resolves gtkdatabox through pkg-config, links libgtkdatabox, verifies type registration, creates all graph types (points, lines, bars, offset bars, regions, markers, cross, grid, grid array, ruler), checks graph properties and extrema, and exercises GtkDatabox widget APIs when a GTK display backend is available."
    command: "./test_gtkdatabox"

assertion_count: 93
upstream_enabled_case_count: 14
test_package_pass_rate: "OpenDesk 20260814-030728-8a33ba-3056-expanded-tests2: conan create passed; upstream make check 0/0; all 14 upstream examples built and each startup probe reached GTK init (headless display exit accepted); test_package passed 76/76 assertions on headless OpenDesk (93 assertions total when a display is available)."
