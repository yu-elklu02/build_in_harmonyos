# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: glog/0.7.1
homepage: "https://github.com/google/glog"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/logging_unittest.cc
    source: glog-0.7.1/src/logging_unittest.cc
    description: "Logging unit test - tests core logging functionality"
    command: "./logging_unittest"
  - file: src/stacktrace_unittest.cc
    source: glog-0.7.1/src/stacktrace_unittest.cc
    description: "Stacktrace unit test - tests stack trace functionality"
    command: "./stacktrace_unittest"
  - file: src/stl_logging_unittest.cc
    source: glog-0.7.1/src/stl_logging_unittest.cc
    description: "STL logging unit test - tests STL container logging"
    command: "./stl_logging_unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/main.cpp
    description: "消费者测试 - 验证 glog 库的 InitGoogleLogging, LOG, CHECK 等核心 API 可用"
    command: "./test_glog"

# 测试断言总数 (近似值)
assertion_count: 10
