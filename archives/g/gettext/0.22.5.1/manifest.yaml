# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.22.5.1"

# 软件名
software: gettext

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/gettext/gettext-0.22.5.tar.gz"

  # 源码校验和
  sha256: "ec1705b1e969b83a9f073144ec806151db88127f5e40fe5a94cb6c8fa48996a0"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-rpath"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 测试信息
# ============================================================

tests:
  upstream:
    command: "make check"
    cases: 478
    passed: 470
    pass_rate: "98.3%"
    notes: "gnulib-tests 466 + libtextstyle 4 全过；8 个工具测试失败均为 OHOS 平台限制（iconv charset 缺口/缺 autom4te），format-sh-1 重跑可通过"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gettext 0.22.5 依赖系统 iconv（HAVE_ICONV），libunistring 用内置 gnulib，无外部 conan 依赖"
  - "config.guess/config.sub 需补 aarch64-unknown-linux-ohos 平台识别（补丁 0001/0002）"
  - "OHOS iconv 缺 GB18030/BIG5/EUC-KR charset，导致 msgcat-22/msgconv-8/msgconv-2/msgmerge-compendium-6 等工具测试失败（平台限制，非编译问题）"
  - "envsubst 是 abuild rootbld 的运行时依赖（cmd:envsubst），本配方核心交付物"
  - "make check 规模大（466+ 用例），耗时较长；8 个失败中 format-sh-1 为 flaky（重跑可通过）"
