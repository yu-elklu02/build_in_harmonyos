package: gkrellm/2.3.11
homepage: "https://github.com/toppk/gkrellm"

upstream_check_command: "server/gkrellmd --version && server/gkrellmd --help"
upstream_test_in_build: true
upstream_test_command: "server/gkrellmd --version && server/gkrellmd --help"

upstream_tests:
  - name: "gkrellmd version self-test"
    command: "server/gkrellmd --version"
    description: "运行上游守护进程的版本查询路径，验证构建产物可执行。"
  - name: "gkrellmd help self-test"
    command: "server/gkrellmd --help"
    description: "运行上游守护进程的参数解析与帮助输出路径。"

test_package_tests:
  - file: test.sh
    description: "验证打包后的 gkrellmd 版本与帮助命令路径"
    command: "bash test.sh"

assertion_count: 2
