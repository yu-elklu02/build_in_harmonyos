knowledge_gained:
  - "GROMACS custom FindFFTW.cmake reads FFTWF_INCLUDE_DIR and FFTWF_LIBRARY rather than Conan-generated dependency targets."
  - "The upstream tests target must be built before CTest; registration alone does not build excluded test executables."
  - "A target libc may export open_memstream while its fclose path cannot publish buffered output; capability overrides require target behavior evidence."
  - "A project-level FFTW no-measure option may cover the primary wrapper but miss a direct multidimensional planner."

