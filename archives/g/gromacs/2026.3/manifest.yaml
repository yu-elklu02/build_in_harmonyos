  sha256: "6e205f8fc072f0112dc72f6349b729c6921e1ddb7231928c03281f950a86d42f"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DGMX_BUILD_UNITTESTS=ON"
    - "-DGMX_GPU=OFF"
    - "-DGMX_MPI=OFF"
    - "-DGMX_THREAD_MPI=ON"
    - "-DGMX_OPENMP=OFF"
    - "-DGMX_SIMD=ARM_NEON_ASIMD"
    - "-DGMX_DOUBLE=OFF"
    - "-DGMX_FFT_LIBRARY=fftw3"
    - "-DGMX_BUILD_OWN_FFTW=OFF"
    - "-DGMX_DISABLE_FFTW_MEASURE=ON"
    - "-DGMX_TEST_TIMEOUT_FACTOR=5"
    - "-DHAVE_OPEN_MEMSTREAM=OFF"
  dependencies:
    - "fftw3f/3.3.9"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-pthreads.cpp.patch: return ENOSYS for unsupported pthread cancellation on OHOS"
  - "0002-ohos-test-capabilities.patch: gate unavailable OHOS test capabilities and use writable temporary storage"
  - "0003-gtest-ohos-helper-guard.patch: compile the GoogleTest path helper for the OHOS temporary path"
  - "0004-gtest-ohos-helper-blank-line.patch: retain upstream source formatting around the helper guard"
  - "0005-honor-disable-fftw-measure-in-direct-3d.patch: apply the configured no-measure policy to the direct 3D FFTW planner"

