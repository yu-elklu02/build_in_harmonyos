package: gromacs/2026.3
homepage: "https://www.gromacs.org/"

upstream_check_command: "ctest --test-dir build/Release --output-on-failure --parallel 4"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --parallel 4"

upstream_tests:
  - file: tests/CheckTarget.cmake
    source: gromacs-v2026.3/tests/CheckTarget.cmake
    description: "Defines the upstream tests build target and the CTest execution targets"
    command: "cmake --build build/Release --target tests"
  - file: src/testutils/TestMacros.cmake
    source: gromacs-v2026.3/src/testutils/TestMacros.cmake
    description: "Registers the unit-test executables and CTest cases for the CPU-only configuration"
    command: "ctest --output-on-failure --parallel 4"

test_package_tests:
  - file: test.py
    description: "Verify gmx version and convert a two-atom PDB file to GRO with editconf"
    command: "python3 test.py <gmx-bin>"

# This is one independent consumer flow with ten explicit assertions. Upstream
# GoogleTest assertion counts are not fabricated; target CTest case totals are
# reported separately after execution.
flow_count: 1
assertion_count: 10
