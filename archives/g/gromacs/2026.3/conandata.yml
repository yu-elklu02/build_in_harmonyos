  - patch_file: "patches/0004-gtest-ohos-helper-blank-line.patch"
    base_path: "src/external/googletest/googletest/src"
    patch_description: "0004 restore source formatting after the gtest helper guard"
    patch_type: "portability"
  - patch_file: "patches/0005-honor-disable-fftw-measure-in-direct-3d.patch"
    base_path: "src/gromacs/fft"
