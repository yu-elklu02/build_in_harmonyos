software: "gdal"
version: "3.9.2.2"
status: published
build_date: "2026-08-14"
build_system: cmake
target_platform: "ohos-aarch64"

source:
  url: "https://github.com/OSGeo/gdal/releases/download/v3.9.2/gdal-3.9.2.tar.gz"
  sha256: "c9767e79ca7245f704bfbcb47d771b2dc317d743536b78d648c3e92b95fbc21e"
  tar_format: tar.gz
  upstream_version: "3.9.2"

configure_options:
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DBUILD_TESTING=OFF"          # conan create 默认；W4 本地实测改 ON + gdalautotest
  - "-DBUILD_PYTHON_BINDINGS=OFF"
  - "-DGDAL_USE_EXTERNAL_LIBS=OFF"
  - "-DGDAL_USE_SQLITE3=ON"
  - "-DGDAL_USE_ZLIB=ON"
  - "-DGDAL_USE_TIFF_INTERNAL=ON"
  - "-DGDAL_USE_GEOTIFF_INTERNAL=ON"
  - "-DGDAL_USE_GEOS=OFF"          # ohpcd 暂无 libgeos → dependency_exemptions
  - "-DGDAL_USE_WEBP=OFF"
  - "-DGDAL_USE_CURL=OFF"

build:
  system: cmake
  dependencies:
    - proj/9.3.1.1
    - sqlite3/3.49.1
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

# 测试摘要（与 test_package/MANIFEST.yml 对齐）
# 公式（TEST_QUALITY_SPEC §3.3）：
#   effective_pass_rate = passed / (total - platform_exemptions - dependency_disabled)
test_summary:
  framework: "ctest + gtest (autotest/cpp)"
  ctest_entries: "21/22 effective-pass (100%); 1 ctest_entry_exempt (gdal_unit_test 包裹)"
  gtest_cases: "652/674 raw (96.7%); 652/652 effective-pass (100%) after exemptions"
  platform_exemptions: 2    # VSISupports* /tmp readonly — MANIFEST platform_exemptions
  dependency_exemptions: 20  # test_ogr_geos — MANIFEST dependency_exemptions
  ctest_entry_exemptions: 1  # gdal_unit_test 内部含 2 个 platform_exempt
  upstream_tests_modified: false
  effective_pass_rate: "100%"
  raw_pass_rate: "96.7%"
  report: "test_package/MANIFEST.yml"

knowledge_gained:
  - "R37：在已归档 3.9.2 上补齐 Conan；依赖对齐 proj/9.3.1.1 + sqlite3/3.49.1 + zlib/1.3.1.1"
  - "E326 根因扩展：/bin/sh 被 hmmac 拒绝同时影响 CMake 配置阶段 try-compile（默认 Unix Makefiles generator 内部调 make + /bin/sh → Check for working C compiler broken）与编译阶段；改用 -G Ninja -DCMAKE_MAKE_PROGRAM=... 后两阶段均通过"
  - "Ninja 下共享库 symlink 规则位于 CMakeFiles/rules.ninja（rule CMAKE_SYMLINK_LIBRARY），hmmac 拒绝 symlink() 系统调用 → 改写 command 为 cp 循环（for f in $out; do cp -f $in $$f; done）"
  - "cmake --build -- SHELL=... 在 Ninja generator 下报 unknown target（SHELL=... 被当作 ninja target），不可再追加；Ninja 直接 exec 编译器无需 SHELL 覆盖"
  - "发行 tarball 不含 autotest/；完整 C++ 套件需 gdalautotest-3.9.2"
  - "OHOS /tmp 只读导致 test_cpl.VSISupportsSequentialWrite/RandomWrite 失败；按 TEST_QUALITY_SPEC §3.3 登记 platform_exemptions + ctest_entry_exemptions"
  - "GDAL_USE_GEOS=OFF 时上游 haveGEOS() 守卫自动 skip 20 个 test_ogr_geos；登记 dependency_exemptions"
  - "conan create 保持 BUILD_TESTING=OFF + 空套件 ctest（L1c）；W4 本地 BUILD_TESTING=ON 跑满 674 gtest"
  - "扣除 platform_exemptions(2) + dependency_exemptions(20) 后 gtest effective_pass_rate = 652/652 = 100%"
  - "扣除 ctest_entry_exemptions(1) 后 ctest effective_pass_rate = 21/21 = 100%"

notes: |
  R37 over archived 3.9.2. Minimal OHOS Conan drivers for simple-tiles.
  Traditional archive used PROJ 9.8.1; this recipe uses Conan proj/9.3.1.1.
  W4 (2026-07-25): native OHOS aarch64 upstream C++ suite 652/674 raw;
  2 platform-exempt (/tmp), 20 dependency-disabled (GEOS off).
  Effective pass rate (per TEST_QUALITY_SPEC §3.3): 100%.
  See test_package/MANIFEST.yml for full exemption table and verification.