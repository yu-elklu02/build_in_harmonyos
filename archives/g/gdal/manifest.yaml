# 软件级 manifest
# 文件位置: archives/g/gdal/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: gdal
display: "GDAL"
description: "Geospatial Data Abstraction Library — 栅格与矢量地理空间数据抽象库"
category: data
homepage: "https://gdal.org/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake + ohos.toolchain；原生 OHOS aarch64"
    - "最小驱动：proj + sqlite3 + zlib；TIFF/GeoTIFF 内置"
    - "GDAL_USE_GEOS=OFF（ohpcd 暂无 libgeos）→ test_ogr_geos skip"
    - "OHOS /tmp 只读 → VSISupports* 平台豁免（TEST_QUALITY_SPEC §3.3）"
    - "发行 tarball 不含 autotest/；完整 C++ 套件需 gdalautotest"
  common_dependencies:
    - proj
    - sqlite3
    - zlib

versions:
  "3.9.2":
    status: published
    build_date: "2026-05-28"
  "3.9.2.1":
    status: recipe
    build_date: "2026-07-25"
  "3.9.2.2":
    status: published
    build_date: "2026-08-14"
