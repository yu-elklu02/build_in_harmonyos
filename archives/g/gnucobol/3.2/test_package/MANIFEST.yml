package: gnucobol/3.2
homepage: "https://www.gnu.org/software/gnucobol/"

upstream_check_command: "make MAKEINFO=true check -j1"
upstream_test_in_build: true
upstream_test_command: "make MAKEINFO=true check -j1"

upstream_tests:
  - file: tests/testsuite
    source: gnucobol-3.2/tests/testsuite
    description: "GnuCOBOL compiler, parser, runtime, dialect, and diagnostics test suite"
    command: "make MAKEINFO=true check -j1"
  - file: tests/cobol85/Makefile.am
    source: gnucobol-3.2/tests/cobol85/Makefile.am
    description: "COBOL 85 validation suite driver"
    command: "make MAKEINFO=true check -j1"

test_package_tests:
  - file: test.c
    description: "Links libcob, exercises cob_malloc/cob_free, and verifies cob_get_field_str bounds with a guarded short buffer"
    command: "ctest --output-on-failure"
  - file: hello.cob
    description: "Uses packaged cobc to compile and execute a real COBOL program"
    command: "cobc -x -free hello.cob && ./conan-gnucobol-test"
  - file: conanfile.py
    description: "Runs cobc and cobcrun version checks"
    command: "cobc --version && cobcrun --version"

assertion_count: 8
