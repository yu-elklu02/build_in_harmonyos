# 编译中学到的知识
knowledge_gained:
  - "GnuCOBOL 3.2 requires a multiple-precision math library; GMP is not optional"
  - "Static GMP must be built with PIC because libcob is a shared library"
  - "Autoconf config.status temporary directories need TMPDIR without umask 077 on HMDFS"
  - "HarmonyOS fmemopen is present but unusable; libcob must use its temporary-file fallback"
  - "HarmonyOS read-only /tmp must not be selected as a temporary directory"
  - "Automatic llvm-strip invalidates HarmonyOS ELF signatures and must be disabled"
  - "The upstream configure script contains two Latin-1 0xFC typo bytes; repair only generated configure to keep UTF-8 gate logs without triggering Autotools regeneration"

