# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: git-crypt/0.8.0
homepage: "https://www.agwa.name/projects/git-crypt/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# git-crypt has no formal test suite (no make check target produces tests)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_git_crypt.sh
    description: "Runs git-crypt --version to verify the binary is functional"
    command: "bash test_git_crypt.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
