# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gadap/2.0
homepage: "http://cola.gmu.edu/grads/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cc
    source: gadap-2.0/test/test.cc
    description: "test program for the gadap library (open/close dataset, var enumeration)"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cc
    description: "消费者测试：调用 gadap_numopen() 与 gadap_open() 验证库可用性与错误路径"
    command: "./test_gadap"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
