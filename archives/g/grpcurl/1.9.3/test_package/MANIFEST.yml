# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: grpcurl/1.9.3
homepage: "https://github.com/fullstorydev/grpcurl"

# 上游测试命令 (grpcurl uses Go testing, not make check)
upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Go test suite, not applicable for binary package)
upstream_tests:
  - file: grpcurl_test.go
    source: grpcurl-1.9.3/grpcurl_test.go
    description: "Go unit tests for grpcurl library"
    command: "go test -run ."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: grpcurl --version"
    command: "./test.sh"

# 测试断言总数 (近似值)
assertion_count: 1
