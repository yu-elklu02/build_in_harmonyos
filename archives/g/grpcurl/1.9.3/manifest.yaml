software: grpcurl
version: "1.9.3"
status: published
build_date: "2026-08-10"
build_system: go

source:
  url: "https://github.com/fullstorydev/grpcurl/archive/refs/tags/v1.9.3.tar.gz"
  sha256: "bb555087f279af156159c86d4d3d5dd3f2991129e4cd6b09114e6851a679340d"
  tar_format: tar.gz

build:
  system: go
  build_system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "-ldflags=-s -w -X main.version=1.9.3"
  dependencies:
    - "go/1.22.10"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
    - "HMDFS 信任路径限制：只有 /data/service/hnp/bin/ 和 ~/usr/local/bin/ 被信任"
    - "Go 静态二进制（EXEC 类型）可用 binary-sign-tool -selfSign 1 签名成功且可执行"
    - "Go PIE/DYN 二进制签名后 TLS program header 被 binary-sign-tool 损毁导致 SIGSEGV"
    - "HMDFS 会主动删除尝试执行的无签名 ELF 文件"
    - "Go 1.22 无 DIT ARM64 汇编指令问题，Go 1.23+ 存在 DIT 问题"
    - "Go 二进制非标准 ELF 布局，strip 后可被 binary-sign-tool 正常签名"
    - "Go linker mmap 在 HarmonyOS tmpfs 上失败，需使用预编译二进制方案"
    - "Conan 配方适配：预编译二进制 + strip + sign 方案适用于 Go 项目"
