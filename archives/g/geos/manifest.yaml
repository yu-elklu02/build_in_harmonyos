software: geos
display: "GEOS"
description: "OSGeo Geometry Engine Open Source C/C++ geometry library"
category: library
homepage: "https://libgeos.org/"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build static libgeos/libgeos_c to avoid RPATH-sensitive shared-library loading on OHOS."
    - "Disable upstream benchmark, website, and full unit-test targets in package builds; keep consumer coverage in test_package."
    - "Expose GEOS::geos and GEOS::geos_c CMake component targets for downstream geospatial projects such as MapServer."
  common_dependencies: []

versions:
  "3.13.0.1":
    status: built
    build_date: "2026-07-20"
