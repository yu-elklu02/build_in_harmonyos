software: geos
version: "3.13.0.1"
build_system: cmake
status: built
build_date: "2026-07-20"

source:
  url: "https://download.osgeo.org/geos/geos-3.13.0.tar.bz2"
  sha256: "47ec83ff334d672b9e4426695f15da6e6368244214971fabf386ff8ef6df39e4"
  tar_format: tar.bz2

build:
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DBUILD_WEBSITE=OFF"
    - "-DBUILD_ASTYLE=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GEOS installs both C++ and stable C API targets; expose GEOS::geos and GEOS::geos_c for downstream CMake consumers."
  - "Static GEOS avoids RPATH-sensitive shared-library loading while preserving geosop as a CLI smoke target."
  - "GEOS upstream CTest is suitable for native CI execution: default ctest runs 324 unit-* entries and 168 XML validation entries, while the all-unit-tests/all-xml-tests aggregates are restricted to the Valgrind configuration; cross builds skip runtime execution and keep compile/link validation."
