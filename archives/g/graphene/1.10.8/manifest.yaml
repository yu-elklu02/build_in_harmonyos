version: "1.10.8"
status: built
build_date: "2026-08-14"
conan_ref: "graphene/1.10.8"

source:
  url: "https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz"
  sha256: "a37bb0e78a419dcbeaa9c7027bcff52f5ec2367c25ec859da31dfde2928f279a"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "default_library=static"
    - "wrap_mode=nodownload"
    - "introspection=disabled"
    - "installed_tests=false"
    - "gtk_doc=false"
    - "tests=true"
  cc: clang
  cxx: clang++

patches_applied: []

dependencies:
  - "glib2/2.88.0"

knowledge_gained:
  - "graphene 是纯 C meson 库，上游仅 dependency('gobject-2.0')（glib 2.30+）；glib2 2.88.0 的 PkgConfigDeps 只生成 glib-2.0.pc，需补转发型 gobject-2.0.pc（Requires: glib-2.0）才能命中 meson 的 gobject 检测。"
  - "graphene 测试依赖 mutest（源码包已内嵌 subprojects/mutest），wrap_mode=nodownload 下离线构建，无需额外下载。"
  - "首轮静态构建（shared=False, fPIC=True），无 patch，真机 meson test 全部通过。"
