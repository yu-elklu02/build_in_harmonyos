# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# graphene 1.10.8 上游测试基于 meson + mutest（TAP 输出），测试可执行位于
# tests/（box/euler/frustum/matrix/plane/point/point3d/quad/quaternion/ray/
# rect/simd/size/sphere/triangle/vec2/vec3/vec4）。mutest 由源码包
# subprojects/mutest 提供（离线构建），测试在 build() 中真机运行。

package: graphene/1.10.8
homepage: https://github.com/ebassi/graphene

# 上游测试命令
upstream_check_command: "meson test"

# conanfile.py build() 中已集成上游测试（OHOS 真机运行）
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <build_folder> --timeout-multiplier=16 --no-rebuild --no-suite=failing"

# 代表性上游测试（完整列表见 notes.md）
upstream_tests:
  - file: tests/point3d.c
    source: graphene-1.10.8.tar.xz/tests/point3d.c
    description: "graphene_point3d 单元测试"
    command: "meson test point3d"
  - file: tests/matrix.c
    source: graphene-1.10.8.tar.xz/tests/matrix.c
    description: "graphene_matrix 单元测试"
    command: "meson test matrix"
  - file: tests/simd.c
    source: graphene-1.10.8.tar.xz/tests/simd.c
    description: "SIMD 数学路径单元测试"
    command: "meson test simd"

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test_graphene.c
    description: "graphene_point3d_init/distance 真实 API 冒烟"
    command: "./test_graphene"

# 上游测试目标数（18 个单元测试目标 + mutest 子项目测试；保守下界）
assertion_count: 18
