# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: gd/2.3.3
homepage: "https://libgd.github.io/"

# 上游测试命令 (make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（gd 2.3.3 tests/ 目录，autotools testsuite）
upstream_tests:
  - file: tests/png/png_im2im
    source: gd-2.3.3/tests/png/png_im2im
    description: "PNG 图像读写往返测试（核心功能）"
    command: "./png_im2im"
  - file: tests/gdimagecopyresampled/basic
    source: gd-2.3.3/tests/gdimagecopyresampled/basic
    description: "图像缩放重采样基础测试"
    command: "./basic"

# test_package 中自带的测试 (消费者视角验证，真实调用 GD API)
test_package_tests:
  - file: test.c
    description: "消费者测试：gdVersionString + gdImageCreateTrueColor + 绘图 API"
    command: "./test_gd"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
