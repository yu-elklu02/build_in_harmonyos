software: gd
display: "GD Graphics Library"
description: "开源图像处理库，支持 PNG、JPEG、GIF、WebP 等格式"
category: gfx
homepage: "https://libgd.github.io/"
license: MIT-like
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 config.guess/config.sub 补丁支持 HarmonyOS"
    - "依赖 libpng、freetype、libjpeg-turbo 等多个图像库"
    - "configure 会检测可选依赖，缺失不影响核心功能"
  common_dependencies:
    - libpng
    - freetype
    - libjpeg-turbo

versions:
  "2.3.3.1":
    status: built
    build_date: "2026-08-04"
    notes: >-
      2.3.3 的功能增强版（R37 适配后缀）。已发布的 2.3.3 只 requires zlib+libpng、
      configure 仅给 --prefix=/；本版额外启用 jpeg/freetype/fontconfig/webp/tiff，
      并显式关闭 x/xpm/avif/heif/liq/raqm（X11 桌面栈与本轮不引入的额外依赖）。
      供 graphviz 的 gd 输出插件使用。真机实测 DT_NEEDED 已含上述五个库。
  "2.3.3":
    status: published
    build_date: "2026-08-01"
