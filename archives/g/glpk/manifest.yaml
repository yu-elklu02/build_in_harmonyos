software: glpk
display: "GLPK"
description: "GNU Linear Programming Kit：线性规划与混合整数规划求解器"
category: foundation
homepage: "https://www.gnu.org/software/glpk/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 库给 --build/--host 显式三元组即可跳过 config.guess，无需打补丁"
    - "--with-gmp 时 configure 用 AC_CHECK_HEADER 探 gmp.h，需经 os.environ 补 CPPFLAGS/LDFLAGS 指到 conan 的 gmp 包（autoconf 会把它们烤进 Makefile，比 AutotoolsToolchain.extra_cflags 可靠）"

versions:
  "5.0":
    status: built
    build_date: "2026-07-29"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8），依赖 gmp/6.3.0；真机原生 conan create 验证，test_package 真解一道 LP 并校验最优值与最优解，5 条断言全绿；产 libglpk.so.40"
    dependencies:
      - gmp/6.3.0
