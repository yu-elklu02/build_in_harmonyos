# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gallery-dl/1.32.1
homepage: "https://github.com/mikf/gallery-dl"

# 上游测试命令
upstream_check_command: "python3 -m pytest test/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test/"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_config.py
    source: gallery-dl-1.32.1/test/test_config.py
    description: "Configuration parsing and validation tests"
    command: "python3 -m pytest test/test_config.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.sh
    description: "Smoke test: gallery-dl --version"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 50
