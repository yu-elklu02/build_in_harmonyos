# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gmssl/3.1.1
homepage: "https://github.com/guanzhi/GmSSL"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/sm4test.c
    source: gmssl-3.1.1/tests/sm4test.c
    description: "SM4 block cipher test"
    command: "./sm4test"
  - file: tests/sm3test.c
    source: gmssl-3.1.1/tests/sm3test.c
    description: "SM3 hash function test"
    command: "./sm3test"
  - file: tests/sm2test.c
    source: gmssl-3.1.1/tests/sm2test.c
    description: "SM2 public key cryptography test"
    command: "./sm2test"
  - file: tests/sm9test.c
    source: gmssl-3.1.1/tests/sm9test.c
    description: "SM9 identity-based cryptography test"
    command: "./sm9test"
  - file: tests/zuctest.c
    source: gmssl-3.1.1/tests/zuctest.c
    description: "ZUC stream cipher test"
    command: "./zuctest"
  - file: tests/aestest.c
    source: gmssl-3.1.1/tests/aestest.c
    description: "AES block cipher test"
    command: "./aestest"
  - file: tests/sha256test.c
    source: gmssl-3.1.1/tests/sha256test.c
    description: "SHA-256 hash test"
    command: "./sha256test"
  - file: tests/sha512test.c
    source: gmssl-3.1.1/tests/sha512test.c
    description: "SHA-512 hash test"
    command: "./sha512test"
  - file: tests/tlstest.c
    source: gmssl-3.1.1/tests/tlstest.c
    description: "TLS 1.2 protocol test"
    command: "./tlstest"
  - file: tests/tls13test.c
    source: gmssl-3.1.1/tests/tls13test.c
    description: "TLS 1.3 protocol test"
    command: "./tls13test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "SM3 digest verification with known test vector"
    command: "./test_gmssl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36
