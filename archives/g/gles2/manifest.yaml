software: gles2
display: "GLES2"
description: "Cross-platform wrappers for OpenGL ES 2.0 API (C++)"
category: graphics
homepage: "https://github.com/yiptool/gles2"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游使用自定义 Yip 构建系统，在 source() 中动态生成 CMakeLists.txt 替代"
    - "使用 dummy wrapper（空 stub 实现）适配无原生 OpenGL ES 的 HarmonyOS 平台"
    - "⚠️ dummy wrapper 为空 stub 实现，所有 GL 函数不执行实际渲染，调用方需知晓此限制"
    - "无外部依赖，纯 C++ 标准库"
    - "dummy wrapper 的 getError() 返回 GL_INVALID_OPERATION，测试需匹配此行为"
  adaptation_assessment:
    strategy: "dummy_wrapper"
    completeness: "compile_link_only"
    description: >-
      本适配使用 dummy wrapper（空 stub 实现），仅提供编译期符号链接能力，
      不含实际 GL 渲染功能。适用于下游仅需链接 gles2 符号的场景（如单元测试编译依赖）。
      如下游需要实际 OpenGL ES 渲染能力，需替换为真实 EGL/GLESv2 后端适配。
  common_dependencies: []

versions:
  "2.0.25":
    status: published
    build_date: "2026-08-06"
