# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gles2/2.0.25
homepage: "https://github.com/yiptool/gles2"

# 上游测试命令 (上游使用自定义 Yip 构建系统，无标准测试)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游源码不包含测试套件，test_package 提供消费者视角验证
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 GL::init()、GL::getError() 和 GL::getInteger() 验证库链接和运行"
    command: "./test_gles2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
