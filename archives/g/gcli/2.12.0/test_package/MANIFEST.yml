package: gcli/2.12.0
homepage: https://sr.ht/~herrhotzenplotz/gcli

upstream_test_in_build: false
upstream_tests:
  - file: tests/run.pl
    description: "Upstream Perl TAP suite for source development; not run in Conan because it covers forge workflows and maintainer tooling."
    command: "make check"

test_package_tests:
  - file: check_gcli.py
    description: "Verify installed executable, gcli version output, libcurl reporting, and non-network usage text"
    command: "python3 check_gcli.py <gcli-bin>"
  - file: conanfile.py
    description: "Run installed gcli through Conan VirtualRunEnv"
    command: "conan test"

assertion_count: 7
