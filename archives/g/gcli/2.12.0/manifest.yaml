software: gcli
version: "2.12.0"
status: built
build_date: "2026-07-18"
build_system: manual-configure

source:
  url: "https://herrhotzenplotz.de/gcli/releases/gcli-2.12.0/gcli-2.12.0.tar.gz"
  sha256: "56fa53dffe7408c4be0a85ce4b955501c96dc2e36dd48b6dc74029ce2e218fcd"
  tar_format: tar.gz

build:
  system: manual-configure
  configure_options:
    - "--prefix=/"
    - "--disable-libedit"
    - "--disable-libreadline"
    - "--disable-liblowdown"
    - "--disable-librt"
    - "--release"
  dependencies:
    - "private static libcurl 8.15.0 built inside the recipe"
    - "openssl/3.5.6"
    - "zlib/1.3.1"
    - "no flex/lex runtime dependency; pgen uses bundled hand-written lexer source"
  cc: "profile clang"
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Homebrew gcli currently tracks upstream release 2.12.0."
  - "gcli uses a handwritten configure script, not GNU autotools."
  - "The build requires pkg-config packages named libcurl and libcrypto."
  - "The CI environment may provide libcurl headers/libraries inconsistently between workers. The recipe does not depend on unpublished curl/8.19.0 or worker-local system libcurl; it downloads official curl 8.15.0 source and builds a private static libcurl during build()."
  - "OHOS shell command lookup can report `name=name` for some tools; the recipe patches upstream configure's find_program helper so realpath/pkg-config/install probes use the executable token safely."
  - "OHOS CI workers may have yacc but no lex; the recipe patches Makefile.in so pgen copies a bundled hand-written lexer instead of invoking lex."
  - "CI build #8078 proved curl/8.19.0 is not resolvable from the ohpcd Conan remote, so depending on it blocks L0/L1 before the build can use --build=missing."
  - "CI build #8121 proved OpenSSL libraries can be present without OpenSSL development headers on some workers; CI build #8138 proved libcurl/libssl/libcrypto libraries can be absent on other workers. The recipe therefore uses Conan openssl/zlib plus private curl instead of DEFAULT_PREFIX libcurl/libcrypto."
  - "CI build #8211 proved curl 8.15.0's bundled config.sub does not recognize the OHOS host triplet. The recipe wraps curl's config.sub so *-linux-ohos is accepted while all other triplets still go through the upstream helper."
  - "CI build #8287 proved curl configure's private umask 077 temporary directory can make generated config.status helper files unreadable on HMDFS. The recipe rewrites that private curl configure umask to 022 before running it."
  - "CI build #8307 built and packaged gcli successfully, then failed in package_info because openssl/zlib package folders can be unavailable when Conan skips dependency binaries for the test graph. package_info now guards those runenv paths."
  - "Interactive editing and markdown rendering are optional; libedit, readline, and lowdown are disabled to keep the HarmonyOS PC package deterministic."
  - "The upstream network/API test suite is not run in Conan CI; test_package uses non-network version and usage checks."

test:
  upstream: "Upstream has a Perl TAP test suite for source development; it is not run in Conan because it covers live forge workflows and maintainer tooling."
  test_package: "Checks installed gcli executable, runs gcli version, validates libcurl reporting, and checks general usage output without network access."
