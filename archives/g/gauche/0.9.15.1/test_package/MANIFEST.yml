# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: gauche/0.9.15.1
homepage: "https://practical-scheme.net/gauche/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试未作为配方的一部分运行；测试矩阵较大，
# 由消费者 test_package 覆盖已安装的解释器 API。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "初始化 Gauche 运行时并执行 Scheme 表达式"
    command: "./test_gauche"

# test.c 断言 Scm_EvalCStringRec 的返回值为 6。
assertion_count: 1
