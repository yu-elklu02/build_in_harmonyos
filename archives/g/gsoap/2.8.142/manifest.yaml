software: gsoap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8.142/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.142"

# 构建系统
build_system: autotools

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.genivia.com/thanks.html?download=gsoap-2.8.142.zip"

  # 源码校验和
  sha256: "6d7196bd6591ec2977474c681e351b4a33eb5c2d64c9e2e6727b004f330b3752"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/usr/local"
    - "CPPFLAGS=-I<openssl_include_dir> -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
    - "LDFLAGS=-L<openssl_lib_dir>"
    - "CFLAGS=-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
    - "CXXFLAGS=-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-depcomp.patch"
  - "0005-gsoap-stdsoap2.c.patch"
  - "0006-gsoap-stdsoap2.cpp.patch"
  - "0007-install-sh.patch"
  - "0008-mkinstalldirs.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gSOAP 在 OHOS 上需要强制使用 poll() 替代 select()，避免 FD_SET 引用的 __fd_chk 函数缺失问题"
  - "添加 || defined(__OHOS__) 条件强制使用 HAVE_POLL 路径"
  - "Genivia 官方提供 zip 格式的源码包，需要使用正确的下载 URL"
  - "autoreconf -fvi 可以解决 HMDFS 文件系统上的 configure 权限问题"
  - "OpenSSL pkg-config 文件路径需要修正为实际安装路径"
patch_generation:
  method: per-file-difflib
  source_orig_dir: <build_dir>/gsoap-2.8.142.orig
  source_work_dir: <build_dir>/gsoap-2.8.142.work
  source_orig_hash: cd39152e3b726ad5
  source_work_hash: 1e310cce5d2db5f0
  generated_at: '2026-06-09T17:01:38'
  patches_count: 8

