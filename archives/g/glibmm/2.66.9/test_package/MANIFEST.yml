# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: glibmm/2.66.9
homepage: https://gitlab.gnome.org/GNOME/glibmm

# ADAPTATION_GUIDE Step 3 / TEST_QUALITY_SPEC §3：上游 meson 套件在 build() 中跑。
# build-tests=true 编译 tests/ 下自包含 C++ 测试程序；原生 OHOS/HarmonyOS 包装后
# meson test -C {build_folder} --timeout-multiplier=16 --no-rebuild --no-suite=failing
# （glib 2.84.0.1 E215 同款：OHOS 平台限制失败走 can_fail + failing suite 排除）。
# ⚠️ 人工执行后用 `meson test -C build --list` 的实际程序列表修正下方 entries
#    （meson-info/intro-tests.json 为最终依据），并回填补丁记录（如产生）。
upstream_check_command: "meson test -C build --timeout-multiplier=16 --no-rebuild --no-suite=failing"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --timeout-multiplier=16 --no-rebuild --no-suite=failing"

upstream_tests:
  - file: tests/glibmm_ustring/main.cc
    description: "Glib::ustring basic ops (glibmm 自包含测试程序, meson test 执行)"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild glibmm_ustring_test"
  - file: tests/glibmm_date/main.cc
    description: "Glib::Date binding (meson test 执行)"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild glibmm_date_test"
  - file: tests/glibmm_refptr/main.cc
    description: "Glib::RefPtr<Glib::Object> lifecycle (meson test 执行)"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild glibmm_refptr_test"
  - file: tests/giomm_file/main.cc
    description: "Gio::File basic ops (meson test 执行)"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild giomm_file_test"

test_package_tests:
  - file: test.cpp
    description: "头文件包含 + 链接 glibmm-2.4/giomm-2.4 + 原生运行（ustring/compose/convert/DateTime/Gio::File/sigc 集成，9 断言）"
    command: "./test_probe"

assertion_count: 9
