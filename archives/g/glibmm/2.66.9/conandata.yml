# conandata.yml — glibmm 2.66.9
# 源码 URL（R39：官方源）+ SHA256。
#
# ⚠️ 版本裁决（修正 ADAPTATION.md 的错误）：libxml++ 2.42.3（libxml++-2.6.pc）
#     meson 探测 dependency('glibmm-2.4', version: '>= 2.32.0')，需要
#     glibmm-2.4.pc（2.4 ABI）。glibmm 2.66.x 是最后提供 glibmm-2.4.pc /
#     libglibmm-2.4.so 的 2.4 ABI 线；glibmm 2.68+ 改为 glibmm-2.68 ABI
#     （sigc++-3.0），不满足 libxml++ 2.x。故选用 glibmm 2.66.9。
#
# ⚠️ 必须用 download.gnome.org 的 release tarball（meson dist 产物）：
#     release tarball 自带 untracked/（预生成绑定代码），maintainer-mode=false
#     即可构建（无需 mm-common/gmmproc）。
#
# sha256 为 GNOME 官方 sha256sum 文件中的真实值：
#   5a026e5602085307c7dcb72b71b07261c40f80914277bef5f8d7f2ecab739bec  glibmm-2.66.9.tar.xz
#
# 补丁：
#   0001-tls-client-failing-on-harmonyos.patch — giomm_tls_client_test 在 OHOS
#     上无法连接网络（E215 模式），标记为 failing suite，由 build() 的
#     meson test --no-suite=failing 跳过。

sources:
  url: "https://download.gnome.org/sources/glibmm/2.66/glibmm-2.66.9.tar.xz"
  sha256: "5a026e5602085307c7dcb72b71b07261c40f80914277bef5f8d7f2ecab739bec"

patches:
