software: glibmm
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.66.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.66.9"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-02"

# Conan 引用
conan_ref: "glibmm/2.66.9@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致）
  url: "https://download.gnome.org/sources/glibmm/2.66/glibmm-2.66.9.tar.xz"
  # 源码校验和（GNOME 官方 sha256sum）
  sha256: "5a026e5602085307c7dcb72b71b07261c40f80914277bef5f8d7f2ecab739bec"
  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  # 关键说明：tarball 为 meson dist 产物，自带 untracked/ 预生成绑定，
  # maintainer-mode=false 构建（无需 mm-common/gmmproc）
  cc: clang
  cxx: clang++
  # Conan 依赖（ohpcd 制品仓）
  dependencies:
    - "glib/2.84.0.1 (components glib-2.0 / gobject-2.0 / gio-2.0)"
    - "libsigc/2.10.8 (sigc++-2.0)"

# ============================================================
# 补丁清单
# ============================================================

patches_applied:
  - "patches/0001-tls-client-failing-on-harmonyos.patch (giomm_tls_client_test 在 OHOS 无法联网，标记 failing suite 由 build() 跳过)"

# ============================================================
# 知识经验
# ============================================================

knowledge_gained:
  - "版本裁决：libxml++ 2.42.3 探测 dependency('glibmm-2.4', '>= 2.32.0')，需 2.4 ABI 线；glibmm 2.66.x 是最后提供 glibmm-2.4.pc 的版本，2.68+ 改 2.68 ABI（sigc++-3.0）"
  - "E215 模式：OHOS 平台限制失败的测试用 failing suite 排除（glib 2.84.0.1 同款）"

# ============================================================
# 角色说明（2026-08-03 更新）
# ============================================================

role: "synfig 依赖项"
note: "作为 synfig 1.5.5 的依赖项随 PR 提交（synfig-core 探测 glibmm-2.4.pc REQUIRED），由 CI 从源码构建；不依赖制品仓预发布"
