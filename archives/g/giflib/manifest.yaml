software: giflib
display: "giflib"
description: "GIF 图像格式读写库和工具"
category: gfx
homepage: "https://sourceforge.net/projects/giflib/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Drive the direct Makefile with Conan-selected compiler and archiver settings"
    - "Run helper scripts explicitly through the selected POSIX shell and TMPDIR"
    - "Sign target ELF files before HarmonyOS execution"
    - "Package shared or static libraries without HMDFS version symlinks"
    - "SourceForge 下载 URL 以 /download 结尾，需显式指定 tar.gz 文件名"
    - "上游回归测试需要先构建 GIF 工具，Conan 包仅发布库和头文件"
    - "OHOS head 不支持负数 --bytes，测试截断输入使用 POSIX wc -c 与 dd"
    - "消费者测试从 GifFileType::Error 读取编解码操作错误，并在 close 释放对象前记录"
  common_dependencies: []

versions:
  "5.2.2":
    status: built
    build_date: "2026-07-17"
  "6.1.3":
    status: built
    build_date: "2026-07-20"
    conan_ref: "giflib/6.1.3"
    format: conan
    issue: 1315
