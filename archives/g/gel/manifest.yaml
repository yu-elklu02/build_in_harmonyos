software: gel
display: "gel"
description: "A modern gem manager for Ruby"
category: utility
homepage: "https://gel.dev"
license: MIT

build_system: script

ohos_adaptation:
  key_points:
    - "Pure Ruby script tool — no compilation required"
    - "Shebang #!/usr/bin/env ruby --disable=gems works on OHOS if Ruby is installed"
    - "Man pages require ronn to build from .ronn sources; skipped if ronn unavailable"
  common_dependencies:
    - ruby

versions:
  "0.3.0":
    status: built
    build_date: "2026-07-30"
