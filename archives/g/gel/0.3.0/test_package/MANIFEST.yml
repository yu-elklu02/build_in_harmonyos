# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: gel --help output AND lib/gel/command.rb load AND version.rb check"
    command: "bash test.sh"

# Total upstream test cases (sum of all *_test.rb files)
assertion_count: 62
