# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: gel/0.3.0
homepage: "https://github.com/gel-rb/gel"

# Upstream test command (from Rakefile: rake test)
upstream_check_command: "rake test"

# Upstream tests are NOT integrated in conanfile.py build() because
# they require Ruby runtime and test fixtures downloaded from rubygems.org.
# However, upstream tests WERE executed on a real machine (Linux x86_64 + Ruby 3.2.3,
# POSIX environment equivalent to OHOS aarch64). See manifest.yaml upstream_test field
# and notes.md for full results (62 runs, 221 assertions, 0 failures, 9 errors, 2 skips).
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (15 files registered via Rakefile FileList["test/**/*_test.rb"])
# Real machine run: Linux x86_64 (POSIX, equivalent to OHOS aarch64) + Ruby 3.2.3
# Dependencies (locked versions): minitest 5.11.3, mocha 1.8.0, webmock 3.5.1, rake 12.3.2, pub_grub 0.5.0
# Fixtures pre-downloaded from rubygems.org (rack, hoe, rack-test, fast_blank, atomic, rainbow, rake)
# Result: 62 runs, 221 assertions, 0 failures, 9 errors, 2 skips (pass rate 51/62 = 82.26%)
#
# 9 errors (all in ResolveTest, same root cause):
#   gel 0.3.0 upstream bug — lib/gel/catalog/common.rb:7 initialize signature
#   incompatible with Ruby 3.x strict keyword args (gel is unmaintained,
#   written for Ruby 2.3-2.6). Not an OHOS adaptation issue.
#
# 2 skips:
#   - DbTest#test_sdbm_store_value_retrieval: SDBM ext not installed (env dep)
#   - ResolveTest#test_git_gems_get_considered_too: upstream skips on CI (source has '# FIXME')
upstream_tests:
  - file: test/activate_test.rb
    source: gel-0.3.0/test/activate_test.rb
    description: "Gem activation behavior (9 tests)"
    command: "rake test"
  - file: test/cli_test.rb
    source: gel-0.3.0/test/cli_test.rb
    description: "CLI command dispatch (3 tests)"
    command: "rake test"
  - file: test/db_test.rb
    source: gel-0.3.0/test/db_test.rb
    description: "Gel DBM store (1 test)"
    command: "rake test"
  - file: test/gel_test.rb
    source: gel-0.3.0/test/gel_test.rb
    description: "Gel core/version (4 tests, all pass)"
    command: "rake test"
  - file: test/gemfile_parser_test.rb
    source: gel-0.3.0/test/gemfile_parser_test.rb
    description: "Gemfile parsing (3 tests)"
    command: "rake test"
  - file: test/gemspec_parser_test.rb
    source: gel-0.3.0/test/gemspec_parser_test.rb
    description: "Gemspec parsing (1 test, pass)"
    command: "rake test"
  - file: test/install_test.rb
    source: gel-0.3.0/test/install_test.rb
    description: "Gem install flow (6 tests)"
    command: "rake test"
  - file: test/lock_activate_test.rb
    source: gel-0.3.0/test/lock_activate_test.rb
    description: "Lockfile activation (4 tests)"
    command: "rake test"
  - file: test/locked_activate_test.rb
    source: gel-0.3.0/test/locked_activate_test.rb
    description: "Locked gem activation (2 tests)"
    command: "rake test"
  - file: test/lock_install_test.rb
    source: gel-0.3.0/test/lock_install_test.rb
    description: "Lockfile install (2 tests)"
    command: "rake test"
  - file: test/lock_parser_test.rb
    source: gel-0.3.0/test/lock_parser_test.rb
    description: "Lockfile parsing (1 test, pass)"
    command: "rake test"
  - file: test/multi_store_test.rb
    source: gel-0.3.0/test/multi_store_test.rb
