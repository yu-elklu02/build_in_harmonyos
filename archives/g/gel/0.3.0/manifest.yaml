knowledge_gained:
  - "gel is a pure Ruby script tool — no C/C++ compilation needed"
  - "Build process: copy exe/gel to bin/, copy lib/ to package, optionally generate man pages with ronn"
  - "Shebang #!/usr/bin/env ruby --disable=gems is OHOS-compatible if Ruby is installed"
  - "Man pages use .ronn format (ronn tool), not pre-built — ronn may be unavailable on OHOS CI"
  - "require_relative paths in exe/gel work correctly with bin/ + lib/ Conan package layout"

upstream_test:
  executed: true
  environment: "Linux x86_64 (POSIX, equivalent to OHOS aarch64) + Ruby 3.2.3 + minitest 5.11.3 + mocha 1.8.0 + webmock 3.5.1"
  command: "rake test (Rakefile FileList[\"test/**/*_test.rb\"], fixtures pre-downloaded from rubygems.org)"
  runs: 62
  assertions: 221
  failures: 0
  errors: 9
  skips: 2
  pass_rate: "51/62 (82.26%)"
  error_reason: "9 errors all in ResolveTest, same root cause: gel 0.3.0 upstream bug in lib/gel/catalog/common.rb:7 — initialize signature (uri, uri_identifier, httpool:, work_pool:, cache:) is incompatible with Ruby 3.x strict keyword args separation (gel written for Ruby 2.3-2.6, now unmaintained). Not an OHOS adaptation issue."
  skip_reason: "DbTest#test_sdbm_store_value_retrieval (SDBM ext not installed, env dep); ResolveTest#test_git_gems_get_considered_too (upstream skips on CI by design, source has '# FIXME')"
  reproduce: |
    curl -sL https://github.com/gel-rb/gel/archive/refs/tags/v0.3.0.tar.gz | tar xz
    cd gel-0.3.0 && git init -q && git add -A && git -c user.email=t@t -c user.name=t commit -qm init
    gem install rake -v 12.3.2 minitest -v 5.11.3 metaclass -v 0.0.4 mocha -v 1.8.0 \
      public_suffix -v 3.0.3 addressable -v 2.6.0 safe_yaml -v 1.0.5 crack -v 0.4.3 \
      hashdiff -v 0.3.8 webmock -v 3.5.1 pub_grub -v 0.5.0 rexml -v 3.2.5 --no-document
    ruby -Ilib exe/gel install
    RUBYLIB="$(ruby -e 'puts Gem::Specification.find_by_name("rexml").gem_dir')/lib" rake test
