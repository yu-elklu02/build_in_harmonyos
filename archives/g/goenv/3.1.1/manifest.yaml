version: "3.1.1"
software: "goenv"
status: built
build_date: "2026-08-06"
build_system: "custom"

source:
  url: "https://github.com/go-nv/goenv/archive/refs/tags/3.1.1.tar.gz"
  sha256: "8c107c1ec31cd544bbf59dc822676ef1966811a13e006aa35ba09546a74c4d9b"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS pre-adaptation strategy)"
    - "GOARCH=<target arch>"
    - "GOTOOLCHAIN=local"
    - "Go 1.24.0 SDK auto-bootstrap when GO/GOROOT/PATH lacks a usable Go"
  dependencies: []
  tool_dependencies:
    - "go >= 1.22 (auto-downloaded from golang.google.cn with dl.google.com fallback when missing)"
    - "binary-sign-tool"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "goenv 3.1.1 is a Go module CLI; main package in root, uses cobra subcommands."
  - "Version injection via ldflags: -X main.version=3.1.1 (main.go declares var version)."
  - "goenv --version outputs: goenv {version} via fmt.Printf in cmd/root.go."
  - "Go linker requires /data/storage/el2 tmpfs workspace on HarmonyOS to avoid HMDFS mmap permission denied."
  - "OHOS Go executables must be self-signed with binary-sign-tool before package/test execution."
  - "Go test cannot run on OHOS (ELF signing limit on test binaries); verified via --version smoke test."
