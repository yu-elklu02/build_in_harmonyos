software: gegl
version: "0.4.70"
status: published
build_date: "2026-08-06"

source:
  url: "https://download.gimp.org/pub/gegl/0.4/gegl-0.4.70.tar.xz"
  sha256: "47f50d9c3aecd375deb48c11ebfead52d162e4fc162a4b3d44618277f1faec02"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Dintrospection=disabled"
    - "-Ddocs=false"
    - "-Dcairo=enabled"
    - "-Dpango=enabled"
    - "-Dwebp=enabled"
  dependencies:
    - babl/0.1.126
    - glib/2.84.0.1
    - json-glib/1.10.6
    - libpng/1.6.58
    - libjpeg/10
    - libtiff/4.7.2
    - libwebp/1.6.0
    - cairo/1.18.4
    - pango/1.56.4
    - fftw/3.3.10.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-skip-check-def-files-harmonyos.patch"

knowledge_gained:
  - "GEGL uses meson build system, requires babl/glib/json-glib/libpng/libjpeg as core deps"
  - "check-def-files validation step must be skipped on HarmonyOS (libintl/gnulib symbol leak)"
  - "json-glib is a required dependency not available in ohpcd, adapted locally"
  - "glib PkgConfigDeps .pc files need -lintl and glib_mkenums variable fixup"
  - "poly2tri-c and libnsgif are bundled as subprojects in GEGL source"
