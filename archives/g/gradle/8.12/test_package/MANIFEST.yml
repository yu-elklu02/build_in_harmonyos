package: gradle/8.12
homepage: "https://gradle.org"

upstream_tests_exist: false
upstream_check_command: ~
upstream_test_in_build: false
upstream_test_command: ~

upstream_test_audit: |
  测试类型    上游用例数    说明
  单元测试（JUnit）    12000+    来源：Gradle 源码仓库 subprojects/ 下各模块的 JUnit 测试（src/test）
  集成测试    5000+    来源：Gradle 源码仓库 subprojects/ 下各模块的集成测试（src/integTest）
  合计    17000+    Gradle 是 JVM 应用，上游包含大量 JUnit/Spock 测试

upstream_tests: []

test_package_tests:
  - file: "test.sh"
    description: "L1 包结构测试：验证 bin/gradle 可执行、lib/*.jar 存在、wrapper 含 -Dos.name=Linux 覆盖"
    command: "sh test.sh <package_folder>"

assertion_count: 3
