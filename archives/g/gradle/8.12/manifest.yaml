# manifest.yaml — gradle 8.12
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "8.12"

# 编译状态: built (CI 验证通过后改为 published)
status: built

# 编译日期
build_date: "2026-07-20"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://services.gradle.org/distributions/gradle-8.12-bin.zip"
  sha256: "7a00d51fb93147819aab76024feece20b6b84e420694101f276be952e08bef03"
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: custom (binary distribution, 无需编译)
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies:
    - "bishengjdk/17.0.13"

  # 编译器: 无 (JVM 应用, 使用 java)
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Gradle 是 JVM 应用, 使用二进制分发版, 无需编译"
  - "Gradle 的 OperatingSystem 类不识别 HarmonyOS, 需通过 JAVA_TOOL_OPTIONS=-Dos.name=Linux 绕过"
  - "JVM 应用 conan 配方: settings 只需 os+arch, 不需要 compiler/build_type"
  - "package_info() 中 bindirs 指向 wrapper 脚本, libdirs 指向 JAR 目录"