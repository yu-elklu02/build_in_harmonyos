# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: graphite2/1.3.15
homepage: "https://graphite.sil.org/"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: gr2FontTest.cpp
    source: graphite2-1.3.15/gr2fonttest/gr2FontTest.cpp
    description: "字体渲染测试 (padauk, charis, scher, annapurna, awami)"
    command: "./gr2fonttest"
  - file: bits.cpp
    source: graphite2-1.3.15/tests/bittwiddling/bits.cpp
    description: "位运算测试"
    command: "./tests/bittwiddling/bits"
  - file: endiantest.cpp
    source: graphite2-1.3.15/tests/endian/endiantest.cpp
    description: "字节序测试"
    command: "./tests/endian/endiantest"
  - file: simple.c
    source: graphite2-1.3.15/tests/examples/simple.c
    description: "简单 C API 示例测试"
    command: "./tests/examples/simple"
  - file: features.c
    source: graphite2-1.3.15/tests/examples/features.c
    description: "特性 API 示例测试"
    command: "./tests/examples/features"
  - file: cluster.c
    source: graphite2-1.3.15/tests/examples/cluster.c
    description: "聚类示例测试"
    command: "./tests/examples/clusters"
  - file: linebreak.c
    source: graphite2-1.3.15/tests/examples/linebreak.c
    description: "换行示例测试"
    command: "./tests/examples/linebreak"
  - file: featuremaptest.cpp
    source: graphite2-1.3.15/tests/featuremap/featuremaptest.cpp
    description: "特性映射表测试"
    command: "./tests/featuremap/featuremaptest"
  - file: grlisttest.cpp
    source: graphite2-1.3.15/tests/grlist/grlisttest.cpp
    description: "字形列表测试"
    command: "./tests/grlist/grlisttest"
  - file: jsontest.cpp
    source: graphite2-1.3.15/tests/json/jsontest.cpp
    description: "JSON 输出测试"
    command: "./tests/json/jsontest"
  - file: nametabletest.cpp
    source: graphite2-1.3.15/tests/nametabletest/nametabletest.cpp
    description: "名称表测试"
    command: "./tests/nametabletest/nametabletest"
  - file: sparsetest.cpp
    source: graphite2-1.3.15/tests/sparsetest/sparsetest.cpp
    description: "稀疏数组测试"
    command: "./tests/sparsetest/sparsetest"
  - file: utftest.cpp
    source: graphite2-1.3.15/tests/utftest/utftest.cpp
    description: "UTF 编码测试"
    command: "./tests/utftest/utftest"
  - file: basic_test.cpp
    source: graphite2-1.3.15/tests/vm/basic_test.cpp
    description: "虚拟机测试 (call/direct)"
    command: "./tests/vm/vm-test-call"
  - file: basic_test.cpp
    source: graphite2-1.3.15/tests/vm/basic_test.cpp
    description: "虚拟机直执行测试"
    command: "./tests/vm/vm-test-direct"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 调用 gr_version() 验证 API 链接"
    command: "./test_graphite2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 150