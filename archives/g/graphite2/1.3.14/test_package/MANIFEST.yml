# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: graphite2/1.3.14
homepage: "https://github.com/silnrsi/graphite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/bittwiddling/bits.cpp
    source: graphite2-1.3.14/tests/bittwiddling/bits.cpp
    description: "Bit twiddling utility tests"
    command: "./bits"
  - file: tests/endian/endiantest.cpp
    source: graphite2-1.3.14/tests/endian/endiantest.cpp
    description: "Endianness detection test"
    command: "./endiantest"
  - file: tests/featuremap/featuremaptest.cpp
    source: graphite2-1.3.14/tests/featuremap/featuremaptest.cpp
    description: "Feature map test"
    command: "./featuremaptest"
  - file: tests/grlist/grlisttest.cpp
    source: graphite2-1.3.14/tests/grlist/grlisttest.cpp
    description: "gr list test"
    command: "./grlisttest"
  - file: tests/json/jsontest.cpp
    source: graphite2-1.3.14/tests/json/jsontest.cpp
    description: "JSON serialization test"
    command: "./jsontest"
  - file: tests/nametabletest/nametabletest.cpp
    source: graphite2-1.3.14/tests/nametabletest/nametabletest.cpp
    description: "Name table test"
    command: "./nametabletest"
  - file: tests/sparsetest/sparsetest.cpp
    source: graphite2-1.3.14/tests/sparsetest/sparsetest.cpp
    description: "Sparse data structure test"
    command: "./sparsetest"
  - file: tests/utftest/utftest.cpp
    source: graphite2-1.3.14/tests/utftest/utftest.cpp
    description: "UTF encoding test"
    command: "./utftest"
  - file: tests/vm
    source: graphite2-1.3.14/tests/vm
    description: "Virtual machine tests (call + direct)"
    command: "./vm-test-call, ./vm-test-direct"
  - file: tests/examples/simple.c
    source: graphite2-1.3.14/tests/examples/simple.c
    description: "Simple example C test"
    command: "./simple"
  - file: tests/examples/features.c
    source: graphite2-1.3.14/tests/examples/features.c
    description: "Features example C test"
    command: "./features"
  - file: tests/examples/cluster.c
    source: graphite2-1.3.14/tests/examples/cluster.c
    description: "Cluster example C test"
    command: "./clusters"
  - file: tests/examples/linebreak.c
    source: graphite2-1.3.14/tests/examples/linebreak.c
    description: "Line break example C test"
    command: "./linebreak"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test calling gr_engine_version() API"
    command: "./test_graphite2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 83
