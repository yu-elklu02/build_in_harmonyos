# 版本级 manifest
# 文件位置: archives/g/graphite2/1.3.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.14"

# 软件名
software: "graphite2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-22"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/silnrsi/graphite/archive/refs/tags/1.3.14.tar.gz"

  # 源码校验和
  sha256: "7a3b342c5681921ce2e0c2496509d30b5b078399d5a7bd2358f95166d57d91df"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DGRAPHITE2_NFILEFACE=ON"
    - "-DGRAPHITE2_NTRACING=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "graphite2 使用 CMake 构建系统，非 autotools"
  - "CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 来兼容 CMake < 3.5 的 CMAKE_MINIMUM_REQUIRED"
  - "默认静态编译 BUILD_SHARED_LIBS=OFF (R5/R26)"
  - "83 个测试全部通过 (ctest)"
  - "clang 不识别 -Wno-class-memaccess (GCC 专有标志)，但不影响编译"
  - "graphite2 无外部 C 依赖，是纯 C/C++ 库"
