# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: gmp/6.3.0
homepage: "https://gmplib.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: tests/t-bswap.c
    source: gmp-6.3.0/tests/t-bswap.c
    description: "GMP limb byte-swap validation"
    command: "make check"
  - file: tests/mpz/t-addsub.c
    source: gmp-6.3.0/tests/mpz/t-addsub.c
    description: "GMP integer addition and subtraction validation"
    command: "make check"
  - file: tests/mpq/t-cmp.c
    source: gmp-6.3.0/tests/mpq/t-cmp.c
    description: "GMP rational comparison validation"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Creates and multiplies an mpz integer, then verifies the result"
    command: "ctest --output-on-failure"

assertion_count: 4
