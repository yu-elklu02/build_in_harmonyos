name: gmp
description: GNU Multiple Precision Arithmetic Library - high-precision math library
category: math
license: LGPLv3
website: https://gmplib.org/
source_url: https://ftp.gnu.org/gnu/gmp/
build_system: autotools
versions:
  - version: "6.3.0.1"
    status: built
    build_date: "2026-08-12"
    notes: >-
      6.3.0 是纯静态且未开 --enable-cxx 的包，不产 gmpxx.h / libgmpxx。
      计算代数一族（givaro / fflas-ffpack / singular / linbox）全部依赖 GMP 的
      C++ 接口，缺 gmpxx 直接 configure 失败，故按仓库 .N 递增惯例新增本版本：
      上游 tarball 与 6.3.0 完全同一份（sha256 逐字一致），差异只在
      --enable-cxx + shared=True。两版并存，C 接口下游继续用 6.3.0。
  - version: 6.3.0
    status: built
    date: 2026-05-18
