package: glslang/vulkan-sdk-1.3.290.0
homepage: https://github.com/KhronosGroup/glslang
upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"
upstream_tests:
  - file: Test/runtests
    source: glslang-vulkan-sdk-1.3.290.0.tar.gz/Test/runtests
    description: "Run the official shader compilation and reference-output test suite"
    command: "ctest --output-on-failure -j1"
test_package_tests:
  - file: test.sh
    description: "Verify glslang and compile a vertex shader to valid SPIR-V"
    command: "glslang -V test.vert -o test.spv"
assertion_count: 3
