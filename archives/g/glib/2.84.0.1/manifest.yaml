software: glib
version: "2.84.0.1"
status: built
build_date: "2026-07-26"
build_system: meson

source:
  url: "https://ftp.gnome.org/pub/gnome/sources/glib/2.84/glib-2.84.0.tar.xz"
  sha256: "f8823600cb85425e2815cfad82ea20fdaa538482ab74e7293d58b3f64a5aff6a"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dselinux=disabled"
    - "-Dlibmount=disabled"
    - "-Dtests=true"
    - "-Dinstalled_tests=false"
    - "-Dintrospection=disabled"
    - "-Dnls=disabled"
    - "-Dsysprof=disabled"
    - "-Dlibelf=disabled"
    - "-Dxattr=false"
  dependencies:
    - "libffi/3.4.4"
    - "pcre2/10.45"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0002-upstream-test-fixes.patch"
  - "0003-journal-stub-harmonyos.patch"

knowledge_gained:
  - "E091 (R8 revised): gjournal-private.c 仅在 host_system=='linux' 时编译，harmonyos 链接缺 _g_fd_is_journal。0003 扩展 host_system 为 ['linux','harmonyos']，用通用 #else stub（return 0）替代 __OHOS__ 平台宏；gtlsconsoleinteraction.c 经 meson cc.has_function('getpass')→HAVE_GETPASS 功能检测，不再用 __OHOS__/__HARMONYOS__。"
  - "PkgConfigDeps emits pcre2.pc; meson wants libpcre2-8 — alias in generate()"
  - "R37: Conan recipe for archived 2.84.0 published as 2.84.0.1"
  - "E215 (2026-07-26): OHOS meson test 适配 — (1) 34 处 can_fail: harmonyos（含 utils/utils-c-*/gutils-user-database：passwd 不完整与 LD_PRELOAD 被拒致 SIGTRAP）；(2) build() 用 uname in (OHOS,HarmonyOS) 触发 meson test(--timeout-multiplier=16 --no-rebuild --no-suite=failing)——真机 uname -s 为 HarmonyOS，仅匹配 OHOS 会误走交叉分支；(3) environment.c test_getenv '='-in-key 源码补丁。should_fail 不反转 SIGTRAP，必须用 can_fail + --no-suite=failing。验收：354→34 排除→320 跑 → 312 OK + 3 EF + 5 SKIP + 0 Fail"
  - "打破 cairo/fontconfig tests=false 模式：ADAPTATION_GUIDE Step 3 / TEST_QUALITY_SPEC §3 强制要求 build() 调用上游 meson.test()；conan create 必须有 Ok: N / Fail: 0 / Skipped: M 验收日志"
