# OHOS SDK has libintl.h but no usable ngettext; cmd-pkgs libintl uses g_libintl_* renames.
# Vendored so meson wrap_mode=nodownload can still satisfy dependency('intl').
proxy_libintl:
  # R39: official GitHub URL only — CI injects mirror fallbacks; do not list gh-proxy prefixes.
  url: "https://github.com/frida/proxy-libintl/archive/33934de09af6a6627eb44e310a8079df009abdbb.tar.gz"
  sha256: "4ab5af85ec6124cb526a15c58bbc0877d241807e30855779808dbf9292d861aa"

patches:
  - patch_file: "patches/0002-upstream-test-fixes.patch"
    patch_description: "E215: environment.c test_getenv OHOS '=' 分支 + can_fail: harmonyos（含 utils/utils-c-*/gutils-user-database SIGTRAP、gdbus/AF_UNIX/link/umask/.desktop、utils-isolated、fileutils EROFS 等）+ 少量 should_fail（gtester/pkg-config）"
    patch_type: "portability"
  - patch_file: "patches/0003-journal-stub-harmonyos.patch"
    patch_description: "E091 (R8 revised): compile gjournal-private.c on harmonyos; #else stub _g_fd_is_journal (return 0, no platform macros); disable HAVE_NETLINK on harmonyos; detect getpass via meson cc.has_function → HAVE_GETPASS for gtlsconsoleinteraction.c stub (no __OHOS__/__HARMONYOS__)."
    patch_type: "portability"
