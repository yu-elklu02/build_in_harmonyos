# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: glib/2.84.0.1
homepage: https://gitlab.gnome.org/GNOME/glib

# ADAPTATION_GUIDE Step 3 / TEST_QUALITY_SPEC §3：上游套件在 build() 中跑
# E215 (2026-07-26 CI 回归修订)：build() 始终调用 meson.test()；原生 OHOS/HarmonyOS
# 包装后附 --timeout-multiplier=16 --no-rebuild --no-suite=failing
# (B 类 30s→480s / 60s→960s；OHOS 上 16× 比 4× 更稳)；
# 34 处 can_fail: host_system == 'harmonyos'（含 utils/utils-c-*/gutils-user-database SIGTRAP）
# 覆盖 OHOS 平台限制 / env-only / passwd+LD_PRELOAD；patches/0002 对 environment.c
# test_getenv 加 OHOS '='-in-key 分支源码修复。
# 354 注册测试 → 34 can_fail→failing→--no-suite=failing 排除 → 320 实际运行
# → 312 OK + 3 Expected Fail + 5 Skipped + 0 Fail + 0 Timeout（100% pass 率）。
upstream_check_command: "meson test -C build-release --timeout-multiplier=16 --no-rebuild --no-suite=failing"
upstream_test_in_build: true
upstream_test_command: "meson test -C build-release --timeout-multiplier=16 --no-rebuild --no-suite=failing"

upstream_tests:
  # 完整 354 测试清单见 meson-info/intro-tests.json；此处列代表性 10 个用于追溯。
  # A 类（env-only，1）：utils-isolated → can_fail: harmonyos 排除
  # B 类（timeout，3）：mutex / rwlock / 1bit-mutex → PASS via --timeout-multiplier=16
  # C 类（OHOS 平台限制，32）：gdbus / AF_UNIX / link / umask / .desktop / posix_spawn /
  #   collation + passwd/XDG (utils*) + LD_PRELOAD (gutils-user-database) 等 →
  #   can_fail: harmonyos + --no-suite=failing 排除
  # D 类（真实 bug，2）：environment.c test_getenv（源码补丁）+ fileutils.c mkdir_with_parents
  #   （can_fail: harmonyos 排除；/usr 只读 EROFS 路径不再可达）
  - file: glib-2.84.0/glib/tests/array-test.c
    description: "GArray basic operations"
  - file: glib-2.84.0/glib/tests/environment.c
    description: "g_getenv/g_setenv (E215 D-class OHOS '='-in-key 分支源码修复)"
  - file: glib-2.84.0/glib/tests/fileutils.c
    description: "gfileutils (E215 D-class OHOS /usr 只读 EACCES/EROFS 时 g_test_skip)"
  - file: glib-2.84.0/glib/tests/mutex.c
    description: "GMutex 压力 (B-class, --timeout-multiplier=16)"
  - file: glib-2.84.0/glib/tests/1bit-mutex.c
    description: "emufutex 压力 (B-class, --timeout-multiplier=16)"
  - file: glib-2.84.0/gio/tests/gdbus-peer.c
    description: "gdbus peer-to-peer (E215 can_fail: harmonyos AF_UNIX 抽象命名空间拒绝)"
  - file: glib-2.84.0/gio/tests/testfilemonitor.c
    description: "GFileMonitor (E215 can_fail: harmonyos hard-link() EPERM)"
  - file: glib-2.84.0/gio/tests/live-g-file.c
    description: "GFile live I/O (E215 can_fail: harmonyos)"
  - file: glib-2.84.0/gio/tests/gsubprocess.c
    description: "GSubprocess (E215 can_fail: harmonyos)"
  - file: glib-2.84.0/gio/tests/desktop-app-info.c
    description: "GDesktopAppInfo (E215 can_fail: harmonyos .desktop 解析差异)"

test_package_tests:
  - file: test.c
    description: "g_strdup / g_free + dlopen libglib-2.0.so（消费者 API + 运行期加载）"
    command: "./test_probe"

assertion_count: 2