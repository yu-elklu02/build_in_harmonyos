# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gc/8.2.12
homepage: "https://github.com/ivmai/bdwgc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (CMakeLists.txt build_tests=ON)
upstream_tests:
  - file: tests/test.c
    source: bdwgc-8.2.12/tests/test.c
    description: "gctest — basic GC functionality test"
    command: "./gctest"
  - file: tests/huge_test.c
    source: bdwgc-8.2.12/tests/huge_test.c
    description: "hugetest — large allocation test"
    command: "./hugetest"
  - file: tests/leak_test.c
    source: bdwgc-8.2.12/tests/leak_test.c
    description: "leaktest — leak detection test"
    command: "./leaktest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify GC_Init, GC_malloc, GC_malloc_atomic, GC_gcollect API work correctly"
    command: "./test_gc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
