# conandata.yml for gc 8.2.12 (Boehm-Demers-Weiser GC)
# File location: archives/g/gc/8.2.12/conandata.yml
# This file is the single source of truth for source URL + SHA256 + patches.
# conanfile.py reads this via self.conan_data["sources"] and apply_conandata_patches().

sources:
  url: "https://github.com/ivmai/bdwgc/archive/refs/tags/v8.2.12.tar.gz"
  sha256: "d09001f45dabf1c29a5df3e63020a4bab5ad4aad69137bb07100c717e2ecba0b"

patches:
  # Patch 1: Define GC_NO_PTHREAD_CANCEL under __OHOS__
  # HarmonyOS lacks pthread_cancel and pthread_setcancelstate.
  - patch_file: "patches/0001-include-gc_config_macros.h.patch"
    patch_description: "Define GC_NO_PTHREAD_CANCEL under __OHOS__ (HarmonyOS lacks pthread_cancel)"
    patch_type: "portability"

  # Patch 2: Exclude __OHOS__ from CANCEL_SAFE check
  # CANCEL_SAFE enables pthread_setcancelstate calls which HarmonyOS does not support.
  - patch_file: "patches/0002-include-private-gcconfig.h.patch"
    patch_description: "Exclude __OHOS__ from CANCEL_SAFE check (HarmonyOS lacks pthread_setcancelstate)"
    patch_type: "portability"
