version: "16.0.8"
software: "groonga"
status: built
build_date: "2026-07-31"
build_system: cmake

source:
  url: "https://github.com/groonga/groonga/archive/refs/tags/v16.0.8.tar.gz"
  sha256: "5b3432acc96d8dbd502320ce7817e5c55390cb85078808874a77592b84e413f8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DGRN_WITH_ZLIB=yes"
    - "-DGRN_WITH_LZ4=yes"
    - "-DGRN_WITH_XXHASH=no"
    - "-DGRN_WITH_RAPIDJSON=yes"
    - "-DGRN_WITH_APACHE_ARROW=no"
    - "-DGRN_WITH_ZSTD=no"
    - "-DGRN_WITH_LLAMA=no"
  dependencies:
    - zlib/1.3.1
    - lz4/1.10.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "groonga 是嵌入式全文搜索引擎，基于倒排索引，CMake 构建（上游官方，避开 aclocal/autoreconf CI worker 限制）"
  - "zlib/lz4 使用项目已适配包；xxhash/rapidjson 用 groonga bundled 版本（项目包无 CMake config）"
  - "zstd/llama/apache-arrow 为可选依赖，CI 网络受限或 OHOS 不兼容，全部禁用"
  - "上游测试 test/command/suite 含 4227 个 .test 用例，grntest (Ruby) 框架"
  - "路径 B 知识草稿 E243：grntest Ruby 测试框架依赖链在 OHOS 的完整解决方案（stdckdint.h 补头 + /usr/bin/install 覆盖 + grntest/6 gem 安装 + --interface=http + ELF 签名），见 knowledge/graph/draft/E243-draft-9E1A"
  - "路径 B 知识草稿 E244：Ruby C 扩展 gem（msgpack/json/pycall）在 OHOS musl libc 缺 C23 stdckdint.h 与 /usr/bin/install 的解决方案，见 knowledge/graph/draft/E244-draft-9E1A"

test:
  upstream_cases: 4227
  upstream_suite: "test/command/suite 4227 个 .test 用例（+4222 个 .expected），grntest (Ruby) 框架"
  runnable: 4227
  runnable_note: "本地 OHOS 环境全部实跑（grntest --interface=http + TZ=Asia/Tokyo，groonga 二进制/库/插件签名后，MessagePack 启用 + back trace 归一化 + stdio 用例 HTTP 执行），631s 完成"
  pass: 3373
