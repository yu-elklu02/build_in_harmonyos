sources:
  url: "https://github.com/groonga/groonga/archive/refs/tags/v16.0.8.tar.gz"
  sha256: "5b3432acc96d8dbd502320ce7817e5c55390cb85078808874a77592b84e413f8"

# CI #15556: groonga release tarball 的 vendor/onigmo-source/ 是空目录
# （onigmo 源码通过 git submodule 维护，GitHub tarball 不含），
# CMake 在 vendor/onigmo/CMakeLists.txt:140 找不到 regint.h 等源码。
# source() 阶段下载官方 onigmo 6.2.0 源码注入 vendor/onigmo-source/。
onigmo_source:
  url: "https://github.com/k-takata/Onigmo/releases/download/Onigmo-6.2.0/onigmo-6.2.0.tar.gz"
  sha256: "c648496b5339953b925ebf44b8de356feda8d3428fa07dc1db95bfe2570feb76"

# CI #16365: vendor/rapidjson-1.1.0/ 是 git submodule 空目录（GitHub tarball 不含），
# CMake 走 ExternalProject 下载 github.com/Tencent/rapidjson（CI 网络受限失败）。
# source() 下载官方 rapidjson 1.1.0 注入 vendor/rapidjson-1.1.0/（同 onigmo 方案）。
rapidjson_source:
  url: "https://github.com/Tencent/rapidjson/archive/v1.1.0.tar.gz"
  sha256: "bf7ced29704a1e696fbccf2a2b4ea068e7774fa37f6d7dd4039d0787f8bed98e"

# CI #15673: rapidjson-ep（ExternalProject 子 cmake）在 OHOS 上 CMAKE_SYSTEM_NAME
# 未被识别（UNIX 为假）→ rapidjson 老版 CMakeLists 的 _CMAKE_INSTALL_DIR 未定义 →
# INSTALL(FILES ... DESTINATION "${CMAKE_INSTALL_DIR}") 报 "given no DESTINATION"。
# 补丁给 RAPIDJSON_CMAKE_ARGS 注入 -DCMAKE_SYSTEM_NAME=Linux + 显式 CMAKE_INSTALL_DIR。
patches:
  "16.0.8":
    - patch_file: "patches/0001-rapidjson-cmake-args.patch"
