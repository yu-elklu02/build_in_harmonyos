# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gpgme/1.24.0
homepage: "https://gnupg.org/software/gpgme/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
# 未集成原因: gpgme 测试套件 (tests/gpg, tests/gpgsm, tests/json) 依赖 GnuPG
# 运行时 (gpg/gpgconf/gpgsm/gpg-agent) 来建立测试环境(导入密钥/启动 agent)。
# 该运行时未发布到 ohpcd 制品仓且设备未安装，故无法在 OHOS PC 上执行。
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/t-version.c
    source: gpgme-1.24.0/tests/t-version.c
    description: "版本检查单元测试"
    command: "./t-version"
    result_on_ohos: "PASS"
  - file: tests/t-data.c
    source: gpgme-1.24.0/tests/t-data.c
    description: "数据对象(Data)单元测试"
    command: "./t-data"
    result_on_ohos: "PASS"
  - file: tests/t-engine-info.c
    source: gpgme-1.24.0/tests/t-engine-info.c
    description: "引擎信息查询测试"
    command: "./t-engine-info"
    result_on_ohos: "PASS"
  - file: tests/gpg/t-encrypt.c (等 27 个 gpg 子套件测试)
    source: gpgme-1.24.0/tests/gpg/
    description: "OpenPGP 加解密/签名/密钥管理测试 — 依赖 gpg 运行时"
    command: "make -C tests/gpg check"
    result_on_ohos: "BLOCKED (gpg 二进制不可用, 'GPGME: Invalid crypto engine')"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 gpgme_check_version + gpgme_get_engine_info"
    command: "./test_gpgme"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
