package: gcc/9.5.0
homepage: "https://gcc.gnu.org/gcc-9/"

upstream_check_command: "make -C gcc selftest"
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest && build-time gcc.c-torture/execute subset (50 sources x -O0/-O2 = 100 executions)"

upstream_tests:
  - file: gcc/selftest-run-tests.c
    source: gcc-9.5.0/gcc/selftest-run-tests.c
    description: "GCC language-independent internal selftests"
    command: "make -C gcc selftest"
  - file: gcc/c/c-parser.c
    source: gcc-9.5.0/gcc/c/c-parser.c
    description: "C frontend parser selftests run through -fself-test"
    command: "make -C gcc selftest"
  - file: gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    source: gcc-9.5.0/gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    description: "Upstream execution torture tests: 50 representative sources compiled with the freshly built compiler and executed at -O0 and -O2 (100 runs; validated 100/100 pass on OHOS aarch64)"
    command: "build() torture-execute subset via the xgcc-sign wrapper"

test_package_tests:
  - file: test_gcc.c
    description: "Use packaged GCC to compile, link and execute a real AArch64 C program"
    command: "gcc -O2 -DEXPECT_OHOS=1 test_gcc.c -o gcc_test_program && ./gcc_test_program"

assertion_count: 4
