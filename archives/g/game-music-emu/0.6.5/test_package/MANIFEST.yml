# test_package/MANIFEST.yml — game-music-emu/0.6.5
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: game-music-emu/0.6.5
homepage: "https://github.com/libgme/game-music-emu"

# 上游测试在 build() 阶段的独立目录中运行（静态配置）：
#   ctest --output-on-failure → sanity_test_NSF + check_proper_NSF_output
#   另有 demo_mem（VGZ→zlib）与 demo_multi（多通道 API）冒烟运行。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - "sanity_test_NSF"
  - "check_proper_NSF_output"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: gme_open_data → gme_load_m3u_data → track info → gme_play 非静音输出 → voice count → stereo depth → 清理（上游测试数据以字节数组内嵌，test.nsf SHA-256 与上游 checksums 一致）"
    command: "./gme_test"

upstream_test_count: 2
test_package_test_count: 1
assertion_count: 12
