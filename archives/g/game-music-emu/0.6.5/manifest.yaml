software: game-music-emu
version: "0.6.5"
status: built
build_system: cmake

source:
  url: "https://github.com/libgme/game-music-emu/releases/download/0.6.5/libgme-0.6.5-src.tar.gz"
  sha256: "a133f19278222136ba0d8c27b64a07987ba05fec9d2e6d293ccd8cabdd97ddbb"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DGME_ZLIB=ON"
    - "-DGME_BUILD_EXAMPLES=OFF"
    - "-DGME_BUILD_TESTING=OFF"
  dependencies:
    - "zlib 1.3.2（ohpcd 预编译包，静态 PIC libz.a）"
  test_dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-test-checksums-drop-comment-line.patch"

code_adaptations:
  - "上游测试数据 test/checksums 移除 # 注释行（toybox sha256sum -c 不支持注释，GNU 亦兼容；校验内容原样保留）"

test_results:
  profile: "ohos-aarch64-6.0"
  upstream_framework: "CTest（demo sanity + sha256 输出校验）"
  upstream_passed: 2
  upstream_failed: 0
  test_package_passed: 12
  test_package_failed: 0

test_passed: 14
test_failed: 0

verified:
  target: "OpenHarmony 6.0 aarch64"
  sdk: "6.0"
  compiler: "OHOS Clang 15.0.4"
  date: "2026-08-13"
  evidence: "ctest 2/2 PASS；test_package 12 CHECK 断言 PASS；static/shared 双配置均通过；out.wav 与上游 x86_64 checksum 逐字节一致；demo_mem（VGZ→zlib）与 demo_multi（多通道）冒烟通过"

knowledge_gained:
  - "CMake 4.1.2 下 cmake_minimum_required(3.3...3.10) 实测可配置，无需补丁"
  - "设备 uname -s = HarmonyOS，CMake 原生识别（仅告警无 Platform 模块）"
  - "toybox sha256sum -c 不支持 # 注释行，GNU 支持；测试数据去注释后两种环境通用"
  - "demo 目标是 EXCLUDE_FROM_ALL，须显式 --target demo demo_mem demo_multi"
  - "NSF 时长在 M3U 元数据中；裸 NSF gme_track_info 的 length=-1"
  - "test_package 链接静态库时加 -static 可行，shared 构建必须去掉（ld.lld 报 attempted static link of dynamic object）"
  - "上游 out.wav checksum 在 aarch64/clang15 上逐字节一致，跨架构确定性良好"
  - "CI checkout-pr 用 .diff + git apply 应用 PR，二进制文件（test.nsf）无法通过该管道（missing binary patch data）；测试数据须内嵌为 C 字节数组，用 gme_open_data/gme_load_m3u_data 内存 API"
