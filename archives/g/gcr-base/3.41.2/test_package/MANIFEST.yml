# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gcr-base/3.41.2
homepage: "https://gitlab.gnome.org/GNOME/gcr"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test-secmem.c
    source: gcr-3.41.2/egg/test-secmem.c
    description: "egg 安全内存管理单元测试"
    command: "./egg/test-secmem"

# test_package 中自带的测试 (消费者视角验证)
# R34 反空壳: dlopen libgck-1.so/libgcr-base-3.so + dlsym 解析真实导出符号
# 并实际调用 API（gck_attribute_get_type / gcr_certificate_get_type）
test_package_tests:
  - file: test.c
    description: "dlopen libgck-1.so/libgcr-base-3.so + dlsym 并实际调用 get_type API（R34 反空壳）"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 43
