# test_package/MANIFEST.yml — gcalcli 4.3.0
# Upstream test declaration (R34: test must substantively depend on the tested package)

test_type: import_smoke
upstream_tests:
  - name: "import gcalcli"
    description: "Import the gcalcli package and verify __version__ attribute"
    upstream_command: "python3 -c \"import gcalcli; print(gcalcli.__version__)\""
    adapted_command: "python3 -c \"import gcalcli; print(gcalcli.__version__)\""
    notes: "gcalcli is a Google Calendar CLI that requires OAuth; --version via argparse works without network but import test is more reliable in CI"
