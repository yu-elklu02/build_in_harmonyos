software: gcalcli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3.0"

# 编译状态
# published | built | failed | archived | partial
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================

build_system: "python"

source:
  # 源码下载 URL (PyPI sdist — official source, R39)
  url: "https://files.pythonhosted.org/packages/e8/d9/9d1f03b9b47c3082bf664a2f789a3aded0674dca9e0b894540d754b937cc/gcalcli-4.3.0.tar.gz"

  # 源码校验和
  sha256: "d00081460276027196e8fb957880b29ba4f22ea43136f9e232a9408016abc110"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python

  # 配置选项列表
  configure_options:
    - "setup.py install --prefix=$PACKAGE_FOLDER"

  # Python 包依赖（通过 pip install --no-deps --target 安装到 gcalcli-deps/）
  # 不使用 Conan requires，因为这些是 Python 包而非 C/C++ 库
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python 包使用 setup.py install --prefix= 安装到 Conan 包目录"
  - "Python 依赖通过 pip install --no-deps --target= 安装到 gcalcli-deps/ 目录"
  - "gcalcli 依赖: google-api-python-client, httplib2, oauth2client, parsedatetime, python-dateutil, vobject"
  - "conan-verify G2 (conan create) 通过，test_package import smoke test 通过"
  - "W3 本地 CI 模拟 (setup.sh + build_and_test.sh) 通过"
