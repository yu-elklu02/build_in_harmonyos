software: graphviz
display: "Graphviz"
description: "Graph Visualization Software - open source graph visualization software"
category: data
homepage: "https://graphviz.org/"
license: EPL-1.0
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CMake 构建系统使用相对库路径（../../lib/gvc/libgvc.so），需使用静态链接"
    - "BUILD_SHARED_LIBS=OFF 解决 DT_NEEDED 相对路径问题"
    - "需要添加 -lc++ -lc++abi 链接选项"
  common_dependencies:
    - cmake

# 版本索引
versions:
  "12.2.1":
    status: published
    build_date: "2026-05-21"
    published_as: graphviz
    build_system: cmake
    note: "静态链接（BUILD_SHARED_LIBS=OFF），见上方 key_points"
  "13.1.2":
    status: built
    build_date: "2026-08-04"
    published_as: graphviz
    build_system: autotools
    note: >-
      与 12.2.1 走的是不同路子：autotools + 动态库。
      graphviz 的插件架构靠 dlopen 加载 libgvplugin_*.so，静态链接会让插件机制失效，
      因此不能沿用 12.2.1 的 BUILD_SHARED_LIBS=OFF 规避法；
      DT_NEEDED 相对路径问题改由 SONAME 与 conan 的 libdirs 解决。
      package() 后置执行 `bin/dot -c` 生成插件索引 config8，缺它则全部插件 dlopen 失效。
