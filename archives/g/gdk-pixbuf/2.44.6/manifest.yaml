software: gdk-pixbuf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.44.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.44.6"

status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-31"
conan_ref: "gdk-pixbuf/2.44.6"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnome.org/pub/gnome/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.6.tar.xz"

  # 源码校验和
  sha256: "140c2d0b899fcf853ee92b26373c9dc228dbcde0820a4246693f4328a27466fa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Dpng=enabled"
    - "-Djpeg=enabled"
    - "-Dtiff=enabled"
    - "-Dgif=enabled"
    - "-Dbuiltin_loaders=all"
    - "-Dgio_sniffing=false"
    - "-Dtests=true"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.84.0.1"
    - "libpng/1.6.58"
    - "libjpeg-turbo/3.2.0"
    - "libtiff/4.7.2"
    - "zlib/1.3.1.1"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "加载器内置可消除 loaders.cache 的绝对路径并简化鸿蒙 ELF 签名"
  - "GLib 生成器需从 Conan 包暂存并补齐 pkg-config 工具变量与 libintl 链接"
  - "OHOS Meson 构建缺失共享库别名时需复制生成 SONAME 与链接名后再继续构建"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
