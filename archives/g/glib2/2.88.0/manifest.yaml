version: "2.88.0"
status: built
build_date: "2026-07-17"

source:
  url: "https://download.gnome.org/sources/glib/2.88/glib-2.88.0.tar.xz"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "default_library=static"
    - "libmount=disabled"
    - "selinux=disabled"
    - "nls=disabled"
    - "introspection=disabled"
    - "tests=true"
    - "installed_tests=false"
  cc: clang

patches_applied:
  - "0001-add-harmonyos-host-support.patch: 将 host_system=='linux' 的判定扩展到 harmonyos（鸿蒙内核兼容 Linux 接口）"
  - "0002-disable-netlink-for-harmonyos.patch: 鸿蒙不开放 netlink，禁用 HAVE_NETLINK 与 netlink 网络监视器"
  - "0003-find-pcre2-via-conan-pkg-config.patch: 让 glib 识别 Conan 打包的 pcre2（pc 名 pcre2 而非 libpcre2-8）"
  - "0004-demote-werror-format-for-musl.patch: musl 的 gettext 缺 __attribute_format_arg，-Werror=format=2 误伤 _() 包裹的格式串，降级为警告"
  - "0005-build-libffi-via-subproject-fallback.patch: libffi 不在 OHOS 制品仓，让 glib 用自带 subprojects/libffi.wrap 子项目从源码构建"
  - "0006-run-visibility-generator-via-python.patch: run gen-visibility-macros.py through Meson's Python interpreter on HarmonyOS"
  - "0007-run-upstream-tests-on-harmonyos.patch: enable upstream Meson tests and mark HarmonyOS-only unsupported cases"
  - "0008-detect-getpass-for-tests.patch: detect getpass before building GIO TLS console tests"
  - "0009-mark-remaining-harmonyos-test-gaps.patch: mark remaining HarmonyOS platform/tooling test gaps"

dependencies:
  - "pcre2/10.45"
  - "zlib/1.3.1"
  - "libffi（meson 子项目 subprojects/libffi.wrap，源码构建）"

knowledge_gained:
  - "2026-08-04 issue #1790: direct HarmonyOS PC CI passed after routing gen-visibility-macros.py through Meson's Python interpreter; L0/L1/L2/L4/L5 pass."
  - "2026-08-05 issue #1790: true-device single-package CI ran upstream Meson tests in build phase: 303 OK, 0 Fail, 6 Skipped; executed-test pass rate 303/303 = 100%."
  - "The old container-only test note is obsolete and must not be used as PR validation evidence."
  - "glib 2.88 用 meson ≥ 1.4；OHOS profile 自动把 OHOS 映射为 meson host_system='harmonyos'"
  - "gio-launch-desktop.c 调用 _g_fd_is_journal（定义于 gjournal-private.c），后者仅在 host_system=='linux' 编译——harmonyos 不补丁会链接失败"
  - "HAVE_NETLINK 由 <linux/netlink.h> 头存在性决定，与 host_system 无关；鸿蒙需显式关闭以避开 netlink 与 sockaddr_storage 冲突"
  - "Conan 的 pcre2 包 pkg-config 名为 pcre2，glib 上游找 libpcre2-8，需补丁兼容"
