    - "https://download.gnome.org/sources/glib/2.88/glib-2.88.0.tar.xz"
    - "https://ftp.gnome.org/pub/gnome/sources/glib/2.88/glib-2.88.0.tar.xz"
  sha256: "3546251ccbb3744d4bc4eb48354540e1f6200846572bab68e3a2b7b2b64dfd07"

# libffi is not published in the OHOS conan registry, so glib builds it from
# source as a meson subproject. These populate subprojects/libffi-3.5.2/ in
# source(); meson then builds libffi offline (no wrap download). The source URL
# uses the `url:` key form so CI's mirror fallback rewrites the github URL to a
# mirror list (CI workers can't reach github.com directly). wrapdb (patch) is
# reachable and left single-valued.
libffi_subproject:
  source:
    url: "https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz"
    sha256: "f3a3082a23b37c293a4fcd1053147b371f2ff91fa7ea1b2a52e335676bac82dc"
  patch:
    # Direct github release URL (wrapdb.mesonbuild.com only redirects here and
    # is itself unreachable on CI). Ends in .zip so conan get() extracts it;
    # github host -> CI mirror fallback rewrites it to a mirror list.
    url: "https://github.com/mesonbuild/wrapdb/releases/download/libffi_3.5.2-1/libffi_3.5.2-1_patch.zip"
    sha256: "1ee3035d92e4df3541d0b2b8d192d2fa183b46e4a3d68c00d8f71ede354bee74"

# glib unconditionally requires gettext/intl ("We require gettext to always be
# present", meson.build:2360); musl has no gettext, so it falls back to the
# proxy-libintl subproject. Vendor it (like libffi) so wrap_mode=nodownload works.
proxy_libintl:
  source:
    url: "https://github.com/frida/proxy-libintl/archive/refs/tags/0.5.tar.gz"
    sha256: "f7a1cbd7579baaf575c66f9d99fb6295e9b0684a28b095967cfda17857595303"

