# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# glib 2.88.0 上游测试基于 meson + gtester（TAP），测试可执行位于
# glib/tests、gobject/tests、gio/tests、gmodule/tests、tests/。
# 上游测试仅在本地容器实测取数（见 PR 正文"补充说明"），未接入 CI 门禁。

package: glib2/2.88.0
homepage: https://gitlab.gnome.org/GNOME/glib

# 上游测试命令
upstream_check_command: "meson test"

# conanfile.py build() 中未集成上游测试（本地实测，未接 CI 门禁）
upstream_test_in_build: false
upstream_test_command: "meson test"

# 代表性上游测试（完整列表见 notes.md 与 PR 正文）
upstream_tests:
  - file: glib/tests/atomic.c
    source: glib-2.88.0.tar.xz/glib/tests/atomic.c
    description: "glib 原子操作测试"
    command: "meson test glib:atomic"
  - file: glib/tests/string.c
    source: glib-2.88.0.tar.xz/glib/tests/string.c
    description: "glib 字符串工具测试"
    command: "meson test glib:string"
  - file: gobject/tests/reference.c
    source: glib-2.88.0.tar.xz/gobject/tests/reference.c
    description: "GObject 引用计数测试"
    command: "meson test gobject:references"

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test_glib.c
    description: "glib 字符串/哈希表 + GVariant + GObject 类型系统冒烟"
    command: "./test_glib2"

# 通过的 meson 测试数（保守下界；每个测试含多个子断言，实际更高）
assertion_count: 314
