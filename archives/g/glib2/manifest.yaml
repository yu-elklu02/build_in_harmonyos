software: glib2
display: "glib2"
description: "GNOME core C utility library — glib/gobject/gio/gmodule/gthread"
category: core
homepage: "https://gitlab.gnome.org/GNOME/glib"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson ≥ 1.4 构建；OHOS profile 自动映射 host_system 为 harmonyos"
    - "host_system=='linux' 分支需扩展到 harmonyos（gio-launch-desktop 链接依赖 gjournal-private.c）"
    - "鸿蒙不开放 netlink，需禁用 HAVE_NETLINK 与 netlink 网络监视器"
    - "libmount/selinux/nls/introspection 在鸿蒙工具链缺失，配方中 disable"
    - "pcre2 经 Conan 提供（pc 名 pcre2），上游找 libpcre2-8，需兼容补丁"
  common_dependencies:
    - "pcre2"
    - "zlib"
    - "libffi（meson 子项目源码构建）"

versions:
  "2.88.0":
    status: built
    build_date: "2026-07-17"
