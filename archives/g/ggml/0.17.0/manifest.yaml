    - include/ggml.h
    - include/ggml-cpu.h
  pkg_config: ggml.pc
  cmake_package: lib/cmake/ggml

tests:
  test_package: test_ggml.cpp
  assertions: 4
  behavior: "Create tensors, run CPU addition, and validate four output values"
