software: ggml
version: "0.17.0"
build_system: cmake
status: built
build_date: "2026-07-18"

source:
  url: "https://github.com/ggerganov/ggml/archive/9be313313c8ecb9488911bd64550190e3ed80f38.tar.gz"
  sha256: "03c5315d5502a98c49900f868a6b4d75fe2097d8851131bb0fa02cdbaf683d20"

build:
  options:
    shared: true
    openmp: false
    ggml_native: false
    ggml_build_tests: false
    ggml_build_examples: false
  dependencies: []
  libraries:
    - ggml
    - ggml-cpu
    - ggml-base
