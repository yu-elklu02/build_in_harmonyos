software: gdbm
display: "GDBM"
description: "GNU 数据库管理器，轻量级键值对数据库（Python _gdbm 模块的依赖）"
category: db
homepage: "https://www.gnu.org/software/gdbm/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "标准 autotools，打 config.guess/config.sub 补丁即可编译"
    - "推荐 --disable-nls 避免 libintl 依赖"
    - "必须使用 -fPIC，静态库链接到共享库时必需"
    - "gdbm_open 路径不能使用 /tmp（HMDFS），需用 $TMPDIR"
    - "--enable-libgdbm-compat 提供 dbm/ndbm 兼容接口"
  common_dependencies: []

versions:
  "1.23":
    status: published
    build_date: "2026-04-12"
  "1.24":
    packaging: conan
    status: built
    build_date: "2026-08-07"
    notes: >-
      首个 conan 配方（原 1.23 条目是手工构建时代的记录，无 conanfile.py）。
      未打补丁。设备上没有 makeinfo，故传 MAKEINFO=true 跳过 texinfo 文档构建（文档不进制品）；
      另关 libgdbm_compat（老 dbm/ndbm 接口，panda3d 用不到）与 readline（避免循环依赖）。
      真机 conan create 通过；test_package 真建库文件，验存取往返/INSERT 拒覆盖/REPLACE/遍历/
      删除/错误路径，并**关闭后重开复验数据真的落盘** —— 只在内存里对不算数，共 7 组断言。
