package: gtk-mac-integration/3.0.2
homepage: https://gitlab.gnome.org/GNOME/gtk-mac-integration
upstream_check_command: "make -C docs/reference check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: docs/reference/Makefile.am
    source: gtk-mac-integration-3.0.2/docs/reference/Makefile.am
    description: "gtk-doc documentation validation; host-tool-only and not an OHOS functional test"
    command: "$(GTKDOC_CHECK)"
    status: not_applicable
    exclusion_reason: "Requires gtk-doc host tools and validates generated documentation rather than the target library"
test_package_tests:
  - file: test_package.c
    description: "Validate singleton state, lifecycle signals, GLib/GObject linkage, attention requests, and HarmonyOS bundle paths"
    command: "./test_package"
assertion_count: 11
