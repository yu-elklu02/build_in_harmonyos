# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gtest/1.17.0
homepage: https://github.com/google/googletest

# gtest 自带完整测试套件（gtest_build_tests + gmock_build_tests=ON）
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游测试：googletest + googlemock 编译出的 65 个测试二进制
# （对应 97 个测试源文件，数千 TEST 用例），OHOS 真机实跑 59/65 通过，
# 6 个未通过为框架特定编译配置/场景要求（详见 PR_DESCRIPTION.md）
upstream_tests:
  - file: build/Release/googletest/*_test*
    description: "googletest 上游测试二进制（约 43 个），真机实跑"
    command: "./gtest_unittest"
  - file: build/Release/googlemock/*_test*
    description: "googlemock 上游测试二进制（约 22 个），真机实跑"
    command: "./gmock_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "gtest 消费者测试：TEST(SmokeTest, Add) 1+1=2 + TEST(SmokeTest, StringEq) 字符串相等"
    command: "./test_gtest"
assertion_count: 2