name: givaro
description: C++ 计算代数库（有限域 / 环 / 多项式等代数结构）
category: math
license: CeCILL-B
website: https://github.com/linbox-team/givaro
source_url: https://github.com/linbox-team/givaro/releases
build_system: autotools
versions:
  - version: "4.2.1"
    status: built
    build_date: "2026-08-12"
    notes: >-
      fflas-ffpack / linbox / SageMath / passagemath 计算代数栈的核心依赖。
      必须依赖开了 --enable-cxx 的 gmp/6.3.0.1：givaro 探测的是 GMP 的 C++ 接口
      (gmpxx.h / libgmpxx)，仓里原有的 gmp/6.3.0 未开 cxx，直接
      "configure: error: GMP not found/usable!"。
      test_package 做真实计算断言（GF(7) 加/乘/逆 + 大整数乘法）。
