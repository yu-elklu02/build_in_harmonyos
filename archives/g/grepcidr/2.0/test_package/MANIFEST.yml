# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: grepcidr/2.0
homepage: "https://www.pc-tools.net/unix/grepcidr/"

# grepcidr has no test suite; tested via functional usage
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 grepcidr -V 验证二进制可执行且显示版本信息"
    command: "grepcidr -V"
  - file: conanfile.py
    description: "通过管道输入 IP 地址验证 CIDR 匹配功能"
    command: 'echo "192.168.1.1" | grepcidr 192.168.0.0/16'

# 测试断言总数
assertion_count: 2
