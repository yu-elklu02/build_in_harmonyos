# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: glm/0.9.9.8
homepage: "https://github.com/g-truc/glm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/core/core_type_vec4.cpp
    source: glm/test/core/core_type_vec4.cpp
    description: "GLM core vec4 type test"
    command: "./test-core_type_vec4"
  - file: test/core/core_type_mat4x4.cpp
    source: glm/test/core/core_type_mat4x4.cpp
    description: "GLM core mat4x4 type test"
    command: "./test-core_type_mat4x4"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: vec4/mat4/matrix_transform API 验证"
    command: "./test_glm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
