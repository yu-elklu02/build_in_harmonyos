# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: git-flow/1.12.3
homepage: "https://github.com/petervanderdoes/gitflow-avh"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# git-flow 是纯 Shell 脚本项目，上游无 make check 测试套件
upstream_tests:
  - file: test.sh
    source: git-flow-avh-1.12.3/test_package/test.sh
    description: "Smoke test: git-flow version verification"
    command: "git-flow version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: git-flow version 输出验证"
    command: "sh test.sh"
  - file: conanfile.py (inline test)
    description: "消费者测试: git-flow version 功能验证"
    command: "conan test (git-flow version)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
