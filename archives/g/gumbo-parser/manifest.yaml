software: gumbo-parser
display: "gumbo-parser"
description: "Google 的纯 C99 HTML5 解析库"
category: data
homepage: "https://github.com/google/gumbo-parser"
license: Apache-2.0
build_system: direct-clang

ohos_adaptation:
  key_points:
    - "配方直接使用 Conan profile 中的 clang/clang++/llvm-ar 编译，不依赖 Autotools 或 Meson"
    - "上游 GoogleTest 子模块不在官方 tag 归档中，构建时补齐官方 GoogleTest release-1.6.0 并校验 SHA-256"
    - "旧版 GoogleTest 在 OHOS libc++ 缺少 tr1/tuple，测试编译用 -DGTEST_USE_OWN_TR1_TUPLE=1 兼容"
    - "Conan 元数据暴露 gumbo::gumbo 和 pkg-config gumbo"
  common_dependencies: []

versions:
  "0.10.1":
    status: built
    build_date: "2026-07-23"
    conan_ref: "gumbo-parser/0.10.1"
