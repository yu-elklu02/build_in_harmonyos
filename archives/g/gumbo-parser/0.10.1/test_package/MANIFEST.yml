package: gumbo-parser/0.10.1
homepage: "https://github.com/google/gumbo-parser"

upstream_check_command: "gumbo_test --gtest_color=no"
upstream_test_in_build: true
upstream_test_command: "gumbo_test --gtest_color=no"
upstream_tests:
  - file: "tests/*.cc"
    source: "gumbo-parser-0.10.1/tests/*.cc"
    description: "GoogleTest parser, tokenizer, UTF-8, string, vector, and attribute suites"
    command: "gumbo_test --gtest_color=no"
    count: 172
    dependency: "GoogleTest release-1.6.0, fetched from the official Google GitHub release archive"

test_package_tests:
  - file: test.c
    description: >
      Consumer test calls gumbo_parse, validates the generated html/body/h1/text
      tree, and releases it with gumbo_destroy_output.
    command: "./test_gumbo_parser"
    count: 1
    assertions: 5
