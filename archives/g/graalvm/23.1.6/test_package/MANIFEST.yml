# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: graalvm/23.1.6
homepage: "https://github.com/oracle/graal"

# GraalVM SDK 是预构建 Java JAR，上游无 make check / ctest 等构建系统测试
# 上游验证来源: Maven Central 发布
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游审计：确认 oracle/graal 仓库 sdk/ 目录无 C/C++ 测试套件
# 审计结论：GraalVM SDK 是纯 Java 模块，构建系统为 mx (Java)，无 make check/ctest/gtest/autotools
upstream_tests_exist: false
upstream_test_audit: |
  审计上游 oracle/graal sdk/ 目录（tag vm-23.1.5 最接近 23.1.6）：
  1. 目录结构：sdk/ 包含 Java 源码（.java），无 C/C++ 源文件
  2. 构建系统：使用 mx（Java 构建工具），无 CMakeLists.txt / Makefile / configure
  3. 测试框架：上游测试通过 mx unittest 运行 Java 测试，不包含 C/C++ 测试套件
  4. 发布包：Maven Central 发布的 JAR 为 Java 库，无可执行测试程序
  结论：GraalVM SDK 无 C/C++ 测试套件

# 预构建 JAR 包，无源码级测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 JAR 文件存在且有效 (ZIP 格式校验)"
    command: "conan test"

# 测试断言总数 (JAR 存在 + 非空 + ZIP 格式 = 3 个断言)
assertion_count: 3