software: graalvm
display: "GraalVM"
description: >-
  Versioned GraalVM SDK and headless Community JDK/Native Image packages for
  OpenHarmony PC
category: build-tool
homepage: "https://www.graalvm.org/"
license: >-
  UPL-1.0 AND GPL-2.0-with-Classpath-exception AND NCSA AND Zlib
build_system: custom

ohos_adaptation:
  key_points:
    - "Materialize the official archive links before packaging on HMDFS"
    - "Rewrite fixed GNU loader and SONAME strings to OpenHarmony ABI names"
    - "Build and package private gcompat and zlib compatibility libraries"
    - "Self-sign every packaged ELF and every Native Image output"
    - "Keep a documented headless runtime boundary"
  common_dependencies:
    - freetype

versions:
  "23.1.6":
    status: built
    build_date: "2026-07-31"
    conan_ref: "graalvm/23.1.6"
  "25.0.3":
    status: built
    build_date: "2026-08-01"
    conan_ref: "graalvm/25.0.3"
