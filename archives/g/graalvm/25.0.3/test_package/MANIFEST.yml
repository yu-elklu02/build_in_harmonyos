package: graalvm/25.0.3
homepage: "https://www.graalvm.org/"

upstream_check_command: "not shipped in the official binary distribution"
upstream_test_in_build: false
upstream_test_command: "not applicable"

upstream_tests: []
upstream_test_audit:
  artifact: "graalvm-community-jdk-25i1-25.0.3_linux-aarch64_bin.tar.gz"
  file_count: 648
  test_entry_count: 0
  conclusion: >-
    The official binary distribution contains the built JDK, jmods, legal
    notices, and Native Image tooling, but no runnable upstream test harness.

test_package_tests:
  - file: GraalSmoke.java
    description: "Compile and execute one Java class with javac and java"
    command: "javac GraalSmoke.java && java GraalSmoke"
    count: 1
  - file: HeadlessSmoke.java
    description: >-
      Load the font manager through freetype/2.14.3 and exercise headless AWT
      through the packaged HarmonyOS logical-font configuration without a
      sun.awt.fontconfig override or JVM environment-option injection
    command: "java -Djava.awt.headless=true HeadlessSmoke"
    count: 1
  - file: validate_adaptation_report.py
    description: >-
      Validate the exact libfontmanager-to-libawt_headless DT_NEEDED edge, the
      structured 18-symbol provider closure, java.desktop ownership of native
      library loading, and exact HarmonyOS system-font mappings
    command: >-
      validate_adaptation_report.py ohos-adaptation.json libfontmanager.so ...
    count: 1
  - file: FontManagerLoadSmoke.java
    description: >-
      Load libfontmanager in an isolated JVM with eager binding, then exit
      before the separate headless rendering JVM starts
    command: >-
      java FontManagerLoadSmoke "$JAVA_HOME/lib/libfontmanager.so"
    count: 1
  - file: GraalSmoke.java
    description: "Create, list, and execute an application JAR"
    command: "jar --create ... && java -jar graal-smoke.jar"
    count: 1
  - file: test.sh
    description: >-
      Read exact GraalVM and native-image version identities through both
      signed AArch64 PIE launchers, including alias-safe companion discovery,
      fixed-path isolated Python startup, PATH-injection resistance, exact
      missing-companion failure, and empty launcher RPATHs
    command: "java -version && native-image --version"
    count: 1
  - file: GraalSmoke.java
    description: >-
      Build through the packaged wrapper, validate final ELF closure, and
      execute an aarch64 native image without LD_LIBRARY_PATH. Validate both
      signed native launchers, aliases, exact argv forwarding, environment
      sanitization, ordinary and signal exit codes, HUP/INT/TERM forwarding,
      private scratch cleanup, pre-existing scratch paths, and concurrent lock
      serialization. Reject
      touch-only and symbolic-link targets, reserved scratch/lock/sidecar
      destinations, and concurrent destination replacement. Build into a
      same-filesystem private staging directory and atomically publish or
      exchange the destination only after rewrite, signing, and validation.
    command: >-
      native-image -O0 --no-fallback -cp classes GraalSmoke -o graal-smoke
      && ./graal-smoke
    count: 1
  - file: native_image_transaction_test.py
    description: >-
      Inject HUP, INT, and TERM deterministically during staging-directory
      creation, libg.so publication, and immediately before and after target
      exchange. Inject a non-signal directory-fsync failure immediately after
      commit for both new and pre-existing outputs, concurrent destination
      replacement before rollback and inside the rollback check-to-rename
      window, and output-stage/scratch replacement before cleanup. Verify exact
      pre-commit signal exits, durable post-commit success, compare-and-swap
      rejection, old-output restoration, new-output removal, libg.so rollback,
      existing-libg.so replacement rejection, metadata-preserving rollback,
      signed-output exchange identity preservation, preservation of third-party
      output identity, recoverable old-output stages, cleanup identity binding,
      lock release, and zero unowned transaction residue.
    command: >-
      python3 native_image_transaction_test.py native-image.py transaction-work
    count: 1
  - file: compat_smoke.c
    description: >-
      Exercise gcompat passwd/group parsing, the glibc ctype table contract,
      live __environ aliasing after setenv/unsetenv, and dlinfo link-map
      namespace queries through the packaged libg.so. Verify that libg.so does
      not define the loader-owned __environ object.
    command: "clang compat_smoke.c -l:libg.so && ./compat-smoke"
    count: 1

test_case_count: 9
upstream_case_count: 0
consumer_flow_count: 9
assertion_count: 504
