software: graalvm
version: "25.0.3"
status: built
build_date: "2026-08-01"
build_system: custom
conan_ref: "graalvm/25.0.3"

source:
  url: >-
    https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.1.3/graalvm-community-jdk-25i1-25.0.3_linux-aarch64_bin.tar.gz
  sha256: "5e79978983439d28506ebef82254fe9f98995121208dc8be77c604f4ad5bc579"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "gcompat: make -j1 libg.so WITH_OBSTACK=no WITH_LIBUCONTEXT="
    - "zlib: ./configure --static && make -j1 libz.a test"
    - "GraalVM: materialize links, rewrite ELF ABI names, and self-sign"
  dependencies:
    - freetype/2.14.3
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-gcompat-ohos-abi.patch"

knowledge_gained:
  - >-
    Equal-or-shorter in-place ELF string rewriting preserves offsets while
    replacing the fixed GNU loader and dependency identities.
  - >-
    Native Image output must be finalized atomically, self-signed, and shipped
    with the exact private libg.so used by the packaged JDK.
  - >-
    The supported OpenHarmony boundary is headless AWT with freetype; X11,
    JAWT, sound, splash, and jconsole are excluded.
