package: gti/1.9.1.1
homepage: "https://github.com/rwos/gti"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_shells:
  Linux: /bin/sh
  OHOS: /data/service/hnp/bin/bash
command_note: "Replace {shell} with the platform entry above; conanfile.py performs this substitution."

test_package_tests:
  - file: test_gti.sh
    id: A1
    description: "Verify GIT overrides the launched executable and forwards --version."
    command: "{shell} test_gti.sh ./bin/gti {shell} A1"
  - file: test_gti.sh
    id: A2
    description: "Verify push and multiple arguments, including an argument with spaces, are preserved."
    command: "{shell} test_gti.sh ./bin/gti {shell} A2"
  - file: test_gti.sh
    id: A3
    description: "Verify gti finds git through PATH when GIT is unset."
    command: "{shell} test_gti.sh ./bin/gti {shell} A3"
  - file: test_gti.sh
    id: A4
    description: "Verify gti propagates the launched git process exit status."
    command: "{shell} test_gti.sh ./bin/gti {shell} A4"
  - file: test_gti.sh
    id: A5
    description: "Verify gti fails when neither GIT nor a git executable is available."
    command: "{shell} test_gti.sh ./bin/gti {shell} A5"

test_package_test_count: 5
assertion_count: 21
