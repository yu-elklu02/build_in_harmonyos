# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: gpsd/3.26
homepage: "https://gpsd.io/"

# 上游测试命令
upstream_check_command: "scons check"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/ + tests/ 目录)
upstream_tests:
  - file: test_bits.c
    source: gpsd-3.26/tests/test_bits.c
    description: "位运算测试"
    command: "./test_bits"
  - file: test_float.c
    source: gpsd-3.26/tests/test_float.c
    description: "浮点运算测试"
    command: "./test_float"
  - file: test_geoid.c
    source: gpsd-3.26/tests/test_geoid.c
    description: "大地水准面测试"
    command: "./test_geoid"
  - file: test_json.c
    source: gpsd-3.26/tests/test_json.c
    description: "JSON 解析测试"
    command: "./test_json"
  - file: test_libgps.c
    source: gpsd-3.26/tests/test_libgps.c
    description: "libgps 客户端库测试"
    command: "./test_libgps"
  - file: test_matrix.c
    source: gpsd-3.26/tests/test_matrix.c
    description: "矩阵运算测试"
    command: "./test_matrix"
  - file: test_mktime.c
    source: gpsd-3.26/tests/test_mktime.c
    description: "时间转换测试"
    command: "./test_mktime"
  - file: test_packet.c
    source: gpsd-3.26/tests/test_packet.c
    description: "数据包解析测试"
    command: "./test_packet"
  - file: test_timespec.c
    source: gpsd-3.26/tests/test_timespec.c
    description: "时间规格测试"
    command: "./test_timespec"
  - file: test_trig.c
    source: gpsd-3.26/tests/test_trig.c
    description: "三角函数测试"
    command: "./test_trig"
  - file: test_gpsmm.cpp
    source: gpsd-3.26/tests/test_gpsmm.cpp
    description: "C++ 绑定测试"
    command: "./test_gpsmm"
  - file: test_clienthelpers.py
    source: gpsd-3.26/tests/test_clienthelpers.py
    description: "客户端辅助函数测试"
    command: "python3 test_clienthelpers.py"
  - file: test_misc.py
    source: gpsd-3.26/tests/test_misc.py
    description: "杂项测试"
    command: "python3 test_misc.py"
  - file: test_xgps_deps.py
    source: gpsd-3.26/tests/test_xgps_deps.py
    description: "xgps 依赖测试"
    command: "python3 test_xgps_deps.py"
  - file: test_gpsdclient.c
    source: gpsd-3.26/tests/test_gpsdclient.c
    description: "gpsd 客户端测试"
    command: "./test_gpsdclient"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "gpsd 二进制可用性验证 (--version)"
    command: "./test_gpsd"

# 测试断言总数
assertion_count: 3