# test_package/MANIFEST.yml

package: doctest/2.5.2
homepage: "https://github.com/doctest/doctest"

# 上游测试套件仅编译验证，不执行（all_features 含故意失败用例）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试文件列表（examples/all_features/）
upstream_tests:
  - file: alternative_macros.cpp
    description: "alternative assertion macros"
  - file: assertion_macros.cpp
    description: "assertion macros (CHECK/REQUIRE/etc)"
  - file: stringification.cpp
    description: "stringification of types"
  - file: double_stringification.cpp
    description: "double stringification"
  - file: reporters_and_listeners.cpp
    description: "reporters and listeners"
  - file: subcases.cpp
    description: "subcases"
  - file: logging.cpp
    description: "logging macros"
  - file: templated_test_cases.cpp
    description: "templated test cases"
  - file: test_cases_and_suites.cpp
    description: "test cases and suites"
  - file: asserts_used_outside_of_tests.cpp
    description: "asserts outside testing context"
  - file: enums.cpp
    description: "enum support"
  - file: generators.cpp
    description: "generators"
  - file: concurrency.cpp
    description: "thread-safe assertions"
  - file: coverage_maxout.cpp
    description: "max coverage"
  - file: no_failures.cpp
    description: "no failures scenario"
  - file: namespace1.cpp
    description: "namespace test 1"
  - file: namespace2.cpp
    description: "namespace test 2"
  - file: namespace3.cpp
    description: "namespace test 3"
  - file: namespace4.cpp
    description: "namespace test 4"
  - file: namespace5.cpp
    description: "namespace test 5"
  - file: namespace6.cpp
    description: "namespace test 6"
  - file: namespace7.cpp
    description: "namespace test 7"
  - file: namespace8.cpp
    description: "namespace test 8"
  - file: namespace9.cpp
    description: "namespace test 9"
  - file: bitfield_packed_struct.cpp
    description: "bitfield packed struct"
  - file: bitfields.cpp
    description: "bitfields"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "验证 doctest 头文件包含和基本宏可用"
    command: "./test_doctest"

# 测试断言总数（仅 test_package 2 个，上游仅编译不执行）
assertion_count: 2
