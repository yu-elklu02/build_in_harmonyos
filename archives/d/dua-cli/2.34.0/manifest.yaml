knowledge_gained:
  - "Rust 1.97.1 (Harmonybrew) 可在 OpenHarmony 上正常编译 Rust 项目，解决了之前 rustc SIGSEGV 的问题"
  - "cargo build 需要 CC=clang 环境变量来找到 C 链接器"
  - "Rust 项目在 OHOS 上的 Conan 配方使用 package_type=application，通过 cargo build --release 构建"
  - "Harmonybrew 提供的 Rust 工具链生成的二进制为动态链接 musl，在 OpenHarmony 上可正常运行"
