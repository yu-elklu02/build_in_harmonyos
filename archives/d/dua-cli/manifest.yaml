software: dua-cli
display: "Dua CLI"
description: "A tool to conveniently learn about the disk usage of directories, fast!"
category: system
homepage: "https://github.com/Byron/dua-cli"
license: MIT
build_system: cargo

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Rust 1.97.1 (Harmonybrew) 可在 OpenHarmony 上正常编译 Rust 项目"
    - "cargo build 需要 CC=clang 环境变量来找到 C 链接器"
    - "Harmonybrew Rust 生成的二进制为动态链接 musl，在 OpenHarmony 上可正常运行"
    - "Conan 配方中使用 package_type=application，build() 方法自动检测并安装 Rust 工具链"
  common_dependencies: []

# 版本索引
versions:
  "2.34.0":
    status: published
    build_date: "2026-08-06"
