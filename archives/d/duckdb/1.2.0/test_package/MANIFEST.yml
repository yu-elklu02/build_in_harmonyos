# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: duckdb/1.2.0
homepage: "https://duckdb.org"

# 上游测试命令
upstream_check_command: "./build/release/test/unittest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/unittest
    source: duckdb-1.2.0/test/unittest
    description: "DuckDB built-in unit test suite (sqllogictest + API tests)"
    command: "./build/release/test/unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: open DB, create table, insert, query, verify results"
    command: "./test_duckdb"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
