software: duckdb

# 版本号
version: "1.2.0"

# 编译状态
status: built

# 编译日期
build_date: "2026-08-06"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/duckdb/duckdb/archive/refs/tags/v1.2.0.tar.gz"
  sha256: "f22c97e18c071fa8e43b5e150c03c6ab4bcc510cca6e6b50cbe13af8535fa701"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "Use Ninja generator instead of Unix Makefiles to avoid try-compile detection issues on HarmonyOS"
  - "Set CMAKE_BUILD_WITH_INSTALL_RPATH=ON for proper RPATH handling"
  - "DuckDB bundles all third-party dependencies, no external Conan requires needed"
