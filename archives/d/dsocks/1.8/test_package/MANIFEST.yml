# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dsocks/1.8
homepage: "http://monkey.org/~dugsong/dsocks/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "N/A (dsocks has no make check target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "Verify dsocks library is loadable via dlopen and exports _dsocks_init symbol"
    command: "./test_dsocks"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
