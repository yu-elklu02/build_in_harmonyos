software: dsocks
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/dsocks/dsocks-1.8.tar.gz"

  # 源码校验和
  sha256: "2b57fb487633f6d8b002f7fe1755480ae864c5e854e88b619329d9f51c980f1d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "make -f GNUMakefile"
    - "CC=clang"
    - "CFLAGS=-fPIC -O2 -Wall -g"
    - "LDFLAGS=-shared -Wl,--version-script,libdsocks.map"
    - "LDLIBS=-ldl -lresolv"
    - "LIBDIR=/usr/local/lib"
    - "BINDIR=/usr/local/bin"
    - "DESTDIR=$TEST_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony/musl 使用 libc.so（非 libc.so.6），dsocks.h DSOCKS_PATH_LIBC 使用 __GLIBC__ 守卫，非 glibc 落入 else 分支"
  - "musl 提供 strlcpy()，不需要单独 strlcpy.c；dsocks.c 的 strlcpy 声明守卫改为 __GLIBC__"
  - "musl netdb.h 不定义 NETDB_SUCCESS，需手动定义为 0"
  - "GNUMakefile --shared 应改为 -shared（clang/lld 语法）"
  - "dsocks 包装脚本需适配 OHOS 平台的库路径"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/dsocks-1.8.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/dsocks-1.8.work
  source_orig_hash: 9c3b75682ba899b3
  source_work_hash: 5daa981b5fd725c0
  generated_at: '2026-06-17T14:21:25'
  patches_count: 5

patch_classification:
  - file: 0001-GNUMakefile.patch
    type: platform_adaptation
    platform_only: True
    guard: 'CC override + DESTDIR'
  - file: 0002-dsocks-torify.sh.patch
    type: platform_adaptation
    platform_only: True
    guard: 'uname -s = OHOS'
  - file: 0003-dsocks.c.patch
    type: portability
    platform_only: False
    guard: '__GLIBC__'
  - file: 0004-dsocks.h.patch
    type: portability
    platform_only: False
    guard: '__GLIBC__'
  - file: 0005-dsocks.sh.patch
    type: platform_adaptation
    platform_only: True
    guard: 'uname -s = OHOS'

