software: daemon
display: "daemon"
description: "将其他进程转换为 Unix 守护进程的命令行工具（raf's daemon，内置 libslack 静态库）"
category: utility
homepage: "https://libslack.org/daemon"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "raf 自定义 Makefile + ./configure 平台探测（非 autotools/cmake），--platform=Linux 强制 Linux 分支"
    - "CC/AR/RANLIB/LDFLAGS 须在 make 命令行传入以覆盖 Makefile 的 := 赋值（R33）"
    - "链接可执行文件用 GNU ld（-fuse-ld=/data/service/hnp/bin/ld）规避 OHOS SDK lld 依赖 libxml2.so.16（E120）"
    - "HarmonyOS 执行二进制前需 ELF 签名（package 阶段 binary-sign-tool，E082）"
    - "musl 提供 libutil.so，-lutil（openpty 等）可正常链接；0.8.4 已内置 musl 支持（sys/ttydefaults.h）"
    - "产物仅为 daemon 可执行文件（命令行工具），libslack 为内置静态库不对外暴露"
  common_dependencies: []

versions:
  "0.8.4":
    status: built
    build_date: "2026-07-14"
