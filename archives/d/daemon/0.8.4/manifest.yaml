software: daemon
# 版本级 manifest
# 文件位置: archives/d/daemon/0.8.4/manifest.yaml

version: "0.8.4"
status: built
build_date: "2026-07-14"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/raforg/daemon/releases/download/v0.8.4/daemon-0.8.4.tar.gz"
  sha256: "fa28859ad341cb0a0b012c11c271814f870482013b49f710600321d379887cd1"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "./configure --platform=Linux --disable-logind --disable-mail-test"
    - "make CC=clang AR=llvm-ar RANLIB=llvm-ranlib LDFLAGS=-fuse-ld=/data/service/hnp/bin/ld"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - ref: E081
    note: "raf 自定义 Makefile + ./configure（非 autotools/cmake），CC/AR/RANLIB/LDFLAGS 须在 make 命令行覆盖 Makefile 的 := 赋值"
  - ref: E120
    note: "链接可执行文件用 GNU ld（-fuse-ld=/data/service/hnp/bin/ld）规避 OHOS SDK lld 依赖 libxml2.so.16"
  - ref: E082
    note: "HarmonyOS 执行二进制前需 ELF 签名（package 阶段 binary-sign-tool -selfSign 1）"
