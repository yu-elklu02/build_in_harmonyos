# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: daemon/0.8.4
homepage: "https://libslack.org/daemon"

# 上游测试命令（daemon 的 test/test1-test70 为人工观察型集成测试，无自动化 pass/fail）
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（人工观察型，未集成）
upstream_tests: []

# test_package 自带的测试（消费者视角验证：执行 daemon 二进制）
test_package_tests:
  - file: test.sh
    description: "daemon --version 冒烟 + 前台客户端执行功能测试"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 2
