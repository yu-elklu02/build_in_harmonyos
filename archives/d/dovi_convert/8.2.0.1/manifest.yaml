software: dovi_convert
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.2.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/cryptochrome/dovi_convert/archive/refs/tags/v8.2.0.tar.gz"

  # 源码校验和
  sha256: "bf6d9a634d66415b96faa4ee90c0e60149b91b5ab0c53dfb4111cdb2f593ed40"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  # 单文件 Python 脚本，无构建系统、无配置选项
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # dovi_convert 是纯 Python 单文件脚本，无 Conan 构建依赖
  # 运行时依赖（通过 subprocess 调用）：python3、ffmpeg、dovi_tool、mkvtoolnix、mediainfo
  # 这些由用户在目标系统上单独安装
  dependencies: []

  # 编译器（dovi_convert 是纯 Python 脚本，无 C 编译）
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# OHOS 适配通过 conanfile.py 中的 chmod 动态修改，未使用 patch 文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "dovi_convert 8.2.0 是 cryptochrome 开发的 Dolby Vision Profile 7 -> 8.1 转换工具"
  - "上游为单文件 Python 3 CLI 脚本 (dovi_convert.py, ~161KB, 4009 行)，无构建系统、无测试套件"
  - "脚本使用 #!/usr/bin/env python3 shebang，OHOS 上 python3 在 PATH 中可用，无需 patch shebang"
  - "运行时通过 subprocess 调用外部媒体工具：ffmpeg、dovi_tool、mkvmerge、mkvextract、mediainfo"
  - "这些外部工具非 Conan 依赖，由用户在目标系统单独安装；脚本运行时自动检测并提供安装建议"
  - "上游 v8.2.0 仓库文件清单：dovi_convert.py、README.md、CHANGELOG.md、Dockerfile、docker-compose.yml、LICENSE、ROADMAP.md、.github/workflows/docker-publish.yml"
  - "命令：scan、convert、inspect、backup、restore、cleanup、update-check、help；无 --version 标志"
  - "dovi_convert 是 CLI 应用程序 (application)，非库。package_info 中 libs=[]，bindirs=['bin']"
  - "安装产物：bin/dovi_convert（从 dovi_convert.py 重命名，保留可执行位）+ licenses/LICENSE"
