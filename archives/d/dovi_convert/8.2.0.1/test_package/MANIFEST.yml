# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dovi_convert/8.2.0.1
homepage: "https://github.com/cryptochrome/dovi_convert"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# dovi_convert 是单文件 Python CLI 工具，上游无任何测试套件
# 已审计上游源码 (v8.2.0 tag)：
#   - 仓库根只有 dovi_convert.py / README.md / CHANGELOG.md / Dockerfile 等
#   - 无 test/、tests/、spec/ 目录
#   - 无 pytest/unittest/cram 配置
#   - .github/workflows/ 只有 docker-publish.yml（构建 Docker 镜像，非测试）
upstream_check_command: "git ls-files | grep -iE 'test|spec' || true"

# conanfile.py build() 方法中是否已集成上游测试
# 上游无测试套件，无法集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dovi_convert v8.2.0 上游零测试用例
upstream_tests: []

# 上游测试审计结论（HMBS 要求：缺少显式审计时必须拒绝放行）
upstream_test_audit:
  audited_tag: "v8.2.0"
  audited_url: "https://github.com/cryptochrome/dovi_convert/tree/v8.2.0"
  source_files_total: 8
  has_test_directory: false
  has_pytest_config: false
  has_unittest_main: false
  has_github_actions_test: false
  conclusion: "上游 v8.2.0 为单文件 Python CLI 脚本，仓库内无 test/tests/spec 目录，无 pytest/unittest 配置，CI 仅构建 Docker 镜像（docker-publish.yml）不运行测试。确认上游测试用例数为 0。"
  reason: "dovi_convert 上游不提供测试套件；test_package 为适配后补全的烟雾测试。"

# test_package 中自带的测试 (消费者视角验证)
# 验证 dovi_convert CLI 可执行、help 子命令、无参 usage、cleanup 子命令
test_package_tests:
  - file: test_dovi_convert.sh
    description: "bash 烟雾测试：验证 dovi_convert 安装可执行、help 子命令、无参 usage、cleanup 子命令"
    command: "bash test_dovi_convert.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个测试场景: which 找到二进制、help 子命令输出、无参 usage、cleanup 子命令
assertion_count: 4
