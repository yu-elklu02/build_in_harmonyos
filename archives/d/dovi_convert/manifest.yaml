software: dovi_convert
display: "dovi_convert"
description: "Dolby Vision Profile 7 -> 8.1 转换器（单文件 Python CLI）"
category: multimedia
homepage: "https://github.com/cryptochrome/dovi_convert"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "dovi_convert 8.2.0 是单文件 Python 3 CLI 脚本（dovi_convert.py, ~161KB），无构建系统、无测试套件"
    - "脚本 shebang #!/usr/bin/env python3 在 OHOS 上可用，无需 patch (E165 不适用)"
    - "package_type 为 application，package_info 中 libs=[]，bindirs=['bin']"
    - "安装时将 dovi_convert.py 重命名为 dovi_convert（无 .py 后缀，与上游 README 安装说明一致）"
    - "运行时通过 subprocess 调用外部媒体工具：ffmpeg、dovi_tool、mkvmerge、mkvextract、mediainfo"
    - "这些外部工具非 Conan 依赖，由用户在目标系统单独安装；脚本运行时自动检测并提供安装建议"
    - "上游 v8.2.0 仓库无 test/、tests/、spec/ 目录，无 pytest/unittest/cram 配置，确认上游测试用例数为 0"
    - "test_package 为 bash 烟雾测试，验证 dovi_convert help 子命令、无参 usage、cleanup 子命令"
  common_dependencies: []

versions:
  "8.2.0":
    status: built
    build_date: "2026-07-28"
