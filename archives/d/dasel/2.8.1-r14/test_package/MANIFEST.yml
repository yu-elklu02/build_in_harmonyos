package: dasel/2.8.1-r14
homepage: https://github.com/TomWright/dasel

upstream_test_in_build: true
upstream_tests:
  - command: "go test . ./storage ./dencoding ./internal/command"
    description: "Run upstream root, storage, dencoding, and command Go tests on Linux and signed OHOS test binaries"

test_package_tests:
  - file: test.sh
    description: "Run dasel --version, JSON select, JSON-to-YAML conversion, and put command against the packaged binary"
    command: "bash test.sh <bin/dasel>"

assertion_count: 4
