package: dragonfly-reverb/3.2.10
homepage: "https://michaelwillis.github.io/dragonfly-reverb/"

# dragonfly-reverb 上游为 LV2 音频插件，无单元测试套件（N=0）。
# 验证以 test_package 消费者视角为主：检查 4 个 LV2 bundle 的完整性。
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Verify all four LV2 DSP bundles: binary existence, manifest/metadata TTL references, absence of UI references, and lv2_descriptor symbol export"
    command: "conan test"
    cases:
      # DragonflyEarlyReflections (6 checks)
      - early-reflections-binary-exists
      - early-reflections-manifest-exists
      - early-reflections-metadata-exists
      - early-reflections-manifest-refs
      - early-reflections-no-ui
      - early-reflections-lv2-descriptor
      # DragonflyHallReverb (6 checks)
      - hall-reverb-binary-exists
      - hall-reverb-manifest-exists
      - hall-reverb-metadata-exists
      - hall-reverb-manifest-refs
      - hall-reverb-no-ui
      - hall-reverb-lv2-descriptor
      # DragonflyPlateReverb (6 checks)
      - plate-reverb-binary-exists
      - plate-reverb-manifest-exists
      - plate-reverb-metadata-exists
      - plate-reverb-manifest-refs
      - plate-reverb-no-ui
      - plate-reverb-lv2-descriptor
      # DragonflyRoomReverb (6 checks)
      - room-reverb-binary-exists
      - room-reverb-manifest-exists
      - room-reverb-metadata-exists
      - room-reverb-manifest-refs
      - room-reverb-no-ui
      - room-reverb-lv2-descriptor

test_flow_count: 24
assertion_count: 24
