# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: defaultbrowser/1.1
homepage: "https://github.com/kerma/defaultbrowser"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "验证 OpenHarmony 上 defaultbrowser 命令输出 macOS-only 提示"
    command: "bash test.sh"

assertion_count: 1
