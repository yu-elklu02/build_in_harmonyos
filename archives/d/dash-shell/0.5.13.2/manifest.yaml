software: dash-shell
build_system: autotools
version: "0.5.13.2"
status: built
build_date: "2026-08-06"

source:
  url: "http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.13.2.tar.gz"
  sha256: "e7136826b1eed6ce3193e8affa2f70b1b2b9168dd91ffa7ddb4f46e9e62054fe"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-mkbuiltins.patch"

knowledge_gained:
  - "dash源码缺少config.guess/config.sub，需从GNU config下载并打OHOS补丁(E007)"
  - "下载的旧版config.guess使用GUESS变量而非echo/exit，需手动改为直接输出退出"
  - "mkbuiltins脚本中sort从pipe读取在HMDFS上Permission denied(E002)，需重定向到临时文件后再sort"
  - "mkbuiltins patch中sort路径不能用绝对路径，应使用PATH中的sort(系统toybox sort即可)"

test_report: reports/test-report.md

conan:
  package_type: application
  verified: true
  verify_date: "2026-08-06"
  verify_result: "G0-G4 + L2/L4/L5 all PASS"
