package: docutils/0.23
homepage: "https://docutils.sourceforge.io"

# Upstream test suite: cd test && ./alltests.py (1744+ tests)
# Not integrated into conanfile.py build() (pure copy, no compilation).
upstream_check_command: "cd test && ./alltests.py"
upstream_test_in_build: false

# test_package self-contained tests (consumer perspective)
test_package_tests:
  - file: test.py
    description: "Package integrity (__version__==0.23 + core.py) + HTML conversion + rst2html CLI --version"
    command: "python3 test.py"

# Approximate assertion count
assertion_count: 4
