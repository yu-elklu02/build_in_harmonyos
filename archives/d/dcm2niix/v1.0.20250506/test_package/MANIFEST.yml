# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: dcm2niix/v1.0.20250506
homepage: "https://github.com/rordenlab/dcm2niix"

# 上游测试命令（dcm2niix 无 ctest 测试套件，项目未定义 enable_testing）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无自动化测试套件）
upstream_tests: []

# test_package 自带的测试（消费者视角验证：执行 dcm2niix 二进制）
test_package_tests:
  - file: test.sh
    description: "dcm2niix --version 冒烟测试 + 空目录扫描功能测试"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 2
