# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: dhcpdump/1.10
homepage: "https://github.com/bbonev/dhcpdump"

# 上游无测试套件
upstream_check_command: "true"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "dhcpdump --version"
    description: "验证二进制可执行且输出版本信息"
    command: "dhcpdump --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1