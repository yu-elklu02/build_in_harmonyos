# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dot2tex/2.12.0
homepage: "https://github.com/sagemath/dot2tex"

# 上游测试命令 — dot2tex 上游使用 pytest 进行测试
upstream_check_command: "python3 -m pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_dot2tex.py
    source: dot2tex-2.12.0/tests/test_dot2tex.py
    description: "主测试文件 — 测试 DOT 解析、TikZ 输出转换等功能"
    command: "python3 -m pytest tests/test_dot2tex.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: dot2tex --version + Python 模块导入"
    command: "bash test.sh"
  - file: conanfile.py (inline test)
    description: "消费者测试: dot2tex --version + import dot2tex + 基本转换功能"
    command: "conan test (dot2tex --version + python3 -c 'import dot2tex')"

# 测试断言总数
assertion_count: 8
