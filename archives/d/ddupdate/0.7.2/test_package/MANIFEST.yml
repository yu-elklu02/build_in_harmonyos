# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ddupdate/0.7.2
homepage: "https://github.com/leamas/ddupdate"

# 上游测试命令（Python 项目无独立测试框架，OHOS 无法运行）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_failed_archive.py
    description: "验证失败归档包含明确状态(status: failed)、失败原因(Python/distutils 兼容)与 OHOS 说明"
    command: "python3 test_failed_archive.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
