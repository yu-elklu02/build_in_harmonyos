version: "3.2"
software: dhcpd-pools
status: passed
build_date: "2026-08-06"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/dhcpd-pools/files/dhcpd-pools-3.2.tar.xz/download"
  sha256: "887cb47eeb937f65993d06e60ee93b156f687f19cdfa8f1b30496dab522dcec2"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--with-uthash=<vendored uthash 2.3.0 src dir>"
    - "--disable-doxygen"
    - "--build=aarch64-unknown-linux-gnu (OHOS)"
    - "--host=aarch64-unknown-linux-gnu (OHOS)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "OHOS: run configure via sh and pass explicit build/host triplets to avoid config.guess temp-file probing."
  - "OHOS: relax Autoconf config.status temporary directory umask from 077 to 022 because this device rejects writes in 0700 setgid directories."
  - "OHOS: run upstream shell tests with LOG_COMPILER=sh because direct shebang execution is rejected."
  - "OHOS: normalize tests/errors absolute-path diagnostics and preserve unknown --skip value when getsubopt() returns NULL for unknown suboptions."
  - "CI: fetch uthash 2.3.0 header sources inside this recipe because uthash/2.3.0 is not resolvable from ohpcd in PR CI."

knowledge_gained:
  - "dhcpd-pools 3.2 is an Autotools/gnulib command-line application."
  - "The only non-system build dependency identified in configure.ac is uthash.h."
  - "Upstream provides 37 mandatory shell regression tests plus one conditional mustach test via make check."
  - "Single-package shadow CI passed on HarmonyOS aarch64: upstream make check 37/37 and test_package executed."
  - "Project CI cannot resolve uthash/2.3.0 from ohpcd, so this recipe downloads the fixed uthash 2.3.0 source tarball and uses its src directory as the header include path."
