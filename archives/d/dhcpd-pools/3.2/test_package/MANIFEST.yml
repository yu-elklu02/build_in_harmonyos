package: dhcpd-pools/3.2
homepage: "http://dhcpd-pools.sourceforge.net/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: tests/alarm-count-option
  - file: tests/alarm-critical
  - file: tests/alarm-critical-ranges
  - file: tests/alarm-critical-snets
  - file: tests/alarm-ignore
  - file: tests/alarm-ok
  - file: tests/alarm-shared-ok
  - file: tests/alarm-warning
  - file: tests/alarm-warning-ranges
  - file: tests/alarm-warning-snets
  - file: tests/shnet-alarm
  - file: tests/big-small
  - file: tests/binding-states
  - file: tests/bootp
  - file: tests/cidr-v4
  - file: tests/cidr-v6
  - file: tests/complete
  - file: tests/complete-perfdata
  - file: tests/empty
  - file: tests/errors
  - file: tests/full-json
  - file: tests/full-xml
  - file: tests/formats
  - file: tests/leading0
  - file: tests/one-ip
  - file: tests/one-line
  - file: tests/parser
  - file: tests/range4
  - file: tests/range6
  - file: tests/same-twice
  - file: tests/shufled
  - file: tests/simple
  - file: tests/skip
  - file: tests/sorts
  - file: tests/statuses
  - file: tests/v6
  - file: tests/v6-perfdata
  - file: tests/mustach
    condition: "ENABLE_MUSTACH"

test_package_tests:
  - file: test.c
    description: "Executes dhcpd-pools --version and analyzes a generated ISC dhcpd config/lease pair"
    command: "ctest / test_dhcpd_pools"

assertion_count: 43
