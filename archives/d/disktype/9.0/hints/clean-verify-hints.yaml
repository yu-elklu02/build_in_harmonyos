# clean-verify hints for disktype 9
# This is a makefile project without configure/install targets.
# Custom commands are needed because:
# 1. CPPFLAGS with multiple -D flags needs proper quoting for make
# 2. No install target in Makefile - requires manual install

build_system: makefile

build_command: make -j1 CC=clang CPPFLAGS="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -DUSE_IOCTL_LINUX" CFLAGS="-Wall -fPIC -O2"

install_command: mkdir -p __DESTDIR__/$DEFAULT_PREFIX/bin __DESTDIR__/$DEFAULT_PREFIX/share/man/man1 __DESTDIR__/$DEFAULT_PREFIX/share/doc/disktype && cp disktype __DESTDIR__/$DEFAULT_PREFIX/bin/disktype && cp disktype.1 __DESTDIR__/$DEFAULT_PREFIX/share/man/man1/disktype.1 && cp README LICENSE HISTORY TODO __DESTDIR__/$DEFAULT_PREFIX/share/doc/disktype/
