software: disktype
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/disktype/disktype/9/disktype-9.tar.gz"

  # 源码校验和
  sha256: "b6701254d88412bc5d2db869037745f65f94b900b59184157d072f35832c1111"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（无 configure 脚本，通过 hints/clean-verify-hints.yaml 自定义构建命令）
  # make 参数通过 hints 文件传递，避免 CPPFLAGS 多参数空格分割问题
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "disktype 无 configure 脚本，纯 Makefile 项目，需通过 make CC=clang CPPFLAGS='-DUSE_IOCTL_LINUX' 手动编译"
  - "uname 返回 HarmonyOS 而非 Linux，Makefile 无法自动启用 USE_IOCTL_LINUX，需手动添加"
  - "disktype 无 install/check 目标，需手动安装 bin 和 man 文件"
  - "纯 Makefile 项目的 CPPFLAGS 多参数不能用 configure_options 列表传递（会被 .split() 拆分导致 make 解析错误），必须用 hints/clean-verify-hints.yaml"

# ============================================================
# 测试结果
# ============================================================

test_results:
  make_check: "N/A（项目无测试套件）"
  functional_tests: "10/10 PASS"
  test_details: "reports/test-report.md"
  g0_result: "PASS"
  g1_result: "PASS (✅1 ⚠️0 ❌0)"
  g2_result: "PASS (⚠️1: disktype 不支持 --version)"
  g3_result: "PASS (⚠️2: 无 RPATH, staging 未签名)"
  g4_result: "PASS (✅0 ⚠️0 ❌0)"

# ============================================================
# 打包信息
# ============================================================

packaging:
  main_package: "disktype-9-ohos-aarch64.tar.gz"
  main_size: "167KB"
  debug_package: "disktype-9-ohos-aarch64-debug.tar.gz"
  debug_size: "35KB"
  contents:
    - "bin/disktype"
    - "share/man/man1/disktype.1"
    - "share/doc/disktype/README"
    - "share/doc/disktype/LICENSE"
    - "share/doc/disktype/HISTORY"
    - "share/doc/disktype/TODO"

# ============================================================
# 特殊配置
# ============================================================

# hints 文件用于 G0 干净构建验证
hints_file: "hints/clean-verify-hints.yaml"

# 无补丁（所有适配通过命令行参数覆盖）
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"
