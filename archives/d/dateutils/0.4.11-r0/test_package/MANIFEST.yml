# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dateutils/0.4.11-r0
homepage: "https://github.com/hroptatyr/dateutils"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/*.clit
    source: dateutils-0.4.11/test/*.clit
    description: "dateutils test suite (878 tests, 837 PASS / 41 FAIL — 边界日期解析差异)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 CLI 工具可用性 (检查 binary 存在 + --version smoke test)"
    command: "self.run()"

# 测试断言总数
assertion_count: 13
