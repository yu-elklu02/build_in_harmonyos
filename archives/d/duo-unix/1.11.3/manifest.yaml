version: "1.11.3"
software: "duo-unix"
status: built
build_date: "2026-07-31"
build_system: autotools

source:
  url: "https://github.com/duosecurity/duo_unix/archive/refs/tags/duo_unix-1.11.3.tar.gz"
  sha256: "beabba9fc286fea651941548aa830920f465ca6b754adb6fbc050ad420d3ae75"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-openssl=openssl_package"
    - "--without-pam"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - openssl/3.5.6
  tool_dependencies:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "duo-unix GitHub archive 不含 configure，需 autoreconf 自举 (tool_requires automake/libtool)"
  - "唯一必需依赖是 OpenSSL；PAM 可选（默认 --without-pam）"
  - "login_duo 安装到 sbin/，需移动到 bin/ 供 CI L2 烟雾测试扫描"
  - "duo_open() 传 NULL cafile 使用内置 CA 证书，无需网络/文件即可测试 API"

test_results:
  type: manual
  total: 3
  passed: 3
  failed: 0
  notes: "test_package 消费者测试验证 libduo API 链接与调用"

knowledge_ref: []
