# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: duo-unix/1.11.3
homepage: "https://github.com/duosecurity/duo_unix"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
# duo-unix 上游测试 (cram.py + unity) 需要 Python/pexpect/mock 服务，不适合 CI 环境
# 改由 test_package 消费者测试验证 libduo API
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（参考，CI 环境不执行）
upstream_tests:
  - file: tests/unity_tests/add_param_test.c
    source: duo_unix-1.11.3/tests/unity_tests/add_param_test.c
    description: "Unity unit test: duo_common_ini_handler add_param"
    command: "./add_param_test"
  - file: tests/unity_tests/add_groupname_test.c
    source: duo_unix-1.11.3/tests/unity_tests/add_groupname_test.c
    description: "Unity unit test: duo_common_ini_handler groupname"
    command: "./add_groupname_test"
  - file: tests/unity_tests/bson_iter_init_test.c
    source: duo_unix-1.11.3/tests/unity_tests/bson_iter_init_test.c
    description: "Unity unit test: BSON iterator init"
    command: "./bson_iter_init_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_duo.c
    description: "Consumer smoke test: link libduo and call duo_open/duo_geterr/duo_close"
    command: "./test_duo"

# 测试断言总数 (近似值)
assertion_count: 3
