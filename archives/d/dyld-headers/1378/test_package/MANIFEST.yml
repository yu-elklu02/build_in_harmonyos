package: dyld-headers/1378
homepage: "https://github.com/apple-oss-distributions/dyld"

# The upstream project exposes the dyld_tests aggregate target through Xcode.
# Its release archive does not include the required testing/ directory, and the
# target also depends on Apple internal SDKs, so it cannot run in this OHOS job.
upstream_check_command: "xcodebuild -target dyld_tests"
upstream_test_in_build: false
upstream_test_command: "not run: requires Apple Xcode SDKs and the omitted upstream testing/ directory"

upstream_tests:
  - file: build-scripts/dyld_tests-build.sh
    source: "dyld-1378/build-scripts/dyld_tests-build.sh"
    description: "Upstream dyld_tests aggregate target; invokes testing/build_ninja.py and Apple Xcode tooling"
    command: "xcodebuild -target dyld_tests"

test_package_tests:
  - file: test_dyld_headers.cpp
    description: "Compile and exercise portable Mach-O fixup and Objective-C shared-cache declarations from the packaged headers"
    command: "test_dyld_headers"

assertion_count: 7
