version: "2.7.15"
status: built
build_date: "2026-07-17"

source:
  url: "https://downloads.sourceforge.net/project/dar/dar/2.7.15/dar-2.7.15.tar.gz"
  sha256: "fac56b59b78b5435ee19541ff4bd3dc329c8252ff78749ffea240f6421534bfe"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-libbz2-linking"
    - "--disable-liblzo2-linking"
    - "--disable-libxz-linking"
    - "--disable-libzstd-linking"
    - "--disable-liblz4-linking"
    - "--disable-libgcrypt-linking"
    - "--disable-libcurl-linking"
    - "--disable-gpgme-linking"
    - "--disable-threadar"
    - "--disable-python-binding"
    - "--disable-upx"
    - "--disable-build-html"
    - "--disable-dar-static"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "dar 2.7.15 是 C++ autotools 项目，需要 C++ 编译器"
  - "config.guess/config.sub 需要添加 HarmonyOS 平台识别"
  - "configure 脚本中 umask 077 在 HarmonyOS 上导致权限问题，需改为 022"
  - "mktemp -d 在 HarmonyOS 上创建目录权限异常，需要 wrapper 强制 fallback"
  - "通过 --disable-* 选项禁用所有可选依赖（bzip2/lzo2/xz/zstd/lz4/gcrypt/curl/gpgme/threadar）实现最小化交叉编译"
  - "make check 测试套件需运行 aarch64 测试程序，交叉编译环境下无法执行，已加入 no_official_test 白名单"
