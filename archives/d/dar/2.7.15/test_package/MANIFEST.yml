# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dar/2.7.15
homepage: https://dar.sourceforge.net/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# false: CI 为 x86_64 交叉编译，aarch64 测试程序无法在 CI worker 执行
# 上游 make check 已在 OHOS aarch64 真机完整运行通过（4/4）
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_test_result: "PASS 4/4 (aarch64 OHOS real device)"

# 上游 make check 测试套件（CI 交叉编译环境跳过，真机已验证）
upstream_tests:
  - name: "all_features"
    source: src/check/all_features.cpp
    description: "全功能集成测试"
  - name: "bnonzero"
    source: src/check/bnonzero.c
    description: "bnonzero 测试"
  - name: "padder"
    source: src/check/padder.cpp
    description: "padder 测试"
  - name: "uncompressible_file"
    source: src/check/uncompressible_file.cpp
    description: "不可压缩文件测试"

# test_package 中自带的测试
test_package_tests:
  - file: test_dar.sh
    description: "dar -V + -h + dar_xform/dar_slave/dar_manager/dar_cp/dar_split -V 存在性与执行验证"
    command: "bash test_dar.sh <bindir>"

# 测试断言总数
assertion_count: 7
