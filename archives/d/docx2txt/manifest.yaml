software: docx2txt
display: "docx2txt"
description: "从 DOCX 文件提取纯文本的 Perl 脚本工具"
category: document
homepage: "https://sourceforge.net/projects/docx2txt/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本项目，无需编译步骤"
    - "OpenHarmony 缺少 GNU install 命令，需手动安装文件"
    - "Makefile 不支持标准 DESTDIR 模式"
    - "需要 unzip 工具解压 docx 文件"
  common_dependencies:
    - perl
    - unzip

versions:
  "1.4":
    status: built
    build_date: "2026-07-18"
