# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: duktape/2.7.0
homepage: "https://duktape.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# duktape 上游使用纯 JS 测试套件 (tests/ecmascript/) 通过 duk 运行
upstream_tests:
  - file: "tests/ecmascript/test-dev-misc1.js"
    source: "duktape-2.7.0/tests/ecmascript/test-dev-misc1.js"
    description: "Upstream JS test suite run via duk interpreter"
    command: "./duk tests/ecmascript/test-dev-misc1.js"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verifies duktape C API: create heap, eval JS, check result"
    command: "./test_duktape"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
