# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: draco/1.5.7
homepage: "https://google.github.io/draco/"

# 上游测试命令
upstream_check_command: "cmake --build <build_dir> --target draco_tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build <build_dir> --target draco_tests draco_factory_tests && DRACO_TEST_DATA_DIR=<source_dir>/testdata <build_dir>/draco_tests && DRACO_TEST_DATA_DIR=<source_dir>/testdata <build_dir>/draco_factory_tests"

upstream_tests_exist: true

# 上游实际运行的测试程序 (来自 cmake/draco_tests.cmake)
# 所有测试均使用 Google Test，位于 src/draco/ 下
upstream_tests:
  - file: compression/encode_test.cc
    source: draco-1.5.7/src/draco/compression/encode_test.cc
    description: "编码器端到端测试"
    command: "./draco_tests"
  - file: compression/decode_test.cc
    source: draco-1.5.7/src/draco/compression/decode_test.cc
    description: "解码器端到端测试"
    command: "./draco_tests"
  - file: compression/mesh/mesh_encoder_test.cc
    source: draco-1.5.7/src/draco/compression/mesh/mesh_encoder_test.cc
    description: "网格编码器测试"
    command: "./draco_tests"
  - file: compression/mesh/mesh_edgebreaker_encoding_test.cc
    source: draco-1.5.7/src/draco/compression/mesh/mesh_edgebreaker_encoding_test.cc
    description: "Edgebreaker 编码测试"
    command: "./draco_tests"
  - file: compression/point_cloud/point_cloud_kd_tree_encoding_test.cc
    source: draco-1.5.7/src/draco/compression/point_cloud/point_cloud_kd_tree_encoding_test.cc
    description: "点云 KD 树编码测试"
    command: "./draco_tests"
  - file: compression/point_cloud/point_cloud_sequential_encoding_test.cc
    source: draco-1.5.7/src/draco/compression/point_cloud/point_cloud_sequential_encoding_test.cc
    description: "点云顺序编码测试"
    command: "./draco_tests"
  - file: compression/attributes/point_d_vector_test.cc
    source: draco-1.5.7/src/draco/compression/attributes/point_d_vector_test.cc
    description: "点 D 向量测试"
    command: "./draco_tests"
  - file: compression/attributes/sequential_integer_attribute_encoding_test.cc
    source: draco-1.5.7/src/draco/compression/attributes/sequential_integer_attribute_encoding_test.cc
    description: "顺序整数属性编码测试"
    command: "./draco_tests"
  - file: compression/attributes/prediction_schemes/prediction_scheme_normal_octahedron_transform_test.cc
    source: draco-1.5.7/src/draco/compression/attributes/prediction_schemes/prediction_scheme_normal_octahedron_transform_test.cc
    description: "法线八面体变换预测方案测试"
    command: "./draco_tests"
  - file: compression/attributes/prediction_schemes/prediction_scheme_normal_octahedron_canonicalized_transform_test.cc
    source: draco-1.5.7/src/draco/compression/attributes/prediction_schemes/prediction_scheme_normal_octahedron_canonicalized_transform_test.cc
    description: "规范化法线八面体变换预测方案测试"
    command: "./draco_tests"
  - file: compression/bit_coders/rans_coding_test.cc
    source: draco-1.5.7/src/draco/compression/bit_coders/rans_coding_test.cc
    description: "rANS 编码测试"
    command: "./draco_tests"
  - file: compression/entropy/shannon_entropy_test.cc
    source: draco-1.5.7/src/draco/compression/entropy/shannon_entropy_test.cc
    description: "香农熵测试"
    command: "./draco_tests"
  - file: compression/entropy/symbol_coding_test.cc
    source: draco-1.5.7/src/draco/compression/entropy/symbol_coding_test.cc
    description: "符号编码测试"
    command: "./draco_tests"
  - file: attributes/point_attribute_test.cc
    source: draco-1.5.7/src/draco/attributes/point_attribute_test.cc
    description: "点属性测试"
    command: "./draco_tests"
  - file: animation/keyframe_animation_test.cc
    source: draco-1.5.7/src/draco/animation/keyframe_animation_test.cc
    description: "关键帧动画测试"
    command: "./draco_tests"
  - file: animation/keyframe_animation_encoding_test.cc
    source: draco-1.5.7/src/draco/animation/keyframe_animation_encoding_test.cc
    description: "关键帧动画编码测试"
    command: "./draco_tests"
  - file: core/buffer_bit_coding_test.cc
    source: draco-1.5.7/src/draco/core/buffer_bit_coding_test.cc
    description: "缓冲区位编码测试"
    command: "./draco_tests"
  - file: core/math_utils_test.cc
    source: draco-1.5.7/src/draco/core/math_utils_test.cc
    description: "数学工具测试"
