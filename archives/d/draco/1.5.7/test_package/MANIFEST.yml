    command: "./draco_tests"
  - file: io/file_reader_factory_test.cc
    source: draco-1.5.7/src/draco/io/file_reader_factory_test.cc
    description: "文件读取器工厂测试"
    command: "./draco_factory_tests"
  - file: io/file_writer_factory_test.cc
    source: draco-1.5.7/src/draco/io/file_writer_factory_test.cc
    description: "文件写入器工厂测试"
    command: "./draco_factory_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 1：网格构建 → 编码 DRC → 解码 → 验证顶点数（含量化参数）"
    command: "./test_draco"
  - file: test.cpp
    description: "消费者测试 2：点云构建 → 编码 DRC → 解码 → 验证点数"
    command: "./test_draco"
  - file: test.cpp
    description: "消费者测试 3：ExpertEncoder 量化参数控制 → 编码 → 解码验证"
    command: "./test_draco"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 320