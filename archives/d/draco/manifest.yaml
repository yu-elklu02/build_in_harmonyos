# 软件级 manifest — draco
# 遵循 ARCHIVE-SPEC v2.0

software: draco
display: "Draco 3D 几何压缩库"
description: "Google 开发的用于压缩和解压缩 3D 几何网格和点云的库"
category: compress
homepage: "https://google.github.io/draco/"
license: "Apache-2.0"

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 不识别 HarmonyOS 系统，仅警告，不影响编译（编译器自动检测 Clang 15+）"
    - "无外部依赖，编译纯静态库 + 编码器/解码器命令行工具"
    - "需要设置 OHOS NDK toolchain 或使用 CMAKE_TOOLCHAIN_FILE"
  common_dependencies: []

versions:
  "1.5.7":
    status: built
    build_date: 2026-07-16