# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: dbmate/2.33.0
homepage: "https://github.com/amacneil/dbmate"

# Upstream test command
upstream_check_command: "make test"

# Upstream tests are NOT integrated in conanfile.py build() (require DB servers)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (Go test suite, requires database servers)
upstream_tests:
  - file: main_test.go
    source: dbmate-2.33.0/main_test.go
    description: "Go test suite for dbmate CLI (requires PostgreSQL, MySQL, ClickHouse, SQLite)"
    command: "go test -v -p 1 -tags netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_json ./..."

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify dbmate --version works"
    command: "./test.sh"

# Approximate assertion count
assertion_count: 5
