software: dfu-programmer
version: "1.1.0"
status: published
build_date: "2026-06-09"
build_system: autotools

source:
  url: "https://github.com/dfu-programmer/dfu-programmer/archive/refs/tags/v1.1.0.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies:
    - "bundled libusb 1.0.27 source"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CI worker 不保证预置 libusb-1.0.a，dfu-programmer recipe 需从官方 libusb 1.0.27 源码构建静态库"
  - "dfu-programmer configure 可通过 LIBUSB_CFLAGS/LIBUSB_LIBS 和 PKG_CONFIG_PATH 接入本包构建出的真实 libusb"
  - "libusb 在 OHOS 上需要处理 netlink 头文件冲突与 HongMeng 内核版本字符串解析"
  - "USB/DFU 功能无法在无设备 CI 中伪造验收，需在具备 USB 权限的 OpenHarmony 环境中人工确认设备枚举和 DFU 读写链路"
