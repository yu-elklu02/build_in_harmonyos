# 软件级 manifest — docker-machine
# 遵循 ARCHIVE-SPEC v2.0

software: docker-machine
display: "docker-machine"
description: "Docker Machine — 在虚拟机或云主机上安装 Docker Engine 的工具"
category: devtools
homepage: "https://github.com/docker/machine"
license: Apache-2.0
build_system: go

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Go 项目（GOPATH 模式，使用 dep 管理依赖，vendor 目录完整）"
    - "无需补丁：上游 v0.16.2 源码在 HarmonyOS 上可直接编译通过"
    - "使用 Go modules 模式（GOFLAGS=-mod=vendor），conanfile.py 中自动创建 go.mod 启用 vendor 模式"
    - "CGO_ENABLED=1 GOOS=linux GOARCH=arm64，Go 1.26.5 编译通过"
    - "项目已归档（archived），最后版本 v0.16.2，不再维护"
    - "所有驱动（amazonec2/azure/digitalocean/exoscale/google/hyperv/openstack/rackspace/softlayer/virtualbox/vmware系列）均保留，未裁剪"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "v0.16.2":
    status: built
    build_date: "2026-08-06"
  "homebrew":
    status: archived
    build_date: "2026-06-03"
