  url: "https://github.com/docker/machine/archive/refs/tags/v0.16.2.tar.gz"
  sha256: "f333d6dc8976d2c5b0c5e62fb46bce50423e72e3c9210aa77dd6363683db24bf"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: go
  configure_options:
    - "CGO_ENABLED=1 GOOS=linux GOARCH=arm64 GOFLAGS=-mod=vendor"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "docker-machine v0.16.2 源码无需补丁即可在 HarmonyOS 上编译"
  - "使用 Go modules 模式（GOFLAGS=-mod=vendor），conanfile.py 中自动创建 go.mod 启用 vendor 模式"
  - "所有驱动（含云驱动）均保留，未裁剪，编译通过"
  - "Go 1.26.5 (Harmonybrew) 编译通过，生成 24MB arm64 ELF 二进制"
