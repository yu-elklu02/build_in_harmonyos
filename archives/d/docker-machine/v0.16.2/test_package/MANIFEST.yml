# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: docker-machine/v0.16.2
homepage: "https://github.com/docker/machine"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "go test -short ./cmd/..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "go test -short ./cmd/..."

# 上游实际运行的测试程序
upstream_tests:
  - file: cmd/docker-machine/machine_test.go
    source: docker-machine-v0.16.2/cmd/docker-machine/machine_test.go
    description: "Tests the main CLI entry point and store path configuration"
    command: "go test -short ./cmd/docker-machine"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Runs docker-machine version and checks the version string"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
