# test_package/MANIFEST.yml — daemonize 1.7.8
# CI L0e requires this file to exist.

package: daemonize/1.7.8
homepage: "https://github.com/bmc/daemonize"

# daemonize has no upstream test suite (no `make check` target in Makefile.in)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs in the tarball; testdaemon.c is a demo program
# that runs in an infinite loop, not a test harness.
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs daemonize without arguments, verifies version string (1.7.8) and usage line are printed"
    command: "bash test.sh"

# Approximate assertion count (version string + usage line)
assertion_count: 2
