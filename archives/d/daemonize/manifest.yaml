# 软件级 manifest — daemonize
# 遵循 ARCHIVE-SPEC v2.0

software: daemonize
display: "daemonize"
description: "命令行守护进程工具 — 将普通程序转换为 Unix 守护进程在后台运行"
category: utility
homepage: "https://github.com/bmc/daemonize"
license: "BSD-3-Clause"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Autotools 项目（预生成 configure + Makefile.in），无 make check 目标"
    - "HMDFS setgid 导致 umask 077 创建的临时目录不可写（drwx--S--- = 2700），需将 umask 077 改为 umask 022"
    - "daemonize 是命令行工具（application），非库；产物安装到 sbin/"
    - "无外部依赖，纯 C 标准库 + POSIX"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.7.8":
    status: built
    build_date: "2026-08-06"
