# test_package/MANIFEST.yml
# CI L0e requires this file to exist.

package: Devel-CheckCompiler/0.03
homepage: "https://metacpan.org/pod/Devel::CheckCompiler"

# Upstream test command
upstream_check_command: "perl Build.PL && ./Build test"

# conanfile.py build() does not run upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test files from the source tarball
upstream_tests:
  - file: t/00_compile.t
    source: Devel-CheckCompiler-0.03/t/00_compile.t
    description: "Module loading test"
    command: "perl -Ilib t/00_compile.t"
  - file: t/assert-c99.t
    source: Devel-CheckCompiler-0.03/t/assert-c99.t
    description: "Devel::AssertC99 import test (may skip on OHOS without C99)"
    command: "perl -Ilib t/assert-c99.t"
  - file: t/check_c99.t
    source: Devel-CheckCompiler-0.03/t/check_c99.t
    description: "check_c99() function test (may skip on OHOS)"
    command: "perl -Ilib t/check_c99.t"
  - file: t/check_c99_or_exit.t
    source: Devel-CheckCompiler-0.03/t/check_c99_or_exit.t
    description: "check_c99_or_exit() function test (may skip on OHOS)"
    command: "perl -Ilib t/check_c99_or_exit.t"

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Loads Devel::CheckCompiler module, verifies version, calls check_c99() and check_compile() API"
    command: "conan create"

# Approximate assertion count
assertion_count: 4
