# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.69/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.69"

# 软件名
software: "decker"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/JohnEarnest/Decker/archive/refs/tags/v1.69.tar.gz"

  # 源码校验和
  sha256: "6c0ceab3f00388478a142d2ba12186483eb6beac5d1aa266ca80f79da81d9b36"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-resources-sh-wrap-xxd-output-for-toybox.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS ships toybox 0.8.x xxd，其 -i 模式只输出裸字节列表，缺 GNU/Vim xxd -i 的 unsigned char NAME[] = {...}; 和 _len 包装。上游 scripts/resources.sh 假定的是 GNU xxd -i 行为，导致生成的 c/resources.h 在鸿蒙上编译报错 'expected identifier or ('"
  - "补丁 resources.sh：在 xxd -i 输出前后手写包裹 unsigned char <NAME>[] = { ... }; 和 unsigned int <NAME>_len = N; 声明，NAME 由输入路径中非字母数字字符替换为 _ 并去掉前导 _ 得到（匹配 GNU xxd -i 命名规则）"
  - "decker 是 application 类型（cpp_info.libdirs = []），CMake 测试不可 target_link_libraries(decker::decker)；test.c 改用 system(\"lilt ...\") 直接执行已安装二进制"
  - "Conan 2.x basic_layout 下 self.build_folder != self.source_folder，self.run() 默认 cwd=build_folder，所有源码相对路径必须用 os.path.join(self.source_folder, ...) 绝对路径，或 cwd=self.source_folder"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
