# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: decker/1.69
homepage: "https://github.com/JohnEarnest/Decker"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: scripts/test_interpreter.sh
    source: decker-1.69/scripts/test_interpreter.sh
    description: "Lil interpreter integration tests (positive & negative test cases)"
    command: "./scripts/test_interpreter.sh ./c/build/lilt"
  - file: tests/dom/arrays.lil
    source: decker-1.69/tests/dom/arrays.lil
    description: "Lil array operations tests"
    command: "./c/build/lilt tests/dom/arrays.lil"
  - file: tests/dom/images.lil
    source: decker-1.69/tests/dom/images.lil
    description: "Lil image manipulation tests"
    command: "./c/build/lilt tests/dom/images.lil"
  - file: tests/dom/domtests.lil
    source: decker-1.69/tests/dom/domtests.lil
    description: "Lil DOM model tests"
    command: "./c/build/lilt tests/dom/domtests.lil"
  - file: tests/dom/test_roundtrip.lil
    source: decker-1.69/tests/dom/test_roundtrip.lil
    description: "Lil document roundtrip tests"
    command: "./c/build/lilt tests/dom/test_roundtrip.lil"
  - file: tests/puzzles/weeklychallenge.lil
    source: decker-1.69/tests/puzzles/weeklychallenge.lil
    description: "Lil weekly challenge puzzle tests"
    command: "./c/build/lilt tests/puzzles/weeklychallenge.lil"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "通过 system() 执行已安装的 lilt 二进制：--version 与 -e \"print 1\" 脚本求值，断言两者均返回 0"
    command: "./test_decker"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 200