# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: drill/0.9.1
homepage: https://www.nlnetlabs.nl/projects/ldns/

# 上游测试命令 — ldns 上游用 make check 运行 tests/ 套件
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ldns 上游 test/ 目录含大量测试（wire2host/host2wire 等），本配方仅构建
# drill 组件，上游测试需完整 ldns 库构建环境
upstream_tests:
  - file: test/
    source: ldns-1.9.1/test/
    description: "ldns 上游测试套件（drill 依赖的 ldns 库测试，本配方仅构建 drill 组件不运行）"
    command: "make check"
    condition: "需完整 ldns 库构建环境"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 drill 二进制存在 + --help 输出（popen 输出检查）"
    command: "conan create (test_package _check_binary_exists + --help 验证)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2