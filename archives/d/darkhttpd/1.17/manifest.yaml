software: darkhttpd
build_system: makefile
version: "1.17"
status: built
build_date: "2026-06-16"

source:
  url: "https://github.com/emikulic/darkhttpd/archive/refs/tags/v1.17.tar.gz"
  sha256: "4fee9927e2d8bb0a302f0dd62f9ff1e075748fa9f5162c9481a7a58b41462b56"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2"
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "无configure脚本，直接make编译；无install目标，手动cp到bin目录"

patches_applied:
  - file: "patches/0001-add-version-exit.patch"
    description: "Add --version exit handling to prevent server start on version check"
    type: "portability"

install_files:
  - path: bin/darkhttpd
    type: executable
    description: "darkhttpd HTTP服务器主程序"

test_results:
  official_suite: "SKIP (140/140 ConnectionRefusedError, OHOS平台socket限制)"
  manual_tests: "PASS (18/18 HTTP功能测试全部通过)"
  version_check: "PASS (darkhttpd/1.17)"

knowledge_gained:
  - E900: "极简Makefile项目（无configure/install目标）需直接make编译+手动cp安装"
  - E900: "darkhttpd --version原启动监听不退出，已通过补丁修复为打印版本后直接退出"
  - E900: "官方test.py依赖网络服务socket，OHOS平台ConnectionRefusedError，手动HTTP测试替代"
