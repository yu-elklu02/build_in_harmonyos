# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: darkhttpd/1.17
homepage: "https://github.com/emikulic/darkhttpd"

# 上游测试命令
upstream_check_command: "python3 devel/test.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: devel/test.py
    source: darkhttpd-1.17/devel/test.py
    description: "Python HTTP functional test suite (140 tests, requires TCP socket)"
    command: "python3 devel/test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify darkhttpd --version output"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
