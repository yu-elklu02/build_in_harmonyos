# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: diamond/2.1.24
homepage: "https://github.com/bbuchfink/diamond"

# 上游测试命令
upstream_check_command: "diamond test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
upstream_tests:
  - file: "diamond binary"
    source: "diamond-2.1.24"
    description: "diamond test — 22 个回归测试 (20 blastp + 2 stress tests)"
    command: "diamond test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 diamond --version 和 diamond test"
    command: "diamond --version && diamond test"

# 测试断言总数
assertion_count: 22