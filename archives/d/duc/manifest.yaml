software: duc
display: "duc"
description: "用于索引、检查和可视化磁盘使用量的命令行工具"
category: utility
homepage: "https://github.com/zevv/duc"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用 GitHub 官方 Release 源码包，包含 configure"
    - "使用 sqlite3/3.49.1 作为数据库后端"
    - "禁用 Cairo、X11 和 ncurses UI，仅保留命令行索引与查询功能"
    - "HMDfs 下 config.status 的 0700 临时目录不可写，配方改用普通 mkdir"
    - "已在 OpenHarmony aarch64 真机通过 conan-verify、conan create 和 CI"
  common_dependencies:
    - "sqlite3/3.49.1"

versions:
  "1.4.6":
    status: built
    build_date: "2026-07-29"
