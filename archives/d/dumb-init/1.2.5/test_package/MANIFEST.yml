# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dumb-init/1.2.5
homepage: "https://github.com/Yelp/dumb-init"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# dumb-init upstream uses Python-based integration tests (testing/ dir)
# These are not CMake/make tests, they require Docker and Python deps
upstream_tests:
  - file: testing/proc_spawn_signals.py
    source: dumb-init-1.2.5/testing/proc_spawn_signals.py
    description: "Signal forwarding integration test"
    command: "python testing/proc_spawn_signals.py"
  - file: testing/rewriting.py
    source: dumb-init-1.2.5/testing/rewriting.py
    description: "Signal rewriting test"
    command: "python testing/rewriting.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_dumb_init.sh
    description: "Run dumb-init --version and --help to verify binary works"
    command: "bash test_dumb_init.sh"

# 测试断言总数 (近似值)
assertion_count: 3
