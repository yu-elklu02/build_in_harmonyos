software: dgit
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/15.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "15.13"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://salsa.debian.org/dgit-team/dgit/-/archive/debian/15.13/dgit-debian-15.13.tar.gz"
  sha256: "078113bc67e9e8ef5ee957a3d414158e5d18e130ce37afc897cb797fe9382162"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: perl

  configure_options: []

  # 编译依赖列表
  # dgit 依赖 Debian 打包工具链 (dpkg-dev, devscripts, git-buildpackage)
  # 这些工具在 OHOS 上不可用，但 Perl 脚本和模块本身可以打包
  dependencies: []

  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "dgit is a Perl script tool, no compilation needed"
  - "Main scripts: dgit, git-debrebase, git-debpush, git-deborig, git-playtree-setup"
  - "Perl modules: Debian::Dgit, Debian::Dgit::* (ExitStatus, I18n, Core, Infra, GDR, GDP, Policy)"
  - "Requires Perl >= 5.24.0 (OHOS has 5.42.0)"
  - "Runtime dependency Dpkg::Control::Hash not available on OHOS - dgit CLI cannot fully run"
  - "Debian::Dgit::ExitStatus can be loaded without Dpkg dependency"
  - "Source tarball from salsa.debian.org official git archive (CI Worker reachable; snapshot.debian.org unreachable)"
