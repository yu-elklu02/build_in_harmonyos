package: dgit/15.13
homepage: "https://salsa.debian.org/dgit-team/dgit"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/Makefile
    source: "dgit-debian-15.13.tar.gz/tests/Makefile"
    description: "上游 make test 需要 Debian 环境（Dpkg::Control::Hash 等），OHOS 平台无法执行"
    command: "make test"

test_package_tests:
  - file: test.sh
    description: "验证 Debian::Dgit::ExitStatus 模块可加载并调用其特有 API finish(42)（fork 子进程断言退出码 42）、dgit 脚本在 PATH 中存在且可执行、Debian/Dgit.pm 文件存在于 PERL5LIB"
    command: "./test.sh"

assertion_count: 3
