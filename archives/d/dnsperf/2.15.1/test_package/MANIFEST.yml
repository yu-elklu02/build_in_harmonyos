package: dnsperf/2.15.1
upstream_test_in_build: false
upstream_tests:
  - file: src/test/test1.sh
    description: "Help output, suppression argument validation and v2.11.x regression checks (no network)"
  - file: src/test/test2.sh
    description: "Live queries against 1.1.1.1 incl. TSIG/dynamic update/DoT (skipped unless TEST_DNSPERF_WITH_NETWORK=1)"
  - file: src/test/test3.sh
    description: "Invalid argument error paths (no network)"
  - file: src/test/test4.sh
    description: "Query data file format checks against network (network gated)"
  - file: src/test/test5.sh
    description: "Throughput test against local dumdumd DNS server (network gated)"
  - file: src/test/test6.sh
    description: "NXDOMAIN statistics (network gated)"
  - file: src/test/test7.sh
    description: "Malformed blob input error paths (local) and sent/lost statistics (network part)"
upstream_test_note: "make check 在无网络环境执行时，test2/4/5/6 经 TEST_DNSPERF_WITH_NETWORK 守卫跳过（exit 0），test1/3/7 的本地部分实际运行二进制。"
test_package_tests:
  - file: test_dnsperf.sh
    description: "Help output, argument validation, upstream regression and malformed-input error paths of dnsperf/resperf"
    command: "dnsperf -h; resperf -h; negative argument tests; empty blob rejection"
assertion_count: 10
