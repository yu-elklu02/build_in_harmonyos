package: docopt.cpp/0.6.3
homepage: "https://github.com/docopt/docopt.cpp"

upstream_check_command: "cmake -DWITH_TESTS=ON -DWITH_EXAMPLE=ON; cmake --build"
upstream_test_in_build: true
upstream_test_command: "docopt_example ship Guardian move 10 20 --speed=7"

upstream_tests:
  - file: examples/naval_fate.cpp
    source: docopt.cpp-0.6.3/examples/naval_fate.cpp
    description: "Official example exercises docopt parsing during the recipe build"
    command: "docopt_example ship Guardian move 10 20 --speed=7"
  - file: testcases.docopt
    source: docopt.cpp-0.6.3/testcases.docopt
    description: "175 upstream parser cases executed by the Python 3-ported runner"
    command: "LD_LIBRARY_PATH=<build_folder> python3 run_tests"

test_package_tests:
  - file: test.cpp
    description: "Consumer includes <docopt/docopt.h>, calls docopt_parse, and validates command, positional, boolean, and valued options"
    command: "./test_docopt"
  - file: test_secondary.cpp
    description: "Generated source compiled into the consumer test; it calls docopt_parse"
    command: "compiled into ./test_docopt"

assertion_count: 6
