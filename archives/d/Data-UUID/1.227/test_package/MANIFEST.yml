# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: data-uuid/1.227
homepage: "https://metacpan.org/pod/Data::UUID"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/basic.t
    source: Data-UUID-1.227/t/basic.t
    description: "上游 UUID 基本功能测试 (create, to_string, from_string, compare, uniqueness)"
    command: "perl -Iblib/lib -Iblib/arch t/basic.t"
  - file: t/from-name-collisions.t
    source: Data-UUID-1.227/t/from-name-collisions.t
    description: "上游 v3 UUID 命名冲突测试"
    command: "perl -Iblib/lib -Iblib/arch t/from-name-collisions.t"
  - file: t/segv.t
    source: Data-UUID-1.227/t/segv.t
    description: "上游段错误回归测试"
    command: "perl -Iblib/lib -Iblib/arch t/segv.t"
  - file: t/leaky_dollar_bang.t
    source: Data-UUID-1.227/t/leaky_dollar_bang.t
    description: "上游 $! 泄漏测试"
    command: "perl -Iblib/lib -Iblib/arch t/leaky_dollar_bang.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_uuid.sh
    description: "消费者测试：加载 Data::UUID 模块并调用 create_str, to_string, from_string, compare API"
    command: "sh test_uuid.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 28
