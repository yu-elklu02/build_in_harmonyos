software: dsdp
display: "DSDP"
description: "半定规划（SDP）对偶尺度内点法求解器"
category: foundation
homepage: "https://www.mcs.anl.gov/hs/software/DSDP/"
license: DSDP
build_system: makefile

ohos_adaptation:
  key_points:
    - "make.include 里 CC=gcc、ARCH='ar cr'、RANLIB=ranlib 全是裸名；OHOS 无 gcc 且最小 PATH 下裸名找不到，须命令行覆盖成全路径"
    - "上游 oshared 目标不可用：依赖被注释掉的 SH_LD，且写法 -Wl,-soname,<全路径> 会把 soname 烤成绝对路径。共享库须自己从静态库 --whole-archive 导出并给纯 soname"
    - "上游 install 目标名不副实（实为 make example/test/dmatlab），安装步骤须自己做"

versions:
  "5.8":
    status: built
    build_date: "2026-07-29"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8），依赖 openblas；真机原生 conan create 验证，test_package 真解一个半定规划并校验最优解，8 条断言全绿；产 libdsdp.so.5"
    dependencies:
      - openblas/0.3.34
    provides:
      - libdsdp.so.5
