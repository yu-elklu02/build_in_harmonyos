software: dsdp
version: "5.8"
status: built
build_date: "2026-07-29"
build_system: makefile

source:
  url: "https://www.mcs.anl.gov/hs/software/DSDP/DSDP5.8.tar.gz"
  sha256: "26aa624525a636de272c0b329e2dfd01a0d5b7827f1c1c76f393d71e37dead70"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  make_args:
    - "dsdplibrary"
    - "CC=<hnp>/clang"
    - "ARCH=<hnp>/llvm-ar cr"
    - "RANLIB=<hnp>/llvm-ranlib"
    - "OPTFLAGS=-O2 -fPIC"
  dependencies:
    - openblas/0.3.34

patches_count: 0

knowledge_gained:
  - "DSDP 5.8 的 make.include 里 CC=gcc、ARCH='ar cr'、RANLIB=ranlib 全是裸名。OHOS 无 gcc，且 conan 的 self.run 走 /bin/sh、最小 PATH 下裸名也找不到 → 必须命令行覆盖成全路径。"
  - "上游 oshared 目标不可用：它依赖 make.include 里被注释掉的 SH_LD，且写法是 -Wl,-soname,${DSDPLIBSO}——soname 会被烤成全路径，下游 DT_NEEDED 随之烤死绝对路径（本仓 expat/poppler 都栽过）。故共享库自己从静态库 --whole-archive 导出并给纯 soname libdsdp.so.5。"
  - "上游 install 目标名不副实（实为 make example/test/dmatlab），安装步骤须自己做，含版本软链。"
