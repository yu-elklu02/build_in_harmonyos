version: "3.6"
status: published
build_date: "2026-07-01"

source:
  url: "https://download.savannah.gnu.org/releases/dmidecode/dmidecode-3.6.tar.xz"
  sha256: "e40c65f3ec3dafe31ad8349a4ef1a97122d38f65004ed66575e1a8d575dd8bae"
  tar_format: tar.xz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  build_command: "make CC=$CC -j1 (CC from Conan conf tools.build:compiler_executables)"

patches_applied: []

binary:
  type: executable
  path: bin/dmidecode
  elf: "ELF 64-bit LSB arm64, dynamic (/lib/ld-musl-aarch64.so.1)"
  sha256: "94149842aff4fbb69ed038fa816abee2dd0cc223f7afec4ceec6f2900f842b7c"
  security:
    relro: true
    nx: true

conan:
  verified: true
  verification_date: "2026-07-01"
  gates:
    g0: PASS
    g1: PASS
    g2: PASS
    g3: PASS
    g4: PASS
    l2: PASS
    l4: PASS
    l5: PASS

knowledge_gained:
  - "dmidecode 是纯 Makefile 项目，原生兼容 HarmonyOS 交叉编译"
  - "无需任何补丁即可成功编译"
  - "Makefile 使用 CC ?= gcc，需设置 CC=clang"
  - "config.h 已包含 __aarch64__ 支持 (USE_SLOW_MEMCPY)"
  - "HarmonyOS 无 /dev/mem 和 sysfs DMI 表，直接读取硬件信息不可用"
  - "--from-dump 离线分析功能完全可用，SMBIOS 解析引擎正确"
  - "test_package 需使用 package_folder 直接构建二进制路径，VirtualRunEnv 依赖 /bin/sh 不可用"
  - "SSL_CERT_FILE=/etc/ssl/certs/cacert.pem 需设置以解决 conan 下载 SSL 问题"
