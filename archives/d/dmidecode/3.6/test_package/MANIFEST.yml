# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dmidecode/3.6
homepage: "https://www.nongnu.org/dmidecode/"

# dmidecode has no automated test suite; make check is not supported
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试
upstream_tests: []

# test_package 中的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "L2 smoke test: 运行 dmidecode --version 验证二进制可用并检查版本号"
    command: "dmidecode --version"

# 测试断言总数
assertion_count: 2
