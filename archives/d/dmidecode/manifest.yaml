software: dmidecode
display: "dmidecode"
description: "读取 SMBIOS/DMI 数据的命令行工具，显示硬件信息"
category: system
homepage: "https://www.nongnu.org/dmidecode/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，make CC=clang -j1 即可"
    - "无需补丁，原生兼容 HarmonyOS"
    - "config.h 已有 __aarch64__ 支持 (USE_SLOW_MEMCPY)"
    - "HarmonyOS 无 /dev/mem，直接读取硬件 DMI 不可用"
    - "--from-dump 离线分析功能完全可用"
  common_dependencies: []

versions:
  "3.6":
    status: published
    build_date: "2026-07-01"
    conan_verified: true
