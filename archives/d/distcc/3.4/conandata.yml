sources:
  url: "https://github.com/distcc/distcc/releases/download/v3.4/distcc-3.4.tar.gz"
  sha256: "2b99edda9dad9dbf283933a02eace6de7423fe5650daa4a728c950e5cd37bd7d"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Add HarmonyOS platform detection to config.guess"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Add HarmonyOS platform detection to config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Fix temporary directory permissions in configure script"
    patch_type: "portability"
  - patch_file: "patches/0004-include_server-setup.py.patch"
    patch_description: "Replace removed distutils module with setuptools in include_server/setup.py for Python 3.12+ compatibility"
    patch_type: "portability"
  - patch_file: "patches/0005-src-arg.c.patch"
    patch_description: "Fix unused parameter warning in copy_extra_args when NDEBUG is defined (Release builds)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-stats.c.patch"
    patch_description: "Fix function declarations in src/stats.c for strict prototypes"
    patch_type: "portability"
  - patch_file: "patches/0007-src-where.c.patch"
    patch_description: "Fix function declarations in src/where.c for strict prototypes"
    patch_type: "portability"
