# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: distcc/3.4
homepage: "https://distcc.github.io/"

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "make check"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: testdistcc.py
    source: distcc-3.4/test/testdistcc.py
    description: "Comprehensive test suite for distcc client/server functionality"
    command: "make check"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run distcc --version to verify binary is functional"
    command: "distcc --version"

# Test assertion count (approximate, for quality assessment)
assertion_count: 1
