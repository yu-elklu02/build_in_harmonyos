software: distcc
display: "distcc"
description: "Distributed C/C++ compiler system that distributes compilation tasks across multiple machines"
category: build-tool
homepage: "https://distcc.github.io/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要更新 config.guess/config.sub 添加 HarmonyOS 支持"
    - "configure 脚本需要适配"
    - "src/stats.c 和 src/where.c 需要平台适配（函数声明 void 参数）"
    - "include_server/setup.py 需要将 distutils 替换为 setuptools（Python 3.12 兼容）"
    - "configure 需要 --without-libiberty（HarmonyOS 无 libiberty）"
  common_dependencies: []

versions:
  "3.4":
    status: built
    build_date: "2026-08-06"
