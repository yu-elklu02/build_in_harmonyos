# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dmg2img/1.6.7
homepage: "http://vu1tur.eu.org/tools/"

# 上游测试命令
upstream_check_command: "make check"

# dmg2img has no automated test suite (make check not defined)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run dmg2img binary and verify version string output"
    command: "dmg2img 2>&1 | grep 'dmg2img v1.6.7'"

# 测试断言总数
assertion_count: 1
