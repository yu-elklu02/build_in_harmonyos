software: dmg2img
display: "dmg2img"
description: "将 Apple DMG 磁盘映像转换为 IMG/raw 格式的工具"
category: system
homepage: "http://vu1tur.eu.org/tools/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "简单 Makefile 项目，无 configure"
    - "LZFSE 支持需条件编译 (HAVE_LZFSE)"
    - "OpenSSL API 兼容性需要处理（EVP_CIPHER_CTX/HMAC_CTX）"
    - "conan 依赖需通过 CFLAGS/LDFLAGS 传递到 make 命令行"
  common_dependencies:
    - zlib
    - bzip2
    - openssl

versions:
  "1.6.7":
    status: built
    build_date: "2026-08-06"
