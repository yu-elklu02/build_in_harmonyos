# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: deark/1.7.2
homepage: "https://entropymine.com/deark/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# deark 不包含自动化测试套件，无 make check 目标
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_deark.sh
    description: "运行 deark --version 验证版本输出"
    command: "deark --version"
  - file: test_deark.sh
    description: "运行 deark -modules 验证模块列表"
    command: "deark -modules"
  - file: test_deark.sh
    description: "运行 deark --license 验证许可证输出"
    command: "deark --license"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
