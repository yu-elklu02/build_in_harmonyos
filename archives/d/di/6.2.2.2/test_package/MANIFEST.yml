# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: di/6.2.2.2
homepage: "https://diskinfo-di.sourceforge.io"

# 上游测试入口（localtest.sh 完整执行但 2 项因 OHOS 无 /etc/mtab 预期失败）
upstream_check_command: "cmake --build <build> --target ditest（dimathtest + getoptn_test + di CLI 检查）"

# conanfile.py build() 中实际执行的上游测试
# localtest.sh 不在 build() 中执行（因 OHOS 无 /etc/mtab 有 2 项必败）
upstream_test_in_build: true
upstream_test_command: "dimathtest（45/45 PASS）&& getoptn_test（52/52 PASS）"

# 上游实际运行的测试程序
upstream_tests:
  - file: dimathtest.c
    source: di-6.2.2.2/dimathtest.c
    description: "数学精度/转换/比较用例 — 45/45 PASS"
    command: "./dimathtest"
  - file: getoptn.c (TEST_GETOPTN)
    source: di-6.2.2.2/getoptn.c
    description: "选项解析用例 — 52/52 PASS"
    command: "./getoptn_test"
  - file: tests/localtest.sh
    source: di-6.2.2.2/tests/localtest.sh
    description: "localtest.sh — di --version 和 di -X 1 通过；di -n / 和 DI_ARGS=... di -n / 因 OHOS 无 /etc/mtab 输出为空失败（2 项预期失败）"
    command: "cmake --build <build> --target ditest（2/4 PASS）"

# test_package 中自带的测试（OHOS 替代验证，4/4 全部通过）
test_package_tests:
  - file: conanfile.py (test method)
    description: "OHOS 替代验证 1/4: di --version — 确认版本字符串输出"
    command: "di --version"
  - file: conanfile.py (test method)
    description: "OHOS 替代验证 2/4: di -? — 确认帮助/用法输出"
    command: "di -?"
  - file: conanfile.py (test method)
    description: "OHOS 替代验证 3/4: di / — 基础执行不崩溃，覆盖挂载表检查入口"
    command: "di /（exit code 4 因无 /etc/mtab，仅验证不崩溃）"
  - file: test_di_consumer.c
    description: "OHOS 替代验证 4/4: libdi 消费者 — 编译/链接/API 调用（di_initialize + di_version + di_cleanup）"
    command: "./test_di_consumer"

# 测试断言总数（近似值，用于质量评估）
# 上游 101 + OHOS 替代验证 4
assertion_count: 105
