software: disomaster
display: "DISOMaster"
description: "Qt wrapper for optical-disc image creation, burning, erasing, and media inspection"
category: multimedia
homepage: "https://github.com/linuxdeepin/disomaster"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游使用 qmake 构建，改为 CMake 构建系统"
    - "上游使用 libisoburn C API，改为 QProcess 调用 xorriso CLI 后端"
    - "xorriso 预构建二进制来自 PR !831（静态链接，无开发头文件）"
    - "需要手动生成 moc 源码（disomaster.h 含 Q_OBJECT/Q_ENUM/信号）"
  common_dependencies:
    - qt5-qtbase
    - xorriso

versions:
  "5.0.8":
    status: built
