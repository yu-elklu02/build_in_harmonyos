# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: disomaster/5.0.8
homepage: "https://github.com/linuxdeepin/disomaster"

# 上游测试命令（需要 qmake 构建）
upstream_check_command: "qmake BUILD_TESTS=1 && make && ./tests/tests"

# conanfile.py build() 方法中未集成上游测试
# 上游测试需要物理光驱，CI 环境无法满足
upstream_test_in_build: false
upstream_test_command: "./tests/tests"
upstream_test_count: 6
upstream_test_pass_count: 0
upstream_test_status: "not_executed"
upstream_test_reason: "All upstream tests require a physical optical drive; writeFiles, erase, isoWrite, and dumpISO alter optical media and are unsafe for unattended CI"

# 上游实际测试程序
upstream_tests:
  - file: "tests/testdisomaster.cpp"
    name: "test_getDevice"
    description: "Acquire an optical drive and inspect cached media properties"
    requires: "DISOMASTERTEST_DEVICE and a physical optical drive"
  - file: "tests/testdisomaster.cpp"
    name: "test_writeFiles"
    description: "Stage files and burn them to optical media"
    requires: "DISOMASTERTEST_DEVICE, DISOMASTERTEST_DATAPATH, writable optical media"
  - file: "tests/testdisomaster.cpp"
    name: "test_erase"
    description: "Erase rewritable optical media"
    requires: "DISOMASTERTEST_DEVICE and rewritable optical media"
  - file: "tests/testdisomaster.cpp"
    name: "test_isoWrite"
    description: "Write an ISO image to optical media"
    requires: "DISOMASTERTEST_DEVICE, DISOMASTERTEST_ISOFILE, writable optical media"
  - file: "tests/testdisomaster.cpp"
    name: "test_checkMedia"
    description: "Read all media regions and calculate quality ratios"
    requires: "DISOMASTERTEST_DEVICE and readable optical media"
  - file: "tests/testdisomaster.cpp"
    name: "test_dumpISO"
    description: "Dump optical media to an ISO image"
    requires: "DISOMASTERTEST_DEVICE, DISOMASTERTEST_ISOFILE, readable optical media"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "Non-destructive public API consumer test with 34 assertions using a fake xorriso process"
    command: "./test_disomaster ./fake_xorriso"
  - file: fake_xorriso.c
    description: "Deterministic xorriso-compatible process that validates argument lists"
    command: "invoked by test_disomaster"
  - file: conanfile.py
    description: "Run the reused xorriso backend version command"
    command: "xorriso -version"

# 测试断言总数
assertion_count: 34
