version: "5.0.8"
status: built

source:
  url: "https://github.com/linuxdeepin/disomaster/archive/refs/tags/5.0.8.tar.gz"
  sha256: "9f8de28dbb8a3f624fde060ba3b8d73744a0c63eecfb1f9cc6253685e278bd8d"
  tar_format: tar.gz

build:
  system: cmake
  dependencies:
    - qt5-qtbase/5.15.2
    - xorriso 1.5.8.pl02 (预构建，来自 PR !831)
  cc: clang
  cxx: clang++
  ohos_profile:
    os: OHOS
    os.version: "6.0"
    arch: armv8
    compiler: clang
    compiler.version: 15
    compiler.cppstd: 17
    compiler.libcxx: libc++

patches_applied:
  - "0001-xorriso-cli-backend.patch"

xorriso_prebuilt:
  version: "1.5.8.pl02"
  url: "https://gitcode.com/OpenHarmonyPCDeveloper/cmd-pkgs/releases/download/pkgs/libisoburn-1.5.8.pl02-ohos-aarch64.tar.gz"
  sha256: "3b3308d0d2830cb6ccf688e4a8a182477c93c132c65b1dece9f062f9df7876ee"
  source_pr: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/pull/831"

upstream_tests:
  total: 6
  executed: 0
  reason: "All upstream tests require a physical optical drive; writeFiles, erase, isoWrite, and dumpISO alter optical media and are unsafe for unattended CI"

test_package:
  assertions: 34
  status: passed
  description: "Non-destructive public API consumer test using fake_xorriso process"
  xorriso_version_check: passed

known_limitations:
  - "xorriso 预构建包为静态链接可执行文件，无开发头文件，无法直接链接 libisoburn"
  - "使用 QProcess 调用 xorriso CLI 替代 libisoburn C API，性能略低于直接调用"
  - "进度信号基于 xorriso 输出解析，实时性取决于 xorriso 输出频率"
  - "上游 6 个测试均需要物理光驱，CI 环境无法执行"
  - "EjectDisc 选项尚未实现（上游也标记为 not used yet）"

validation:
  completed: true
  build_verified: "OHOS aarch64 真机 conan create 编译通过"
  test_verified: "34 个断言全部通过，xorriso -version 命令执行成功"
  pending:
    - "物理光驱设备功能验证"

knowledge_gained:
  - "disomaster 5.0.8 是 qmake 构建的 Qt5 库，需要改为 CMake 构建"
  - "上游直接调用 libisoburn C API，OHOS 仅有 xorriso 可执行文件无开发头文件"
  - "通过 QProcess 调用 xorriso CLI 可实现所有光盘操作功能"
  - "disomaster.h 含 Q_OBJECT/Q_ENUM/信号，需要 moc 生成元对象源码"
  - "OHOS HMDFS 文件系统不支持 chmod 修改文件权限，所有文件默认 770"
  - "OHOS 动态链接器要求 .so 文件必须经过 binary-sign-tool 代码签名才能加载（ML-0043）"
  - "CMakeDeps 组件级 includedirs/libdirs 在此环境未正确传递，需要手动传递 Qt5 路径"
  - "Conan profile 需要 os.version=6.0 配置才能匹配已安装的 qt5-qtbase 包"
