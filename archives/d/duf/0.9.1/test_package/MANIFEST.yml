# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# duf 是 Go 命令行应用（Disk Usage/Free utility，类似 df 但更美观）。
# 上游通过 `go test ./...` 运行单元测试（mounts_linux_test.go 等），
# 测试代码为 hermetic 纯逻辑测试（getFields 字段解析断言）。
# 本机开发环境（HMDFS）无法执行 static ET_EXEC 的 Go 工具链（低 PHDR vaddr 被
# 内核拒绝），因此 `go test ./...` 在 conanfile.py build() 中集成到 CI 阶段：
# 当 runner 具备可用 Go 工具链时真实执行 `go test ./...` 并把结果写入
# go-test-report.txt 与构建日志。test_package 采用 R34 冒烟测试：运行
# `duf --version` 验证二进制可用性。

package: duf/0.9.1
homepage: "https://github.com/muesli/duf"

# 上游测试命令分析
# R5: 上游测试在 CI 构建阶段（conanfile.py build()，go 可用时）真实运行
upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序（Go 单元测试，CI 阶段在具备 Go 工具链的 runner 上执行）
upstream_tests:
  - file: mounts_linux_test.go
    source: duf-0.9.1/mounts_linux_test.go
    description: "getFields 字段解析单元测试（hermetic，纯逻辑）"
    command: "go test -run TestGetFields"

# test_package 中自带的测试（消费者视角验证）
# R34: 调用被测包的实际二进制（duf --version），非空壳 stub
test_package_tests:
  - file: conanfile.py
    description: "运行 duf --version，验证二进制可执行且输出包含 'duf'"
    command: "duf --version"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
