software: duf
version: "0.9.1"
status: built
build_date: "2026-08-06"
build_system: custom

source:
  url: "https://github.com/muesli/duf/archive/refs/tags/v0.9.1.tar.gz"
  sha256: "1334d8c1a7957d0aceebe651e3af9e1c1e0c6f298f1feb39643dd0bd8ad1e955"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "TMPDIR=/data/storage/el2/base/cache"
    - "GOROOT=/storage/Users/currentUser/usr/local/go"
  dependencies: []
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "E091: Go linker 在鸿蒙上需要 TMPDIR=/data/storage/el2/base/cache 才能正常工作（mapping output file 权限问题）"
  - "E002: GOROOT 必须设置为 ~/usr/local/go（Go 1.24.2），不能使用默认 ~/usr/local（包含 go1.23.6 标准库）"
  - "E045: Go 工具链的 link/compile/asm 需要先 ELF 签名才能正常执行（鸿蒙 ELF 签名要求）"
  - "PIE buildmode 在鸿蒙上导致 segfault（CGO_ENABLED=0 + buildmode=pie 产生动态链接二进制，/lib/ld-musl-aarch64.so.1 不可用），使用非PIE buildmode + ELF签名替代"
  - "HMDFS 文件系统不支持 Go linker 的 mmap 操作，必须使用 /data/storage/el2/base/cache 作为 TMPDIR"
  - "Conan env list 不向 Go 子进程传递环境变量，必须使用 env 命令前缀内联设置"