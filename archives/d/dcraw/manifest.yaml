software: dcraw
display: "dcraw"
description: "Command-line decoder for raw digital photos"
category: multimedia
homepage: "https://www.dechifro.org/dcraw/"
license: LicenseRef-dcraw-custom

build_system: custom

ohos_adaptation:
  key_points:
    - "The upstream release is a single ANSI C source file without configure or Makefile."
    - "Compile with -DNODEPS so the package has no Jasper, JPEG, or Little CMS dependency."
    - "Install the executable and man page directly because the upstream installer assumes a POSIX shell and host tools."
    - "Sign the executable during OHOS packaging so the test package can execute it on the target worker."
  common_dependencies: []

versions:
  "9.28.0":
    status: built
    build_date: 2026-07-17
