# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: dtach/0.9
homepage: "https://dtach.sourceforge.net/"

upstream_check_command: "none (upstream has no automated test suite)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_dtach.py
    description: "dtach --version, --help, and detached session smoke test"
    command: "python3 test_dtach.py"

assertion_count: 3
