software: dtach
display: "dtach"
description: "模拟 screen 的 detach 功能，允许将程序脱离终端会话并在稍后重新连接"
category: system
homepage: "https://dtach.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "configure/config.status 中 umask 077 在 HMDFS 上创建临时目录会导致 Permission denied（E011），需移除 umask 077"
    - "原版 Makefile.in 无 install 目标，需添加 install target 及 DESTDIR 支持"
  common_dependencies: []

# 版本索引
versions:
  "0.9":
    status: built
    build_date: "2026-06-12"
