# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: djvu2pdf/1.0
homepage: "https://github.com/vindvaki/djvu2pdf"

# 上游无测试（Shell 脚本工具）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_djvu2pdf.sh 验证 djvu2pdf 脚本已安装、可执行且语法正确"
    command: "conan create (test_package: bash test_djvu2pdf.sh <bin_dir>)"
  - file: test_djvu2pdf.sh
    description: "真实冒烟测试:检查 bin/ 下 djvu2pdf(bash)和 djvu2pdf_toc_parser.py(python)存在且可执行、shebang 检查、语法检查通过"
    command: "bash test_djvu2pdf.sh <package bin dir>"

assertion_count: 7
