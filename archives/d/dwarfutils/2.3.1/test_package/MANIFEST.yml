# test_package/MANIFEST.yml
# dwarfutils 测试声明文件

package: dwarfutils/2.3.1
homepage: https://www.prevanders.net/dwarf.html

# 上游测试命令（libdwarf CMake 构建：设置 DO_TESTING=ON，通过 ctest 运行）
upstream_check_command: "cmake -DDO_TESTING=ON .. && cmake --build . && ctest -R self"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -R self --output-on-failure"

# 上游实际运行的测试程序
# libdwarf 上游 CMake 测试套件：-DDO_TESTING=ON 启用，测试名称以 "self" 开头，
# 覆盖 libdwarf API、DWARF 格式解析、dwarfdump 输出等核心功能
upstream_tests:
  - file: test/
    source: libdwarf-2.3.1/test/
    description: "libdwarf 官方测试套件 — 覆盖 API/格式解析/dwarfdump 输出等，通过 ctest -R self 运行"
    command: "cmake -DDO_TESTING=ON .. && cmake --build . && ctest -R self --output-on-failure"

test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(dwarfutils) + target_link_libraries — 验证库可被正确发现和链接"
    command: "cmake -S . -B build"
  - file: test_package/conanfile.py
    description: "dwarfdump --version + dwarf_init_path API 调用 — 验证二进制可执行及库 API 可调用"
    command: "conan test"

assertion_count: 2
