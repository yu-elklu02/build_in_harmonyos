version: "7.5.4"
software: dos2unix
status: built
build_date: "2026-04-02"
build_system: makefile

source:
  url: "https://sourceforge.net/projects/dos2unix/files/dos2unix/7.5.4/dos2unix-7.5.4.tar.gz"
  sha256: "f811a2b9e4a0c936c61ef7c1732993d1820e5cf011f4d93861885ccb8101ca21"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "ENABLE_NLS disabled (set to empty value)"
    - "LINK changed from ln -sf to cp -f"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "Makefile 项目使用 'ifdef VAR' 判断时，空值才能禁用（'0' 也被视为 true）"
  - "HarmonyOS SELinux: ln -sf 在部分目录失败，需用 cp -f 替代"
  - "dos2unix 核心功能（CRLF/LF 转换）完全正常，115/115 测试全部通过"
  - "test_package 验证 dos2unix --version 和 CRLF→LF 转换功能"

compatibility:
  level: high
  issues:
    - "NLS/i18n 支持已禁用（无 gettext/libintl）"
