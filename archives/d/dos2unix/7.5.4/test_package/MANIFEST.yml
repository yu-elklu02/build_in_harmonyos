# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: dos2unix/7.5.4
homepage: "https://waterlan.home.xs4all.nl/dos2unix.html"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/ascii.t
    source: dos2unix-7.5.4/test/ascii.t
    description: "ASCII conversion tests (30 tests)"
    command: "prove ascii.t"
  - file: test/iso.t
    source: dos2unix-7.5.4/test/iso.t
    description: "ISO charset conversion tests (14 tests)"
    command: "prove iso.t"
  - file: test/misc.t
    source: dos2unix-7.5.4/test/misc.t
    description: "Miscellaneous conversion tests (17 tests)"
    command: "prove misc.t"
  - file: test/bom.t
    source: dos2unix-7.5.4/test/bom.t
    description: "BOM handling tests (8 tests)"
    command: "prove bom.t"
  - file: test/noeol.t
    source: dos2unix-7.5.4/test/noeol.t
    description: "No-end-of-line tests (25 tests)"
    command: "prove noeol.t"
  - file: test/stdio.t
    source: dos2unix-7.5.4/test/stdio.t
    description: "Stdin/stdout pipe tests (7 tests)"
    command: "prove stdio.t"
  - file: test/symlink.t
    source: dos2unix-7.5.4/test/symlink.t
    description: "Symbolic link handling tests (14 tests)"
    command: "prove symlink.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "dos2unix/unix2dos --version smoke test + functional CRLF→LF conversion test"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 115
