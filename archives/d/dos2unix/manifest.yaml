software: dos2unix
display: "dos2unix"
description: "DOS/MAC 与 Unix 文本格式转换工具，支持 Unicode UTF-16"
category: system
homepage: "https://waterlan.home.xs4all.nl/dos2unix.html"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本"
    - "必须禁用 NLS（HarmonyOS 缺少 libintl/gettext）"
    - "注意：ENABLE_NLS=0 也会被 ifdef 视为 true，必须设为空值"
    - "HarmonyOS SELinux 限制 ln -sf，需改为 cp -f"
  common_dependencies: []

versions:
  "7.5.4":
    status: built
    build_date: "2026-04-02"
