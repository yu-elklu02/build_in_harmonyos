software: dockerfile-language-server
version: 0.0.24
status: built
build_date: 2026-08-06
date: 2026-08-06
build_system: nodejs
source_url: https://github.com/rcjsuen/dockerfile-language-server-nodejs/archive/refs/tags/v0.0.24.tar.gz
sha256: f79efb3b226f052cf01b83a710fb500f7c15fa7a8768495a3a16ab27bf777dfb

dependencies:
  runtime:
    - node >= 12.0.0
    - dockerfile-language-service 0.0.12
    - dockerfile-utils 0.0.11
    - vscode-languageserver ^6.1.1
  build:
    - typescript ^3.7.5
    - npm >= 6.0.0

build_command:
  - npm install --ignore-scripts
  - npm run prepublish

install_command:
  - conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --user=ohpcd --channel=stable

test_command:
  - npm test

conan_recipe:
  package_type: application
  build_system: nodejs
  settings: os, arch
  bindirs: bin

notes: |
  Node.js project using npm + TypeScript compiler.
  Build: npm install (installs deps) + npm run prepublish (tsc -p ./src, compiles to lib/).
  Output: bin/docker-langserver (Node.js script), lib/server.js, node_modules/.
  Conan recipe packages the compiled application with bundled node_modules.

platform_support:
  ohos_arm64: native
