# test_package/MANIFEST.yml — dockerfile-language-server 0.0.24
# CI L0e requires this file to exist.

package: dockerfile-language-server/0.0.24
homepage: "https://github.com/rcjsuen/dockerfile-language-server-nodejs"

# Node.js project: uses npm test (mocha) for upstream tests
upstream_check_command: "npm test"
upstream_test_in_build: false
upstream_test_command: "npm test"

# Upstream tests (mocha-based, in test/ directory of source)
upstream_tests:
  - file: "test/server.test.ts"
    source: "dockerfile-language-server-nodejs-0.0.24/test/server.test.ts"
    description: "Mocha test suite for the Dockerfile language server"
    command: "npm test"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Verifies docker-langserver binary exists, is a Node.js script, and handles LSP initialize request without crashing"
    command: "bash test.sh"

# Approximate assertion count (binary check + script check + server.js check + LSP handshake)
assertion_count: 5
