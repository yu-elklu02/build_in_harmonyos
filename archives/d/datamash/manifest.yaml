software: datamash
display: "GNU Datamash"
description: "GNU Datamash is a command-line program which performs basic numerical, textual and statistical operations on input data files"
category: data
homepage: "https://www.gnu.org/software/datamash/"
license: GPL-3.0-or-later
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "补丁扩展 config.guess，使其识别 HarmonyOS 与 __OHOS__"
    - "上游 config.sub 已支持 linux-ohos，无需重复修改"
    - "configure 临时目录使用 umask 022，兼容 HMDFS 权限模型"
    - "使用 install-exec 安装命令，避免重新生成 Texinfo 文档"
    - "完整执行上游 make check，不修改或删除上游测试"
  common_dependencies: []

# 版本索引
versions:
  "1.9":
    status: built
    build_date: "2026-07-26"
    patches_count: 2
