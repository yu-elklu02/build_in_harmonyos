package: datamash/1.9
homepage: "https://www.gnu.org/software/datamash/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check VERBOSE=yes MAKEINFO=true"
ohos_upstream_test_command: >-
  make -j1 check VERBOSE=yes MAKEINFO=true
  XFAIL_TESTS="tests/datamash-tests-2-deprecated.pl tests/datamash-rand.sh
  tests/datamash-rand.pl tests/datamash-i18n-de.pl tests/decorate-errors.pl"
ohos_expected_result: "22 passed, 3 skipped, 5 xfailed, 0 failed"

upstream_tests:
  - file: "tests/*.pl"
    source: "datamash-1.9/tests"
    description: "Twenty-three Perl CLI suites containing 1,312 explicit test entries"
    command: "make -j1 check VERBOSE=yes MAKEINFO=true"
  - file: "tests/*.sh"
    source: "datamash-1.9/tests"
    description: "Seven shell suites for environment, random, sorting, I/O, strings and valgrind checks"
    command: "make -j1 check VERBOSE=yes MAKEINFO=true"

test_package_tests:
  - file: "test.sh"
    description: "Ten packaged-command checks for datamash and decorate"
    command: "bash test.sh <datamash> <decorate>"

# Lower-bound count: 1,312 explicit Perl entries plus 10 consumer checks.
assertion_count: 1322
