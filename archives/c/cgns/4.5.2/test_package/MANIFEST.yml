# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cgns/4.5.2
homepage: "https://github.com/CGNS/CGNS"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# CGNS_ENABLE_TESTS 和 CGNS_BUILD_TESTING 均未启用，上游测试套件被禁用
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "消费者测试 — 调用 cg_open 验证 CGNS 库链接和基本 API 可用性"
    command: "./test_cgns"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
