# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: circumflex/4.5
homepage: "https://github.com/bensadeh/circumflex"

# 上游测试命令（go test；OHOS CI 无 Go 工具链未执行）
upstream_check_command: "go test"
upstream_test_in_build: false
upstream_test_command: "go test"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_failed_archive.py
    description: "验证失败归档包含明确状态(status: failed)、失败原因(Go 工具链缺失)与 OHOS 说明"
    command: "python3 test_failed_archive.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
