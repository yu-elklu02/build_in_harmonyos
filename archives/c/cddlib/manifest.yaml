name: cddlib
description: 双描述法（Double Description Method）多面体计算库
category: math
license: GPL-2.0-or-later
website: https://github.com/cddlib/cddlib
source_url: https://github.com/cddlib/cddlib/releases
build_system: autotools
versions:
  - version: "0.94m"
    status: built
    build_date: "2026-08-12"
    notes: >-
      SageMath / passagemath 计算代数栈的底层依赖。装出 libcdd(double) 与
      libcddgmp(mpq_t) 两套 ABI 不同的库，共用同一个 cdd.h，靠 GMPRATIONAL 宏
      决定 mytype——链 libcddgmp 却漏定义该宏时编译链接全过、运行时 Signal 11，
      详见 notes.md。test_package 做真实计算断言（单位正方形求顶点数=4）。
