package: curl/8.15.0
homepage: "https://curl.se/"

upstream_check_command: "perl tests/runtests.pl -a"
upstream_test_in_build: true
upstream_test_command: "cmake --build <build> --target testdeps"
upstream_tests:
  - file: tests/data/test1
    description: "Representative HTTP transfer test definition"
  - file: tests/unit/unit1300.c
    description: "Representative libcurl unit test source"
  - file: tests/tunit/tunit.c
    description: "curl command-line tool unit-test harness"
  - file: tests/libtest/lib500.c
    description: "Representative libcurl protocol test client"
  - file: tests/server/sws.c
    description: "HTTP test server used by the upstream harness"

test_package_tests:
  - file: test.c
    description: "Validate libcurl initialization, options, version, OpenSSL, and zlib"
    command: "./test_curl"

assertion_count: 9
