software: clang
version: "20.1.8"
build_date: "2026-08-05"
build_system: cmake
status: built
conan_ref: "clang/20.1.8"

source:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz"
  sha256: "6898f963c8e938981e6c4a302e83ec5beb4630147c7311183cf61069af16333d"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLLVM_TARGETS_TO_BUILD=AArch64"
    - "-DLLVM_HOST_TRIPLE=aarch64-unknown-linux-ohos"
    - "-DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-unknown-linux-ohos"
    - "-DLLVM_ENABLE_PROJECTS=clang"
    - "-DLLVM_ENABLE_RUNTIMES="
    - "-DLLVM_ENABLE_ASSERTIONS=OFF"
    - "-DLLVM_INCLUDE_TESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0004-lit-util-PWD-sync.patch"
  - "patches/0005-gtest-port-TMPDIR.patch"

knowledge_gained:
  - "clang 20.1.8 适配路径 A：鸿蒙 PC 真机原生编译（不设 CMAKE_SYSTEM_NAME → 不触发交叉 → llvm-tblgen 原生编+跑），默认 triple aarch64-unknown-linux-ohos"
  - "runtimes 不源码构建（SDK libc++ 15 头与 clang 20 不兼容、musl 缺 rune table/strtoll_l）：compiler-rt builtins/libunwind/libc++ 及 CRT 文件全部在 package() 中从 SDK 复制（对齐手工 llvm-build 先例），R26 合规（不输出 libc++.so 等系统同名库）"
  - "test_package 用打包 clang 编译 test.c 时需 CPATH 注入 sysroot C 头 + LIBRARY_PATH 注入 sysroot 库目录（打包 clang 无默认 sysroot）"
  - "上游 46,276 个测试用例（tools/clang/unittests + tools/clang/test），通过 43,043（按适用口径 99.85%）；4 个最终未通过均为编译器行为演进或系统固有限制，非适配缺陷"
