software: clang
display: "Clang"
description: "clang/LLVM 编译器前端工具链（aarch64-unknown-linux-ohos）"
category: toolchain
homepage: "https://clang.llvm.org"
license: "Apache-2.0 WITH LLVM-exception"
build_system: cmake

ohos_adaptation:
  key_points:
    - "鸿蒙 PC 真机原生编译：不设 CMAKE_SYSTEM_NAME → 不触发交叉编译 → llvm-tblgen 原生编+跑"
    - "config.guess 不认 HarmonyOS：build() 覆盖为 stub 输出 aarch64-unknown-linux-ohos"
    - "runtimes 不源码构建（SDK libc++ 15 头与 clang 20 不兼容）：compiler-rt builtins/libunwind/libc++ 在 package() 中从 SDK 复制，R26 合规"
    - "test_package 用打包 clang 真实编译运行 test.c（R34 反空壳，校验 __clang_major__）"
    - "上游 46,276 个 lit 用例：通过 43,043（按适用口径 99.85%），4 个未通过均为编译器行为演进或系统固有限制"

versions:
  20.1.8:
    status: built
    date: 2026-08-02
    notes: 首个适配版本（conan create + test_package 通过）
  22.1.8:
