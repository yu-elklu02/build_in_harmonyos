# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: consul-template/0.42.0
homepage: "https://github.com/hashicorp/consul-template"

# consul-template 是 Go 预编译二进制，上游无 make check / ctest 等构建系统测试
# 上游验证来源: HashiCorp releases 自带 --version 输出
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 预编译二进制包，无源码级测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 consul-template --version 验证输出包含 0.42.0 版本号"
    command: "bash test.sh"

# 测试断言总数 (--version 退出码 + 版本号匹配 = 2 个断言)
assertion_count: 2
