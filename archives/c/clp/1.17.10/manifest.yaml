software: clp
version: "1.17.10"
status: built
build_date: "2026-07-30"
source:
  url: "https://raw.gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/archive/refs/heads/clp-src-raw.tar.gz"
  sha256: "ca4945946e9466448fc958f3d806016f4a9f1e6fdd866899a70043b421839a99"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-musl"
    - "--disable-dependency-tracking"
  dependencies:
    - "coinutils/2.11.13"
    - "coin-or/0.108.12"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-config.guess-harmonyos.patch"
knowledge_gained:
  - "E072: autotools 项目需要替换 config.guess 以支持 ohos 三元组（HarmonyOS→Linux 映射）"
  - "E165: Conan copy() 在 HMDFS 上不保留可执行位，configure 前需 chmod +x"
  - "HMDFS: config.status 的 mktemp -d 创建 mode 0770 子目录不可写（SGID + umask 077 冲突），需 sed 替换为 mkdir + umask 022"
  - "COIN-OR 递归 configure 不支持 VPATH/build_folder，layout 用 pass + 手动 cd src && ./configure（同 coin-or/0.108.12）"
  - "依赖 coinutils/2.11.13 + coin-or/0.108.12 + zlib/1.3.1，通过 conan requires + PkgConfigDeps + osi.pc 别名生成"
  - "coinutils.pc Cflags 需含 -I${includedir}/coin（quoted include 找不到 CoinPragma.hpp）"
  - "libOsi.la dependency_libs 含空路径 //lib/libCoinUtils.la，需 sed 修复为实际路径"
