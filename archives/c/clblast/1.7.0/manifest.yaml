patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "clblast 的 CMake 在找不到 clBLAS/CBLAS/MKL 参考库时会静默禁用 TESTS，必须提供 openblas 作为 CBLAS 参考以保持上游测试存活"
  - "clblast 用自己的 FindOpenCL.cmake / FindCBLAS.cmake 模块查找依赖，需通过 OPENCL_INCLUDE_DIRS/OPENCL_LIBRARIES/CBLAS_ROOT 变量直接喂给 CMake"
  - "上游测试需真实 OpenCL 设备运行；设备不支持的精度会被跳过（不算失败）"
