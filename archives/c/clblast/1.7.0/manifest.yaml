build:
  system: cmake
  configure_options:
    - "-DTESTS=ON"
    - "-DSAMPLES=OFF"
    - "-DTUNERS=OFF"
    - "-DCLIENTS=OFF"
    - "-DNETLIB=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - opencl-headers/2026.05.29
    - opencl-icd-loader/v2024.05.08
