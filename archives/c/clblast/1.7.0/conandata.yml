sources:
  url:
    - "https://gh-proxy.com/https://github.com/CNugteren/CLBlast/archive/refs/tags/1.7.0.tar.gz"
    - "https://github.com/CNugteren/CLBlast/archive/refs/tags/1.7.0.tar.gz"
  sha256: "cac83330a6110214f2b7efc8e46062536f40ba96122f3b2a074a51497d8ca9e7"
patches:
  - patch_file: "patches/0001-ohos-program-release-guard.patch"
    patch_description: "OHOS 下 ~Program() 跳过 clReleaseProgram（与上游 Android/Windows 同款守卫）：进程退出静态析构时驱动可能已卸载，调用会触发访问违例导致测试二进制退出 SEGFAULT"
    patch_type: "portability"
  - patch_file: "patches/0002-preprocessor-unsupported-precision.patch"
    patch_description: "preprocessor 测试对设备不支持的精度（无 fp64 时 double2 kernel 无法编译）跳过而非 abort，与 correctness tester 的 Unsupported precision 处理一致"
    patch_type: "portability"
  - patch_file: "patches/0003-amax-half-reference-writeback.patch"
    patch_description: "修复 half 精度下的 batched 例程与 amax 参考实现：(1) wrapper_cblas.hpp cblasXamax half 版把结果写入 imax_buffer_bis 副本后从不回写，参考索引恒为初始垃圾值导致 iHAMAX 必失败，补回写；(2) batched 内核 XaxpyBatched/XgemmBatched/XgemmDirectBatched* 的 alpha/beta 缓冲声明为 __constant real_arg*（half 时 real_arg=float，4 字节），而宿主写 Buffer<half>（2 字节），类型不匹配导致 alpha/beta 读取错位，改为 __constant real* 与 Buffer<T> 一致"
    patch_type: "portability"
