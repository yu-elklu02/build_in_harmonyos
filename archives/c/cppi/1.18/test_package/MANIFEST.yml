# test_package/MANIFEST.yml — CI L0e required
package: cppi/1.18
homepage: https://ftp.gnu.org/gnu/cppi/

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - description: "cppi test suite — ~40 shell-based functional tests covering C directives, ANSI mode, error handling"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "cppi --version + indent nested #if/#define directives + stdin mode"
    command: "sh test.sh"

assertion_count: 3
