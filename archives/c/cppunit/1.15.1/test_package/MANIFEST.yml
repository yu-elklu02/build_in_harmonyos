package: cppunit/1.15.1
homepage: https://wiki.documentfoundation.org/Development/Cppunit

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: examples/cppunittest/CppUnitTestMain.cpp
    source: cppunit-1.15.1.tar.gz/examples/cppunittest/CppUnitTestMain.cpp
    description: "Run the upstream CppUnit framework self-tests"
    command: "make check"
  - file: src/DllPlugInTester/DllPlugInTesterTest.cpp
    source: cppunit-1.15.1.tar.gz/src/DllPlugInTester/DllPlugInTesterTest.cpp
    description: "Validate the command-line plug-in test runner"
    command: "make check"
  - file: examples/money/MoneyTest.cpp
    source: cppunit-1.15.1.tar.gz/examples/money/MoneyTest.cpp
    description: "Run the upstream money example test suite"
    command: "make check"
  - file: examples/hierarchy/HierarchyTestCase.cpp
    source: cppunit-1.15.1.tar.gz/examples/hierarchy/HierarchyTestCase.cpp
    description: "Run the expected-failure hierarchy example"
    command: "make check"

test_package_tests:
  - file: test_cppunit.cpp
    description: "Register and run a real CppUnit fixture through the packaged library"
    command: "./test_cppunit"

assertion_count: 500
