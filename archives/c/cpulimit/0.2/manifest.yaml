# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS sysroot 中 basename() 需要 #include <libgen.h>"
  - "Makefile 的 CFLAGS 使用 ?= 赋值，环境变量会覆盖 -D_GNU_SOURCE，必须在源码中 #define _GNU_SOURCE"
  - "#ifdef 不支持逻辑运算符，需改用 #if defined(__APPLE__) || defined(__FreeBSD__)"
  - "sys/sysctl.h 在 OHOS/Linux 不存在，仅 Apple/FreeBSD 需要"

