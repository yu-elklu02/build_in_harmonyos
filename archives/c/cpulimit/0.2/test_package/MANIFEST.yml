# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpulimit/0.2
homepage: "https://github.com/opsengine/cpulimit"

# 上游测试命令 (cpulimit has no make check target)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# cpulimit has tests/ directory with process_iterator_test and busy
upstream_tests:
  - file: tests/process_iterator_test.c
    source: cpulimit-0.2/tests/process_iterator_test.c
    description: "Process iterator test (assertion-based, platform-specific)"
    command: "./process_iterator_test"
  - file: tests/busy.c
    source: cpulimit-0.2/tests/busy.c
    description: "Busy loop helper for CPU load testing"
    command: "./busy"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify cpulimit binary runs --help"
    command: "cpulimit --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
