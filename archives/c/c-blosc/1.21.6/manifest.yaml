  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DBUILD_TESTS=OFF"
  - "-DBUILD_FUZZERS=OFF"
  - "-DBUILD_BENCHMARKS=OFF"
  - "-DBUILD_SHARED=OFF"
  - "-DBUILD_STATIC=ON"
  - "-DCMAKE_INSTALL_SYSTEM_RUNTIME_LIBS_SKIP=ON"
knowledge_gained:
  - cmake_version_compatibility: CMake 4.1.2 需要 CMAKE_POLICY_VERSION_MINIMUM 参数兼容旧项目
  - clock_gettime_unavailable: 平台不支持 CLOCK_MONOTONIC/clock_gettime，需禁用相关工具
  - conan_static_msvc_library_name: MSVC 静态库安装名为 libblosc.lib，Conan package_info 在 Windows static 下需使用 libblosc
  - conan_runtime_skip: 上游 CMake 包含 InstallRequiredSystemLibraries，Windows 静态库包需设置 CMAKE_INSTALL_SYSTEM_RUNTIME_LIBS_SKIP=ON 避免打入 MSVC runtime DLL
  - conan_test_package: test_package 编译 C 消费者并实际调用 blosc_compress/blosc_decompress 做 roundtrip 校验
  - conan_cmake_cache_policy: CMake 4.x 兼容参数 CMAKE_POLICY_VERSION_MINIMUM 必须通过 CMakeToolchain.cache_variables 注入
