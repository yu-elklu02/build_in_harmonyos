# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: clip/0.7
homepage: "https://github.com/asmuth/clip"

# Upstream test command (for make -n check / ctest -N analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: test/test_runner.sh
    source: clip-0.7/test/test_runner.sh
    description: "Upstream test runner script (requires test data extraction)"
    command: "./test/test_runner.sh"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.cpp
    description: "Verifies clip C API: clip_init/clip_destroy lifecycle"
    command: "./test_clip"

# Approximate assertion count
assertion_count: 2
