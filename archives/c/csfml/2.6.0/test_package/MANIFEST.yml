package: csfml/2.6.0
homepage: "https://www.sfml-dev.org/"
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest (csfml-smoke, via cmake.test() in build())"
upstream_tests:
  - name: csfml-smoke
    file: tests/smoke.c
    source: csfml-2.6.0/tests/smoke.c
    description: "Injected smoke test exercising sfClock and sfPacket C APIs (upstream ships no test suite)"
    command: "ctest"
test_package_tests:
  - file: test.c
    description: "Validates C System timing and Network packet serialization APIs"
    command: "test_csfml"
assertion_count: 3
