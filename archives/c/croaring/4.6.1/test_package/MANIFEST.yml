# test_package/MANIFEST.yml — croaring/4.6.1
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: croaring/4.6.1
homepage: "https://roaringbitmap.org/"

# 上游测试命令分析
upstream_check_command: "cmake --build . --target check  # ENABLE_ROARING_TESTS=ON 时由 ctest 驱动"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序 (DISABLED via ENABLE_ROARING_TESTS=OFF)
upstream_tests:
  - file: tests/c/unit.c
    source: croaring-4.6.1/tests/c/unit.c
    description: "上游 C API 单元测试 (需 ENABLE_ROARING_TESTS=ON)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：roaring bitmap 创建/并集/交集/基数验证"
    command: "./test_croaring"

# 测试断言总数
assertion_count: 2
