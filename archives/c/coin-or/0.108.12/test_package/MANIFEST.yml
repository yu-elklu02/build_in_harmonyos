# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: coin-or/0.108.12
homepage: "https://github.com/coin-or/Osi"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（Osi 自带 OsiCommonTest 单测库 + Osi/test 求解器测试源）
upstream_tests:
  - file: Osi/src/OsiCommonTest/OsiUnitTests.hpp
    source: coin-or-0.108.12/Osi/src/OsiCommonTest/OsiUnitTests.hpp
    description: "Osi 公共单测头（OsiSolverInterfaceTest 等 8 个测试源）"
    command: "make check"
  - file: Osi/test/unitTest.cpp
    source: coin-or-0.108.12/Osi/test/unitTest.cpp
    description: "Osi 求解器接口测试入口（含 Cpx/Glpk/Grb/Msk/Spx 各求解器测试源 11 个）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 OsiCuts 并插入 OsiRowCut，验证上下界"
    command: "./test_coin-or"

# 测试断言总数
assertion_count: 3
