# 编译中学到的知识
knowledge_gained:
  - "COIN-OR 递归 configure：顶层 configure 后需修补顶层与子目录（Osi/）两个 config.status 并重跑，才能生成完整 Makefile"
  - "HMDFS 下 config.status 临时目录：mktemp -d -q + umask 077 会失败，需改为 mkdir -p ./conftmp + umask 022"
  - "Osi configure 需显式 --with-coinutils-incdir/--with-coinutils-lib（含 -lz -lm）定位 CoinUtils"

