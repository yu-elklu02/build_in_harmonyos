# test_package/MANIFEST.yml
# chsrc 测试声明文件

package: chsrc/0.2.4
homepage: https://github.com/RubyMetric/chsrc

# chsrc 无上游测试框架，Makefile 中的 test target 仅用于开发测试
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "chsrc --version 验证二进制可执行且版本号正确"
    command: "conan test"

# 测试断言总数 (chsrc --version 退出码 0 + 输出包含版本号 v0.2.4)
assertion_count: 2
