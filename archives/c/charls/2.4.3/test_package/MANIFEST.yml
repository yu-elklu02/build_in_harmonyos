# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: charls/2.4.3
homepage: "https://github.com/team-charls/charls"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试依赖测试数据文件 (.raw/.ppm/.jls) 和 CMake/CTest 框架, 且上游测试为单一 charlstest 可执行程序,
# 由 CHARLS_BUILD_TESTS=ON 构建, 用 -unittest 参数运行。本适配关闭了 CHARLS_BUILD_TESTS。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 test/ 目录下的测试源文件被编译为单一 charlstest 可执行程序, 通过 -unittest 参数运行
# 以下列出代表性测试文件
upstream_tests:
  - file: main.cpp
    source: charls-2.4.3/test/main.cpp
    description: "主测试程序 (28KB, 包含大量单元测试: 编解码、帧信息、SPIFF 头等)"
    command: "charlstest -unittest"
  - file: bitstreamdamage.cpp
    source: charls-2.4.3/test/bitstreamdamage.cpp
    description: "比特流损坏测试 (验证错误处理)"
    command: "charlstest -unittest"
  - file: compliance.cpp
    source: charls-2.4.3/test/compliance.cpp
    description: "JPEG-LS 合规性测试"
    command: "charlstest -unittest"
  - file: dicomsamples.cpp
    source: charls-2.4.3/test/dicomsamples.cpp
    description: "DICOM 样本测试"
    command: "charlstest -unittest"
  - file: legacy.cpp
    source: charls-2.4.3/test/legacy.cpp
    description: "旧版 API 兼容性测试"
    command: "charlstest -unittest"
  - file: performance.cpp
    source: charls-2.4.3/test/performance.cpp
    description: "性能测试"
    command: "charlstest -unittest"
  - file: util.cpp
    source: charls-2.4.3/test/util.cpp
    description: "测试工具函数"
    command: "charlstest -unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_charls.cpp
    description: "JPEG-LS 无损编解码往返测试: 构造 8x8 灰度 16-bit 图像, 编码后解码, 验证数据完全一致"
    command: "./test_charls"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个断言: 编码成功 + 编码后非空 + 解码尺寸一致 + 数据无损
assertion_count: 4
