# 版本级 manifest
# 文件位置: archives/c/charls/2.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.3"

# 软件名
software: "charls"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-13"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/team-charls/charls/archive/refs/tags/2.4.3.tar.gz"

  # 源码校验和
  sha256: "bbf67d51446a98eb8fc98c9c6de49a2605c709d3a14ba39f09a09f8e57527099"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCHARLS_BUILD_TESTS=OFF"
    - "-DCHARLS_BUILD_FUZZ_TEST=OFF"
    - "-DCHARLS_BUILD_SAMPLES=OFF"
    - "-DCHARLS_INSTALL=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  # charls 无第三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "charls 是 C++14 JPEG-LS 无损/近无损图像压缩库, 无第三方依赖"
  - "使用 CMake 构建为静态/动态库 (默认静态)"
  - "E092: CMake 不识别 OHOS 平台, 需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "上游测试为单一 charlstest 可执行程序 (通过 -unittest 参数运行), 本适配关闭 CHARLS_BUILD_TESTS, test_package 使用自带 smoke test"
  - "静态库需定义 CHARLS_STATIC 宏 (由 package_info 自动添加)"
