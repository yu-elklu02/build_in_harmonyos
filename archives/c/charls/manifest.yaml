# 软件级 manifest
# 文件位置: archives/c/charls/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: charls

# 显示名
display: "CharLS"

# 一句话描述
description: "C++ JPEG-LS 无损/近无损图像压缩库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: compress

# 官网 URL
homepage: "https://github.com/team-charls/charls"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "C++14 库, 无第三方依赖, 构建简单"
    - "CMake 构建为静态/动态库 (默认静态)"
    - "需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 (OHOS 适配)"
    - "静态库消费者需定义 CHARLS_STATIC 宏"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.4.3":
    status: published
    build_date: 2026-07-13
