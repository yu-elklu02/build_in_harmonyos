package: cachefilesd-inotify/0.11.1
homepage: "https://gitlab.com/tomalok/cachefilesd-inotify"

# 上游无测试套件（Alpine APKBUILD options="!check"），未集成到 build()
upstream_check_command: "make show_vars  # Makefile 无 check 目标"
upstream_test_in_build: false
