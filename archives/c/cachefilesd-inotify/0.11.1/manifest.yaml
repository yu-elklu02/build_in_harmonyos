software: cachefilesd-inotify
version: "0.11.1"
status: built
date_compiled: "2026-07-31"

# 编译环境
build_env:
  compiler: clang
  platform: harmonyos-aarch64
  build_system: makefile

# 源码
source:
  url: "https://gitlab.com/tomalok/cachefilesd-inotify/-/archive/0.11.1/cachefilesd-inotify-0.11.1.tar.bz2"
  sha256: "952ab9d4da29c7ad958bde9a29c196d45972e429f3444adbfcc17b146562f084"
  tar_format: tar.bz2

# 构建系统
build:
  system: makefile
  configure_options:
    - "make BUILDFOR= CC=<ohos-clang> -j1（BUILDFOR= 空，跳过 -m32/-m64 字长猜测）"
  dependencies: []
  cc: "clang (OHOS aarch64 cross)"

# 运行期依赖（系统级）
runtime_dependencies:
  - "Linux 内核 /proc/fs/cachefiles 接口（FS-Cache 内核模块）"
  - "xattrs（扩展属性）支持"

patches_applied: []

knowledge_gained:
  - "C daemon 项目，Makefile 构建，无 configure 脚本"
  - "Makefile 用 `file /usr/bin/make` 猜字长加 -m32/-m64，OHOS aarch64 clang 不认 -m64，传 BUILDFOR= 空跳过"
  - "VERSION 从 redhat/cachefilesd.spec 读取（grep ^Version:），不影响编译（版本硬编码在 cachefilesd.c）"
  - "cachefilesd 支持 --version/-v 选项（输出 cachefilesd version 0.11.1），适合 test_package 冒烟测试"
  - "上游无测试套件（Alpine APKBUILD options=!check），test_package 补全 --version 冒烟测试"
