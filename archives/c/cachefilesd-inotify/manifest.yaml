# 软件级 manifest — cachefilesd-inotify
# 遵循 ARCHIVE-SPEC v2.0

software: "cachefilesd-inotify"
display: "cachefilesd-inotify"
description: "FS-Cache 用户态守护进程（inotify 版，替代 dnotify）"
category: system
homepage: "https://gitlab.com/tomalok/cachefilesd-inotify"
license: "GPL-2.0-or-later"
build_system: "makefile"

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "C daemon，Makefile 构建，无 configure 脚本"
    - "Makefile 用 file /usr/bin/make 猜字长加 -m32/-m64，OHOS 须传 BUILDFOR= 空跳过"
    - "CC 从 conan conf 获取（R33），不用 shell ${CC}"
    - "cachefilesd 支持 --version 选项，适合 test_package 冒烟测试"
    - "运行期需内核 /proc/fs/cachefiles 接口（编译期无此限制）"
  common_dependencies: []

# 版本索引
versions:
  "0.11.1":
    status: built
    build_date: "2026-07-31"
