# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ccache/4.12.1
homepage: "https://ccache.dev/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/src/test_lockfile.cpp
    source: ccache-4.12.1/test/runner
    description: "Lockfile test (run by ctest)"
    command: "ctest -R test-lockfile"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "smoke test: verify ccache --version runs"
    command: "ccache --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
