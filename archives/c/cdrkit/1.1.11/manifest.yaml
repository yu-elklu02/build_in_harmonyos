knowledge_gained:
  - "rcmd() not available on OHOS bionic libc; use _rcmdrsh fallback"
  - "setreuid/setregid cause SIGSYS on OHOS; use seteuid/setegid fallback"
  - "pthread_cancel not implemented on OHOS; use graceful thread shutdown"
  - "libcap userspace API not available on OHOS; use kernel capget/capset API"
  - "__THROW not defined in OHOS bionic libc; add fallback definition"
  - "lld linker is strict about duplicate symbols; add extern declarations"
  - "CMake 4.x requires cmake_minimum_required(VERSION 3.5)"

