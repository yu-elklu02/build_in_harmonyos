# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdrkit/1.1.11
homepage: "https://sourceforge.net/projects/cdrkit/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: none
    source: none
    description: "cdrkit上游不包含标准测试套件 (CMake项目无make check target)"
    command: "none"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "结构检查测试 (L0d)"
    command: "./test_cdrkit"
  - file: conanfile.py
    description: "genisoimage --version + isoinfo --version + ISO创建与读取"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
