software: cdrkit
display: "cdrkit"
description: "CD/DVD recording and imaging tools (wodim, genisoimage, icedax)"
category: utility
homepage: "https://sourceforge.net/projects/cdrkit/"
license: GPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "rcmd() not available on OHOS; uses _rcmdrsh fallback"
    - "setreuid/setregid cause SIGSYS on OHOS; uses seteuid/setegid"
    - "pthread_cancel not implemented; uses graceful thread shutdown"
    - "libcap API replaced with kernel capget/capset API"
    - "__THROW not defined in bionic libc"
    - "lld strict about duplicate symbols; extern declarations needed"
    - "CMake 4.x requires cmake_minimum_required(VERSION 3.5)"
  common_dependencies:
    - "bzip2/1.0.8"
    - "zlib/1.3.1"

versions:
  "1.1.11":
    status: published
    build_date: "2026-08-06"
