package: cspice/67.0.0.1
homepage: "https://naif.jpl.nasa.gov/naif/toolkit.html"

# 上游测试命令（wrapper AndrewAnnex/cspice-cmake-spiceypy 自带 test_cspice 冒烟测试）
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure --no-tests=error"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure --no-tests=error"

# 上游实际运行的测试程序（wrapper 注册的 CTest 用例）
upstream_tests:
  - file: test_cspice.c
    source: cspice-cmake-spiceypy/test_cspice.c
    description: "wrapper 自带冒烟测试：调用 b1900_c() 校验 CSPICE 库可链接可运行"
    command: "ctest --test-dir build-ohos -R cspice_test --output-on-failure"
    case_count: 1

# test_package 中自带的测试（消费者视角验证，R34 实质数值计算）
test_package_tests:
  - file: test.c
    description: "真实数值计算断言：tkvrsn_c 版本号含 N0067、vnorm_c((3,4,0))==5、vdot_c 正交、convrt_c 单位换算、rpd_c 度弧度自洽（5 项，非空壳）"
    command: "./test_probe"
    assertion_count: 5
