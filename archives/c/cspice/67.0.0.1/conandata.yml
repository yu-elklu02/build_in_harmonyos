# CSPICE 本体：官方源 NAIF 只发 `.tar.Z`（Unix compress），conan 的 get() 解不了这种格式，
# 故单独 download 后用 cmake -E tar 解（libarchive 支持 compress）。
# 各平台归档里的 src/ 相同（只有预编译 .a 不同），取 Linux 那份即可，我们本来就要重编。
cspice_src:
  url: "https://naif.jpl.nasa.gov/pub/naif/misc/toolkit_N0067/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z"
  sha256: "60a95b51a6472f1afe7e40d77ebdee43c12bb5b8823676ccc74692ddfede06ce"
# 官方 NAIF 源不可达时的 fallback：GitHub 上完整镜像的 N0067 源码（MonsignorEduardo/cspice，
# meson.build 标注 version 'N0067'，src/cspice/ 完整，与官方 N0067 同源）。仅作下载兜底。
cspice_src_mirror:
