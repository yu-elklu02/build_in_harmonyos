package: cvsweb/3.0.6
homepage: "https://www.freebsd.org/projects/cvsweb.html"

# 上游测试命令（cvsweb 为纯 Perl CGI 应用，无官方 make check/CTest 套件；
# 上游可验证自检 = perl -T -c 语法检查 + CGI 环境冒烟）
upstream_check_command: "perl -T -c cvsweb.cgi"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "perl -T -c cvsweb.cgi"

# 上游实际运行的测试程序（无独立测试套件，如实声明）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 实质自检）
test_package_tests:
  - file: test_cvsweb.py
    description: "校验 cvsweb.cgi 存在（含 -T shebang）+ perl -T -c 语法自检（-I 指向捆绑的 IPC::Run/URI 模块）"
    command: "python3 test_cvsweb.py <pkg_root>"
assertion_count: 4
