software: cvsweb
display: "cvsweb"
description: "WWW CGI script to browse CVS repository trees（FreeBSD cvsweb）"
category: web
homepage: "https://www.freebsd.org/projects/cvsweb.html"
license: BSD-2-Clause
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Perl CGI 应用，无编译产物（脚本打包路径）"
    - "捆绑 IPC::Run/URI::Escape 纯 Perl 模块（OHOS perl 精简构建缺失），PERL5LIB 指向"
    - "自检方式：perl -T -c cvsweb.cgi（-T 匹配 shebang taint 模式）"
  common_dependencies: []

versions:
  "3.0.6":
    status: built
    build_date: "2026-08-08"
    notes: |
      - cvsweb 3.0.6（FreeBSD CVS Web 界面，纯 Perl CGI）
      - perl -T -c 语法自检通过；test_package 消费者自检 OK
