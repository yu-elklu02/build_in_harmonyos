package: concurrencykit/0.7.2
homepage: "https://github.com/concurrencykit/ck"
upstream_check_command: "make regressions"
upstream_test_in_build: false
upstream_tests:
  - file: "regressions/"
    source: "ck-0.7.2/regressions"
    description: "Upstream regression programs."
    command: "make regressions"
test_package_tests:
  - file: "test_package.c"
    description: "Links libck and verifies a protected atomic increment."
    command: "ctest --output-on-failure"
assertion_count: 2
