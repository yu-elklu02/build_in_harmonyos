# 编译中学到的知识
knowledge_gained:
  - "OHOS SDK LLVM 共享库使用 std::__h 内联命名空间，需创建自定义 __config_site 覆盖 ABI 命名空间"
  - "CastXML 使用 std::cerr/std::cout 需要链接 libc++，替换为 llvm::errs()/llvm::outs() 避免该依赖"
  - "LLVM InitializeAllTargets 在共享库中已自动初始化，CastXML 中需禁用"
  - "需要创建 patched LLVM/Clang cmake 配置解决静态库缺失问题"

