# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cli11/2.6.2
homepage: "https://github.com/CLIUtils/CLI11"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/HelpersTest.cpp
    source: CLI11-2.6.2/tests/HelpersTest.cpp
    description: "辅助函数测试"
    command: "ctest -R HelpersTest"
  - file: tests/ConfigFileTest.cpp
    source: CLI11-2.6.2/tests/ConfigFileTest.cpp
    description: "配置文件解析测试"
    command: "ctest -R ConfigFileTest"
  - file: tests/OptionTypeTest.cpp
    source: CLI11-2.6.2/tests/OptionTypeTest.cpp
    description: "选项类型测试"
    command: "ctest -R OptionTypeTest"
  - file: tests/NumericTypeTest.cpp
    source: CLI11-2.6.2/tests/NumericTypeTest.cpp
    description: "数值类型测试"
    command: "ctest -R NumericTypeTest"
  - file: tests/SimpleTest.cpp
    source: CLI11-2.6.2/tests/SimpleTest.cpp
    description: "基础解析测试"
    command: "ctest -R SimpleTest"
  - file: tests/AppTest.cpp
    source: CLI11-2.6.2/tests/AppTest.cpp
    description: "应用对象测试"
    command: "ctest -R AppTest"
  - file: tests/SetTest.cpp
    source: CLI11-2.6.2/tests/SetTest.cpp
    description: "集合选项测试"
    command: "ctest -R SetTest"
  - file: tests/TransformTest.cpp
    source: CLI11-2.6.2/tests/TransformTest.cpp
    description: "值转换测试"
    command: "ctest -R TransformTest"
  - file: tests/CreationTest.cpp
    source: CLI11-2.6.2/tests/CreationTest.cpp
    description: "对象创建测试"
    command: "ctest -R CreationTest"
  - file: tests/SubcommandTest.cpp
    source: CLI11-2.6.2/tests/SubcommandTest.cpp
    description: "子命令测试"
    command: "ctest -R SubcommandTest"
  - file: tests/HelpTest.cpp
    source: CLI11-2.6.2/tests/HelpTest.cpp
    description: "帮助信息测试"
    command: "ctest -R HelpTest"
  - file: tests/FormatterTest.cpp
    source: CLI11-2.6.2/tests/FormatterTest.cpp
    description: "格式化器测试"
    command: "ctest -R FormatterTest"
  - file: tests/NewParseTest.cpp
    source: CLI11-2.6.2/tests/NewParseTest.cpp
    description: "新版解析流程测试"
    command: "ctest -R NewParseTest"
  - file: tests/OptionalTest.cpp
    source: CLI11-2.6.2/tests/OptionalTest.cpp
    description: "可选值测试"
    command: "ctest -R OptionalTest"
  - file: tests/DeprecatedTest.cpp
    source: CLI11-2.6.2/tests/DeprecatedTest.cpp
    description: "弃用接口兼容性测试"
    command: "ctest -R DeprecatedTest"
  - file: tests/StringParseTest.cpp
    source: CLI11-2.6.2/tests/StringParseTest.cpp
    description: "字符串解析测试"
    command: "ctest -R StringParseTest"
  - file: tests/ComplexTypeTest.cpp
    source: CLI11-2.6.2/tests/ComplexTypeTest.cpp
    description: "复杂类型测试"
    command: "ctest -R ComplexTypeTest"
  - file: tests/TrueFalseTest.cpp
    source: CLI11-2.6.2/tests/TrueFalseTest.cpp
    description: "布尔值解析测试"
    command: "ctest -R TrueFalseTest"
  - file: tests/localeTest.cpp
    source: CLI11-2.6.2/tests/localeTest.cpp
    description: "区域设置测试"
    command: "ctest -R localeTest"
  - file: tests/OptionGroupTest.cpp
    source: CLI11-2.6.2/tests/OptionGroupTest.cpp
    description: "选项组测试"
    command: "ctest -R OptionGroupTest"
  - file: tests/ExtraValidatorsTest.cpp
    source: CLI11-2.6.2/tests/ExtraValidatorsTest.cpp
    description: "扩展验证器测试"
    command: "ctest -R ExtraValidatorsTest"
  - file: tests/EncodingTest.cpp
    source: CLI11-2.6.2/tests/EncodingTest.cpp
    description: "编码处理测试"
    command: "ctest -R EncodingTest"
  - file: tests/TimerTest.cpp
    source: CLI11-2.6.2/tests/TimerTest.cpp
    description: "计时器测试"
    command: "ctest -R TimerTest"
  - file: tests/link_test_2.cpp
    source: CLI11-2.6.2/tests/link_test_2.cpp
    description: "多翻译单元链接测试"
    command: "ctest -R link_test_2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 验证 CLI11 头文件包含、CLI::App 实例化、选项添加与解析"
    command: "./test_cli11"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个断言: App 实例化 + 选项添加 + 命令行解析 + 值验证
assertion_count: 4
