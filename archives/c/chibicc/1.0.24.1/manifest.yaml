software: chibicc
version: "1.0.24.1"
status: built
build_date: "2026-08-06"
build_system: makefile
conan_ref: "chibicc/1.0.24.1"

source:
  url: "https://launchpad.net/debian/+archive/primary/+sourcefiles/chibicc/1.0.24.1-1/chibicc_1.0.24.1.orig.tar.gz"
  sha256: "cbcdaccce25508566b77f26e2ffab41a379e05b6a0be73a5b6806796db62fecc"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "<conan-conf-c-compiler> -std=c11 -g -fno-common -Wall -Wno-switch -o chibicc *.c <openssl-flags>"
  dependencies:
    - openssl/3.5.6.1
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "chibicc 1.0.24.1 is packaged from the Debian primary sourcefiles authority mirror because rui314/chibicc does not publish this Debian version as a GitHub tag"
  - "The usable upstream build system is the plain Makefile; the bundled CMakeLists.txt requires Boost and is not a viable package build path"
  - "The OHOS runner does not provide make, so the recipe invokes the C compiler directly with the same source set and core flags as the Makefile"
  - "The build links libcrypto, so the Conan recipe depends on openssl/3.5.6.1"
  - "chibicc emits x86-64 assembly, so the OHOS/armv8 smoke test should stop at assembly generation instead of executing generated binaries"
