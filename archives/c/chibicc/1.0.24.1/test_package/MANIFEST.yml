package: chibicc/1.0.24.1
homepage: "https://github.com/rui314/chibicc"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"
upstream_tests:
  - name: make-test
    description: "Builds upstream test/*.c with chibicc, links host executables, and runs them"
  - name: make-test-stage2
    description: "Bootstraps a stage2 chibicc compiler and repeats executable tests"

test_package_tests:
  - file: test_chibicc.sh
    description: "Runs packaged chibicc, compiles a tiny C source to x86-64 assembly, and asserts generated symbols"
    command: "sh test_chibicc.sh"

assertion_count: 5
