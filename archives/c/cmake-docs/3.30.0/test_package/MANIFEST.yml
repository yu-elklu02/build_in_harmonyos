# test_package/MANIFEST.yml — cmake-docs/3.30.0
# Upstream test declaration for CI L0e check

package: cmake-docs/3.30.0
homepage: "https://cmake.org/documentation/"

# Upstream test: Sphinx HTML build is the "test" for documentation packages
upstream_check_command: "make documentation"

# The build() method builds the docs via CMake + Sphinx (SPHINX_HTML=ON)
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target documentation"

# Upstream test programs (Sphinx generates HTML from RST sources)
upstream_tests:
  - file: Utilities/Sphinx/CMakeLists.txt
    source: cmake-3.30.0/Utilities/Sphinx/CMakeLists.txt
    description: "Sphinx HTML documentation build target"
    command: "cmake --build . --target documentation"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_docs.py
    description: "Verify HTML documentation files (index.html, searchindex.js, genindex.html) are installed"
    command: "python3 test_docs.py"

# Approximate assertion count
assertion_count: 3
