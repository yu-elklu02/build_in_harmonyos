# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cmph/2.0
homepage: "https://cmph.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/graph_tests.c
    source: cmph-2.0/tests/graph_tests.c
    description: "Graph data structure tests (random, cyclic, non-cyclic)"
    command: "./graph_tests"
  - file: tests/select_tests.c
    source: cmph-2.0/tests/select_tests.c
    description: "Select data structure tests (dump, load, query)"
    command: "./select_tests"
  - file: tests/compressed_seq_tests.c
    source: cmph-2.0/tests/compressed_seq_tests.c
    description: "Compressed sequence tests (dump, load, query)"
    command: "./compressed_seq_tests"
  - file: tests/compressed_rank_tests.c
    source: cmph-2.0/tests/compressed_rank_tests.c
    description: "Compressed rank tests (dump, load, query)"
    command: "./compressed_rank_tests"
  - file: tests/cmph_benchmark_test.c
    source: cmph-2.0/tests/cmph_benchmark_test.c
    description: "Benchmark tests (sleep, increment)"
    command: "./cmph_benchmark_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Create MPH with CHD algorithm and verify all keys map uniquely"
    command: "./test_cmph"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
