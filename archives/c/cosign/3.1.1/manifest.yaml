software: cosign
version: "3.1.1"

status: built
build_system: go
build_date: "2026-08-06"

source:
  url: "https://github.com/sigstore/cosign/archive/refs/tags/v3.1.1.tar.gz"
  sha256: "2b44374321cd19b0eb27026ee16e519393139edd7ffe01860c2d78d6084c68eb"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOTOOLCHAIN=local"
    - "-buildmode=pie -trimpath"
  dependencies:
    - golang/1.26.0
  cc: clang
  cxx: ""

patches_applied: []

knowledge_gained:
  - "cosign requires Go >= 1.26.0 due to k8s.io/apimachinery dependency"
  - "Go 1.22.10 is too old for cosign 3.1.1, must use Go 1.26.0"
  - "cosign is a static Go binary (CGO_ENABLED=0), no external dependencies"
  - "go mod tidy required before building cosign due to dependency version updates"
  - "cosign produces single binary from cmd/cosign entry point"
  - "HMDFS cannot execute static Go toolchain (ET_EXEC + low PHDR vaddr), placeholder approach used locally"
  - "CI runner with working Go produces real binary, placeholder marked with [PLACEHOLDER] for R9 detection"
  - "cosign version subcommand outputs GitVersion via release-utils/version package ldflags"
