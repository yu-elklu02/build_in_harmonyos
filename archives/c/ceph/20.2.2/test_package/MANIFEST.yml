package: ceph/20.2.2
homepage: "https://ceph.com/"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - file: files/upstream_crush_test.c
    source: ceph-20.2.2/src/test/crush/crush.cc
    description: "Port the normal FirstnTest.basic topology, rule, 100 inputs, and assertions to the C API"
    command: "ctest -R ceph_crush_firstn_basic"
  - file: files/upstream_crush_test.c
    source: ceph-20.2.2/src/test/crush/crush.cc
    description: "Port the normal FirstnTest.toosmall topology, rule, 100 inputs, and assertions to the C API"
    command: "ctest -R ceph_crush_firstn_toosmall"
  - file: files/upstream_crush_test.c
    source: ceph-20.2.2/src/test/crush/crush.cc
    description: "Port the normal FirstnTest.single_out_first topology, 1,000 inputs, and remapping assertions"
    command: "ctest -R ceph_crush_firstn_single_out_first"
  - file: files/upstream_crush_test.c
    source: ceph-20.2.2/src/test/crush/crush.cc
    description: "Port CRUSHTest.straw2_stddev with 15 devices, four weight skews, and 1,000,000 mappings each"
    command: "ctest -R ceph_crush_straw2_distribution"

test_package_tests:
  - file: test_ceph_crush.c
    description: "Link the packaged library and verify hashing, mapping, and failed-device remapping"
    command: "./test_ceph_crush"

# The four C ports execute 8,018,468 checks; the consumer adds 17 checks.
# Cross builds compile all five tests and native builds also execute them.
assertion_count: 8018485
