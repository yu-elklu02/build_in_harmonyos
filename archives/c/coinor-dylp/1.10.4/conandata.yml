# 最小补丁：2007 版 config.guess/config.sub 无法识别 aarch64-unknown-linux-musl / HarmonyOS。
# config.sub 增加 aarch64/musl 支持（3 处），config.guess 增加 HarmonyOS/aarch64 分支。
# 顶层与 DyLP/ 子目录各一份，由 conanfile.py build() 的 apply_conandata_patches 应用。
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_type: "portability"
    patch_description: "config.guess: add HarmonyOS (HongMeng) and aarch64 Linux branches"
  - patch_file: "patches/0002-config.sub.patch"
    patch_type: "portability"
    patch_description: "config.sub: recognize aarch64 CPU and linux-musl OS"
  - patch_file: "patches/0003-DyLP-config.guess.patch"
    patch_type: "portability"
    patch_description: "DyLP/config.guess: add HarmonyOS (HongMeng) and aarch64 Linux branches"
  - patch_file: "patches/0004-DyLP-config.sub.patch"
    patch_type: "portability"
    patch_description: "DyLP/config.sub: recognize aarch64 CPU and linux-musl OS"
