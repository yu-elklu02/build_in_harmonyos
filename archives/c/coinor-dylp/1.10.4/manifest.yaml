# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.10.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.10.4"

# 软件名
software: "coinor-dylp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/coin-or/DyLP/archive/refs/tags/releases/1.10.4.tar.gz"

  # 源码校验和
  sha256: "5825bede088d78af772cb9a348d10032895d824461c8d22dbd76a70caa8b5b00"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-musl"
    - "--disable-dependency-tracking"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "coinutils/2.11.13"
    - "coin-or/0.108.12"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-DyLP-config.guess.patch"
  - "0004-DyLP-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "dylp 自带 2007 版 config.sub 不支持 aarch64/musl，需升级到 2024 版并加 HarmonyOS 分支（顶层与 DyLP/ 子目录都要覆盖）"
  - "COIN-OR 递归 configure 的 config.status 在 HMDFS 上需修补 mktemp/umask（mkdir -p ./conftmp、umask 022）"
  - "conan relocatable 打包会把 .la 的 dependency_libs 绝对路径改写为 //lib/xxx.la，链接 libOsiDylp 前需修复"
  - "libOsi.a 为非 PIC 静态库，dylp 需 --disable-shared --enable-static 纯静态构建"

