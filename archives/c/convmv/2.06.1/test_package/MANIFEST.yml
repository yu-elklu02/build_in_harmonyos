# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: convmv/2.06.1
homepage: "https://www.j3e.de/linux/convmv/"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testsuite.tar
    source: convmv-2.06/testsuite.tar
    description: "convmv upstream test suite (tar archive with test scripts)"
    command: "make test"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "Consumer smoke test: verifies --help, --list, and --unescape functionality"
    command: "./test.sh"

# 测试断言总数 (近似值)
assertion_count: 3
