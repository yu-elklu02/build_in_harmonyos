  source_work_dir: /storage/Users/currentUser/tmp/builds/convmv-2.06.work
  source_orig_hash: 6a47fc6953928056
  source_work_hash: bd4eda76c197799e
  generated_at: '2026-07-15T15:39:54'
  patches_count: 1

patch_classification:
