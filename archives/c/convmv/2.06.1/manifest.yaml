software: convmv
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.06/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.06.1"

# 构建系统类型
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/c/convmv/convmv_2.06+repack.orig.tar.gz"

  # 源码校验和
  sha256: "27b132e9e7143499d2fb115999b94d1dd24d2819a04030a3b57e207eafd2b9f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-convmv.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl脚本类软件需修改shebang: #!/usr/bin/perl → #!/usr/bin/env perl（鸿蒙/usr/bin/perl不存在）"
  - "convmv不支持--version选项，版本信息通过--help输出获取"
  - "makefile类构建系统无configure步骤，G0 clean-verify需跳过configure"
  - "convmv测试套件存在symlink时间戳不保持问题（非功能性缺陷）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
