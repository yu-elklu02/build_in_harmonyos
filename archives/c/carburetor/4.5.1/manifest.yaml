software: carburetor
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.5.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/58/49/e3408f48387e54f2277a7e86ae4f7fccf3ead9f84cb7459735d2eeb5f92b/carburetor-4.5.1.tar.gz"

  # 源码校验和
  sha256: "f9db1ed796ac8ff52b48178e380a0ea34b70f41e9bf1b306926cbf9f0f59b26a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: meson

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "python3/3.12"
    - "meson/1.11"
    - "ninja/1.13"
    - "gtk4/4.0"
    - "libadwaita/1"

  # 编译器
  cc: clang
  cxx: clang++

  # 备注: 这是纯 Python GTK 项目，原始构建系统为 pyproject.toml/flit。
  # 为适配 OpenHarmony 预编译框架，创建了 meson.build 文件用于 meson 构建。

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson-build.patch"
  - "0002-entry-point-script.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
