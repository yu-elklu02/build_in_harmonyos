# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: carburetor/4.5.1
homepage: "https://framagit.org/tractor/carburetor"

# Upstream test command (original project uses flit/meson test)
upstream_check_command: "meson test --list"

# conanfile.py build() method — upstream tests not integrated (pure Python, no test suite)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (carburetor has no upstream test suite — it's a GUI application)
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Verify entry point script (bin/carburetor) exists, Python module structure present"
    command: "conan test ."

# Assertion count (approximate, for quality assessment)
assertion_count: 3
