# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: chibi-scheme/0.12
homepage: "https://github.com/ashinn/chibi-scheme"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test PLATFORM=unix"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/r7rs.scm
    source: chibi-scheme-0.12/tests/r7rs.scm
    description: "R7RS standard test suite (1225 tests)"
    command: "make test PLATFORM=unix"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 运行 chibi-scheme 二进制验证 Scheme 求值"
    command: "sh test.sh"

# 测试断言总数 (近似值)
assertion_count: 1228
