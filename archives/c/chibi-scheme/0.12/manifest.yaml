software: chibi-scheme
version: 0.12
status: built
build_system: makefile
created_at: 2026-04-24
build_date: "2026-07-15"
source_url: https://github.com/ashinn/chibi-scheme/archive/refs/tags/0.12.tar.gz
license: BSD-3-Clause
description: Small footprint Scheme for use as a C Extension Language

# 编译参数
configure_options: []
build_options:
  - PREFIX=/storage/Users/currentUser/usr/local
  - PLATFORM=unix
  - ARCH=aarch64

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained: []

# 测试结果
test_result:
  type: r7rs
  total_tests: 1225
  passed: 1225
  failed: 0
  pass_rate: 100%

# 安装产物
install_artifacts:
  binaries:
    - chibi-scheme
    - chibi-ffi
    - chibi-doc
    - snow-chibi
  libraries:
    - libchibi-scheme.so.0.12.0
    - lib/chibi/*.so
  headers:
    - chibi/sexp.h
    - chibi/features.h
    - chibi/install.h
    - chibi/bignum.h
    - chibi/eval.h
    - chibi/gc_heap.h

# 编译日志
build_log: logs/build.log

# 预编译包
packages:
  - chibi-scheme-0.12-ohos-aarch64.tar.gz
  - chibi-scheme-0.12-ohos-aarch64-debug.tar.gz

# 质量门禁
quality_gates:
  G0_clean_build: PASS
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS
  G4_archive_integrity: PASS