# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 蚜本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALY_SPEC.md

package: crafty/23.4
homepage: "https://craftychess.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# Crafty has no `make check` target. Testing is interactive via the
# `test <file>` / `evtest <file>` / `bench` engine commands (parsed in
# option.c). We use `bench` for the L1 test (non-interactive, deterministic).
upstream_check_command: "printf 'bench\\nquit\\n' | ./crafty"

# conanfile.py build() 方法中是否已集成上游测试
# No — build() only compiles crafty. Tests run in test_package/test() via
# the packaged binary, which is the Conan application workflow.
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Crafty's tests are internal engine commands, not separate binaries:
upstream_tests:
  - file: bench.c
    source: crafty-23.4/bench.c
    description: "Internal performance benchmark — searches a fixed set of positions to a fixed depth, reports nodes/NPS. Invoked via `bench` engine command."
    command: "printf 'bench\\nquit\\n' | ./crafty"
  - file: test.c
    source: crafty-23.4/test.c
    description: "Regression test runner — reads a .stdin file (title/solution/setboard/move) and searches each position to verify the expected solution. Invoked via `test <file>` engine command."
    command: "printf 'test <stdin-file>\\nquit\\n' | ./crafty"
  - file: evtest.c
    source: crafty-23.4/evtest.c
    description: "Evaluation test runner — reads positions and prints static evaluations only. Invoked via `evtest <file>` engine command."
    command: "printf 'evtest <file>\\nquit\\n' | ./crafty"

# test_package 中自带的测试 (消费者视角验证)
# L1 test runs the packaged crafty binary with `bench` (real engine search).
test_package_tests:
  - file: conanfile.py
    description: "L1 smoke test — runs packaged crafty binary with `bench` command (internal benchmark, real search) and asserts clean exit."
    command: "printf 'bench\\nquit\\n' | ./crafty"

# 测试断言总数 (近似值, 用于质量评估)
# bench runs 12 fixed positions to a fixed depth → ~12 search assertions;
# plus binary startup + clean exit = ~14 total.
assertion_count: 14
