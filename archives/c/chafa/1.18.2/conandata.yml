sources:
  url: "https://hpjansson.org/chafa/releases/chafa-1.18.2.tar.xz"
  sha256: "0b8d9ba9f347e8b6c0c71878217c9b0e478b4a42aa4babea0bf20840567239c2"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach bundled config.guess to emit aarch64-unknown-linux-ohos on HarmonyOS."
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept the ohos-linux OS triplet used by config.guess and OHOS profiles."
    patch_type: "portability"
  - patch_file: "patches/0003-configure-config-status-tmpdir.patch"
    patch_description: "Create config.status temporary files under TMPDIR with HMDFS-friendly permissions."
    patch_type: "portability"
  - patch_file: "patches/0004-tests-test-driver-system-sh.patch"
    patch_description: "Use /system/bin/sh for the Automake test driver on HarmonyOS."
    patch_type: "portability"
  - patch_file: "patches/0005-tests-log-driver-shell.patch"
    patch_description: "Run Automake test driver and libtool test wrappers through SHELL instead of direct shebang execution."
    patch_type: "portability"
