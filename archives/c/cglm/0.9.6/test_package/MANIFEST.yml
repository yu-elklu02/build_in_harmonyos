# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cglm/0.9.6
homepage: "https://github.com/recp/cglm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/src/tests.c
    source: cglm-0.9.6/test/src/tests.c
    description: "cglm test runner with 1123 assertions covering vec2/3/4, mat2/3/4, quat, affine, euler, bezier, etc."
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verifies glmc_vec3_add, glmc_vec3_norm, glmc_translate API calls into libcglm"
    command: "./test_cglm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
