# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: colordiff/1.0.21-r0
homepage: "https://www.colordiff.org/"

# 上游无测试套件（Perl 脚本工具，Makefile 无 check 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_colordiff.sh 验证 colordiff/cdiff 脚本已安装、可执行、shebang 为 env perl、perl 语法正确且 --version 正常"
    command: "conan create (test_package: bash test_colordiff.sh <bin_dir>)"
  - file: test_colordiff.sh
    description: "真实冒烟测试:检查 bin/ 下 colordiff 和 cdiff 存在且可执行、shebang 为 env perl、perl -c 语法检查通过、colordiff --version 输出正常"
    command: "bash test_colordiff.sh <package bin dir>"

assertion_count: 4
