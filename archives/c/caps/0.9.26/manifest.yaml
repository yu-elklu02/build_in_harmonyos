build:
  system: makefile
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"
  - "0002-basics.h.patch"
  - "0003-dsp-v4f.h.patch"
  - "0004-dsp-v4f_IIR2.h.patch"

knowledge_gained:
  - "caps uses custom configure.py + Makefile, not autotools"
  - "basics.h uses glibc-specific __int8_t etc., replaced with standard C99 int8_t (unconditional)"
  - "v4f.h/v4f_IIR2.h use GCC builtins (__builtin_sinf) as template args, replaced with standard sinf/cosf"
  - "exp10f is GNU extension not in musl, replaced with powf(10,x) fallback"
  - "configure.py SSE detection naturally fails on aarch64 (no /proc/cpuinfo or no SSE), make clean fails silently"

