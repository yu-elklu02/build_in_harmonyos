# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: caps/0.9.26
homepage: "https://quitte.de/dsp/caps.html"

# caps has no upstream test suite (LADSPA plugin library, no make check target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream tests available
upstream_tests: []

# Consumer-perspective test: verifies ladspa_descriptor() is callable
test_package_tests:
  - file: test.c
    description: "Verify ladspa_descriptor(0) returns non-NULL (caps API works)"
    command: "./test_caps"

# Assertions: non-NULL return + printf output
assertion_count: 2
