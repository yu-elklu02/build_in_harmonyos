software: checkbashisms
display: "checkbashisms"
description: "检查 /bin/sh 脚本中 bash 特有语法（bashisms）的 Perl 脚本工具，来自 Debian devscripts 包"
category: development
homepage: "https://salsa.debian.org/debian/devscripts"
license: GPL-2.0
build_system: manual

ohos_adaptation:
  key_points:
    - "Perl 脚本，无需编译，直接解释执行"
    - "需修改 shebang：#!/usr/bin/perl → #!/usr/bin/env perl（鸿蒙 /usr/bin/perl 不存在）"
    - "替换 ###VERSION### 占位符为实际版本号"
  common_dependencies: []

versions:
  "2.25.28":
    status: built
    build_date: "2026-07-12"
    source_url: "https://salsa.debian.org/debian/devscripts/-/archive/v2.25.28/devscripts-v2.25.28.tar.gz"