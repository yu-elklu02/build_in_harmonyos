# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ciso/1.0
homepage: "https://sourceforge.net/projects/ciso/"

# 上游测试命令 (ciso has no make check target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ciso has no upstream tests)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ciso.c
    description: "Execute ciso binary via popen and verify usage output"
    command: "./test_ciso"

# 测试断言总数
assertion_count: 2
