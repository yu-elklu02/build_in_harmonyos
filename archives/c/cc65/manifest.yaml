software: cc65
display: "cc65"
description: "6502 系列 C 编译器套件，包含编译器、汇编器、链接器等交叉开发工具"
category: build-tool
homepage: "https://cc65.github.io/cc65/"
license: Zlib
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 使用 CC=$(CROSS_COMPILE)gcc，需通过 make CC={conan_cc} 覆盖（R33）"
    - "仅构建 src/ 目录（编译器工具），libsrc/ 需运行刚构建的 cc65 工具编译 6502 目标库，交叉编译环境跳过"
    - "无 configure 阶段，无 config.guess/config.sub 平台识别问题"
    - "无外部依赖，自包含构建"
  common_dependencies: []

versions:
  "2.19":
    status: built
    build_date: "2026-07-29"
