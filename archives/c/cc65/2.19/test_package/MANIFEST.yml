# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cc65/2.19
homepage: "https://cc65.github.io/cc65/"

# 上游测试命令
upstream_check_command: "make -C test"

# conanfile.py build() 方法中是否已集成上游测试
# cc65 上游 test/ 目录需运行 cc65 二进制，交叉编译环境跳过
upstream_test_in_build: false
upstream_test_command: ""

# cc65 上游测试套件位于 test/ 目录，包含 compile 和 util 测试
# 交叉编译环境无法运行 cc65 二进制，故跳过上游测试
upstream_tests:
  - file: test/compile
    source: cc65-2.19/test/compile
    description: "编译测试套件（需运行 cc65 二进制，交叉编译环境跳过）"
    command: "make -C test/compile"
  - file: test/util
    source: cc65-2.19/test/util
    description: "工具测试套件（需运行 cc65 二进制，交叉编译环境跳过）"
    command: "make -C test/util"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "cc65 --version 版本验证 + cc65 -c test.c 编译验证（R34 合规）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 1. cc65 --version  2. ca65 --version  3. cl65 --version
# 4. cc65 -c test.c  5. test.s exists
assertion_count: 5
