# test_package/MANIFEST.yml — ctags 6.2.1
# 上游官方测试来源声明
# CI L1 门禁通过此文件确定上游测试类型和执行方式
# 参考: ARCHIVE-SPEC.md §2 test_package/ 规范 + ci/conan/build_and_test.sh L1 检测逻辑

package: ctags
version: "6.2.1"

# 上游构建系统（CI 据此选择测试执行方式）
upstream:
  build_system: autotools
  # 测试类型: make_check | ctest | meson_test | pytest | none
  test_type: make_check
  # 上游官方测试命令
  test_command: "make check"
  # 测试工作目录（相对于源码根目录）
  test_directory: "."

# OHOS 平台兼容性
ohos_compatibility:
  # full | partial | none | unknown
  status: partial
  detail: "23 项测试失败，均为平台相关问题（HMDFS 文件系统限制、信号处理）；核心功能（标签生成、readtags）正常"
  known_failures:
    - "optscript 测试: Signal 11 (segfault) + Valgrind FATAL，HMDFS 文件系统限制导致 optscript 解释器崩溃"
    - "broken-extradef/fielddef/paramdef: 输出为空，与信号处理或文件系统行为有关"
    - "c-large-enum/epoch-field/kinddef/roledef: 平台差异导致输出不一致"

# Conan test_package 测试（L1 最小冒烟测试，CI 通过 conan create 自动执行）
conan_test:
  type: executable
  description: "运行 ctags 生成 C 标签，检查 main 标签和 C 语言解析器"
  test_method: "ctags -o tags ctags-test-input.c"

assertions:
  - "ctags --version contains Universal Ctags"
  - "ctags --list-languages contains C"
  - "generated tags contain main"
