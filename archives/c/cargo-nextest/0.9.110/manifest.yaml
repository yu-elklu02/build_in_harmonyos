software: cargo-nextest
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.110/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.110"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# 构建系统类型 (顶层字段)
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://static.crates.io/crates/cargo-nextest/cargo-nextest-0.9.110.crate"

  # 源码校验和
  sha256: "f6b114df12d9b2b59002fc41a82c25d98cea054cc11fbf66ad10be1d49b227c5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust Cargo 项目构建系统识别：脚本自动识别 cargo 构建系统时失败，需要手动设置 build.system=cargo"
  - "Rust 项目无 configure 步骤：直接使用 cargo build --release 编译"
  - "Rust 二进制静态链接：生成的 cargo-nextest 是静态链接，无需 RPATH 设置"
  - "G0 干净构建验证对于 Rust 项目不适用：Rust 项目无 configure 脚本，G0 验证会失败，但实际编译成功"
