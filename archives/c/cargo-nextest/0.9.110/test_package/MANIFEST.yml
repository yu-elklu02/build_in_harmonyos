# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cargo-nextest/0.9.110
homepage: "https://nexte.st"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cargo test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# cargo-nextest is a test runner itself; upstream tests require cargo to run
# its own test suite, which is a circular dependency. We use smoke test instead.
upstream_tests:
  - file: test.sh
    source: cargo-nextest-0.9.110/test_package/test.sh
    description: "Smoke test: verify cargo-nextest binary runs and reports version"
    command: "bash test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 验证 cargo-nextest --version 输出正确版本号"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
