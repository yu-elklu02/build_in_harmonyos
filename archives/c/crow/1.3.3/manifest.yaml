software: crow
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-14"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/CrowCpp/Crow/archive/refs/tags/v1.3.3.tar.gz"

  # 源码校验和
  sha256: "b18621bd69f851f2df288fac715785ff8e4d0d468b99fc930cb2ff45a26c4ca6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | header-only
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCROW_USE_BOOST=OFF"
    - "-DCROW_AMALGAMATE=OFF"
    - "-DCROW_BUILD_EXAMPLES=OFF"
    - "-DCROW_BUILD_TESTS=ON"
    - "-DCROW_ENABLE_SSL=OFF"
    - "-DCROW_ENABLE_COMPRESSION=OFF"

  # 编译依赖列表（格式: name/version）
  # asio、Catch2 与 CPM.cmake 均通过 conandata.yml 在 build() 阶段下载，非 Conan 声明依赖
  # - asio: header-only 依赖，嵌入打包到 crow 的 include 目录
  # - Catch2: 上游 tests 测试框架，仅用于 build() 阶段编译测试，不打包
  # - CPM.cmake: 上游依赖管理引导脚本，仅用于配置阶段，不打包
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - patch: "patches/0001-use-local-catch2.patch"
    description: "tests/CMakeLists.txt 优先使用本地 CATCH2_LOCAL_SOURCE_DIR 的 Catch2 源码，绕过 CPM 网络拉取 (CI worker 无法直连 github.com)"
    type: portability

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Crow 默认 CROW_USE_BOOST=OFF，使用独立 asio，不依赖 boost"
  - "Crow 是 header-only 库（CMake INTERFACE library），无需编译二进制"
  - "Crow 自带 Findasio.cmake 模块，通过 find_path(ASIO_INCLUDE_DIR asio.hpp) 查找 asio"
  - "asio 通过 conandata.yml asio_sources 在 build() 阶段从 GitHub 下载并嵌入打包，使 crow 包自包含"
  - "Crow 自带的 CPM 引导脚本会在 CMake 配置阶段直连 GitHub；通过 conandata.yml 预下载 CPM.cmake v0.40.2 并覆盖引导脚本，避免配置阶段联网"
  - "上游 tests/CMakeLists.txt 通过 CPM 拉取 Catch2 v3.15.1，CI 无法直连 github.com；通过预下载 Catch2 源码 + CATCH2_LOCAL_SOURCE_DIR cache 变量 + 补丁让 CPM 使用本地 SOURCE_DIR"
  - "OHOS 的 Conan arch=armv8 不能直接作为 CMAKE_SYSTEM_PROCESSOR，需映射为 aarch64；Linux 保留实际架构值"
  - "CI worker 为 OHOS/aarch64 原生环境 (非交叉编译)，上游测试在当前版本仅做编译验证，不运行 ctest，以避免已知网络/SSL 相关用例失败阻塞 CI"
