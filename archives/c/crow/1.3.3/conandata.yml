# conandata.yml — crow 1.3.3
# C++ 微型 Web 框架（header-only），基于 asio

sources:
  url: "https://github.com/CrowCpp/Crow/archive/refs/tags/v1.3.3.tar.gz"
  sha256: "b18621bd69f851f2df288fac715785ff8e4d0d468b99fc930cb2ff45a26c4ca6"

# asio 源码（header-only 依赖，CI worker 无法直连 github.com，需走镜像）
# CI 的 build_and_test.sh 会自动为 github.com URL 添加镜像 fallback
asio_sources:
  url: "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-30-2.tar.gz"
  sha256: "755bd7f85a4b269c67ae0ea254907c078d408cce8e1a352ad2ed664d233780e8"

# Catch2 源码（上游 tests/CMakeLists.txt 通过 CPM 拉取 Catch2 v3.15.1，
# CI worker 无法直连 github.com，故在 build() 阶段预下载并通过
# CATCH2_LOCAL_SOURCE_DIR cache 变量指向本地源码，配合补丁绕过 CPM 网络拉取）
catch2_sources:
  url: "https://github.com/catchorg/Catch2/archive/refs/tags/v3.15.1.tar.gz"
  sha256: "be23a52b85cf04cd9587612147a10b023d59ed9757fa1843cc99e615d6c0893c"

# CPM.cmake 引导脚本（Crow 源码中的 cmake/CPM.cmake 会在配置阶段直连 GitHub 下载，
# CI worker 网络受限，故在 build() 阶段预下载并覆盖该引导脚本）
cpm_source:
  url: "https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.40.2/CPM.cmake"
  sha256: "c8cdc32c03816538ce22781ed72964dc864b2a34a310d3b7104812a5ca2d835d"

patches:
  - patch_file: "patches/0001-use-local-catch2.patch"
    patch_description: "Use local Catch2 source via CATCH2_LOCAL_SOURCE_DIR if defined, fallback to CPM fetch"
    patch_type: "portability"
