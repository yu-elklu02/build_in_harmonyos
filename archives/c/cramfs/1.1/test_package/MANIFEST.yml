# test_package/MANIFEST.yml
# Upstream test declaration file (CI L0e requires this)

package: cramfs/1.1
homepage: "https://sourceforge.net/projects/cramfs/"

# cramfs has no automated test suite (no 'make check' target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream automated tests
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Create a cramfs image with mkcramfs and verify with cramfsck"
    command: "sh test.sh"

assertion_count: 2
