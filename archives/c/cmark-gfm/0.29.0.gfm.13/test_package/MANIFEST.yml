# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cmark-gfm/0.29.0.gfm.13
homepage: https://github.com/github/cmark-gfm

# 上游测试命令 (cmark-gfm 使用 ctest)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -j1"

# cmark-gfm 上游测试 (ctest 运行的测试)
upstream_tests:
  - file: api_test/main.c
    source: cmark-gfm-0.29.0.gfm.13/api_test/main.c
    description: "cmark-gfm C API 单元测试"
    command: "ctest --no-tests=error -R '^api_test$'"
  - file: spec_tests.py
    source: cmark-gfm-0.29.0.gfm.13/test/spec_tests.py
    description: "CommonMark 规范测试 (可执行文件模式)"
    command: "ctest --no-tests=error -R '^spectest_executable$'"
  - file: roundtrip_tests.py
    source: cmark-gfm-0.29.0.gfm.13/test/roundtrip_tests.py
    description: "往返测试 (可执行文件模式)"
    command: "ctest --no-tests=error -R '^roundtrip_extensions_executable$'"
  - file: entity_tests.py
    source: cmark-gfm-0.29.0.gfm.13/test/entity_tests.py
    description: "实体测试 (可执行文件模式)"
    command: "ctest --no-tests=error -R '^extensions_executable$'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 cmark_markdown_to_html 验证 Markdown 转 HTML 功能"
    command: "./test_cmark_gfm"

# test_package 实际检查点数量
assertion_count: 1
