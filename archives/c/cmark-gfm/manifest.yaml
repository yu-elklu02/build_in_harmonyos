software: cmark-gfm
display: "cmark-gfm"
description: "GitHub Flavored Markdown (GFM) parser and renderer - C implementation of CommonMark with GitHub extensions"
category: doc
homepage: "https://github.com/github/cmark-gfm"
license: BSD-2-Clause
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CMake 版本兼容性：需要 cmake_minimum_required VERSION >= 3.5（CMake 4.x 不支持 < 3.5）"
    - "扩展库路径问题：cmark-gfm 使用相对路径 ../extensions/ 加载扩展库，预编译包需正确设置 RPATH"
    - "ELF 签名要求：共享库需签名才能加载，测试受限但不阻塞编译"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "0.29.0.gfm.13":
    status: built
    build_date: "2026-08-06"
    has_conan_recipe: true