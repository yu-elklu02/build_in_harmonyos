# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: codec2/1.2.0
homepage: "https://www.rowetel.com/codec2.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# UNITTEST=OFF disables upstream tests (requires octave, unavailable on OHOS)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Note: UNITTEST=OFF disables unittest binaries; c2enc/c2dec are tools, not tests
upstream_tests:
  - file: src/c2enc.c
    source: codec2-1.2.0/src/c2enc.c
    description: "codec2 encoder CLI tool (not a test, used for manual verification)"
    command: "./c2enc 1300 raw/hts1a.raw out.c2"
  - file: src/c2dec.c
    source: codec2-1.2.0/src/c2dec.c
    description: "codec2 decoder CLI tool (not a test, used for manual verification)"
    command: "./c2dec 1300 out.c2 out.raw"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "codec2 encode/decode round-trip consumer test (creates instance, encodes, decodes, verifies non-zero output)"
    command: "./test_codec2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
