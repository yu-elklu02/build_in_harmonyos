# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: check/0.15.2
homepage: "https://libcheck.github.io/check/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/check_check.c
    source: check-0.15.2/tests/check_check.c
    description: "Check 上游测试套件（CI 中可能因 /tmp 权限跳过）"
    command: "make test 2>/dev/null"

test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libcheck 并运行单元测试"
    command: "./test_check"

assertion_count: 4
