package: Crypt-OpenSSL-RSA
version: "0.33"
upstream_tests:
  - name: "rsa.t"
    description: "RSA encryption/decryption/signing/verification tests"
    upstream_command: "make test"
    expected_result: "skipped (SELinux HMDFS prevents XS module loading)"
    notes: |
      Upstream test suite requires Crypt::OpenSSL::Random loaded at runtime.
      SELinux HMDFS restriction prevents XS module loading on HarmonyOS.
      Tests are validated via static analysis (perl -c, readelf) instead.
  - name: "bignum.t"
    description: "Bignum parameter tests"
    upstream_command: "make test"
    expected_result: "skip (optional Crypt::OpenSSL::Bignum not installed)"
  - name: "format.t"
    description: "Key format tests"
    upstream_command: "make test"
    expected_result: "pass"
adapted_tests:
  - name: "test_package"
    description: "Verify package contents (RSA.pm + RSA.so ELF)"
    command: "conan test test_package"
    expected_result: "pass"
