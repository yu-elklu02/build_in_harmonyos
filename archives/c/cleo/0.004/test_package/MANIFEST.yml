package: cleo/0.004
homepage: "https://github.com/thaljef/App-Cleo"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: t/compile.t
    description: "Perl Test::More use_ok('App::Cleo') 模块加载测试"

test_package_tests:
  - file: test_cleo.c
    description: "校验 bin/cleo 存在可执行 + shebang 为 perl + perl 可运行（OHOS 缺模块，不执行 perl -c）"
    command: "./test_cleo <cleo_bin> <perl>"

assertion_count: 2
