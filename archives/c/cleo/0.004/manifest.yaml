software: cleo
version: "0.004"
status: built
build_date: "2026-07-31"

source:
  url: "https://codeload.github.com/thaljef/App-Cleo/tar.gz/3e22cae6db3f54598990e8681eb0103376d067a4"
  sha256: "cfaa32b827fbb1d7825d32b3fd0c1c0cb7ad6d2a9fb0a56f57b61097b6a5c93b"
  tar_format: tar.gz

build:
  system: perl-makefile
  configure_options: []
  # aireview P2: conanfile.py requirements() 为空（perl 模块走系统 perl 非 Conan 包）
  # manifest 依赖声明需与配方一致 → 改为空数组，避下游误以为存在 Conan 依赖链
  dependencies: []
  cc: ""
  cxx: ""

patches_applied: []

test:
  upstream:
    count: 1
    command: "make test"
    result: "1/1 passed (t/compile.t use_ok App::Cleo)"
  consumer:
    count: 1
    api_calls:
      - "access(cleo_bin, X_OK)"
      - "读取 cleo shebang 验证 perl 路径"
    result: "PASS（OHOS 环境未执行 perl -c，仅验证二进制存在 + shebang 为 perl）"

knowledge_used: []

notes:
  - "cleo 是 Perl CLI 库（App::Cleo），ExtUtils::MakeMaker 构建系统（Makefile.PL）"
  - "5 个 Perl 模块走系统 perl 预装（CI 预装 perl + 模块），无 Conan 依赖声明"
  - "上游测试 t/compile.t 是 Perl Test::More use_ok('App::Cleo') 单点测试"
