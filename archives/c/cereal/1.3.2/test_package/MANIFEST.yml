package: cereal/1.3.2
homepage: "https://uscilab.github.io/cereal/"

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: unittests/*.cpp
    source: cereal-1.3.2/unittests
    description: "Upstream CTest suite; not enabled in the packaging build to keep the header-only install path small."
    command: "cmake --build . && ctest"

test_package_tests:
  - file: test.cpp
    description: "Consumer test: serialize and deserialize a struct with cereal::BinaryOutputArchive/BinaryInputArchive."
    command: "./test_cereal"

assertion_count: 3
