# test_package/MANIFEST.yml

package: cppcheck/2.21.0
homepage: "https://cppcheck.sourceforge.io/"

upstream_check_command: "cppcheck --version"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/cli/test-suppressions.cpp
    source: cppcheck-2.21.0/test/cli/test-suppressions.cpp
    description: "Suppressions CLI tests"
    command: "./test-suppressions"

test_package_tests:
  - file: test.c
    description: "对测试源码运行 cppcheck 静态分析，验证工具功能"
    command: "cppcheck --enable=all test.c"

assertion_count: 2
