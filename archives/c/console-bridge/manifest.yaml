software: console-bridge
display: "console_bridge"
description: "Logging shim that forwards log calls to a pluggable output handler"
category: library
homepage: "https://github.com/ros/console_bridge"
license: BSD-3-Clause
build_system: cmake

versions:
  "1.0.2":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方。纯 C++ 转发层，未打任何补丁——上游源码可直接用
      鸿蒙 PC 原生工具链构建。test_package 装一个自定义 OutputHandler，断言转发正文、
      四个级别各自的映射、setLogLevel 阈值过滤、以及 restorePreviousOutputHandler 后
      不再收到消息，共 4 组。其中阈值过滤是重点：这条逻辑坏掉不会报错，只会变成
      「全都打」或「一条不打」，只看「跑通了」发现不了。
