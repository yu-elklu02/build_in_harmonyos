software: check-jsonschema
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.28.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.28.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# 构建系统标识（verify-build 要求）
build_system: pip

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/python-jsonschema/check-jsonschema/archive/refs/tags/0.28.4.tar.gz"

  # 源码校验和
  sha256: "0a4f9410b05745af393a11b800dd1d57523c86b488361e856dee0d9682ef9698"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统标识（verify-build 要求）
  build_system: pip

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--break-system-packages"
    - "--no-warn-script-location"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - python/3.14
    - jsonschema/4.26.0
    - rpds-py/2026.5.1
    - regress/2025.10.1
    - ruamel.yaml/0.18.6
    - requests/2.34.2
    - click/8.4.1
    - charset_normalizer/3.4.7

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
runtime_modifications:
    - "rpds/__init__.py ctypes preload libgcc_s"
    - "regress/__init__.py ctypes preload libgcc_s"
    - "charset_normalizer/__init__.py ctypes preload libgcc_s"
    - "All .so files ELF signed"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "Python .so extension modules require ELF signing on HarmonyOS"
    - "HarmonyOS dynamic linker doesn't resolve $ORIGIN RPATH for bundled .libs directories; use ctypes preload in __init__.py"
    - "pip3 --prefix installation doesn't add usr/local to Python's site-packages search path; install to harmonybrew Python's site-packages instead"
