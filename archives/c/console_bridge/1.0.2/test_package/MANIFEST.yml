# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: console_bridge/1.0.2
homepage: https://github.com/ros/console_bridge

# 上游测试命令 (ctest -N 列出: console_TEST)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试 (cmake.test())
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# 源码: test/console_TEST.cc (gtest 套件, 13 个 TEST/TEST_F 用例)
# 补丁 0001 移除了 cppcheck/cpplint lint 测试 (非功能测试, 需联网下载)
upstream_tests:
  - file: test/console_TEST.cc
    source: console_bridge-1.0.2/test/console_TEST.cc
    description: "GTest 功能测试套件 (13 用例): 日志宏展开/标准输出/多参数格式化/OutputHandler 切换与恢复/日志级别设置/OutputHandlerFile 文件日志"
    command: "ctest --output-on-failure -R console_TEST"

# test_package 中自带的测试 (消费者视角验证, R34)
test_package_tests:
  - file: test.cpp
    description: "消费者冒烟测试: 编译 #include <console_bridge/console.h> 并调用 logInform/logWarn/logError API"
    command: "./test_console_bridge"

# 测试断言总数: 13 个 gtest 用例 (10 TEST + 3 TEST_F), 45 个 EXPECT_*/ASSERT_* 断言
# (本地逐行核验 test/console_TEST.cc: EXPECT_EQ 36 + EXPECT_NO_THROW 6 + EXPECT_TRUE 1 + EXPECT_NE 2)
assertion_count: 45
