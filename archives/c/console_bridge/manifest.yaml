software: console_bridge
display: "Console Bridge"
description: "ROS-independent logging library providing console message output"
category: library
homepage: "https://github.com/ros/console_bridge"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "标准 cmake 构建，无特殊适配需求"
    - "无平台相关代码，纯 C++ 实现"
  common_dependencies: []

versions:
