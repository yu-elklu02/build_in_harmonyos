    status: published
    build_date: "2026-06-05"
    notes: |
      - 标准 CMake 构建，无特殊适配需求
      - 提供 console_bridge::console_bridge 目标供 Conan 消费者使用
    dependencies: []
    provides:
      - libconsole_bridge.so
  "1.0.2.1":
    packaging: conan
    notes: "重做原 1.0.2：其产物无 SONAME，且自带 cmake target 写了 IMPORTED_NO_SONAME TRUE，下游链接后 DT_NEEDED 被烤成构建机 conan cache 绝对路径（A/B 实测：搬移目录后即无法加载）。"
    status: built
    build_date: "2026-07-29"
