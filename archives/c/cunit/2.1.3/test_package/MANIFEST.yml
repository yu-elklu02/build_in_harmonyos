package: cunit/2.1.3
homepage: "https://sourceforge.net/projects/cunit/"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: CUError.c
    source: CUnit/Sources/Framework/CUError.c
    description: "CUnit 错误处理模块测试"
    assertions: 15
  - file: MyMem.c
    source: CUnit/Sources/Framework/MyMem.c
    description: "CUnit 内存管理模块测试"
    assertions: 31
  - file: TestDB.c
    source: CUnit/Sources/Framework/TestDB.c
    description: "CUnit 测试数据库模块测试"
    assertions: 876
  - file: TestRun.c
    source: CUnit/Sources/Framework/TestRun.c
    description: "CUnit 测试运行模块测试"
    assertions: 475
  - file: Util.c
    source: CUnit/Sources/Framework/Util.c
    description: "CUnit 工具函数模块测试"
    assertions: 137
test_package_tests:
  - file: test_cunit.c
    description: "消费者测试：验证 CU_initialize_registry/CU_add_suite/CU_cleanup_registry API"
    command: "./test_cunit"
assertion_count: 1534
