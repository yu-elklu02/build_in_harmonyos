software: clinfo
display: "clinfo"
description: "枚举并打印系统中所有 OpenCL 平台与设备的全部已知属性"
category: utility
homepage: "https://github.com/Oblomov/clinfo"
license: CC0-1.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 autotools/cmake/meson"
    - "OHOS 系统不提供 OpenCL 头文件，配方内 vendor KhronosGroup/OpenCL-Headers 官方归档"
    - "可执行文件需 binary-sign-tool 自签才能在 HarmonyOS 上运行"
    - "运行时依赖系统 libOpenCL（ICD loader），无 OpenCL 平台时输出 'Number of platforms: 0' 并正常退出"
  common_dependencies: []

versions:
  "3.0.23.01.25":
    status: built
    build_date: "2026-08-15"
