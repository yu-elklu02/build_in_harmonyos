# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: clinfo/3.0.23.01.25
homepage: "https://github.com/Oblomov/clinfo"

# ── 上游测试审计 ──
# 审计结论: clinfo 3.0.23.01.25 上游没有任何测试
# 审计依据:
#   1. 官方 tarball (github.com/Oblomov/clinfo, tag 3.0.23.01.25) 解包后
#      仅含 src/*.c/.h、man1/clinfo.1、Makefile、Makefile.win、LICENSE，
#      不存在 tests/、test/、unittest 等任何测试目录或测试源文件；
#   2. Makefile 仅定义 all/clean/install/sparse 四个目标，无 check/test
#      目标；make -n check 无对应规则；
#   3. 上游 CI (Travis/AppVeyor) 只做编译构建，从不运行测试；
#   4. 该项目为单一诊断工具（一个 clinfo.c 直接打印 OpenCL 属性），
#      上游仓库 13 年历史中从未包含测试套件。
upstream_tests_exist: false
upstream_test_audit: "tarball 解包审计：无测试目录/测试源文件；Makefile 无 check/test 目标（仅 all/clean/install/sparse）；上游 CI 仅编译不测试；单文件诊断工具无测试套件"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_clinfo.sh
    description: "运行 clinfo --version 验证版本输出"
    command: "./test_clinfo.sh <clinfo_bin>"
  - file: test_clinfo.sh
    description: "运行 clinfo -l 验证平台/设备枚举（无 ICD 时输出 Number of platforms: 0 并正常退出）"
    command: "./test_clinfo.sh <clinfo_bin>"

# 测试断言总数
assertion_count: 2
