package: crasm/1.11
homepage: "https://sourceforge.net/projects/crasm/"

upstream_check_command: "make -C test -j1 SHELL=sh test"
upstream_test_in_build: true
upstream_test_command: "make -C test -j1 SHELL=sh test"
upstream_tests:
  - name: copy.6800.asm
    description: "Assemble 6800 copy sample and compare S-record output"
  - name: forth.6801.asm
    description: "Assemble 6801 Forth sample and compare S-record output"
  - name: math16.6502.asm
    description: "Assemble 6502 16-bit math sample and compare S-record output"
  - name: memcpy.6800.asm
    description: "Assemble 6800 memcpy sample and compare S-record output"
  - name: modem.6801.asm
    description: "Assemble 6801 modem sample and compare S-record output"
  - name: opcode.z80.asm
    description: "Assemble Z80 opcode coverage sample and compare S-record output"
  - name: stdnames.6801.asm
    description: "Assemble 6801 standard names sample and compare S-record output"
  - name: tstif.crasm.asm
    description: "Assemble conditional pseudo-op sample and compare S-record output"
  - name: tstinclude.crasm.asm
    description: "Assemble include pseudo-op sample and compare S-record output"
  - name: tstmacros.crasm.asm
    description: "Assemble macro sample and compare S-record output"
  - name: uchess2.65C02.asm
    description: "Assemble 65C02 chess sample and compare S-record output"

test_package_tests:
  - file: test_crasm.sh
    description: "Runs packaged crasm, assembles a tiny 6502 program, and compares normalized S-record output"
    command: "bash test_crasm.sh"

assertion_count: 13
