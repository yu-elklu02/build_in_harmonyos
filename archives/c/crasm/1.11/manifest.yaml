software: crasm
version: "1.11"
status: built
build_date: "2026-07-28"
build_system: "makefile"
conan_ref: "crasm/1.11"

source:
  url: "https://deb.debian.org/debian/pool/main/c/crasm/crasm_1.11.orig.tar.gz"
  sha256: "23983da187d5cd3e4e51d2fa4fe10a734660b5cb5c02e1bd01b62915137c6866"
  tar_format: tar.gz

build:
  system: makefile
  build_subdir: src
  configure_options:
    - "make -C src SHELL=sh CC=<conan-conf-c-compiler>"
    - "make -C test SHELL=sh test"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "crasm 1.11 is a standalone C89 command-line assembler with no external dependencies beyond libc/libm"
  - "Upstream hardcodes SHELL=/bin/sh in Makefiles; passing SHELL=sh avoids OHOS systems without /bin/sh"
  - "Upstream make test assembles 11 sample programs and compares S-record outputs under test/reference_output"
  - "test_package can verify the packaged CLI with a tiny 6502 assembly program and normalized S-record output"
