software: crasm
display: "crasm"
description: "Portable cross-assembler for 6800, 6502 and Z80 CPUs"
category: development
homepage: "https://sourceforge.net/projects/crasm/"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile CLI tool; build the src/ subdirectory directly"
    - "No external Conan dependencies are required; W0 dependency check passes"
    - "Override upstream SHELL=/bin/sh with SHELL=sh for OHOS compatibility"
    - "Run upstream make test after optional OHOS self-signing of the built executable"
  common_dependencies: []

versions:
  "1.11":
    status: built
    build_date: "2026-07-28"
    conan_ref: "crasm/1.11"
