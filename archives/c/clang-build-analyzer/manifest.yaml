software: clang-build-analyzer
display: "ClangBuildAnalyzer"
description: "Tool to analyze compilation time from clang -ftime-trace output"
category: build-tools
homepage: "https://github.com/aras-p/ClangBuildAnalyzer"
license: Unlicense
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake C++17 CLI tool; no external Conan dependencies (all vendored in src/external/)"
