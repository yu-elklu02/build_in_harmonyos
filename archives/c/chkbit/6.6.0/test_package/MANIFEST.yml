package: chkbit/6.6.0
homepage: https://github.com/laktak/chkbit

upstream_test_in_build: true
upstream_tests:
  - command: "go test . ./cmd/chkbit/util"
    description: "Run upstream root and cmd/chkbit/util Go tests on Linux and signed OHOS test binaries; exclude scripts tests that hard-code /tmp/chkbit"

test_package_tests:
  - file: test.sh
    description: "Run chkbit --help and validate chkbit version output against the packaged binary"
    command: "bash test.sh <bin/chkbit>"

assertion_count: 4
