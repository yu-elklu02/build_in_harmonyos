version: "6.6.0"
software: "chkbit"
status: built
build_date: "2026-07-31"
build_system: "go"

source:
  url: "https://github.com/laktak/chkbit/archive/refs/tags/v6.6.0.tar.gz"
  sha256: "69a5c709d78604ed9d21b5439b2fbae96e21f729d7d36f417d50348dc9fdcc81"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS pre-adaptation strategy)"
    - "GOARCH=<target arch>"
    - "GOTOOLCHAIN=local"
    - "Go 1.24.0 SDK auto-bootstrap when GO/GOROOT/PATH lacks a usable Go"
  dependencies: []
  tool_dependencies:
    - "go >= 1.24 (auto-downloaded from golang.google.cn with dl.google.com fallback when missing)"
    - "binary-sign-tool"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "chkbit 6.6.0 is a Go module CLI; command entry is ./cmd/chkbit."
  - "Go linker requires /data/storage/el2 tmpfs workspace on HarmonyOS to avoid HMDFS mmap permission denied."
  - "OHOS Go executables must be self-signed with binary-sign-tool before package/test execution."
  - "Targeted CI build_and_test passed for CI_PACKAGES=archives/c/chkbit/6.6.0."
  - "Recipe runs upstream Go tests for root and cmd/chkbit/util on Linux and as signed OHOS test binaries; scripts tests are excluded because they hard-code /tmp/chkbit, which is read-only on HarmonyOS."
  - "PR CI workers may not provide Go; the recipe bootstraps official Go 1.24.0 linux-amd64/linux-arm64 SDKs from golang.google.cn with dl.google.com fallback and pinned SHA256 and signs only unsigned SDK runtime tool binaries on OHOS before use."
