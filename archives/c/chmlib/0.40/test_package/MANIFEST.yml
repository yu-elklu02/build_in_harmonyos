test_file: test_chmlib.c
test_type: explicit
assertion_count: 1
description: |
  Tests chmlib API safety:
  1. chm_open on non-existent file returns NULL
  2. Minimal ITSF header file — chm_open + chm_close without crash
  Note: chm_close(NULL) and chm_resolve_object(NULL, ...) are undefined
  behaviour (SegFault on OHOS) and intentionally NOT tested.
