# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cloud-utils/0.33
homepage: "https://github.com/canonical/cloud-utils"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# cloud-utils has shell-based tests in test/ directory that require loop devices
# These tests (test-growpart, test-mic, etc.) are not run during conan build
# as they require kernel loop device support not available in all environments
upstream_tests:
  - file: test/test-growpart
    source: cloud-utils-0.33/test/test-growpart
    description: "Tests growpart partition resizing with loop devices"
    command: "./test/test-growpart"
  - file: test/test-growpart-lvm
    source: cloud-utils-0.33/test/test-growpart-lvm
    description: "Tests growpart with LVM partitions"
    command: "./test/test-growpart-lvm"
  - file: test/test-mic
    source: cloud-utils-0.33/test/test-mic
    description: "Tests mount-image-callback utility"
    command: "./test/test-mic"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_scripts.sh
    description: "Verifies installed scripts (growpart, write-mime-multipart, cloud-localds, ec2metadata) respond to --help"
    command: "sh test_scripts.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
