# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: cryptopp/8.9.0
homepage: "https://www.cryptopp.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: validat0.cpp
    source: cryptopp-8.9.0/validat0.cpp
    description: "Crypto++ validation suite part 0"
    command: "./cryptest.exe v"
  - file: validat1.cpp
    source: cryptopp-8.9.0/validat1.cpp
    description: "Crypto++ validation suite part 1"
    command: "./cryptest.exe v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "SHA256 hash test using cryptopp API"
    command: "./test_cryptopp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
