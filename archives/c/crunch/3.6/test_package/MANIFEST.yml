package: crunch/3.6
homepage: "https://github.com/crunchsec/crunch"

# crunch 上游无自动化测试套件（仅单文件二进制，无 make check）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "生成 2 字符 ab 集单词（aa/ab/ba/bb 共 4 个），验证输出行数及内容"
    command: "crunch 2 2 ab -o output.txt"

assertion_count: 3