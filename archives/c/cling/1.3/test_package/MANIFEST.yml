package: cling/1.3
homepage: "https://root.cern/cling/"

upstream_check_command: "cmake --build . --target check-cling"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test
    source: cling-1.3/test
    description: "Cling lit 回归测试树（262 个文件）；完整 LLVM 构建和 OHOS 构建树签名成本超出 PR CI 的可重复验证边界"
    command: "cmake --build . --target check-cling"

test_package_tests:
  - file: conanfile.py
    description: "执行包内 cling --version，并按上游输出契约精确核对解析后的 Conan 包版本"
    command: "cling --version"
  - file: CMakeLists.txt
    description: "通过 CMakeDeps 查找 cling::cling，并编译真实 libcling 嵌入式消费者"
    command: "cmake --build <test-package-build> --target cling_embedding"
  - file: embedding.cpp
    description: "启动嵌入式解释器并求值 6 * 7；解释器有效性、求值状态和结果各有独立失败判定"
    command: "cling_embedding <package>/bin/cling <package>"
  - file: smoke.sh
    description: "执行 52 个独立 Cling 进程；每项使用独立 C++17 输入、退出码和精确输出判定，覆盖标准容器、值类型、智能指针、函数对象、算法与数值算法"
    command: "bash smoke.sh <package>/bin/cling"

