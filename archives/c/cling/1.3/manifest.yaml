knowledge_gained:
  - "Cling 1.3 必须与 cling-llvm20-20260119-01 配套，不能使用仓库旧 LLVM 版本"
  - "LLVM 20 的 config.guess 和 HandleLLVMOptions 尚不识别 HarmonyOS"
  - "Cling 运行时依赖安装前缀内的 Clang resource headers，不能只复制或符号链接可执行文件"
  - "Conan 的 HarmonyOS CMake 映射必须显式恢复 UNIX 语义，才能启用 Cling 的局部 exceptions 和 C++ 头路径探测"
  - "CMake 内部目标若被条件 add_subdirectory 排除，target_link_libraries 会把同名裸项降级为 -l<name>"
  - "多源码 Conan 配方应在 conandata.yml 为每个补丁声明 base_path，并使用 apply_conandata_patches 路由"
  - "LLVM 共享目标在 HarmonyOS/HMDFS 上必须避免 VERSION/SOVERSION 生成的版本软链"
  - "E140 应同时覆盖官方 SDK 的 OHOS 与 Conan 工具链的 HarmonyOS CMake 系统名"
  - "Cling 不消费 libclang C API 或其 c-index/c-arcmt 测试工具，应一起关闭以避免无关软链和裸 -llibclang"
  - "CLI 版本测试必须遵循生产者的实际输出契约，不能臆测命令会包含产品名或品牌前缀"
  - "OHOS 的 package() 必须在 test_package 前完成 ELF 自签"
  - "嵌入式 Clang 的 C++ 头探测不能丢弃 OHOS sysroot 系统头目录"

