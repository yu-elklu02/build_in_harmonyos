software: cling
display: "Cling"
description: "基于 LLVM 和 Clang 的交互式 C++ 解释器"
category: build-tool
homepage: "https://root.cern/cling/"
license: "(LGPL-2.1-only OR NCSA) AND Apache-2.0 WITH LLVM-exception"
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用与 Cling 1.3 匹配的 cling-llvm20-20260119-01 LLVM/Clang 源码树"
    - "LLVM 的 config.guess 与 HandleLLVMOptions 需要识别 HarmonyOS"
    - "HarmonyOS CMake 配置需显式设置 UNIX=ON，恢复 Cling 的局部 exceptions 与 C++ 头路径探测"
    - "CLING_INCLUDE_TESTS=OFF 时仍需构建驱动必需的 clingUserInterface CMake 目标"
    - "Cling 是 JIT，正式 CI 需验证 OHOS 的可执行内存和 ELF 签名约束"
    - "bin/cling、lib/clang/20 资源头和 include 必须保持在同一安装前缀"
    - "相邻 Clang 返回非空但不完整的头路径时，必须从 CLING_CXX_INCL 补齐 OHOS sysroot，不能遮蔽完整 fallback"
  common_dependencies: []

versions:
  "1.3":
    status: built
    build_date: "2026-07-18"
    conan_ref: "cling/1.3"
