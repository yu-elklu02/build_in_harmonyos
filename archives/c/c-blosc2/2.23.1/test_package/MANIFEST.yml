# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: c-blosc2/2.23.1
homepage: "https://github.com/Blosc/c-blosc2"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 已集成：BUILD_TESTS=ON 构建上游测试二进制，build() 内执行 ctest 完整运行 1160 用例
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 120 -j1"

# 上游实际运行的测试程序（build() 中已执行 ctest 全量套件）
upstream_tests:
  - file: tests/test_blosc2.c
    source: c-blosc2-2.23.1/tests/test_blosc2.c
    description: "Upstream blosc2 core compression/decompression tests"
    command: "ctest -R test_blosc2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_c_blosc2.c
    description: "Consumer smoke test: blosc2_compress + blosc2_decompress round-trip"
    command: "./test_c_blosc2"

# 测试断言总数 (近似值)
assertion_count: 4
