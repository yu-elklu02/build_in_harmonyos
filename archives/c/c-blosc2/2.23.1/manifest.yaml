version: "2.23.1"
software: "c-blosc2"
status: built
build_date: "2026-08-01"
build_system: cmake

source:
  url: "https://github.com/Blosc/c-blosc2/archive/refs/tags/v2.23.1.tar.gz"
  sha256: "3a1a55d1e3794fb2b51a12e722d611b3e577443abb7ff9951666511f576ea3da"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_FUZZERS=OFF"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_PLUGINS=OFF"
    - "-DBUILD_STATIC=ON"
    - "-DBUILD_SHARED=OFF"
    - "-DPREFER_EXTERNAL_LZ4=OFF"
    - "-DPREFER_EXTERNAL_ZLIB=OFF"
    - "-DPREFER_EXTERNAL_ZSTD=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - patch_file: "patches/0001-zstd-cover.c-ohos-qsort-r-fallback.patch"
    description: "内置 ZSTD 1.5.7 cover.c 在 OHOS(musl) 无 qsort_r，无条件回退 C90 qsort()（POSIX 接口，无平台宏）"

knowledge_gained:
  - "c-blosc2 使用 cmake_minimum_required(VERSION 3.16.3)，CMake 4.x 无需 CMAKE_POLICY_VERSION_MINIMUM"
  - "内置 LZ4/zlib-ng/ZSTD 编解码器，无外部运行时依赖"
  - "BUILD_BENCHMARKS 依赖 clock_gettime，OHOS 不可用，需关闭"
  - "库 OUTPUT_NAME 为 blosc2，产物为 libblosc2.a / libblosc2.so"
  - "CMake config 为 Blosc2Config.cmake，目标名 Blosc2::blosc2"
  - "内置 ZSTD 1.5.7 cover.c 调用 GNU 扩展 qsort_r，OHOS musl 缺该符号，需回退 C90 qsort()"
  - "上游 CTest 套件 ctest -N 收集 1160 个用例（core 1134 + compat 26），OHOS arm64 串行执行 100% 通过"

test_results:
  type: upstream-ctest
  total: 1160
  passed: 1160
  failed: 0
  pass_rate: "100%"
  ctest_command: "ctest --output-on-failure --timeout 120 -j1"
  total_time_sec: 169.34
  breakdown:
    core: 1134
    compat: 26
  notes: "启用 BUILD_TESTS=ON 完整运行上游 CTest 套件；OHOS arm64 musl 二进制在 aarch64 主机原生执行（musl ld 兼容）"

knowledge_ref: []
