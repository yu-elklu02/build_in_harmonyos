package: carapace/1.11.7
homepage: https://github.com/carapace-sh/carapace

upstream_test_in_build: true
upstream_tests:
  - command: "go test . ./example/cmd ./example-nonposix/cmd"
    description: "Run root, example/cmd, and example-nonposix/cmd Go test suites via go.work workspace; on OHOS compile test binaries with -c, sign, and execute"

test_package_tests:
  - file: test.sh
    description: "Run example --help and example-nonposix --help, verify ELF magic on both binaries"
    command: "bash test.sh <package_folder>"

assertion_count: 6
