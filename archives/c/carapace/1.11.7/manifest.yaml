software: carapace
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11.7"

# 构建系统类型
build_system: go

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/carapace-sh/carapace/archive/refs/tags/v1.11.7.tar.gz"

  # 源码校验和
  sha256: "0ce5b6b7b1e4bfbe336424acf958e0bff4788c4214609c1d643ae54a73479b30"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: go

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: go
  cxx: ""

  # 构建说明
  # Go SDK 自动下载，CGO_ENABLED=0 纯 Go 编译
  # 使用 /data/storage/el2/base/haps/entry/files/ 工作区绕过 HMFS mmap 限制
  notes: "Go SDK auto-download, CGO_ENABLED=0, build from source via go build"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
