package: coin-osi/0.108.12
homepage: "https://github.com/coin-or/Osi"
variant: "full"
dependencies:
  - "coin-utils/2.11.13"

upstream_check_command: "make -C Osi/test unitTest && sign Osi/test/unitTest && make -C Osi/test test unittestflags=-mpsDir=<Data-Sample>"
upstream_test_in_build: true
upstream_test_command: "make -C Osi/test test unittestflags=-mpsDir=<Data-Sample>"

upstream_tests:
  - file: Osi/test/unitTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/unitTest.cpp
    description: "Upstream Osi unitTest executable. With all optional solver backends disabled, the upstream guard uses OsiTestSolver and runs the built-variant OsiRowCut, OsiColCut, OsiCuts, and OsiTestSolverInterface checks against official Data-Sample input."
    command: "make -C Osi/test test unittestflags=-mpsDir=<Data-Sample>"
    status: "enabled-in-build"
  - file: Osi/test/OsiCpxSolverInterfaceTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "CPLEX backend tests are guarded by COIN_HAS_CPX."
    status: "not_run"
    reason: "The recipe explicitly configures --without-cplex; CPLEX is a proprietary external solver and is not available as an ohpcd Conan dependency for this package."
  - file: Osi/test/OsiGlpkSolverInterfaceTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "GLPK backend tests are guarded by COIN_HAS_GLPK."
    status: "not_run"
    reason: "The recipe explicitly configures --without-glpk; enabling it would change this PR from Osi interface packaging into an additional solver dependency adaptation."
  - file: Osi/test/OsiGrbSolverInterfaceTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "Gurobi backend tests are guarded by COIN_HAS_GRB."
    status: "not_run"
    reason: "The recipe explicitly configures --without-gurobi; Gurobi is a proprietary external solver and is not available as an ohpcd Conan dependency for this package."
  - file: Osi/test/OsiMskSolverInterfaceTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "Mosek backend tests are guarded by COIN_HAS_MSK."
    status: "not_run"
    reason: "The recipe explicitly configures --without-mosek; Mosek is a proprietary external solver and is not available as an ohpcd Conan dependency for this package."
  - file: Osi/test/OsiSpxSolverInterfaceTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "SoPlex backend tests are guarded by COIN_HAS_SOPLEX."
    status: "not_run"
    reason: "The recipe explicitly configures --without-soplex; no corresponding solver package is included in this PR dependency closure."
  - file: Osi/test/OsiXprSolverInterfaceTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "XPRESS backend tests are guarded by COIN_HAS_XPR."
    status: "not_run"
    reason: "The recipe explicitly configures --without-xpress; XPRESS is a proprietary external solver and is not available as an ohpcd Conan dependency for this package."
  - file: Osi/src/OsiCommonTest/OsiNetlibTest.cpp
    source: Osi-0.108.12.tar.gz/Osi/test/Makefile.am
    description: "Netlib problem-set coverage is enabled only when COIN_HAS_NETLIB adds -netlibDir/-testOsiSolverInterface flags."
    status: "not_run"
    reason: "This package supplies official Data-Sample only for the default unitTest MPS inputs. It does not vendor coin-data-netlib, and the default OsiTestSolver path explicitly skips Netlib because the Vol-derived test solver cannot solve the Netlib problem set."

test_package_tests:
  - file: CMakeLists.txt
    description: "L0/L1: configure, compile, and link osi_smoke through coin-osi::libosi."
    command: "cmake --build ."
  - file: osi_smoke.cpp
    description: "L2: run the linked consumer and verify Osi plus transitive CoinUtils symbols."
    command: "./osi_smoke"

assertion_count: 2
