# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cattle-1.0/1.4.0
homepage: https://kiyuko.org/software/cattle

# 上游测试命令 — cattle 上游用 make check 运行 tests/ 套件
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# cattle 上游 tests/ 含 5 个测试（buffer/interpreter/program/references/tape）
upstream_tests:
  - file: tests/
    source: cattle-1.4.0/tests/
    description: "cattle 上游 make check 测试套件（5 个：buffer/interpreter/program/references/tape）"
    command: "make check"
    condition: "native 编译时执行，交叉编译跳过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "编译运行 test_cattle.c，调用 cattle_interpreter_new API 验证库链接与运行"
    command: "conan create (test_package: compile & run test_cattle.c)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1