# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cmark/0.31.2
homepage: https://github.com/commonmark/cmark

# 上游测试命令 (cmark 使用 ctest)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -j1"

# cmark 上游测试 (ctest 运行的测试)
upstream_tests:
  - file: main.c
    source: cmark-0.31.2.tar.gz/api_test/main.c
    description: "cmark C API 单元测试"
    command: "ctest --no-tests=error -R '^api_test$'"
  - file: normalize.py
    source: cmark-0.31.2.tar.gz/test/normalize.py
    description: "HTML 规范化测试"
    command: "ctest --no-tests=error -R '^html_normalization$'"
  - file: spec_tests.py
    source: cmark-0.31.2.tar.gz/test/spec_tests.py
    description: "CommonMark 规范测试"
    command: "ctest --no-tests=error -R '^spectests$'"
  - file: smart_punct.txt
    source: cmark-0.31.2.tar.gz/test/smart_punct.txt
    description: "智能标点规范测试"
    command: "ctest --no-tests=error -R '^smartpuncttests$'"
  - file: regression.txt
    source: cmark-0.31.2.tar.gz/test/regression.txt
    description: "回归测试"
    command: "ctest --no-tests=error -R '^regressiontests$'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 cmark_markdown_to_html 验证 Markdown 转 HTML 功能"
    command: "./test_cmark"

# test_package 实际检查点数量
assertion_count: 1
