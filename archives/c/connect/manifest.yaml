# 软件级 manifest — connect
# 遵循 ARCHIVE-SPEC v3.0

software: connect
display: "connect (ssh-connect)"
description: "通过 SOCKS4/5 与 HTTP 隧道中继 TCP 连接的命令行工具，常用作 ssh 的 ProxyCommand"
category: network
homepage: "https://github.com/gotoh/ssh-connect"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 CC=gcc，需从 Conan profile 注入 clang（R33）"
    - "OHOS libc(musl) 已内置 resolver/socket，必须置空 LDLIBS，不链接 -lresolv/-lsocket/-lnsl"
    - "上游 Makefile 无 install 目标，由 package() 手动安装 bin/connect"
    - "switch_ns() 使用 glibc 的 _res 全局解析器状态，musl 无此结构会编译失败；补丁 0001 改为在 musl 上直接向 -R 指定的 nameserver 发 UDP DNS 查询"
  common_dependencies: []

versions:
  "1.106":
    status: built
    build_date: 2026-07-11
