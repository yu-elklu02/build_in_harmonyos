# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: connect/1.106
homepage: "https://github.com/gotoh/ssh-connect"

# 上游 Makefile 只有 all/clean/veryclean/rebuild 目标，没有 check/test 目标，
# 也没有任何测试源码或测试脚本（源码包仅含 connect.c / Makefile / doc / relay.el）。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_connect.c
    description: "执行 connect -V，断言输出包含 Version 1.106"
    command: "./test_connect <connect-bin>"
  - file: test_connect.c
    description: "connect -n 直连模式：与进程内 TCP 服务端做 stdio<->socket 双向中继"
    command: "./test_connect <connect-bin>"
  - file: test_connect.c
    description: "connect -H HTTP 隧道：断言 CONNECT 请求行格式，并在 200 响应后验证数据中继"
    command: "./test_connect <connect-bin>"
  - file: test_connect.c
    description: "connect -5 SOCKS5：断言握手与 CONNECT 请求（ATYP=3 远端解析），并验证数据中继"
    command: "./test_connect <connect-bin>"

# 测试断言总数 (test_connect.c 中 check() 调用数)
assertion_count: 6
