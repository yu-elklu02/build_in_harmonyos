# 版本级 manifest — connect 1.106
# 遵循 ARCHIVE-SPEC v3.0

version: "1.106"
software: "connect"

# built = 配方完成、测试用例本地验证通过，尚未由 CI upload 到制品仓
status: built

build_date: "2026-07-11"
build_system: "makefile"

source:
  url: "https://github.com/gotoh/ssh-connect/archive/refs/tags/1.106.tar.gz"
  sha256: "4f07eec36e6da2c4641a9ea9a2fd0617d6fc6aff5b65b6433f8a6447bea8a002"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CC=<tools.build:compiler_executables.c>'
    - 'CFLAGS=-O2 -fPIE -D_GNU_SOURCE -DSOCKLEN_T=socklen_t'
    - 'LDFLAGS=-pie -Wl,-z,relro,-z,now'
    - 'LDLIBS='
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-connect.c.patch"
  - "0002-connect.c.patch"

knowledge_gained:
  - "上游 Makefile 的 uname 分支只覆盖 Darwin/SunOS/Windows，OHOS 落入通用 UNIX 分支，构建本身无需补丁"
  - "musl(含鸿蒙 libc) 声明了 res_init() 但没有 glibc 的 _res 全局解析器状态：任何用 _res.nsaddr_list/_res.nscount 覆盖 nameserver 的代码在 OHOS 上编译失败(use of undeclared identifier '_res')，需改为直接向指定 nameserver 发 UDP DNS 查询"
  - "鸿蒙上 uid 不在 /etc/passwd 中，getpwuid() 返回 NULL：任何把 getpwuid() 失败当致命错误的代码在 OHOS 上会启动即 abort，应回退到 $USER/$LOGNAME/$HOME 或 uid 本身"
  - "musl 把 resolver 与 socket 并入 libc，Makefile 中面向 Solaris/macOS 的 -lresolv/-lsocket/-lnsl 必须置空"
  - "CLI 中继类工具可用『进程内起 TCP/HTTP-proxy/SOCKS5 服务端 + fork/exec 被测二进制』的方式做真实端到端测试，而不是只跑 --version"
