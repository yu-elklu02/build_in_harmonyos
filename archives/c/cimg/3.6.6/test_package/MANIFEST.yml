# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cimg/3.6.6
homepage: "https://cimg.eu/"

# 上游测试命令
# CImg 没有正式的测试框架，Homebrew formula 的 test 编译 examples/image2ascii
# 上游 examples/ 目录包含示例程序，但依赖 X11 显示库，鸿蒙 PC 上不可用
upstream_check_command: "make -C examples image2ascii"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（依赖 X11，鸿蒙 PC 上不可编译）
upstream_tests:
  - file: examples/image2ascii.cpp
    source: CImg-3.6.6/examples/image2ascii.cpp
    description: "图像转 ASCII 示例（依赖 X11 显示，鸿蒙 PC 上不可用）"
    command: "make -C examples image2ascii"

# test_package 中自带的测试（消费者视角验证）
# 禁用 X11 显示功能（cimg_display=0），纯计算测试
test_package_tests:
  - file: test_cimg.cpp
    description: "消费者测试: 验证 CImg.h 可编译，图像创建、像素访问、算术运算、模糊、CImgList 操作"
    command: "./test_cimg"

# 测试断言总数（近似值）
# test_cimg.cpp 包含 5 个测试断言（尺寸/像素/算术/模糊/列表）
assertion_count: 5
