# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.10"

# 软件名
software: "carla"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/falkTX/Carla/archive/refs/tags/v2.5.10.tar.gz"

  # 源码校验和
  sha256: "ae2835b12081f7271a6b0b25d34b87d36b022c40370028ca4a10f90fcedfa661"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-drop-fno-gnu-unique-for-clang.patch"
  - "patches/0002-replace-fts-with-nftw-for-musl.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "carla 的 source/Makefile.mk 在非 macOS/Windows/BSD 平台硬加 -fno-gnu-unique，这是 GCC 特有标志（控制 C++ weak symbol unique 化），clang 不识别报 'unknown warning option'。补丁移除该标志"
  - "carla 的 source/modules/ysfx/sources/ysfx_utils_fts.cpp 用 glibc 扩展 <fts.h> 的 fts_open/fts_read/fts_close 做目录遍历，鸿蒙 musl 不提供 <fts.h>。补丁用 POSIX nftw（<ftw.h>）重写 visit_directories，thread_local 全局承载 visitor 和 stop flag"
  - "carla 的 source/Makefile.deps.mk 默认 CC=gcc/CXX=g++，鸿蒙工具链是 clang。用 make 命令行参数 CC=clang CXX=clang++ 覆盖（命令行参数优先级高于环境变量和 Makefile 的 ?= 赋值）"
  - "carla 是 application 类型（cpp_info.libdirs=[]），无任何必需运行时依赖；所有音频驱动（ALSA/JACK/PulseAudio）、GUI（Qt）、插件格式（LV2/VST）都是可选功能，pkg-config 检测不到就跳过"
  - "carla-discovery-native 二进制无 --version 标志，无参数时打印 usage 行（'[carla] usage: ...'），退出码在不同构建间不稳定（0 或 1）。test_package 应断言 stdout 含 'usage:' 而非依赖 returncode"
  - "Conan 2.x self.run(env=...) 参数要求是 list of 'KEY=VALUE' 字符串，不是 dict；且会替换而非追加环境，PATH 等基本变量需手动传入"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
