# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: carla/2.5.10
homepage: "https://kx.studio/Applications:Carla"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_carla.sh
    description: "验证 carla-discovery-native 二进制存在、可执行、打印 usage 行；验证 libcarla_utils.so 存在"
    command: "sh test_carla.sh <pkg_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
