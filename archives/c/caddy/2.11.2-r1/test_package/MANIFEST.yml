package: caddy/2.11.2-r1
homepage: https://caddyserver.com

upstream_test_in_build: false
upstream_tests:
  - command: "go test ./cmd/caddy/ ./"
    description: "Run upstream caddy core and cmd tests (Linux only, skipped on OHOS due to signing constraints)"

test_package_tests:
  - file: test.sh
    description: "Run caddy version and validate output contains v2.11.2; verify help subcommand"
    command: "bash test.sh <bin/caddy>"

assertion_count: 2
