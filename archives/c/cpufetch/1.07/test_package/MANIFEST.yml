package: cpufetch/1.07
homepage: "https://github.com/Dr-Noob/cpufetch"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_scope: "Upstream does not provide an automated test target"
upstream_test_waiver: "Three deterministic functional checks are supplied by test_package"
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Verifies the packaged cpufetch executable is discoverable"
    command: "command -v cpufetch"
  - file: test.sh
    description: "Runs CPU detection and validates non-empty CPU-related output"
    command: "cpufetch"
  - file: test.sh
    description: "Validates that the help interface reports usage or options"
    command: "cpufetch --help"

assertion_count: 3
