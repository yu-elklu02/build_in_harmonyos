software: coinor-osi
display: "COIN-OR Osi"
description: "COIN-OR Open Solver Interface: uniform API over LP/MIP solvers"
category: library
homepage: "https://github.com/coin-or/Osi"
license: EPL-2.0
build_system: autotools

versions:
  "0.108.11":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方，未打补丁。

      两处打包要点：
      - COIN-OR 把公开头装在 **include/coin/** 子目录，而源码按 `#include "CoinPragma.hpp"`
        裸名引用。依赖 coinutils 是已发布包、其 includedirs 漏了这一层，
        故用 `--pc-cflags "coinutils=-I${includedir}/coin"` 补进 .pc 的 Cflags。
        （`--inject-dep-includes` 只注入顶层 include、展不开子目录，实测无效。）
      - 需显式依赖 zlib：coinutils 用它读压缩 MPS 文件，否则 Osi 链接期缺
        gzopen/gzread 等符号。

      test_package 构造稀疏矩阵，断言维度、非零元个数、按行列取回的系数、
      以及稀疏点积，共 4 组。
