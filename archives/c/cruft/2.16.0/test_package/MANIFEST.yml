package: cruft/2.16.0
homepage: "https://github.com/cruft/cruft"

upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: "cruft-2.16.0/tests/"
    description: "上游 pytest 测试套件，需要 cookiecutter 和 git 环境"
    command: "pytest tests/"

test_package_tests:
  - file: test.py
    description: "功能测试: cruft.create 创建项目、cruft.check 验证同步、cruft.diff 检测变更"
    command: "python3 test.py"

assertion_count: 3
