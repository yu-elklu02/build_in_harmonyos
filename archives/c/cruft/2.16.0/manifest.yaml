software: cruft
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.16.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.16.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/c/cruft/cruft-2.16.0.tar.gz"

  # 源码校验和
  sha256: "184662853fbc1c16c0137fe0e9444e0cbe95e40362f5ebb2d9fae33d9223e73f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # Python dependencies installed via pip (not Conan requires):
  # - cookiecutter==2.6.0
  # - gitpython==3.1.43
  # - typer==0.15.1
  # - click==8.1.8
  # - toml==0.10.2
  dependencies: []

  # 编译器 (纯 Python 包，不适用)
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cruft is a pure Python package built with hatchling, no C/C++ compilation needed"
  - "Runtime deps: cookiecutter, gitpython, typer, click, toml (pinned to uv.lock versions)"
  - "OHOS Python posix_spawn requires resolving bare subprocess commands to absolute paths (sitecustomize.py)"
  - "Use sys.executable -m pip instead of pip directly in Conan build environment"
  - "Use --prefix for proper Python directory structure (lib/pythonX.Y/site-packages)"
  - "Use --no-deps to avoid bundling dependencies into the Conan package"
