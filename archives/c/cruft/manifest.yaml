software: cruft

# 库级 manifest
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: cruft

# 软件描述
description: "Allows you to maintain all the necessary cruft for packaging and building projects separate from the code you intentionally write. Built on-top of, and fully compatible with, CookieCutter."

# 官方网站
homepage: https://cruft.github.io/cruft/

# 许可证
license: MIT

# ============================================================
# 分类信息
# ============================================================

# 软件类型
# library | application | tool | framework
type: tool

# 编程语言
language: python

# 标签
tags:
  - python
  - cookiecutter
  - template
  - project-management

# ============================================================
# 上游信息
# ============================================================

# 上游仓库
repository:
  type: git
  url: https://github.com/cruft/cruft

# 发布地址
releases:
  - url: https://pypi.org/project/cruft/

# ============================================================
# 适配信息
# ============================================================

# 已适配版本列表
versions:
  - "2.16.0"

# 当前维护状态
# active | maintained | deprecated | archived
status: active
