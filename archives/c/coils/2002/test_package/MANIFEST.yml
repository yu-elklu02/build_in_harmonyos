# Upstream test declaration required by ci/conan/build_and_test.sh (L0e).
package: coils/2002
homepage: "https://packages.debian.org/source/stable/coils"

# coils has no test framework. The README documents this functional invocation.
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "COILSDIR=<source> ncoils -f < 1srya.fa"
upstream_tests:
  - file: 1srya.fa
    source: coils-2002/1srya.fa
    description: "README coiled-coil prediction example with expected coil segments."
    command: "COILSDIR=<source> ncoils -f < 1srya.fa"

test_package_tests:
  - file: test_coils.sh
    description: "Verifies the packaged predictor emits the README FASTA header and coil segments."
    command: "sh test_coils.sh"

assertion_count: 2
