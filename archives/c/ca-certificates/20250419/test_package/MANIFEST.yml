# test_package/MANIFEST.yml
# Upstream test declarations for ca-certificates
# CI script (build_and_test.sh L0e) requires this file

package: ca-certificates/20250419
homepage: "https://salsa.debian.org/debian/ca-certificates"

# ca-certificates has no traditional test suite
upstream_check_command: "cd mozilla && python3 certdata2pem.py"
upstream_test_in_build: true
upstream_test_command: "cd mozilla && python3 certdata2pem.py"

# Upstream tests
upstream_tests:
  - file: mozilla/certdata2pem.py
    source: ca-certificates/mozilla/certdata2pem.py
    description: "Certificate generation script — converts Mozilla certdata.txt to PEM"
    command: "cd mozilla && python3 certdata2pem.py"

# Consumer test (test_package)
test_package_tests:
  - file: test_verify.py
    description: "Verifies certificate count, PEM format, and update-ca-certificates presence"
    command: "python3 test_verify.py"

# Approximate assertion count
assertion_count: 5
