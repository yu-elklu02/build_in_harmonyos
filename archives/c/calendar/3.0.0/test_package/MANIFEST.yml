# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: calendar/3.0.0
homepage: "https://github.com/ocaml-community/calendar"

# 上游测试命令（dune runtest；OHOS 无 OCaml 工具链未执行）
upstream_check_command: "dune runtest"
upstream_test_in_build: false
upstream_test_command: "dune runtest"

# 上游实际运行的测试程序
upstream_tests:
  - file: "tests/"
    source: "calendar-3.0.0.tar.gz/tests/"
    description: "OCaml 单元测试（dune runtest）"
    command: "dune runtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_failed_archive.py
    description: "验证失败归档包含明确状态(status: failed)、失败原因(OCaml/dune 工具链缺失)与 OHOS 说明"
    command: "python3 test_failed_archive.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
