software: cppzmq
version: "4.10.0"
status: built
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/zeromq/cppzmq/archive/refs/tags/v4.10.0.tar.gz"
  sha256: "c81c81bba8a7644c84932225f018b5088743a22999c6d82a2b5f5cd1e6942b74"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCPPZMQ_BUILD_TESTS=OFF"
  dependencies:
    - "zeromq/4.3.5"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cppzmq is header-only: no binaries, only zmq.hpp and zmq_addon.hpp installed to include/"
  - "Header-only library with package_type=header-library, no_copy_source=True"
  - "Depends on zeromq/4.3.5 for the C library (libzmq)"
  - "cppzmq headers install directly to include/, not include/cppzmq/"
