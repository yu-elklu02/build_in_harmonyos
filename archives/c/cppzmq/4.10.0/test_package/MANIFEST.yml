package: cppzmq/4.10.0
homepage: "https://github.com/zeromq/cppzmq"

upstream_check_command: "cmake -DCPPZMQ_BUILD_TESTS=ON .. && ctest --test-dir build --output-on-failure -j1"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure -j1"

upstream_tests:
  - file: tests/*.cpp
    source: cppzmq-4.10.0/tests/
    description: "Upstream Catch2 test suite: tests for cppzmq C++ wrapper API."
    command: "ctest --test-dir build --output-on-failure -j1"
    result: "Catch2 tests require FetchContent download; verified via consumer test on OHOS."

test_package_tests:
  - file: test_cppzmq.cpp
    description: "Consumer test: create context, socket, send/receive messages, test multipart (zmq_addon)."
    command: "./test_cppzmq"

assertion_count: 6
