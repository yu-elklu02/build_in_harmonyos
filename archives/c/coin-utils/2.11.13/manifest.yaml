software: coin-utils
version: "2.11.13"
upstream_version: "2.11.13"
status: draft
build_system: autotools

source:
  url: "https://github.com/coin-or/CoinUtils/archive/refs/tags/releases/2.11.13.tar.gz"
  sha256: "ddfea48e10209215748bc9f90a8c04abbb912b662c1aefaf280018d0a181ef79"

build:
  system: autotools
  components:
    - CoinUtils
  dependencies:
    - bzip2/1.0.8
    - zlib/[>=1.2.11 <2]
  disabled:
    - blas
    - lapack
    - glpk
    - asl

patches_applied:
  - file: "patches/0001-no-check-pkgconfig.patch"
    description: "Disable the install-time pkg-config --libs check for cross builds."
  - file: "patches/0002-coinutils-config-guess.patch"
    description: "Teach CoinUtils/config.guess to recognize HarmonyOS as Linux with musl."
  - file: "patches/0003-root-config-guess.patch"
    description: "Teach the root config.guess to recognize HarmonyOS as Linux with musl."

validation:
  upstream_tests:
    total: 0
    passed: 0
    status: not_run
    reason: "Upstream validation requires target CI resources and optional sample data."
  test_package:
    total: 1
    passed: 1
    status: passed
    command: "conan create archives/c/coin-utils/2.11.13 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=coin-utils/*"
  local_static:
    status: passed
    checks:
      - "python -m py_compile conanfile.py test_package/conanfile.py"
      - "git diff --check"
  ohos:
    status: passed
    reason: "L0-L2 build, link, signing, and runtime validation passed on an OpenHarmony PC target."

knowledge_used:
  - "PR #3519 accepted draft metadata until CI evidence is available."
  - "CoinUtils is the base dependency for coin-osi, coin-clp, and coin-cbc."
  - "BLAS/LAPACK/Glpk/ASL are optional and disabled by configure arguments."
  - "Versioned patches update both config.guess copies without an external build requirement."
