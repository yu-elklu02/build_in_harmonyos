# 软件级 manifest
# 文件位置: archives/c/cpputest/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cpputest

# 显示名
display: "CppUTest"

# 一句话描述
description: "C/C++ 单元测试框架, 支持内存泄漏检测和测试桩"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://github.com/cpputest/cpputest"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "C/C++ 单元测试框架, 无第三方依赖, 构建简单"
    - "CMake 构建为静态库, 生成 CppUTest + CppUTestExt 两个库"
    - "需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 (OHOS 适配)"
    - "支持内存泄漏检测 (MEMORY_LEAK_DETECTION) 和测试桩扩展 (EXTENSIONS)"
    - "版本号中的 '-' 需用 '_' 替代 (Conan 版本号规范)"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.0_r2":
    status: published
    build_date: 2026-07-13
