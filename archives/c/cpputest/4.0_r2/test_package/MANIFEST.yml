# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpputest/4.0_r2
homepage: "https://github.com/cpputest/cpputest"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试由 TESTS=ON 构建, 使用 CTest 运行。本适配关闭了 TESTS 以加速构建。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 tests/CppUTest/ 和 tests/CppUTestExt/ 目录下有大量测试文件
# 编译为单一测试可执行程序, 通过 CTest 运行
upstream_tests:
  - file: AllTests.cpp
    source: cpputest-v4.0/tests/CppUTest/AllTests.cpp
    description: "主测试入口 (汇聚所有 CppUTest 测试)"
    command: "ctest"
  - file: TestMemoryAllocator.cpp
    source: cpputest-v4.0/tests/CppUTest/TestMemoryAllocator.cpp
    description: "内存分配器测试"
    command: "ctest"
  - file: TestPlugin.cpp
    source: cpputest-v4.0/tests/CppUTest/TestPlugin.cpp
    description: "插件系统测试"
    command: "ctest"
  - file: TestUTestMacro.cpp
    source: cpputest-v4.0/tests/CppUTest/TestUTestMacro.cpp
    description: "测试宏测试 (CHECK, CHECK_EQUAL, STRCMP_EQUAL 等)"
    command: "ctest"
  - file: TestHarness_c.cpp
    source: cpputest-v4.0/tests/CppUTest/TestHarness_c.cpp
    description: "C 测试框架测试"
    command: "ctest"
  - file: TestHarness.cpp
    source: cpputest-v4.0/tests/CppUTest/TestHarness.cpp
    description: "测试框架核心测试"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cpputest.cpp
    description: "用 cpputest 编写 6 个单元测试: 加法(3)、乘法(2)、字符串比较(1), 验证 CHECK_EQUAL 和 STRCMP_EQUAL 宏可用"
    command: "./test_cpputest"

# 测试断言总数 (近似值, 用于质量评估)
# 6 个测试断言: AddPositiveNumbers, AddZero, AddNegative, MultiplyPositive, MultiplyByZero, StringComparison
assertion_count: 6
