# 版本级 manifest
# 文件位置: archives/c/cpputest/4.0_r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0_r2"

# 软件名
software: "cpputest"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-13"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (上游 GitHub tag 为 v4.0, 打包修订版 r2)
  url: "https://github.com/cpputest/cpputest/archive/refs/tags/v4.0.tar.gz"

  # 源码校验和
  sha256: "0b66d20661f232d2a6af124c4455c8ccc9a4ce72d29f6ad4877eb385faaf5108"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DTESTS=OFF"
    - "-DEXAMPLES=OFF"
    - "-DEXTENSIONS=ON"
    - "-DMEMORY_LEAK_DETECTION=ON"
    - "-DC++11=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  # cpputest 无第三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cpputest 是 C/C++ 单元测试框架, 无第三方依赖, 使用 CMake 构建"
  - "生成 CppUTest (主库) + CppUTestExt (扩展库) 两个静态库"
  - "E092: CMake 不识别 OHOS 平台, 需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "上游版本号 4.0-r2 中的 '-' 在 Conan 版本号中不合法, 使用 4.0_r2 替代"
  - "上游测试由 TESTS=ON 构建, 通过 CTest 运行; 本适配关闭 TESTS 以加速构建, test_package 使用自带测试"
  - "支持内存泄漏检测 (MEMORY_LEAK_DETECTION) 和测试桩扩展 (EXTENSIONS)"
