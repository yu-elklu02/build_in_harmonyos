# 平台适配
platform_notes: |
  Crypt::OpenSSL::Guess 是纯 Perl 模块，无 XS 组件，编译简单。

  功能：OpenSSL 路径检测辅助工具
  - openssl_inc_paths(): 返回 OpenSSL include 路径
  - openssl_lib_paths(): 返回 OpenSSL lib 路径
  - find_openssl_prefix(): 查找 OpenSSL 安装前缀

  鸿蒙平台：
  - ✅ 编译成功，无问题
  - ✅ 可加载，功能正常
  - 用于 Crypt::OpenSSL::RSA/Random 的 Makefile.PL 配置

