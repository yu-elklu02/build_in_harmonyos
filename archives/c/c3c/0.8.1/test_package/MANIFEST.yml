# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: c3c/0.8.1
homepage: "https://c3-lang.org"

# 无 LLVM 后端也可运行的上游内置编译器自测入口
upstream_check_command: "c3c utest"

# conanfile.py build() 在构建产物上执行，test_package 在安装产物上复验
upstream_test_in_build: true
upstream_test_command: "c3c utest"

upstream_tests:
  - name: "compiler internal tests"
    file: src/compiler_tests/tests.c
    source: c3c-0.8.1/src/compiler_tests/tests.c
    description: "上游内置的 i128、arena allocator 和 JSON parser 自测，不依赖 LLVM 代码生成后端"
    command: "c3c utest"

# 完整 ci_tests.sh、test/test_suite 和 test/unit 需要 LLVM 代码生成后端；OHOS 包未宣称运行这些测试。
test_package_tests:
  - file: test.c
    description: "验证 c3c 编译器可执行并输出版本信息"
    command: "./test_c3c"
  - file: conanfile.py
    description: "对安装后的 c3c 再次运行上游内置编译器自测"
    command: "c3c utest"

# 上游 tests.c 含 79 个 TEST_ASSERT/TEST_ASSERTF，另有 1 个消费者命令退出码断言
assertion_count: 80