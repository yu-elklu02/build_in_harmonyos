software: c3c
# 版本级 manifest
# 文件位置: archives/c/c3c/0.8.1/manifest.yaml

version: "0.8.1"
status: built
build_date: "2026-07-11"

source:
  url: "https://github.com/c3lang/c3c/archive/refs/tags/v0.8.1.tar.gz"
  sha256: "fb4091d3c8e33c3d348124396ee46a826289428c2e9e4afde23c936245bbda30"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DC3_WITH_LLVM=OFF"
    - "-DC3_FETCH_LLVM=OFF"
    - "-DCMAKE_C_FLAGS=-DAVR_DISABLE -DARM_DISABLE -DRISCV_DISABLE -DWASM_DISABLE -DX86_DISABLE -Wno-error=switch"
    - "-DCMAKE_CXX_FLAGS=-DAVR_DISABLE -DARM_DISABLE -DRISCV_DISABLE -DWASM_DISABLE -DX86_DISABLE -Wno-error=switch"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "LLVM 预编译包（linux-aarch64）用 GCC/libstdc++ 编译，与 OHOS clang/libc++ ABI 不兼容，需从源码编译"
  - "LLVM CMake 不认识 HarmonyOS 需设 CMAKE_SYSTEM_NAME=Linux"
  - "c3c 通过 #ifndef 守卫支持 target 裁剪，编译时定义 AVR_DISABLE/ARM_DISABLE 等宏即可"
  - "LLVM 22.1.8 源码编译仅 AArch64 target + lld，需要约 4GB 内存，-j1 耗时 1-2 小时"