package: cloud-sql-proxy/1.38.0
homepage: https://github.com/GoogleCloudPlatform/cloud-sql-proxy

upstream_test_in_build: true
upstream_tests:
  - command: "go test ./proxy/util"
    description: "Run upstream proxy/util Go tests (SemanticVersion, UserAgent, SplitName) on Linux and signed OHOS test binaries"

test_package_tests:
  - file: test.sh
    description: "Run cloud-sql-proxy --version and validate version output against the packaged binary"
    command: "bash test.sh <bin/cloud-sql-proxy>"

assertion_count: 3
