software: cloud-sql-proxy
version: "1.38.0"
build_system: go
status: built
build_date: "2026-08-06"

source:
  url: "https://github.com/GoogleCloudPlatform/cloud-sql-proxy/archive/refs/tags/v1.38.0.tar.gz"
  sha256: "361ffcdee4ab6add06fb818403ba0bc399fc26c75cf6832750a7c47f1797f1b6"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS pre-adaptation strategy)"
    - "GOARCH=<target arch>"
    - "GOTOOLCHAIN=local"
    - "Go 1.26.3 SDK auto-bootstrap when GO/GOROOT/PATH lacks a usable Go"
  dependencies: []
  tool_dependencies:
    - "go >= 1.25.7 (auto-downloaded from golang.google.cn with dl.google.com fallback when missing)"
    - "binary-sign-tool"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "cloud-sql-proxy 1.38.0 is a Go module CLI; command entry is ./cmd/cloud_sql_proxy."
  - "Go module name is github.com/GoogleCloudPlatform/cloudsql-proxy (no hyphen in module path)."
  - "Version string is embedded via //go:embed version.txt in proxy/util/cloudsqlutil.go; ldflag -X overrides at link time."
  - "ldflag path: github.com/GoogleCloudPlatform/cloudsql-proxy/proxy/util.versionString"
  - "go.mod requires Go >= 1.25.7; Go 1.26.3 used (avoids Go 1.26.0 corrupted runtime source issue)."
  - "CGO_ENABLED=0 static build avoids PIE/DYN signature damaging TLS header on OHOS."
  - "OHOS Go executables must be self-signed with binary-sign-tool before package/test execution."
  - "Upstream proxy/util tests (SemanticVersion, UserAgentFromVersionString, SplitName) run on Linux and as signed OHOS test binaries."
  - "Recipe bootstraps official Go 1.26.3 linux-amd64/linux-arm64 SDKs from golang.google.cn with dl.google.com fallback and pinned SHA256."
