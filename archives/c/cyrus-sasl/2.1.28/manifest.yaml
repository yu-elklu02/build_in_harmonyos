software: cyrus-sasl
version: "2.1.28"
build_system: autotools
status: built
source:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
knowledge_gained:
  - "禁 GSSAPI/LDAPDB 避 krb5↔openldap↔sasl 循环依赖（krb5/openldap 未进制品仓）；依赖 openssl/lmdb/sqlite3 均 ohpcd 已发布"
  - "configure 的 AC_PROG_CC_FOR_BUILD 清 host 前缀裸搜 gcc/cc/cl.exe，OHOS 只有 clang → 显式喂 CC_FOR_BUILD=clang / CPP_FOR_BUILD='clang -E'"
  - "--enable-sql 默认给 libsql 挂 -lmysqlclient -lpq（OHOS 无）→ --without-mysql --without-pgsql，只留 sqlite3 后端"
  - "sample/client.c 调 getpass()，musl 无此符号(已移除) → --disable-sample；saslauthd 需 PAM/shadow(OHOS 无) → --without-saslauthd"
  - "老代码 clang15 把 implicit-function-declaration/int-conversion 默认升 error → -Wno-error= 降回 warning"
  - "lmdb 无 --with-lmdb 旗标 → AutotoolsDeps 注入 -I/-L 让 AC_CHECK_LIB(lmdb) 命中；HMDFS tmp 不可写 → TMPDIR 指 build 目录"
