package: chrony/4.8
homepage: "https://chrony-project.org/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "cd chrony-4.8 && make check"
upstream_test_result: "16 PASS, 1 FAIL, 9 SKIP (26 tests, reproduced 2026-07-14)"

upstream_tests:
  - name: "unit_tests"
    source: chrony-4.8/test/unit
    description: "Upstream unit tests for protocol, filtering, sockets, and utilities"
    command: "make check"
  - name: "socket"
    source: chrony-4.8/test/unit/socket.c:207
    result: patched
    error: "HarmonyOS SELinux (E024) blocks AF_UNIX bind(); runtime POSIX probe skips Unix socket tests when bind() fails (R8 compliant, no platform macro) in 0001-test-socket-runtime-probe-unix-availability.patch"
    root_cause: "HarmonyOS SELinux policy restricts AF_UNIX socket bind() (knowledge base E024)"
    classification: portability_patch
  - name: "util"
    source: chrony-4.8/test/unit/util.c:679
    result: fail
    error: "UTI_CheckDirPermissions('testdir', 0700, geteuid(), getegid()) returned false"
    root_cause: "HarmonyOS HMDFS does not preserve requested POSIX mode/ownership: mkdir -m 700 produced mode 2771, uid 20001006, gid 1006 while the process euid/egid was 20020104/20020104."
    classification: platform_limit

test_package_tests:
  - file: test.c
    description: "Compile-time target: stat() the Conan-packaged chronyc via CHRONYC_PATH macro (R34, no host PATH lookup). Not executed on CI (cross-compiled aarch64)"
    command: "cmake --build (compile-only); no add_test/ctest"
  - file: test_chrony.sh
    description: "Host-side bash script (run via self.run in test()): verify chronyc/chronyd exist in package bin/ or sbin/ and are ELF binaries (L0d gate + R34, cross-compile safe)"
    command: "bash test_chrony.sh <packaged-bin-paths>"
  - file: conanfile.py
    description: "Skip cmake.test() (cross-compile cannot exec aarch64 on x86 worker); run test_chrony.sh via self.run to verify packaged binaries"
    command: "self.run(f'{bash} {script} ...')"

assertion_count: 5
