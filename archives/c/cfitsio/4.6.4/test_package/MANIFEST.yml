# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cfitsio/4.6.4
homepage: "https://heasarc.gsfc.nasa.gov/docs/fitsio/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# cfitsio ships testprog.c / cookbook.c driven by its Makefile/CMake TESTS=ON.
upstream_tests:
  - file: testprog.c
    source: cfitsio-4.6.4/testprog.c
    description: "Official cfitsio regression test program (Testprog)."
    command: "./testprog"
  - file: cookbook.c
    source: cfitsio-4.6.4/cookbook.c
    description: "Official cfitsio API usage cookbook examples."
    command: "./cookbook"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer write→reopen→read round-trip exercising fits_create_file, fits_create_img, fits_write_key_str/log, fits_open_file, fits_read_key_str/log and ffvers."
    command: "./test_cfitsio"

# 测试断言总数 (近似值, 用于质量评估)
# test.c checks 10 status codes + 2 value comparisons + version print
assertion_count: 12
