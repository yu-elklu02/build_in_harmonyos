software: cpr
display: "cpr"
description: "C++ Requests: Curl for People, a spiritual port of Python Requests"
category: network
homepage: "https://github.com/libcpr/cpr"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "C++17 CMake wrapper around libcurl; requires curl + openssl + zlib Conan dependencies"
    - "Built-in Find modules bypass Conan CMakeDeps: feed OPENSSL_*/CURL_* cache variables"
    - "Stage googletest + mongoose locally (FETCHCONTENT_SOURCE_DIR_*) so upstream ctest suite never needs GitHub"
    - "Sign built ELF artifacts with llvm-objcopy + binary-sign-tool before execution on OHOS"
  common_dependencies:
    - "curl/8.15.0"
    - "openssl/3.5.6.1"
    - "zlib/1.3.1.1"

versions:
  "1.14.2":
    status: built
    build_date: "2026-08-13"
