software: cpr
version: "1.12.0"
status: built
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/libcpr/cpr/archive/refs/tags/1.12.0.tar.gz"
  sha256: "f64b501de66e163d6a278fbb6a95f395ee873b7a66c905dd785eae107266a709"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCPR_USE_SYSTEM_CURL=ON"
    - "-DCPR_ENABLE_SSL=ON"
    - "-DCPR_FORCE_OPENSSL_BACKEND=ON"
    - "-DCPR_BUILD_TESTS=ON"
    - "-DOPENSSL_ROOT_DIR=<conan openssl package>"
    - "-DOPENSSL_INCLUDE_DIR=<conan openssl include>"
    - "-DOPENSSL_SSL_LIBRARY=<conan openssl libssl.a>"
    - "-DOPENSSL_CRYPTO_LIBRARY=<conan openssl libcrypto.a>"
    - "-DCURL_ROOT_DIR=<conan curl package>"
    - "-DCURL_INCLUDE_DIR=<conan curl include>"
  dependencies:
    - "curl/8.15.0"
    - "openssl/3.5.6.1"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cpr 1.12.0 is a CMake project (C++17) wrapping libcurl; init-build misdetects it as autotools and the build driver must use CMake + Conan toolchain."
  - "cpr's CMakeLists prepends its own cmake/ dir to CMAKE_MODULE_PATH, so the built-in find_package(OpenSSL)/find_package(CURL) cannot see Conan CMakeDeps configs; the recipe sets OPENSSL_* and CURL_* cache variables pointing at the Conan package dirs instead."
  - "Upstream tests need GTest + mongoose via FetchContent (unreliable network); staged local copies through FETCHCONTENT_SOURCE_DIR_GOOGLETEST/MONGOOSE."
  - "Test binaries must be run with LD_LIBRARY_PATH including the conan curl and openssl lib dirs (shared libcurl.so / libssl)."

conan:
  ref: "cpr/1.12.0"
  verify: pass
  package_type: library

test:
  upstream_logical_cases: 539
  consumer_flows: 1

artifacts:
  library: "libcpr.so / libcpr.a"
