# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpr/1.12.0
homepage: "https://github.com/libcpr/cpr"

# 上游测试命令 (CMake ctest 全部用例)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (共 29 个 gtest 可执行文件, 539 用例通过 + 4 禁用)
upstream_tests:
  - file: get_tests.cpp
    source: cpr-1.12.0/test/get_tests.cpp
    description: "GET 请求测试 (105 用例)"
    command: "./get_tests"
  - file: post_tests.cpp
    source: cpr-1.12.0/test/post_tests.cpp
    description: "POST 请求测试 (39 用例)"
    command: "./post_tests"
  - file: session_tests.cpp
    source: cpr-1.12.0/test/session_tests.cpp
    description: "Session 复用测试 (90 用例)"
    command: "./session_tests"
  - file: ssl_tests.cpp
    source: cpr-1.12.0/test/ssl_tests.cpp
    description: "HTTPS/SSL 测试 (5 用例)"
    command: "./ssl_tests"

# test_package 中自带的测试 (消费者视角验证, 实质调用 cpr::Get)
test_package_tests:
  - file: test.cpp
    description: "启动本地 HTTP 服务并发起真实 cpr::Get 请求, 校验 200 + body"
    command: "./test_cpr"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 539
