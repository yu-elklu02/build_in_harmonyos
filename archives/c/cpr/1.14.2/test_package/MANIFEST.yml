# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpr/1.14.2
homepage: "https://github.com/libcpr/cpr"

# 上游存在完整测试套件 (ctest, 34 个 gtest 可执行文件, 581 个 TEST/TEST_F 用例)
upstream_tests_exist: true
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试 (真机执行 ctest 全套)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (代表性子集, 完整列表见 test/CMakeLists.txt)
upstream_tests:
  - file: get_tests.cpp
    source: cpr-1.14.2/test/get_tests.cpp
    description: "GET 请求测试 (105 用例)"
    command: "./get_tests"
  - file: post_tests.cpp
    source: cpr-1.14.2/test/post_tests.cpp
    description: "POST 请求测试 (39 用例)"
    command: "./post_tests"
  - file: session_tests.cpp
    source: cpr-1.14.2/test/session_tests.cpp
    description: "Session 复用测试 (90 用例)"
    command: "./session_tests"
  - file: util_tests.cpp
    source: cpr-1.14.2/test/util_tests.cpp
    description: "URL 工具函数测试 (16 用例)"
    command: "./util_tests"
  - file: ssl_tests.cpp
    source: cpr-1.14.2/test/ssl_tests.cpp
    description: "HTTPS/SSL 测试 (7 用例)"
    command: "./ssl_tests"

# test_package 中自带的测试 (消费者视角验证, 实质调用 cpr::Get)
test_package_tests:
  - file: test.cpp
    description: "启动本地 HTTP 服务并发起真实 cpr::Get 请求, 校验 200 + body (2 断言)"
    command: "./test_cpr"

# 测试断言总数 (上游 gtest 用例数, 用于质量评估)
assertion_count: 581
