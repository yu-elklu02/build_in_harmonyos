software: cpr
version: "1.14.2"
status: built
build_date: "2026-08-13"
build_system: cmake

source:
  url: "https://github.com/libcpr/cpr/archive/refs/tags/1.14.2.tar.gz"
  sha256: "b9b529b47083bfe80bba855ca5308d12d767ae7c7b629aef5ef018c4343cf62b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCPR_USE_SYSTEM_CURL=ON"
    - "-DCPR_ENABLE_SSL=ON"
    - "-DCPR_FORCE_OPENSSL_BACKEND=ON"
    - "-DCPR_BUILD_TESTS=ON"
    - "-DCPR_BUILD_TESTS_PROXY=OFF"
    - "-DOPENSSL_ROOT_DIR=<conan openssl package>"
    - "-DOPENSSL_INCLUDE_DIR=<conan openssl include>"
    - "-DOPENSSL_SSL_LIBRARY=<conan openssl libssl.a>"
    - "-DOPENSSL_CRYPTO_LIBRARY=<conan openssl libcrypto.a>"
    - "-DCURL_ROOT_DIR=<conan curl package>"
    - "-DCURL_INCLUDE_DIR=<conan curl include>"
    - "-DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=<staged googletest>"
    - "-DFETCHCONTENT_SOURCE_DIR_MONGOOSE=<staged mongoose>"
  dependencies:
    - "curl/8.15.0"
    - "openssl/3.5.6.1"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cpr 1.14.2 is a CMake project (C++17) wrapping libcurl; the recipe must use CMake + Conan toolchain."
  - "cpr's CMakeLists prepends its own cmake/ dir to CMAKE_MODULE_PATH, so the built-in find_package(OpenSSL)/find_package(CURL) cannot see Conan CMakeDeps configs; the recipe sets OPENSSL_* and CURL_* cache variables pointing at the Conan package dirs instead."
  - "Upstream tests need googletest v1.14.0 + mongoose 7.7 via FetchContent; both archives are staged locally through conandata and FETCHCONTENT_SOURCE_DIR_GOOGLETEST/MONGOOSE so configure never needs GitHub."
  - "Test binaries must be run with LD_LIBRARY_PATH including the conan curl and openssl lib dirs (shared libcurl.so / libssl)."
  - "OHOS refuses to load unsigned ELF: built test executables and shared libraries are signed with llvm-objcopy + binary-sign-tool before the ctest suite runs."

conan:
  ref: "cpr/1.14.2"
  verify: pass
  package_type: library

test:
  upstream_logical_cases: 581
  consumer_flows: 1

artifacts:
  library: "libcpr.so / libcpr.a"
