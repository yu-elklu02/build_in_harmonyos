package: coturn/4.15.0
homepage: "https://github.com/coturn/coturn"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: "tests/CMakeLists.txt"
    source: "Coturn CMake BUILD_TESTING suite"
    description: "Core TURN/STUN unit tests and upstream feature-detected driver tests (enabled with with_upstream_tests=True)"
test_package_tests:
  - file: "test_coturn.sh"
    description: "Runs the packaged RFC 5769 STUN test-vector utility"
    command: "turnutils_rfc5769check"
assertion_count: 1
