  sha256: "1ba43dc3f2540001ce2d9e2b0cea1fbebd3271095ae1d0154108d13f3697fdd2"
unity:
  url: "https://github.com/ThrowTheSwitch/Unity/archive/refs/tags/v2.6.0.tar.gz"
  sha256: "aa4c9fb1ae5fc5242f914c65f3557e817e40cb37f04a31e5ff76d1ab89dbf674"
patches:
  - patch_file: "patches/0001-cmake-make-prometheus-exporter-optional.patch"
    patch_description: "Allow the optional Prometheus exporter to be disabled when libmicrohttpd is unavailable."
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-link-static-sqlite-math.patch"
    patch_description: "Propagate the math library from static SQLite after the archive for FTS5."
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-propagate-no-tls-to-turnserver.patch"
    patch_description: "Propagate the unavailable libevent SSL feature boundary to the server executable."
    patch_type: "portability"
  - patch_file: "patches/0004-tests-use-writable-sqlite-directory.patch"
    patch_description: "Let the SQLite driver test use a dedicated writable directory when the target mounts /tmp read-only."
    patch_type: "test"
  - patch_file: "patches/0005-cmake-copy-turnadmin-on-ohos.patch"
    patch_description: "Create the turnadmin compatibility command as a regular file on OpenHarmony user storage, which does not permit symbolic links."
    patch_type: "portability"
