software: coturn
display: "Coturn"
description: "Open source TURN and STUN server"
category: network
homepage: "https://github.com/coturn/coturn"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Supports the upstream CTest suite through the default-off with_upstream_tests option."
    - "Uses Conan-provided libevent, OpenSSL, and SQLite rather than host libraries."
  common_dependencies:
    - libevent/2.1.12
    - openssl/3.5.6
    - sqlite3/3.49.1

versions:
  "4.15.0":
    status: pending
    build_date: ""
    notes: "Initial recipe; local and CI upstream CTest evidence is required before it can be marked built."
