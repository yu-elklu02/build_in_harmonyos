# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: chruby/0.3.9.1
homepage: "https://github.com/postmodern/chruby"

# Upstream test command (from Makefile: make check)
upstream_check_command: "make check"

# Upstream tests are NOT integrated in conanfile.py build() because
# they require Ruby installations (rvm.io binaries) unavailable on OHOS
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (require Ruby, skipped on OHOS)
upstream_tests:
  - file: test/runner
    source: chruby-0.3.9/test/runner
    description: "chruby test suite (requires Ruby installations)"
    command: "./test/runner"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: chruby-exec --version and --help"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 2
