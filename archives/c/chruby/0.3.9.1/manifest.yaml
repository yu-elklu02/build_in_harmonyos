software: chruby
version: "0.3.9.1"
category: ruby
description: Ruby version management tool (pure Bash scripts)
homepage: https://github.com/postmodern/chruby
url: https://github.com/postmodern/chruby/releases/download/v0.3.9/chruby-0.3.9.tar.gz
build_system: makefile
build_date: "2026-07-15"
configure_options: []
  # chruby has no configure script - pure shell tool
make_options: []
  # make install PREFIX=<prefix> copies shell scripts
has_c_code: false
has_tests: true
test_result: skipped
  # chruby tests require Ruby installations (rvm.io), unavailable on OHOS
dependencies: []
status: built
notes:
  - chruby is a pure shell tool with no C code or configure script
  - Install uses Makefile install target directly
  - No ELF binaries - only shell scripts
  - Shebang #!/usr/bin/env bash is OHOS-compatible
  - chruby-exec --version works correctly
  - Version 0.3.9.1: incremented from 0.3.9 (R37) due to existing artifact in registry
