software: chicken
version: 5.4.0
status: built
build_system: custom  # Makefile.linux, 无 configure 脚本
created_at: 2026-04-29
build_date: 2026-08-03
conan_ref: "chicken/5.4.0"

# 编译参数
configure_options: []
build_options:
  - PLATFORM=linux
  - C_COMPILER=clang
  - PREFIX=<package_folder>  # conan package 目录
  - INSTALL_PROGRAM=install-wrapper.sh  # E098/E174: toybox 缺 install 命令
make_options: []
compiler: clang 15.0.4

# 产物信息
products:
  binaries:
    - chicken
    - csi
    - csc
    - chicken-install
    - chicken-uninstall
    - chicken-status
    - chicken-profile
    - chicken-do
    - feathers
  libraries:
    - libchicken.so.11
    - libchicken.a
  modules: 43  # import libraries (chicken.*.import.so)

# 测试结果
test_result:
  status: built
  passed: 6377
  failed: 1
  total: 6378
  failed_tests:
    - posix-tests.scm:116 (file-permissions, E046 SELinux chmod 平台限制)

# 质量门禁 (conan-verify 8 道)
quality_gates:
  G0_pre_build_risk: PASS
  G1_recipe_integrity: PASS
  G2_conan_create: PASS
  G3_system_lib_isolation: PASS
  G4_product_integrity: PASS
  L2_smoke_test: PASS
  L4_security_scan: PASS
  L5_product_baseline: PASS

# 归档信息
archive_files:
  - conanfile.py
  - conandata.yml
  - test_package/
  - manifest.yaml
  - notes.md
  - reports/conan-verify-report.md
  - reports/conan-create.log
  - reports/test-report.md
  - ../commands.json  # R38 软件级命令行工具声明

# 知识沉淀
knowledge_gained:
  - platform_limit: chmod SELinux limit (E046)
  - build_system: custom Makefile with PLATFORM, no configure
  - tool_missing: install command absent on OHOS toybox (E098/E174), wrapper via INSTALL_PROGRAM
  - no_patches: source compiles without modification

patches_applied: []

# 来源信息
source_url: https://code.call-cc.org/releases/5.4.0/chicken-5.4.0.tar.gz
source_sha256: 3c5d4aa61c1167bf6d9bf9eaf891da7630ba9f5f3c15bf09515a7039bfcdec5f
