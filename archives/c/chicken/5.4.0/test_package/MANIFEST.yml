# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: chicken/5.4.0
homepage: "https://code.call-cc.org/"

# 上游测试命令 (chicken 用自定义 Makefile, 无 configure)
upstream_check_command: "make PLATFORM=linux check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/posix-tests.scm
    source: chicken-5.4.0/tests/posix-tests.scm
    description: "POSIX testsuite; 1 known failure file-permissions (E046 SELinux chmod limit, non-blocking)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证, 实质调用工具链)
test_package_tests:
  - file: test_chicken.sh
    description: "端到端工具链测试入口: csi -version + csc 编译 test_hello.scm + 运行产物断言 (L0c test source)"
    command: "sh test_chicken.sh <csi> <csc> <test_hello.scm> <out>"
  - file: test_hello.scm
    description: "真实 Scheme 程序 (factorial + string + chicken-version 断言), 由 test_chicken.sh 编译并运行"
    command: "csc -o test_hello test_hello.scm && ./test_hello"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
