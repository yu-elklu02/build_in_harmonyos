# 软件级 manifest — chicken
software: chicken
display: "CHICKEN"
description: "CHICKEN Scheme-to-C 编译器工具链（含 csi 解释器、csc 编译器驱动、egg 包管理器与 feathers 调试器前端）"
category: build-tool
homepage: "https://code.call-cc.org/"
license: BSD-3-Clause
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "自定义 Makefile 构建系统，无 configure 脚本：make PLATFORM=linux PREFIX=... C_COMPILER=clang"
    - "不支持并行编译 (-j)，必须 -j1"
    - "HarmonyOS toybox 缺 install 命令 (E098/E174)：需用 cp+chmod wrapper 通过 INSTALL_PROGRAM 注入"
    - "make check 中 posix file-permissions 测试失败 (E046, SELinux chmod 不生效)，记录不阻塞"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "5.4.0":
    status: built
    build_date: "2026-08-03"
    conan_ref: "chicken/5.4.0"
