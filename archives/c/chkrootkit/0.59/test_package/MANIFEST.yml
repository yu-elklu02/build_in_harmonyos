# test_package/MANIFEST.yml
# Upstream and consumer-test declarations for CI quality gates.

package: chkrootkit/0.59
homepage: "https://www.chkrootkit.org/"

# Upstream provides no automated check/test target.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_chkrootkit.sh
    description: "Validate the wrapper, version output, and eight packaged helpers"
    command: "./test_chkrootkit.sh <chkrootkit-bin> <shell>"
  - file: test_chkrootkit.sh
    description: "Execute chkdirs against a temporary directory and require success"
    command: "./test_chkrootkit.sh <chkrootkit-bin> <shell>"
  - file: test_chkrootkit.sh
    description: "Execute strings-static and verify output from the packaged script"
    command: "./test_chkrootkit.sh <chkrootkit-bin> <shell>"

# 1 wrapper + 8 helpers + version status + version text + chkdirs + strings output.
assertion_count: 13
