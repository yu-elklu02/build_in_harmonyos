knowledge_gained:
  - "E050: replace HMDFS symlinks with byte-preserving regular-file copies"
  - "E002: place the official test root under TMPDIR instead of read-only /tmp"
  - "E127: compile out unavailable pthread cancellation paths through feature detection"
  - "Probe getspnam and endspent independently from shadow.h before enabling shadow authentication"
  - "R26: build static on OHOS to isolate the platform libcups.z.so provider"
  - "Run official shell test runners through the configured shell when execute mode is unavailable"
  - "Run the complete upstream make -j1 check target inside Conan build()"
  - "E129: keep Autoconf scratch writable when HMDFS combines setgid directories with umask 077"
  - "Keep Conan and upstream test temporary files under the writable system TMPDIR"
  - "Treat unset and explicitly empty TMPDIR values as requests for the writable system fallback"
  - "Use a nonzero numeric directory-owner UID for the scheduler test configuration when HarmonyOS has no passwd/NSS mapping"
  - "Configure an explicit POSIX shell for EACCES script retry without platform condition macros"
  - "Invoke upstream waitjobs helpers through sh when source scripts cannot be executed directly"
  - "Keep the scheduler suite on its configured TCP endpoint when an HMDFS test root cannot host the unused Unix-domain listener"

