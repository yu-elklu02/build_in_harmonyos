test_package_tests:
  - file: test_cups.c
    description: "Nine public CUPS and IPP API contract assertions"
    command: "./test_cups"
  - file: test_filter_args.sh
    description: "Six assertions for cups-exec shell fallback argument preservation"
    command: "cups-exec none ./test_filter_args.sh caller-argv0 job-123 currentUser document-title 1 media=a4"

