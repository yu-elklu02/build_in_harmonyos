sources:
  url: "https://github.com/OpenPrinting/cups/releases/download/v2.4.19/cups-2.4.19-source.tar.gz"
  sha256: "820984b12a67f98705785aae2dd1347fe0ac097828001d4583ff64574aed6389"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Run the official test-suite scripts through the configured shell"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "Recognize HarmonyOS and emit the linux-ohos target triplet"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "Accept ohos and linux-ohos canonical target names"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "Add capability probes and keep Autoconf config.status scratch directories writable on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0005-cups-ppd-util.c.patch"
    patch_description: "Copy caller-owned PPD files when symlink support is disabled"
    patch_type: "portability"
  - patch_file: "patches/0006-cups-thread-private.h.patch"
    patch_description: "Declare thread cancellation only when pthread_cancel is available"
    patch_type: "portability"
  - patch_file: "patches/0007-cups-thread.c.patch"
    patch_description: "Define the thread cancellation wrapper only when pthread_cancel is available"
    patch_type: "portability"
  - patch_file: "patches/0008-scheduler-auth.c.patch"
    patch_description: "Gate shadow password support on its header and required functions"
    patch_type: "portability"
  - patch_file: "patches/0009-scheduler-cups-exec.c.patch"
    patch_description: "Optionally retry explicit shell-script filters through a configured POSIX shell after EACCES"
    patch_type: "portability"
  - patch_file: "patches/0010-test-5.5-lp.sh.patch"
    patch_description: "Run the upstream waitjobs helper through sh on non-executable source filesystems"
    patch_type: "portability"
  - patch_file: "patches/0011-test-5.6-lpr.sh.patch"
    patch_description: "Run the upstream waitjobs helper through sh on non-executable source filesystems"
    patch_type: "portability"
  - patch_file: "patches/0012-test-run-stp-tests.sh.patch"
    patch_description: "Use TMPDIR, regular-file fixtures, shell launchers, numeric scheduler UID, shell wait helpers, and the TCP test listener on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0013-config-scripts-cups-common.m4.patch"
    patch_description: "Probe optional POSIX interfaces and configure an explicit shell-script fallback"
    patch_type: "portability"
  - patch_file: "patches/0014-config-scripts-cups-threads.m4.patch"
    patch_description: "Probe pthread_cancel before exposing the cancellation wrapper"
    patch_type: "portability"
  - patch_file: "patches/0015-config.h.in.patch"
    patch_description: "Declare capability macros generated by the new Autoconf probes"
    patch_type: "portability"
