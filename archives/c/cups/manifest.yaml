software: cups
display: "CUPS"
description: "OpenPrinting implementation of IPP and a Unix printing system"
category: system
homepage: "https://openprinting.github.io/cups/"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognize the native aarch64-unknown-linux-ohos target"
    - "Avoid unavailable pthread cancellation and shadow-password symbols"
    - "Use regular-file copies where HMDFS cannot provide symbolic links"
    - "Run the official test root under TMPDIR with equivalent local fixtures"
    - "Run explicit shell-script filters through the system shell when HMDFS rejects direct execution"
    - "Build static on OHOS to isolate OpenHarmony's libcups.z.so provider"
  common_dependencies:
    - openssl
    - zlib
    - libiconv

versions:
  "2.4.19":
    status: built
    build_date: "2026-08-01"
    conan_ref: "cups/2.4.19"
