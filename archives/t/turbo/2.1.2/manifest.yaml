  - "HMDFS does not support ln -sf for creating symlinks — use cp -a instead"
  - "SSL=none disables OpenSSL dependency via TURBO_NO_SSL=1 define"
  - "Python SSL module requires libssl.so.3 in LD_LIBRARY_PATH (add /usr/lib)"

