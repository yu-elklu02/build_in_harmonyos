# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: turbo/2.1.2
homepage: "https://turbo.lua.org"

# Upstream test command (turbo uses busted/luajit for testing)
upstream_check_command: "make test"

# conanfile.py build() method — upstream tests not integrated (Lua-based tests)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (Lua-based, require luajit + busted)
upstream_tests:
  - file: examples/helloworld.lua
    source: turbo-2.1.2/examples/helloworld.lua
    description: "HTTP helloworld server example"
    command: "luajit examples/helloworld.lua"

# test_package consumer-side tests
test_package_tests:
  - file: test.c
    description: "Links against libtffi_wrap, calls http_parser_init/http_method_str/http_errno_name"
    command: "./test_turbo"

# Test assertion count (approximate)
assertion_count: 3
