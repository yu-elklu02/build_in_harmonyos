# test_package/MANIFEST.yml — ttfautohint 1.8.4

package: ttfautohint/1.8.4
homepage: "http://freetype.org/ttfautohint/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: <无独立测试套件>
    source: ttfautohint-1.8.4/
    description: "上游无独立测试套件，功能验证通过 --version 和 --help"
    command: "ttfautohint --version"

test_package_tests:
  - file: conanfile.py
    description: "CLI 版本和帮助信息验证"
    command: "ttfautohint --version && ttfautohint --help"

assertion_count: 2