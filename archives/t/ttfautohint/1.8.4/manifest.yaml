software: ttfautohint
version: "1.8.4"
status: built
build_date: "2026-07-17"
build_system: autotools

source:
  url: "https://download.savannah.nongnu.org/releases/freetype/ttfautohint-1.8.4.tar.gz"
  sha256: "8a876117fa6ebfd2ffe1b3682a9a98c802c0f47189f57d3db4b99774206832e1"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-qt=no"
    - "--build=aarch64-unknown-linux-musl"
  dependencies:
    - freetype/2.14.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "E160: config.guess 无法识别 HarmonyOS，需添加 HarmonyOS|HongMeng 检测分支"
  - "config.sub 需添加 ohos-* OS 类型和 linux-ohos* kernel-OS 组合"
  - "FreeType 运行时版本检测在 OHOS 上失败，需绕过"
  - "HMDFS config.status 临时目录创建受限，需预创建可写临时目录"
  - "ttfautohint Qt GUI 非必需，使用 --with-qt=no 禁用"