software: tcl-tls
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.22/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.22"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://core.tcl-lang.org/tcltls/uv/tcltls-1.7.22.tar.gz"

  # 源码校验和
  sha256: "e84e2b7a275ec82c4aaa9d1b1f9786dbe4358c815e917539ffe7f667ff4bc3b4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-tcl=${TCL_ROOT}/lib"
    - "--with-openssl-dir=${DEFAULT_PREFIX}"

  # 编译依赖列表（格式: name/version）
  # openssl 使用系统安装版本（ohpcd 远程暂无 OpenSSL Conan 包）
  dependencies:
    - "tcl/9.0.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "patches/tls_initstubs.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Tcl 9.0 移除了 CONST, VOID, _ANSI_ARGS_, TCL_CHANNEL_VERSION_2 等宏，需通过 CPPFLAGS 定义"
  - "Tcl_InitStubs(interp, '8.4', 0) 在 Tcl 9.0 上失败，需改为 '9.0'"
  - "pkgIndex.tcl 中 vsatisfies 8.5 需改为 8.5- 以支持 Tcl 9"
  - "objcopy 处理的 .so 在 HarmonyOS 上无法 dlopen (Permission denied)，需跳过 objcopy"
  - "configure 中 umask 077 创建的 0700 目录在 HMDFS 上不可写，需改为 umask 022"
  - "AutotoolsToolchain 没有 extra_cppflags 属性，应使用 extra_cflags"
  - "-D_ANSI_ARGS_(x)=x 中的括号需转义为 \\(\\) 避免 shell 语法错误"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/tcl-tls-1.7.22.orig
  source_work_dir: /storage/Users/currentUser/builds/tcl-tls-1.7.22.work
  source_orig_hash: 80a1ba123960b8a0
  source_work_hash: e08de0052b6ee79a
  generated_at: '2026-07-03T13:01:12'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: True
    guard: 'config.guess lacks HarmonyOS detection'
  - file: 0002-config.sub.patch
    type: platform
    platform_only: True
    guard: 'config.sub lacks OHOS support'
  - file: 0003-configure.patch
    type: platform
    platform_only: True
    guard: 'umask 077 creates unwritable dirs on HMDFS'
