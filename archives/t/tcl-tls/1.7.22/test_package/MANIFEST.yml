# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tcl-tls/1.7.22
homepage: "https://core.tcl-lang.org/tcltls"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/all.tcl
    source: tcl-tls-1.7.22/tests/all.tcl
    description: "Tcl test suite for TLS extension (requires tcltest package)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "dlopen + Tls_Init symbol verification (genuine dependency test R34)"
    command: "./test_tcl_tls <lib_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
