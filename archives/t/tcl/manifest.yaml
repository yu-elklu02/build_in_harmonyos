# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: tcl
display: "Tcl (Tool Command Language)"
description: "动态脚本语言（John Ousterhout 创建）；HarmonyOS PC 提供动态 libtcl 供 dlopen 及作 tk 等的依赖"
category: library
homepage: "https://www.tcl-lang.org"
license: TCL

build_system: autotools

ohos_adaptation:
  key_points:
    - "9.0.3.1 产动态 libtcl9.0.so 供 dlopen（非系统同名库，R26 默认动态）；8.6.16 为动态形态（libtcl8.6.so + tclsh8.6 终端工具）"
    - "9.0.3.1 用 --disable-zipfs 出干净 libtcl9.0.so（避免脚本库 zip 尾拼破坏链接器自签）；脚本库散文件 + TCL_LIBRARY"
    - "系统识别 uname shim + tcl_cv_sys_version=Linux-6.6；umask 077→022（E011）；跳过可选子包"

  common_dependencies: []

versions:
  "8.6.16":
    status: built
    build_date: 2026-07-29
  "9.0.3.1":
    status: built
    build_date: 2026-07-02
