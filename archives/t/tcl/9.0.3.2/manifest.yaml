knowledge_gained:
  - "tcl 9 的 ZIPFS_BUILD=1 会 `cat 脚本库zip >> libtcl9.0.so`，尾拼破坏链接器代码签名；分发动态库用 --disable-zipfs 出干净 .so"
  - "系统识别：tcl.m4 用 uname 判系统，HarmonyOS 不识别→无法建动态库；uname shim + tcl_cv_sys_version=Linux-6.6 缓存覆盖解决"
  - "umask 077 在 HMDFS 致 config.status 临时文件权限问题（E011）；须把主+所有子包 configure 的 umask 077→022"
  - "只建 binaries+libraries 跳过 packages（可选扩展），避开构建期 tclsh 加载自产 libtcl 的问题"

