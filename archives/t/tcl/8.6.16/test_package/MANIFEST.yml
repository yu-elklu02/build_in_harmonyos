# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0c) 强制要求此文件存在

package: tcl/8.6.16
homepage: https://www.tcl.tk/

# 上游测试命令（Tcl 使用 tcltest 框架，通过 make test-tcl 执行；与下方 upstream_test_command/test command 保持一致）
upstream_check_command: "make test-tcl"

# conanfile.py build() 方法中是否已集成上游测试（规则 5）
# 已集成：build() 中运行 make test-tcl（ERROR_ON_FAILURES=1），解析 tcltest
# 汇总输出（Total/Passed/Failed），任一失败即构建失败；打印 L1_UPSTREAM_RESULT
# 统计行供 CI/PR 报告实际通过用例数与通过率。
upstream_test_in_build: true
upstream_test_command: "make test-tcl"

# 上游测试列表（Tcl tests/ 目录，166 个 .test 文件，用 tcltest 框架）
upstream_tests:
  - file: tests/
    source: tcl-8.6.16/tests/
    description: "Tcl 官方测试套件（tcltest 框架，166 个 .test 文件）"
    command: "make test-tcl"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "验证 Tcl C API（Tcl_CreateInterp / Tcl_Eval / Tcl_GetVersionString 等）"
    command: "./test_tcl"
  - file: test_tclsh.tcl
    description: "Validate packaged tclsh8.6, Tcl semantics, init.tcl, msgcat, and clock formatting"
    command: "tclsh8.6 test_tclsh.tcl"

# Assertion count: test.c has 7 and test_tclsh.tcl has 7.
assertion_count: 14
