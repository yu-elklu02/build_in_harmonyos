# test_package/MANIFEST.yml
package: tcl/8.6.14
homepage: "https://www.tcl.tk/"

test_package_tests:
  - file: test_tcl.sh
    description: "Shell smoke test: tclsh8.6 binary check, patchlevel, arithmetic, string, list, dict operations (6 assertions, driven by conanfile.py with TCLSH=<absolute-path> env var)"
  - file: test_tcl_api.c
    description: "C API test: Tcl_CreateInterp, Tcl_Eval expr, Tcl_Eval info, Tcl_DeleteInterp (4 assertions, compiled and run by conanfile.py)"
  - file: test_tcl_private_headers.c
    description: "Private header consumer test: compile + link against packaged include/generic (tclInt.h/tclPort.h) and include/unix (tclUnixPort.h), assert macros and interp/eval (3 assertions, compiled and run by conanfile.py)"
  - file: test_tclconfig.sh
    description: "tclConfig.sh consumer test: source packaged lib/tclConfig.sh with TCL_BIN_DIR preset (Expect configure pattern), assert no build-machine/'//' paths, TCL_SRC_DIR set, TCL_SRC_DIR/generic/tclInt.h reachable, TCL_INCLUDE_SPEC/TCL_LIB_SPEC/TCL_BUILD_LIB_SPEC usable (7 assertions)"
  - file: test_tcl_python.py
    description: "Python consumer test: Python subprocess.run() launches packaged tclsh8.6 (absolute path, no system PATH / system Tcl), drives patchlevel + expr via stdin, asserts tclsh executable, rc=0, patchlevel 8.6.14, expr 42 (4 assertions, driven by conanfile.py with sys.executable)"
  - file: umask_patch_verification
    description: "Build-time verification in conanfile.py source() — 9 configure files checked for umask 022 (no umask 077) (9 assertions)"

upstream_test_in_build: true
upstream_test_command: "make test -j1"

assertion_count: 33
