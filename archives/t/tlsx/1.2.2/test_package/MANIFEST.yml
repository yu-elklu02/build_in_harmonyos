package: tlsx/1.2.2
homepage: "https://github.com/projectdiscovery/tlsx"

upstream_check_command: "go test -count=1 ./..."
upstream_test_in_build: false
upstream_test_command: "go test -short -count=1 -timeout 120s -json <per-package>"

upstream_tests:
  - file: internal/runner/runner_test.go
    source: tlsx-1.2.2/internal/runner/runner_test.go
    description: "Runner processInputItem / CTLogs mode (16 tests)"
    command: "go test ./internal/runner/"
  - file: pkg/ctlogs/ctlogs_test.go
    source: tlsx-1.2.2/pkg/ctlogs/ctlogs_test.go
    description: "CT logs certificate formatting (7 tests)"
    command: "go test ./pkg/ctlogs/"
  - file: pkg/tlsx/clients/clients_test.go
    source: tlsx-1.2.2/pkg/tlsx/clients/clients_test.go
    description: "Certificate match / self-signed / untrusted CA (4 tests)"
    command: "go test ./pkg/tlsx/clients/"

test_package_tests:
  - file: test.sh
    description: "Smoke test: tlsx -version / -help"
    command: "bash test.sh"
