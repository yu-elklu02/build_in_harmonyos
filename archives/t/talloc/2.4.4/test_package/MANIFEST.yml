package: talloc/2.4.4
homepage: "https://talloc.samba.org"

upstream_check_command: "sh test_magic_differs.sh talloc_test_magic_differs_helper && ./talloc_testsuite"
upstream_test_in_build: true
upstream_test_command: "talloc_testsuite; sh test_magic_differs.sh talloc_test_magic_differs_helper"

excluded_upstream_tests:
  - command: "python3 test_pytalloc.py"
    reason: "The Python binding test requires Python development headers, which are unavailable in the OHOS cross-build environment; the C API is validated by talloc_testsuite and test_magic_differs."

upstream_tests:
  - file: testsuite.c
    source: talloc-2.4.4/testsuite.c
    description: "Core C testsuite, built together with testsuite_main.c and run in the recipe build"
    command: "./talloc_testsuite"
  - file: test_magic_differs.sh
    source: talloc-2.4.4/test_magic_differs.sh
    description: "Magic-value mismatch test using test_magic_differs_helper.c, run in the recipe build"
    command: "sh test_magic_differs.sh talloc_test_magic_differs_helper"
  - file: test_pytalloc.py
    source: talloc-2.4.4/test_pytalloc.py
    description: "Python binding tests using the extension built from test_pytalloc.c"
    command: "python3 test_pytalloc.py"
    excluded: true

test_package_tests:
  - file: test_talloc.c
    description: "Compile and run a hierarchy allocation and cleanup test"
    command: "./test_talloc"

assertion_count: 4