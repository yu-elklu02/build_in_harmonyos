# test_package/MANIFEST.yml — tty-clock 2.3
# CI L0e requires this file to exist.

package: tty-clock/2.3
homepage: "https://github.com/xorg62/tty-clock"

# 上游无标准测试套件（纯 Makefile 项目，无 make check 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 自带的验证（消费者视角）
test_package_verification:
  - command: "tty-clock -v"
    expect: "TTY-Clock 2"
