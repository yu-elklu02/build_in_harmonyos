# conandata.yml — tty-clock 2.3
# 源码来自 GitHub tag v2.3（manifest 记录同款 URL/SHA256）

sources:
  url: "https://github.com/xorg62/tty-clock/archive/refs/tags/v2.3.tar.gz"
  sha256: "343e119858db7d5622a545e15a3bbfde65c107440700b62f9df0926db8f57984"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: >-
      Makefile 增加 ncursesw6-config 检测分支：OHOS 提供 ncursesw6-config(v6)
      而非 ncurses5-config/ncursesw5-config(v5)，原检测链落到 pkg-config ncurses
      时因配方 pkg_config_name 为 ncursesw 而失败；补丁直接硬编码
      -DNCURSES_WIDECHAR -I${PREFIX}/include -L${PREFIX}/lib -lncursesw。
    patch_type: "portability"
