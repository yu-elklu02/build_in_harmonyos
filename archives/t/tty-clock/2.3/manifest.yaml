# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS平台提供ncursesw6-config(v6)而非ncurses5-config(v5)；Makefile检测链需添加ncursesw6-config分支"
  - "ncursesw6-config --cflags可能输出stale staging路径(-I$TEST_PREFIX/include)；应硬编码-I${PREFIX}/include"
  - "tty-clock无测试套件(无make check目标)；ncursesw静态链接内置stale staging terminfo路径，需创建symlink修复"
  - "G0 clean-verify脚本对makefile类型项目(无configure)不兼容，需手动验证"

