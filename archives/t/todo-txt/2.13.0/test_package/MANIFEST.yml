# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: todo-txt/2.13.0
homepage: "https://github.com/todotxt/todo.txt-cli"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: todo.sh
    source: todo.txt_cli-2.13.0/todo.sh
    description: "上游 release tarball 仅包含运行脚本、配置模板和 Bash completion；未随包发布测试套件"
    command: "make test (上游仓库测试入口，release tarball 不含 Makefile/tests)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_todo_txt.sh
    description: "消费者 smoke test: todo.sh -V、add、list、done、archive，并断言 todo.txt/done.txt 内容"
    command: "bash test_todo_txt.sh"
  - file: conanfile.py
    description: "Conan L1 测试：使用打包后的 todo.sh 和 etc/todo/config 驱动 smoke test"
    command: "conan test (todo.sh functional CLI smoke test)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
