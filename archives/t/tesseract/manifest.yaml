software: tesseract
display: "Tesseract OCR"
description: "Open source OCR (optical character recognition) engine"
category: doc
homepage: "https://github.com/tesseract-ocr/tesseract"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "aarch64 平台 SIMD 检测需补丁修复（0001-simddetect.patch），否则 NEON 函数链接失败"
    - "训练工具依赖 pango/cairo，鸿蒙平台不可用，需禁用 BUILD_TRAINING_TOOLS"
    - "ScrollView 图形界面需禁用 GRAPHICS_DISABLED=True"
    - "CMake 构建需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "混合类型：既有库 libtesseract 又有可执行文件 tesseract，需 commands.json (R38)"
  common_dependencies:
    - leptonica

versions:
  "5.3.3":
    status: published
    build_date: "2026-07-09"
    conan_ref: "tesseract/5.3.3"
