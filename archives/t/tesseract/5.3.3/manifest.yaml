version: "5.3.3"
status: published
build_date: "2026-07-09"
conan_ref: "tesseract/5.3.3"

source:
  url: "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.3.3.tar.gz"
  sha256: "dc4329f85f41191b2d813b71b528ba6047745813474e583ccce8795ff2ff5681"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TRAINING_TOOLS=False"
    - "GRAPHICS_DISABLED=True"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - leptonica/1.87.0
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-simddetect.patch"

patches_description:
  0001-simddetect.patch: "Fix aarch64 NEON SIMD detection: guard NEON code paths with HAVE_NEON macro to prevent link errors on OpenHarmony where HAVE_NEON is not defined at compile time"

knowledge_gained:
  - "aarch64 平台 SIMD 检测逻辑有误：原代码在 #if defined(__aarch64__) 时无条件启用 NEON，但 HAVE_NEON 未定义导致 NEON 函数链接错误"
  - "修复方案：将 #if defined(__aarch64__) 改为 #if defined(HAVE_NEON) && defined(__aarch64__)"
  - "训练工具（BUILD_TRAINING_TOOLS）依赖 pango/cairo，鸿蒙平台不可用，需禁用"
  - "ScrollView 图形界面（GRAPHICS_DISABLED）在无头构建环境下需禁用"
  - "tesseract 既有库（libtesseract）又有可执行文件（tesseract binary），需 commands.json (R38)"

ci_verification:
  environment: "Python 3.12.9, Conan 2.29.1, Clang 15.0.4"
  L0: "PASS — L0i warn (leptonica 未发布到制品仓，非阻塞)，L0j ok (首次发布)，L0k warn (commands.json 误报)"
  L1: "PASS — test_tesseract Passed, tesseract version: 5.3.3"
  L1e: "PASS — 破坏性反向验证通过（移除 bin/lib/include 后测试失败）"
  L2: "PASS — tesseract --version OK"
  L4: "PASS — 补丁安全扫描通过"
  L5: "PASS — bin/ 有内容"
