# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tmux-mem-cpu-load/3.8.3
homepage: "https://github.com/thewtex/tmux-mem-cpu-load"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: CMakeLists.txt
    source: tmux-mem-cpu-load-3.8.3/CMakeLists.txt
    description: "CMake CTest tests (21 tests: usage, memory, cpu, graph, etc.)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试 — 运行 tmux-mem-cpu-load --help 和无参数"
    command: "conan create"

# 测试断言总数
assertion_count: 2
