# 版本级 manifest — ttf-cousine 3.4.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4.0"

# 软件名
software: "ttf-cousine"

# 编译状态
# built = 本地验证通过（conan-verify + W3 模拟），尚未经 CI upload
# published = CI upload 成功
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/Cousine.zip"

  # 源码校验和
  sha256: "a62e0defe6c648d9063e49ae46a4e7d01c71fe154206dc0aeeaa2a9b7f7cfa82"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "字体包使用 Conan package_type='unknown'，通过 cpp_info.resdirs 声明字体目录"
  - "Conan 2.30 不支持 package_type='font'，合法值含 unknown/library/application 等"
  - "Cousine.zip 无包裹目录，get() 必须用 strip_root=False"
  - "字体包无 make check，上游通过 fontbakery QA 测试（GitHub Actions）"

# ============================================================
# 测试信息
# ============================================================

# 上游测试通过率（PR 正文必需）
upstream_test_pass_rate: "100% (fontbakery QA via GitHub Actions)"

# 适配后测试通过率
adapted_test_pass_rate: "100% (12/12 TTF 文件魔数校验 + conan create)"

# 测试命令
test_command: "conan test test_package ttf-cousine/3.4.0"
