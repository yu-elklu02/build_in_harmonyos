# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ttf-cousine/3.4.0
homepage: "https://github.com/ryanoasis/nerd-fonts"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# ttf-cousine 是字体包，上游 nerd-fonts 无传统 make check 测试套件。
# 上游通过 GitHub Actions 自动构建字体 + fontbakery QA 测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 nerd-fonts v3.4.0 release 经 fontbakery QA 测试通过。
# 参考上游 CI: https://github.com/ryanoasis/nerd-fonts/actions
upstream_tests:
  - file: (上游无独立测试源文件)
    source: nerd-fonts/release-v3.4.0
    description: "上游 fontbakery QA 字体验证（GitHub Actions 自动运行）"
    command: "fontbakery check-googlefonts *.ttf"

# test_package 中自带的测试 (消费者视角验证)
# R34: test() 实质依赖被测包 — 直接读取并验证包内的 .ttf 字体文件
test_package_tests:
  - file: conanfile.py (test method)
    description: "字体验证: 至少 12 个 TTF 文件 + TrueType/OpenType 魔数校验 + 文件大小检查"
    command: "conan test test_package ttf-cousine/3.4.0"

# 测试断言总数 (近似值, 用于质量评估)
# 12 个字体文件 × 3 项断言 (存在性 + 魔数 + 大小) = 36
assertion_count: 36
