# 版本级 manifest — tpm 1.3.3
# 遵循 ARCHIVE-SPEC v3.0（manifest 降级为人读交叉校验元数据，CI 唯一输入是 conanfile.py）

# ============================================================
# 必须字段
# ============================================================
version: "1.3.3"
software: "tpm"

# 交付溯源（harness 阶段4 填充）
delivery:
  base_commit: "75f202bc"        # 产出时仓库 main 的基准 commit
  fork: "https://atomgit.com/GoliWie/build_in_harmonyos"
  produced_by: "oh-porting-harness"
  produced_at: "2026-07-16"

# 编译状态
# published | built | failed | archived
# built = 本地产出就绪；真实编译验证待 CI（用户 push 后触发）
status: built

build_date: "2026-07-16"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方 GitHub tag tarball（R39 官方源）。上游无 release artifact。
  url: "https://github.com/nmeum/tpm/archive/refs/tags/1.3.3.tar.gz"
  sha256: "85930c86b13a08c706c2845a4b09138b43e160ae43e3f5e81021241f31f463ad"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # tpm 是纯 POSIX shell 脚本 + Makefile（install-only），非 cmake/autotools/meson
  system: makefile
  configure_options: []
  # 编译期依赖：无（脚本零编译依赖，registry resolve-deps 通过）
  dependencies: []
  # 无 C/C++ 编译过程（脚本项目），cc/cxx 字段仅占位
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "tpm 是纯 POSIX shell 脚本，无 C/C++ 代码；pre_scan / engine 不适用"
  - "上游 Makefile 原生支持 PREFIX/BINDIR/MANDIR/DESTDIR，无需源码 patch（patch 数 = 0）"
  - "Makefile 的 man page 生成依赖 pod2man(perl)；配方层跳过 man 生成，只装 bin/tpm，避免对 perl 的硬构建期依赖"
  - "运行时依赖 gpg2 在鸿蒙制品仓暂缺，但不阻塞打包（打包只产出 bin/tpm 脚本）"
  - "test_package 通过 mock gpg2 stub 实现 insert→show 完整往返 + CLI 契约 + 错误路径，共 15 条断言（setup:1 + Group A:4 + B:5 + C:5）"
