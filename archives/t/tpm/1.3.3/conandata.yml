# conandata.yml — tpm 1.3.3
# Single source of truth for source URL + SHA256 + patches.
# Structure follows the repo convention (templates/conandata.yml.tmpl +
# ansifilter/2.22): flat `sources:` with url/sha256, consumed by
# conanfile.py via get(self, **self.conan_data["sources"], strip_root=True).
#
# URL = official GitHub tag tarball (R39 official source). Upstream publishes
# no GitHub release artifact, so the tag tarball is the canonical download.
# sha256 computed locally from the downloaded tarball (re-verified in preflight).

sources:
  url: "https://github.com/nmeum/tpm/archive/refs/tags/1.3.3.tar.gz"
  sha256: "85930c86b13a08c706c2845a4b09138b43e160ae43e3f5e81021241f31f463ad"

patches: {}
# No patches required: the upstream Makefile natively supports
# PREFIX/BINDIR/MANDIR/DESTDIR and tpm is an install-only shell script.
# DESTDIR/PREFIX handling is done at the recipe layer (package()), not by
# modifying upstream sources.
