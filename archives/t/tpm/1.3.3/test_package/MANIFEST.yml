# test_package/MANIFEST.yml
# Upstream test declaration (L0e) + test strategy declaration.
#
# tpm (nmeum/tpm) ships NO automated test suite: the upstream Makefile has
# only all/install/uninstall/clean targets (no `check`/`test`). The only
# "test" surface is running the script and observing its CLI contract AND
# its core insert/show data path.

package: tpm/1.3.3
homepage: "https://github.com/nmeum/tpm"

# Upstream Makefile has no check/test target (verified by reading the
# upstream Makefile: only all/install/uninstall/clean are defined).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream ships no test programs.
upstream_tests: []

# ---------------------------------------------------------------------------
# test_package strategy: mock gpg2 to unlock the core insert/show data path.
# ---------------------------------------------------------------------------
# tpm's insert/show delegate to `gpg2` for symmetric encryption. The OHOS
# artifact repo does not yet ship gpg2, so test_package provides a TEST-ONLY
# gpg2 stub (mock_gpg2.sh) to make those code paths runnable in CI.
#
# The stub is a reversible transform (base64), NOT real crypto. It is used
# ONLY to verify tpm's orchestration (read password -> invoke backend with
# correct args -> write entry to the right store path -> decrypt+print back),
# not to verify gpg's confidentiality. Removing the stub makes the Group B/C
# assertions fail (verified locally), which is exactly what we want: the test
# genuinely depends on both tpm AND the mock backend.
test_strategy:
  backend: mock
  backend_file: mock_gpg2.sh
  backend_reason: >-
    OHOS artifact repo has no gpg2/gnupg; a stub is required to exercise
    tpm's insert/show code paths in CI without an external dependency.
  backend_safety: >-
    mock_gpg2.sh is reversible (base64), provides NO real confidentiality,
    and lives ONLY in test_package/. It must never be used as a real gpg2.
  destructive_check: >-
    Verified locally: (1) removing bin/tpm makes the whole suite fail;
    (2) removing mock_gpg2.sh makes Group B/C (core function) fail while
    Group A (CLI contract) still passes — proving the core-function tests
    genuinely depend on the mock backend.

# test_package consumer-side tests (the actual validation surface).
test_package_tests:
  - file: test.sh
    description: >-
      Functional test driving tpm through a full insert→show round trip via
      a mock gpg2 backend, plus the CLI contract and error-path checks.
    command: "bash test.sh"
    groups:
      - name: "setup: tpm resolvable"
        count: 1
        covers: "installed bin/tpm is found on PATH"
      - name: "A: CLI contract"
        count: 4
        covers: "no-args/unknown-subcommand USAGE output + exit code 1"
      - name: "B: core function (insert→show)"
        count: 5
        covers: >-
          insert writes entry to $STORE/<entry>.gpg; entry file does not
          leak plaintext; show returns the exact password inserted (round trip)
      - name: "C: error paths"
        count: 5
        covers: >-
          show-missing exits 1 with 'doesn't exist'; insert-duplicate exits 1;
          empty entry name prints per-command USAGE"

# Total meaningful assertions exercised by test.sh.
assertion_count: 15
