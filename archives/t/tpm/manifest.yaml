# 软件级 manifest — tpm
# 文件位置: archives/t/tpm/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================
software: tpm
display: "tpm (tiny password manager)"
description: "纯 POSIX shell 脚本实现的命令行密码管理器，兼容 pass(1)，用 gpg2 加密存储密码"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/nmeum/tpm"

# 开源许可证（SPDX 标识）
license: GPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================
ohos_adaptation:
  key_points:
    - "纯 POSIX shell 脚本，无 C/C++ 代码；pre_scan/engine 不适用"
    - "上游 Makefile 原生支持 PREFIX/BINDIR/MANDIR/DESTDIR，打包在配方层处理，无需源码 patch"
    - "Makefile 的 man page 生成依赖 pod2man(perl)；配方层跳过 man 生成只装 bin/tpm，避免 perl 硬依赖"
    - "运行时依赖 gpg2 在鸿蒙制品仓暂缺，非阻塞打包但影响真实可用性"
    - "test_package 用 executable 模板，通过 mock gpg2 stub 覆盖 insert→show 完整往返 + CLI 契约 + 错误路径，共 15 条断言"
  common_dependencies:
    - gpg2  # 运行时

# ============================================================
# 版本索引
# ============================================================
versions:
  "1.3.3":
    status: built      # 本地产出就绪；真实编译验证待 CI（用户 push 后触发）
    build_date: "2026-07-16"
    conan_ref: "tpm/1.3.3"
