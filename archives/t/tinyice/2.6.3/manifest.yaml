knowledge_gained:
  - "HarmonyOS rejects unsigned temporary Go test ELF files; preserve upstream semantics by compiling each package with go test -c, signing the ELF, and running it from the original package source directory."
knowledge_ref:
  - "knowledge/drafts/E318-draft-XGW1.kv"

test_results:
  type: test_package_smoke
  total: 4
  passed: 4
  failed: 0
  status: "HarmonyOS real-device conan-build-test passed on 2026-08-05 with a temporarily installed and self-signed Go 1.25.1 toolchain; test_package executed wrapper ELF, real ELF, wrapper --help, and real --help smoke checks."

upstream_test_results:
  command: "go test ./..."
  total: 84
  passed: 84
  failed: 0
  skipped: 0
  note: "On HarmonyOS, direct go test cannot execute unsigned generated test ELF files. Validation used go test -c for relay and server, self-signed the generated test binaries, and ran them in their source directories. The run also emitted 94 RUN records including subtests, all passing."

quality_gates:
  W0_dependencies: "No runtime Conan requirements. The source recipe first probes a compatible preinstalled Go and otherwise downloads a pinned Go 1.26.3 host toolchain with SHA-256 verification; on OHOS it self-signs the toolchain executables before use."
  issue: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/1697"
  build_strategy: "Download the official source archive, bootstrap a verified Go host toolchain when needed, route the Go toolchain/cache/linker output through writable non-HMDFS storage, build tinyice-real for linux/arm64, self-sign it on OHOS, and build a tiny OHOS-native wrapper that forwards all invocations to the real binary."
  commands_json: "Required and prepared because tinyice is an application package."
  local_smoke: "PASS on a HarmonyOS real device: upstream signed test binaries 84/84 PASS and conan-build-test/test_package 4/4 PASS. Detailed logs are retained in the validation workspace and can be provided to reviewers on request."
  official_ci: "Needs rerun after this patch. The recipe now handles the prior public CI failure by bootstrapping and signing a pinned Go toolchain when the runner does not provide one."

known_issues:
  - "R40 media-streaming behavior is not fully covered by the smoke test; this recipe validates CLI loadability and packaging only."
  - "The fallback Go toolchain and Go modules require network access on a cold worker; both are checksum-verified by the Go archive SHA-256 and the upstream go.sum/module checksum service."
