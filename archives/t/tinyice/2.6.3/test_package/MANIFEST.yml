test_package_tests:
  - file: conanfile.py
    description: "Verifies the packaged real binary is an AArch64 ELF and runs executable smoke tests when the platform can execute it."
    command: "conan test test_package tinyice/2.6.3"
  - file: test_tinyice.sh
    description: "Runs both the packaged tinyice wrapper and tinyice-real with --help, then checks the real binary has an ELF magic header."
    command: "sh test_tinyice.sh <wrapper> <real_binary>"

assertion_count: 6
