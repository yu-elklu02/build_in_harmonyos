package: tektoncd-cli/0.45.0.1
homepage: "https://github.com/tektoncd/cli"

upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: "go test ./... (121 *_test.go unit test files in upstream v0.45.0)"
upstream_tests:
  - "121 *_test.go files (counted from upstream v0.45.0 source archive); local run on aarch64 Linux: 42/42 unit-test packages PASS (100%), 0 FAIL; 6 e2e subpackages COMPILED with -tags=e2e (6/6) but NOT runnable locally (need live Kubernetes cluster)"
upstream_case_count: 121
upstream_test_note: "Upstream v0.45.0 source contains 121 *_test.go unit-test files across 48 packages. On the OHOS target side they cannot be compiled/run because (1) the OHOS CI worker provides no Go toolchain and Go has no official OHOS target support (no GOOS=OHOS in the Go release matrix); (2) tests import a full Kubernetes module graph (k8s.io/apimachinery v0.35.4, k8s.io/client-go v0.35.4, fake dynamic clients) plus tektoncd/pipeline v1.12.0 and tektoncd/triggers API types (go.mod 310 direct deps, go.sum 1069 lines, network module download required); (3) several tests require a PTY (github.com/Netflix/go-expect) and a local OCI registry (github.com/google/go-containerregistry/pkg/registry). Verification was instead performed locally on aarch64 Linux with a signed Go 1.25.8 toolchain: all 42 runnable unit-test packages PASS (0 FAIL, 100%); the 6 e2e subpackages (customrun/eventlistener/pipeline/pipelinerun/plugin/task) compile cleanly with -tags=e2e (6/6) but require a live Kubernetes cluster to run, which this environment does not provide. The adaptation also supplies 12 offline consumer assertions against the packaged tkn binary (12/12 pass)."

test_package_tests:
  - file: "test_tkn.py"
    description: "Execute the packaged tkn command and verify help/version/completion output with 12 offline assertions."
    command: "python3 test_tkn.py <path-to-tkn>"

test_package_assertion_count: 12
assertion_count: 12
