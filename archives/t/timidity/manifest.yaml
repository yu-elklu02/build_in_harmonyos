software: timidity
description: TiMidity++ - MIDI-to-WAVE converter and player
category: audio/midi
license: GPL-2.0
website: http://www.timidity.jp
source_repository: https://sourceforge.net/projects/timidity/

versions:
  2.13.2:
    status: built
    compile_date: 2026-06-05
    target_arch: aarch64
    target_os: HarmonyOS
    configure_options:
      - --prefix=/storage/Users/currentUser/usr/local
      - --without-x
      - --enable-audio=no
    patches:
      - 0001-config.guess-harmonyos.patch
      - 0002-config.sub-harmonyos.patch
      - 0003-configure-hmdfs-umask.patch
    package: timidity-2.13.2-ohos-aarch64.tar.gz
    notes: 首次在 HarmonyOS 平台编译。需要修改 config.guess/config.sub 以支持平台识别。