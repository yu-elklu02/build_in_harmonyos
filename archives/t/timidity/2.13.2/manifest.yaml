software: timidity
version: 2.13.2
status: built
compile_date: 2026-06-05
compiler: clang
build_system: autotools
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --without-x
  - --enable-audio=no
  - --disable-ncurses
  - --disable-slang
  - --disable-motif
  - --disable-tcltk
  - --disable-emacs
  - --disable-vt100
  - --disable-xaw
  - --disable-xskin
  - --disable-gtk
  - --enable-server=no
dependencies:
  - libc.so (musl)
patches:
  - 0001-config.guess-harmonyos.patch
  - 0002-config.sub-harmonyos.patch
  - 0003-configure-hmdfs-umask.patch
target_arch: aarch64
target_os: HarmonyOS
binary_files:
  - bin/timidity
documentation_files:
  - man/man1/timidity.1
  - man/man5/timidity.cfg.5
issues_resolved:
  - E007: config.guess 平台不识别（添加 HarmonyOS 支持）
notes: 首次在 HarmonyOS 平台编译 timidity。需要修改 config.guess 和 config.sub 以支持 HarmonyOS 平台识别。由于 HMDFS 文件系统的 SELinux 权限限制，需要在 /data/storage/el2/base/cache 目录下进行编译。