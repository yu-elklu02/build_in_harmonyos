# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: timidity/2.13.2
homepage: "http://www.timidity.jp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# TiMidity++ 上游 Makefile.am / Makefile.in 仅包含 automake 默认的 check-recursive
# 目标, 但子目录均未声明 TESTS / noinst_PROGRAMS 等测试程序, 因此 `make check`
# 实际不会运行任何测试用例。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游无测试可集成, 故不调用 `make check` (调用也无任何效果)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# TiMidity++ 官方 SourceForge release tarball 不含 test/ 或 tests/ 目录,
# 也不附带 sample MIDI 文件, 因此 upstream_tests 为空。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 由于上游无任何测试, 这里以 CLI 行为 + 核心功能作为可执行文件功能完整的证据:
#   1. timidity --version  → 退出码 0 且输出包含 "TiMidity"
#   2. timidity --help      → 输出包含 usage 文本
#   3. timidity --no-such-option → 退出码非零 (错误处理可用)
#   4. timidity <nonexistent.mid> → 退出码非零 (参数解析可用)
#   5. timidity -Ow <sample.mid>  → 进入 MIDI->WAVE 转换流程 (R40 深度适配)
test_package_tests:
  - file: test.sh
    description: "TiMidity++ 可执行文件 CLI 行为 + MIDI->WAVE 转换核心功能验证 (R40 深度适配)"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 5 个独立断言, 每个对应 test.sh 中的一个 Test 用例
assertion_count: 5
