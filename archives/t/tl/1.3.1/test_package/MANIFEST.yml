# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tl/1.3.1
homepage: "https://github.com/TartanLlama/expected"

# 上游测试命令（ctest -N 列出测试目标）
upstream_check_command: "cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CMake 注册 1 个 CTest 目标）
upstream_tests:
  - file: tests/*.cpp (14 files)
    source: expected-1.3.1/tests/*.cpp
    description: "上游 Catch2 测试套件，编译为 tl-expected-tests，CTest 目标 tl::expected::tests；实际执行 37 个 test cases（静态 39 个 TEST_CASE，2 个被条件编译排除），453 断言全部通过"
    command: "./tl-expected-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tl.cpp
    description: "消费者测试：链接 tl::expected，覆盖有值/错误值两类语义，共 16 个真实断言，失败返回非零退出码"
    command: "./test_tl"

# 测试断言总数 (上游 453 + test_package 16)
assertion_count: 469
