software: terminator
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/gnome-terminator/terminator/archive/refs/tags/v2.1.5.tar.gz"

  # 源码校验和
  sha256: "df46cb8fbf4bc80289cabbf59e22a03948a65278c637573db3bc5e7acfd1966b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "--without-gettext"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python setuptools package: use setup.py --without-gettext install --root=staging"
  - "intltool-merge not available on OHOS: use --without-gettext flag"
  - "PEP 668 externally-managed environment: use --break-system-packages for pip install"
  - "Pure Python package: no C/C++ compilation, conanfile.py uses sys.executable setup.py install"
