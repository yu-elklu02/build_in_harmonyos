software: taglib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/taglib/taglib/releases/download/v2.3/taglib-2.3.tar.gz"

  # 源码校验和
  sha256: "7349f6fd942418bc7009ebe743eb7c9d055f02921ec56fa436ec25007c47fd38"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "BUILD_TESTING=ON"
    - "BUILD_EXAMPLES=OFF"
    - "BUILD_BINDINGS=OFF"
    - "WITH_ZLIB=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - cppunit/1.15.1 (build-only)
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "TagLib upstream exports ZLIB::ZLIB in its link interface; Conan zlib is mapped to that target name before CMakeDeps generation."
  - "The 556 upstream CppUnit cases are compiled and run when the target is executable."
