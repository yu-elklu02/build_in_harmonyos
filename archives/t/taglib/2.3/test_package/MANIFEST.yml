package: taglib/2.3
homepage: https://taglib.org/

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "cmake --build . --target test_runner"
upstream_tests:
  - file: tests/test_string.cpp
    source: taglib-2.3.tar.gz/tests/test_string.cpp
    description: "TagLib string API cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"
  - file: tests/test_fileref.cpp
    source: taglib-2.3.tar.gz/tests/test_fileref.cpp
    description: "FileRef format handling cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"
  - file: tests/test_mp4.cpp
    source: taglib-2.3.tar.gz/tests/test_mp4.cpp
    description: "MP4 metadata cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"

test_package_tests:
  - file: test_taglib.cpp
    description: "Exercise TagLib string and byte-vector APIs after upstream CppUnit tests are compiled"
    command: "./test_taglib"

assertion_count: 558
