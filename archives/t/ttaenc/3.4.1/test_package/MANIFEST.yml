# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ttaenc/3.4.1
homepage: "https://tausoft.org/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ttaenc has no formal test suite; verification is via -v (version) and -h (help)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ttaenc.sh
    description: "Run ttaenc -v, -h, and encode a minimal WAV to TTA to verify binary functionality"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
