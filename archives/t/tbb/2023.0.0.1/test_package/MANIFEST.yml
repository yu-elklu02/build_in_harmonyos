# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tbb/2023.0.0
homepage: https://github.com/uxlfoundation/oneTBB

# oneTBB 上游测试通过 CMake tbb_add_test() 构建, ctest 运行
# 上游测试目录: test/tbb/ (83 个 .cpp) + test/tbbmalloc/ (13 个 .cpp) = 96 个单元测试
# 鸿蒙适配后 TBB_TEST=OFF 禁用上游测试
# 禁用原因: 部分测试依赖鸿蒙未实现的系统调用 (如 pthread_sigmask)
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ctest"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tbb.cpp
    description: "tbb::parallel_for 并行计算验证: 对 1000 个元素执行 data[i]=i*2, 逐元素 assert 校验结果正确性"
    command: "./test_tbb"

# 测试断言总数 (近似值)
# 1) TBB 库可链接 (编译链接成功)
# 2) parallel_for 可执行 (运行无崩溃)
# 3) 计算结果正确 (1000 次 assert 全通过)
assertion_count: 3
