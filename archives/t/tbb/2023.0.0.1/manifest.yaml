build_system: cmake

source:
  url: "https://github.com/oneapi-src/oneTBB/archive/refs/tags/v2023.0.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/usr/local"
