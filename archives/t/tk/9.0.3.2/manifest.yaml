# 版本级 manifest（AI 元数据，CI 不读）
software: tk
version: "9.0.3.1"
status: built            # published | built | failed | archived
build_system: autotools  # 标准 conan Autotools（CI 原生 clang）
build_date: "2026-07-08"

source:
  url: "https://raw.gitcode.com/OpenHarmonyPCDeveloper/ohos_tk/archive/refs/heads/9.0.3.1.tar.gz"
  sha256: "56b644cd2c11a460be9b70c2d64a60b911b040143a330dc948084b0e20a8f969"
  tar_format: tar.gz     # fork tarball，OHOS 适配已 baked in

build:
  system: autotools
  configure_options:
    - "tcl_cv_sys_version=Linux-6.6"
    - "--disable-zipfs"
    - "--enable-ohos"
    - "--with-tcl=<tcl_pkg_libdir>"
  dependencies:
    - "tcl/9.0.3.1"
  cc: clang
  cxx: clang++

patches_applied: []      # 适配在 fork 源码里，非补丁

test_results:
  type: conan-verify     # conan-verify G0-G4 + L2/L4/L5 全部通过
  total: 2
  passed: 2
  failed: 0

knowledge_gained:
  - "tk 适配坑与 tcl 一致（uname shim、umask 077→022、--disable-zipfs），额外需 --with-tcl 指向 tcl 包 libdir"
  - "tk.h #include <X11/Xlib.h>，但 install-headers 不装 xlib/ 的 X11 stub 头，package() 需手动复制 xlib/X11/*.h 到 include/X11/"
  - "--enable-ohos 为 tk fork 的 OHOS 适配选项"

knowledge_ref: []
