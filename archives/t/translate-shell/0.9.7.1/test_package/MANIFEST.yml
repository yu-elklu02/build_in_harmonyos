# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: translate-shell/0.9.7.1
homepage: "https://github.com/soimort/translate-shell"

# 上游测试命令
upstream_check_command: "make check"

# build() 中是否集成上游测试
# 上游 make check 需要网络连接访问翻译引擎 API，离线 CI 无法运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 无离线可运行的测试（make check 依赖在线翻译服务）
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test_trans.sh
    description: "trans --version smoke test，验证脚本可执行（含 HMDFS bless）"
    command: "sh test_trans.sh <trans_bin>"

# 测试断言总数
assertion_count: 1
