version: "2.02.61"
upstream_version: "2.02.61"
license: GPL-3.0-or-later
status: built
build_date: "2026-08-14"

source:
  url: "https://github.com/scandum/tintin/releases/download/2.02.61/tintin-2.02.61.tar.gz"
  sha256: "640b4823b6f24ada6d417311bfd6263ab13be2422573c3b4ad4352223b535d88"
  tar_format: tar.gz

build:
  system: autotools
  dependencies:
    - "zlib/1.3.2"
    - "pcre2/10.45.1"
  outputs:
    - "bin/tt++"
  cc: clang
  cxx: null

patches_applied:
  - "Use TMPDIR and umask 022 for Autoconf temporary directories (E081/E011)"
  - "Detect open_memstream via configure (HAVE_OPEN_MEMSTREAM), verify write result at runtime, fall back to mkstemp when broken"

knowledge_gained:
  - "Tarball 自带 config.sub/config.guess（2025-07-10）原生支持 linux-ohos 三元组，无需三元组补丁。"
  - "Makefile 编译规则只用 $(CFLAGS)（INCS=@MYINCLUDE@ 因 includedir 取默认而为空），依赖 include 路径必须同时进 CFLAGS，仅 CPPFLAGS 只对 configure conftest 生效。"
  - "OHOS libc 的 open_memstream 已损坏（写入丢弃、缓冲区从不分配、free 崩溃），fopencookie 同样段错误；fmemopen 在有效缓冲区下正常。configure 探测只能证明符号存在，必须在写入后做运行时校验并回退 mkstemp(TMPDIR)+fdopen+读回。"
  - "官方 AI 检视不接受 #if defined(__OHOS__) 平台宏（R8），特性探测宏（HAVE_*）+运行时校验回退是合规写法。"
  - "tt++ 无 TTY 时终端初始化 tcsetattr 致命；-H（nohup）模式跳过终端初始化，是无 TTY CI 运行上游 validate 的必需参数。"
  - "tt++ -V 按上游行为打印版本后 exit(1)，测试断言只能校验输出内容。"
  - "上游 validate 自校验脚本（37 个编号校验组）以输出 'End of validation with 0 errors' 为通过判据，退出码恒为 0。"

verification:
  local:
    - date: "2026-08-14"
      result: "py_compile + YAML/JSON syntax + patch dry-run apply PASS"
  ohos_real_device:
    - date: "2026-08-14"
      run_dir: "/storage/Users/currentUser/tmp/tintin-conan-create.log"
      result: "conan create + upstream validate + test_package PASS"
      profile: "ci/conan/profiles/ohos-aarch64"
      package_ref: "tintin/2.02.61#870276fdfd235843f82440e1ba355dde:3693e0b8ab24631f58872d95df055afd13c92098#31e2b4e5edc521ed22935472f42e160a"
      upstream_tests: "validate 113/113 assertion points, 0 errors"
      test_package: "6/6 assertions passed (4 positive + 2 negative)"
      elf: "ELF 64-bit LSB arm64, NEEDED libc.so only (zlib/pcre2 static-linked)"
