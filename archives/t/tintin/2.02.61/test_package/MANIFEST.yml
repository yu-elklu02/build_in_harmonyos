package: tintin/2.02.61
upstream_test_in_build: false
upstream_tests:
  - file: src/validate
    description: "Upstream TinTin++ self-validation script: 113 error assertion points (112 distinct labels), covering the TINTIN scripting engine (math, line, buffer, switch, class, loop, parse, path, script, regex, list, format, map, hash, cursor, tab)"
upstream_test_note: "上游无正式测试框架（无 CTest/Boost.Test），上游仓库（master）与 2.02.61 release 均无 test 目录、无 CI workflow；validate 为随源码分发的唯一测试产物。以 tt++ -H -G validate 运行（-H 为无 TTY 的 CI 环境跳过终端初始化），通过判据为输出 End of validation with 0 errors。113 个 error 断言点全部执行、0 个触发（即 113/113 通过）。脚本原样拷贝至 test_package，未做任何修改。上游脚本自身的编号存在缺陷：)=-=( ERROR N )=-=( 标记共 38 处、独立编号 36 个（编号 23 无独立标记、19 与 30 各重复一次），该标记仅用于分组注释，不影响 113 个 error 断言点的统计。"
test_package_tests:
  - file: test_tintin.sh
    description: "tt++ binary presence, -V version output, full upstream validate suite (exit code + 0 errors assertion), and negative tests (invalid -l option must be rejected with usage message)"
    command: "tt++ -V; tt++ -H -G validate; tt++ -H -l bogus (must fail)"
assertion_count: 6
