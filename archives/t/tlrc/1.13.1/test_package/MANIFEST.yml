# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tlrc/1.13.1
homepage: "https://tldr.sh/tlrc"

# 上游测试命令: tlrc 使用 cargo test（assert_cmd 集成测试，纯本地渲染，无网络依赖）
upstream_check_command: "cargo test --release"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tests.rs
    source: tlrc-1.13.1/tests/tests.rs
    description: "tlrc 集成测试（本地 markdown 渲染，--raw/--compact/--short-options 等）"
    command: "cargo test --release --test tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 tldr --version 验证版本，--render 验证本地页面渲染"
    command: "test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
