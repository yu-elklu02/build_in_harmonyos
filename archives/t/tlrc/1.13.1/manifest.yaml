# 版本级 manifest
# 文件位置: archives/t/tlrc/1.13.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13.1"

# 软件名
software: "tlrc"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"
build_system: "cargo"

# 测试结果（上游测试全量执行：22/22 通过）
test_passed: 22
test_failed: 0
test_skipped: 0

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（crates.io 官方发布包，cargo registry 标准分发格式）
  url: "https://static.crates.io/crates/tlrc/tlrc-1.13.1.crate"

  # 源码校验和（与 crates.io API 官方 checksum 一致）
  sha256: "856e74b1c4f20ad37f6412bb31196c1587c8184a4577819a4ca5ac9cbc582157"

  # 压缩格式（.crate 实为 gzip tar）
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cargo

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（纯 cargo crate 依赖，无系统 C 库）
  dependencies: []

  # 编译器（ring crate 的 cc-rs 需要，使用 OHOS clang）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次零源码修改）
patches_applied: []
# - "0001-xxx.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "Rust 项目在 OHOS 上用 cargo 直接编译（target=aarch64-unknown-linux-ohos，E180）"
- "ring crate 的 cc-rs 需要 CC 环境变量指向 aarch64-unknown-linux-ohos-clang；变量名带连字符不能做 POSIX sh 前缀赋值，须用 env 命令传递"
- "cargo 会向上搜索 Cargo.toml，配方需 cwd=source_folder 并固定 CARGO_TARGET_DIR，否则 target 落在非预期目录"
- ".crate 文件是 gzip tar，conan get() 需显式 filename=xxx.tar.gz 才能走 tar 分支解压"
- "OHOS ELF 二进制必须用 binary-sign-tool 签名（-selfSign 1），否则运行报 Operation not permitted"
