# 软件级 manifest — tccutil
# 文件位置: archives/t/tccutil/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: tccutil

# 显示名
display: "tccutil"

# 一句话描述
description: "macOS 系统 TCC.db（辅助功能权限数据库）管理命令行工具"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/jacobsalmela/tccutil"

# 开源许可证（SPDX 标识）
license: GPL-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "单文件 Python 脚本工具（无编译），settings 仅 os/arch，package_type=application"
    - "shebang 需改为 python3（OHOS 无 python 命令）"
    - "非 macOS 平台 mac_ver()[0] 为空导致 Version('') 抛 InvalidVersion，需容错回退"
    - "packaging 第三方库可能缺失，需最小版本比较回退类"
    - "TCC.db 读写为 macOS 系统能力，OHOS 上不可用（固有平台限制），只验证平台无关能力"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.5.1":
    status: built
    build_date: "2026-08-14"
