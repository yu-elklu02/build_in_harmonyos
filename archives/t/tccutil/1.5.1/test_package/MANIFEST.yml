# test_package/MANIFEST.yml — tccutil 1.5.1
# 上游官方测试声明（详见 docs/TEST_QUALITY_SPEC.md）
#
# 上游测试审计结论：tccutil 1.5.1 **没有任何测试套件**。
#   1. v1.5.1 源码归档（GitHub tag tarball，sha256
#      37c0d87bf95ab750806c4807003b44f0dc9574ef08ff480ffbb982caa9d8c7c7）
#      仅含 5 个条目：tccutil.py / README.md / LICENSE / .gitignore /
#      .github/workflows/python-app.yml
#   2. 无 tests/、无 test_*.py、无 pytest/unittest 用例、无 Makefile check 目标
#   3. .github/workflows/python-app.yml 仅运行 flake8 静态检查（lint），
#      pytest 步骤整段被注释（# - name: Test with pytest）
#   4. 本包为单文件 Python 命令行工具（macOS TCC.db 管理），无 C 编译、
#      无测试框架依赖
# 因此 upstream_tests_exist: false，不输出 HMBS_UPSTREAM_TEST_RESULT
# 的 passed 标记，改为 no_tests（discovered:0 / executed:0，见
# test_tccutil.py 输出）。test_package 3 项消费者断言（CLI --version /
# --help / 模块 API）为真实调用被测包产物，单独统计。

package: tccutil/1.5.1
homepage: "https://github.com/jacobsalmela/tccutil"

# 上游测试命令（审计确认不存在）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（无，上游无测试）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试存在性（审计结论：不存在）
upstream_tests_exist: false
upstream_test_audit:
  - source: "v1.5.1 源码归档文件清单"
    reason: "仅 tccutil.py / README.md / LICENSE / .gitignore / .github/workflows/python-app.yml，无任何测试文件或测试目录"
  - source: ".github/workflows/python-app.yml"
    reason: "CI 仅执行 flake8 静态 lint（E9/F63/F7/F82 选择集 + exit-zero 风格检查）；pytest 步骤整段注释，未启用"
  - source: "源码树"
    reason: "无 tests/、test/、spec/ 目录，无 test_*.py / test_*.sh，无 unittest/pytest 用例，无 Makefile check/test 目标"
  - conclusion: "上游未提供任何自动化测试；由 test_package 执行消费者视角的真实 CLI 与模块 API 断言（3 项），并输出 no_tests 上游标记"

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 真实调用被测包产物）
test_package_tests:
  - file: test_tccutil.py
    description: "真实执行 bin/tccutil --version（断言输出含 1.5.1 且退出码 0）、--help（退出码 0）、模块 API（util_version=='1.5.1' 且 display_version/display_help 可调用）"
    command: "python3 test_tccutil.py <package_folder>"

# 测试断言总数（test_package 3 项消费者断言；上游 0 项）
assertion_count: 3
