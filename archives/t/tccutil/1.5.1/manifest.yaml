# 版本级 manifest — tccutil 1.5.1
# 文件位置: archives/t/tccutil/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名（Conan 包名）
software: tccutil

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-14"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag tarball）
  url: "https://github.com/jacobsalmela/tccutil/archive/refs/tags/v1.5.1.tar.gz"

  # 源码校验和
  sha256: "37c0d87bf95ab750806c4807003b44f0dc9574ef08ff480ffbb982caa9d8c7c7"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python 脚本工具，无编译）
  system: custom

  # 配置选项列表
  configure_options: []

  # 运行时依赖（python3 解释器为命令依赖，由 hmbs 注入 HMBS_PYTHON3）
  dependencies: []

  # 不需要编译器（纯 Python，无 C 扩展）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-tccutil-py-ohos-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tccutil 是 macOS 系统 TCC.db（辅助功能权限数据库）管理工具，官方源 jacobsalmela/tccutil，单文件 Python 脚本（tccutil.py），无编译过程"
  - "纯 Python 包使用 settings=('os','arch')，无编译器、无 ELF 签名需求；package_type='application'，产物仅为 bin/tccutil 可执行脚本"
  - "非 macOS 平台 platform.mac_ver()[0] 返回空字符串，packaging.version.Version('') 抛 InvalidVersion 导致模块 import 即崩；需容错回退 osx_version=version('0.0.0')"
  - "OHOS 精简环境可能未安装 packaging 第三方库，需提供最小版本比较回退类（仅 __ge__/__lt__，用于 macOS 版本门槛比较，非 macOS 分支不可达）"
  - "OHOS 无 python 命令（只有 python3），脚本 shebang 需从 /usr/bin/env python 改为 /usr/bin/env python3"
  - "上游无任何测试套件（源码仅 5 个文件，CI workflow 只跑 flake8 lint，pytest 步骤被注释），MANIFEST.yml 声明 upstream_tests_exist: false + 审计，test_package 输出 no_tests 上游标记"
