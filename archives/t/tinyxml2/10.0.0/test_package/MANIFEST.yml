package: tinyxml2/10.0.0
homepage: https://github.com/leethomason/tinyxml2

# 上游测试集成（规则 4）：tinyxml2 10.0.0 上游测试为自包含单文件测试
# 框架（xmltest.cpp，内部自带断言与统计，不依赖 Google Test）。主
# conanfile.py 的 build() 在 OHOS 上真实编译并运行上游 xmltest，校验
# 汇总行 "Pass N / Fail 0"（通过率 100%），失败即抛 ConanException 使
# conan create 失败，故 upstream_test_in_build: true。
# 实测（OHOS aarch64, clang 15.0.4）：Pass 508 / Fail 0，通过率 100%。
upstream_test_in_build: true
upstream_tests:
  - file: "xmltest.cpp"
    source: "xmltest.cpp"
    description: "tinyxml2 上游单元测试套件（自包含测试框架，508 项断言；build() 内编译运行并校验 Fail 0）"
    command: "xmltest"

test_package_tests:
  - file: test_tinyxml2.cpp
    description: "tinyxml2 parse/modify/serialize roundtrip: XMLDocument::Parse → RootElement → FirstChildElement → NewElement → XMLPrinter"
    command: "ctest --output-on-failure"

assertion_count: 508
