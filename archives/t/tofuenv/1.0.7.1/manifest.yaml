software: tofuenv
version: 1.0.7.1
status: built
build_date: "2026-08-11"

source:
  url: "https://github.com/tofuutils/tofuenv/archive/refs/tags/v1.0.7.tar.gz"
  sha256: "047c6a01a0d4c7ded2cf126ae1e891bb3479b2544ec2d2f0d3951de2d08f6c7d"
  tar_format: tar.gz

build_system: custom
build_type: script-only

adaptation_type: patch
# Same upstream source as 1.0.7, version bump for OHOS platform fixes:
# - curlw timeout injection (github.com blocked on OHOS)
# - jq dependency removed (grep+sed replacement)
# - /tmp → ${TMPDIR:-$HOME/tmp} (OHOS /tmp read-only)
# - TOFUENV_API_REMOTE separation (install vs list-remote URL conflict)
# - TOFUENV_REMOTE mirror via runenv_info

knowledge_gained:
  - "纯 bash 脚本工具无需编译，build() 仅重写 shebang + 平台补丁"
  - "OHOS bash 路径为 /data/service/hnp/bin/bash，需替换 #!/usr/bin/env bash"
  - "tofuenv --version 通过 awk 解析 CHANGELOG.md，必须打包 CHANGELOG.md"
  - "OHOS: github.com:443 被阻断，需通过 TOFUENV_REMOTE 设置镜像源"
  - "OHOS: jq 非系统标配，用 grep+sed 替代 list-remote 中唯一的 jq 调用"
  - "OHOS: /tmp 只读(E002)，bashlog 日志路径需改用 ${TMPDIR:-$HOME/tmp}"
  - "TOFUENV_REMOTE 在 install 和 list-remote 中 URL 格式不同，需分离变量"
