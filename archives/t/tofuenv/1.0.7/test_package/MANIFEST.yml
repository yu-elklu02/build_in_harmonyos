package: tofuenv/1.0.7
homepage: "https://github.com/tofuutils/tofuenv"

# tofuenv is a pure bash script tool — no make check / ctest / meson test
upstream_check_command: "bash test/run_tests.sh"

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试为 bash 脚本 (test/ 目录), 不适用于 Conan L1 测试
upstream_tests:
  - file: test/run_tests.sh
    source: tofuenv-1.0.7.tar.gz/test/run_tests.sh
    description: "上游 bash 单元测试 (需要网络 + jq)"
    command: "bash test/run_tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "烟雾测试: tofuenv --version 可执行"
    command: "bash test.sh"

assertion_count: 2
