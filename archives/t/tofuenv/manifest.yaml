software: tofuenv
display: "tofuenv"
description: "OpenTofu version manager inspired by tfenv"
category: utility
homepage: "https://github.com/tofuutils/tofuenv"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 bash shell 脚本工具，无需编译，package() 直接复制脚本文件"
    - "所有脚本 shebang 需从 #!/usr/bin/env bash 改写为 #!/data/service/hnp/bin/bash"
    - "运行时依赖 curl、grep、sed、awk（1.0.7.1 起已消除 jq 依赖）"
    - "tofuenv --version 通过 awk 解析 CHANGELOG.md 获取版本号，需打包 CHANGELOG.md"
    - "OHOS: github.com 不可达，通过 TOFUENV_REMOTE 设置镜像源"
    - "OHOS: curlw 需注入超时参数，避免不可达时长时间卡住"
    - "OHOS: /tmp 只读(E002)，bashlog 路径改用 ${TMPDIR:-$HOME/tmp}"
  common_dependencies:
    - curl
    - grep
    - sed
    - awk

versions:
  "1.0.7":
    status: built
    build_date: "2026-07-15"
  "1.0.7.1":
    status: built
    build_date: "2026-08-11"
