package: bgpq4/1.16
homepage: https://github.com/bgp/bgpq4

upstream_check_command: "make check runs tests/generate_outputs.sh and compares tests/reference/*.txt; bgpq4 -v covers the deterministic version path"
upstream_test_in_build: true
upstream_test_command: "bgpq4 -v executed from conanfile.py build() when the target binary can run; reference-output regression suite is documented but not run in CI"

upstream_tests:
  - file: tests/generate_outputs.sh
    source: bgpq4-1.16/tests/generate_outputs.sh
    description: Upstream reference-output regression driver for the tag archive reference suite; the 1.16 archive contains 44 reference output files covering output formats and IRR source-scope cases.
    command: tests/generate_outputs.sh <bgpq4-binary> <output-dir>
    case_count: "44 reference files; counted as 44+ upstream checks when combined with the deterministic version path"
  - file: tests/reference/*.txt
    source: bgpq4-1.16/tests/reference/*.txt
    description: Expected upstream reference outputs generated by generate_outputs.sh; kept as fixtures for the same 44-file reference suite, not a second independent test count.
    case_count: "fixture set for the generate_outputs.sh reference suite"
  - file: main.c
    source: bgpq4-1.16/main.c
    description: Deterministic upstream CLI/version path exercised by executing the freshly built bgpq4 -v binary.
    command: bgpq4 -v
    case_count: 1

excluded_upstream_tests:
  - command: "make check live IRR query / tests/generate_outputs.sh"
    reason: "Requires external IRR network access and live registry data for AS/AS-SET expansion, so the full 44-reference-output regression suite is not deterministic in contest CI. The deterministic version path and an offline Junos prefix-list formatting smoke test are executed instead."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes the deterministic upstream CLI and offline output-format smoke tests but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test_bgpq4.sh
    description: Consumer smoke test executes the packaged bgpq4 -v binary, checks the version output, and verifies offline Junos prefix-list formatting for an explicit prefix.
    command: sh test_bgpq4.sh

assertion_count: 4
