software: bgpq4
display: "bgpq4"
description: "BGP filtering automation tool that generates router prefix-lists and AS-path filters from IRR data"
category: network
homepage: "https://github.com/bgp/bgpq4"
license: BSD-2-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "GitHub release tarball 未包含 configure，当前 recipe 绕过 Autotools，直接编译 C 源码"
    - "命令行工具，无库产物；package_info 仅声明 bindirs"
    - "上游 make check 包含 bgpq4 -v 以及依赖网络/DNS 的在线 IRR 查询，在线部分可能受环境网络影响"
  common_dependencies: []

versions:
  "1.16":
    status: built
    build_date: "2026-07-16"
