# 软件级 manifest（规则 17：archives/{letter}/{name}/ 软件文档索引）
# 文件位置: archives/b/badread/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0；版本级细节见 0.4.2/manifest.yaml

software: badread
display: "Badread"
description: "Badread: a long-read simulator that imitates many types of read problems (chimeras, low-quality regions, systematic basecalling errors)"
category: tool
homepage: "https://github.com/rrwick/Badread"
license: GPL-3.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Python 包，用 pip wheel 构建，解压 wheel 到 site-packages + bin/wrapper"
    - "conan 沙箱 PATH 不含 pip，需用 python3 -m pip + shutil.which 解析绝对路径"
    - "wrapper 必须解析同级 ../lib/python3.12/site-packages 并注入 PYTHONPATH"
    - "上游 pytest 304 用例全部通过，无与 OHOS 适配相关的修改"
  common_dependencies:
    - edlib

versions:
  "0.4.2":
    status: built
    build_date: "2026-07-28"
