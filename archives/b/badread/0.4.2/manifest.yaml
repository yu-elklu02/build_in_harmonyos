# 版本级 manifest 模板
# 文件位置: archives/b/badread/0.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.2"

# 软件名
software: "badread"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rrwick/Badread/archive/refs/tags/v0.4.2.tar.gz"

  # 源码校验和
  sha256: "488ee2c4b87c064904e2ea1ef24ef833c2f5932aa4c1f03e361e2e4061692baf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: "tar.gz"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: "custom"

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # Python 依赖由宿主环境提供，非 conan 依赖
  dependencies: []

  # 编译器
  # 纯 Python 包，无 C/C++ 编译
  cc: "python3"
  cxx: "none"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 上游测试真实运行结果（规则 5）
# ============================================================

# 实跑 badread 0.4.2 上游 pytest 套件（2026-08-01，本机 python 3.12 +
# edlib 1.3.9.post1 + numpy 2.5.1 + scipy 1.17.1 + matplotlib 3.10.9 + pytest 9.1.1）：
# - 304 passed / 0 failed / 0 skipped（test/ 目录 39 个条目，15 个 pytest 测试文件）
# - 上游测试全部通过，无失败，无与 OHOS 适配相关的修改
# - 注：本机 edlib.so 为 OHOS 交叉编译残留，需 LD_PRELOAD libpython3.12.so 才能加载，
#   属宿主机验证环境问题，不影响 OHOS 目标环境
upstream_test_run:
  command: "python3 -m pytest test/ -q"
  test_dir: "test/"
  entries: 39
  test_files: 15
  total: 304
  passed: 304
  failed: 0
  skipped: 0
  pass_rate: "100% (304/304)"
  failures: []
  conclusion: "上游 badread 0.4.2 的 15 个 pytest 测试文件共 304 个用例全部通过，与 OHOS 适配无关，无上游测试修改。"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Python 包用 pip wheel 构建，解压 wheel 到 site-packages + bin/wrapper"
  - "conan 沙箱 PATH 不含 pip，需用 python3 -m pip + shutil.which 解析绝对路径"
  - "wrapper 必须解析同级 ../lib/python3.12/site-packages 并注入 PYTHONPATH"
  - "gitcode 镜像对部分仓库返回 HTML 404 页面而非 tarball，sha256 校验可识别"
