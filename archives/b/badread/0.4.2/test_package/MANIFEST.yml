# test_package/MANIFEST.yml
# 声明上游测试来源（CI L0e 强制要求）
# badread 是纯 Python 命令行工具，无 C/C++ 编译

upstream_test:
  source: "https://github.com/rrwick/Badread"
  type: "cli_app"
  test_type: "explicit"

# 上游测试命令（badread 用 pytest，需 edlib/numpy/scipy/matplotlib）
upstream_check_command: "python3 -m pytest test/ -q"
upstream_test_in_build: true
upstream_tests:
  - file: test_adapters.py
    passed: 23
    failed: 0
  - file: test_alignment.py
    passed: 10
    failed: 0
  - file: test_cli.py
    passed: 46
    failed: 0
  - file: test_error_model.py
    passed: 49
    failed: 0
  - file: test_fragment_lengths.py
    passed: 6
    failed: 0
  - file: test_fragments.py
    passed: 15
    failed: 0
  - file: test_glitches.py
    passed: 9
    failed: 0
  - file: test_identities.py
    passed: 14
    failed: 0
  - file: test_misc.py
    passed: 48
    failed: 0
  - file: test_qscore_model.py
    passed: 49
    failed: 0
  - file: test_quickhist.py
    passed: 9
    failed: 0
  - file: test_references.py
    passed: 4
    failed: 0
  - file: test_simulate.py
    passed: 7
    failed: 0
  - file: test_simulate2.py
    passed: 8
    failed: 0
  - file: test_target_size.py
    passed: 7
    failed: 0
# 真实运行结果（2026-08-01）：304 passed / 0 failed / 0 skipped（15 个 pytest 测试文件，共 304 用例）
# 环境：python 3.12 + edlib 1.3.9 + numpy 2.5.1 + scipy 1.17.1 + matplotlib 3.10.9 + pytest 9.1.1
# 注：本机 edlib.so 需 LD_PRELOAD libpython3.12.so 解决动态符号链接（OHOS 交叉编译残留），
# 不影响 OHOS 目标环境。详见 archives/b/badread/0.4.2/manifest.yaml 的 upstream_test_run 字段。

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test_badread.py
    description: "badread 包可执行性验证（badread --version 输出 Badread v0.4.2）"
    command: "bin/badread --version"

# 测试断言总数（近似值）
assertion_count: 1
