software: bitwise
display: "bitwise"
description: "终端位运算计算器，支持多进制转换、位运算、表达式求值和交互模式"
category: utility
homepage: "https://github.com/mellowcandle/bitwise"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需添加 linux-ohos 平台支持"
    - "OHOS /tmp 只读，configure 中 mktemp 需改用 $TMPDIR"
    - "OHOS libc (musl) 不提供 l64a() 函数，需在 misc.c 中实现"
    - "l64a() 调用需添加 extern 声明，避免 aarch64 上隐式 int 返回导致指针截断"
    - "系统预构建 ncurses/readline 通过 CFLAGS/LDFLAGS 引用，不进 Conan requires"
    - "静态链接 (-static)，符合 R26 系统同名库隔离要求"
  common_dependencies:
    - "ncurses/6.4 (system prebuilt)"
    - "readline/8.2 (system prebuilt)"

versions:
  "0.50":
    status: published
    build_date: "2026-07-06"
