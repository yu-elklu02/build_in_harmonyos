software: bitwise
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.50/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.50"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-06"

# Conan 引用
conan_ref: "bitwise/0.50@ohpcd/stable"

# 构建系统（顶层，供质量检查器使用）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mellowcandle/bitwise/releases/download/v0.50/bitwise-v0.50.tar.gz"
  sha256: "806271fa5bf31de0600315e8720004a8f529954480e991ca84a9868dc1cae97e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=$PREFIX"
  dependencies:
    - "ncurses/6.4 (system prebuilt)"
    - "readline/8.2 (system prebuilt)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0005-src-main.c.patch"
  - "0006-src-misc.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc (musl) does not provide l64a() function; must implement in misc.c"
  - "l64a() call in main.c requires extern declaration to avoid implicit int return on aarch64"
  - "config.guess/config.sub need linux-ohos* support for OHOS platform detection"
  - "config.status/configure use mktemp with hardcoded /tmp path which is read-only on OHOS; patch to use $TMPDIR"
  - "ncurses prebuilt packages contain only .a libraries; headers must be assembled from ncurses 6.4 source"
  - "System prebuilt dependencies (ncurses/readline) should NOT go in Conan requires; use CFLAGS/LDFLAGS to point to DEFAULT_PREFIX"
  - "Conan basic_layout creates build-release/ subdirectory breaking -I./inc relative path; add extra_cflags"
  - "make check fails because CUnit is not available on OHOS (not a build dependency, can skip)"
  - "CI workers may lack ncurses/readline .a libraries entirely, not just headers; bundle both in res/"
  - "Passing LIBS='-lreadline -lform -lncurses' via make command line fails: make splits on spaces and treats -lform/-lncurses as -l options; patch Makefile directly instead"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/bitwise-0.50.orig
  source_work_dir: /storage/Users/currentUser/builds/bitwise-0.50.work
  source_orig_hash: 0bf6a9e0c8ae66b7
  source_work_hash: bc3593e580d6c1e8
  generated_at: '2026-07-06T20:22:20'
  patches_count: 5

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0005-src-main.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0006-src-misc.c.patch
    type: auto
    platform_only: True
    guard: 'pending'

# ============================================================
# 捆绑资源 (Bundled Resources)
# ============================================================
# CI workers may lack ncurses/readline headers AND .a libraries.
# The conanfile.py checks for system headers at $DEFAULT_PREFIX/include/
# and falls back to these bundled copies when not found.
# Headers generated from ncurses 6.4 / readline 8.2 source.
# Libraries built with clang 15 for aarch64-linux-ohos.
bundled_headers:
  source: "ncurses 6.4 + readline 8.2 (system prebuilt install)"
  path: "res/headers/"
  contents:
    ncurses: ["form.h", "curses.h", "eti.h", "ncurses_dll.h", "panel.h", "unctrl.h"]
    readline: ["readline/readline.h", "readline/chardefs.h", "readline/history.h",
               "readline/keymaps.h", "readline/rlconf.h", "readline/rlstdc.h",
               "readline/rltypedefs.h", "readline/tilde.h"]

bundled_libraries:
  source: "ncurses 6.4 + readline 8.2 (built with clang 15 for aarch64-linux-ohos)"
  path: "res/libs/"
  contents:
    - "libreadline.a"
    - "libform.a"
    - "libncurses.a"
