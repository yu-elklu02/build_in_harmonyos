# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: bitcoin/31.1
homepage: "https://bitcoincore.org/"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — Bitcoin Core 使用 ctest 运行 test_bitcoin 二进制
upstream_tests:
  - file: test/setup_common.cpp
    source: bitcoin-31.1/src/test/setup_common.cpp
    description: "Bitcoin Core 单元测试框架 (test_bitcoin)"
    command: "./test_bitcoin"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "构造 uint256 检查 IsNull() + 调用 ParseHex（真实库符号链接与运行验证）+ 版本宏校验"
    command: "./test_bitcoin"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
