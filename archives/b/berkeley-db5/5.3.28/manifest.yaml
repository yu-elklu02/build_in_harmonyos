software: berkeley-db5
version: "5.3.28"
status: built
build_date: "2026-07-16"
build_system: autotools

source:
  url: "https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz"
  sha256: "e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--enable-static"
    - "--enable-shared"
    - "--with-repmgr-ssl=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-sub-ohos.patch"

knowledge_gained:
  - "E007: 更新config.guess/config.sub为automake-1.16版本以支持OHOS平台识别"
  - "Berkeley DB 5.3.28 需在 build_unix 目录下运行 ../dist/configure"
  - "HMDFS: config.status 创建 temp 目录时 umask 077 导致 2700 权限(setgid位阻止写入)，需修改 config.status 使用 \$TMPDIR + umask 022"
  - "HMDFS: libtool 等脚本无执行权限，需通过 /bin/sh 调用"
  - "HMDFS: 不支持符号链接，需将 ln -s 替换为 cp"
  - "没有 make check 目标，需用功能验证替代测试"

binaries:
  - db_archive
  - db_checkpoint
  - db_deadlock
  - db_dump
  - db_hotbackup
  - db_load
  - db_log_verify
  - db_printlog
  - db_recover
  - db_replicate
  - db_stat
  - db_tuner
  - db_upgrade
  - db_verify

libraries:
  - libdb-5.3.so
  - libdb-5.3.a
  - libdb.a

headers:
  - db.h
  - db_cxx.h
