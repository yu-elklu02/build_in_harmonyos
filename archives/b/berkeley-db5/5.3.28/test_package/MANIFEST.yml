# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: berkeley-db5/5.3.28
homepage: "https://www.oracle.com/database/technologies/related/berkeleydb.html"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: berkeley-db5-5.3.28/test_package/test.c
    description: "消费者测试 — 验证 db_create 和 db->close API 可用性"
    command: "./test_berkeley-db5"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 调用 Berkeley DB C API (db_create/db->close)"
    command: "./test_berkeley-db5"

# 测试断言总数
assertion_count: 2
