# 知识沉淀
knowledge_gained:
  - id: K001
    category: cmake_compatibility
    description: "CMake 版本兼容性：bullet 3.25 需要添加 CMAKE_POLICY_VERSION_MINIMUM=3.5 参数才能在 CMake 4.x 上编译"
    severity: medium
  - id: K002
    category: cpp_standard_library
    description: "C++ 标准库链接：鸿蒙环境下使用 libc++ 需要 -lc++ -lc++abi 链接参数，并设置 LD_LIBRARY_PATH"
    severity: high
  - id: K003
    category: static_library
    description: "纯静态库特性：bullet 编译为纯静态库，无需 ELF 签名，可直接使用"
    severity: low
  - id: K004
    category: build_optimization
    description: "大型项目优化：禁用演示程序和测试程序可大幅减少编译时间（从数分钟降至约 20 秒）"
    severity: low

