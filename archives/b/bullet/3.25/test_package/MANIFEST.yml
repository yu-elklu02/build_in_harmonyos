# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bullet/3.25
homepage: "https://github.com/bulletphysics/bullet3"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: None
    source: N/A
    description: "Bullet 3.25 upstream tests are optional (BUILD_UNIT_TESTS=OFF). Consumer test validates physics simulation."
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: creates a dynamics world with ground plane and falling sphere, simulates 3s, verifies sphere rests on ground"
    command: "./test_bullet"

# 测试断言总数
assertion_count: 1
