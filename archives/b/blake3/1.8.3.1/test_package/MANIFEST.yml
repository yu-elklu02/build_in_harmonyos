# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blake3/1.8.3.1
homepage: https://github.com/BLAKE3-team/BLAKE3

# BLAKE3 无独立测试套件，验证通过 test_package 消费者测试完成
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_blake3.c
    description: "blake3 版本号验证 + 空输入哈希 + 单字节 0x00 哈希 (官方 test_vectors.json)"
    command: "./test_blake3"

# 测试断言总数
assertion_count: 3
