package: "berkeley-db/18.1.40"
homepage: "https://www.oracle.com/database/technologies/related/berkeleydb.html"
upstream_check_command: "tclsh run_tcl_tests.tcl"
upstream_test_in_build: true
upstream_test_command: "make test_mutex && tclsh run_tcl_tests.tcl"
upstream_tests:
  - "Berkeley DB Tcl regression suite: 514 Tcl test scripts run by test.tcl run_all"
  - "test_mutex multi-process mutex test"
test_package_tests:
  - file: test.c
    description: "Creates a B-tree database, stores a value, reads it back, and verifies its bytes."
    command: "./test_package"
assertion_count: 4
