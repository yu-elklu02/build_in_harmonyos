    url: "https://download.oracle.com/berkeley-db/db-18.1.40.tar.gz"
    sha256: "0cecb2ef0c67b166de93732769abdeba0555086d51de1090df325e18ee8da9c8"
patches:
  "18.1.40":
    - patch_file: "patches/0001-fix-hmdfs-configure-temp-permissions.patch"
      patch_description: "Allow config.status to read generated AWK scripts on HMDFS"
      patch_type: "portability"
    - patch_file: "patches/0002-skip-missing-document-install.patch"
      patch_description: "Do not install documentation absent from the source archive"
      patch_type: "portability"
    - patch_file: "patches/0003-link-tcl-module-to-tcl-runtime.patch"
      patch_description: "Link the Tcl extension against the selected Tcl runtime"
      patch_type: "portability"
    - patch_file: "patches/0004-add-ohos-tmpdir-override.patch"
      patch_description: "Allow OHOS tests to use an explicit writable Berkeley DB temp directory"
      patch_type: "portability"
