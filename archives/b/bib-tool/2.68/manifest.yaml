software: bib-tool
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.68/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.68"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.ctan.org/biblio/bibtex/utils/bibtool/BibTool-2.68.tar.gz"

  # 源码校验和
  sha256: "e1964d199b0726f431f9a1dc4ff7257bb3dba879b9fa221803e0aa7840dee0e0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "configure config.status 在 OHOS 上因临时文件权限失败，改用 makefile.unx"
  - "makefile.unx 中 check(OBJ) 是原始拼写错误，需改为 check$(OBJ)"
  - "需要添加 DESTDIR 支持以实现 staging 安装"
