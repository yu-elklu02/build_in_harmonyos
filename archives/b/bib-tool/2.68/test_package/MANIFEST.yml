# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bib-tool/2.68
homepage: "https://ctan.org/pkg/bibtool"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/Makefile
    source: bib-tool-2.68/test/Makefile
    description: "BibTool 官方测试套件 (408 个测试)"
    command: "cd test && make"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试 - 运行 bibtool 处理 BibTeX 文件并验证输出"
    command: "bibtool test.bib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 411
