# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 沙箱无 CAP_NET_ADMIN: SO_PRIORITY setsockopt 返回 EPERM, 需视为非致命"
  - "OHOS musl libc 无 BSD 遗留函数 rindex, 需替换为 strrchr"
  - "OHOS musl libc 无 glibc MAX_INPUT 宏, 需用 _POSIX_MAX_INPUT 兼容定义"
  - "lld 15 --gc-sections 会裁掉 __start_/__stop_ 封装符号, 需 -z nostart-stop-gc"
  - "conan PkgConfigDeps 需补充依赖的 pkg-config 路径注入, 且 dbus 包未声明 pkg_config_name=dbus-1"

