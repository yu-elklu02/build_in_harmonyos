# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bluez/5.79
homepage: https://www.bluez.org/

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check, 25 个 unit 测试, 本地验证 24 PASS / 1 flaky)
upstream_tests:
  - file: unit/test-tester
    source: bluez-5.79/unit/test-tester.c
    description: "tester 框架自检"
    command: "./unit/test-tester"
  - file: unit/test-textfile
    source: bluez-5.79/unit/test-textfile.c
    description: "textfile 键值存储 (OHOS 已改 TMPDIR 路径)"
    command: "./unit/test-textfile"
  - file: unit/test-uuid
    source: bluez-5.79/unit/test-uuid.c
    description: "蓝牙 UUID 转换"
    command: "./unit/test-uuid"
  - file: unit/test-crypto
    source: bluez-5.79/unit/test-crypto.c
    description: "蓝牙加密算法"
    command: "./unit/test-crypto"
  - file: unit/test-ecc
    source: bluez-5.79/unit/test-ecc.c
    description: "ECC 曲线运算"
    command: "./unit/test-ecc"
  - file: unit/test-gatt
    source: bluez-5.79/unit/test-gatt.c
    description: "GATT 协议"
    command: "./unit/test-gatt"
  - file: unit/test-lib
    source: bluez-5.79/unit/test-lib.c
    description: "libbluetooth API"
    command: "./unit/test-lib"
  - file: unit/test-avdtp
    source: bluez-5.79/unit/test-avdtp.c
    description: "AVDTP 协议 (OHOS 已容忍 SO_PRIORITY EPERM)"
    command: "./unit/test-avdtp"
  - file: unit/test-bap
    source: bluez-5.79/unit/test-bap.c
    description: "BAP 音频流 profile"
    command: "./unit/test-bap"
  - file: unit/test-mgmt
    source: bluez-5.79/unit/test-mgmt.c
    description: "内核 mgmt 接口"
    command: "./unit/test-mgmt"

# test_package 中自带的测试 (消费者视角验证, R34: 实质调用被测包二进制)
test_package_tests:
  - file: test.sh
    description: "运行 bluetoothctl --version 验证可执行文件 (fallback: btmon --version)"
    command: "bluetoothctl --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 500
