version: "1.4.0"
software: bzip3
status: published
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/kspalaiologos/bzip3/releases/download/1.4.0/bzip3-1.4.0.tar.gz"
  sha256: "a7bf2369f1ea0e1f2616686348f3749607abadd957519ee09b6f11da02b1039a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBZIP3_BUILD_APPS=ON"
    - "-DBZIP3_ENABLE_PTHREAD=ON"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "bzip3 1.4.0 CMakeLists.txt has VERSION 1.3.0 (upstream bug, release tag is 1.4.0)"
  - "CMake build works on HarmonyOS without patches (unlike autotools which has HMDFS tmp dir issues)"
