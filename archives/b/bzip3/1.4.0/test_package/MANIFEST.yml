# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: bzip3/1.4.0
homepage: "https://github.com/kspalaiologos/bzip3"

# bzip3 1.4.0 has no automated test suite in the source tarball.
# The CMakeLists.txt does not define any test targets.
upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: ""

# bzip3 1.4.0 does not ship automated tests in the source distribution.
upstream_tests: []

# test_package self-contained test (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Compress/decompress round-trip test using bz3_compress/bz3_decompress API"
    command: "./test_bzip3"

# Approximate assertion count
assertion_count: 4
