# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: bird/3.1.6
homepage: ""

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/event_test.c
    source: bird-3.1.6/test/event_test.c
    description: "事件系统单元测试"
    command: "./event_test"
  - file: test/flowspec_test.c
    source: bird-3.1.6/test/flowspec_test.c
    description: "Flow specification 解析测试"
    command: "./flowspec_test"

# test_package 中自带的测试 (消费者视角验证)
# test.c 通过 system() 调用 bird --version 验证二进制可用性
test_package_tests:
  - file: test.c
    description: "bird 二进制烟雾测试 (bird --version)"
    command: "./test_bird"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
