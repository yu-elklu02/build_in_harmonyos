# manifest.yaml — bird2 2.17.4
package:
  name: bird2
  version: "2.17.4"
  description: "BIRD Internet Routing Daemon — dynamic IP routing daemon"
  homepage: "https://bird.network.cz/"
  license: "GPL-2.0-or-later"
  category: networking

source:
  url: "https://gitlab.nic.cz/labs/bird/-/archive/v2.17.4/bird-v2.17.4.tar.gz"
  sha256: "452dfa74400e69edc4910fa7d9c4b6899e17e59b7d8125e6dd94e45a1af3bfac"

build:
  system: autotools
  configure_args:
    - "--disable-client"
  cflags_extra:
    - "-D__MUSL__"
  ohos_adaptations:
    - "config.guess/config.sub replaced with OHOS-aware versions (E007)"
    - "autoconf + autoheader run before configure (source has configure.ac only)"
    - "-D__MUSL__ added to resolve sockaddr_storage redefinition (E091)"
    - "OHOS SDK sysroot include paths for Linux UAPI kernel headers"
    - "--disable-client (ncurses headers not available on OHOS)"
    - "configure patched: umask 077 → umask 022 (HMDFS permission issue)"
    - "test config files copied to build dir for out-of-source make check"

test:
  make_check: "PASS (22/22 tests)"
  functional:
    bird_version: "PASS"
    bird_help: "PASS"
    config_parse_default: "PASS"
    config_parse_custom: "PASS"
    birdcl_connect: "EXPECTED (requires running daemon)"
    elf_binary: "PASS"

conan:
  reference: "bird2/2.17.4@ohpcd/stable"
  verify: "PASS (G0-G4 + L2/L4/L5)"
  status: "built"

platform:
  os: "OHOS"
  arch: "armv8"
  compiler: "clang 15"
  libc: "musl"
  triplet: "aarch64-unknown-linux-ohos"

binaries:
  - name: bird
    path: "bin/bird"
    size: 1968640
    type: "ELF 64-bit LSB arm64, dynamic, musl libc"
  - name: birdcl
    path: "bin/birdcl"
    size: 59776
    type: "ELF 64-bit LSB arm64, dynamic, musl libc"

config_files:
  - name: bird.conf
    path: "etc/bird.conf"
    description: "Example configuration file"

patch_generation:
  method: inline
  patches_count: 0
  notes: "config.guess/config.sub replaced inline in conanfile.py build(); autoconf.h.in generated dynamically by autoheader"
