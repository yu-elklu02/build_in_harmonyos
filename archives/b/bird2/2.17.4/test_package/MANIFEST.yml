# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bird2/2.17.4
homepage: "https://bird.network.cz/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件
upstream_tests:
  - name: "filter_tests"
    source: bird-v2.17.4/filter/tree_test.c
    description: "过滤器树操作测试"
    command: "make check"
  - name: "lib_tests"
    source: bird-v2.17.4/lib/bitmap_test.c
    description: "核心库单元测试"
    command: "make check"
  - name: "nest_tests"
    source: bird-v2.17.4/nest/rt-fib_test.c
    description: "路由表FIB测试"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "C 测试: 调用 system(\"bird --version\") 验证二进制可用"
    command: "ctest"
  - file: conanfile.py
    description: "Python 测试: 直接运行 bird --version 验证二进制可用"
    command: "bird --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 22
