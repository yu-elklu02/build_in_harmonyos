# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bubblewrap/0.11.0
homepage: https://github.com/containers/bubblewrap

# 上游测试命令 (meson test --list 枚举出的测试)
upstream_check_command: "meson test -C builddir --list"

# conanfile.py build() 中是否已集成上游测试
# 仅 test-utils（纯 C 单元测试，26 subtests）可在 OHOS 上运行；
# 其余 4 个集成测试需要 user namespaces / setuid / /var/tmp，OHOS 不具备。
upstream_test_in_build: true
upstream_test_command: "meson test -C builddir test-utils"

# 上游实际运行的测试程序 (meson test --list)
upstream_tests:
  - file: tests/test-utils
    source: bubblewrap-0.11.0/tests/test-utils.c
    description: "utils.c 单元测试 (parse_proc, get_mount_info 等), 26 subtests 全部通过"
    command: "meson test test-utils"
  - file: tests/test-run.sh
    source: bubblewrap-0.11.0/tests/test-run.sh
    description: "bwrap 沙箱集成测试: 需要 user namespaces + /var/tmp, OHOS 不具备, 跳过"
    command: "meson test test-run.sh"
  - file: tests/test-seccomp.py
    source: bubblewrap-0.11.0/tests/test-seccomp.py
    description: "seccomp 过滤器测试: 需要 Python seccomp 模块, 环境无此模块, 上游自 SKIP"
    command: "meson test test-seccomp.py"
  - file: tests/test-specifying-pidns.sh
    source: bubblewrap-0.11.0/tests/test-specifying-pidns.sh
    description: "指定 PID namespace 测试: 需要 user namespaces, OHOS 不具备, 跳过"
    command: "meson test test-specifying-pidns.sh"
  - file: tests/test-specifying-userns.sh
    source: bubblewrap-0.11.0/tests/test-specifying-userns.sh
    description: "指定 user namespace 测试: 需要 user namespaces, OHOS 不具备, 跳过"
    command: "meson test test-specifying-userns.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 bwrap 二进制存在、--version 输出 bubblewrap 0.11.0、--help 正常"
    command: "conan test"

# 测试断言总数 (近似值)
assertion_count: 26
