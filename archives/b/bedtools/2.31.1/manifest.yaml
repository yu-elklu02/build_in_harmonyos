software: bedtools
version: "2.31.1"
status: built
build_system: makefile
build_date: "2026-07-14"

source:
  url: "https://github.com/arq5x/bedtools2/releases/download/v2.31.1/bedtools-2.31.1.tar.gz"
  sha256: "fc7e660c2279b1e008b80aca0165a4a157daf4994d08a533ee925d73ce732b97"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - file: 0001-Makefile-disable-bz2-lzma.patch
    purpose: 移除顶层 Makefile 中 BT_LIBS 的 -lbz2 -llzma，bedtools 不再链接 bzip2/lzma
    lines_changed: 1
  - file: 0002-src-utils-htslib-Makefile-disable-bz2-lzma.patch
    purpose: 移除 htslib 默认链接库与默认 config.h 中的 HAVE_LIBBZ2/HAVE_LIBLZMA/HAVE_LZMA_H 定义，使内置 htslib 在无 libbz2/liblzma 的 OHOS 工具链下编译通过
    lines_changed: 7

compatibility:
  level: high
  issues:
    - "禁用 bzip2/lzma 后端后，bzip2 压缩输入与 CRAM 格式不支持；BED/VCF/GFF/gzip 等核心格式全部正常"

test_results:
  type: conan-test
  passed: 3
  failed: 0
  note: |
    test_package/test.sh：--version PASS、intersect（逐字节比对预期区间）PASS、sort（已排序文件不变）PASS

knowledge_gained:
  - "bedtools2 顶层 Makefile 与内置 htslib Makefile 默认链接 -lbz2 -llzma 且默认 config.h 硬编码 HAVE_LIBBZ2/HAVE_LIBLZMA；OHOS 工具链无 libbz2/liblzma 头文件与链接名，需补丁移除"
  - "bedtools Makefile 硬编码 SHELL := /bin/bash，OHOS 无 /bin/bash，构建时需 make SHELL=/data/service/hnp/bin/bash 覆盖"
  - "bedtools 链接行只用 ALL_LDFLAGS 不含 ALL_CXXFLAGS，故 -stdlib=libc++ 必须同时放进 CXXFLAGS 与 LDFLAGS，否则 libc++ 符号链接失败"
  - "构建目标取 bin/bedtools（统一二进制，所有子命令经 bedtools <sub> 访问），可避开 make all 的 makeBashScripts.py 对 python 的构建时依赖"

references:
  - https://bedtools.readthedocs.io/
  - https://github.com/arq5x/bedtools2
