package: bedtools/2.31.1
homepage: "https://bedtools.readthedocs.io/"

upstream_check_command: "cd test && bash test.sh"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: test/test.sh
    source: bedtools-2.31.1/test/test.sh
    description: "上游集成测试套件：遍历 test/ 下各子命令目录运行 test-<tool>.sh，逐个比对输出（依赖完整构建与测试数据，作为独立 make test 目标运行，未嵌入 conan build）"
    command: "bash test/test.sh"

test_package_tests:
  - file: test.sh
    description: "调用 bedtools 二进制执行 --version、intersect（两 BED 区间求交并逐字节断言）、sort（已排序文件保持不变）"
    command: "bash test.sh"

assertion_count: 3
