software: bedtools
display: "bedtools"
description: "A powerful toolset for genome arithmetic (intersect/merge/sort/coverage of genomic intervals)"
category: utility
homepage: "https://bedtools.readthedocs.io/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "内置 htslib 默认链接 -lbz2 -llzma 且 config.h 硬编码 HAVE_LIBBZ2/HAVE_LIBLZMA，OHOS 无 libbz2/liblzma，需补丁关闭"
    - "Makefile 硬编码 SHELL := /bin/bash，需 make SHELL=/data/service/hnp/bin/bash 覆盖"
    - "-stdlib=libc++ 需同时进 CXXFLAGS 与 LDFLAGS（链接行不含 CXXFLAGS）"
    - "zlib 经 Conan 依赖提供（-lz）"
  common_dependencies:
    - zlib

versions:
  "2.31.1":
    status: built
    build_date: "2026-07-14"
