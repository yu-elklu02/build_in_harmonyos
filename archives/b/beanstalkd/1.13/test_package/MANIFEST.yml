# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: beanstalkd/1.13
homepage: "https://beanstalkd.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# make check 编译并运行 ct/_ctcheck，但在 OHOS 上因 tmpfile 权限失败
upstream_tests:
  - file: testheap.c
    source: beanstalkd-1.13/testheap.c
    description: "Heap data structure tests"
    command: "make check"
  - file: testjobs.c
    source: beanstalkd-1.13/testjobs.c
    description: "Job data structure tests"
    command: "make check"
  - file: testms.c
    source: beanstalkd-1.13/testms.c
    description: "MS (min-heap) data structure tests"
    command: "make check"
  - file: testserv.c
    source: beanstalkd-1.13/testserv.c
    description: "Server protocol tests"
    command: "make check"
  - file: testutil.c
    source: beanstalkd-1.13/testutil.c
    description: "Utility function tests"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify beanstalkd -v returns version"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
