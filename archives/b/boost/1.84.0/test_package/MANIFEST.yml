package: boost/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译各库自带测试源文件
# 绕过 b2，在 OHOS 环境真实运行了 filesystem/regex/program_options
# 三个库的上游测试（iostreams 测试需 boost_unit_test_framework 库，
# 当前未编译，故未运行）。
# 测试方式：clang++ -std=c++17 -stdlib=libc++ 编译各库 test/*.cpp，
# 链接到已编译的 libboost_*.a，直接运行可执行文件。
# b2 不兼容是已知技术障碍，项目方已记录（E068 错误模式）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/filesystem/test/copy_test.cpp"
    description: "boost.filesystem 复制测试（39 断言）"
    command: "clang++ copy_test.cpp -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/filesystem/test/foreach_test.cpp"
    description: "boost.filesystem 遍历测试"
    command: "clang++ foreach_test.cpp -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/filesystem/test/large_file_support_test.cpp"
    description: "boost.filesystem 大文件支持测试"
    command: "clang++ large_file_support_test.cpp -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/filesystem/test/path_test.cpp"
    description: "boost.filesystem 路径测试（877 断言）"
    command: "clang++ path_test.cpp -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/filesystem/test/convenience_test.cpp"
    description: "boost.filesystem 便捷接口测试（41 断言）"
    command: "clang++ convenience_test.cpp -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/regex/test/issue153.cpp"
    description: "boost.regex 问题 153 测试（1 断言）"
    command: "clang++ issue153.cpp -lboost_regex && ./a.out"
    result: passed
  - file: "libs/regex/test/quick.cpp"
    description: "boost.regex 快速测试（10 断言）"
    command: "clang++ quick.cpp -lboost_regex && ./a.out"
    result: passed
  - file: "libs/program_options/test/cmdline_test.cpp"
    description: "boost.program_options 命令行解析测试（43 断言）"
    command: "clang++ cmdline_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/exception_test.cpp"
    description: "boost.program_options 异常测试（24 断言）"
    command: "clang++ exception_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/exception_txt_test.cpp"
    description: "boost.program_options 异常文本测试（2 断言）"
    command: "clang++ exception_txt_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/optional_test.cpp"
    description: "boost.program_options 可选参数测试（5 断言）"
    command: "clang++ optional_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/options_description_test.cpp"
    description: "boost.program_options 选项描述测试（40 断言）"
    command: "clang++ options_description_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/parsers_test.cpp"
    description: "boost.program_options 解析器测试（61 断言，运行段错误 rc=-11，环境差异）"
    command: "clang++ parsers_test.cpp -lboost_program_options && ./a.out"
    result: failed
  - file: "libs/program_options/test/positional_options_test.cpp"
    description: "boost.program_options 位置选项测试（19 断言）"
    command: "clang++ positional_options_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/quick.cpp"
    description: "boost.program_options 快速测试（1 断言，传入 --path=initial 通过）"
    command: "clang++ quick.cpp -lboost_program_options && ./a.out --path=initial"
    result: passed
  - file: "libs/program_options/test/split_test.cpp"
    description: "boost.program_options 分割测试（8 断言）"
    command: "clang++ split_test.cpp -lboost_program_options && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost.cpp
    description: "boost filesystem+regex+program_options+iostreams: path manipulation + regex_search + parse_command_line + gzip compress/decompress round-trip"
    command: "ctest boost_test"

assertion_count: 6  # test_package 实际断言数（filesystem 1 + regex 1 + program_options 2 + iostreams 2）；上游测试 16 项见 upstream_tests 列表