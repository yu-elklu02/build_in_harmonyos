upstream_tests:
  source: "Boost upstream test tree"
  scope: "Optional diagnostic matrix, enabled only with with_upstream_tests=True; it is component-wide and not the package acceptance suite."
  total: 0
  reason: "The default package acceptance path builds the complete declared component set and runs test_package; upstream matrix results are reported separately when explicitly requested."
adapted_tests:
  - name: test_boost_compiled
    type: consumer
    assertions: 12
    coverage:
      - Boost::boost header target is available for downstream projects
      - boost/format.hpp formats an interpolated value
      - boost/beast/core/static_string.hpp is available to downstream projects
      - program_options parses provided arguments
      - regex validates the parsed name
      - filesystem composes portable paths
      - system default error_code reports no error
      - serialization writes parsed values to an archive
      - atomic increments preserve the worker result
      - thread starts, mutates state, and joins
      - timer reports a non-negative wall-clock duration
      - chrono steady clock duration is non-negative
