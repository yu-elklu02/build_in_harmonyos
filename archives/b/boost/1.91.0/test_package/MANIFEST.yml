package: boost/1.91.0
homepage: "https://www.boost.org/"

upstream_check_command: "cd <build-folder> && ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "cd <build-folder> && ctest --output-on-failure --no-tests=error"
upstream_tests:
  - file: "libs/program_options/test/CMakeLists.txt"
    source: "boost-1.91.0/libs/program_options/test/CMakeLists.txt"
    description: "Official ProgramOptions CMake unit suite (14 test flows)"
    command: "cd <build-folder>/upstream-components && ctest --output-on-failure --no-tests=error"
  - file: "libs/iostreams/test/cmake_subdir_test/test_fd.cpp"
    source: "boost-1.91.0/libs/iostreams/test/cmake_subdir_test/test_fd.cpp"
    description: "Official Iostreams build-tree integration flow"
    command: "cd <build-folder>/upstream-iostreams && ctest --output-on-failure --no-tests=error"
  - file: "libs/regex/test/quick.cpp"
    source: "boost-1.91.0/libs/regex/test/quick.cpp"
    description: "Official Regex CMake consumption flow"
    command: "cd <build-folder>/upstream-regex && ctest --output-on-failure --no-tests=error"

upstream_test_count: 16

test_package_tests:
  - file: "unit.cpp"
    description: "Redex Regex, Filesystem path, and ProgramOptions flow (3 assertions)"
    command: "boost_component_unit"
  - file: "integration.cpp"
    description: "Redex mapped-file and generic filtering-stream flow (5 assertions)"
    command: "boost_redex_iostreams"
  - file: "atomic.cpp"
    description: "Isolated Boost.Atomic link contract (2 assertions)"
    command: "boost_atomic_contract"
  - file: "date_time.cpp"
    description: "Isolated Boost.DateTime compiled dependency contract (2 assertions)"
    command: "boost_date_time_contract"
  - file: "ohos_portability.cpp"
    description: "Filesystem fallback and interruption-free Boost.Thread flow (3 assertions)"
    command: "boost_ohos_portability"

test_package_test_count: 5
assertion_count: 15
