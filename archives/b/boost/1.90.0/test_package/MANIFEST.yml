# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: boost/1.90.0
homepage: "https://www.boost.org/"

# 上游测试命令: b2 构建系统在 OHOS 上不兼容，无法运行上游测试
upstream_check_command: ""

# 头文件库，无需编译和运行测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — 头文件库无编译测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 Boost 头文件可正确包含"
    command: ""

# 头文件库，无断言数
assertion_count: 0
