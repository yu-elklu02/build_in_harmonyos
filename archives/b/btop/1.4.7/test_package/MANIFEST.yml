package: btop/1.4.7
homepage: "https://github.com/aristocratos/btop"

upstream_test_in_build: true
upstream_check_command: "build() compiles and runs upstream tests/cpu_names.cpp and tests/tools.cpp"
upstream_tests:
  - file: tests/cpu_names.cpp
    id: cpu_names.amd
    description: "Verify AMD CPU model name trimming."
  - file: tests/cpu_names.cpp
    id: cpu_names.intel
    description: "Verify Intel CPU model name trimming."
  - file: tests/tools.cpp
    id: tools.string_split
    description: "Verify Tools::ssplit string splitting behavior."

test_package_tests:
  - file: test_btop.sh
    id: A1
    description: "Verify btop --version reports 1.4.7."
  - file: test_btop.sh
    id: A2
    description: "Verify btop --help prints usage/options text."
  - file: test_btop.sh
    id: A3
    description: "Verify btop --default-config emits the default shown_boxes setting."

test_package_test_count: 3
assertion_count: 3
status: passed
hongmeng_validation:
  command: "conan create archives/b/btop/1.4.7 --profile=ohos-aarch64 --build=missing"
  result: passed
  upstream_tests:
    passed: 3
    failed: 0
  assertions:
    passed: 3
    failed: 0
