software: btop
version: "1.4.7"
status: passed
build_date: "2026-08-17"

source:
  url: "https://github.com/aristocratos/btop/archive/refs/tags/v1.4.7.tar.gz"
  sha256: "933de2e4d1b2211a638be463eb6e8616891bfba73aef5d38060bd8319baeefc6"

build:
  system: make
  options:
    - "PLATFORM=linux"
    - "GPU_SUPPORT=false"
    - "INTEL_GPU_SUPPORT=false"
    - "THREADS=1"
  dependencies: []

upstream_tests:
  command: "build() compiles and runs tests/cpu_names.cpp and tests/tools.cpp with a lightweight gtest-compatible harness"
  cases: 3
  passed: 3
  failed: 0
  status: passed
  note: "Upstream CMake/CTest tests use GoogleTest via FetchContent; recipe executes the same upstream TEST cases without network-dependent FetchContent."

test_package:
  command: "test_package/test_btop.sh"
  assertions: 3
  status: passed

patches_applied:
  - "OHOS: build via Makefile with PLATFORM=linux and GPU support disabled to avoid DRM/ROCm/NVIDIA runtime stacks."
  - "OHOS: provide a small std::expected fallback for libc++ versions without C++23 <expected>."
  - "OHOS: replace std::ranges::to usage with explicit vector construction to reduce libc++ C++23 ranges requirements."
  - "OHOS: provide std::ranges algorithm shims for clang-15 libc++."
  - "OHOS: avoid pthread_cancel and pthread_timedjoin_np on OHOS."

knowledge_gained:
  - "btop 1.4.7 is a C++23 terminal monitor and uses Linux /proc and /sys collectors."
  - "CMake hard-checks newer C++23 library features; the recipe uses the upstream Makefile route and patches the minimum C++23 library surface used by the CLI path."

verification:
  command: "conan create archives/b/btop/1.4.7 --profile=ohos-aarch64 --build=missing"
  result: passed
  upstream_tests:
    passed: 3
    failed: 0
  test_package:
    passed: 3
    failed: 0
