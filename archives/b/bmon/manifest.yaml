software: bmon
display: "bmon"
description: "可移植的网络带宽监控与速率估算命令行工具"
category: networking
homepage: "https://github.com/tgraf/bmon"
license: "MIT AND BSD-2-Clause"
build_system: autotools

ohos_adaptation:
  key_points:
    - "libconfuse 未发布到制品仓，以源码静态编入（build() 内直接编译 confuse.c + lexer.c）"
    - "libnl/netlink 目标平台不可用，移除 netlink 输入模块，默认改用 /proc/net/dev（in_proc）"
    - "ncurses 目标平台不可用，禁用 curses UI，保留 ascii/format 文本输出模块"
    - "config.sub 补丁识别 aarch64-*-linux-ohos 三元组"

versions:
  "4.0":
    status: built
    build_date: "2026-07-13"
