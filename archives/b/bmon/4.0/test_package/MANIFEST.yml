# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bmon/4.0
homepage: "https://github.com/tgraf/bmon"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# bmon 上游 autotools 工程未提供测试套件 (Makefile.am 无 check 目标, 无 tests/ 目录)。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# bmon 上游无独立测试用例。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke + 功能测试: bmon --version 校验; 经 in_proc 输入模块从 /proc/net/dev 真实读取网络接口 RX/TX 统计"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
