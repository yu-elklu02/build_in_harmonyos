software: bmon
version: "4.0"

# published | built | failed | archived
status: built
build_date: "2026-07-13"

source:
  url: "https://github.com/tgraf/bmon/releases/download/v4.0/bmon-4.0.tar.gz"
  sha256: "02fdc312b8ceeb5786b28bf905f54328f414040ff42f45c83007f24b76cc9f7a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-curses"
  # Vendored build dependency (compiled statically, not an artifact-repo package):
  vendored:
    - name: libconfuse
      version: "3.3"
      url: "https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.xz"
      sha256: "1dd50a0320e135a55025b23fcdbb3f0a81913b6d0b0a9df8cc2fdf3b3dc67010"

type: tool
dependencies: []

patches:
  - "patches/0001-ohos-no-curses-no-netlink.patch"
  - "patches/0002-config-sub-ohos.patch"

artifacts:
  - bin/bmon

notes: |
  bmon 是网络带宽监控命令行工具。HarmonyOS PC 适配去除了 ncurses UI 与 libnl/netlink
  依赖，改用 /proc/net/dev（in_proc 输入模块）读取接口统计；硬依赖 libconfuse 以源码
  形式静态编入。产物 bin/bmon 仅动态依赖 libc.so。
