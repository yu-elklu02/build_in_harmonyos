sources:
  url: "https://github.com/tgraf/bmon/releases/download/v4.0/bmon-4.0.tar.gz"
  sha256: "02fdc312b8ceeb5786b28bf905f54328f414040ff42f45c83007f24b76cc9f7a"

# libconfuse is a hard build dependency of bmon and is not published to the
# artifact repository, so its source is fetched here and compiled statically
# into bmon (see conanfile.py build()).
confuse:
  url: "https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.xz"
  sha256: "1dd50a0320e135a55025b23fcdbb3f0a81913b6d0b0a9df8cc2fdf3b3dc67010"

patches:
  - patch_file: "patches/0001-ohos-no-curses-no-netlink.patch"
    patch_description: "Build without ncurses UI and without libnl/netlink on OHOS; use /proc/net/dev (in_proc) as default input"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Teach config.sub to recognize the aarch64-*-linux-ohos triplet"
    patch_type: "portability"
