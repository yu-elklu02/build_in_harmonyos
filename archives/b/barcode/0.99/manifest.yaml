package: "barcode"
version: "0.99"
status: "passed"
build_system: "autotools"
homepage: "https://www.gnu.org/software/barcode/"
license: "GPL-3.0-or-later"

source:
  url: "https://ftp.gnu.org/gnu/barcode/barcode-0.99.tar.xz"
  sha256: "e87ecf6421573e17ce35879db8328617795258650831affd025fba42f155cdc6"
  tar_format: "tar.xz"

build:
  system: "autotools"
  configure_options:
    - "--build=aarch64-unknown-linux-gnu (OHOS only)"
    - "--host=aarch64-unknown-linux-gnu (OHOS only)"
  dependencies: []

patches_applied:
  - "patches/0001-configure-umask.patch"
  - "patches/0002-makefile-sample-gnu.patch"

tests:
  upstream:
    command: "No automated test target is shipped by the barcode-0.99 release archive"
    cases: 0
    passed: 0
    note: "The upstream Makefile defines build targets but no TESTS/check_PROGRAMS test suite."
  test_package:
    command: "barcode -e code128 -o barcode.svg 1234567890; verify SVG output"
    cases: 1
    passed: 1
    note: "Real-device test generated Code 128 SVG successfully and verified SVG markup plus the encoded payload."

platform:
  validated_architecture: "OHOS/armv8"
  limitations:
    - "The upstream release archive has no automated test suite; functional coverage is provided by test_package."
