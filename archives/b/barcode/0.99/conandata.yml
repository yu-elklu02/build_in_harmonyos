sources:
  "0.99":
    url: "https://ftp.gnu.org/gnu/barcode/barcode-0.99.tar.xz"
    sha256: "e87ecf6421573e17ce35879db8328617795258650831affd025fba42f155cdc6"

patches:
  "0.99":
    - patch_file: patches/0001-configure-umask.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Change umask 077 to umask 000 in configure's tmp directory creation.
        HMDFS creates tmp dirs with a different owner; umask 077 makes them
        unwritable for the build user, causing 'Permission denied' on
        config.status subs1.awk.
    - patch_file: patches/0002-makefile-sample-gnu.patch
      patch_type: bugfix
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        sample_LDADD omits lib/libgnu.la. libbarcode references rpl_calloc
        (gnulib calloc replacement) which lives in libgnu, so linking sample
        fails with 'undefined symbol: rpl_calloc'.
