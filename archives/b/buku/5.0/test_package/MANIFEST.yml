# test_package/MANIFEST.yml — buku 5.0

package: buku/5.0
homepage: "https://github.com/jarun/buku"

# 上游测试命令: pytest
upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/"

# 上游测试用例 (9 个测试文件，共 ~175 个测试函数、~245 个断言)
upstream_tests:
  - file: tests/test_buku.py
    source: buku-5.0/tests/test_buku.py
    description: "buku 核心功能测试（45 个测试函数）"
    command: "python3 -m pytest tests/test_buku.py"
  - file: tests/test_cli.py
    source: buku-5.0/tests/test_cli.py
    description: "CLI 接口测试（10 个测试函数）"
    command: "python3 -m pytest tests/test_cli.py"
  - file: tests/test_bukuDb.py
    source: buku-5.0/tests/test_bukuDb.py
    description: "数据库功能测试（67 个测试函数）"
    command: "python3 -m pytest tests/test_bukuDb.py"
  - file: tests/test_BukuCrypt.py
    source: buku-5.0/tests/test_BukuCrypt.py
    description: "加密功能测试（2 个测试函数）"
    command: "python3 -m pytest tests/test_BukuCrypt.py"
  - file: tests/test_import_firefox_json.py
    source: buku-5.0/tests/test_import_firefox_json.py
    description: "Firefox 导入测试（13 个测试函数）"
    command: "python3 -m pytest tests/test_import_firefox_json.py"
  - file: tests/test_setup.py
    source: buku-5.0/tests/test_setup.py
    description: "安装测试（2 个测试函数）"
    command: "python3 -m pytest tests/test_setup.py"
  - file: tests/test_ExtendedArgumentParser.py
    source: buku-5.0/tests/test_ExtendedArgumentParser.py
    description: "参数解析扩展测试（3 个测试函数）"
    command: "python3 -m pytest tests/test_ExtendedArgumentParser.py"
  - file: tests/test_server.py
    source: buku-5.0/tests/test_server.py
    description: "HTTP 服务器测试（14 个测试函数，需网络环境）"
    command: "python3 -m pytest tests/test_server.py"
  - file: tests/test_views.py
    source: buku-5.0/tests/test_views.py
    description: "视图功能测试（19 个测试函数）"
    command: "python3 -m pytest tests/test_views.py"

# test_package 中自带的测试
test_package_tests:
  - file: test_buku.py
    description: "验证 buku 二进制可执行"
    command: "python3 test_buku.py"

assertion_count: ~245
