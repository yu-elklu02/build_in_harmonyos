package: "blaze/3.8.2"
homepage: "https://bitbucket.org/blaze-lib/blaze"

upstream_check_command: "Compile and run blazetest/src/mathtest/vectors/dynamicvector/ClassTest.cpp"
upstream_test_in_build: true
upstream_test_command: "<profile-cxx> -std=c++14 -I<source-root> -I<source-root>/blazetest ClassTest.cpp && ./blaze-dynamicvector-test"

upstream_tests:
  - file: blazetest/src/mathtest/vectors/dynamicvector/ClassTest.cpp
    source: blaze-3.8.2/blazetest/src/mathtest/vectors/dynamicvector/ClassTest.cpp
    description: "Upstream DynamicVector class test"
    command: "./blaze-dynamicvector-test"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer matrix multiplication using the installed Blaze headers and CMake target"
    command: "ctest --output-on-failure"

assertion_count: 2
