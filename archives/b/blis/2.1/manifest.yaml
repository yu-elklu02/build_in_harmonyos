software: blis
version: "2.1"
build_system: makefile
status: published
build_date: "2026-07-27"
source:
  url: "https://github.com/flame/blis/archive/refs/tags/2.1.tar.gz"
  sha256: "901752ec596cd63421ea45a6a06a9f34491cf5ae01cea412ece05f97a2690a96"
  tar_format: tar.gz
build:
  system: makefile
  configuration: "arm64, static, single-threaded, CBLAS enabled"
  configure_options:
    - "--disable-shared"
    - "--enable-cblas"
    - "--disable-threading"
    - "arm64"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "BLIS arm64 uses portable Armv8-A kernels and requires no third-party BLAS dependency."
  - "make check runs the upstream BLIS/BLAS numerical testsuite."
