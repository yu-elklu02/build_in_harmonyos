package: blis/2.1
homepage: "https://github.com/flame/blis"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests:
  - file: testsuite/check-blistest.sh
    source: "BLIS 2.1 testsuite"
    description: "Upstream BLIS and BLAS numerical testsuite"
    command: "make check -j1"

test_package_tests:
  - file: test.c
    description: "Call cblas_dgemm and verify all four entries of a 2x2 matrix product"
    command: "./test_blis"

assertion_count: 4
