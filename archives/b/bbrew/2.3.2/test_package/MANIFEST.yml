# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# bbrew 是 Go 命令行应用（Bold Brew TUI for Homebrew）。
# 上游通过 `go test ./...` 运行单元测试（internal/models、internal/services 包，
# 约 30+ 个断言），测试代码大多为 hermetic 纯逻辑测试（构造结构体断言、纯文本
# 解析、t.TempDir 临时文件、exec echo 等），不依赖 Homebrew/TTY。
# 本机开发环境（HMDFS）无法执行 static ET_EXEC 的 Go 工具链（低 PHDR vaddr 被
# 内核拒绝，官方/Alpine 工具链均验证 exit 126），因此 `go test ./...` 在
# conanfile.py build() 中集成到 CI 阶段：当 runner 具备可用 Go 工具链时真实
# 执行 `go test ./...` 并把结果写入 go-test-report.txt 与构建日志，供 CI 日志
# 回填真实通过率。test_package 采用 L2 冒烟测试：运行 `bbrew --version` 验证
# 二进制可用性。

package: bbrew/2.3.2
homepage: "https://github.com/Valkyrie00/bold-brew"

# 上游测试命令分析
# R5: 上游测试在 CI 构建阶段（conanfile.py build()，go 可用时）真实运行
upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序（Go 单元测试，CI 阶段在具备 Go 工具链的 runner 上执行）
upstream_tests:
  - file: internal/models/package_test.go
    source: bbrew-2.3.2/internal/models/package_test.go
    description: "Package 结构体转换与 Label 逻辑单元测试（hermetic，纯逻辑）"
    command: "go test ./internal/models/"
  - file: internal/services/brewfile_test.go
    source: bbrew-2.3.2/internal/services/brewfile_test.go
    description: "Brewfile 解析（extractQuotedValue/parseBrewfileWithTaps）单元测试（hermetic）"
    command: "go test ./internal/services/"

# test_package 中自带的测试（消费者视角验证）
# R34: 调用被测包的实际二进制（bbrew --version），非空壳 stub
test_package_tests:
  - file: conanfile.py
    description: "运行 bbrew --version，验证二进制可执行且版本号正确"
    command: "bbrew --version"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
