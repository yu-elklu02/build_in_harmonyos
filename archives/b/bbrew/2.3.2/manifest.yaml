# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.2"

# 软件名
software: "bbrew"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-01"
build_system: "go"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Valkyrie00/bold-brew/archive/refs/tags/v2.3.2.tar.gz"

  # 源码校验和
  sha256: "2e22f351e9726128746a3f2f8591e9d1a2f525cbe1aca6b0af6a20f6f909faec"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | go
  system: go

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "bbrew 是 Go 应用，HMDFS 无法执行 static ET_EXEC 的 Go 工具链"
  - "Go -buildmode=pie 生成 PIE (ET_DYN) 二进制，HMDFS 可执行"
  - "本机无 Go 工具链，需依赖 CI runner 交叉编译"

# 平台限制说明（R40 深度适配验证）
platform_limitations:
  - "HMDFS 仅执行 PIE (ET_DYN) 二进制，Go 默认 static ET_EXEC 被拒"
  - "本机无 Go 工具链，无法本地 go build"
  - "GitHub 镜像 ghfast.top 网络超时，conan create 下载源码受限"
  - "W3 本地 CI 模拟受上述平台限制阻塞，需依赖 CI runner 验证"
