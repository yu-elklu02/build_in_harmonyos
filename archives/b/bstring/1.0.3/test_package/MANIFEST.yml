# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bstring/1.0.3
homepage: https://github.com/msteinert/bstring

# bstring 单元测试依赖 check 库，平台未安装，通过 test_package 消费者测试完成验证
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bstring.c
    description: "bstring API 验证: bfromcstr 创建 + bdata 内容 + blength 长度 + bstrcpy 复制 + bdestroy 释放"
    command: "./test_bstring"

# 测试断言总数
assertion_count: 5
