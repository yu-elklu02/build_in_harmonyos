# conandata.yml — bowtie2 2.5.5
# Official source: GitHub archive of the v2.5.5 tag (GPL-3.0).
# The archive is gzip+tar; strip_root removes the top-level
# bowtie2-2.5.5/ directory created by GitHub.
#
# The simde submodule (third_party/simde) is required on aarch64 because
# sse_wrap.h unconditionally #includes "simde/x86/sse2.h" when
# __aarch64__ is defined.  GitHub archive tarballs do not include
# submodule contents, so simde is declared as an additional source and
# placed into third_party/simde/ by source().

sources:
  url: "https://github.com/BenLangmead/bowtie2/archive/refs/tags/v2.5.5.tar.gz"
  sha256: "e38d1833ec235ca27fa57589d32d897c9addf87085b7cb7bc978662954662da2"

simde:
  url: "https://github.com/simd-everywhere/simde-no-tests/archive/f6a0b3b2882226e98496be9147265e05c7127c1f.tar.gz"
  sha256: "b354eb97cbb74d9bf246db2f87f5c07a5bd64d696f6aacd0bbcca19054a8567b"
