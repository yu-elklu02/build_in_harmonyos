# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: bowtie2/2.5.5
homepage: "https://bowtie-bio.sourceforge.net/bowtie2/"

# 上游测试命令
upstream_check_command: "make simple-test"

# 上游测试为 Perl/Shell 脚本（scripts/test/simple_tests.sh），需要 Perl + CPAN 模块
# 未集成进 conanfile.py build() 的原因：交叉编译环境（aarch64-OHOS）无法在 x86_64 CI worker 上运行 aarch64 二进制
upstream_test_in_build: false
upstream_test_command: "make simple-test"

# 上游实际运行的测试程序
upstream_tests:
  - file: "scripts/test/simple_tests.sh"
    source: "bowtie2-2.5.5/scripts/test/simple_tests.sh"
    description: "上游回归测试脚本：对示例索引执行比对并验证输出，依赖 Perl + CPAN 模块（File::Which, Math::Random, Clone, Test::Deep, Sys::Info）"
    command: "make simple-test"

# test_package 中自带的测试（消费者视角，直接驱动 ELF 二进制）
test_package_tests:
  - file: "test_bowtie2.sh"
    description: "校验 bowtie2-align-s / bowtie2-build-s / bowtie2-inspect-s 的 --version 输出 2.5.5；用 bowtie2-build-s 对合成 FASTA 构建小索引并验证 .bt2 / .rev.bt2 文件生成"
    command: "bash test_bowtie2.sh"

# 测试断言总数
assertion_count: 5
