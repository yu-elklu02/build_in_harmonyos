software: bowtie2
version: "2.5.5"
status: built
build_date: "2026-07-17"
build_system: makefile

source:
  url: "https://github.com/BenLangmead/bowtie2/archive/refs/tags/v2.5.5.tar.gz"
  sha256: "e38d1833ec235ca27fa57589d32d897c9addf87085b7cb7bc978662954662da2"
  tar_format: tar.gz
  submodule_urls:
    - "https://github.com/simd-everywhere/simde-no-tests/archive/f6a0b3b2882226e98496be9147265e05c7127c1f.tar.gz"

build:
  system: makefile
  configure_options:
    - "SHELL=/data/service/hnp/bin/bash"
    - "CXX=clang++"
    - "CC=clang"
    - "CPPFLAGS=-Ithird_party"
    - "CXXFLAGS=-stdlib=libc++"
    - "LDFLAGS=-stdlib=libc++"
  dependencies:
    - zlib/1.3.1
    - simde/submodule
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "bowtie2 为纯 Makefile 项目（无 configure），通过 SHELL/CC/CXX/CPPFLAGS/CXXFLAGS/LDFLAGS 环境变量注入编译配置"
  - "aarch64 上 sse_wrap.h 无条件 #include 'simde/x86/sse2.h'，需在 source() 中从 simde-no-tests 仓库填充 third_party/simde 目录（GitHub tarball 不含 submodule 内容）"
  - "OHOS 无 /bin/bash，Makefile 内 shell 命令必须通过 SHELL=/data/service/hnp/bin/bash 指定"
  - "R33: 编译器路径从 Conan conf tools.build:compiler_executables 派生，不硬编码 shell 环境变量"
  - "R26: -stdlib=libc++ 必须同时出现在 CXXFLAGS（编译）和 LDFLAGS（链接），因 Makefile 链接行不传递 CXXFLAGS"
  - "zlib 依赖通过 self.requires('zlib/1.3.1') 声明，从 cpp_info 提取路径并通过 CPPFLAGS/LDFLAGS 传给 make"
  - "上游 make simple-test 依赖 Perl + CPAN 模块且需运行 aarch64 二进制，已加入 ci/config/no_official_test.txt 白名单跳过 L1c"
  - "Makefile 在 aarch64 自动设置 BITS=64、SSE_FLAG 为空、-fopenmp-simd、POPCNT_CAPABILITY=0、CPPFLAGS += -Ithird_party"
