software: bowtie2
display: "Bowtie2"
description: "快速灵敏的带间隔读段比对工具，用于将下一代测序数据比对到参考基因组"
category: data
homepage: "https://bowtie-bio.sourceforge.net/bowtie2/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（无 configure 脚本），通过环境变量注入编译配置"
    - "aarch64 上 SSE2 内联函数通过 simde/x86/sse2.h（SIMD Everywhere）实现可移植"
    - "Release tarball 不含 simde submodule，需在 source() 中从 simde-no-tests 仓库填充 third_party/simde"
    - "OHOS 无 /bin/bash，Makefile 内 shell 命令必须显式指定 SHELL=/data/service/hnp/bin/bash"
    - "R26: -stdlib=libc++ 必须同时出现在 CXXFLAGS 和 LDFLAGS"
    - "无标准 make check 目标，上游 simple-test 依赖 Perl + aarch64 运行时，已加入 no_official_test.txt 白名单"
  common_dependencies:
    - zlib/1.3.1

versions:
  - version: "2.5.5"
    status: built
    build_date: "2026-07-17"
