# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: brainfuck/2.7.3
homepage: "https://github.com/fabianishere/brainfuck"

# 上游测试命令 (CMake 工程，测试通过 CTest 注册)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/smoke.c
    source: brainfuck-2.7.3/tests/smoke.c
    description: "Smoke test: 执行 Hello World brainfuck 程序（解析+执行 API）"
    command: "./test-smoke"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 通过 libbrainfuck C API 执行 Hello World 程序并断言输出"
    command: "./test_brainfuck"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
