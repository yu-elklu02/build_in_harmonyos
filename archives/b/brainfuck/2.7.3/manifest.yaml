# 版本级 manifest — brainfuck 2.7.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7.3"

# 软件名
software: "brainfuck"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-11"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (R39: 官方源 — GitHub release tag 2.7.3;
  # waterlan.home.xs4all.nl 原官方源已失效 404)
  url: "https://github.com/fabianishere/brainfuck/archive/refs/tags/2.7.3.tar.gz"

  # 源码校验和
  sha256: "d99be61271b4c27e26a8154151574aa3750133a0bedd07124b92ccca1e03b5a7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DENABLE_EDITLINE=OFF"
  - "-DENABLE_CLI=ON"
  - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "brainfuck 是 CMake 工程（init-build 误判为 autotools），配方须用 CMakeToolchain"
- "系统无 editline 库，需 -DENABLE_EDITLINE=OFF"
- "Findgetopt.cmake 找不到系统 getopt.h 时会回退到 deps/getopt（Windows wingetopt shim，依赖 windows.h 会编译失败）；必须显式 -DGETOPT_INCLUDE_DIR=OHOS sysroot/usr/include"
