software: bwa
display: "bwa"
description: "Burrow-Wheeler Aligner for pairwise alignment of DNA"
category: bioinformatics
homepage: "https://github.com/lh3/bwa"
license: "GPL-3.0-or-later AND MIT"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 默认 CC=gcc/AR=ar，需要通过 make 命令行覆盖为 OHOS toolchain"
    - "链接 zlib/1.3.1、pthread、libm"
    - "无上游 make check，使用 test_package 做 index/aln/samse 真实功能验证"
  common_dependencies:
    - zlib/1.3.1

versions:
  "0.7.19":
    status: built
    build_date: "2026-07-16"
