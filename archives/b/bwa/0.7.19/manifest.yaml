software: bwa
version: "0.7.19"
status: built
build_system: makefile
build_date: "2026-07-16"

source:
  url: "https://github.com/lh3/bwa/archive/refs/tags/v0.7.19.tar.gz"
  sha256: "cdff5db67652c5b805a3df08c4e813a822c65791913eccfb3cf7d528588f37bc"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make CC=clang AR=ar RANLIB=ranlib CPPFLAGS=-I<zlib_include> LDFLAGS=-L<zlib_lib> bwa"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: ""

patches_applied: []

test_results:
  type: test_package
  passed: 5
  failed: 0
  note: |
    test_package/test_bwa.sh runs bwa usage smoke test, builds a tiny FASTA
    index, aligns a FASTQ read with bwa aln, converts with bwa samse, and
    asserts the SAM record maps r1 to ref with a 24M CIGAR.

knowledge_gained:
  - "bwa 0.7.19 uses a plain Makefile with hardcoded CC=gcc and AR=ar; pass toolchain variables on the make command line."
  - "The executable links zlib, pthread and libm; zlib is provided by Conan as zlib/1.3.1."
  - "Upstream includes neon_sse.h, so the ARM NEON code path does not require an external sse2neon package for this release."
  - "There is no upstream make check target; functional verification is done through a real index/aln/samse round trip in test_package."
