# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: bdw-gc/8.2.6
homepage: "https://github.com/bdwgc/bdwgc"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() integrates upstream test suite
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs (16 tests from make check)
upstream_tests:
  - file: cord/tests/cordtest.c
    source: bdw-gc-8.2.6/cord/tests/cordtest.c
    description: "CORD string library test"
    command: "./cordtest"
  - file: tests/gctest.c
    source: bdw-gc-8.2.6/tests/gctest.c
    description: "Main GC functionality test"
    command: "./gctest"
  - file: tests/leaktest.c
    source: bdw-gc-8.2.6/tests/leaktest.c
    description: "Leak detection test"
    command: "./leaktest"
  - file: tests/middletest.c
    source: bdw-gc-8.2.6/tests/middletest.c
    description: "Middle-size allocation test"
    command: "./middletest"
  - file: tests/smashtest.c
    source: bdw-gc-8.2.6/tests/smashtest.c
    description: "Heap smash test"
    command: "./smashtest"
  - file: tests/hugetest.c
    source: bdw-gc-8.2.6/tests/hugetest.c
    description: "Huge allocation test"
    command: "./hugetest"
  - file: tests/realloc_test.c
    source: bdw-gc-8.2.6/tests/realloc_test.c
    description: "GC_REALLOC test"
    command: "./realloc_test"
  - file: tests/staticrootstest.c
    source: bdw-gc-8.2.6/tests/staticrootstest.c
    description: "Static roots test"
    command: "./staticrootstest"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: GC_INIT, GC_MALLOC, GC_gcollect"
    command: "./test_bdw-gc"

# Approximate assertion count
assertion_count: 16
