software: bashunit
display: "bashunit"
description: "Fast and modern testing framework for Bash"
category: build-tool
homepage: "https://bashunit.com/"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "The official release is a single executable Bash script and must not be extracted as an archive."
    - "The Conan package installs the verified script under bin/ and tests the packaged command directly."
  common_dependencies:
    - bash

versions:
  "0.40.0":
    status: built
    build_date: "2026-07-13"
    conan_ref: "bashunit/0.40.0"
