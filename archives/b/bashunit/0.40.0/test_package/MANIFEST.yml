package: bashunit/0.40.0
homepage: "https://bashunit.com/"

upstream_check_command: "bash -n bashunit && ./bashunit --version"
upstream_test_in_build: true
upstream_test_command: "bash -n bashunit"

upstream_tests:
  - file: bashunit
    source: "Official bashunit 0.40.0 single-file release asset"
    description: "Validate the official Bash script syntax"
    command: "bash -n bashunit"

test_package_tests:
  - file: test.sh
    description: "Execute the packaged bashunit CLI against a real passing test and assertion"
    command: "bashunit test.sh --no-color"
  - file: conanfile.py
    description: "Verify the packaged command reports version 0.40.0"
    command: "bashunit --version"

assertion_count: 2
