# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: brew-cask-completion/2.1
homepage: "https://github.com/xyb/homebrew-cask-completion"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "N/A (no test suite in upstream)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify bash/fish completion scripts exist, non-empty, and bash syntax valid"
    command: "bash test.sh"
  - file: conanfile.py (inline verification)
    description: "Consumer test: verify installed completion scripts contain expected content (brew-cask + complete)"
    command: "conan test (file existence + content verification)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
