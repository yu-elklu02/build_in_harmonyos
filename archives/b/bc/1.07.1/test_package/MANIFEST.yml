# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: bc/1.07.1
homepage: "https://ftp.gnu.org/gnu/bc/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests
upstream_tests:
  - file: Test/bcos.b
    source: bc-1.07.1/Test/bcos.b
    description: "bc test suite: math functions"
    command: "./bc Test/bcos.b"
  - file: Test/timetest
    source: bc-1.07.1/Test/timetest
    description: "bc time function test"
    command: "./bc Test/timetest"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Run bc and dc binaries to verify installation"
    command: "conan test test_package bc/1.07.1"

# Approximate assertion count
assertion_count: 3
