# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: blind/1.1
homepage: "https://tools.suckless.org/blind/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: N/A
    source: blind-1.1/
    description: "blind has no built-in test suite; upstream uses manual pipeline tests"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: verify blind-arithm binary exists and runs"
    command: "blind-arithm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
