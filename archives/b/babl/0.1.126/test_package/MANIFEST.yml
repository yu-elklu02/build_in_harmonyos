# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: babl/0.1.126
homepage: "https://gegl.org/babl/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/babl-fish-path.c
    source: babl-0.1.126/tests/babl-fish-path.c
    description: "Test fish path conversion"
    command: "meson test"
  - file: tests/babl-fish-reference.c
    source: babl-0.1.126/tests/babl-fish-reference.c
    description: "Test reference fish conversion"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify babl_init, babl_format, babl_format_get_bytes_per_pixel for R'G'B'A u8 format"
    command: "./test_babl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
