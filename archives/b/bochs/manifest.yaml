software: bochs
display: "Bochs"
description: "Portable x86 and x86-64 system emulator"
category: emulation
homepage: "https://bochs.sourceforge.io/"
license: "LGPL-2.1-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Add config.guess and config.sub support for the linux-ohos triplet"
    - "Use libgen.h for the POSIX basename declaration on OHOS"
    - "Build a dependency-free headless core because SDL, ncurses and readline packages are unavailable"
    - "Create generated VPATH directories omitted by the Bochs 3.0 makefiles"
    - "Use a relative configure path and narrow MSYS argument exclusions on Windows build hosts"

versions:
  "3.0":
    status: built
    build_date: "2026-07-22"
