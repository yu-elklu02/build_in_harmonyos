# test_package/MANIFEST.yml
package: bochs/3.0
homepage: "https://bochs.sourceforge.io/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: unit_test.sh
    description: "Validate bximage option parsing, flat-image creation, and image metadata"
    command: "bash unit_test.sh"
  - file: test.sh
    description: "Run the headless emulator through BIOS and assert the no-boot-device panic"
    command: "bash test.sh"

assertion_count: 16
