  source_orig_dir: ".tmp/bochs-refresh-orig/Bochs-REL_3_0_FINAL/bochs"
  source_work_dir: ".tmp/bochs-refresh-work/Bochs-REL_3_0_FINAL/bochs"
  source_orig_hash: a0ac6cc445fb540c
  source_work_hash: 858c3f266bb33bbe
