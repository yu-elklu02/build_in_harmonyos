    type: platform_fix
    platform_only: false
    guard: 'confXXXXXX temporary directory only'
    description: "Unconditionally relax only the two CI-proven HMDFS-incompatible Autoconf temporary-directory masks"
  - file: 0002-gui-keymap.cc.patch
    type: platform_fix
    platform_only: true
    guard: 'none'
    description: "Include libgen.h for the POSIX basename declaration"
  - file: 0003-config.guess.patch
    type: platform_detect
    platform_only: true
    guard: 'HarmonyOS'
    description: "Print the native linux-ohos triplet and exit"
  - file: 0004-config.sub.patch
    type: platform_detect
