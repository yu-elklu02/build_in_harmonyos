software: bochs
version: "3.0"

status: built
build_date: "2026-07-22"

source:
  url: "https://github.com/bochs-emu/Bochs/archive/refs/tags/REL_3_0_FINAL.tar.gz"
  sha256: "7b4bd5595b58c3a7295aa3a571ee0119efb1f1e895c84a392f9f0a0bfb8f04c5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-docbook"
    - "--disable-plugins"
    - "--disable-readline"
    - "--enable-debugger"
    - "--enable-x86-64"
    - "--with-nogui"
    - "--without-sdl"
    - "--without-sdl2"
    - "--without-term"
    - "--without-x"

type: tool
dependencies: []

patches:
  - "patches/0001-configure.patch"
  - "patches/0002-gui-keymap.cc.patch"
  - "patches/0003-config.guess.patch"
  - "patches/0004-config.sub.patch"

artifacts:
  - bin/bochs
  - bin/bximage
  - share/bochs

notes: |
  The HarmonyOS PC package provides the headless nogui emulator core, bximage,
  BIOS/VGA firmware and keymaps. SDL, terminal UI, readline and loadable plugins
  are disabled because those third-party runtime dependencies are not published
  in the competition artifact repository. The binaries only require
  libc++_shared.so and libc.so.

test_results:
  unit_tests_defined: 3
  functional_tests_defined: 1
  assertion_count: 16
  local_script_validation: passed
  windows_to_ohos_conan_create: passed
  current_head_target_execution: passed
  target_platform: "HarmonyOS PC 1.12.0 (AArch64)"
  target_tests_passed: 4
  target_tests_total: 4
  target_assertions_passed: 16
  target_assertions_total: 16
  note: |
    The formal Conan package passed all three bximage command-unit cases and
    the headless guest-BIOS functional case on a HarmonyOS PC target. The
    latter executed the packaged x86 BIOS and matched "No bootable device."
    in bochs.log. The cross-build test_package remains guarded by can_run;
    target execution was performed separately with the exact packaged files.

