# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bpm-tools/0.3
homepage: "https://www.pogo.org.uk/~mark/bpm-tools/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# bpm-tools 上游无 make check 目标
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件（无 make check 目标）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bpm.sh
    description: "生成合成120BPM音频，通过bpm二进制分析，验证检测结果接近120"
    command: "zsh ./test_bpm.sh"

# 测试断言总数
assertion_count: 1
