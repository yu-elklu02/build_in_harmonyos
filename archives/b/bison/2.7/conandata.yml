sources:
  url: "https://ftp.gnu.org/gnu/bison/bison-2.7.tar.gz"
  sha256: "19bbe7374fd602f7a6654c131c21a15aebdc06cc89493e8ff250cb7f9ed0a831"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "Recognize HarmonyOS aarch64 in the bundled config.guess."
  - patch_file: "patches/0002-src-scan-gram.c.patch"
    patch_description: "Fix the generated grammar scanner for the OHOS compiler."
  - patch_file: "patches/0003-src-system.h.patch"
    patch_description: "Declare gnulib multibyte helpers missing from the OHOS build."
  - patch_file: "patches/0005-configure-ohos-umask.patch"
    patch_description: "Use an OHOS-compatible umask when configure creates its temporary directory."
  - patch_file: "patches/0006-lib-math-noexcept.patch"
    patch_description: "Match OHOS libcxx bool noexcept math overloads in gnulib math.in.h."
  - patch_file: "patches/0007-location-null-file-ohos.patch"
    patch_description: "Guard Bison diagnostic location printing when an OHOS run exposes an empty location file."
  - patch_file: "patches/0008-percent-define-loc-fallback-ohos.patch"
    patch_description: "Preserve raw %define diagnostic locations as a fallback when the legacy decoder returns an empty location on OHOS."
