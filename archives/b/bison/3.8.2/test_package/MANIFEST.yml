# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: bison/3.8.2
homepage: "https://www.gnu.org/software/bison/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# bison 上游 tests/ 目录包含 29 个 .at autotest 套件，AT_SETUP 总数 298
# (actions/conflicts/input/regression 等)，依赖 autotest 框架，
# 适配后未直接运行，改用 test_package 集成测试替代。
upstream_tests:
  - file: tests/testsuite
    source: bison-3.8.2/tests/testsuite
    description: "上游 autotest 测试驱动器，聚合 29 个 .at 套件共 298 个测试组"
    command: "./testsuite"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 验证 bison 二进制可调用并生成解析器源码"
    command: "./test_bison"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
