# test_package/MANIFEST.yml
# b2sum has no formal upstream test suite (plain Makefile, no `make check`)
package: b2sum/20190724
homepage: "https://blake2.net"

# Upstream has no formal test command
upstream_check_command: "N/A (no test target in Makefile)"
upstream_test_in_build: false
upstream_test_command: "N/A"

# No upstream test programs
upstream_tests: []

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verifies b2sum binary runs and produces correct BLAKE2b/s hashes against official reference vectors"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 5
