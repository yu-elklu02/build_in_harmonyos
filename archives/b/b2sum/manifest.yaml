software: b2sum
display: "b2sum (BLAKE2 checksum utility)"
description: "BLAKE2 command-line checksum utility (BLAKE2b/s/bp/sp)"
category: utility
homepage: "https://blake2.net"
license: "CC0-1.0 OR OpenSSL OR Apache-2.0"

