version: "20200710"
software: bmake
status: built
build_date: "2026-08-01"
build_system: custom

source:
  url: "https://www.crufty.net/ftp/pub/sjg/bmake-20200710.tar.gz"
  sha256: "6538fc4319ef79d178dca76d3b869f7aa93a9bb7b510df08a7d872c01a56b76c"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--install-host-target"
    - "--with-machine=ohos"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-configure-use-writable-temp-dir.patch"
  - "0002-os-sh-respect-host-target.patch"
  - "0003-boot-strap-find-diff-in-path.patch"

knowledge_gained:
  - "Autoconf temporary directories created with umask 077 are not writable on the OHOS build filesystem."
  - "OHOS system identification contains spaces and must be overridden for bmake MACHINE and HOST_TARGET."
  - "The upstream bootstrap unit-tests require MK_AUTO_OBJ=no because OHOS does not predefine that make variable."
  - "The OHOS diff alias is resolved to its executable by searching PATH before the bootstrap test comparison step."
