package: bpytop/1.0.68
homepage: "https://github.com/aristocratos/bpytop"

upstream_check_command: "python -m pytest -q"
upstream_test_in_build: false
upstream_test_command: "python -m pytest -q"

upstream_tests:
  - file: tests/test_functions.py
    description: "5 tests for CPU metadata, topology-invariant core mapping, box rendering, human-readable values, and byte-unit conversion."
  - file: tests/test_classes.py
    description: "18 tests for themes, graphs, meters, banners, system collectors, and process/resource panels."
  - file: tests/test_title.py
    description: "4 tests for terminal-title behavior with empty, non-empty, and environment-driven values."

test_package_tests:
  - file: test_bpytop_version.py
    description: "Run bpytop --version and verify bpytop and psutil versions."
    command: "bpytop --version"
  - file: test_bpytop_version.py
    description: "Fault-inject a missing terminal-only module and verify the non-interactive version query still succeeds."
    command: "PYTHONPATH=<fault-hook> bpytop --version"
  - file: test_bpytop_version.py
    description: "Verify packaged psutil native extensions and run CPU, memory, disk, and process probes when the runtime label permits dlopen; for OHOS Conan user paths blocked by hmmac, verify ELF and code-signature integrity and report that HNP installation is required for runtime import."
    command: "python -c 'import psutil; psutil.cpu_percent(); psutil.virtual_memory(); psutil.disk_usage(\"/\"); psutil.pids()'"

assertion_count: 11
