name: bpytop
version: "1.0.68"
description: "Python terminal resource monitor"
build_system: custom
license: "Apache-2.0"
source_url: "https://github.com/aristocratos/bpytop/archive/refs/tags/v1.0.68.tar.gz"
status: built
build_date: "2026-07-15"
compiler: python
target_platform: ohos-aarch64

dependencies:
  - "python"
  - "psutil 5.9.8"

artifacts:
  - "bin/bpytop"
  - "libexec/bpytop/bpytop.py"
  - "lib/python3.12/site-packages/psutil/_psutil_linux.so"
  - "lib/python3.12/site-packages/psutil/_psutil_posix.so"
  - "share/bpytop/themes"

test:
  command: "bpytop --version"
  expected:
    - "bpytop version: 1.0.68"
    - "psutil version: 5.9.8"
