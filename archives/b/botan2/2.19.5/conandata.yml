patches:
  "2.19.5":
    - patch_file: patches/0001-tests-tmpdir.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Botan's test runner hardcodes /tmp for mkstemp, which is read-only
        on OHOS. Use $TMPDIR (falling back to '.') so the DataSinkFlush
        test can create its temporary file.
