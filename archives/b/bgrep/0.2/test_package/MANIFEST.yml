# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bgrep/0.2
homepage: "https://github.com/tmbinc/bgrep"

# 上游测试命令 (bgrep 无自带测试套件)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (bgrep 无上游测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bgrep.py
    description: "bgrep 功能验证：hex搜索、通配符搜索、stdin搜索、版本检查"
    command: "python3 test_bgrep.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
