software: bgrep

# ============================================================
# 必须字段
# ============================================================

version: "0.2"
status: built
build_system: makefile
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/tmbinc/bgrep/archive/refs/tags/bgrep-0.2.tar.gz"
  sha256: "24c02393fb436d7a2eb02c6042ec140f9502667500b13a59795388c1af91f9ba"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make CC=clang CFLAGS=-fPIC -O2"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bgrep 源码无 configure 脚本，仅极简 Makefile（all: bgrep），需识别为 makefile 构建系统"
  - "Makefile 无 install 目标，需手动 cp 到 DESTDIR staging 目录"
  - "verify_build.py 检查 manifest 顶层是否有 build_system 字段，模板默认不含需手动添加"
