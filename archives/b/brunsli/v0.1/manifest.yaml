software: brunsli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/v0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "v0.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/brunsli/archive/refs/tags/v0.1.tar.gz"

  # 源码校验和
  sha256: "62762dc740f9fcc9706449c078f12c2a366416486d2882be50a9f201f99ac0bc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - brotli/v1.0.7

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake_minimum_required(VERSION 3.1) 不兼容 cmake 4.x，需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "brotli 子模块需要手动下载（GitHub tar.gz不含子模块），需要 brotli v1.0.7 兼容版本"
  - "brotli include_directories 不传播到父scope，需手动添加 include_directories"
  - "上游 install 配置仅安装共享库和头文件，需手动复制可执行文件和静态库到 staging"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/brunsli-v0.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/brunsli-v0.1.work
  source_orig_hash: c8b645572728334d
  source_work_hash: a718b68094b7392f
  generated_at: '2026-08-05T11:35:49'
  patches_count: 1

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
