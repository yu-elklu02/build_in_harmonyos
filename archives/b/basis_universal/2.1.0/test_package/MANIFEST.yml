# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: basis_universal/2.1.0
homepage: "https://github.com/BinomialLLC/basis_universal"

# 上游测试命令 (用于 ctest -N / make test 分析)
upstream_check_command: "basisu -test -test_dir res/test_files"

# 上游测试存在性声明 (HMBS 机器证据门禁要求)
# basis_universal v2.1.0 确实存在上游测试套件 `basisu -test` (== `-test_ldr`)。
upstream_tests_exist: true
upstream_test_audit: >
  basis_universal v2.1.0 的上游测试套件是 `basisu -test` (== `-test_ldr`)，
  定义在 basisu_tool.cpp 的 test_mode_ldr() 与 g_etc1s_uastc_4x4_ldr_test_files[]。
  它对 test_files/ 下的 28 个 PNG (kodim01-24, black_1x1, white_1x1,
  wikipedia, alpha0) 各执行 ETC1S level 1 / ETC1S level 128 / UASTC LDR 4x4
  三轮编码，校验压缩后文件大小 (±4.5%) 与 PSNR (±0.3)。退出码 0=通过。
  test_package 通过调用已安装的 basisu 二进制 + 随包发布的 28 个 PNG
  fixtures 来完整执行该上游测试套件。

# conanfile.py build() 方法中是否已集成上游测试
# 上游 `basisu -test` 是编译进 basisu 二进制的测试模式，由 test_package
# 的 test() 通过调用已安装的 basisu 触发，不在主配方 build() 中运行。
upstream_test_in_build: false
upstream_test_command: "basisu -test -test_dir res/test_files"

# 上游实际运行的测试程序
# basis_universal v2.1.0 的上游测试套件是 `basisu -test` (== `-test_ldr`)，
# 定义在 basisu_tool.cpp 的 test_mode_ldr() 与 g_etc1s_uastc_4x4_ldr_test_files[]。
# 它对 test_files/ 下的 28 个 PNG (kodim01-24, black_1x1, white_1x1,
# wikipedia, alpha0) 各执行 ETC1S level 1 / ETC1S level 128 / UASTC LDR 4x4
# 三轮编码，校验压缩后文件大小 (±4.5%) 与 PSNR (±0.3)。退出码 0=通过。
upstream_tests:
  - file: basisu (-test / -test_ldr mode)
    source: basisu_tool.cpp:test_mode_ldr + g_etc1s_uastc_4x4_ldr_test_files
    description: "上游自动化 LDR ETC1S/UASTC 编码与转码测试，28 个测试用例 (28 PNG × 3 编码路径)"
    command: "basisu -test -test_dir res/test_files"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: basisu_test.cpp
    description: "消费者测试: 验证 basisu_transcoder API 链接和基本功能"
    command: "ctest (test_basisu)"
  - file: conanfile.py (inline CLI test)
    description: "消费者测试: basisu --version 验证 CLI 二进制可执行"
    command: "basisu --version"

# 上游测试用例数 (28 个 PNG 输入，每个对应一个 test_mode_ldr 迭代)
upstream_test_case_count: 28

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 28 用例 × 3 编码路径 × (size + PSNR 校验) ≈ 168
# 消费者: basisu_test.cpp 4 + CLI version 1 = 5
assertion_count: 173
