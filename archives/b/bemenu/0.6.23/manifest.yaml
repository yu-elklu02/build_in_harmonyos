  - "bemenu 使用 GNUmakefile 构建，非 autotools；需要 CC=clang"
  - "bm_init() 在无渲染器时返回 false，需将 parse_args() 移到 bm_init() 之前才能使用 --version/--help"
  - "渲染器（curses/x11/wayland）在 OHOS 上不可用，仅构建核心库和客户端"
  - "R40 适配范围：仅提供 libbemenu.so API 级链接能力，不含渲染/菜单显示功能（已知限制）"
