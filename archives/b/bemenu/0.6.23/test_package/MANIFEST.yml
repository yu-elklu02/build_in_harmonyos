# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bemenu/0.6.23
homepage: "https://github.com/Cloudef/bemenu"

# 上游测试命令 (bemenu uses GNUmakefile, has check-symbols target)
upstream_check_command: "make check-symbols"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check-symbols"

# 上游实际运行的测试程序
upstream_tests:
  - file: scripts/check-symbols.sh
    source: bemenu-0.6.23/scripts/check-symbols.sh
    description: "Symbol visibility check for libbemenu and renderers"
    command: "make check-symbols"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify bm_version() returns non-NULL and non-empty string"
    command: "./test_bemenu"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
