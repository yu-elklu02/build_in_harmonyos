# test_package/MANIFEST.yml
package: berkeley-db4/4.8.30
homepage: "https://www.oracle.com/database/berkeley-db/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Berkeley DB 4.8.30 does not provide a `make check` target.
# Functional verification is done via the test_package consumer test.
upstream_tests:
  - file: test.c
    source: berkeley-db4-4.8.30/test_package/test.c
    description: "Functional test: create DB, put key-value, get and verify"
    command: "./test_berkeley_db4"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Consumer test: exercises db_create, db->open, db->put, db->get, db->close"
    command: "./test_berkeley_db4"

# 测试断言总数
assertion_count: 4
