software: berkeley-db4
version: "4.8.30"
status: built
build_date: "2026-08-05"

source:
  url: "https://download.oracle.com/berkeley-db/db-4.8.30.tar.gz"
  sha256: "e0491a07cdb21fb9aa82773bbbedaeb7639cbd0e7f96147ab46141e0045db72a"
  tar_format: tar.gz

build_system: autotools

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-update.patch"
  - "0002-config-sub-update.patch"
  - "0003-configure-hmdfs-tmpdir.patch"

knowledge_gained:
  - "E007: 更新config.guess/config.sub为automake-1.17版本以支持HarmonyOS平台识别"
  - "berkeley-db需在build_unix目录下运行../dist/configure，configure脚本在dist/子目录"
  - "HMDFS: umask 077 + mktemp -d创建2700权限目录(setgid位阻止写入)，需去掉umask 077并使用$TMPDIR"
  - "berkeley-db没有make check目标，需用功能验证替代测试"

binaries:
  - db_archive
  - db_checkpoint
  - db_deadlock
  - db_dump
  - db_hotbackup
  - db_load
  - db_printlog
  - db_recover
  - db_sql
  - db_stat
  - db_upgrade
  - db_verify

libraries:
  - libdb-4.8.a
  - libdb-4.8.so
  - libdb.a
  - libdb.so

headers:
  - db.h
  - db_cxx.h

patch_classification:
  - file: 0001-config-guess-update.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config-sub-update.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure-hmdfs-tmpdir.patch
    type: auto
    platform_only: True
    guard: 'pending'
