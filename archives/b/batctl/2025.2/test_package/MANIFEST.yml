# test_package/MANIFEST.yml
# batctl has no upstream test suite (no 'make check' target)
# The test runs the binary directly (R34: test must depend on tested package)

package: batctl/2025.2
homepage: "https://www.open-mesh.org/"

# batctl Makefile has no 'check' target
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_batctl.sh
    description: "Run batctl -v to verify binary works"
    command: "sh test_batctl.sh"

# Approximate assertion count
assertion_count: 1
