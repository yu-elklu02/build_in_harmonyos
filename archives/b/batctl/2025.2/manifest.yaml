# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E119: OHOS linux/socket.h 与 sys/socket.h sockaddr_storage 重定义冲突，通过 _UAPI_LINUX_SOCKET_H 宏守卫修复"
  - "batctl 使用纯 Makefile 构建系统，无 configure 脚本"
  - "batctl 是命令行工具（R38: 需创建 commands.json）"
  - "libnl 以共享库(.so)形式安装，batctl 动态链接 libnl-3.so.200 和 libnl-genl-3.so.200"
  - "Makefile 默认 CC ?= gcc，OHOS 无 gcc，需从 Conan conf 获取 CC 路径传递给 make"
  - "Makefile 解析阶段运行 pkg-config 检查，build() 和 package() 都需设置 PKG_CONFIG_PATH"
  - "test_package 运行时需设置 LD_LIBRARY_PATH 以便 batctl 找到 libnl 共享库"

