software: batctl
display: "batctl"
description: "B.A.T.M.A.N. advanced control tool for batman-adv mesh networking"
category: networking
homepage: "https://www.open-mesh.org/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "E119: linux/socket.h 与 sys/socket.h sockaddr_storage 重定义冲突，通过 ohos_compat.h 头文件预定义 _UAPI_LINUX_SOCKET_H 宏修复"
    - "batctl 使用纯 Makefile（非 autotools），无 configure 脚本"
    - "libnl 作为系统依赖通过 pkg-config 发现，Conan 配方动态搜索路径并传递给 make"
    - "batctl 是命令行工具（R38: 需创建 commands.json）"
  common_dependencies:
    - libnl-3.0 (system, pkg-config, shared .so)
    - libnl-genl-3.0 (system, pkg-config, shared .so)

versions:
  "2025.2":
    status: built
    build_date: "2026-07-08"
