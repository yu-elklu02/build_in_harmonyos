package: base91/0.6.0
homepage: https://base91.sourceforge.net/

upstream_test_in_build: true
upstream_tests:
  - command: "make check"
    cases: 12
    description: "Version, random round trip, six checksum, and four decode/compare checks from test/test.sh"

test_package_tests:
  - file: test_base91.sh
    description: "Encode and decode a payload with the packaged base91 binary"
    command: "sh test_base91.sh <base91-binary>"

assertion_count: 1
