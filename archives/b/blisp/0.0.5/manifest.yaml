version: "0.0.5"
status: built
build_date: "2026-07-14"
conan_ref: "blisp/0.0.5"

source:
  url: "https://github.com/pine64/blisp/archive/refs/tags/v0.0.5.tar.gz"
  sha256: "79f87fbbb66f1d9ddf250cdc15dc16638d95e0905665003b08920a4b1fda9f96"
  tar_format: tar.gz

# blisp 依赖 git submodule vendor/libserialport（核心库串口通信）。
# GitHub tag tarball 不含子模块内容，故在 conandata.yml 中额外声明。
# argtable3 子模块仅 CLI 工具需要（BLISP_BUILD_CLI=OFF 已禁用）。
submodules:
  - name: libserialport
    url: "https://github.com/sigrokproject/libserialport/archive/6f9b03e597ea7200eb616a4e410add3dd1690cb1.tar.gz"
    sha256: "9cec0af2dddd35714cc796e018f9231c796d61a152a379862641a00e0b01f77b"
    destination: "vendor/libserialport"

build:
  system: cmake
  configure_options:
    - "BLISP_BUILD_CLI=False"
    - "COMPILE_TESTS=False"
    - "BLISP_USE_SYSTEM_LIBRARIES=False"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-fix-cmake-write-file.patch"
  - "patches/0002-fix-ohos-platform-detection.patch"

patches_description:
  "patches/0001-fix-cmake-write-file.patch": "将 CMakeLists.txt 中已弃用的 write_file() 替换为 file(WRITE)，修复新版 CMake 兼容性（write_file 自 CMake 3.0 起弃用）"
  "patches/0002-fix-ohos-platform-detection.patch": "将 elseif(UNIX ...) 改为 elseif(NOT WIN32 ...)，使 OHOS 平台走 Linux 分支，修复 SP_PRIV 未定义错误"

knowledge_gained:
  - "blisp 是 Bouffalo Lab RISC-V MCU 的 ISP 烧录工具和库，支持 BL60x/BL70x/BL808 芯片"
  - "核心库 libblisp 依赖 vendored libserialport（串口通信），GitHub tag tarball 不含子模块需额外声明"
  - "argtable3 子模块仅 CLI 工具需要，禁用 BLISP_BUILD_CLI 后无需下载"
  - "CMakeLists.txt 使用已弃用的 write_file() 写入 config.h，需补丁替换为 file(WRITE)"
  - "OHOS 平台 CMAKE_SYSTEM_NAME 非 Linux 且 UNIX=false，需将 elseif(UNIX ...) 改为 elseif(NOT WIN32 ...) 走 Linux 分支"
  - "blisp_util.h 中 crc32_calculate() 是纯计算函数，适合无硬件消费者测试"
  - "上游测试用 FetchContent 下载 GoogleTest，CI 环境可能无法访问，由 test_package 承担 L1"

ci_verification:
  verification_scope: "CI 已通过 — 真实鸿蒙 worker #007 (构建 #2451) 验证"
  environment: "Python 3.12.9, Conan 2.29.1, Clang 15 (OHOS aarch64)"
  L0: "PASS — 结构完整（conanfile/conandata/test_package/MANIFEST 齐全），无外部 Conan 依赖（L0i/R36 不适用），首次发布（L0j ok）"
  L1: "PASS — test_blisp 通过：crc32_calculate 标准向量验证 + 芯片描述符查询"
  L1e: "PASS — 破坏性反向验证（移除 lib/include 后链接失败，确认真实依赖）"
  L4: "PASS — 2 个可移植性补丁（0001: write_file→file(WRITE)；0002: UNIX→NOT WIN32 修复 OHOS 平台检测）"
  L5: "PASS — lib/ 有 libblisp.a，include/ 有 5 个公共头文件"
