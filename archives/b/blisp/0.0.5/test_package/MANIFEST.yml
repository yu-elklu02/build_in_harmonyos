# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blisp/0.0.5
homepage: "https://github.com/pine64/blisp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# blisp 上游测试 (COMPILE_TESTS) 未启用，需要 FetchContent 下载 GoogleTest，
# CI 环境可能无法访问外部仓库，故由 test_package 承担 L1 验证。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# blisp 上游测试位于 tools/blisp/src/file_parsers/dfu/tests 和 hex/tests，
# 使用 GoogleTest 框架。本配方 COMPILE_TESTS=False 未启用其构建，
# 故运行的上游测试为空（test_package/test_blisp.c 是本项目自写的消费者测试，
# 已在下方 test_package_tests 中声明，不在此重复）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_blisp.c
    description: "消费者测试: 链接 libblisp，调用 crc32_calculate 验证 CRC32 标准测试向量，查询 blisp_chip_bl60x/blisp_chip_bl70x 芯片描述符"
    command: "./test_blisp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
