# conandata.yml — blisp 0.0.5
# blisp 依赖两个 git submodule：vendor/libserialport（核心库串口通信）和
# vendor/argtable3（仅 CLI 工具需要）。GitHub tag tarball 不含子模块内容，
# 因此在此额外声明 libserialport 源码。argtable3 仅 BLISP_BUILD_CLI=ON 时
# 才需要，本配方禁用 CLI，故不声明 argtable3。

sources:
  url: "https://github.com/pine64/blisp/archive/refs/tags/v0.0.5.tar.gz"
  sha256: "79f87fbbb66f1d9ddf250cdc15dc16638d95e0905665003b08920a4b1fda9f96"

# blisp v0.0.5 的 .gitmodules 中 libserialport 子模块指向 commit
# 6f9b03e597ea7200eb616a4e410add3dd1690cb1（sigrokproject/libserialport）。
# 下载后解压到 vendor/libserialport/ 目录。
libserialport:
  url: "https://github.com/sigrokproject/libserialport/archive/6f9b03e597ea7200eb616a4e410add3dd1690cb1.tar.gz"
  sha256: "9cec0af2dddd35714cc796e018f9231c796d61a152a379862641a00e0b01f77b"

patches:
  - patch_file: "patches/0001-fix-cmake-write-file.patch"
    patch_description: "将 CMakeLists.txt 中已弃用的 write_file() 替换为 file(WRITE)，修复新版 CMake 兼容性"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-ohos-platform-detection.patch"
    patch_description: "将 elseif(UNIX ...) 改为 elseif(NOT WIN32 ...)，使 OHOS 平台（UNIX=false 但 __linux__ 宏存在）走 Linux 分支，修复 SP_PRIV 未定义错误"
    patch_type: "portability"
