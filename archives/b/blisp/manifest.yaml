software: blisp
display: "blisp"
description: "Bouffalo Labs ISP 工具和库 — 用于烧录 Bouffalo Lab RISC-V MCU（BL60x/BL70x/BL808）的开源工具"
category: embedded
homepage: "https://github.com/pine64/blisp"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "核心库依赖 vendored libserialport（串口通信），GitHub tag tarball 不含子模块需在 conandata.yml 额外声明"
    - "禁用 BLISP_BUILD_CLI（CLI 工具依赖 argtable3 子模块，tag tarball 不含）"
    - "禁用 COMPILE_TESTS（上游测试用 FetchContent 下载 GoogleTest，CI 可能无法访问）"
    - "CMakeLists.txt 使用已弃用的 write_file()，需补丁替换为 file(WRITE)"
    - "package() 中删除共享库只保留静态库 libblisp.a，避免 .so 污染"
    - "blisp_util.h 中 crc32_calculate() 是纯计算函数，适合无硬件消费者测试"
  common_dependencies: []

versions:
  "0.0.5":
    status: built
    build_date: "2026-07-14"
    conan_ref: "blisp/0.0.5"
