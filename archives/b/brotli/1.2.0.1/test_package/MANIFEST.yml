package: brotli/1.2.0.1
homepage: "https://github.com/google/brotli"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure --no-tests=error"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure --no-tests=error"

# 上游实际运行的测试程序（c/tests/，由 CTest 注册执行）
upstream_tests:
  - file: c/tests/roundtrip_test.c
    source: brotli-1.2.0/c/tests/roundtrip_test.c
    description: "压缩/解压往返：遍历 testdata/* 压缩后解压逐字节比对"
    command: "ctest --test-dir build-ohos -R roundtrip_test --output-on-failure"
    case_count: 1
  - file: c/tests/decode_test.c
    source: brotli-1.2.0/c/tests/decode_test.c
    description: "解码已压缩数据文件，验证解码正确性"
    command: "ctest --test-dir build-ohos -R decode_test --output-on-failure"
    case_count: 1
  - file: c/fuzz/compress_fuzz_test.c
    source: brotli-1.2.0/c/fuzz/compress_fuzz_test.c
    description: "压缩 fuzz 输入不崩溃（CTest 按上游注册情况执行）"
    command: "ctest --test-dir build-ohos -R compress_fuzz --output-on-failure"
    case_count: 1

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "brotlienc+brotlidec+brotlicommon 三库全链：压缩/解压逐字节往返 + 压缩率断言（非空壳）"
    command: "./test_probe"
    assertion_count: 4
