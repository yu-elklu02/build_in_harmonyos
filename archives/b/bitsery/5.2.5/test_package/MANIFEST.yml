package: bitsery/5.2.5
homepage: "https://github.com/fraillt/bitsery"

upstream_check_command: "cmake -DBITSERY_BUILD_TESTS=ON -DBITSERY_BUILD_EXAMPLES=OFF .. && ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir bitsery-build --output-on-failure -j1"

upstream_tests:
  - file: tests/*.cpp
    source: bitsery-5.2.5/tests/
    description: "Upstream GTest suite: 32 test source files discovered as 360 CTest cases."
    command: "ctest --test-dir bitsery-build --output-on-failure -j1"
    result: "360/360 passed on isolated OHOS device run codex-bitsery-bitsery-upstream-ctest-20260727-223047-56317"

test_package_tests:
  - file: test_bitsery.cpp
    description: "Consumer test: serialize and deserialize a struct with integer, string, and vector fields."
    command: "./test_bitsery"

assertion_count: 365
