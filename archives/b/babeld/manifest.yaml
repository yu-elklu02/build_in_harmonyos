software: babeld
display: "babeld"
description: "Babel routing protocol daemon"
category: network
homepage: "https://github.com/jech/babeld"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用纯 Makefile 构建，无 configure 脚本"
    - "GitHub source archive 不含 git 子模块，需在 conanfile.py source() 中单独下载 BLAKE2 和 rfc6234"
    - "HarmonyOS 的 linux/socket.h 与 sys/socket.h 冲突导致 sockaddr_storage 重定义"
    - "rfc6234 原始仓库已删除，使用 fork bitpart-xyz/rfc6234"
  common_dependencies: []

versions:
  "1.13.1":
    status: built
    build_date: "2026-07-15"
    conan_ref: "babeld/1.13.1"
