# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: babeld/1.13.1
homepage: "https://github.com/jech/babeld"

# 上游测试命令
upstream_check_command: "make check"

# babeld 没有 make check 目标
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_babeld.sh
    description: "运行 babeld -V 验证二进制可执行且返回正确版本号"
    command: "babeld -V"

# 测试断言总数
assertion_count: 2
