software: babeld
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.13.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jech/babeld/archive/refs/tags/babeld-1.13.1.tar.gz"

  # 源码校验和
  sha256: "f6918e372967ae4a20840bbbb860351c9b30e44e6c151b9cd05e8f9268f45bdc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # babeld uses plain Makefile, no configure script
  # Build command: make -j1
  # Install command: make install TARGET=$DESTDIR PREFIX=/usr/local

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # babeld is a standalone binary with no external library dependencies

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-harmoneyos-fix-sockaddr-storage-redefinition.patch"
# 修复 kernel_netlink.c 中 sockaddr_storage 重定义冲突
# HarmonyOS 的 linux/socket.h 与 sys/socket.h 冲突

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "babeld 使用纯 Makefile（无 configure 脚本），需要直接 make 编译"
  - "GitHub source archive 不包含 git 子模块内容，需在 source() 方法中单独下载 BLAKE2 和 rfc6234"
  - "rfc6234 原始仓库 (massar/rfc6234) 已删除，使用 fork bitpart-xyz/rfc6234，文件在 reference/ 目录下"
  - "HarmonyOS 的 linux/socket.h 与 sys/socket.h 冲突导致 sockaddr_storage 重定义，通过在 kernel_netlink.c 中 #include <linux/netlink.h> 之前定义 _UAPI_LINUX_SOCKET_H 跳过 linux/socket.h 的包含，并补充 typedef unsigned short __kernel_sa_family_t"
  - "babeld 的 Makefile 使用 TARGET 和 PREFIX 变量进行安装，TARGET 相当于 DESTDIR"

# ============================================================
# 子模块信息
# ============================================================

submodules:
  - name: BLAKE2
    url: "https://github.com/BLAKE2/BLAKE2"
    branch: master
    needed_for: "BLAKE2/ref/blake2s-ref.c (BLAKE2s hash implementation)"
  - name: rfc6234
    url: "https://github.com/bitpart-xyz/rfc6234"
    branch: main
    original_url: "https://github.com/massar/rfc6234 (deleted/404)"
    needed_for: "reference/sha224-256.c (SHA-256 hash implementation)"
    note: "Files are in reference/ subdirectory, need to be moved to rfc6234/ for Makefile"
