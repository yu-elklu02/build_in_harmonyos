# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bam/0.5.1
homepage: "https://github.com/matricks/bam"

# 上游测试命令
# bam 有 scripts/test.py 但使用 Python 2 语法，在当前环境不兼容
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 bam --help 验证二进制可执行且显示版本信息"
    command: "bam --help"
  - file: conanfile.py
    description: "使用 bam 编译 hello.c 项目，验证 Lua 脚本解析和 C 编译功能"
    command: "bam -v"

# 测试断言总数
assertion_count: 2
