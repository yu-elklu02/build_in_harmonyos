software: bam
display: "bam"
description: "Lua-based build system for C/C++ projects"
category: build-tool
homepage: "https://github.com/matricks/bam"
license: BSD-3-Clause

build_system: custom

ohos_adaptation:
  key_points:
    - "Uses custom Makefile + make_unix.sh (not autotools or cmake)"
    - "Bundled Lua 5.3.3 source in src/lua/ directory"
    - "txt2c tool requires ELF signing before execution"
    - "bam binary requires ELF signing"
    - "System linker /data/service/hnp/bin/ld needed (OHOS SDK lld missing libxml2.so.16)"
  common_dependencies: []

versions:
  "0.5.1":
    status: published
    build_date: 2026-07-06
