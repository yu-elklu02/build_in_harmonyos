patches:
  - patch_file: "patches/xom-1.8-javac.patch"
    patch_description: "Bump javac source/target 1.6→1.8 (bishengjdk 17 dropped Java 6)"
    patch_type: "portability"
  - patch_file: "patches/xom-1.4.4-ci-network.patch"
    patch_description: "Treat HMBS preflight as CI and recognise HTTP 4xx/5xx as network failures so upstream shouldIgnore guards skip testChemistry et al. on rsc.org 429"
    patch_type: "portability"
  - patch_file: "patches/xom-1.4.4-fork-sysprops.patch"
    patch_description: "Propagate JAXP accessExternalDTD=none and JRE socket timeouts to the forked JUnit JVM via <sysproperty> so upstream shouldIgnore guards fire on rsc.org TCP hang (BuilderTest Signal 9 / exit 137)"
    patch_type: "portability"
  - patch_file: "patches/xom-1.4.4-testchemistry-parse.patch"
    patch_description: "Skip testChemistry on remote-DTD ParsingException (rsc.org returns malformed rsc_x.ent entity page; ParsingException extends Exception not IOException so escapes upstream catch(IOException) shouldIgnore guard)"
    patch_type: "portability"
