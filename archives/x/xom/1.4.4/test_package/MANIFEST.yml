# test_package/MANIFEST.yml
# Upstream official test declaration for xom 1.4.4.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: xom/1.4.4
homepage: "https://xom.nu/"

# xom is a Java library built with Ant + Ivy.
# Upstream test target: `ant test`
#   - JUnit 4 batchtest over src/nu/xom/tests/*Test.java
#   - 42 *Test.java files; build.xml excludes MegaTest.java and
#     EBCDICTest.java → 40 test classes executed.
# The upstream `ant test` is wired into conanfile.py build(), which is
# the source of truth for upstream test execution on the HarmonyOS
# aarch64 real machine.
upstream_check_command: "ant test"
upstream_test_in_build: true
upstream_test_command: "ant test"

# Upstream test classes discovered in the source tree.
# Total *Test.java files: 42 (src/nu/xom/tests/).
# Excluded by build.xml test target:
#   - MegaTest.java
#   - EBCDICTest.java
# Executed by upstream `ant test`: 40 classes.
upstream_tests:
  total: 42
  executed: 40
  excluded:
    - "src/nu/xom/tests/MegaTest.java"
    - "src/nu/xom/tests/EBCDICTest.java"
  framework: "junit4"
  source: "src/nu/xom/tests/*Test.java"

# test_package consumer test (exercises the packaged XOM API).
test_package_tests:
  - file: TestXom.java
    description: "Build, serialize, and re-parse an XML document with the nu.xom API (round-trip assertion)"
    command: "javac TestXom.java && java TestXom"

# Assertions: 3 (root name, round-trip root equality, round-trip text)
assertion_count: 3
