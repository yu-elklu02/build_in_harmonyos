# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.42/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.42"

# 软件名
software: "xkeyboard-config"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.x.org/releases/individual/data/xkeyboard-config/xkeyboard-config-2.42.tar.xz"

  # 源码校验和
  sha256: "a6b06ebfc1f01fc505f2f05f265f95f67cc8873a54dd247e3c2d754b8f7e0807"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options: []
  # meson setup build --prefix=... --datadir=share -Dxkb-base=share/X11/xkb

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # xsltproc from HNP (system tool, not a conan dependency)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Meson-based data-only package: no libraries, no executables"
  - "xsltproc from HNP (/data/service/hnp/bin/xsltproc) is found by meson's find_program"
  - "OHOS platform: tarball symlinks (japan, korean, esperanto, etc.) extracted as regular files"
  - "verify-group-names test fails on OHOS due to symlink-as-file, but build output is correct"
  - "Build uses LD_LIBRARY_PATH for libxslt/libxml2 shared libs needed by xsltproc"
  - "Install destination: share/X11/xkb/ with rules, symbols, keycodes, compat, types, geometry"
