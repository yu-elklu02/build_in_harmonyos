# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xkeyboard-config/2.42
homepage: "https://www.x.org/"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试入口统计（实际仓库核查结果，2026-08-09）:
#   - 源码包内 tests/ 目录存在（TEST_DIR_COUNT=1）
#   - meson.build 中定义了 1 个测试: verify-group-names
#   - 该测试使用 xsltproc + gawk 比较 rules/base*.xml 中的组名与 symbols/* 中的组名
#   - 在 OHOS 平台上，tarball 中的符号链接（japan, korean, esperanto 等）
#     被解压为普通文件，导致测试发现额外的组名差异，测试失败
#   - 这是平台限制（OHOS 不完全支持符号链接），不影响构建产物正确性
#   - 构建产物中的符号链接文件已被 meson install_subdir(exclude_files) 排除
#   - pytest 测试需要 python3+pytest，当前环境未安装 pytest 模块，跳过
upstream_tests:
  - name: "verify group names"
    command: "tests/verify-group-names.sh"
    result: "platform_limitation"
    notes: "OHOS symlinks extracted as regular files, causes false diff. Build output correct."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.py
    description: "XKB数据包消费者验证：rules/base.xml / rules/evdev.xml / symbols目录 / keycodes目录 / compat目录 / types目录 / geometry目录 / pkg-config文件"
    command: "python3 test_package.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
