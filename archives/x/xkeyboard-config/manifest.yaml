software: xkeyboard-config
name: X Keyboard Configuration
description: XKB keyboard configuration database
category: x11
license: MIT
website: https://www.x.org/

versions:
  - version: "2.42"
    status: built
    compiled_at: 2026-08-09
    notes: |
      - Conan recipe adapted (meson build system)
      - Data-only package: no libraries, no executables
      - xsltproc from HNP system tool (no conan dependency)
      - OHOS platform: tarball symlinks extracted as regular files
      - verify-group-names test fails due to platform limitation
    dependencies: []
    configure_options:
      - meson setup build --prefix=... --datadir=share -Dxkb-base=share/X11/xkb
    provides:
      - XKB rules files
      - XKB symbols files
      - XKB keycodes files
      - XKB compat files
      - XKB types files
      - XKB geometry files
      - pkg-config file (xkeyboard-config.pc)
