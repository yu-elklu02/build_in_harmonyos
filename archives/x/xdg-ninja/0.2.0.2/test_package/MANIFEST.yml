# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xdg-ninja/0.2.0.2
homepage: "https://github.com/b3nj5m1n/xdg-ninja"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "N/A"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "N/A"
    source: "N/A"
    description: "上游无正式测试框架，仅有 shell 脚本"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 xdg-ninja 二进制可执行"
    command: "./test_xdg-ninja"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1