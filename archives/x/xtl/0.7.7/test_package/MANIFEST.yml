package: xtl/0.7.7
homepage: "https://github.com/xtensor-stack/xtl"

upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/
    source: xtl-0.7.7/test/
    description: "Upstream doctest suite; run separately in OHOS upstream-only validation because the Conan recipe intentionally disables upstream tests during package creation"
    command: "cmake -DBUILD_TESTS=ON -DDOWNLOAD_GTEST=OFF && cmake --build . && ctest --output-on-failure"

test_package_tests:
  - file: test.cpp
    description: "Consumer test for xtl optional and variant APIs"
    command: "./test_xtl"

assertion_count: 3
