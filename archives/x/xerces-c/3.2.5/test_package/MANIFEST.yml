# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 ctest -N / make -n check 查看测试列表
#   3. 把实际运行的测试记录到下方

package: xerces-c/3.2.5
homepage: https://xerces.apache.org/xerces-c/

# 上游测试命令 (用于分析)
# xerces-c 顶层 CMakeLists 无条件 add_subdirectory(tests) 并 enable_testing()，
# 测试为 DOMTest/DOMMemTest/XSValueTest 等可执行目标（需运行于目标平台）。
# 交叉编译场景下不内建上游测试，改用下方 test_package 做消费者侧 API 冒烟。
upstream_check_command: "ctest -N"
upstream_test_in_build: false

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "XercesDOMParser 解析内存 XML + DOM 遍历断言 (根标签/元素数/文本内容)"
    command: "./test_xerces"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
