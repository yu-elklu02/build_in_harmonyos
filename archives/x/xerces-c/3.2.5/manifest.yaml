version: "3.2.5"
software: xerces-c
status: built
build_date: "2026-07-15"
build_system: cmake

source:
  url: "https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-3.2.5.tar.gz"
  sha256: "545cfcce6c4e755207bd1f27e319241e50e37c0c27250f11cda116018f1ef0f5"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dnetwork-accessor=socket"
    - "-Dtranscoder=gnuiconv"
    - "-Dmessage-loader=inmemory"
    - "--target xerces-c"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "xerces-c CMake 平台检测走 UNIX/WIN32/APPLE 通用标志（无 STREQUAL Linux 分支），CMAKE_SYSTEM_NAME=HarmonyOS 下行为一致，无需补丁"
  - "三个后端显式钉到 libc-only 实现：network-accessor=socket / transcoder=gnuiconv / message-loader=inmemory，规避 ICU 与 libcurl 依赖（R36）"
  - "musl 的 pthread/iconv/socket 全在 libc，静态库无需额外 system_libs"
  - "tests/samples 在 configure 阶段无条件 add_subdirectory，但非本库产物；仅构建 xerces-c 目标即可"

verification:
  real_device:
    date: "2026-07-19"
    env: "HarmonyOS HAD 206.1.0 真机（aarch64 musl，OHOS SDK clang 15.0.4）"
    result: "pass"
