package: xcb-util-image/0.4.1
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb-image"

# Upstream ships test/ directory with test programs:
#   test_bitmap.c, test_formats.c, test_swap.c, test_xcb_image.c, test_xcb_image_shm.c
# These tests require an X server connection (they use xcb_connect and
# create drawables), so make check requires a running X server.
# On the OHOS worker, no X server is available, so make check tests
# that need a connection will fail to connect but the library itself
# compiles and links correctly.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""
upstream_tests:
  - name: "test_formats"
    file: "test/test_formats.c"
    description: "Tests various image format combinations. Requires an X server connection."
    source_dir: "test"
    expected_assertions: 0
    exempt: true
    exempt_reason: "Requires a running X server, not available on OHOS worker."
  - name: "test_xcb_image"
    file: "test/test_xcb_image.c"
    description: "Tests xcb_image creation, put, get, and conversion. Requires an X server connection."
    source_dir: "test"
    expected_assertions: 0
    exempt: true
    exempt_reason: "Requires a running X server, not available on OHOS worker."
  - name: "test_xcb_image_shm"
    file: "test/test_xcb_image_shm.c"
    description: "Tests SHM-based image operations. Requires an X server with SHM extension."
    source_dir: "test"
    expected_assertions: 0
    exempt: true
    exempt_reason: "Requires a running X server with SHM extension, not available on OHOS worker."

test_package_tests:
  - file: test.c
    description: |
      Link libxcb-image and exercise the image creation API:
      xcb_image_create (creates a Z-pixmap image without a connection),
      xcb_image_create_from_bitmap_data (creates an image from raw
      bitmap data), verify image properties (width, height, format),
      and call xcb_image_destroy. All tested functions work without
      an X server connection.
    command: "test_xcb_image"

assertion_count: 7
