software: xcb-util-image
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://xorg.freedesktop.org/archive/individual/lib/xcb-util-image-0.4.1.tar.gz"

  # 源码校验和
  sha256: "0ebd4cf809043fdeb4f980d58cdcf2b527035018924f8c14da76d1c81001293b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libxcb/1.17.0
  - xorgproto/2025.1
  - xcb-util/0.4.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - 0001-fix-xcb_bitops-return-type.patch
# 使用官方 release tarball，m4 macro 已包含
# 0001: 修复 -Werror=return-type：xcb_host_byte_order() 在 assert(0) 后添加 unreachable return

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "x.org release tarball includes pre-generated configure and m4 macros, unlike GitLab archive which needs autoreconf"
  - "Conan PkgConfigDeps generates minimal xcb.pc that lacks xcbproto_version variable; need to patch it from the original xcb.pc in libxcb package"
  - "Dependency .la files from autotools packages have stale build-time paths; need to fix libdir and replace .la references with -l flags"
  - "xcb-shm is part of libxcb package (extension library), not a separate conan package"
  - "xcb-util/0.4.1 is a required dependency for xcb-util-image, not previously published to ohpcd remote"

patch_generation:
  method: none
  patches_count: 0
