# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xz/5.8.3
homepage: "https://tukaani.org/xz/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_check.c
    source: xz-5.8.3/tests/test_check.c
    description: "CRC32/CRC64/SHA256 integrity check tests"
    command: "./test_check"
  - file: tests/test_stream_flags.c
    source: xz-5.8.3/tests/test_stream_flags.c
    description: "Stream flag encoding/decoding tests"
    command: "./test_stream_flags"
  - file: tests/test_block_header.c
    source: xz-5.8.3/tests/test_block_header.c
    description: "Block header encoding/decoding tests"
    command: "./test_block_header"
  - file: tests/test_index.c
    source: xz-5.8.3/tests/test_index.c
    description: "Index encoding/decoding tests"
    command: "./test_index"
  - file: tests/test_filter_flags.c
    source: xz-5.8.3/tests/test_filter_flags.c
    description: "Filter flags encoding/decoding tests"
    command: "./test_filter_flags"
  - file: tests/test_memlimit.c
    source: xz-5.8.3/tests/test_memlimit.c
    description: "Memory limit calculation tests"
    command: "./test_memlimit"
  - file: tests/test_microlzma.c
    source: xz-5.8.3/tests/test_microlzma.c
    description: "MicroLZMA encoder/decoder tests"
    command: "./test_microlzma"
  - file: tests/test_lzip_decoder.c
    source: xz-5.8.3/tests/test_lzip_decoder.c
    description: "Lzip decoder tests"
    command: "./test_lzip_decoder"
  - file: tests/test_vli.c
    source: xz-5.8.3/tests/test_vli.c
    description: "Variable-length integer encoding tests"
    command: "./test_vli"
  - file: tests/test_files.sh
    source: xz-5.8.3/tests/test_files.sh
    description: "File handling integration tests"
    command: "./test_files.sh"
  - file: tests/test_suffix.sh
    source: xz-5.8.3/tests/test_suffix.sh
    description: "Suffix handling integration tests"
    command: "./test_suffix.sh"
  - file: tests/test_compress_generated_abc
    source: xz-5.8.3/tests/test_compress_generated_abc
    description: "Compress/decompress generated ABC data"
    command: "./test_compress_generated_abc"
  - file: tests/test_compress_generated_random
    source: xz-5.8.3/tests/test_compress_generated_random
    description: "Compress/decompress generated random data"
    command: "./test_compress_generated_random"
  - file: tests/test_compress_generated_text
    source: xz-5.8.3/tests/test_compress_generated_text
    description: "Compress/decompress generated text data"
    command: "./test_compress_generated_text"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xz.c
    description: "LZMA compress/decompress round-trip test via liblzma API"
    command: "./test_xz"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 50
