software: xsel
version: "1.2.1"
status: built
build_date: "2026-08-14"
conan_ref: "xsel/1.2.1"

source:
  url: "https://github.com/kfish/xsel/archive/refs/tags/1.2.1.tar.gz"
  sha256: "18487761f5ca626a036d65ef2db8ad9923bf61685e06e7533676c56d7d60eb14"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "PKG_CONFIG_PATH 作用域注入：generators 目录（PkgConfigDeps 生成的 x11.pc）+ 各依赖 lib/pkgconfig"
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu (OHOS，绕过 config.guess 无法识别 HarmonyOS)"
  dependencies:
    - libx11/6.4.0 (conan 依赖，ohpcd 已发布 OHOS armv8 binary，kxl/libxscrnsaver 同法)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub tag archive 不含预生成 configure（autoreconf 产物不进版本库），须 autoreconf 自举（tool_requires automake/libtool，E178）"
  - "PKG_CHECK_MODULES([X],[x11]) 需要 pkg.m4（ACLOCAL_PATH 动态定位 pkg-config 安装目录）+ x11.pc（conan 依赖 libx11/6.4.0 + PkgConfigDeps 生成）"
  - "E114: 生成的 configure 用 umask 077 建临时目录，HMDFS 下不可写，须改为 022"
  - "HMFS 下 getcwd 不可达致 configure 'working directory cannot be determined'：chdir(build_folder) + PWD 预置 + configure pwd 判定改写（2.70+/2.69 两种模式，同 aribb24/1.0.4）"
  - "真机 conan 2.x 的 tc.environment()/PkgConfigDeps 注入 PKG_CONFIG_PATH 不生效，须在 build() 内作用域注入（try/finally 恢复，同 pidgin）"
  - "autoreconf 生成的 config.guess 认不出 HarmonyOS（uname -s 输出 'HarmonyOS'）报 'cannot guess build type'：OHOS 分支显式传 --build/--host=aarch64-unknown-linux-gnu 绕过（同 a52dec/acct/xcb-util-renderutil）"
