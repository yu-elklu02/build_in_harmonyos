# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xsel/1.2.1
homepage: "https://github.com/kfish/xsel"

# 上游源码审计：1.2.1 GitHub tag archive 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (xsel-1.2.1 GitHub tag archive)"
    reason: "无 tests/、test/ 目录；全部源码为 xsel.c/xsel.h（单一主程序），无测试文件。"
  - source: "Makefile.am"
    reason: "仅有 bin_PROGRAMS=xsel 与 dist_man_MANS=xsel.1x 安装规则，无 check/test 目标、无 TESTS 变量。"
  - source: "configure.ac"
    reason: "仅做编译器/头文件/函数探测（AC_PROG_CC、AC_CHECK_HEADERS、AC_CHECK_FUNCS）与 PKG_CHECK_MODULES([X],[x11])，无测试宏。"
  - conclusion: "上游 1.2.1 未提供自动化测试；由 test_package 执行消费者视角的 CLI 冒烟验证（--version / --help / 无 X server 时 --output 优雅失败）。"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包二进制的真实执行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xsel.sh
    description: "真实执行打包的 xsel 二进制：--version 输出 'xsel version 1.2.1' 版本行、--help 输出 'Usage: xsel' 用法、无 X server 时 --output 优雅失败（非 0 退出，验证 X11 代码路径真实可达）"
    command: "bash test_xsel.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
