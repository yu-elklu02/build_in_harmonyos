package: xorgproto/2025.1
upstream_test_in_build: true
upstream_tests:
  - name: evdev-keysym-check
    file: scripts/keysym-generator.py
    command: "python3 scripts/keysym-generator.py -v --header include/X11/XF86keysym.h verify"
    expected: "PASS, or upstream-defined exit 77 SKIP when python-libevdev is unavailable"
test_package_tests:
  - file: header_smoke.c
    count: 83
    description: >-
      83 independently compiled consumers, each including one distinct
      self-contained public header and producing a separate object; the
      Xpoll.h consumer also expands the probed fd_set member macro
  - file: conanfile.py
    count: 1
    description: >-
      one package-metadata workflow validates all 29 installed pkg-config
      modules and relocatable paths
test_case_count: 84
assertion_count: 112
