package: xtensor/0.25.0
homepage: "https://github.com/xtensor-stack/xtensor"

upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/
    source: xtensor-0.25.0/test/
    description: "Upstream gtest suite; not run in this Conan recipe to avoid downloading GTest during dependency bootstrap"
    command: "BUILD_TESTS=ON ctest"

test_package_tests:
  - file: test.cpp
    description: "Consumer test for xarray expression evaluation and sum reduction"
    command: "./test_xtensor"

assertion_count: 2
