software: xtensor
display: "xtensor"
description: "C++ tensors with broadcasting and lazy computing"
category: library
homepage: "https://github.com/xtensor-stack/xtensor"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only CMake INTERFACE library"
    - "依赖 xtl 与可选 xsimd；为 Morpheus 2.4.1 按上游 fallback 开启 XTENSOR_USE_XSIMD"
    - "按 E191 设置 CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY，避免 header-only 包在配置期触发无意义可执行链接检测"
    - "导出 CMake target 名称 xtensor，匹配 Morpheus 上游 find_package/target 判断"
  common_dependencies:
    - xtl
    - xsimd

versions:
  "0.25.0":
    status: built
    build_date: "2026-07-27"
    conan_ref: "xtensor/0.25.0"
    notes: "OHOS Conan test_package passed; release-source upstream ctest passed 80/80 with XTENSOR_USE_XSIMD=ON and xsimd 13.2.0 alignment patch."
