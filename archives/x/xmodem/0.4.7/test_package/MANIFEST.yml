package: xmodem/0.4.7
homepage: "https://github.com/tehmaze/xmodem"

upstream_check_command: "python3 -m pytest -q test"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest -q test/unit"

upstream_tests:
  - file: test/unit/test_xmodem.py
    source: xmodem 0.4.7 official GitHub tag archive
    description: "Protocol send, receive, retry, cancellation, CRC, and checksum behavior."
    command: "python3 -m pytest -q test/unit"
  - file: test/functional/test_failures.py
    source: xmodem 0.4.7 official GitHub tag archive
    description: "Checksum failure and retransmission tests requiring lrzsz."
    command: "python3 -m pytest -q test/functional/test_failures.py"
  - file: test/functional/test_xmodem_using_lrzsz.py
    source: xmodem 0.4.7 official GitHub tag archive
    description: "External sender and receiver interoperability tests requiring lrzsz."
    command: "python3 -m pytest -q test/functional/test_xmodem_using_lrzsz.py"

test_package_tests:
  - file: test_xmodem.py
    description: "Consumer test with 20 assertions against the packaged protocol API."
    command: "python3 test_xmodem.py"

upstream_case_count: 24
upstream_dependency_free_case_count: 16
upstream_external_tool_case_count: 8
test_package_assertion_count: 20
assertion_count: 44
