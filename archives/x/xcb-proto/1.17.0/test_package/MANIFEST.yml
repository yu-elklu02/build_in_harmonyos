package: xcb-proto/1.17.0
homepage: "https://gitlab.freedesktop.org/xorg/proto/xcbproto"

upstream_check_command: "xmllint --noout --schema src/xcb.xsd src/*.xml"
upstream_test_in_build: true
upstream_tests:
  - name: protocol-schema-validation
    file: src/xcb.xsd
    command: "xmllint --noout --schema src/xcb.xsd src/*.xml"
    expected: >-
      PASS when xmllint can execute; upstream configure explicitly warns and
      skips this check when xmllint is unavailable

test_package_tests:
  - file: test_xcb_proto.py
    count: 32
    description: >-
      32 separate processes register and resolve one distinct installed
      protocol XML through xcbgen.Module, including its declared imports
  - file: test_xcb_proto.py
    count: 22
    description: >-
      22 separate processes exercise distinct public xcbgen alignment,
      expression, namespace, type, documentation, generation, and failure APIs
      with unique fixtures
  - file: test_xcb_proto.py
    count: 1
    description: >-
      one installed-package workflow verifies the exact 32-XML and seven-module
      inventories, xcb.xsd, relocatable pkg-config variables, and PYTHONPATH
      resolution to the packaged xcbgen module

test_case_count: 55
assertion_count: 55

failure_aggregation:
  catches: "ConanException only"
  continues_independent_cases: true
  raises_once_after_all_cases: true
  regression_evidence_counted_as_test: false
