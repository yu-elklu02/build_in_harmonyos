# 软件级 manifest
# 文件位置: archives/x/xapian-core/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: xapian-core

# 显示名
display: "Xapian Core"

# 一句话描述
description: "搜索引擎核心库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://xapian.org/"

# 开源许可证（SPDX 标识）
license: GPL-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "1.4.x Autotools package needs config.guess/config.sub linux-ohos recognition"
    - "1.4.x glass/chert backends require zlib"
    - "OHOS may deny /proc/sys/kernel/random/uuid; UUID generation should fall back to /dev/urandom or getrandom"
    - "Autotools test scripts should use configured SHELL instead of hard-coded /bin/sh"
    - "OHOS storage may mask lock file permissions to 0640 despite umask(022)"
  # 例如:
  # - "需要设置 CMAKE_SYSTEM_NAME=OHOS"
  # - "Bootstrap 阶段需 --no-qt-gui"

  # 跨版本通用依赖
  common_dependencies:
    - "zlib/1.3.1.1"
  # 例如:
  # - openssl
  # - curl

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.4.26":
    status: built
    build_date: "2026-07-29"
  "2.0.0":
    status: published
    build_date: "2026-06-15"
