# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xmlformat/1.04
homepage: "http://www.kitebird.com/software/xmlformat/"

# 上游测试命令
# 上游 Makefile 的 `test` 目标同时跑 Ruby 版（runtest all）和 Perl 版（runtest -p all）
# HarmonyOS 自带 perl 无 ruby，本配方只接 Perl 版
upstream_check_command: "runtest -p all + bad*.xml"
upstream_test_in_build: true
upstream_test_command: "runtest -p all + bad*.xml"

# 上游实际运行的测试程序
# tests/ 目录 27 个正常用例（每用例 = .xml 输入 + .res 预期输出 + 可选 .conf）
# bad1~5.xml/res 5 个反面用例（畸形 XML，xmlformat 应输出错误并退出）
# 共 32 个用例，全部通过 Perl 版实跑
upstream_tests:
  - file: tests/break1.xml
    source: xmlformat-1.04.tar.gz/tests/break1.xml
    description: "break 中断行格式化用例"
    command: "./runtest -p break1"
  - file: tests/break2.xml
    source: xmlformat-1.04.tar.gz/tests/break2.xml
    description: "break 中断行格式化用例"
    command: "./runtest -p break2"
  - file: tests/continuation.xml
    source: xmlformat-1.04.tar.gz/tests/continuation.xml
    description: "续行格式化用例"
    command: "./runtest -p continuation"
  - file: tests/data.xml
    source: xmlformat-1.04.tar.gz/tests/data.xml
    description: "数据导向 XML 默认格式化用例"
    command: "./runtest -p data"
  - file: tests/empty-doc.xml
    source: xmlformat-1.04.tar.gz/tests/empty-doc.xml
    description: "空文档处理用例"
    command: "./runtest -p empty-doc"
  - file: tests/empty-elt.xml
    source: xmlformat-1.04.tar.gz/tests/empty-elt.xml
    description: "空元素处理用例"
    command: "./runtest -p empty-elt"
  - file: tests/indent1.xml
    source: xmlformat-1.04.tar.gz/tests/indent1.xml
    description: "缩进格式化用例"
    command: "./runtest -p indent1"
  - file: tests/inline1.xml
    source: xmlformat-1.04.tar.gz/tests/inline1.xml
    description: "inline 内联格式化用例 1"
    command: "./runtest -p inline1"
  - file: tests/inline2.xml
    source: xmlformat-1.04.tar.gz/tests/inline2.xml
    description: "inline 内联格式化用例 2"
    command: "./runtest -p inline2"
  - file: tests/inline3.xml
    source: xmlformat-1.04.tar.gz/tests/inline3.xml
    description: "inline 内联格式化用例 3"
    command: "./runtest -p inline3"
  - file: tests/nobreak.xml
    source: xmlformat-1.04.tar.gz/tests/nobreak.xml
    description: "nobreak 不中断行格式化用例"
    command: "./runtest -p nobreak"
  - file: tests/norm.xml
    source: xmlformat-1.04.tar.gz/tests/norm.xml
    description: "norm 规范化格式化用例"
    command: "./runtest -p norm"
  - file: tests/subelt1.xml
    source: xmlformat-1.04.tar.gz/tests/subelt1.xml
    description: "子元素格式化用例 1"
    command: "./runtest -p subelt1"
  - file: tests/subelt2.xml
    source: xmlformat-1.04.tar.gz/tests/subelt2.xml
    description: "子元素格式化用例 2"
    command: "./runtest -p subelt2"
  - file: tests/subelt3.xml
    source: xmlformat-1.04.tar.gz/tests/subelt3.xml
    description: "子元素格式化用例 3"
    command: "./runtest -p subelt3"
  - file: tests/subelt4.xml
    source: xmlformat-1.04.tar.gz/tests/subelt4.xml
    description: "子元素格式化用例 4"
    command: "./runtest -p subelt4"
  - file: tests/subelt5.xml
    source: xmlformat-1.04.tar.gz/tests/subelt5.xml
    description: "子元素格式化用例 5"
    command: "./runtest -p subelt5"
  - file: tests/subelt6.xml
    source: xmlformat-1.04.tar.gz/tests/subelt6.xml
    description: "子元素格式化用例 6"
    command: "./runtest -p subelt6"
  - file: tests/subelt7.xml
    source: xmlformat-1.04.tar.gz/tests/subelt7.xml
    description: "子元素格式化用例 7"
    command: "./runtest -p subelt7"
  - file: tests/table1.xml
    source: xmlformat-1.04.tar.gz/tests/table1.xml
    description: "表格格式化用例 1"
    command: "./runtest -p table1"
  - file: tests/table2.xml
    source: xmlformat-1.04.tar.gz/tests/table2.xml
    description: "表格格式化用例 2"
    command: "./runtest -p table2"
  - file: tests/table3.xml
    source: xmlformat-1.04.tar.gz/tests/table3.xml
    description: "表格格式化用例 3"
    command: "./runtest -p table3"
  - file: tests/test1.xml
