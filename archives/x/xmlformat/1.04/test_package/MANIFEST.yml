    command: "./runtest -p xsltext"
  - file: bad1.xml
    source: xmlformat-1.04.tar.gz/bad1.xml
    description: "反面用例 1：畸形 XML，xmlformat 应报错"
    command: "./xmlformat.pl bad1.xml"
  - file: bad2.xml
    source: xmlformat-1.04.tar.gz/bad2.xml
    description: "反面用例 2：畸形 XML，xmlformat 应报错"
    command: "./xmlformat.pl bad2.xml"
  - file: bad3.xml
    source: xmlformat-1.04.tar.gz/bad3.xml
    description: "反面用例 3：畸形 XML，xmlformat 应报错"
    command: "./xmlformat.pl bad3.xml"
  - file: bad4.xml
    source: xmlformat-1.04.tar.gz/bad4.xml
    description: "反面用例 4：畸形 XML，xmlformat 应报错"
    command: "./xmlformat.pl bad4.xml"
  - file: bad5.xml
    source: xmlformat-1.04.tar.gz/bad5.xml
    description: "反面用例 5：畸形 XML，xmlformat 应报错"
    command: "./xmlformat.pl bad5.xml"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xmlformat.sh
    description: "CLI smoke test — 验证 xmlformat 安装、可执行，对样例 XML 产正确缩进格式化输出"
    command: "bash test_xmlformat.sh xmlformat"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
