# 版本级 manifest 模板
# 文件位置: archives/x/xmlformat/1.04/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.04"

# 软件名
software: "xmlformat"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-04"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（MacPorts 镜像，与 Debian 官方记录同字节，sha256 一致）
  url: "https://distfiles.macports.org/xmlformat/xmlformat-1.04.tar.gz"
  sha256: "71a70397e44760d67645007ad85fea99736f4b6f8679067a3b5f010589fd8fef"
  strip_root: true

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  - name: perl
    version: ">=5"
    type: runtime
    notes: "运行 xmlformat.pl 解释器所需；HarmonyOS PC 自带 perl"

# ============================================================
# 适配信息
# ============================================================

adaptation:
  # 适配类型: tool（命令行工具）/ library（库）
  type: tool

  # 构建系统: custom / autotools / cmake / make / meson
  build_system: custom

  # 是否需要交叉编译
  cross_compile: false

  # 已应用的补丁
  patches: []

  # 适配说明
  notes: |
    纯 Perl/Ruby 脚本工具，无需编译。
    安装 xmlformat.pl 为 bin/xmlformat（去掉 .pl 扩展名），同时附带 xmlformat.rb 供有 ruby 的环境使用。
    HarmonyOS PC 自带 perl；上游测试套件通过 ./runtest -p all 驱动，在 build() 中完整执行。

# ============================================================
# 验证信息
# ============================================================

validation:
  # conan-verify 是否通过
  conan_verify: true

  # 上游测试套件
  upstream_tests:
    command: "runtest -p all + bad*.xml"
    result: "pass"
    total: 32
    passed: 32
    failed: 0
    skipped: 0

  # test_package
  test_package:
    result: "pass"
    assertion_count: 2

# ============================================================
# 状态历史
# ============================================================

history:
  - date: "2026-08-04"
    event: "首次适配"
    status: built
