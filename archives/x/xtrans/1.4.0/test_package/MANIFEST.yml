package: xtrans/1.4.0
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxtrans"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_zero_evidence: >-
  Makefile.am declares no TESTS, check_PROGRAMS, check-local, or test target;
  the generated Automake check target is empty.

build_preflights_not_counted_as_tests:
  - file: configure_probe.c
    count: 1
    description: >-
      One syntax-only target capability preflight reproduces the xtrans.m4
      declaration checks used by real consumers for socklen_t,
      sockaddr_storage, getaddrinfo, and inet_ntop. It does not call xtrans and
      is not executed or counted as a test.
  - file: consumer.c
    count: 68
    description: >-
      Independently compiled and linked consumers covering six
      self-contained symbol namespaces, four client/server/reopen role
      profiles, and every namespace-valid TCPv4, TCPv6, and UNIX transport
      implementation. The generic default namespace is TCP-only because
      upstream defines no UNIX_PATH for it; XSERV_t is excluded because it
      requires the X Server's private os.h. The matrix conditionally references
      all 32 non-Windows public functions declared by Xtrans.h; UNIX cases also
      enable XTRANS_SEND_FDS so SendFd and RecvFd are compiled and linked under
      the same guard as their implementations. Each case has a unique macro
      input and generated executable, but these function-address probes do not
      call the transport APIs and are not executed or counted as tests.

test_package_tests:
  - file: runtime_smoke.c
    count: 3
    description: >-
      Three independent target workflows cover TCPv4 loopback, TCPv6
      loopback, and the filesystem UNIX-domain endpoint. TCPv4 and TCPv6 each
      create a listener, connect and accept a client, transfer distinct
      payloads in both directions through scalar and vector public APIs, use a
      bounded readiness wait, validate hostname, peer address, locality and
      descriptor state, then check Disconnect, CloseForCloning, and Close
      results. The UNIX workflow uses a caller-supplied absolute path; on OHOS
      it accepts the documented E024 EPERM only after OpenCOTSServer succeeds,
      the immediately following CreateListener fails, and cleanup succeeds.
      Endpoint/open/cleanup failures and every other listener result remain
      fatal. No external host is contacted.
      This reusable two-layer method is documented in the E234 knowledge draft
      submitted with this software; the formal knowledge index is unchanged.
  - file: verify_package.py
    count: 1
    description: >-
      One package-metadata workflow checks all seven installed implementation
      sources, the m4 macro, license, documentation, relocatable pkg-config
      paths, and consistency of compiler-probed consumer definitions.

test_case_count: 4
assertion_breakdown:
  uncounted_target_capability_preflight: 4
  uncounted_compile_link_consumer_boundaries: 68
  tcp_loopback_transactions: 44
  ohos_unix_capability: 4
  package_metadata: 14
assertion_count: 134
