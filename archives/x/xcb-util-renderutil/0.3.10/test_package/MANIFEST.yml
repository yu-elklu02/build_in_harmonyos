# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xcb-util-renderutil/0.3.10
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb-render-util"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# xcb-util-renderutil tarball has no test suite — no check_PROGRAMS defined
# in Makefile.am, so `make check` is a no-op.
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# No upstream test programs — the tarball ships only cache.c, util.c, glyph.c
# as library sources with no check_PROGRAMS or tests/ subdirectory.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: calls xcb_render_util_find_visual_format(NULL,0) and xcb_render_util_disconnect(NULL) to verify library linkage and ABI surface"
    command: "./test_xcb_util_renderutil"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
