# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xapian-bindings/1.4.26
homepage: "https://xapian.org/"

# 上游测试命令
upstream_check_command: "make -C python3 check"

# CI HNP python 沙箱无法加载 build 目录内 _xapian.so（E009/E054，notes.md #5），
# 上游测试不在 build() 内执行；本地已验证 2/2 通过，安装后由 test_package 验证。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的 Python 绑定测试（本地验证通过，CI 沙箱限制）
upstream_tests:
  - file: python3/smoketest.py
    source: xapian-bindings-1.4.26/python3/smoketest.py
    description: "上游 Python 绑定冒烟测试（本地 2/2 通过）"
    command: "make -C python3 check"
  - file: python3/pythontest.py
    source: xapian-bindings-1.4.26/python3/pythontest.py
    description: "上游 Python 绑定功能测试（本地 2/2 通过）"
    command: "make -C python3 check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xapian_bindings.py
    description: "验证 import xapian、版本号、内存数据库创建/检索"
    command: "python3 test_xapian_bindings.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
