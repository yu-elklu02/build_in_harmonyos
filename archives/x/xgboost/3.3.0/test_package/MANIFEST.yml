# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: xgboost/3.3.0
homepage: "https://github.com/dmlc/xgboost"

# 上游测试命令（C++ 子集验证）
upstream_check_command: "ctest -C Release"
upstream_test_command: "conan create ... -c user.build:tests=True"

# 上游实际运行的测试程序
upstream_tests:
  - name: "TestXGBoostLib"
    file: "tests/cpp/"
    framework: "Google Test"
    count: 832
    result: "passed"
    reason: "824 passed, 8 skipped (Socket/GPU); Numa fallback patch 修复 SIGSYS"
  - name: "AllTestsInDMLCUnitTests"
    file: "dmlc-core/test/"
    framework: "Google Test"
    count: 70
    result: "passed"
    note: "USE_OPENMP=OFF 时全部通过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 xgboost 库可被链接和调用"
    command: "./test_xgboost"

# 测试断言总数
assertion_count: 2