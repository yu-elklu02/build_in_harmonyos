# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）。
# 详见: docs/TEST_QUALITY_SPEC.md

package: x86_64-elf-binutils/2.46.1
homepage: "https://www.gnu.org/software/binutils/"

# 上游测试命令（binutils 的 gas/ld/binutils 子目录各自带 dejagnu 测试套件）
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试
# binutils 官方套件需 dejagnu + 目标运行时，交叉场景不具备，故未在 build 中集成。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（代表性条目）
upstream_tests:
  - file: gas/testsuite
    source: binutils-2.46.1/gas/testsuite
    description: "gas 汇编器 dejagnu 测试套件（需目标运行时，交叉场景跳过）"
    command: "make check-gas"
  - file: ld/testsuite
    source: binutils-2.46.1/ld/testsuite
    description: "ld 链接器 dejagnu 测试套件（需目标运行时，交叉场景跳过）"
    command: "make check-ld"

# test_package 自带测试（消费者视角，验证交叉工具链真实可用）
test_package_tests:
  - file: test.sh
    description: "用 x86_64-elf-as 汇编最小程序，readelf/objdump/ar/nm 验证产物（R34 合规）"
    command: "bash test.sh"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 6
