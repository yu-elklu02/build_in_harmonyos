software: x86_64-elf-binutils
display: "x86_64-elf-binutils"
description: "GNU binutils 交叉工具链，目标 x86_64-elf 裸机 ABI"
category: build-tool
homepage: "https://www.gnu.org/software/binutils/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需添加 HarmonyOS / __OHOS__ 识别（E007）"
    - "所有 configure 脚本的 umask 077 需改为 022，适配 HMDFS（E011）"
    - "gprofng 依赖 Linux SIGEV_THREAD_ID，HarmonyOS 不可用，需 --disable-gprofng"
    - "config.sub 2.46.1 已原生支持 ohos，无需补丁"
    - "交叉构建 --target=x86_64-elf，工具自动加 x86_64-elf- 前缀"
  common_dependencies: []

versions:
  "2.46.1":
    status: built
    build_date: "2026-07-14"
