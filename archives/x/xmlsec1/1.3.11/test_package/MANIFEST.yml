package: xmlsec1/1.3.11
homepage: https://github.com/lsh123/xmlsec
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: tests/testKeys.sh
    source: xmlsec1-1.3.11.tar.gz/tests/testKeys.sh
    description: "Run 29 upstream key-management scenarios with OpenSSL"
    command: "make check"
    scenario_count: 29
  - file: tests/testDSig.sh
    source: xmlsec1-1.3.11.tar.gz/tests/testDSig.sh
    description: "Run 243 upstream XML signature scenarios with OpenSSL"
    command: "make check"
    scenario_count: 243
  - file: tests/testEnc.sh
    source: xmlsec1-1.3.11.tar.gz/tests/testEnc.sh
    description: "Run 167 upstream XML encryption scenarios with OpenSSL"
    command: "make check"
    scenario_count: 167
  - file: apps/unit_tests
    source: xmlsec1-1.3.11/apps/unit_tests
    description: "Run the upstream unit-test executable"
    command: "make check-unit-tests"
    scenario_count: 1
test_package_tests:
  - file: test_package.c
    description: "Initialize and shut down the xmlsec core library"
    command: "./test_package"
assertion_count: 2
