name: xmlsec1
version: 1.3.11
status: built
build_date: 2026-05-20
build_system: autotools

configure_options:
  - "--disable-shared"
  - "--enable-static"
  - "--enable-static-linking"
  - "--disable-crypto-dl"
  - "--disable-apps-crypto-dl"
  - "--with-libxml=<libxml2 package_folder>"
  - "--without-libxslt"
  - "--with-openssl=<openssl package_folder>"
  - "--without-gnutls"
  - "--without-gcrypt"
  - "--without-nss"
  - "--with-default-crypto=openssl"

dependencies:
  - libxml2/2.15.3
  - openssl/3.5.6

patches_applied:
  - "0001-configure-hmdfs-umask.patch"

notes: |
  Upstream 1.3.11 accepts the aarch64-unknown-linux-ohos triplet without source patches.
  The recipe builds static libraries with only the OpenSSL crypto backend enabled.
