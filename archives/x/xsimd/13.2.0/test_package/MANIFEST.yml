package: xsimd/13.2.0
homepage: "https://github.com/xtensor-stack/xsimd"

upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/
    source: xsimd-13.2.0/test/
    description: "Upstream test suite; not run in this Conan recipe during dependency bootstrap"
    command: "BUILD_TESTS=ON ctest"

test_package_tests:
  - file: test.cpp
    description: "Consumer test for xsimd batch load/add/store"
    command: "./test_xsimd"

assertion_count: 1
