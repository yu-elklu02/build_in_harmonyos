software: xidle
version: "20200802"
status: built
build_date: "2026-07-31"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/x/xidle/xidle_20200802.tar.xz"
  sha256: "3807130609029082ef6cac4cb59e61abf12698f0d22c44aff2d8f6ca9bad2bb9"
  tar_format: tar.xz

build:
  system: custom
  configure_options: []
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0
    - libxss/1.2.0
    - libiconv/1.17
    - xorgproto/2024.1
  cc: clang
  cxx: clang++

patches_applied:
  - "ports/ohos-mbsdport.h: 自定义兼容头，提供 __RCSID/__dead/__progname/__RCSID_SRC，替代 MirBSD bsd.prog.mk 机制"

knowledge_gained:
  - "xidle 上游为 BSD bmake + bsd.prog.mk 构建，HarmonyOS PC 无 bmake，需直接 clang 编译 xidle.c + strtonum.c"
  - "xidle 通过 MBSDPORT_H 宏包含可移植层头文件 (debian/mbsdport.h)，定义 __RCSID/__dead 和 strtonum 前向声明"
  - "Debian 构建使用 -DNEED_STRTONUM 启用自带的 strtonum(3) 实现，避免依赖 glibc 扩展"
  - "依赖 X11 ScreenSaver 扩展 (libXss)、libXext、libX11，全部由 cmd-pkgs 预装"
  - "上游无测试套件：源码包仅含 xidle.c/strtonum.c/Makefile/xidle.1，无 check/test 目标，Debian/rules 也未运行任何测试"
