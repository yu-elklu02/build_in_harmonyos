# conandata.yml — xidle 20200802
# Upstream: Debian native package, source tarball from the Debian pool.
# xidle runs a program after inactivity or on edge-sensitive mouse motion.
# Authoritative source: https://deb.debian.org/debian/pool/main/x/xidle/
# Mirror (TUNA): https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/x/xidle/

# Primary source: the xidle upstream tarball.
sources:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/x/xidle/xidle_20200802.tar.xz"
  sha256: "3807130609029082ef6cac4cb59e61abf12698f0d22c44aff2d8f6ca9bad2bb9"

# Vendored X11 dev headers. The HarmonyOS PC preflight environment does
# not pre-install X11 dev headers under any standard prefix, so we vendor
# the genuine upstream headers (verbatim, same releases shipped by cmd-pkgs:
# libX11 1.8.4, xorgproto 2024.1, libXss 1.2.3) and unpack only the headers
# xidle.c needs. See conanfile.py source()/extract_x11_headers() for which
# files are pulled from each archive. We only vendor headers; the .so
# libraries (libXss, libXext, libX11) still come from the system pre-install.
x11_headers:
  - name: "libx11"
    strip_root: "libX11-1.8.4"
    url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/libx/libx11/libx11_1.8.4.orig.tar.gz"
    sha256: "efd3a3a43c1f177edc2c205bedb0719b6648203595e54c0b83a32576aeaca7cd"
    files:
      - "include/X11/Xlib.h"
      - "include/X11/Xresource.h"
      - "include/X11/Xutil.h"
  - name: "xorgproto"
    strip_root: "xorgproto-2024.1"
    url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/x/xorgproto/xorgproto_2024.1.orig.tar.gz"
    sha256: "4f6b9b4faf91e5df8265b71843a91fc73dc895be6210c84117a996545df296ce"
    files:
      - "include/X11/X.h"
      - "include/X11/Xfuncproto.h"
      - "include/X11/Xosdefs.h"
      - "include/X11/keysym.h"
      - "include/X11/keysymdef.h"
      - "include/X11/Xatom.h"
      - "include/X11/extensions/saver.h"
  - name: "libxss"
    strip_root: "libXScrnSaver-1.2.3"
    url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/libx/libxss/libxss_1.2.3.orig.tar.gz"
    sha256: "4f74e7e412144591d8e0616db27f433cfc9f45aae6669c6c4bb03e6bf9be809a"
    files:
      - "include/X11/extensions/scrnsaver.h"
    # cmd-pkgs (OpenHarmonyPCDeveloper/cmd-pkgs) ships no libXss prebuilt at
    # all — neither 1.2.0 nor 1.2.3 — so the runtime libXss.so.1 cannot be
    # fetched. We instead build libXss.so.1 ourselves from this upstream
    # source archive (XScrnSaver.c is a single-file implementation) and
    # install it into ~/usr/local/lib alongside the cmd-pkgs libX11/libXext.
    # The vendored X11 internal headers it needs (Xlibint.h, Xext.h,
    # extutil.h, saverproto.h, saver.h) are all present inside the cmd-pkgs
    # libx11-6.4.0 tarball; only scrnsaver.h is vendored here above.
    src_files:
      - "src/XScrnSaver.c"

patches: {}
