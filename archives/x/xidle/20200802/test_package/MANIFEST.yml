package: xidle/20200802
homepage: "https://www.mirbsd.org/xidle.htm"

# Upstream test audit
upstream_tests_exist: false
upstream_test_audit:
  - source: "xidle-20200802/xidle.c (449 lines, no test mains)"
    reason: "Source tree contains only xidle.c, strtonum.c, Makefile, xidle.1; no test source files."
  - source: "xidle-20200802/Makefile (BSD bmake + bsd.prog.mk)"
    reason: "Upstream Makefile defines PROG=xidle only; no check/test target."
  - source: "xidle-20200802/debian/rules"
    reason: "Debian rules has no override_dh_auto_test; no test invocation anywhere."
  - source: "xidle-20200802/debian/control Build-Depends"
    reason: "Build-Depends: debhelper-compat(=13), bmake, libxss-dev only; no test framework."
  - conclusion: "Upstream provides no test suite of any kind. test_package/ provides a consumer test instead."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_xidle.sh
    description: "Run installed xidle binary, assert --help exits non-zero (usage() exit 1) and file(1) reports ELF"
    command: "./test_xidle.sh"

assertion_count: 3
