software: x86_64-elf-grub
display: "x86_64-elf-grub"
description: "运行于 HarmonyOS PC、面向 x86_64-elf/EFI 目标的 GNU GRUB 交叉构建工具集"
category: build-tool
homepage: "https://www.gnu.org/software/grub/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "宿主工具由 HarmonyOS Clang 编译，目标代码使用裸机 Clang 前端和 GNU x86_64-elf-ld"
    - "依赖 x86_64-elf-binutils/2.46.1 提供 ld、objcopy、strip、nm 和 ranlib"
    - "config.guess/config.sub 需识别 HarmonyOS/OHOS（E007）"
    - "configure 临时目录 umask 077 需改为 022 以兼容 HMDFS（E129）"
    - "HMDFS 上生成的 config.status 必须通过 /system/bin/sh 执行"
    - "权威 Automake 输入必须先于 shipped Makefile.in 应用补丁，避免时间戳触发重生成（E041）"
    - "受限进程不可枚举 / 时，仅对 EACCES 放行 hostfs 根目录身份探测（E226 知识草稿随软件提交）"
    - "HELP2MAN 禁用后安装必须显式使用 man_MANS=，避免缺失 man page 阻断安装（E217 知识草稿随软件提交）"
    - "移除 GDB-only .module 并用 prefix-map 与安装后规范化清除缓存绝对路径"
  common_dependencies:
    - x86_64-elf-binutils

versions:
  "2.12":
    status: built
    build_date: "2026-07-18"
    conan_ref: "x86_64-elf-grub/2.12"
