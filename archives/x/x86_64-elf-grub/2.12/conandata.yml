    patch_description: "0011 Invoke config.status through the configured shell in the authoritative completion rule"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile.in.patch"
    patch_description: "0002 Invoke config.status through the configured shell in shipped top-level Makefile rules"
    patch_type: "portability"
  - patch_file: "patches/0009-grub-core-Makefile.in.patch"
    patch_description: "0009 Invoke config.status through the configured shell in shipped GRUB core rules"
    patch_type: "portability"
  - patch_file: "patches/0012-util-bash-completion.d-Makefile.in.patch"
    patch_description: "0012 Invoke config.status through the configured shell in the shipped completion rule"
    patch_type: "portability"
