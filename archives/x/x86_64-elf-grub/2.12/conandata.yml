patches:
  - patch_file: "patches/0007-gentpl.py.patch"
    patch_description: "0007 Generate config.status rules that use the configured shell"
    patch_type: "portability"
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "0001 Invoke config.status through the configured shell in the syslinux test rule"
    patch_type: "portability"
  - patch_file: "patches/0003-Makefile.util.am.patch"
    patch_description: "0003 Invoke config.status through the configured shell in authoritative utility rules"
    patch_type: "portability"
  - patch_file: "patches/0004-build-aux-config.guess.patch"
    patch_description: "0004 Recognize HarmonyOS uname and __OHOS__ libc in config.guess"
    patch_type: "portability"
  - patch_file: "patches/0005-build-aux-config.sub.patch"
    patch_description: "0005 Accept and normalize linux-ohos target triplets in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0006-configure.patch"
    patch_description: "0006 Use umask 022 for Autoconf temporary directories on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0008-grub-core-Makefile.core.am.patch"
    patch_description: "0008 Invoke config.status through the configured shell in authoritative GRUB core rules"
    patch_type: "portability"
