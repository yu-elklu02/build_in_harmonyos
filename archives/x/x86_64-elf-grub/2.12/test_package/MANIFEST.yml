# Upstream and consumer-test declaration for x86_64-elf-grub 2.12.
package: x86_64-elf-grub/2.12
homepage: "https://www.gnu.org/software/grub/"

upstream_check_command: >-
  make check
  'check_PROGRAMS=example_unit_test printf_test date_test cmp_test'
  'check_SCRIPTS='
  'TESTS=example_unit_test printf_test date_test cmp_test'
  'TARGET_LDFLAGS=-Wl,-no-pie'
upstream_test_in_build: true
upstream_test_command: >-
  make check
  'check_PROGRAMS=example_unit_test printf_test date_test cmp_test'
  'check_SCRIPTS='
  'TESTS=example_unit_test printf_test date_test cmp_test'
  'TARGET_LDFLAGS=-Wl,-no-pie'

upstream_inventory:
  unit_tests: 5
  integration_tests: 81
  other_tests: 6
  total: 92

upstream_tests:
  - file: "Makefile.am unit-test programs"
    source: "grub-2.12/Makefile.am"
    description: "5 个 C 单元测试；正式配方执行其中 4 个自包含测试"
    command: "make check (4-test selected subset)"
  - file: "tests/"
    source: "grub-2.12/tests"
    description: "81 个 GRUB/QEMU/文件系统集成测试入口"
    command: "make check (完整环境)"
  - file: "asm-tests/"
    source: "grub-2.12/asm-tests"
    description: "6 个架构汇编检查"
    command: "make check (对应目标环境)"

upstream_test_exemptions:
  - test: priority_queue_unit_test
    reason: "Clang 15 与 GRUB 2.12 内置 gnulib 的 free() 异常规范冲突"
  - test: "完整 81 个集成测试与 6 个架构汇编测试"
    reason: "依赖 QEMU、文件系统工具和目标运行时；不得宣称 92/92 通过"

test_package_counts:
  unit_tests: 0
  integration_tests: 6
  harmonyos_tests: 0
  harmonyos_reason: "没有仅在 OHOS 成立的平台专属断言；6 个流程均可在 Linux 与 OHOS 上运行"
  test_flows: 6
  assertions: 10

test_package_tests:
  - file: test.sh
    type: integration
    description: "Multiboot 正识别（2 条断言）"
    command: "Capability-probed /system/bin/sh on OHOS; first pipefail-capable CONFIG_SHELL, bash, zsh, or sh elsewhere"
  - file: test.sh
    type: integration
    description: "错误格式负识别（2 条断言）"
    command: "Capability-probed /system/bin/sh on OHOS; first pipefail-capable CONFIG_SHELL, bash, zsh, or sh elsewhere"
  - file: test.sh
    type: integration
    description: "GRUB 配置脚本校验（1 条断言）"
    command: "Capability-probed /system/bin/sh on OHOS; first pipefail-capable CONFIG_SHELL, bash, zsh, or sh elsewhere"
  - file: test.sh
    type: integration
    description: "EFI 镜像生成与识别（2 条断言）"
    command: "Capability-probed /system/bin/sh on OHOS; first pipefail-capable CONFIG_SHELL, bash, zsh, or sh elsewhere"
  - file: test.sh
    type: integration
    description: "执行包内宿主二进制并核对版本（1 条断言）"
    command: "Capability-probed /system/bin/sh on OHOS; first pipefail-capable CONFIG_SHELL, bash, zsh, or sh elsewhere"
  - file: test.sh
    type: integration
    description: "GRUB environment block 写入/读取往返（2 条断言）"
    command: "Capability-probed /system/bin/sh on OHOS; first pipefail-capable CONFIG_SHELL, bash, zsh, or sh elsewhere"

test_flow_count: 6
assertion_count: 10
