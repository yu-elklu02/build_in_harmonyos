software: x86_64-elf-grub
version: "2.12"
status: built
build_date: "2026-07-18"
build_system: autotools
conan_ref: "x86_64-elf-grub/2.12"

source:
  url: "https://ftp.gnu.org/gnu/grub/grub-2.12.tar.xz"
  sha256: "f3c97391f7c4eaa677a78e090c7e97e6dc47b16f655f04683ebd37bef7fe0faa"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--target=x86_64-elf"
    - "--with-platform=efi"
    - "--program-prefix=x86_64-elf-"
    - "--disable-werror"
    - "--disable-nls"
    - "--disable-efiemu"
    - "--disable-grub-mkfont"
    - "--disable-grub-themes"
    - "--disable-grub-mount"
    - "--disable-device-mapper"
    - "--disable-liblzma"
    - "--disable-libzfs"
    - "--disable-grub-emu-sdl"
    - "--disable-grub-emu-sdl2"
    - "--disable-grub-emu-pci"
  dependencies:
    - x86_64-elf-binutils/2.46.1
  cc: clang
  cxx: clang++

patches_applied:
  - file: 0007-gentpl.py.patch
    purpose: "让模板生成器输出显式 SHELL 调用的 config.status 规则"
  - file: 0001-Makefile.am.patch
    purpose: "在 syslinux 测试规则中通过已配置 SHELL 调用 config.status"
  - file: 0003-Makefile.util.am.patch
    purpose: "在 104 处权威 utility Automake 规则中通过 SHELL 调用 config.status"
  - file: 0004-build-aux-config.guess.patch
    purpose: "识别 HarmonyOS uname 与 __OHOS__ libc（E007）"
  - file: 0005-build-aux-config.sub.patch
    purpose: "接受并规范化 linux-ohos 三元组（E007）"
  - file: 0006-configure.patch
    purpose: "将两处临时目录 umask 077 改为 022，兼容 HMDFS（E129）"
  - file: 0008-grub-core-Makefile.core.am.patch
    purpose: "在 7 处权威 GRUB core 规则中通过 SHELL 调用 config.status"
  - file: 0010-grub-core-kern-emu-hostfs.c.patch
    purpose: "受限进程不可枚举 / 时，仅对 EACCES 放行 hostfs 根目录身份探测（E226）"
  - file: 0011-util-bash-completion.d-Makefile.am.patch
    purpose: "在权威 bash completion 规则中通过 SHELL 调用 config.status"
  - file: 0002-Makefile.in.patch
    purpose: "同步发布包顶层 Makefile.in 的 105 处 config.status 调用；最后应用以避免触发 Automake 重生"
  - file: 0009-grub-core-Makefile.in.patch
    purpose: "同步发布包 grub-core/Makefile.in 的 7 处调用；最后应用以避免触发 Automake 重生"
  - file: 0012-util-bash-completion.d-Makefile.in.patch
    purpose: "同步发布包 bash completion Makefile.in 的调用；最后应用以避免触发 Automake 重生"

compatibility:
  level: built
  notes: |
    宿主工具运行于 HarmonyOS PC（AArch64），目标对象为 x86_64-elf/EFI。
    HarmonyOS PC 真机已完成 W0、源码构建、上游测试、消费者测试和产物审计；
    HarmonyOS/AArch64 结论以当前 PR HEAD 的正式 CI 为准。

knowledge_gained:
  - "Clang 可用 Linux driver 选择 GNU x86_64-elf-ld，并用 cc1 裸机三元组生成 GRUB x86_64 EFI 目标代码"
  - "GRUB 目标链接与对象处理工具必须从 x86_64-elf-binutils Conan build dependency 取得"
  - "禁用 HELP2MAN 后 make install 仍会寻找 man page，需显式传入 man_MANS=（E217 知识草稿随本软件 PR 提交）"
  - "受限进程可搜索已知路径但不可枚举 / 时，hostfs 身份探测需做严格的运行时 EACCES 降级（E226 知识草稿随本软件 PR 提交）"
  - "HMDFS 可读取 config.status 却拒绝直接执行时，权威规则和发布包 Makefile.in 都需显式通过 $(SHELL) 调用"
  - "同时修改权威 Automake 输入和 shipped Makefile.in 时，生成输入必须先应用且 .in 必须最后应用，避免时间戳触发缺失的 Automake（E041）"
  - "prefix-map 与安装后 modinfo 规范化可移除 Conan 缓存绝对路径；GDB-only .module 不应打包"
  - "完整上游测试依赖 QEMU、文件系统工具和目标运行时；构建阶段执行 4 个自包含 C 单测"

