# 版本级 manifest
# 文件位置: archives/x/xdelta3/3.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.2.0"
software: "xdelta3"
status: built
build_date: "2026-07-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jmacd/xdelta/archive/refs/tags/v3.2.0.tar.gz"
  sha256: "ba2c9676b325f1958e504a60a20340145b8073d5f8664092de17389e15a93199"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DXD3_ARMOR=OFF"
    - "-DXD3_LZMA_MODE=auto"
    - "-DXD3_BUILD_LIB=ON"
    - "-DXD3_BUILD_TESTS=OFF"
  dependencies:
    - "xz/5.6.2"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "xdelta3 源码在 xdelta3/ 子目录中，conanfile.py source() 需要将 xdelta3/ 子目录内容移动到源码根目录"
  - "XD3_ARMOR=OFF 禁用 BLAKE3 FetchContent（CI 环境无法访问 GitHub）"
  - "XD3_LZMA_MODE=auto 通过 Conan CMakeDeps 提供 liblzma（xz/5.6.2）"
  - "conanfile.py source() 中通过 replace_in_file 修改 CMakeLists.txt，将 find_package(LibLZMA) 替换为 Conan 优先的 find_package(xz) 查找路径"
  - "SIZEOF_SIZE_T 等 ABI 宏需在 package_info 中按 arch 动态设置，因 Conan CMakeDeps 不传播上游 INTERFACE_COMPILE_DEFINITIONS"
