# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xdelta3/3.2.0
homepage: "https://github.com/jmacd/xdelta"

# 上游测试命令
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testing/regtest.cc
    source: xdelta3-3.2.0/xdelta3/testing/regtest.cc
    description: "Regression test suite — encode/decode, secondary compression, edge cases"
    command: "./build/xdelta3regtest"
  - file: testing/checksum_test.cc
    source: xdelta3-3.2.0/xdelta3/testing/checksum_test.cc
    description: "Checksum (adler32/crc32) unit tests"
    command: "./build/xdelta3checksum"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer API test — xd3_encode_memory + xd3_decode_memory round-trip (R34)"
    command: "./test_xdelta3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
