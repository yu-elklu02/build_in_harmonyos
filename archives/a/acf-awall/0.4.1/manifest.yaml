# 版本级 manifest — acf-awall 0.4.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4.1"
software: "acf-awall"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方源：GitLab 官方归档）
  url: "https://gitlab.alpinelinux.org/acf/acf-awall/-/archive/v0.4.1/acf-awall-v0.4.1.tar.gz"
  # 源码校验和（与官方 tarball 一致）
  sha256: "5f94fd750dd61f11581f1b9efd04ad183951ffee24d26097284340bcadfbf4a4"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：纯 Makefile（无 configure，make install 仅 cp -a 复制）
  system: makefile
  configure_options: []
  # 编译依赖列表（纯 Lua 脚本包，无编译依赖，不声明 conan requirements）
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-awall 是 Alpine ACF (Alpine Configuration Framework) 的 awall 管理模块，纯 Lua/LSP 脚本包（noarch，无 C 编译）"
  - "Makefile 仅做拷贝安装：make install = mkdir -p $(appdir)/awall && cp -a awall* $(appdir)/awall（appdir=share/acf/app）"
  - "上游无测试套件（Alpine aports options='!check' # no test suite），Makefile 无 check 目标"
  - "3 个 .lsp 符号链接（editpolicy/viewpolicy → ../filedetails-html.lsp、status → ../status-html.lsp）指向 acf-core 共享模板，为悬空符号链接，conan package() 需用 os.symlink 重建（同 acf-pingu 先例）"
  - "acf-awall 无 requirements（纯脚本包不声明依赖，运行时由 ACF 框架宿主 acf-core 加载，同 acf-pingu）"
