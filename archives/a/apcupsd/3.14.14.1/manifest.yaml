# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS临时文件兼容性：autotools使用mktemp -d './confXXXXXX'在HMDFS上会失败，需要使用源码内.tmp目录并去掉umask 077"
  - "config.guess/config.sub替换策略：当补丁脚本失败时，可直接替换为已工作的版本"
  - "pthread_cancel平台限制：HarmonyOS/musl不支持pthread_cancel，通过功能检测宏#ifdef HAVE_PTHREAD_CANCEL条件编译（R8合规）"
  - "sbindir硬编码问题：apcupsd的configure将sbindir硬编码为/sbin，需要传--sbindir参数或configure后修改variables.mak"
  - "configure需要shutdown/wall/mail工具：HarmonyOS缺少这些命令，需要创建wrapper脚本或环境变量覆盖"
  - "STRIP变量导致install失败：configure设置STRIP=llvm-strip，install命令将其当源文件，需STRIP=覆盖"
  - "man/col命令缺失：文档安装需要man和col命令，需创建wrapper脚本"

