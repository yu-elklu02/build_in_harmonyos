# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apcupsd/3.14.14.1
homepage: "https://apcupsd.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# apcupsd has no automated test suite; manual testing via apctest
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run apcupsd --version to verify binary functionality"
    command: "apcupsd --version"

# 测试断言总数 (近似值)
assertion_count: 1
