software: aws-c-cal
display: "AWS Crypto Abstraction Layer"
description: "AWS 加密抽象层，提供 HMAC、块加密、哈希、RSA、ECDH 等密码学功能接口"
category: crypto
homepage: "https://github.com/awslabs/aws-c-cal"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，使用 AWS-LC 作为 crypto 后端"
    - "CMakeDeps 需配置 aws-lc→crypto 和 aws-c-common→AWS::aws-c-common 的目标名映射"
    - "需手动设置 CMAKE_MODULE_PATH 指向 aws-c-common 的 CMake 模块目录"
  common_dependencies:
    - aws-c-common
    - aws-lc

versions:
  "0.9.13":
    status: built
    build_date: "2026-08-05"
    published_as: aws-c-cal
    source_url: "https://github.com/awslabs/aws-c-cal/archive/refs/tags/v0.9.13.tar.gz"
