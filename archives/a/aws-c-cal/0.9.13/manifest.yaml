version: "0.9.13"
software: "aws-c-cal"
status: built
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-c-cal/archive/refs/tags/v0.9.13.tar.gz"
  sha256: "80b7c6087b0af461b4483e4c9483aea2e0dac5d9fb2289b057159ea6032409e1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common 0.12.6
    - aws-lc 5.4.0
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "aws-c-cal 依赖 aws-c-common 和 aws-lc（作为 crypto 后端）"
  - "CMakeLists.txt 使用 find_package(crypto REQUIRED)，需要在 Conan 配方中通过 CMakeDeps.set_property 将 aws-lc 的 cmake_file_name 映射为 crypto，cmake_target_name 映射为 AWS::crypto"
  - "aws-c-common 安装 CMake 辅助模块（AwsCFlags 等）到 lib/cmake/aws-c-common/modules/，CMakeDeps 生成的 config 文件不包含此路径，需要通过 CMAKE_MODULE_PATH 变量手动添加"
  - "aws-c-cal 的 CMakeLists.txt 使用 AWS::aws-c-common 目标名，需要在 CMakeDeps 中设置 cmake_target_name"
