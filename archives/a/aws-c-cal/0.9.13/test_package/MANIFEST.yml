# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-c-cal/0.9.13
homepage: "https://github.com/awslabs/aws-c-cal"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# aws-c-cal uses CMake with BUILD_TESTING, tests are in tests/ directory
# BUILD_TESTING=OFF in conanfile.py (library-only build, tests require aws-c-common test harness)
upstream_tests:
  - file: tests/cal_test.c
    source: aws-c-cal-0.9.13/tests/cal_test.c
    description: "aws-c-cal unit tests (HMAC, hash, cipher, ECC, RSA)"
    command: "./cal_test_runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 aws-c-cal 库符号链接和初始化/清理"
    command: "./test_aws-c-cal"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
