package: add-determinism/0.7.3
homepage: "https://github.com/keszybz/add-determinism"

upstream_check_command: "cargo test --release --no-fail-fast"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --no-fail-fast"

upstream_tests:
  - file: tests/
    description: "上游 Rust 测试套件，包括 add-det、linkdupes、文件处理器及 Python stdlib pyc fixture 测试"
    command: "cargo test --release --no-fail-fast"

test_package_tests:
  - file: test_add_determinism.sh
    description: "CLI 冒烟测试：验证 add-det 版本、add-det 帮助和 linkdupes 帮助"
    command: "sh test_add_determinism.sh <bin/add-det> <bin/linkdupes>"

assertion_count: 3
