# 版本级 manifest — adw-gtk 6.5
# 文件位置: archives/a/adw-gtk/6.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.5"
software: adw-gtk

# 编译状态: published | built | failed | archived
# 本轮按要求标记 built（conan-verify 通过，未 upload）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/lassekongo83/adw-gtk3/releases/download/v6.5/adw-gtk3v6.5.tar.xz"
  sha256: "a81780fadfc432be0fc3d89c4ebb41aa28e4f032d42c36f9789c57dd10cfa41c"
  tar_format: tar.xz

# ============================================================
# 三重身份（平台 / 上游 / 归档）
# ============================================================
# 平台身份: adw-gtk / 6.5 / Issue #2015 / 分支 feat/adw-gtk-6.5
# 上游身份: lassekongo83/adw-gtk3（The theme from libadwaita ported to
#           GTK-3）/ tag v6.5（2026-04-13 发布，面向 GNOME 50）/ LGPL-2.1
# 归档身份: Conan adw-gtk/6.5 / archives/a/adw-gtk/6.5
#
# 名称差异说明: 任务平台库名 "adw-gtk" 与上游仓库名 "adw-gtk3" 不同。
# "adw-gtk" 是社区/发行版对该主题的常用别名（Arch Linux 包名即
# adw-gtk-theme，Fedora 为 adw-gtk3-theme），两者指向同一上游项目
# lassekongo83/adw-gtk3 v6.5。归档 Conan 包名采用平台库名 adw-gtk。
# 主题目录内标识符（adw-gtk3 / adw-gtk3-dark）保持上游原名，以便 GTK
# 通过 index.theme 正确解析主题，与 Arch 包安装行为一致。

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  configure_options: []
  # GTK3/GTK4 主题数据包：官方 release tarball 已包含上游 CI 用 sass 编译的
  # 主题产物（gtk-3.0/gtk-4.0 CSS + assets + index.theme），无需本地编译。
  # 本机与 OHOS 构建环境无 sass，故采用数据包方式直接安装官方发布产物。
  dependencies: []
  cc: none

# ============================================================
# 补丁
# ============================================================

patches_applied: []

# ============================================================
# 测试结果（上游测试为 0，见 notes.md 与 test_package/MANIFEST.yml）
# ============================================================

test_results:
  type: official
  total: 0
  passed: 0
  failed: 0

# ============================================================
# 知识引用
# ============================================================

knowledge_ref: []
