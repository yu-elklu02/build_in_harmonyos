software: acf-lib-lua5.5
display: "ACF libraries for Lua 5.5"
description: "Lua 5.5 standard modules for the Alpine Configuration Framework"
category: library
homepage: "https://gitlab.alpinelinux.org/acf/acf-lib"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
