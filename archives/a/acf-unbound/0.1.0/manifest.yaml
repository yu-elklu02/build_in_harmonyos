knowledge_gained:
  - "acf-unbound 为 noarch（纯 Lua+数据+menu/roles），Makefile 仅 cp -a unbound* 复制到 $(appdir)/unbound，无编译目标，无 make check"
  - "源码包内 3 个悬空符号链接（unbound-expert-html.lsp / unbound-logfile-html.lsp / unbound-status-html.lsp → ../xxx.lsp 指向框架公共模板）导致 init-build 双轨目录创建失败；需从 .orig/.work 删除悬空链接"
  - "gitlab.alpinelinux.org Anubis 反爬: conan get() 默认 UA 收到 HTTP 418；配方仅保留官方 HTTPS URL，下载缓存由 CI 处理"
  - "acf-core/unbound 依赖本地缓存已编译（@ohpcd/stable），conan create 本地解析；制品仓未上传前 conan download 失败属正常"
  - "纯 Lua/数据包无 ELF 可执行文件，R38 commands.json 不适用，test_package 用内容标记验证（R34 实质测试）"

