# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: acf-unbound/0.1.0
homepage: "https://gitlab.alpinelinux.org/acf/acf-unbound"

# 上游源码审计：该版本是纯 Lua/数据包，Makefile 只有安装目标。
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile"
    reason: "仅包含 install 及文件复制规则；没有 check/test 目标。"
  - source: "源码树"
    reason: "无 tests/、test/、spec/ 目录，无测试框架或可执行测试入口。"
  - conclusion: "上游未提供自动化测试；由 test_package 执行消费者视角的产物与 ACF API 标记验证。"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# acf-unbound 的 Makefile 无 check/test 目标（纯复制型打包，无编译），无上游测试。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# acf-unbound 上游无官方测试套件；验证手段为安装后手动执行（需 acf-core 运行环境）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_acf_unbound.sh
    description: "验证 4 个 ACF app 产物存在（unbound-controller.lua/unbound-model.lua/unbound.menu/unbound.roles）；controller default_action 钩子、model 加载 acf.fs、menu/roles 权限标记（实质内容非空壳）"
    command: "bash test_acf_unbound.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
