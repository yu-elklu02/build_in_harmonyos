# 软件级 manifest — acf-unbound
# 遵循 ARCHIVE-SPEC v3.0
software: acf-unbound
display: "ACF unbound"
description: |
  Alpine Configuration Framework (ACF) 的 unbound DNS 服务器配置 Web 应用模块。
  纯 Lua + 数据 + menu/roles 包（noarch，无 C 编译），通过 ACF Web 框架
  界面管理 unbound 服务的状态、专家与日志页面。
category: network
homepage: "https://gitlab.alpinelinux.org/acf/acf-unbound"
license: GPL-2.0-only
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Lua/数据包，Makefile 仅 cp -a unbound* 复制到 $(appdir)/unbound，无编译目标、无 make check"
    - "源码包内含 3 个悬空符号链接（unbound-*-html.lsp -> ../xxx.lsp 指向框架公共模板），init 解压后需从 .orig/.work 删除"
    - "gitlab.alpinelinux.org Anubis 反爬：配方仅保留官方 HTTPS URL，下载缓存由 CI 处理"
    - "无 ELF 可执行文件，R38 commands.json 不适用；test_package 用实质内容标记验证（R34）"
  common_dependencies:
    - acf-core
    - unbound

# 版本索引（所有已归档版本，含状态）
versions:
  "0.1.0":
    status: built
    build_date: "2026-08-05"
    conan_ref: "acf-unbound/0.1.0"
