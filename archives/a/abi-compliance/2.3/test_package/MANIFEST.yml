# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: abi-compliance/2.3
homepage: https://lvc.github.io/abi-compliance-checker/

# 上游测试命令
# 上游自带回归测试套件: modules/Internals/RegTests.pm (~20+ 个 C/C++ ABI 破坏场景)
# 通过 `abi-compliance-checker -test` 触发 (README.md "Test suite" 章节)
upstream_check_command: "abi-compliance-checker -test"

# conanfile.py build() 方法中是否已集成上游测试
# 否: 套件需要 gcc/g++ 编译样本库并生成 GCC 专属 translation-unit dump
# (-fdump-lang-raw, clang 不支持), OHOS 工具链仅提供 clang
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: modules/Internals/RegTests.pm
    source: abi-compliance-checker-2.3/modules/Internals/RegTests.pm
    description: "testC(): C ABI 破坏场景 (~103 个: 符号移除/字段变化/参数变化/版本脚本等)"
    command: "abi-compliance-checker -test"
  - file: modules/Internals/RegTests.pm
    source: abi-compliance-checker-2.3/modules/Internals/RegTests.pm
    description: "testCpp(): C++ ABI 破坏场景 (~156 个: 类布局/虚函数/模板/命名空间等)"
    command: "abi-compliance-checker -test"

# 豁免声明 (TEST_QUALITY_SPEC.md L1d / 平台限制)
# 上游套件硬依赖 gcc/g++ 的 -fdump-lang-raw 编译 dump; OHOS 工具链仅提供 clang,
# 无法在本平台运行完整套件。test_package/conanfile.py 在检测到 gcc/g++ 时自动
# 运行完整上游套件; 在 clang-only 环境下执行等效验证 (perl -c 全模块语法检查 +
# 冒烟 + clang 样本库 ABI 差异检测), 并验证上游 harness 仅因缺失 gcc 而退出。
exemptions:
  - rule: "upstream_test_full_run"
    reason: "RegTests.pm 需要 gcc/g++ (-fdump-lang-raw), OHOS 仅提供 clang (平台限制)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "冒烟 (--version/--help/-info) + perl -c 全模块语法检查 + 上游 -test 套件(gcc 可用时) 或等效验证(clang-only)"
    command: "conan test"
  - file: test.sh
    description: "Shell 冒烟: --version/--help 与 perl -c 语法检查"
    command: "sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
