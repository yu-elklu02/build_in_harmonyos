# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
#
# 上游 acf-lib-v0.11.1 不发布测试套件：Alpine aports main/acf-lib APKBUILD
# 声明 `options="!check" # no test suite`；源码无 test/ 目录、无 make check/test
# 目标、无测试框架（luaunit/busted/lust 均无）、无 function test/describe(/it(。
# hmbs 上游清单探测扫描 `assert(` 调用，在 db.lua 命中 10 处（L41/69/82/86/90/
# 100/102/130/134/137）。db.lua 顶部声明 `local function assert (v, m)`
#（L5-11），这些是运行时数据库错误检查，不是测试断言。按守则「只要上游存在测试，
# 就必须接入并在真机完整执行」，test_package 用 luasql.sqlite3 内存桩真实触发
# 全部 10 个 assert 站点，如实统计 discovered/executed/passed/failed/skipped。

package: acf-lib-lua5.4/0.11.1
homepage: "https://gitlab.alpinelinux.org/acf/acf-lib"

# 上游测试命令：db.lua 10 个 assert 站点经 luasql.sqlite3 桩在真机执行
upstream_check_command: "lua-runner upstream_acf_db_test.lua <pkg>"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 db.lua assert 站点在 test_package test() 阶段执行（非 build()）
upstream_test_in_build: false
upstream_test_command: "lua-runner upstream_acf_db_test.lua <pkg>"

# 上游实际运行的测试程序
upstream_tests:
  - file: upstream_acf_db_test.lua
    description: "加载真实上游 db.lua，用 luasql.sqlite3 内存桩真实触发 db.lua 顶部 local assert(v,m)（L5-11）的 10 个调用站点（L41 databaseconnect env:connect / L69 runsqlcommand SAVEPOINT / L82 runsqlcommand ROLLBACK TO / L86 runsqlcommand assert(res,err) error branch / L90 runsqlcommand RELEASE SAVEPOINT / L100 getselectresponse SAVEPOINT / L102 getselectresponse assert(con:execute(sql)) / L130 getselectresponse ROLLBACK TO / L134 getselectresponse assert(res,err) error branch / L137 getselectresponse RELEASE SAVEPOINT）"
    command: "lua-runner upstream_acf_db_test.lua <pkg>"
    discovered: 10
    executed: 10
    passed: 10
    failed: 0
    skipped: 0

# 上游测试审计声明
upstream_tests_exist: true
upstream_test_audit:
  - path: "Makefile"
    finding: "仅 all/clean/dist/install/dist-install 目标，无 check/test 目标"
  - path: "源码树"
    finding: "8 个 .lua 模块文件 + Makefile + config.mk + README，无 test/ 目录、无测试框架（luaunit/busted/lust 均无）、无 function test/describe(/it("
  - path: "Alpine aports main/acf-lib/APKBUILD"
    finding: "options=\"!check\" # no test suite — 上游明确声明无测试套件"
  - path: "db.lua assert 站点审计"
    finding: "db.lua L5-11 声明 `local function assert (v, m)`（运行时错误检查，非测试断言），10 个调用站点：L41 databaseconnect env:connect / L69 runsqlcommand SAVEPOINT / L82 runsqlcommand ROLLBACK TO / L86 runsqlcommand assert(res,err) error branch / L90 runsqlcommand RELEASE SAVEPOINT / L100 getselectresponse SAVEPOINT / L102 getselectresponse assert(con:execute(sql)) / L130 getselectresponse ROLLBACK TO / L134 getselectresponse assert(res,err) error branch / L137 getselectresponse RELEASE SAVEPOINT。其余 7 个 .lua 文件零 assert() 调用"
  - path: "真机执行方式"
    finding: "test_package/upstream_acf_db_test.lua 加载真实上游 db.lua，用 luasql.sqlite3 内存桩（test_package/share/lua/5.4/luasql/sqlite3.lua）真实触发全部 10 个 assert 站点。discovered=10（每个 assert 站点一个）/ executed=10（全部真机触发）/ passed=10（local assert 的 error(m,0) 未意外触发）/ failed=0 / skipped=0"

# test_package 中自带的测试（消费者视角实质验证，R34）
test_package_tests:
  - file: test_acf_lib.lua
    description: "加载 8 个 acf.* 模块（format/fs/html/date/db/processinfo/validator/apk）并验证 format/validator 的纯 Lua API（dostounix/escapemagiccharacters/formatfilesize/is_string/is_ipv4 等）"
    command: "lua-runner test_acf_lib.lua <pkg>"
  - file: test_acf_lib.sh
    description: "包布局检查（share/lua/5.4/acf/*.lua + 兼容性软链接）+ 模块加载功能测试，使用测试桩 posix/subprocess/luasql 满足外部依赖"
    command: "bash test_acf_lib.sh <pkg>"

# 测试断言总数（test_package 33 + 上游 db.lua 10 assert 站点 = 43）
assertion_count: 43
