# conandata.yml — acf-lib-lua5.4 0.11.1
# 上游源码归档与适配补丁声明。
#
# 源码：官方源（Alpine aports acf-lib APKBUILD 同款 gitlab.alpinelinux.org 归档）。
# 上游 config.mk 硬编码 luadir=share/lua/5.2/acf；本包为 lua5.4 子包，
# 通过 patches/0001 将 5.2 调整为 5.4。
# Makefile install 使用 `ln -sf` 覆盖既存链接，HMDFS 不支持（E077），
# 通过 patches/0002 改为 `rm -f && ln -s` 安全模式。

sources:
  url: "https://gitlab.alpinelinux.org/acf/acf-lib/-/archive/v0.11.1/acf-lib-v0.11.1.tar.gz"
  sha256: "0b89ffa3ccfc4d15c10686ead182ecfcaf78f9600028a6175573078a7a8def48"

patches:
  - patch_file: "patches/0001-config.mk-luadir-5.2-to-5.4.patch"
    patch_description: "将 config.mk 的 luadir 由 share/lua/5.2/acf 调整为 share/lua/5.4/acf，匹配本 lua5.4 子包的模块搜索路径"
    patch_type: "portability"
    sha256: "045d40e7f2579a9c734b073ecb0f05f688d160a3d0fe7b690707a490de2f7673"
  - patch_file: "patches/0002-Makefile-install-ln-sf-to-rm-and-ln-s.patch"
    patch_description: "Makefile install 的兼容性软链接由 `ln -sf` 改为 `rm -f && ln -s`，规避 HMDFS 不支持覆写既存软链接（E077）"
    patch_type: "portability"
    sha256: "022d7cd4cdd40dd5bf1937c1751b2c12faf5ff433befd75acfd2e77850644385"
