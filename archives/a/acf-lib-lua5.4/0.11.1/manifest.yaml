# 版本级 manifest — acf-lib-lua5.4 0.11.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.11.1"
software: "acf-lib-lua5.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方源：Alpine aports APKBUILD 使用的正式源码地址）
  url: "https://gitlab.alpinelinux.org/acf/acf-lib/-/archive/v0.11.1/acf-lib-v0.11.1.tar.gz"
  # 源码校验和（与官方 tarball 一致）
  sha256: "0b89ffa3ccfc4d15c10686ead182ecfcaf78f9600028a6175573078a7a8def48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：扁平 Makefile（8 个 .lua 文件复制 + 软链接）
  system: makefile
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.4.8
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-config.mk-luadir-5.2-to-5.4.patch"
  - "0002-Makefile-install-ln-sf-to-rm-and-ln-s.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "上游 config.mk 硬编码 luadir=share/lua/5.2/acf，lua5.4 子包需补丁调整为 5.4"
  - "acf-lib 是纯 Lua 库，make all 无实际编译，make install DESTDIR 仅复制 .lua 文件 + 软链接"
  - "上游无测试套件（aports options='!check' # no test suite）"
  - "运行时需外部 Lua 模块 posix/subprocess/luasql.*（制品仓暂无 lua5.4 版配方）"
  - "Makefile install 的 ln -sf 在 HMDFS 不支持覆写既存软链接（E077），改为 rm -f && ln -s"
