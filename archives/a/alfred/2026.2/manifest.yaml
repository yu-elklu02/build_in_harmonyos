# alfred 2026.2 适配清单
# open-mesh alfred（Almighty Lightweight Fact Remote Exchange Daemon），
# batman-adv 网格网络的分布式信息共享守护进程/客户端（C，Makefile 构建）。
# 依赖 libnl-3（netlink）+ libcap（capabilities），均已发布制品仓；
# gpsd 可选子程序禁用（CONFIG_ALFRED_GPSD=n）。

version: "2026.2"
status: built

source:
  url: "https://downloads.open-mesh.org/batman/releases/batman-adv-2026.2/alfred-2026.2.tar.gz"
  sha256: "d995748be5f62a42091525ccc102df5ac642186e9b9014698a955a4469b69b96"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CONFIG_ALFRED_GPSD=n"
  cc: clang
  notes: "pkg-config 查找 libnl-3.0/libnl-genl-3.0/libcap（libnl/3.7.0 + libcap/2.69 已发布 ohpcd）；CONFIG_ALFRED_GPSD=n 禁用 gpsd 可选子程序"

dependencies:
  - libnl/3.7.0
  - libcap/2.69

patches_applied: []

test:
  upstream_cases: 0
  upstream_suite: "上游无测试套件（仅 man page）"
  runnable: 0
  runnable_note: "上游无独立测试目录"
  pass_rate: "0/0 = N/A（上游无测试套件）"
  consumer_test: "test_package 运行 alfred --help（R34 反空壳：test_alfred.c popen 执行 alfred --help 校验输出）"
  local_verification: "本地 conan create（ohos-aarch64 同构）完整通过：make 构建 + test_package PASSED；CI #20357 失败为 Worker 环境问题（lld 加载 libxml2.so.16 失败），非代码缺陷"

knowledge_gained:
  - "alfred 依赖 libnl-3/libnl-genl-3（pkg-config libnl-3.0/libnl-genl-3.0），libnl/3.7.0 已发布 ohpcd 且配方带 pkg_config_name，可直接 requires"
  - "libcap 用于 capabilities 特性（pkg-config libcap），libcap/2.69 已发布 ohpcd"
  - "gpsd 子程序（alfred-gpsd）依赖 gpsd 库，CONFIG_ALFRED_GPSD=n 禁用避免额外依赖"
  - "batadv-vis 子程序（vis/）与主程序共用 libnl 依赖，随 make 构建"
