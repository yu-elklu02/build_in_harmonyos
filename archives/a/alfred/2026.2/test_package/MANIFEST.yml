# alfred/2026.2 test_package
# Verifies alfred binary is installed and executable

package: alfred/2026.2
homepage: "https://www.open-mesh.org/projects/alfred"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_alfred.c
    description: "验证 alfred 二进制存在且可执行（alfred --help），R34 反空壳：test() 用 self.run() 真实执行被测包二进制"
    command: "<alfred_bin> --help  # test_package/conanfile.py test() 定位 bin/alfred 并执行 --help"

assertion_count: 1
