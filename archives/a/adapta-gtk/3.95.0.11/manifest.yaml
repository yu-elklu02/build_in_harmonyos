# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "adapta-gtk-theme 是 GTK 主题数据包（autotools），构建期依赖 sassc（SCSS→CSS）与 inkscape（SVG→PNG 按 id 导出渲染 189+ 资产）；OHOS 构建环境无 sassc/inkscape 且无任何可安装途径（制品仓无配方、cmd-pkgs 无预编译、pip libsass wheel 构建失败、imagemagick 不支持按 SVG id 导出），无法从源码完整构建 (knowledge_ref: notes.md 构建说明)"
  - "GTK 主题数据包先例（adw-gtk 6.5、adw-gtk3 6.5）：上游 release 已含编译 CSS 时直接数据打包；adapta-gtk-theme 3.95.0.11 上游 release 只有 SCSS/SVG 源码，故采用发行版编译产物作为数据源。CI #18008 二次修复：Arch .tar.zst 需 Python zstandard 原生扩展，其 .so 被 OHOS code-signature 拒绝（Permission denied），改用 FreeBSD 官方包（.pkg 为 xz 压缩 tar，Python 标准库 tarfile 直接解压，零第三方依赖） (knowledge_ref: conandata.yml sources.theme)"
  - "上游 GTK 主题数据包无自动化测试（无 test 目录、无 TESTS/check_PROGRAMS/make check），上游测试数=0；消费者验证由 test_package/test_theme.py 补齐（index.theme/GtkTheme 映射、gtk-3.x CSS 与 gresource、gtk-2.0 rc、DE/WM 资产、许可证） (knowledge_ref: test_package/MANIFEST.yml)"
  - "OHOS 上 Python 原生扩展（pip wheel 的 .so）未签名时会被 code-signature 检查拒绝（EACCES/Permission denied，display-sign 可确认 self-sign/not found）；配方应优先使用标准库或系统工具可处理的归档格式，避免运行时 pip 安装原生扩展 (knowledge_ref: conanfile.py source)"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
