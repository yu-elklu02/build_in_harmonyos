# ============================================================
# 源码信息
# ============================================================

source:
  # 平台库名 adapta-gtk 对应上游真实项目 adapta-project/adapta-gtk-theme
  # （"An adaptive Gtk+ theme based on Material Design Guidelines"），tag 3.95.0.11。
  # 上游源码 tarball（官方 release 源码）：
  url: "https://github.com/adapta-project/adapta-gtk-theme/archive/refs/tags/3.95.0.11.tar.gz"
  sha256: "fb8fc11b770be59e1673b8f2d917704fc34e53aee5fb02fed70d83909d3309bd"
  tar_format: tar.gz
  # 主题数据包：上游源码构建需 sassc（SCSS→CSS）+ inkscape（SVG→PNG），
  # OHOS 构建环境两者均不可用（无 conan 配方、cmd-pkgs 无预编译、pip libsass
  # wheel 构建失败），故按仓库 adw-gtk 6.5 / adw-gtk3 6.5 主题数据包先例，
  # 使用与上游同一 tag 3.95.0.11 的编译主题数据（FreeBSD 官方二进制包
  # adapta-gtk-theme-3.95.0.11_5.pkg，pkg.freebsd.org quarterly 仓库，由
  # sassc+inkscape 从同一上游 tag 构建；_5 为 FreeBSD port revision，内容为
  # 上游编译产物，见 conandata.yml 与 notes.md 的身份映射说明）。

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  configure_options: []
  # 主题数据包：无编译依赖（无 C/C++ 目标，构建期为纯数据拷贝）
  dependencies: []
  cc: clang
  cxx: clang++

