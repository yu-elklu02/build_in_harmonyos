# conandata.yml — adapta-gtk 3.95.0.11
# 主题数据包（GTK theme data package），无编译。
#
# 平台库名 adapta-gtk 对应的上游真实项目为 adapta-project/adapta-gtk-theme
# （"An adaptive Gtk+ theme based on Material Design Guidelines"），tag 3.95.0.11。
# 上游源码 release tarball 只含 SCSS/SVG 源（CSS 由 sassc 生成、PNG 资产由
# inkscape 渲染），而 OHOS 构建环境无 sassc/inkscape（制品仓无配方、cmd-pkgs
# 无预编译包、pip libsass wheel 构建失败），无法从源码完整构建。
#
# 因此参照仓库同类主题数据包先例（adw-gtk 6.5 / adw-gtk3 6.5），采用
# 与上游同一 tag 的已编译主题数据：FreeBSD 官方二进制包
# adapta-gtk-theme-3.95.0.11_5.pkg（pkg.freebsd.org quarterly 仓库，由
# sassc+inkscape 从同一上游 tag 3.95.0.11 构建；_5 为 FreeBSD port revision，
# 内容为上游编译产物）。包内 usr/local/share/themes/ 下即四个完整主题变体
# （Adapta / Adapta-Nokto / Adapta-Eta / Adapta-Nokto-Eta）。
#
# 数据源选择（CI #18008 二次修复）：原 Arch Linux .tar.zst 源需要 Python
# zstandard 原生扩展解压，其 .so 被 OHOS code-signature 检查拒绝
# （ImportError: Permission denied）。FreeBSD .pkg 是 xz 压缩的 tar 归档，
# Python 标准库 tarfile 可直接解压，无需任何第三方原生扩展。已核验
# quarterly 与 latest 分支包内容哈希一致，且 index.theme / gtk.css /
# gtk.gresource / GPLv2 / CC-BY-SA-4.0 与上游编译产物逐字节一致。
# pkg.freebsd.org 为 FreeBSD 官方仓库，URL 可复现、SHA256 已本地核验。
#
# 许可证：GPL-2.0（COPYING）+ CC-BY-SA-4.0（LICENSE_CC_BY_SA4），
# 从上游官方仓库 tag 3.95.0.11 单独下载并核验 SHA256（同 adw-gtk 先例）。

