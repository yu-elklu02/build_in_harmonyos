# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adapta-gtk/3.95.0.11
homepage: "https://github.com/adapta-project/adapta-gtk-theme"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试入口统计（实际仓库核查结果，2026-08-10）:
#   - 上游源码 tarball (tag 3.95.0.11, 456 文件) 无 test/ 或 tests/ 目录
#     （TEST_DIR_COUNT=0）
#   - 顶层与各子目录 Makefile.am / configure.ac 中无 TESTS / check_PROGRAMS /
#     make check / check-local 定义（grep 全部无命中）
#   - 上游是 autotools 构建的 GTK 主题数据包：构建期用 sassc（SCSS→CSS）
#     与 inkscape（SVG→PNG 资产渲染），无 C/C++ 编译目标、无测试套件、
#     无 --version 等 CLI 入口
#   - 主题数据包（参照 adw-gtk 6.5 / adw-gtk3 6.5 先例），平台构建环境
#     无 sassc/inkscape，故采用上游同 tag 的编译主题数据（Arch any 包）
#   - 结论: 上游官方测试数 = 0（GTK 主题数据包，无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_theme.py
    description: "GTK 主题数据包消费者验证：四个主题变体（Adapta/Adapta-Nokto/Adapta-Eta/Adapta-Nokto-Eta）index.theme 与 GtkTheme 映射 / gtk-3.0/3.22/3.24 CSS 与 gtk.gresource 非空 / gtk-2.0 rc / gnome-shell/metacity/xfwm4/cinnamon 资产 / GPL-2.0 与 CC-BY-SA-4.0 许可证"
    command: "python3 test_theme.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 38
