# 版本级 manifest — adms 2.3.7
# 遵循 ARCHIVE-SPEC v3.0

version: "2.3.7"
software: "adms"

# 编译状态
# published | built | failed | archived
# 真机预检通过前为 adapting，通过后由 HMBS 更新
status: adapting

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-11"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源: Qucs/ADMS GitHub Release（上游正式发布归档）
  url: "https://github.com/Qucs/ADMS/releases/download/release-2.3.7/adms-2.3.7.tar.gz"

  # 源码校验和（本地实测下载归档计算，与 FreeBSD 等发行版一致）
  sha256: "3a78e1283ecdc3f356410474b3ff44c4dcc82cb89772087fd3bbde8a1038ce08"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-skip-build-tools-check.patch"

# ============================================================
# 测试信息
# ============================================================

tests:
  upstream_tests: 2
  upstream_description: "admsCheck 自检（生成 dummy.va/dummy.xml）+ admsXml 转换 dummy.va -e dummy.xml → dummy.net，已在 build() 中接入"
  added_consumer_scenarios: 2
  added_consumer_assertions: 4

# ============================================================
# 知识沉淀
# ============================================================

knowledge_ref: []
knowledge_gained:
  - "adms 发布包已内置生成好的 parser/lexer 源码（verilogaYacc.c 等），configure 对 flex/bison/perl+XML::LibXML 的检查可直接跳过，无需安装这些工具"
  - "OHOS 上 config.guess 不识别平台，configure 需加 --build=aarch64-unknown-linux-gnu（与 bash 配方同法）"
  - "上游无 make check 自动化测试（Makefile 无 TESTS），测试接入方式为运行上游自带 admsCheck 程序 + admsXml dummy.va 转换流程"
