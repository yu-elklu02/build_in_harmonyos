patches:
  - patch_file: "patches/0001-configure-skip-build-tools-check.patch"
    patch_description: "跳过 configure 对 flex/bison/perl+XML::LibXML 的硬性检查（发布包已内置生成好的 parser/lexer 源码，构建无需这些工具）"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-hmdfs-pwd-tmpdir.patch"
    patch_description: "HMDFS 适配：configure 的 pwd 判定在 getcwd() 失败时回退 $PWD（真机父目录不可达导致 working directory cannot be determined）；config.status 临时目录 umask 077→022（HMDFS setgid 下 0700+setgid 目录连属主都不可写）"
    patch_type: "portability"
