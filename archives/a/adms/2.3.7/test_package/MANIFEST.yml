# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adms/2.3.7
homepage: https://github.com/Qucs/ADMS

# 上游测试命令
# 上游 Makefile 无 TESTS 变量（make check 只构建 BUILT_SOURCES），
# 但上游自带测试程序 admsCheck（admsXml/Makefile.am 注释 "Rules to create the admsCheck test program"）
# 与示例转换流程 dummy.va + dummy.xml → dummy.net（admsCheck.c 中 documented）。
upstream_check_command: "admsCheck && admsXml dummy.va -e dummy.xml"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "admsCheck && admsXml dummy.va -e dummy.xml"

# 上游实际运行的测试程序（adms 2.3.7 无 make check TESTS 自动化）
upstream_tests:
  - name: "admsCheck"
    source: adms-2.3.7/admsXml/admsCheck.c
    description: "adms 自带测试程序：生成 dummy.va/dummy.xml 并验证数据完整（非空）"
  - name: "dummy-transform"
    source: adms-2.3.7/admsXml/dummy.va
    description: "admsXml 解析 dummy.va 并用 dummy.xml 控制脚本生成 dummy.net（非空）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_adms.py
    description: "admsXml --version 版本校验；admsCheck 生成 dummy.va/dummy.xml（非空）；admsXml 转换 dummy.va -e dummy.xml 生成 dummy.net（非空）"
    command: "python test_adms.py <admsXml路径> <admsCheck路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
