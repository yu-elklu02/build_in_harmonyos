# 软件级 manifest — adms
# 遵循 ARCHIVE-SPEC v3.0

software: adms
display: "adms"
description: "ADMS (Automatic Device Model Synthesizer) 将 Verilog-AMS 紧凑器件模型转换为可直接编译的 C 代码（用于 SPICE 仿真器）"
category: build-tool
homepage: "https://github.com/Qucs/ADMS"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "发布包内置生成好的 parser/lexer 源码，configure 对 flex/bison/perl+XML::LibXML 的检查可跳过（补丁 0001）"
    - "configure 需加 --build=aarch64-unknown-linux-gnu（config.guess 不识别 OHOS）"
    - "工具默认静态链接（--enable-static --disable-shared），避免 .so 运行时缺失"
    - "上游无 make check 自动化测试，接入上游自带 admsCheck + admsXml dummy.va 转换流程"
  common_dependencies: []

versions:
  "2.3.7":
    status: adapting
    build_date: "2026-08-11"
    conan_ref: "adms/2.3.7"
