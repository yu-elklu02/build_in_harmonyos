package: a52dec/0.7.4
homepage: "https://liba52.sourceforge.net/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: regression
    command: "test/regression"
    expected: "skip when a52dec-streams test data is unavailable"
  - name: compile
    command: "test/compile"
    expected: "skip when source archive fixtures are unavailable"
  - name: globals
    command: "test/globals"
    expected: "pass"

test_package_tests:
  - file: test.c
    description: "Call liba52 API with valid and invalid AC-3 sync headers"
    command: "./a52dec_test"

assertion_count: 3
