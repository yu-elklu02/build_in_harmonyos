sources:
  url: "https://deb.debian.org/debian/pool/main/a/a52dec/a52dec_0.7.4.orig.tar.gz"
  sha256: "a21d724ab3b3933330194353687df82c475b5dfb997513eef4c25de6c865ec33"

patches:
  - patch_file: "patches/0001-config-sub-aarch64.patch"
    patch_description: "Accept modern aarch64 host triples in the bundled config.sub"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Use umask 022 for config.status tmp dir (setgid hmdfs makes umask 077 dirs unwritable)"
    patch_type: "portability"
  - patch_file: "patches/0003-globals-grep-ere.patch"
    patch_description: "Use ERE grep -Ev '^_?a52_' in globals test (BRE '\\?' is treated literally in conan make check env)"
    patch_type: "portability"
