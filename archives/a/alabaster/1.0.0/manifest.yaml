knowledge_gained:
  - "alabaster 是纯 Python Sphinx 主题（HTML 模板 + theme.conf + Pygments 样式），pip install --prefix 即可打包"
  - "上游 sdist 无任何测试文件（无 test/ 目录），test_package 补全 7 个消费者测试"
  - "theme.conf 由 configparser 解析，[theme] 段含 inherit=basic；HTML 模板文件必须随包保留"
  - "setup() 钩子 require_sphinx('6.2')，测试用 FakeApp 模拟 Sphinx app 对象即可验证注册流程，无需真实 Sphinx"
  - "pygments 是 support.py 的运行依赖（Alabaster Style 类），需在 build() 阶段 pip 安装"

