# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alabaster/1.0.0
homepage: "https://alabaster.readthedocs.io/"

# 上游 sdist 无任何测试文件（纯 Python 主题包：alabaster/*.py + HTML 模板），
# 故上游测试命令为空，L1 验证由 test_package 承担（补全消费者测试）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 补全测试说明：上游无测试用例，适配后新增 7 个消费者测试
supplementary_tests:
  - file: test_package/test_alabaster.py
    count: 7
    description: >-
      import 与版本校验、get_path() 主题目录、HTML 模板文件完整性、
      theme.conf 配置解析、Sphinx setup() 钩子注册（FakeApp 模拟）、
      update_context() 上下文注入、Pygments 样式类。均不依赖真实
      Sphinx 文档构建，可在 OHOS 受限环境运行。
