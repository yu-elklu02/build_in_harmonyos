package: avrdude/8.1
homepage: https://github.com/avrdudes/avrdude
upstream_check_command: "printf '\\n\\n' | tools/test-avrdude -v -e build/src/avrdude -c '-C build/src/avrdude.conf' -d0 -p'-cdryrun -pm2560' -p'-cdryrun -pavr64du28'"
upstream_test_in_build: true
upstream_test_command: "tools/test-avrdude (2 no-hardware dryrun scenarios)"
upstream_tests:
  - file: tools/test-avrdude
    source: avrdude-8.1.tar.gz/tools/test-avrdude
    description: "Official no-hardware dryrun functional test for ATmega2560"
    command: "tools/test-avrdude -p '-cdryrun -pm2560'"
  - file: tools/test-avrdude
    source: avrdude-8.1.tar.gz/tools/test-avrdude
    description: "Official no-hardware dryrun functional test for AVR64DU28"
    command: "tools/test-avrdude -p '-cdryrun -pavr64du28'"
test_package_tests:
  - file: test.sh
    description: "Execute AVRDUDE without hardware and verify version output"
    command: "avrdude --version"
  - file: test.sh
    description: "Select the Arduino programmer and verify the built-in POSIX serial backend reaches a nonexistent device"
    command: "avrdude -C avrdude.conf -c arduino -p m328p -P /dev/ohpcd-avrdude-no-device -n"
assertion_count: 4
