# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游审计结论: gghnicole/aliddns 仓库中无任何测试套件
#   - tools/po2lmo/Makefile 无 test/check 目标
#   - 无 configure/cmake BUILD_TESTING 开关
#   - 无 test/、tests/、spec/ 目录
#   - 上游主程序是 shell 蚝本，无测试框架
#   - 仓库仅 1 次 commit (2020-04-17)，无 CI 配置
# 因此按知识图谱规范声明 upstream_tests_exist: false。

package: aliddns/20200417
homepage: "https://github.com/ghnicole/aliddns"

# 上游测试命令 (上游无测试，此处留空并置 audit)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无任何测试套件 — 显式声明
upstream_tests_exist: false

upstream_test_audit:
  - "审计 tools/po2lmo/Makefile：仅有 po2lmo/install/clean 三个目标，无 test/check"
  - "审计 tools/po2lmo/src/*.c：无 main() 之外的测试函数，无条件编译测试开关"
  - "审计仓库根 Makefile：OpenWrt package.mk 体系，Build/Compile 为空，无测试集成"
  - "审计仓库结构：无 test/、tests/、spec/、cmake/ 目录，无 BUILD_TESTING/CHECK 选项"
  - "仓库仅 1 次 commit (sha 1f9d0536ae6162c66e9fcf7c170da7663d954880, 2020-04-17)，无 CI 配置文件"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 po2lmo 工具)
test_package_tests:
  - file: test_aliddns.c
    description: "最小化复现上游 sfh_hash 哈希函数，断言其确定性（相同输入相同哈希，不同输入不碰撞）"
    command: "./test_aliddns"
  - file: conanfile.py
    description: "调用真实 po2lmo 二进制转换 .po 样本到 .lmo，校验输出非空且尾部偏移在文件范围内；含 round-trip 确定性检查"
    command: "po2lmo sample.po sample.lmo"

# 测试断言总数 (近似值, 用于质量评估)
# test_aliddns.c: 2 个断言 (hash 确定性 + 无碰撞)
# conanfile.py test(): 4 个断言 (输出存在 + 非空 + 偏移合法 + round-trip)
assertion_count: 6
