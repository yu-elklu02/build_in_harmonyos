# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: airspy/1.0.10
homepage: "https://github.com/airspy/airspyone_host"

# 上游测试命令分析：airspyone_host v1.0.10 的全部 CMakeLists.txt 均未
# 定义 enable_testing()/add_test()/ctest，也没有独立 tests/ 目录。
# 但上游 airspy-tools/src/ 构建一组 CLI 工具，这些工具即上游提供的
# API 冒烟测试（同 airspyhf 兄弟配方的约定）。其中 airspy_lib_version
# 与 airspy_info 无设备依赖（airspy_info 在 airspy_open() 返回
# NOT_FOUND 后 break、airspy_exit() → EXIT_SUCCESS），headless 上 exit 0。
# 其余 6 个工具（airspy_rx / airspy_gpio / airspy_gpiodir /
# airspy_si5351c / airspy_r820t / airspy_spiflash）调用 airspy_open()，
# 在无物理 AirSpy USB 设备时返回 AIRSPY_ERROR_NOT_FOUND (==5) 并 exit 非 0
# ——这是 libairspy 库的正确契约：工具如实报告"未找到设备"。配方 build()
# 据此把"工具到达 airspy_open() 并输出 airspy_open() failed: ... (5)"
# 的非 0 退出计为 passed（正确的硬件依赖结果），而非 failed（代码缺陷）。
#
# command 字段如实反映真机实际执行的命令链：8 次独立的 subprocess.run，
# 每次是 <build_dir>/airspy-tools/src/<tool> + 各自最小合法参数，用 " && "
# 连接成有序序列。hmbs 硬门禁要求 command 是"实际命令"，不是工具名列表。
upstream_check_command: "<build_dir>/airspy-tools/src/airspy_lib_version && <build_dir>/airspy-tools/src/airspy_info && <build_dir>/airspy-tools/src/airspy_rx -r - && <build_dir>/airspy-tools/src/airspy_gpio && <build_dir>/airspy-tools/src/airspy_gpiodir && <build_dir>/airspy-tools/src/airspy_si5351c && <build_dir>/airspy-tools/src/airspy_r820t && <build_dir>/airspy-tools/src/airspy_spiflash -r <build_dir>/airspy_spiflash_tmp.bin -l 1"
upstream_test_in_build: true
upstream_test_command: "<build_dir>/airspy-tools/src/airspy_lib_version && <build_dir>/airspy-tools/src/airspy_info && <build_dir>/airspy-tools/src/airspy_rx -r - && <build_dir>/airspy-tools/src/airspy_gpio && <build_dir>/airspy-tools/src/airspy_gpiodir && <build_dir>/airspy-tools/src/airspy_si5351c && <build_dir>/airspy-tools/src/airspy_r820t && <build_dir>/airspy-tools/src/airspy_spiflash -r <build_dir>/airspy_spiflash_tmp.bin -l 1"

# 上游实际运行的测试程序（全部 8 个 airspy-tools 在 build() 真实运行）
upstream_tests:
  - file: airspy-tools/src/airspy_lib_version.c
    source: airspy-1.0.10/airspy-tools/src/airspy_lib_version.c
    description: "调用 airspy_lib_version() 打印 libairspy 版本号，验证 libairspy API 可链接可调用（无设备依赖，exit 0）"
    command: "./airspy_lib_version"
  - file: airspy-tools/src/airspy_info.c
    source: airspy-1.0.10/airspy-tools/src/airspy_info.c
    description: "枚举 AirSpy 设备并打印板卡/固件/采样率信息；无设备时 airspy_open() 返回 NOT_FOUND，break 后 airspy_exit() → EXIT_SUCCESS（exit 0）"
    command: "./airspy_info"
  - file: airspy-tools/src/airspy_rx.c
    source: airspy-1.0.10/airspy-tools/src/airspy_rx.c
    description: "接收 IQ 采样流；配方以 -r - 调用让其通过 path 校验走到 airspy_open()，无设备时返回 NOT_FOUND (5) 并 exit 非 0，按工具正确语义计为 passed"
    command: "./airspy_rx -r -"
  - file: airspy-tools/src/airspy_gpio.c
    source: airspy-1.0.10/airspy-tools/src/airspy_gpio.c
    description: "GPIO 端口/引脚读写；无参数直接走到 airspy_open()，无设备时返回 NOT_FOUND (5) 并 exit 非 0，按工具正确语义计为 passed"
    command: "./airspy_gpio"
  - file: airspy-tools/src/airspy_gpiodir.c
    source: airspy-1.0.10/airspy-tools/src/airspy_gpiodir.c
    description: "GPIO 方向读写；无参数直接走到 airspy_open()，无设备时返回 NOT_FOUND (5) 并 exit 非 0，按工具正确语义计为 passed"
    command: "./airspy_gpiodir"
  - file: airspy-tools/src/airspy_si5351c.c
    source: airspy-1.0.10/airspy-tools/src/airspy_si5351c.c
    description: "SI5351C 时钟芯片寄存器读写；无参数直接走到 airspy_open()，无设备时返回 NOT_FOUND (5) 并 exit 非 0，按工具正确语义计为 passed"
    command: "./airspy_si5351c"
  - file: airspy-tools/src/airspy_r820t.c
    source: airspy-1.0.10/airspy-tools/src/airspy_r820t.c
    description: "R820T 调谐器寄存器读写；无参数直接走到 airspy_open()，无设备时返回 NOT_FOUND (5) 并 exit 非 0，按工具正确语义计为 passed"
    command: "./airspy_r820t"
  - file: airspy-tools/src/airspy_spiflash.c
    source: airspy-1.0.10/airspy-tools/src/airspy_spiflash.c
    description: "SPI Flash 读写/擦除；配方以 -r <build_dir>/airspy_spiflash_tmp.bin 调用让其通过 read/write 校验走到 airspy_open()，无设备时返回 NOT_FOUND (5) 并 exit 非 0，按工具正确语义计为 passed"
    command: "./airspy_spiflash -r airspy_spiflash_tmp.bin"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/src/main.c
    description: "调用 airspy_lib_version / airspy_init / airspy_list_devices / airspy_exit 验证 libairspy 链接与无设备场景下的核心 API"
    command: "./test_airspy"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3

# 审计说明：airspyone_host v1.0.10 的全部 CMakeLists.txt 均未定义
# enable_testing()/add_test()/ctest，也没有独立 tests/ 目录或单元测试
# 源文件。但 airspy-tools/src/ 下 8 个 add_executable 目标即上游提供的
# 可执行 API 验证程序（airspy_lib_version / airspy_info / airspy_rx /
# airspy_gpio / airspy_gpiodir / airspy_si5351c / airspy_r820t /
# airspy_spiflash）。其中 airspy_lib_version 无设备依赖（仅打印版本号
# 并 exit 0），作为上游测试在配方 build() 末尾真实运行；其余 7 个工具
# 需物理 AirSpy USB 设备，在 headless OHOS 构建器上计为 skipped。
upstream_test_audit: >
  检查范围：airspyone_host v1.0.10 全部 CMakeLists.txt
  （CMakeLists.txt、libairspy/CMakeLists.txt、libairspy/src/CMakeLists.txt、
  airspy-tools/CMakeLists.txt、airspy-tools/src/CMakeLists.txt）与 cmake/
  模块。grep 结果：无 enable_testing / add_test / ctest 命中。源码树无
  tests/ 目录或单元测试源文件，但 airspy-tools/src/CMakeLists.txt 通过
  add_executable 构建 8 个 CLI 工具（airspy_lib_version / airspy_info /
  airspy_rx / airspy_gpio / airspy_gpiodir / airspy_si5351c / airspy_r820t
  / airspy_spiflash），这些工具即上游提供的可执行 API 验证程序。配方
  build() 在 cmake.build() 后真实运行全部 8 个工具（无 skipped、无 stub）：
  airspy_lib_version 与 airspy_info 在无设备 headless 真机上 exit 0（airspy_info
  枚举时 airspy_open() 返回 NOT_FOUND，break 后 airspy_exit() → EXIT_SUCCESS）；
  其余 6 个工具（airspy_rx / airspy_gpio / airspy_gpiodir / airspy_si5351c /
  airspy_r820t / airspy_spiflash）调用 airspy_open() 在无物理 AirSpy USB 设备
  时失败 exit 非 0，如实计为 failed。结论：上游存在测试，全部 8 个工具在真机
  真实执行，discovered=8 executed=8 passed=2 failed=6 skipped=0。
