# manifest.yaml — airspy 1.0.10（版本级）
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# Conan 引用
conan_ref: "airspy/1.0.10"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/airspy/airspyone_host/archive/refs/tags/v1.0.10.tar.gz"
  sha256: "fcca23911c9a9da71cebeffeba708c59d1d6401eec6eb2dd73cae35b8ea3c613"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "libusb/1.0.27"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-libairspy-src-CMakeLists-install-guard.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 在 HarmonyOS 上不设置 UNIX 变量，libairspy 的 install 目标被 if(${UNIX}) 跳过，需改为 if(NOT WIN32)"
  - "CMAKE_SYSTEM_NAME=Linux 别名解决 CMake 不识别 HarmonyOS 的问题（E092）"
  - "上游 cmake_minimum_required(2.8)，CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "上游 cmake/modules/FindUSB1.cmake 用 LIBUSB_INCLUDE_DIR / LIBUSB_LIBRARIES cache 变量；未注入时 find_path 返回 NOTFOUND，CMake Generate 在 relative '<...>-NOTFOUND' include 路径上失败。改为 self.requires('libusb/1.0.27') 并在 generate() 把依赖包的 include/lib 路径写进这两个 cache 变量（与 airspyhf 同款）"
