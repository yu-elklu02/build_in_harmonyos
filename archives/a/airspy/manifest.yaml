software: airspy
display: "AirSpy libairspy"
description: "AirSpy user-mode driver (libairspy) and associated SDR tools"
category: system
homepage: "https://github.com/airspy/airspyone_host"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 在 HarmonyOS 上不设置 UNIX 变量，需将 if(${UNIX}) 改为 if(NOT WIN32) 才能触发 libairspy 的 install 目标"
    - "CMAKE_SYSTEM_NAME=Linux 可解决 CMake 不识别 HarmonyOS 的问题（E092）"
    - "上游 cmake_minimum_required(2.8)，需 CMAKE_POLICY_VERSION_MINIMUM=3.5 以兼容 CMake 4.x"
    - "libusb-1.0 作为系统库声明在 cpp_info.system_libs，制品仓无对应 Conan 包"
  common_dependencies:
    - libusb

versions:
  "1.0.10":
    status: built
    build_date: "2026-08-08"
    conan_ref: "airspy/1.0.10"
