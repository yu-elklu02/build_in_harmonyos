# test_package/MANIFEST.yml — alac 0.0.7
# CI L0e 要求此文件存在（上游测试声明）

package: alac/0.0.7
homepage: "https://github.com/macosforge/alac"

# 上游无正式测试框架：macosforge/alac 仅含 codec/ 源码和 makefile（构建 libalac.a），
# 无 test/ tests/ 目录，无 ctest/make check 目标，上游测试为 0/0 (N/A)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 自带测试（消费者视角）：实例化 ALACDecoder 并链接 libALAC.a
# 实际入口: test_package.cpp → 编译链接生成 test_package 可执行文件
# conan create 中 test() 实际执行 ./test_package，退出码 0
test_package_tests:
  - file: test_package.cpp
    description: "实例化 ALACDecoder 对象，验证头文件包含、静态库 libALAC.a 链接与运行（退出码 0）"
    command: "./test_package"

# 断言数：1（ALACDecoder 实例化 + 链接 + 运行退出码 0），与本地 conan create 验证一致
assertion_count: 1
