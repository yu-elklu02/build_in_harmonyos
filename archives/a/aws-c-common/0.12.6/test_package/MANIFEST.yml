# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-c-common/0.12.6
homepage: "https://github.com/awslabs/aws-c-common"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: aws-c-common-0.12.6/tests/
    description: "aws-c-common 内置单元测试套件"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "初始化和清理 aws-c-common 库，验证库可正常链接和初始化"
    command: "./test_aws-c-common"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
