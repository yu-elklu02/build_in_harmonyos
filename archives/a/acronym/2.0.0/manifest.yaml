# 版本级 manifest
# 文件位置: archives/a/acronym/2.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.0"

# 软件名
software: acronym

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: python3

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI sdist，官方发布物）
  url: "https://files.pythonhosted.org/packages/source/a/acronym/acronym-2.0.0.tar.gz"

  # 源码校验和
  sha256: "163cc1630b7c65cbca6426f80e267f5253ea787e17a329d1d55517868897bbf1"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python，pip/setuptools）
  system: python3

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（运行时由 Python 环境解析，conan 侧仅需 python 运行时）
  dependencies:
    - python3

  # 编译器（纯 Python 包，实际未使用）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lazy-nltk-corpus-loading.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "acronym 为纯 Python noarch 包（py3-none-any.whl），构建用 pip wheel --no-deps + installer，无需编译"
  - "上游在模块顶层 ensure_loaded() NLTK 语料库，缺失时自动联网下载，OHOS 受限网络下会阻塞 import，需改为惰性加载（补丁 0001）"
  - "上游 sdist 无任何测试文件（路径 B：适配后补全 13 个 Acronym Scoring System 单元测试）"
  - "运行时依赖 numpy/tqdm/nltk/pandas；numpy/pandas 为 C 扩展，鸿蒙 aarch64 无预编译 wheel 时需源码编译"
