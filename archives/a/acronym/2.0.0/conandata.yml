# conandata.yml — acronym 2.0.0
# 上游：bacook17/acronym（PyPI sdist，官方发布物）
sources:
  url: "https://files.pythonhosted.org/packages/source/a/acronym/acronym-2.0.0.tar.gz"
  sha256: "163cc1630b7c65cbca6426f80e267f5253ea787e17a329d1d55517868897bbf1"

patches:
  - patch_file: "patches/0001-lazy-nltk-corpus-loading.patch"
    patch_description: >-
      将 NLTK 语料库加载改为惰性且不阻塞 import：上游在模块顶层
      nltk.corpus.words/brown/gutenberg.ensure_loaded() 缺失时会自动联网下载，
      在 OHOS 受限网络环境下会导致 import 挂起/失败。改为惰性加载并在
      find_acronyms/main 中显式触发，语料缺失时给出清晰错误而不是在 import 时下载。
    patch_type: "portability"
