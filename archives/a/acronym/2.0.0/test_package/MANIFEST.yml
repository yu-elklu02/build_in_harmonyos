# MANIFEST.yml — acronym 2.0.0 test_package
software: acronym
version: "2.0.0"
test_type: "path-b"  # 上游无测试用例，适配后补全 Acronym Scoring System 测试

upstream_test_count: 0
adapted_test_count: 11

test_list:
  - test_score_word_basic
  - test_score_word_consecutive_bonus
  - test_score_word_subword_bonus
  - test_score_acronym_total
  - test_set_caps
  - test_get_acronym
  - test_index_in_simple
  - test_index_in_no_match
  - test_find_acronyms_fake_corpus
  - test_ensure_corpus_missing_raises
  - test_import_module_no_network

upstream_test_exemption: "none — 上游 sdist 无任何测试文件（路径 B 补全）"

notes: |
  上游 bacook17/acronym 2.0.0 sdist 仅包含 acronym/ 包（acronym.py + scoring.py）、
  setup.py、README，无 test/ 目录、无测试框架（无 pytest/unittest 用例）。
  本 test_package 按路径 B 补全 11 个测试，覆盖 Acronym Scoring System 核心逻辑：
  score_word / score_acronym / _set_caps / _get_acronym / _index_in / find_acronyms
  （使用 fake corpus 避免真实 NLTK 语料下载）/ ensure_corpus 错误路径。
