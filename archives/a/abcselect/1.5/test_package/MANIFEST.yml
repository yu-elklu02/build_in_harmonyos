# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本强制要求此文件存在

package: abcselect/1.5
homepage: https://www.lautengesellschaft.de/cdmm/

# abcselect has no upstream test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test suite
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "Verify abcselect binary exists and -? works"
    command: "conan test"

# 测试断言总数
assertion_count: 1