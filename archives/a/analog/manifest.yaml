software: analog
display: "Analog Web Log Analyzer"
description: "Analog 是一个高效的网页日志文件分析器，支持多种输出格式（HTML、纯文本、XML等）和报告类型"
category: networking
homepage: "https://www.c-amie.co.uk/software/analog/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "基于自定义 Makefile 构建系统，需通过环境变量传递 CC/CFLAGS/DEFS/LIBS"
    - "源码内置 bzip2/libgd/libpng/zlib/unzip/pcre2 子目录，当前适配使用 bundled 子目录编译，不依赖外部 Conan 包"
    - "编译产物为命令行工具 analog，非库类型，需在软件级目录声明 commands.json"
    - "上游 Makefile 通过 SUBDIRS 控制子目录编译，当前沿用 SUBDIRS 默认值（全部 bundled 子目录）"
  common_dependencies: []

versions:
  - version: "homebrew"
    status: built
    build_date: "2026-07-17"
    source_url: "https://github.com/c-amie/analog-ce/archive/refs/tags/6.0.18.tar.gz"