# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: analog/homebrew
homepage: "https://github.com/c-amie/analog-ce"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# analog-ce 上游没有官方的测试套件，Homebrew 测试方式为运行 binary 处理示例日志
upstream_tests:
  - file: N/A
    source: N/A
    description: "上游无官方测试套件，Homebrew 的测试为运行 analog 处理 logfile.log 并检查输出"
    command: "analog <logfile>"

# 上游测试声明（用于 hmbs 机器证据门禁）
# 审计结果：analog-ce 6.0.18 上游无 CTest/GTest/pytest/autotools check 等测试套件，
# 其发布包仅包含源码和文档，无任何测试框架入口或测试脚本。
upstream_tests_exist: false
upstream_test_audit: "审计 upstream analog-ce 6.0.18: 源码目录无 test/ 或 tests/ 文件夹；无 CMakeLists.txt 的 enable_testing/add_test；无 Makefile 的 check/test 目标；无 configure --enable-tests 选项；发布包不含任何测试框架或测试套件。analog 是一个纯命令行日志分析工具，上游仅提供 README 中的手动使用示例。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过 system() 调用 analog --version 和 --help 验证二进制可执行"
    command: "./test_analog"
  - file: conanfile.py
    description: "验证 analog --help 和示例日志处理"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2