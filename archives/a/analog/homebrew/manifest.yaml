software: analog
# 版本级 manifest 模板
# 文件位置: archives/a/analog/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: built

# 构建配置更新
# 本次修复: 所有已知问题已修复，CI Buildbot #7103 全部通过
# - conan test_package: 已执行
# - L0 门禁 (结构完整性): 通过
# - L1 门禁 (测试执行验证): 通过

# 上游版本
upstream_version: "6.0.18"

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/c-amie/analog-ce/archive/refs/tags/6.0.18.tar.gz"

  # 源码校验和
  sha256: "6c5d3f05643196b64eadeccb7b5063e2508c0155ac34c1fe848f6d055c371933"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 使用源码 bundled 子目录，不需要外部 Conan 包
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 构建参数
build_args:
    - "CC=clang"
    - "CFLAGS=-O2 -fPIC -include $(src_dir)/ohos_langdir_config.h"
    - "DEFS=-DUNIX"
    - "LIBS=-lm"
    - "OS=UNIX"
    - "pcre2 configure: --build=aarch64-unknown-linux-gnu (bypasses config.guess tmp permission issue)"
    - "pcre2 configure: umask 077→022 (fixes config.status temp dir Permission denied on HMDFS)"
    - "pcre2 make: DEFS=-DHAVE_CONFIG_H (prevents parent DEFS override, fixes PCRE2GREP_BUFSIZE)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []

patch_generation:
  method: none
  patches_count: 0

patch_classification: []