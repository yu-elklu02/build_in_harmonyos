# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: afnix/3.8.0
homepage: "http://www.afnix.org"

# 上游测试命令 (afnix 用 axi 执行 .als 测试)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (afnix tst/ref/AXI*.als)
upstream_tests:
  - file: tst/ref/AXI0001.als
    source: afnix-3.8.0/tst/ref/AXI0001.als
    description: "afnix assert form test (upstream smoke test)"
    command: "axi AXI0001.als"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.als
    description: "消费者测试: 通过 axi 执行 assert 断言"
    command: "axi test.als"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
