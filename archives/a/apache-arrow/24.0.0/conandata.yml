# 构建入口: cpp/ 子目录 (CMake)

sources:
  url: "https://archive.apache.org/dist/arrow/arrow-24.0.0/apache-arrow-24.0.0.tar.gz"
  sha256: "9a8094d24fa33b90c672ab77fdda253f29300c8b0dd3f0b8e55a29dbd98b82c9"

patches:
  - patch_file: "patches/0001-setupcxxflags-unknown-processor.patch"
    patch_description: "Fix SetupCxxFlags.cmake to treat unknown processor as aarch64 (OHOS CMake returns 'unknown')"
    patch_type: "portability"
  - patch_file: "patches/0002-buildutils-ohos-soname.patch"
    patch_description: "Add explicit OHOS SONAME flags to avoid build-tree DT_NEEDED paths"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-file-io-edge-cases.patch"
    patch_description: "Handle Arrow file IO edge cases for empty fadvise ranges and directory append paths"
    patch_type: "portability"
  - patch_file: "patches/0004-vendored-date-tzdir.patch"
    patch_description: "Allow vendored date timezone discovery to honor TZDIR before default system zoneinfo paths"
    patch_type: "portability"
