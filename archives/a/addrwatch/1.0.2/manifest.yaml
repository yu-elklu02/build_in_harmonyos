software: addrwatch
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/fln/addrwatch/releases/download/v1.0.2/addrwatch-1.0.2.tar.gz"

  # 源码校验和
  sha256: "f04e143da881cd63c299125b592cfb85e4812abbd146f419a1894c00f2ae6208"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libpcap/1.10.6"
    - "libevent/2.1.12"
    - "argp-standalone/1.5.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: "0001-Makefile.in.patch"
    description: "Update Makefile.in from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability
  - file: "0002-aclocal.m4.patch"
    description: "Update aclocal.m4 from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability
  - file: "0003-configure.patch"
    description: "Fix configure: umask 077→000 for HMDFS compatibility, make config.guess/config.sub optional (E007/E078)"
    type: portability
  - file: "0004-doc-Makefile.in.patch"
    description: "Update doc/Makefile.in from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability
  - file: "0005-missing.patch"
    description: "Replace missing script with no-op to prevent autotools regeneration on OHOS"
    type: portability
  - file: "0006-src-Makefile.in.patch"
    description: "Update src/Makefile.in from automake 1.16.1 to 1.16.5 for OHOS compatibility"
    type: portability

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.status 使用 umask 077 创建临时目录，但 HMDFS 下 mktemp 创建的目录 owner 与当前用户不匹配，导致 Permission denied。解决：通过补丁 0003 修改 configure 脚本中的 umask 077→000"
  - "missing 脚本会调用系统 autoconf/automake 重新生成 configure，但重新生成的 configure 不包含平台修复。解决：通过补丁 0005 替换 missing 脚本为 no-op"
  - "argp-standalone 的 libargp.a 引用 libintl_dgettext，必须链接 -lintl"
  - "addrwatch 是 C 项目，无需 C++ 编译器，但 configure 默认检测 C++ 编译器可能触发 E053"
  - "R15: 禁止使用 --build/--host 参数绕过平台检测。addrwatch 源码不含 config.guess/config.sub，configure 补丁(0003)将其引用改为条件式，无需 --build/--host 即可正常配置"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/addrwatch-1.0.2.orig
  source_work_dir: /storage/Users/currentUser/builds/addrwatch-1.0.2.work
  source_orig_hash: a440f1324885931d
  source_work_hash: 81087fd9ad614ba5
  generated_at: '2026-06-30T11:40:01'
  patches_count: 6

patch_classification:
