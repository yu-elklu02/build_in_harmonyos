# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: acsccid/1.1.13
homepage: "https://acsccid.sourceforge.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# acsccid 1.1.13 的 Makefile.am 未注册任何 TESTS/check_PROGRAMS 目标
# make check 为空操作（"Nothing to be done for 'check'"），上游无 CUnit 测试
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试/自检程序
upstream_tests: []

# 本平台不可运行的上游测试（记录原因）
blocked_tests:
  - name: "智能卡读卡器交互（ccid_usb 等运行期功能）"
    reason: "需要真实 ACS 读卡器硬件 + 运行中的 pcscd 守护进程；本平台无硬件，且鸿蒙沙箱 AF_UNIX socket bind 返回 EPERM（pcsc-lite 2.4.0 已验证的平台限制），无法端到端运行"

# test_package 中自带的测试 (消费者视角验证, R34: 真实 dlopen 驱动 bundle)
test_package_tests:
  - file: test_acsccid.c
    description: "消费者视角: dlopen libacsccid.so 并校验 IFDH* 入口符号（IFDHCreateChannelByName/IFDHControl/IFDHGetCapabilities/IFDHTransmitToICC/IFDHCloseChannel）"
    command: "./test_acsccid"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
