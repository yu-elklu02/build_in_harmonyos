# 版本级 manifest
# 文件位置: archives/{letter}/{name}/6.6.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.6.4"

# 软件名
software: "acct"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-04"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://ftp.gnu.org/gnu/acct/acct-6.6.4.tar.gz"

  # 源码校验和
  sha256: "4c15bf2b58b16378bcc83f70e77d4d40ab0b194acf2ebeefdb507f151faa663f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS mktemp -d 生成 drwx--S--- 目录，config.status 写入 subs*.awk 失败；generate() 中 mktemp wrapper exit 1 强制 AS_TMPDIR mkdir fallback（与 bash 5.3 同源）"
  - "acct 上游无测试用例：无 tests/ 目录，Makefile.am 无 TESTS，make check 为空目标"
