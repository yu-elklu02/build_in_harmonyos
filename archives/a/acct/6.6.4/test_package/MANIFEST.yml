# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: acct/6.6.4
homepage: https://www.gnu.org/software/acct/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件
upstream_tests:
  - name: "make-check-shell-tests"
    source: acct-6.6.4/tests/
    description: "shell 集成测试（ac/accton/lastcomm/sa 工具测试）"

# 新增/鸿蒙特有测试
added_tests:
  - name: "smoke-test-ac"
    source: test_package/test.sh
    description: "ac --version 冒烟测试"
