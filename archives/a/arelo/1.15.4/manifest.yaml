software: arelo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.15.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15.4"

# 软件名
software: arelo

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: "go"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/makiuchi-d/arelo/archive/refs/tags/v1.15.4.tar.gz"

  # 源码校验和
  sha256: "f687e04187145aa6ccaf68fc995f9e8297387a2f27871ccb132625e0635cf15d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: go

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go项目编译需要内嵌Go工具链下载（参考caddy/chkbit模式），因为系统未安装Go"
  - "Go linker在OHOS平台上使用mmap创建输出文件，需要将GOTMPDIR/GOCACHE设置到hmfs路径（/data/storage/el2/base/haps/entry/files/），tmpfs上mmap会失败"
  - "Go SDK二进制需要在OHOS上签名（binary-sign-tool）才能执行"
  - "arelo的go.mod要求go 1.24.0，使用go 1.25.3 linux-arm64编译成功"
  - "CGO_ENABLED=0即可编译arelo，不需要CGO（纯Go项目，依赖golang.org/x/sys通过syscall实现）"
  - "Go项目init-build会误检测为autotools，需手动修正manifest.yaml: system=custom, build_system=go"
