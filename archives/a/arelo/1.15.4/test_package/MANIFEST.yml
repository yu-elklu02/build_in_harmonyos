# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arelo/1.15.4
homepage: https://github.com/makiuchi-d/arelo

# 上游测试命令 (Go项目使用 go test)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序
upstream_tests:
  - file: arelo_test.go
    source: arelo-1.15.4/arelo_test.go
    description: "arelo core functionality tests (file matching, signal handling, restart logic)"
    command: "go test -run TestArelo"
  - file: fspoll/fspoll_test.go
    source: arelo-1.15.4/fspoll/fspoll_test.go
    description: "filesystem polling package tests"
    command: "go test ./fspoll/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Run arelo --version and --help, verify output contains 'arelo' and 'Usage:'"
    command: "bash test.sh <bin/arelo>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
