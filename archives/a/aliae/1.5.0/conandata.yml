# conandata.yml — aliae 1.5.0
# aliae 是 Go 写的跨 shell 别名管理工具（src/ 目录，go.mod 需 go 1.25.0）。
# 依赖 Go 模块：goccy/go-yaml、shirou/gopsutil、spf13/cobra、golang.org/x/term 等。
# 本地无 Go 工具链，自包含下载 go 1.26.3（aliyun 镜像，参照 murex 配方）。

sources:
  # R39：conandata.yml 只写官方原始 URL，CI 会自动加镜像 fallback
  # （gh-proxy/ghproxy/gitclone/moeyy/kkgithub），勿手动加镜像前缀
  url: "https://github.com/JanDeDobbeleer/aliae/archive/refs/tags/v1.5.0.tar.gz"
  sha256: "3d20ffd39244e5d630b83cc6d0702276571151e94d03bfbf28b2f86e9aa25ab1"

go_toolchain:
  version: "1.26.3"
  linux-arm64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-arm64.tar.gz"
    sha256: "9d89a3ea57d141c2b22d70083f2c8459ba3890f2d9e818e7e933b75614936565"
    filename: "go1.26.3.linux-arm64.tar.gz"
