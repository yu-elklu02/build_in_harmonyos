# aliae 1.5.0 适配清单
# 跨 shell 跨平台别名管理工具（Go 项目，src/ 目录，go.mod 需 go 1.25.0）。
# 本地无 Go 工具链，配方自包含下载 go 1.26.3（aliyun 镜像）；Go 模块依赖
# 经 GOPROXY（goproxy.cn）拉取；产物 bin/aliae 可执行。

version: "1.5.0"
status: built

source:
  url: "https://codeload.github.com/JanDeDobbeleer/aliae/tar.gz/refs/tags/v1.5.0"
  sha256: "3d20ffd39244e5d630b83cc6d0702276571151e94d03bfbf28b2f86e9aa25ab1"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "go build -trimpath -ldflags \"-s -w -X main.Version=1.5.0\""
  cc: go-1.26.3
  notes: "CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64 交叉编译；GOPROXY=goproxy.cn；go 1.26.3 自包含工具链（aliyun 镜像，参照 murex 配方）"

dependencies: []

patches_applied: []

test:
  upstream_cases: 15
  upstream_suite: "go test ./...（src/config、src/shell 等包共 15 个 _test.go 测试文件）"
  runnable: 15
  runnable_note: "本地 OHOS 环境运行 go test ./... 全部通过"
  pass_rate: "15/15 = 100%（本地实测）"
  consumer_test: "test_package 验证 aliae --help 可用"

knowledge_gained:
  - "aliae 需 go 1.25.0（go.mod），本地无 Go 工具链，自包含下载 go 1.26.3（aliyun 镜像，与 murex 同款）"
  - "Go 模块依赖（goccy/go-yaml、shirou/gopsutil、spf13/cobra、golang.org/x/term 等）经 GOPROXY=https://goproxy.cn,direct 拉取"
  - "CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64 交叉编译（参照 murex 配方）"
  - "GOCACHE/GOMODCACHE/GOPATH/TMPDIR 设到可写位置（Go 默认写 HOME/.cache 可能被拒）"
  - "OHOS/HMDFS 解包后目录位可能不可遍历，go 工具链解压后需统一修复权限"
