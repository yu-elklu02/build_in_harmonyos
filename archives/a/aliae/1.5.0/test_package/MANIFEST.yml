# aliae/1.5.0 test_package
# Verifies aliae binary is installed and executable

package: aliae/1.5.0
homepage: "https://github.com/JanDeDobbeleer/aliae"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "go test ./..."

upstream_tests:
  - name: go-test
    description: "上游 Go 单元测试（src/config、src/shell 等包共 15 个 _test.go），build() 阶段 go test ./... 自动运行"

test_package_tests:
  - file: test_aliae.c
    description: "验证 aliae 二进制存在且可执行（aliae --help），R34 反空壳：test() 用 self.run() 真实执行被测包二进制"
    command: "<aliae_bin> --help  # test_package/conanfile.py test() 定位 bin/aliae 并执行 --help"

assertion_count: 1
