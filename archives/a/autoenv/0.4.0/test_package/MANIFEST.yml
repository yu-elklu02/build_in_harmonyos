package: autoenv/0.4.0
homepage: "https://github.com/hyperupcall/autoenv"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "sh tests/test.sh"

upstream_tests:
  - file: tests/test.sh
    source: autoenv-0.4.0/tests/test.sh
    description: "Run upstream shell integration tests across supported shells available on the host"
    command: "sh tests/test.sh"
  - file: tests/test_simple.sh
    source: autoenv-0.4.0/tests/test_simple.sh
    description: "Verify .env files are sourced when entering directories"
    command: "sh tests/test_simple.sh"

test_package_tests:
  - file: test.sh
    description: "Consumer smoke test: source packaged activate.sh and verify .env loading"
    command: "sh test.sh"
  - file: conanfile.py
    description: "Conan consumer test invoking test.sh with package path"
    command: "conan test"

assertion_count: 4
