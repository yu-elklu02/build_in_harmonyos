# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ace/8.0.5
homepage: "https://www.dre.vanderbilt.edu/~schmidt/ACE.html"

# 上游测试命令 (ACE 无 make check 目标，测试在 ACE/tests 目录，逐二进制运行)
# 与 notes.md 一致：在含测试目标的 Makefile 目录执行（勿用 -C 切换目录，否则 ./ 找不到二进制）
upstream_check_command: "make ACE_Test Basic_Types_Test SString_Test Get_Opt_Test && ./ACE_Test && ./Basic_Types_Test && ./SString_Test && ./Get_Opt_Test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ACE 核心库回归测试，4 个代表性测试)
upstream_tests:
  - file: tests/ACE_Test.cpp
    source: ACE/tests/ACE_Test.cpp
    description: "ACE 核心功能回归测试"
    command: "./ACE_Test"
  - file: tests/Basic_Types_Test.cpp
    source: ACE/tests/Basic_Types_Test.cpp
    description: "基本类型测试"
    command: "./Basic_Types_Test"
  - file: tests/SString_Test.cpp
    source: ACE/tests/SString_Test.cpp
    description: "字符串类测试"
    command: "./SString_Test"
  - file: tests/Get_Opt_Test.cpp
    source: ACE/tests/Get_Opt_Test.cpp
    description: "命令行参数解析测试"
    command: "./Get_Opt_Test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 ACE_OS::getpid / ACE_VERSION / ACE_Message_Block"
    command: "./test_ace"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
