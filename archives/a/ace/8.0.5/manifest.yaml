# 版本级 manifest — ace 8.0.5
# 遵循 ARCHIVE-SPEC v2.0

version: "8.0.5"
software: "ace"
status: built
build_date: "2026-08-04"
build_system: makefile
conan_ref: "ace/8.0.5"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源（下载实际经 gh-proxy.com 镜像，见 conandata.yml）
  url: "https://github.com/DOCGroup/ACE_TAO/archive/refs/tags/ACE+TAO-8_0_5.tar.gz"

  # 源码校验和
  sha256: "cdb4f412a49dfab5f22fb8d95e571f14362f2debde59014d39ae0a4f6dba7f6a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # ACE 8.0.5 无 configure 脚本，采用传统 GNU Make + MPC(mwc.pl) 生成 makefiles
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ACE 8.0.5 无 configure：GNU Make + MPC (perl bin/mwc.pl -type gnuace) 生成 makefiles"
  - "ACE tarball 不含 MPC 核心模块，需单独下载 DOCGroup/MPC 并固定 commit（conan 双 source）"
  - "OHOS musl 缺少 ualarm/pthread_cancel/POSIX AIO：config.h 需关停对应 ACE 特性宏（R8：无 __OHOS__ 守卫）"
  - "E119 sockaddr_storage 冲突：关停 ACE_HAS_NETLINK 规避 linux/socket.h 与 sys/socket.h 碰撞"
  - "GNU Make 4.4+：ACE rules.local.GNU 多目标 install 需显式 INSBIN/INSLIB/INSINC/INSMAN，避免空 INSBIN 写 `/libACE.so`"
  - "E074/R9：HMDFS 禁止 mkfifo，make 必须 -j1（并设 MAKEFLAGS=-j1）；ACE 子库在 ace/{Compression,ETCL,Monitor_Control}/ 分目录构建"
  - "系统 make 内置 CXX 指向 CI 硬编码的无效路径，构建命令需显式指定编译器路径"
  - "Conan 2 的 self.run 中 VAR=value 形式的 env 参数只当文件名处理，设置变量须用工具类 Environment"
