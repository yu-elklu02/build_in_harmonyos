software: ace
display: "ACE"
description: "ADAPTIVE Communication Environment — C++ 面向对象网络编程框架"
category: network
homepage: "https://www.dre.vanderbilt.edu/~schmidt/ACE.html"
license: "DOC"
build_system: makefile

ohos_adaptation:
  key_points:
    - "ACE 8.0.5 无 configure 脚本：GNU Make + MPC (perl bin/mwc.pl -type gnuace) 生成 makefiles"
    - "ACE tarball 不含 MPC 核心模块，需单独下载 DOCGroup/MPC 并固定 commit（conan 双 source，勿用 floating 分支）"
    - "OHOS musl 缺 ualarm/pthread_cancel/POSIX AIO：config.h 需关停 ACE_HAS_UALARM / ACE_HAS_AIO_CALLS / ACE_HAS_NETLINK 并定义 ACE_LACKS_PTHREAD_CANCEL"
    - "E119 sockaddr_storage 冲突：linux/socket.h 与 sys/socket.h 双定义，关停 ACE_HAS_NETLINK 规避"
    - "构建命令需显式指定 clang/clang++（系统 make 内置 CXX 指向 CI 无效路径）"
    - "产物为纯动态库（libACE*.so），无命令行可执行文件，无需 commands.json"
  common_dependencies: []

versions:
  "8.0.5":
    status: built
    build_date: "2026-08-04"
    conan_ref: "ace/8.0.5"
    notes: "GNU Make + MPC 构建；OHOS musl 特性宏适配；conan-verify 8 门禁通过"
