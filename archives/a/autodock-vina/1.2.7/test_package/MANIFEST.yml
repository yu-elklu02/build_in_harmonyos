package: autodock-vina/1.2.7
homepage: "https://github.com/ccsb-scripps/AutoDock-Vina"
upstream_check_command: "make -C build/linux/release"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test_source.cpp
    description: "Compile and execute a native C++ consumer test for the package test project."
    command: "ctest -R vina_test_source --output-on-failure"
  - file: CMakeLists.txt
    description: "Validate the installed vina command reports version 1.2.7."
    command: "ctest -R vina_version --output-on-failure"
  - file: CMakeLists.txt
    description: "Validate the installed vina command accepts --help."
    command: "ctest -R vina_help --output-on-failure"
assertion_count: 2
