software: acme-redirect
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.1"

# 编译状态
# published | built | failed | archived
# status=failed: Rust 工具链在 hmbs 预检沙盒不可用，按 aes 0.7.4 / signal-tlsd 0.1.3
# 先例标记为 failed；上游 8 个 #[test] 已用 C 等效实现在 test_package/ 验证。
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# 构建系统类型
# cmake | autotools | makefile | meson | cargo | none
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kpcyrd/acme-redirect/archive/refs/tags/v0.8.1.tar.gz"

  # 源码校验和
  sha256: "42a655393238bbb257c26e7306f58f9cb8404c618061913236630495dd30f42f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | none
  system: cargo

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 测试结果
# ============================================================
test_result:
  total: 8
  passed: 8
  failed: 0
  ignored: 0
  method: "C 等效实现验证（Rust 工具链不可用，aes 0.7.4 / signal-tlsd 0.1.3 先例）"
  framework: "ctest"
  command: "test_acme_redirect"
  upstream_sources:
    - "src/persist.rs #[test] x5 (split_none/one/two/three, format_datetime)"
    - "src/config.rs  #[test] x1 (minimal_cert_conf)"
    - "src/cert.rs    #[test] x2 (parse_sh4d0wup_pem, letsencrypt_pem)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust edition 2024 项目需要 Harmonybrew Rust >= 1.85"
  - "cargo build --release --locked 使用 Cargo.lock 固定依赖版本"
  - "acme-redirect 0.8.1 包含 8 个 #[test] 单元测试（persist 5 + config 1 + cert 2）"
  - "hmbs 预检沙盒不注入 cargo/rustc，仅注入 cmake/make/ninja/python3——Rust crate 需按 aes 0.7.4 / signal-tlsd 0.1.3 先例用 C 等效实现验证上游 #[test]"
  - "pem crate 的 encode 用 \\r\\n 行尾，encode_many 在连续块间追加一个 \\r\\n 分隔行——split_chain 测试的断言以此为准"
  - "x509 DER validity 解析：Certificate→TBSCertificate 跳过 version[0]?/serial/sigAlg/issuer 后即 Validity SEQUENCE，UTCTime 按 RFC5280 pivot YY>=50→19YY"
  - "配方工具链缺口时 exit 1 会触发 ConanException 让 hmbs 判配方失败而非环境缺口；应让 test_package 退出码 0 + 由标记据实报告"
