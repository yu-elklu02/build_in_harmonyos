package: aws-c-http/0.10.14
homepage: https://github.com/awslabs/aws-c-http

upstream_test_in_build: true
upstream_test_command: ctest --test-dir <build>/_build/aws-c-http --output-on-failure

upstream_runtime_scope:
  - command: "ctest --test-dir <build>/_build/aws-c-http --output-on-failure"
    status: "enabled in conanfile.py build() and executed after building aws-c-http"
  - command: "integration-testing/http_client_test.py"
    status: "not part of the CMake CTest target set; Python/network integration coverage remains out of scope for this package gate"

upstream_tests:
  - path: tests/
    type: upstream C unit and integration tests
  - path: tests/fuzz
    type: upstream fuzz test corpus and harnesses
  - path: tests/mock_server
    type: upstream HTTP mock server tests
  - path: integration-testing/http_client_test.py
    type: upstream Python integration test

test_package_tests:
  - file: test.c
    description: Consumer smoke test initializes aws-c-http and private CRT dependencies through type-compatible C11 generic selection, checks int init APIs when present, treats void init APIs as success, and validates status-code text lookup.
    command: test_aws_c_http

assertion_count: 7
