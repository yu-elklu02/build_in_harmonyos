software: aws-c-http
version: "0.10.14"
status: built
build_system: cmake
build_date: "2026-07-16"

source:
  url: "https://github.com/awslabs/aws-c-http/archive/refs/tags/v0.10.14.tar.gz"
  sha256: "d44866920b89e07b9db17e9c84587c6dca6c796d691597f1bee5e17b16b79d39"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DENABLE_NET_TESTS=OFF"
  dependencies: []
  bundled_dependencies:
    - aws-c-common/0.12.6
    - aws-c-cal/0.9.13
    - aws-c-compression/0.3.2
    - aws-c-io/0.26.3
  dependency_mode: private_source_build
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "aws-c-http upstream CTest targets are built and executed in the recipe after private CRT dependencies are installed into the staging prefix."
  - "The OHOS base recipe keeps core HTTP/H1/H2/WebSocket/HPACK unit tests enabled and disables network/TLS/proxy-only integration tests because the package is built without a TLS provider."

test_results:
  type: upstream-ctest-plus-consumer-smoke
  upstream_command: "ctest --test-dir <build>/_build/aws-c-http --output-on-failure"
  upstream_status: "core upstream CTest executes by recipe; final pass count is recorded from OpenDesk/CI logs"
  consumer_tests: 1
