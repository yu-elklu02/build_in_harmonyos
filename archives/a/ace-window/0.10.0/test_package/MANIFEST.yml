package: ace-window/0.10.0
homepage: "https://github.com/abo-abo/ace-window"

# 上游测试命令 - Emacs Lisp 包，测试需 Emacs 运行时
upstream_check_command: "make compile / make plain (Emacs Lisp byte-compile + load tests)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Makefile 两个测试目标）
upstream_tests:
  - file: test/make-compile.el
    source: https://github.com/abo-abo/ace-window/blob/master/test/make-compile.el
    description: "Emacs Lisp byte-compilation test (make compile)"
    command: "emacs -batch -l test/elpa.el -l test/make-compile.el"
  - file: test/make-plain.el
    source: https://github.com/abo-abo/ace-window/blob/master/test/make-plain.el
    description: "Emacs Lisp load test: (require 'ace-window) + global-set-key (make plain)"
    command: "emacs -Q -l test/elpa.el -l test/make-plain"

# 上游测试说明：
# - ace-window 上游有 2 个测试目标（make compile byte-compile 测试 + make plain 加载测试），
#   另有 test/elpa.el（辅助脚本）与 test/make-update.el（依赖安装脚本，非测试）
# - 均需 emacs 运行时；本机无 emacs，无法执行上游测试
# - 已在 test_package 中声明 Python 冒烟测试（文件完整性 + 内容特征）

# test_package 中自带的测试
test_package_tests:
  - file: test_ace_window.py
    description: "Verify ace-window.el exists, non-empty, contains (provide 'ace-window) and (defun ace-window)"

# 测试断言总数
assertion_count: 4
