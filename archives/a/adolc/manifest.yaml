# 软件级 manifest — adolc
# 遵循 ARCHIVE-SPEC v3.0

software: adolc
display: "ADOL-C"
description: "C/C++ 程序的自动微分（Automatic Differentiation）开源库，属于 COIN-OR 项目"
category: foundation
homepage: "https://github.com/coin-or/ADOL-C"
license: EPL-1.0 OR GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "autotools 构建系统；config.guess/config.sub 需补 HarmonyOS 三元组 aarch64-unknown-linux-ohos（E205/E072）"
    - "configure 临时目录 umask 077→022（E129，HMDFS 权限）"
    - "taylor.o 用 long double，libtool 以 clang++ -nostdlib 链接 .so 时需 LDFLAGS 追加 libclang_rt.builtins.a 使 libadolc.so 自包含 quad-float 符号（E098）"
    - "可选依赖 ColPack/Boost/OpenMP 在 ohpcd 未发布，保持禁用（--enable-sparse=no --without-boost）"
    - "上游 make check 无 shebang 脚本，需用 /data/service/hnp/bin/bash run_tests 执行"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.7.2":
    status: built
    build_date: "2026-08-05"
    conan_ref: "adolc/2.7.2"
    source_url: "https://github.com/coin-or/ADOL-C/archive/refs/tags/releases/2.7.2.tar.gz"
