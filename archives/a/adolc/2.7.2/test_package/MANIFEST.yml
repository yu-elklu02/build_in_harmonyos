# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adolc/2.7.2
homepage: "https://github.com/coin-or/ADOL-C"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cd ADOL-C/test && sh run_tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: ADOL-C/test/powexam.cpp
    source: ADOL-C/test/powexam.cpp
    description: "pow 函数自动微分测试（trace + gradient，验证 TEST PASSED）"
    command: "./powexam"
  - file: ADOL-C/test/speelpenning.cpp
    source: ADOL-C/test/speelpenning.cpp
    description: "Speelpenning 函数自动微分测试（验证 TEST PASSED）"
    command: "./speelpenning"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：adouble + trace_on/gradient 求导 f(x)=x^2 并断言 dy/dx=2x"
    command: "./test_adolc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
