- "0001-ADOL-C-include-adolc-internal-adolc_settings.h.patch (生成态: 禁用 SPARSE_DRIVERS/BOOST_POOL)"
- "0002-autoconf-config.guess.patch (E205: config.guess 补 HarmonyOS 识别)"
- "0003-autoconf-config.sub.patch (E205/E072: config.sub 补 ohos/linux-ohos 三元组)"
- "0004-configure.patch (E129: umask 077->022)"
# 注：以上补丁已在 conandata.yml 注册，conan create 时由 apply_conandata_patches 应用。
# 另在 recipe generate() 中以 extra_ldflags 追加 libclang_rt.builtins.a（quad-float 符号自包含）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "config.guess 2016-10-02 无 GUESS 回显机制，HarmonyOS 分支需直接 echo+exit 而非设置 GUESS 变量（ref: E205）"
- "libtool 以 clang++ -nostdlib 链接共享库时不带 compiler-rt builtins，taylor.o(long double) 导致 .so 运行期缺 __addtf3/__multf3 等符号；用 LDFLAGS 追加 libclang_rt.builtins.a 解决（ref: E098, E205）"
- "手动 autotools 构建安装到 lib64；但 conan AutotoolsToolchain 强制 --libdir=${prefix}/lib，conan 包内统一在 lib/（cpp_info 用默认 libdirs）（ref: knowledge/operations/build-systems.md）"

