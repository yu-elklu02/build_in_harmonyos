# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
  - "--prefix=/storage/Users/currentUser/usr/local"
  - "--enable-sparse=no"
  - "--without-boost"
  # LDFLAGS 追加 compiler-rt builtins.a：libadolc.so 需自包含 quad-float 符号（taylor.o 用 long double）

  # 编译依赖列表（格式: name/version）—— 全部可选，无必需依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
