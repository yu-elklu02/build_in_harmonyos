# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: align/1.7.5
homepage: "https://kinzler.com/me/align/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# align 上游无 make check，通过功能命令验证（align 读取 stdin 对齐输出）
upstream_tests:
  - file: "align"
    source: "align-1.7.5/align"
    description: "上游 align 文本列对齐过滤器（本地实测可运行）"
    command: "align < input"

# test_package 中自带的测试 (消费者视角验证)
# CLI 工具：验证 align 处理 stdin 输入并产生对齐输出
test_package_tests:
  - file: "test.c"
    description: "执行 align < in.txt 验证输出（文本列对齐过滤）"
    command: "./test_align"

# 测试断言总数 (近似值)
assertion_count: 1
