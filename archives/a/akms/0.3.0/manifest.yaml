knowledge_gained:
  - "akms 是纯 POSIX shell 工具（DKMS for Alpine），无 C 编译；build() 用 sh -n 校验脚本语法"
  - "上游 Makefile 的 man 目标需要 asciidoctor（OHOS 无此工具）→ 跳过 man 生成，package() 直接复制脚本（bin/akms、libexec/akms/{akms-build,akms-runas}、share/kernel-hooks.d/akms.hook、etc/akms.conf）"
  - "L1e 本地误判（harness 假阳性）：本地 ohc-run finish 的 conan-verify 创建 @ohpcd/stable 条目 + W3 build_and_test 的 conan create（unset CONAN_USER/CHANNEL → plain ref）产生两个缓存条目，L1e 复跑解析到未破坏的 @ohpcd/stable 条目 → 误判 'fake test'；CI 上 build_and_test 独立运行（无 conan-verify）只有一条目 → L1e 正常（已验证：清缓存独立运行 exit=0，L1e 确认真实依赖）"
