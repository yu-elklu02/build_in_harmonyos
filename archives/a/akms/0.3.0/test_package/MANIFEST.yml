# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: akms/0.3.0
homepage: "https://github.com/jirutka/akms"

# 上游测试命令 (shell 工具: 无测试套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# akms 上游无测试套件（纯 shell 工具）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_akms.sh
    description: "验证 akms shell 工具：bin/akms 存在且可执行、--version 含 0.3.0、--help 退出码 0、helper 脚本（akms-build/akms-runas）已安装"
    command: "sh test_akms.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 1 存在性 + 1 可执行 + 1 版本 + 1 help + 2 helper = 6
assertion_count: 6
