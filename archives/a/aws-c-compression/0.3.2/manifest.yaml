software: aws-c-compression
version: "0.3.2"
status: built
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-c-compression/archive/refs/tags/v0.3.2.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - aws-c-common/0.14.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "标准 CMake 构建，无需补丁"
  - "AWS C SDK 使用自定义 CMake 模块，需通过 aws-c-common_DIR 指向原始 cmake config"
  - "test_package 需手动添加 aws-c-common include 目录 (CMakeDeps 在 OHOS 上不生成 includedirs)"
