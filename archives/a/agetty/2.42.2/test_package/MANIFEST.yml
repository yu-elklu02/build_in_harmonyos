# MANIFEST.yml — agetty 2.42.2 test_package
# 上游测试来源：util-linux 2.42.2（agetty 为其 term-utils/agetty.c 组件）。
# 已检查 util-linux 2.42.2 上游测试入口：共有 367 个测试脚本（tests/ts/），
# 但没有任何直接或间接覆盖 agetty 的适用测试，因此上游 agetty 测试为
# 0/0 (N/A)，不存在可"全量跑通"的 agetty 上游测试。
# 消费者补充测试（本项目提供，非上游）：两个断言，真实执行结果为 2/2 PASS。

package: agetty/2.42.2
homepage: "https://github.com/util-linux/util-linux"

# 构建系统
build_system: autotools

# 上游测试命令（util-linux 全局测试入口：make check -> tests/run.sh）
upstream_check_command: "make check (tests/run.sh --nonroot)"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 agetty 覆盖，注册数为零）
upstream_tests: []

# 上游 agetty 适用测试结论
upstream_agetty_test_result: "0/0 (N/A，无 agetty 适用的上游测试；不存在可全量运行的 agetty 上游测试)"

# 消费者测试入口与断言脚本
test_package_entry: "test_package/conanfile.py"
test_package_assert_script: "test_package/test.sh"

# 消费者补充测试（2 个断言，真实执行结果 2/2 PASS；与上游测试分开计数）
test_package_tests:
  - file: conanfile.py
    source: test_package/conanfile.py
    assert_script: test_package/test.sh
    description: "消费者补充断言1: agetty --version 退出码 0 且输出 util-linux 2.42.2"
    command: "agetty --version 2>&1 | grep -q 'util-linux 2.42.2'"
    result: "PASS"
  - file: conanfile.py
    source: test_package/conanfile.py
    assert_script: test_package/test.sh
    description: "消费者补充断言2: agetty --help 退出码 0（不打开真实 TTY）"
    command: "agetty --help >/dev/null 2>&1"
    result: "PASS"

consumer_test_result: "2/2 PASS（执行端已真实执行验证，证据见第 3 轮回报）"
