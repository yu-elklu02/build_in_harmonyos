# manifest.yaml — agetty 2.42.2（util-linux 2.42.2 组件）
# 遵循 ARCHIVE-SPEC v2.0

version: "2.42.2"
software: agetty
status: built
build_date: "2026-08-05"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
  tar_format: tar.xz
  note: "agetty 是 util-linux 2.42.2 的 term-utils/agetty.c，从完整 util-linux 源码树构建，仅 --enable-agetty"

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--disable-all-programs"
    - "--enable-agetty"
    - "--disable-nls"
    - "--disable-rpath"
    - "--disable-plymouth_support"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "patches/0001-config-guess-ohos.patch"
  - "patches/0002-configure-mktemp-hmdfs.patch"

# ============================================================
# 上游测试核验（0/0 N/A 完整依据）
# ============================================================
upstream_tests:
  conclusion: "0/0 (N/A，无 agetty 适用的上游测试)"
  evidence:
    - "util-linux 2.42.2 tests/ts/ 共 91 子目录、367 个可执行测试脚本，无 agetty 目录"
    - "grep agetty 全量命中 0：tests/ts/ 0、tests/helpers/ 0、tests/functions.sh|commands.sh|run.sh 0"
    - "tests/expected/build-sys/config-* 仅 configure 输出快照，非测试用例"
    - "tests/ts/login/{islocal,logindefs} 测 login-utils 内部函数与 libcommon_logindefs 库解析，不覆盖 term-utils 的 agetty"
    - "tests/ts/utmp/ 测 last/utmpdump 命令，与 agetty 无关"
    - "tests/ts/lsns 的 'getty' 命中为 ns-gettype-ok 子串，无关"
    - "term-utils/ 无测试脚本；顶层无 test/ 目录；meson.build 无 test() 注册；无 CI 测试配置"
    - "全局 make check 运行 tests/run.sh --nonroot 全部 367 脚本，其中 0 个与 agetty 相关"

# ============================================================
# 消费者测试（test_package）
# ============================================================
consumer_tests:
  entry: "test_package/conanfile.py"
  smoke_assertions: 2
  smoke_list:
    - "agetty --version 2>&1 | grep -q 'util-linux 2.42.2'（退出码 0 + 版本字符串）"
    - "agetty --help >/dev/null 2>&1（退出码 0，不打开真实 TTY）"

# ============================================================
# HarmonyOS 适配记录（E 条目对照）
# ============================================================
adaptation:
  - issue: "E007"
    problem: "config.guess 无法识别 HarmonyOS"
    fix: "0001-config-guess-ohos.patch（config.guess 增加 HarmonyOS 分支）"
  - issue: "既有条目（E011/E052/E060）"
    problem: "config.status mktemp 0700 目录在 HMDFS 上不可写"
    fix: "0002-configure-mktemp-hmdfs.patch（$TMPDIR/conf$$ + mkdir -p，去 umask 077）"
  - issue: "E119"
    problem: "OHOS linux/socket.h 与 musl sys/socket.h 均定义 sockaddr_storage"
    fix: "编译期 -D__MUSL__（conanfile.py，仅 OHOS）"
  - issue: "E121"
    problem: "OHOS libc 缺失 GNU utmpx 符号（updwtmpx/setutxent/getutxent/pututxline/endutxent/utmpxname）"
    fix: "src/ohos-utmpx-shim.c no-op 降级（仅 OHOS 链接；utmp/wtmp 记录不落盘，不声称已写入）"
  - issue: "vhangup（路径 B 候选，待分析端确认）"
    problem: "SDK 26.0.0.18 中 vhangup 无头文件声明且 libc.so 无导出符号，链接失败"
    fix: "src/ohos-utmpx-shim.c 使用 AArch64 SYS_vhangup syscall 封装（仅 OHOS 条件启用）"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained: []
