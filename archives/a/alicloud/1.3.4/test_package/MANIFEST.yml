# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: alicloud/1.3.4
homepage: "https://help.aliyun.com/en/mns/developer-reference/release-notes-of-the-sdk-for-cpp"

# 上游测试命令（上游仅有 sample 示例，无正式测试套件）
upstream_check_command: "scons"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（sample 需云凭据，不做网络请求）
upstream_tests:
  - file: sample/mns_sample.cpp
    source: cplusplus_sdk/sample/mns_sample.cpp
    description: "MNS 队列示例（需云凭据，仅编译验证）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_alicloud.cpp
    description: "头文件可用性 + 静态库链接验证"
    command: "test_alicloud"

# 测试断言总数
assertion_count: 1
