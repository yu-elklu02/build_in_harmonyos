sources:
  url: "https://github.com/acpica/acpica/archive/refs/tags/20260408.tar.gz"
  sha256: "ddc5d3e0f54030e2348484fff681861a161efb4e388e20631209574e7884ad39"

patches:
  - patch_file: "patches/0002-aslts-summary-ohos.patch"
    patch_description: "Run ASLTS result and PATH loops in GNU Bash without pipeline subshells."
  - patch_file: "patches/0003-aslts-tmpdir-ohos.patch"
    patch_description: "Route ASLTS staging through TMPDIR because HarmonyOS /tmp is read-only."
  - patch_file: "patches/0004-aslts-shebang-env-ohos.patch"
    patch_description: "Use env bash shebangs so ASLTS helpers resolve GNU Bash on HarmonyOS."
  - patch_file: "patches/0005-aslts-no-jobserver-ohos.patch"
    patch_description: "Force ASLTS rebuilds to -j1 because HarmonyOS rejects make jobserver FIFOs."
  - patch_file: "patches/0006-aslts-install-to-mkdir-ohos.patch"
    patch_description: "Replace the unavailable install command with mkdir for ASLTS staging."
  - patch_file: "patches/0007-aslts-per-case-tsv-ohos.patch"
    patch_description: "Record each ASLTS case result in an auditable TSV for pass and fail counting."
  - patch_file: "patches/0008-aslts-invalid-break-ohos.patch"
    patch_description: "Skip AML moves after compile failure instead of executing an invalid break outside its loop."
