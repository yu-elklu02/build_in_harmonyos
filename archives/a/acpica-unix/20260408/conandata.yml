sources:
  url: "https://github.com/acpica/acpica/archive/refs/tags/20260408.tar.gz"
  sha256: "ddc5d3e0f54030e2348484fff681861a161efb4e388e20631209574e7884ad39"

patches:
  - patch_file: "patches/0002-aslts-summary-ohos.patch"
    patch_description: "Avoid pipeline subshells while collecting ASLTS results on OHOS."
  - patch_file: "patches/0003-aslts-tmpdir-ohos.patch"
    patch_description: "Route aslts staging through ${TMPDIR} (HarmonyOS /tmp readonly)."
  - patch_file: "patches/0004-aslts-shebang-env-ohos.patch"
    patch_description: "Replace #!/bin/bash shebangs on aslts.sh + tests/aslts/bin/* + tests/templates/templates.sh with #!/usr/bin/env bash so helpers resolve GNU Bash from PATH (HarmonyOS has no /bin/bash)."
  - patch_file: "patches/0005-aslts-no-jobserver-ohos.patch"
    patch_description: "Force aslts.sh's rebuild `make -j$jobs` to -j1; HarmonyOS MAC rejects GNU make jobserver mkfifo in the build folder (Operation not permitted). MAKEFLAGS=-j1 is overridden by the hardcoded -j$jobs."
  - patch_file: "patches/0006-aslts-install-to-mkdir-ohos.patch"
    patch_description: "Replace GNU coreutils `install -d -m 775` with `mkdir -p -m 775` in tests/aslts/Makefile.def. HarmonyOS PATH has no `install` binary (Error 127 from Makefile.def:78), causing every per-case `make install` to bail and __STATUS_OF_TEST_CASES to ship empty (only |TOTAL||). mkdir is toybox-built-in and supports -p -m, so aslts.sh can stage the aml tree and actually run each case."
  - patch_file: "patches/0007-aslts-per-case-tsv-ohos.patch"
    patch_description: "Append each test case result to aslts/tmp/RESULTS/aslts-results.tsv (case<TAB>PASS|FAIL<TAB>exit-code) from run_test_case() in tests/aslts/bin/asltsrun. Bypasses do_summary_of_mode's `cat | while read; ... break` pipeline, which on HarmonyOS toybox /bin/sh rejects ('break: can't break') — leaving __STATUS_OF_TEST_CASES empty and Summary with blank pass/fail. The Conan recipe build() reads the TSV to count pass/fail/skip and raise on any FAIL."
