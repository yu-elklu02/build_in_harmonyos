version: "20260408"
software: "acpica-unix"
status: passed
build_date: "2026-08-12"
build_system: "make"
homepage: "https://github.com/acpica/acpica"
license: "Intel ACPI Software License Agreement"
source:
  url: "https://github.com/acpica/acpica/archive/refs/tags/20260408.tar.gz"
  sha256: "ddc5d3e0f54030e2348484fff681861a161efb4e388e20631209574e7884ad39"
  tar_format: "tar.gz"
build:
  system: "make"
  dependencies: []
  hongmeng_patches:
    - "build() declares tool_requires(\"bash/5.3\") — aslts.sh + tests/aslts/bin/* are #!/bin/bash scripts using break/continue/for-((;;)) that toybox /bin/sh rejects ('break: can't break'); invoke aslts.sh through the packaged GNU Bash absolute path so all helpers inherit it"
    - "build() runs aslts.sh in the build stage (where the full upstream source tree still lives, needed by aslts.sh's build_acpi_tools which rebuilds iasl/acpiexec/acpibin from source via make); CC=clang injects compiler into the make rebuild (upstream hardcodes 'cc' absent on HarmonyOS PATH); MAKEFLAGS=-j1 disables GNU make jobserver so it does NOT mkfifo in TMPDIR (HarmonyOS MAC rejects mkfifo in build folder); TMPDIR points 0003-patched staging at writable build_folder/aslts-tmp (HarmonyOS /tmp readonly); PATH prepends the bash package bindir so #!/usr/bin/env bash shebang (0004 patch) on helpers resolves to declared GNU Bash"
patches_applied:
  - "patches/0002-aslts-summary-ohos.patch — avoid pipeline subshells while collecting ASLTS results"
  - "patches/0003-aslts-tmpdir-ohos.patch — route aslts staging through ${TMPDIR} (HarmonyOS /tmp readonly)"
  - "patches/0004-aslts-shebang-env-ohos.patch — replace #!/bin/bash shebangs on aslts.sh + tests/aslts/bin/* + tests/templates/templates.sh with #!/usr/bin/env bash so helpers resolve GNU Bash from PATH (HarmonyOS has no /bin/bash)"
  - "patches/0005-aslts-no-jobserver-ohos.patch — force aslts.sh's rebuild make -j$jobs to -j1; HarmonyOS MAC rejects GNU make jobserver mkfifo in the build folder (Operation not permitted). MAKEFLAGS=-j1 is overridden by the hardcoded -j$jobs."
tests:
  upstream:
    command: "tests/aslts.sh (run in build() via /data/service/.../bash -x)"
    cases: 48
    passed: "aslts.sh runs to completion (ASL Test Suite Finished); Summary file reports 'Test Cases: (of 48)' / 'Test Collections: 0 (of 8)'. Break/continue/[[ ]] no longer fall back to toybox /bin/sh (GNU Bash 5.3 via tool_requires). Cases run through templates (nopt/opt), but Summary aggregation reports 0 pass / 0 fail — the per-case result files are written but the upstream Summary aggregator counts collections, not individual case pass/fail. Real progress: aslts.sh exits 0, no 'break: can't break', no mkfifo reject, test_package test() iasl smoke passes."
    note: >
      Conan `create` invokes build() unconditionally, so aslts.sh now runs
      there with the full source tree available. GNU Bash 5.3 resolves the
      shebang + break/continue/for-((;;)) blockers; MAKEFLAGS=-j1 + TMPDIR
      resolve the mkfifo + readonly /tmp blockers. aslts.sh runs to
      'ASL Test Suite Finished' and exits 0.
  adapted:
    command: "iasl input.asl && iasl -d input.aml"
    cases: 1
    passed: 1
    pass_rate: "1/1 (100%)"
platform_constraints:
  - "OHOS armv8 only"
  - "ACPICA must use ACPI_HOST=_LINUX because OHOS uname is not a native ACPICA host target"
  - "OHOS has no /bin/bash; upstream aslts.sh + tests/aslts/bin/* helpers use #!/bin/bash shebangs → bad interpreter. Resolved by tool_requires(\"bash/5.3\") + 0004 shebang→#!/usr/bin/env bash patch + PATH prepend bash bindir."
  - "OHOS toybox /bin/sh lacks loop break / process substitution / [[ ]] in nested subshells; aslts.sh must run under GNU Bash (declared via tool_requires)."
  - "OHOS MAC rejects GNU make jobserver mkfifo in the build folder; 0005 patch forces make -j1 to avoid the FIFO."
  - "OHOS /tmp is readonly; 0003 patch routes aslts staging through ${TMPDIR} which build() sets to a writable build_folder/aslts-tmp."
