package: "abcmidi/20260609"
homepage: "https://github.com/sshlien/abcmidi"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - description: "Eight version smoke tests and eleven golden-file conversion tests"
    command: "ctest --output-on-failure"
test_package_tests:
  - file: "sample.abc"
    description: "Convert ABC to MIDI and assert a valid MIDI header"
    command: "abc2midi sample.abc -o sample.mid && python3 verify_midi.py sample.mid"
  - file: "sample.abc"
    description: "Convert generated MIDI back to ABC and assert required fields"
    command: "midi2abc sample.mid > roundtrip.abc && python3 verify_abc.py roundtrip.abc"
assertion_count: 3
