# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "atool 0.39.0 是 Perl 脚本工具，用于管理多种档案格式（tar/gzip/zip 等），提供 aunpack/apack/als/acat/adiff/arepack 命令"
  - "上游使用 Autotools 构建系统，Release tarball 已预生成 configure/Makefile.in，无需 autoreconf"
  - "configure.ac 无 AC_CANONICAL_HOST，不做平台检测，无需 patch config.guess/config.sub (E007)"
  - "OHOS 适配需修复 configure 脚本 shebang (E165): #! /bin/sh -> #!/system/bin/sh"
  - "atool 脚本模板（atool.in 等）使用 #!@PERL@，由 configure 替换为实际 perl 路径，不需要手动 patch shebang"
  - "通过设置 PERL 环境变量让 configure 把 @PERL@ 替换为 OHOS 上的 perl 路径"
  - "E129: HMDFS 文件系统对新目录强制 setgid，umask 077 创建的 drwx--S--- 阻止所有者写入 -> config.status 的 subs1.awk Permission denied -> must replace umask 077 with umask 022 in both configure and config.status"
  - "atool 是 CLI 应用程序 (application)，非库。package_info 中 libs=[]，bindirs=['bin']"
  - "安装产物：bin/atool, bin/aunpack, bin/apack, bin/als, bin/acat, bin/adiff, bin/arepack + man 页"
