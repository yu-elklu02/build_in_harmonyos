# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: atool/0.39.0
homepage: "https://www.nongnu.org/atool/"

# atool 上游自带测试套件（make check），但依赖 Perl 测试框架和外部压缩工具
# OHOS 环境可能缺少部分依赖，CI 环境采用 test_package 功能烟雾测试
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
# 参考 Homebrew formula 的测试逻辑：apack 打包 + als 列出
test_package_tests:
  - file: test_atool.sh
    description: "验证 atool --version、apack 创建档案、als 列出档案内容"
    command: "bash test_atool.sh <package_folder>"

# 测试断言总数
# 3 个测试场景: --version 版本输出、apack 创建档案、als 列出档案内容
assertion_count: 3
