software: atool
display: "atool"
description: "atool - 各类档案格式（tar/gzip/zip 等）的命令行前端，提供 aunpack/apack/als/acat 等统一接口"
category: tools
homepage: "https://www.nongnu.org/atool/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游使用 Autotools 构建系统，atool 本身是 Perl 脚本工具，无 C 编译"
    - "Homebrew formula 使用 ./configure --prefix + make install 标准流程"
    - "OHOS 适配需修复 configure 脚本 shebang (E165): /bin/sh -> /system/bin/sh"
    - "Perl 脚本 shebang 需修复: /usr/bin/perl -> /data/service/hnp/bin/perl"
    - "atool 是 CLI 应用程序，package_info 中 libs=[]，bindirs=['bin']"
    - "运行时依赖 perl 和外部压缩工具（tar/gzip/bzip2/zip 等），构建期无依赖"
  common_dependencies: []

versions:
  "0.39.0":
    status: built
    build_date: "2026-07-15"
