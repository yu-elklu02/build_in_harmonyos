# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apt-dater-host/1.0.1
homepage: "https://github.com/DE-IBH/apt-dater-host"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# apk/Makefile has a 'check' target that runs apk/test-apt-dater-host
upstream_tests:
  - file: apk/test-apt-dater-host
    source: apt-dater-host-1.0.1/apk/test-apt-dater-host
    description: "apk variant functional tests (bats-like, uses apk commands)"
    command: "cd apk && ./test-apt-dater-host"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 验证脚本已安装、语法正确、行为符合预期"
    command: "bash test.sh"

# 测试断言总数 (近似值)
assertion_count: 5
