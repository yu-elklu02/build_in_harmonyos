# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 shell 脚本软件无需 configure/make，使用 Conan copy() 直接打包"
  - "apk 变体使用 /bin/sh，是 OHOS 最兼容的变体"
  - "dpkg/yum 变体为 Perl 脚本，需 Perl 运行时"
  - "shell 脚本无需 ELF 签名，可直接执行"
  - "Conan application 类型配方不设置 cpp_info.libs，改用 bindirs"
