# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: acccheck/0.2.1
homepage: https://labs.portcullis.co.uk/tools/acccheck/

# 上游测试命令 — acccheck 上游无测试套件（纯 Perl 脚本工具）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# acccheck 为纯脚本工具，无编译与测试目标，仅验证脚本可执行
upstream_tests:
  - file: acccheck.pl
    source: acccheck-0-2-1/acccheck.pl
    description: "acccheck 使用验证 — 无参数运行时输出用法帮助"
    command: "perl acccheck.pl"
    condition: "native / 交叉编译均适用（脚本无需编译）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.sh
    description: "验证 acccheck.pl 存在于 package 的 bin/ 目录且可被 perl 执行（产物检查 + 无条件运行，gsan/fcheck 先例）"
    command: "conan create (test_package test.sh 调用)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2