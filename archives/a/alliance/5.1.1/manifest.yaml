version: "5.1.1"
status: built
build_date: "2026-08-12"
conan_ref: "alliance/5.1.1"

source:
  url: "https://github.com/lip6/alliance/archive/refs/tags/v5.1.1.tar.gz"
  sha256: "7f6a380232911920887b15310b0d48717ec3d77a6247dd3feffb84f7d8cd4682"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static (R26 static)"
    - "--with-alliance-top=<package_folder>"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "GitHub tag archive 为裸源码，无预生成 configure/Makefile.in，需 autoreconf 自举（同 afuse）"
  - "configure.in 为 ISO-8859 编码，现代化转换须以 latin-1 读写；现代化在 build() 内完成（无静态 patch 文件）"
  - "HMDFS 下 config.status 临时目录 umask 077 导致不可写，须 sed 改为 000"
  - "7 个 GUI 工具依赖 X11/Motif，鸿蒙端裁剪不构建"
