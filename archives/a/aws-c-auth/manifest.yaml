software: aws-c-auth
display: "AWS C Auth"
description: "AWS SDK for C 认证库，提供 AWS 凭证管理、SigV4 签名、IAM 角色等认证机制"
category: network
homepage: "https://github.com/awslabs/aws-c-auth"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，静态库模式 (BUILD_SHARED_LIBS=OFF)"
    - "禁用测试 (BUILD_TESTING=OFF)"
  common_dependencies:
    - aws-c-common
    - aws-c-io
    - aws-c-http
    - aws-c-cal
    - aws-c-sdkutils

versions:
  "0.10.1":
    status: built
    build_date: "2026-07-16"
    published_as: aws-c-auth
    source_url: "https://github.com/awslabs/aws-c-auth/archive/refs/tags/v0.10.1.tar.gz"
