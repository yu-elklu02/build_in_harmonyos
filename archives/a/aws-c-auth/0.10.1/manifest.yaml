    - aws-c-http/0.10.14
    - aws-c-sdkutils/0.2.4
  dependency_mode: private_source_build
  cc: clang
  cxx: clang++

patches_applied:
  - "BYO_CRYPTO test build adaptation: exclude TLS-only net test files and guard TLS ctx creation in retained offline tests"
  - "BYO_CRYPTO TLS stub: aws_tls_handler_protocol returns empty buffer in aws-c-io for aws-c-http linkage"
  - "AwsTestHarness tests pin WORKING_DIRECTORY to the tests binary dir so sigv4 v4/v4a fixtures resolve on OHOS"
knowledge_gained: []
