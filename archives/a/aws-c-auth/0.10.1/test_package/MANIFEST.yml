package: aws-c-auth/0.10.1
homepage: https://github.com/awslabs/aws-c-auth

upstream_test_in_build: true
upstream_test_command: "cmake -DBUILD_TESTING=ON -DENABLE_NET_TESTS=OFF -DBYO_CRYPTO=ON; ctest --output-on-failure --timeout 300 --parallel 8"
upstream_tests:
  - path: tests/
    type: upstream C auth/credentials/signing ctest suite (198 add_test_case registrations plus 98 add_net_test_case registrations; ENABLE_NET_TESTS=OFF keeps the 196-case offline/local deterministic subset, with BYO_CRYPTO build-time source adaptation)

excluded_upstream_tests:
  - command: "ENABLE_NET_TESTS=OFF (98 add_net_test_case registrations)"
    reason: "The upstream suite labels 98 cases as requiring a working internet connection (default provider, ECS, STS Web Identity, STS direct, IMDS proxy routing). OHOS CI workers are isolated from public AWS endpoints, so these cases are not registered for the CI gate. The exclusion uses the upstream AwsTestHarness option."
  - command: "BYO_CRYPTO=ON build-time source adaptation (6 TLS-dependent net-only test files)"
    reason: "aws-c-io is built with BYO_CRYPTO on OHOS (no s2n/OpenSSL dependency). Six upstream test source files whose registrations are all add_net_test_case (cognito, ecs, login, sso, sts, sts web identity) are removed from compilation when BYO_CRYPTO is defined. They were already excluded at registration by ENABLE_NET_TESTS=OFF, so the deterministic 196-case CI set is unchanged. Retained offline x509/sso/credentials mock tests skip TLS context creation under BYO_CRYPTO, and aws-c-io provides a BYO_CRYPTO stub for aws_tls_handler_protocol so aws-c-http can link."
  - command: "AWS_BUILDING_ON_EC2 / AWS_BUILDING_ON_ECS real-service cases"
    reason: "credentials_provider_imds_real_success and credentials_provider_ecs_real_success are guarded by upstream host-detection flags and are not built on the OHOS worker."

coverage:
  enabled: false
  reason: "The contest OHOS Conan profile executes test_package but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step."

test_package_tests:
  - file: test.c
    description: Consumer tests run two offline modes: library init/cleanup and static credentials creation/getter validation, covering a portable subset of upstream credentials behavior without network or external credential providers.
    command: "test_aws_c_auth --init; test_aws_c_auth --credentials; ctest --output-on-failure"

assertion_count: 6
