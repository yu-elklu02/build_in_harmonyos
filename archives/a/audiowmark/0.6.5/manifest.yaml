package: "audiowmark"
version: "0.6.5"
status: "draft"
build_system: "autotools"
homepage: "https://github.com/swesterfeld/audiowmark"
license: "GPL-3.0-or-later"

source:
  url: "https://github.com/swesterfeld/audiowmark/archive/refs/tags/0.6.5.tar.gz"
  sha256: "63a87a512fd58a3179ae953d07b80451a76b93ec2c9454f83bb787a690b48dc0"
  tar_format: "tar.gz"

build:
  system: "autotools"
  command: "autoreconf -fi && $CONFIG_SHELL ./configure --build=aarch64-unknown-linux-ohos --with-libzita-resampler-prefix=$ZITA_PREFIX --with-ffmpeg=no --with-docs=no && make && make check"
  dependencies: ["fftw/3.3.10", "libsndfile/1.2.2", "libgcrypt/1.11.0", "libzita-resampler/1.11.2", "mpg123/1.33.5"]
  build_requirements: ["automake/1.18", "libtool/2.5.4"]
  pkg_config_aliases: ["mpg123.pc -> libmpg123.pc"]

patches_applied: []

tests:
  upstream:
    command: "make check"
    cases: 14
    passed: null
    note: "Upstream tests/Makefile.am defines 14 checks with FFmpeg/HLS disabled; pass count is recorded after OHOS armv8 validation."
  test_package:
    command: "ctest --output-on-failure"
    cases: 1
    passed: null
    note: "Installed CLI version assertion; functional watermark round-trip is pending implementation."

platform:
  target_architecture: "OHOS/armv8"
  limitations: []
