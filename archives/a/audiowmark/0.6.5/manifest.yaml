package: "audiowmark"
version: "0.6.5"
status: "draft"
build_system: "autotools"
homepage: "https://github.com/swesterfeld/audiowmark"
license: "GPL-3.0-or-later"

source:
  url: "https://github.com/swesterfeld/audiowmark/archive/refs/tags/0.6.5.tar.gz"
  sha256: "63a87a512fd58a3179ae953d07b80451a76b93ec2c9454f83bb787a690b48dc0"
  tar_format: "tar.gz"

build:
  system: "autotools"
  command: "autoreconf -fi && ./configure --with-ffmpeg=no --with-docs=no && make && make check"
  dependencies: ["fftw/3.3.10", "libsndfile/1.2.2", "libgcrypt/1.11.0", "mpg123/1.33.5"]

patches_applied: []

tests:
  upstream:
    command: "make check"
    cases: 14
    passed: null
    note: "Upstream tests/Makefile.am defines 14 checks with FFmpeg/HLS disabled; pass count is recorded after OHOS armv8 validation."
  test_package:
    command: "audiowmark --version"
    cases: 1
    passed: null
    note: "Installed CLI version output assertion."

platform:
  target_architecture: "OHOS/armv8"
  limitations: []
