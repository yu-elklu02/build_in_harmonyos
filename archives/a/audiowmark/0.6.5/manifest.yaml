package: "audiowmark"
version: "0.6.5"
status: "built"
build_date: "2026-08-26"
build_system: "autotools"
homepage: "https://github.com/swesterfeld/audiowmark"
license: "GPL-3.0-or-later"

source:
  url: "https://github.com/swesterfeld/audiowmark/archive/refs/tags/0.6.5.tar.gz"
  sha256: "63a87a512fd58a3179ae953d07b80451a76b93ec2c9454f83bb787a690b48dc0"
  tar_format: "tar.gz"

build:
  system: "autotools"
  command: "umask 000 && autoreconf -fi && sed -i 's/umask 077/umask 000/g' configure && $CONFIG_SHELL ./configure --build=aarch64-unknown-linux-ohos --with-libzita-resampler-prefix=$ZITA_PREFIX --with-ffmpeg=no --with-docs=no && make && make check"
  dependencies: ["fftw3f/3.3.10", "libsndfile/1.2.2", "libgcrypt/1.11.0", "libzita-resampler/1.11.2", "mpg123/1.33.5"]
  build_requirements: ["automake/1.18", "libtool/2.5.4"]
  pkg_config_aliases: ["mpg123.pc -> libmpg123.pc"]

patches_applied: []

tests:
  upstream:
    command: "make check"
    cases: 14
    passed: 14
    note: "OHOS armv8: all 14 upstream targets passed. Pipe-based commands in three scripts were adapted to equivalent file-based commands because the OHOS sandbox rejects pipe stdin with EACCES."
  test_package:
    command: "ctest --output-on-failure"
    cases: 2
    passed: 2
    note: "CMake configure/build completed; version assertion and file-based watermark round-trip both passed."

platform:
  target_architecture: "OHOS/armv8"
  limitations:
    - "OHOS sandbox rejects pipe stdin; three pipe-based test scenarios are adapted to file I/O while retaining their test targets."
