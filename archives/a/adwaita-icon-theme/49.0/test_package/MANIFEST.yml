# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adwaita-icon-theme/49.0
homepage: "https://gitlab.gnome.org/GNOME/adwaita-icon-theme"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# adwaita-icon-theme is a data-only package — no compiled tests
upstream_tests:
  - file: "N/A (data-only package)"
    source: "N/A"
    description: "No upstream tests — data-only icon theme package"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_package/conanfile.py"
    description: "Verifies index.theme, icon dirs, cursor symlinks, licenses, .pc file"
    command: "conan test test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
