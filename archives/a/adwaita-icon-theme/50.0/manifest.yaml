# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gtk4-update-icon-cache/gtk-update-icon-cache 在 OHOS 构建机不存在且不可安装，需把 meson.build 中 required:true 改为可选并 guard add_install_script (knowledge_ref: patches/0001-meson.build.patch)"
  - "数据型包（dataonly pkg-config）默认装到 share/pkgconfig，Conan G4 产物门禁要求 lib/ 有内容，用 install_dir 指向 libdir/pkgconfig 即可同时满足消费方查找 (knowledge_ref: patches/0001-meson.build.patch)"
  - "数据型包无 bin/lib/include 时 L2 smoke test 自动跳过、G4 仅当 lib/ 为空才失败，.pc 落入 lib/pkgconfig 即通过 (knowledge_ref: reports/conan-verify-report.md)"
  - "上游 icon 主题包无 test/tests 目录、无 test() 定义，上游 CI 用 meson dist --no-tests；测试由 test_package 消费者脚本补齐 (knowledge_ref: test_package/MANIFEST.yml)"

