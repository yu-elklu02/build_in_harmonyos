# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adwaita-icon-theme/50.0
homepage: "https://gitlab.gnome.org/GNOME/adwaita-icon-theme"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson dist --no-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试入口统计（实际仓库核查结果，2026-08-05）:
#   - 源码包内无 test/ 或 tests/ 目录（TEST_DIR_COUNT=0）
#   - meson.build 中无 test() / meson.add_test() 定义（NO_TEST_DEFS=1）
#   - 上游 CI (.gitlab-ci.yml) 使用 `meson dist --no-tests` 构建发行包，
#     不执行任何测试；junit 报告仅记录 dist 日志
#   - 结论: 上游官方测试数 = 0（数据型图标主题包，无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.py
    description: "数据型图标主题包消费者验证：index.theme / Adwaita 图标目录 / SVG / PNG / cursors 符号链接 / pkg-config dataonly 文件 / 许可证"
    command: "python3 test_package.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
