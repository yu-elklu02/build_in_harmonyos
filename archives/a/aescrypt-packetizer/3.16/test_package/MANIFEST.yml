# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: aescrypt-packetizer/3.16
homepage: "https://www.aescrypt.com"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: sha256.c
    source: aescrypt-3.16/src/sha256.c
    description: "SHA-256 验证测试（3 项）"
    command: "clang -DTEST -o sha.test sha256.c && ./sha.test"
  - file: aes.c
    source: aescrypt-3.16/src/aes.c
    description: "AES ECB Monte Carlo 加密/解密测试（6 项）"
    command: "clang -DTEST -o aes.test aes.c && ./aes.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smoke.c
    description: "消费者链接验证（AES-256 加解密往返 + SHA-256 摘要）"
    command: "./test_smoke"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
