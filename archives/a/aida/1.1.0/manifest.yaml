# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/AidaDSP/AIDA-X/releases/download/1.1.0/AIDA-X-1.1.0-src.tar.xz"

  # 源码校验和
  sha256: "5adcc603c7019f6567a83a51b8cca9a9c71c4e779240f9d30b7925d9956c9144"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
