# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # AIDA-X 内嵌所有依赖 (dpf, rtneural, FFTConvolver, r8brain) 作为 git submodules

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 平台无 OpenGL/GLX/EGL，DPF 插件需移除 UI_TYPE opengl 和 FILES_UI 进行 headless 构建"
  - "CMAKE_SYSTEM_PROCESSOR 在鸿蒙 cmake 上默认为 unknown，DPF VST3 架构检测需强制设置为 aarch64"
  - "rtneural 子模块使用 cmake_minimum_required(VERSION 2.x)，CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"

