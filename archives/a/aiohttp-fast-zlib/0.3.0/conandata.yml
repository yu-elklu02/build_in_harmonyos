# Vendored aiohttp wheels for upstream-test cohorts that the real-machine PyPI
# mirror does not carry. The mirror only has aiohttp==3.11.17 and 3.14.0, so the
# <3.11 cohort (test_enable_disable_pre_311 +
# test_enable_disable_when_all_missing_pre_311) cannot be exercised from it.
# Vendoring the exact manylinux_2_17_aarch64 / cp312 wheel that PyPI publishes
# (sha256 is the upstream PyPI digest) lets build() pip-install it from a local
# file for that cohort, so all 7 upstream cases execute for real.
#
# Source: https://pypi.org/project/aiohttp/3.10.5/#files
# (aiohttp-3.10.5-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl)
#
# Download reliability: the restricted real-machine preflight env cannot reach
# files.pythonhosted.org or kkgithub.com directly. ci/conan/build_and_test.sh's
# mirror fallback already rewrites the top-level `sources.url` with gh-proxy.com
# (a GitHub proxy reachable from the real machine). We mirror the vendored
# wheel's primary URL through gh-proxy.com too, and keep the original PyPI URL as
# the final fallback. The sha256 is the upstream PyPI digest (unchanged) — if any
# mirror serves a corrupted/partial file, Conan's get() rejects it by checksum
# and tries the next URL in the list.
vendor_wheels:
  - name: "aiohttp-3.10.5-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
    sha256: "6c225286f2b13bab5987425558baa5cbdb2bc925b2998038fa028245ef421e75"
    # Ordered URL list: gh-proxy.com mirror first (reachable on real machine),
    # original files.pythonhosted.org URL last as fallback. Conan 2's get()
    # tries each URL in turn until one passes sha256 verification.
    url:
      - "https://gh-proxy.com/https://files.pythonhosted.org/packages/f1/5a/fe3742efdce551667b2ddf1158b27c5b8eb1edc13d5e14e996e52e301025/aiohttp-3.10.5-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
      - "https://files.pythonhosted.org/packages/f1/5a/fe3742efdce551667b2ddf1158b27c5b8eb1edc13d5e14e996e52e301025/aiohttp-3.10.5-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
    mirror: "https://gh-proxy.com/https://files.pythonhosted.org/packages/f1/5a/fe3742efdce551667b2ddf1158b27c5b8eb1edc13d5e14e996e52e301025/aiohttp-3.10.5-cp312-cp312-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
