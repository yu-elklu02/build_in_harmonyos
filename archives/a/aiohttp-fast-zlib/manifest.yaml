software: aiohttp-fast-zlib
display: "aiohttp-fast-zlib"
description: "Pure Python library that swaps aiohttp's stdlib zlib backend for isal/zlib-ng when available"
category: network-library
homepage: "https://github.com/Bluetooth-Devices/aiohttp-fast-zlib"
license: Apache-2.0
build_system: pip
languages: [python]

ohos_adaptation:
  key_points:
    - "Pure Python library (no .so), no ELF signing or RPATH concerns"
    - "Source is GitHub tag tarball (not PyPI sdist) so tests/ ships for upstream pytest run"
    - "Runtime dep aiohttp pip-installed in build() for upstream test availability"
    - "isal/zlib_ng optional; absent ⇒ stdlib zlib fallback (supported degraded path)"
  common_dependencies: [aiohttp]

versions:
  "0.3.0":
    status: built
    build_date: "2026-08-08"
    source_url: "https://github.com/Bluetooth-Devices/aiohttp-fast-zlib/archive/refs/tags/v0.3.0.tar.gz"
