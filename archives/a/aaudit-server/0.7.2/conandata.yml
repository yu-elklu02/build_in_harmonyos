patches:
  - patch_file: "patches/0001-aaudit-common-readconfig-return-nil-on-failure.patch"
    patch_description: "readconfig 解码失败时返回 nil 而非错误字符串，确保调用方 or {} 回退正常（fix: 错误字符串是 truthy 值，or {} 不触发）"
    patch_type: "bugfix"
  - patch_file: "patches/0002-aaudit-server-fix-checksum-operator.patch"
    patch_description: "修复校验和比较运算符优先级：not A == B 被解析为 (not A) == B，not 整数始终为 false，校验和检查完全被绕过"
    patch_type: "bugfix"
  - patch_file: "patches/0003-aaudit-fix-readfile-nil-guard.patch"
    patch_description: "aaudit create 时 /etc/hostname 不存在时对 nil 调用 :gsub() 崩溃，加空值保护 (readfile() or 'unknown')"
    patch_type: "bugfix"
  - patch_file: "patches/0004-aaudit-server-fix-posix-open-mode.patch"
    patch_description: "posix.open 第三个参数 mode 传入字符串 '0644'，Lua 隐式转为十进制 644 而非八进制 0644（=420），权限错误"
    patch_type: "bugfix"
  - patch_file: "patches/0005-aaudit-repo-wrap-sendemail-to-as-array.patch"
    patch_description: "sendemail 用 ipairs 遍历 mail.to，若 to 为字符串则按字符遍历；包装为单元素数组确保正确"
    patch_type: "bugfix"
  - patch_file: "patches/0006-aaudit-repo-check-handle-return-value.patch"
    patch_description: "aas.handle() 返回 ok/msg 未使用，错误被当作正常日志输出；检查 ok，成功时打印日志，失败时输出 ERROR 到 stderr"
    patch_type: "bugfix"
  - patch_file: "patches/0007-aaudit-shell-check-json-decode-result.patch"
    patch_description: "stdin 空或 JSON 非法时 json.decode 返回 nil，后续索引 nil 崩溃；加类型检查"
    patch_type: "bugfix"
  - patch_file: "patches/0008-aaudit-update-keys-guard-empty-keydir.patch"
    patch_description: "keydir 为空时 table.concat(allkeys) 返回空串，writefile 覆盖模式清空 authorized_keys；加空表保护，空则告警退出"
    patch_type: "bugfix"
  - patch_file: "patches/0009-aaudit-server-validate-target-address.patch"
    patch_description: "target_address 由用户可控输入构造且未校验，直接拼入 io.popen/os.execute 的 shell 命令造成命令注入；在 M.handle 入口做白名单校验"
    patch_type: "bugfix"
  - patch_file: "patches/0010-aaudit-repo-guard-missing-config.patch"
    patch_description: "loadrepoconfig 在补丁 0001 后对缺失/非法配置返回 nil，dorepo() 访问 repoconf.address 崩溃；加 nil 检查，跳过并输出 WARNING"
    patch_type: "bugfix"
  - patch_file: "patches/0011-aaudit-server-fix-notify-emails-key.patch"
    patch_description: "JSON 配置键 notify_email（单数）与代码访问的 G.notify_emails（复数）不匹配，通知邮件永不发送；统一为 notify_emails"
    patch_type: "bugfix"
  - patch_file: "patches/0012-aaudit-server-fix-popen-error-check.patch"
    patch_description: "repo_update 中 ssh/lbu 与 git fast-import 的 io.popen 未检查返回值；补丁同时修复此前直接改源码引入的语法错误（else 分支缺失 end 导致整个 if/else 块无法闭合、重复的 io.popen 调用与 local TAR 遮蔽外层变量）"
    patch_type: "bugfix"
  - patch_file: "patches/0013-aaudit-harden-client-json-decode-and-lbu.patch"
    patch_description: "aaudit 客户端解析服务端回复时 json.decode 未用 pcall 保护，非法但匹配 ^{...}$ 的行会抛错崩溃；同时为 lbu package 的 io.popen 补上失败检查"
    patch_type: "bugfix"
  - patch_file: "patches/0014-aaudit-server-fix-git-show-popen-check.patch"
    patch_description: "generate_diff 中 git show 的 io.popen 未检查返回值即调用 :lines()，git 缺失/仓库损坏时崩溃；补上失败检查并返回错误"
    patch_type: "bugfix"