# 版本级 manifest 模板
# 文件位置: archives/a/aaudit-server/0.7.2/manifest.yaml

version: "0.7.2"
software: "aaudit-server"
status: built
build_date: "2026-08-04"
build_system: "custom"

source:
  # 源码文件来自 Alpine Linux aports 仓库
  url: "https://git.alpinelinux.org/aports/plain/main/aaudit/"
  sha256: "multiple files (see conandata.yml)"
  tar_format: "none (individual files)"

build:
  system: "custom"
  configure_options: []
  dependencies:
    - lua5.2
    - lua5.2-posix
    - lua5.2-cjson
    - lua5.2-socket
  cc: "none (pure Lua scripts)"
  cxx: "none"

patches_applied:
  - "patches/0001-aaudit-common-readconfig-return-nil-on-failure.patch"
  - "patches/0002-aaudit-server-fix-checksum-operator.patch"
  - "patches/0003-aaudit-fix-readfile-nil-guard.patch"
  - "patches/0004-aaudit-server-fix-posix-open-mode.patch"
  - "patches/0005-aaudit-repo-wrap-sendemail-to-as-array.patch"
  - "patches/0006-aaudit-repo-check-handle-return-value.patch"
  - "patches/0007-aaudit-shell-check-json-decode-result.patch"
  - "patches/0008-aaudit-update-keys-guard-empty-keydir.patch"
  - "patches/0009-aaudit-server-validate-target-address.patch"
  - "patches/0010-aaudit-repo-guard-missing-config.patch"
  - "patches/0011-aaudit-server-fix-notify-emails-key.patch"
  - "patches/0012-aaudit-server-fix-popen-error-check.patch"
  - "patches/0013-aaudit-harden-client-json-decode-and-lbu.patch"
  - "patches/0014-aaudit-server-fix-git-show-popen-check.patch"

knowledge_gained:
  - "aaudit-server 是 Alpine Linux 的审计工具，纯 Lua 脚本，无编译"
  - "源码在 Alpine aports 仓库中，以单个文件形式提供"
  - "Lua 脚本需安装到 /usr/share/lua/5.2/aaudit/ 目录"
  - "shell wrapper 脚本需设置可执行位"