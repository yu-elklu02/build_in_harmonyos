# 软件级 manifest（规则 17：archives/{letter}/{name}/ 软件文档索引）
# 文件位置: archives/a/aaudit-server/manifest.yaml
# 版本级细节见 0.7.2/manifest.yaml

software: aaudit-server
display: "aaudit-server"
description: "Alpine Auditor — aaudit HTTP server and audit tools for monitoring and auditing Alpine Linux systems. Includes aaudit (main audit tool), aaudit-server (HTTP server for remote audit queries), aaudit-shell (restricted shell), and key management utilities."
category: tool
homepage: "https://git.alpinelinux.org/aports/plain/main/aaudit/"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Lua 脚本工具，无编译需求，直接安装脚本到对应路径"
    - "依赖宿主环境 lua5.2 及 lua5.2-posix/cjson/socket 模块"
    - "aaudit 主入口为 shell 脚本包装器，调用 Lua 5.2 执行审计逻辑"
  common_dependencies:
    - lua5.2

versions:
  "0.7.2":
    status: built
    build_date: "2026-08-04"