# aegean 0.16.0 适配清单
# AEGeAn Toolkit：基因组注释分析工具（C 库 + 工具），Makefile 构建。
# 硬依赖 GenomeTools（genometools 1.6.5），配方内自包含构建（项目未单独适配 genometools）。

version: "0.16.0"
status: built

source:
  url: "https://codeload.github.com/BrendelGroup/AEGeAn/tar.gz/refs/tags/v0.16.0"
  tar_format: tar.gz
  genometools_url: "https://codeload.github.com/genometools/genometools/tar.gz/refs/tags/v1.6.5"

build:
  system: makefile
  configure_options:
    - "cairo=no"
    - "errorcheck=no"
  cc: clang
  notes: "cairo=no 禁用 AnnotationSketch（可选）；errorcheck=no 兼容 clang C2x 无原型函数弃用警告；genometools 自包含构建（静态库 .a，避开 .so 的 expat 符号冲突）"

patches_applied: []

test:
  upstream_cases: 11
  upstream_suite: "make test (agn-test)：unittests + parseval/locuspocus/gaeval/canon-gff3/xtractore/pmrna/tidygff3 功能测试 + 9 个 shell 脚本（AT1G05320/FBgn0035002/AmelOGSvsNCBI/align-convert 等）"
  runnable: 11
  runnable_note: "全部在本地 OHOS 环境运行通过（make test 全部 PASS）"
  pass_rate: "11/11 = 100%（本地实测）"
  consumer_test: "test_package 验证 parseval --help 可用"

knowledge_gained:
  - "aegean 硬依赖 genometools（#include genometools.h + -lgenometools），项目未适配，配方内自包含构建 genometools 1.6.5"
  - "genometools 头文件需组装到 <prefix>/include/genometools/ 结构（aegean Makefile INCS 硬编码该路径）"
  - "genometools 静态库构建成功；libgenometools.so 链接失败（expat 符号冲突），aegean 用 .a 即可"
  - "aegean 旧代码无原型函数声明，clang C2x -Werror 弃用警告需 errorcheck=no"
  - "AgnVersion.h 由 data/scripts/version.py 生成（需 python，Makefile 调 python 命令）"
