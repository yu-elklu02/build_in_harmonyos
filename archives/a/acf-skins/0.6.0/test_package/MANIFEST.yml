package: acf-skins/0.6.0
homepage: "https://gitlab.alpinelinux.org/acf/acf-skins"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  Alpine aports declares options="!check" with the comment "no test suite".
  The v0.6.0 source has no test directory, test script, or test/check target.

test_package_tests:
  - file: skin_probe.cpp
    description: "Traverse and parse the exact packaged CSS, JavaScript, PNG, and JPEG inventory"
    command: "skin_probe <package-skins-root>"
  - file: corrupt.png
    description: "Verify that a deliberately malformed PNG is rejected by the same parser"
    command: "skin_probe --expect-invalid corrupt.png"

assertion_count: 11
