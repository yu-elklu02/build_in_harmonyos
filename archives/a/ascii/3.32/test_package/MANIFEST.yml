# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ascii/3.32
homepage: "https://gitlab.com/esr/ascii"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ascii 的 make check 只运行 cppcheck 静态分析（非功能测试）
# cppcheck 在 OHOS 平台不可用，因此不集成到 build() 中
upstream_tests:
  - file: ascii.c
    source: ascii-3.32/ascii.c
    description: "cppcheck static analysis on ascii.c (upstream make check target)"
    command: "cppcheck --quiet -DREVISION='\"3.32\"' ascii.c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 ascii -v 验证二进制功能正常"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
