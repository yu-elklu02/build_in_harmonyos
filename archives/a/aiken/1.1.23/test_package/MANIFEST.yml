# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aiken/1.1.23
homepage: "https://github.com/aiken-lang/aiken"

# 上游测试命令 (Rust 项目: cargo test)
upstream_check_command: "cargo test"

# conanfile.py build() 是否已集成上游测试：是 —— build() 中 cargo build 后
# 执行 `cargo test --release --workspace --tests`，CI conan create 即运行
# 上游单元/集成测试（OHOS worker host==target，原生执行，无需 qemu/真机）
upstream_test_in_build: true
upstream_test_command: "cargo test --release --workspace --tests"

# 上游实际运行的测试程序 (Rust 单元测试，实测结果)
# 实测：828 个单元/集成测试全部通过（0 失败），在 OHOS aarch64 原生执行
upstream_tests:
  - file: crates/aiken-lang
    source: aiken-1.1.23/crates/aiken-lang
    description: "Aiken 语言前端/类型检查/代码生成单元测试（实测 481 通过）"
    command: "cargo test --release -p aiken-lang --tests"
  - file: crates/aiken-project
    source: aiken-1.1.23/crates/aiken-project
    description: "Aiken 项目管线单元测试（实测 179 通过）"
    command: "cargo test --release -p aiken-project --tests"
  - file: crates/uplc
    source: aiken-1.1.23/crates/uplc
    description: "UPLC 编译器后端单元测试（实测 152 通过）"
    command: "cargo test --release -p uplc --tests"
  - file: crates/uplc/tests
    source: aiken-1.1.23/crates/uplc/tests
    description: "UPLC 集成测试 conformance/integ_tests/pretty_tests（实测 2+5+9 通过）"
    command: "cargo test --release -p uplc --tests"

# Doc-tests 说明：aiken_lang 含 doctest，但 harmonybrew rust 1.97.1
# 工具链未随附 rustdoc，无法执行 doctest；build() 以 --tests 跳过（技术原因）
doc_tests_skipped_reason: "harmonybrew rust 1.97.1 未安装 rustdoc，cargo test 以 --tests 跳过 doctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: aiken --version 断言版本 1.1.23 + aiken --help 帮助输出"
    command: "bash test.sh <bin/aiken>"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 828 单元/集成断言（build() 内执行） + 2 冒烟断言
assertion_count: 830
