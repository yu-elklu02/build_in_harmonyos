# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust 项目在 OHOS 上构建：Rust 工具链经 harmonybrew 安装（cargo 1.97.1 满足 rust-version 1.94.1），ELF 需 binary-sign-tool 签名后才能执行"
  - "crates.io 索引网络受限：配置 rsproxy 镜像源（CARGO_HOME/config.toml source.crates-io replace-with rsproxy-sparse）"
  - "openssl-sys 依赖：设置 PKG_CONFIG_PATH 指向 harmonybrew openssl@3 的 lib/pkgconfig 与 OPENSSL_DIR"
  - "libquickjs-sys 上游补丁应用失败：系统 /usr/bin/patch 为 toybox 无法自动剥离补丁路径层级，需将 harmonybrew 的 GNU patch 加入 PATH 前置"
  - "conan package() 定位 cargo 产物：build_folder 布局因 basic_layout 解析而异，用 glob 递归查找 target/release/<bin> 更鲁棒"
