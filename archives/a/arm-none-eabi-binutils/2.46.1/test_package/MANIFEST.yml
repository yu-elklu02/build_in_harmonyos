# test_package/MANIFEST.yml
package: arm-none-eabi-binutils/2.46.1
homepage: "https://www.gnu.org/software/binutils/"

upstream_check_command: "make -C binutils check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Smoke test: verify core binutils tools --version"
    command: "arm-none-eabi-objdump --version && arm-none-eabi-objcopy --version && arm-none-eabi-ld --version && arm-none-eabi-as --version && arm-none-eabi-ar --version && arm-none-eabi-nm --version && arm-none-eabi-strip --version && arm-none-eabi-size --version"

assertion_count: 8