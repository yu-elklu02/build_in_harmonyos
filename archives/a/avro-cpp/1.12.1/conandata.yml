patches:
  "1.12.1":
    - patch_file: patches/0001-fmt-target.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        avro-cpp 1.12.1 references fmt::fmt-header-only, a CMake target
        introduced in fmt 11.x. The OHOS remote only carries fmt/8.1.1,
        which provides fmt::fmt. Remap the target so the link succeeds.
