package: "avro-cpp"
version: "1.12.1"
status: "passed"
build_system: "cmake"
homepage: "https://avro.apache.org/"
license: "Apache-2.0"

source:
  url: "https://github.com/apache/avro/archive/refs/tags/release-1.12.1.tar.gz"
  sha256: "c915b531ed952c067a56810c8b0a87f4d8837079b45c73ebdd6065d8e0a54381"
  tar_format: "tar.gz"

build:
  system: "cmake"
  command: "cmake -S lang/c++ -DAVRO_BUILD_STATIC=ON -DAVRO_BUILD_TESTS=ON -DAVRO_BUILD_EXECUTABLES=ON && cmake --build . -j1 && ctest --output-on-failure"
  dependencies: ["boost/1.84.0", "zlib/1.3.1", "fmt/8.1.1"]

patches_applied:
  - "patches/0001-fmt-target.patch"

tests:
  upstream:
    command: "ctest --output-on-failure"
    cases: 12
    passed: null
    note: "The real-machine report confirms 7 test targets were built; no upstream ctest pass count was supplied, so passed remains unclaimed."
  test_package:
    command: "ctest --output-on-failure"
    cases: 1
    passed: 1
    note: "avro_schema_parse passed on OHOS armv8 and validates JSON record schema parsing."

platform:
  target_architecture: "OHOS/armv8"
  limitations:
    - "Upstream ctest pass count must be recorded from the complete device log before claiming full upstream test success."
