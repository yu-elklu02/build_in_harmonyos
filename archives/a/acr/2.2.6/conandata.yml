sources:
  "2.2.6":
    url: "https://github.com/radareorg/acr/archive/refs/tags/2.2.6.tar.gz"
    sha256: "18c8e66c297bb8216a6de54945701e6813f404e162887456f495a01bc1b427b3"

patches:
  "2.2.6":
    - patch_file: "patches/0001-fix-m68k-coff-test-expectation.patch"
      patch_description: "Expect the COFF target OS for the m68k-coff triplet"
      patch_type: "test"
    - patch_file: "patches/0002-allow-shell-option-parsing-without-getopt.patch"
      patch_description: "Use ACR's existing argument loop when external getopt is unavailable"
      patch_type: "portability"
    - patch_file: "patches/0003-default-missing-semver-components-to-zero.patch"
      patch_description: "Treat missing semantic-version components as zero"
      patch_type: "portability"
    - patch_file: "patches/0004-avoid-unconditional-awk-and-expr.patch"
      patch_description: "Avoid awk and expr in unconditional parser startup paths"
      patch_type: "portability"
    - patch_file: "patches/0005-make-generated-host-detection-portable.patch"
      patch_description: "Generate host detection without awk or tr"
      patch_type: "portability"
