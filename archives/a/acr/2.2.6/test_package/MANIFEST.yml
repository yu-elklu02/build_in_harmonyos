package: acr/2.2.6
homepage: "https://github.com/radareorg/acr"

upstream_test_in_build: true
upstream_test_command: "cd tests && sh test-triplet.sh && sh test.sh"

upstream_tests:
  - file: tests/test.sh
    description: "Generates and executes configure scripts for all 18 upstream examples"
    command: "cd tests && sh test.sh"
  - file: tests/test-triplet.sh
    description: "Checks all 12 active upstream host-triplet mappings"
    command: "cd tests && sh test-triplet.sh"

test_package_tests:
  - file: test_acr.py
    description: "Version, configure generation, and missing-input negative case"
    command: "python3 test_acr.py <packaged-acr>"
  - file: test_emulator.sh
    description: "Runs the same three consumer scenarios on the HarmonyOS PC emulator"
    command: "/system/bin/sh test_emulator.sh <package-root>"

assertion_count: 6
emulator_assertion_count: 7
