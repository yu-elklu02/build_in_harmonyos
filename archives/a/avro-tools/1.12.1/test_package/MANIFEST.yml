# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: avro-tools/1.12.1
homepage: "https://avro.apache.org/"

# avro-tools 是预构建 Java JAR，上游无 make check / ctest 等构建系统测试
# 上游验证来源: homebrew 配方 test block
#   assert_match "Version #{version}", shell_output("#{bin}/avro-tools 2>&1", 1)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 预构建 JAR 包，无源码级测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 avro-tools 验证输出包含 Version 1.12.1 (等价 homebrew test block)"
    command: "bash test.sh"

# 测试断言总数 (版本号匹配 = 1 个断言)
assertion_count: 1
