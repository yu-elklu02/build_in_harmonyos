package: adobe-source-serif/4.005
homepage: "https://github.com/adobe-fonts/source-serif"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  Adobe 4.005R Desktop 发布包仅包含预构建字体、许可证和说明文件，不包含
  test/tests 目录、测试目标或自动化测试脚本，因此无可执行的上游测试套件。

test_package_tests:
  - file: font_probe.cpp
    description: "解析包内 124 个 OTF/TTF 字体的表目录、边界和必要表"
    command: "font_probe <package-font-root> 124"
  - file: corrupt.otf
    description: "截断字体故障注入必须被同一解析器拒绝"
    command: "font_probe --expect-invalid corrupt.otf"

assertion_count: 126
