# test_package/MANIFEST.yml
package: ansifilter/2.22
homepage: "https://gitlab.com/saalen/ansifilter"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/ci_test.sh
    source: ansifilter-2.22/src/ci_test.sh
    description: "CI test script (upstream)"
    command: "cd src && bash ci_test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: --version, --help, ANSI pipe filtering"
    command: "./test.sh"

# 测试断言总数
assertion_count: 3