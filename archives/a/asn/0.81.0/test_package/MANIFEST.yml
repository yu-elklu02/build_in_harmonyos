# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: asn/0.81.0
homepage: "https://github.com/nitefood/asn"

# 上游测试命令（asn 为纯 Bash 脚本项目，无上游测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 脚本存在性、语法检查、版本验证、用法输出"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 4
