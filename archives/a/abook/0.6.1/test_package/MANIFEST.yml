# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: abook/0.6.1
homepage: ""

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "make check"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test.sh
    source: abook-0.6.1/test_package/test.sh
    description: "Run abook --help, --formats, format conversions, and mutt-query"
    command: "abook --help; abook --formats; abook --convert ...; abook --mutt-query ..."

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run abook binary: --help, --formats, CSV->vCard, abook->mutt, abook->csv, mutt-query"
    command: "abook --help && abook --formats && abook --convert ... && abook --mutt-query ..."
  - file: test.sh
    description: "Shell script running abook --help, --formats, format conversions, mutt-query"
    command: "sh test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 7
