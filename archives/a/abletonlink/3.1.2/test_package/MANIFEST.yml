# test_package/MANIFEST.yml — abletonlink 3.1.2
package: abletonlink/3.1.2
homepage: "https://github.com/Ableton/link"

# 上游测试为 Catch2 可执行文件（未注册 ctest），直接运行测试程序。
upstream_check_command: "./bin/LinkCoreTest && ./bin/LinkDiscoveryTest"
upstream_test_in_build: true
upstream_test_command: "bin/LinkCoreTest && bin/LinkDiscoveryTest"

# 上游 25 个 TEST_CASE（源码审计 src/ 下 Catch2 测试）：
#   LinkCoreTest       16 个（src/ableton/link/*.cpp + tst_Link.cpp）
#   LinkDiscoveryTest   9 个（src/ableton/discovery/*.cpp，其中 tst_Messages.cpp 4 个）
upstream_tests:
  - file: src/ableton/link/tst_Tempo.cpp
    source: link-3.1.2/src/ableton/link/tst_Tempo.cpp
    description: "Link core 单元测试（Catch2，含 tempo/timeline/peers 等）"
    command: "./LinkCoreTest"
  - file: src/ableton/discovery/tst_UdpMessenger.cpp
    source: link-3.1.2/src/ableton/discovery/tst_UdpMessenger.cpp
    description: "Link discovery 单元测试（Catch2，UDP 组网）"
    command: "./LinkDiscoveryTest"

test_package_tests:
  - file: test.cpp
    description: "消费者测试：构造 Link、SessionState tempo 读写、enable/numPeers/beatAtTime"
    command: "./test_abletonlink"

assertion_count: 25
