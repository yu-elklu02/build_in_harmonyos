sources:
  url: "https://github.com/Ableton/link/archive/refs/tags/Link-3.1.2.tar.gz"
  sha256: "2673dfad75b1484e8388deb8393673c3304b3ab5662dd5828e08e029ca8797aa"

# The GitHub release tarball does NOT include the `modules/asio-standalone`
# git submodule (empty directory).  AsioStandaloneConfig.cmake expects the
# asio headers under modules/asio-standalone/asio/include, so the pinned
# asio 1.28.0 release is fetched separately into that location.
asio:
  url: "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-28-0.tar.gz"
  sha256: "226438b0798099ad2a202563a83571ce06dd13b570d8fded4840dbc1f97fa328"

patches:
  - patch_file: "patches/0001-ohos-platform-config.patch"
    patch_description: "0001 ohos platform config: treat OHOS/HarmonyOS as Linux in AbletonLinkConfig.cmake"
    patch_type: "portability"
  - patch_file: "patches/0002-remove-werror.patch"
    patch_description: "0002 remove werror: drop -Werror from ConfigureCompileFlags.cmake"
    patch_type: "portability"
