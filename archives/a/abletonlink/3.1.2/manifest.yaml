# 版本级 manifest — abletonlink 3.1.2

version: "3.1.2"
software: abletonlink
status: built
build_date: "2026-08-11"
build_system: cmake

source:
  url: "https://github.com/Ableton/link/archive/refs/tags/Link-3.1.2.tar.gz"
  sha256: "2673dfad75b1484e8388deb8393673c3304b3ab5662dd5828e08e029ca8797aa"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DLINK_BUILD_TESTS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-platform-config.patch"
  - "0002-remove-werror.patch"

knowledge_gained:
  - "官方 release tarball 不含 modules/asio-standalone 子模块，需单独下载 asio 1.28.0 到 modules/asio-standalone/asio/include"
  - "AbletonLinkConfig.cmake 需为 OHOS/HarmonyOS 定义 LINK_PLATFORM_LINUX（平台层复用 Linux 实现）"
  - "上游 ConfigureCompileFlags 的 -Weverything -Werror 跨平台易编译失败，需移除"
  - "库为 header-only（Ableton::Link 为 INTERFACE target），无编译产物，测试为 Catch2 可执行文件"
