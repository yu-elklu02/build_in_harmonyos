software: abletonlink
display: "Ableton Link"
description: "Ableton Link 跨设备/跨应用同步音乐节拍、速度与相位（header-only C++ 库）"
category: network
homepage: "https://github.com/Ableton/link"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "库为 header-only（Ableton::Link 为 INTERFACE target），无编译产物"
    - "需为 OHOS/HarmonyOS 定义 LINK_PLATFORM_LINUX（平台层复用 Linux 的 clock_gettime/getifaddrs 实现）"
    - "官方 release tarball 不含 asio-standalone 子模块，需单独获取 asio 1.28.0"
    - "上游测试为 Catch2 可执行文件（LinkCoreTest/LinkDiscoveryTest），未注册 ctest"
  common_dependencies:
    - asio

versions:
  "3.1.2":
    status: built
    build_date: "2026-08-11"
    conan_ref: "abletonlink/3.1.2"
