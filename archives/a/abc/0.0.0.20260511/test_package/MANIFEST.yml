# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: abc/0.0.0.20260511
homepage: "https://github.com/berkeley-abc/abc"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# abc 无 make check 目标，上游通过 demo 命令验证：
#   abc -c "r i10.aig; b; ps; b; rw -l; rw -lz; b; rw -lz; b; ps; cec"  (Networks are equivalent)
upstream_tests:
  - file: "i10.aig"
    source: "abc-c61f1a04/i10.aig"
    description: "上游 demo 等价性验证（已本地实测通过）"
    command: "abc -c 'r i10.aig; b; ps; b; rw -l; rw -lz; b; rw -lz; b; ps; cec'"

# test_package 中自带的测试 (消费者视角验证)
# CLI 工具，通过 popen 执行 abc -c 'version' 验证
test_package_tests:
  - file: "test.c"
    description: "执行 abc -c 'version' 验证输出 'UC Berkeley, ABC'"
    command: "./test_abc"

# 测试断言总数 (近似值)
assertion_count: 1
