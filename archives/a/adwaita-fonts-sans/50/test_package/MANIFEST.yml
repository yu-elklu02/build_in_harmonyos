# MANIFEST.yml — adwaita-fonts-sans 50 test_package declaration
# Lists upstream test details for compliance tracking.

type: "manual"
description: >
  The upstream adwaita-fonts project does not include a test suite.
  This test_package verifies that the font files are correctly installed
  to the expected location (share/fonts/Adwaita/).

upstream_tests:
  has_test_suite: false
  test_count: 0
  test_locations: []

package_tests:
  - description: "Verify Adwaita Sans .ttf files are installed"
    type: "conan test_package"
    test_count: 2
    checks:
      - "AdwaitaSans-Regular.ttf exists in share/fonts/Adwaita/"
      - "AdwaitaSans-Italic.ttf exists in share/fonts/Adwaita/"
  - description: "Verify OFL-1.1 LICENSE is installed to share/licenses/adwaita-fonts-sans/"
    type: "conan test_package"
    test_count: 1
    checks:
      - "LICENSE exists in share/licenses/adwaita-fonts-sans/ and contains SIL OPEN FONT LICENSE"