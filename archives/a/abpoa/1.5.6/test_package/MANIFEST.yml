# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: abpoa/1.5.6
homepage: "https://github.com/yangao07/abpoa"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# abpoa 上游无 make check / ctest 测试套件（仓库仅有 test_data 数据文件与 example.c）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无独立测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "abpoa_msa 冒烟测试：初始化、3 条序列部分有序比对、一致性序列生成验证"
    command: "./test_abpoa"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
