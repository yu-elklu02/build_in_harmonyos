# 版本级 manifest
# 文件位置: archives/a/at-spi2-core/2.60.5/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "2.60.5"
software: at-spi2-core
status: built
build_date: "2026-08-13"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/at-spi2-core/2.60/at-spi2-core-2.60.5.tar.xz"
  sha256: "6059a77d507438ff6c8d6d06025f8f9f5774fa0f8eabe9c9b059b1cc41e1bbc0"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
  - "-Ddefault_library=static"
  - "-Dintrospection=disabled"
  - "-Dx11=disabled"
  - "-Duse_systemd=false"
  - "-Ddefault_bus=dbus-daemon"
  - "-Ddbus_glib=disabled"
  - "-Ddocs=false"
  - "-Dgtk2_atk_adaptor=false"
  dependencies:
  - glib2/2.88.0
  - dbus/1.14.10
  - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  upstream_command: "meson test -C build"
  total: 9
  passed: 5
  failed: 4
  note: "4 个失败为 OHOS 无 dbus-daemon 会话总线（dbind/droute/memory/atk-test 依赖可用总线），平台限制；test_package 冒烟测试 1/1 通过"
test_passed: 5
test_failed: 4

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "OHOS 无 dbus-daemon 会话总线：atspi 相关 meson 测试（dbind/droute/memory/atk-test）无法运行，纯 ATK 测试通过；配方 build() 不跑 meson test，改由 test_package 验证"
- "Conan 2 静态库包不向消费者传播传递依赖 headers：中间静态库配方需对公共头会被下游 include 的依赖显式 transitive_headers=True，否则消费方 CMakeDeps 的 INCLUDE_DIRS 为空（'glib.h' file not found）"
- "静态库包交付 CLI/守护进程时 VirtualRunEnv 不会把 cpp_info.bindirs 加入 PATH，需 runenv_info.prepend_path('PATH', ...) 显式暴露"
- "zlib/1.3.1 为非-PIC 静态库：本包 default_library=static 整体静态交付规避 R_AARCH64 relocation"
- "libintl/dgettext：OHOS sysroot 无 gettext，依赖 glib2 的 proxy-libintl 代理头（补写 glib-2.0.pc Cflags -I${prefix}/include）"
