# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: at-spi2-core/2.60.5
homepage: "https://gitlab.gnome.org/GNOME/at-spi2-core"

# 上游测试命令 (meson test --list 结果)
upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/atk/testdocument.c
    source: at-spi2-core-2.60.5/tests/atk/testdocument.c
    description: "ATK document interface test"
    command: "testdocument"
  - file: tests/atk/testrole.c
    source: at-spi2-core-2.60.5/tests/atk/testrole.c
    description: "ATK role API test"
    command: "testrole"
  - file: tests/atk/testrelation.c
    source: at-spi2-core-2.60.5/tests/atk/testrelation.c
    description: "ATK relation API test"
    command: "testrelation"
  - file: tests/atk/teststateset.c
    source: at-spi2-core-2.60.5/tests/atk/teststateset.c
    description: "ATK state-set API test"
    command: "teststateset"
  - file: tests/atk/testvalue.c
    source: at-spi2-core-2.60.5/tests/atk/testvalue.c
    description: "ATK value API test"
    command: "testvalue"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_atk.c
    description: "消费者测试：atk 角色 API + atspi 链接验证，并冒烟测试 at-spi2-registryd / at-spi-bus-launcher"
    command: "./test_atk"

# 测试断言总数 (近似值)
assertion_count: 5
