software: "aws-crt-cpp"
version: "0.38.5"
status: built
build_date: "2026-08-09"
build_system: cmake

source:
  url: "https://github.com/awslabs/aws-crt-cpp/archive/refs/tags/v0.38.5.tar.gz"
  tar_format: tar.gz

build:
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-BUILD_TESTING=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DENFORCE_SUBMODULE_VERSIONS=OFF"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-enable-perl-for-assembly.patch"
knowledge_gained:
  - "OHOS CMAKE_SYSTEM_NAME=HarmonyOS, need to set CMAKE_SYSTEM_NAME=Linux for aws-c-io epoll detection"
  - "CMAKE_SYSTEM_PROCESSOR must be set to aarch64 for aws-lc assembly file selection"
  - "GitHub release tarball does not include git submodule content, must download separately"
  - "DISABLE_PERL=ON prevents aws-lc from generating assembly files; Perl is available on OHOS"
