# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: airlift-slice/0.16
homepage: "https://github.com/airlift/slice"

# 上游测试通过 Maven Surefire 运行（mvn clean package -B，package 阶段含 test）
# 上游测试框架：TestNG（org.testng，via io.airlift:airbase:38 parent）
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"

# 上游 TestNG 测试用例（在 build() 中运行）
# 统计来源：src/test/java/io/airlift/slice/ 目录
# 23 个测试 .java 文件，98 个 @Test 方法
upstream_tests:
  - file: src/test/java/io/airlift/slice/
    source: slice-0.16.tar.gz/src/test/java/io/airlift/slice/
    description: "上游 TestNG 测试套件（98 个 @Test 方法，23 个测试 .java 文件）"
    command: "mvn clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: test.sh
    description: "编译并运行 Java 测试程序，调用 airlift-slice Slice/Slices API (R34 实质性验证)"
    command: "bash test.sh"

# 测试断言总数
# 上游：98 个 @Test 方法（在 build() 中通过 mvn clean package 运行，package 阶段含 test）
# test_package：6 个断言（length / getByte×2 / getBytes×2 / EMPTY_SLICE）+ 1 PASS
assertion_count: 105
