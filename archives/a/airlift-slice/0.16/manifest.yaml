version: "0.16"
software: "airlift-slice"
status: built
build_date: "2026-08-08"
conan_ref: "airlift-slice/0.16"

source:
  url: "https://github.com/airlift/slice/archive/refs/tags/0.16.tar.gz"
  sha256: "80efc06e2175fb418e5bf855291ec5aa371059a061c75dc3d963b131d7f30423"
  tar_format: tar.gz

build:
  system: maven
  configure_options:
    - "clean package"
    - "-DskipTests=false"
  dependencies:
    - "BiSheng JDK 17.0.13 (cmd-pkgs install-jdk.sh)"
    - "Maven 3.6.3 (cmd-pkgs install-maven.sh; slice 0.16 tarball has no mvnw wrapper)"
  cc: ""
  cxx: ""

patches_applied: []

upstream_tests:
  framework: "TestNG (org.testng, via io.airlift:airbase:38 parent)"
  test_files: 23
  test_methods: 98
  test_command: "mvn clean package -B -DskipTests=false"
  run_in_build: true

knowledge_gained:
  - "源码编译方式：下载 GitHub tarball (airlift/slice tag 0.16)，用 Maven 编译"
  - "上游测试：98 个 @Test 方法（TestNG），23 个测试 .java 文件"
  - "build() 中运行 mvn clean package 执行上游 TestNG 测试并产出 JAR（package 阶段含 test，R34/L1c 合规）"
  - "slice 0.16 tarball 无 mvnw wrapper（早于 wrapper 约定），需系统 mvn 或 cmd-pkgs 安装 Maven 3.6.3"
  - "test_package 通过 Java API 调用验证 JAR 功能（真机运行）"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包，不需要 commands.json"
