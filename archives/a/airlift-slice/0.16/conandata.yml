# conandata.yml — airlift-slice 0.16
# 源码 tarball 从 GitHub 下载（含完整源码 + TestNG 测试代码 + pom.xml）
# 上游：io.airlift:slice:0.16（airlift/slice 仓库 0.16 tag）
# SHA256: 80efc06e2175fb418e5bf855291ec5aa371059a061c75dc3d963b131d7f30423

sources:
  url: "https://github.com/airlift/slice/archive/refs/tags/0.16.tar.gz"
  sha256: "80efc06e2175fb418e5bf855291ec5aa371059a061c75dc3d963b131d7f30423"

patches:
  - patch_file: "patches/0001-skip-git-commit-id-plugin.patch"
    patch_description: "Relax git-commit-id-plugin: failOnNoGitDirectory=false / failOnUnableToExtractRepoInfo=false. airbase:38 parent binds git-commit-id-plugin:2.1.13 to initialize phase with failOnNoGitDirectory=true (default); Conan-extracted source tree has no .git, so the plugin aborts the build before test/package run. 2.1.13 predates the -Dmaven.gitcommitid.skip command-line property (added in 2.2.4), so patching the upstream pom.xml is the only reliable fix."
    patch_type: "portability"
  - patch_file: "patches/0002-add-javax-annotation-api-test-dep.patch"
    patch_description: "Add javax.annotation:javax.annotation-api:1.3.2 as a test-scope dependency so JMH 0.9.4's BenchmarkGenerator annotation processor can resolve javax.annotation.Generated on JDK 9+ (the class was removed from the JDK and exists only in the standalone javax.annotation-api artifact). Without this, test-compile fails with java.lang.NoClassDefFoundError: javax/annotation/Generated."
    patch_type: "portability"
  - patch_file: "patches/0003-jdk17-directbuffer-compat.patch"
    patch_description: "Make io.airlift.slice.JvmUtils DirectByteBuffer constructor lookup JDK-version aware. JDK 8 exposes DirectByteBuffer(long,int,Object); JDK 9+ removed that ctor and the static initializer throws java.lang.NoSuchMethodException, taking down every code path that loads the Slice class (e.g. TestXxHash64.<init> -> Slice.setByteUnchecked -> JvmUtils.<clinit>). On JDK 9+ we fall back to the 2-arg private JNI ctor DirectByteBuffer(long,int) and drop the Object attachment via MethodHandles.dropArguments; direct memory reclamation on JDK 9+ is handled by DirectByteBuffer's internal Cleaner, so dropping the explicit attachment is safe. Also augments pom.xml with maven-surefire-plugin argLine `--add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/jdk.internal.misc=ALL-UNNAMED` so the JDK 17 strong-encapsulation bar does not block the deep reflection on java.nio.DirectByteBuffer private members."
    patch_type: "portability"
