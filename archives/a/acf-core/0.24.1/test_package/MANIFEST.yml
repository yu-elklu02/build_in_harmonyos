# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
#
# 上游无测试套件：Alpine aports main/acf-core/APKBUILD 声明
# `options="!check" # no test suite`；源码无 test/ 目录、无 make check/test 目标。

package: acf-core/0.24.1
homepage: "https://gitlab.alpinelinux.org/acf/acf-core"

# 上游测试命令（源码中不存在 make check/test 目标）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（上游无测试，故为 false）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角实质验证，R34）
test_package_tests:
  - file: test_framework.lua
    description: "加载 acf.mvc 框架、read_config 解析配置、构造 acf_cli 应用并 dispatch acf-util/welcome/read（框架核心调用链）"
    command: "lua-runner test_framework.lua <pkg>"
  - file: test_acf_core.sh
    description: "包布局检查 + 框架功能测试 + acf-cli/acfpasswd CLI 行为验证"
    command: "bash test_acf_core.sh <pkg>"

# 测试断言总数
assertion_count: 9
