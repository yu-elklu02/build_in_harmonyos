software: algernon
display: "Algernon"
description: "Small self-contained pure-Go web server with Lua, Markdown, HTTP/2, QUIC, Redis and PostgreSQL support"
category: application
homepage: "https://github.com/xyproto/algernon"
license: BSD-3-Clause
build_system: go

ohos_adaptation:
  key_points:
    - "algernon is a pure Go web server; build a linux/arm64 executable with CGO_ENABLED=0 and self-sign it with binary-sign-tool for OHOS."
    - "Keep Go caches and linker output outside the module tree (external hmfs work root) to avoid HMDFS mmap restrictions."
    - "Self-sign freshly built Go test binaries through a go test -exec wrapper so the upstream suite runs on OHOS."
  common_dependencies: []

versions:
  "1.17.10":
    status: built
    build_date: "2026-08-10"
    conan_ref: "algernon/1.17.10"
    notes: "Pure Go web server; upstream suite (118 Test cases) runs in recipe build(); consumer test verifies --version and HTTP serving."
