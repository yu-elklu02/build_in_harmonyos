software: algernon
version: "1.17.10"
status: built
build_system: go
build_date: "2026-08-10"
conan_ref: "algernon/1.17.10"

source:
  url: "https://github.com/xyproto/algernon/archive/refs/tags/v1.17.10.tar.gz"
  sha256: "e93417a833c11885285820990826b406759b122b8d5003c6a5f124e2a2c4013a"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64 for OHOS arm64"
    - "GOTOOLCHAIN=local"
    - "go build -mod=vendor -trimpath -ldflags '-s -w' -buildvcs=false -o algernon ."
    - "go test -mod=vendor ./... runs the full upstream Go test suite before go build"
    - "Fallback Go toolchain go1.26.3 (linux-amd64/linux-arm64) from mirrors.aliyun.com, sha256 verified, kept outside the module tree"
    - "Go caches, temp dirs and linker -o output use an external hmfs work root; final binary copied back to the Conan build bin"
  dependencies: []
  cc: N/A
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "E134: Go linker mmap permission denied on HMDFS — use an external hmfs work root for GOCACHE/GOMODCACHE/GOPATH and linker -o output (ref: E134)"
  - "E166: Go link 工具在 HMDFS 上 SELinux 权限限制 — 与 E134 同源的 Go 链接器 HMDFS 限制 (ref: E166)"
  - "On OHOS, freshly built Go test binaries must be self-signed via a go test -exec wrapper before the OS executes them (ref: E166)"
  - "algernon is a pure Go web server (BSD-3-Clause); the task-page C++ tag is inaccurate, no C/C++ target libraries required (ref: E134)"
  - "The upstream tarball vendors all Go module dependencies (vendor/), so -mod=vendor builds offline (ref: E134)"

validation:
  local:
    py_compile: passed
    diff_check: passed
    conan_create: passed
  ohos:
    conan_create: passed
    upstream_go_test: passed
    upstream_case_count: 119

test_results:
  type: official
  total: 119
  passed: 114
  failed: 0
  errors: 0
  skipped: 0
  timeout: 0
  note: "go test -mod=vendor ./... on OHOS arm64: 119 tests run, 114 passed, 0 failed, 0 skipped (plugin tests execute via a shim-GOROOT go wrapper that self-signs built plugin binaries)."
