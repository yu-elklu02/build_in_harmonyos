software: alglib
display: "alglib"
description: "C++ numerical analysis library"
category: math
homepage: "https://www.alglib.net/"
license: GPL-2.0-or-later
build_system: generated-cmake

ohos_adaptation:
  key_points:
    - "Upstream C++ GPL archive ships src/*.cpp, src/*.h, and test programs but no portable build system."
    - "Task version 4.7.0 maps to upstream source string and tarball name 4.07.0."
    - "Generated CMake uses AE_OS=AE_POSIX, AE_THREADING=AE_SERIAL, and ALGLIB_NO_FAST_KERNELS for a portable OHOS baseline."
    - "test_xne requires a separate no-exceptions object build with AE_OS=AE_UNKNOWN and AE_THREADING=AE_SERIAL_UNSAFE."
  common_dependencies: []

versions:
  "4.7.0":
    status: built
    build_date: "2026-08-05"
    source_url: "https://www.alglib.net/translator/re/alglib-4.07.0.cpp.gpl.tgz"
