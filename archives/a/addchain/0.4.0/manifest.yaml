# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go CLI 工具在 OHOS 上构建：Go 工具链 ELF 无 .codesign 段被 Seccomp 拦截，需 binary-sign-tool 签名后再执行"
  - "Go linker 在 hmdfs 上 mmap 输出失败（E051），链接输出目录必须放到非 hmdfs 工作区（如 /data/storage/el2/...）"
  - "版本号注入：ldflags -X github.com/mmcloughlin/addchain/meta.BuildVersion=v0.4.0 使 addchain version 输出正式版本号"
  - "参考同类 Go CLI 适配 ain/1.6.0 的工具链签名与 HMDFS 链接规避模式"
