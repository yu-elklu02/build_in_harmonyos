# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: addchain/0.4.0
homepage: "https://github.com/mmcloughlin/addchain"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# 上游 -stress flag 仅在导入 internal/test 的 4 个包注册 (alg/dict, alg/ensemble,
# internal/gen, internal/results)；传给其余包会触发 "flag provided but not defined"
# 打印 usage 退出码 2 并早终止整个 go test ./...。故拆两轮：wave1 ./... 无 -stress
# (20 个 RequireStress/RequireLong 子用例 SKIP)，wave2 -stress 只跑 4 个 stress 包。
upstream_test_command: "wave1: go test -v -count=1 ./...  |  wave2: go test -v -count=1 -stress ./alg/dict/... ./alg/ensemble/... ./internal/gen/... ./internal/results/..."

# 上游实际运行的测试程序 (Go 单元测试，go test ./... 覆盖所有包)
# 共 62 个 Test 函数分布在 33 个含测试的包中 (chain, program, meta, acc/*, alg/*, internal/*)
upstream_tests:
  - file: .
    source: addchain-0.4.0
    description: "根包加法链核心逻辑测试 (chain.go/program.go 共 4 个 Test)"
    command: "go test ."
  - file: acc
    source: addchain-0.4.0/acc
    description: "ACC 抽象计算链测试 (acc/decompile/parse/pass/roundtrip/translate 共 13 个 Test)"
    command: "go test ./acc/..."
  - file: alg
    source: addchain-0.4.0/alg
    description: "加法链算法测试 (binary/contfrac/dict/ensemble/heuristic/opt 共 15 个 Test)"
    command: "go test ./alg/..."
  - file: internal
    source: addchain-0.4.0/internal
    description: "内部工具测试 (bigint/bigints/calc/errutil/examples/gen/metavars/polynomial/prime/results 共 21 个 Test)"
    command: "go test ./internal/..."
  - file: meta
    source: addchain-0.4.0/meta
    description: "项目元数据测试 (meta_test.go 共 1 个 Test)"
    command: "go test ./meta"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: addchain version 断言版本 0.4.0 + help 帮助输出 + eval 子命令数值输出"
    command: "bash test.sh <bin/addchain>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
