# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "acme-tiny-pyc 是 Alpine 生态中 acme-tiny 的预编译 Python bytecode 子包，本任务按路径 A 独立归档，源码来源为 acme-tiny 5.0.3 的 PyPI sdist"
  - "独立包需要同时保留 acme_tiny.py（运行所需模块文件）并额外提供预编译 bytecode（__pycache__/*.pyc），因为 Alpine 的 pyc 子包依附主包存在，而本包独立归档必须自包含可运行"
  - "纯 Python 包使用 settings=('os','arch')，无编译器、无 ELF 签名需求；PEP 517 wheel 产物平台无关"
  - "openssl 是运行时命令依赖（subprocess 调用 openssl dgst/rsa），不链接 C 库，不放入 conan requires()"
  - "CI 教训（#13585）：上游 tests/test_install.py 的 setUp 依赖 python -m venv（venv 内 ensurepip 在 CI 不可用），build() 不应强制运行依赖 venv/ensurepip 的上游测试，改为确定性包内自检；上游 19 用例在 CI 中如实记 skipped/unrunnable"

