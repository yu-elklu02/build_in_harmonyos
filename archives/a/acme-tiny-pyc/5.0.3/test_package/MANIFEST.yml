# test_package/MANIFEST.yml — acme-tiny-pyc 5.0.3
# 上游官方测试声明（详见 docs/TEST_QUALITY_SPEC.md）
#
# 上游测试入口（README.md + .github/workflows/*.yml 一致）：
#   coverage run --source . --omit ./setup.py -m unittest tests
# 用例总数：tests/test_module.py 17 + tests/test_install.py 2 = 19
#
# 运行情况（真机测试驱动实测口径）：
#   - 测试驱动三要素（均为测试子进程作用域，非包内容/运行时依赖）：
#     临时 python->python3 wrapper（PATH 前缀）、签名 Pebble 测试服务
#     （ACME_TINY_PEBBLE_BIN）、OPENSSL_CONF（临时 openssl.cnf）。
#   - tests/test_install.py（2 用例）：2/2 passed（python wrapper 满足 `python`
#     命令假设；venv/ensurepip 在本真机可用，CI 中 ensurepip 不可用则另述）。
#   - tests/test_module.py（17 用例）：15 passed + 2 上游条件性 skip
#     （test_success_cn / test_weak_key，skipIf(not USE_STAGING)），0 failed/errors。
#   - 未修改任何上游测试文件、断言、数据、skip 条件或预期结果。
#   - Pebble：官方 release v2.10.1（https://github.com/letsencrypt/pebble/releases/
#     download/v2.10.1/pebble-linux-arm64.tar.gz，SHA256
#     b53fd072a69eb7692451de4e8b0667e0bdf5cccd7e36fc51b8eaf2fcc135ed9f），
#     binary-sign-tool sign -selfSign 1 仅用于测试服务可执行性；测试后无残留并清理。
#   - conanfile.py build() 仅做确定性构建与包内基础自检（import / CLI 入口 /
#     pyc 生成与直接加载），不运行依赖 venv/ensurepip 或 Pebble 的上游测试。

package: acme-tiny-pyc/5.0.3
homepage: "https://github.com/diafygi/acme-tiny"

upstream_check_command: "python3 -m unittest tests"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_install.py
    source: acme_tiny-5.0.3/tests/test_install.py
    description: "安装与 CLI 冒烟（venv pip install + acme-tiny -h）；真机测试驱动下 2/2 passed"
    command: "python3 -m unittest tests.test_install"
    result: passed
  - file: tests/test_module.py
    source: acme_tiny-5.0.3/tests/test_module.py
    description: "ACME 签发流程（签名 Pebble 测试服务）；真机测试驱动下 15 passed + 2 上游条件性 skip（test_success_cn/test_weak_key）"
    command: "python3 -m unittest tests.test_module"
    result: passed

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: smoke.py
    description: "消费者断言：import acme_tiny / .pyc 存在 / .py 与 .pyc 并存 / .pyc 直接加载"
    command: "python3 smoke.py"
  - file: conanfile.py
    description: "消费者测试：调用 smoke.py + acme-tiny -h CLI smoke"
    command: "conan test test_package acme-tiny-pyc/5.0.3@"

# 测试断言总数（test_package 消费者断言 5 项；上游 19 个用例在 CI 中全部
# unrunnable/skipped，不混入断言通过率）
assertion_count: 5
