# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: abcde/2.9.3
homepage: "https://abcde.einval.com/"

# 上游无测试（Shell 脚本工具）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_abcde.sh 验证 abcde 脚本已安装、可执行且 bash 语法正确"
    command: "conan create (test_package: bash test_abcde.sh <bin_dir>)"
  - file: test_abcde.sh
    description: "真实冒烟测试:检查 bin/ 下 3 个脚本存在且可执行、shebang 为 bash、bash -n 语法检查通过"
    command: "bash test_abcde.sh <package bin dir>"

assertion_count: 3
