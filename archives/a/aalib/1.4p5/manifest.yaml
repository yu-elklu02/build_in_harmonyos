version: "1.4p5"
software: "aalib"
status: "built"
build_date: "2026-08-06"
build_system: "autotools"

source:
  url: "https://deb.debian.org/debian/pool/main/a/aalib/aalib_1.4p5.orig.tar.gz"
  sha256: "fbddda9230cf6ee2a4f5706b4b11e2190ae45f5eda1f0409dc4f99b35e0a70ee"
  tar_format: "tar.gz"

build:
