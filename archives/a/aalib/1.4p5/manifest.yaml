    - "--enable-static"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-lt-target.patch"
knowledge_gained:
  - "OpenHarmony validation: make check completed and aalib_smoke passed 1/1 on armv8."

homepage: "https://aa-project.sourceforge.net/aalib/"
license: "GPL-2.0-or-later"

tests:
  upstream:
    command: "make check"
    cases: 0
    passed: 0
    note: "The upstream distribution defines the check target but ships no test cases."
  adapted:
    command: "test_package/aalib_smoke"
    cases: 1
    passed: 1
    pass_rate: "1/1 (100%)"
  - "AAlib 1.4p5 的源码归档目录名为 aalib-1.4.0；在 OpenHarmony 上关闭 X11、SLang 和 curses 驱动以保持零 Conan 前置依赖。"
  - "Windows 本地没有 OpenHarmony Conan profile，必须在 AtomCode 真机环境执行 conan create。"
