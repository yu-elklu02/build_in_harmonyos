package: ai.robots.txt/1.47
homepage: "https://github.com/ai-robots-txt/ai.robots.txt"

# 上游测试命令（code/tests.py，unittest 11 用例，Python 3）
upstream_check_command: "python3 code/tests.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 code/tests.py"

# 上游实际运行的测试程序（unittest 用例）
upstream_tests:
  - file: code/tests.py
    source: ai.robots.txt-1.47/code/tests.py
    description: "上游 unittest：验证 robots.txt/htaccess/nginx/haproxy/Caddy/lighttpd 生成与 test_files 基准一致（11 用例）"
    command: "python3 code/tests.py"
    case_count: 11

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_ai_robots_txt.py
    description: "校验包内 robots.txt 存在且含 User-agent: 块、lib/pkgconfig/ai-robots-txt.pc 存在（L1e 可破坏物）"
    command: "python3 test_ai_robots_txt.py <pkg_root>"
assertion_count: 3
