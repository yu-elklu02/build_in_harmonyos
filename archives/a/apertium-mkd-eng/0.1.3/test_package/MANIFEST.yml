package: apertium-mkd-eng
version: "0.1.3"
test_package:
  type: explicit
  description: >
    Validates the packaged Apertium Macedonian-English linguistic data
    files. Checks file presence, non-emptiness, XML validity, and
    content-specific properties (Macedonian translation entries,
    mkd-eng mode definition, etc.).
  tests:
    - name: test_apertium.py
      description: >
        Python test script that validates 11 substantive properties:
        1. Data directory exists under share/apertium/apertium-mkd-eng/
        2. modes.xml exists and is non-empty
        3. modes.xml is valid XML with <modes> root
        4. modes.xml defines the mkd-eng translation mode
        5. Core .dix dictionary files present (mkd, eng, mkd-eng bilingual)
        6. Transfer rule files present (.t1x, .t2x, .t3x)
        7. Constraint grammar files present (.rlx, .lex)
        8. HMM tagger probability files present (.prob)
        9. Total data file count >= 10
        10. mkd-eng.dix contains Macedonian content (Cyrillic or "Macedonian")
        11. mkd-eng.dix is valid XML with <dictionary> root
        12. mkd-eng.t1x is valid XML with <transfer> root
      expected_result: All tests PASS (exit code 0)
  upstream_tests:
    available: true
    description: >
      Upstream tests are in the test/ directory using apertium-regtest.
      These require the full apertium core engine (lt-comp, lt-proc,
      cg-comp, apertium-tagger, apertium-transfer, etc.) which is not
      yet available on OHOS. The upstream test runs `apertium-regtest
      test` which processes sample texts through the full translation
      pipeline and compares against expected outputs.
    status: cannot_run
    reason: >
      apertium core engine (apertium/*) is not yet published to the
      OHOS 制品仓. The upstream tests require the full translation
      pipeline (lt-proc, cg-proc, apertium-tagger, apertium-transfer,
      apertium-interchunk, apertium-postchunk, lt-proc -p) which are
      binary tools from the apertium package. These are runtime
      dependencies, not build-time. Once apertium core is published,
      the upstream tests can be run.
