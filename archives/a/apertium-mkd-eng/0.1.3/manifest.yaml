software: apertium-mkd-eng
version: "0.1.3"
status: built
build_date: "2026-08-08"
conan_ref: "apertium-mkd-eng/0.1.3"
build_system: autotools
source:
  url: "https://github.com/apertium/apertium-mkd-eng/archive/refs/tags/v0.1.3.tar.gz"
  sha256: "0b597056bc7563d246151b518e78b0e85db33e3d6e36f6f859c6bdea0030751c"
  tar_format: tar.gz
build:
  system: autotools
  dependencies:
    runtime:
      - apertium (core engine: lt-comp, lt-proc, cg-comp, etc.)
      - cg3 (constraint grammar compiler)
    build:
      - none (pure data package, no compilation needed)
  notes: >
    This is a pure linguistic data package. The upstream Makefile.am
    compiles .dix → .bin using apertium tools (lt-comp, cg-comp, etc.).
    Since the apertium core engine is not yet published to the OHOS
    制品仓, we package the raw linguistic data files directly without
    running the compilation step. The .bin files are pre-compiled caches;
    downstream consumers with the apertium core can regenerate them.
