# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aconf/0.8.1
homepage: "https://gitlab.alpinelinux.org/alpinelinux/aconf"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# aconf 上游无 make check，通过 aconfd 脚本存在性与 Lua 模块文件检查验证
upstream_tests:
  - file: "aconf/init.lua"
    source: "aconf-0.8.1/aconf"
    description: "核心 Lua 模块存在性检查（lua/5.4 路径）"
    command: "test -f aconf/init.lua"

# test_package 中自带的测试 (消费者视角验证)
# 服务工具包：验证 aconfd 启动脚本可执行 + Lua 模块文件存在
test_package_tests:
  - file: "test.c"
    description: "验证 aconfd 可执行 + aconf/init.lua 存在"
    command: "./test_aconf"

# 测试断言总数 (近似值)
assertion_count: 2
