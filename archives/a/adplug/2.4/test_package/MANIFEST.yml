# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adplug/2.4
homepage: "https://adplug.github.io/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# adplug 的 make check 构建 test/playtest + test/emutest 测试程序
upstream_tests:
  - file: "test/emutest"
    source: "adplug-2.4/test"
    description: "上游 OPL 模拟器测试（emutest，本地实测运行正常）"
    command: "./test/emutest"

# test_package 中自带的测试 (消费者视角验证)
# 库 + CLI 工具包：验证 adplugdb -V 调用 CAdPlug::get_version()
test_package_tests:
  - file: "test.c"
    description: "执行 adplugdb -V（内部调用 libadplug get_version）验证"
    command: "./test_adplug"
    result: "PASS 1/1 (100%)"

# 本地测试通过率
local_test_pass_rate: "1/1 (100%)"

# 测试断言总数 (近似值)
assertion_count: 1
