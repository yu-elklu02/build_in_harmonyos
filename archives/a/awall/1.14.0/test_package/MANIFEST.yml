# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: awall/1.14.0
homepage: "https://gitlab.alpinelinux.org/alpine/awall"

# 上游测试命令: make LUA_VERSION=5.5 check → ./test.sh
upstream_check_command: "make LUA_VERSION=5.5 check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test.sh: 20 个 optional 策略逐一 awall diff -o 对比)
#   - 4 个生成器策略: address, filter-limit, filter-log, nat
#   - 16 个静态策略: address, clamp-mss, classify, custom, dedicated, families,
#     filter, filter-dnat, filter-limit, filter-log, ipset, nat, no-track,
#     policy, related, route-track, string, tproxy, ttl, variable-override
#   （共 20 个 dump 对比，Lua 5.5 兼容补丁后全部通过）
upstream_tests:
  - file: test.sh
    source: awall-1.14.0/test.sh
    description: "20 个 optional 策略逐个 awall enable + diff -o 对比参考 dump（纯文本，不需要 iptables）"
    command: "make LUA_VERSION=5.5 check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "awall L1 smoke test: CLI 存在性 + Lua 模块 + policy 模板 + awall list / translate 实跑"
    command: "conan test"
  - file: test.sh
    description: "结构化校验 usr/sbin/awall、Lua 模块、policy JSON、modules 布局；Lua 环境可用时实跑 awall list 与 translate"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
