# 软件级 manifest（规则 17：archives/{letter}/{name}/ 软件文档索引）
# 文件位置: archives/a/awall/manifest.yaml
# 版本级细节见 1.14.0/manifest.yaml

software: awall
display: "awall"
description: "Alpine Wall — 可扩展防火墙配置工具。将声明式 JSON 策略翻译为 iptables/ip6tables 规则集，支持 zone/service/ipset/custom-chain 等抽象，纯 Lua 实现（noarch，无 C 编译）。"
category: tool
homepage: "https://gitlab.alpinelinux.org/alpine/awall"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Lua noarch 脚本包，无 C 编译，make install 仅为文件复制"
    - "依赖宿主环境 lua5.5 及 lua-alt-getopt/lua-schema/lua-cjson/lua-pc/lua-stringy/lua-posix 模块"
    - "awall-cli shebang 为 #!/usr/bin/lua，OHOS 无此路径，需显式 lua5.5 <pkg>/usr/sbin/awall 调用"
    - "usr/share/awall/modules 是符号链接，conan 打包需用真实目录复制或重建相对链接"
    - "Lua 5.5 兼容：optfrag.combinations() 用 select('#',...) 计数避免含 nil 空洞表 # 返回 0 的边界差异"
  common_dependencies:
    - lua/5.5.0

versions:
  "1.14.0":
    status: built
    build_date: "2026-08-10"
