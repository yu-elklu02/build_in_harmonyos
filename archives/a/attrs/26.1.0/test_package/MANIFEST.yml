# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: attrs/26.1.0
homepage: "https://www.attrs.org/"

# 上游测试命令 — 上游 pytest 测试套件（26 个 tests/test_*.py，数百用例）
upstream_check_command: "pytest tests/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — 如实申报上游 pytest 测试套件
upstream_tests:
  - file: tests/test_abc.py
    source: attrs-26.1.0/tests/test_abc.py
    description: "上游 pytest 测试（ABC 相关）"
    command: "pytest tests/test_abc.py"
  - file: tests/test_cmp.py
    source: attrs-26.1.0/tests/test_cmp.py
    description: "上游 pytest 测试（比较相关）"
    command: "pytest tests/test_cmp.py"
  - file: tests/test_config.py
    source: attrs-26.1.0/tests/test_config.py
    description: "上游 pytest 测试（配置相关）"
    command: "pytest tests/test_config.py"
  - file: tests/test_converters.py
    source: attrs-26.1.0/tests/test_converters.py
    description: "上游 pytest 测试（转换器相关）"
    command: "pytest tests/test_converters.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_attrs.py
    description: "消费者测试 — 验证 attr.make_class API"
    command: "python3 test_attrs.py <site-packages>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2