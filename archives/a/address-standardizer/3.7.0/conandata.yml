sources:
  # gh-proxy.com 镜像优先（实测 2026-08-06 可用 412KB/s）；
  # github.com 直连极慢且真机预检多次 ConnectTimeout/ReadTimeout，放最后兜底。
  url:
    - "https://gh-proxy.com/https://github.com/postgis/address_standardizer/archive/refs/tags/v3.7.0.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/postgis/address_standardizer/archive/refs/tags/v3.7.0.tar.gz"
    - "https://gitclone.com/github.com/postgis/address_standardizer/archive/refs/tags/v3.7.0.tar.gz"
    - "https://kkgithub.com/postgis/address_standardizer/archive/refs/tags/v3.7.0.tar.gz"
    - "https://github.com/postgis/address_standardizer/archive/refs/tags/v3.7.0.tar.gz"
  sha256: "21f07be08747200efa71e275de079c35ba45acdc9aee0b17ed7879459d42ea43"

# PostgreSQL 18.3 source: address_standardizer is a PGXS extension and needs
# pg_config + PGXS makefile snippet + PostgreSQL *server* headers
# (postgres.h/fmgr.h/executor/spi.h/...).  PostgreSQL 18.3 exists in this
# repo only as archives/p/postgresql/18.3/build.sh — it is NOT a Conan
# package, so it cannot be declared as a tool_requires and the preflight
# environment has no system PostgreSQL installed.  We vendor the upstream
# postgresql-18.3.tar.bz2 and the HarmonyOS adaptation patch so the recipe
# can bootstrap its own pg_config + PGXS at build time.
postgresql:
  # 清华 TUNA 镜像对 postgresql 18.3 源码返回 404（路径不存在），
  # 不再使用。官方 ftp.postgresql.org 直连真机实测可下载（22.5MB），
  # 作为唯一源；如需 fallback 可后续补充可信镜像。
  url:
    - "https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2"
  sha256: "d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f"

patches:
  - patch_file: "patches/postgresql_harmony.patch"
    patch_description: "HarmonyOS adaptation for PostgreSQL 18.3 (SysV shm skip, hmdfs perm relax, Unix socket disable) — applied to the vendored PG source tree during PGXS bootstrap"
    patch_type: "portability"
    sha256: "3193a0a18f7489213f89c97969bab1f426df1908079ac657ced27dbc1b9caa5e"
