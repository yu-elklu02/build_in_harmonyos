software: address-standardizer

version: "3.7.0"
status: built
build_date: "2026-08-08"

source:
  url: "https://github.com/postgis/address_standardizer/archive/refs/tags/v3.7.0.tar.gz"
  sha256: "21f07be08747200efa71e275de079c35ba45acdc9aee0b17ed7879459d42ea43"
  tar_format: tar.gz

build:
  system: makefile
  build_system: pgxs
  configure_options: ""
  dependencies:
    - "pcre2/10.45"
    - "postgresql/18.3"
  cc: clang
  cxx: clang++

patches_applied: []

# ── Upstream test audit (hmbs evidence requirement) ───────────────────────
# Rule book: "缺少显式审计时 hmbs 必须拒绝放行" — converse: with an explicit
# audit hmbs may放行.  address_standardizer DOES have upstream tests (5
# pg_regress groups), so the `no_tests` exemption does NOT apply; we record
# the audit here AND emit HMBS_UPSTREAM_TEST_RESULT from test_package/
# upstream_test_audit.py (status=skipped, executed=0, reason below).
upstream_tests_exist: true
upstream_test_framework: pg_regress
upstream_test_count: 5
upstream_test_groups:
  - init-extensions
  - debug_standardize_address
  - parseaddress
  - standardize_address_1
  - standardize_address_2
upstream_test_runner: "make installcheck (via tools/run-check.sh: initdb cluster → pg_ctl start → CREATE EXTENSION → pg_regress)"
upstream_test_dependency: "running PostgreSQL 16+ server (postgres + initdb + pg_ctl binaries)"
upstream_test_audit: |
  Audited upstream v3.7.0 source tree (.hmbs/src-check/address_standardizer-3.7.0/).
  Upstream has 5 pg_regress groups listed in Makefile REGRESS, each with a
  matching non-empty test/sql/<name>.sql file + test/expected/<name>.out
  oracle (parseaddress alone has 87 lines of real address-data regression
  cases).  These are the ONLY upstream tests — no gtest/ctest/pytest unit
  tests exist in the tree.

  pg_regress for a PG extension needs a RUNNING PostgreSQL 16+ server:
  tools/run-check.sh does initdb → pg_ctl start → CREATE EXTENSION
  address_standardizer → make installcheck (pg_regress runs each
  test/sql/*.sql against the live server and diffs output vs
  test/expected/*.out).  The vendored postgresql-18.3 in this recipe is
  configure-only by design (conanfile.py::_bootstrap_pgxs builds pg_config
  + PGXS headers + the standalone PAGC lib, NEVER the postgres/initdb/
  pg_ctl backend binaries) — building a full PG server inside a Conan
  recipe is not low-cost补齐, and PG 18.3 backend has never been compiled
  on HarmonyOS-aarch64 (cycles 5-11 fought configure-only; backend compile
  + server start on chmod:0 / musl is unverified).

  Per the rule book's放弃 path ("上游测试依赖 OHOS 缺失的组件……补不齐再
  放弃. 放弃时如实在 ## 补充说明 写明'上游 N 个用例未运行 + 具体缺什么',
  通过率写实际值; 不得改成 100%"), the test_package runs
  upstream_test_audit.py as a ctest case that performs this same audit at
  test time and emits HMBS_UPSTREAM_TEST_RESULT with status=skipped,
  discovered=5, executed=0, skipped=5, passed=0, failed=0, and a concrete
  reason.  This is NOT a fabricated pass — it is the honest report the
  rule book sanctions for upstream tests blocked by a missing dependency.

knowledge_gained:
  - "address_standardizer 是 PostgreSQL 扩展，使用 PGXS Makefile 构建，产物为 address_standardizer.so + .control + SQL"
  - "源码紧耦合 postgres.h/fmgr.h/executor/spi.h 等服务器头文件，需 PostgreSQL 服务器开发包而非 libpq"
  - "依赖 PCRE2 (SHLIB_LINK += -lpcre2-8)，通过 PG_CPPFLAGS 注入 PCRE2 include 路径"
  - "上游测试使用 pg_regress，需 PostgreSQL 16+ 临时集群（tools/run-check.sh）"
  - "版本号在 control 文件中为 default_version = '3.7'，Makefile 通过 AS_VERSION 读取并传 -DAS_VERSION"
