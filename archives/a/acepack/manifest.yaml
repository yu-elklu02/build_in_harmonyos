software: acepack
display: "acepack"
description: "R 语言回归变换工具包（ACE 交替条件期望与 AVAS 方差稳定化变换）"
category: data
homepage: "https://cran.r-project.org/package=acepack"
license: MIT
build_system: r-package
binary: false

ohos_adaptation:
  key_points:
    - "R 包经 r-base/4.5.1 的 R CMD INSTALL 安装，无 configure/autotools"
    - "17 个 Fortran 90 源文件经 flang-ohos/20.1.0 编译；因 r-base 制品 Makeconf 中 FC=false（可重定位清理），recipe 通过 R_MAKEVARS_SITE 注入 site Makevars（FC/F77/FLIBS 指向 flang-ohos），因 R CMD SHLIB 处理 Makevars 先于 Makeconf，直接改 src/Makevars 会被 r-base 制品 Makeconf 的 FC=false 覆盖"
    - "上游测试经 base R 兼容层 mock-testthat.R 运行 18/18 通过（expect_equal 绝对容差语义）；testthat（Suggests）依赖链过长未适配"
  common_dependencies:
    - r-base
    - flang-ohos

versions:
  "1.6.3":
    status: built
    build_date: "2026-08-11"
    conan_ref: "acepack/1.6.3"
