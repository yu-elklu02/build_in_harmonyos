package: acepack/1.6.3
homepage: "https://cran.r-project.org/package=acepack"
upstream_check_command: "R CMD check"
upstream_test_in_build: false
upstream_tests:
  - file: "tests/testthat.R"
    source: "acepack_1.6.3/tests/testthat.R"
    description: "acepack 上游测试套件，由 test_check(\"acepack\") 调用；经 base R 兼容层（mock-testthat.R）在设备端运行 18/18 全部通过（expect_equal 绝对容差语义，P2 修复）"
    command: "Rscript run_upstream_tests.R TEST_PACKAGE_DIR"
    status: "18/18（P2 修复：绝对容差语义）"
test_package_tests:
  - file: "run_test.sh"
    description: "用 ported R 加载 acepack 包，执行 ace()/avas() 核心 API 断言并输出 marker；随后调用 run_upstream_tests.R 运行上游测试兼容层"
    command: "/system/bin/sh run_test.sh PACKAGE_FOLDER RSCRIPT test_acepack.R"
  - file: "test_acepack.R"
    description: "验证 acepack 加载、ace()/avas() 对真实数据拟合、输出长度与版本号"
    command: "由 run_test.sh 使用 ported R 执行"
  - file: "run_upstream_tests.R"
    description: "base R 兼容层（mock-testthat.R）运行 4 个上游测试文件，输出 PASS/FAIL 统计与明细（方案二：如实标注）"
    command: "Rscript run_upstream_tests.R TEST_PACKAGE_DIR"
  - file: "mock-testthat.R"
    description: "base R 实现的最小 testthat 兼容层（expect_*/test_that/context/test_check）"
    command: "由 run_upstream_tests.R 加载"
assertion_domains: 3
negative_tests:
  - "acepack 包不在 R library 树时 run_test.sh 必须退出 66"
support_scope: "R 回归变换工具；依赖 r-base/4.5.1 运行时与 flang-ohos/20.1.0 Fortran 编译链"
