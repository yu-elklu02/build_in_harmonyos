---
test_package: aioredis
version: "1.3.1"
test_type: explicit
description: |
  Validates the packaged aioredis Python source files. Checks file existence
  AND content (class definitions, version declarations, asyncio content).
upstream_tests:
  description: |
    The upstream aioredis 1.3.1 test suite is pytest-based and lives in the
    tests/ directory of the source archive. It requires a running Redis server
    (integration tests) and pytest/pytest-asyncio plugins. Since aioredis is
    a pure Python library packaged as source (no compiled binary), the
    test_package validates the packaged .py files structurally instead.
  location: "tests/"
  framework: pytest
  requires_redis: true
test_package_tests:
  - file: test_aioredis.py
    description: |
      Validates aioredis package content:
        1. __init__.py exists, non-empty, contains 'version'
        2. connection.py exists, contains 'class RedisConnection'
        3. pool.py exists, contains 'class ConnectionsPool'
        4. commands/__init__.py exists, contains 'class Redis'
        5. locks.py exists, contains 'class Lock'
        6. sentinel/__init__.py exists, contains 'RedisSentinel'
        7. pubsub.py exists, contains 'Channel'
        8. stream.py exists, contains 'Stream'
        9. errors.py exists, contains error class definitions
        10. Total .py files >= 10
        11. asyncio-related content present in .py files
conanfile: conanfile.py
settings: ["os", "arch"]
