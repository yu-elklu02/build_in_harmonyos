# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "toybox patch --dry-run 对 new-file 补丁会真实创建文件（E258 草稿），新增源码必须走 export_sources，补丁只保留修改文件"
  - "config.status 内 umask 077 在 HMDFS 上建 0700 临时目录不可写（E114），生成 configure 后需去掉 umask 077"
  - "make 并行 jobserver FIFO 在鸿蒙被 SELinux 禁止（E074），必须 -j1"
  - "AbiWord 核心/libgsf 未发布到 OHOS 制品仓，用 compat shim 使插件 dependency-free"

