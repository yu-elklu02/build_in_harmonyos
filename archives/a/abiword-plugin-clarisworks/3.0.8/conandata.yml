# conandata.yml — abiword-plugin-clarisworks 3.0.8
# 源码 = 官方 GNOME GitLab AbiWord release-3.0.8（git archive，无 configure）
# 构建 = minimal configure.ac 只构建 clarisworks 插件 + compat shim
# 补丁策略：仅保留 2 个修改文件补丁（Makefile.am/configure.ac）。
#   compat/（AbiWord+libgsf shim）与 tests/ 通过 conanfile.py export_sources
#   传递，不生成 new-file 补丁（toybox patch --dry-run 会真实应用 new-file
#   补丁，污染 orig 目录导致补丁管线损坏）。

sources:
  url: "https://gitlab.gnome.org/World/AbiWord/-/archive/release-3.0.8/AbiWord-release-3.0.8.tar.gz"
  sha256: "7c490e46f0a6143f84d5c7e3fed246f34486ad70cd55f162c792827607cd7e9a"

patches:
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "Replace the full AbiWord Makefile.am with a minimal build of libabiword-plugin-clarisworks.so + end-to-end test"
    patch_type: "platform"
  - patch_file: "patches/0002-configure.ac.patch"
    patch_description: "Replace the full AbiWord configure.ac with a minimal one that only builds the clarisworks plugin"
    patch_type: "platform"
