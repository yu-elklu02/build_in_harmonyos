# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本强制要求此文件存在

package: abuild/3.17.0
homepage: https://gitlab.alpinelinux.org/alpine/abuild/

# upstream tests are run via atf-shim.sh in build() — no standalone 'make check' target
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "sh atf-shim.sh '_atf_run_test <test_file> tests/'"

# Upstream ATF test suite (10 test files, ~20+ test cases)
upstream_tests:
  - file: tests/abuild_fetch_test
    source: abuild/tests/abuild_fetch_test
    description: "abuild-fetch: curl/wget invocation and locking"
    command: "atf-shim.sh"
  - file: tests/abuild_gzsplit_test
    source: abuild/tests/abuild_gzsplit_test
    description: "abuild-gzsplit: gzip stream splitting for APK packages"
    command: "atf-shim.sh"
  - file: tests/abuild_keygen_test
    source: abuild/tests/abuild_keygen_test
    description: "abuild-keygen: RSA key generation and installation"
    command: "atf-shim.sh"
  - file: tests/abuild_sign_test
    source: abuild/tests/abuild_sign_test
    description: "abuild-sign: package signing verification"
    command: "atf-shim.sh"
  - file: tests/abuild_tar_test
    source: abuild/tests/abuild_tar_test
    description: "abuild-tar: tar archive hashing and cutting"
    command: "atf-shim.sh"
  - file: tests/abuild_test
    source: abuild/tests/abuild_test
    description: "abuild: full package build pipeline tests"
    command: "atf-shim.sh"
  - file: tests/abump_test
    source: abuild/tests/abump_test
    description: "abump: package version bumping"
    command: "atf-shim.sh"
  - file: tests/apkgrel_test
    source: abuild/tests/apkgrel_test
    description: "apkgrel: package release management"
    command: "atf-shim.sh"
  - file: tests/checkapk_test
    source: abuild/tests/checkapk_test
    description: "checkapk: APK file checker"
    command: "atf-shim.sh"
  - file: tests/functions_test
    source: abuild/tests/functions_test
    description: "functions.sh: environment detection and validation"
    command: "atf-shim.sh"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "Verify abuild C tools exist and abuild-tar runs without crash"
    command: "conan test"

# 测试断言总数
assertion_count: 2