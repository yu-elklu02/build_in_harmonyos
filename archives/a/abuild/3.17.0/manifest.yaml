# ============================================================

knowledge_gained:
  - "abuild 是 Alpine 构建工具，由 shell 脚本 + C 辅助工具组成"
  - "C 工具使用 openssl（abuild-tar）和 zlib（abuild-gzsplit）"
  - "Shell 脚本通过 .in 模板替换 @VERSION@ 和 @prefix@ 生成"
  - "abuild-keygen 和 abuild-sign 需要 openssl 运行时"
  - "Makefile 使用 pkg-config 查找 openssl/zlib 依赖"
  - "无头模式可用，与 GUI 无关"