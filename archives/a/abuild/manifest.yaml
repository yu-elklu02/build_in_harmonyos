# 软件级 manifest
# 文件位置: archives/a/abuild/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: abuild

# 显示名
display: "abuild"

# 一句话描述
description: "Script to build Alpine Packages"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://gitlab.alpinelinux.org/alpine/abuild/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-only

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: make

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "C 辅助工具（abuild-tar, abuild-gzsplit 等）OHOS 编译无特殊需求"
    - "Shell 脚本跨平台，OHOS 上可直接使用"
    - "abuild-sudo 是 setuid root 的 C 工具（白名单 adduser/addgroup/apk/abuild-rmtemp + abuild 组成员校验）；OHOS 不支持 setuid 提权且无 abuild 组/白名单路径，安装时降级为 0755，运行期预期以受控错误退出（exit 1），test_package 已覆盖验证"

  common_dependencies:
    - openssl
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.17.0":
    status: pending
    build_date: ""
    archive_path: "3.17.0"
    requires_manual_verification: true
  "3.17.0.1":
    status: built
    build_date: "2026-08-10"
    archive_path: "3.17.0.1"
    requires_manual_verification: false