manifest:
  version: "3.158"
  status: built  # 基于本地 CI 实际结果（perl -c 语法检查通过）
  upstream:
    name: "adduser"
    homepage: "https://packages.debian.org/source/adduser"
    source: "https://deb.debian.org/debian/pool/main/a/adduser/adduser_3.158.tar.xz"
    sha256: "92dbed2ede56270e92289a05154856fd7332bb466bee0e27d8767019fbf30e69"
    license: "GPL-2.0-or-later"
    build_system: "none"  # 纯 Perl 脚本工具，无编译，直接复制脚本 + 模块
    test_cases:
      count: 10  # 上游 testsuite/test01~10.pl
      description: "上游 10 个 Perl 测试脚本（testsuite/test01~10.pl）+ debian/tests/f/*.t 多场景测试"
      upstream_pass_rate: "unknown"  # 上游测试需 root 权限 + 真系统用户操作，CI 环境无法跑
    adapted_test_cases:
      count: 1  # test_package perl -c 语法检查
      description: "验证 adduser/deluser 脚本存在 + perl -c 语法检查（避 root 权限只验语法）"
      pass_rate: "100%"  # 1/1
  adaptation:
    target: "OHOS arm64"
    recipe: "conanfile.py"
    patches: []  # adduser 纯 Perl 脚本，无需补丁
    dependencies:
      - "perl"  # 运行时依赖（纯 Perl 脚本工具）
    notes: "adduser 是纯 Perl CLI 工具（adduser/deluser/addgroup/delgroup 脚本 + Adduser*.pm 模块），无编译，配方 package 段直接复制脚本到 bin/ + 模块到 lib/perl5/adduser/。上游 10 个 testsuite 测试需 root 权限 + 真系统用户操作，CI 环境无法跑，适配后新增 perl -c 语法检查测试避 root 权限只验语法。"
