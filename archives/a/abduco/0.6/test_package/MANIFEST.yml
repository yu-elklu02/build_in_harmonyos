package: abduco/0.6
homepage: https://github.com/martanne/abduco

upstream_check_command: "./testsuite.sh ./abduco"
upstream_test_in_build: false
upstream_test_command: "./testsuite.sh ./abduco"
upstream_tests:
  - file: testsuite.sh
    source: abduco-0.6/testsuite.sh
    description: "Official attach/detach, exit-status, and optional dvtm tests"
    command: "./testsuite.sh ./abduco"

test_package_tests:
  - file: test_abduco.py
    description: "Run abduco -v and assert the installed version"
    command: "python3 test_abduco.py <package>/bin/abduco"

assertion_count: 1
