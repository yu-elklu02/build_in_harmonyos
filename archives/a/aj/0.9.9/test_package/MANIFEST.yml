# aj/0.9.9 test_package
# Verifies aj-snapshot binary is installed and prints usage

package: aj/0.9.9
homepage: "https://gitlab.com/aj-snapshot/aj-snapshot"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游 0.9.9 tarball 无测试框架（无 test/ 目录，无 make check 目标）；
# configure.ac 仅做依赖检查（asound/jack/mxml REQUIRED），无测试用例
upstream_tests: []

test_package_tests:
  - file: test_aj.c
    description: "验证 aj-snapshot 二进制存在且 -h 打印 usage（R34 反空壳：test() 真实执行被测包二进制）"
    command: "bash -c \"<aj-snapshot_bin> -h\"  # test_package/conanfile.py test() 定位 bin/aj-snapshot 并执行 -h 校验 usage 输出"

assertion_count: 1
