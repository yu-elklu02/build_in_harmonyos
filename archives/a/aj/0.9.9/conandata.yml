# conandata.yml — aj (aj-snapshot) 0.9.9
# aj-snapshot：JACK/ALSA MIDI 连接快照/恢复命令行工具（C，autotools 构建）。
# 硬依赖 alsa-lib/jack/mxml 三个库（configure.ac AC_MSG_ERROR 均 REQUIRED）：
#   - alsa-lib 1.2.12：cmd-pkgs 预编译包（generate() 安装）
#   - jack 1.9.22：cmd-pkgs 预编译包（generate() 安装）
#   - mxml 4.0.4：无 cmd-pkgs 包，配方内自包含构建（--disable-libmxml4-prefix 传统布局，
#     aj-snapshot 需要 mxml.h/-lmxml/mxml.pc；mxml 4.x 默认安装为 libmxml4 前缀，需禁用）

sources:
  url: "https://downloads.sourceforge.net/project/aj-snapshot/aj-snapshot-0.9.9.tar.bz2"
  sha256: "3472e0f23f4cc3d323fdec19d4c8ad9db41e004c751a99030cbcb6be7d691c7d"

# 自包含依赖：mxml 4.0.4 源码（无 cmd-pkgs 预编译包，配方内构建）
mxml:
  url: "https://codeload.github.com/michaelrsweet/mxml/tar.gz/refs/tags/v4.0.4"
  sha256: "2d865d1f8e30ab3d3e170f8b96136b650f217068c7ce99a8447b3f6b3c1ab4ee"

patches:
  - patch_file: "patches/0001-mxml4-descend-enum.patch"
    patch_description: "mxml 4.x 用 mxml_descend_t 枚举取代旧宏 MXML_NO_DESCEND（aj-jack.c/aj-alsa.c 6 处改为 MXML_DESCEND_NONE，语义等价）"
    patch_type: "portability"
    sha256: "8c06687c8b0b5100fac843a25d42c16872474c751f0297f3a0da0671f3037208"
  - patch_file: "patches/0002-mxml4-file-api.patch"
    patch_description: "mxml 4.x 的 mxmlLoadFile/mxmlSaveFile 签名改为 options 参数（aj-file.c/h：xml_whitespace_cb 加 cbdata 参数、mxmlLoadFile(NULL,NULL,fp)、mxmlSaveFile 用 mxmlOptionsNew + SetWhitespaceCallback）"
    patch_type: "portability"
    sha256: "0f9d73f9ba3910e1508800ace835ddf61895cd446b2b755659f3385a2b1263ab"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "configure 临时目录 umask 077 → 000（HMDFS 文件系统权限限制）"
    patch_type: "portability"
    sha256: "4a7fb772fda37951f8c72bafaf472a2ff548f8935d71bd43b3fd345d5181263a"

# mxml 4.0.4 自包含构建补丁（复用 main 中 archives/m/mxml/4.0.4 的补丁）
