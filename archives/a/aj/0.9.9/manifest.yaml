# aj (aj-snapshot) 0.9.9 适配清单
# aj-snapshot：JACK/ALSA MIDI 连接快照/恢复命令行工具（C，autotools 构建）。
# 硬依赖 alsa-lib/jack/mxml 三个库（configure.ac AC_MSG_ERROR 均 REQUIRED）：
#   alsa-lib 1.2.12 / jack 1.9.22 → cmd-pkgs 预编译包（generate() 安装）
#   mxml 4.0.4 → 无 cmd-pkgs 包，配方内自包含构建（传统布局）

version: "0.9.9"
status: built

source:
  url: "https://downloads.sourceforge.net/project/aj-snapshot/aj-snapshot-0.9.9.tar.bz2"
  tar_format: tar.bz2
  mxml_url: "https://codeload.github.com/michaelrsweet/mxml/tar.gz/refs/tags/v4.0.4"

build:
  system: autotools
  configure_options: []
  cc: clang
  notes: "依赖 alsa-lib 1.2.12/jack 1.9.22（cmd-pkgs 预编译包）+ mxml 4.0.4（配方内自包含构建，--disable-libmxml4-prefix 传统布局）；configure 无 AC_CANONICAL 宏，实测无需 config.guess/config.sub；umask 077→000 兼容 HMDFS"

patches_applied:
  - "0001-mxml4-descend-enum.patch"
  - "0002-mxml4-file-api.patch"
  - "0003-configure-umask.patch"
  - "mxml-0001-config.guess.patch (mxml)"
  - "mxml-0002-config.sub.patch (mxml)"
  - "mxml-0003-configure.patch (mxml)"

test:
  upstream_cases: 0
  upstream_suite: "上游 0.9.9 tarball 无测试框架（无 test/ 目录，无 make check 目标）；configure.ac 仅做依赖检查（asound/jack/mxml REQUIRED）"
  runnable: 0
  runnable_note: "上游无自动化测试用例可运行"
  pass_rate: "0/0 = 不适用（上游无测试用例）"
  consumer_test: "test_package 验证 aj-snapshot -h 打印 usage（R34 反空壳，真实调用被测包二进制）"

knowledge_gained:
  - "aj-snapshot 硬依赖 alsa-lib/jack/mxml 三库（AC_MSG_ERROR 均 REQUIRED），无法绕过；alsa-lib 1.2.12 与 jack 1.9.22 有 cmd-pkgs 预编译包，mxml 无预编译包需配方内自包含构建"
  - "mxml 4.0.4 默认安装为 libmxml4 前缀（include/libmxml4/mxml.h、libmxml4、mxml4.pc），aj-snapshot 按 mxml v3 接口（mxml.h/-lmxml/mxml.pc）编译——configure 加 --disable-libmxml4-prefix 恢复传统布局"
  - "mxml 4.x 用 mxml_descend_t 枚举取代旧宏 MXML_NO_DESCEND（MXML_DESCEND_NONE 语义等价）；mxmlLoadFile/mxmlSaveFile 签名改为 mxml_options_t 参数，whitespace 回调需 mxmlOptionsNew + mxmlOptionsSetWhitespaceCallback"
  - "aj-snapshot tarball 不含 config.guess/config.sub，但 configure.ac 无 AC_CANONICAL_* 宏（不实际执行 config.guess），实测删除后 configure+make 全链路通过，无需附带"
  - "configure 临时目录 umask 077 在 HMDFS 上不可写（Permission denied），需改 umask 000"
