package: adcli/0.9.2
homepage: "https://gitlab.freedesktop.org/realmd/adcli"

# 上游测试在 conanfile.py build() 中通过 make check 执行
# （library/Makefile.am 的 5 个 TAP 风格 check_PROGRAMS，均不依赖网络）
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: library/seq.c
    description: "seq 容器测试（test-seq，14 个用例）"
    command: "./test-seq"
  - file: library/adutil.c
    description: "adutil 字符串/SID/外部程序辅助测试（test-util，7 个用例）"
    command: "./test-util"
  - file: library/adldap.c
    description: "LDAPMod 构造/比较测试（test-ldap，6 个用例）"
    command: "./test-ldap"
  - file: library/adattrs.c
    description: "属性列表辅助测试（test-attrs，4 个用例）"
    command: "./test-attrs"
  - file: library/adenroll.c
    description: "入域流程辅助测试（test-adenroll，2 个用例）"
    command: "./test-adenroll"

test_package_tests:
  - file: test.sh
    description: "adcli --help 打印 usage 并返回 0；adcli bogus-command 拒绝未知命令并返回 2"
    command: "bash test.sh"

test_package_test_count: 2
assertion_count: 4
