version: "0.9.2"
software: adcli
status: built
build_date: "2026-08-13"
build_system: autotools

source:
  url: "https://gitlab.freedesktop.org/realmd/adcli/-/archive/0.9.2/adcli-0.9.2.tar.bz2"
  sha256: "1288b3ccd7ded42367626a9c4d95d569a37054813be2605a4852dbd9250800b2"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-doc"
    - "--disable-coverage"
  dependencies: []
  # krb5 / openldap / cyrus-sasl 未发布到 ohpcd 制品仓，真机系统前缀也没有这些
  # devel 包；generate() 用 cmd-pkgs 预编译包补齐 openldap-2.6.7 + krb5-1.22.1
  # 到 /storage/Users/currentUser/usr/local，sasl.h 从上游 cyrus-sasl 2.1.28
  # tag 获取（cmd-pkgs 无 cyrus-sasl 包；adcli 仅用头文件，不链接 libsasl）。
  cc: clang

patches_applied: []

knowledge_gained:
  - "GitLab tag 归档不含生成的 configure，build() 需先 autoreconf -fi 自举（同 abiword/cyrus-sasl 做法）。"
  - "adcli 是纯命令行工具：libadcli.la 为 noinst_LTLIBRARIES 不安装，产物仅 sbin/adcli，需 commands.json（R38）。"
  - "krb5/openldap/cyrus-sasl devel 真机系统前缀缺失：generate() 用 cmd-pkgs 预编译包补齐（openldap-2.6.7、krb5-1.22.1），sasl.h 取自上游 cyrus-sasl 2.1.28 tag；configure 需显式 CPPFLAGS/LDFLAGS 及 -Wl,-rpath。"
  - "上游 make check 含 5 个 TAP 风格测试程序（test-seq/test-util/test-ldap/test-attrs/test-adenroll），不依赖网络。"
  - "cyrus-sasl 2.1.28 的 include/sasl.h 无条件 #include \"prop.h\"，vendor 时必须同时提供 prop.h（放同一 include/sasl/ 目录），否则 configure 的 AC_CHECK_HEADERS(sasl/sasl.h) 预处理器测试失败。"
  - "sasl.h/prop.h 内容校验标记：sasl.h 含 LIBSASL_API/SASL_H；prop.h 含 PROP_H/prop_set，自包含无依赖。"
