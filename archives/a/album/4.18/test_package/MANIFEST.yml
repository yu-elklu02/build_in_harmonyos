package: album/4.18
homepage: "https://marginalhacks.com/Hacks/album/"

# 上游 album 无正式测试套件（无 make check / t/ 目录）。
# test_package 提供实质性功能验证（真实调用打包产物）。
test_package_tests:
  - file: test.sh
    description: "Real functional smoke tests: album --version, album --help, album generation (convert-guarded)"
    command: "sh test.sh <package_folder>"
    assertions:
      - "album --version exits 0 and reports version 4.18"
      - "album -h exits 0 (usage)"
      - "album generation produces index.html (skipped with documented reason when ImageMagick convert is absent)"

assertion_count: 3
