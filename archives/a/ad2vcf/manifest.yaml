software: ad2vcf
homepage: "https://github.com/auerlab/ad2vcf"
description: "Adds allelic depth information from SAM input to a single-sample VCF"
category: tool
license: "BSD-2-Clause"
versions:
  - "0.1.6-19"
dependencies:
  - "biolibc/0.2.7"
  - "libxtend/0.2.1"
ohos_adaptation:
  notes:
    - "Build ad2vcf with upstream Makefile"
    - "Use biolibc and libxtend as Conan dependencies"
    - "Provide build-time sysexits.h and sys/param.h compatibility headers"
    - "Sign OHOS executable with binary-sign-tool"
