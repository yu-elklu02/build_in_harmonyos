package: ad2vcf/0.1.6-19
homepage: "https://github.com/auerlab/ad2vcf"

upstream_check_command: "Test/test.sh"
upstream_test_in_build: true
upstream_test_command: "cd Test && ../ad2vcf test.vcf 10 < test.sam && diff -u test-ad-correct.vcf test-ad.vcf"

upstream_tests:
  - file: Test/test.sh
    source: "ad2vcf-0.1.6/Test/test.sh"
    description: "Upstream positive fixture plus four manual negative sorting checks; recipe runs only the non-interactive positive fixture"
    command: "cd Test && ../ad2vcf test.vcf 10 < test.sam && diff -u test-ad-correct.vcf test-ad.vcf"

test_package_tests:
  - file: test_ad2vcf.py
    description: "Run ad2vcf --version and replay upstream positive VCF/SAM fixture from the installed package"
    command: "python3 test_ad2vcf.py <package-folder>"

assertion_count: 2
