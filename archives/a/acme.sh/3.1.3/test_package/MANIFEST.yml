package: acme.sh/3.1.3
homepage: "https://github.com/acmesh-official/acme.sh"

upstream_test_command: "shellcheck -e SC2181 -e SC2089 **/*.sh && shfmt -d -i 2 ."
upstream_test_in_build: false
upstream_tests:
  - name: shellcheck
    source: ".github/workflows/shellcheck.yml"
    case_basis: "one official quality gate over 254 shell scripts"
  - name: shfmt
    source: ".github/workflows/shellcheck.yml"
    case_basis: "one official formatting gate over 254 shell scripts"
external_integration_note: "ACME issuance workflows clone the separate acmetest repository and require Pebble, network services, or provider credentials; they are not bundled in the 3.1.3 release archive."

test_package_tests:
  - file: test_acme_sh.sh
    description: "Validate the wrapper, PATH lookup, helper directories, version output, and help output."
    command: "./test_acme_sh.sh <acme-wrapper> <shell>"

assertion_count: 11
