# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: acetoneiso/2.4
homepage: "https://sourceforge.net/projects/acetoneiso/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游 2.4 无官方测试套件，仅含示例代码）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "可执行程序冒烟测试：acetoneiso --help 校验 banner 与 usage"
    command: "test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
