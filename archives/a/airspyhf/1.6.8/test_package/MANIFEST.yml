# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: airspyhf/1.6.8
homepage: "https://airspy.com/"

# 上游测试命令: airspyhf 是 CMake 项目，CMakeLists.txt 未注册任何
# ctest/add_test/make check 测试目标（ctest 输出 "No tests were found"）。
# 上游的可执行产物 airspyhf_lib_version 即运行时 API 冒烟测试
# （调用 airspyhf_lib_version() 打印库版本）。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tools/src/airspyhf_lib_version.c
    source: airspyhf-1.6.8/tools/src/airspyhf_lib_version.c
    description: "调用 airspyhf_lib_version() 打印库版本，验证 libairspyhf API 可链接可调用"
    command: "./airspyhf_lib_version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 airspyhf_lib_version() 断言版本号，并调用 airspyhf_list_devices() 遍历 libusb 枚举路径"
    command: "./test_airspyhf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
