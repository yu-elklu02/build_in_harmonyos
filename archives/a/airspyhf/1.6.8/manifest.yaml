# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.6.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.8"

# 软件名
software: "airspyhf"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/airspy/airspyhf/archive/refs/tags/1.6.8.tar.gz"

  # 源码校验和 (Homebrew 记录的官方校验值，下载后已核对)
  sha256: "cd1e5ae89e09b813b096ae4a328e352c9432a582e03fd7da86760ba60efa77ab"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libusb/1.0.27"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（配方内通过 CMake cache 变量处理，无需源码补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E092: CMake 不认识 HarmonyOS，上游 if( ${UNIX} ) 安装规则不生效，导致 lib/ 和 include/ 未安装；配方 generate() 设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 修复"
  - "CMake 4.x 兼容: 上游 cmake_minimum_required(2.8)，configure 需设 CMAKE_POLICY_VERSION_MINIMUM=3.5（同 airspyone-host PR #54 处理）"
  - "上游 FindUSB1.cmake 使用 LIBUSB_INCLUDE_DIR/LIBUSB_LIBRARIES cache 变量而非 conan CMakeDeps 模块，配方 generate() 需从 libusb 依赖包显式解析这两个变量"
  - "鸿蒙平台要求 ELF 签名：libairspyhf.so 和 bin/ 下 5 个工具必须 binary-sign-tool 签名后才能加载/执行（package() 中统一签名）"
  - "上游头文件安装到 include/libairspyhf/，配方 package_info() 的 includedirs 必须指向该子目录使 #include <airspyhf.h> 可解析"
  - "airspyhf_info/airspyhf_gpio 需物理 AirSpy HF+ 设备，无硬件环境 libusb_init() 返回 -1，属平台限制（E051 类）"
