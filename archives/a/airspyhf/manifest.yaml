software: airspyhf
display: "AirSpy HF+"
description: "AirSpy HF+ user-mode driver (libairspyhf) and associated tools for Software Defined Radio"
category: system
homepage: "https://github.com/airspy/airspyhf"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 不识别 HarmonyOS (E092)，if(${UNIX}) 不成立导致 lib/include 安装跳过，设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "上游 cmake_minimum_required(2.8)，需设 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 CMake 4.x"
    - "上游 FindUSB1.cmake 用 LIBUSB_INCLUDE_DIR/LIBUSB_LIBRARIES cache 变量，需从 libusb Conan 依赖显式解析"
    - "鸿蒙要求 ELF 签名：.so 与可执行文件需 binary-sign-tool 签名 (SHA256withECDSA)"
    - "头文件安装到 include/libairspyhf/，package_info includedirs 需指向该子目录"
  common_dependencies:
    - libusb

versions:
  "1.6.8":
    status: published
    build_date: "2026-08-07"
    conan_ref: "airspyhf/1.6.8"
