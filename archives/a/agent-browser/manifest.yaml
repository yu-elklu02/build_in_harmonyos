# 软件级 manifest — agent-browser
# 遵循 ARCHIVE-SPEC v2.0

software: agent-browser
display: "agent-browser"
description: "AI 代理浏览器自动化 CLI — 通过 CDP 驱动 Chrome，提供导航/交互/截图/网络监控/无障碍审计与 MCP 工具集成"
category: advanced
homepage: "https://github.com/vercel-labs/agent-browser"
license: Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Rust Cargo 项目，cargo build --release --manifest-path cli/Cargo.toml 直接编译，无 configure 步骤；manifest 在 cli/ 子目录"
    - "OHOS 预检沙盒 cargo/rustc 可能不在 PATH，经 Harmonybrew bottle 引导安装 Rust 工具链（argc/1.24.0 先例）"
    - "设置 CC/CXX=clang 与 RUSTFLAGS='-C linker=clang'，OHOS 无 cc 符号链接"
    - "crates.io 直连 TLS 失败，.cargo/config.toml 用 rsproxy.cn sparse 镜像 + 网络容错"
    - "Rust 二进制默认静态链接，无需 RPATH；产物 bin/agent-browser 需 ELF 签名（真机工具链处理）"
    - "OHOS /tmp 只读，构建与测试需用可写 TMPDIR"
    - "上游测试用 cargo test --release --tests：886 个 #[test] 单元测试 + doctor_cli.rs 集成测试，全离线可执行；Chrome 相关 e2e/parity 用例上游 #[ignore]；doc-tests 因无 rustdoc 排除（平台限制先例）"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.33.0":
    status: built
    build_date: "2026-08-13"
    published_as: agent-browser/0.33.0
