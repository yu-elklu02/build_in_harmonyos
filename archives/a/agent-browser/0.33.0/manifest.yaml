software: agent-browser
# 版本级 manifest
# 文件位置: archives/a/agent-browser/0.33.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.33.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-13"

# 构建系统类型 (顶层字段)
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档；conandata.yml 中 gh-proxy.com 镜像在前）
  url: "https://github.com/vercel-labs/agent-browser/archive/refs/tags/v0.33.0.tar.gz"

  # 源码校验和
  sha256: "be52658f6e5781c62b991d25c9650b273d95bd0e60593eeff6e8b6cd974258ef"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Rust crate 依赖由 cli/Cargo.lock 管理（serde/tokio/reqwest/rustls 等），
  # 无 C/C++ Conan 库依赖；构建仅需 Rust 工具链 + clang 链接器

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust Cargo 项目：cargo build --release --manifest-path cli/Cargo.toml 直接编译，无 configure 步骤；Cargo manifest 位于 cli/ 子目录"
  - "agent-browser 是命令行工具（AI 代理浏览器自动化 CLI），package_type=application，产物为 bin/agent-browser"
  - "Rust 工具链在 OHOS 真机预检沙盒中可能不在 PATH，先探测已知位置（HNP/harmonybrew/rustup）；无则用 urllib 下载 Harmonybrew OHOS rust bottle 引导（argc/1.24.0 先例，设备 curl 无 CA bundle 不能用 curl/zsh 安装）"
  - "Rust 二进制默认静态链接，无需 RPATH 设置"
  - "上游测试：cargo test --release --tests 在 test_package 阶段执行（hmbs 预检只从 test_package 阶段 stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例；build() 阶段 self.output.info() 输出不被采纳，且包缓存命中时 build() 会被跳过）"
  - "doc-tests 阶段被 --tests 排除：OHOS rust 工具链（Harmonybrew bottle）无 rustdoc，与 martin/1.13.0、argc/1.24.0 平台限制先例一致"
