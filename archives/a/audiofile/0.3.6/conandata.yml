sources:
  "0.3.6":
    url: "https://download.gnome.org/sources/audiofile/0.3/audiofile-0.3.6.tar.xz"
    sha256: "ea2449ad3f201ec590d811db9da6d02ffc5e87a677d06b92ab15363d8cb59782"

patches:
  "0.3.6":
    - patch_file: patches/0001-config-ohos.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Add aarch64:HarmonyOS case to config.guess and ohos-linux triplet
        to config.sub so the 2012-era autotools recognise OHOS.
    - patch_file: patches/0002-configure-umask.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Change umask 077 to umask 000 in configure's tmp directory creation.
        HMDFS creates tmp dirs with a different owner; umask 077 makes them
        unwritable for the build user, causing 'Permission denied' on
        config.status subs1.awk.
    - patch_file: patches/0003-gtest-tr1-tuple.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        audiofile 0.3.6 bundles gtest 1.6.0 which uses <tr1/tuple>.
        OHOS clang 15 + libc++ does not provide <tr1/tuple>. Set
        GTEST_HAS_TR1_TUPLE=0 to force C++11 <tuple>.
    - patch_file: patches/0004-test-pathmax-narrowing.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        OHOS musl libc does not expose PATH_MAX via <limits.h>; define
        it as 4096 in 12 test files. Also fix C++11 narrowing in
        Sign.cpp by adding static_cast<uint32_t>.
    - patch_file: patches/0005-test-tmpdir.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Tests hardcode /tmp which is read-only on OHOS. Use $TMPDIR
        (falling back to '.') so mkstemp can create temp files.
