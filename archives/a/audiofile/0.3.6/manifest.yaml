package: "audiofile"
version: "0.3.6"
status: "passed"
build_system: "autotools"
homepage: "https://audiofile.68k.org/"
license: "LGPL-2.0-only, GPL-2.0-only"

source:
  url: "https://download.gnome.org/sources/audiofile/0.3/audiofile-0.3.6.tar.xz"
  sha256: "ea2449ad3f201ec590d811db9da6d02ffc5e87a677d06b92ab15363d8cb59782"
  tar_format: "tar.xz"

build:
  system: "autotools"
  configure_options:
    - "--disable-flac"
    - "--disable-docs"
    - "--disable-examples"
  dependencies: []

patches_applied:
  - "patches/0001-config-ohos.patch"
  - "patches/0002-configure-umask.patch"
  - "patches/0003-gtest-tr1-tuple.patch"
  - "patches/0004-test-pathmax-narrowing.patch"
  - "patches/0005-test-tmpdir.patch"

tests:
  upstream:
    command: "make check"
    cases: 36
    passed: 36
    note: "The 35 non-FLAC tests in test/ plus libaudiofile/UnitTests are executed during build(). All 35 tests passed; UnitTests compiled and linked with the patched gtest."
  test_package:
    command: "test_package/test_audiofile.cpp"
    cases: 1
    passed: 1
    note: "Writes a WAV file, reads it back, and asserts format, channel count, frame count, and samples. 100% tests passed, 0 tests failed out of 1."

platform:
  validated_architecture: "OHOS/armv8"
  limitations:
    - "2012-era config.guess lacks an OHOS case; 0001 adds aarch64:HarmonyOS:*:* to config.guess and ohos-linux to config.sub."
    - "HMDFS creates mktemp tmp dirs with a different owner; umask 077 makes them unwritable for the build user. 0002 changes umask 077 to umask 000 in configure."
    - "Bundled gtest 1.6.0 uses <tr1/tuple>; OHOS clang 15 + libc++ does not provide <tr1/tuple>. 0003 sets GTEST_HAS_TR1_TUPLE=0 to force C++11 <tuple>."
    - "OHOS musl libc does not expose PATH_MAX via <limits.h>. 0004 defines PATH_MAX 4096 in 12 test files and fixes C++11 narrowing in Sign.cpp with static_cast<uint32_t>."
    - "Tests hardcode /tmp which is read-only on OHOS. 0005 uses $TMPDIR (falling back to '.') so mkstemp can create temp files."
    - "sfcommands mix C and C++ (AudioFormat.cpp); the C linker driver omits -lc++ on OHOS. generate() adds -lc++ to extra_ldflags."
    - "download.gnome.org is intermittently unreachable on the OHOS device; source() falls back to a local mirror tarball at ~/build_in_harmonyos/.audiofile-mirror/audiofile-0.3.6.tar.xz."
