# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arduino-mighty-1284p/1.0.0
homepage: "https://github.com/maniacbug/mighty-1284p"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C bootloaders/optiboot atmega1284p"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试需要 AVR 工具链 (avr-gcc)，无法在 OHOS aarch64 上执行
upstream_test_in_build: false
upstream_test_command: "make -C bootloaders/optiboot atmega1284p"

# 上游实际运行的测试程序
# 上游没有独立的测试套件，Makefile 仅编译 bootloader 固件
# 编译 bootloader .hex 文件即为上游的"测试"（需要 avr-gcc）
upstream_tests:
  - file: bootloaders/optiboot/optiboot.c
    source: arduino-mighty-1284p-1.0.0/bootloaders/optiboot/optiboot.c
    description: "optiboot bootloader source (requires avr-gcc to compile)"
    command: "make -C bootloaders/optiboot atmega1284p"

# test_package 中自带的测试 (消费者视角验证)
# 验证 binary.h 头文件中的二进制常量定义正确
test_package_tests:
  - file: test.c
    description: "验证 binary.h 二进制常量定义 (B0=0, B1=1, B11111111=255 等)"
    command: "./test_arduino_mighty_1284p"

# 测试断言总数 (近似值, 用于质量评估)
# 7 个二进制常量断言
assertion_count: 7
