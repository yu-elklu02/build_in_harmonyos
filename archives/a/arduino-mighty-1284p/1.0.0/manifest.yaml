# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "arduino-mighty-1284p"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: "header-only"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (official GitHub archive)
  url: "https://github.com/maniacbug/mighty-1284p/archive/68ed99c0e9f1c130a7ac8bbd54ea80634cb11802.tar.gz"

  # 源码校验和
  sha256: "2352c1e61cd6e4644ccde61da1c6bff6f37b23000bafbb2c1396ca259e0117ed"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: header-only

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Arduino platform package (ATmega1284P) — header/source-only, no host compilation needed"
  - "Source files target AVR microcontrollers, use avr/io.h and avr/interrupt.h — cannot compile on aarch64"
  - "Packaged as header-library: cores/standard/ headers + variants/ pin configs + bootloaders/ + boards.txt"
  - "binary.h is a pure definition header (no AVR deps) — used for test_package verification"
