# AFsp 8.2 适配清单
# McGill 音频文件处理工具集 + 库（AFsp v8r2），纯 C，Makefile 构建。
# 无外部依赖（仅 -lm）；产物 libtsp.a/libAO.a + bin/ 下 10 个音频工具。
# 上游测试：test/Makefile 运行 txxxAudio | filter_log 对比 txxxAudio.ref。

version: "8.2"
status: built

source:
  url: "http://www-mmsp.ece.mcgill.ca/Documents/Downloads/AFsp/AFsp-v8r2.tar.gz"
  sha256: "3909043ce4f62173db41b8d411b7abc7a0516949d4c7afa61200fc8a308a8bbf"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  cc: clang
  notes: "顶层 make = libtsp + libAO + audio；无 configure；make -C test 跑上游测试（txxxAudio 脚本，filter_log 过滤路径/日期后 diff 参考输出）"

dependencies: []

patches_applied:
  - "0001-stdec1val-int-writeback.patch"

test:
  upstream_cases: 6
  upstream_suite: "test/txxxAudio 脚本 6 段功能测试（CopyAudio×3 + FiltAudio 三组 FIR/IIR + ResampAudio×2），make -C test 自动运行"
  runnable: 6
  runnable_note: "全部在本地 OHOS 环境运行通过（txxxAudio | filter_log 输出与 txxxAudio.ref diff 一致）"
  pass_rate: "6/6 = 100%（本地实测）"
  consumer_test: "test_package 验证 InfoAudio --help 可用"

knowledge_gained:
  - "AFsp 纯 C 无外部依赖，Makefile 递归构建（libtsp 10 个子目录 + libAO + audio 10 个工具），仅需 -lm"
  - "上游测试 test/Makefile 用 txxxAudio | filter_log 对比 txxxAudio.ref；filter_log 过滤日期/文件路径差异"
  - "Makefile 用 dist_dir=../.. 相对路径输出到 lib/ 与 bin/，配方内 in-source 构建即可"
