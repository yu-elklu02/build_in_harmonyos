# afsp/8.2 test_package
# Verifies InfoAudio binary is installed and executable

package: afsp/8.2
homepage: "https://www-mmsp.ece.mcgill.ca/Documents/Downloads/AFsp/"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "make -C test"

upstream_tests:
  - name: txxxAudio
    description: "上游集成测试脚本（CopyAudio×3 + FiltAudio FIR/IIR + ResampAudio×2 共 6 段），build() 阶段 make -C test 自动运行，filter_log 过滤路径/日期后与 txxxAudio.ref diff"

test_package_tests:
  - file: test_afsp.c
    description: "验证 InfoAudio 二进制存在且可执行（InfoAudio --help），R34 反空壳：test() 用 self.run() 真实执行被测包二进制"
    command: "<info_audio_bin> --help  # test_package/conanfile.py test() 定位 bin/InfoAudio 并执行 --help"

assertion_count: 1
