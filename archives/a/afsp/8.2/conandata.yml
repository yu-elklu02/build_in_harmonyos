# conandata.yml — AFsp 8.2
# 音频文件处理工具集 + 库（McGill AFsp v8r2），纯 C，Makefile 构建。
# 无外部依赖（仅 -lm）；构建 libtsp.a/libAO.a + bin/ 下 10 个音频工具；
# 上游测试：test/Makefile 运行 txxxAudio | filter_log 对比 txxxAudio.ref。

sources:
  # 官方源 www-mmsp.ece.mcgill.ca SSL 证书对 CI Worker 无效（Hostname mismatch），
  # 改用 USTC FreeBSD ports distfiles 镜像（同一文件，sha256 一致）
  url: "https://mirrors.ustc.edu.cn/freebsd-ports/distfiles/AFsp-v8r2.tar.gz"
  sha256: "3909043ce4f62173db41b8d411b7abc7a0516949d4c7afa61200fc8a308a8bbf"

patches:
  - patch_file: "patches/0001-stdec1val-int-writeback.patch"
    patch_description: "修复 STdec1val 64 位平台 bug：case 'I' 分支在 INT_MAX != LONG_MAX 时只做范围检查缺失写回赋值，导致所有整数参数解析（ratio/interpolate）返回垃圾值"
    patch_type: "portability"
