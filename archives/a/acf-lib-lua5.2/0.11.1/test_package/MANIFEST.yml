package: acf-lib-lua5.2/0.11.1
homepage: "https://gitlab.alpinelinux.org/acf/acf-lib"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  Alpine aports declares options="!check" with the comment "no test suite".
  The v0.11.1 source has no test directory, test script, or test/check target.
  Verified directly: the Makefile only defines all/clean/dist/install/dist-install,
  the README is a single line, and `find` reports no *test*/*spec* files.

test_package_tests:
  - file: acf_lib_probe.c
    description: "Embed Lua 5.2, load four real packaged module names, invoke format/HTML/validation APIs, and run update_ini_file/parse_ini_file/set_ini_section which the Lua 5.5 port had to patch"
    command: "acf_lib_probe <package-lua-root>"
  - file: acf_lib_probe.c
    description: "Verify malformed IPv4 and out-of-range port input are rejected by the packaged validator"
    command: "acf_lib_probe --expect-invalid <package-lua-root>"

assertion_count: 13
