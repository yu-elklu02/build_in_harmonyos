software: acf-lib-lua5.2
display: "ACF libraries for Lua 5.2"
description: "Lua 5.2 standard modules for the Alpine Configuration Framework"
category: library
homepage: "https://gitlab.alpinelinux.org/acf/acf-lib"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "Install all eight upstream Lua modules in the Lua 5.2 module layout"
    - "Load and invoke packaged modules through the Lua 5.2 C API"
    - "No patch required: Lua 5.2 keeps generic-for loop variables mutable"
  common_dependencies:
    - lua/5.2.4

versions:
  "0.11.1":
    status: built
    build_date: "2026-08-11"
    conan_ref: "acf-lib-lua5.2/0.11.1"
