package: adobe-source-han-serif-otc/2.003
homepage: "https://github.com/adobe-fonts/source-han-serif"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_note: >-
  Adobe 2.003R OTC 发布包仅包含七个预构建 TTC 字体集合和许可证，不包含自动化测试套件。
test_package_tests:
  - file: font_probe.cpp
    description: "解析七个 TTC 集合、35 个 SFNT 字体面的表目录、边界与必要表"
    command: "font_probe <package-font-root> 7 5"
  - file: corrupt.ttc
    description: "截断 TTC 故障注入必须被同一解析器拒绝"
    command: "font_probe --expect-invalid corrupt.ttc"
assertion_count: 13
