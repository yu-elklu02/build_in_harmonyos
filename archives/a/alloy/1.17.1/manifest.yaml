# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 执行策略要求二进制签名：binary-sign-tool sign -inFile X -outFile X -selfSign 1；未签名的 Go 产物 execve 报 EACCES（clang 编译产物不受限）"
  - "Go 链接器输出到部分文件系统报 'mapping output file failed: permission denied'（不可执行 mmap），需把 GOCACHE/GOMODCACHE/GOPATH/TMPDIR/GOTMPDIR/链接输出放到 hmfs 工作根（如 /data/storage/el2/base/cache）再拷回"
  - "Grafana Alloy 主程序是 otel collector builder 生成的独立模块 collector/（module github.com/grafana/alloy/otel_engine），需在 collector/ 内 go build，根 go.mod 用 replace 引用根模块与 syntax 子模块"
  - "alloy 启动时 cilium/ebpf rlimit.detectMemcgAccounting 调用 bpf 系统调用（arm64 syscall 280），本机 seccomp 拦截导致 SIGSYS，--version 亦无法运行；运行验证需官方 CI/目标设备"
  - "Go 包适配模式（murex 先例）：conandata 声明 go_toolchain（aliyun 镜像 + 官方 sha256），配方内置 fallback 工具链下载、权限归一化与上游 go test ./... 集成"
