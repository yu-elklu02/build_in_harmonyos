software: alloy
display: "Grafana Alloy"
description: "OpenTelemetry Collector distribution with programmable pipelines"
category: application
homepage: "https://grafana.com/oss/alloy"
license: Apache-2.0
build_system: go

ohos_adaptation:
  key_points:
    - "Build a pure Go linux/arm64 static executable with CGO_ENABLED=0"
    - "Sign the built executable (and the Go toolchain) with binary-sign-tool for OHOS execution"
    - "Keep Go caches/tmp/linker output under an hmfs work root to avoid HMDFS mmap restriction"
    - "Main program is the generated collector/ module (otel_engine); build inside collector/"
  common_dependencies: []

versions:
  "1.17.1":
    status: built
    build_date: "2026-08-11"
    conan_ref: "alloy/1.17.1"
    notes: "本地 go build 成功（linux/arm64 静态 417MB，已签名）；本机 seccomp 拦截 bpf 系统调用导致二进制无法在本机执行，运行验证需官方 CI/目标设备"
