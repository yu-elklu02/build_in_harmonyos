software: aliyun

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4.8"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/aliyun/aliyun-cli/archive/refs/tags/v3.4.8.tar.gz"

  # 源码校验和
  sha256: "1c0b01c6cd033e02efc94b324ee7930fc3bca738d5f6ab9c12280709b213fd01"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOTOOLCHAIN=local"
    - "go build -trimpath -ldflags=-s -w -X github.com/aliyun/aliyun-cli/v3/cli.Version=3.4.8"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.23.8"

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "aliyun-cli 是 Go 项目（module github.com/aliyun/aliyun-cli/v3），go.mod 要求 go >= 1.23.0，toolchain go1.23.8 (ref: E001)"
  - "aliyun-openapi-meta 是 git 子模块，release tarball 不含其内容，配方 conandata.yml 需单独声明 submodule 下载 (ref: E150)"
  - "版本变量路径为 github.com/aliyun/aliyun-cli/v3/cli.Version（带 /v3/），ldflags -X 注入 3.4.8 (ref: E003)"
  - "Go linker 在 HMDFS 上 mmap 输出文件失败，link-out 需放在 ext2 分区路径（OHOS_GO_WORKDIR）(ref: E124)"
  - "用户目录下 ELF 需 .codesign 签名才能执行，Go 工具链用 harmonybrew (brew install go) 安装自动签名 (ref: E077)"
