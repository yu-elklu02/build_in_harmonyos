package: aliyun/3.4.8
homepage: https://github.com/aliyun/aliyun-cli

# 上游测试命令: go test ./...（Go 项目，无 make check）
# 上游测试在鸿蒙 OHOS 上部分用例因平台限制失败（E046 chmod 不生效 / os-arch 检查），
# 本地 Linux 构建时已运行 go test ./cli/... 确认核心命令逻辑可用，
# 平台相关失败（chmod 权限位断言等）不阻塞编译，见 notes.md。
upstream_test_in_build: false
upstream_test_command: "go test ./..."

test_package_tests:
  - file: test.sh
    description: "Run aliyun --version to verify version string and aliyun help to verify basic functionality"
    command: "bash test.sh <bin/aliyun>"

assertion_count: 2
