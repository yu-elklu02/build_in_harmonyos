# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: arno-iptables-firewall/2.0.3
homepage: "https://rocky.eld.leidenuniv.nl/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# arno-iptables-firewall is a shell-script firewall tool with no test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_arno_iptables_firewall.sh
    description: "Verify packaged scripts exist, are executable, contain correct version, and support files (environment, plugins, config, man pages) are present"
    command: "bash test_arno_iptables_firewall.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
