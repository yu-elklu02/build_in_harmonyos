# algolia/1.14.0 test_package
# Verifies algolia CLI binary is installed, version-injected and runnable

package: algolia/1.14.0
homepage: "https://github.com/algolia/cli"

upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: ""

# 上游 go test ./... 实测 457 PASS / 0 FAIL（91 包 ok，详见 reports/upstream-tests.md）；
# OHOS 上测试二进制未签名无法直接 exec，需 -exec 签名包装器（配方 build() 同款逻辑）
upstream_tests:
  - file: go_test_v.txt
    source: algolia-1.14.0 上游 go test ./... -v（本地 OHOS 实测日志）
    description: "457 个测试用例全部通过（--- PASS 457，--- FAIL 0，--- SKIP 0），91 个测试包 ok"
    command: "go test -exec <sign-wrapper> -v ./... -p 1 -count=1"

test_package_tests:
  - file: test.sh
    description: "验证 algolia 二进制：--version 输出 1.14.0（ldflags 注入）、--help usage、auth --help 子命令（R34 反空壳）"
    command: "bash test.sh <algolia_bin>"

assertion_count: 3
