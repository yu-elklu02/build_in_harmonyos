# algolia (algolia/cli) 1.14.0 适配清单
# Algolia 官方 CLI：管理 Algolia 应用/索引/记录/API Key 的命令行工具（Go）。
# 纯 Go 依赖（cobra/viper/algoliasearch-client-go/v4 等），无 C 依赖；需 Go 工具链 1.23.x。

version: "1.14.0"
status: built

source:
  url: "https://codeload.github.com/algolia/cli/tar.gz/refs/tags/v1.14.0"
  tar_format: tar.gz

build:
  system: go
  configure_options: []
  cc: clang
  notes: "Go 1.23.8 SDK 配方内自举下载（arm64，sha256 固定）；CGO_ENABLED=0 纯静态；OHOS ELF 签名（binary-sign-tool）；go link 在 HMDFS 上 mmap 失败，链接输出与 GOCACHE/TMPDIR 指向 /data/storage ext2 工作区；版本注入 -X=github.com/algolia/cli/pkg/version.Version=v1.14.0"

patches_applied: []

test:
  upstream_cases: 457
  upstream_suite: "go test ./... -v（91 个测试包，e2e 目录 //go:build e2e 默认排除；OHOS 上用 -exec 签名包装器运行测试二进制）"
  runnable: 457
  runnable_note: "457/457 全部通过（--- PASS 457，--- FAIL 0，--- SKIP 0，本地 OHOS 实测）"
  pass_rate: "457/457 = 100%（本地实测）"
  consumer_test: "test_package 验证 algolia --version 输出 1.14.0 + --help usage + auth --help"

knowledge_gained:
  - "algolia/cli 是 Go CLI（go 1.23.0 + toolchain go1.23.4），纯 Go 依赖无 C 库，需 Go SDK 1.23.x（参考 aicommit 先例配方内自举下载 go1.23.8 linux-arm64，sha256 9d6d9384...）"
  - "OHOS 上未签名 ELF 无法 exec：go 工具链二进制（bin/go/gofmt + pkg/tool/linux_arm64/*）与最终产物均需 binary-sign-tool 签名（先 llvm-objcopy --remove-section .codesign 再 sign）"
  - "go link 在 hmdfs 上 mmap 失败（permission denied，E051/E046）：链接输出目录与 GOCACHE/TMPDIR 必须指向 /data/storage（ext2 风格工作区）"
  - "go test 生成的测试二进制在 OHOS 上未签名无法 fork/exec：需 go test -exec 签名包装器（sign-exec.sh 先签名再 exec）——457 个用例全部跑通"
  - "版本注入：上游 GoReleaser 用 -X=github.com/algolia/cli/pkg/version.Version 注入，源码默认 'main'；配方 ldflags 注入 v1.14.0 使 --version 输出正式版本"
