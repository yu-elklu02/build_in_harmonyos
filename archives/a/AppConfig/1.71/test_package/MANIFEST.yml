package: appconfig/1.71
homepage: "https://metacpan.org/pod/AppConfig"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "PERL5LIB=lib perl t/<test>.t"

upstream_tests:
  - file: t/appconfig.t
    source: AppConfig-1.71/t/appconfig.t
    description: "module load and variable definition"
    command: "PERL5LIB=lib perl t/appconfig.t"
  - file: t/args.t
    source: AppConfig-1.71/t/args.t
    description: "argument parser behavior"
    command: "PERL5LIB=lib perl t/args.t"
  - file: t/block.t
    source: AppConfig-1.71/t/block.t
    description: "configuration block parsing"
    command: "PERL5LIB=lib perl t/block.t"
  - file: t/cgi.t
    source: AppConfig-1.71/t/cgi.t
    description: "CGI parameter handling"
    command: "PERL5LIB=lib perl t/cgi.t"
  - file: t/compact.t
    source: AppConfig-1.71/t/compact.t
    description: "compact option syntax"
    command: "PERL5LIB=lib perl t/compact.t"
  - file: t/const.t
    source: AppConfig-1.71/t/const.t
    description: "exported constants"
    command: "PERL5LIB=lib perl t/const.t"
  - file: t/default.t
    source: AppConfig-1.71/t/default.t
    description: "default values"
    command: "PERL5LIB=lib perl t/default.t"
  - file: t/file.t
    source: AppConfig-1.71/t/file.t
    description: "configuration file parser"
    command: "PERL5LIB=lib perl t/file.t"
  - file: t/flag.t
    source: AppConfig-1.71/t/flag.t
    description: "flag options"
    command: "PERL5LIB=lib perl t/flag.t"
  - file: t/getopt.t
    source: AppConfig-1.71/t/getopt.t
    description: "Getopt integration"
    command: "PERL5LIB=lib perl t/getopt.t"
  - file: t/multi.t
    source: AppConfig-1.71/t/multi.t
    description: "multi-value options"
    command: "PERL5LIB=lib perl t/multi.t"
  - file: t/novars.t
    source: AppConfig-1.71/t/novars.t
    description: "unknown variable handling"
    command: "PERL5LIB=lib perl t/novars.t"
  - file: t/state.t
    source: AppConfig-1.71/t/state.t
    description: "state object API"
    command: "PERL5LIB=lib perl t/state.t"
  - file: t/sys.t
    source: AppConfig-1.71/t/sys.t
    description: "system configuration API"
    command: "PERL5LIB=lib perl t/sys.t"

upstream_not_counted:
  - file: t/97-pod.t
    reason: "author POD test skipped by upstream default install path"
  - file: t/99_author.t
    reason: "author POD test skipped by upstream default install path"

test_package_tests:
  - file: test_appconfig.sh
    description: "load AppConfig, parse arguments, and parse a config file through the packaged module"
    command: "sh test_appconfig.sh"
