# test_package/MANIFEST.yml — accrete 1.0
# CI L0e requires this file to exist.

package: accrete/1.0
homepage: "https://sourceforge.net/projects/accrete/"

# accrete has no upstream test suite (1991/2003 plain-Makefile project, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball; verification is done by
# running the binary and inspecting its New.System output.
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs the accrete planet-formation simulation, verifies New.System is generated with the SYSTEM CHARACTERISTICS header and at least one planet"
    command: "bash test.sh"

# Approximate assertion count (New.System existence + header + planet count >= 1)
assertion_count: 3
