# 版本级 manifest — accrete 1.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0"
software: "accrete"

# 编译状态: published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方源，FreeBSD astro/accrete port 同源）
  url: "https://downloads.sourceforge.net/project/accrete/accrete/1.0/accrete-1.0.tar.gz"

  # 源码校验和（与 FreeBSD ports astro/accrete/distinfo 完全一致）
  sha256: "487c740a96ee05ce5ca8074e1713367eb92beb551d63c0ad1772b72e53ceee8c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: plain Makefile (无 configure)
  system: makefile

  # 配置选项列表（无 configure，make 参数直接由 conanfile.py build() 传入）
  configure_options: []

  # 编译依赖列表（无外部依赖）
  dependencies: []

  # 编译器（OHOS aarch64 工具链）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无需补丁：源码原生兼容 OHOS（1991/2003 纯 C，无平台相关代码）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Makefile 项目（无 configure）在 OHOS 直接 make CC=<clang> CFLAGS=-O2 即可编译"  # ref: E174
  - "Makefile 默认 INSTALL=/usr/bin/install 在 OHOS 不存在，recipe package() 直接 copy 产物到 bin/ 绕过 make install"  # ref: E174
  - "老代码若已用新实现替代 random()/srandom() 则无隐式函数声明问题，可零补丁编译"  # ref: E093
  - "不解析命令行参数的 CLI：--version/--help 也会以 exit 0 运行完整程序，L2 smoke 仍可通过"  # ref: E215
  - "功能验证方式：运行二进制生成 New.System，检查输出头与关键行数（无 make check 的上游项目以此替代）"  # ref: E215
