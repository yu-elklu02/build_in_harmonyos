# 软件级 manifest — accrete
# 遵循 ARCHIVE-SPEC v2.0

software: accrete
display: "accrete"
description: "太阳系行星形成物理模拟器 — 模拟尘埃盘吸积过程并生成行星系统（New.System 输出）"
category: utility
homepage: "https://sourceforge.net/projects/accrete/"
license: BSD-3-Clause
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（1991 Joe Nowakowski / 2003 Charles Swiger），无 configure、无 make check 目标"
    - "源码已用 Mersenne Twister (mtrng.c) 替代 random()/srandom()，无隐式函数声明问题，零补丁编译"
    - "OHOS 精简环境无 coreutils install 命令，recipe package() 直接用 copy 将二进制放入 bin/ 绕过 make install"
    - "main() 不解析命令行参数，运行即执行完整模拟并写出 New.System；验证以 New.System 内容为准"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0":
    status: published
    build_date: "2026-08-05"
