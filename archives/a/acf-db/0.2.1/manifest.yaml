# 版本级 manifest — acf-db 0.2.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.2.1"
software: "acf-db"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：Alpine distfiles 正式分发镜像（gitlab.alpinelinux.org 在构建网络被 418 拦截）
  url: "https://distfiles.alpinelinux.org/distfiles/v3.24/acf-db-v0.2.1.tar.gz"
  sha256: "c2d8a4cdda84e77fc43c56b22303ecb3d6a93134edd183281bf60e6cd3e94b12"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：单一递归 Makefile（pure-Lua，无 C 编译）
  system: makefile
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies:
    - acf-core/0.24.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "acf-db 是纯 Lua ACF 模块（db-controller.lua/db-model.lua + lib/ 视图模板），make all 为空操作，make install DESTDIR 将文件复制到 usr/share/acf/app/db 与 usr/share/acf/lib"
  - "Makefile 仅用 cp -a/mkdir -p/ln -sf（无 coreutils install），OHOS 上无需补丁"
  - "运行时依赖 acf-core/0.24.1（mvc.lua 分发），conanfile requirements() 声明之；与本系列 acf-nsd/acf-mdadm 配方一致"
  - "上游无测试套件（aports 未声明 test），test_package 以文件存在性 + Lua 语法校验（luac -p）验证包装完整性"
  - "本地跑 CI L1e 破坏性负向测试前需 conan remove acf-db/* -c 清缓存：缓存存在多个同名包目录时，负向复跑会解析到未破坏的目录，误判假测试"
