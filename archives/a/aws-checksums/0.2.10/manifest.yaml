software: "aws-checksums"
version: "0.2.10"
status: "published"
build_date: "2026-08-09"
build_system: "cmake"

source:
  url: "https://github.com/awslabs/aws-checksums/archive/refs/tags/v0.2.10.tar.gz"
  tar_format: "tar.gz"

build:
  system: "cmake"
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - "aws-c-common/0.14.3"
  cc: "clang"
  cxx: "clang++"

patches_applied: []
knowledge_gained:
  - "AWS CMake modules need CMAKE_MODULE_PATH set to aws-c-common package's lib/cmake/aws-c-common/modules/"
  - "CMakeDeps set_property cmake_target_name=AWS::aws-c-common eliminates need for source patch"
