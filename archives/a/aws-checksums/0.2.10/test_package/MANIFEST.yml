# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: "aws-checksums/0.2.10"
homepage: "https://github.com/awslabs/aws-checksums"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# aws-checksums uses CMake with BUILD_TESTING, tests are in tests/ directory
# BUILD_TESTING=OFF in conanfile.py (library-only build, tests require aws-c-common test harness)
upstream_tests:
  - file: "tests/crc_test.c"
    source: "aws-checksums-0.2.10/tests/crc_test.c"
    description: "aws-checksums CRC unit tests (crc32, crc32c, combine, large buffer)"
    command: "./crc_test_runner"
  - file: "tests/crc64_test.c"
    source: "aws-checksums-0.2.10/tests/crc64_test.c"
    description: "aws-checksums CRC64 unit tests (crc64nvme, combine, large buffer)"
    command: "./crc64_test_runner"
  - file: "tests/xxhash_test.c"
    source: "aws-checksums-0.2.10/tests/xxhash_test.c"
    description: "aws-checksums XXHash unit tests (xxhash64, xxhash3_64, xxhash3_128)"
    command: "./xxhash_test_runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.c"
    description: "消费者测试: 验证 aws-checksums CRC32/CRC32C 计算正确性"
    command: "./test_aws_checksums"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
