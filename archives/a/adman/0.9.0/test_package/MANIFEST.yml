# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: adman/0.9.0
homepage: https://gitlab.com/JonathonReinhart/adman

# 上游测试命令 — adman 上游用 pytest 运行 tests/ 套件
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# adman 上游 tests/ 含 7 个 pytest 测试文件（config/kerberos/ldapfilter/ldapobj/smbacl/types/util）
upstream_tests:
  - file: tests/
    source: adman-v0.9.0/tests/
    description: "adman 上游 pytest 测试套件（7 个测试文件）"
    command: "python3 -m pytest tests/"
    condition: "native 编译时执行，需 python-ldap/dnspython/PyYAML 依赖"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 adman 包目录与启动脚本存在于 package 中"
    command: "conan create (test_package _check_binary_exists)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2