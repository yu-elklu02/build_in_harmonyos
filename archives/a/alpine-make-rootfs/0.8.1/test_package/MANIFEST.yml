# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: alpine-make-rootfs/0.8.1
homepage: "https://github.com/alpinelinux/alpine-make-rootfs"

# 上游测试命令
# alpine-make-rootfs Makefile has no check target, only install/bump-version/release
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# alpine-make-rootfs is a shell script, upstream has no automated test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_alpine_make_rootfs.sh
    description: "验证 alpine-make-rootfs --version 和 --help 输出"
    command: "bash test_alpine_make_rootfs.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
