package: avida
version: "2.12.4"
status: draft
build_system: cmake
homepage: https://avida.devosoft.org/
license: GPL-3.0-only

source:
  url: https://downloads.sourceforge.net/project/avida/avida-stable/2.12.4/avida-2.12.4-src.tar.gz
  sha256: 70b4953cd7ab60c3331e7e5eb5d3c6953a72eec99ec6cb529bf638727ce39483
  tar_format: tar.gz

build:
  system: cmake
  command: cmake -DAVD_CMDLINE=ON -DAVD_GUI_NCURSES=OFF -DAVD_USE_TCMALLOC=OFF && cmake --build .
  dependencies: []

patches_applied:
  - patches/0001-make-tcmalloc-optional.patch
  - patches/0002-fix-cpp17-musl-compat.patch

tests:
  upstream:
    command: ./run_tests
    cases: 0
    passed: 0
    note: >-
      Cannot execute: run_tests is a /bin/sh script (OHOS has no /bin/sh)
      and its testrunner.py uses Python 2 syntax (print statements without
      parentheses), incompatible with Python 3.12 on OHOS.
  test_package:
    command: python test_avida.py <avida-path>
    cases: 1
    passed: 1
    note: Executes avida --help and verifies help output containing "Avida".

platform:
  target_architecture: OHOS/armv8
  limitations:
    - The bundled tcmalloc implementation is disabled because it contains x86-specific assembly.
    - Atomic.h x86 inline assembly replaced with GCC/Clang __atomic builtins for aarch64.
    - pthread_cancel replaced with pthread_kill(0) because musl does not provide it.
    - std::random_shuffle replaced with std::shuffle + std::mt19937 for C++17 compatibility.
    - Custom std::iota definition removed (C++ standard library provides it).
    - CMAKE_C_COMPILER_WORKS/CMAKE_CXX_COMPILER_WORKS set to TRUE to skip CMake try-compile
      (which fails because CMake clears MAKEFLAGS, causing make to use /bin/sh).
