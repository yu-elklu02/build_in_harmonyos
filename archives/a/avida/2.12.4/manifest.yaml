package: avida
version: "2.12.4"
status: draft
build_system: cmake
homepage: https://avida.devosoft.org/
license: GPL-3.0-only

source:
  url: https://downloads.sourceforge.net/project/avida/avida-stable/2.12.4/avida-2.12.4-src.tar.gz
  sha256: 70b4953cd7ab60c3331e7e5eb5d3c6953a72eec99ec6cb529bf638727ce39483
  tar_format: tar.gz

build:
  system: cmake
  command: cmake -DAVD_CMDLINE=ON -DAVD_GUI_NCURSES=OFF -DAVD_USE_TCMALLOC=OFF && cmake --build .
  dependencies: []

patches_applied:
  - patches/0001-make-tcmalloc-optional.patch

tests:
  upstream:
    command: python avida-core/tests/_testrunner/testrunner.py --testrunner-name=./run_tests
    cases: 0
    passed: null
    note: Python 2 scripts are migrated with lib2to3; dircache, getopt long-option, and empty consistency-test result compatibility are repaired before execution.
  test_package:
    command: python test_avida.py <avida-path>
    cases: 1
    passed: null
    note: Executes avida --help and verifies help output.

platform:
  target_architecture: OHOS/armv8
  limitations:
    - The bundled tcmalloc implementation is disabled because it contains x86-specific assembly.
