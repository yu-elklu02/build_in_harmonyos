package: avida
version: "2.12.4"
status: pending
build_system: cmake
homepage: https://avida.devosoft.org/
license: GPL-3.0-only

source:
  url: https://downloads.sourceforge.net/project/avida/avida-stable/2.12.4/avida-2.12.4-src.tar.gz
  sha256: 70b4953cd7ab60c3331e7e5eb5d3c6953a72eec99ec6cb529bf638727ce39483
  tar_format: tar.gz

build:
  system: cmake
  command: cmake -DAVD_CMDLINE=ON -DAVD_GUI_NCURSES=OFF -DAVD_USE_TCMALLOC=OFF && cmake --build .
  dependencies: []

patches_applied:
  - patches/0001-make-tcmalloc-optional.patch
  - patches/0002-fix-cpp17-musl-compat.patch

tests:
  upstream:
    command: python avida-core/tests/_testrunner/testrunner.py --testrunner-name=./run_tests --long-tests -j 1 --xml-report=<build>/avida-upstream-tests.xml
    cases: 71
    passed: 0
    note: The runner is configured for serial execution and includes long tests. Final pass count must come from the OHOS XML report; prior validation had 58/64 pass and 6 failures.
  test_package:
    command: python test_avida.py <avida-path>
    cases: 1
    passed: 1
    note: Executes avida --help and verifies help output.

platform:
  target_architecture: OHOS/armv8
  limitations:
    - The bundled tcmalloc implementation is disabled because it contains x86-specific assembly.
