# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adios2/2.12.1
homepage: "https://github.com/ornladios/ADIOS2"

# 上游测试命令 (用于 ctest -N 分析实际注册的用例)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中未集成上游测试
# 首轮核心适配 BUILD_TESTING=OFF, 上游 testing/ 目录不参与构建
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游测试用例统计 (基于 testing/ 目录 CMakeLists.txt 静态解析, 2026-07-20)
#   - gtest_add_tests_helper 调用: 201 个 (分布在 28 个 CMakeLists.txt)
#   - add_test 调用: 127 个 (分布在 17 个 CMakeLists.txt, 含 SetupTestPipeline 注册的 fixture)
#   - .cpp 中 GTest 宏 (TEST/TEST_F/TEST_P): 267 个 (分布在 100 个文件)
#   - .F90 中无 GTest 宏 (Fortran 测试通过 gtest_add_tests_helper_Fortran + add_test 注册)
# 实际 ctest -N 列出的用例数会因 BP3/BP4/BP5、Serial/MPI、SST/DataMan 等配置展开,
# 完整配置下估计 500-800 个用例; 本字段记录的是 CMake 注册入口数 (下限值)。
upstream_test_count: 328
upstream_test_pass_count: 0
upstream_test_status: "not_executed"
upstream_test_reason: "首轮核心适配 BUILD_TESTING=OFF, 上游测试依赖 GTest、Python 及多种可选后端 (MPI/SST/HDF5/DataMan 等) 未启用"

