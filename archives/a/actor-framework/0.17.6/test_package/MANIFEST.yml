package: actor-framework/0.17.6
homepage: "https://www.actor-framework.org/"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-folder> --output-on-failure -j8 --timeout 60"
upstream_tests:
  - source: "libcaf_core/test/"
    description: "100 upstream CAF core CTest cases"
    command: "ctest"
  - source: "libcaf_io/test/"
    description: "12 upstream CAF I/O CTest cases"
    command: "ctest"
test_package_tests:
  - file: "actor_probe.cpp"
    description: "Create an actor system and validate a request/reply result"
    command: "./actor_probe"
  - file: "actor_probe.cpp"
    description: "Inject a negative input and verify invalid_argument propagation"
    command: "./actor_probe --expect-invalid"
assertion_count: 4
