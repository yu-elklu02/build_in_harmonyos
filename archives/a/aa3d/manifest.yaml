# 软件级 manifest — aa3d
# 遵循 ARCHIVE-SPEC v2.0

software: aa3d
display: "aa3d"
description: "ASCII art 立体图生成器 — 将文本 3D 深度图转换为随机点 ASCII 立体图"
category: utility
homepage: "http://aa-project.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（1998 年发布），仅隐含规则 `aa3d: aa3d.c`，无 configure、无 make check 目标"
    - "原程序无 --version/--help 选项，通过补丁添加以通过 Conan L2 冒烟门禁（先试 --version 再试 --help）"
    - "1998 年 C89 代码未包含 <string.h> 就使用 strcmp/strlen，补丁补充 include 消除隐式声明告警"
    - "OHOS 精简环境无 coreutils install 命令，staging 用 cp + chmod 替代"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0":
    status: published
    build_date: "2026-08-04"
