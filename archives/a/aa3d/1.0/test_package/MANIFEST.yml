# test_package/MANIFEST.yml — aa3d 1.0
# CI L0e requires this file to exist.

package: aa3d/1.0
homepage: "http://aa-project.sourceforge.net/"

# aa3d has no upstream test suite (1998 plain-Makefile project, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs aa3d --version and feeds a depth map through aa3d -w 40 -d, verifying non-empty stereogram output"
    command: "bash test.sh"

# Approximate assertion count (--version + functional output)
assertion_count: 2
