package: ace-link/0.5.0
homepage: "https://github.com/abo-abo/ace-link"

# 上游测试命令 - Emacs Lisp 包无独立测试套件
upstream_check_command: "make test (Emacs Lisp byte-compile test)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/make-compile.el
    source: https://github.com/abo-abo/ace-link/blob/master/test/make-compile.el
    description: "Emacs Lisp byte-compilation test"
    command: "emacs -batch -l test/make-compile.el"

# test_package 中自带的测试
test_package_tests:
  - file: test_ace_link.py
    description: "Verify ace-link.el exists, non-empty, contains (provide 'ace-link)"

# 测试断言总数
assertion_count: 3
