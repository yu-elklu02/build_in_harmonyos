# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: arp-scan/1.10.0
homepage: "https://github.com/royhills/arp-scan"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: check-run1
    source: arp-scan-1.10.0.tar.gz/check-run1
    description: "Run arp-scan against a test interface"
    command: "./check-run1"
  - file: check-packet
    source: arp-scan-1.10.0.tar.gz/check-packet
    description: "Test packet decoding and construction"
    command: "./check-packet"
  - file: check-decode
    source: arp-scan-1.10.0.tar.gz/check-decode
    description: "Test ARP packet decode function"
    command: "./check-decode"
  - file: check-host-list
    source: arp-scan-1.10.0.tar.gz/check-host-list
    description: "Test host list parsing"
    command: "./check-host-list"
  - file: check-ieee-reg
    source: arp-scan-1.10.0.tar.gz/check-ieee-reg
    description: "Test IEEE registration data lookup"
    command: "./check-ieee-reg"
  - file: check-error
    source: arp-scan-1.10.0.tar.gz/check-error
    description: "Test error handling functions"
    command: "./check-error"
  - file: check-options
    source: arp-scan-1.10.0.tar.gz/check-options
    description: "Test command line option parsing"
    command: "./check-options"
  - file: check-prng
    source: arp-scan-1.10.0.tar.gz/check-prng
    description: "Test Mersenne Twister PRNG"
    command: "./check-prng"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify arp-scan --version runs correctly"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
