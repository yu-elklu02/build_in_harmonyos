software: arp-scan
version: 1.10.0
status: built
build_date: 2026-08-09
build_system: autotools
created_at: 2026-05-15
updated_at: 2026-08-09

# 编译配置
configure_options:
  - --prefix=${PACKAGE_PREFIX}
  # AutotoolsToolchain auto-generates --build from conan settings

# 环境设置 (由 Conan AutotoolsDeps/AutotoolsToolchain 管理)
environment:
  TMPDIR: /storage/Users/currentUser/tmp

# 依赖信息
dependencies:
  required:
    - libpcap >= 1.10.6
  conan:
    - libpcap/1.10.6 (from ohpcd conan repo, static)

# 补丁信息
patches_applied:
  - description: "config.guess/config.sub: add HarmonyOS recognition (E007) - applied in conanfile.py build()"
    type: platform
  - description: "configure: remove umask 077 from temp-dir creation (E114: HMDFS setgid) - applied in conanfile.py build()"
    type: platform

# 知识沉淀
knowledge_gained:
  - id: K001
    category: autotools
    description: "Release tarball includes pre-generated configure — no automake/autoreconf needed"
  - id: K002
    category: platform
    description: "HMDFS config.status umask 077 issue — same as E114, fixed by removing umask 077 in configure"
  - id: K003
    category: platform
    description: "config.guess v2022 does not recognize HarmonyOS — patch to add __OHOS__ LIBC detection and HarmonyOS case block"

# 文件清单
build_artifacts:
  binary:
    - name: arp-scan
      type: ELF aarch64 PIE
  data:
    - name: ieee-oui.txt
      size: 1453113
    - name: mac-vendor.txt
      size: 2228

# 已知限制
limitations:
  - requires CAP_NET_RAW or root for network operations
  - libpcap linked statically via conan

# 源码信息
source_url: https://github.com/royhills/arp-scan/releases/download/1.10.0/arp-scan-1.10.0.tar.gz
source_sha256: a078fe8711ecbb8b99121c3d8be26ae7e7f339f11010ef61318be4f33394d012

# 日志文件
build_log: reports/test-report.md
