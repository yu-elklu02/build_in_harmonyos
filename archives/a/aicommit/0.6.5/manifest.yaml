# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go CLI 工具在 OHOS 上构建：Go 工具链 ELF 无 .codesign 段被 Seccomp 拦截，需 binary-sign-tool 签名后再执行 (ref: E077)"
  - "Go linker 在 hmdfs 上 mmap 输出失败（E051），链接输出目录必须放到非 hmdfs 工作区（如 /data/storage/el2/...） (ref: E011)"
  - "版本号注入：ldflags -X main.Version=v0.6.5 使 aicommit version 输出正式版本号"
  - "aicommit 上游无 *_test.go 测试文件，消费者验证以 version/--help 冒烟测试代替"
