# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aicommit/0.6.5
homepage: "https://github.com/coder/aicommit"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Go 单元测试)
# 说明: coder/aicommit v0.6.5 源码树中不存在 *_test.go 测试文件
# （对 cmd/aicommit 与仓库根目录递归搜索均无结果），故上游测试用例数为 0。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: aicommit version 断言 v0.6.5 + --help 帮助输出"
    command: "bash test.sh <bin/aicommit>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
