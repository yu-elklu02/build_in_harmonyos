# 软件级 manifest — aicommit
# 遵循 ARCHIVE-SPEC v2.0

software: aicommit

display: "aicommit"

description: "aicommit 是根据仓库既有提交风格，用 AI 生成 git commit message 的命令行工具"

# 分类标签
category: build-tool

# 官网 URL
homepage: "https://github.com/coder/aicommit"

# 开源许可证（SPDX 标识）
license: CC0-1.0

# 常用构建系统
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Go CLI 工具：CGO_ENABLED=0 纯静态构建，产物与 Go SDK ELF 需 binary-sign-tool 签名"
    - "Go linker 链接输出必须放在非 hmdfs 工作区（/data/storage/el2/...）"
    - "版本号通过 ldflags -X main.Version=v<版本> 注入"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  0.6.5:
    status: built
    build_date: 2026-08-10
