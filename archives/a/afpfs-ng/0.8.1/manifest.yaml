# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 缺少 readline/ncurses/termios，需 stub 化交互式命令行工具"
  - "HMDFS 不支持 mkfifo，AutotoolsToolchain 需设置 parallel=False"
  - "HMDFS 上 umask 077 导致 config.status 临时目录不可写，需 umask 022"
  - "config.guess/config.sub 需添加 HarmonyOS/linux-ohos 识别"
  - "fd_set 需要 #include <sys/select.h>"

