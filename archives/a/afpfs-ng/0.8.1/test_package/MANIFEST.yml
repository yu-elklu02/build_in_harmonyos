# test_package/MANIFEST.yml
package: afpfs-ng/0.8.1
homepage: "https://sourceforge.net/projects/afpfs-ng/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

# afpfs-ng has no automated test suite (make check = nothing to do)
upstream_tests: []

# Consumer-side tests (test_package)
test_package_tests:
  - file: test.c
    description: "Tests libafpclient API: afp_default_url, afp_parse_url, afp_status_header"
    command: "./test_afpfs-ng"

assertion_count: 4
