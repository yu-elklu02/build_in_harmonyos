  upstream_pytest_exempted_reason: >-
    环境限制豁免（已实际运行 + 根因精确定位）：
    A. 实测执行：npm install --ignore-scripts 绕过 esbuild postinstall 崩溃后，
    用 node --experimental-strip-types + 自定义 .js→.ts loader 驱动 manten 框架，
    实际执行不依赖 AI 的上游测试子集 tests/specs/config.ts（12 用例），
    0 通过 12 失败。
    B. 根因（已用最小复现定位，与环境变量无关）：失败点是测试框架用
    execaNode/spawn 启动被测 CLI 子进程时，node 在 OHOS 上 V8 崩溃
    （"Fatal error / Check failed: 12 == (*__errno_location())"，
    "Command was killed with SIGTRAP"）。已穷尽验证：补 PATH/TMPDIR/PWD/
    SHLVL/USERPROFILE、继承完整父环境、shell 包装（spawn sh -c）均 SIGTRAP；
    node 作为父进程 spawn 子进程执行任意 JS 脚本（-e/simple.mjs/cli.mjs）
    均崩溃，而 node --version（不执行 JS）正常、bash 直接运行 cli.mjs
    --version/config get 均正常（输出 3.4.0 / OPENAI_API_KEY）。
    C. 结论：这是 node 在 OHOS 上作为父进程 spawn 子进程执行 JS 的平台限制
    （V8 崩溃 SIGTRAP），非 aicommits 代码问题、非测试代码问题、非环境变量
    缺失问题。与 test_package 用 env -i 启动脚本规避的 Signal 5 属同类平台
    现象。完整 53 用例中依赖 AI 服务/git 的部分同样无法执行。
  upstream_pytest_pass_rate: "0/12（config 子集实测：0%，根因=node spawn 子进程执行 JS 在 OHOS 上 V8 SIGTRAP 崩溃）"
  upstream_test_suite_note: >-
    上游仓库 Nutlope/aicommits 的 tests/ 目录（v3.4.0 tag）实际包含 25 个文件：
    12 个 .ts 测试文件 + 12 个 .diff fixtures + README.md，共 16 个 describe 块、
    53 个 test 用例（测试框架 manten，入口 tests/index.ts，脚本 "tsx tests"）。
    此前 PR 声明上游测试 0 个属少报，已修正。
  upstream_test_unrunnable_evidence: >-
    OHOS 环境实测无法运行上游测试（tsx tests）：
    1) 安装 devDependencies 时 npm install 失败——esbuild@0.26.0/0.27.3 的
    postinstall 在 OHOS 上触发 SIGTRAP，node V8 崩溃：
    "Fatal error in , line 0 / Check failed: 12 == (*__errno_location())"，
    npm 日志：~/.npm/_logs/2026-08-11T10_08_31_684Z-debug-0.log 与
    2026-08-11T10_09_06_544Z-debug-0.log；
    2) 即使 env -i 最小化环境重试仍复现同一崩溃；
    3) node 本身（node --version / node -e）正常，证明崩溃特定于 esbuild
    原生二进制在 OHOS 上的不兼容，而非 node 整体不可用；
    4) tsx（测试运行器）依赖 esbuild，devDeps 无法安装 → "tsx tests" 无法执行。
