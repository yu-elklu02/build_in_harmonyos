# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aicommits/3.4.0
homepage: "https://github.com/Nutlope/aicommits"

# 上游测试命令 (npm tarball 无内置测试套件，无 make check)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（npm 发布包不含测试；上游仓库测试见 GitHub CI）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 执行 aicommits CLI)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 执行 aicommits --version 断言 3.4.0，并验证 --help"
    command: "sh test.sh"

# 测试断言总数（版本断言 + help 入口验证；上游无内置测试）
assertion_count: 2
