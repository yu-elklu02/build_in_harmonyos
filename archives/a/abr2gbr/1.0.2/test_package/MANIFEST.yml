# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: abr2gbr/1.0.2
homepage: https://github.com/marco-alamberti/abr2gbr

# abr2gbr has no upstream test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test suite
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "Verify abr2gbr binary exists and --help works"
    command: "conan test"

# 测试断言总数
assertion_count: 1