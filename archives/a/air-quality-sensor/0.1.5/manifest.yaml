knowledge_gained:
  - "air-quality-sensor 0.1.5 无 GitHub tag（tags 止于 0.1.4.2），权威源码为 Debian orig tarball（PureOS/deb.debian.org 同源镜像，sha256 固定）"
  - "发布 tarball 未预生成 configure（仅 configure.ac + autotools aux 文件），需 autoreconf 自举（tool_requires automake/1.18 + libtool/2.5.4，E178）"
  - "help2man 在 OHOS 不可用：移除 src/Makefile.am 的 manpage 再生规则（patch），tarball 内置的 air-quality-sensor.1 直接安装"
  - "E114: autoconf 生成的 config.status 以 umask 077 创建临时目录，HMDFS 沙箱不可写，build() 中改为 umask 000"
  - "configure.ac 用 PKG_CHECK_MODULES([libusb-1.0])，需 PkgConfigDeps + ACLOCAL_PATH 注入 pkg.m4（afuse/aircrack-ng 同款）"
  - "上游 0.1.5 无任何测试套件（无 tests/ 目录、Makefile.am 无 check 目标、无 TESTS 变量），由 test_package 执行 CLI 冒烟验证"
