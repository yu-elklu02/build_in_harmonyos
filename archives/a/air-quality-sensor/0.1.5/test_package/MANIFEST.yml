# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: air-quality-sensor/0.1.5
homepage: "https://github.com/bwildenhain/air-quality-sensor"

# 上游源码审计：0.1.5 发布 tarball 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (air-quality-sensor-0.1.5 orig tarball)"
    reason: "无 tests/、test/ 目录；唯一 C 源文件 src/air10.c 是主程序本身，非测试。"
  - source: "src/Makefile.am"
    reason: "仅有 bin_PROGRAMS / man_MANS / metainfo_DATA 安装规则与 help2man manpage 再生规则，无 check 目标、无 TESTS 变量。"
  - source: "configure.ac"
    reason: "仅做功能探测（getopt_long / libusb 版本检测 / PKG_CHECK_MODULES），无测试宏或测试目录声明。"
  - conclusion: "上游 0.1.5 未提供自动化测试；由 test_package 执行消费者视角的 CLI 冒烟验证（--version / --help / 裸运行退出码）。"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包二进制的真实执行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_air_quality_sensor.sh
    description: "真实执行打包的 air-quality-sensor 二进制：--version 输出含 0.1.5 版本行、--help 输出 Usage 用法、裸运行（上游 main() 语义 exit(ret?EXIT_FAILURE:EXIT_SUCCESS)：无匹配传感器时 USB 总线可读则 rc=0 干净退出，受限环境读不到 USB 描述符则 rc=1，两者均为正常退出路径，崩溃才判失败）"
    command: "bash test_air_quality_sensor.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
