# 软件级 manifest — air-quality-sensor
# 遵循 ARCHIVE-SPEC v2.0

software: air-quality-sensor
display: "air-quality-sensor"
description: "用户态驱动：读取 AppliedSensor Indoor Air Monitor（USB CO2 传感器）的空气质量数据"
category: system
homepage: "https://github.com/bwildenhain/air-quality-sensor"
license: GPL-3.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "0.1.5 无 GitHub tag（tags 止于 0.1.4.2），源码取自 Debian orig tarball（与官方发布内容一致）"
    - "tarball 未预生成 configure，需 autoreconf 自举（tool_requires automake/libtool）"
    - "help2man 在 OHOS 不可用：移除 src/Makefile.am 的 manpage 再生规则，使用 tarball 内置 manpage"
    - "E114: configure 生成的 config.status 用 umask 077 建临时目录，HMDFS 上需改为 022"
  common_dependencies:
    - libusb

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.5":
    status: built
    build_date: "2026-08-12"
