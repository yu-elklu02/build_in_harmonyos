# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ACF (Alpine Configuration Framework) 模块是纯 Lua/HTML 数据包：Makefile 仅 cp 文件到 share/acf/app/<name>/，无 C 编译、无 configure、无 make check"
  - "gitlab.alpinelinux.org 在构建网络被 HTTP 418 拦截（E017 同款网络限制），需改用 Alpine distfiles 官方镜像（distfiles.alpinelinux.org）作为源码源"
  - "纯数据模块无二进制可运行：test_package 的 test() 需用 self.run() 检查文件存在与非空（L0d stub_test_method 门禁要求 self.run 调用），不能只做 Python 断言"
  - "纯数据模块无 bin/ 产物：package_type 用 application 但 cpp_info 仅暴露 share/acf/app 路径，无需 commands.json（R38 不适用）"
