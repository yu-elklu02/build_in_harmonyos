# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: acf-mdadm/0.5.0
homepage: "https://gitlab.alpinelinux.org/acf/acf-mdadm"

# 上游测试命令 (ACF 纯数据模块，无 make check 目标)
upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (acf-mdadm 无自动化测试)
# test_package 验证安装的 Lua/LSP 模块文件完整性

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    source: test_package/conanfile.py
    description: "验证 share/acf/app/mdadm 下 Lua 控制器/模型与 LSP 视图文件齐全"
    command: "python3 conanfile.py (conan test)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
