# 版本级 manifest
# 文件位置: archives/a/alpine-baselayout/3.7.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.7.2"

# 软件名
software: "alpine-baselayout"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-12"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（aports v3.23 分支 3.7.2-r0 的逐文件 plain URL，见 conandata.yml）
  url: "https://git.alpinelinux.org/aports/plain/main/alpine-baselayout/?id=15b3b78187b3808104f98f765e9632e0b09281a7"

  # 源码校验和（逐文件 SHA256 见 conandata.yml；协议/services 来自 Debian netbase v6.4）
  sha256: "multiple files (see conandata.yml)"

  # 压缩格式
  tar_format: none

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（noarch 数据/配置包，无编译步骤）
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "alpine-baselayout 是 Alpine Linux 基础目录结构与 init 脚本包（noarch，GPL-2.0-only），由静态文本配置文件组成，无编译步骤"
  - "上游构建仅用 awk 从 passwd 生成 shadow：root 密码字段为 '::'，其余用户为 ':!:'，后接 ':0:::::'"
  - "源码位于 Alpine aports 仓库 main/alpine-baselayout，无独立发布 tarball；需按 APKBUILD source 清单逐文件下载并核验 SHA256"
  - "protocols/services 文件来自 Debian netbase v6.4（APKBUILD source 指定的 salsa.debian.org 地址）"
  - "Alpine 根文件系统路径（/dev /proc /sys /bin /lib /var 等）不能照搬进用户级 Conan 包，只安装配置文件到包内相对路径"
  - "上游 APKBUILD options='!fhs !check keepdirs' 且无 test()/check() 函数，上游无自动化测试（记 0）"
