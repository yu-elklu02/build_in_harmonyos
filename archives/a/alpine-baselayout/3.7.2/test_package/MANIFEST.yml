# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alpine-baselayout/3.7.2
homepage: "https://gitlab.alpinelinux.org/alpine/aports/-/tree/master/main/alpine-baselayout"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 APKBUILD options="!fhs !check keepdirs"，无 test()/check() 函数，
# 无 tests/ 目录，无 Make check/CTest/meson test 入口。
# 搜索证据: APKBUILD (v3.23 分支 3.7.2-r0, commit 15b3b78187) 全文
# grep '^test|^check|checkdepends' 无匹配；options 显式含 !check。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（noarch 配置包，APKBUILD 无任何测试入口）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smoke.sh
    description: "打包完整性真实断言：crontab 存在且 mode 600 / profile.d 脚本存在且 sh -n 通过 / modprobe.d 三配置存在 / group-passwd-inittab-profile 内容标识 / protocols-services(netbase v6.4) 内容 / shadow 按上游 awk 语义生成 / hier.7 man page / GPL-2.0 许可证文本"
    command: "sh test_smoke.sh <pkg_root> <sh>"

# 测试断言总数 (近似值, 用于质量评估)
# 消费者 smoke test 独立统计：8 组断言（实测 8 行 PASS，见 conan create 日志
# "PASS: alpine-baselayout smoke test: 8 assertions passed"）；上游断言为 0
assertion_count: 8
