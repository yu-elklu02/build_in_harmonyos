manifest:
  package: aspell-en
  version: "2026.02.25"
  test_type: explicit

test_structure:
  test_script: test_aspell_en.py
  conanfile: conanfile.py
  description: >
    Validates the packaged English dictionary data files for aspell-en.
    The test script receives the package folder as its first argument and
    checks 8 aspects of the dictionary data content.

upstream_tests:
  available: false
  description: >
    The aspell-en source package does not include a test/ directory or
    a `make check` target. The Makefile.pre has no check/test rules.
    Upstream validation is done by installing the dictionary and running
    aspell with --lang=en to verify spell checking works.

test_package_tests:
  - id: 1
    name: en.dat exists
    description: Verifies en.dat exists in the package and is non-empty
    validates: Dictionary metadata file presence
  - id: 2
    name: en.dat has name en
    description: Verifies en.dat contains 'name en' confirming English dictionary
    validates: Dictionary language identity
  - id: 3
    name: word list files exist
    description: Verifies .cwl or .rws dictionary data files exist
    validates: Dictionary word data presence
  - id: 4
    name: en.multi exists
    description: Verifies en.multi multi-file alias configuration exists
    validates: Dictionary multi-file configuration
  - id: 5
    name: English content in .dat
    description: Verifies .dat files contain English-specific content
    validates: Dictionary language correctness
  - id: 6
    name: charset declaration
    description: Verifies en.dat contains a charset declaration (e.g. iso-8859-1)
    validates: Dictionary character encoding metadata
  - id: 7
    name: dictionary data types
    description: Verifies .cwl, .dat, .multi, .alias file types are present
    validates: Dictionary package file type completeness
  - id: 8
    name: total data files >= 5
    description: Counts total data files installed, expecting at least 5
    validates: Dictionary package data file completeness
