package: adobe-source-han-serif-kr/2.003
homepage: "https://github.com/adobe-fonts/source-han-serif"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_note: >-
  Adobe 2.003R K 地区发布包仅包含七个预构建字体和许可证，不包含自动化测试套件。
test_package_tests:
