software: autoconf
display: "GNU Autoconf"
description: "GNU Autoconf configure script generator"
category: build-tool
homepage: "https://www.gnu.org/software/autoconf/"
license: GPL-3.0-or-later WITH Autoconf-exception-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Command-line build tool; commands.json is required."
    - "Release tarball ships configure/Makefile.in; do not run autoreconf when building Autoconf itself."
    - "Installed Perl scripts are wrapped to derive share/autoconf paths from the package prefix."
  common_dependencies:
    - perl/5.42.2
    - m4/1.4.19

versions:
  "2.72":
    status: built
    build_date: "2026-08-06"
    conan_ref: "autoconf/2.72"
    source_url: "https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.gz"
    source_mirrors:
      - "https://mirrors.tuna.tsinghua.edu.cn/gnu/autoconf/autoconf-2.72.tar.gz"
      - "https://mirrors.aliyun.com/gnu/autoconf/autoconf-2.72.tar.gz"
      - "https://mirrors.kernel.org/gnu/autoconf/autoconf-2.72.tar.gz"
