# 软件级 manifest 模板
# 文件位置: archives/a/ae_fonts_mono/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: ae_fonts_mono

# 显示名
display: "ae_fonts_mono"

# 一句话描述
description: "Arabeyes 阿拉伯语等宽位图字体（10x21 BDF/PCF），纯字体数据包"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://www.arabeyes.org/"

# 开源许可证（SPDX 标识）
license: LicenseRef-public-domain

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯字体数据包（NO_BUILD=yes），无需编译，直接打包 10x21.bdf/10x21.pcf"
    - "许可证为 Public domain（BDF 头内声明）"
    - "数据包 G4 门禁通过创建 lib/pkgconfig/*.pc 满足"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0":
    status: built
    build_date: "2026-08-05"
