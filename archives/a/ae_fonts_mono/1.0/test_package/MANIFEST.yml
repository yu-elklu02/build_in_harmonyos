# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ae_fonts_mono/1.0
homepage: "https://www.arabeyes.org/"

# 上游测试命令 — 纯字体数据包（FreeBSD NO_BUILD=yes），无构建系统，无自动化测试入口
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — 无（数据包不含测试，静态核验确认）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_font_package.py
    description: "验证 10x21.bdf/10x21.pcf 安装到包内 share/fonts/ae_fonts_mono/，校验存在性、大小、BDF 元数据（STARTFONT 2.1 + Public domain 声明）、PCF 魔数与 pkgconfig fontdir"
    command: "conan create 自动执行 test() → python3 test_font_package.py <package_root>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
