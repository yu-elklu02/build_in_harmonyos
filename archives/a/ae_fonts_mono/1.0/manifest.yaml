# 版本级 manifest 模板
# 文件位置: archives/a/ae_fonts_mono/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 软件名
software: "ae_fonts_mono"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/arabeyes/Fonts/ae_fonts/ae_fonts_mono.tar.bz2"

  # 源码校验和
  sha256: "62990ea66e05b9a0ec46490e0adbb69a1c83977bd9dfdc7a2d6ffd208e6ec668"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: skipped                # official | manual | skipped
  total: 0                     # 上游无自动化测试（纯字体数据包，NO_BUILD=yes）
  passed: 0
  failed: 0

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ae_fonts_mono 是纯字体数据包（10x21.bdf + 10x21.pcf），FreeBSD port 标记 NO_BUILD=yes，无构建系统，无需编译"
  - "BDF 文件头 COPYRIGHT 声明 'Public domain font. Share and enjoy.'，许可证为 Public domain（源码内真实核验）"
  - "纯数据包无 bin/lib/include 产物，G4 门禁通过创建 lib/pkgconfig/*.pc 满足（参考 fonts-encodings 模式）"
  - "CI L0c 要求 test_package/ 下有独立测试源文件（.c/.cpp/.py/.sh 且非 conanfile.py），消费测试逻辑放在 test_font_package.py 中由 conanfile.py test() 调用"
