package: adept-math/2.1.3
homepage: "https://www.met.reading.ac.uk/clouds/adept/"

upstream_check_command: "test/Makefile check"
upstream_test_in_build: true
upstream_test_command: "custom runner equivalent to upstream test/Makefile check"

upstream_tests:
  - file: test/Makefile
    source: "Adept-2-2.1.3/test/Makefile"
    description: "Upstream check target builds and runs 25 test programs through run_tests.sh"
    command: "make -C test check"

test_package_tests:
  - file: test.cpp
    description: "Consumer reverse-mode automatic differentiation assertion"
    command: "test_adept_math"

assertion_count: 26
