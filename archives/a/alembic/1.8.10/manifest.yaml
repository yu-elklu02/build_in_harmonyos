version: "1.8.10"
status: built
build_date: "2026-07-15"
conan_ref: "alembic/1.8.10"

source:
  url: "https://github.com/alembic/alembic/archive/refs/tags/1.8.10.tar.gz"
  sha256: "06c9172faf29e9fdebb7be99621ca18b32b474f8e481238a159c87d16b298553"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "ALEMBIC_SHARED_LIBS=OFF"
    - "USE_HDF5=OFF"
    - "USE_ARNOLD=OFF"
    - "USE_PRMAN=OFF"
    - "USE_MAYA=OFF"
    - "USE_PYALEMBIC=OFF"
    - "USE_TESTS=ON"
    - "USE_BINARIES=OFF"
    - "ALEMBIC_DEBUG_WARNINGS_AS_ERRORS=OFF"
    - "CMAKE_PREFIX_PATH=<imath-prefix> (vendored Imath)"
  dependencies:
    - imath (vendored from source, v3.1.12)
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-imath-cxx-standard.patch"

patches_description:
  0001-imath-cxx-standard.patch: "对 vendored 的 Imath 源码：将 config/LibraryDefine.cmake 的 target_compile_features(cxx_std_*) 改为 set_target_properties(CXX_STANDARD)。原因：CMake 4.x 无法识别 OHOS clang（compiler id 为 unknown），CMAKE_CXX_COMPILE_FEATURES 为空，导致 target_compile_features 报错"

knowledge_gained:
  - "Alembic 唯一硬依赖为 Imath；Imath 在制品仓不可用，采用 vendor 源码 + 单独 cmake 构建安装到本地 prefix，再由 Alembic 的 FIND_PACKAGE(Imath) 经 CMAKE_PREFIX_PATH 解析"
  - "CMake 4.x 无法识别 hnp 的 Alpine musl clang（CMAKE_CXX_COMPILER_ID 为空，CMAKE_CXX_COMPILE_FEATURES 为空）→ 凡用 target_compile_features 的上游库都需改为 CXX_STANDARD 属性；Alembic 自身用 CMAKE_CXX_STANDARD 不受影响"
  - "Alembic 使用自有的 ALEMBIC_SHARED_LIBS 选项（非 BUILD_SHARED_LIBS），需单独设置；默认静态以规避 OHOS 共享库 RPATH 问题"
  - "打包时需把 vendored Imath 的 libImath-3_1 规整为 libImath，并删除 lib/cmake（引用重命名前库名与外部 Imath）；cpp_info.libs 同时声明 Alembic 与 Imath（静态库不内嵌传递目标文件）"

ci_verification:
  environment: "Python 3.12, Conan 2.29.1 (OHOS 适配版), Clang 15, musl libc++"
  build: "PASS — libAlembic.a + vendored libImath.a 构建成功"
  upstream_tests: "PASS — ctest 57/57 通过（上游 ADD_TEST 共 64，AbcCoreHDF5 的 7 个需 HDF5 未启用，未运行）"
  test_package: "PASS — test_alembic 写入并读回 Ogawa 归档成功"
