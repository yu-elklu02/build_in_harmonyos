# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alembic/1.8.10
homepage: "https://github.com/alembic/alembic"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中已集成上游测试 (cmake.test() -> ctest)
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (USE_TESTS=ON, USE_HDF5=OFF)。
# Alembic 使用 CTest 注册单元测试，分布在 lib/Alembic/*/Tests/ 下，
# 共 57 个测试用例（AbcCoreHDF5 的 7 个需 HDF5，USE_HDF5=OFF 时不参与编译）。
upstream_tests:
  - file: lib/Alembic/Abc/Tests/
    source: alembic-1.8.10/lib/Alembic/Abc/Tests/
    description: "Abc 核心 16 个用例 (Object/Property/Archive/TimeSampling 等)"
    command: "ctest"
  - file: lib/Alembic/AbcGeom/Tests/
    source: alembic-1.8.10/lib/Alembic/AbcGeom/Tests/
    description: "AbcGeom 几何 15 个用例 (PolyMesh/SubD/Curves/Camera/Light 等)"
    command: "ctest"
  - file: lib/Alembic/AbcCoreOgawa/Tests/
    source: alembic-1.8.10/lib/Alembic/AbcCoreOgawa/Tests/
    description: "Ogawa 后端 8 个用例 (含 FuzzTest)"
    command: "ctest"
  - file: lib/Alembic/AbcMaterial/Tests/
    source: alembic-1.8.10/lib/Alembic/AbcMaterial/Tests/
    description: "AbcMaterial 材质 6 个用例"
    command: "ctest"
  - file: lib/Alembic/Util/Tests/
    source: alembic-1.8.10/lib/Alembic/Util/Tests/
    description: "Util 工具 4 个用例"
    command: "ctest"
  - file: lib/Alembic/AbcCoreAbstract/Tests/
    source: alembic-1.8.10/lib/Alembic/AbcCoreAbstract/Tests/
    description: "AbcCoreAbstract 3 个用例"
    command: "ctest"
  - file: lib/Alembic/AbcCoreLayer/Tests/
    source: alembic-1.8.10/lib/Alembic/AbcCoreLayer/Tests/
    description: "AbcCoreLayer 2 个用例"
    command: "ctest"
  - file: lib/Alembic/Ogawa/Tests/
    source: alembic-1.8.10/lib/Alembic/Ogawa/Tests/
    description: "Ogawa 流 2 个用例"
    command: "ctest"
  - file: lib/Alembic/AbcCollection/Tests/
    source: alembic-1.8.10/lib/Alembic/AbcCollection/Tests/
    description: "AbcCollection 1 个用例"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_alembic.cpp
    description: "消费者冒烟测试: 用 Alembic+Imath API 写入 Ogawa 归档并读回校验"
    command: "./test_alembic"

# 上游测试用例总数 (USE_HDF5=OFF 时实际编译运行的 ctest 数)
assertion_count: 57
