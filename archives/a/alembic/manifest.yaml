software: alembic
display: "Alembic"
description: "开源计算机图形交换框架，用于在 VFX/动画流水线中存储与共享 3D 数据（几何、灯光、相机等）"
category: library
homepage: "https://github.com/alembic/alembic"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake (C++14) 构建，仅依赖 Imath；Imath 未发布到制品仓，故在配方中 vendor 其源码（v3.1.12）单独 cmake 构建安装到本地 prefix，再由 Alembic 的 FIND_PACKAGE(Imath) 经 CMAKE_PREFIX_PATH 解析"
    - "CMake 4.x 无法识别 OHOS clang（compiler id unknown → CMAKE_CXX_COMPILE_FEATURES 空）；对 vendored Imath 应用补丁 0001-imath-cxx-standard.patch，把 target_compile_features 改为 CXX_STANDARD 属性"
    - "默认静态构建（ALEMBIC_SHARED_LIBS=OFF，Alembic 自有选项），规避 OHOS 上 .so/RPATH 问题"
    - "禁用可选组件：USE_HDF5/USE_ARNOLD/USE_PRMAN/USE_MAYA/USE_PYALEMBIC 均 OFF"
    - "USE_BINARIES=OFF：仅产出库，不构建缺乏统一 --version 的 Abc* 命令行工具"
    - "USE_TESTS=ON：上游 57 个 ctest 用例在 build() 中通过 cmake.test() 运行，全部通过"
    - "打包时把 vendored 的 libImath-3_1 规整为 libImath，cpp_info.libs=[Alembic, Imath]"
  common_dependencies:
    - imath

versions:
  "1.8.10":
    status: built
    build_date: "2026-07-15"
    conan_ref: "alembic/1.8.10"
