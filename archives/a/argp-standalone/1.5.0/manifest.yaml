software: argp-standalone
version: "1.5.0"
build_system: autotools
status: built
build_date: "2026-04-30"

source:
  url: "https://github.com/argp-standalone/argp-standalone/archive/refs/tags/1.5.0.tar.gz"
  sha256: "c29eae929dfebd575c38174f2c8c315766092cec99a8f987569d0cad3c6d64f6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "LIBS=-lintl"
  dependencies:
    - gettext
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-configure.patch
knowledge_gained:
  - "需要 autoreconf -fi 生成 configure（原始 tarball 无 configure 脚本）"
  - "configure 中 umask 077 需改为 umask 022 (HMDFS)"
  - "需传 LIBS=-lintl 链接 gettext"
  - "argp-standalone 是 noinst 静态库，需手动安装"
