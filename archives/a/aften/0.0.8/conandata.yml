sources:
  "0.0.8":
    url: "https://downloads.sourceforge.net/project/aften/aften/0.0.8/aften-0.0.8.tar.bz2"
    sha256: "87cc847233bb92fbd5bed49e2cdd6932bb58504aeaefbfd20ecfbeb9532f0c0a"

patches:
  "0.0.8":
    - patch_file: "patches/0001-respect-cross-compilation-processor.patch"
      patch_description: "Use the target processor instead of uname while cross compiling"
      patch_type: "portability"
    - patch_file: "patches/0002-generic-cpu-caps-noop.patch"
      patch_description: "Provide the generic SIMD restriction hook on non-x86 and non-PowerPC targets"
      patch_type: "portability"
    - patch_file: "patches/0003-install-static-library.patch"
      patch_description: "Install the static library with the conventional aften name"
      patch_type: "conan"
    - patch_file: "patches/0004-thread-count-fallback.patch"
      patch_description: "Provide a deterministic CPU-count fallback when OHOS lacks get_nprocs"
      patch_type: "portability"
