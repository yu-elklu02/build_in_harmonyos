version: "0.0.8"
software: aften
status: built
build_date: "2026-08-05"
build_system: cmake

source:
  url: "https://downloads.sourceforge.net/project/aften/aften/0.0.8/aften-0.0.8.tar.bz2"
  sha256: "87cc847233bb92fbd5bed49e2cdd6932bb58504aeaefbfd20ecfbeb9532f0c0a"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "SHARED=<Conan shared option>"
    - "BINDINGS_CXX=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-respect-cross-compilation-processor.patch
  - patches/0002-generic-cpu-caps-noop.patch
  - patches/0003-install-static-library.patch
  - patches/0004-thread-count-fallback.patch

knowledge_gained:
  - "The release has no upstream test directory or registered CTest target."
  - "The original CMake logic uses uname during cross compilation and can select host SIMD sources."
  - "The static target was not part of the upstream install target list."
  - "Generic non-x86 targets need a no-op apply_simd_restrictions implementation."
  - "OHOS may not expose get_nprocs during CMake checks, so the upstream fallback needs a default thread count."
  - "The consumer test performs a real stereo silence-frame encode and an invalid-rate check."
