software: aribb24
description: ARIB STD-B24 字幕解码库（JIS 8bit 字符解码 + MPEG-TS caption 解析）
category: multimedia
license: LGPL-3.0-or-later
homepage: https://code.videolan.org/jeeb/aribb24/
repository: https://code.videolan.org/jeeb/aribb24/
keywords:
  - arib
  - std-b24
  - caption
  - subtitle
  - jis

ohos_adaptation:
  key_points:
    - "configure.ac 需移除 AC_PROG_CC_STDC（autoconf >= 2.70 已删除）"
    - "移除可选 libpng 的 PKG_CHECK_MODULES，避免依赖 pkg.m4"
    - "OHOS 原生构建需显式 --build/--host=aarch64-unknown-linux-gnu"
  common_dependencies: []

versions:
  "1.0.4":
    status: built
    build_date: "2026-08-13"
