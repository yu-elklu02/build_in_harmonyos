sources:
  url: "https://code.videolan.org/jeeb/aribb24/-/archive/v1.0.4/aribb24-v1.0.4.tar.bz2"
  sha256: "88b58dd760609372701087e25557ada9f7c6d973306c017067c5dcaf9e2c9710"

patches:
  - patch_file: "patches/0001-configure.ac-remove-obsolete-macro.patch"
    patch_description: "Remove AC_PROG_CC_STDC, deleted in autoconf >= 2.70, so autoreconf works on modern toolchains"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.ac-drop-optional-libpng.patch"
    patch_description: "Drop the optional libpng pkg-config check; HAVE_PNG only gates DRCS bitmap export and pkg.m4 is not guaranteed on OHOS"
    patch_type: "portability"
