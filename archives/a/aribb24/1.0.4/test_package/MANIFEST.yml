# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: aribb24/1.0.4
homepage: "https://code.videolan.org/jeeb/aribb24/"

# 上游源码审计（hmbs 硬门禁）：v1.0.4 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "仅声明 lib_LTLIBRARIES/pkginclude_HEADERS/pkgconfig_DATA/dist_doc_DATA；无 TESTS/check_PROGRAMS/check-local 目标。"
  - source: "configure.ac"
    reason: "仅 AC_PROG_CC/LT_INIT/AC_CHECK_FUNCS([vasprintf])；无测试相关宏或 AC_CONFIG_TESTDIR。"
  - source: "源码树"
    reason: "发布包无 tests/、test/ 目录，src/ 下无 *_test 源文件；bootstrap 仅运行 autoreconf --install。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 执行消费者视角的真实 ARIB 解码管线验证。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_aribb24.c
    description: "调用 libaribb24 真实管线：instance/parser/decoder 生命周期、arib_parse_pes 解析管理数据组与语句数据组、arib_parser_get_data 字节级校验、arib_decode_buffer JIS 解码"
    command: "./test_aribb24"

assertion_count: 7
