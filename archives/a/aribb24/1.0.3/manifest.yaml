software: aribb24
version: "1.0.3"
build_system: autotools
build_date: 2026-08-12
status: built
upstream_repo: https://github.com/nkoriyama/aribb24
homepage: https://github.com/nkoriyama/aribb24
description: "ARIB STD-B24 caption/subtitle library"
license: "BSD-2-Clause"
source:
  url: "https://github.com/nkoriyama/aribb24/archive/refs/tags/v1.0.3.tar.gz"
  sha256: "f61560738926e57f9173510389634d8c06cabedfa857db4b28fb7704707ff128"
dependencies:
  - libpng/1.6.58
configure_options:
  - "--prefix=${PREFIX}"
  - "--disable-shared"
  - "--enable-static"
patches_applied:
  - "patches/0001-add-png-cflags.patch"
notes: |
  aribb24 1.0.3 adaptation for HarmonyOS PC (aarch64).
  Autotools build with libpng dependency.
  Makefile.am needs $(PNG_CFLAGS) added to CFLAGS for png header detection.
  
  Build verified via conan-verify (all gates: G1/G0/G2/G3/G4/L2/L4/L5 passed).
  
  Platform note: clang-15 stdin socket issue exists only in OpenDesk executeZsh
  environment (zsh stdin is Unix socket → fstat(0) EACCES → clang silent exit).
  Fix applied at infrastructure level in sitecustomize.py (stdin=DEVNULL default
  for subprocess.run). No per-package workaround needed.
