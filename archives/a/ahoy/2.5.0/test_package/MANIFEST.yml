package: ahoy/2.5.0
homepage: "https://github.com/ahoy-cli/ahoy"

upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test packages compiled with -c, signed, and executed directly"

upstream_tests:
  - file: v2/*_test.go
    source: "ahoy-cli/ahoy v2.5.0"
    description: "Go unit tests for config parsing, command lookup, string array decoding, and platform path handling; excludes TestOverrideExample because it triggers os.Exit under direct signed test-binary execution"
    command: "go test ./... with TestOverrideExample excluded on OHOS"

test_package_tests:
  - file: conanfile.py
    description: "Runs ahoy --version and executes a minimal .ahoy.yml command"
    command: "conan test"
  - file: fixture_hello.sh
    description: "Command payload executed through the packaged ahoy binary"
    command: "ahoy -f .ahoy.yml hello"

assertion_count: 7
