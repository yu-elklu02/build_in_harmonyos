version: "2.5.0"
software: "ahoy"
status: built
build_date: "2026-08-10"
build_system: "go"

source:
  url: "https://codeload.github.com/ahoy-cli/ahoy/tar.gz/refs/tags/v2.5.0"
  sha256: "e57f908df16c29d5e1b5e814496d0f9eb9e11a871ed68e1fd93aa286c557c540"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOFLAGS=-mod=vendor"
    - "go test signed test binaries before go build"
    - "go build -trimpath -ldflags '-s -w -X main.version=2.5.0'"
  dependencies: []
  cc: go
  cxx: ""

patches_applied:
  - type: portability
    file: "v2/ahoy.go"
    description: "Use sh -c instead of hard-coded bash -c on OHOS, where bash is not guaranteed to be installed."

test_results:
  type: upstream-go-unit
  total: 35
  passed: 28
  failed: 0
  skipped: 7
  excluded: 1
  run: "ohos-test-runs/codex-a-2.5.0-ahoy-2.5.0-20260810-r1-conan-20260810-165451-49887"

knowledge_gained:
  - "ahoy 2.5.0 stores its active Go module under the v2/ subdirectory, not the repository root."
  - "The package is pure Go and can build with CGO_ENABLED=0; the release version is injected through main.version."
  - "ahoy command execution used a hard-coded bash -c; OHOS runners provide /bin/sh but not bash, so the recipe applies an OHOS-only sh -c portability replacement."
  - "On OHOS, Go test binaries must be compiled with go test -c, signed, and executed directly instead of relying on go test temporary exec."
  - "TestOverrideExample calls the CLI path through appRun and triggers os.Exit, so it is excluded from direct signed test-binary execution on OHOS."
