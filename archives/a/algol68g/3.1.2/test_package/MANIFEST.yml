# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: algol68g/3.1.2
homepage: "https://algol68genie.nl/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
# algol68g 的 make check 运行 test-set/ 下 24 个 Algol 68 测试程序
upstream_tests:
  - file: "test-set/01-hello.a68"
    source: "algol68g-3.1.2/test-set"
    description: "上游 make check 测试集（24 个测试全部通过）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
# CLI 工具，通过 popen 执行 a68g --execute 验证编译器解释器功能
test_package_tests:
  - file: "test.c"
    description: "执行 a68g --execute 'print((1+1))' 验证输出 +2"
    command: "./test_algol68g"

# 测试断言总数 (近似值)
assertion_count: 1
