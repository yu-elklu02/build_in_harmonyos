# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: apg/2.2.3
homepage: "https://github.com/wilx/apg"

# apg has no upstream test suite (no make check target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective - runs the binary)
test_package_tests:
  - file: conanfile.py
    description: "Runs apg -v (version check) and apg -n 5 -m 8 -x 10 (password generation)"
    command: "conan test"

# Test assertions: version string output + 5 password lines generated
assertion_count: 2
