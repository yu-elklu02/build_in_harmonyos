# 软件级 manifest — aaphoto
# 遵循 ARCHIVE-SPEC v2.0

software: aaphoto
display: "aaphoto (Auto Adjust Photo)"
description: "命令行自动照片色彩校正工具（对比度/伽马/色平衡/饱和度自动调整）"
category: utility
homepage: "http://log69.com/aaphoto_en.html"
license: GPL-3.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "E114: configure 中 config.status 临时目录需移除 umask 077（HMDFS setgid 目录不可写）"
    - "Makefile.am 硬编码 GCC 专用 -lgomp，OHOS clang 需移除（-fopenmp 自动链 SDK libomp）"
    - "共享依赖（libpng16.so）需在 build 环境设置 LD_LIBRARY_PATH 供 configure conftest 运行"
    - "单二进制 CLI 工具（aaphoto.c 内联 aaio/aargb/aaresize），package_type=application"
  common_dependencies:
    - libjpeg
    - libpng

versions:
  "0.45":
    status: built
    build_date: 2026-08-05
    notes: "conan-verify G0-G4 全通过；3 个补丁（Makefile.am/Makefile.in -lgomp、configure umask 077）"
