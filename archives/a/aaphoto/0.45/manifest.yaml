# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源: GitHub log69/aaphoto master (== v0.45, 无 0.45 tag, 2016-07-09 发布)
  url: "https://github.com/log69/aaphoto/archive/refs/heads/master.tar.gz"
  sha256: "308baa8c926529dcac84d533f613050af7bf9afb6ef6cae999da9d1a80f7f1c5"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--prefix=/"            # AutotoolsToolchain 默认, 安装到 package_folder/bin
  # 编译依赖列表（format: name/version; zlib/1.3.1.1 经 libpng 传递引入）
  dependencies:
    - libjpeg/10
    - libpng/1.6.58
  # OpenMP: Makefile 硬编码 GCC 的 -lgomp, 已用补丁移除;
  # clang 的 -fopenmp 自动链接 OHOS SDK 自带 libomp
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-Makefile.in.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "E114: HMDFS 强制目录 setgid; `umask 077 && mktemp -d` 产生的 drwx--S--- 目录即使属主也不可写, 需从 configure 中移除 umask 077"
  - "aaphoto 是单二进制 CLI 工具 (aaphoto.c 内联 #include aaio.c/aargb.c/aaresize.c), 非库; package_type=application, package_info 用 bindirs"
  - "Makefile.am 硬编码 -lgomp (GCC OpenMP); OHOS clang 的 -fopenmp 自动链接 SDK libomp.so, 需移除 -lgomp"
  - "本软件不需要 fftw (0.45 无 FFT 代码); 依赖仅 libjpeg + libpng (+zlib 传递)"

