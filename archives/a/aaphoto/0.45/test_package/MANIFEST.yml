# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aaphoto/0.45
homepage: "http://log69.com/aaphoto_en.html"

# 上游测试命令 — aaphoto 没有官方自动化测试套件
# (Autotools 项目, Makefile.am 只有 bin_PROGRAMS, 无 TESTS/check 目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (aaphoto 无上游测试程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "端到端功能测试: --version 输出 + 对 2x2 BMP 执行自动色彩校正并断言输出 PNG 生成"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
