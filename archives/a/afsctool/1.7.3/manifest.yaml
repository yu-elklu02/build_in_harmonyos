# afsctool 1.7.3 适配清单
# HFS+/APFS/ZFS 压缩文件操作工具（C + C++），CMake 构建，产物 afsctool/zfsctool 两个可执行。
# 依赖 zlib/sparsehash/musl-fts 均已发布制品仓；lzfse 仅 Apple 启用可绕过；
# libbsd 未发布，补丁移除 <bsd/stdlib.h> include 与 -lbsd 链接（musl 自带 strlcpy）。

version: "1.7.3"
status: built

source:
  url: "https://codeload.github.com/RJVB/afsctool/tar.gz/refs/tags/v1.7.3"
  sha256: "5776ff5aaf05c513bead107536d9e98e6037019a0de8a1435cc9da89ea8d49b8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: []
  cc: clang
  cxx: clang++
  notes: "非 Apple 分支链接 -lrt -ldl -pthread（移除 -lbsd）；sparsehash find_path 兜底（包无 .pc）；musl-fts 提供 fts.h/libfts.a；lzfse 子模块仅 Apple 启用，OHOS 跳过"

dependencies:
  - zlib/1.3.1
  - sparsehash/2.0.4
  - musl-fts/1.2.7

patches_applied:
  - "0001-findsparsehash-find-path.patch"
  - "0002-cmake-remove-lbsd-add-fts.patch"
  - "0003-remove-bsd-stdlib-include.patch"

test:
  upstream_cases: 0
  upstream_suite: "上游无测试目录（Homebrew test 为 macOS 特有 HFS+ 压缩验证，OHOS 不可运行）"
  runnable: 0
  runnable_note: "上游无独立测试套件"
  pass_rate: "0/0 = N/A（上游无测试套件）"
  consumer_test: "test_package 运行 afsctool 打印 usage（R34 反空壳：真实执行二进制）"

knowledge_gained:
  - "afsctool 非 Apple 分支无条件 include <bsd/stdlib.h> 并链接 -lbsd；libbsd 未发布制品仓，musl string.h 自带 strlcpy，补丁移除 include 与链接即可"
  - "FindSPARSEHASH.cmake 用 pkg_check_modules libsparsehash REQUIRED，但 sparsehash 为 header-only 且制品仓包无 .pc，需改 find_path 兜底"
  - "musl 无 fts.h，afsctool.h 无条件 include <fts.h>；musl-fts/1.2.7 已发布（libfts.a + fts.h），CMakeLists 需 find_library 链接"
  - "lzfse 子模块仅 if(APPLE) 启用，OHOS 构建完全跳过，无需处理"
  - "上游 CMakeLists 仅 Apple 分支 install(TARGETS)，非 Apple 需 package() 手动拷贝 afsctool/zfsctool 到 bin/"

local_verification:
  - date: "2026-08-12"
    note: "CI worker 环境缺陷（非代码问题）：OHOS SDK lld 加载 libxml2.so.16 失败（xmlFreeDoc symbol not found）+ worker 无 curl，导致 CMake 编译器检测失败（CI #22105 同根因）。本地 ohos-aarch64 同构 conan create 已验证通过（afsctool/zfsctool 冒烟测试 OK），实改本记录触发 CI 换 worker 重跑。"
    result: "pass"
