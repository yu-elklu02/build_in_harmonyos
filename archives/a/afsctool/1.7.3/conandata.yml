# conandata.yml — afsctool 1.7.3
# HFS+/APFS/ZFS 压缩文件操作工具（C + C++，CMake 构建）。
# 依赖：zlib（pkg-config 或 FindZLIB 兜底）、Google sparsehash（header-only）、fts（musl 无 fts.h，
# 用 musl-fts）。lzfse 子模块仅 Apple 启用，OHOS 不需要。libbsd 未发布制品仓，
# 补丁移除 <bsd/stdlib.h> include 与 -lbsd 链接（musl string.h 自带 strlcpy）。

sources:
  url: "https://codeload.github.com/RJVB/afsctool/tar.gz/refs/tags/v1.7.3"
  sha256: "5776ff5aaf05c513bead107536d9e98e6037019a0de8a1435cc9da89ea8d49b8"

patches:
  - patch_file: "patches/0001-findsparsehash-find-path.patch"
    patch_description: "FindSPARSEHASH.cmake 用 find_path 兜底：sparsehash 包为 header-only 且无 .pc，pkg-config REQUIRED 会失败"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-remove-lbsd-add-fts.patch"
    patch_description: "CMakeLists 移除 -lbsd（libbsd 未发布，musl 自带 strlcpy），并查找/链接 musl-fts（musl 无 fts.h）"
    patch_type: "portability"
  - patch_file: "patches/0003-remove-bsd-stdlib-include.patch"
    patch_description: "移除 afsctool.c/zfsctool.cpp 的 <bsd/stdlib.h> include（musl 无 libbsd 头文件）"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-pthread-cancel.patch"
    patch_description: "musl 无 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype：CMake check_function_exists 检测生成 HAVE_PTHREAD_CANCEL，源码 #ifdef 保护；无 pthread_cancel 时 TerminateThread 用 pthread_kill(SIGTERM) 直杀线程（R8 合规，无 __OHOS__ 条件宏）"
    patch_type: "portability"
  - patch_file: "patches/0005-musl-compat-reallocf-blksize.patch"
    patch_description: "musl 兼容：defined(linux) 改 defined(__linux__)（C++17 严格模式 linux 宏未定义）、补 BSD reallocf/S_BLKSIZE"
    patch_type: "portability"
