# afsctool/1.7.3 test_package
# Verifies afsctool binary is installed and executable

package: afsctool/1.7.3
homepage: "https://github.com/RJVB/afsctool"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_afsctool.c
    description: "验证 afsctool 二进制存在且可执行（无参数打印 usage），R34 反空壳：test() 用 self.run() 真实执行被测包二进制（exit EINVAL=22 属预期）"
    command: "<afsctool_bin>  # test_package/conanfile.py test() 定位 bin/afsctool 并执行，LD_LIBRARY_PATH 注入 musl-fts lib"

assertion_count: 1
