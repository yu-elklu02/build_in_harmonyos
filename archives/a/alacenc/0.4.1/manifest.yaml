knowledge_gained:
  - "The upstream v0.4.1 tarball vendors ALAC and docopt.cpp, so no external Conan dependencies are needed"
  - "The upstream CMakeLists.txt still declares project VERSION 0.4.0; patching keeps alacenc --version aligned with the package tag"
  - "Bundled docopt.cpp uses cmake_minimum_required(VERSION 3.1); modern CMake requires CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "OHOS does not define BYTE_ORDER/LITTLE_ENDIAN/BIG_ENDIAN for this source; use the existing TARGET_RT_LITTLE_ENDIAN CMake definition"
  - "On the new-port runner, test_package commands should execute directly through Conan runenv; /data/service/hnp/bin/bash is not available"
  - "The alacenc project has no first-party test target; validation uses an executable smoke test that encodes a generated WAV file"

