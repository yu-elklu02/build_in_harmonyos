package: alacenc/0.4.1
homepage: "https://github.com/flacon/alacenc"

upstream_check_command: "cmake --build"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Runs alacenc --version, alacenc --help, and encodes a generated PCM WAV file"
    command: "conan test"
  - file: test_alacenc.py
    description: "Generates the PCM WAV fixture and verifies the encoded M4A header"
    command: "used by conanfile.py"

assertion_count: 4
