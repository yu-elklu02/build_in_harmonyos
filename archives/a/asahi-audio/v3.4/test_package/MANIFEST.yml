# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: asahi-audio/v3.4
homepage: "https://github.com/AsahiLinux/asahi-audio"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# asahi-audio 是纯数据包，上游无 make check 目标
upstream_check_command: "make check"
upstream_check_status: "no_check_target"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# asahi-audio 无测试程序（纯数据包，无C/C++代码）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 验证安装的DSP配置文件存在且数量正确
test_package_tests:
  - file: test.sh
    description: "Verify asahi-audio DSP configuration data files are installed correctly"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 6 assertions: data dir exists, file count >= 60, WirePlumber config, PipeWire config, Lua script, alias JSON count >= 5
assertion_count: 6
