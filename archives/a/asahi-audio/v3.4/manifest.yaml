software: asahi-audio
# 版本级 manifest 模板
# 文件位置: archives/a/asahi-audio/v3.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "v3.4"

# 构建系统类型
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/AsahiLinux/asahi-audio/archive/refs/tags/v3.4.tar.gz"

  # 源码校验和
  sha256: "b8417e214dfabaf1cadd0e162961e0341b0f1b864d2f865f2b101d7dce0c9eb1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: makefile
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "DESTDIR=$TEST_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（纯数据包，无C/C++编译）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "asahi-audio 是纯数据包，仅安装DSP配置文件到share/asahi-audio/"
  - "make all 生成 aliases JSON文件（sed处理graph.json/mic.json）"
  - "无configure步骤，直接make && make install DESTDIR=$TEST_PREFIX PREFIX=$DEFAULT_PREFIX"
  - "无make check目标，跳过测试"
  - "安装79个文件到DESTDIR：wav/json/lua/conf文件"