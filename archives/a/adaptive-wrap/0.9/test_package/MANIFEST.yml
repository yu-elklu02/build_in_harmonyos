# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adaptive-wrap/0.9
homepage: "https://elpa.gnu.org/packages/adaptive-wrap.html"

# 上游为纯 Emacs Lisp 包（GNU ELPA），无官方测试套件（仅 news 变更记录），
# 无 make check / 测试命令，L1 验证由 test_package 承担（补全消费者测试）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游源码文件清单（作为产物完整性参照）
upstream_tests:
  - file: adaptive-wrap.el
    source: adaptive-wrap-0.9/adaptive-wrap.el
    description: "核心 Lisp 模块（自适应换行 minor mode）"
    command: ""

# 补全测试说明：上游无测试用例，适配后新增 test_package 消费者测试
supplementary_tests:
  - file: test_package/conanfile.py
    count: 3
    description: >-
      打包产物完整性断言：adaptive-wrap.el 存在且非空（≥1000 字节）、
      adaptive-wrap-pkg.el 包描述文件存在、核心符号
      （adaptive-wrap-prefix-mode / adaptive-wrap-extra-indent）已声明。
      均不依赖 Emacs 运行时，可在 OHOS 受限环境运行。
