software: aircrack-ng
# 版本级 manifest
# 文件位置: archives/a/aircrack-ng/1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.aircrack-ng.org/aircrack-ng-1.7.tar.gz"

  # 源码校验和
  sha256: "05a704e3c8f7792a17315080a21214a4448fd2452c1b0dd5226a3a55f90b58c3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-libnl=no"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.5.6"
    - "zlib/1.3.1"

  # 构建工具依赖
  build_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-osdep-linux.c.patch"
  - "0002-lib-osdep-linux_tap.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autoreconf -fiv generates configure from configure.ac using autoconf 2.72"
  - "conanfile.py patches generated configure to use ${TMPDIR:-/tmp}/confXXXXXX and removes umask 077 for HMDFS compatibility"
  - "tool_requires for automake/1.18 and libtool/2.5.4 provides autotools without hardcoded paths"
  - "pkg.m4 dynamically located via shutil.which('pkg-config') for ACLOCAL_PATH"
  - "sockaddr_storage redefinition fixed via _UAPI_LINUX_SOCKET_H guard (POSIX-compatible)"
  - "OpenSSL 3.5.6 works with -Wno-deprecated-declarations flag"
  - "version.h generated from version.h.in by configure with version macros"

# ============================================================
# 编译结果
# ============================================================

