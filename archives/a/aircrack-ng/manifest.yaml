software: aircrack-ng
display: "aircrack-ng"
description: "WiFi security auditing tools suite"
category: security
homepage: "https://aircrack-ng.org"
license:
  - GPL-2.0
build_system: autotools
ohos_adaptation:
  key_points:
    - "Source tarball lacks configure script; autoreconf required"
    - "ACLOCAL_FLAGS must include pkg-config m4 dir"
    - "HarmonyOS HMDFS: umask 077 prevents temp file creation"
    - "sockaddr_storage redefinition: linux/socket.h vs sys/socket.h"
  common_dependencies:
    - "openssl"
    - "zlib"
versions:
  "1.7":
    status: built
    build_date: "2026-08-09"
    conan_ref: "aircrack-ng/1.7"
