software: acorn-fdisk
display: "acorn-fdisk"
description: "Partition editor for Acorn/RISC OS machines"
category: system
homepage: "https://www.arm.linux.org.uk/machines/riscpc/stage-2/"
license: GPL-1.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游为纯 Makefile 项目（无 configure），顶层 Makefile 默认 STRIP=strip、LDFLAGS=-N 在 OHOS 上不适用，构建时显式覆盖为 STRIP=: LDFLAGS=''"
    - "编译器通过 Conan tools.build:compiler_executables 传入（clang），不依赖 shell 环境变量"
    - "上游 tarball 不含 COPYING 文件，许可证按 Debian packaging copyright 元数据声明 GPL-1+"
    - "二进制以 Debian 惯例安装为 bin/acorn-fdisk（上游产物名为 fdisk），避免与系统 fdisk 混淆"
    - "上游无测试套件（Makefile 仅 all/clean/tar 目标），消费者测试用真实 test_package 覆盖 --version/--help/坏设备路径"
  common_dependencies: []

versions:
  "3.0.6":
    status: built
    build_date: "2026-08-09"
    conan_ref: "acorn-fdisk/3.0.6"
