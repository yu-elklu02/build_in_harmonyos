package: alsa-lib/1.2.16.1
homepage: "https://www.alsa-project.org/"

upstream_check_command: >-
  make -j1 check LOG_COMPILER=/system/bin/timeout AM_LOG_FLAGS=180
upstream_test_in_build: true
upstream_test_command: >-
  make -j1 check LOG_COMPILER=/system/bin/timeout AM_LOG_FLAGS=180

upstream_tests:
  - name: lsb-config
    file: test/lsb/config.c
    command: "make -C test/lsb check TESTS=config"
    count: 1
    description: >-
      One registered Automake entry covering the upstream configuration API
      contract. Its 30 internal routines are not separate test cases.
  - name: lsb-midi-event
    file: test/lsb/midi_event.c
    command: "make -C test/lsb check TESTS=midi_event"
    count: 1
    description: >-
      One registered Automake entry covering MIDI event encode/decode behavior.
      Its six internal routines are not separate test cases.

test_package_tests:
  - file: format_roundtrip.c
    count: 1
    description: "PCM format name/value and logical/physical width contract."
  - file: areas_silence.c
    count: 1
    description: "Bounded interleaved silence with untouched sentinels."
  - file: areas_copy.c
    count: 1
    description: "Offset interleaved copy with untouched sentinels."
  - file: null_playback.c
    count: 1
    description: "Null playback configure/start/write/drain/close lifecycle."
  - file: null_capture.c
    count: 1
    description: "Null capture read/drop/close and no-data-write contract."
  - file: topology_roundtrip.c
    count: 1
    description: "In-memory topology manifest build/decode/save round-trip."
  - file: component_asound.c
    count: 1
    description: "ALSA::asound exact version and package-tree runtime load."
  - file: component_atopology.c
    count: 1
    description: "ALSA::atopology lifecycle, version, and dependency closure."
  - file: conanfile.py
    count: 1
    description: >-
      Relocated pkg-config metadata plus two helper runtime loads; the helpers
      are internal checks of one relocation workflow.
  - file: conanfile.py
    count: 1
    description: >-
      One artifact workflow checks unversioned OHOS shared objects,
      SONAME/NEEDED, static archives, the static fPIC whole-archive shared-link
      regression, headers, configuration files, CMakeDeps/PkgConfigDeps
      metadata, the exact signed-ELF manifest, and license as one failure unit.
  - file: feature_contract.c
    count: 1
    description: >-
      Generated component/plugin/path metadata and its activated runtime
      environment are checked as one package feature workflow.

build_only_evidence:
  - file: api_probe.c
    count: 60
    counted_as_tests: false
    description: >-
      Sixty unique public symbols are compiled and linked with their declared
      header and type. The probes only take function addresses, so they are ABI
      build evidence and are never executed or counted as test entries.

target_build_evidence:
  toolchain: "OpenHarmony PC native clang, aarch64-linux-ohos"
  modes_linked:
    - shared
    - static
  registered_upstream_entries_linked: 2
  consumer_helper_elfs_linked: 11
  public_abi_link_probes_linked: 60
  upstream_build_only_programs_linked_shared: 19
  upstream_build_only_programs_linked_static: 18
  static_shared_only_exclusion: "oldapi"
  static_pic_whole_archive_shared_links: 1
  all_verified_aarch64_elf: true
  static_outputs_with_shared_alsa_needed: 0
  report: "reports/test-report.md"

target_runtime_evidence:
  environment: "fresh OpenHarmony PC target W3 r35"
  registered_upstream_entries: 2
  consumer_entries: 11
  logical_entries: 13
  executed: 13
  passed: 13
  failed: 0
  timeout: 0
  unexecuted: 0
  unknown_terminal: 0
  pass_rate: "100%"
  shared_exit: 0
  static_exit: 0
  evidence_bundle_sha256: "cfe65995eec2d3912c967cbf0036976f44bd8b4ddecca26d8481870c788e2e75"

verified_target_guards:
  upstream_timeout_seconds: 180
  consumer_timeout_seconds: 180
  configure_compile_sign_tsv_pair: true
  upstream_trs_exact_pass_count: 2
  package_signing_manifest: "share/alsa/conan-elf-signatures.json"
  consumer_sign_once_rows: 11
  static_pic_whole_archive_shared_link: true

test_case_count: 13
# One terminal oracle per consumer entry; internal checks are not split.
assertion_count: 11
