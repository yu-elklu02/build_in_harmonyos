package: argtable3/3.3.1
homepage: "https://github.com/argtable/argtable3"

upstream_check_command: "ctest --test-dir <build-folder> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-folder> --output-on-failure"
upstream_tests:
  - file: "tests/test_static"
    source: "argtable-v3.3.1.tar.gz/tests"
    description: "Run the 170-case CuTest suite against the packaged static target"
    command: "ctest -R test_static"
  - file: "tests/test_src"
    source: "argtable-v3.3.1.tar.gz/tests"
    description: "Run the 170-case CuTest suite against the individual source files"
    command: "ctest -R test_src"
  - file: "tests/test_amalgamation"
    source: "argtable-v3.3.1.tar.gz/tests"
    description: "Run the 170-case CuTest suite against the generated amalgamation"
    command: "ctest -R test_amalgamation"

test_package_tests:
  - file: "test_argtable3.c"
    description: "Parse valid and invalid command lines through the public argtable3 API"
    command: "test_argtable3"

assertion_count: 516
