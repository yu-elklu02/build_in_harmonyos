# 版本级 manifest — acf-lvm2 0.7.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.0"

# 软件名
software: "acf-lvm2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-12"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://distfiles.alpinelinux.org/distfiles/v3.24/acf-lvm2-v0.7.0.tar.gz"

  # 源码校验和
  sha256: "fc56f19eeaf92a464b02a94402ecba6203bc66e107b07f3453bd573cf40b17a9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
  - acf-core/0.24.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "gitlab.alpinelinux.org 在构建网络返回 HTTP 418，ACF 系列模块需用 distfiles.alpinelinux.org 分发镜像"
- "ACF 纯 Lua 模块包 (acf-*) 为 makefile 安装型：make all 空目标 + make install DESTDIR 复制到 /usr/share/acf/app/{name}"
- "ACF 模块运行时依赖 acf-core (mvc.lua / acf.fs / acf.format)，package_info 用 cpp_info.resdirs 暴露布局"

patch_generation:
  method: per-file-difflib
  patches_count: 0
