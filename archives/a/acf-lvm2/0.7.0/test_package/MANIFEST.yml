# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: acf-lvm2/0.7.0
homepage: "https://gitlab.alpinelinux.org/acf/acf-lvm2"

# 上游测试命令 (Makefile 无 check/test 目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# acf-lvm2 0.7.0 上游无测试套件（纯 Lua 脚本 + HTML 模板分发模块）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_acf_lvm2.sh
    description: "消费者测试: 验证包布局 (usr/share/acf/app/lvm2/) 及控制器/模型/菜单/角色/视图模板文件存在"
    command: "./test_acf_lvm2.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
