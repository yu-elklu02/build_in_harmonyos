software: argc
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.24.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.24.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-11"

# 构建系统类型 (顶层字段)
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sigoden/argc/archive/refs/tags/v1.24.0.tar.gz"

  # 源码校验和
  sha256: "3c0756bf455759617f2ea0405697d655af15071c89b35a58311e4be53dced1fa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Rust crate 依赖由 Cargo.lock 管理，无 C/C++ 库依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust Cargo 项目：cargo build --release 直接编译，无 configure 步骤"
  - "argc 是命令行工具（bash CLI 框架），package_type=application，产物为 bin/argc"
  - "Rust 工具链在 OHOS 真机预检沙盒中可能不在 PATH，先探测已知位置（HNP/harmonybrew/rustup）；无则用 urllib 下载 Harmonybrew OHOS rust bottle 引导（martin/1.13.0 先例，设备 curl 无 CA bundle 不能用 curl/zsh 安装）"
  - "Rust 二进制默认静态链接，无需 RPATH 设置"
  - "上游测试：cargo test --release 在 test_package 阶段执行（hmbs 预检只从 test_package 阶段 stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例；build() 阶段 self.output.info() 输出不被采纳，且包缓存命中时 build() 会被跳过）"
