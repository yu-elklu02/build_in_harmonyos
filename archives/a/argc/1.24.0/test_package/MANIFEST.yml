# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: argc/1.24.0
homepage: "https://github.com/sigoden/argc"

# 上游测试命令 (cargo test for Rust projects)
upstream_check_command: "cargo test --release --tests"

# 上游测试在 test_package 阶段执行（hmbs 预检只从 test_package 阶段
# stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例）
upstream_test_in_build: false
upstream_test_command: "cargo test --release --tests"

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 argc 1.24.0 存在完整测试套件，已接入并在真机完整执行。
  1. src/ 内 13 个 #[test] 单元测试（src/*.rs，纯逻辑测试，无网络依赖）
  2. tests/ 集成测试套件：tests/tests.rs 聚合 16 个模块（bind_env/cli/compgen/
     env/fail/hook_fn/main_fn/meta/misc/multiline/param_fn/spec/validate 等），
     共 183 个 #[test] + 25 个 #[rstest] 参数化用例，含 175 个 insta 快照
     （tests/snapshots/），运行方式为 cargo test，实际执行 built argc 二进制
  3. 无在线数据集/外部服务依赖，全部用例可在 HarmonyOS aarch64 真机离线执行
  doc-tests 说明：cargo test 默认的 doc-tests 阶段因 OHOS rust 工具链
  （Harmonybrew bottle）无可用 rustdoc 无法执行——cargo 连 spawn rustdoc 都
  失败（ENOENT，真机日志 "could not execute process rustdoc ... No such file
  or directory"），与同仓库已合入的 martin/1.13.0（同样报 No such file or
  directory）及 stylua/usage/gifski 先例一致，判定为平台限制而非用例失败。
  argc 源码无 doctest 用例（src/ 无代码块），故以 cargo test --release --tests
  排除该空阶段，不影响任何真实用例。
  计数方式：以真机 cargo test --release --tests 的 "test result:" 框架输出行
  为准（discovered/executed/passed/failed/skipped 全部取自框架输出，非静态
  统计）。

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tests.rs
    source: argc-1.24.0/tests/tests.rs
    description: "argc 集成测试套件入口（16 模块，183 #[test] + 25 #[rstest]）"
    command: "cargo test --release --tests"
  - file: src/lib.rs
    source: argc-1.24.0/src/lib.rs
    description: "argc 库单元测试（13 个 #[test]）"
    command: "cargo test --release --tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — argc --argc-version / --argc-help / argc 注解脚本选项解析（--argc-eval）"
    command: "/bin/sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
