# 软件级 manifest — argc
# 遵循 ARCHIVE-SPEC v2.0

software: argc
display: "argc"
description: "bash CLI 框架与命令运行器 — 通过脚本注释声明参数解析，自动生成 help/补全"
category: build-tool
homepage: "https://github.com/sigoden/argc"
license: MIT OR Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Rust Cargo 项目，cargo build --release 直接编译，无 configure 步骤"
    - "OHOS 预检沙盒 cargo/rustc 可能不在 PATH，经 Harmonybrew 安装 Rust 工具链（dua-cli 先例）"
    - "设置 CC/CXX=clang 与 RUSTFLAGS='-C linker=clang'，OHOS 无 cc 符号链接"
    - "Rust 二进制默认静态链接，无需 RPATH；产物 bin/argc 需 ELF 签名（真机工具链处理）"
    - "OHOS /tmp 只读，构建与测试需用可写 TMPDIR"
    - "上游测试用 cargo test --release：13 个 src 单元测试 + 183 #[test] + 25 #[rstest] 集成测试（含 175 个 insta 快照），全离线可执行"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.24.0":
    status: built
    build_date: "2026-08-11"
    published_as: argc/1.24.0
