# 软件级 manifest — aliyunpan
# 遵循 ARCHIVE-SPEC v2.0

software: aliyunpan

display: "aliyunpan"

description: "阿里云盘命令行客户端，支持 JavaScript 插件与同步备份功能"

# 分类标签
category: application

# 官网 URL
homepage: "https://github.com/tickstep/aliyunpan"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# 常用构建系统
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Go CLI 工具：CGO_ENABLED=0 纯静态构建，产物与 Go SDK ELF 需 binary-sign-tool 签名"
    - "Go linker 链接输出必须放在非 hmdfs 工作区（/data/storage/el2/...）"
    - "版本号通过 ldflags -X main.Version=v<版本> 注入"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  0.4.0:
    status: built
    build_date: 2026-08-11
