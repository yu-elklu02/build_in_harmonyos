# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go CLI 工具在 OHOS 上构建：Go 工具链 ELF 无 .codesign 段被 Seccomp 拦截，需 binary-sign-tool 签名后再执行；已签名 ELF 再 chmod 被 HMDFS/SELinux 拒绝时，若所需访问位已具备则视为平台限制继续 (ref: E077)"
  - "Go linker 在 hmdfs 上 mmap 输出失败（E051），链接输出目录、GOCACHE/GOMODCACHE/TMPDIR 必须放到非 hmdfs 工作区（如 /data/storage/el2/...） (ref: E011)"
