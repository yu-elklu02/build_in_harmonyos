# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aliyunpan/0.4.0
homepage: "https://github.com/tickstep/aliyunpan"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test -count=1 -skip '^TestBoltUltraFiles$|^TestGetQRCodeLoginResult$|^TestLocalSyncDb$|^TestLocalGet$' ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -count=1 -skip '^TestBoltUltraFiles$|^TestGetQRCodeLoginResult$|^TestLocalSyncDb$|^TestLocalGet$' ./... (executed by recipe build() before go build)"

# 上游实际运行的测试 (Go 单元测试)
upstream_tests:
  - "go test ./... (61 func Test... cases across 19 *_test.go files)"
  - "57 runnable cases pass on the OHOS worker (signed test binaries via -exec wrapper)."
  - "4 cases are unrunnable everywhere except the author's machine and are excluded with go test -skip (reported as errors, not passes): TestBoltUltraFiles and TestLocalGet hardcode macOS /Volumes paths, TestLocalSyncDb hardcodes a Windows D:\\ path walk, TestGetQRCodeLoginResult polls http://localhost:8977 with no server. Each panics with a nil dereference on any standard machine."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_aliyunpan.sh
    description: "冒烟测试: aliyunpan --version 断言 v0.4.0 + help 帮助输出"
    command: "bash test_aliyunpan.sh <bin/aliyunpan>"

# 测试断言总数 (近似值, 用于质量评估; 不与 test case 数混写)
test_package_assertion_count: 3
