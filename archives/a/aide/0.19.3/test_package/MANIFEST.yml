# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aide/0.19.3
homepage: "https://aide.github.io"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (check_aide, 基于 libcheck 框架, 166 个断言)
upstream_tests:
  - file: tests/check_aide.c
    source: aide-0.19.3/tests/check_aide.c
    description: "单元测试套件: attributes/base64/hashsum/seltree/progress 等模块"
    command: "./check_aide"

# test_package 中自带的测试 (消费者视角验证, 执行 aide 二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 执行 aide --version 断言 0.19.3，并验证 --config-check"
    command: "sh test.sh"

# 测试断言总数 (make check 实测 166 个 Checks, 0 失败)
assertion_count: 166
