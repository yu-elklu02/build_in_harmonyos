version: "1.4.1"
software: aggdraw
status: passed
build_date: "2026-08-10"
build_system: setuptools
homepage: "https://github.com/pytroll/aggdraw"
license: "Python (MIT style)"

source:
  url: "https://files.pythonhosted.org/packages/05/bf/4876fb82a906e9303392235e9fe382130b649c0ee4faa7fdb25596c26dff/aggdraw-1.4.1.tar.gz"
  sha256: "e21d6b77afeeffa259b898d652295757fd35f15a9e11a24823c0d7ca63385c83"
  tar_format: tar.gz

build:
  system: setuptools
  command: 'env CXX=clang++ LDSHARED="clang++ -shared -fuse-ld=/data/service/hnp/bin/ld -L<py_lib> -lpython3.12" LDFLAGS="-fuse-ld=/data/service/hnp/bin/ld -L<py_lib> -lpython3.12" python3 -m pip install . --target <staging> --no-build-isolation --no-deps'
  dependencies: []

ci_linker_workaround: "Use /data/service/hnp/bin/ld because the CI SDK lld loads an incompatible libxml2.so.16."

hongmeng_patches:
  - "build() inline env CXX=clang++ overrides sysconfig hardcoded CXX='c++' (HarmonyOS device ships clang/clang++ only, no 'c++' symlink)"
  - "build() inline env LDSHARED+LDFLAGS append -L<python_lib_dir> -lpython3.12 so aggdraw.cpython-312.so links against the shipped libpython3.12.so (HarmonyOS python3.12 statically links libpython into the main binary and does NOT export PyModule_Create2 / Python C-API symbols to extensions at runtime → 'import aggdraw' died 'PyModule_Create2: symbol not found')"
  - "build() resolve libpython3.12.so directory dynamically from sys.prefix/lib (NOT hardcoded /data/service/hnp/lib nor sys.executable/../lib); sysconfig.get_config_var('LIBDIR') is wrong here (returns '/python3/lib', a relic of python.org build DESTDIR staging), so derive from sys.prefix instead. Tracks whichever Python Conan invokes — device or CI — without a hardcoded absolute."
  - "package() ELF re-sign aggdraw.cpython-312.so in place: llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 + os.replace + chmod 0o755 (HarmonyOS MAC hmmac=use_task rejects exec of unsigned ELF from conan cache p/ → 'import aggdraw' died 'Error loading shared library aggdraw.cpython-312.so: Permission denied'; same pattern as daemon/ent/zig/ispell recipes)"
  - "package() glob-match aggdraw*.so (NOT fixed aggdraw.cpython-312.so) — wheel build tags the .so with platform ABI (aggdraw.cpython-312-aarch64-linux-ohos.so on CI, aggdraw.cpython-312.so on device); a fixed-name lookup silently skips the signature on CI → MAC rejects exec. glob hits whichever file the build actually produced."
  - "commands.json added at recipe root with type:tool field (CI L0 warning when missing); aggdraw/1.4.1 commands.json now declares name/description/homepage/type/versions."
  - "test_package test() inline env PYTHONPATH=<package_folder> via `env` command prefix (conan self.run `env` arg only accepts predefined scope names, not a ['PYTHONPATH=...'] list)"
  - "aggdraw setup.py freetype probing is non-fatal ('=== freetype not available' is a warning, the extension still builds without font support); no freetype dep declared"

verification:
  conan_create: "PASS — exit 0, aggdraw.cpython-312.so built, test_package 'aggdraw native Path/Pen/Brush API: PASSED'"
  test_package:
    path_moveto_lineto_close_coords: "PASS — Path().moveto/lineto/close/coords returns ≥6 coords"
    pen_brush: "PASS — aggdraw.Pen('red', 2.0) + aggdraw.Brush((0,128,255), 200) construct"
    version: "PASS — aggdraw.__version__ == '1.4.1'"
  final_so_linkage: "aggdraw.cpython-312.so NEEDED includes libpython3.12.so (symbol PyModule_Create2 resolved at import)"
  platform: "HarmonyOS HongMeng Kernel 1.12.0 aarch64, clang 15.0.4, python 3.12"

tests:
  upstream:
    command: "No upstream automated tests are included in the aggdraw 1.4.1 sdist"
    cases: 0
    passed: 0
  adapted:
    command: "test_package/test_aggdraw.py"
    cases: 4
    passed: 4
    pass_rate: "4/4 (100%)"
