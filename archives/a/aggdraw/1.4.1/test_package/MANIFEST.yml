package: aggdraw/1.4.1
homepage: "https://github.com/pytroll/aggdraw"
upstream_check_command: "No upstream automated tests are included in the aggdraw 1.4.1 sdist"
upstream_test_in_build: false
upstream_test_command: "N/A"
upstream_tests: []
test_package_tests:
  - file: "test_aggdraw.py"
    description: "Imports the packaged native extension and exercises Path, Pen, and Brush APIs."
    command: "env PYTHONPATH=<package_folder> python3 test_aggdraw.py"
assertion_count: 4

hongmeng_validation:
  platform: "HarmonyOS HongMeng Kernel 1.12.0 aarch64, clang 15.0.4, python 3.12"
  conan_create: "PASS — exit 0, aggdraw.cpython-312.so built, 'aggdraw native Path/Pen/Brush API: PASSED'"
  path_moveto_lineto_close_coords: "PASS — Path().moveto(1,2)/lineto(11,2)/lineto(11,12)/close()/coords() returns ≥6 coords"
  pen: "PASS — aggdraw.Pen('red', 2.0) constructs"
  brush: "PASS — aggdraw.Brush((0,128,255), 200) constructs"
  version: "PASS — aggdraw.__version__ == '1.4.1'"
  final_so_linkage: "aggdraw.cpython-312.so links libpython3.12.so (PyModule_Create2 resolved at import; without this link 'import aggdraw' dies 'PyModule_Create2: symbol not found' because HarmonyOS python3.12 statically links libpython and does NOT export Python C-API symbols to extensions)"
  elf_codesign: "present — package() re-signs aggdraw.cpython-312.so in place (llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1); without it HarmonyOS MAC hmmac=use_task rejects exec from conan cache p/ → 'import aggdraw' dies 'Error loading shared library aggdraw.cpython-312.so: Permission denied'"
  dynamic_libpython_dir: "build() resolves libpython3.12.so dir from sys.prefix/lib (NOT hardcoded /data/service/hnp/lib nor sys.executable/../lib); tracks whichever Python Conan invokes — device or CI — without a hardcoded absolute. sysconfig.get_config_var('LIBDIR') is wrong here (returns '/python3/lib', a python.org build DESTDIR staging relic)."
  notes: "test() prefixes the python call with `env PYTHONPATH=<package_folder>` so aggdraw's native .so inside the conan cache package folder is importable by the target Python. conan self.run's `env` arg only accepts predefined scope names, not a ['PYTHONPATH=...'] list, so inline via the `env` command. The build() method likewise inlines `env CXX=clang++ LDSHARED=... LDFLAGS=...` to override sysconfig's hardcoded CXX='c++' (no 'c++' symlink on device) and to link libpython3.12.so for Python C-API symbols. package() re-signs the .so for HarmonyOS MAC exec permission."
