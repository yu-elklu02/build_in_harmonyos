package: acme-client/0.1.15-portable
homepage: "https://github.com/kristapsdz/acme-client-portable"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_acme_client.sh
    description: "Run 4 checks for the packaged executable, incomplete-invocation failure, usage text, and program name."
    command: "sh test_acme_client.sh <package>/bin/acme-client"
  - file: test_libtls.c
    description: "Compile and run 4 checks for real LibreSSL libtls initialization, configuration allocation, client allocation, and configuration."
    command: "cc test_libtls.c -ltls -lssl -lcrypto && ./test_libtls"

assertion_count: 8
