software: "acme-client"
name: acme-client
version: "0.1.15-portable"
category: network
description: ACME client for Let's Encrypt certificate management
license: ISC
url: https://github.com/kristapsdz/acme-client-portable
status: built
build_system: make
build_date: "2026-07-18"
adaptation_scope: "basic"
review_required: true
limitations:
  - "acme-client-portable upstream uses LibreSSL libtls for the core ACME HTTPS path."
  - "The recipe links the real LibreSSL libtls, libssl, and libcrypto libraries; it does not use a compatibility stub."
  - "The deterministic local test covers libtls initialization and configuration, but does not contact an external ACME service or issue a certificate."
  - "End-to-end certificate issuance still requires the official network and account validation environment."

source:
  url: "https://github.com/kristapsdz/acme-client-portable/archive/ba153daacb62d8a24fef6d6a5a737d2eff607509.tar.gz"
  sha256: "2b346cd308af85ac4ced3bdb8df93963866fdb32304fef7435062b105b0b50cd"
  tar_format: tar.gz

build:
  system: make
  configure_options:
    - "CFLAGS=-fPIC -O2 -DHAVE_CONFIG_H -DMUSL_LIBC"
    - "LDFLAGS=-L$DEFAULT_PREFIX/lib"
  dependencies:
    - libressl/3.9.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "The source archive is pinned to upstream commit ba153daacb62d8a24fef6d6a5a737d2eff607509."
  - "The recipe uses libressl/3.9.1 for the libtls API, crypto headers, and libraries."
  - "The packaged executable links the real libtls, libssl, and libcrypto libraries without a compatibility stub."
  - "acme-client-portable uses GNUmakefile rather than a standard configure script."
  - "The smoke test uses the local usage path and does not contact ACME services or TLS network I/O."
