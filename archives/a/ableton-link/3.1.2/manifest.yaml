version: "3.1.2"
status: built
build_date: "2026-08-11"

source:
  url: "https://github.com/Ableton/link/archive/refs/tags/Link-3.1.2.tar.gz"
  sha256: "2673dfad75b1484e8388deb8393673c3304b3ab5662dd5828e08e029ca8797aa"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DLINK_BUILD_TESTS=ON"
    - "-DLINK_BUILD_EXAMPLES=OFF"
    - "-DLINK_OHOS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-AbletonLinkConfig.cmake.patch"
  - "0003-ConfigureCompileFlags.cmake.patch"

knowledge_gained:
  - "E092: CMake 无 HarmonyOS 平台模块，需设 CMAKE_SYSTEM_NAME=Linux 触发上游 Linux 平台分支"
  - "GitHub source archive 不含 submodule 内容（modules/asio-standalone 为空），需单独拉取 asio-standalone 解压到 modules/asio-standalone/asio/include"
  - "上游 examples 在 Linux 分支链接 PortAudio/asound，OHOS 无此库，需用新增的 LINK_BUILD_EXAMPLES=OFF 禁用"
  - "header-only 库：包内容仅为 include/ 头文件 + 随包 vendored asio 头，consumers 需 LINK_PLATFORM_LINUX 宏"
  - "上游 Clang 分支 -Weverything -Werror 会因 bundled asio/catch 头警告失败，需去除 -Werror"
