# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: ableton-link/3.1.2
homepage: https://github.com/Ableton/link

# 上游测试命令 (Catch2 可执行文件, 由 LINK_BUILD_TESTS=ON 构建)
upstream_check_command: "./LinkCoreTest && ./LinkDiscoveryTest"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cd ${CMAKE_BINARY_DIR}/bin && ./LinkCoreTest && ./LinkDiscoveryTest"

# 上游 Catch2 测试 (25 个 TEST_CASE: LinkCoreTest 16 + LinkDiscoveryTest 9)
upstream_tests:
  - file: src/ableton/tst_Link.cpp
    source: link-Link-3.1.2/src/ableton/tst_Link.cpp
    description: "Link 核心 API (SessionState/Beats/Tempo/Phase)"
    command: "./LinkCoreTest"
  - file: src/ableton/link/tst_Timeline.cpp
    source: link-Link-3.1.2/src/ableton/link/tst_Timeline.cpp
    description: "Timeline beat/time 换算"
    command: "./LinkCoreTest"
  - file: src/ableton/discovery/tst_InterfaceScanner.cpp
    source: link-Link-3.1.2/src/ableton/discovery/tst_InterfaceScanner.cpp
    description: "discovery 网络接口扫描"
    command: "./LinkDiscoveryTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_link.cpp
    description: "Link 实例 enable/tempo/SessionState 往返验证 (6 项检查)"
    command: "ctest --output-on-failure -R test_link"

# 测试断言总数 (test_package 6 项 + 上游 25 个 TEST_CASE)
assertion_count: 31
