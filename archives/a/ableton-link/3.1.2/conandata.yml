sources:
  url: "https://github.com/Ableton/link/archive/refs/tags/Link-3.1.2.tar.gz"
  sha256: "2673dfad75b1484e8388deb8393673c3304b3ab5662dd5828e08e029ca8797aa"

# GitHub source archives omit submodule content; modules/asio-standalone is
# an empty submodule in the Link tarball. Fetch the standalone asio release
# and lay it out where AsioStandaloneConfig.cmake expects it.
asio:
  url: "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-30-2.tar.gz"
  sha256: "755bd7f85a4b269c67ae0ea254907c078d408cce8e1a352ad2ed664d233780e8"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Add LINK_BUILD_EXAMPLES switch so example apps (PortAudio) can be disabled on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-AbletonLinkConfig.cmake.patch"
    patch_description: "Treat OHOS/HarmonyOS as Linux platform and skip atomic/pthread link on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0003-ConfigureCompileFlags.cmake.patch"
    patch_description: "Drop -Werror so warnings in bundled asio/catch headers do not fail the build"
    patch_type: "portability"
