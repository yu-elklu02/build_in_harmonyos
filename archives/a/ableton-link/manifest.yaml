software: ableton-link
display: "Ableton Link"
description: "跨应用/设备同步音乐节拍、速度与相位（beat/tempo/phase）的 C++ 头文件库"
category: library
homepage: "https://github.com/Ableton/link"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 库：无 .so/.a 产物，package 仅含 include/ 头文件 + vendored asio 头"
    - "E092：CMake 无 HarmonyOS 平台模块，generate() 设 CMAKE_SYSTEM_NAME=Linux 触发上游 Linux 平台分支（linux Clock / posix ScanIpIfAddrs）"
    - "GitHub archive 不含 submodule 内容，modules/asio-standalone 为空，需单独拉取 asio 解压到 modules/asio-standalone/asio/include"
    - "上游 examples 在 Linux 分支链接 PortAudio/asound（OHOS 无），补丁新增 LINK_BUILD_EXAMPLES 开关并在配方中置 OFF"
    - "OHOS libc 自带 pthread、aarch64 原生原子，补丁让 OHOS 分支跳过 -latomic/-lpthread 链接"
    - "上游 Clang 分支 -Weverything -Werror 会因 bundled asio/catch 头警告失败，补丁去除 -Werror"
    - "consumers 编译需 LINK_PLATFORM_LINUX 宏（conanfile package_info.defines 注入）"
  common_dependencies: []

versions:
  "3.1.2":
    status: built
    build_date: "2026-08-11"
    source_url: "https://github.com/Ableton/link/archive/refs/tags/Link-3.1.2.tar.gz"
