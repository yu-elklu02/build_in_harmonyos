  evidence: "conan create rc=0; test_package forward 17/17 + reverse 21/21 CHECK assertions PASS"

knowledge_gained:
  - "package_type: header-library — 纯头文件库，无需编译"
  - "CMake INTERFACE 目标: autodiff（上游 NAMESPACE autodiff:: -> autodiff::autodiff）"
  - "OHOS CMake 需要 CMAKE_SYSTEM_NAME=Linux 和 CMAKE_SYSTEM_PROCESSOR=aarch64 映射"
  - "上游 cmake_minimum_required 3.0 太旧，需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "零依赖，零补丁 — 最简迁移场景"
  - "C++17 编译器必需（OHOS Clang 15 支持）"
  - "forward.hpp 和 reverse.hpp 不能在同一编译单元中 include（val() 模板与非模板函数 ADL 冲突）"
  - "API tarball/codeload URL 无 .tar.gz 后缀，Conan get() 误判为 zip — 改用手动 tarfile 解压"
