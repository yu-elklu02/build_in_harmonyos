# test_package/MANIFEST.yml — autodiff/0.4.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: autodiff/0.4.0
homepage: "https://github.com/autodiff/autodiff"

# autodiff is header-only. The upstream test suite uses vendored Catch2.
# The consumer test exercises forward-mode (dual) and reverse-mode (var)
# automatic differentiation APIs plus basic math functions.
# NOTE: forward.hpp and reverse.hpp cannot be included in the same
# translation unit due to val() function conflict (ADL ambiguity).
upstream_check_command: "N/A (vendored Catch2, run tests binary manually)"
upstream_test_in_build: true
upstream_test_command: "./test/tests"

upstream_tests:
  - "autodiff::dual tests (forward.test.cpp)"
  - "autodiff::reverse tests (reverse.test.cpp)"

test_package_tests:
  - file: test_forward.cpp
    description: "Consumer test: forward-mode dual arithmetic/derivatives, math functions"
    command: "./autodiff_forward_test"
  - file: test_reverse.cpp
    description: "Consumer test: reverse-mode var arithmetic/derivatives, math functions"
    command: "./autodiff_reverse_test"

upstream_test_count: 2
test_package_test_count: 2
assertion_count: 38
