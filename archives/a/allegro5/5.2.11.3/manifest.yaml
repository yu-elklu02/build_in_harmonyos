version: "5.2.11.3"
status: built
build_date: '2026-08-11'
source:
  url: "https://github.com/liballeg/allegro5/releases/download/5.2.11.3/allegro-5.2.11.3.tar.gz"
  sha256: "aba4679a5b1f2bf62482eba6e8814a94de7ffc86de5f8587ba199fcc61b4a04f"
  tar_format: tar.gz
build:
  system: cmake
  library_type: static
  configure_options:
    - -DSHARED=OFF
    - -DWANT_X11=OFF
    - -DWANT_OPENGL=OFF
    - -DWANT_AUDIO=OFF
    - -DWANT_NATIVE_DIALOG=OFF
    - -DWANT_VIDEO=OFF
    - -DWANT_PHYSFS=OFF
    - -DWANT_TESTS=OFF
    - -DWANT_EXAMPLES=OFF
    - -DWANT_DEMO=OFF
    - -DWANT_DOCS=OFF
    - -DUNIX=TRUE
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - 0001-cmake-Common.cmake.patch
knowledge_gained:
  - "allegro5 headless build: 关闭 X11/OpenGL/Audio 后 Unix 系统层仍可编译（udrvlist.c 驱动注册为空）"
  - "allegro5 CMake 构建系统自动检测 UNIX 平台，OHOS/musl 只需额外设置 UNIX=TRUE"
  - "musl 动态链接器对包含 / 的 NEEDED 字段不搜索 LD_LIBRARY_PATH，因此共享库 addon 之间无法互相找到"
  - "采用静态库构建（shared=False）规避 musl RPATH 问题，allegro5 静态库后缀为 -static"
  - "静态构建产出: liballegro-static.a + liballegro_{color,font,image,memfile,primitives}-static.a"
  - "image addon 的 PNG 支持需要 libpng；ttf addon 需要 freetype（构建时未检测到，ttf 自动跳过）"
  - "上游测试几乎全部需要显示/音频驱动，headless 环境无法运行"
  - "allegro5 与 allegro4.4 API 完全不兼容，两者可共存于同一设备"
  - "test_package 18 项断言全部通过（版本宏/类型定义/addon 函数指针等）"
license: BSD-3-Clause
homepage: https://liballeg.org/
