# conandata.yml — aercbook 0.1.6
# aercbook 是 Zig 项目（build.zig 构建，纯 Zig 标准库，无第三方依赖），
# 需要 Zig 0.11.0（项目仅有 zig/0.16.0，build.zig API 不兼容 0.16）。
# 配方内自包含下载 zig 0.11.0 作为构建工具链。

sources:
  # AI review P1: 非标准归档 URL（tag 后追加文件名）可能 404 → 改官方标准格式
  # refs/tags/{tag}.tar.gz；已验证该 URL 下载内容 sha256 与声明一致（2dd0ebe1...）
  url: "https://github.com/renerocksai/aercbook/archive/refs/tags/v0.1.6.tar.gz"
  sha256: "2dd0ebe178ddd6df7e36fce293c68b2affc8a8eec81f6a3f78056fe7f3f1525f"

zig:
  # CI #20403 构建超时：ziglang.org 下载 41.5MB 极慢（45min 硬超时），
  # 加 zig.linus.dev 镜像 fallback（sha256 已校验一致），官方源兜底
  url:
    - "https://zig.linus.dev/zig/0.11.0/zig-linux-aarch64-0.11.0.tar.xz"
    - "https://ziglang.org/download/0.11.0/zig-linux-aarch64-0.11.0.tar.xz"
  sha256: "956eb095d8ba44ac6ebd27f7c9956e47d92937c103bf754745d0a39cdaa5d4c6"
