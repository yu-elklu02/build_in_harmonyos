# aercbook 0.1.6 适配清单
# 最小地址簿工具（aerc 邮件客户端配套），Zig 项目（build.zig，纯 Zig 标准库无第三方依赖）。
# 需 Zig 0.11.0（项目仅有 zig/0.16.0，build.zig API 不兼容 0.16），配方自包含下载 zig 0.11.0。

version: "0.1.6"
status: built

source:
  url: "https://github.com/renerocksai/aercbook/archive/v0.1.6/aercbook-v0.1.6.tar.gz"
  tar_format: tar.gz
  zig_url: "https://zig.linus.dev/zig/0.11.0/zig-linux-aarch64-0.11.0.tar.xz"

build:
  system: zig
  configure_options:
    - "zig build-exe src/main.zig --name aercbook -O ReleaseSafe"
  cc: zig-0.11.0
  notes: "zig 0.11.0 二进制需签名（binary-sign-tool）才能在 OHOS 执行；zig build 内部 execve build_runner 在 OHOS 被拒（AccessDenied），改用 zig build-exe 直接编译绕过 build.zig 的 build_runner execve；手动生成 src/version.zig；编译产物需签名"

patches_applied: []

test:
  upstream_cases: 2
  upstream_suite: "zig test src/email_iterator.zig（email_iterator 单元测试：test.one/test.two）"
  runnable: 2
  runnable_note: "本地 OHOS 环境运行通过（2/2 测试 PASS，zig test --test-no-exec 编译 + 签名后运行）"
  pass_rate: "2/2 = 100%（本地实测）"
  consumer_test: "test_package 验证 aercbook --help 可用"

knowledge_gained:
  - "aercbook 需 zig 0.11.0，项目仅有 zig/0.16.0（build.zig API 不兼容），配方自包含下载 zig 0.11.0（linus.dev 镜像）"
  - "zig 0.11.0 官方二进制在 OHOS 需签名（binary-sign-tool sign -selfSign 1 + llvm-objcopy 移除 .codesign）才能执行"
  - "zig build 内部 execve build_runner（编译 build.zig 的中间产物）在 OHOS 被拒（AccessDenied），需用 zig build-exe 直接编译 src/main.zig 绕过"
  - "build.zig 用 gitVersionTag 生成 src/version.zig，手动写 version_string 替代"
  - "编译产物（aercbook 二进制、测试二进制）均需签名才能在 OHOS 执行"
  - "测试：zig test --test-no-exec 只编译不运行，签名测试二进制后再运行（email_iterator 2 个测试全过）"
