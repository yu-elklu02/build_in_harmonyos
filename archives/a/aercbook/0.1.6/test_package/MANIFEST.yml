# aercbook/0.1.6 test_package
# Verifies aercbook binary is installed and executable

package: aercbook/0.1.6
homepage: "https://github.com/renerocksai/aercbook"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_aercbook.c
    description: "验证 aercbook 二进制存在且可执行（aercbook --help），R34 反空壳：test() 真实执行被测包二进制"
    command: "bash -c \"<aercbook_bin> --help\"  # test_package/conanfile.py test() 定位 bin/aercbook 并执行 --help 验退出码"

assertion_count: 1
