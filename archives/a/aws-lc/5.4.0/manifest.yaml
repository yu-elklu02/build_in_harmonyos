# 版本级 manifest
# 文件位置: archives/a/aws-lc/5.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.4.0"

# 软件名
software: "aws-lc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/aws/aws-lc/archive/refs/tags/v5.4.0.tar.gz"

  # 源码校验和
  sha256: "ef310fdb20a4172a357ab60a1adb217b21aceb34f02e29758edec5a02b1bcc0f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DDISABLE_GO=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_TOOL=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "aws-lc uses CMake (not autotools), detected as 'System is unknown to cmake' on HarmonyOS but builds successfully"
  - "DISABLE_GO=ON required — Go is not available on HarmonyOS, aws-lc falls back to pre-generated code in generated-src/"
  - "BUILD_SHARED_LIBS=OFF (R26) — aws-lc provides libcrypto/libssl which are system-name libraries, must be static"
  - "BUILD_TESTING=OFF — C++ test executables (e.g. rwlock_static_init) fail to link libc++ on HarmonyOS, but library targets (libcrypto.a, libssl.a) build fine"
  - "BUILD_TOOL=OFF — bssl command-line tool disabled for library-only build"
  - "OPENSSL_NO_ASM=ON required on OHOS — CMAKE_SYSTEM_PROCESSOR is 'unknown' (uname -p returns 'unknown'), aws-lc ARCH='generic' without defining OPENSSL_NO_ASM, causing undefined assembly symbols at link time; setting OPENSSL_NO_ASM=ON enables pure-C fallbacks"
