# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: aws-lc/5.4.0
homepage: "https://github.com/aws/aws-lc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# aws-lc uses CTest; tests are disabled in conan build (BUILD_TESTING=OFF)
# due to C++ linking issues on HarmonyOS platform
upstream_tests:
  - file: crypto/abi_test.cc
    source: aws-lc-5.4.0/crypto/abi_test.cc
    description: "Crypto ABI self-test (disabled on HarmonyOS due to C++ linker issues)"
    command: "ctest --test-dir build -R abi_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "SHA-256 known-answer test using aws-lc libcrypto API"
    command: "./test_aws-lc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
