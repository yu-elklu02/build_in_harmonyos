# 编译中学到的知识
knowledge_gained:
  - "adjtimex 是命令行工具(application)非库，package_info 使用 bindirs=['sbin']"
  - "adjtimex Makefile 依赖 Makefile.in 在构建目录内，只能 in-source 构建 (basic_layout(src_folder='.'))"
  - "HMDFS 下 configure 的 (umask 077 && mktemp -d) 创建 0700 目录属主映射异常，需改 umask 002"
  - "OHOS seccomp 沙箱拦截 adjtimex() syscall (SIGSYS)，smoke test 只能用 --version"
