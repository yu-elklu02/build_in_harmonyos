# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: adjtimex/1.29
homepage: "http://linux.die.net/man/8/adjtimex"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 上游无官方测试套件 (无 test/ 目录、无 check target)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "smoke test: adjtimex --version 验证退出码 0（不触发被沙箱拦截的 adjtimex() syscall）"
    command: "./test_adjtimex"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
