# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: aiksaurus/1.2.1+dev-0.12
homepage: "http://aiksaurus.sourceforge.net/"

# 上游测试命令：aiksaurus 1.2.1+dev-0.12 无上游自动化测试套件
# (configure.ac 无 TESTS 定义, make check 为空操作), 详见 notes.md
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34: 实质调用库 API)
# 测试程序打开包内 resdirs 的词典数据, 通过 Aiksaurus::find()+next()
# 对 "happy" 做真实同义词查询并校验结果
test_package_tests:
  - file: test_aiksaurus.cpp
    description: "真实同义词查询: Aiksaurus::find('happy') + next() 校验返回同义词数>0"
    command: "./test_aiksaurus <meanings.dat> <words.dat>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
