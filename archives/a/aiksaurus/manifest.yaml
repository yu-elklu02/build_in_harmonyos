# 软件级 manifest — aiksaurus
# 遵循 ARCHIVE-SPEC v3.0

software: aiksaurus
display: "Aiksaurus"
description: "Aiksaurus — 英文同义词库（C++ 库 + aiksaurus/caiksaurus 命令行工具，AbiWord 依赖）"
category: data
homepage: "http://aiksaurus.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "2004 年旧版 config.guess/config.sub 不识别 HarmonyOS（E007），需升级为 GNU 官方 2023-08-22 版（内置 aarch64-unknown-linux-ohos）"
    - "configure/config.status 内 umask 077 创建的临时目录在 HMDFS 上不可写（E046 类），需移除 umask 077"
    - "configure.ac 含 AC_DISABLE_STATIC，库只能构建 shared；aiksaurus 非系统同名库，R26 强制静态不适用"
    - "GTK+ 前端默认探测 gtk+-2.0（无依赖则自然跳过），配方显式 --with-gtk=no 更稳妥"
    - "词典数据 words.dat/meanings.dat 安装到 share/aiksaurus/，运行时通过 AIK_DATA_DIR 编译期宏定位"
    - "上游 configure.ac 中 AC_CHECK_FUNC(getenv) 未配 AC_DEFINE，导致 config.h 无 HAVE_GETENV，AIK_DATA_DIR 环境变量覆盖不生效（上游缺陷，不影响默认路径）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.1+dev-0.12":
    status: built
    build_date: "2026-08-05"
    conan_ref: "aiksaurus/1.2.1+dev-0.12"
