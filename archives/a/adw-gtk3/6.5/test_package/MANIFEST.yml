# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: adw-gtk3/6.5
homepage: "https://github.com/lassekongo83/adw-gtk3"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试入口统计（实际仓库核查结果，2026-08-09）:
#   - 源码包内无 test/ 或 tests/ 目录（TEST_DIR_COUNT=0）
#   - meson.build / src/**/meson.build 中无 test() / meson.add_test() 定义
#     （NO_TEST_DEFS=1，仅有 sass custom_target 与 install_data）
#   - 上游仓库无 .github/workflows/ CI 测试 job（仅有 release 构建流程）
#   - 主题数据包无二进制可执行入口，无 --version 等 CLI
#   - 结论: 上游官方测试数 = 0（GTK 主题数据包，无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_theme.py
    description: "GTK 主题数据包消费者验证：index.theme（light/dark）/ gtk-3.0 与 gtk-4.0 CSS 非空 / assets 资产 / thumbnail / LGPL-2.1 LICENSE"
    command: "python3 test_theme.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 24
