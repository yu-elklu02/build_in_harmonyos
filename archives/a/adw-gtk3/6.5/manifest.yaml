  - "GTK 主题数据包（adw-gtk3）官方 v6.5 release tarball 即用户实际安装产物：含 gtk-3.0/gtk-4.0 的 gtk.css/gtk-dark.css/libadwaita-tweaks.css/libadwaita.css、assets/、index.theme，由上游 CI 用 sass 编译，无需本地编译 (knowledge_ref: conanfile.py source/package)"
