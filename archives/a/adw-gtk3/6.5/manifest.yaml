  - "数据/主题包无 bin/lib/include 时 L2 smoke test 自动跳过；test_package 用 Python 消费者脚本验证 index.theme/CSS/assets/LICENSE 真实消费 (knowledge_ref: test_package/test_theme.py)"
  - "上游无 test 目录、无 test() 定义、无 CI 测试 job；上游测试数 = 0，由 test_package 消费者断言补齐 (knowledge_ref: test_package/MANIFEST.yml)"

