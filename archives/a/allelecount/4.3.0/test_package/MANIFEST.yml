# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: allelecount/4.3.0
homepage: "https://github.com/cancerit/alleleCount"

# 上游测试命令（上游无正式测试套件，C 工具自包含）
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（需真实 BAM/CRAM 数据，不做数据处理）
upstream_tests:
  - file: c/src/alleleCounter.c
    source: alleleCount-4.3.0/c/src/alleleCounter.c
    description: "NGS 等位基因计数主程序（需真实测序数据，仅编译验证）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "alleleCounter 二进制存在且可执行验证"
    command: "test -x alleleCounter"

# 测试断言总数
assertion_count: 1
