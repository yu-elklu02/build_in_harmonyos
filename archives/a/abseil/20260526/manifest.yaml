knowledge_gained:
  - "The requested version 20260526 maps to the official Abseil LTS tag 20260526.0."
  - "The production package has no third-party Conan dependency; gtest/1.17.0 is test-only."
  - "Use the installed abslConfig.cmake so consumers retain the complete absl::* component graph."
  - "Tests need a writable TMPDIR and Abseil's bundled TZDIR test data on OHOS."
  - "Portable direct ok() assertions avoid the GoogleMock StatusOr<std::any> matcher that OHOS libc++ cannot instantiate."
  - "CMake linking must prepend the active OHOS SDK llvm/lib so host lld loads its ABI-matched libxml2.so.16 on every CI worker."
  - "Probe the generic lld driver with -flavor gnu, never switch silently to GNU ld, and restore the host linker environment before running target tests."

