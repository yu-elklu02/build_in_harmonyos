# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: acedb/4.9.62
homepage: "https://github.com/richarddurbin/acedb"

# 上游测试命令 (acedb 使用自定义 wmake 系统，makefile 提供 test 目标)
upstream_check_command: "make -j1 md5test acelibtest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: wmd5/mddriver.c
    source: acedb-4.9.62/wmd5/mddriver.c
    description: "上游 MD5 测试驱动 — 校验空串摘要 d41d8cd98f00b204e9800998ecf8427e"
    command: "./mddriver"
  - file: wmd5/digtest.c
    source: acedb-4.9.62/wmd5/digtest.c
    description: "上游 MD5 摘要测试 — 输出 Response 校验"
    command: "./digtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试：tace banner/usage + taql + 上游 mddriver/digtest + acediff"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
