# 版本级 manifest — acedb 4.9.62
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.9.62"

# 软件名
software: "acedb"

# 编译状态
# published | built | failed | archived
# conan-verify G0-G4/L2/L4/L5 通过，尚未 upload 制品仓 → built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（固定 commit 86d8c1c92d8a2c58cd090e85a1e17771612bfcb9，保证可复现）
  url: "https://codeload.github.com/richarddurbin/acedb/tar.gz/86d8c1c92d8a2c58cd090e85a1e17771612bfcb9"

  # 源码校验和
  sha256: "163caf3fdda25835351fb1f67b237ff118bc9f0248080ac0d098117c2384c60a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # acedb 使用自定义 wmake 系统（顶层 makefile 驱动 truemake）
  system: makefile

  # 配置选项列表（wmake 通过 ACEDB_MACHINE=OHOS_4 选择构建定义）
  configure_options:
  - "ACEDB_MACHINE=OHOS_4"

  # 编译依赖列表（格式: name/version；glib/readline/ncurses 为 cmd-pkgs 系统依赖，非 conan 包）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-wh-mystdlib-qsort.patch"
- "0002-wh-mydirent-dirent.patch"
- "0003-wh-graph-gtk.patch"
- "0004-wh-gex-gtk.patch"
- "0005-wh-genebuilder-gtk.patch"
- "0006-wh-smapmethods-gtk.patch"
- "0007-wmake-truemake-shell.patch"
- "0008-wtools-perl-shebang.patch"
- "0009-wmake-ohos4def.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "acedb 使用自定义 wmake 构建系统：ACEDB_MACHINE=<平台>_DEF + 顶层 makefile 驱动 truemake，无 configure"
- "OHOS 无 GTK2：graph.h/gex.h/genebuilder.h/smapmethods.h 的 gtk include 需 ACEDB_NO_GTK 条件化，仅编译命令行/服务端工具"
- "OHOS sysroot 已有标准 qsort 原型，acedb 自定义 qsort 声明（mysize_t=int 非 POSIX 分支）导致类型冲突，需跳过"
- "OHOS 环境无 /bin/bash、/usr/bin/perl，脚本 shebang 需改为 /data/service/hnp/bin 实际路径"
- "strip 后的 ELF 在 hmdfs 上无法执行，conan package() 需复制未 strip 二进制"
