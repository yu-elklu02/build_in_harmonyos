build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DADA_TESTING=ON"
    - "-DCMAKE_CXX_FLAGS=-stdlib=libc++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-lc++ -lpthread"
  dependencies: []
  cc: clang
  cxx: clang++

