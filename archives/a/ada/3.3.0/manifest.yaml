# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc++ (clang 15.0.4) 缺少 C++20 std::ranges 算法，需要 polyfill"
  - "CMake 不识别 OHOS 平台，需要显式 -lc++ -lpthread 链接 C++ 标准库"
  - "make -j2 在 OHOS HMDFS 上失败 (mkfifo Operation not permitted)，需用 -j1"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/ada-3.3.0.orig
  source_work_dir: /storage/Users/currentUser/builds/ada-3.3.0.work
  source_orig_hash: ac9adcf9b3623910
  source_work_hash: 577ec50f8148bfdd
  generated_at: '2026-07-01T16:24:55'
  patches_count: 2

patch_classification:
