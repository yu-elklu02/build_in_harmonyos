# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ada/3.3.0
homepage: https://github.com/ada-url/ada

# 上游测试命令 (探索阶段执行)
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游测试套件 (180 tests total, all passed)
upstream_tests:
  - name: "wpt_url_tests"
    source: tests/url_tests.cpp
    description: "WPT URL 规范测试 (idna_test_v2_to_ascii, percent_encoding, verify_dns_length)"
    count: 3
  - name: "wpt_url_tests_typed"
    source: tests/url_tests_typed.cpp
    description: "WPT URL 类型化测试 (setters, toascii, urltestdata × ada::url + ada::url_aggregator)"
    count: 6
  - name: "wpt_urlpattern_tests"
    source: tests/urlpattern_tests.cpp
    description: "WPT URLPattern 测试 (parser_tokenize, basic_tests, has_regexp_groups, urlpattern_test_data)"
    count: 7
  - name: "url_components"
    source: tests/url_components.cpp
    description: "URL 组件偏移量测试"
    count: 1
  - name: "basic_tests"
    source: tests/basic_tests.cpp
    description: "基础 URL 解析测试 (ada::url + ada::url_aggregator + can_parse, 60 tests × 2 + 1)"
    count: 121
  - name: "from_file_tests"
    source: tests/from_file_tests.cpp
    description: "从文件加载 URL 测试数据"
    count: 1
  - name: "ada_c"
    source: tests/ada_c.cpp
    description: "C API 测试 (ada_parse, getters, setters, idna, url_components, copy, search_params)"
    count: 13
  - name: "url_search_params"
    source: tests/url_search_params.cpp
    description: "URLSearchParams 测试 (append, to_string, set, remove, sort, has, iterators)"
    count: 26
  - name: "just_ascii"
    source: tests/just_ascii.cpp
    description: "纯 ASCII URL 解析测试"
    count: 1
  - name: "basic_fuzzer"
    source: tests/basic_fuzzer.cpp
    description: "基础模糊测试"
    count: 1

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "ada C API 验证: ada_parse URL + get_href + get_host + get_protocol"
    command: "./test_ada"

# 测试断言总数 (approximate)
assertion_count: 180
