software: ada
display: "Ada"
description: "WHATWG-compliant and fast URL parser written in modern C++"
category: network
homepage: "https://github.com/ada-url/ada"
license: MIT
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "OHOS libc++ (clang 15.0.4) 缺少 C++20 std::ranges 算法，需要 polyfill (ranges_compat.h)"
    - "CMake 不识别 OHOS 平台，需要显式 -stdlib=libc++ 和 -lc++ -lpthread 链接标志"
    - "make -j2 在 OHOS HMDFS 上失败 (mkfifo Operation not permitted)，需用 -j1"
    - "ada 是纯静态库 (libada.a)，非系统同名库，无需 R26 静态链接配置"
  common_dependencies: []

# 版本索引
versions:
  "3.3.0":
    status: published
    build_date: "2026-06-30"
    conan_ref: "ada/3.3.0@ohpcd/stable"
