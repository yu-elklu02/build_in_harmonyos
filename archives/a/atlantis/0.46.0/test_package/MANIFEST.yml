# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# atlantis 是 Go 应用（Terraform PR 自动化服务 + CLI）。
# 上游通过 `go test ./...` 运行单元测试（162 个 *_test.go、43 个测试包）。
# 本机开发环境（HMDFS）无法执行 build cache 中未签名的测试二进制（E045），
# 因此 `go test ./...` 在 conanfile.py build() 中集成到 CI 阶段：
# 当 runner 具备可用 Go 工具链时真实执行 `go test ./...` 并把结果写入
# go-test-report.txt 与构建日志。test_package 采用 R34 冒烟测试：运行
# `atlantis version` 验证二进制可用性。

package: atlantis/0.46.0
homepage: "https://github.com/runatlantis/atlantis"

# 上游测试命令分析
# R5: 上游测试在 CI 构建阶段（conanfile.py build()，go 可用时）真实运行
upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test ./..."

# 上游实际运行的测试程序（Go 单元测试，CI 阶段在具备 Go 工具链的 runner 上执行）
upstream_tests:
  - file: cmd/server_test.go
    source: atlantis-0.46.0/cmd/server_test.go
    description: "server 命令解析与执行单元测试（TestExecute 系列）"
    command: "go test ./cmd/"
  - file: server/controllers/api_controller_test.go
    source: atlantis-0.46.0/server/controllers/api_controller_test.go
    description: "REST API 控制器单元测试"
    command: "go test ./server/..."

# test_package 中自带的测试（消费者视角验证）
# R34: 调用被测包的实际二进制（atlantis version），非空壳 stub
test_package_tests:
  - file: conanfile.py
    description: "运行 atlantis version，验证二进制可执行且输出包含 'atlantis'"
    command: "atlantis version"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
