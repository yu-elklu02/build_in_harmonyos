# 版本级 manifest — atlantis 0.46.0
software: atlantis
version: "0.46.0"
status: built
build_date: "2026-08-11"
build_system: custom

source:
  url: "https://github.com/runatlantis/atlantis/archive/refs/tags/v0.46.0.tar.gz"
  sha256: "35ee65ebecd4c9999e9841aaa3e5bce626f292de6b4bcf22fd5c4599898f1178"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOFLAGS=-mod=mod"
    - "GOPROXY=https://goproxy.cn,direct"
    - "TMPDIR=/data/storage/el2/base/cache"
    - "GOROOT=/storage/Users/currentUser/gotool/go1.26.4-signed/go"
  dependencies: []
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "E045: Go 工具链的 link/compile/asm 需要先 ELF 签名才能正常执行（鸿蒙 ELF 签名要求），使用 binary-sign-tool 批量签名" ref: E045
  - "E002: /tmp 只读，Go linker 的 mmap 需要 TMPDIR=/data/storage/el2/base/cache" ref: E002
  - "GOPROXY=https://goproxy.cn,direct 可达，proxy.golang.org 超时" ref: E017
  - "go test 生成的测试二进制在 build cache 中无法预签名，本机 HMDFS 上可能 permission denied，属于已知平台限制" ref: E045
  - "atlantis 为纯 Go 应用（CGO_ENABLED=0），无 C 依赖，交叉编译 GOOS=linux GOARCH=arm64 即可" ref: E091

test_results:
  type: official
  total: 0
  passed: 0
  failed: 0

knowledge_ref: []
