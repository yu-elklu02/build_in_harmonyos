software: adwaita-qt
display: "adwaita-qt"
description: "Qt style library and plugin implementing the GNOME Adwaita look"
category: library
homepage: "https://github.com/FedoraQt/adwaita-qt"
license: GPL-2.0-or-later AND LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream Qt6 build mode and the published qtbase/6.11.1 package."
    - "Drop the unused Qt DBus CMake requirement because the packaged Qt base does not publish Qt6DBus and this release does not call QDBus APIs."
    - "Install the Qt style plugin under this package's lib/qt6/plugins tree and export QT_PLUGIN_PATH through runenv_info."
    - "Supply CMake's missing HarmonyOS shared-library linker flags and disable versioned shared-library filenames for OHOS builds to avoid HMDFS symlink creation while preserving basename SONAMEs."
  common_dependencies:
    - qtbase

versions:
  "1.4.2":
    status: adapting
    build_date: "2026-08-08"
