  - "qtbase/6.11.1 publishes Qt6 Core/Gui/Widgets but not Qt6 DBus; adwaita-qt 1.4.2 only carried an unused DBus include and CMake link. knowledge_ref: notes.md#findings"
  - "Qt style plugins must be installed into the package's own plugin tree and exported through QT_PLUGIN_PATH for consumer discovery. knowledge_ref: notes.md#findings"
