# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "FUSE2→FUSE3 移植：制品仓仅发布 libfuse 3.x，configure.ac 的 PKG_CHECK_MODULES 由 fuse(>=2.3) 改为 fuse3(>=3.0)，FUSE_USE_VERSION 由 25 改为 31"
  - "afuse.c 按 FUSE3 高层 API 移植：fuse_operations 回调签名（getattr/readdir/rename/chmod/chown/truncate 增加 fi/flags 参数）、fuse_fill_dir_t 增加 flags 参数、utime→utimens（utimensat）、移除 ftruncate/fgetattr 成员"
  - "GitHub tag 源码不含预生成的 configure，需 autoreconf --install 先引导 automake/autoconf"
  - "E114: configure 中 config.status 以 umask 077 创建临时目录，鸿蒙沙箱无写权限，build() 中 sed 改 umask 000 规避（配方内处理）"
  - "运行期挂载 /dev/fuse 被拒（Permission denied）为鸿蒙沙箱平台限制（无 FUSE 设备访问权），不影响编译/打包，属 E051 类平台限制"

