# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: afuse/0.5.0
homepage: "https://github.com/pcarrier/afuse"

# 上游测试命令: afuse 0.5.0 是 autotools 工程，Makefile.am 未定义任何 TESTS，
# 故 `make check` 无实际测试用例（空 check 目标，退出码 0）。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 上游无测试（无 TESTS / check_PROGRAMS）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# afuse 是 FUSE 守护进程，运行期需 /dev/fuse（OHOS 上普通进程无权限）。
# test_package 执行已安装的 afuse 二进制：
#   1) 缺 (un)mount 模板 → 打印 usage 并报错（验证参数解析）
#   2) -h → FUSE 选项解析正常退出
#   3) 提供合法模板 + mountpoint → 真实发起挂载，到达 FUSE 层
#      （OHOS 因 /dev/fuse 无权限而失败，属平台限制）
test_package_tests:
  - file: test_afuse.sh
    description: "消费者测试源：执行已安装 afuse 二进制（无参数 usage 校验、-h 帮助路径）"
    command: "sh test_afuse.sh"
  - file: conanfile.py
    description: "执行 afuse 二进制：参数解析、-h、真实挂载尝试（FUSE 层）"
    command: "conan test_package"

# 测试断言总数 (近似值)
assertion_count: 4
