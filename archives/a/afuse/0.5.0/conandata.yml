patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Port to libfuse 3.x: use fuse3 pkg-config module (fuse3 >= 3.0) and FUSE_USE_VERSION=31 instead of fuse >= 2.3 / version 25; drop hardcoded PKG_CONFIG_PATH export"
    patch_type: "portability"
  - patch_file: "patches/0002-src-afuse.c.patch"
    patch_description: "Port afuse.c to FUSE 3.x high-level API: fuse_main/fuse_operations signatures (getattr/readdir/rename/chmod/chown/truncate take fi/flags), fuse_fill_dir_t flags arg, utime->utimens (utimensat), drop ftruncate/fgetattr struct members (merged into truncate/getattr via fi)"
    patch_type: "portability"
