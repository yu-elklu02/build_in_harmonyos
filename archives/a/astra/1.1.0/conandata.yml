# conandata.yml — astra 1.1.0 (adapted prebuilt binary variant)
#
# Strategy (period 10, 2026-08-02): download the upstream prebuilt
# `astra-linux-arm64.tar.gz` release artifact from datastax/astra-cli v1.1.0
# and adapt the bundled glibc-dynamic ELF binary to OHOS musl using the
# proven git-xet/qsv/spotify_player recipe (patchelf --set-interpreter +
# --replace-needed, vendor Alpine gcompat/libucontext/musl-obstack/libgcc,
# build libglibc-shim.so for the missing __res_state resolver symbols, then
# ELF re-sign for the OHOS kernel exec path).
#
# Previous periods (1-9) tried to RUN GraalVM's `java`/`native-image` on the
# HongMeng device to AOT-compile astra-cli from source. All nine failed with
# JVM SIGILL (exit -4) — the HongMeng kernel / CPU is incompatible with
# HotSpot's aarch64 backend, and every diagnostic (hs_err dump, dmesg,
# strace, LD_DEBUG) was empty or unavailable on the device. Switching GraalVM
# CE 21.0.2 vs 23.0.2 did not help (both libjvm.so are structurally identical
# on the SIGILL axis). The prebuilt-binary route bypasses the JVM entirely:
# GraalVM native-image runs in GitHub Actions (upstream CI) and publishes a
# self-contained aarch64 glibc binary; we only adapt that binary to musl.
#
# Mirroring: GitHub direct is slow/unreliable from the OHOS preflight
# network. The url is an ordered mirror list reusing the GitHub proxy mapping
# maintained in ci/conan/build_and_test.sh; the official raw GitHub URL is
# kept last as the authoritative fallback. All mirrors must serve a byte-
# identical archive; the SHA256 gate below is unchanged from upstream.
# Prebuilt native binary (astra-linux-arm64.tar.gz). Adapted to OHOS musl
# via the git-xet/qsv/spotify_player recipe (patchelf + gcompat + shim +
# re-sign). This is the package's bin/astra executable.
sources:
  url:
    - "https://ghfast.top/https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
    - "https://gh-proxy.com/https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
    - "https://ghproxy.com/https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
    - "https://gitclone.com/github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
    - "https://kkgithub.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
    - "https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
  sha256: "9faa967c755a0510a99b511221f4a8d929d052f543d8c05941e6a5a4bb24148b"

# Alpine APKs vendoring the glibc→musl compat layer that the prebuilt
# astra binary NEEDED (libgcompat.so.0 + its transitive deps
# libucontext.so.1 / libobstack.so.1 / libgcc_s.so.1). The hmbs preflight
# chroot is clean — it lacks git-xet/qsv/spotify_player's pre-installed
# /storage/Users/currentUser/usr/local/lib/libgcompat.so.0 — so astra must
# vendor these .so files itself. git-xet notes record the same gcompat
# 1.1.0-r4 / libucontext 1.2-r3 / musl-obstack 1.2.3-r2 / libgcc
# 13.2.1_git20240309-r1 combination.
gcompat_source:
  gcompat:
    url: "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/gcompat-1.1.0-r4.apk"
    sha256: "25c88f32ccf12c4590a7b165fb54ce3bb5aa81c3637228367832f5d261b27032"
  libucontext:
    url: "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libucontext-1.2-r3.apk"
    sha256: "c27538115e558758c32ae8d08786c5a85c172f59647bfd1dae217864022307b1"
  musl_obstack:
    url: "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/musl-obstack-1.2.3-r2.apk"
    sha256: "e2d8d6c9b219b89bb843eb01e105e61d08c18a58df3acbae3d45b7588f113acd"
  libgcc:
    url: "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libgcc-13.2.1_git20240309-r1.apk"
    sha256: "0d6aabf922c91c8bfc62cf625366a6669d67048c3a4fef2318a1246f152de2c0"

patches: {}
