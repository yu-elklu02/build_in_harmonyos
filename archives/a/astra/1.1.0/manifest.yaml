software: astra

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: pending

# 编译日期（YYYY-MM-DD）
build_date: "TBD"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL — datastax/astra-cli v1.1.0 GitHub release 预编译产物
  # astra-linux-arm64.tar.gz（17 MB，aarch64 glibc-dynamic，
  # 上游 GraalVM native-image 在 GitHub Actions 中 AOT 编译生成）
  url: "https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"

  # 源码校验和
  sha256: "9faa967c755a0510a99b511221f4a8d929d052f543d8c05941e6a5a4bb24148b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 周期 16（2026-08-04）策略：astra 的 build() 只下载上游 GitHub Actions
  # 预编译的 astra-linux-arm64.tar.gz 并做 glibc→musl ELF 适配（patchelf
  # + vendor gcompat + build glibc-shim + re-sign），不需要 JDK/Gradle。
  # 上游 graalvm/23.1.6 和 gradle/8.12 配方已合入 upstream/main（本 PR
  # 不再重复提交），但 astra 的二进制适配路线本身不消费它们。
  # test_package 跑 3 个 CLI smoke 断言 + 3 个 CLI determinism 契约
  # （replay help_output.{human,json,csv} 的 exit_code + 二次运 determinism），
  # 不 fork JVM。上游 224 个 @Test 中 221 个 JVM 依赖 @Test 因 HongMeng
  # Kernel/CPU 与 HotSpot aarch64 backend 不兼容（SIGILL exit 132，周期 1-9
  # 验证）无法执行，如实报告为 skipped。
  # zlib-ng-compat/2.3.3 作为运行时 Conan requires（提供 libz.so.1）。
  dependencies:
    - zlib-ng-compat/2.3.3

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GraalVM native-image 项目: 需要 JDK + native-image 工具链，构建产物为独立二进制（astra 上游在 GitHub Actions 中完成，本包不再 vendor JDK）"
  - "运行时依赖: zlib-ng-compat 用于 Linux 平台 native image 运行时（提供 libz.so.1）"
  - "周期 1-9 教训: OHOS HongMeng Kernel 与 HotSpot aarch64 backend 不兼容（JVM SIGILL exit 132），不能在真机跑 GraalVM native-image 构建源码，也不能跑 gradle test"
  - "周期 10 起策略: 下载上游 GitHub Actions 预编译的 astra-linux-arm64.tar.gz，用 patchelf + gcompat + shim + re-sign 适配到 musl，绕过无法解决的 JVM SIGILL"
  - "周期 16 策略: 删除 vendor JDK/Gradle 逻辑（test_package 不跑 gradle test，避免配方下载打包整套 JDK 却不使用的矛盾）。test_package 跑 3 个 Homebrew smoke 断言 + 3 个 CLI determinism 契约（exit_code + 二次运 determinism），不 fork JVM。上游 224 @Test 中 221 JVM 依赖 @Test 因 SIGILL 无法执行，如实报告 skipped"
  - "上游 graalvm/23.1.6 + gradle/8.12 配方已合入 upstream/main，本 PR 不重复提交；astra 二进制适配路线不消费它们"
