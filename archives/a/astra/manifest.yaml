software: astra
display: "DataStax Astra CLI"
description: "Command-Line Interface for DataStax Astra — 上游 datastax/astra-cli 通过 GraalVM native-image（在 GitHub Actions 中完成 AOT 编译）发布的独立 aarch64 glibc 预编译二进制，本包适配到 OHOS musl"
homepage: "https://docs.datastax.com/en-astra-cli"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "下载上游 GitHub Actions 预编译的 astra-linux-arm64.tar.gz，patchelf + vendor gcompat + build glibc-shim + ELF re-sign 适配到 musl"
    - "不在本机运行 GraalVM native-image（OHOS HongMeng Kernel 与 HotSpot aarch64 backend 不兼容，JVM SIGILL exit 132）"
    - "不 vendor GraalVM JDK / Gradle（astra 二进制适配路线不消费 JDK/Gradle）"
    - "test_package 跑原生 CLI 断言 + CLI determinism 契约测试，不 fork JVM"
  common_dependencies:
    - "zlib-ng-compat/2.3.3"

versions:
  "1.1.0":
    status: pending
    build_date: "TBD"
    source_url: "https://github.com/datastax/astra-cli/releases/download/v1.1.0/astra-linux-arm64.tar.gz"
