software: automake
display: "GNU Automake"
description: "GNU Automake 自动生成符合 GNU 标准的 Makefile.in 文件"
category: build-tool
homepage: "https://www.gnu.org/software/automake/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 Perl 项目，无需 C 编译器"
    - "构建存在鸡生蛋问题，需使用 gen-all.pl 手动生成替代标准 make 流程"
    - "config.guess 和 config.sub 需同时修改以完整支持 HarmonyOS"
    - "符号链接在某些文件系统受限，用 cp 替代 ln -sf"
  common_dependencies:
    - perl
    - autoconf

versions:
  "1.16.5":
    status: published
    build_date: "2026-04-09"
    published_as: automake
    source_url: "https://ftp.gnu.org/gnu/automake/automake-1.16.5.tar.xz"
  "1.17":
    status: built
    build_date: "2026-04-25"
    source_url: "https://ftp.gnu.org/gnu/automake/automake-1.17.tar.xz"
  "1.18":
    status: published
    build_date: "2026-07-30"
    published_as: automake
    source_url: "https://ftp.gnu.org/gnu/automake/automake-1.18.tar.gz"
