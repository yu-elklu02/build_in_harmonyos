# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ain/1.6.0
homepage: "https://github.com/jonaslu/ain"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Go 单元测试)
upstream_tests:
  - file: internal/pkg/parse
    source: ain-1.6.0/internal/pkg/parse
    description: "模板解析与 tokenize 单元测试"
    command: "go test ./internal/pkg/parse"
  - file: internal/pkg/utils
    source: ain-1.6.0/internal/pkg/utils
    description: "Levenshtein 距离与行处理工具函数测试"
    command: "go test ./internal/pkg/utils"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: ain -v 断言版本 1.6.0 + ain -h 帮助输出"
    command: "bash test.sh <bin/ain>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
