package: actions-up/1.16.0
homepage: "https://github.com/azat-io/actions-up"

upstream_check_command: "npm exec --yes --package=pnpm@10 -- pnpm test:unit"
upstream_test_in_build: false
upstream_test_command: "npm exec --yes --package=pnpm@10 -- pnpm test:unit"

upstream_tests:
  - file: "test/**/*.test.ts"
    source: "actions-up-1.16.0/test/"
    description: "62 upstream Vitest files / 557 tests passed on OHOS using Vitest 4.1.9 + Vite 7.3.6 + @rollup/wasm-node 4.60.1; upstream test source files unchanged"
    command: "npm exec --yes --package=pnpm@10 -- pnpm test:unit"

test_package_tests:
  - file: test_actions_up.sh
    description: "Verifies command availability, version output and help output"
    command: "/system/bin/sh test_actions_up.sh"

assertion_count: 3
