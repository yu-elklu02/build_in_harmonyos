version: "1.0.2"
software: "aces_container"
status: built
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/aces-aswf/aces_container/archive/refs/tags/v1.0.2.tar.gz"
  sha256: "cbbba395d2425251263e4ae05c4829319a3e399a0aee70df2eb9efb6a8afdbae"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-modern-cmake-package-metadata.patch"

knowledge_gained:
  - "aces_container 1.0.2 has no upstream test framework; validation is a single independent Conan consumer test."
  - "Modern CMake rejects the upstream 2.6 minimum, so the recipe patches it to 3.5."
  - "Clang C++17 rejects two scanLineHeader list initializers as narrowing conversions; explicit casts keep the wire layout unchanged."
  - "The installed pkg-config file needs -lAcesContainer for library consumers."

patch_validation:
  method: conandata-patch-application
  patches_count: 1
