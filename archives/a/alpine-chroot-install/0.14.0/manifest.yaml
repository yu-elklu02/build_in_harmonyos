# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.14.0"

# 软件名
software: "alpine-chroot-install"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-05"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/alpinelinux/alpine-chroot-install/tar.gz/refs/tags/v0.14.0"

  # 源码校验和
  sha256: "dfbac97bfaa5089d70f26652584d16b08b6cfc04843cc11673658d72837a136f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器（纯 POSIX shell 脚本，无编译步骤）
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 POSIX shell 脚本项目（单文件 422 行），无编译步骤，上游 Makefile 仅含 install 目标"
  - "OHOS 主机无 coreutils `install` 命令，make install 报 Error 127，Conan 配方 package() 用 cp + chmod 等价实现"
  - "Conan 2.29 get() 无法识别 codeload 无扩展名 URL（BadZipFile），conandata.yml 需加 filename: <name>-<ver>.tar.gz"
  - "OHOS 上 `id -u` 报 'bad uid' 绕过脚本 root 检查，test_package 禁止实际执行脚本，改用 sh -n 语法 + 打包完整性静态检查"
