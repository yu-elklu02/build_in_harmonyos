# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: alpine-chroot-install/0.14.0
homepage: "https://github.com/alpinelinux/alpine-chroot-install"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 Makefile 无 check/test 目标（仅 bump-version/install/readme-update-checksum/release/help），
# 无 tests/ 目录；上游测试入口为 GitHub Actions workflow
# .github/workflows/ci.yml（触发: pull_request/push），非 make 目标，故此处为空。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：GitHub Actions CI（4 架构矩阵 × 9 个 run 断言）
# workflow: .github/workflows/ci.yml（v0.14.0 上游真实存在）
# 矩阵架构: x86_64 / aarch64 / armv7 / ppc64le（runs-on: ubuntu-20.04）
# 9 项断言（按 ci.yml 顺序）:
#   1. sudo ./alpine-chroot-install -a <arch>          —— 安装 Alpine chroot
#   2. /alpine/enter-chroot uname -a                   —— chroot 内 uname
#   3. [[ "$(/alpine/enter-chroot uname -m)" == <arch>* ]] —— 架构匹配
#   4. /alpine/enter-chroot env                        —— chroot 内 env
#   5. /alpine/enter-chroot -u $USER env               —— 用户 env
#   6. sudo /alpine/enter-chroot -u $USER env          —— sudo 用户 env
#   7. test "$(/alpine/enter-chroot printf %s! 'Hello, world')" = 'Hello, world!' —— printf
#   8. /alpine/destroy                                 —— destroy
#   9. /alpine/destroy --remove; ! test -d /alpine     —— destroy --remove 清理验证
# 分层实测结果（分析端 Ubuntu 22.04 x86_64 + QEMU/binfmt 官方 v0.14.0 归档，未改上游源码）:
#   - Linux x86_64:            9/9 PASS
#   - Linux aarch64:           9/9 PASS
#   - Linux armv7:             9/9 PASS
#   - Linux ppc64le + Alpine v3.16: 9/9 PASS（同期版本）
#   - Linux ppc64le + latest-stable(v3.24): 0/9 blocked（首错: ppc64le apk 3.0.7 无法读取
#     apk.static 2.12.10 初始化的数据库；QEMU 与 ppc64le apk 可启动，属上游随时间漂移的版本兼容边界）
#   - OHOS:                    0/9 blocked（root/chroot/binfmt 内核能力缺失，鸿蒙未实现）
# 不得将历史 v3.16 结果伪称为当前 workflow latest-stable 的 4/4 绿灯。
upstream_tests:
  - file: ".github/workflows/ci.yml"
    source: "alpine-chroot-install-0.14.0/.github/workflows/ci.yml"
    description: "4 架构矩阵(ubuntu-20.04) × 9 断言：安装/enter-chroot uname/架构匹配/env/用户env/sudo用户env/printf/destroy/destroy--remove"
    command: "sudo ./alpine-chroot-install -a <arch> && /alpine/enter-chroot ... (依赖 root+chroot+网络)"
    result_linux: "x86_64 9/9 PASS；aarch64 9/9 PASS；armv7 9/9 PASS；ppc64le+v3.16 9/9 PASS；ppc64le+latest-stable(v3.24) 0/9 blocked（apk 版本兼容边界）"
    status_on_ohos: "blocked 0/9（root/chroot/binfmt 内核能力与 apk 网络下载依赖，鸿蒙未实现）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smoke.sh
    description: "静态冒烟测试：脚本存在且可执行 / sh -n 语法检查 / shebang与无二进制载荷 / LICENSE 打包"
    command: "sh test_smoke.sh <pkg_root> <sh>"

# 测试断言总数 (近似值, 用于质量评估)
# 新增消费者静态 smoke test 独立统计：5 断言（上游 9 断言 blocked 不计入）
assertion_count: 5
