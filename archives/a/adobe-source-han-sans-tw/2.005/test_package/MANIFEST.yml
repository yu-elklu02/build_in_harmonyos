# test_package/MANIFEST.yml — 上游官方测试声明(CI L0e 强制要求)
package: adobe-source-han-sans-tw/2.005
homepage: https://github.com/adobe-fonts/source-han-sans

# 上游为纯字体数据包,无传统代码测试套件;字体验证通过 AFDKO 构建工具链完成
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试(消费者视角:验证字体文件已安装且格式正确)
test_package_tests:
  - file: test_fonts.py
    description: "验证 fonts/ 目录下存在 OTF 字体文件"
    command: "python3 test_fonts.py"

assertion_count: 1
