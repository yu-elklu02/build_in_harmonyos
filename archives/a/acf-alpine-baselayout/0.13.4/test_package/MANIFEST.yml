# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
#
# 上游无测试套件：Makefile 无 check/test 目标，源码无 test/ 目录
# （与同家族已合入的 acf-core/acf-db 一致）。

package: acf-alpine-baselayout/0.13.4
homepage: "https://gitlab.alpinelinux.org/acf/acf-alpine-baselayout"

# 上游测试命令（源码中不存在 make check/test 目标）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（上游无测试，故为 false）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角实质验证，R34）
test_package_tests:
  - file: test_acf_alpine_baselayout.sh
    description: "包布局完整性（10 controller + 10 model + 7 menu + roles + 视图/符号链接、无 lib/bin 产物）+ 角色内容验证"
    command: "bash test_acf_alpine_baselayout.sh <pkg> <testdir>"
  - file: test_syntax.lua
    description: "用 conan lua/5.4.8 真实运行时 loadfile() 语法加载包内全部 .lua 文件"
    command: "lua-runner test_syntax.lua <appdir>"
  - file: mini_lua.c
    description: "测试运行器源码：链接 conan lua/5.4.8 静态库的 Lua 5.4 脚本执行器（仅测试驱动，不随包发布）"
    command: "cc mini_lua.c -I<lua>/include <lua>/lib/liblua.a -ldl -lm"

# 测试断言总数（test_acf_alpine_baselayout.sh 实际执行的检查项）：
# 1 包目录 + 10 controller + 10 model + 7 menu + 1 roles 文件 + 5 角色行
# + 6 视图 + 3 符号链接视图 + 2 无产物 + 1 语法整体 = 46
assertion_count: 46
