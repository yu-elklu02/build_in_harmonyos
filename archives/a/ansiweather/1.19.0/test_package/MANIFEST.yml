# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ansiweather/1.19.0
homepage: "https://github.com/fcambus/ansiweather"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# ansiweather 为纯 bash 脚本项目，上游无 Makefile/测试框架
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 已核验上游无正式自动化测试套件
# 核验依据:
#   1. 上游仓库 tag 1.19.0 无 test/ 或 tests/ 目录
#   2. 无 Makefile / Makefile.in / CMakeLists.txt 等构建文件
#   3. 无 .github/workflows/ 或 .travis.yml 等 CI 配置
#   4. 上游仅包含: ansiweather(主脚本), ansiweather.1(man手册), README.md, LICENSE, ChangeLog
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ansiweather.sh
    description: "CLI smoke test — 验证 ansiweather 存在、可执行，且 `-v` 输出包含版本号 AnsiWeather 1.19.0"
    command: "bash test_ansiweather.sh ansiweather"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1