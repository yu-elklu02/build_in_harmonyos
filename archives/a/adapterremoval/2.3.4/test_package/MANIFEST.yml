package: adapterremoval/2.3.4
homepage: "https://github.com/MikkelSchubert/adapterremoval"
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - file: "Makefile"
    source: "adapterremoval-2.3.4/Makefile"
    description: "Builds and runs upstream Catch-based unit tests from tests/unit when can_run() is true."
    command: "make test"
test_package_tests:
  - file: "test.sh"
    description: "Runs AdapterRemoval --version and trims a minimal FASTQ input, checking the output record."
    command: "./test.sh"
assertion_count: 4
