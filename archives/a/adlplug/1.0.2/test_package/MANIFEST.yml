package: adlplug/1.0.2
homepage: "https://github.com/jpcima/ADLplug"
upstream_check_command: "cmake -DWITH_UNIT_TESTS=ON <libADLMIDI source> && ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: "thirdparty/libADLMIDI/test"
    source: "ADLplug v1.0.2 pinned libADLMIDI submodule"
    description: "Optional upstream libADLMIDI tests: BankMapTest and ConversionTest passed; WoplFileTest failed on HarmonyOS PC."
    command: "cmake -DWITH_UNIT_TESTS=ON <libADLMIDI source> && ctest --output-on-failure"
test_package_tests:
  - file: "main.cpp"
    description: "Initializes the ADLplug Player, enumerates ADLMIDI emulators, and configures one synthesis chip."
    command: "ctest --output-on-failure"
assertion_count: 2
