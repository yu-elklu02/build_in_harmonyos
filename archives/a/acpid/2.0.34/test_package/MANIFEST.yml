# test_package/MANIFEST.yml — acpid 2.0.34
# CI L0e 门禁要求此文件存在。
# 上游无自动化测试：acpid-2.0.34 仅附带手写 TESTPLAN（人工验收文档，
# 描述电源键/合盖事件、日志、killall 等手动步骤），无 test/ 目录、
# 无 make check 目标（见 Makefile.am：SUBDIRS = kacpimon，仅 bin/sbin 程序）。
# 因此采用 test_package 可执行文件 smoke test 作为替代验证。

package: acpid/2.0.34
homepage: "https://sourceforge.net/projects/acpid2/"

# 上游测试命令探测：make -n check 无 check 目标
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试程序（只有手写 TESTPLAN 文档）
upstream_tests: []

# test_package smoke tests（可执行文件验证，替代库 API 验证）
test_package_tests:
  - file: test.sh
    description: "acpid --version 打印 acpid-2.0.34 并返回 0；acpi_listen --help 打印用法并返回 0"
    command: "bash test.sh"

assertion_count: 2
