# 编译档案 manifest — acpid 2.0.34
# probe_only_no_upload 轮次（未上传制品）

software: acpid
version: 2.0.34
status: built
build_date: "2026-08-04"

build_system: autotools
source_url: https://deb.debian.org/debian/pool/main/a/acpid/acpid_2.0.34.orig.tar.xz

# 编译环境信息
created_at: 2026-08-04 17:35:00
compile_date: 2026-08-04

# 依赖
dependencies:
  required: []
  optional: []

# 编译配置
build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "--prefix=/data/storage/el2/base/.conan-build-acpid-2.0.34/install"
    - "--disable-silent-rules"
  cflags: "-pipe -D__MUSL__"
  notes: "tmpfs 构建（hmdfs umask 077 限制）；TMPDIR=/data/storage/el2/base/.acpid-tmp"

# 兼容性
compatibility:
  level: compile
  issues:
    - "ACPI 接口缺失：/proc/acpi、/sys/bus/acpi、ACPI netlink 在 HongMeng Kernel 1.12.0 上均不存在（运行期事件源缺失，编译不受影响）"
  notes: "编译全通过；运行期依赖 ACPI 事件源，HarmonyOS 上无标准 ACPI 接口 → 路径 B 候选"

# 测试结果
test_results:
  type: executable-smoke
  passed: 2
  failed: 0
  note: "acpid --version 与 acpi_listen --help 均 PASS（上游无自动化测试，仅有手写 TESTPLAN）"

# 知识积累
knowledge_gained:
  - "HarmonyOS PC 内核（HongMeng 1.12.0）无 /proc/acpi、/sys/bus/acpi、ACPI netlink——ACPI 事件 daemon 类软件运行期受限"
  - "acpid 为纯可执行包：configure/make 不依赖 ACPI 接口，编译可过，运行需事件源 shim"
  - "E007 config.guess HarmonyOS 识别补丁复用成功（sed 同源）"
  - "E091 -D__MUSL__ sockaddr_storage 冲突修复复用成功（bird2/libkcapi/fastfetch 同源）"

# 补丁列表
patches_applied:
  - file: "0001-build-aux-config.guess.patch"
    purpose: "HarmonyOS 平台识别：config.guess 新增 HarmonyOS 分支 → *-unknown-linux-ohos；config.sub 接受 ohos*/linux-ohos*"

# 编译日志
build_log: reports/conan-create.log
