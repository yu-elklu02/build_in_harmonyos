# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: abgate/1.2.0
homepage: https://abgate.sourceforge.io/

# abgate has no upstream test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test suite
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test_gate.sh
    description: "Verify abgate LV2 bundle structure (manifest.ttl, gate.ttl, gate.so) and gate.so ELF magic"
    command: "conan test"

# 测试断言总数
assertion_count: 5