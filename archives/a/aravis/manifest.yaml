software: aravis
display: "aravis"
description: "Vision library for GenICam based cameras"
category: multimedia
homepage: "https://github.com/AravisProject/aravis"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson project; disable viewer/gst/introspection/docs for the first core-library adaptation pass."
    - "USB support is disabled in the default package until libusb/1.0.27 is available as a Conan recipe/package."
    - "Packet socket support is Linux-specific and disabled on OHOS."
  common_dependencies:
    - glib/2.84.0
    - libxml2/2.15.3
    - zlib/1.3.1.1

versions:
  "0.8.36":
    status: pending
    build_date: "2026-07-28"
    notes: "Initial core library recipe with USB disabled pending libusb Conan publication; requires OHOS/OpenDesk conan verification."
