package: aravis/0.8.36
homepage: "https://github.com/AravisProject/aravis"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: evaluator.c
    source: tests/evaluator.c
    description: "Evaluator expression tests from upstream Meson suite"
    command: "meson test evaluator"
  - file: buffer.c
    source: tests/buffer.c
    description: "Buffer API tests from upstream Meson suite"
    command: "meson test buffer"
  - file: misc.c
    source: tests/misc.c
    description: "Misc utility tests from upstream Meson suite"
    command: "meson test misc"
  - file: dom.c
    source: tests/dom.c
    description: "DOM parser tests using tests/data/genicam.xml"
    command: "meson test dom"
  - file: genicam.c
    source: tests/genicam.c
    description: "GenICam model tests using tests/data/genicam.xml"
    command: "meson test genicam"
  - file: fake.c
    source: tests/fake.c
    description: "Fake device/fake camera tests"
    command: "meson test fake"
  - file: fakegv.c
    source: tests/fakegv.c
    description: "Fake GigE Vision camera/network tests"
    command: "meson test fakegv"

test_package_tests:
  - file: test_aravis.c
    description: "Consumer test: checks version API and creates a fake device, then reads its GenICam model"
    command: "./test_aravis"

assertion_count: 8
