package: avy/0.5.0.1
homepage: "https://github.com/abo-abo/avy"

# 上游测试命令 - Emacs Lisp 包使用 ert 测试框架
upstream_check_command: "make test (Emacs ert batch test)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: avy-test.el
    source: https://github.com/abo-abo/avy/blob/0.5.0/avy-test.el
    description: "Emacs Lisp ert unit tests for avy"
    command: "emacs -batch -l avy-test.el -f ert-run-tests-batch-and-exit"

# test_package 中自带的测试
test_package_tests:
  - file: test_avy.py
    description: "Python validation of avy.el content (provide form, defun count, key functions)"
    assertions:
      - "avy.el exists and is non-empty"
      - "avy.el contains (provide 'avy)"
      - "avy.el contains defun forms"
      - "avy-test.el exists and contains ert-deftest"
      - "avy.el has > 10 defun forms"
      - "avy.el contains avy-jump function"
      - "avy.el contains avy-process function"
      - "avy.el contains avy-read function"

# 测试断言总数
assertion_count: 8
