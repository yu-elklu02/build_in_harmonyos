version: "2.4h"
software: aespipe
status: built
build_date: "2026-08-05"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/loop-aes/aespipe/v2.4h/aespipe-v2.4h.tar.bz2"
  sha256: "eab311fc26ea43289bc3adf660d6270492494960725d2026ec4917294a1aba49"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--disable-asm"
    - "--disable-padlock"
    - "--disable-intelaes"
  dependencies: []
  cc: clang
  patches:
    - "patches/0001-fix-config-status-hmdfs-umask.patch"

knowledge_gained:
  - "The upstream make tests target contains 24 deterministic encryption and decryption groups."
  - "Portable C implementations are selected for cross compilation by disabling host-specific assembly and CPU extensions."
  - "OHOS HMDFS workers need config.status temporary files created with group/world traversal permission so generated helper scripts remain accessible."
  - "The consumer test checks correct-key roundtrip, ciphertext difference, wrong-key rejection, and invalid options."
