package: afio/2.5.2
homepage: "https://github.com/kholtman/afio"

upstream_test_in_build: false
upstream_test_command: "make regtest && make regtest2gb"

upstream_tests:
  - file: regtest/regtest
    description: "File handling and archive portability regression program"
    command: "make regtest"
  - file: regtest/regtest2gb
    description: "Sparse large-file and offsets-over-2GiB regression program"
    command: "make regtest2gb"

test_package_tests:
  - file: test_afio.py
    description: "Archive round trip and corrupt-input negative case"
    command: "python3 test_afio.py <packaged-afio>"

assertion_count: 9
