package: abcm2ps/8.14.15
homepage: "https://github.com/lewdlime/abcm2ps"
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - file: "Makefile.in"
    source: "abcm2ps-8.14.15/Makefile.in"
    description: "Upstream make test converts 10 bundled ABC examples to PostScript files."
    command: "make test"
test_package_tests:
  - file: "test.sh"
    description: "Runs abcm2ps on a minimal ABC input and asserts that a non-empty PostScript file is produced."
    command: "./test.sh"
assertion_count: 1
