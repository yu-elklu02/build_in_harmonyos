# test_package/MANIFEST.yml — aha 0.5.1
# CI L0e requires this file to exist.

package: aha/0.5.1
homepage: "https://github.com/theZiz/aha"

# aha has no upstream test suite (manual Makefile project)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Runs aha --version and pipes ANSI text through aha, checking for HTML output"
    command: "conan test"

# Approximate assertion count
assertion_count: 3
