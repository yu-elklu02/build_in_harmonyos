# test_package/MANIFEST.yml — range-v3/0.12.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: range-v3/0.12.0
homepage: "https://github.com/ericniebler/range-v3"

# range-v3 is header-only but upstream CTest tests are compiled and run
# in build() (isolated temp build dir). 239 tests across action, algorithm,
# iterator, functional, numeric, range, utility, view, experimental.
upstream_check_command: "ctest --output-on-failure -j20"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j20"

upstream_tests:
  - subdir: action
    description: "Action tests (push_back, insert, remove, join, reverse, etc.)"
  - subdir: algorithm
    description: "Algorithm tests (for_each, find, sort, merge, partition, set_*, etc.)"
  - subdir: iterator
    description: "Iterator tests"
  - subdir: functional
    description: "Functional tests"
  - subdir: numeric
    description: "Numeric tests (accumulate, inner_product, etc.)"
  - subdir: range
    description: "Range concept tests"
  - subdir: utility
    description: "Utility tests (copy, move, swap, etc.)"
  - subdir: view
    description: "View tests (transform, filter, take, drop, join, split, etc.)"
  - subdir: experimental
    description: "Experimental feature tests"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: views::transform, views::filter, views::take/drop, action::push_back, accumulate, for_each, version macros"
    command: "./rangev3_test"

upstream_test_count: 239
test_package_test_count: 1
assertion_count: 15
