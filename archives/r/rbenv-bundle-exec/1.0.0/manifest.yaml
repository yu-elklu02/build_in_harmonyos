version: "1.0.0"
software: "rbenv-bundle-exec"
status: built
build_date: "2026-07-27"
build_system: custom

source:
  url: "https://github.com/maljub01/rbenv-bundle-exec/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "2da08cbb1d8edecd1bcf68005d30e853f6f948c54ddb07bada67762032445cf3"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies: []
  runtime_dependencies:
    - "rbenv"
    - "ruby >= 1.8.7"
    - "bundler"
  cc: clang
  cxx: clang++

patches_applied: []

artifacts:
  - "share/rbenv-bundle-exec/etc/rbenv.d/exec/bundle-exec.bash"
  - "share/rbenv-bundle-exec/README.md"
  - "share/rbenv-bundle-exec/LICENSE"

validation:
  staging_install: passed
  smoke_test: "file existence check passed; bash syntax check skipped on Windows (bash not in PATH)"
  conan_create: "passed (conan 2.29.1, Windows x86_64, default profile)"

knowledge_gained:
  - "rbenv-bundle-exec 是纯 Bash 插件，无需 native 编译，打包时复制 etc/rbenv.d/exec/bundle-exec.bash 脚本与文档即可。"
  - "上游仓库无 bin/ 目录，插件通过 etc/rbenv.d/exec/bundle-exec.bash 钩子脚本工作，rbenv 自动加载该目录下的钩子。"