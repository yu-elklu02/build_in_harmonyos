package: rbenv-bundle-exec/1.0.0
homepage: "https://github.com/maljub01/rbenv-bundle-exec"

upstream_check_command: "find . -name '*.bats' -o -name 'test*' -o -name '*spec*'"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "文件存在性检查（插件目录、bundle-exec.bash、LICENSE）+ bash 语法检查"
    command: "bash test.sh"
  - file: conanfile.py
    description: "调用 test.sh 执行 shell 层面测试"
    command: "conan test"

assertion_count: 4
