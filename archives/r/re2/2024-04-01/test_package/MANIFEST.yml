# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: re2/2024-04-01
homepage: "https://github.com/google/re2"

# Upstream test command
upstream_check_command: "cmake -DRE2_BUILD_TESTING=ON .. && ctest"

# conanfile.py build() method does NOT build upstream tests (testing disabled)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (not built in conan recipe)
upstream_tests:
  - file: re2/testing/re2_test.cc
    source: re2-2024-04-01/re2/testing/re2_test.cc
    description: "Core RE2 API tests (FullMatch, PartialMatch, Replace, etc.)"
    command: "./re2_test"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: FullMatch with capture groups, PartialMatch, Replace"
    command: "./test_re2"

# Approximate assertion count
assertion_count: 6
