software: redis
display: "Redis"
description: "High-performance in-memory key-value data store"
category: db
homepage: "https://redis.io/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "musl 不支持 pthread_cancel、pthread_setcancelstate、pthread_setcanceltype，需要 stub 实现"
    - "program_invocation_name 是 glibc 特有变量，musl 不提供，需用静态变量替代"
    - "使用 MALLOC=libc 避免 jemalloc 在 musl 上的问题"
    - "需要新增 musl-compat.h 和 musl-compat.c 文件"
  common_dependencies:
    - libc (musl)

versions:
  "7.4.2":
    status: built
    build_date: "2026-04-27"
  "8.6.0":
    status: built
    build_date: "2026-07-15"
