software: redis
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.6.0"

# 构建系统类型（顶级字段，用于验证）
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/redis/redis/archive/refs/tags/8.6.0.tar.gz"

  # 源码校验和
  sha256: "74261ece988fd2e1526e5aea9f8b9853217d71e2ef2dafaa624ed9579b5f4317"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # redis 使用 make 直接编译，不需要 configure

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # redis 依赖内置在 deps/ 目录中

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-threads_mngr-atomic-init.patch"
- "0002-setproctitle-musl-compat.patch"
- "0003-makefile-pthread-compat.patch"
- "0004-pthread_compat-stub.patch"
# 补丁说明：
# 0001: C11 atomic 变量无法静态初始化为 NULL，改为动态初始化
# 0002: musl libc 不提供 GNU 扩展 program_invocation_name
# 0003: 将 pthread_compat.o 加入编译目标
# 0004: 提供 pthread_cancel 等函数的 stub 实现（E085）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "E085: musl libc 不实现 pthread_cancel 等 POSIX 线程取消 API，需要提供 stub 实现"
- "C11 _Atomic 变量无法静态初始化为非编译时常量（如 NULL），需要动态初始化"
- "GNU libc 扩展 program_invocation_name/program_invocation_short_name 在 musl 中不存在"
- "redis 使用内置依赖（deps/ 目录），不支持 DESTDIR 模式安装"
- "redis Makefile 需要手动添加 pthread_compat.o 到 REDIS_SERVER_OBJ"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
