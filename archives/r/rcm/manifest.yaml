software: rcm
display: "rcm"
description: "rc file (dotfile) management — manage dotfiles with rcup, rcdn, lsrc, mkrc"
category: utils
homepage: "https://github.com/thoughtbot/rcm"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用 autotools 构建系统（configure + make），release tarball 已预生成 configure 和 man 页"
    - "rcm 是纯 shell 脚本工具（无 C 编译），package_type 为 application"
    - "OHOS 需修复 configure 脚本 shebang (E165): #! /bin/sh -> #!/system/bin/sh"
    - "OHOS 需修复 configure 中 umask (E110): umask 077 -> umask 002"
    - "OHOS 需修复 bin/*.in 脚本 shebang: 所有四个文件（lsrc/mkrc/rcdn/rcup）均用 #!@SHELL@ -> #!/data/service/hnp/bin/bash（避免 configure 替换为 /bin/sh）"
    - "configure.ac 无 AC_CANONICAL_HOST，不做平台检测，无需 patch config.guess/config.sub (E007)"
    - "上游测试用 cram 框架（LOG_COMPILER=cram），OHOS 可能未安装 cram，make check 条件性执行"
    - "安装产物：bin/lsrc、bin/mkrc、bin/rcup、bin/rcdn + share/rcm.sh + man 页"
  common_dependencies: []

versions:
  "1.3.6-r0":
    status: built
    build_date: "2026-07-15"
