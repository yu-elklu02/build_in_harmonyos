software: rcm
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.6-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.6-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/thoughtbot/rcm/releases/download/v1.3.6/rcm-1.3.6.tar.gz"

  # 源码校验和
  sha256: "f4fdfbc451d1fb5764531290a202a0a871f6b81ba3c01a6b76c49435c85080a5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  # rcm 的 configure.ac 无 AC_CANONICAL_HOST，不做平台检测，不需要 --build/--host
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（rcm 是纯 shell 脚本工具，无 C 编译）
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# OHOS 适配通过 conanfile.py 中的 replace_in_file 动态修改，未使用 patch 文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rcm 1.3.6 是 thoughtbot 开发的 dotfile 管理工具，纯 shell 脚本（bash），无 C 编译"
  - "Release tarball 已预生成 configure、Makefile.in、man 页，无需 autoreconf 或 ruby-mustache"
  - "configure.ac 无 AC_CANONICAL_HOST，不做平台检测，无需 patch config.guess/config.sub (E007)"
  - "OHOS 适配需修复 configure 脚本 shebang (E165) 和 umask (E110)"
  - "bin/*.in 脚本的 shebang 需修复：所有四个文件（lsrc/mkrc/rcdn/rcup）均用 #!@SHELL@（configure 替换为 /bin/sh），统一替换为 #!/data/service/hnp/bin/bash"
  - "上游测试用 cram 框架 (LOG_COMPILER=cram)，OHOS 可能未安装 cram，make check 条件性执行"
  - "test/helper.sh 的 resolved_path 函数依赖 perl，部分测试可能因 perl 缺失而失败"
  - "rcm 是 CLI 应用程序 (application)，非库。package_info 中 libs=[]，bindirs=['bin']"
  - "安装产物：bin/lsrc、bin/mkrc、bin/rcup、bin/rcdn + share/rcm/rcm.sh + man 页"
