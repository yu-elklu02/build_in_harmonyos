# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rcm/1.3.6-r0
homepage: "https://github.com/thoughtbot/rcm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# rcm 使用 cram 框架运行 test/ 目录下的 .t 测试文件 (LOG_COMPILER=cram)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 条件性执行：仅当环境中安装了 cram 时才运行 make check
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (47 个 cram .t 测试文件)
upstream_tests:
  - test/lsrc-dotfiles-dirs.t
  - test/lsrc-excludes.t
  - test/lsrc-hostname.t
  - test/lsrc-sigils.t
  - test/lsrc.t
  - test/lsrc-symlink-dirs.t
  - test/lsrc-spaces.t
  - test/lsrc-tags.t
  - test/lsrc-usage.t
  - test/lsrc-undotted.t
  - test/lsrc-undotted-star.t
  - test/lsrc-host-tags-default.t
  - test/lsrc-globs.t
  - test/mkrc-alternate-dotfiles-dir.t
  - test/mkrc-copy-file.t
  - test/mkrc-hooks.t
  - test/mkrc-host-file.t
  - test/mkrc-hostname.t
  - test/mkrc-no-dotfiles-dir-found.t
  - test/mkrc-no-symlinks.t
  - test/mkrc-one-dotfile-arg.t
  - test/mkrc-simple-output.t
  - test/mkrc-spaces.t
  - test/mkrc-symlink-dirs.t
  - test/mkrc-tagged-file.t
  - test/mkrc-usage.t
  - test/mkrc-undotted.t
  - test/rcrc-custom.t
  - test/rcrc-tilde.t
  - test/rcrc-hostname.t
  - test/rcrc-lsrc-excludes.t
  - test/rcrc.t
  - test/rcup-link-files.t
  - test/rcup-hostname.t
  - test/rcup-standalone.t
  - test/rcup-symlink-dirs.t
  - test/rcup-symlink-existing.t
  - test/rcup-usage.t
  - test/rcdn-hooks.t
  - test/rcdn-hooks-failure.t
  - test/rcdn-hooks-run-in-situ.t
  - test/rcdn-hooks-run-in-order.t
  - test/rcup-hooks.t
  - test/rcup-hooks-failure.t
  - test/rcup-hooks-run-in-situ.t
  - test/rcup-hooks-run-in-order.t
  - test/rcup-spaces.t

# test_package 中自带的测试 (消费者视角验证)
# 验证 rcm 四个命令的基本功能：lsrc 列出、rcup 安装、rcdn 卸载、mkrc 引入
test_package_tests:
  - file: test_rcm.sh
    description: "通过 bash 执行 rcm 的 lsrc/rcup/rcdn/mkrc 功能验证（dotfiles 符号链接管理）"
    command: "bash test_rcm.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个测试场景: lsrc 列出 dotfiles、rcup 创建符号链接、rcdn 移除符号链接、mkrc 引入 dotfile
assertion_count: 4
