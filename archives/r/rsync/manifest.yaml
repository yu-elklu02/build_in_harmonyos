software: rsync
display: "rsync"
description: "Fast incremental file transfer and synchronization tool"
category: network
homepage: "https://rsync.samba.org/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 config.guess/config.sub 补丁添加 HarmonyOS 检测"
    - "config.status mktemp 在 HMDFS 上权限不足，需程序化修复（E114）"
    - "shebang 路径需修复（E165）：/bin/sh → /system/bin/sh"
    - "configure 检测到 getpass 但 OHOS 无头文件，需 undef HAVE_GETPASS"
    - "官方测试套件因 SELinux 软链接限制全部失败，但核心功能正常"
    - "whoami 无法解析鸿蒙数字格式用户 ID"
    - "xxhash/zstd/lz4 通过 cmd-pkgs 安装，已启用"
  common_dependencies:
    - openssl
    - xxhash
    - zstd
    - lz4

versions:
  "3.3.0":
    status: published
    build_date: "2026-07-08"
