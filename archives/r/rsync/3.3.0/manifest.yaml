software: rsync
version: "3.3.0"
status: published
build_system: autotools
compile_date: "2026-07-08"

dependencies:
  required: [clang, make]
  optional: [xxhash, zstd, lz4, openssl]

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://rsync.samba.org/ftp/rsync/src/rsync-3.3.0.tar.gz
  configure_options:
    - --prefix=$PACKAGE_FOLDER (Conan managed)
    - --no-create (E114: generate config.status without running)
  cflags: -fPIC -O2 (from AutotoolsToolchain)
  ldflags: -static (R26: terminal tool)

patches_applied:
  - file: 0001-config.guess.patch
    purpose: config.guess 添加 HarmonyOS/__OHOS__ 识别
  - file: 0002-config.sub.patch
    purpose: config.sub 添加 ohos 操作系统支持

programmatic_fixes:
  - name: E114_config_status_mktemp
    description: |
      config.status 在 HMDFS 上 mktemp 创建临时目录权限不足。
      在 build() 中通过 _fix_config_status_mktemp() 程序化修复，
      在 configure --no-create 生成 config.status 后、运行 config.status 前插入。
      不通过补丁实现（config.status 是生成文件，非源码文件）。
  - name: E165_shebang_fix
    description: |
      修复 #!/bin/sh 和 #!/bin/bash shebang 为 OHOS 路径。
      在 build() 中通过 _fix_all_shebangs() 程序化修复。
  - name: HAVE_GETPASS_undef
    description: |
      configure 检测到 libc 中有 getpass 但 OHOS 无头文件声明。
      在 config.status 生成 config.h 后，通过 _undef_getpass() 程序化修复。

compatibility:
  level: published
  issues:
    - "make check 因 whoami 命令不存在而失败（OHOS 平台限制）"
    - "config.status 在 HMDFS 上 mktemp 创建临时目录权限不足（E114，程序化修复）"
  notes: |
    核心功能正常：rsync --version 输出正确，支持 xxhash/zstd/lz4/openssl-crypto。
    make check 失败是 OHOS 平台 whoami/id 命令缺失导致，非功能性问题。
    编译产物：bin/rsync, bin/rsync-ssl, man pages。

test_results:
  type: functional
  total: 19
  passed: 19
  failed: 0
  ci_compliance: "L0 PASS, L1 PASS, L2 PASS, L4 WARN(误报), L5 PASS"
  note: |
    19 项功能测试全部通过：版本验证、基本同步、增量传输、删除同步、
    权限保持、时间戳保持、Dry run、进度显示、压缩传输、统计输出、
    强校验和、递归目录、排除规则、包含+排除组合、ELF安全扫描(NX/RELRO)、
    静态链接验证、rsync-ssl验证、补丁安全扫描、产物完整性。
    CI L0/L1 阻塞性检查全通过，配方符合 R26/R28/R32/R33/R34/R36/R37/R38。
    make check 因 whoami 缺失跳过（OHOS 平台限制），非功能性问题。

knowledge_gained:
  - "rsync 3.3.0 在鸿蒙上编译成功，支持 xxhash/zstd/lz4/openssl"
  - "config.guess/config.sub 需替换为 automake 版本以识别 OHOS"
  - "config.status mktemp 在 HMDFS 上权限不足，需在 build() 中程序化修复（E114）"
  - "make check 因 whoami/id 命令缺失而失败（OHOS 平台限制）"
  - "xxhash/zstd/lz4 预编译包可从 cmd-pkgs 安装，Conan 制品仓暂无"
  - "rsync 下载 URL: https://rsync.samba.org/ftp/rsync/src/rsync-3.3.0.tar.gz"
  - "rsync 3.3.0 的 configure 脚本名为 configure.sh，需创建 configure 符号链接供 Autotools 使用"

