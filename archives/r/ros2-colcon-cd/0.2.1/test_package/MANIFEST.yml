package: ros2-colcon-cd/0.2.1
homepage: "https://github.com/colcon/colcon-cd"

upstream_check_command: "python3 -m pytest -q"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest -q"

upstream_tests:
  - file: test/test_copyright_license.py
    source: "colcon-cd 0.2.1 official test suite"
    description: "Validate Python source copyright and license headers"
    command: "python3 -m pytest -q test/test_copyright_license.py"
  - file: test/test_flake8.py
    source: "colcon-cd 0.2.1 official test suite"
    description: "Validate Python source style with the release-compatible flake8 toolchain"
    command: "python3 -m pytest -q test/test_flake8.py"
  - file: test/test_spell_check.py
    source: "colcon-cd 0.2.1 official test suite"
    description: "Validate spelling, word-list order, and duplicate entries"
    command: "python3 -m pytest -q test/test_spell_check.py"

test_package_tests:
  - file: test.py
    description: "Import the packaged Python extension and validate its version and package path"
    command: "python3 test.py <packaged-site-packages>"
  - file: test.sh
    description: "Source the packaged shell function and verify help, root state, package lookup, directory changes, reset, and invalid arguments"
    command: "bash test.sh <packaged-function-dir> <writable-work-dir>"

assertion_count: 7
