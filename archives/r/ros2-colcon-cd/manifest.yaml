software: ros2-colcon-cd
display: ros2-colcon-cd
description: "按 ROS 2 包名快速切换工作目录的 colcon Shell 扩展"
category: build-tool
homepage: "https://github.com/colcon/colcon-cd"
license: Apache-2.0
build_system: setuptools

ohos_adaptation:
  key_points:
    - "该项目是 Python 扩展与 Shell 函数资源包，不生成 C/C++ 二进制。"
    - "配方离线打包上游资源，并通过真实 Shell 函数测试验证目录切换行为。"
  common_dependencies:
    - python3
    - colcon-core
    - colcon-package-information

versions:
  "0.2.1":
    status: built
    build_date: "2026-07-28"
    conan_ref: "ros2-colcon-cd/0.2.1"
    notes: "本地 Conan 构建和消费者测试通过，待远端 OHOS CI 验证。"
