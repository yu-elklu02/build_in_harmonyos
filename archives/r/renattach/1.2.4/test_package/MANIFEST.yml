package: renattach/1.2.4
homepage: "https://www.pc-tools.net/unix/renattach/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# The 1.2.4 release defines the Automake check target but provides no TESTS or
# check_PROGRAMS entries. The functional coverage is supplied below.
upstream_tests: []

test_package_tests:
  - file: test_renattach.py
    description: "Version check and end-to-end MIME attachment rename"
    command: "python3 test_renattach.py <package>/bin/renattach"

assertion_count: 8
