    description: "Non-OHOS consumer test for CLI, extension imports, librsync round trip, and a local backup."
    command: "python3 test_rdiff_backup.py"
  - file: conanfile.py
    description: "OHOS consumer test verifies bin/rdiff-backup, egg-info console entry point, and signed rdiff_backup.C / rdiff_backup._librsync ELF artifacts (.codesign and PyInit symbols); upstream base subset runs during recipe build."
    command: "conan test (OHOS artifact path)"

