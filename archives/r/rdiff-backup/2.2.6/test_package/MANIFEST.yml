package: rdiff-backup/2.2.6
homepage: "https://rdiff-backup.net/"

upstream_check_command: "tox -c tox.ini -e py"
upstream_test_in_build: "yes"
upstream_test_command: "python3 testing/<subset>.py --verbose --buffer; on OHOS this runs when the platform Python shared library is available and extensions are linked against it"

