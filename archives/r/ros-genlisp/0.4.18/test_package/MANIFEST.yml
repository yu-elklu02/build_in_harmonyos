package: ros-genlisp/0.4.18
homepage: "https://github.com/ros/genlisp"

upstream_check_command: "python -m py_compile scripts/gen_lisp.py src/genlisp/*.py"
upstream_test_in_build: true
upstream_test_command: "python -m py_compile scripts/gen_lisp.py src/genlisp/*.py"
upstream_tests:
  - "source inventory validation"
  - "package.xml name/version validation"
  - "py_compile for scripts/gen_lisp.py and src/genlisp/*.py"
upstream_case_count: 3
upstream_test_note: "Full ROS generator execution requires genmsg and ROS message fixtures; the recipe validates the portable generator resources."

test_package_tests:
  - file: "test_ros_genlisp.py"
    description: "Verify packaged Python modules, generator script, templates, CMake metadata, package.xml, and run environment."
    command: "python3 test_ros_genlisp.py <package-folder>"

test_package_assertion_count: 8
assertion_count: 8
