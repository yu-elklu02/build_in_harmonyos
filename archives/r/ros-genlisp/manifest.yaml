software: ros-genlisp
display: "ros-genlisp"
description: "Common Lisp message and service generator support package for ROS 1"
category: development
homepage: "https://github.com/ros/genlisp"
license: BSD-3-Clause
build_system: python

ohos_adaptation:
  key_points:
    - "Package target-independent ROS generator Python modules, CMake extras, and message/service templates."
    - "Avoid executing ROS/genmsg generation in package tests because that requires the wider ROS runtime."
