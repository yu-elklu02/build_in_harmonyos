# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: rabbitmq-c/0.15.0
homepage: "https://github.com/alanxz/rabbitmq-c"

# 上游测试命令
upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_tables.c
    source: rabbitmq-c-0.15.0/tests/test_tables.c
    description: "Table serialization/deserialization tests"
    command: "./test_tables"
  - file: tests/test_parse_url.c
    source: rabbitmq-c-0.15.0/tests/test_parse_url.c
    description: "AMQP URL parsing tests"
    command: "./test_parse_url"
  - file: tests/test_status_enum.c
    source: rabbitmq-c-0.15.0/tests/test_status_enum.c
    description: "Status enum constants tests"
    command: "./test_status_enum"
  - file: tests/test_sasl_mechanism.c
    source: rabbitmq-c-0.15.0/tests/test_sasl_mechanism.c
    description: "SASL authentication mechanism tests"
    command: "./test_sasl_mechanism"
  - file: tests/test_merge_capabilities.c
    source: rabbitmq-c-0.15.0/tests/test_merge_capabilities.c
    description: "Client capabilities merging tests"
    command: "./test_merge_capabilities"
  - file: tests/test_basic.c
    source: rabbitmq-c-0.15.0/tests/test_basic.c
    description: "Basic API functionality tests（需运行 AMQP broker）"
    command: "./test_basic"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Basic API smoke test - verify amqp_version() returns non-zero"
    command: "./test_rabbitmq-c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: ~30
