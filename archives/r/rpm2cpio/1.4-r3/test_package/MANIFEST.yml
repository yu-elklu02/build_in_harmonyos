# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rpm2cpio/1.4-r3
homepage: "https://cgit.freebsd.org/ports/tree/archivers/rpm2cpio"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: rpm2cpio-1.4-r3/Makefile
    description: "make check - verifies rpm2cpio is installed"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 rpm2cpio 验证安装和可执行性"
    command: "rpm2cpio dummy1 dummy2"

# 测试断言总数
assertion_count: 2
