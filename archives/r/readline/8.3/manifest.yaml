software: readline
version: "8.3"
status: built
build_system: autotools
build_date: "2026-08-07"

source:
  url: "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
  sha256: "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-curses"
    - "bash_cv_termcap_lib=libncursesw"
    - "CFLAGS=-fPIC -O2"
  dependencies:
    - ncurses (system library, linked via --with-curses)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"

knowledge_gained:
  - "必须设置 CFLAGS=-fPIC -O2，否则静态库链接到共享库会报错"
  - "需要 config.guess 补丁添加 HarmonyOS 检测（config.sub 已原生支持 linux-ohos）"
  - "必须使用 --with-curses + bash_cv_termcap_lib=libncursesw 链接 ncurses 宽字符版本"
  - "系统同名库 (R26)，必须静态编译避免污染 /lib /lib64"
