software: reaver
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # Note: t6x/reaver-wps-fork-t6x is the de facto authoritative upstream
  # for reaver >= 1.5. The original project (Tactical Network Solutions)
  # only released up to v1.4 on Google Code and is no longer maintained.
  url: "https://github.com/t6x/reaver-wps-fork-t6x/archive/refs/tags/v1.6.6.tar.gz"

  # 源码校验和
  sha256: "73189782b208d12b8dddc4f29d32e1f72b1f3609e573c9ea9510deebec394583"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libpcap/1.10.6"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: "0001-shebang-umask.patch"
    description: "Fix configure shebang and umask for OHOS compatibility"
    type: portability
  - file: "0002-ualarm-fix.patch"
    description: "Replace ualarm() with setitimer() in wpsmon.c for OHOS compatibility"
    type: portability