# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: reaver/1.6.6
# Note: t6x/reaver-wps-fork-t6x is the de facto authoritative upstream
# for reaver >= 1.5. The original project (Tactical Network Solutions)
# only released up to v1.4 on Google Code and is no longer maintained.
homepage: "https://github.com/t6x/reaver-wps-fork-t6x"

# 上游测试命令 (上游没有 make check 测试)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: ""
    source: ""
    description: "reaver 上游无独立测试套件"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: 验证 reaver 和 wash 二进制存在、可执行、--help 输出含预期关键词"
    command: "sh test.sh <BIN_DIR>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4