software: remind
version: "06.02.08"
status: adapting
build_date: "2026-08-16"

source:
  url: "https://dianne.skoll.ca/projects/remind/download/OLD/remind-06.02.08.tar.gz"
  sha256: "eb69645eb64018e9a2ee10b4d6fad4744a99dbf63dd2bdad7f92d910d1f6d264"

build:
  system: autotools
  configure_options:
    - "--disable-perl-build-artifacts"
  dependencies: []

upstream_tests:
  command: "make test"
  cases: 22
  passed: 13
  status: partial
  note: "test-timezone-support passed on OHOS; test-rem previously failed when run from the source tree because the OHOS sandbox uid did not match source-tree file ownership, causing Remind's RUN_NOTOWNER safety guard. Recipe now copies tests/man into build_folder before running upstream tests so inputs are owned by the build sandbox uid; full true-device recheck pending."

test_package:
  command: "test_package/test_remind.sh"
  assertions: 4
  status: passed

patches_applied:
  - "OHOS: use /system/bin/sh for upstream shell entry points and generated src Makefile."
  - "OHOS: force readline detection off because readline is optional and not required for core CLI validation."
  - "OHOS: copy docs/WHATSNEW into the out-of-source build folder before configure because configure reads it by relative path."
  - "OHOS: relax Autoconf config.status temporary directory umask from 077 to 002 to avoid sandbox denial while writing subs1.awk."
  - "OHOS: build and install from the generated build_folder/src Makefile; run upstream test scripts from source_folder/tests with REMIND_CMD/REM2PS pointing at build outputs."
  - "OHOS: run upstream tests from a copied build_folder/tests tree, with man pages copied to build_folder/man, to avoid source-tree owner mismatch tripping Remind's RUN_NOTOWNER safety guard in sandboxed execution."
  - "OHOS: use POSIX grep patterns in test_package because toybox grep does not support grep -F."

knowledge_gained:
  - "Remind's core package is a C Autotools CLI application; Perl/Tk helper tools are optional."
  - "Official archived source for 06.02.08 is available from dianne.skoll.ca/projects/remind/download/OLD/."
  - "Remind 06.02.08 configure reads docs/WHATSNEW relative to the build directory during out-of-source builds."
  - "Autoconf config.status 0700 temp directories can be inaccessible under the OHOS Conan sandbox; patching the generated configure template avoids the denial at the source."
  - "Remind 06.02.08 has no generated top-level Makefile in the out-of-source build directory; the generated native Makefile lives under build_folder/src."
  - "Remind disables RUN for non-owned input files. Under OHOS sandboxed builds, copying upstream tests into the build tree avoids false RUN_NOTOWNER results without weakening the packaged binary's security checks."
