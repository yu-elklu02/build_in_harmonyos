software: r-base
display: "R"
description: "R 语言解释器、基础运行时与统计计算环境"
category: data
homepage: "https://www.r-project.org/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "设备原生构建，使用 flang-ohos 提供 Fortran 编译器与运行时"
