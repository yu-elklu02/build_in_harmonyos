    - "首版关闭 X11、Tcl/Tk、Java、readline、recommended packages 与可选图形依赖"
  common_dependencies:
    - zlib/1.3.1.1
    - pcre2
    - bzip2
    - xz
    - libiconv
    - curl
    - flang-ohos

versions:
