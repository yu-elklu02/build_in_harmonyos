package: r-base/4.5.1
homepage: "https://www.r-project.org/"
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests:
  - file: "tests/Makefile.in"
    source: "R-4.5.1/tests/Makefile.in"
    description: "R 核心测试套件，由顶层 make check 调用"
    command: "make -j1 check"
test_package_tests:
  - file: "run_test.sh"
    description: "复制最终 package 到新绝对路径，清空原运行环境，执行移动性、ELF 与真实 consumer 验证"
    command: "/system/bin/sh run_test.sh PACKAGE_FOLDER MOVED_FOLDER test_r.R"
  - file: "test_r.R"
    description: "验证版本、算术、PCRE2、矩阵、gzip、iconv、资源目录和真实 HTTPS"
    command: "由 run_test.sh 使用移动 package 的 bin/R 执行"
assertion_domains: 8
negative_tests:
  - "扫描 package 不含 currentUser/.conan2/build 临时路径"
  - "核验 ELF NEEDED/RPATH/RUNPATH 的移动运行时闭包"
support_scope: "解释器、基础运行时与 HTTPS；不声明下游 C/Fortran R 扩展编译支持"
