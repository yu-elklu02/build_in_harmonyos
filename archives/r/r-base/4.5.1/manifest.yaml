version: "4.5.1"
status: built
build_date: "2026-08-09"
conan_ref: "r-base/4.5.1"
source:
  url: "https://cran.r-project.org/src/base/R-4/R-4.5.1.tar.gz"
  sha256: "b42a7921400386645b10105b91c68728787db5c4c83c9f6c30acdce632e1bb70"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--without-x"
    - "--without-tcltk"
    - "--disable-java"
    - "--without-readline"
    - "--without-recommended-packages"
    - "--without-ICU"
    - "--without-libpng"
    - "--without-jpeglib"
    - "--without-libtiff"
    - "--without-cairo"
    - "--disable-openmp"
    - "--with-internal-tzcode"
    - "--with-blas=<openblas package_folder>/lib/libopenblas.so"
    - "--with-lapack"
  dependencies:
    - "zlib/1.3.1.1"
    - "pcre2/10.45.1"
    - "bzip2/1.0.8"
    - "xz/5.6.2"
    - "libiconv/1.17"
    - "curl/8.15.0"
    - "openblas/0.3.33"
    - "openssl/3.5.6.1"
    - "flang-ohos/20.1.0 (tool requirement)"
  cc: clang
  cxx: clang++
  fc: flang
patches_applied:
  - "0001-recognize-harmonyos.patch"
  - "0002-clang-c23-alignof.patch"
  - "0003-authoritative-timezone-param.patch"
  - "0004-readable-pipe-target.patch"
  - "0005-portable-subnormal-pretty-oracle.patch"
  - "0006-relocatable-r-launcher.patch"
  - "0007-relocatable-runtime-environment.patch"
  - "0008-rprof-memory-profiling-cpu-fallback.patch"
  - "0009-sed-range-relocatable-resource-dirs.patch"
knowledge_gained:
  - "R launcher 与 Rscript 必须从已验证的相邻布局解析完整 R home"
  - "最终包必须清理 Conan/build 绝对路径并自带经过 TLS 验证的 CA 信任链"
  - "最终包只声明解释器、基础运行时与 HTTPS 能力，不声明下游 C/Fortran 扩展编译支持"
  - "R 资源目录 R_SHARE_DIR/R_INCLUDE_DIR/R_DOC_DIR 需避免 install sed 全局替换固化，采用范围限定替换以保持可重定位"
  - "Rprof CPU 采样在 ITIMER_PROF 初始延迟异常时回退 elapsed ProfileThread 机制"
