sources:
  r-base:
    url: "https://cran.r-project.org/src/base/R-4/R-4.5.1.tar.gz"
    sha256: "b42a7921400386645b10105b91c68728787db5c4c83c9f6c30acdce632e1bb70"
  curl:
    url: "https://curl.se/download/curl-8.15.0.tar.gz"
    sha256: "d85cfc79dc505ff800cb1d321a320183035011fa08cb301356425d86be8fc53c"
patches:
  - patch_file: "patches/0001-recognize-harmonyos.patch"
    patch_description: "让 GNU config.guess 将 HarmonyOS aarch64 原生环境识别为 linux-musl"
    patch_type: "portability"
  - patch_file: "patches/0002-clang-c23-alignof.patch"
    patch_description: "兼容 Clang 18 前 gnu2x 模式未将 alignof 实现为关键字的能力差异"
    patch_type: "portability"
  - patch_file: "patches/0003-authoritative-timezone-param.patch"
    patch_description: "以权威 parameter 时区值探测候选目录并优先选择包含该 IANA 文件的 R internal zoneinfo"
    patch_type: "portability"
  - patch_file: "patches/0004-readable-pipe-target.patch"
    patch_description: "PR#14861 pipe 回归测试按运行时能力选择可枚举目录并保留 close() 退出状态断言"
    patch_type: "test"
  - patch_file: "patches/0005-portable-subnormal-pretty-oracle.patch"
    patch_description: "回移 R trunk r88881 对极小 subnormal pretty 测试的正式跨平台数值性质边界"
    patch_type: "test"
  - patch_file: "patches/0006-relocatable-r-launcher.patch"
    patch_description: "让 public 与 internal bin/R 从 launcher 相对位置识别可移动 R home"
    patch_type: "portability"
  - patch_file: "patches/0007-relocatable-runtime-environment.patch"
    patch_description: "从已验证 R home 派生资源目录并启用 package-owned CA bundle"
    patch_type: "portability"
  - patch_file: "patches/0008-rprof-memory-profiling-cpu-fallback.patch"
    patch_description: "检测 setitimer(ITIMER_PROF) 初始延迟异常并回退到 elapsed ProfileThread 采样机制以避免 Rprof memory profiling 空事件"
    patch_type: "portability"
  - patch_file: "patches/0009-sed-range-relocatable-resource-dirs.patch"
    patch_description: "Makefile.in install sed 全局替换覆盖 re-derive 块，改为范围限定只替换首次出现"
    patch_type: "portability"
