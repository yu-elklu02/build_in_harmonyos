# 版本级 manifest
# 文件位置: archives/r/rsgain/3.6-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.6-r2"

# 软件名
software: "rsgain"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-22"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/complexlogic/rsgain/releases/download/v3.6/rsgain-3.6-source.tar.xz"

  # 源码校验和
  sha256: "26d46f1240a83366e82cbc9121a467fc1dcc977c7adfb4e15c99ead6b3d07ec8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "FFmpeg: --disable-everything --enable-decoder=mp3float,flac,vorbis,opus,aac,wmav1,wmav2,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,alac,wavpack,ape,tak,mpc7,mpc8 --enable-demuxer=mp3,flac,ogg,mov,mp4,aiff,wav,wv,ape,mpc,asf --enable-protocol=file --enable-filter=aresample --enable-swresample --disable-doc --disable-programs --disable-shared --enable-static --disable-avdevice --disable-avfilter --disable-swscale --disable-zlib --disable-iconv --disable-vulkan"
    - "taglib: -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DWITH_ZLIB=OFF"
    - "libebur128: -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=OFF"
    - "fmt: -DFMT_DOC=OFF -DFMT_TEST=OFF -DBUILD_SHARED_LIBS=OFF"
    - "inih: 直接编译 ini.c + INIReader.cpp 为静态库"
    - "rsgain: 直接 clang++ -std=c++20 编译 5 个 .cpp 文件，静态链接所有依赖"

  # 编译依赖列表（格式: name/version）
  # 所有依赖内嵌构建，不从 Conan 制品仓获取
  dependencies:
    - "ffmpeg/8.1.2 (内嵌)"
    - "taglib/2.3 (内嵌)"
    - "libebur128/1.2.6 (内嵌)"
    - "inih/r58 (内嵌)"
    - "fmt/10.2.1 (内嵌)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-ffmpeg-configure-harmonyos.patch"
  - "patches/0002-locate-presets-relative-to-executable.patch"
  - "patches/0003-libebur128-cmake-minimum-required-3.5.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rsgain 的 5 个依赖（FFmpeg/taglib/libebur128/inih/fmt）在 OHOS Conan 制品仓中均不存在，采用内嵌构建方案"
  - "OHOS clang 15 不支持 C++23 std::format，必须使用 fmt 库（不定义 USE_STD_FORMAT）"
  - "rsgain upstream 使用 CMake + pkg-config 查找依赖，内嵌构建时绕过 CMake 直接编译 5 个 .cpp 文件更简单"
  - "FFmpeg configure 需要 harmonyos target_os 补丁（与 unpaper/ffprobe 相同的 portability 补丁）"
  - "config.h 需手动生成（替换 CMake 的 configure_file），包含 PROJECT_NAME/EXECUTABLE_TITLE/PROJECT_VERSION/PROJECT_URL/BUILD_DATE"
  - "preset 目录必须在运行时通过 /proc/self/exe 相对定位，不能把 Conan build 阶段的 package_folder 编译进二进制"
  - "rsgain 源码中 tag.cpp 通过相对路径 #include \"external/CRC.h\" 引用 CRC++ 库"
  - "静态链接时库顺序：rsgain objects → -ltag -lebur128 -linih -lfmt → -lpthread -lm -ldl → av_libs"
  - "OHOS 仅提供共享 libz.so 无 libz.a，-static 链接需禁用 zlib/iconv：FFmpeg --disable-zlib --disable-iconv，taglib -DWITH_ZLIB=OFF"
