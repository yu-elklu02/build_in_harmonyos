patches:
  - patch_file: "patches/0001-ffmpeg-configure-harmonyos.patch"
    base_path: "ffmpeg"
    patch_description: "为 FFmpeg configure 增加 harmonyos 目标平台支持（OHOS worker uname 报告 HarmonyOS，configure 原生不识别该 OS）"
    patch_type: "portability"
  - patch_file: "patches/0002-locate-presets-relative-to-executable.patch"
    base_path: "."
    patch_description: "运行时根据 /proc/self/exe 定位包内 share/rsgain/presets，避免 Conan 临时 package_folder 路径失效"
    patch_type: "portability"
  - patch_file: "patches/0003-libebur128-cmake-minimum-required-3.5.patch"
    base_path: "libebur128"
    patch_description: "将 libebur128 CMakeLists.txt 与 test/CMakeLists.txt 的 cmake_minimum_required 从 2.8.12 提升到 3.5，兼容 CMake 4.x（CMake 4.0 移除了对 < 3.5 的兼容，CMAKE_POLICY_VERSION_MINIMUM 无法绕过该硬性检查）"
    patch_type: "portability"
