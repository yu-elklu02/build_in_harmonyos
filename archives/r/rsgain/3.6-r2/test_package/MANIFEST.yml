package: rsgain/3.6-r2
homepage: "https://github.com/complexlogic/rsgain"

upstream_check_command: "cmake --build build && ctest --test-dir build"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build"

upstream_tests:
  - file: NONE
    source: "rsgain 源码包未提供 ctest 测试套件（CMakeLists.txt 中无 enable_testing()/add_test()）"
    description: "upstream 依赖手动测试（README 中描述的 `cmake .. -DCMAKE_BUILD_TYPE=Release` + `./rsgain` 验证方式），无自动化测试"
    command: "N/A"

test_package_tests:
  - file: test.sh
    description: "conanfile.py 在 conanrun 环境调用 test.sh：运行 rsgain --version 验证所有依赖库正确链接和初始化；再从空 HOME 执行 rsgain easy --preset default，验证包内 preset 相对路径定位、FFmpeg 解码链路和 libebur128 响度测量"
    command: "rsgain --version / HOME=$PWD/preset-home rsgain easy --preset default ."

assertion_count: 3
