# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: roswell/24.10.115
homepage: "https://github.com/roswell/roswell"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/tsv-sbcl-bin.c
    source: roswell-24.10.115/src/tsv-sbcl-bin.c
    description: "make check 构建 tsv_sbcl 测试程序（解析 tsv-sbcl-bin 表，验证 sbcl 二进制 URL 解析）"
    command: "./tsv_sbcl"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 ros --version 验证可执行性与版本号；运行 ros help 冒烟测试"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
