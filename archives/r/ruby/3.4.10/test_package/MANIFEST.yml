# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ruby/3.4.10
homepage: "https://www.ruby-lang.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: bootstraptest/
    source: ruby-3.4.10/bootstraptest/
    description: "Ruby bootstraptest 语法/语义测试（本地执行，test_fork.rb 因鸿蒙 fork 限制跳过）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ruby.sh
    description: "L1 smoke test: ruby 版本 + openssl/yaml/fiddle 扩展 + socket/json 标准库加载验证"
    command: "./test_ruby.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
