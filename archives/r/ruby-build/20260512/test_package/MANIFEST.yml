# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ruby-build/20260512
homepage: "https://github.com/rbenv/ruby-build"

# 上游测试命令 (bats 测试框架)
upstream_check_command: "bats test/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (bats 测试文件)
upstream_tests:
  - file: test/arguments.bats
    source: ruby-build-20260512/test/arguments.bats
    description: "命令行参数解析测试"
    command: "bats test/arguments.bats"
  - file: test/version.bats
    source: ruby-build-20260512/test/version.bats
    description: "版本输出测试"
    command: "bats test/version.bats"
  - file: test/installer.bats
    source: ruby-build-20260512/test/installer.bats
    description: "安装器测试"
    command: "bats test/installer.bats"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 ruby-build --version 输出正确版本号"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
