# test_package/MANIFEST.yml — robin-map/1.4.1
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: robin-map/1.4.1
homepage: "https://github.com/Tessil/robin-map"

# Upstream provides a Boost.Test suite under tests/. The Conan build compiles
# all five upstream test translation units and executes the resulting binary.
upstream_check_command: "./tsl_robin_map_tests --log_level=test_suite"
upstream_test_in_build: true
upstream_test_command: "./tsl_robin_map_tests --log_level=test_suite"

upstream_tests:
  - file: custom_allocator_tests.cpp
    source: robin-map-1.4.1/tests/custom_allocator_tests.cpp
    description: "Custom allocator behavior"
    command: "./tsl_robin_map_tests --run_test=test_custom_allocator"
  - file: policy_tests.cpp
    source: robin-map-1.4.1/tests/policy_tests.cpp
    description: "Growth policy parameterized tests"
    command: "./tsl_robin_map_tests --run_test=test_policy"
  - file: robin_map_tests.cpp
    source: robin-map-1.4.1/tests/robin_map_tests.cpp
    description: "robin_map API, lifecycle, lookup, erase and serialization tests"
    command: "./tsl_robin_map_tests --run_test=test_robin_map"
  - file: robin_set_tests.cpp
    source: robin-map-1.4.1/tests/robin_set_tests.cpp
    description: "robin_set API and serialization tests"
    command: "./tsl_robin_map_tests --run_test=test_robin_set"

test_package_tests:
  - file: main.cpp
    description: "Homebrew-equivalent: insert {1:one, 2:two} into tsl::robin_map; assert size==2, map[1]=='one', map[2]=='two'; print"
    command: "./robinmap_test"

# Boost.Test reports 132 expanded upstream cases. The consumer smoke test has
# three explicit correctness checks.
upstream_test_count: 132
test_package_test_count: 1
assertion_count: 3
