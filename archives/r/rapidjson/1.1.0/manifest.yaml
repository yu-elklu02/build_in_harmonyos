software: rapidjson
version: 1.1.0
status: adapting
build_system: cmake
build_type: header-only
created_at: 2026-04-26
completed_at: 2026-07-16
knowledge_gained:
  - "header-only 库的特殊处理方式"
  - "CMake 不识别 HarmonyOS 的解决方案"
  - "header-only 库的 Conan 配方 package_type=header-library"
patches_applied: []
build_log: logs/build.log
source:
  url: "https://github.com/Tencent/rapidjson/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "bf7ced29704a1e696fbccf2a2b4ea068e7774fa37f6d7dd4039d0787f8bed98e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DRAPIDJSON_BUILD_DOC=OFF"
    - "-DRAPIDJSON_BUILD_EXAMPLES=OFF"
    - "-DRAPIDJSON_BUILD_TESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

install_files:
  - "include/rapidjson/*.h"
  - "lib/cmake/RapidJSON/*.cmake"

package_files:
  - "rapidjson-1.1.0-ohos-aarch64.tar.gz"