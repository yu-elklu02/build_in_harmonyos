# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rapidjson/1.1.0
homepage: "https://rapidjson.org/"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "cmake -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DRAPIDJSON_BUILD_TESTS=ON -DRAPIDJSON_BUILD_DOC=OFF -DRAPIDJSON_BUILD_EXAMPLES=OFF -DRAPIDJSON_BUILD_THIRDPARTY_GTEST=ON && cmake --build . --target unittest && ./bin/unittest"

# 上游 GTest 套件在 test_package/test() 中编译并执行。
# 主配方 build() 保留 pass (header-only 库无构建步骤)。
# 上游测试放在 test_package 而非主配方 build() 的原因：
#   rapidjson 是 package_type="header-library"，Conan 2 在 binary 缓存命中时
#   (Already installed!) 会跳过 build()/package() 整个 lifecycle，导致放在
#   build() 里的上游测试逻辑从不执行 (discovered=0/executed=0/incomplete)。
#   test_package 的 test() 方法每次 conan create 都执行，不受 binary 缓存
#   影响，是 header-only 库跑上游测试的唯一可靠 lifecycle hook。
upstream_test_in_build: false
upstream_test_in_test_package: true
upstream_test_command: "cmake --build . --target unittest && ./bin/unittest"

# 上游实际运行的测试程序
# RapidJSON upstream uses Google Test with ~30 source files under test/unittest/
# all compiled into a single `unittest` binary. Single entry avoids duplicate CI runs.
# Google Test 1.8.1 sources are vendored into thirdparty/gtest/googletest so the
# upstream FindGTestSrc.cmake find-module locates them (the release tarball ships
# an empty thirdparty/gtest git submodule).
upstream_tests:
  - file: test/unittest/*.cpp
    source: rapidjson-1.1.0/test/unittest/
    description: "All upstream Google Test suites (approx 30 test source files)"
    command: "./bin/unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_package.cpp
    description: "Downstream consumer test — parse, access, generate JSON"
    command: "./test_rapidjson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
