# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: rizin/0.8.1
homepage: "https://rizin.re"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# Rizin v0.8.1 用 meson test 驱动，含 unit + integration 两套，共 125+ 项。
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试由 meson test 单独驱动，不在 conanfile build() 内重复
upstream_test_in_build: false
upstream_test_command: "meson test -C build"

# 上游实际运行的测试程序（节选代表性，完整清单见 meson test --list 输出 126 项）
upstream_tests:
  - file: test/unit/test_addr.c
    source: rizin-0.8.1/test/unit/test_addr.c
    description: "RzAddressInterval 单元测试"
    command: "./test/unit/test_addr"
  - file: test/unit/test_analysis_function.c
    source: rizin-0.8.1/test/unit/test_analysis_function.c
    description: "RzAnalysisFunction 分析单元测试"
    command: "./test/unit/test_analysis_function"
  - file: test/unit/test_bin.c
    source: rizin-0.8.1/test/unit/test_bin.c
    description: "RzBin 二进制格式识别单元测试"
    command: "./test/unit/test_bin"
  - file: test/integration/test_analysis_fcn.c
    source: rizin-0.8.1/test/integration/test_analysis_fcn.c
    description: "函数分析集成测试"
    command: "./test/integration/test_analysis_fcn"
  - file: test/integration/test_bin.c
    source: rizin-0.8.1/test/integration/test_bin.c
    description: "rz-bin 集成测试"
    command: "./test/integration/test_bin"

# test_package 中自带的测试 (消费者视角验证)
# 链接 librz_core 调用 rz_core_new/rz_core_open API（R34 实质依赖）
test_package_tests:
  - file: test.c
    description: "消费者测试: rz_core API 集成验证"
    command: "./test_rizin"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 unit + integration 共 126 个测试目标，每个含多个断言；保守估计 ≥500
assertion_count: 500
