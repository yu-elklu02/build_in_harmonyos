# 上游测试数据：官方 release 源码包不含 test/bins（上游 test/README.md 明确
# "bins/: Sample binaries (fetched from the external repository
# rizinorg/rizin-testbins)"，上游 CI 用 `git clone rizin-testbins test/bins`）。
# integration 测试以 test/ 为 workdir 打开 "bins/..." 文件，缺数据即失败。
# 此处固定 rizin-testbins 提交 85a4965（2026-07-09）的归档，sha256 校验一致。
test_bins:
  url:
    - "https://gh-proxy.com/https://codeload.github.com/rizinorg/rizin-testbins/tar.gz/85a4965be7c034db8b4fea160c3235128ecec0ac"
    - "https://codeload.github.com/rizinorg/rizin-testbins/tar.gz/85a4965be7c034db8b4fea160c3235128ecec0ac"
  sha256: "64266f1981a578dee2320c07695bbfd732d1d94fa194adda3891200a5aaf8852"

patches:
  - patch_file: "patches/0001-librz-debug-meson.build.patch"
    patch_description: "librz/debug/meson.build extend linux/android branch with 'harmonyos' so linux_debug.c/linux_coredump.c compile in"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-librz-include-rz_userconf.h.in.patch"
    patch_description: "rz_userconf.h.in add HAVE_PTHREAD_SETCANCELSTATE slot so meson probe result propagates to thread.c guard"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-librz-util-thread.c.patch"
    patch_description: "librz/util/thread.c guard pthread_setcancelstate/type with HAVE_PTHREAD_SETCANCELSTATE feature probe (HarmonyOS bionic libc lacks POSIX thread cancel API)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-meson.build.patch"
    patch_description: "meson.build add has_function('pthread_setcancelstate') probe so HAVE_PTHREAD_SETCANCELSTATE resolves on HarmonyOS"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-meson.build.patch"
    patch_description: "meson.build exclude 'harmonyos' from SUPPORTS_PCRE2_JIT heuristic: ohpcd/conancenter pcre2 预构建二进制不含 JIT（pcre2_jit_compile 返回 bad JIT option、pcre2_jit_stack_create 返回 NULL），rz_regex_new_multi 因 jit_stack 创建失败返回 NULL 致字符串搜索集合 add 失败；改用 pcre2 解释器（与 darwin/serenity 同款排除），上游测试语义不变"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-rz-path-prefix-env.patch"
    patch_description: "librz/util/path.c rz_path_system 支持 RZ_PREFIX 环境变量覆盖编译期前缀（与 rz_core_config_init 中 dir.prefix 的 RZ_PREFIX env 处理一致；覆盖只放在 rz_path_system，rz_path_prefix 保持返回编译期 RZ_PREFIX，因为 test/unit/test_util.c test_path_prefix 断言 strcmp(rz_path_prefix(), RZ_PREFIX)==0）：本配方 meson 编译期 --prefix=/，测试二进制 rz_path_system(RZ_SDB_TYPES) 会解析到设备上不存在的 /share/rizin/types，导致 test_parse_dwarf_types（typedb 无基础类型 → union unaligned 未创建）与 analysis_graph（printf 签名缺失 → format 参数检测不触发 → str.d 字符串 flag 未创建）失败；测试命令注入 RZ_PREFIX={rzstage} 后系统数据目录落到 stage 内 share/rizin/types，上游测试语义不变"
    patch_type: "portability"
    strip: 1
