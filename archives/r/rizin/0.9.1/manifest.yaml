# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 release 源码包，含内置 subprojects）
  url: "https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-src-v0.9.1.tar.xz"

  # 源码校验和
  sha256: "7ac1cd7daca7afdda742e15478b1f747fc1f813e496fee71839d1e109e543dca"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "use_sys_pcre2=enabled"
    - "use_sys_magic=enabled"
    - "use_sys_zlib=enabled"
    - "use_sys_lz4=enabled"
    - "use_sys_libzstd=enabled"
    - "use_sys_openssl=disabled"
    - "use_sys_capstone=disabled"
    - "use_sys_libzip=disabled"
    - "use_sys_lzma=disabled"
    - "use_sys_xxhash=disabled"
    - "use_sys_libmspack=disabled"
    - "use_sys_tree_sitter=disabled"
    - "use_sys_softfloat=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "pcre2/10.45.1"
    - "file/5.48"
    - "zlib/1.3.1.1"
    - "lz4/1.10.0"
    - "zstd/1.5.7"

  # 编译器
  cc: clang
  cxx: clang++

