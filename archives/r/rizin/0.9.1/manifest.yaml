  - "0002-librz-include-rz_userconf.h.in.patch"
  - "0003-librz-util-thread.c.patch"
  - "0004-meson.build.patch"
  - "0005-meson.build.patch"
  - "0006-rz-path-prefix-env.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS bionic/musl libc 不实现 POSIX 线程取消 API（pthread_setcancelstate/type），需 meson has_function 探测 + 宏守卫（R8 合规）"
  - "meson 默认 use_sys_* 全 disabled，v0.9.1 官方 release tarball 已内置 subprojects 源码，无需 git 预克隆"
  - "pcre2 JIT：ohpcd 预构建 pcre2 二进制不含 JIT（包 ID 按 settings-only 计算，support_jit 选项无法改变所选二进制），而 rizin 按平台启发式无条件定义 SUPPORTS_PCRE2_JIT（aarch64+clang），致 pcre2_jit_compile='bad JIT option'、pcre2_jit_stack_create=NULL、rz_regex_new_multi 返回 NULL、字符串搜索集合 add 失败；修法：补丁把 'harmonyos' 加入 JIT 排除列表（与 darwin/serenity 同款），全量 regex 走解释器"
  - "上游 CI 先 meson install（--prefix=$HOME）再跑 meson test，主题/数据经 RZ_PREFIX 可达；conan 编译期 prefix=/（DESTDIR 打包），build() 内 stage meson install 产物并以 HOME=stage + .local/share/rizin 符号链接供给测试数据（autocmplt 主题补全）"
  - "测试二进制经 rz_path_system(RZ_SDB_TYPES) 解析 types sdb 数据目录：编译期 prefix=/ 时该路径为设备上不存在的 /share/rizin/types，导致 test_parse_dwarf_types（typedb 无基础类型 → struct member missing type → union unaligned 未创建）与 analysis_graph（typedb 无 printf 签名 → format 参数检测不触发 → 2 字符字符串 %d 因 minlen=4 不产生 str.d flag）失败；修法：patch 0006 让 rz_path_system 优先读 RZ_PREFIX 环境变量（与 rz_core_config_init 中 dir.prefix 的 RZ_PREFIX env 处理一致），测试命令注入 RZ_PREFIX={rzstage} 后系统数据目录落到 stage 内 share/rizin/types；RZ_PREFIX 覆盖不能放 rz_path_prefix——test/unit/test_util.c test_path_prefix 断言 strcmp(rz_path_prefix(), RZ_PREFIX)==0（真机实测 line 73 expected 0, got 115），覆盖放 rz_path_system 后该断言恢复且 types 数据仍可达"
  - "官方 release 源码包不含 test/bins（上游 test/README.md：样本取自 rizinorg/rizin-testbins 独立仓库，CI 为 git clone 到 test/bins），integration 测试缺数据即失败，source() 需拉取固定提交归档解到 test/bins"

