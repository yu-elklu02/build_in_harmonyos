# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: rpl/1.14
homepage: "https://github.com/rrthomas/rpl"

# Upstream test command
upstream_check_command: "make test"

# Upstream tests not run in build (Python tool; pytest suite not in release tarball)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: conanfile.py
    description: "Run rpl --version and verify actual string replacement"

# Test assertion count
assertion_count: 2
