software: resolvconf
display: "resolvconf"
description: "name server information handler — framework for keeping up to date the system's information about name servers"
category: network
homepage: "https://salsa.debian.org/debian/resolvconf"
license: GPL-2+
build_system: debhelper

ohos_adaptation:
  key_points:
    - "Pure shell-script network configuration tool, no compilation required"
    - "Main executable resolvconf installed to bin/"
    - "Helper scripts (list-records, normalize-resolvconf) installed to lib/resolvconf/"
    - "Configuration files installed to share/resolvconf/etc/"
    - "RESOLVCONF_BIN and RESOLVCONF_LIB exported via runenv_info"
  common_dependencies: []

versions:
  "1.95":
    status: built
    build_date: "2026-07-27"
