# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: resolvconf/1.95
homepage: https://salsa.debian.org/debian/resolvconf

# resolvconf 上游构建时测试
upstream_check_command: "resolvconf --help"
# build() 方法为 pass（纯 shell 脚本工具，无编译步骤），未集成上游测试
upstream_test_in_build: false
upstream_test_command: "debian/test-normalization"

# 上游测试程序
upstream_tests:
  - file: debian/test-normalization
    description: "测试 normalize-resolvconf sed 脚本 (22 个断言)"
  - file: debian/test-correct-interface-order
    description: "测试 interface-order 一致性 (1 个断言)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 resolvconf 安装、--help 输出和 normalize-resolvconf 逻辑"
    command: "conan test . resolvconf/1.95"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
