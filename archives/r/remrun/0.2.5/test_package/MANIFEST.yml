package: remrun/0.2.5
homepage: "https://gitlab.com/ppentchev/remrun"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: tests/test-data/tests.json
    source: tests/test-data/tests.json
    description: "14 SSH functional scenarios covering missing files, noop mode, remote execution, checksum command selection, stdin handling, failure propagation, and argument forwarding"
    command: "make test"

upstream_excluded_tests:
  - source: tests/test-data/tests.json
    reason: "The upstream suite requires an sshd-backed functional test environment. It was executed separately with make test in a Linux Docker/OpenSSH environment and passed 14/14 scenarios; it is not rerun inside the Conan build step to avoid making OpenSSH server and ShellCheck package build dependencies."
  - source: rust/generate-tests/
    reason: "Rust workspace tools are used to generate tests, not to build the packaged remrun shell script."

test_package_tests:
  - file: test_remrun.sh
    id: A1
    description: "Verify --version reports remrun 0.2.5."
    command: "remrun --version"
  - file: test_remrun.sh
    id: A2
    description: "Verify --features reports remrun and hostspec feature versions."
    command: "remrun --features"
  - file: test_remrun.sh
    id: A3
    description: "Verify --help prints usage without SSH."
    command: "remrun --help"
  - file: test_remrun.sh
    id: A4
    description: "Verify invalid long option is rejected."
    command: "remrun --bad-option"
  - file: test_remrun.sh
    id: A5
    description: "Verify nonexistent local file fails before SSH."
    command: "remrun host /nonexistent"
  - file: test_remrun.sh
    id: A6
    description: "Verify -s is rejected with stdin script input."
    command: "remrun -s host -"

test_package_test_count: 6
assertion_count: 12
