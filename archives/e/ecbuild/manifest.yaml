software: ecbuild
display: "ecBuild"
description: "ECMWF 的 CMake 构建系统（纯 CMake 模块集，无库无头）"
category: build-tool
homepage: "https://github.com/ecmwf/ecbuild"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 CMake 模块包：无库无头，须用 cmake_build_modules 让下游 config 主动 include 上游入口"
    - "宏靠**重定义 project()** 注入，find_package(ecbuild) 必须写在 project() 之前"
    - "project() 要求带 VERSION 参数，否则 ecbuild_critical"
    - "OS 白名单不认 HarmonyOS：补丁让其按 linux 处理（Linux 内核 + musl，/proc 齐备）"
  common_dependencies: []

versions:
  "3.15.0":
    status: built
    build_date: "2026-08-02"
