knowledge_gained:
  - "OHOS SDK 的 LLVM 15 仅包含共享库(.so)，不包含 LLVM TableGen 组件"
  - "Enzyme 的 enzyme-tblgen 工具需要 LLVM TableGen 运行时，无法在 OHOS SDK 中构建"
  - "需跳过 enzyme-tblgen 构建，提供预生成的 .inc 文件"
  - "LLVM 的 cmake 配置(LLVMExports.cmake)引用不存在的 .a 静态库，需创建 stub 或使用共享库模式"

