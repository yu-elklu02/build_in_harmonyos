# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: enzyme/0.0.284
homepage: "https://enzyme.mit.edu"

# 上游测试 — Enzyme 使用 LLVM lit 测试框架
# 测试位于 enzyme/test/ 目录下，含 ReverseMode/ForwardMode/BatchMode/ActivityAnalysis/BCLoader 等套件
# 统计命令: find enzyme/test -type f | wc -l → 1523；主要测试源文件(.ll/.c/.cpp/.cu/.f90/.mlir/.rs) → 1471；.ll 文件 → 1180
# 入口: enzyme/test/CMakeLists.txt、lit.cfg.py、lit.site.cfg.py.in、ninja check-enzyme、llvm-lit/lit
upstream_check_command: "ninja check-enzyme"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：OHOS SDK LLVM 15 缺 lit/llvm-lit/llvm-tblgen，build() 已跳过 enzyme/test 子目录
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 由于 OHOS SDK LLVM 15 不包含 lit/llvm-lit/llvm-tblgen/FileCheck 完整工具链，上游测试无法在 OHOS CI 中运行
# 上游测试通过率: 0/1523（未执行/未全量执行）
upstream_tests:
  - file: enzyme/test/
    source: enzyme-0.0.284/test/
    description: "LLVM lit 测试体系，1523 个测试相关文件（1471 主要 .ll/.c/.cpp/.cu/.f90/.mlir/.rs，含 1180 .ll），覆盖 ReverseMode/ForwardMode/BatchMode/ActivityAnalysis/BCLoader"
    command: "lit enzyme/test/"

# test_package 中自带的测试 (消费者视角验证，仅统计替代验证，不覆盖上游 lit 未执行)
# R34 compliant: 未采用 dlopen/dlsym/实际调用，以避免 OHOS SDK LLVM relocation 缺口；采用 nm -D 静态符号检查 llvmGetPassPluginInfo 存在性
test_package_tests:
  - file: test.c
    description: "nm -D 检查 libLLVMEnzyme-15.so 中 llvmGetPassPluginInfo 符号存在性（统计，不触发 OHOS SDK LLVM relocation 缺口）"
    command: "./test_enzyme"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
