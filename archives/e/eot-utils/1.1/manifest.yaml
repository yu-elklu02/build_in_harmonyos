knowledge_gained:
  - "autoconf 2.68 generated config.status uses umask 077 for temp dirs, which fails on HMDFS due to uid mapping (process uid != file owner uid). Fix: change umask 077 to umask 007 in configure to allow group-write."
  - "make -j2 fails with 'jobserver mkfifo: Operation not permitted' on HMDFS. Use make -j1 instead."
  - "autoconf regeneration triggered by timestamp mismatch needs touch to fix (configure.in < configure < config.status < Makefile)."

