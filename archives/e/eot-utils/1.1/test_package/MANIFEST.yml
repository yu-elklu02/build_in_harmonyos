# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: eot-utils/1.1
homepage: "https://www.w3.org/Tools/eot-utils/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# eot-utils 1.1 has no test suite (make check returns exit 0 with no tests)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: runs mkeot (TTF→EOT) and eotinfo (EOT header parse) with real system font
test_package_tests:
  - file: conanfile.py
    description: "mkeot + eotinfo 端到端功能测试：用系统 TTF 字体生成 EOT 并解析"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
