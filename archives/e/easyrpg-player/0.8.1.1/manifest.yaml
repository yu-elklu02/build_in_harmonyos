software: easyrpg-player
version: 0.8.1.1
status: built
build_system: cmake
configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DPLAYER_BUILD_EXECUTABLE=ON"
  - "-DPLAYER_BUILD_LIBLCF=ON"
  - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF"
dependencies:
  - fmt 8.1.1
  - vorbis 1.3.7
  - ogg 1.3.5
  - inih r58
  - expat 2.7.1
  - icu4c 77
  - zlib 1.3.1
  - sdl2 2.30.0
  - pixman 0.46.4
  - freetype 2.14.3
  - libpng 1.6.43
  - liblcf 0.8.1 (built from source via PLAYER_BUILD_LIBLCF)
build_date: 2026-08-06
compiler: clang 15.0.4
notes: |
  Conan adaptation. Dependencies via ohpcd conan: fmt, vorbis, ogg, inih, expat, icu4c, zlib.
  Dependencies via cmd-pkgs: sdl2, pixman, freetype, libpng.
  liblcf built from source (PLAYER_BUILD_LIBLCF=ON) because cmd-pkg liblcf was built without INI/XML/ICU support.
  Executable: easyrpg-player (42MB unstripped).
  Version verification: EasyRPG Player 0.8.1.1.
