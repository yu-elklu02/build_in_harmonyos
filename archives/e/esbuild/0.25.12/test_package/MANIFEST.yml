# test_package MANIFEST — esbuild 0.25.12
# L1 test: run esbuild --version and bundle a simple JS file

test_type: "functional"
upstream_tests:
  - name: "esbuild --version"
    description: "Verify esbuild binary runs and reports version"
    source: "https://github.com/evanw/esbuild/blob/v0.25.12/cmd/esbuild/main.go"
    command: "esbuild --version"
    expected_output: "0.25.12"
  - name: "esbuild bundle"
    description: "Bundle a simple JavaScript file"
    source: "https://github.com/evanw/esbuild/blob/v0.25.12/cmd/esbuild/main.go"
    command: "esbuild test.js --bundle --outfile=out.js"
    expected_output: "bundled output file"
adapted_tests:
  - name: "L1 version check"
    description: "Run esbuild --version on HarmonyOS"
    method: "conan test_package"
  - name: "L1 bundle test"
    description: "Bundle a simple JS file with esbuild on HarmonyOS"
    method: "conan test_package"
