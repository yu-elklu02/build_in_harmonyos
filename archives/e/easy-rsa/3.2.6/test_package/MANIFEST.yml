# test_package/MANIFEST.yml
# Upstream official test declaration
# CI (build_and_test.sh L0e) requires this file

package: easy-rsa/3.2.6
homepage: "https://github.com/OpenVPN/easy-rsa"

# Upstream test command (wop-test.sh — without OpenVPN test)
upstream_check_command: "sh wop-test.sh"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: wop-test.sh
    source: easy-rsa-3.2.6/wop-test.sh
    description: "POSIX shell integration test — creates PKI, builds CA, issues certs"
    command: "sh wop-test.sh"
  - file: op-test.sh
    source: easy-rsa-3.2.6/op-test.sh
    description: "Unit test runner — downloads external test suite from easyrsa-unit-tests repo"
    command: "sh op-test.sh"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: easyrsa --version, init-pki, build-ca nopass"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 8
