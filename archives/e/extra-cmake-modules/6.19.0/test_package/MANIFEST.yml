# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: extra-cmake-modules/6.19.0
homepage: https://api.kde.org/ecm/

# ECM 是纯 CMake 模块包（无 C/C++ 库），上游 autotests 需 Qt6 + Perl，
# 在鸿蒙制品仓 CI 上无法跑（Qt6 未发布），跳过上游自检。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 测试实质调用被测包 API — find_package(ECM) + ECMSetupVersion
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(ECM REQUIRED CONFIG) + include(ECMSetupVersion) + ecm_setup_version() — 验证 ECM .cmake 模块已正确安装且可被 find_package 发现，宏可调用"
    command: "cmake --configure"

# 测试断言总数 (find_package 成功 + ECMSetupVersion include 通过 + ecm_setup_version 宏可调用 + test_ecm 退出码 0)
assertion_count: 4
