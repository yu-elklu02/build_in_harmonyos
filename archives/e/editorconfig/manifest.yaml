software: editorconfig
display: "EditorConfig Core C"
description: "C library and command-line tool for EditorConfig file parsing"
category: build-tool
homepage: "https://editorconfig.org/"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build and package the shared library plus CLI with an origin-relative RUNPATH"
    - "Fetch the exact upstream test gitlink omitted from the release tag archive"
    - "Keep installed pkg-config metadata relocatable"
  common_dependencies:
    - pcre2/10.45

versions:
  "0.12.9":
    status: built
    build_date: "2026-07-20"
