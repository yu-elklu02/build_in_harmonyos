package: editorconfig/0.12.9
homepage: "https://editorconfig.org/"

upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"
upstream_tests:
  - file: tests/meta/CMakeLists.txt
    description: "Test-suite metadata and shared test configuration"
  - file: tests/glob/CMakeLists.txt
    description: "EditorConfig glob matching cases"
  - file: tests/properties/CMakeLists.txt
    description: "Property normalization and default-value cases"
  - file: tests/parser/CMakeLists.txt
    description: "EditorConfig syntax parser cases"
  - file: tests/filetree/CMakeLists.txt
    description: "Parent traversal, root, path, and unset cases"
  - file: tests/cli/CMakeLists.txt
    description: "Version switches and multi-file CLI behavior"

test_package_tests:
  - file: unit_test.c
    description: "4 C API unit cases for version, handle state, config filename, and parse errors"
    command: "ctest --output-on-failure --no-tests=error"
  - file: test.c
    description: "Read the library version, parse a real .editorconfig file, and validate returned properties"
    command: "./test_editorconfig"

assertion_count: 38
