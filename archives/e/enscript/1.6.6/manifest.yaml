software: enscript
version: "1.6.6"
status: built
build_date: "2026-07-13"

source:
  url: "https://ftp.gnu.org/gnu/enscript/enscript-1.6.6.tar.gz"
  sha256: "6d56bada6934d055b34b6c90399aa85975e66457ac5bf513427ae7fc77f5c0bb"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=${PREFIX}"
    - "--disable-nls"
    - "SHELL=${bash}"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.sub-linux-ohos.patch"
  - "0003-ohos-tmpdir-aware-tmpfile.patch"
  - "0004-configure-hmdfs-umask.patch"
  - "0005-ohos-passwd-fallback.patch"

knowledge_gained:
  - "E007: 老版本 config.guess/config.sub 不识别 HarmonyOS uname，需补 aarch64-unknown-linux-ohos 三元组"
  - "E011: HMDFS 下 config.status 用 umask 077 建临时目录后无法写文件，需改 umask 022"
  - "OHOS musl 无 passwd 数据库，getpwuid 返回 Not supported；需从环境变量合成 passwd 回退，避免 FATAL"
  - "E002: OHOS /tmp 只读，enscript 的 tmpfile() 需改用 TMPDIR/HOME 下的临时文件"
  - "E010: OHOS toybox 缺 expr/awk，老版本 autoconf configure 依赖 GNU coreutils/gawk"
  - "enscript 编译期硬编码 SYSCONFDIR，Conan 重定位后需用 ENSCRIPT_LIBRARY 指回数据目录"
