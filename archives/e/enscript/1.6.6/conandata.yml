# conandata.yml — GNU enscript 1.6.6

sources:
  url: "https://ftp.gnu.org/gnu/enscript/enscript-1.6.6.tar.gz"
  sha256: "6d56bada6934d055b34b6c90399aa85975e66457ac5bf513427ae7fc77f5c0bb"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "Recognize HarmonyOS/OHOS uname and emit a native linux-ohos triplet (E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-linux-ohos.patch"
    patch_description: "Accept the aarch64-unknown-linux-ohos triplet (E007)"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-tmpdir-aware-tmpfile.patch"
    patch_description: "Use a TMPDIR/HOME-aware tmpfile replacement so PostScript generation works on OHOS where /tmp is read-only (E002)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-hmdfs-umask.patch"
    patch_description: "Relax config.status temp-dir umask 077 to 022 so file creation works on HMDFS (E011)"
    patch_type: "portability"
  - patch_file: "patches/0005-ohos-passwd-fallback.patch"
    patch_description: "Synthesize a passwd entry from the environment when getpwuid fails, since OHOS musl has no passwd database"
    patch_type: "portability"
