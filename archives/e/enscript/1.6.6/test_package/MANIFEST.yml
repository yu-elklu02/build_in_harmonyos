# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: enscript/1.6.6
homepage: "https://www.gnu.org/software/enscript/"

# 上游测试情况
# enscript 1.6.6 未提供独立单元测试或 make check 测试套件，
# 仅在 src/tests 下有少量手工示例输入，无断言式回归测试。
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
# CLI 工具，通过 bash 执行 enscript 完成一次真实的 文本→PostScript 转换并校验输出
test_package_tests:
  - file: "test_enscript.sh"
    description: "执行 enscript --version 并将文本文件转换为 PostScript，校验输出为合法 PS 文档"
    command: 'bash test_enscript.sh <enscript_bin>'

assertion_count: 3
