sources:
  url: "https://github.com/ecmwf/eckit/archive/refs/tags/2.0.7.tar.gz"
  sha256: "376aa865b317d9533c1c88e1a7d15ca248420cc8a048570f3fe216e123991b51"
patches:
  "2.0.7":
    - patch_file: "patches/0001-musl-uid_t.patch"
      patch_description: "PathName.h 显式包含 sys/types.h（musl 不间接引入 uid_t）"
      patch_type: "portability"
    - patch_file: "patches/0002-musl-strerror_r.patch"
      patch_description: "strerror_r 判据改为 _GNU_SOURCE && __GLIBC__（musl 只有 POSIX 版）"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-no-pthread-cancel.patch"
      patch_description: "ThreadControler::kill() 在 OHOS 上降级为 no-op（libc 无线程取消机制）"
      patch_type: "portability"
