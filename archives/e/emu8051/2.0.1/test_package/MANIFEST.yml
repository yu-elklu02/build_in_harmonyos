# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: emu8051/2.0.1
homepage: https://github.com/jarikomppa/emu8051

# 上游测试命令 — emu8051 上游无测试套件
upstream_check_command: "make all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# emu8051 上游 Makefile 无 test 目标，仅编译验证
upstream_tests:
  - file: Makefile
    source: emu8051/Makefile
    description: "emu8051 编译验证 — 确保所有源文件可正常编译链接"
    command: "make all"
    condition: "native / 交叉编译均执行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 emu8051 二进制存在于 package 中"
    command: "conan create (test_package _check_binary_exists)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2