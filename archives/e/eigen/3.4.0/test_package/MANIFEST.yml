# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: eigen/3.4.0
homepage: "https://eigen.tuxfamily.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Eigen has extensive unit tests via ctest)
upstream_tests:
  - file: test/eigen2/eigen2.cpp
    source: eigen-3.4.0/test/eigen2/eigen2.cpp
    description: "Eigen unit test - eigen2 compatibility"
    command: "ctest -R eigen2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: matrix-vector multiplication with Eigen::Matrix2d"
    command: "./test_eigen"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
