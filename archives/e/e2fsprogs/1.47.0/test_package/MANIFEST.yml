# test_package/MANIFEST.yml
# Upstream test declaration (required by CI L0e)

package: e2fsprogs/1.47.0
homepage: "https://e2fsprogs.sourceforge.net/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests
upstream_tests:
  - file: tests/progs/test_icount.c
    source: e2fsprogs-1.47.0/tests/progs/test_icount.c
    description: "Upstream icount test program"
    command: "./test_icount"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: calls com_err() from libcom_err"
    command: "./test_e2fsprogs"

# Approximate assertion count
assertion_count: 1
