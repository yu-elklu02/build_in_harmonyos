# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 不支持硬链接，需要将 Makefile 的 LN 定义改为 cp -a"
  - "toybox sh 的 heredoc 和临时文件处理有问题，建议使用 bash 运行 configure"
  - "OHOS sysroot 的 linux/fsmap.h 定义了 FS_IOC_GETFSMAP，会导致本地 fsmap.h 的 inline 函数被条件编译跳过"
  - "HongMeng Kernel 1.12.0 已解决 E076 问题，无需修改源码"
  - "config.guess 和 config.sub 需要为 config/ 子目录和顶层目录分别打补丁"

