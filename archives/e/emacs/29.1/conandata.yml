sources:
  url: "https://ftpmirror.gnu.org/gnu/emacs/emacs-29.1.tar.xz"
  sha256: "d2f881a5cc231e2f5a03e86f4584b0438f83edd7598a09d24a21bd8d003e2e01"

patches:
  "29.1":
    - patch_file: "patches/0001-ohos-configure-tmpdir-umask.patch"
      patch_description: "Relax configure/config.status temporary directory umask for OHOS HMDFS user/group mapping"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-run-move-if-change-through-shell.patch"
      patch_description: "Run move-if-change via the configured shell when execute permissions are not usable on OHOS HMDFS"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-disable-utmp-boot-time-lookup.patch"
      patch_description: "Disable utmp boot-time lookup on OHOS where getutid/getutent are not exposed"
      patch_type: "portability"
    - patch_file: "patches/0004-ohos-use-ncursesw-terminfo-globals.patch"
      patch_description: "Avoid duplicate BC/PC/UP definitions when linking against ncursesw on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0005-ohos-use-emacs-posix-close-fallback.patch"
      patch_description: "Use Emacs posix_close fallback on OHOS where only POSIX_CLOSE_RESTART is exposed"
      patch_type: "portability"
    - patch_file: "patches/0006-ohos-run-update-subdirs-through-shell.patch"
      patch_description: "Run update-subdirs via the configured shell when execute permissions are not usable on OHOS HMDFS"
      patch_type: "portability"
    - patch_file: "patches/0007-ohos-resign-pdumped-emacs.patch"
      patch_description: "Re-sign pdumped Emacs ELF files after fingerprinting on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0008-ohos-skip-dump-name-hardlinks.patch"
      patch_description: "Skip dump output hard-link aliases on OHOS HMDFS"
      patch_type: "portability"
    - patch_file: "patches/0009-ohos-tolerate-ert-log-preamble.patch"
      patch_description: "Tolerate ERT log preamble output before the Running line in OHOS test summary parsing"
      patch_type: "test"
