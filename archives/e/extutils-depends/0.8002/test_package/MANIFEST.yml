# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: extutils-depends/0.8002
homepage: "https://metacpan.org/pod/ExtUtils::Depends"

# Upstream test command
upstream_check_command: "make test"

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: "make test"

# Upstream actual test programs (Perl test files)
upstream_tests:
  - file: t/02_save_load.t
    source: ExtUtils-Depends-0.8002/t/02_save_load.t
    description: "save_config/load functionality test"
    command: "perl t/02_save_load.t"
  - file: t/03_deps.t
    source: ExtUtils-Depends-0.8002/t/03_deps.t
    description: "dependency management test"
    command: "perl t/03_deps.t"
  - file: t/04_extra_libs.t
    source: ExtUtils-Depends-0.8002/t/04_extra_libs.t
    description: "extra libs test (skipped on non-Windows)"
    command: "perl t/04_extra_libs.t"
  - file: t/05_unc.t
    source: ExtUtils-Depends-0.8002/t/05_unc.t
    description: "UNC path test"
    command: "perl t/05_unc.t"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Perl module load and dependency management test"
    command: "perl -e 'use ExtUtils::Depends; ...'"

# Total test assertions (approximate)
assertion_count: 46
