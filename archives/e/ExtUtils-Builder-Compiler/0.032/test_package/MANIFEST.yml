# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: extutils-builder-compiler/0.032
homepage: "https://metacpan.org/pod/ExtUtils::Builder::Compiler"

# Upstream test command (for make -n check analysis)
upstream_check_command: "make test"

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs (PurePerl, run via `make test`)
upstream_tests:
  - file: t/30-compiler-unixy.t
    source: ExtUtils-Builder-Compiler-0.032/t/30-compiler-unixy.t
    description: "Test compiler command generation for Unixy platform"
    command: "perl t/30-compiler-unixy.t"
  - file: t/30-linker-elf-gcc.t
    source: ExtUtils-Builder-Compiler-0.032/t/30-linker-elf-gcc.t
    description: "Test ELF GCC linker command generation"
    command: "perl t/30-linker-elf-gcc.t"
  - file: t/40-autodetect-executable.t
    source: ExtUtils-Builder-Compiler-0.032/t/40-autodetect-executable.t
    description: "Test autodetect compiler for executable type (compiles real C code)"
    command: "perl t/40-autodetect-executable.t"
  - file: t/40-autodetect-loadable-object.t
    source: ExtUtils-Builder-Compiler-0.032/t/40-autodetect-loadable-object.t
    description: "Test autodetect compiler for loadable-object type (compiles real C code)"
    command: "perl t/40-autodetect-loadable-object.t"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test_module.sh
    description: "Load module and test compiler/linker API (R34)"
    command: "sh test_module.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 20
