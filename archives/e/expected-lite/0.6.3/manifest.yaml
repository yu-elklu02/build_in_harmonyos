build:
  system: cmake
  configure_options:
    - "-DEXPECTED_LITE_OPT_BUILD_TESTS=ON"
    - "-DEXPECTED_LITE_OPT_BUILD_EXAMPLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "expected-lite 是 header-only 库（CMake INTERFACE library），无需编译二进制"
  - "无任何依赖，仅包含头文件 include/nonstd/expected.hpp"
  - "CMake 命名空间：nonstd::expected-lite"
  - "上游测试通过 EXPECTED_LITE_OPT_BUILD_TESTS=ON 启用，使用 lest 测试框架"
  - "clang 15+ 下 CTest 运行 4 个测试: cpp11/cpp14/cpp17/cpp20"
