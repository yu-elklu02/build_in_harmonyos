# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: expected-lite/0.6.3
homepage: "https://github.com/martinmoene/expected-lite"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
# EXPECTED_LITE_OPT_BUILD_TESTS=ON, build() 中调用 cmake.test()
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# test/ 目录使用 lest 测试框架, CTest 运行 4 个可执行文件 (cpp11/cpp14/cpp17/cpp20)
# 每个可执行文件包含 132 个 lest 测试用例
upstream_tests:
  - file: test/expected.t.cpp
    source: expected-lite-0.6.3/test/expected.t.cpp
    description: "expected 核心单元测试 (132 个 lest 用例: 构造/赋值/访问/monadic 操作等)"
    command: "ctest -R test-cpp11"
  - file: test/expected-main.t.cpp
    source: expected-lite-0.6.3/test/expected-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_expected_lite.cpp
    description: "消费者测试: 验证 expected-lite 库链接、expected/unexpected 构造、value/emplace/swap/bool API"
    command: "./test_expected_lite"

# 测试断言总数 (近似值)
# test_package 消费者测试 7 个断言
# 上游 4 个 CTest 可执行文件 x 132 lest 用例 = 528 次测试执行
assertion_count: 7
