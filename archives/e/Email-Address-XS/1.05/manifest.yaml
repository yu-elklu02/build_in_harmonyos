software: Email-Address-XS
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.05"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.cpan.org/authors/id/P/PA/PALI/Email-Address-XS-1.05.tar.gz"

  # 源码校验和
  sha256: "1510b7f10d67201037cd50d22c9d6b26eeca55ededa4cdb46bbca27e59a4ea16"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（质量门禁必需字段）
# cmake | autotools | makefile | meson | custom | perl_xs
build_system: perl_xs

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl_xs
  system: perl_xs

  # 配置选项列表 (perl Makefile.PL 参数)
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "CCFLAGS=-D_GNU_SOURCE -fno-strict-aliasing -pipe -fstack-protector-strong -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -I$DEFAULT_PREFIX/include"
    - "LDFLAGS=-L$DEFAULT_PREFIX/lib"
    - "LDDLFLAGS=-shared -nostdlib -B$DEFAULT_PREFIX/lib -L$DEFAULT_PREFIX/lib -lc"
  # 说明: Perl XS 模块使用 Makefile.PL，非传统 configure

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 预编译包信息
# ============================================================

packaging:
  # tar.gz 预编译包（标准分发格式）
  tarball:
    file: "Email-Address-XS-1.05-ohos-aarch64.tar.gz"
    size: "74KB"
    format: "tar.gz"
    install_command: "tar xzf Email-Address-XS-1.05-ohos-aarch64.tar.gz -C /data/service/hnp/perl.org/perl_5.42.0/"
    contents:
      - "lib/site_perl/5.42.0/aarch64-linux/Email/Address/XS.pm"
      - "lib/site_perl/5.42.0/aarch64-linux/auto/Email/Address/XS/XS.so"
      - "INSTALL.txt"
    # 说明: 标准预编译包，可通过 cmd-pkgs 公共安装脚本安装

  # HNP 包（系统安装模式）
  hnp:
    file: "Email-Address-XS-1.05-ohos-aarch64.hnp"
    size: "24KB"
    format: "zip"
    install_target: "/data/service/hnp/perl.org/perl_5.42.0/"
    contents:
      - "lib/site_perl/5.42.0/aarch64-linux/Email/Address/XS.pm"
      - "lib/site_perl/5.42.0/aarch64-linux/auto/Email/Address/XS/XS.so"
    # 说明: 管理员解压到系统目录后，XS.so 将获得正确的 hnp_file:s0 SELinux type

  # 编译产物详情
  artifacts:
    XS_so:
      original_size: "42KB"
      stripped_size: "42KB"
      signed_size: "42KB"
      elf_signed: true
      selinux_type: "hmdfs:s0"  # 当前限制：无法从 hmdfs 加载
      # 安装到系统目录后将变为 hnp_file:s0
    XS_pm:
      size: "21KB"
      type: "perl_module"
      # Perl 模块文件，无需签名

# ============================================================
# 测试结果
# ============================================================

test_results:
  # 编译产物验证
  binary_integrity: PASS
  # 符号表完整性
  symbols: PASS
  # 运行时加载测试
  runtime_loading: FAIL  # SELinux HMDFS 限制
  # HNP 包创建
  hnp_creation: PASS
  # 安装可行性
  system_install: PENDING  # 需管理员执行

  # 详细报告
  report: "reports/test-report.md"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "L2: Perl XS 模块使用 Makefile.PL 而非 configure"
  - "L2: 需要显式添加 CCFLAGS 和 LDDLFLAGS 参数（系统头文件路径和链接器路径）"
  - "L2: 使用 -nostdlib 绕过 libunwind.a 缺失问题（musl libc）"
  - "L2: SELinux HMDFS 限制阻止 XS 模块运行时加载，需创建 HNP 包"
  - "L3: Email::Address::XS 无 PurePerl fallback，必须依赖 XS 实现"
  - "L3: HNP 包签名需使用 binary-sign-tool sign -selfSign 1"
  - "L3: 系统目录安装后 SELinux type 变为 hnp_file:s0"
  - "L3: 模块提供 RFC 5322 邮件地址解析和格式化功能"
