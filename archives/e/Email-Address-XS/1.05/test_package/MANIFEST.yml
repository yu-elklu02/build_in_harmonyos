# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: email-address-xs/1.05
homepage: "https://metacpan.org/pod/Email::Address::XS"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/Email-Address-XS.t
    source: Email-Address-XS-1.05/t/Email-Address-XS.t
    description: "上游邮件地址解析和格式化功能测试 (516 assertions)"
    command: "perl -Iblib/lib -Iblib/arch t/Email-Address-XS.t"
  - file: t/taint-Email-Address-XS.t
    source: Email-Address-XS-1.05/t/taint-Email-Address-XS.t
    description: "上游 taint 模式下的邮件地址解析测试 (137 assertions)"
    command: "perl -Iblib/lib -Iblib/arch t/taint-Email-Address-XS.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_email_address_xs.sh
    description: "消费者测试：加载 Email::Address::XS 模块并调用 new/parse/compose_address/is_valid API"
    command: "sh test_email_address_xs.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
