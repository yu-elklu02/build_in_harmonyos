software: eccodes
version: "2.42.0"
status: failed
build_system: cmake
build_date: "2026-07-29"

source:
  url: "https://confluence.ecmwf.int/download/attachments/45757960/eccodes-2.42.0-Source.tar.gz?api=v2"
  sha256: "60371b357cb011dee546db2eabace5b7e27f0f87d3ea4a5adde7891371b3c128"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_AEC=OFF"
    - "-DENABLE_JPG=OFF"
    - "-DENABLE_PNG=OFF"
    - "-DENABLE_NETCDF=OFF"
    - "-DENABLE_FORTRAN=OFF"
    - "-DENABLE_GEOGRAPHY=OFF"
    - "-DENABLE_MEMFS=OFF"
    - "-DENABLE_EXAMPLES=OFF"
    - "-DENABLE_BUILD_TOOLS=OFF (default; ON only with with_upstream_tests=True)"
    - "-DENABLE_TESTS=OFF (default; ON only with with_upstream_tests=True)"
    - "-DBUILD_TESTING=OFF (default; ON only with with_upstream_tests=True)"
    - "-DENABLE_INSTALL_ECCODES_DEFINITIONS=ON"
    - "-DENABLE_INSTALL_ECCODES_SAMPLES=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-materialize-build-data-links-on-ohos.patch (OHOS only)"

knowledge_gained:
  - "ecCodes 2.42.0 source bundle includes ecbuild CMake modules, so no external ecbuild package is needed."
  - "AEC is treated as critical unless ENABLE_AEC is explicitly defined; set ENABLE_AEC=OFF for the first dependency package."
  - "Magics only needs the ecCodes C/C++ library and installed definitions/samples; optional JPEG/PNG/NetCDF/Fortran/geography stacks are disabled to avoid dependency dead ends."
  - "Test consumers should set ECCODES_DEFINITION_PATH and ECCODES_SAMPLES_PATH from the package run environment."
