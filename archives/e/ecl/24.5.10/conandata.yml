  url: "https://common-lisp.net/project/ecl/static/files/release/ecl-24.5.10.tgz"
  sha256: "e4ea65bb1861e0e495386bfa8bc673bd014e96d3cf9d91e9038f91435cbe622b"
patches:
  - patch_file: "patches/0001-internal-h-include-stdbool.patch"
    patch_description: "internal.h 补 #include <stdbool.h>：它与 ecl/threads.h 直接用 bool 却全树无人 include 该头，clang 15 默认 -std=gnu17 下报 unknown type name 'bool'"
    patch_type: "portability"
  - patch_file: "patches/0002-libraries-d-restore-bool.patch"
    patch_description: "libraries.d 在 #undef bool 之后、include internal.h 之前恢复 bool 的 C99 定义：stdbool.h 有 include guard，undef 后再 include 不会重新定义，导致 internal.h/threads.h 里的 bool 全成未知类型"
    patch_type: "portability"
