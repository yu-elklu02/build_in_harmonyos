versions:
  - version: "24.5.10"
    status: built
    build_date: "2026-08-12"
    notes: >-
      Singular / SageMath / passagemath 计算代数栈的 Lisp 后端。两个补丁都为同一个
      bool 问题：src/c/ffi/libraries.d 在 include dlfcn.h 后 #undef bool，而 stdbool.h
      有 include guard，导致其后 internal.h 里再 include 是空操作，internal.h 与
      threads.h 中所有 bool 变成未知类型（全树仅此一个文件报错，极易误判）。
      test_package 把 ECL 当运行时嵌入并求值 4 个可手算的 Lisp 表达式。
