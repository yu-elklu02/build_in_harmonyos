# test_package/MANIFEST.yml
# Upstream test declaration (required by CI L0e)

package: e2fsimage/0.2.3
homepage: "https://github.com/Ledest/e2fsimage"

# e2fsimage has no official test suite (make check not supported)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Smoke test: runs e2fsimage binary and verifies usage output"
    command: "bash test.sh"

assertion_count: 1
