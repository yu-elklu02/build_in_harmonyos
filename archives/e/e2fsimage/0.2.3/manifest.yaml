software: e2fsimage
version: 0.2.3
category: system
status: published

build_system: makefile
compiler: clang
linker: ld.lld

dependencies:
  e2fsprogs: 1.47

configure_options: []
build_notes:
  - Renamed configure to configure.custom to bypass autotools detection and fix zsh compatibility
  - Changed gcc to clang throughout configure and Local.mak
  - Pre-created Local.mak configuration file with CC=clang and cross-compile paths
  - Created compatibility headers ext2fs/ext2fs.h and e2p/e2p.h for prebuilt e2fsprogs
  - Changed install targets from GNU install to mkdir+cp+chmod (no GNU coreutils install on HarmonyOS)

artifacts:
  - e2fsimage binary (dynamically linked)

source_url: https://github.com/Ledest/e2fsimage/archive/refs/tags/0.2.3.tar.gz