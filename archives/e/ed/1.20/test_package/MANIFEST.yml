# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ed/1.20
homepage: "https://www.gnu.org/software/ed/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# GNU ed 1.20 ships a testsuite/ directory with shell-based test scripts.
# `make check` runs ~24 test scripts (a.ed, c.ed, d.ed, etc.)
# On HarmonyOS, make check fails due to platform permission limitations
# (test harness uses piped scripts that cannot execute unsigned binaries).
upstream_tests:
  - file: testsuite/ed.test
    source: ed-1.20/testsuite/ed.test
    description: "Main test harness script for ed"
    command: "make check"
  - file: testsuite/a.ed
    source: ed-1.20/testsuite/a.ed
    description: "Test append command"
    command: "./testsuite/ed.test"
  - file: testsuite/s.ed
    source: ed-1.20/testsuite/s.ed
    description: "Test substitute command"
    command: "./testsuite/ed.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: ed --version + basic append/print/quit"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
