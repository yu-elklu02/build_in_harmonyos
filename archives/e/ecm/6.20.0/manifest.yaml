software: ecm
version: "6.20.0"
status: built
build_date: "2026-07-16"
conan_ref: "ecm/6.20.0"

source:
  url: "https://download.kde.org/stable/frameworks/6.20/extra-cmake-modules-6.20.0.tar.xz"
  sha256: "3711de8572db5da618efe3f28cc094ca25a1abb0bddffc63dced12c4f8caae5f"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ECM是纯CMake模块库，不编译任何二进制代码"
  - "仅安装CMake模块文件到share/cmake/ECM目录"
  - "package_id()中使用self.info.clear()以避免编译器/构建类型导致不必要的包ID变化"
  - "不需要commands.json，因为ECM不提供可执行文件"
