# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ecm/6.26.0
homepage: "https://kde.org/products/frameworks/"

# 上游测试命令 (CMake 项目, ctest 驱动; 部分用例需 Qt5/Qt6, 本环境无 Qt 故跳过)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (核心模块测试, 非 Qt 依赖部分; 75/85 通过)
# 其余 10 例 (ExecuteKDEModules/KDEFetchTranslations/KDEInstallDirsTest/ecm_add_tests)
# 需 Qt5/Qt6, 环境无 Qt 时失败, 属环境依赖缺失, 与本包模块安装物无关。
upstream_tests:
  - file: "tests/ECMGenerateHeadersTest"
    source: "ecm-6.26.0/tests/ECMGenerateHeadersTest"
    description: "ECMGenerateHeaders 模块生成头文件功能测试"
    command: "ctest --build-and-test"
  - file: "tests/ECMGenerateExportHeaderTest"
    source: "ecm-6.26.0/tests/ECMGenerateExportHeaderTest"
    description: "ECMGenerateExportHeader 导出宏/弃用声明测试"
    command: "ctest --build-and-test"
  - file: "tests/ECMSetupVersionTest"
    source: "ecm-6.26.0/tests/ECMSetupVersionTest"
    description: "ECMSetupVersion 版本信息生成测试"
    command: "ctest --build-and-test"
  - file: "tests/ECMGeneratePkgConfigFile"
    source: "ecm-6.26.0/tests/ECMGeneratePkgConfigFile"
    description: "ECMGeneratePkgConfigFile pkg-config 文件生成测试"
    command: "ctest --build-and-test"
  - file: "tests/ECMAddTests"
    source: "ecm-6.26.0/tests/ECMAddTests"
    description: "ECMAddTests 测试注册宏测试(非 Qt 分支)"
    command: "ctest --build-and-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ecm.cpp
    description: "消费者测试: find_package(ECM EXACT) + include(ECMFindModuleHelpers) 宏调用 + 版本/模块目录断言"
    command: "./test_ecm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
