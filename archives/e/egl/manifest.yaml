software: egl
name: EGL Desktop Implementation
description: Khronos EGL 1.5 desktop implementation with multiple platform backends (WGL/GLX/Wayland/OHOS)
category: gfx
license: MIT
website: https://github.com/McNopper/EGL

build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 后端新增 src/egl_ohos.cpp,通过 dlopen(\"libEGL.so\") 转发系统 EGL"
    - "CMake 用 CMAKE_SYSTEM_NAME STREQUAL \"OHOS\" 选择 OHOS 后端,链接 CMAKE_DL_LIBS,跳过 examples"
    - "OHOS 后端不引入 X11/Wayland/Vulkan;pbuffer surface + OpenGL ES context 真实可用"
    - "window/pixmap surface 明确返回 EGL_BAD_MATCH/EGL_BAD_NATIVE_PIXMAP,不假装支持"
    - "静态构建 libEGL.a,打包 include/EGL 与 include/KHR"
  common_dependencies: []

versions:
  - version: "1.0.5"
    status: built
    compiled_at: "2026-07-30"
    notes: |
      - 首次 OHOS/aarch64 适配
      - CMake 静态库,仅 OHOS 平台
      - dlopen 系统 libEGL.so 转发 EGL 调用
    dependencies: []
    provides:
      - libEGL.a
