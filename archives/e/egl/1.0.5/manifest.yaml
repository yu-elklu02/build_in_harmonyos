  cxx: clang++

patches_applied:
  - "0001-add-ohos-system-egl-pbuffer-backend.patch"

knowledge_gained:
  - "上游 include/EGL/eglctxinternals.h 与 src/egl_internal.h 平台分支仅覆盖 _WIN32/WL_EGL_PLATFORM/USE_X11/__unix__,OHOS 落入空白分支需补丁新增 OHOS 平台定义(NativeSurfaceContainer/NativeContextContainer/NativeLocalStorageContainer + __getDefaultNativeDisplay/__matchPlatformDisplay)"
  - "OHOS 真机有 /system/lib64/libEGL.so 与 libGLESv3.so(无 libGLESv2.so),egl_ohos.cpp 通过 dlopen(\"libEGL.so\") 转发系统 EGL 调用"
  - "上游 _egl* 是一组 extern C 函数(egl.c 转发到平台后端),OHOS 后端在 egl_ohos.cpp 实现它们,egl_x11_glx.cpp 是参考模板"
  - "上游 CMake 在 UNIX 分支强依赖 X11/OpenGL,OHOS 需新增独立 OHOS 分支(CMAKE_SYSTEM_NAME STREQUAL \"OHOS\")并跳过 add_subdirectory(examples)"
  - "eglGetProcAddress 经 _eglGetProcAddress → __getProcAddress 转发,OHOS 后端 __getProcAddress 用系统 eglGetProcAddress 取,失败再 dlsym(libEGL)"
