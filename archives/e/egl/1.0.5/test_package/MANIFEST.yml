# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: egl/1.0.5
homepage: https://github.com/McNopper/EGL

# 上游 v1.0.5 无独立 ctest 套件(EGL desktop impl 无上游单元测试)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "真机 EGL 生命周期: eglInitialize→eglBindAPI(ES)→eglChooseConfig(pbuffer+ES3)→eglCreatePbufferSurface(1×1,OHOS真机EGL1.4拒≥2px)→eglCreateContext(ES3)→eglMakeCurrent→eglGetProcAddress(glGetString)→release→destroy/terminate"
    command: "./test_egl"

# 测试断言总数 (10 个 EGL 生命周期步骤 + glGetString 调用验证)
assertion_count: 11
