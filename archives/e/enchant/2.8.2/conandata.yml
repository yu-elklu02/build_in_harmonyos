patches:
  "2.8.2":
    - patch_file: "patches/0001-tests-use-system-mkdir-on-ohos.patch"
      patch_description: "tests fixes: (1) Makefile.am uses $(SED) so provider-path computation uses the configure-detected sed; (2) EnchantTestFixture::CreateDirectory clears umask around g_mkdir_with_parents so HMDFS umask 077 cannot down-grade the directory mode (POSIX, no-op on plain Linux)"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-module-dir-resolution.patch"
      patch_description: "portability fixes (POSIX, no platform macros): (1) libgnu/relocatable.c find_shared_library_fullname /proc/self/maps probe guarded by __linux__ (covers glibc/uClibc/musl incl. OHOS, since getline() is POSIX.1-2008) instead of glibc/uClibc-only; (2) EnchantBrokerTestFixture replaces assert(g_module_symbol(...)) with an unconditional lookup so the mock provider configure hook is set even under Conan Release -DNDEBUG; (3) EnchantBrokerTestFixture calls enchant_set_prefix_dir(.) unconditionally to pin the module dir to the test CWD (libtool .libs staging workaround, harmless where prefix is already correct)"
      patch_type: "portability"
