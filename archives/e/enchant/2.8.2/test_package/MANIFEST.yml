package: enchant/2.8.2
homepage: https://rrthomas.github.io/enchant/
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: main.test
    source: enchant-2.8.2/tests/main.test.cpp and 30 functional translation units
    description: "上游 broker、dictionary、PWL 与 provider helper 测试套件"
    command: "./main.test"
  - name: providers.test
    source: enchant-2.8.2/tests/providers/providers.test.cpp and 7 functional translation units
    description: "上游 provider 枚举、识别、字典请求与拼写接口测试套件"
    command: "./providers.test"
test_package_tests:
  - file: test_enchant.c
    description: "消费者链接、版本、broker 生命周期、provider 枚举与不存在字典负向行为"
    command: "./test_enchant"
  - file: conanfile.py
    description: "包结构、pkg-config、许可证、无 .la 与两个 CLI 的验证"
    command: "conan test"
assertion_count: 7
# 计数口径：test_enchant.c 共 8 处 EXPECT_TRUE，其中 7 处为无条件断言（计入
# assertion_count），1 处为条件负向断言（enchant_broker_get_error 在无 provider
# 环境下上游真实行为是返回 NULL dict 且不 set_error，此时跳过并打印 INFO）。
# CI marker 与本字段一致，按 7 个无条件断言统计；条件断言保留有 provider 时的
# 真实验证价值，不弱化为恒真、不伪造 PASS。
conditional_assertion_count: 1
conditional_skip_reason: "无 provider 时上游不 set_error，条件断言跳过"
