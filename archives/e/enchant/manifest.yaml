# 软件级 manifest
# 文件位置: archives/e/enchant/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: enchant
display: "Enchant"
description: "统一的拼写检查库与命令行工具，支持多 provider 后端"
category: library
homepage: "https://rrthomas.github.io/enchant/"
license: LGPL-2.1-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "需 glib/2.84.0.1，configure 阶段需 GLIB_CFLAGS/GLIB_LIBS 覆盖与 LD_LIBRARY_PATH 前置"
    - "build triplet 用 aarch64-unknown-linux-musl 避免 config.sub 不识别 linux-ohos"
    - "HMDFS 上 g_mkdir_with_parents 生成 2751 权限目录，上游测试夹具改用系统 mkdir -p"
    - "Conan Release -DNDEBUG 下 assert(g_module_symbol(...)) 副作用消失，需先赋值再 assert"
    - "设备无 automake，apply 补丁后需对齐 Makefile.in 与 Makefile.am 的 mtime"
  common_dependencies:
    - glib

versions:
  "2.8.2":
    status: built
    build_date: 2026-08-04
