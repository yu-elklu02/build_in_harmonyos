# 软件级 manifest
# 文件位置: archives/e/eventpp/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: eventpp

# 显示名
display: "eventpp"

# 一句话描述
description: "C++ 事件库，提供回调列表、事件分发器和事件队列 (header-only)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/wqking/eventpp"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Header-only 库 (CMake INTERFACE 目标), 无需编译库文件"
    - "纯 C++11 标准库实现, 零外部依赖, 鸿蒙原生兼容"
    - "需设置 CMAKE_SYSTEM_NAME=Linux (OHOS 平台适配, E092)"
    - "线程同步基于 std::mutex/std::atomic/std::condition_variable, 鸿蒙运行时完整支持"
    - "无需任何源码补丁"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.3":
    status: built
    build_date: 2026-07-23
