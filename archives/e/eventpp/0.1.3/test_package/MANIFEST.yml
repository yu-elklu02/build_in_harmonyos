# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: eventpp/0.1.3
homepage: "https://github.com/wqking/eventpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# eventpp 上游使用 GTest 飱行单元测试，测试源码位于 tests/ 目录
upstream_tests:
  - file: tests/testcallbacklist.cpp
    source: eventpp-0.1.3/tests/testcallbacklist.cpp
    description: "CallbackList 单元测试"
    command: "ctest -R testcallbacklist"
  - file: tests/testeventdispatcher.cpp
    source: eventpp-0.1.3/tests/testeventdispatcher.cpp
    description: "EventDispatcher 单元测试"
    command: "ctest -R testeventdispatcher"
  - file: tests/testeventqueue.cpp
    source: eventpp-0.1.3/tests/testeventqueue.cpp
    description: "EventQueue 单元测试"
    command: "ctest -R testeventqueue"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_eventpp.cpp
    description: "消费者测试：验证 CallbackList、EventDispatcher、EventQueue 三大核心组件"
    command: "./test_eventpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
