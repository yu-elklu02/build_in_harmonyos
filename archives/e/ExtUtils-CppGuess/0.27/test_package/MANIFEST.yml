# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: extutils-cppguess/0.27
homepage: "https://metacpan.org/pod/ExtUtils::CppGuess"

# Upstream test command (MakeMaker uses `make test`)
upstream_check_command: "make test"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: t/001_load.t
    source: ExtUtils-CppGuess-0.27/t/001_load.t
    description: "Test module loading and basic API"
    command: "perl -MExtUtils::MakeMaker -e 'test_harness(0, q(blib/lib), q(blib/arch))' t/001_load.t"
  - file: t/002_icpp.t
    source: ExtUtils-CppGuess-0.27/t/002_icpp.t
    description: "Test C++ compiler detection (is_clang, is_gcc, is_msvc)"
    command: "perl -MExtUtils::MakeMaker -e 'test_harness(0, q(blib/lib), q(blib/arch))' t/002_icpp.t"
  - file: t/003_standard_flag.t
    source: ExtUtils-CppGuess-0.27/t/003_standard_flag.t
    description: "Test C++ standard flag detection"
    command: "perl -MExtUtils::MakeMaker -e 'test_harness(0, q(blib/lib), q(blib/arch))' t/003_standard_flag.t"
  - file: t/004_env.t
    source: ExtUtils-CppGuess-0.27/t/004_env.t
    description: "Test environment variable handling for C++ compiler override"
    command: "perl -MExtUtils::MakeMaker -e 'test_harness(0, q(blib/lib), q(blib/arch))' t/004_env.t"

# test_package self-contained tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Consumer test: load ExtUtils::CppGuess, verify version and C++ compiler detection"
    command: "conan test"

# Approximate assertion count for quality assessment
assertion_count: 15
