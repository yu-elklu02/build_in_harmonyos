# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: efi-mkuki/1.0.0
homepage: "https://github.com/jirutka/efi-mkuki"

# 上游无测试目标 (Shell 脚本工具)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无 — Makefile 仅有 install/uninstall/help/release 目标）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_efi_mkuki.sh 验证 efi-mkuki 脚本已安装、可执行、shebang 正确、bash 语法正确、-V 输出版本号"
    command: "conan create (test_package: bash test_efi_mkuki.sh <bin_dir>)"
  - file: test_efi_mkuki.sh
    description: "真实冒烟测试: 检查脚本存在且可执行、shebang 为 shell、bash -n 语法检查通过、-V 输出 efi-mkuki 1.0.0"
    command: "bash test_efi_mkuki.sh <package bin dir>"

assertion_count: 5
