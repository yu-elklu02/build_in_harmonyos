# test_package/MANIFEST.yml
# CI L0e requires this file to exist.
package: emacspeak/59.0
homepage: "https://github.com/tvraman/emacspeak"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: lisp/emacspeak.el
    source: emacspeak-59.0/lisp/emacspeak.el
    description: "Core emacspeak Lisp module"
    command: "emacs --batch -l emacspeak.el"
  - file: lisp/emacspeak-setup.el
    source: emacspeak-59.0/lisp/emacspeak-setup.el
    description: "Setup and configuration module"
    command: "emacs --batch -l emacspeak-setup.el"

test_package_tests:
  - file: test_emacspeak.sh
    description: "Verify installed package file integrity"
    command: "bash test_emacspeak.sh"

assertion_count: 10
