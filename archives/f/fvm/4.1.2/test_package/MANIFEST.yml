# test_package/MANIFEST.yml — fvm 4.1.2

package: fvm/4.1.2
homepage: "https://fvm.app"

# 上游测试命令
upstream_check_command: "dart test"

# conanfile.py build() 中未集成上游测试（Dart 项目，无 OHOS Dart SDK）
upstream_test_in_build: false
upstream_test_command: ""

# 上游无 Dart 测试可运行（无 OHOS Dart SDK）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者冒烟测试 — 验证包结构完整性"
    command: "./test_fvm"

# 测试断言总数
assertion_count: 1