dependencies: []

configure_options:
  - CMAKE_POLICY_VERSION_MINIMUM=3.5
  - ENABLE_FLOAT=ON
  - ENABLE_THREADS=OFF
  - ENABLE_OPENMP=OFF
  - BUILD_TESTS=OFF
  - DISABLE_FORTRAN=ON
  - ENABLE_SSE=OFF
  - ENABLE_SSE2=OFF
  - ENABLE_AVX=OFF
  - ENABLE_AVX2=OFF

patches_applied: []

knowledge_gained:
  - "fftw3f is the single-precision FFTW build produced from upstream fftw by enabling ENABLE_FLOAT."
  - "Upstream ships Autotools and CMake; existing fftw/3.3.10 notes report OHOS Autotools config.guess/config.sub issues, so this recipe uses CMake."
  - "SIMD options are disabled in the portable baseline; target-specific SIMD can be split into a follow-up only if required."
