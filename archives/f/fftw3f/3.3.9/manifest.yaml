software: fftw3f
version: 3.3.9
status: built
build_system: cmake
created_at: 2026-07-25
issue: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/1451

source:
  url: https://www.fftw.org/fftw-3.3.9.tar.gz
