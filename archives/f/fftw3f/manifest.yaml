versions:
  "3.3.10":
    packaging: conan
    status: built
    build_date: "2026-08-06"
    notes: >-
      单精度（float）版本，源码同为上游 3.3.10。改动与同批 fftw/3.3.10.2 一致：
      修正上游写反的 SOVERSION/VERSION，产出 soname libfftw3f.so.3；开 ENABLE_THREADS 且
      WITH_COMBINED_THREADS=OFF，单出 libfftw3f_threads.so.3。
      ⚠️ 既有的 fftw3f/3.3.9 完全没有 DT_SONAME、3.3.9.1 的 SONAME 是无版本的 libfftw3f.so，
      两者都缺 .so.3 软链，动态消费方用不了 —— 本版一并修复。
      真机 conan create 通过；float 只有约 7 位有效数字，测试容差按精度单独放宽到 1e-4。
