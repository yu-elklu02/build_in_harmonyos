# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ftxui/6.1.9
homepage: "https://github.com/ArthurSonzogni/FTXUI"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# ftxui uses googletest via FetchContent; tests skipped due to git safe directory issues
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ftxui uses GoogleTest framework with FetchContent; tests require network access
# Tests are in CMakeLists.txt with enable_testing() and gtest_discover_tests
upstream_tests:
  - file: CMakeLists.txt
    source: ftxui-6.1.9/CMakeLists.txt
    description: "GoogleTest-based tests (skipped: googletest FetchContent requires network)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ftxui.cpp
    description: "Consumer test: create text element, render to screen, verify output"
    command: "./test_ftxui"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
