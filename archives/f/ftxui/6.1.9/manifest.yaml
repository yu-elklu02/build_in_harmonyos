software: ftxui
version: "6.1.9"
status: published
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/ArthurSonzogni/FTXUI/archive/refs/tags/v6.1.9.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DFTXUI_BUILD_EXAMPLES=OFF"
    - "-DFTXUI_BUILD_DOCS=OFF"
    - "-DFTXUI_BUILD_TESTS=OFF"
    - "-DFTXUI_ENABLE_INSTALL=ON"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []

patches_applied: []

knowledge_gained:
  - "ftxui 是纯 C++ header-only + static library 项目，编译简单"
  - "CMake 平台检测到 HarmonyOS 但不影响编译"
  - "googletest FetchContent 有 git safe directory 问题，跳过测试"
  - "三个静态库: ftxui-screen, ftxui-dom, ftxui-component (链接顺序: component→dom→screen)"
  - "需要 pthread (系统提供)"
