software: fluidsynth
display: "FluidSynth"
description: "Real-time SoundFont synthesizer library and command-line tool"
category: multimedia
homepage: "https://www.fluidsynth.org/"
license: "LGPL-2.1-or-later AND Apache-2.0"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream cpp11 OS abstraction to avoid an unnecessary GLib runtime dependency."
    - "Stage the upstream-pinned GCEM revision before CMake configure so builds never download sources at build time."
    - "Ship GCEM's Apache-2.0 LICENSE and NOTICE.txt beside FluidSynth's LGPL license."
    - "Supply build-folder-only HarmonyOS CMake platform rules using the repository's E140 pattern."
    - "Disable host audio drivers and service integrations that are not part of the DOSBox consumer contract."
    - "Keep mixer threads and native DLS support enabled with the OHOS C++17 toolchain."
    - "Sign final upstream-test, installed-package, and consumer ELFs before OHOS execution."
    - "Preserve the libfluidsynth.so.3 ABI with regular-file aliases instead of unsupported HMDFS symlinks."
    - "Propagate the cpp11 backend's C++ runtime through static pkg-config metadata so pure C consumers link correctly."
  common_dependencies: []

versions:
  "2.5.7":
    status: built
    build_date: "2026-08-01"
    conan_ref: "fluidsynth/2.5.7"
