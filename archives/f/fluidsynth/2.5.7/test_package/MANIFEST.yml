test_package_tests:
  - file: core_synth.cpp
    description: "CMake consumer validates version, settings, MIDI events, and float rendering"
    command: "./core_synth"
  - file: pkgconfig_soundfont.c
    description: "pkg-config consumer validates deterministic SoundFont error handling"
    command: "./pkgconfig_soundfont"
  - file: conanfile.py
    description: "Run the installed FluidSynth command-line executable"
    command: "fluidsynth --version"

assertion_count: 33
