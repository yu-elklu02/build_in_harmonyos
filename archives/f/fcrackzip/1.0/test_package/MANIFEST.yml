# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: fcrackzip/1.0
homepage: "https://github.com/hyc/fcrackzip"

# Upstream test command (from Makefile: test target runs fcrackzip --benchmark)
upstream_check_command: "make test"

# conanfile.py build() method: upstream test not integrated in build
upstream_test_in_build: false
upstream_test_command: "fcrackzip --benchmark"

# Upstream actual test programs
upstream_tests:
  - file: fcrackzip
    source: fcrackzip-1.0/fcrackzip
    description: "Benchmark test - runs fcrackzip --benchmark to verify cracking speed"
    command: "./fcrackzip --benchmark"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Runs fcrackzip --version to verify binary is installed and functional"
    command: "fcrackzip --version"

# Test assertion count (approximate, for quality assessment)
assertion_count: 2
