version: "1.0"
software: fcrackzip
status: built
build_date: "2026-08-06"
build_system: autotools

source:
  url: "https://mirrors.aliyun.com/kali/pool/main/f/fcrackzip/fcrackzip_1.0.orig.tar.gz"
  sha256: "4a58c8cb98177514ba17ee30d28d4927918bf0bdc3c94d260adfee44d2d43850"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=${prefix}"
  dependencies: []
  umask_fix: "conanfile.py build() uses replace_in_file to change umask 077 → 022 in configure script"

patches_applied:
  - "0001-crack.h.patch"
  - "0002-getopt.c.patch"
  - "0003-getopt1.c.patch"

knowledge_gained:
  - "crack.h/getopt.c/getopt1.c 需要修补 config.h 包含路径（<config.h> → \"config.h\")"
  - "configure 脚本的 umask 077 在 OHOS 上创建 setgid 目录导致 Permission denied，需改为 umask 022（在 conanfile.py build() 中修复）"
  - "OHOS 上 make -j2 因 mkfifo 不支持而失败，需使用 -j1"

patch_generation:
  method: per-file-difflib
  patches_count: 3

patch_classification:
  - file: 0001-crack.h.patch
    type: portability
    platform_only: True
    guard: none
  - file: 0002-getopt.c.patch
    type: portability
    platform_only: True
    guard: none
  - file: 0003-getopt1.c.patch
    type: portability
    platform_only: True
    guard: none
