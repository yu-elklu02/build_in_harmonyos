# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ffnvcodec-headers/13.0.19.0
homepage: "https://github.com/FFmpeg/nv-codec-headers"

# 上游测试命令
upstream_check_command: "make check"

# 上游无独立测试套件（header-only 包）
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序（header-only 包）
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "验证 nvEncodeAPI.h 头文件可被正确包含和编译"
    command: "./test_ffnvcodec_headers"

# 测试断言总数
assertion_count: 1
