version: "3.3.10.1"
status: built
build_date: "2026-07-30"

source:
  url: "https://www.fftw.org/fftw-3.3.10.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-use-monotonic-clock-on-ohos.patch"

knowledge_gained:
  - "Autotools 的旧 config.guess/config.sub 无法识别 OHOS，当前配方改用上游 CMake 构建且不替换源码文件"
  - "CMake 构建需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "CLOCK_SGI_CYCLE 可能已声明但运行时返回 EINVAL；FFTW 计时器应检查返回值并回退到 CLOCK_MONOTONIC"
  - "OHOS CMake 需补齐 SONAME/runtime linker flags，并同时识别 OHOS/HarmonyOS 系统名后跳过 VERSION/SOVERSION 软链，避免消费者 DT_NEEDED 写入构建缓存绝对路径"
