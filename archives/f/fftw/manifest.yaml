software: fftw
display: "FFTW"
description: "Fastest Fourier Transform in the West — high-performance discrete Fourier transform library"
category: data
homepage: "https://www.fftw.org/"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "当前 OHOS 配方使用上游 CMake 构建，不替换 Autotools 生成文件"
    - "CMake 构建需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "shared 选项选择静态或共享产物，静态模式支持 fPIC"
  common_dependencies: []

versions:
  "3.3.10":
    packaging: conan
    notes: "已 conan 化（2026-07-29）：真机原生 conan create 验证，test_package 4 条真实 FFT 数值断言全绿；产 libfftw3.so.3"
    status: built
    build_date: "2026-04-26"
  "3.3.10.1":
    packaging: conan
    notes: "R37 适配修订：改用上游 CMake，修复 OHOS 计时源回退与共享库 SONAME/软链问题"
    status: built
    build_date: "2026-07-30"
  "3.3.10.2":
    packaging: conan
    status: built
    build_date: "2026-08-06"
    notes: >-
      补齐动态库与 pthreads 多线程库，供 pyfftw 等按 soname 链接的消费方使用。
      本版打补丁修正上游 CMakeLists 写反的 SOVERSION/VERSION（`SOVERSION 3.6.9 VERSION 3`）——
      CMake 里 VERSION 决定实体文件名、SOVERSION 决定 soname 后缀，反着写会产出实体
      libfftw3.so.3、soname libfftw3.so.3.6.9，与 autotools 的正确布局颠倒，下游会把完整
      版本号写进 DT_NEEDED。修正后 soname 为 libfftw3.so.3、实体 libfftw3.so.3.6.10。
      另开 ENABLE_THREADS 且保持 WITH_COMBINED_THREADS=OFF，单出 libfftw3_threads.so.3
      （合并进主库则消费方按 -lfftw3_threads 探测不到）。不开 OpenMP：设备实测产物 RUNPATH
      会烤成带版本号的 SDK 绝对路径，而 libomp.so 只在 SDK 内。真机 conan create 通过，
      test_package 以纯余弦的解析谱对账谱线位置与幅值、验逆变换还原、并要求双线程结果与
      单线程逐点一致。
