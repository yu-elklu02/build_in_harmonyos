# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试: 验证 flow-cli 二进制 ELF 头部（E046 平台限制：OHOS HMDFS 不支持执行权限位）"
    command: "conanfile.py _verify_elf_header"
  - file: test_flow.sh
    description: "Shell 脚本测试: 验证 flow-cli 二进制 ELF 魔数"
    command: "sh test_flow.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 200