software: frei0r-plugins
version: "3.1.3"
status: published
build_date: "2026-05-30"
build_system: cmake

source:
  url: "https://api.github.com/repos/dyne/frei0r/tarball/v3.1.3"
  sha256: "df3e7cf56d3a99075412e7b8f6630b0eff987a6ce1103a67b674a1b405a758a0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DWITHOUT_OPENCV=ON"
    - "-DWITHOUT_GAVL=ON"
    - "-DNO_SSE2=ON"
  dependencies:
    - cairo/1.18.4
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cmake 4.1.2 on HarmonyOS requires CMAKE_SYSTEM_NAME=Linux to pass try_compile checks (FindThreads, compiler ABI detection) ref:E100"
  - "frei0r-plugins is a plugin library with no executables, only .so files in lib/frei0r-1/ ref:A050"
  - "OpenCV and gavl not available as precompiled packages; disabled with -DWITHOUT_OPENCV=ON -DWITHOUT_GAVL=ON ref:A020"
  - "SSE2 not available on aarch64; disabled with -DNO_SSE2=ON to avoid try_compile failures in kaleid0sc0pe ref:E100"