# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: frei0r-plugins/3.1.3
homepage: "https://github.com/dyne/frei0r"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# frei0r-plugins does not include a test suite in its cmake configuration.
# ctest --output-on-failure returned "No tests were found".
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 frei0r API 头文件可包含，FREI0R_MAJOR_VERSION 正确，以及插件 .so 文件存在"
    command: "./test_frei0r"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
