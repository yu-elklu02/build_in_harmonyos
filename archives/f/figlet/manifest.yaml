software: figlet
display: "FIGlet"
description: "FIGlet — 将普通文本转换为大号 ASCII 艺术字的命令行工具"
category: tool
homepage: "https://www.figlet.org/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用 clang 编译，需覆盖 Makefile 中的 CC=gcc 和 LD=gcc"
    - "需添加 #include <sys/cdefs.h> 到 utf8.h 解决 __BEGIN_DECLS 宏未定义"
    - "XCFLAGS=-DTLF_FONTS 启用 TOIlet TLF 字体支持"
    - "DEFAULTFONTDIR 编译时硬编码字体路径"
  common_dependencies: []

versions:
  "2.2.5":
    status: published
    build_date: "2026-07-15"
