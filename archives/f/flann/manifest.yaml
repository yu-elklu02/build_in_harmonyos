# 软件级 manifest
# 文件位置: archives/f/flann/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: flann

# 显示名
display: "FLANN"

# 一句话描述
description: "Fast Library for Approximate Nearest Neighbors, 高效近似最近邻搜索库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://github.com/flann-lib/flann"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "C++ 库, CMake 构建, 提供 C/C++ 双 API"
    - "对 lz4 是硬依赖 (serialization), OHOS 无 system liblz4 → vendor lz4 源码静态编译进库"
    - "需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "删除上游 lib/cmake 导出, 下游统一用 conan 的 flann::flann 目标"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.9.2":
    status: built
    build_date: 2026-07-15
