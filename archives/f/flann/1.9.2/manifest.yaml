# 版本级 manifest
# 文件位置: archives/f/flann/1.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.2"

# 软件名
software: "flann"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/flann-lib/flann/archive/refs/tags/1.9.2.tar.gz"

  # 源码校验和
  sha256: "e26829bb0017f317d9cc45ab83ddcb8b16d75ada1ae07157006c1e7d601c8824"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_SKIP_RPATH=ON"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_PYTHON_BINDINGS=OFF"
    - "-DBUILD_MATLAB_BINDINGS=OFF"
    - "-DBUILD_CUDA_LIB=OFF"
    - "-DBUILD_DOC=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DUSE_OPENMP=OFF"
    - "-DUSE_MPI=OFF"

  # 编译依赖列表（格式: name/version）
  # flann 硬依赖 lz4, OHOS 无 system liblz4, vendor lz4 1.9.4 源码静态编译
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-cmake-vendor-lz4.patch"
    description: "去掉 pkg_check_modules(LZ4) 硬依赖, 改为 vendor lz4 1.9.4 (lz4.c+lz4hc.c) 静态 PIC 内部目标链入 flann 库"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "flann 是 C++ 近似最近邻搜索库, CMake 构建, 提供 C/C++ 双 API"
  - "上游对 lz4 是硬依赖 (serialization.h include <lz4.h>, 顶层 pkg_check_modules REQUIRED), 无 CMake 选项可关闭"
  - "OHOS 无 system liblz4 / pkg-config, 制品仓亦无 lz4 配方 → vendor lz4 1.9.4 源码 (lz4.c+lz4hc.c) 为静态 PIC 目标链入共享库"
  - "lz4_vendored 须注册进 flann-targets export set, 否则 install(EXPORT) 报静态库依赖不在导出集; 用 PRIVATE 关键字避免泄漏到接口"
  - "flann C++ API 实为 header-only 模板 (flann_cpp.so 近空), serialization.h 又内联引用 lz4 → 须把 lz4.h/lz4hc.h 头与 liblz4_vendored.a 一并装包, 消费者编译+链接都要 lz4"
  - "上游 cmake_minimum_required(2.6) 过旧, 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "flann 唯一的 Linux 专属分支 (whole-archive) 还要求 GNUCC, clang 不取, 故显式 CMAKE_SYSTEM_NAME=Linux 安全"
  - "hnp clang wrapper 使 CMake compiler id=unknown → SHARED 目标不自动加 -fPIC → 链接报 recompile with -fPIC; 无条件注入 -fPIC 解决"
  - "OHOS cmake 不支持共享库 install 时的 RPATH 重链接 (CMakeRelink.dir), 需 CMAKE_SKIP_RPATH=ON, 运行期靠 conanrun LD_LIBRARY_PATH"
  - "test_package 直接 clang++ 编译链接 (不走 CMakeDeps), 避开 conan 2.29.1 对带 soname 近空共享库的 find_library 缺陷; 编译器取自 profile conf (容器 hnp wrapper / CI OHOS clang)"
