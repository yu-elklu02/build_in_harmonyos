# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flann/1.9.2
homepage: "https://github.com/flann-lib/flann"

# 上游测试命令 (test/ 下为 GoogleTest 可执行, 需 GTest + HDF5 + 在线下载数据集)
upstream_check_command: "ctest -N"

# 上游 test/ 下 8 个 gtest 单测 (flann_autotuned/hierarchical/kdtree/kdtree_single/
# kmeans/linear/lsh/multithreaded), 由 BUILD_TESTS=ON 构建, 依赖 GTest + HDF5 +
# 在线下载数据集 (cs.ubc.ca)。本适配关闭 BUILD_TESTS, test_package 使用自带 smoke test。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (代表性, 因关闭 BUILD_TESTS 不在构建产物中)
upstream_tests:
  - file: test/flann_kdtree_test.cpp
    source: flann-1.9.2/test/flann_kdtree_test.cpp
    description: "kd-tree 索引最近邻搜索 gtest 单测 (需 GTest+HDF5+数据集)"
    command: "./unit/flann_kdtree_test"

test_package_tests:
  - file: test_flann.cpp
    description: "用 flann C++ API 建 kd-tree 索引并 knn 搜索, 验证数据点自身最近邻命中"
    command: "./test_flann"

assertion_count: 2
