patches_applied: []

test_results:
  type: official
  upstream: "test/shlex_test.f90: 363 POSIX, MSVCRT, UCRT and quoting checks"
  test_package: "23 consumer checks using split, shlex, ms_split and ms_quote"
  host_validation: "PASS with LLVM Flang 20.1.8 and GCC 15: official 363 checks; Flang consumer 23 checks"
  harmonyos_device: "Not executed locally because hdc reported no connected target"

knowledge_gained:
  - "The upstream fpm project is one module plus one test program, so direct flang compilation preserves the official test corpus without adding fpm as a runtime dependency."
  - "The public Fortran module file is compiler-format-specific; consumers use the same flang-ohos/20.1.0 tool requirement as the package build."
