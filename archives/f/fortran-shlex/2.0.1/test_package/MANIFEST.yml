package: fortran-shlex/2.0.1
homepage: "https://github.com/perazz/fortran-shlex"

upstream_check_command: "fpm test"
upstream_test_in_build: true
upstream_test_command: "Compile test/shlex_test.f90 with flang, link libfortran-shlex.a, and run it"

upstream_tests:
  - file: test/shlex_test.f90
    source: fortran-shlex-2.0.1/test/shlex_test.f90
    description: "Official upstream corpus: 10 POSIX, 224 MSVCRT, 110 UCRT, 12 cmd quoting and 7 non-cmd quoting checks"
    command: "./fortran_shlex_upstream_tests"

test_package_tests:
  - file: test_fortran_shlex.f90
    description: "Consumer links the packaged static library, imports the packaged module file, and checks split, shlex, ms_split and ms_quote"
    command: "./test_fortran_shlex"

# The official upstream program performs 363 checks and the consumer performs 23.
assertion_count: 386
