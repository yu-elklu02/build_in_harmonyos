# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flashrom/1.6.0
homepage: "https://flashrom.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# flashrom 1.6.0 uses meson test with cmocka, but tests are disabled in this
# adaptation (tests=disabled) because cmocka is not available in the artifact repo.
upstream_tests:
  - file: tests/flashrom_test.c
    source: flashrom-1.6.0/tests/flashrom_test.c
    description: "flashrom unit tests using cmocka framework"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: calls flashrom_init/flashrom_shutdown API"
    command: "./test_flashrom"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
