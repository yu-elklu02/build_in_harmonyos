software: flashrom
build_system: meson
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"
# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL
  url: "https://github.com/flashrom/flashrom/archive/refs/tags/v1.6.0.tar.gz"
  # 源码校验和
  sha256: "735c077ee8ac08e236ef7b7db894ab22d5f4b75f10156a4732bd818a1e21fcc5"
  # 压缩格式
  tar_format: tar.gz
# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  system: meson
  # 配置选项列表
  configure_options:
    - "-Dprogrammer=dummy"
    - "-Drpmc=disabled"
    - "-Dtests=disabled"
    - "-Dclassic_cli=enabled"
    - "-Ddocumentation=disabled"
  # 编译依赖列表（格式: name/version）
  # No external dependencies required with dummy programmer
  dependencies: []
  # 编译器
  cc: clang
  cxx: clang++
# ============================================================
# 补丁信息
# ============================================================
# 应用的补丁列表
patches_applied: []
# ============================================================
# 知识沉淀
# ============================================================
# 编译中学到的知识
knowledge_gained:
  - "flashrom 1.6.0 uses meson build system"
  - "With programmer=dummy, no external dependencies (libusb, libpci, etc.) are needed"
  - "MesonToolchain requires explicit ar/strip path setting on HarmonyOS (llvm-ar not in default PATH)"
  - "Meson detects HarmonyOS as 'harmonyos', not 'linux' - Linux-specific programmers are correctly excluded"
  - "conan 2.29.1 (OHOS-adapted) uses meson.build() not meson.compile()"
  - "conan 2.29.1 (OHOS-adapted) does not have meson_layout - use basic_layout instead"
