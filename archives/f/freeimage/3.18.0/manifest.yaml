# ============================================================
# Conan 配方（2026-07-30 新增，与上方预编译包并存）
# ============================================================

conan:
  recipe: conanfile.py
  build_system: makefile        # 手写 Makefile.gnu，生成器不支持 → 手写 recipe
  applies_patches: false        # patches/0001-Makefile.gnu.patch 属预编译包那条线；
                                # conan 配方不调用上游 make install，故未应用它
  cflags:
    - "-O3"
    - "-fPIC"
    - "-fexceptions"
    - "-fvisibility=hidden"
    - "-DPNG_ARM_NEON_OPT=0"
  cxxflags_extra:
    - "-std=c++17"
    - "-Wno-register"
    - "-Wno-dynamic-exception-spec"
    - "-D_LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR"
  make_vars: 'CC / CXX / AR(hnp llvm-ar) / LIBRARIES="-lc++" 走命令行；CFLAGS/CXXFLAGS 走环境变量'
  sign_so: true                 # -s 剥掉了链接器自签，须显式重签
  ndebug: true                  # Release 语义，上游 Makefile 不带，必须自己补
  upstream_tests_in_build: "TestAPI/（13 个 .cpp / 38 次断言调用），退出码 0，未改上游测试代码"
  known_limitations:
    - "JPEG-XR(LibJXR) 编码不可用（aarch64，全参数组合实测）；解码可用（上游 testMemIO(exif.jxr) 通过坐实）"

libs:
  - freeimage                   # libfreeimage.so（SONAME libfreeimage.so.3）+ libfreeimage.a

requires: []                    # 九个编解码器全部内嵌，无外部依赖

verified:
  device: "HarmonyOS PC 2in1"
  date: "2026-07-30"
  conan: "2.29.1"
  profiles: "-pr:h ohos -pr:b ohos_build（settings 与 CI ohos-aarch64 逐项一致 → package_id 相同）"
  evidence: >-
    裸 conan create rc=0（约 4 分钟）；上游 TestAPI 套件在 build() 内运行退出码 0（38 次断言）；
    test_package 13 条断言全过（8 个自带 codec 逐个
    encode→decode 往返：BMP/PNG/TIFF/WebP 无损逐像素全等，JPEG/JP2/J2K 带容差，OpenEXR
    走 FIT_RGBF 浮点无损，LibJXR/LibRawLite 断言插件注册与读取）；SONAME=libfreeimage.so.3；
    DT_NEEDED 仅 libc++_shared.so + libc.so；.codesign 段在且 display-sign 报 self-sign；
    导出 598 个 FUNC
