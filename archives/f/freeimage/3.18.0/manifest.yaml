# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  build_system: makefile
  configure_options:
    - "make -f Makefile.gnu"
  dependencies: []
  cc: clang
  cxx: clang++
  cflags:
    - "-fPIC"
    - "-O2"
    - "-fexceptions"
    - "-fvisibility=hidden"
    - "-DOPJ_STATIC"
    - "-DNO_LCMS"
    - "-DDISABLE_PERF_MEASUREMENT"
    - "-D__ANSI__"
    - "-DPNG_ARM_NEON_OPT=0"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile-gnu-ohos-adaptations.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "FreeImage 使用自定义 Makefile.gnu（非 autotools），需要通过 PREFIX 和 DESTDIR 变量支持 DESTDIR 安装模式"
  - "内嵌 libPNG 在 aarch64 平台自动启用 ARM NEON 优化（PNG_ARM_NEON_OPT=2），但未包含 arm/ 实现目录，需在 CFLAGS 中添加 -DPNG_ARM_NEON_OPT=0 禁用"
  - "鸿蒙系统缺少 install 命令，Makefile 安装目标需用 mkdir/cp/chmod 替代"
  - "Makefile 安装目标使用 -o root -g root 在鸿蒙系统上失败，需移除用户和组归属参数"
  - "HMDFS 文件系统不支持 ln -sf 覆盖式创建符号链接，需改用 rm -f && ln -s 模式"
  - "FreeImage 静态库包含构建工具 b44ExpLogTable 的 main 函数，静态链接时会产生 main 符号冲突，建议使用 -Wl,--allow-multiple-definition 或优先使用动态库"
  - "conan 配方：CFLAGS/CXXFLAGS 必须走环境变量——make 命令行赋值会压掉 makefile 的 `CFLAGS += $(INCLUDE)`，导致 531 个源文件全报 FreeImage.h not found"
  - "conan 配方：profile 声明 cppstd=17 但直接驱动 make 时无人注入 -std=（clang 默认 gnu++14），显式补 -std=c++17 后需三个逃生旗标：-Wno-register / -Wno-dynamic-exception-spec / -D_LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR，零源码补丁"
  - "conan 配方：tools.gnu:ar 不是 Conan 注册过的 conf（2.29.1），conf.get 对未注册键直接抛异常、连 default 都不返回，AR 须直接给 hnp llvm-ar"
  - "SONAME 是 libfreeimage.so.3 而产物名为 libfreeimage-3.18.0.so，两者都不是 -lfreeimage 找的 libfreeimage.so，须补齐两级软链"
  - "共享库链接行带 -s（链接期 strip）会剥掉链接器自签的 .codesign 段，故 package() 必须显式重签"
  - "PNG_ARM_NEON_OPT=0 的缺陷在消费侧才暴露：.so 自身能链出（容忍未定义符号），直接链接时才报 png_init_filter_functions_neon 未定义——纯 dlopen 探针会漏"
  - "已知限制：JPEG-XR(LibJXR) 编码在 aarch64 上全参数组合下均失败（WMP_errFail），插件却自报 SupportsWriting=1；解码面未受影响"
  - "入参约束：JPEG2000 最小边须 >= 64（OpenJPEG 默认 6 层分辨率），小于此报 Number of resolutions is too high"
  - "settings.build_type=Release 必须自己补 -DNDEBUG：上游 Makefile 不带，且直接驱动 make 时无 toolchain generator 代劳；不补则上游 TestAPI 读 exif.jxr 触发 PluginJXR.cpp:493 的 assert(FALSE) 而 abort"
  - "上游自带 TestAPI 套件（13 个 .cpp / 38 次断言）已接入 build()：g++→clang++、补 C++17 逃生旗标、加 -Wl,--allow-multiple-definition 绕 b44ExpLogTable 的 main 冲突；未改上游测试代码"
  - "JXR 限定：只有编码不可用，解码是好的——上游 testMemIO(exif.jxr) 在本包上通过"

