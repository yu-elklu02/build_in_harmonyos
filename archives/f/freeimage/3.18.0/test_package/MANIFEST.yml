package: freeimage/3.18.0

# 上游自带测试套件 TestAPI/（13 个 .cpp + MainTestSuite.cpp 驱动），已在 conanfile.build()
# 里编译并运行（照上游 TestAPI/Makefile 的编译行，g++→clang++、补 C++17 逃生旗标、
# 加 -Wl,--allow-multiple-definition 绕开静态库里 b44ExpLogTable 的 main 符号冲突）。
upstream_test_in_build: true
upstream_tests:
  - suite: "TestAPI/"
    driver: "MainTestSuite.cpp"
    files: 13
    invocations: 38
    coverage: >-
      testAllocateCloneUnload / testImageType / testImageTypeTIFF /
      testMemIO(sample.png + exif.jxr) / testMultiPage / testStreamMultiPage /
      testMultiPageMemory / testJPEG(异常路径) / testImageChannels / testHeaderOnly /
      testSupportsNoPixels(25 种格式，含 JPEG-XR) / testExifRaw / testThumbnail /
      testWrappedBuffer / testCreateView
    result: "退出码 0，38 次调用全过（真机 HarmonyOS PC 2in1）"
    modified: false        # 未改上游任何一行测试代码，仅改编译命令（见上）

test_package_tests:
  - file: test.cpp
    description: >-
      补上游套件未覆盖的编解码往返：直接链接 -lfreeimage（非 dlopen 探针），
      对每个自带编解码器做真实 encode→decode 往返并逐像素比对 ——
      BMP / PNG(LibPNG+ZLib) / TIFF(LibTIFF4) / WebP(LibWebP) 四项要求无损逐像素全等；
      JPEG(LibJPEG) 与 JPEG2000(LibOpenJPEG，JP2 与 J2K 两种封装) 用平滑图 + 容差；
      OpenEXR 走 FIT_RGBF 浮点无损往返；LibJXR 与 LibRawLite 断言插件注册与读取能力
      （LibJXR 编码在 aarch64 上实测不可用，见 notes.md 已知限制；其解码已由上游
      testMemIO(exif.jxr) 坐实）；另验版本号、插件数、TIFF+Deflate 压缩路径与格式嗅探。
    command: "./test_freeimage"
assertion_count: 13
