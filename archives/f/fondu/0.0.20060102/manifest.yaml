# 版本级 manifest — fondu 0.0.20060102
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0.20060102"

# 软件名
software: "fondu"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-04"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool 官方源码包）
  url: "https://deb.debian.org/debian/pool/main/f/fondu/fondu_0.0.20060102.orig.tar.gz"

  # 源码校验和（已核验）
  sha256: "22bb535d670ebc1766b602d804bebe7e84f907c219734e6a955fcbd414ce5794"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（config.sub/OHOS patch 在 conanfile.py build() 内 inline 处理）
  configure_options: []
  # 例如:
  # - "--build=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）— 无外部依赖，仅 libc + libm
  dependencies: []
  # 例如:
  # - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（config.guess/config.sub OHOS 支持为 conanfile.py inline 处理）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "2006 版 config.sub 无 aarch64 CPU 支持，需 inline 添加 aarch64/aarch64_be + linux-ohos* OS 分支（参考 autotools-patterns.md #2-#3）"
  - "fondu 是命令行工具集合（8 个可执行文件），package_type=application，test_package 需自备 smoke test（上游无测试用例）"
