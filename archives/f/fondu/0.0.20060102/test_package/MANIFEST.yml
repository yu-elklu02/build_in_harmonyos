# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fondu/0.0.20060102
homepage: "https://fondu.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fondu 0.0.20060102 源码无 test/、tests/ 目录，Makefile.in 无 check 目标，
# configure.in 极简（AC_INIT + AC_PROG_CC + AC_CANONICAL_HOST），无测试框架。
# 核验依据：源码包内 find 无 test 目录、grep Makefile.in 无 check target。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 fondu -h 验证二进制可执行且打印 Usage（退出码 0）"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
