# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ffuf/2.1.0-r21
homepage: "https://github.com/ffuf/ffuf"

# 上游测试命令 (Go projects use `go test ./...`)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ffuf has unit tests in pkg/ subdirectories (14/15 pass, 1 upstream bug TestToCSV)
upstream_tests:
  - file: pkg/ffuf/ffuf_test.go
    source: ffuf-2.1.0/pkg/ffuf/ffuf_test.go
    description: "ffuf core package unit tests"
    command: "go test ./pkg/ffuf/..."
  - file: pkg/output/output_test.go
    source: ffuf-2.1.0/pkg/output/output_test.go
    description: "output formatting tests"
    command: "go test ./pkg/output/..."
  - file: pkg/filter/filter_test.go
    source: ffuf-2.1.0/pkg/filter/filter_test.go
    description: "filter logic tests"
    command: "go test ./pkg/filter/..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify ffuf -V returns version string"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 45
