# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（Makefile参数传递）
  configure_options:
    - "CC=clang"
    - "CFLAGS=-Wall -O3 -fPIC"
    - "LDLIBS=-lm"
  # 此项目为简单 Makefile，无 configure 脚本
  # 通过命令行传递 CC、CFLAGS、PREFIX 参数

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # fakesteak 仅依赖 libc + libm，无外部依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# 补丁内容: 添加 DESTDIR 支持 + CFLAGS 添加 -fPIC（R20 铁律）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "简单 Makefile 项目需要手动添加 DESTDIR 变量支持（R20 铁律），原始 Makefile 使用 $(PREFIX)/bin 需改为 $(DESTDIR)$(PREFIX)/bin"
  - "鸿蒙平台无 cc 命令，需用 CC=clang 传递编译器（Makefile 中 CC := cc 默认值不适用）"
  - "HMDFS 文件系统限制: cp 覆盖已存在文件会报 Operation not permitted，需先 rm -f 再 cp"
  - "Python subprocess 调用 make 时 --output-sync 参数在鸿蒙平台不兼容，导致 G0 自动化验证失败"

