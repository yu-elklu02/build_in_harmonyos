# test_package/MANIFEST.yml

package: fcheck/2.7.59
homepage: "http://web.archive.org/web/20050415074059/www.geocities.com/fcheck2000/"

upstream_check_command: "N/A - upstream ships no automated test target"
upstream_test_in_build: true
upstream_test_command: "perl -c fcheck through Conan VirtualRunEnv when can_run(self) is true"

upstream_tests:
  - file: fcheck
    source: fcheck/fcheck
    description: "Perl syntax check for the upstream filesystem baseline checker"
    command: "perl -c fcheck"

test_package_tests:
  - file: test.sh
    description: "Creates watched directories, builds fcheck baseline databases, then verifies explicit and package-default config paths through the packaged launcher"
    command: "sh test.sh <bin/fcheck> <workdir> # runs fcheck -acf/-af with generated config and bare fcheck with package default config"
  - file: conanfile.py
    description: "Checks installed launcher/script/sample config and invokes test.sh through Conan VirtualRunEnv"
    command: "conan test"

assertion_count: 6
