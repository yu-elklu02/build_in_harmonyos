# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: freeunit/1.36.0
homepage: "https://github.com/freeunitorg/freeunit"

# 上游 C 单元测试套件：configure --tests 后 make 产出聚合测试二进制
# build/tests（src/test/nxt_tests.c 的 main）。配方 build() 在真机按此
# 命令链真实执行：sh ./configure --tests && make -j1 && make tests &&
# ./build/tests。
upstream_check_command: "sh ./configure --tests && make -j1 && make tests && ./build/tests"
upstream_test_in_build: true
upstream_test_command: "./build/tests"

# 上游实际运行的测试程序（聚合套件入口 + 组成它的测试源文件）
upstream_tests:
  - file: src/test/nxt_tests.c
    source: freeunit-1.36.0/src/test/nxt_tests.c
    description: "聚合 C 单元测试入口（main）：依次调用 28 个无条件测试函数（nxt_random/term_parse/msec_diff/rbtree/rbtree1/mp/mem_zone/lvlhsh/gmtime/sprintf/malloc/utf8/http_parse/strverscmp/base64/string/conf_json_depth/http_route_addr/port_fail 等，部分多参数集多次调用），另有 NXT_HAVE_CGROUP 与 NXT_HAVE_CLONE_NEWUSER 条件编译的 cgroup/clone_creds 两个用例；任一失败即退出 1"
    command: "./build/tests"
  - file: src/test/nxt_mp_test.c
    source: freeunit-1.36.0/src/test/nxt_mp_test.c
    description: "内存池 (nxt_mp) 压力测试，main() 中以 3 组参数调用"
    command: "./build/tests"
  - file: src/test/nxt_lvlhsh_test.c
    source: freeunit-1.36.0/src/test/nxt_lvlhsh_test.c
    description: "哈希表 (nxt_lvlhsh) 测试，main() 中以 4 组参数调用"
    command: "./build/tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_freeunit.sh
    description: "运行打包后的 unitd --version 校验版本号 (unit version: 1.36.0) 与 unitd -h 校验帮助输出，共 2 个断言"
    command: "./test_freeunit.sh <pkg>/bin/unitd"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2

# 审计说明：上游测试存在且已在真机完整执行。
upstream_tests_exist: true
upstream_test_audit: >
  检查范围：freeunitorg/freeunit v1.36.0 tag 源码树。C 单元测试位于
  src/test/（nxt_tests.c + 25 个 nxt_*_test.c），聚合入口 nxt_tests.c 的
  main() 依次调用 28 个无条件测试函数（nxt_random_test / nxt_term_parse_test /
  nxt_msec_diff_test / nxt_rbtree_test ×2 / nxt_rbtree1_test ×2 / nxt_mp_test
  ×3 / nxt_mem_zone_test ×3 / nxt_lvlhsh_test ×4 / nxt_gmtime_test /
  nxt_sprintf_test / nxt_malloc_test / nxt_utf8_test / nxt_http_parse_test /
  nxt_strverscmp_test / nxt_base64_test / nxt_string_test /
  nxt_conf_json_depth_test / nxt_http_route_addr_test / nxt_port_fail_test），
  另有两个条件编译用例：nxt_cgroup_test (NXT_HAVE_CGROUP) 与
  nxt_clone_creds_test (NXT_HAVE_CLONE_NEWUSER)，是否编入由 configure 结果
  build/include/nxt_auto_config.h 决定，配方 _count_tests() 按该头文件实读
  计数。每个测试函数成功时以 NOTICE 级别打印 "<name> test passed" 日志行，
  任一失败立即 return 1（短路径），故退出码 0 且输出含 "test passed" 行即
  代表全部执行用例通过，discovered/executed/passed 以此为准（discovered =
  28 + 条件编译用例数，实读配置头文件；数字来自真机 ./build/tests 框架输出
  与退出码，非硬编码）。make tests 还会产出辅助测试二进制 utf8_file_name_test
  （依赖文件系统文件名语义）、ncq_test/vbcq_test（队列压力测试）、
  unit_app_test/unit_close_test/unit_websocket_chat/unit_websocket_echo
  （libunit 应用协议测试，需运行中的 unitd 路由进程配合），它们不属于
  nxt_tests.c 聚合套件，不计入 discovered。test/ 下的 Python 集成测试套件
  （pytest，约 300 个用例）需以 root 启动运行中的 unitd 并配套 node/python/
  perl/php/go/ruby/wasm 等应用模块运行时，headless 真机预检无法满足，未纳入
  本次 preflight，属环境依赖缺口而非代码缺陷。结论：上游存在测试，聚合 C
  单元套件已在真机 build() 阶段真实完整执行。
