patches:
  - patch_file: "patches/0001-os-detect-harmonyos-as-linux.patch"
    patch_description: "Treat HarmonyOS/OHOS uname -s as Linux so NXT_LINUX enables _GNU_SOURCE, malloc.h and sys/syscall.h (OHOS musl-like libc hides cpu_set_t/CPU_* otherwise)"
    patch_type: "portability"
  - patch_file: "patches/0002-pthread-cancel-feature-check.patch"
    patch_description: "Add NXT_HAVE_PTHREAD_CANCEL configure feature check and guard nxt_thread_cancel() (OHOS musl-like libc does not declare pthread_cancel; the signal thread is never started there since epoll/signalfd provide signal event notifications)"
    patch_type: "portability"
