# 版本级 manifest — freeunit 1.36.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.36.0"

software: "freeunit"

# 编译状态: built (verify 通过未 upload)
status: built

build_date: "2026-08-11"

# 构建系统 (必填顶层字段): NGINX Unit 自研 configure (auto/ 脚本), 非 GNU autotools
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/freeunitorg/freeunit/archive/refs/tags/1.36.0.tar.gz"
  sha256: "f13e9322a56868fe905a847d800b167bec45d14c0c2dedf94e7752f26ee50493"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom

  configure_options:
    - "--tests"

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "freeunit (NGINX Unit fork) 用自研 configure (auto/ 脚本) 而非 GNU autotools：sh ./configure --tests 生成 build/Makefile，make 产出 build/sbin/unitd 与测试二进制"
  - "上游 C 单元测试聚合入口 build/tests (src/test/nxt_tests.c)：28 个无条件测试函数 + 条件编译的 cgroup/clone_creds，任一失败即退出 1；每用例成功打印 'test passed' (NOTICE)"
  - "test/ 目录 Python 集成测试套件需 root 运行中的 unitd + 各语言应用模块运行时，headless 真机无法执行，属环境依赖缺口"
