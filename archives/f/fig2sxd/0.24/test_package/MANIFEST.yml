# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fig2sxd/0.24
homepage: https://gitlab.com/acfbuerger/fig2sxd

# 上游测试命令 — fig2sxd 上游无测试套件（仅 Makefile 编译目标）
upstream_check_command: "make all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fig2sxd 上游无 test/check 目标，仅编译验证
upstream_tests:
  - file: Makefile
    source: fig2sxd-v0.24/Makefile
    description: "fig2sxd 编译验证 — 确保所有源文件可正常编译链接"
    command: "make all"
    condition: "native / 交叉编译均执行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 fig2sxd 二进制存在 + stdin→stdout 最小 xfig 转换"
    command: "conan create (test_package _check_binary_exists + 转换验证)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2