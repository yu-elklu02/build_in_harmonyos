# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fribidi/1.0.16
homepage: https://github.com/fribidi/fribidi

# fribidi has `make check` upstream tests, verified during exploration build
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - description: "fribidi run.tests — Unicode Bidi conformance tests"
    command: "make check"

test_package_tests:
  - file: test_fribidi.c
    description: "fribidi version info + UTF-8 charset conversion + log2vis bidi algorithm"
    command: "./test_fribidi"

assertion_count: 3
