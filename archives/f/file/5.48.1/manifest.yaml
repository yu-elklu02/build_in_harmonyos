knowledge_gained:
  - "config.guess 需要添加 HarmonyOS 平台识别分支"
  - "config.sub 需要添加 linux-ohos* kernel-os 白名单和 ohos* 系统类型"
  - "configure umask 077 需改为 022 以解决 HMDFS 临时目录权限问题"
  - "Conan profile 中 /data/service/hnp/bin/ 路径在本环境不存在，需在 conanfile.py build() 中覆盖 conanbuild.sh"
  - "test_package 的 CMakeToolchain 也需覆盖编译器路径"
  - "zlib/bzip2/xz 作为系统预编译包使用，不在 ohpcd Conan remote 中"
  - "libmagic.a 静态链接时依赖压缩库 (zlib/zstd/lzma)，test_package 需在 CMakeLists.txt 中链接这些库"

