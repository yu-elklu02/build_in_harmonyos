software: file
display: "file"
description: "File type identification tool that checks file content (magic numbers)"
category: system
homepage: "https://www.darwinsys.com/file/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要修补 config.sub 添加 linux-ohos* kernel-os 白名单"
    - "鸿蒙 SELinux 限制导致动态链接的 .so 软链接无法加载"
    - "必须使用 --enable-static --disable-shared LDFLAGS=-static 静态链接"
    - "需要 --disable-libseccomp（鸿蒙不提供此库）"
    - "需要修补多个 man page 和源文件中的路径问题"
  common_dependencies:
    - zlib
    - bzip2
    - xz

