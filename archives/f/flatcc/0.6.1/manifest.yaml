software: flatcc
version: "0.6.1"
status: built
build_date: "2026-06-17"
build_system: cmake

source:
  url: "https://github.com/dvidelabs/flatcc/archive/refs/tags/v0.6.1.tar.gz"
  sha256: "2533c2f1061498499f15acc7e0937dcf35bc68e685d237325124ae0d6c600c2b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DFLATCC_ALLOW_WERROR=OFF"
    - "-DFLATCC_INSTALL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cmake 需要添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 解决 CMake 3.5+ 兼容性问题"
  - "需要 -DFLATCC_ALLOW_WERROR=OFF 禁用 -Werror，因为 clang 15.0.4 会触发 -Wunused-but-set-variable"
  - "需要 -DFLATCC_INSTALL=ON 启用安装目标，默认为 OFF"
