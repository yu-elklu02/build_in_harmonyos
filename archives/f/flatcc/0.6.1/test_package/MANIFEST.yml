# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: flatcc/0.6.1
homepage: "https://github.com/dvidelabs/flatcc"

# 上游测试命令
upstream_check_command: "ctest --test-action=test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --test-action=test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/emit_test/emit_test.c
    source: flatcc-0.6.1.tar.gz/test/emit_test/emit_test.c
    description: "Emit test for flatcc code generation"
    command: "./emit_test"
  - file: test/cgen_test/cgen_test.c
    source: flatcc-0.6.1.tar.gz/test/cgen_test/cgen_test.c
    description: "Code generation test"
    command: "./cgen_test"
  - file: test/json_test/test_json.c
    source: flatcc-0.6.1.tar.gz/test/json_test/test_json.c
    description: "JSON parsing and printing test"
    command: "./test_json"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.sh
    description: "Runs flatcc --version and compiles a minimal .fbs schema"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 24
