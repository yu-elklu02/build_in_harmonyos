software: fzy

# ============================================================
# 必须字段
# ============================================================

version: "1.1"
build_system: makefile
status: built
build_date: "2026-07-17"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jhawthorn/fzy/archive/refs/tags/1.1.tar.gz"
  sha256: "93d300d9c6c7063b2c6bda4e08a9704a029ec33f609718cd95443d1a890aff4e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CFLAGS=-O2 -fPIC"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "fzy 使用自定义 Makefile，CC=clang CFLAGS=-O2 -fPIC 直接编译即可，无需 configure"
  - "测试框架需要 -Ideps 才能找到 greatest/greatest.h，命令行覆盖 CFLAGS 时需包含原始 Makefile 的 -Ideps -std=c99"
  - "fzy 无外部依赖，仅链接 -lpthread 和 libc.so"
  - "fzy 非交互验证使用 -e (--show-matches) 模式，可管道输出评分排序结果"
  - "G0 干净构建验证的 configure 步骤对纯 Makefile 项目不适用，需手动验证"