website: https://ffmpeg.org
license: GPL/LGPL

versions:
  8.0.3:
    status: built
    build_date: 2026-07-27
    packaging: conan
    notes: |
      - conan 配方（os=OHOS arch=armv8），真机原生 conan create 验证，test_package 8 条断言全绿
      - 按 LGPL-2.1 构建：未启用 --enable-gpl / --enable-nonfree
      - soname: avcodec 62 / avformat 62 / avutil 60 / avdevice 62 / avfilter 11 / swscale 9 / swresample 6
      - 已接入外部编解码器与功能库：openh264 / libvpx / opus / lame / openssl / freetype + harfbuzz +
        fontconfig / libxml2 / bzip2 / xz
      - drawtext 需 freetype + harfbuzz
    provides:
      - bin/ffmpeg
      - bin/ffprobe
