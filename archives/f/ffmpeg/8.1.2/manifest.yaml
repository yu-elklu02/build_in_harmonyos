version: '8.1.2'
status: built
build_date: '2026-07-25'

verification:
  device: 'HarmonyOS PC (3QC0124C11000718)'
  command: 'conan create . -pr ohos-native'
  result: 'conan create rc=0，337s（含 12 个依赖），包体积 25M'
  package_size: '25M'
  sonames: 'libavcodec.so.62.28.102 / libavformat.so.62.12.102 / libavutil.so.60.26.102 / libavdevice.so.62.3.102 / libavfilter.so.11.14.102 / libswscale.so.9.5.102 / libswresample.so.6.3.102'
  codesign: '7 个 .so + bin/ffmpeg + bin/ffprobe 共 9 个 ELF 均含 .codesign 段，CLI 真跑 rc=0'
  e2e: 'lavfi 生成视频+音频 → mpeg4/aac 编码 → mp4 封装(59123 字节) → ffprobe 解析 → 解码回 null，全部 rc=0'
  deploy: 'usr_local deployer 部署后 .pc 为 libdir=${exec_prefix}/lib、includedir=${prefix}/include，pkg-config 误指 conan cache 的模块数为 0'

source:
  url: 'https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz'
  sha256: '464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c'
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - '--target-os=linux'
    - '--arch=aarch64'
    - '--enable-shared'
    - '--disable-static'
    - '--disable-autodetect'
    - '--enable-pthreads'
    - '--enable-zlib'
    - '--disable-doc'
    - '--disable-ffplay'
    - '--disable-debug'
    - '--disable-stripping'
    - '--enable-libopenh264'
    - '--enable-libvpx'
    - '--enable-libopus'
    - '--enable-libmp3lame'
    - '--enable-openssl'
    - '--enable-libfreetype'
    - '--enable-libharfbuzz'
    - '--enable-libfontconfig'
    - '--enable-libxml2'
    - '--enable-bzlib'
    - '--enable-lzma'
  dependencies:
    - 'zlib/1.3.1.1'
    - 'bzip2/1.0.8'
    - 'xz/5.6.2'
    - 'openssl/3.5.6'
    - 'freetype/2.14.3'
    - 'harfbuzz/14.2.0'
    - 'fontconfig/2.18.1.1'
    - 'libxml2/2.15.3'
    - 'openh264/2.6.0'
    - 'libvpx/1.16.0'
    - 'opus/1.5.2.1'
    - 'lame/4.0'
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - '接入外部库后 drawtext 需要 harfbuzz 而非仅 freetype：FFmpeg 6.1 起 drawtext_filter_deps="libfreetype libharfbuzz"，缺任一个 configure 不报错、只是静默不生成该滤镜'
  - 'ERROR "opus not found using pkg-config" 具误导性：pkg-config 其实找得到（--exists rc=0），失败的是随后的 check_func_headers 编译探测；根因是制品仓 opus 包未设 cpp_info.includedirs（头在 include/opus/），需在消费方补 -I<opus>/include/opus'
  - '用了 cpp_info.components 后，每个直接依赖都必须被某个 component 的 requires 引用，否则 package_info() 报 "The direct dependency X is not used by any (cpp_info/components).requires"；harfbuzz 自身带 components，须引用 harfbuzz::harfbuzz'
  - '外部库探测走 pkg-config，须用 PkgConfigDeps 生成 .pc 并把 PKG_CONFIG_PATH 只指向其生成目录；lame 上游不装 .pc，只能走 -I/-L'
  - '接入外部库后产物不再自包含：bin/ffmpeg 新增 7 个 DT_NEEDED，消费方必须部署整个依赖图（usr_local deployer 会自动展开）'
  - 'FFmpeg 的 configure 是手写 shell 脚本、非 autoconf：不认 --includedir/--build/--host，遇未知选项 die_unknown 退出，必须绕开 AutotoolsToolchain 手拼参数'
  - '设备 uname -s = HarmonyOS，configure 的 target_os_default 取它会 die "Unknown OS"，必须显式 --target-os=linux'
  - 'ffbuild/library.mak 的 install 是 install -m 755 复制 + $(STRIP) 剥离，破坏链接器自签，.so 与 bin/ 都须 binary-sign-tool 重签'
  - '--disable-autodetect 会连带关掉 AUTODETECT_LIBS 里的 THREADS_LIST，须 --enable-pthreads 显式补回，否则丢多线程解码'
  - '.pc 的 libdir/incdir 由 pkgconfig_generate.sh 写成绝对路径字面量，package() 须改写为 ${exec_prefix}/lib 与 ${prefix}/include，否则部署后 pkg-config 仍指向 conan cache'
  - '8.x soname: avcodec 62 / avformat 62 / avutil 60 / avdevice 62 / avfilter 11 / swscale 9 / swresample 6，与 7.1.x 全部不同，两代可并存互不冲突'
  - '8.1.2 相对 7.1.5 的七个适配点逐条复核一致（手写 configure / Unknown OS die / install 复制+strip / .pc 绝对字面量 / AUTODETECT 含 THREADS_LIST / zlib 探测方式 / --incdir 选项名），配方可直接沿用'
