# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: flac/1.4.3
homepage: "https://xiph.org/flac/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_libFLAC
    source: flac-1.4.3/src/test_libFLAC/main.c
    description: "libFLAC unit tests (metadata, stream encoder/decoder)"
    command: "./test_libFLAC"
  - file: test_libFLAC++
    source: flac-1.4.3/src/test_libFLAC++/main.cc
    description: "libFLAC++ unit tests"
    command: "./test_libFLAC++"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 libFLAC 链接和 OGG 支持状态"
    command: "./test_flac"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
