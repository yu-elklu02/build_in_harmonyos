# test_package/MANIFEST.yml — festvox-kdlpc8k 1.4.0
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: festvox-kdlpc8k/1.4.0
homepage: "https://www.cstr.ed.ac.uk/projects/festival/"

# 上游测试命令 (纯语音资源数据包，无可执行测试)
upstream_check_command: "N/A（纯语音资源数据包，无 test/、tests/、Makefile、CMakeLists.txt、configure、ctest -N 或 make check 入口，已核验完整 tarball）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角资源完整性验证)
test_package_tests:
  - file: test_resources.sh
    description: "Voice data resource integrity validation — directory existence, file existence, non-empty, SHA256, ASCII encoding, EST header signature, license text"
    command: "sh test_resources.sh <install_dir>"

# 测试断言总数 (资源完整性断言)
assertion_count: 19
