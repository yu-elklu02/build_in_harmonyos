software: findent
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.3.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/findent/findent-4.3.6.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: autotools

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项（单行字符串格式，供 clean-verify 解析）
  configure_options: "--disable-selfrep"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-shebang-bash.patch"
  - "0002-config.guess-harmonyos.patch"
  - "0003-config.sub-harmonyos.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "toascii.sh 因 SELinux 限制无法直接执行，需用 bash 调用或手动创建 tarfile.inc placeholder"
  - "configure 使用 /bin/sh (toybox) 无法解析 GNU autoconf 脚本，需改为 bash"
  - "config.guess/config.sub 需替换为 2026 版本以支持 HarmonyOS 平台识别"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/findent-4.3.6.orig
  source_work_dir: /storage/Users/currentUser/builds/findent-4.3.6.work
  source_orig_hash: e24412f3f2a3f8e7
  source_work_hash: ab7924005cb78847
  generated_at: '2026-07-14T11:56:05'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
