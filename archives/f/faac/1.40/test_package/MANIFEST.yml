# test_package/MANIFEST.yml
# Upstream test declaration — CI L0e requires this file.
# faac 1.40 uses meson build system and does not ship automated tests.

package: faac/1.40
homepage: "https://github.com/knik0/faac"

# Upstream build system has no automated test suite
upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

# faac does not ship automated tests — functional verification only
upstream_tests: []

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "Encodes one frame of PCM silence via faac API (open, configure, encode, close)"
    command: "./test_faac"

# Number of assertions (faacEncGetVersion, faacEncOpen, faacEncGetCurrentConfiguration,
# faacEncSetConfiguration, faacEncEncode, faacEncClose)
assertion_count: 6
