# test_package/MANIFEST.yml

package: ffprobe/8.1.2
homepage: "https://ffmpeg.org"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/Makefile
    source: ffmpeg-8.1.2/tests/Makefile
    description: "FFmpeg上游测试套件（FATE测试）"
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "消费者测试：运行 ffprobe -version 验证二进制功能"
    command: "ffprobe -version"

assertion_count: 1
