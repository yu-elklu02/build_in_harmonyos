# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: fnt/1.9.1
homepage: "https://github.com/alexmyczko/fnt"

# 上游测试命令 (fnt 是纯 Shell 脚本，无上游测试)
upstream_check_command: ""

# conanfile.py build() 中无上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "通过 test.sh 跑 5 项功能断言 (--help/list/home/shebang/HarmonyOS)"
    command: "/data/service/hnp/bin/bash test.sh"

# 测试断言总数 (test.sh 5 项: --help/list/home/shebang/HarmonyOS)
# conanfile.py test() 调用 test.sh, 不再内联重复断言
assertion_count: 5