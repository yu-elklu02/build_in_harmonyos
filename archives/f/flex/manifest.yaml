software: flex
display: "flex"
description: "Fast Lexical Analyzer Generator — generates scanners (tokenizers) for pattern matching"
category: build-tool
homepage: "https://github.com/westes/flex"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 无法识别 OHOS → 通过 --build=aarch64-unknown-linux-gnu 绕过"
    - "HMDFS 临时目录权限问题 → 补丁 0006 修改 mktemp 模板为 ${TMPDIR:-/tmp}"
    - "bionic 缺失 reallocarray 符号 → 通过 ac_cv_func_reallocarray=no 绕过"
    - "R26 规则要求终端工具静态链接 → 添加 tc.extra_ldflags.append('-static')"
    - "doc/ 目录缺少 makeinfo → package() 手动复制产物跳过 doc/"
  common_dependencies: []
  status: built

versions:
  "2.6.4":
    status: built
    build_date: "2026-04-26"
