# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flex/2.6.4
homepage: "https://github.com/westes/flex"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# make check 实际运行的测试套件
upstream_tests:
  - name: "basic"
    source: "flex-2.6.4/tests/testbasic.l"
    description: "基础词法分析测试"
  - name: "cxx"
    source: "flex-2.6.4/tests/testcxx.l"
    description: "C++ 支持测试"
  - name: "reject"
    source: "flex-2.6.4/tests/testreject.l"
    description: "REJECT 规则测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 flex 二进制可用，生成 scanner 并编译运行"
    command: "cmake . && make && ./test_flex"

# 测试断言总数
assertion_count: 4
