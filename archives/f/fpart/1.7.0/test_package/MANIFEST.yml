# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fpart/1.7.0
homepage: "http://contribs.martymac.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fpart 上游没有正式的自动化测试套件。make check 返回 "Nothing to be done for 'check'"。
# 源码 tests/ 目录仅含 fake_readdir.c 和 test-parent_path.c，未集成到 Makefile。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "fpart --version 二进制冒烟测试"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
