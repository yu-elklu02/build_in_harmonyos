software: fpart
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/martymac/fpart/archive/refs/tags/fpart-1.7.0.tar.gz"

  # 源码校验和
  sha256: "e5f82dd90001ed53200b2383bcfd520b1d8ee06d6a2a75b39d37d68daef20c88"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "--enable-embfts"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS umask 077 导致 config.status 失败，需修改为 umask 022"
  - "OpenHarmony/musl libc 不提供 fts.h，需 --enable-embfts 使用内嵌 fts 实现"
  - "GitHub 源码包缺少 configure/Makefile.in，CI worker 缺少 aclocal，改用直接编译方式构建"
