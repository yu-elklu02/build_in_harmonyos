version: '2.18.1.1'
status: built
build_date: '2026-07-27'

build:
  system: meson
  dependencies:
    - 'freetype/2.14.3'
    - 'expat/2.8.2.1'
  cc: clang

patches_applied: []

knowledge_gained:
  - '依赖 expat 无 SONAME 会使本包 DT_NEEDED 烤死 expat 的包目录绝对路径，产物不可重定位；升到 expat/2.8.2.1（裸 cmake + ohos.toolchain，有 SONAME）后修复'
  - '验收判据：readelf -d libfontconfig.so.1 的 NEEDED 应为 libexpat.so.1 这类 soname，而非 /…/p/lib/libexpat.so 绝对路径'
