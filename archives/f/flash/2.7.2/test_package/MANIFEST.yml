package: flash/2.7.2
homepage: https://github.com/hypriot/flash

upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: check_flash.py
    description: "Verify executable bit, --version output, and --help text"
    command: "python3 check_flash.py <flash-bin>"
  - file: conanfile.py
    description: "Run installed flash script through Conan VirtualRunEnv"
    command: "conan test"

assertion_count: 5
