software: fcl
display: "FCL"
description: "Flexible Collision Library: collision and proximity queries"
category: library
homepage: "https://github.com/flexible-collision-library/fcl"
license: BSD-3-Clause
build_system: cmake

versions:
  "0.7.0":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方。打了一个补丁让链接 libm 可选，根因与 libccd 同
      （musl 无 libm.so），但**报错里出现的是 fcl 自己的变量名**
      （`M_LIBRARY` / `CCD_LIBRARIES` set to NOTFOUND），很容易误判成 libccd 那个包的问题。

      test_package 断言几何量的数值而非「跑通了」：两个中心距 0.5 的单位立方体
      穿透深度应为 0.5、中心距 2.0 时分离距离应为 1.0、半径 1.0 与 0.5 的两球
      中心距 3.0 时间隙应为 1.5，均精确到 1e-6。盒与球走的是不同的求解分支，故分别验。
