# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e check

package: farbfeld/4.0
homepage: "https://tools.suckless.org/farbfeld/"

# farbfeld has no upstream test suite (no make check / ctest)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_farbfeld.py
    description: "Functional smoke test: create farbfeld image, convert via ff2ppm/ff2pam/ff2png/ff2jpg"
    command: "python3 test_farbfeld.py"

assertion_count: 8
