# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fortune/9708
homepage: "https://www.ibiblio.org/pub/linux/games/amusements/fortune/"

# 上游测试命令
upstream_check_command: ""

# 上游没有 make check 目标，使用手动验证
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
# fortune-mod 没有自动化测试套件，验证通过手动运行 fortune/strfile/unstr
upstream_tests:
  - file: test.sh
    source: test_package/test.sh
    description: "Smoke test: strfile usage, unstr usage, fortune with test data"
    command: "bash test.sh"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "验证 fortune/strfile/unstr 可执行文件功能"
    command: "./test.sh"

# 测试断言总数
assertion_count: 3
