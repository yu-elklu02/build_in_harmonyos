package: faas-cli/0.0.0-20260402103051
homepage: https://github.com/openfaas/faas-cli

upstream_test_in_build: true
upstream_tests:
  - command: "go test github.com/openfaas/faas-cli github.com/openfaas/faas-cli/builder github.com/openfaas/faas-cli/config github.com/openfaas/faas-cli/flags github.com/openfaas/faas-cli/proxy github.com/openfaas/faas-cli/schema github.com/openfaas/faas-cli/version github.com/openfaas/faas-cli/versioncontrol"
    description: "Run upstream Go tests excluding vendor, template, build, sample, and commands packages (commands Test_templatePull fails on OHOS due to git sandbox limitations)"

test_package_tests:
  - file: test.sh
    description: "Run faas-cli --help and validate version output (version string, git commit, openfaas) against the packaged binary"
    command: "bash test.sh <bin/faas-cli>"

assertion_count: 6
