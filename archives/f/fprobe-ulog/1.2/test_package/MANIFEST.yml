package: fprobe-ulog/1.2
homepage: "https://github.com/opoplawski/fprobe-ulog"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序 (fprobe-ulog has no automated tests in its Makefile)
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Verifies fprobe-ulog binary runs and outputs version + usage info"
    command: "./test_fprobe_ulog"

# 测试断言总数
assertion_count: 2
