# test_package/MANIFEST.yml — fast_float 7.0.0

package: fast_float/7.0.0
homepage: "https://github.com/fastfloat/fast_float"

# 上游测试命令
upstream_check_command: "cmake -DFASTFLOAT_TEST=ON -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试
# 未集成：conanfile.py FASTFLOAT_TEST=OFF，因 tests/CMakeLists.txt FetchContent doctest clone GitHub 在 CI 禁
# upstream_check_command 仅供手动复现参考，不自动执行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (默认 11 个)
upstream_tests:
  - file: tests/rcppfastfloat_test.cpp
    source: fast_float-7.0.0/tests/rcppfastfloat_test.cpp
    description: "Rcpp fast_float 兼容性测试"
    command: "./rcppfastfloat_test"
  - file: tests/wide_char_test.cpp
    source: fast_float-7.0.0/tests/wide_char_test.cpp
    description: "宽字符解析测试"
    command: "./wide_char_test"
  - file: tests/example_test.cpp
    source: fast_float-7.0.0/tests/example_test.cpp
    description: "示例使用测试"
    command: "./example_test"
  - file: tests/example_comma_test.cpp
    source: fast_float-7.0.0/tests/example_comma_test.cpp
    description: "逗号格式解析测试"
    command: "./example_comma_test"
  - file: tests/basictest.cpp
    source: fast_float-7.0.0/tests/basictest.cpp
    description: "基础功能测试"
    command: "./basictest"
  - file: tests/long_test.cpp
    source: fast_float-7.0.0/tests/long_test.cpp
    description: "长字符串解析测试"
    command: "./long_test"
  - file: tests/powersoffive_hardround.cpp
    source: fast_float-7.0.0/tests/powersoffive_hardround.cpp
    description: "5 的幂次舍入测试"
    command: "./powersoffive_hardround"
  - file: tests/string_test.cpp
    source: fast_float-7.0.0/tests/string_test.cpp
    description: "字符串解析测试"
    command: "./string_test"
  - file: tests/fast_int.cpp
    source: fast_float-7.0.0/tests/fast_int.cpp
    description: "整数解析测试"
    command: "./fast_int"
  - file: tests/json_fmt.cpp
    source: fast_float-7.0.0/tests/json_fmt.cpp
    description: "JSON 格式解析测试"
    command: "./json_fmt"
  - file: tests/fortran.cpp
    source: fast_float-7.0.0/tests/fortran.cpp
    description: "Fortran 格式解析测试"
    command: "./fortran"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 验证头文件包含和 API 调用"
    command: "./test_fast_float"

# 测试断言总数
assertion_count: ~500