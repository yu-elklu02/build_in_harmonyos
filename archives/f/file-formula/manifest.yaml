software: file-formula
display: "file-formula"
description: "使用 libmagic 按内容识别文件类型的 file(1) 命令"
category: system
homepage: "https://www.darwinsys.com/file/"
license: BSD-2-Clause-Darwin
build_system: autotools

ohos_adaptation:
  key_points:
    - "保持 Homebrew 公式身份：file-formula 只交付 file CLI"
