knowledge_ref:
  - E007
  - E002

knowledge_gained:
  - "Homebrew 使用 file-formula 名称是因为 Ruby 的 File 为保留类名"
  - "file-formula 只交付 CLI，file/5.48 是仓库内已发布的 libmagic 提供者"
  - "file/5.48 的静态库导出私有 fmtcheck 但无公共原型；需让 AC_REPLACE_FUNCS 使用上游替代实现"
  - "消费者测试必须以绝对路径执行 file-formula 的 file，避免误跑依赖包中的同名命令"
  - "install-exec 和 install-binPROGRAMS 都会拉起内建 libmagic；拆包配方需直接复制已外链的 CLI"
  - "静态 OHOS aarch64 CLI 可在 qemu-user 下完成命令级消费者验证，但不等同于真机系统集成"
