    source: "Homebrew/homebrew-core Formula/f/file-formula.rb"
    source_url: "https://github.com/Homebrew/homebrew-core/blob/HEAD/Formula/f/file-formula.rb"
    description: "Homebrew 官方公式使用 file CLI 识别 test.mp3 夹具"
    fixture: "Homebrew/brew Library/Homebrew/test/support/fixtures/test.mp3"
