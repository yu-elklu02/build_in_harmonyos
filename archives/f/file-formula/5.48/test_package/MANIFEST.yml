    command: "file test.mp3"
    expected: 1
    executed: 1
    passed: 1
    failed: 0

test_package_tests:
  - file: "test_file_formula.sh"
    description: "以新包绝对路径执行 file CLI，交叉构建时由 qemu-aarch64 运行，验证版本、MIME、编码和描述"
    command: "sh test_file_formula.sh <package>/bin/file <work-dir> [qemu-aarch64]"

upstream_assertion_count: 83
