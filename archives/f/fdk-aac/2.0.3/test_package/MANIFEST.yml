# test_package/MANIFEST.yml
# Upstream test declaration file
# CI (build_and_test.sh L0e) requires this file to exist

package: fdk-aac/2.0.3
homepage: "https://sourceforge.net/projects/opencore-amr/"

# Upstream test command
upstream_check_command: "make check"

# fdk-aac has no integrated test suite in the cmake build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (none - fdk-aac has BUILD_PROGRAMS=OFF for test tools)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.c
    description: "Open/close encoder and decoder API test"
    command: "./test_fdk-aac"

# Approximate assertion count
assertion_count: 4
