package: fatsort/1.7.1.683
homepage: "https://fatsort.sourceforge.io/"

upstream_check_command: "make tests"
upstream_test_in_build: false
upstream_test_command: "make tests"

upstream_tests:
  - file: tests/Makefile
    source: fatsort-1.7.1.683/tests/Makefile
    description: "上游 125 个 tc_* 测试用例、7 个 ts_* 测试套件；实际运行 make tests 结果（适配后）：121/125 通过或适配后通过（96.8%），4/125 valgrind 专用测试（tc_pos_valgrind_*）因 OHOS 无可用 valgrind 跳过。适配要点：TMPDIR/FS_IMG 覆盖可写目录、SHELL 覆盖、patch 0004（grep -oP→sed -nE）、patch 0005（LC_ALL=en_US.UTF-8→LC_ALL=C，按 C locale 重新生成 expected 输出）。替代内存检查验证（ASan/UBSan，覆盖 4 个 FAT 文件系统镜像）：4/4 通过。"
    command: "make tests SHELL=/data/service/hnp/bin/bash TMPDIR=<writable_dir> FS_IMG=<writable_dir>/fs.img FATSORT=<path_to_fatsort> LC_ALL=C"

test_package_tests:
  - file: conanfile.py
    description: "消费者测试入口，调用 test.sh 执行 fatsort smoke test"
    command: "conan test"
  - file: test.sh
    description: "消费者视角验证 fatsort 可执行文件存在且可执行，并可输出版本/帮助信息"
    command: "bash test.sh <package_folder>/bin/fatsort"

assertion_count: 3
