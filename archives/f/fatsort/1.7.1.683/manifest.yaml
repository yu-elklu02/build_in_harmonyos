knowledge_gained:
  - "fatsort 是纯 Makefile 命令行工具，Conan 配方中需显式从 self.source_folder/src 执行 make，而不能依赖 build_folder 当前目录。"
  - "上游 Makefile 默认 CC=gcc，HarmonyOS 环境需在 conanfile.py build() 中显式传入 CC=clang LD=clang。"
  - "fatsort 上游存在 125 个 tc_* 测试用例和 7 个 ts_* 测试套件；实际运行 make tests 结果（适配后）：121/125 通过或适配后通过（96.8%），4/125 valgrind 专用测试因 OHOS 无可用 valgrind 跳过。适配要点：TMPDIR/FS_IMG 覆盖可写目录、SHELL 覆盖、patch 0004（grep -oP→sed -nE）、patch 0005（LC_ALL=en_US.UTF-8→LC_ALL=C，按 C locale 重新生成 expected 输出）。替代内存检查验证使用 clang 15.0.4 的 ASan/UBSan，覆盖 4 个 FAT 文件系统镜像，验证通过率 4/4（100%）。"
  - "SourceForge 下载链路可能超时，conandata.yml 保留 MIT Gentoo distfiles 权威镜像作为 fallback。"

