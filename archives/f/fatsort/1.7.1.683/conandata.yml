sources:
  url:
    - "https://downloads.sourceforge.net/sourceforge/fatsort/fatsort-1.7.1.683.tar.xz"
    - "https://mirrors.mit.edu/gentoo-distfiles/distfiles/fe/fatsort-1.7.1.683.tar.xz"
  sha256: "58d93e3a1096d2219202379ff1cacdf0abc0b3d9edb5fbd6deabdd954dc3ec68"
  strip_root: true

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Avoid GNU install dependency in top-level install target"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Add a minimal configure shim for packaging compatibility"
    patch_type: "portability"
  - patch_file: "patches/0003-src-Makefile.patch"
    patch_description: "Use overrideable compiler defaults, install binary to bin, and avoid GNU install dependency"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-tc_check_consistent_version-Makefile.patch"
    patch_description: "Replace grep -oP with sed -nE for OHOS grep compatibility (grep built without Perl regex)"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-testconfig-locale.patch"
    patch_description: "Set LC_ALL=C in testconfig.mk for OHOS locale compatibility (OHOS lacks en_US.UTF-8)"
    patch_type: "portability"
