software: flint
version: "3.2.2"
build_system: autotools
# 真机 conan create + test_package 已通过（2026-08-10），故为 built。
status: built
source:
  url: "https://github.com/flintlib/flint/releases/download/v3.2.2/flint-3.2.2.tar.gz"
  sha256: "577d7729e4c2e79ca1e894ad2ce34bc73516a92f623d42562694817f888a17eb"
knowledge_gained:
  - "FLINT 的 cpu_set_t 探测用 AC_COMPILE_IFELSE（只编译不链接）：OHOS musl 声明了 pthread_getaffinity_np 却没实现，探测假阳性 → 链接期 --no-allow-shlib-undefined 才报错。预置 autoconf cache 变量 flint_cv_check_cpu_set_t=no 即可，不必打补丁。"
  - "头装在 include/flint/ 但 .pc 的 Cflags 是 -I${includedir}（下游用 <flint/xxx.h>），故 includedirs 必须显式给 include；靠自动探测会填成 include/flint，本包全绿、下游才炸。"
  - "gmp/mpfr 在制品仓是静态包，被整体链进 libflint.so：DT_NEEDED 只剩 libc.so，但同时重导出了 416 个 __gmp* 与 223 个 mpfr_* 符号。"

