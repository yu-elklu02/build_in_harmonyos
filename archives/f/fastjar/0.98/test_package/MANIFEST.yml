# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fastjar/0.98
homepage: "https://savannah.nongnu.org/projects/fastjar/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fastjar 0.98 上游源码中无自动化测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 验证 fastjar 二进制可执行，且能创建和列出 JAR 文件
test_package_tests:
  - file: conanfile.py
    description: "验证 fastjar --version 可执行，并测试创建和列出 JAR 文件"
    command: "fastjar --version && fastjar cf test.jar hello.txt && fastjar tf test.jar"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
