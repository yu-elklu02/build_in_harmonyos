software: fastjar
display: "fastjar"
description: "Fast Java Archive (JAR) file manipulation tool"
category: build-tool
homepage: "https://savannah.nongnu.org/projects/fastjar/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要更新 config.guess/config.sub 支持 OHOS 平台识别"
    - "需要修补 configure.ac 和 configure 脚本 (umask 077 在 HMDFS 上导致权限问题)"
    - "需要在 conanfile.py build() 中修复 shebang: /bin/sh → /system/bin/sh"
  common_dependencies:
    - "zlib/1.3.1"

versions:
  "0.98":
    status: published
    build_date: "2026-08-06"
