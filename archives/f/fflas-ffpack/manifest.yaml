name: fflas-ffpack
description: 有限域上的稠密线性代数（矩阵乘法 / 消元 / 求秩 / 解方程），header-only
category: math
license: LGPL-2.1-or-later
website: https://github.com/linbox-team/fflas-ffpack
source_url: https://github.com/linbox-team/fflas-ffpack/releases
build_system: autotools
versions:
  - version: "2.5.0"
    status: built
    build_date: "2026-08-12"
    notes: >-
      LinBox / SageMath / passagemath 计算代数栈的核心依赖。header-only（不装 .so/.a），
      但头文件里直接调 givaro 与 BLAS，故需 --with-givaro 与 --with-blas-libs。
      正因为 header-only 最容易「装上了、编不过」，test_package 做真实计算断言
      （GF(101) 上 fgemm 算 A×I 逐元素比对、FFPACK::Rank 求秩），
      真正走到 givaro 域运算与 openblas 后端。
