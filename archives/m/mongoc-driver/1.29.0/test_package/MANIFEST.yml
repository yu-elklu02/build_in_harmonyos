# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mongoc-driver/1.29.0
homepage: "https://github.com/mongodb/mongo-c-driver"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中未集成上游测试 (ENABLE_TESTS=OFF)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/libmongoc/tests/
    source: mongo-c-driver-1.29.0/src/libmongoc/tests/
    description: "libmongoc unit tests (mock_server, handshake, etc.)"
    command: "ctest"
  - file: src/libbson/tests/
    source: mongo-c-driver-1.29.0/src/libbson/tests/
    description: "libbson unit tests (BSON encoding/decoding)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mongoc.cpp
    description: "消费者冒烟测试: 初始化 mongoc 驱动，创建 BSON 文档并转换为 JSON 验证"
    command: "./test_mongoc"

# 上游测试用例总数 (ENABLE_TESTS=OFF 时实际编译运行的 ctest 数)
assertion_count: 1
