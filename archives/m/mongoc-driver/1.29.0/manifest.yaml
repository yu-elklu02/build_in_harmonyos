software: mongoc-driver
version: 1.29.0
status: published
build_system: cmake
created_at: 2026-04-28
knowledge_gained:
  - CMake+Ninja 构建系统适配 HarmonyOS
  - CMAKE_C_COMPILER_FORCED 绕过编译器检测
  - ENABLE_SHARED=OFF 解决 RPATH 问题
  - USE_BUNDLED_UTF8PROC 避免外部 utf8proc 依赖
  - PKG_CONFIG_PATH 设置 zstd 的 pkg-config 路径
  - CMAKE_PREFIX_PATH 设置 snappy 搜索路径
patches_applied: []
configure_options:
  - "-DENABLE_STATIC=ON"
  - "-DENABLE_SHARED=OFF"
  - "-DENABLE_TESTS=OFF"
  - "-DENABLE_EXAMPLES=OFF"
  - "-DENABLE_SNAPPY=ON"
  - "-DENABLE_ZSTD=ON"
  - "-DENABLE_ZLIB=SYSTEM"
  - "-DENABLE_SSL=OPENSSL"
  - "-DUSE_BUNDLED_UTF8PROC=ON"
dependencies:
  - openssl 1.1.1w
  - zlib 1.3.1
  - zstd 1.5.7
  - snappy 1.2.2
source_url: https://github.com/mongodb/mongo-c-driver/releases/download/1.29.0/mongo-c-driver-1.29.0.tar.gz
