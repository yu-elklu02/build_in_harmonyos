software: mailio
version: "0.26.0"
upstream_version: "0.26.0"
status: built
build_date: "2026-08-04"
conan_ref: "mailio/0.26.0"
build_system: cmake

source:
  url: "https://github.com/karastojko/mailio/archive/refs/tags/0.26.0.tar.gz"
  sha256: "f3222adf2d5d8d8f89c5509a6da10dd6456637f32b3962c3c0c9af54178849dc"
  tar_format: tar.gz

build:
  system: cmake
  cxx_standard: 17
  dependencies:
    - boost/1.90.0.4
    - openssl/3.5.6
  build_tools:
    - python3
    - conan
    - clang
    - clang++
    - cmake
    - make
    - llvm-objcopy
    - binary-sign-tool
  output:
    - "libmailio.so（共享库，默认）或 libmailio.a（静态库）"
    - "公共头文件位于 include/mailio/"
    - "CMake 配置文件（mailio-config.cmake、mailio-config-version.cmake）"
    - "pkg-config 文件（mailio.pc）"
  cmake_options:
    BUILD_SHARED_LIBS: "self.options.shared（默认：True）"
    MAILIO_BUILD_TESTS: False
    MAILIO_BUILD_EXAMPLES: False
    MAILIO_BUILD_DOCUMENTATION: False

patches_applied: []

