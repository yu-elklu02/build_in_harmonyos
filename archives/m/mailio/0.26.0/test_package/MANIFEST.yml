package: mailio/0.26.0
homepage: "https://github.com/karastojko/mailio"

upstream_tests:
  source: "mailio 上游测试树（test/ 目录）"
  scope: >-
    未在 Conan 构建中运行。上游测试需要实时邮件服务器连接
    （SMTP/POP3/IMAP），通过 MAILIO_BUILD_TESTS=OFF 禁用。
    test_package 提供离线 API 验证作为替代。
  total: 0
  reason: "上游测试需要到邮件服务器的网络连接；不适用于 CI 环境。"

test_package_tests:
  - file: "test.cpp"
    description: >-
      消费者 API 冒烟测试：构造 mailio::message，设置
      from/recipient/subject/content，调用 format() 生成 MIME 字符串，
      验证关键头部（From、Subject）和内容存在。
      覆盖 MIME 格式化代码路径：message.cpp、mime.cpp、
      base64.cpp、codec.cpp、quoted_printable.cpp。
    command: "test_mailio"

test_package_test_count: 1
