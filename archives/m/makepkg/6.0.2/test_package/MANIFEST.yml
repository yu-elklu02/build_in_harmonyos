package: makepkg/6.0.2
homepage: "https://archlinux.org/pacman/"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "bash -n generated makepkg scripts && bash test/scripts/parseopts_test.sh"

upstream_tests:
  - file: scripts/makepkg.sh.in
    source: pacman-6.0.2/scripts/makepkg.sh.in
    description: "makepkg Bash script syntax check after template substitution"
    command: "bash -n makepkg"
  - file: scripts/libmakepkg/*.sh.in
    source: pacman-6.0.2/scripts/libmakepkg/
    description: "libmakepkg Bash helper syntax check after template substitution"
    command: "find share/makepkg -name '*.sh' -exec bash -n '{}' ';'"
  - file: test/scripts/parseopts_test.sh
    source: pacman-6.0.2/test/scripts/parseopts_test.sh
    description: "Upstream libmakepkg parseopts TAP test against generated util/parseopts.sh"
    command: "PMTEST_LIBMAKEPKG_DIR=<build>/generated/share/makepkg/ bash test/scripts/parseopts_test.sh"
    assertions: 56

test_package_tests:
  - file: test.sh
    description: "Run makepkg --version and makepkg --printsrcinfo with a minimal PKGBUILD"
    command: "MAKEPKG_BIN=<package>/bin/makepkg MAKEPKG_CONF=<package>/etc/makepkg.conf bash test.sh"

assertion_count: 59
