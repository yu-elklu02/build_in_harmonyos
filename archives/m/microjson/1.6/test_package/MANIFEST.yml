# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: microjson/1.6
homepage: "https://github.com/Otteri/microjson"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_microjson.c
    source: microjson-1.6/test_microjson.c
    description: "Regression test for microjson JSON parser"
    command: "./test_microjson"
  - file: test_microjson_wignore.c
    source: microjson-1.6/test_microjson_wignore.c
    description: "Regression test for microjson with ignore mode"
    command: "./test_microjson_wignore"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: parse JSON object and string using microjson API"
    command: "./test_microjson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
