software: minipro
# 版本级 manifest 模板
# 文件位置: archives/m/minipro/0.7.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.7.4"
status: built
build_date: "2026-07-16"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.com/DavidGriffith/minipro/-/archive/0.7.4/minipro-0.7.4.tar.gz"
  sha256: "e41fb5a97c74a7e9c7d012e864a622096e819180bec504069e34664f6a360531"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: makefile

build:
  system: makefile
  configure_options: []
  dependencies:
    - "libusb-1.0 1.0.27 (cmd-pkgs verified archive)"
    - "zlib/1.3.1 (Conan dependency)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "minipro 使用纯 Makefile 构建，无 configure 脚本，有 make install 目标"
  - "Makefile 通过 pkg-config 查找 libusb-1.0 和 zlib 依赖"
  - "CFLAGS ?= 允许环境变量覆盖，override 追加 pkg-config 标志"
  - "构建产物为单一二进制 minipro，需 ELF 签名 (R38/E082)"
  - "同时打包 infoic.xml 和 logicic.xml 芯片数据库到 share/minipro/"
  - "version.h 和 version.c 在构建时自动生成（从 Makefile VERSION 变量）"

limitations:
  - "当前仅验证编译、签名及命令行冒烟测试；USB 设备枚举、读写和固件通信尚未实机验证"
  - "R40 适配完整性需在 OHOS usb_host 域连接 TL866/T48/T56 设备人工确认"
