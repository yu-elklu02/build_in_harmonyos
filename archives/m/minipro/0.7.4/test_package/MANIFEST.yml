# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: minipro/0.7.4
homepage: "https://gitlab.com/DavidGriffith/minipro"

# 上游测试命令（minipro 无 ctest/make check 测试套件）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# minipro has no formal test suite in the repository — tests require physical
# hardware (TL866 programmer) which is not available in CI
upstream_tests: []

# test_package 自带的测试（消费者视角验证：执行 minipro 二进制）
test_package_tests:
  - file: test.sh
    description: "minipro --version 冒烟测试 + --help 功能测试"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 2
