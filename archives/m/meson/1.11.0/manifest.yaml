version: "1.11.0"
status: built
build_system: python

source:
  url: "https://pypi.org/packages/source/m/meson/meson-1.11.0.tar.gz"
  sha256: "dffdd0915ceb028541fe3bed77d63ba35e78514591c043736b450d62634eeb31"
  tar_format: tar.gz

build:
  system: python
  configure_options: []
  dependencies:
    - "Python 3.12 interpreter supplied by the build environment"
    - "zlib/1.3.1.1 (test-only build requirement for the upstream suite)"

patches_applied:
  - "0003-test-add-ohos-system-define.patch"
  - "0004-test-skip-ohos-unsupported-features.patch"
  - "0005-unittest-skip-ohos-unsupported.patch"
  - "0006-test-identity-cross-cc-fallback.patch"
  - "0007-unittest-rewrite-timeout.patch"
  - "0008-unittest-skip-wrapdb-network.patch"
  - "0009-project-tests-ninja-env.patch"
  - "0010-test-static-linker-ar-env.patch"
  - "0011-pathtester-env-fallback.patch"
  - "0012-command-tests-skip-ohos.patch"
  - "0013-frameworks-curses-skip-ohos.patch"
  - "0014-unittest-skip-ci-env.patch"

test:
  upstream_test_in_build: true
  upstream_test_command: "python3 run_tests.py"
  upstream_test_cases: "Complete upstream suite: run_meson_command_tests.py + run_unittests.py + run_project_tests.py"
  package_test: "meson setup build && meson compile -C build && ./build/conan-probe"
  assertions: 2
