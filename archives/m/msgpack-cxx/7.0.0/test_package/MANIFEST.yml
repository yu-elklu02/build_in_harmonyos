# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: msgpack-cxx/7.0.0
homepage: "https://github.com/msgpack/msgpack-c"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: example/cpp03/simple.cpp
    source: msgpack-cxx-7.0.0/example/cpp03/simple.cpp
    description: "Simple pack/unpack example from upstream"
    command: "./simple"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Pack/unpack round-trip with type verification"
    command: "./test_msgpack_cxx"

# 测试断言总数
assertion_count: 3
