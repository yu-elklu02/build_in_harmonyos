software: msgpack-cxx
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/msgpack/msgpack-c/releases/download/cpp-7.0.0/msgpack-cxx-7.0.0.tar.gz"

  # 源码校验和
  sha256: "7504b7af7e7b9002ce529d4f941e1b7fb1fb435768780ce7da4abaac79bb156f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DMSGPACK_USE_BOOST=OFF"
    - "-DMSGPACK_BUILD_EXAMPLES=OFF"
    - "-DMSGPACK_BUILD_TESTS=OFF"
    - "-DMSGPACK_BUILD_DOCS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "msgpack-cxx 7.0.0 是 header-only C++ 库，CMake INTERFACE target"
  - "默认启用 Boost 依赖 (MSGPACK_USE_BOOST=ON)，可禁用"
  - "Doxygen 文档构建默认启用 (MSGPACK_BUILD_DOCS=ON)，需禁用避免依赖"
