software: msgpack-cxx
display: "msgpack-cxx"
description: "MessagePack is an efficient binary serialization format for C++"
category: serialization
homepage: "https://github.com/msgpack/msgpack-c"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only C++ 库 (CMake INTERFACE target)，无需编译二进制"
    - "默认启用 Boost 依赖 (MSGPACK_USE_BOOST=ON)，禁用后无外部依赖"
    - "Doxygen 文档构建默认启用，需禁用 (MSGPACK_BUILD_DOCS=OFF)"
    - "测试和示例默认关闭 (MSGPACK_BUILD_TESTS=OFF, MSGPACK_BUILD_EXAMPLES=OFF)"
  common_dependencies: []

versions:
  "7.0.0":
    status: built
    build_date: "2026-08-07"
