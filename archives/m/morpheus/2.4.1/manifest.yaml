knowledge_gained:
  - "Morpheus CLI 不是 Qt GUI 的子集 hack；上游存在 MorpheusSIM/bin/morpheus 目标，MORPHEUS_GUI=OFF 可跳过 GUI 子目录"
  - "CLI 仍需要 Boost program_options/filesystem/system 编译组件，现有 boost/1.90.0 header-only 不足"
  - "Morpheus 的 xtensor fallback 使用 FetchContent 联网拉取 xtl/xsimd/xtensor；已改为依赖前置 Conan 包，避免构建期联网"
  - "Morpheus 构建阶段需要 xsltproc 生成 MorpheusML 规则；现有 libxslt/1.1.45 关闭 programs，因此新增 libxslt/1.1.45.1"
  - "上游 CMake 对 ZLIB/TIFF 使用旧式变量，补丁改为优先链接 Conan CMake targets"
  - "CI #11923 已确认 libtiff/4.7.2 可从 ohpcd 下载；失败点是 TIFFConfig.cmake 的传递 find_dependency(libjpeg-turbo) 缺少同目录 CMakeDeps config，因此 recipe 将 libtiff public CMake deps 显式列为直接 requirements"
  - "CI #12149 失败点是 Conan 依赖 LD_LIBRARY_PATH 污染 OHOS SDK lld 的 libxml2 解析；recipe 在 OHOS 工具链命令前置 SDK llvm/lib 后再保留 Conan 依赖路径，新端口 r3 完整重跑通过"
  - "Morpheus 源码广泛使用 uint；OHOS 下通过生成 config.h 的 guarded typedef 并强制预包含到核心 targets 解决"
  - "Morpheus 在 MORPHEUS_OPENMP=OFF 时仍有 OpenMP guard 头路径；OHOS 下通过 std::mutex fallback 解决"
  - "官方 GTest suite 已在 OHOS 真机执行，实际注册 57 个 CTest entry 且 57/57 PASS；Examples XML 模型仍需单独 runner 评估"
