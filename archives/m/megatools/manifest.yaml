software: megatools
display: "megatools"
description: "Megatools - 命令行 Mega.nz 云存储客户端，支持上传/下载/列出/管理等操作"
category: network
homepage: "https://xff.cz/megatools/"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "上游使用 Meson 构建系统，依赖 glib (gio-2.0)、openssl、libcurl；glib/libcurl 使用 Worker 系统预编译包"
    - "Homebrew formula 使用 meson setup build + meson compile + meson install 标准流程"
    - "Meson 配方需注入 ar/ranlib 全路径到 conan_meson_native.ini（CI worker 上 llvm-ar 不在 PATH）"
    - "禁用 man 手册构建（OHOS 无 asciidoc/db2x 工具链），启用 symlinks 兼容旧命令名"
    - "megatools 是 CLI 应用程序，package_info 中 libs=[]，bindirs=['bin']"
    - "glib-networking 为运行时依赖（非编译依赖），megatools 使用 libcurl 做网络通信，编译时不需要"
  common_dependencies:
    - "openssl/3.5.6"

versions:
  "homebrew":
    status: built
    build_date: "2026-07-15"
