# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: megatools/homebrew
homepage: "https://xff.cz/megatools/"

# 上游测试套件需要从 mega.co.nz 下载文件，CI 环境无外网访问能力，无法运行
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_megatools.sh
    description: "运行 megatools --version 验证可执行文件启动并输出版本信息"
    command: "bash test_megatools.sh <package_folder>"

# 测试断言总数
# 3 个测试场景: --version 版本输出、--help 用法输出、子命令符号链接存在
assertion_count: 3
