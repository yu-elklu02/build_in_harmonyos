software: megatools
# 版本级 manifest
# 文件位置: archives/m/megatools/homebrew/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "homebrew"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://xff.cz/megatools/builds/megatools-1.11.1.20230212.tar.gz"
  sha256: "ecfa2ee4b277c601ebae648287311030aa4ca73ea61ee730bc66bef24ef19a34"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dman=false"
    - "-Dsymlinks=true"
  dependencies:
    - "openssl/3.5.6.1"
    - "curl/8.15.0"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "megatools 1.11.1 使用 Meson 构建系统，依赖 gio-2.0 (glib)、openssl、libcurl，通过 pkg-config 发现"
  - "glib 与 libcurl 使用 Worker 系统预编译包，通过 $HOME/usr/local/lib/pkgconfig 和 share/pkgconfig 发现；openssl 使用 Conan 制品"
  - "Conan MesonToolchain 只映射 c/cpp 编译器路径到 conan_meson_native.ini，不写入 ar/ranlib。需从编译器路径推导同目录 llvm-ar/llvm-ranlib 全路径注入 [binaries] 段（与 fontconfig/libsigc++ 配方一致）"
  - "OHOS 无 asciidoc/db2x_xsltproc/db2x_manxml 工具链，需设置 -Dman=false 跳过手册页构建"
  - "glib-networking 为运行时依赖（非编译依赖），megatools 使用 libcurl 做网络通信，编译时不需要 glib-networking"
  - "megatools 是 CLI 应用程序，meson.build 构建单个 megatools 二进制，包含 df/dl/get/ls/test/export/mkdir/put/reg/rm/copy 子命令"
