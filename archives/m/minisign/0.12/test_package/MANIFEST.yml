# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: minisign/0.12
homepage: "https://github.com/jedisct1/minisign"

# ── 上游测试审计 (hmbs 机器证据门禁) ──────────────────────────────────────
# 审计结论：minisign 0.12 上游没有任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "minisign-0.12 源码树"
    reason: "无 tests/、test/ 目录；无任何测试框架文件（gtest/Catch2/ctest/pytest 均无）；仅有 src/*.c、share/man、build.zig 与构建配置。"
  - source: "CMakeLists.txt"
    reason: "无 enable_testing()/add_test()/ctest 调用，无 test 目标；仅定义 minisign 可执行文件与 man page 安装规则。"
  - source: "GitHub release 0.12 资产"
    reason: "release 仅含 minisign-0.12.tar.gz 源码包与各平台预编译二进制（linux/macos/win64/wasm），无独立测试套件。"
  - conclusion: "上游未提供自动化测试；由 test_package 对打包的 minisign 二进制执行真实功能测试（版本/密钥生成/签名/验证/篡改检测，5 项断言）。"

# 上游测试命令：无（上游无测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "真实调用 minisign CLI：-v 版本输出、-G -W 生成密钥对、-S 签名消息、-V 验证签名、篡改消息后 -V 必须失败"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
