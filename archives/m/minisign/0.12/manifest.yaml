software: minisign
version: "0.12"
status: built
build_date: "2026-08-13"
build_system: cmake

source:
  url: "https://github.com/jedisct1/minisign/archive/refs/tags/0.12.tar.gz"
  sha256: "796dce1376f9bcb1a19ece729c075c47054364355fe0c0c1ebe5104d508c7db0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSODIUM_INCLUDE_DIR=<system libsodium include (~/usr/local/include)>"
    - "-DSODIUM_LIBRARY=<system libsodium lib (~/usr/local/lib/libsodium.a 或 .so)>"
  dependencies:
    - "libsodium/1.0.22 (系统预编译包，cmd-pkgs 安装于 ~/usr/local，非 conan 依赖)"
  cc: clang

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "minisign 0.12 上游无任何测试套件（无 tests/ 目录、无 ctest/enable_testing），需在 test_package/MANIFEST.yml 显式审计并输出 no_tests 标记"
  - "上游 CMakeLists.txt 用 pkg-config + find_path/find_library 定位 libsodium，OHOS 缺 pkg-config 时需放宽（E001/E075）并在 generate() 显式传 SODIUM_INCLUDE_DIR/SODIUM_LIBRARY"
  - "libsodium/1.0.22 未发布到 ohpcd 制品仓（R36），conancenter 配方硬编码 GitHub 源码 URL，真机无法直连 github.com（E017）导致源码下载失败；改用 cmd-pkgs 预编译系统包（~/usr/local，同 0.12-r1/gdnsd/rsync 先例），配方不再声明 conan libsodium 依赖"
  - "minisign 为命令行工具（application 包），package_info 只需 bindirs"

# ── Upstream test audit (hmbs evidence requirement) ───────────────────────
upstream_tests_exist: false
upstream_test_audit: |
  minisign 0.12 上游源码无任何自动化测试：源码树无 tests/、test/ 目录，
  无任何测试框架文件（gtest/catch/ctest 均无）；CMakeLists.txt 无
  enable_testing()/add_test()/ctest 调用，无 test 目标；GitHub release 0.12
  资产仅含源码包与各平台预编译二进制（linux/macos/win64/wasm），无独立
  测试套件。由 test_package 对 minisign 二进制执行真实功能测试（版本输出/
  密钥生成/签名/验证/篡改检测，5 项断言）。
