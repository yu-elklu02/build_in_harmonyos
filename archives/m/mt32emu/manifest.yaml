software: mt32emu
display: "mt32emu"
description: "Munt C/C++ library for emulating Roland MT-32 family synthesizers"
category: library
homepage: "https://github.com/munt/munt"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Configure only the standalone mt32emu core library subdirectory"
    - "Keep the built-in resampler enabled; external SOXR/SampleRate packages are optional alternatives"
    - "Avoid VERSION/SOVERSION symlink chains for shared libraries on OHOS/HMDFS"
    - "Full synthesis requires user-supplied compatible control and PCM ROM images"
  common_dependencies: []

versions:
  "2.7.1":
    status: pending
    build_date: "2026-07-21"
    conan_ref: "mt32emu/2.7.1"
