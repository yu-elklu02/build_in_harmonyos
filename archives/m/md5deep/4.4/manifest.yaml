software: md5deep
version: "4.4"

status: built
build_date: "2026-07-13"

source:
  url: "https://github.com/jessek/hashdeep/archive/refs/tags/v4.4.tar.gz"
  sha256: "ad78d42142f9a74fe8ec0c61bc78d6588a528cbb9aede9440f50b6ff477f3a7f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=${PREFIX}"
    - "SHELL=/data/service/hnp/bin/bash"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-clang-cxx17-portability.patch"

knowledge_gained:
  - "上游 4.4 release 仅提供 Windows 二进制 zip；可构建源码取自官方 git tag 快照。"
  - "git 快照无预生成 configure，CI/构建容器无 autoconf/automake，需随配方附带预生成 autotools 文件（prebuilt.tar.gz）。"
  - "E007：真实 OHOS worker uname -s 返回 HarmonyOS，config.guess(2021) 不识别→cannot guess build type。本机 Docker 容器 uname 返回 Linux 不复现；因是本机构建(host==build)且 configure.ac 仅区分 *linux*，固定 config.guess 输出 aarch64-unknown-linux-ohos 并给 config.sub 增加 ohos 识别。"
  - "HMDFS 在 0700 目录阻止写文件：需去除 configure 的 umask 077。"
  - "md5deep/sha1deep/sha256deep/whirlpooldeep/tigerdeep/hashdeep 为同一二进制，按 argv[0] 分派。"
