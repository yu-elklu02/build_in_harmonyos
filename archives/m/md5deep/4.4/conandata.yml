# conandata.yml — md5deep 4.4
# Upstream distributes 4.4 only as a Windows binary zip on the GitHub release;
# the buildable source is the official git tag snapshot.

sources:
  url: "https://github.com/jessek/hashdeep/archive/refs/tags/v4.4.tar.gz"
  sha256: "ad78d42142f9a74fe8ec0c61bc78d6588a528cbb9aede9440f50b6ff477f3a7f"

patches:
  - patch_file: "patches/0001-clang-cxx17-portability.patch"
    patch_description: "clang++ -std=c++17 portability: space out string-literal/PRI* macro concatenations (reserved-user-defined-literal) and compare mmap result against MAP_FAILED instead of >0 (ordered pointer/int comparison)"
    patch_type: "portability"
