# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: md5deep/4.4
homepage: "https://github.com/jessek/hashdeep"

# 上游测试命令
upstream_check_command: "make check"

# 上游 make check 通过 tests/tests.sh 驱动，未集成进 conanfile.py build()
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: "tests.sh"
    source: "hashdeep-4.4/tests/tests.sh"
    description: "上游回归测试脚本（hashdeep/md5deep 递归哈希与审计模式）"
    command: "make check"

# test_package 自带测试（消费者视角，实测哈希正确性）
test_package_tests:
  - file: "test_md5deep.sh"
    description: "对已知内容文件执行 md5deep/sha1deep/sha256deep/hashdeep 并校验摘要值"
    command: 'bash test_md5deep.sh <bindir>'

# 测试断言总数
assertion_count: 5
