name: macifrename
software: macifrename
display: "macifrename"
description: "Stably rename network interfaces based on MAC addresses"
category: network
homepage: "https://git.sr.ht/~kaniini/macifrename"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "Use net/if.h instead of linux/if.h to avoid duplicate sockaddr_storage definitions on OHOS."
    - "Define _GNU_SOURCE so struct ifreq remains visible with the target headers."
    - "Validate safe command paths only; real interface renaming is avoided in tests because it mutates system networking."
  common_dependencies: []

versions:
  "0.1.2":
    status: built
    build_date: "2026-07-30"
    conan_ref: "macifrename/0.1.2"
    source_url: "https://git.sr.ht/~kaniini/macifrename/archive/0.1.2.tar.gz"
