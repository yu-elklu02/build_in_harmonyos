software: mafft
display: "MAFFT"
description: "Multiple sequence alignment program for amino acid or nucleotide sequences"
category: data
homepage: "https://mafft.cbrc.jp/alignment/software/"
license: BSD-3-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 构建系统，CC 默认为 gcc，需覆盖为 clang（R33：从 Conan conf 获取编译器）"
    - "主入口 mafft 为 bash 脚本，shebang 为 #!/bin/bash，OHOS 无 /bin/sh 与 /bin/bash，需改写为 /data/service/hnp/bin/bash"
    - "mafft 脚本通过 sed 从 mafft.tmpl 生成，需在构建前 patch 模板的 shebang"
    - "无第三方库依赖，仅依赖 libc + libm + libpthread"
  common_dependencies: []

versions:
  "7.525":
    status: built
    build_date: "2026-07-17"
