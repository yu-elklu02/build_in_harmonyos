software: mafft
version: "7.525"

status: built
build_date: "2026-07-17"

source:
  url: "https://mafft.cbrc.jp/alignment/software/mafft-7.525-without-extensions-src.tgz"
  sha256: "edb34ae9b26d6b55328c18fa060ed741bca8cd599c2f4f8fad0e0871c8082265"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "PREFIX=${PACKAGE_FOLDER}"
    - "CC=clang"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-mafft-relocatable-libdir.patch

knowledge_gained:
  - "MAFFT 核心为纯 C，无第三方库依赖，仅链接 -lm -lpthread（多线程默认开启）。"
  - "构建系统为 core/Makefile（plain make，非 autotools/cmake），CC 默认 gcc，通过命令行覆盖为 clang（R33）。"
  - "主入口 mafft 是 bash 脚本，由 mafft.tmpl 经 sed 替换 _LIBDIR 生成；shebang 为 #!/bin/bash，OHOS 无 /bin/bash 需改写为 /data/service/hnp/bin/bash。"
  - "mafft 脚本运行时通过硬编码的 LIBDIR 路径（PREFIX/libexec/mafft）查找内部二进制，因此 PREFIX 必须设为 package_folder 以保证运行时路径正确。"
  - "算法别名（linsi/ginsi/einsi/fftns/fftnsi/nwns/nwnsi 等）为指向 mafft 脚本的符号链接，由 package() 中 os.symlink 创建。"
  - "without-extensions 版本不含 RNA 结构比对（X-INS-i/Q-INS-i），对应的 xinsi/qinsi 别名不创建。"
  - "mafft-homologs.rb / mafft-sparsecore.rb 需要 Ruby，mafftash_premafft.pl 需要 Perl，均为可选辅助脚本；核心比对功能仅需 bash + 内部二进制。"
  - "上游 test/script 共 11 条回归测试：9 条 DNA/蛋白质比对调用 mafft 命令（已补全到 test_package，覆盖 9 种算法策略）；2 条 RNA 结构比对调用 mafft-qinsi/mafft-xinsi，因 without-extensions 版本缺失而跳过。跳过原因是 without-extensions 源码包不含 RNA 扩展，非交叉编译环境问题。测试采用结构有效性验证（序列数一致+长度对齐）替代严格 diff，避免交叉编译环境差异导致比对输出细微不同。"
