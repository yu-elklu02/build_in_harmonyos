package: mcpp/2.7.2
homepage: "https://mcpp.sourceforge.net/"
upstream_check_command: "make check (requires external GCC testsuite integration and replace-cpp mode)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: "Validation Suite"
    source: "test-t/, test-c/, test-l/, cpp-test/"
    description: "Bundled preprocessor validation data; the mcpplib build registers no standalone automatic tests"
    command: "make check (not run: requires an external GCC testsuite tree)"
test_package_tests:
  - file: test.c
    description: "Checks libmcpp status/output-file handling and verifies the macro is replaced by its value"
    command: "./test_mcpp"
  - file: conanfile.py
    description: "Runs the packaged mcpp CLI and verifies the macro is replaced by its value"
    command: "mcpp -P input.c -o output.i"
assertion_count: 6
