software: mcpp
version: "2.7.2"
status: built
build_date: "2026-07-17"

source:
  url: "https://downloads.sourceforge.net/project/mcpp/mcpp/V.2.7.2/mcpp-2.7.2.tar.gz"
  sha256: "3b9b4421888519876c4fc68ade324a3bbd81ceeb7092ecdbbc2055099fcb8864"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-mcpplib"
    - "--disable-shared --enable-static (default)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "Release config.guess/config.sub require explicit HarmonyOS and linux-ohos triplet support"
  - "The two configure temporary-directory masks must use umask 022 on HMDFS"
  - "The standard Conan shared and fPIC options must be mapped through AutotoolsToolchain"
  - "Both libmcpp and the packaged mcpp CLI require semantic consumer tests"
