# 软件级 manifest
# 文件位置: archives/m/most/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: most

# 显示名
display: "MOST"

# 一句话描述
description: "A powerful terminal pager similar to 'more' and 'less' that supports multiple windows and left-right scrolling"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://www.jedsoft.org/most/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-only

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "依赖 S-Lang 库 (slang) 2.x，需先适配 slang 并发布到制品仓"
    - "需要 config.guess/config.sub 补丁以识别 aarch64-ohos 平台"

  # 跨版本通用依赖
  common_dependencies:
    - slang

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.2.0":
    status: built
    build_date: 2026-07-17
  "5.2.0-r2":
    status: built
    build_date: 2026-07-17