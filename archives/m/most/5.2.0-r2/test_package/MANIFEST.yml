# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: most/5.2.0-r2
homepage: "https://www.jedsoft.org/most/"

# 上游测试命令 (most 无正式 make check 测试框架)
upstream_check_command: ""

# 上游审计：most 无任何测试框架（经审计 configure/Makefile.in/testfiles/）
# - configure.ac 无 `make check` 目标、无 gtest/pytest/criterion 绑定
# - testfiles/ 仅含 .sl（slang 脚本）和 .txt（数据）文件，非测试断言
upstream_tests_exist: false
upstream_test_audit: "Audited most 5.2.0 source (configure.ac, Makefile.in, testfiles/): no `make check` target, no gtest/pytest/criterion framework bindings. The testfiles/ directory contains only .sl slang scripts and .txt data files (mktrucolor.sl, pngtoesc.sl, truecolor.txt, truecolor2.txt) — these are sample data, not assertions. No upstream test cases exist."
reason: "most 5.2.0 has no upstream test framework: no gtest/pytest/criterion, no `make check` target; testfiles/ holds only .sl/.txt sample data, not assertions."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# most 上游无正式测试框架，仅有 testfiles/ 目录包含测试数据文件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 most 二进制安装和 --version/--help 功能"
    command: "sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2