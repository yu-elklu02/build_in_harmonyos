software: mmv
display: "mmv"
description: "Move, copy, append, and link multiple files with wildcard patterns"
category: utils
homepage: "https://github.com/rrthomas/mmv"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用 autotools 构建系统（configure + make）"
    - "OHOS 需修复 configure 脚本 shebang (E165): #! /bin/sh -> #!/system/bin/sh"
    - "OHOS 需修复 configure 中 umask (E110): umask 077 -> umask 002"
    - "源码分析显示 mmv 2.10 未使用 bdw-gc，无需声明该依赖"
    - "Release tarball 已预生成 configure 和 cmdline.c/cmdline.h，无需 bootstrap"
    - "mmv 是 CLI 应用程序，package_info 中 libs=[]，bindirs=['bin']"
  common_dependencies: []

versions:
  "2.10":
    status: built
    build_date: "2026-07-15"
