software: mmv
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rrthomas/mmv/releases/download/v2.10/mmv-2.10.tar.gz"

  # 源码校验和
  sha256: "2bbba14c099b512b4a7e9effacec53caa06998069d108a5669ff424ffc879d03"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-gcc-warnings"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mmv 2.10 使用 autotools + gnulib 构建，release tarball 已包含预生成的 configure 和 cmdline.c/cmdline.h"
  - "源码分析显示 configure.ac 和 Makefile.am 均未引用 bdw-gc；实际链接仅依赖 libgnu.a，无需声明 bdw-gc 依赖"
  - "OHOS 适配需修复 configure 脚本 shebang (E165) 和 umask (E110)"
  - "config.guess/config.sub 不认识 HarmonyOS，手动 patch 源码自带文件添加 ohos 识别（E007），不依赖系统 automake 路径"
  - "参照 bash 库做法：仅指定 --build=aarch64-unknown-linux-gnu（config.sub 可接受），不传 --host，native 编译模式使 make check 可运行"
  - "不可使用 --host=aarch64-unknown-linux-ohos，因为 config.sub 的 kernel-OS 校验不接受 linux-ohos 组合"
  - "make check 运行 gnulib 模块测试 (lib/)，满足 CI L1c 上游测试门禁要求"
  - "mmv 安装时通过 install-exec-hook 创建 mcp/mln/mad 符号链接指向 mmv 二进制"
