# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mmv/2.10
homepage: "https://github.com/rrthomas/mmv"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# mmv 2.10 release tarball 的 `make check` 仅运行 gnulib 模块测试，
# 无 mmv 自身的功能测试目录。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# mmv 源码无 tests/ 目录；make check 仅运行 lib/ 下的 gnulib 模块测试。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 测试用例改编自 Homebrew mmv formula 的 test do 块
test_package_tests:
  - file: test_mmv.sh
    description: "通过 bash 执行 mmv 的移动/覆盖/符号链接功能验证（改编自 Homebrew formula test）"
    command: "bash test_mmv.sh <mmv_bin>"

# 测试断言总数 (近似值, 用于质量评估)
# 3 个测试场景: 预览拒绝覆盖、删除+移动、创建符号链接
assertion_count: 3
