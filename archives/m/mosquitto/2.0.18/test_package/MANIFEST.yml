# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: mosquitto/2.0.18
homepage: "https://mosquitto.org/"

# Upstream test command (for make -n check / ctest -N analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test/test.c
    source: mosquitto-2.0.18/test/
    description: "Mosquitto built-in test suite in test/ directory (requires python3)"
    command: "make check"

# test_package self-contained tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: verify mosquitto_lib_init/version/new/destroy API"
    command: "./test_mosquitto"

# Approximate assertion count for quality assessment
assertion_count: 4
