software: mosquitto
version: "2.0.18"
status: built
build_date: "2026-08-07"
build_system: cmake

source:
  url: "https://mosquitto.org/files/source/mosquitto-2.0.18.tar.gz"
  sha256: "d665fe7d0032881b1371a47f34169ee4edab67903b2cd2b4c083822823f4448a"
  tar_format: tar.gz

build:
  system: cmake
  options:
    - DOCUMENTATION=OFF
    - WITH_TLS=ON
    - WITH_CJSON=ON
    - WITH_THREADING=ON
    - WITH_BUNDLED_DEPS=ON
    - WITH_UNIX_SOCKETS=ON
    - WITH_BRIDGE=ON
    - WITH_PERSISTENCE=ON
    - WITH_CONTROL=ON
    - WITH_EPOLL=ON

dependencies:
  - openssl/3.5.6.1
  - cjson/1.7.19

patches:
  - patches/0001-CMakeLists.txt.patch
  - patches/0002-config.h.patch

patch_details:
  - file: patches/0001-CMakeLists.txt.patch
    type: portability
    guard: cmake_minimum_required
    description: "Bump cmake_minimum_required from 3.1 to 3.5 for CMake 4.x compatibility"
  - file: patches/0002-config.h.patch
    type: portability
    guard: __OHOS__
    description: "Add __OHOS__ guard for pthread_cancel — HarmonyOS does not implement pthread_cancel/pthread_testcancel"
