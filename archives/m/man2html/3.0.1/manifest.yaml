# 版本级 manifest — man2html 3.0.1
# 文件位置: archives/m/man2html/3.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.1"

# 软件名
software: "man2html"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-13"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.mhonarc.org/release/misc/man2html3.0.1.tar.gz"

  # 源码校验和
  sha256: "a3dd7fdd80785c14c2f5fa54a59bf93ca5f86f026612f68770a0507a3d4e5a29"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options:
    - "perl install.me -batch -binpath bin -manpath man"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # perl 是系统运行时依赖，非 Conan 包依赖

  # 编译器（本工具无需编译，保留默认值）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "man2html 是纯 Perl 脚本工具，构建系统为 custom (install.me)"
  - "install.me -batch 模式支持非交互安装：-binpath/-manpath/-perlpath"
  - "perl 是系统运行时依赖，参考 perl-spiffy 归档处理方式"
  - "版本目录名 3.0.1 与实际版本号一致"
