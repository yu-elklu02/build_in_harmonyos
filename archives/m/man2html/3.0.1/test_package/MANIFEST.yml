# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: man2html/3.0.1
homepage: "https://savannah.nongnu.org/projects/man2html/"

# man2html is a Perl script tool with no compiled test suite.
# The upstream "test" is functional: pipe a man page → check HTML output.
upstream_check_command: "echo '.TH TEST 1' | perl man2html"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "echo '.TH TEST 1' | man2html"

# 上游实际运行的测试程序 (man2html 无编译型测试,仅功能性验证)
upstream_tests:
  - file: man2html
    source: man2html3.0.1.tar.gz/man2html
    description: "Functional test: convert nroff man page to HTML via stdin pipe"
    command: "echo '.TH TEST 1' | man2html"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: invoke man2html binary, verify HTML output contains expected tags"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
