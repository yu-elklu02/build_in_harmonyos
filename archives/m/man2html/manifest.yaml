# 软件级 manifest — man2html
# 文件位置: archives/m/man2html/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: man2html

# 显示名
display: "man2html"

# 一句话描述
description: "Convert nroff man pages to HTML (Perl program)"

# 分类标签
category: doc

# 官网 URL
homepage: "https://savannah.nongnu.org/projects/man2html/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Perl 脚本工具，无需 C 编译，使用 install.me 安装脚本"
    - "依赖系统 perl 运行时（非 Conan 包依赖）"
    - "install.me -batch 模式安装，需指定 -binpath/-manpath/-perlpath"
    - "install.me 会重写 man2html 脚本的 #! 行指向实际 perl 路径"

  # 跨版本通用依赖
  common_dependencies:
    - perl

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.0.1":
    status: built
    build_date: "2026-07-13"
