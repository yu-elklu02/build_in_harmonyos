software: miniupnpc
version: 2.3.3
status: built
build_system: cmake
build_date: "2026-07-15"
created_at: 2026-05-06

# 构建信息
configure_options:
  - UPNPC_BUILD_STATIC=ON
  - UPNPC_BUILD_SHARED=OFF
  - UPNPC_BUILD_TESTS=OFF

build_command: cmake --build --preset default
install_command: cmake --install build

# 测试信息
test_command: ctest --output-on-failure
test_result: all_passed (6/6)
test_status: built

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - miniupnpc 同时支持 Makefile 和 CMake 构建系统，Conan 配方使用 CMake
  - 通过 CMake 变量 UPNPC_BUILD_STATIC/UPNPC_BUILD_SHARED 控制静态/动态库构建
  - 源码自动识别 HarmonyOS/HongMeng Kernel 1.12.0
  - 无需补丁，直接编译成功
  - 6 个上游测试用例全部通过
  - 消费者测试调用 upnpDiscover() 验证 API 可用性

# 产物信息
artifacts:
  binaries:
    - upnpc (39KB)
    - upnp-listdevices (23KB)
    - external-ip (脚本)
  libraries:
    - libminiupnpc.a (82KB)
    - libminiupnpc.so.21 (64KB)
  headers: 10 个头文件
  pkgconfig: miniupnpc.pc

# 包大小
package_size:
  main: 492KB
  debug: 126KB

# 源码信息
source_url: https://github.com/miniupnp/miniupnp/releases/download/miniupnpc_2_3_3/miniupnpc-2.3.3.tar.gz
build_log: logs/build.log

# 依赖关系
dependencies:
  build: []
  runtime: []

# 平台信息
platform:
  os: HarmonyOS
  kernel: HongMeng Kernel 1.12.0
  arch: aarch64
  compiler: clang 15.0.4