# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: miniupnpc/2.3.3
homepage: "https://miniupnp.tuxfamily.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/minixmlvalid.c
    source: miniupnpc-2.3.3/src/minixmlvalid.c
    description: "XML parser validation test"
    command: "./build/minixmlvalid"
  - file: testminiwget.sh
    source: miniupnpc-2.3.3/testminiwget.sh
    description: "HTTP wget functionality test"
    command: "./testminiwget.sh"
  - file: testupnpreplyparse.sh
    source: miniupnpc-2.3.3/testupnpreplyparse.sh
    description: "UPnP reply parsing test"
    command: "./testupnpreplyparse.sh"
  - file: src/testportlistingparse.c
    source: miniupnpc-2.3.3/src/testportlistingparse.c
    description: "Port listing parser test"
    command: "./build/testportlistingparse"
  - file: src/testigddescparse.c
    source: miniupnpc-2.3.3/src/testigddescparse.c
    description: "IGD description parser test"
    command: "./build/testigddescparse"
  - file: src/testaddr_is_reserved.c
    source: miniupnpc-2.3.3/src/testaddr_is_reserved.c
    description: "Address reservation test"
    command: "./build/testaddr_is_reserved"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_miniupnpc.c
    description: "Consumer API test: calls upnpDiscover() and verifies version string"
    command: "./test_miniupnpc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
