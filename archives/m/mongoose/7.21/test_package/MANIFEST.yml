# test_package/MANIFEST.yml
package: mongoose/7.21
homepage: "https://github.com/cesanta/mongoose"

upstream_check_command: "make -C test test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/unit_test.c
    source: mongoose-7.21/test/unit_test.c
    description: "Mongoose unit test suite (requires network, not run in CI)"
    command: "./unit_test"

test_package_tests:
  - file: test_package/test.c
    description: "Verify mongoose API: mg_mgr_init, mg_str, mg_match"
    command: "./test_mongoose"

assertion_count: 3
