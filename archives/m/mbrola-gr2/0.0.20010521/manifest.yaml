source:
  url: "https://deb.debian.org/debian/pool/non-free/m/mbrola-gr2/mbrola-gr2_0.0.20010521+repack2.orig.tar.xz"
  sha256: "0236fae65ada3b70900c35d9faf98c40b51372ed41230277eb9aba0f59260820"
  tar_format: tar.xz

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: not_used
  cxx: not_used

patches_applied: []

knowledge_gained:
  - "GR2 is an architecture-independent MBROLA diphone database; no compiler is used."
  - "The database header declares format 2.060, 1081 diphones, and a 22050 Hz sample rate."
  - "The packaged upstream PHO example contains 211 phoneme commands whose adjacent pairs are all present in GR2."

validation:
  native_windows:
    conan_create: passed
    consumer_assertions: "23/23"
    upstream_synthesis: not_run
    reason: "The MBROLA engine is a separate runtime and is not available as a Conan dependency."
  ohos:
    conan_create: not_run
    reason: "Official competition CI is the authoritative OHOS validation."
