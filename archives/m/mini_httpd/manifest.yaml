software: mini_httpd
display: "mini_httpd"
description: "Small, lightweight HTTP server from ACME Labs"
category: network
homepage: "https://www.acme.com/software/mini_httpd/"
license: BSD-like
build_system: makefile

ohos_adaptation:
  key_points:
    - "int64_t重定义需要避免(与系统头文件冲突)"
    - "getpass函数缺失,需要备用实现"
    - "使用TMPDIR替代硬编码/tmp路径"
    - "Conan recipe通过make变量覆盖BINDIR/MANDIR(无需Makefile补丁)"
  common_dependencies:
    - openssl (可选,用于HTTPS)

versions:
  "1.30":
    status: built
    build_date: "2026-07-15"
    published_as: mini_httpd