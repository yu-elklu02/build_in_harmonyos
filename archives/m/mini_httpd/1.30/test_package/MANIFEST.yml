# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mini_httpd/1.30
homepage: "https://www.acme.com/software/mini_httpd/"

# 上游测试命令
# mini_httpd has no test suite — no make check target
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# mini_httpd has no test suite — no make check target
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# commands.json 声明交付 mini_httpd 和 htpasswd,两者均需覆盖
test_package_tests:
  - file: test.c
    description: "Run mini_httpd -V to verify binary is installed and functional"
    command: "./test_mini_httpd"
  - file: test.c
    description: "Run htpasswd with no args to verify binary exists and is executable"
    command: "./test_mini_httpd"

# 测试断言总数 (近似值)
assertion_count: 4
