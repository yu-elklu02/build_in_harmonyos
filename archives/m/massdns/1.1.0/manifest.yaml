# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "massdns 使用纯 Makefile 构建，无 configure 脚本，无 make install 目标"
  - "Makefile 中 PROJECT_FLAGS 使用 git describe 获取版本号，tarball 中需手动传递 MASSDNS_REVISION"
  - "massdns 自 v0.3 起使用自定义 DNS 实现，不再依赖 ldns"
  - "使用 -DHAVE_EPOLL -DHAVE_SYSINFO Linux 特定选项，HarmonyOS 基于 Linux 内核支持"
  - "构建产物为单一二进制 bin/massdns，需手动 copy 到 package/bin 并进行 ELF 签名"
