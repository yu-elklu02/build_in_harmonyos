# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: massdns/1.1.0
homepage: "https://github.com/blechschmidt/massdns"

# 上游测试命令（massdns 无 ctest/make check 测试套件）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# massdns uses shell-based integration tests (tests/run-tests.sh) that require
# network access and resolvers — not suitable for CI smoke testing
upstream_tests:
  - file: tests/run-tests.sh
    source: massdns-1.1.0/tests/run-tests.sh
    description: "Integration tests requiring network access (not run in CI)"
    command: "./tests/run-tests.sh"

# test_package 自带的测试（消费者视角验证：执行 massdns 二进制）
test_package_tests:
  - file: test.sh
    description: "massdns --version 冒烟测试 + --help 功能测试"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 2
