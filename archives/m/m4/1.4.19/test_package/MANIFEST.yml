package: m4/1.4.19
homepage: "https://www.gnu.org/software/m4/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "OHOS recipe uses build-output m4 smoke; full make check was run separately during r9 device validation."

upstream_tests:
  - file: checks/check-them
    source: m4-1.4.19/checks/check-them
    description: "Document-driven GNU m4 checks generated from doc/m4.texi; the release tarball ships 237 numbered check files plus stackovf.test."
    command: "PATH=$(pwd)/../src:$PATH checks/check-them -I examples checks/*"
  - file: tests/gnulib.mk
    source: m4-1.4.19/tests/gnulib.mk
    description: "Gnulib portability tests entered by top-level make check."
    command: "make -C tests check"

test_package_tests:
  - file: test.sh
    description: "Consumer test expands macros with the packaged m4 command and checks text, eval(), and ifelse() output."
    command: "sh test.sh"
  - file: test.m4
    description: "m4 input fixture consumed by test.sh."
    command: "m4 test.m4 > output.txt"

assertion_count: 5
test_modifications:
  - "No upstream tests are modified or removed."
  - "Full OHOS make check was attempted in r9; checks/198.sysval and checks/stackovf.test are platform-sensitive on the isolated device, so OHOS package gating uses build-output smoke plus test_package."
  - "Consumer test uses m4 as a tool_requires build tool, matching its use by autoconf."
