# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: MurmurHash3/0.0.1
homepage: "https://github.com/aappleby/smhasher"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# SMHasher 的测试是 main.cpp 中的哈希速度/碰撞测试，
# 不适合作为 Conan L1 测试（需要完整构建 + 长时间运行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "验证 MurmurHash3 哈希函数正确性（已知向量 + 确定性）"
    command: "./test_murmurhash3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
