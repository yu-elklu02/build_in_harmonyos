# test_package/MANIFEST.yml — mecab-ko 0.996-ko-0.9.2
# 消费者测试声明文件

package: mecab-ko/0.996-ko-0.9.2
homepage: "https://bitbucket.org/eunjeon/mecab-ko"

# 上游测试命令 (make -n check)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (tests/Makefile.am TESTS)
upstream_tests:
  - file: tests/run-dics.sh
    source: mecab-0.996-ko-0.9.2/tests/run-dics.sh
    description: "Dictionary compilation & POS tagging test"
    command: "./run-dics.sh"
  - file: tests/run-eval.sh
    source: mecab-0.996-ko-0.9.2/tests/run-eval.sh
    description: "System evaluation test"
    command: "./run-eval.sh"
  - file: tests/run-cost-train.sh
    source: mecab-0.996-ko-0.9.2/tests/run-cost-train.sh
    description: "Cost training test"
    command: "./run-cost-train.sh"

# test_package 中自带的测试
test_package_tests:
  - file: test_package/conanfile.py
    description: "Verify mecab --version, mecab-config, mecab-dict-index etc. CLI tools"
    command: "conan create test_package"

assertion_count: 7
