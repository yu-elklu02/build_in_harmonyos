software: matplotplusplus
display: "Matplot++ C++ Plotting Library"
description: "现代化的 C++ 绘图库，提供类似 MATLAB 和 Matplotlib 的绘图功能，支持 Gnuplot 后端"
category: graphics
homepage: "https://github.com/alandefreitas/matplotplusplus"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯静态库项目，无可执行文件"
    - "CMake 项目，使用 C++17 标准"
    - "可选依赖（JPEG/TIFF/PNG/ZLIB/OpenCV/FFTW/BLAS/LAPACK）未安装不影响基本功能"
    - "运行时需要 gnuplot 执行绘图功能"
  common_dependencies:
    - "gnuplot/runtime"

versions:
  "1.2.0":
    status: built
    build_date: "2026-06-05"
    source_url: "https://github.com/alandefreitas/matplotplusplus/archive/refs/tags/v1.2.0.tar.gz"
