package: matplotplusplus/1.2.2
homepage: https://github.com/alandefreitas/matplotplusplus
upstream_check_command: "cmake --build . --target generate_examples"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target generate_examples"
upstream_tests:
  - file: test/generate_examples/main.cpp
    source: matplotplusplus-1.2.2.tar.gz/test/generate_examples/main.cpp
    description: "Build the compile-only upstream test target (the release registers no CTest cases)"
    command: "cmake --build . --target generate_examples"
test_package_tests:
  - file: test_package.cpp
    description: "Generate a numeric sequence with the public Matplot++ API"
    command: "./test_package"
assertion_count: 3
