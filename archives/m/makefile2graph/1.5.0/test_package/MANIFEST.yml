# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: makefile2graph/1.5.0
homepage: "https://github.com/lindenb/makefile2graph"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: makefile2graph-v1.5.0/Makefile
    description: "make check 运行 make2graph 解析 make -Bnd 输出并生成 DOT/GEXF/list/deep 格式"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 make2graph --version 验证二进制可执行且显示版本号"
    command: "make2graph --version"
  - file: conanfile.py
    description: "管道 make -Bnd 输出到 make2graph --format l，验证 list 格式输出"
    command: "make -Bnd | make2graph --format l"
  - file: conanfile.py
    description: "管道 make -Bnd 输出到 make2graph --format x，验证 GEXF XML 输出"
    command: "make -Bnd | make2graph --format x"
  - file: test.c
    description: "test_package 测试输入源文件，被 Makefile 编译为 test 二进制"
    command: "make -Bnd"

# 测试断言总数
assertion_count: 3
