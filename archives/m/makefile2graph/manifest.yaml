software: makefile2graph
description: Creates a graph of dependencies from GNU-Make
homepage: https://github.com/lindenb/makefile2graph
category: development-tools
build_system: makefile

# 已编译版本索引
versions:
  - version: "1.5.0"
    status: "built"
    build_date: "2026-07-15"
    build_system: "makefile"

# 软件特点
features:
  - 输出 Graphviz DOT 格式
  - 输出 Gexf-XML 格式
  - 输出深层独立目标列表
  - 输出目标列表

# 编译注意事项
build_notes:
  - 无 configure 步骤，直接使用 make
  - 无外部库依赖
  - 纯 C 程序，仅需标准库
