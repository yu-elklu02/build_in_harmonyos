software: murex
version: "7.2.1001"
status: pending
build_date: "2026-08-02"
build_system: go
conan_ref: "murex/7.2.1001"
status_notes: "Falls back to a sha256-verified Go 1.26.3 toolchain from the Aliyun mirror when the OHOS CI worker does not provide go; keeps the fallback toolchain, caches, temp dirs, and Go linker output outside the murex module tree to avoid polluting go test ./... and to bypass HMDFS mmap restrictions. Build #15415 executed the signed upstream test binaries and reached one optional aspell PATH check; OHOS now uses upstream's MUREX_TEST_NO_EXEC_DEPS switch because the package does not bundle optional external commands."

source:
  url: "https://github.com/lmorg/murex/archive/refs/tags/v7.2.1001.tar.gz"
  sha256: "264a1b3ffca3fce8d8c1b0757e0498dc544fd5388694c405c6e4e42c6f87a82c"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64 for OHOS arm64"
    - "GOTOOLCHAIN=local"
    - "Fallback Go toolchain: go1.26.3 linux-amd64/linux-arm64 from mirrors.aliyun.com, sha256 verified"
    - "chmod-normalize fallback Go toolchain directories and bin/pkg/tool executables before go build"
    - "Use an external work root for the fallback Go toolchain, GOCACHE/GOMODCACHE/GOPATH/TMPDIR/GOTMPDIR, and Go linker -o output; copy final binary back to Conan build bin"
    - "go test ./... with 876 upstream Test functions before building the packaged command; on OHOS, an -exec wrapper self-signs each generated test binary before execution"
    - "MUREX_TEST_NO_EXEC_DEPS=1 on OHOS disables upstream PATH-only checks for optional external commands such as aspell; all Go test packages remain enabled"
    - "go build -trimpath -ldflags '-s -w' -o murex ."
  dependencies: []
  cc: N/A
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "murex is a pure Go command-line application and does not require target-side C/C++ libraries."
  - "The fallback Go toolchain and Go caches must stay outside the murex module tree; otherwise upstream go test ./... also discovers Go distribution test fixtures under go/test and fails on non-module relative-import samples."
  - "OHOS/HMDFS workers can unpack the fallback Go toolchain without traversable or executable bits, so the recipe restores parent/root directory and tool executable permissions before running go."
  - "Go linker output must not be written directly under the Conan HMDFS build folder; use an hmfs work root such as /data/storage/el2/base/cache to avoid mmap permission errors."
  - "Fresh Go test binaries must be self-signed through a go test -exec wrapper before OHOS can execute them; otherwise fork/exec fails with permission denied."
  - "Build #15415 proved the signing wrapper works and ran the upstream suite; its only failure was TestAspellInstalled because aspell is not present on the official OHOS worker."
  - "Upstream's MUREX_TEST_NO_EXEC_DEPS switch is the supported way to disable optional external-command presence checks without excluding any Go test package."
  - "Upstream v7.2.1001 has 326 Go test files and 876 Test functions, so the recipe runs go test ./... during build before packaging."
  - "The smoke test exercises both command execution and upstream version output."

validation:
  local_windows:
    py_compile: passed
    diff_check: passed
    conan_create: not_run
    reason: "No local Conan/OHOS Go toolchain is installed in this Windows workspace."
  ohos:
    conan_create: pending_ci
    upstream_go_test: pending_ci
    upstream_case_count: 876
    reason: "Build #15415 executed signed upstream test binaries and failed only on the optional aspell PATH check; fresh CI must validate the upstream MUREX_TEST_NO_EXEC_DEPS switch and the consumer test."
