# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: marisa/0.3.1
homepage: https://github.com/s-yata/marisa-trie

# 上游源码自带单元测试套件（base/io/vector/trie/marisa），在 conanfile.py
# build() 中通过 cmake.test() 运行（BUILD_TESTING 默认开启）。
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - file: tests/base-test.cc
    source: marisa-trie-0.3.1/tests/base-test.cc
    description: "MARISA 基础类型与工具测试"
    command: "./base-test"
  - file: tests/io-test.cc
    source: marisa-trie-0.3.1/tests/io-test.cc
    description: "MARISA IO（reader/writer/mapper）测试"
    command: "./io-test"
  - file: tests/vector-test.cc
    source: marisa-trie-0.3.1/tests/vector-test.cc
    description: "MARISA 向量容器测试"
    command: "./vector-test"
  - file: tests/trie-test.cc
    source: marisa-trie-0.3.1/tests/trie-test.cc
    description: "MARISA Trie 构建与查询测试"
    command: "./trie-test"
  - file: tests/marisa-test.cc
    source: marisa-trie-0.3.1/tests/marisa-test.cc
    description: "MARISA 端到端综合测试（lookup/predictive/reverse 等）"
    command: "./marisa-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_marisa.cpp
    description: "构建 Keyset→Trie，save/load 往返，lookup/predictive/common-prefix/reverse-lookup 验证"
    command: "./test_marisa"

# 测试断言总数（消费者测试 check() 计数）
assertion_count: 9
