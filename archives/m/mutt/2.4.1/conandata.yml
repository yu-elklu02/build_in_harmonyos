  # sha256 verified via PGP-signed tag (git tag mutt-2-4-1-rel) provides out-of-band integrity.
  url:
    - "https://ftp.mutt.org/pub/mutt/mutt-2.4.1.tar.gz"
    - "http://ftp.mutt.org/pub/mutt/mutt-2.4.1.tar.gz"
  sha256: "5624321f0b1cc1eff6cab9ef08f25954ff64c51b33d4bf3b99484cf1edd8cfff"
