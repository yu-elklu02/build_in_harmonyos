# conandata.yml — mutt 2.4.1
# sha256 computed from source tarball
# Patches are applied inline in build() due to HMDFS case sensitivity
# conflict between conan patches/ dir and mutt PATCHES file.
# Patch files in patches/ are kept for archival reference.

