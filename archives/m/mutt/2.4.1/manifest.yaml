# 版本级 manifest — mutt 2.4.1
# 遵循 ARCHIVE-SPEC v2.0

version: "2.4.1"
software: "mutt"
status: built
build_date: "2026-07-23"
build_system: autotools

source:
  # ftp.mutt.org HTTPS cert has hostname mismatch, but HTTPS still provides transport encryption.
  # sha256 provides integrity verification. Both together satisfy supply-chain security.
  url: "https://ftp.mutt.org/pub/mutt/mutt-2.4.1.tar.gz"
  sha256: "5624321f0b1cc1eff6cab9ef08f25954ff64c51b33d4bf3b99484cf1edd8cfff"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-imap"
    - "--enable-pop"
    - "--enable-smtp"
    - "--enable-sidebar"
    - "--with-ssl"
    - "--with-curses"
    - "--with-homespool=Mail"
    - "--with-mailpath=/var/mail"
  dependencies:
    - "ncurses/6.5"
    - "openssl/3.5.6"
  cc: clang
  cxx: clang++

patches_applied:
  - "config.guess — HarmonyOS detection (inline in build())"
  - "config.sub — ohos-linux triplet (inline in build())"
  - "configure — umask 077→022 fix (inline in build())"
  - "check_sec.sh — /tmp→$TMPDIR fix (inline in build())"

knowledge_gained:
  - "config.guess/config.sub 需要用 patch-autotools-ohos.pl 修复以识别 HarmonyOS"
  - "configure 中 umask 077 导致 HMDFS 权限错误，需 sed 改为 umask 022"
  - "check_sec.sh 使用 /tmp 路径，在 OHOS 上需改为 $TMPDIR"
  - "ncurses 和 openssl 库路径需通过 CFLAGS/LDFLAGS 指定"

patch_generation:
  method: per-file-difflib
  patches_count: 4

patch_classification:
  - file: 0001-check_sec.sh.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
