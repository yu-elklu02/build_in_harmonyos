# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mutt/2.4.1
homepage: "http://www.mutt.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: check_sec.sh
    source: mutt-2.4.1/check_sec.sh
    description: "Security check script (requires shellcheck, non-critical on OHOS)"
    command: "./check_sec.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 mutt -v 验证二进制可执行"
    command: "mutt -v"
  - file: test.sh
    description: "功能测试: 版本号、SSL/IMAP/POP/SMTP 特性、HarmonyOS/aarch64 系统识别、帮助输出"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
