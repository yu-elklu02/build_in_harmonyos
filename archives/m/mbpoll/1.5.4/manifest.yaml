# Version-level manifest - mbpoll 1.5.4
# archives/m/mbpoll/1.5.4/manifest.yaml

version: "1.5.4"
software: mbpoll
status: built
build_date: "2026-07-15"
build_system: cmake

source:
  url: "https://github.com/epsilonrt/mbpoll/archive/refs/tags/v1.5.4.tar.gz"
  sha256: "a9bcc3afa3b85b3794505d07827873ead280d96a94769d236892eb8a4fb9956f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DMBPOLL_CUSTOM_RTS_GPIO=OFF"
  # libmodbus (>= 3.1.7) is not published to the OHOS artifact registry, so it
  # is vendored and statically built inside the recipe (no Conan requirement).
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-hardcode-version-no-git-dep.patch"
  - "0002-make-libmodbus-quirks-optional.patch"

knowledge_gained:
  - "libmodbus 未发布到 OHOS 制品仓，需 vendor 其源码静态编译"
  - "musl/OHOS 工具链缺 linux/serial.h，需提供最小内核头 shim"
  - "上游 GitVersion.cmake 在非 git 仓库构建时硬中止，改为硬编码版本"

verification:
  real_device:
    date: "2026-07-19"
    env: "HarmonyOS HAD 206.1.0 真机（aarch64 musl，OHOS SDK clang 15.0.4）"
    result: "pass"
