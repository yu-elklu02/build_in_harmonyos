# test_package/MANIFEST.yml
# Upstream official test declaration.
# CI (build_and_test.sh L0e) requires this file to exist.
#
# Upstream ships two CTest unit-test programs under tests/ (no framework -
# plain C with a hand-rolled harness). They are built and run locally to obtain
# the real pass-rate reported in the PR; see notes.md for the run transcript.

package: mbpoll/1.5.4
homepage: "https://github.com/epsilonrt/mbpoll"

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test_utils.c
    source: mbpoll-1.5.4/tests/test_utils.c
    description: "Unit tests for utils.c - integer-list parsing (iGetIntList) and 16-bit word swap (lSwapLong, fSwapFloat)"
    command: "./bin/test_utils"
  - file: tests/test_serial.c
    source: mbpoll-1.5.4/tests/test_serial.c
    description: "Unit tests for serial.c - serial config enum to string conversion (flow, databits, stopbits, parity)"
    command: "./bin/test_serial"

test_package_tests:
  - file: test.sh
    description: "Smoke test - runs the packaged mbpoll binary (mbpoll -V)"
    command: "bash test.sh"

assertion_count: 33
