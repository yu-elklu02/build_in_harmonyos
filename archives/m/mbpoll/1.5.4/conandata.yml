sources:
  - url: "https://github.com/epsilonrt/mbpoll/archive/refs/tags/v1.5.4.tar.gz"
    sha256: "a9bcc3afa3b85b3794505d07827873ead280d96a94769d236892eb8a4fb9956f"
  # libmodbus (>= 3.1.7) is the sole runtime dependency of mbpoll. It is not
  # published as a Conan package in the OHOS artifact registry, so it is vendored
  # and built as a static library inside this recipe (see conanfile.py).
  # The official libmodbus.org release tarball is used because it ships a
  # pre-generated `configure` script (the GitHub source archive would require
  # autoconf/automake, which are not available on the build host).
  - url: "https://libmodbus.org/releases/libmodbus-3.1.7.tar.gz"
    sha256: "7dfe958431d0570b271e1a5b329b76a658e89c614cf119eb5aadb725c87f8fbd"
    folder: "libmodbus"

patches:
  - patch_file: "patches/0001-hardcode-version-no-git-dep.patch"
    patch_description: "Hardcode the project version and stop relying on git tags at configure time for reproducible source-tarball builds."
    patch_type: "portability"
  - patch_file: "patches/0002-make-libmodbus-quirks-optional.patch"
    patch_description: "Guard the libmodbus quirks code path (-Q/-X) behind MBPOLL_ENABLE_LIBMODBUS_QUIRKS; the vendored libmodbus 3.1.7 predates the quirks API."
    patch_type: "portability"
