# Software-level manifest - mbpoll
# archives/m/mbpoll/manifest.yaml

software: mbpoll
display: "mbpoll"
description: "命令行 Modbus 主站仿真工具，支持 RTU/串口与 TCP 读写从站寄存器"
category: utility
homepage: "https://github.com/epsilonrt/mbpoll"
license: GPL-3.0-only

build_system: cmake

ohos_adaptation:
  key_points:
    - "唯一运行时依赖 libmodbus(>=3.1.7) 未发布到 OHOS 制品仓，配方内 vendor 官方 3.1.7 源码静态编译后链接"
    - "musl/OHOS 工具链缺 linux/serial.h（modbus-rtu.c 用于 RS485 ioctl），提供最小内核头 shim"
    - "上游用 git tag 取版本号，源码包/非 git 构建时会硬中止，改为硬编码版本"
    - "禁用 piduino（GPIO RS-485 RTS，OHOS 无此设施）"
  common_dependencies:
    - libmodbus

versions:
  "1.5.4":
    status: built
    build_date: "2026-07-15"
