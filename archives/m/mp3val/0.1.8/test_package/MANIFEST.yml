# test_package/MANIFEST.yml
# CI L0e requires this file
package: mp3val/0.1.8
homepage: "https://sourceforge.net/projects/mp3val/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

# mp3val has no upstream test suite (no make check target)
upstream_tests: []

test_package_tests:
  - file: test_mp3val.sh
    description: "Run mp3val -v to verify binary works"
    command: "mp3val -v"

assertion_count: 1
