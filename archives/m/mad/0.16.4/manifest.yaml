software: mad
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.16.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.16.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitee.com/src-openeuler/libmad/raw/master/libmad-0.16.4.tar.gz"

  # 源码校验和
  sha256: "0f6bfb36c554075494b5fc2c646d08de7364819540f23bab30ae73fa1b5cfe65"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DOPTIMIZE=ACCURACY"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x requires CMAKE_POLICY_VERSION_MINIMUM=3.5 for projects declaring cmake_minimum_required(VERSION 3.1.0)"
  - "libmad 0.16.4 uses cmake (tenacityteam fork), not autotools (original sourceforge version)"
  - "R26: libmad is a system same-name library, built as static (BUILD_SHARED_LIBS=OFF)"
