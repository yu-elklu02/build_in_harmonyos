# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mad/0.16.4
homepage: "https://codeberg.org/tenacityteam/libmad"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libmad 0.16.4 (cmake) defines no ctest tests; the project builds an
# example "mad_example" (minimad.c) but does not register it as a test.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 验证 mad.h 可包含且 mad_stream_init/finish 可链接"
    command: "./test_mad"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
