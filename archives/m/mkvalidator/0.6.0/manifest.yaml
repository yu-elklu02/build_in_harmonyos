software: mkvalidator
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/matroska/mkvalidator/mkvalidator-0.6.0.tar.bz2"

  # 源码校验和
  sha256: "f9eaa2138fade7103e6df999425291d2947c5355294239874041471e3aa243f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build_system: cmake

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（编译器由 Conan Toolchain 自动注入，R33: 禁止硬编码）
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies: []

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-disable-corec-tests.patch"
  - "0002-add-mkvalidator-install-rule.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "必须传递 -DCMAKE_SYSTEM_NAME=Linux，否则 UNIX 宏未定义，导致 corec 使用 str_linux.c 而非 str_os.c 引起 undefined reference"
  - "corec/CMakeLists.txt 必须禁用 tests 子目录以避免链接错误（string_test/file_test/node_test 的 tchar 符号未定义）"
  - "mkvalidator/CMakeLists.txt 缺少 install 规则，需要手动添加 install(TARGETS) 规则"
  - "cmake_policy CMP0054 NEW 需要设置避免字符串比较警告"
  - "/proc/meminfo 解析警告在 OH 环境无害"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
