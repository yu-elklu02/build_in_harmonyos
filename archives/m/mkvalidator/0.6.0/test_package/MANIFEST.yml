# test_package/MANIFEST.yml
# mkvalidator has no upstream test suite accessible via CMake
# The test runs the binary directly (R34: test must depend on tested package)

package: mkvalidator/0.6.0
homepage: "https://www.matroska.org/downloads/mkvalidator.html"

# CMake project has no 'check' target exposed
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_mkvalidator.sh
    description: "Run mkvalidator --version to verify binary works"
    command: "sh test_mkvalidator.sh"

# Approximate assertion count
assertion_count: 1
