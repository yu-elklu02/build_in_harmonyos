software: mkvalidator
display: "mkvalidator"
description: "Matroska container format validation tool for MKV/WebM files"
category: multimedia
homepage: "https://www.matroska.org/downloads/mkvalidator.html"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMAKE_SYSTEM_NAME=Linux 必须设置，否则 UNIX 宏未定义导致 corec 选择 str_linux.c（glibc-only）而非 str_os.c（portable POSIX），产生 undefined reference"
    - "corec/tests 子目录必须禁用，测试可执行文件依赖的 tchar 符号在 musl 环境下不可用"
    - "mkvalidator/CMakeLists.txt 缺少 install 规则，需要通过补丁添加 install(TARGETS) 和 GNUInstallDirs"
    - "所有依赖均为内置编译（corec/ebml2/matroska2/zlib/bzlib），无外部 Conan 依赖"
    - "mkvalidator 是命令行工具（R38: 需创建 commands.json）"
  common_dependencies: []

versions:
  "0.6.0":
    status: built
    build_date: "2026-06-17"
