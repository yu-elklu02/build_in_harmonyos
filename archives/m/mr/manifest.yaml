software: mr
display: "mr (myrepos)"
description: "Multiple Repository management tool — 纯 Perl 脚本工具，用于管理多个版本控制仓库"
category: development
homepage: "https://myrepos.branchable.com/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本工具，无需 C/C++ 编译"
    - "shebang 已为 #!/usr/bin/env perl，无需补丁修改"
    - "Makefile 使用 pod2man 生成 man 页面，OHOS 环境 pod2man 位于 /data/service/hnp/bin/pod2man"
    - "可执行文件：mr（多仓库管理）、webcheckout（网页检出）"
  common_dependencies: []

versions:
  "1.20180726":
    status: built
    build_date: "2026-07-22"
    source_url: "https://deb.debian.org/debian/pool/main/m/myrepos/myrepos_1.20180726.tar.xz"
