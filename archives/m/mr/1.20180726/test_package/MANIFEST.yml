# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mr/1.20180726
homepage: "https://myrepos.branchable.com/"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# make test 需要 ed 编辑器，OHOS 环境可能缺失，不集成到 build
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: myrepos-1.20180726/Makefile
    description: "mr upstream test (make test): uses ed editor to test mr --trust-all"
    command: "make test"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "Consumer smoke test: verifies mr help, mr register, and webcheckout existence"
    command: "bash test.sh"

# 测试断言总数 (近似值)
assertion_count: 4
