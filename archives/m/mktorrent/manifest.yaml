software: mktorrent
display: "mktorrent"
description: "创建 BitTorrent metainfo (.torrent) 文件的命令行工具"
category: utility
homepage: "https://github.com/Rudde/mktorrent"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 GNU Make 项目，无 configure；package() 用 copy() 安装二进制（OHOS 无 install(1)）"
    - "传入 OFFPRFX=l 跳过构建期运行 ./prefix（aarch64 off_t==long，宽度即 l）"
    - "启用 USE_LONG_OPTIONS=1 支持 --help 长选项"
    - "package() 阶段用 binary-sign-tool 做 ELF 自签名"
  common_dependencies: []

versions:
  "1.1":
    status: built
    build_date: "2026-07-14"
