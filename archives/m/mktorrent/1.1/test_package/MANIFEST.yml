# test_package/MANIFEST.yml
# mktorrent ships no automated test suite; verification is via the CLI itself.
package: mktorrent/1.1
homepage: "https://github.com/Rudde/mktorrent"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"

# mktorrent has no make check / ctest target.
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Builds a .torrent metainfo file from a sample payload and checks the bencode output"
    command: "bash test.sh"

assertion_count: 3
