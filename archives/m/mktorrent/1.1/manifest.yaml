software: mktorrent
version: "1.1"
status: built
build_date: "2026-07-14"
build_system: makefile

source:
  url: "https://github.com/Rudde/mktorrent/archive/refs/tags/v1.1.tar.gz"
  sha256: "d0f47500192605d01b5a2569c605e51ed319f557d24cfcbcb23a26d51d6138c9"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "USE_LONG_OPTIONS=1"
    - "OFFPRFX=l"
    - "CC=clang (explicit make arg, not self.conf — that conf is unregistered in OHOS Conan 2.29.1)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS 无 install(1)，package() 用 copy() 安装二进制"
  - "Makefile 传入 OFFPRFX=l 跳过构建期运行 ./prefix（未签名 ELF 无法执行）"
  - "OHOS 执行二进制需 ELF 签名，package() 用 binary-sign-tool 自签名"
  - "启用 USE_LONG_OPTIONS=1 以支持 --help 长选项（musl 提供 getopt_long）"
