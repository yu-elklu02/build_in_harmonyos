# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: muon/0.6.0
homepage: "https://muon.build/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "muon -C build-final test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/fmt/test_all_meson_files.meson
    source: muon-0.6.0/tests/fmt/test_all_meson_files.meson
    description: "fmt 格式测试：验证 meson 文件格式化输出与期望一致"
    command: "muon -C build-final test fmt"
  - file: tests/lang/case/*.meson
    source: muon-0.6.0/tests/lang/
    description: "lang 语言解析测试：meson 语言语法/求值用例"
    command: "muon -C build-final test lang"
  - file: tests/project/common/*.meson
    source: muon-0.6.0/tests/project/
    description: "project 集成测试：构建真实 meson 项目"
    command: "muon -C build-final test project"
  - file: tests/lsp/*.meson
    source: muon-0.6.0/tests/lsp/
    description: "lsp 测试：Language Server Protocol 支持"
    command: "muon -C build-final test lsp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：muon version + 解析最小 meson.build 项目并编译"
    command: "muon version; muon setup -Dsamurai=disabled build; muon -C build"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 396
