# 版本级 manifest
# 文件位置: archives/m/muon/0.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.0"

# 软件名
software: "muon"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: "bootstrap"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://muon.build/releases/v0.6.0/muon-v0.6.0.tar.gz"

  # 源码校验和
  sha256: "90a8428bc2178c59b9f7ddd1cb1cc6355f4df0c3ac023f7eefd159ae4f054024"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
  - "-Dlibarchive=disabled"
  - "-Dlibcurl=disabled"
  - "-Dlibpkgconf=disabled"
  - "-Dsamurai=enabled"
  - "-Dmeson-docs=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "muon 是自举构建（bootstrap.sh → muon-bootstrap → setup/compile），不能用标准 meson 模板"
- "bootstrap 版 muon 不支持 -C dir 默认动作，需用 ninja -C 或 muon -C dir samu 驱动构建"
- "samurai 内嵌后端（-Dsamurai=enabled）可避免外部 ninja 依赖"
- "libarchive/libcurl/libpkgconf 均为可选依赖，鸿蒙制品仓未发布时可禁用"
- "conan test_package 中 muon setup 需设置 SHELL/CONFIG_SHELL 指向 /data/service/hnp/bin/bash（鸿蒙 /system/bin/sh 语法限制）"
