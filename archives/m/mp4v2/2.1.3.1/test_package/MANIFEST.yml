# test_package/MANIFEST.yml
package: mp4v2/2.1.3
homepage: "https://mp4v2.org/"

# The upstream DejaGnu suite defines the command-line behavior exercised below.
upstream_check_command: "runtest testsuite/main/standardUsage.exp"
upstream_test_in_build: true
upstream_test_command: "28 standardUsage.exp assertions mirrored in build()"

upstream_tests:
  - file: testsuite/main/standardUsage.exp
    source: mp4v2-2.1.3/testsuite/main/standardUsage.exp
    description: "Usage, option, return-code, and output checks for four MP4V2 tools"
    command: "mp4art/mp4file/mp4subtitle/mp4track standard usage assertions"

test_package_tests:
  - file: test.cpp
    description: "Creates and closes an MP4 file through MP4Create and MP4Close"
    command: "./test_mp4v2"

assertion_count: 29
