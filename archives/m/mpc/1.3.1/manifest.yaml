version: "1.3.1"
status: built
blocker: ""
issue: "#1682"

source:
  url: "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
  sha256: "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
  tar_format: tar.gz

build:
  system: autotools
  conan_recipe: true
  dependencies:
    - gmp/6.3.0
    - mpfr/4.2.2
  configure_options:
    - "--with-pic"
    - "--enable-static --disable-shared by default"
    - "--with-gmp-include=<staged gmp include>"
    - "--with-gmp-lib=<staged gmp lib>"
    - "--with-mpfr-include=<staged mpfr include>"
    - "--with-mpfr-lib=<staged mpfr lib>"
  upstream_test: "make check -j1"
  ohos_notes:
    - "Stage gmp/mpfr include and lib files under the build generators folder on OHOS, excluding .la files, to avoid libtool following dependency_libs paths such as //lib/libgmp.la from dependency packages."
    - "Use TMPDIR under $HOME/tmp and patch configure's mktemp umask to 022 because HarmonyOS user storage denies writes inside mktemp directories created with umask 077."

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0004-configure.patch"

test_package:
  type: cmake
  source: "test_package/test.c"
  checks:
    - "mpc_init2"
    - "mpc_set_si_si"
    - "mpc_sqr"
    - "mpc_real"
    - "mpc_imag"
    - "mpfr_cmp_si"

w0_dependency_check:
  ohpcd:
    gmp: "present: gmp/6.3.0"
    mpfr: "present: mpfr/4.2.2"
    mpc: "missing: conan search 'mpc/*' -r=ohpcd found 0 recipes"
  decision: "mpfr dependency is now available; proceed with mpc single-package build validation."

notes:
  - "GNU MPC 1.3.1 uses Autotools."
  - "Upstream check target is tests/Makefile.am TESTS = $(check_PROGRAMS)."
  - "Legacy 0003-config.status.patch was removed because config.status is generated by configure and the patch was not referenced by conandata.yml."
  - "Second HarmonyOS machine validation: CI_PACKAGES=archives/m/mpc/1.3.1 zsh ci/conan/build_and_test.sh archives/m/mpc/1.3.1 passed on 2026-07-31; log logs/mpc_1.3.1_build_20260731_142438.log."
  - "Validation evidence: conan create passed, upstream make check reported 74/74 PASS, CMake test_package passed and printed 'MPC complex square API check passed'."
  - "L4 patch scan reported warn for config.guess-style portability patch content; build summary still reported Success: 1, Failed: 0, L0_RESULT=pass."
