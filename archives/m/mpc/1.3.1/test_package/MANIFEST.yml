package: mpc/1.3.1
homepage: "https://www.multiprecision.org/mpc/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: tests/tadd.c
    source: mpc-1.3.1/tests/tadd.c
    description: "MPC complex addition validation from upstream make check."
    command: "make check -j1"
  - file: tests/tsqr.c
    source: mpc-1.3.1/tests/tsqr.c
    description: "MPC complex square validation from upstream make check."
    command: "make check -j1"
  - file: tests/tmul.c
    source: mpc-1.3.1/tests/tmul.c
    description: "MPC complex multiplication validation from upstream make check."
    command: "make check -j1"

test_package_tests:
  - file: test.c
    description: "Initializes a complex value, squares it, extracts real/imag parts, and verifies (1+2i)^2 == -3+4i."
    command: "ctest --output-on-failure"

assertion_count: 6
