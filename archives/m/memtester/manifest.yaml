software: memtester
display: "memtester"
description: "用户态内存子系统压力测试工具"
category: utility
homepage: "https://pyropus.ca/software/memtester/"
license: GPL-2.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 djb 风格 Makefile 依赖运行期生成的 #!/bin/sh 脚本，OHOS 无 /bin/sh 不可用，改为直接编译两个 C 源文件(标志位与上游 conf-cc/conf-ld 等价)"
    - "仅依赖 libc，无外部依赖；mlock 在 OHOS 上因 EPERM 自动降级为 unlocked，不影响功能"
    - "官方 pyropus.ca 证书主机名不匹配，conandata.yml 同时声明官方源与 Debian pristine 镜像(sha256 一致)保证可下载"
  common_dependencies: []

versions:
  "4.7.1":
    status: published
    build_date: 2026-07-14
