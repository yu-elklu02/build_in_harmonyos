version: "4.7.1"
software: memtester
status: published
build_date: "2026-07-14"
build_system: makefile

source:
  url: "https://pyropus.ca/software/memtester/old-versions/memtester-4.7.1.tar.gz"
  sha256: "e427de663f7bd22d1ebee8af12506a852c010bd4fcbca1e0e6b02972d298b5bb"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "memtester 上游为 djb 风格 Makefile（conf-cc/conf-ld + 运行期生成的 #!/bin/sh 脚本驱动编译）；OHOS 无 /bin/sh(R5)，该机制无法执行"
  - "改为用与上游 conf-cc/conf-ld 完全等价的 CFLAGS 直接编译 memtester.c/tests.c 并链接，产物行为与上游 make 构建一致"
  - "pyropus.ca 官方站点 SSL 证书主机名不匹配，conan get() 严格校验会失败；conandata.yml 以官方 URL 为首，并附 Debian pristine orig.tar.gz 作为 fallback，二者字节一致(sha256 相同)"
  - "memtester 仅依赖 libc(mmap/mlock/malloc)；OHOS 无 CAP_IPC_LOCK 时 mlock 返回 EPERM，程序自动降级为 unlocked 测试并正常退出"
