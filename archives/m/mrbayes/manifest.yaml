software: mrbayes
display: "mrbayes"
description: "Bayesian inference of phylogeny (command line program 'mb')"
category: science
homepage: "https://nbisweden.github.io/MrBayes/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "禁用可选依赖 readline/beagle-lib/MPI（--with-readline=no --with-beagle=no --with-mpi=no）"
    - "禁用 x86 SIMD（--enable-sse=no --enable-avx=no --enable-fma=no），armv8 平台无需"
    - "补丁 0001：src/bayes.c 支持 GNU 长选项 --version/--help（CI 冒烟测试兼容）"
    - "补丁 0002/0003：config.guess/config.sub 识别 HarmonyOS 与 linux-ohos 三元组"
    - "补丁 0004：configure 临时目录 umask 077→022（HMDFS 目录权限，设备实测）"
    - "构建在临时目录（TMPDIR 重定向，鸿蒙 /tmp 只读）+ /bin/sh 中完成，规避 HMDFS 的 bash getcwd 缺陷"
    - "编译器经 tools.build:compiler_executables conf / VirtualBuildEnv / CC 环境变量获取，无硬编码路径"
  common_dependencies: []

versions:
  "3.2.7a":
    status: built
    build_date: "2026-08-15"
