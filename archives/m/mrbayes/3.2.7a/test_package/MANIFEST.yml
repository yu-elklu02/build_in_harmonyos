  适配后补全 consumer 测试：test_package 通过 test_mb.sh 真实执行被移植的
  mb 二进制，覆盖 9 项检查：
    1) mb --version 退出码
    2) mb --version 输出程序名
    3) mb --version 输出版本行
    4) 批量分析退出码 0（quitonerror 语义）
    5) MCMC 分析完成（NEXUS 解析 + 似然计算 + 采样全链路）
    6) 非交互模式任务完成后自动退出
    7) sump 输出边缘似然汇总（Estimated marginal likelihoods）
    8) sump 输出树长参数（TL）
    9) stdin EOF 时干净退出（不挂起）
