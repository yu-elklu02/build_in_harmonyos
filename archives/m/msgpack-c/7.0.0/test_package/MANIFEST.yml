# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: msgpack-c/7.0.0
homepage: "https://msgpack.org/"

# Upstream test command
upstream_check_command: "ctest -N"

# conanfile.py build() method integrates upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from test/ directory, requires GTest)
upstream_tests:
  - file: test/test.msgpackc.cpp
    source: msgpack-c-7.0.0/test/test.msgpackc.cpp
    description: "msgpack-c unit tests (requires GTest, not built in conan)"
    command: "ctest"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Pack and unpack [1, true, \"example\"] using msgpack-c API"
    command: "./test_msgpack-c"

# Approximate assertion count
assertion_count: 6
