software: moon-buggy
display: "moon-buggy"
description: "Drive some car across the moon - a simple character graphics game"
category: games
homepage: "https://www.seehuhn.de/programs/moon-buggy"
license: GPL-2.0-or-later OR GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用 autotools 构建系统（configure + make），依赖 ncurses 终端库"
    - "OHOS 需修复 configure 脚本 shebang (E165): #! /bin/sh -> #!/system/bin/sh"
    - "ncurses/6.4 通过 Conan 源码依赖提供静态库和头文件"
    - "include/lib 路径从 Conan 依赖包目录获取，不依赖系统预构建路径"
    - "交叉编译需指定 --host=aarch64-unknown-linux-ohos 和 --build=aarch64-unknown-linux-gnu"
    - "使用 --with-curses-libs 指定静态链接 ncurses（R26: 终端工具必须静态链接）"
    - "moon-buggy 是 CLI 游戏应用程序，package_info 中 libs=[]，bindirs=['bin']"
  common_dependencies:
    - ncurses

versions:
  "1.1.0":
    status: failed
    build_date: "2026-07-15"
