software: moon-buggy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/{version}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.seehuhn.de/programs/moon-buggy/moon-buggy-1.1.0.tar.gz"

  # 源码校验和
  sha256: "259ae6e7b1838c40532af5c0f20cd7c6173cd5c552ede408114064475bcfc5b6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
    - "--build=aarch64-unknown-linux-gnu"
    - "--with-curses-libs=<ncurses-package>/lib/lib<cpp_info-core-library>.a"
    - "--with-curses-header=<ncurses.h>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncurses/6.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "moon-buggy 1.1.0 使用 autotools 构建，依赖 ncurses 终端库"
  - "ncurses 通过已适配 OHOS 的 Conan 源码依赖 ncurses/6.5 构建，不提交预编译二进制"
  - "OHOS 适配需修复 configure 脚本 shebang (E165)"
  - "JV_CHECK_CURSES 宏默认检测 -lcurses/-lncurses，需用 --with-curses-libs 指定 Conan 导出的宽字符静态库"
  - "R26: 终端工具必须静态链接；实际库名从 ncurses cpp_info.libs 获取，兼容 libncursesw.a 和 libncursestw.a"
  - "include/lib 路径从 self.dependencies['ncurses'].cpp_info 获取"
  - "JV_CHECK_CURSES 宏用 AC_CHECK_HEADERS 检测 curses 头文件，依赖 CPPFLAGS；Conan AutotoolsToolchain 只把 -I 加到 CFLAGS 不加到 CPPFLAGS，导致检测失败"
  - "OHOS 系统只提供 ncurses.h（无 curses.h），需用 --with-curses-header=<ncurses.h> 跳过检测强制指定"
  - "HMDFS 不支持 GNU make jobserver FIFO，build 和 install 均需固定为 -j1"
  - "OHOS 打包使用 install-exec 并手动复制发行包 info 和构建生成的 man 文件，跳过无 makeinfo 环境无法生成的 Texinfo 规则；同时固定 -j1 避免 HMDFS jobserver FIFO"
