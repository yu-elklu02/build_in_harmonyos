# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mp3info/0.8.5a
homepage: "https://www.ibiblio.org/pub/linux/apps/sound/mp3-utils/mp3info/"

# 上游测试命令
upstream_check_command: "make check"

# 上游无测试套件 (Makefile 无 check 目标)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 mp3info -h 验证二进制可用"
    command: "mp3info -h"

# 测试断言总数
assertion_count: 1
