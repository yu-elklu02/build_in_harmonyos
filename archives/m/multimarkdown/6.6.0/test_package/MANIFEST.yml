# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: multimarkdown/6.6.0
homepage: "https://github.com/fletcher/MultiMarkdown-6"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --parallel 1"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/CuTest.c
    source: MultiMarkdown-6 6.6.0 release source
    description: "上游 CuTest C 单元测试（run_tests），通过 ctest 执行"
    command: "ctest --output-on-failure --parallel 1"
  - file: tests/MarkdownTest.pl
    source: MultiMarkdown-6 6.6.0 release source
    description: "上游 Perl 集成测试脚本，CMakeLists.txt 注册 11 个 ctest 用例 (mmd-6, mmd-6-compat, mmd-6-latex, mmd-6-beamer, mmd-6-memoir, mmd-6-fodt, mmd-6-opml, mmd-6-critic-accept, mmd-6-critic-reject, pathologic-compat, pathologic)"
    command: "ctest --output-on-failure --parallel 1"
  - file: tests/MMD6Tests/
    source: MultiMarkdown-6 6.6.0 release source
    description: "上游集成测试数据目录，包含 Abbreviations, Tables, Math, Metadata 等 60+ 测试用例"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libMultiMarkdown 并调用 mmd_string_convert 验证 Markdown 到 HTML 转换"
    command: "./test_multimarkdown"
  - file: conanfile.py
    description: "消费者测试: 执行 packaged multimarkdown CLI 验证 Markdown 到 HTML 转换和 --version"
    command: "multimarkdown sample.md"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
