software: multimarkdown
version: "6.6.0"
status: built
build_date: "2026-07-15"

source:
  url: "https://codeload.github.com/fletcher/MultiMarkdown-6/tar.gz/refs/tags/6.6.0"
  sha256: "6496b43c933d2f93ff6be80f5029d37e9576a5d5eacb90900e6b28c90405037f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DSHAREDBUILD=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

artifacts:
  binaries:
    - bin/multimarkdown
    - bin/mmd
    - bin/mmd2all
    - bin/mmd2epub
    - bin/mmd2fodt
    - bin/mmd2odt
    - bin/mmd2opml
    - bin/mmd2pdf
    - bin/mmd2tex
    - bin/markdown
  libraries:
    - lib/libMultiMarkdown.a
  headers:
    - include/libMultiMarkdown/libMultiMarkdown.h

knowledge_gained:
  - "E092: OHOS CMake path needs CMAKE_SYSTEM_NAME=Linux so upstream Linux install branch is enabled."
  - "E103: MultiMarkdown 6.6.0 CMakeLists.txt uses CMake 2.6 compatibility; CMake 4.x requires CMAKE_POLICY_VERSION_MINIMUM=3.5."
  - "The 6.6.0 release source registers CTest integration tests (CuTest + ADD_MMD_TEST), but upstream CMake add_definitions(-DTEST) leaks to all targets; Conan test_package uses real consumer API and CLI smoke tests."
