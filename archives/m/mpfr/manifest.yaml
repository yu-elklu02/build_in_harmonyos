versions:
  - version: "4.2.2.1"
    status: built
    build_date: "2026-08-12"
    notes: >-
      与 4.2.2 的差异只有一处：package() 里装完删掉 lib/*.la。
      conan 按 prefix=/ 构建，4.2.2 装出的 libmpfr.la 里 dependency_libs 被烤成
      '//lib/libgmp.la'（不存在），下游用 libtool 链接时报
      "cannot find the library '//lib/libgmp.la'"（linbox 1.7.0 实撞）。
      改 libtool 的 link_all_deplibs 挡不住，只能不装 .la。制品仓不支持同版本多
      revision(R37)，故按 .N 惯例新增；4.2.2 保持原样，现有下游不受影响。
      真机 make check 198/195pass/3skip/0fail，test_package 1/1 通过。
