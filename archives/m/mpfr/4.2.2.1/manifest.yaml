software: mpfr
version: "4.2.2.1"
status: built
build_date: "2026-08-12"

source:
  url: "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz"
  sha256: "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
  tar_format: tar.xz

build:
  build_system: autotools
  configure_options:
    - "--with-gmp-include=<gmp include dir>"
    - "--with-gmp-lib=<gmp lib dir>"
    - "--enable-shared/--disable-static or inverse from Conan options"
    - "--with-pic for static fPIC builds"
  post_install:
    - "删除 lib/*.la（4.2.2 未删，是下游 libtool 失败的根因）"
  dependencies:
    - gmp/6.3.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-tmpdir.patch"

knowledge_gained:
  - "MPFR 4.2.2 is an Autotools project with make check as upstream validation."
  - "The recipe consumes published gmp/6.3.0 through explicit GMP include/lib configure arguments."
  - "HarmonyOS requires direct linux-ohos recognition in config.guess/config.sub and TMPDIR-aware config.status temp directories."
  - "HarmonyOS user-storage ACLs reject config.status temporary files in 0700 directories under $HOME/tmp; 022 permissions are required for the generated awk machinery to be readable during configure."
  - "OHOS CMakeDeps test_package needs an explicit gmp/6.3.0 requirement and GMP include directories so mpfr.h can include gmp.h."
  - "4.2.2 保留了 libtool 的 lib/libmpfr.la；conan 按 prefix=/ 构建，其 dependency_libs 被烤成 '//lib/libgmp.la' 这个不存在的路径，下游用 libtool 链接时报 \"cannot find the library '//lib/libgmp.la'\"（linbox 1.7.0 实撞）。"
  - "把生成的 libtool 里 link_all_deplibs 改成 no 挡不住：libtool 是在解析 -lmpfr 命中的 .la 时就展开 dependency_libs，与该开关无关。唯一有效的是不装 .la。"

validation:
  ohos_device:
    date: "2026-08-12"
    result: pass
    exit_code: 0
    package_reference: "mpfr/4.2.2.1#23cc215862456de7649cb33dd9e78501"
    upstream_tests:
      command: "make check -j1"
      total: 198
      pass: 195
      skip: 3
      fail: 0
      error: 0
    test_package:
      ctest: "1/1 passed"
      executable_output: "MPFR 4.2.2 result: 42.0"
    packaged_lib_dir: "libmpfr.a + pkgconfig/（已确认无 .la）"

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
    guard: "HarmonyOS uname/config.guess only; skips Linux libc temp-file probe"
  - file: 0002-config.sub.patch
    type: portability
    platform_only: true
    guard: "linux-ohos triples only"
  - file: 0003-configure-tmpdir.patch
    type: portability
    platform_only: true
    guard: "TMPDIR fallback keeps default behavior when TMPDIR is unset; umask 022 avoids OHOS user-storage ACL denial for config.status awk files"
