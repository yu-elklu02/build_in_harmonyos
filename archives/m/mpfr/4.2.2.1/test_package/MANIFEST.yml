package: mpfr/4.2.2.1
homepage: "https://www.mpfr.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: tests/tadd.c
    source: mpfr-4.2.2/tests/tadd.c
    description: "MPFR addition and rounding validation"
    command: "make check"
  - file: tests/tmul.c
    source: mpfr-4.2.2/tests/tmul.c
    description: "MPFR multiplication validation"
    command: "make check"
  - file: tests/tconst_pi.c
    source: mpfr-4.2.2/tests/tconst_pi.c
    description: "MPFR pi constant validation"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Initializes an MPFR value, performs exact multiplication, and verifies the result"
    command: "ctest --output-on-failure"

assertion_count: 4
