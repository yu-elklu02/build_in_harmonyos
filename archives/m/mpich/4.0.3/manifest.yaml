software: mpich
version: "4.0.3"
status: built
build_date: "2026-07-26"
issue: "#1693"

source:
  url: "https://www.mpich.org/static/downloads/4.0.3/mpich-4.0.3.tar.gz"
  sha256: "17406ea90a6ed4ecd5be39c9ddcbfac9343e6ab4f77ac4e8c5ebe4a3e3b6c501"
  tar_format: tar.gz

build:
  system: autotools
  target: "OHOS/aarch64"
  configuration:
    - "--disable-fortran"
    - "--disable-cxx"
    - "--disable-romio"
    - "--with-device=ch3:sock"
    - "--with-pm=gforker"
    - "--with-pmi=simple"
    - "--with-hwloc=no"
    - "--with-wrapper-dl-type=none"
  dependencies:
    - "perl/5.42.2 (tool_requires, configure-time generator)"

test_package:
  type: "C MPI smoke"
  requires_runtime: true
  commands:
    - "mpicc test.c -o test_mpi"
    - "mpiexec -n 2 ./test_mpi"

known_limits:
  - "Selected upstream test/mpi suite was run on device; result was 1896/1958 passed with 19 skipped and 62 known failures."
  - "Known upstream failures on OHOS include partitioned communication crashes, two datatype byte-value mismatches, and name publish/lookup/unpublish spawn timeouts."
  - "The recipe chooses ch3:sock + gforker to provide a minimal local MPI dependency for hdf5-mpi/pnetcdf."
  - "Perl is required by upstream configure; CI must provide or locally export perl/5.42.2 before mpich configure can complete."

