  - cmake旧版本兼容性问题：使用CMAKE_POLICY_VERSION_MINIMUM参数
  - GKLIB_PATH需设置为绝对路径解决try_compile路径问题
  - R33: conanfile.py中使用self.source_folder替代shell变量$BUILD_SRC_DIR
  - R34: test_package需调用metis API（METIS_PartGraphRecursive）而非空壳测试
configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DGKLIB_PATH=<source_folder>/GKlib"
