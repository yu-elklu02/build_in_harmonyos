version: "2.6.8"
upstream_version: "2.6.8"
status: built
build_date: "2026-07-31"

source:
  url: "https://downloads.sourceforge.net/project/mcrypt/MCrypt/2.6.8/mcrypt-2.6.8.tar.gz"
  sha256: "5145aa844e54cca89ddab6fb7dd9e5952811d8d787c4f4bf27eb261e6c182098"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--disable-rpath"
    - "--enable-static-link"
  dependencies:
    - libmcrypt
    - mhash
    - zlib
  outputs:
    - "bin/mcrypt"
    - "bin/mdecrypt"

patches_applied:
  - "0001-restore-package-version-macros.patch"
  - "0002-ohos-triplet-and-file-mode-io.patch"
  - "0003-ohos-configure-temp-umask.patch"

knowledge_gained:
  - "Upstream uses Autotools and checks for libmcrypt-config plus mhash/zlib during configure."
  - "mcrypt depends on libmcrypt/2.5.8, mhash/0.9.9.9, and zlib/1.3.1; all three must be available in the same Conan cache before mcrypt can resolve."
  - "Old GNU config scripts need an OHOS recognition hook before true-device build."
  - "OHOS Autotools configure must be invoked through the job-local shell and supplied with LLVM AR/RANLIB/NM/LD/STRIP."
  - "OHOS setgid build directories require configure temporary directories to be group-accessible; patch 0003 relaxes Autoconf's local temp umask from 077 to 022."
  - "OHOS LIBMCRYPT_CONFIG is invoked through /bin/sh with --prefix=<libmcrypt package> to avoid direct execution permission issues."
  - "OHOS /dev/random and /dev/urandom support is detected by upstream configure; the recipe no longer edits generated config.h."
  - "File-path encryption/decryption is covered with an unambiguous file-before-key CLI order because upstream -k accepts a variable-length key list."
  - "Patch 0002 removes upstream's undefined fflush(FROMF) calls on read-only input streams in file-mode close paths."

