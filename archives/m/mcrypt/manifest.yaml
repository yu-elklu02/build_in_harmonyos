software: mcrypt
display: "mcrypt"
description: "Command-line file encryption utility using libmcrypt"
category: security
homepage: "https://mcrypt.sourceforge.net/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools project; the recipe declares libmcrypt, mhash, and zlib requirements and injects dependency include/lib paths."
    - "Old config.guess/config.sub scripts are patched through conandata-managed patch files for OHOS triplet recognition."
    - "OHOS config.status temporary-directory permissions are fixed through a formal conandata-managed patch."
    - "The binary is statically linked where the target toolchain and dependencies allow it."
    - "New-port OHOS validation passes once zlib, mhash, and libmcrypt are present in the same Conan cache."
    - "test_package verifies mcrypt --version, stdin/stdout encryption/decryption, and file-path encryption/decryption roundtrips."
  common_dependencies:
    - libmcrypt
    - mhash
    - zlib

versions:
  "2.6.8":
    status: built
    build_date: "2026-07-31"
    conan_ref: "mcrypt/2.6.8"
