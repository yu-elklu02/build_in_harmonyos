package: mdf2iso/0.3.1
homepage: "https://www.nongnu.org/mdf2iso/"

upstream_check_command: "run upstream MDF/MDS fixture conversions in conanfile.py build()"
upstream_test_in_build: true
upstream_test_command: "mdf2iso test/TEST.mdf and test/TEST2.mdf, then verify generated ISO sizes"
upstream_tests:
  - file: "test/TEST.mdf"
    paired_file: "test/TEST.mds"
    description: "Upstream MDF/MDS conversion fixture; converted output must be 370688 bytes"
    command: "mdf2iso test/TEST.mdf <build_folder>/upstream-test/TEST.iso"
  - file: "test/TEST2.mdf"
    paired_file: "test/TEST2.mds"
    description: "Upstream MDF/MDS conversion fixture; converted output must be 370688 bytes"
    command: "mdf2iso test/TEST2.mdf <build_folder>/upstream-test/TEST2.iso"

test_package_tests:
  - file: "test_mdf2iso.py"
    description: "Execute mdf2iso --help and verify version plus cue/toc mode output"
    command: "python3 test_mdf2iso.py <mdf2iso_bin>"
  - file: "test_mdf2iso.py"
    description: "Generate a valid MDF sector, convert it, and verify the ISO payload byte-for-byte"
    command: "python3 test_mdf2iso.py <mdf2iso_bin>"

assertion_count: 11
