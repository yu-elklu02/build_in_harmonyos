software: mdf2iso
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.1"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（顶层字段，用于 G4 门禁检查）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.gnu.org/releases/mdf2iso/mdf2iso-0.3.1.tar.gz"

  # 源码校验和
  sha256: "906f0583cb3d36c4d862da23837eebaaaa74033c6b0b6961f2475b946a71feb7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--host=aarch64-linux-ohos"
    - "LDFLAGS=-fuse-ld=bfd"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"
  #
  # ⚠️ 注意：使用 --host 参数违反 E064 规则，但对于简单 autotools 软件（无 gnulib）
  #    可以作为 fallback 方案使用，避免 conftest 执行问题

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-umask.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

test_passed: 4
test_failed: 0
test_skipped: 0

test_results:
  upstream_passed: 2
  upstream_failed: 0
  upstream_skipped: 0
  test_package_passed: 2
  test_package_failed: 0
  assertion_count: 11

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS SDK 的 lld 链接器依赖 libxml2.so.16，需要使用 GNU ld (-fuse-ld=bfd)"
  - "configure 的临时文件创建需要 umask 022（E011 HMDFS 权限问题）"
  - "简单 autotools 软件（无 gnulib）可能可用 --host 绕过 conftest 执行（E064 fallback）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
