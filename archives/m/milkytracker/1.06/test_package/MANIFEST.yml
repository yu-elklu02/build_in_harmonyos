# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: milkytracker/1.06
homepage: "https://milkytracker.titandemo.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 CMake 项目未注册任何 ctest 测试（无 enable_testing / add_test）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# MilkyTracker 上游无自动化测试套件；资源包内置示例曲目（resources/music/*.xm），
# 由 milkycli 命令行工具导出 WAV 作为功能验证
upstream_tests:
  - file: resources/music/milky.xm
    source: milkytracker-1.06/resources/music/milky.xm
    description: "示例曲目（XM 模块），作为 milkycli WAV 导出测试输入"
    command: "milkycli -output out.wav milky.xm"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 milkycli 将包内示例 .xm 导出为 WAV，校验退出码与产物大小"
    command: "milkycli -output export.wav share/milkytracker/songs/milky.xm"

# 测试断言总数 (近似值, 用于质量评估)
# 断言：milkycli/milkytracker 二进制存在（2）、示例曲目存在（1）、导出 WAV 存在（1）、WAV > 44 字节（1）
assertion_count: 5
