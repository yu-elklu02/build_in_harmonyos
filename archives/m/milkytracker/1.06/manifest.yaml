# 版本级 manifest — milkytracker 1.06
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.06"
software: milkytracker

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（提交前已切换为官方 GitHub release tarball）
  url: "https://github.com/milkytracker/MilkyTracker/archive/refs/tags/v1.06.tar.gz"
  # 校验和（FreeBSD distinfo 同值）
  sha256: "6e70590dfed324e6d6ac813e33d9f9dcfaa13b2f57fdec9e178e9dda05538cb0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl2/2.30.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists-cmp0004-cmake4-compat.patch"
  - "0002-Synths-cpp-cxx11-narrowing.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 不再允许 cmake_policy(SET CMP0004 OLD)，需加版本守卫"
  - "CMake 不识别 HarmonyOS 平台时，用 CMAKE_SYSTEM_NAME=Linux 兼容（E092 方案）"
  - "clang15 C++11 严格模式对三元表达式 narrowing 报错，需显式强转"
  - "sdl2 conan 包头文件在 include/SDL2/，消费方需重写 cmake_file_name/target 并补 include/SDL2 目录"
  - "OHOS ELF 可执行文件必须签名，否则运行报 Operation not permitted"
