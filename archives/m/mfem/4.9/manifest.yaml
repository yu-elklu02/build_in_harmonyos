  sha256: "ea3ac13e182c09f05b414b03a9bef7a4da99d45d67ee409112b8f11058447a7c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=17"
