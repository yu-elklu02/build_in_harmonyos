    - "-DMFEM_USE_LAPACK=NO"
    - "-DMFEM_USE_OPENMP=NO"
    - "-DMFEM_USE_CUDA=NO"
    - "-DMFEM_USE_HIP=NO"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "MFEM 4.9 使用 CMake 构建，串行模式零依赖，可直接编译"
  - "CMake 不认识 HarmonyOS 平台 (E092)，需用 -DCMAKE_SYSTEM_NAME=Linux 绕过"
  - "test_package 需用 C++ 测试文件且实质调用 MFEM API (R34)"
