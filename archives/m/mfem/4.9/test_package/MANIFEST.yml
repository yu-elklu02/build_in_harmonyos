# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: mfem/4.9
homepage: ""

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target tests && cmake --build . --target examples && cmake --build . --target miniapps && ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: "tests/unit/unit_test_main.cpp"
    source: "mfem-4.9/tests/unit/unit_test_main.cpp"
    description: "MFEM 上游 CTest 套件（99 个串行用例）"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试"
    command: "./test_mfem"

# 测试断言总数：MFEM 上游 Catch2/专项测试的断言数量未单独统计
assertion_count: 0
