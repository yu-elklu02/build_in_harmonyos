package: minizign/0.1.13
homepage: "https://github.com/jedisct1/zig-minisign"

upstream_check_command: "zig build test -Doptimize=ReleaseSmall"
upstream_test_in_build: true
upstream_test_command: "zig build test -Doptimize=ReleaseSmall"

upstream_tests:
  - name: "Zig unit tests"
    command: "zig build test -Doptimize=ReleaseSmall"
    integrated: true
  - name: "Minisign compatibility script"
    command: "test_compatibility.sh"
    integrated: false
    reason: "Requires a separately installed minisign binary; defer to full OHOS/shadow CI after minisign availability is confirmed."

test_package_tests:
  - file: test_minizign.py
    description: "Runs minizign --version and asserts version 0.1.13."
    command: "python test_minizign.py <minizign> <workdir>"
  - file: test_minizign.py
    description: "Generates an unencrypted key pair with minizign -G."
    command: "python test_minizign.py <minizign> <workdir>"
  - file: test_minizign.py
    description: "Signs a test message with minizign -S."
    command: "python test_minizign.py <minizign> <workdir>"
  - file: test_minizign.py
    description: "Verifies the generated signature with minizign -V."
    command: "python test_minizign.py <minizign> <workdir>"

assertion_count: 4
