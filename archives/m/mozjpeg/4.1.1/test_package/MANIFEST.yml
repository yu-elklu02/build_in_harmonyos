# Upstream test declaration required by the CI L0e quality gate.
package: mozjpeg/4.1.1
homepage: https://github.com/mozilla/mozjpeg

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - source: "mozjpeg 4.1.1 CTest suite"
    description: "108 upstream CTest cases covering JPEG codec APIs, command-line encode/decode, image comparison, and benchmarking."
    command: "ctest --output-on-failure"
    count: 108

test_package_tests:
  - file: test.c
    description: "Encode and decode a one-pixel JPEG through the packaged libjpeg API."
    command: "./mozjpeg_functional_test"
    assertions:
      - "JPEG output is larger than the SOI marker"
      - "JPEG output starts with the SOI marker"
      - "Decoder accepts the encoded stream"
      - "Decoded image width is one pixel"
      - "Decoded image height is one pixel"

assertion_count: 5
