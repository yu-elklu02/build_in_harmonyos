version: "4.1.1"
status: adapting
build_system: cmake

source:
  url: "https://github.com/mozilla/mozjpeg/archive/refs/tags/v4.1.1.tar.gz"
  sha256: "66b1b8d6b55d263f35f27f55acaaa3234df2a401232de99b6d099e2bb0a9d196"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "ENABLE_SHARED=<shared option>"
    - "ENABLE_STATIC=ON"
    - "PNG_SUPPORTED=ON"
    - "WITH_SIMD=OFF"
    - "WITH_JAVA=OFF"
  dependencies:
    - "zlib/1.3.1.1"
    - "libpng/1.6.58"

test:
  upstream_test_in_build: true
  upstream_test_command: "ctest --output-on-failure"
  upstream_test_cases: "Recorded from the completed device validation log."
  package_test: "encode and decode a one-pixel in-memory JPEG"
  assertions: 5
