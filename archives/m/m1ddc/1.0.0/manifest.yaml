patches_applied:
  - file: "patches/0001-portable-nonapple.patch"
    description: "把 m1ddc.m 拆为 #ifdef __APPLE__（原版）+ 可移植 C 实现：保留原 CLI/帮助文本/VCP 码表；无 Apple IOAVService I2C 传输层时如实报告 no suitable external display（与上游无显示器行为一致）"
    type: portability

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "m1ddc 1.0.0 是单文件 Objective-C 命令行工具（m1ddc.m），Makefile 仅一条 `clang -fmodules -o m1ddc m1ddc.m` 命令"
  - "上游依赖 macOS 私有框架（IOKit/Foundation/IOAVService），Apple Silicon 专用，OHOS clang 无 Darwin 模块（真机日志：module 'Darwin' not found），必须补丁移植"
  - "移植方案：`#ifdef __APPLE__` 双路径——原版保留在 Apple 分支，非 Apple 平台用可移植 C 复刻 CLI/帮助文本/VCP 码表，无传输层时如实报告无显示器；conanfile.py 必须先调用 apply_conan_data_patches 才能让补丁生效"
  - "上游无任何测试：归档仅 4 文件（LICENSE/Makefile/README.md/m1ddc.m），无测试框架/目录/make check 目标"
