# 软件级 manifest — m1ddc
# 遵循 ARCHIVE-SPEC v3.0

software: m1ddc
display: "m1ddc"
description: "通过 DDC/CI 控制外接显示器亮度、对比度、音量与输入的命令行工具"
category: utility
homepage: "https://github.com/waydabber/m1ddc"
license: MIT
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "单文件 Objective-C 命令行工具（m1ddc.m），Makefile 仅一条 `clang -fmodules -o m1ddc m1ddc.m`"
    - "上游依赖 macOS 私有框架（IOKit/Foundation/IOAVService），Apple Silicon 专属，OHOS 无等价公共 API；已用 0001-portable-nonapple.patch 双路径移植（__APPLE__ 保留原版 + 可移植 C 实现），无传输层时如实报告无显示器"
    - "上游无测试套件：v1.0.0 归档仅 LICENSE/Makefile/README.md/m1ddc.m 四文件"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.0":
    status: built
    build_date: "2026-08-14"
