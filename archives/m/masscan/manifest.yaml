software: masscan
display: "Masscan"
description: "The fastest internet port scanner"
category: network
homepage: "https://github.com/robertdavidgraham/masscan"
license: AGPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "sockaddr_storage redefinition conflict between linux/socket.h and sys/socket.h on OHOS"
    - "getservbyport_r (GNU extension) not available on OHOS, needs condition guard"
    - "pthread_setaffinity_np (GNU extension) not available on OHOS, needs condition guard"
    - "Makefile install command uses 'install' which is not available on OHOS, replaced with mkdir+cp"
  common_dependencies: []

versions:
  "1.3.9":
    status: built
    build_date: "2026-07-15"
    conan_ref: "masscan/1.3.9"
