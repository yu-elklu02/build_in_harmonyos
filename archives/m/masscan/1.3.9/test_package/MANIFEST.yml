# test_package/MANIFEST.yml
package: masscan/1.3.9
homepage: "https://github.com/robertdavidgraham/masscan"

# masscan has no formal test suite; the Makefile has no `check` target
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# masscan is a command-line tool with no library API
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Build test binary (smoke build test)"
    command: "./test_masscan"
  - description: "Run masscan --version to verify binary"
    command: "masscan --version"
    type: "runtime"

assertion_count: 2
