software: mpack-msgpack

# 版本级 manifest
# 文件位置: archives/m/mpack-msgpack/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ludocode/mpack/archive/refs/tags/v1.1.1.tar.gz"

  # 源码校验和
  sha256: "7e8dfc95266ac3e1a1a87383c01eb3bf66a61ae06374cf040b3383644bc8d2e6"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "MPack 源码包不包含构建库的 CMakeLists.txt（仅测试用），需在 conanfile.py build() 中生成"
  - "使用 Conan CMakeToolchain 自动处理 OHOS 交叉编译，无需手动设置 CC/CXX 环境变量（R33）"
  - "MPack 无外部依赖，纯 C 库，交叉编译友好"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
