# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mpack-msgpack/1.1.1
homepage: "https://github.com/ludocode/mpack"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "tools/unit.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/unit/src/test.c
    source: mpack-1.1.1/test/unit/src/test.c
    description: "MPack unit test suite (requires Python 3 + Ninja, not built in CI)"
    command: "tools/unit.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: MessagePack 编码 + 解码往返验证 (compact/schema)"
    command: "./test_mpack"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
