# conandata.yml — zabbix 7.4.5
#
# 源码使用官方 GitHub 源码归档（含 tests/），精确对应 tag 7.4.5。
# GitHub archive 不含预生成的 configure，需在 build() 中通过 bootstrap.sh 自举生成。

sources:
  url: "https://github.com/zabbix/zabbix/archive/refs/tags/7.4.5.tar.gz"
  sha256: "de9ed613745a40314a2e7c69e67275c4f97be9a3ad8eeb3e356582aca197221e"

patches:
  - patch_file: "patches/0001-resolver-capability-detection.patch"
    patch_description: "Detect complete resolver API (thread-safe res_ninit+res_nsend or thread-unsafe _res+res_init+res_send) in m4/resolv.m4; disable HAVE_RES_QUERY on platforms with incomplete resolver API"
    patch_type: "portability"
  - patch_file: "patches/0002-cmocka-2.x-cm_print_error-compat.patch"
    patch_description: "Remove local cm_print_error forward declaration in test mocks; cmocka 2.x defines cm_print_error as a deprecated macro, which clashes with the declaration"
    patch_type: "portability"
  - patch_file: "patches/0003-zbxcommon-cmocka-cflags.patch"
    patch_description: "Add CMOCKA_CFLAGS/YAML_CFLAGS to tests/libs/zbxcommon COMMON_COMPILER_FLAGS so cmocka.h/yaml.h are found when cmocka/libyaml are not in system include paths"
    patch_type: "portability"
  - patch_file: "patches/0004-mock-data-yaml-ldflags.patch"
    patch_description: "Add CMOCKA_LDFLAGS/YAML_LDFLAGS to MOCK_DATA_DEPS in tests/libs/Makefile.include so -lcmocka/-lyaml link when the libraries are not in system lib paths"
    patch_type: "portability"
  - patch_file: "patches/0005-wrap-calloc-realloc-real.patch"
    patch_description: "Make __wrap_calloc/__wrap_realloc call __real_calloc/__real_realloc outside the test path, so statically-linked cmocka's internal calloc/realloc are not hijacked (fixes SIGSEGV in zbx_calloc/zbx_realloc tests)"
    patch_type: "portability"
  - patch_file: "patches/0006-zbxtypes-lp64-format.patch"
    patch_description: "Detect LP64 via __LP64__ in zbxtypes.h 64-bit format macros; musl/OHOS lacks __WORDSIZE, which made ZBX_FS_UI64 fall back to %llu and mismatch uint64_t (unsigned long)"
    patch_type: "portability"
  - patch_file: "patches/0007-pthread-process-shared-mmap.patch"
    patch_description: "Enable HAVE_PTHREAD_PROCESS_SHARED for cross-compile (m4/pthread.m4), move LIBPTHREAD_CHECK_CONFIG out of the server/proxy-only block in configure.ac, and replace SysV shmget/shmat/shctl with MAP_SHARED anonymous mmap in zbx_locks_create/destroy; OHOS blocks SysV IPC (shmget EACCES, semget SIGSYS) but supports PTHREAD_PROCESS_SHARED"
    patch_type: "portability"
  - patch_file: "patches/0008-shm-mmap.patch"
    patch_description: "Replace SysV shmget/shmat/shctl with MAP_SHARED anonymous mmap in zbx_shm_create/zbx_shm_destroy (src/libs/zbxnix/ipc.c); change return type int shmid to void* base with a size header"
    patch_type: "portability"
  - patch_file: "patches/0009-stats-shm-mmap.patch"
    patch_description: "Adapt stats.c/stats.h collector and diskstat shared memory to the mmap-based zbx_shm_create (drop shmat/shmdt/shmctl, compare base pointers instead of shmid)"
    patch_type: "portability"
  - patch_file: "patches/0010-dshm-mmap.patch"
    patch_description: "Adapt zbxnix.h zbx_dshm_t/zbx_dshm_ref_t and dshm.c dynamic shared memory to the mmap-based zbx_shm_create (shmid field replaced by addr pointer)"
    patch_type: "portability"
  - patch_file: "patches/0011-procstat-shm-mmap.patch"
    patch_description: "Adapt procstat.c to the mmap-based dshm (procstat.shmid replaced by procstat.addr, drop procstat_ref.shmid)"
    patch_type: "portability"
  - patch_file: "patches/0012-dummy-module-cc.patch"
    patch_description: "Use $(CC) $(CFLAGS) instead of hardcoded cc in src/modules/dummy/Makefile so the dummy test module builds on OHOS where there is no cc symlink"
    patch_type: "portability"
  - patch_file: "patches/0013-iconv-charset-normalize.patch"
    patch_description: "Normalize HTML charset artifacts (surrounding double quotes, trailing backslash) before iconv_open in zbx_convert_to_utf8; musl iconv rejects them with EINVAL while glibc tolerates them, causing NULL returns and SIGSEGV in callers"
    patch_type: "portability"
  - patch_file: "patches/0014-shm-named-posix.patch"
    patch_description: "Add POSIX named shared memory primitives (zbx_shm_create_named/attach_named/destroy_named via shm_open+ftruncate+mmap) so fork-late, resizable shared segments can be re-mapped by other processes"
    patch_type: "portability"
  - patch_file: "patches/0015-stats-diskstat-named-shm.patch"
    patch_description: "Switch diskstat shared memory from a process-local mmap address to a named shm_open segment so collector/listener can reattach after extension"
    patch_type: "portability"
  - patch_file: "patches/0016-dshm-named-shm.patch"
    patch_description: "Switch zbx_dshm_t/zbx_dshm_ref_t (procstat) to carry a shm_open name as the cross-process identifier so realloc/validate_ref re-map correctly"
    patch_type: "portability"
