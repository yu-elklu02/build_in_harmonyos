software: zimg
version: 3.0.6
status: built
build_system: manual
source:
  url: https://github.com/sekrit-twc/zimg/archive/refs/tags/release-3.0.6.tar.gz
  sha256: be89390f13a5c9b2388ce0f44a5e89364a20c1c57ce46d382b1fcc3967057577
dependencies: []
configure_options:
  - direct clang++ build of src/zimg
artifacts:
  headers:
    - include/zimg.h
    - include/zimg++.hpp
  libraries:
    - lib/libzimg.so
  pkg_config:
    - lib/pkgconfig/zimg.pc
known_issues:
  - "Remote W0 query on this workstation returned 'system acceleration policy not enabled'; verify zimg/3.0.6 publication state from an enabled environment."
notes: |
  Issue: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/1459
  Upstream release ships Autotools inputs only, but the OHOS CI image lacks autoreconf.
  The recipe therefore compiles src/zimg directly with clang++ and packages the public C/C++ headers, shared library, and pkg-config file.
  test_package manually compiles a consumer and constructs a real zimg filter graph through the C API.
