software: zstd
version: "1.5.7"
build_system: cmake
status: built            # 真机 conan create + test_package 已过（2026-07-11, PC 2in1, SDK 26.0.0.18）
source:
  url: "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
  sha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
build:
  system: cmake
  src_subdir: build/cmake
  toolchain: "自发现 ohos.toolchain.cmake + 裸 cmake（绕开 conan_toolchain，同 glfw/libjpeg-turbo）"
  cmake_options:
    - "CMAKE_INSTALL_LIBDIR=lib"
    - "ZSTD_BUILD_SHARED=ON"
    - "ZSTD_BUILD_STATIC=OFF"
    - "ZSTD_BUILD_PROGRAMS=OFF"
    - "ZSTD_BUILD_TESTS=OFF"
    - "OHOS_ARCH=arm64-v8a"
  cc: clang
  sign_so: true
libs:
  - zstd          # libzstd.so (SONAME libzstd.so.1)
requires: []      # zstd 核心无外部依赖
verified:
  device: "HarmonyOS PC 2in1 (3QC0124C11000718), ohos-sdk 26.0.0.18"
  date: "2026-07-11"
  evidence: "裸 conan create rc=0；test dlopen libzstd.so ok；SONAME=libzstd.so.1；DT_NEEDED 仅 libc.so"
knowledge_gained:
  - "作为 libtiff 的 Zstd codec 依赖适配"
  - "CMakeLists 在 build/cmake 子目录（-S <source>/build/cmake）"
  - "cmake 库沿用 glfw 式自发现 toolchain + 裸 cmake + CMAKE_INSTALL_LIBDIR=lib + sign-so"
  - "musl 无 GNU qsort_r：cover.c/zstd_deps.h 的 _GNU_SOURCE 守卫加 !defined(__OHOS__)，走 C90 fallback（同 __ANDROID__）"
