package: zstd/1.5.7.1
upstream_test_in_build: false
# 上游 facebook/zstd v1.5.7（tag v1.5.7）tests/ 目录实测扫描（GitHub Tree API 递归枚举）：
# 合计 222 个测试文件 = 48 个 .c 测试程序 + 68 个 .sh 脚本 + 8 个 .py 脚本 + 98 个数据/配置/README。
# 本 Conan 配方在 build() 中用 -DZSTD_BUILD_TESTS=OFF 显式跳过上游 CMake 测试目标的构建，
# 因此上游测试套件未在 OHOS 制品构建流程内编译或执行（upstream_test_in_build: false）。
# 上游测试用例通过率：0/222（0%）— 跳过原因逐组见下。
upstream_tests:
  - group: "tests/ 根目录 (16 .c + playTests.sh + Makefile + 6 .py = 32 files)"
    status: "not_run"
    reason: "ZSTD_BUILD_TESTS=OFF 跳过 CMake 测试目标构建；且 playTests.sh/Makefile 依赖 /bin/sh（OHOS 无），fuzzer.c/paramgrill.c/zstreamtest.c 为长时间模糊/穷举测试超出 CI maxTime"
  - group: "tests/cli-tests/ (12 subdirs: basic/compression/decompress/dict-builder/dictionaries/file-handling/progress/determinism/cltools/common/zstd-symlinks, 102 files incl 45 .sh)"
    status: "not_run"
    reason: "CLI 端到端往返测试，run.py 驱动 45 个 .sh 脚本，依赖 /bin/sh + GNU diff/sed/grep，OHOS 无 /bin/sh（R1 铁律）"
  - group: "tests/fuzz/ (26 .c fuzz harness + 5 .h + Makefile + README = 37 files)"
    status: "not_run"
    reason: "OSS-Fuzz 专用 fuzz 套件，需 libFuzzer/AFL 运行时与长时间语料注入，OHOS CI 无对应基础设施"
  - group: "tests/golden-compression / golden-decompression / golden-decompression-errors / golden-dictionaries (4 golden data dirs)"
    status: "not_run"
    reason: "黄金样本回归由 zstreamtest 消费，ZSTD_BUILD_TESTS=OFF 未构建 zstreamtest；样本数据为 x86/glibc 环境录制"
  - group: "tests/regression/ (5 .c + 5 .h + methods.csv + config = 14 files)"
    status: "not_run"
    reason: "回归测试集依赖 playTests.sh 与 make test/check 入口，OHOS 无 /bin/sh 且 Make 生成器 link.txt 执行失败"
  - group: "tests/gzip/ (20 .sh gzip 互操作测试 + 3 cfg/other = 23 files)"
    status: "not_run"
    reason: "gzip 兼容性脚本依赖 /bin/sh 与系统 gzip 二进制，OHOS 无 /bin/sh"
test_package_tests:
  - file: test.c
    description: "dlopen libzstd.so + dlsym ZSTD_versionNumber/ZSTD_compress 验证导出符号与版本号"
    command: "./test_probe"
assertion_count: 2
