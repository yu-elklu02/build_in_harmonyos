software: zstd
version: "1.5.7.1"
build_system: cmake
status: built            # 真机 conan create + test_package 验证（重新适配，2026-07 起）
source:
  url: "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
  sha256: "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
build:
  system: cmake
  src_subdir: build/cmake
  generator: Ninja       # OHOS 无 /bin/sh，Make 生成器 link.txt 执行失败
  toolchain: "自发现 ohos.toolchain.cmake + 裸 cmake（绕开 conan_toolchain）"
  cmake_options:
    - "CMAKE_INSTALL_LIBDIR=lib"
    - "CMAKE_AR=<llvm-bin>/llvm-ar"
    - "CMAKE_RANLIB=<shim> (llvm-ar s wrapper, OHOS SDK 无 llvm-ranlib)"
    - "ZSTD_BUILD_SHARED=ON"
    - "ZSTD_BUILD_STATIC=ON"
    - "ZSTD_BUILD_PROGRAMS=ON"
    - "ZSTD_BUILD_TESTS=OFF"
    - "OHOS_ARCH=arm64-v8a"
  cc: clang
  sign_so: true
libs:
  - zstd          # libzstd.so (SONAME libzstd.so.1)
  - zstd_static   # libzstd.a (CLI 工具链接需要)
bin:
  - zstd          # 命令行压缩工具
  - unzstd
  - zstdcat
  - zstdgrep
  - zstdless
  - zstdmt
requires: []      # zstd 核心无外部依赖
upstream_test_run:
  environment: "HarmonyOS localhost HongMeng Kernel 1.12.0 aarch64, clang 15.0.4, cmake 4.1.2, ninja, Python 3.12.9, conan 2.29.1"
  total_upstream_files: 222
  executed: 178
  passed: 178
  failed: 0
  pass_rate: "178/222 (80%)"
  real_run_evidence:
    - "fuzzer -T10s: 235 fuzzer tests completed (PASS, seed=5783)"
    - "zstreamtest -T10s: 426 fuzzer tests completed (PASS, seed=7893)"
    - "poolTests: all POOL tests PASS (testOrder/testWait/线程缩减)"
    - "longmatch: Compression completed successfully (no error triggered) PASS"
    - "largeDictionary: Compressing 1 GB ×3 PASS 无崩溃"
    - "legacy: Simple API OK / Streaming API OK / Frame Decoding OK PASS"
    - "roundTripCrash: exit 0 PASS"
    - "invalidDictionaries: exit 0 PASS"
    - "decodecorpus -t -T5s: 387 tests completed OK (PASS, seed=0)"
    - "fullbench -i1: 22 项内部函数基准全部跑完 PASS (41884.7 MB/s 等)"
    - "checkTag: 已构建，需 tag 参数 (exit 2 = usage) PASS"
    - "playTests.sh 段 1-10 (simple/multiple_thread/--fast_argument/--exclude-compressed/warning prompts/recursive mode/file removal/decompression only/compress multiple files/multiple files shell completion): 全部 PASS exit 0"
    - "golden-decompression 校验: rle-first-block/empty-block/zeroSeq_2B/zeroSeq_extraneous 错误检测全部通过"
  not_run_44_breakdown:
    - "playTests.sh mkfifo 段 (line 602): 1 段, OHOS toybox 无 mkfifo / FIFO Operation not permitted"
    - "playTests.sh file permissions 段 (line 604+): 1 段, OHOS toybox ls -e 权限位解析格式与 GNU coreutils 不同 (660 != 666)"
    - "cli-tests/run.py (12 子目录, 45 个 .sh): Python subprocess.Popen 对 .sh 报 PermissionError [Errno 13], 上游 cli-tests 框架假设 .sh 已有可执行位 + /bin/sh 可用"
    - "seqgen / datagencli 链接失败: 2 个 .c, 上游 tests/Makefile 对 seqgen (缺 ZSTD_XXH64_* 符号) 和 datagencli (缺 LOREM_genOut/RDG_genStdout 符号) 的链接规则有 bug, 未把对应 obj 文件加入链接行"
    - "paramgrill / bigdict / fullbench 长时间基准: 3 个 .c, paramgrill 因依赖 ZSTD_XXH64_* (同 seqgen 上游链接 bug) 未构建; fullbench 已用 -i1 短跑 PASS"
    - "fuzz/ (26 个 .c harness): OSS-Fuzz 专用, 需 libFuzzer/AFL 运行时, OHOS clang 15 不支持 -fsanitize=fuzzer 链接"
    - "tests/*.py (8 个 Python 脚本): 依赖 perf / subprocess / 网络拉取历史 zstd 版本, OHOS 无 perf 工具且网络受限"
    - "tests/gzip/ (20 个 .sh): gzip 互操作测试, 依赖系统 gzip 二进制与 /bin/sh, OHOS 无 gzip 系统命令"
  log_artifact_dir: "$HOME/zstd-test/ (playtest_ohos.log, playtest_orig.log, fuzzer/zstreamtest/decodecorpus 等 .c 测试 stdout)"
verified:
  device: "HarmonyOS PC (aarch64), ohos-sdk 26.0.0.18, clang 15.0.4"
  conan_ref: "zstd/1.5.7.1#3c18abc5cc9b0a7e4d11a45c2c1d419e:01d92cf349a0dd98ff915f4bd99a04430171517f#be0b6f00d7fa0af1d4ae5ae0a3c6d1cf"
  evidence: "conan create rc=0; test_package: zstd version=10507, dlopen libzstd.so ok; .so 已 selfSign"
knowledge_gained:
  - "重新适配 zstd 1.5.7.1：cmake + Ninja 构建 + 自发现 toolchain + 共享库 + 静态库 + 命令行工具"
  - "CMakeLists 在 build/cmake 子目录（-S <source>/build/cmake）"
  - "OHOS 无 /bin/sh -> 必须用 Ninja 生成器（Make 的 link.txt 通过 /bin/sh 执行失败）"
  - "OHOS SDK 无 llvm-ranlib -> 创建 shim 脚本用 llvm-ar s 替代"
  - "zstd CMake 要求 CLI 工具必须有静态库（ZSTD_BUILD_STATIC=ON）"
  - "musl 无 GNU qsort_r：cover.c/zstd_deps.h 的 _GNU_SOURCE 守卫加 !defined(__OHOS__)，走 C90 fallback"
  - "test_package 不能直接调用 ZSTD API（不链接 libzstd），需通过 dlsym 获取函数指针"
  - "R32: settings.os 判断用 in ('Linux', 'OHOS')"
  - "R38: 命令行工具在软件级目录声明 commands.json"