# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zimfw/1.20.0
homepage: "https://zimfw.sh"

# 上游测试命令 (zimfw 无独立测试套件)
upstream_check_command: "zsh zimfw.zsh --version"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (zimfw 是单文件脚本，无独立测试程序)
upstream_tests:
  - file: zimfw.zsh
    source: zimfw.zsh
    description: "zimfw --version 烟雾测试（需要完整 zsh 环境）"
    command: "zsh zimfw.zsh --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 zimfw.zsh 存在、内容非空、zsh -n 语法检查通过"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
