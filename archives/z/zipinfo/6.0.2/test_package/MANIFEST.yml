# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zipinfo/6.0.2
homepage: "https://infozip.sourceforge.net/UnZip.html"

# 上游测试命令 (unzip 套件自带 self-test: make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Info-ZIP self-test)
upstream_tests:
  - file: testmake.zip
    source: unzip60/testmake.zip
    description: "Info-ZIP self-test archive"
    command: "unzip -t testmake.zip"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Consumer test: run package zipinfo binary -v + list a zip archive, verify output"
    command: "bash test.sh <package_bin_dir>"
  - file: conanfile.py
    description: "Consumer test: run test.sh against package zipinfo binary"
    command: "conan test test_package zipinfo/6.0.2"

# 测试断言总数
assertion_count: 2
