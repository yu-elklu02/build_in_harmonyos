package: zlib/1.3.1.1.1
homepage: https://zlib.net/

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: example.c
    source: zlib-1.3.1.tar.gz/example.c
    description: "Official zlib compression/decompression example."
    command: "./example"
  - file: infcover.c
    source: zlib-1.3.1.tar.gz/infcover.c
    description: "Official inflate coverage test."
    command: "./infcover"

test_package_tests:
  - file: test.c
    description: "Consumer compress/uncompress round-trip."
    command: "./test_zlib"
  - file: pic_probe.c
    description: "Build a shared library linked against static libz.a to verify PIC objects."
    command: "cmake --build ."

assertion_count: 37
