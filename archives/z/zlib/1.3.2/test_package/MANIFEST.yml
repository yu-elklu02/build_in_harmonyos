# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: zlib/1.3.2
homepage: "https://zlib.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序 (zlib-1.3.2 Makefile: check → test → teststatic + test64)
upstream_tests:
  - file: example.c
    source: zlib-1.3.2.tar.gz/test/example.c
    description: "zlib 官方完整功能演示 (compress/uncompress/deflate/inflate/gzread/gzseek/字典)"
    command: "./example"
  - file: minigzip.c
    source: zlib-1.3.2.tar.gz/test/minigzip.c
    description: "gzip 命令行往返压缩/解压 (echo hello world | ./minigzip | ./minigzip -d)"
    command: "./minigzip"
  - file: example64.c
    source: zlib-1.3.2.tar.gz/test/example.c
    description: "64 位大文件模式 (D_FILE_OFFSET_BITS=64) 完整功能演示"
    command: "./example64"
  - file: minigzip64.c
    source: zlib-1.3.2.tar.gz/test/minigzip.c
    description: "64 位模式 gzip 往返压缩/解压"
    command: "./minigzip64"

# test_package 中自带的测试 (消费者视角验证, R34: 真实调用 zlib API)
test_package_tests:
  - file: test.c
    description: "消费者视角: 调用 zlibVersion() 验证头文件/静态库可用"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 37
