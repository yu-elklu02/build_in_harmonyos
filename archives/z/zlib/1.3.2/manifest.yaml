software: zlib
version: '1.3.2'
status: built
build_date: '2026-08-03'
build_system: makefile

source:
  url: 'https://www.zlib.net/zlib-1.3.2.tar.gz'
  sha256: 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16'
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CFLAGS="-fPIC -O2"'
    - '--static'
    - '--prefix=/'
  cc: clang

patches_applied: []

knowledge_gained:
  - 'zlib 1.3.2 与 1.3.1 相同：静态库必须 -fPIC 才能被下游链进共享库（libcairo.so 等），沿用 1.3.1.1 经验'
  - 'make check（官方测试套件）= teststatic + test64，全部通过，无补丁'
  - '沙箱内 https://www.zlib.net 被 MITM 拦截返回空内容，须走 http://www.zlib.net 或 GitHub release 下载；conandata.yml 保留官方 https URL'
