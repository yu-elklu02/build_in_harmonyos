software: zlib
display: "zlib"
description: "Massively-used data compression library (DEFLATE/inflate)"
category: compress
homepage: "https://zlib.net/"
license: Zlib
build_system: makefile

ohos_adaptation:
  key_points:
    - "configure shell 脚本在 HarmonyOS 上原生支持，无需补丁"
    - "编译简单，无兼容性问题"
    - "Makefile 和 zconf.h 是 configure 生成文件，不应补丁 (R6)"
    - "编译器路径从 Conan conf 获取 (R33)"
  common_dependencies: []

versions:
