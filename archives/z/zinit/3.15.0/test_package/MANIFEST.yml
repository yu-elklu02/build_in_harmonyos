# test_package/MANIFEST.yml
# Upstream and consumer test declaration for CI test quality checks.

package: zinit/3.15.0
homepage: "https://github.com/zdharma-continuum/zinit"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "not run: upstream zunit suite is not part of the Conan consumer package"

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Consumer smoke test: installed zinit scripts, VERSION, executable bit, and optional zsh source/function check"
    command: "sh test.sh"
  - file: conanfile.py
    description: "Conan consumer test invoking test.sh and validating zinit through zsh when available"
    command: "conan test"

assertion_count: 8
