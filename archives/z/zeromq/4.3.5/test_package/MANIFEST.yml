package: zeromq/4.3.5
homepage: "https://zeromq.org"

upstream_check_command: "cmake -DZMQ_BUILD_TESTS=ON .. && ctest --test-dir build --output-on-failure -j1"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure -j1"

upstream_tests:
  - file: tests/*.cpp
    source: zeromq-4.3.5/tests/
    description: "Upstream CTest suite: unit tests for ZeroMQ core functionality."
    command: "ctest --test-dir build --output-on-failure -j1"
    result: "Tests require network sockets; verified via consumer test on OHOS."

test_package_tests:
  - file: test_zmq.c
    description: "Consumer test: create context, socket, bind, verify ZeroMQ version API."
    command: "./test_zmq"

assertion_count: 4
