software: "zeromq"
version: "4.3.5"
status: built
build_date: "2026-08-06"
build_system: cmake

source:
  url: "https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz"
  sha256: "6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED=ON"
    - "-DBUILD_STATIC=OFF"
    - "-DENABLE_CURVE=OFF"
    - "-DWITH_LIBSODIUM=OFF"
    - "-DZMQ_BUILD_TESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "CMakeLists.txt needs cmake_minimum_required(VERSION 3.5) for modern CMake on OHOS"
  - "Binary signing required for .so files on OHOS (XPM)"
  - "No external dependencies needed when libsodium and CURVE are disabled"
