  - "0009-uses-config.sub.patch"
  - "0010-zzip-CMakeLists.txt.patch"
  - "0011-zzipwrap-CMakeLists.txt.patch"

test_results:
  type: official
  total: 1
  passed: 1
  failed: 0

knowledge_gained:
  - "CMake 构建成功（静态库模式）"
  - "需修补多个 CMakeLists.txt 和 config.guess/config.sub"
  - "OHOS 平台需禁用 ZZIPWRAP/ZZIPSDL/ZZIPBINS/ZZIPTEST/ZZIPDOCS 避免缺少依赖导致构建失败"
