package: zig/0.16.0
homepage: "https://ziglang.org/"

upstream_check_command: "zig build test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/standalone
    source: zig-0.16.0/test/standalone
    description: "Zig upstream standalone compiler behavior tests; skipped here because this recipe packages the official distribution."
    command: "zig build test"

test_package_tests:
  - file: smoke.zig
    description: "Runs zig version, then uses zig build run to exercise the generated build runner and executable."
    command: "conan test test_package zig/0.16.0"
  - file: build.zig
    description: "Small Zig build graph used by test_package to cover downstream zig build workflows."
    command: "zig build run install"
  - file: test.sh
    description: "OHOS/Linux shell entrypoint for the Zig smoke test."
    command: "sh test.sh <zig> <workdir>"

assertion_count: 5
