# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ngtcp2/1.22.1
homepage: "https://github.com/ngtcp2/ngtcp2"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/main.c
    source: ngtcp2-1.22.1/tests/main.c
    description: "ngtcp2 unit tests (make check)"
    command: "./main"

test_package_tests:
  - file: test.c
    description: "Consumer test - verifies ngtcp2_version, ngtcp2_pkt_write_version_negotiation"
    command: "./test_ngtcp2"

assertion_count: 3
