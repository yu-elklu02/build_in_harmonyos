software: ntp
version: 4.2.8p18
status: built
build_system: autotools
compile_date: 2026-07-16

dependencies:
  required: []
  optional:
    - openssl (for crypto support, --with-crypto)

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - --prefix=$DEFAULT_PREFIX
    - --enable-local-libopts
    - --enable-local-libevent
    - --without-ntpsnmpd
    - --without-crypto
    - --with-yielding-select=yes
    - --disable-dependency-tracking
    - --with-hardenfile=/dev/null

patches_applied:
  - file: 0001-configure.patch
    purpose: 修复 configure 脚本兼容性（umask/shebang/CONFIG_SHELL）
    lines_changed: 1
  - file: 0002-libevent-build-aux-config.guess.patch
    purpose: 在 libevent/build-aux/config.guess 中添加 HarmonyOS 系统识别
    lines_changed: 11
  - file: 0003-sntp-libevent-build-aux-config.guess.patch
    purpose: 在 sntp/libevent/build-aux/config.guess 中添加 HarmonyOS 系统识别
    lines_changed: 11
  - file: 0004-sntp-libevent-build-aux-config.sub.patch
    purpose: 在 sntp/libevent/build-aux/config.sub 中添加 ohos-linux 三元组支持
    lines_changed: 6
  - file: 0005-sntp-libevent-config.guess.patch
    purpose: 在 sntp/libevent/config.guess 中添加 HarmonyOS 系统识别
    lines_changed: 11
  - file: 0006-sntp-libevent-config.sub.patch
    purpose: 在 sntp/libevent/config.sub 中添加 ohos-linux 三元组支持
    lines_changed: 6
  - file: 0007-sntp-scripts-genLocInfo.patch
    purpose: 修复 sntp/scripts/genLocInfo 脚本 shebang
    lines_changed: 1

compatibility:
  level: partial
  issues:
    - "configure 需要跳过 genHardFlags/genLocInfo 脚本（/system/bin/sh 解释器权限问题）"
    - "config.status 需要 mktemp 包装器（HarmonyOS 无 mktemp 命令）"
    - "构建需要 --disable-dependency-tracking 避免 depfiles 权限问题"
    - "源文件属主与当前用户不一致，需复制到用户目录后构建"

test_results:
  type: manual
  passed: 65
  failed: 1
  note: |
    本地完整执行 66 个上游测试目标（libevent 10 + sntp 7 + libntp 41 + ntpd 3 + ntpq 1 + bug/sandbox/sec-2853 共 4），结果 65 通过、1 失败。
    唯一失败项为 tests/libntp/test-realpath 的 test_DevLinks 用例：/dev/hmv 在当前环境存在但访问返回 Permission denied，上游测试未处理受权限限制的 HMDFS 设备节点，非编译或代码断言失败。
    Conan test_package 通过（1/1）：验证 ntpq 等制品存在且 ELF 魔数正确。
    本地 conan create 完整通过：build → package → test_package。

knowledge_gained:
  - "NTP 4.2.8p18 使用 autotools 构建系统，内嵌 libevent 和 libopts"
  - "config.guess 需要添加 HarmonyOS 识别（与 strace 6.19 相同模式）"
  - "config.sub 需要添加 ohos-linux 和 -linux-ohos 支持"
  - "genHardFlags/genLocInfo 脚本使用 /system/bin/sh 解释器，需改为 /bin/sh"
  - "configure 需要跳过 genHardFlags 和 genLocInfo 的失败检查"
  - "config.status 需要 mktemp 包装器（HarmonyOS 无 mktemp）"
  - "--with-yielding-select=yes 用于交叉编译时 select() 行为检测"
  - "--without-crypto 可跳过 OpenSSL 依赖（基础 NTP 功能不需要）"