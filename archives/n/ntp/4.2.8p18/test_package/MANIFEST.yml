# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ntp/4.2.8p18
homepage: "https://www.ntp.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/libntp/realpath.c
    source: ntp-4.2.8p18/tests/libntp/realpath.c
    description: "libntp realpath 单元测试（含 test_DevLinks：枚举 /dev 并要求每个节点可解析）"
    command: "make -C tests/libntp check"
  - file: sntp/libevent/test_runner_select.c
    source: ntp-4.2.8p18/sntp/libevent/test_runner_select.c
    description: "sntp libevent 单元测试集（10 个用例）"
    command: "make -C sntp/libevent check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ntp.sh
    description: "消费者测试 - 通过 self.run() 执行：验证必需 CLI 制品 ntpq/ntpdate/ntpdc/sntp 存在于 package bin/ 且为 ELF 二进制；宿主可执行目标架构时（can_run）运行 --version，交叉编译产物 (rc 126/127) 跳过执行"
    command: "sh test_ntp.sh <package_folder>（test() 中 self.run 执行，另在 can_run(self) 时直接执行 ntpq --version）"
  - file: conanfile.py
    description: "消费者测试入口 - test() 调用 self.run 执行 test_ntp.sh，并在 can_run(self) 时真实执行 ntpq --version 二进制"
    command: "conan test（test() 有真实 self.run() 调用）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6