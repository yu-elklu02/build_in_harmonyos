knowledge_gained:
  - "ninja-build/1.13.2 has no third-party runtime dependencies."
  - "Windows local build can use configure.py bootstrap with --platform=mingw --host=mingw."
  - "MinGW may need TMP/TEMP redirected to a writable workspace directory for the final static link."
  - "OHOS real-device builds on old port 56267 need a job-local Conan settings.yml/profile when the shared profile points at stale /data/service/hnp/bin tools."
  - "Packaged ninja can run a minimal build.ninja graph on OHOS; the full upstream NinjaTest currently times out with repeated ppoll ENOMEM output."
  - "Official upstream CTest discovers one aggregate NinjaTest target; it was attempted on OHOS and recorded separately because it timed out."
  - "New-port split rerun: default ppoll build exposes SubprocessTest.SetWithLots as a 1025-process USE_PPOLL-only stress case; it times out with ppoll ENOMEM, while NINJA_FORCE_PSELECT=ON unregisters that case."
  - "New-port split rerun: excluding SetWithLots, upstream gtest ran 409 cases with 405 pass / 4 fail; remaining failures are FIFO creation, / root listing, uid lookup, and SIGHUP exit-status assumptions on OHOS."

