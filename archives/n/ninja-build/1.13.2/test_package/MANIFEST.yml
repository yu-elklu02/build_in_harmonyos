# test_package/MANIFEST.yml
package: ninja-build/1.13.2
homepage: "https://ninja-build.org/"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: src/*_test.cc
    source: ninja-1.13.2/src
    description: "Official upstream CTest aggregate NinjaTest target"
    command: "ctest --output-on-failure"
    result: "0/1 on OHOS real device; timed out after 25 minutes with repeated 'ninja: ppoll: Out of memory'."

test_package_tests:
  - file: test_ninja.py
    description: "Run packaged ninja, verify --version output, and execute a minimal build.ninja graph"
    command: "python test_ninja.py <path-to-ninja>"

assertion_count: 4
