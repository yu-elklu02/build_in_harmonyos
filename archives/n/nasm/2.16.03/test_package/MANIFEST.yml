package: nasm/2.16.03
homepage: "https://www.nasm.us/"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "cd test && perl performtest.pl --nasm=../nasm *.asm"

upstream_tests:
  - file: test/performtest.pl
    source: nasm-2.16.03/test/performtest.pl
    description: "Perl-driven golden-output harness over 249 shipped assembly fixtures."
    command: "make test"

test_package_tests:
  - file: test.sh
    description: "Invoke packaged nasm and ndisasm for version, flat-binary, disassembly, and ELF64 generation checks."
    command: "sh test.sh <nasm> <ndisasm> <inputs-and-outputs>"
  - file: test16.asm
    description: "Assemble a 16-bit flat binary and verify exact bytes and disassembly."
    command: "nasm -f bin test16.asm -o test16.bin"
  - file: test64.asm
    description: "Assemble an ELF64 object and verify the ELF magic."
    command: "nasm -f elf64 test64.asm -o test64.o"

assertion_count: 7
test_modifications:
  - "No upstream tests are modified or removed."
  - "The release build has no Perl dependency; the full upstream suite is deferred until Perl is available in a scheduled device slot."
  - "The consumer test uses NASM through tool_requires and never executes generated x86 code on the aarch64 device."
