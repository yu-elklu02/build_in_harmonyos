# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nudoku/5.0.4
homepage: "https://github.com/jubalh/nudoku"

# nudoku 是交互式 TUI 游戏，上游无测试套件 / 无 make check
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package：调用求解器 API + 二进制烟测
test_package_tests:
  - file: test.c
    description: "Solver API test: is_valid_puzzle()/solve() on valid and invalid puzzles"
    command: "./test"
  - file: conanfile.py
    description: "Binary smoke test: nudoku -v reports version"
    command: "nudoku -v"

# 测试断言总数
assertion_count: 4
