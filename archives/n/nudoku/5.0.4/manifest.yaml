software: nudoku
# 版本级 manifest
# 文件位置: archives/n/nudoku/5.0.4/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "5.0.4"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-14"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 5.x 系列仅有 5.0.0（无 5.0.4），取 5.x 基线官方 tarball
  url: "https://github.com/jubalh/nudoku/archive/refs/tags/5.0.0.tar.gz"
  sha256: "ba60a99c9832b5c950a00a0a9d1e0938fddf2cef32765bca18041e770afc3c4a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 直接 clang 编译（上游为 autotools，见 notes.md 说明）
  system: custom

  configure_options:
    - "-DVERSION=5.0.4"
    - "-I$DEFAULT_PREFIX/include -I$DEFAULT_PREFIX/include/ncursesw"

  # ncurses 为系统预装静态库（无 Conan recipe）
  dependencies:
    - "ncurses (system static, libncursesw.a)"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "nudoku 上游 GitHub 源码包仅含 configure.ac（无预生成 configure/Makefile.in/config.guess），走 autotools 需 autoreconf+autopoint(gettext)+pkg-config(ncursesw)，OHOS/musl 上脆弱；项目仅两个翻译单元（main.c + sudoku.c），改为直接 clang 编译"
  - "VERSION 宏由 autotools 注入，手动编译需 -DVERSION=\"5.0.4\""
  - "CI worker 只装 ncurses 运行时库（libncursesw.so，shell 依赖）、无 dev 头文件：pkg-config 与系统路径均找不到 ncurses.h/curses.h（bitwise 配方印证）。打包 ncurses 头文件 + 静态 libncurses.a 到 res/，build() 用 -I res/headers + -L res/libs -lncurses"
  - "CI profile 的 tools.build:compiler_executables 是 dict {'c','cpp'}，不能用未注册的 :c 子键；ar/ranlib 未提供，由编译器同目录推导 llvm-ar"
  - "将 sudoku.c 编为 libnudoku.a 供 test_package 调用真实求解器 API（solve/is_valid_puzzle）"
  - "nudoku 是交互式 TUI，上游无测试套件；-v/-h 干净 exit(EXIT_SUCCESS)，可作烟测"
