sources:
  url: "https://github.com/Unidata/netcdf-c/archive/refs/tags/v4.9.3.tar.gz"
  sha256: "990f46d49525d6ab5dc4249f8684c6deeaf54de6fec63a187e9fb382cc0ffdff"
patches:
  "4.9.3":
    - patch_file: "patches/netcdf-0001-avoid-imported-target-in-try-compile.patch"
      patch_description: "check_symbol_exists 的 try_compile 临时工程看不到调用方的 imported target HDF5::HDF5，改用裸库名"
      patch_type: "portability"
    - patch_file: "patches/netcdf-0002-alias-hdf5-target.patch"
      patch_description: "conan 只给扁平目标 hdf5::hdf5，上游按 FindHDF5 惯例写 HDF5::HDF5 与 hdf5::hdf5_hl，在 find_package 后补别名"
      patch_type: "portability"
    - patch_file: "patches/netcdf-0003-link-libxml2.patch"
      patch_description: "上游只加 libxml2 头目录、从未 target_link_libraries；glibc 默认允许共享库留未定义符号故上游 CI 发现不了"
      patch_type: "portability"
