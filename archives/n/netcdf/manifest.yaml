      依赖全部已在架，故 DAP/NCZARR/远程访问等真功能一个都没关。用 curl/8.15.0 而非 libcurl/8.5.0
      （后者 validate() 读 openssl.options.no_des，而已发布的 openssl/3.5.6 无任何 options）。
      真机 conan create 通过；test_package 走 NC_NETCDF4 格式（底层即 HDF5，借此验证 hdf5 依赖真接上）
      建库/写入/重开/元数据与数据逐元素对账，另验错误路径。
