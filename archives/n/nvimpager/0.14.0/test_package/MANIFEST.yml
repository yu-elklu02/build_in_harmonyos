# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: nvimpager/0.14.0
homepage: "https://github.com/lucc/nvimpager"

# Upstream tests use busted + neovim, unavailable in the OHOS build env
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/unit_spec.lua
    source: nvimpager-0.14.0/test/unit_spec.lua
    description: "busted unit tests (require neovim + busted)"
    command: "make test"

test_package_tests:
  - file: conanfile.py
    description: "Smoke test: nvimpager -v and -h (work without neovim)"
    command: "conan test"

assertion_count: 2
