software: nvimpager
version: 0.14.0
category: utility
description: Use neovim as a pager to view manpages, diffs, etc. with nvim's syntax highlighting
homepage: https://github.com/lucc/nvimpager
url: https://github.com/lucc/nvimpager/archive/refs/tags/v0.14.0.tar.gz
build_system: makefile
build_date: "2026-07-15"
configure_options: []
make_options:
  - "install-no-man PREFIX=<prefix> VERSION=0.14.0"
has_c_code: false
has_tests: true
test_result: skipped
  # upstream tests require neovim + busted, unavailable on OHOS build env
dependencies: []
status: built
notes:
  - nvimpager is a pure shell + lua script tool with no C code
  - Install uses Makefile install-no-man target (skips scdoc man-page build)
  - No ELF binaries - only shell + lua scripts
  - Shebang #!/usr/bin/env bash is OHOS-compatible
  - RUNTIME path baked into the script points to package share/nvimpager/runtime
  - VERSION passed explicitly to make to avoid ./nvimpager -v call at parse time
  - nvimpager -v/-h work without neovim (exit before invoking nvim)
  - Full pager functionality requires neovim >= 0.9.0 at runtime
