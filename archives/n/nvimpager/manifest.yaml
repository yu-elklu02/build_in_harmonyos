# 软件级 manifest
# 文件位置: archives/n/nvimpager/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: nvimpager

# 显示名
display: "nvimpager"

# 一句话描述
description: "使用 neovim 作为分页器查看 man 手册、diff 等"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/lucc/nvimpager"

# 开源许可证（SPDX 标识）
license: BSD-2-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯脚本工具：install-no-man 目标，无编译步骤"
    - "VERSION 显式传入 make，跳过 makefile 解析期的 ./nvimpager -v 调用"
    - "RUNTIME 路径烘焙进脚本，指向包内 share/nvimpager/runtime"
  # 跨版本通用依赖
  common_dependencies:
    - "neovim (运行时，非 Conan 依赖)"

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.14.0":
    status: built
    build_date: "2026-07-15"
