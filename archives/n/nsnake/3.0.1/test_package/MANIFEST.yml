# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nsnake/3.0.1
homepage: "https://github.com/alexdantas/nSnake"

# nsnake has no upstream test suite (no make check target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# nsnake has no official upstream tests
upstream_tests: []

# test_package smoke-test: verify binary and --version
test_package_tests:
  - file: conanfile.py
    description: "验证 nsnake 二进制已安装且 nsnake --version 输出正常"
    command: "conan create test_package"

assertion_count: 1