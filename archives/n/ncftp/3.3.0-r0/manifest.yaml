software: ncftp
version: 3.3.0-r0
source: https://www.ncftp.com/public_ftp/ncftp/ncftp-3.3.0-src.tar.gz
sha256: 38a87edd210ee662b7781a0297b0925468489ad57d867b6fadf0491d017f4167
status: built
description: A set of free application programs implementing FTP

configure_options:
  - --prefix=/

build_system: autoconf

dependencies:
  - ncurses (bundled headers + static lib in res/)

binaries:
  - ncftp
  - ncftpbatch
  - ncftpbookmarks
  - ncftpget
  - ncftpls
  - ncftpput
  - ncftpspooler

build_date: 2026-08-07

platform: harmonyos
arch: aarch64

issues:
  - TMPDIR required for clang temp files (/tmp read-only, E052)
  - config.h needs HAVE_CURSES_H defined (autoconf 2.13 header check doesn't search -I paths)
  - HMDFS doesn't support hard links; ncftpspooler must use cp instead of ln
  - ncurses headers/libs bundled under res/ (system has runtime .so but no dev headers)
  - ncftp.com server serves uncompressed tar to Python requests, different sha256 than curl
