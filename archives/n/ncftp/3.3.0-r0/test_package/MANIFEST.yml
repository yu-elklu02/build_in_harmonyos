# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ncftp/3.3.0-r0
homepage: "https://www.ncftp.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ncftp 3.3.0 uses old autoconf 2.13, no formal test suite.
# "make check" runs Strn/tester and sio self-tests.
upstream_tests:
  - file: Strn/tester.c
    source: ncftp-3.3.0-r0/Strn/tester.c
    description: "Strn string library self-test (compile and run tester)"
    command: "cd Strn && make tester && ./tester"

# test_package 中自带的测试 (消费者视角验证)
# test_package/conanfile.py uses VirtualRunEnv and runs the installed
# ncftp binary with --version, checking output contains "NcFTP".
# It also verifies all shell utilities (ncftpget, ncftpput, ncftpls,
# ncftpbatch) are present in the bin/ directory.
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: runs ncftp --version and checks output; verifies all shell utilities installed"
    command: "conan test test_package ncftp/3.3.0-r0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
