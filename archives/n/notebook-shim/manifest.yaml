software: notebook-shim
display: "notebook-shim"
description: "Shim layer for Notebook traits and configuration used by Jupyter Server"
category: python
homepage: "https://github.com/jupyter/notebook_shim"
license: BSD-3-Clause
build_system: python

ohos_adaptation:
  key_points:
    - "Package pure Python module files without invoking a native compiler."
    - "Install upstream Jupyter Server extension configuration alongside the module."
  common_dependencies:
    - "jupyter_server>=1.8,<3 at runtime"

versions:
