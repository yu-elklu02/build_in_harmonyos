package: notebook-shim/0.2.3
homepage: "https://github.com/jupyter/notebook_shim"

upstream_check_command: "python -m py_compile notebook_shim/*.py"
upstream_test_in_build: true
upstream_test_command: "python -m py_compile notebook_shim/*.py"
upstream_tests:
  - "pyproject package-name validation"
  - "notebook_shim/_version.py validation"
  - "jupyter_server_config.d/notebook_shim.json validation"
  - "py_compile for notebook_shim/*.py"
upstream_case_count: 4
upstream_test_note: "Full Jupyter integration tests require jupyter_server and pytest fixtures; this package test validates the portable shim files."

test_package_tests:
  - file: "test_notebook_shim.py"
    description: "Verify packaged module files, version metadata, extension path descriptor, and Jupyter config."
    command: "python3 test_notebook_shim.py <package-folder>"

test_package_assertion_count: 7
assertion_count: 7
