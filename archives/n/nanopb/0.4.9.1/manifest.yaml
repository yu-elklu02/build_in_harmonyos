software: nanopb
version: "0.4.9.1"
status: passed
build_date: "2026-08-16"
build_system: cmake

source:
  url: "https://github.com/nanopb/nanopb/releases/download/nanopb-0.4.9.1/nanopb-0.4.9.1.tar.gz"
  sha256: "882cd8473ad932b24787e676a808e4fb29c12e086d20bcbfbacc66c183094b5c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-Dnanopb_BUILD_RUNTIME=ON"
    - "-Dnanopb_BUILD_GENERATOR=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-runtime-without-generator-deps.patch"

upstream_tests:
  status: not_run
  framework: "SCons upstream suite"
  note: "Upstream full tests use SCons + protoc + Python protobuf generator path. This Conan package intentionally builds the C runtime with nanopb_BUILD_GENERATOR=OFF; the generator/protoc suite is outside the runtime-only package scope and was not used as the build gate."

adapted_tests:
  status: passed
  cases: 1
  passed: 1
  note: "HarmonyOS conan create passed; test_package builds a C consumer and verifies nanopb stream tag/varint/string encode-decode roundtrip."

knowledge_gained:
  - "nanopb CMake 0.4.9.1 required protoc and Python before checking nanopb_BUILD_GENERATOR; runtime-only builds need those probes guarded by nanopb_BUILD_GENERATOR."
