# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: nsync/1.30.0
homepage: "https://github.com/google/nsync"

# 上游测试命令（CTest；含 counter/cv/mu/note/once 等用例，由 NSYNC_ENABLE_TESTS 控制）
upstream_check_command: "ctest"

# 为最小化鸿蒙 PC 构建，NSYNC_ENABLE_TESTS=OFF，不编上游测试
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带测试（消费者视角：真实调用 nsync 同步原语 API）
test_package_tests:
  - file: test.c
    description: "双线程经 nsync_mu_lock/nsync_cv_wait/nsync_cv_signal 完成 producer/consumer 握手并校验结果"
    command: "./test_nsync"

# 测试断言总数（近似值）
assertion_count: 1
