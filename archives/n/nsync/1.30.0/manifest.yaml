version: "1.30.0"
software: nsync
status: built
build_date: "2026-07-13"
build_system: cmake

source:
  url: "https://github.com/google/nsync/archive/refs/tags/1.30.0.tar.gz"
  sha256: "883a0b3f8ffc1950670425df3453c127c1a3f6ed997719ca1bbe7f474235b6cc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=OHOS"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "BUILD_SHARED_LIBS=OFF"
    - "NSYNC_ENABLE_TESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "host/build 同为 os=OHOS → conan 判非交叉、不写 CMAKE_SYSTEM_NAME，cmake 退回宿主 Linux，误入 platform/linux futex 分支（musl 无 <linux/futex.h>）；recipe 显式 CMAKE_SYSTEM_NAME=OHOS 令其走通用 POSIX 分支（pthread mutex/cond 信号量）"
  - "OHOS 交叉模式下 cmake 探测不出 CMAKE_C_COMPILER_ID → nsync 不追加 platform/clang 编译器头目录；extra_cflags 显式补 -I platform/clang（atomic.h/compiler.h）"
  - "产物 libnsync.a（C API）+ libnsync_cpp.a（同源 C++ 编译变体），均静态"

verification:
  real_device:
    date: "2026-07-19"
    env: "HarmonyOS HAD 206.1.0 真机（aarch64 musl，OHOS SDK clang 15.0.4）"
    result: "pass"
