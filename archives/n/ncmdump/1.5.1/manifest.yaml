version: "1.5.1"
software: "ncmdump"
status: built
build_date: "2026-08-14"
build_system: "cmake"

source:
  url: "https://github.com/taurusxin/ncmdump/archive/refs/tags/1.5.1.tar.gz"
  sha256: "35062836d5210718b12fd311535f4673f5db4de18bd8e987890d89fc0e0a7e6c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
  dependencies:
    - "taglib/2.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ncmdump 唯一硬依赖 taglib/2.3（已适配，ohpcd remote 有 OHOS 制品），CMakeDeps 中将 taglib 的 cmake_target_name 映射为 TagLib::tag 以匹配上游 find_package(TagLib) 链接目标"
  - "ncmdump 上游无自动化测试（无 CTest），test/ 目录仅含官方样例 test.ncm；test_package 用该样例做真实解密验证"
  - "非 Windows 分支只产可执行文件 ncmdump（package_type=application），需 ELF 签名才能在鸿蒙执行"
