software: neko
version: "2.4.1"
status: built
build_date: "2026-07-17"
conan_ref: "neko/2.4.1"

source:
  url: "https://github.com/HaxeFoundation/neko/archive/refs/tags/v2-4-1.tar.gz"
  sha256: "702282028190dffa2078b00cca515b8e2ba889186a221df2226d2b6deb3ffaca"
  tar_format: tar.gz

bundled_sources:
  - name: libatomic_ops
    version: "7.6.14"
    url: "https://codeload.github.com/ivmai/libatomic_ops/tar.gz/refs/tags/v7.6.14"
    sha256: "b4b0072bdb6780e2331db4fadba7e423fde25c71b1f0eb04859cc1eba59c2c2c"
  - name: bdwgc
    version: "7.6.16"
    url: "https://codeload.github.com/ivmai/bdwgc/tar.gz/refs/tags/v7.6.16"
    sha256: "dc0ccf4c34ec2bbd996aeb78d240f90441cd42f0dcd9d9ca6e096a71dcfbd78e"

build:
  system: cmake
  configure_options:
    - "-DWITH_UI=OFF"
    - "-DWITH_MYSQL=OFF"
    - "-DWITH_APACHE=OFF"
    - "-DWITH_SSL=OFF"
    - "-DWITH_SQLITE=OFF"
    - "-DWITH_REGEXP=OFF"
    - "-DWITH_NEKOML=OFF"
    - "-DRUN_LDCONFIG=OFF"
    - "-DRELOCATABLE=OFF"
    - "-DNEKO_JIT_DISABLE=ON"
    - "-DSTATIC_DEPS=BoehmGC"
  dependencies:
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-boehmgc-configure-build.patch"
  - "0002-preserve-neko-bool-typedef.patch"
  - "0003-fix-neko-runtime-link.patch"

knowledge_gained:
  - "BoehmGC 7.6.16 autotools cannot identify HarmonyOS; its CMake build avoids config.guess"
  - "BoehmGC 7.6.16 needs CMAKE_POLICY_VERSION_MINIMUM=3.5 with current CMake releases"
  - "Download bundled libatomic_ops through Conan with retries before the CMake build"
  - "Download bundled BoehmGC through Conan with retries before the CMake build"
  - "A libc bool macro imported after neko.h must not replace Neko's public int-based bool typedef"
  - "pthread_setcancelstate, pthread_cancel, and dl_iterate_phdr availability must be detected instead of inferred from the platform"
  - "Build-tree and installed Neko executables require different relative RPATH values"
  - "Neko already declares VERSION and SOVERSION for libneko; no custom SONAME or symlink is needed"
