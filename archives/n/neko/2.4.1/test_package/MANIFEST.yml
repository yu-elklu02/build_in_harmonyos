package: neko/2.4.1
homepage: "https://nekovm.org"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test"

upstream_tests:
  - file: bin/neko
    description: "Report the Neko VM version"
    command: "neko -version"
  - file: bin/test.n
    description: "Run the upstream Neko bytecode smoke test"
    command: "neko test.n"
  - file: bin/nekoc
    description: "Run the Neko compiler smoke test"
    command: "nekoc"
  - file: bin/nekotools
    description: "Run the Neko tools smoke test"
    command: "nekotools"

test_package_tests:
  - file: test.c
    description: "Link libneko and verify 11 C API invariants"
    command: "./test_neko"
  - file: conanfile.py
    description: "Run the packaged VM and verify its version command"
    command: "neko -version"

# 11 explicit consumer checks plus four upstream CTest entries.
assertion_count: 15
