software: neko
display: "Neko"
description: "Lightweight virtual machine and compiler used by Haxe"
category: build-tool
homepage: "https://nekovm.org"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build bundled BoehmGC with CMake because its legacy config.guess does not recognize HarmonyOS"
    - "Detect pthread_setcancelstate and dl_iterate_phdr capabilities during configuration"
    - "Use separate build and install RPATH values for the Neko executables"
  common_dependencies:
    - zlib

versions:
  "2.4.1":
    status: built
    build_date: "2026-07-17"
