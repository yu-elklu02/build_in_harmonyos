package: notmuch-emacs/0.40
homepage: "https://notmuchmail.org"

upstream_check_command: "Emacs autoload generation, source-load smoke, and byte compilation"
upstream_test_in_build: true
upstream_test_command: "emacs -Q --batch -L emacs ...; batch-byte-compile emacs/*.el"

upstream_tests:
  - file: emacs/autoloads-gen.el
    description: "Generate notmuch-autoloads.el from upstream Emacs Lisp sources"
  - file: emacs/*.el
    description: "Byte compile Notmuch Emacs Lisp sources with emacs -Q --batch"

test_package_tests:
  - file: test_notmuch_emacs.sh
    description: "Run emacs -Q --batch against the packaged Notmuch Emacs load path"
  - file: test_notmuch_emacs.el
    description: "Require notmuch-version, notmuch-lib, and notmuch; verify version and entry points"

assertion_count: 8
