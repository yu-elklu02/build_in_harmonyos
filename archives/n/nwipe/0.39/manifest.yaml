  - "0003-ohos-parted-stub.patch"
  - "0004-ohos-ncursesw-headers.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "configure.ac libconfig 检测 bug：AC_CHECK_LIB([libconfig]) 错误（库名为 config），LIBS=-llibconfig 错误（应为 -lconfig），AC_CHECK_HEADERS(libconfig.h) 重复"
  - "OHOS 用户态可能不提供 <linux/hdreg.h>、<linux/fd.h>，需用 #if guard 条件包含"
  - "wait.h 非标准，nwipe.c 应改用 sys/wait.h"

patch_classification:
  - file: 0001-configure-ac-libconfig-fix.patch
    type: bugfix
    platform_only: False
  - file: 0002-ohos-linux-headers-compat.patch
    type: platform
    platform_only: True
  - file: 0003-ohos-parted-stub.patch
    type: platform
    platform_only: True
  - file: 0004-ohos-ncursesw-headers.patch
    type: platform
    platform_only: True
