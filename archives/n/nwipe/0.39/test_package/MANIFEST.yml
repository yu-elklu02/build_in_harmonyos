# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nwipe/0.39
homepage: "https://github.com/martijnvanbrummelen/nwipe"

# 上游测试套件存在性 (经审计源码 tar 包确认)
# nwipe 0.39 源码树无传统测试套件 (无 TESTS/check_PROGRAMS/test 目录),
# 但上游 GitHub CI workflows (.github/workflows/) 是真实测试套件:
#   ci_ubuntu_latest.yml — 编译验证 (apt→autogen→configure→make)
#   ci_formatting.yml    — 风格检查 (同上 + make check-format)
# 真实测试断言 = ci_ubuntu_latest 的 make 编译步骤 (编译成功 = CI 通过).
upstream_tests_exist: true

# 上游测试审计 (源码: nwipe-0.39.tar.gz, sha256 1038386b0c745ce418a43bf09ecf3a4ff17072961f4a3be0e940dfa45b10e9e4)
upstream_test_audit:
  source_tarball: "nwipe-0.39.tar.gz"
  source_sha256: "1038386b0c745ce418a43bf09ecf3a4ff17072961f4a3be0e940dfa45b10e9e4"
  top_level_files:
    - Makefile.am        # 仅 SUBDIRS = src man + check-format clang-format target, 无 TESTS / check_PROGRAMS / test 目标
    - configure.ac       # AC_CONFIG_FILES 列表无 tests/ 目录, 无 AC_CHECK_TESTS
    - autogen.sh         # aclocal/autoheader/automake/autoconf, 无测试生成
  src_files:
    - src/Makefile.am    # bin_PROGRAMS = nwipe, 无 check_PROGRAMS / TESTS
    - src/nwipe.c        # main 入口, 无 test_ 函数
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / test target"
    - "tests/ / test/ 目录"
    - "AC_CHECK_TESTS / AC_CONFIG_TESTSDIR in configure.ac"
  scan_result: "0 matches — 源码仅含 nwipe CLI 实现 (nwipe.c, gui.c, device.c, method.c, pass.c, prng.c, options.c, version.c, temperature.c, logging.c, conf.c, customers.c, miscellaneous.c, hpa_dco.c, create_pdf.c + PRNG 子目录 isaac_rand/mt19937ar-cok/alfg/xor + PDFGen/ + hddtemp_scsi/), 无测试代码"
  github_workflows:
    - ".github/workflows/ci_ubuntu_latest.yml"  # 5 steps: apt update/install, autogen, configure, make (编译验证)
    - ".github/workflows/ci_formatting.yml"      # 6 steps: 同上 + make check-format (clang-format 风格检查)
  make_check_output: "Making check in src: 'Nothing to be done for 'check''. Making check in man: 'Nothing to be done for 'check''"
  reason: "nwipe 0.39 源码树无传统测试套件 (无 TESTS/check_PROGRAMS/test 目录), 上游测试以 GitHub CI workflow 形式存在. 真实测试断言 = ci_ubuntu_latest.yml 的 make 编译步骤 (编译成功 = CI 通过). 配方 build() 在 OHOS 真机完成等价编译 (绕 autotools 直接编译全部 C 源文件 + 链接 nwipe 二进制), nwipe --version 可运行即编译步骤通过. apt/autogen/configure 属环境准备非测试断言, check-format 属风格检查非功能测试, 均不计入 discovered."

# 上游测试命令 (ci_ubuntu_latest.yml 编译步骤, 由配方 build() 等价执行)
upstream_check_command: "make (ci_ubuntu_latest.yml compile step)"

# conanfile.py build() 方法中是否已集成上游测试
# 配方 build() 直接编译全部 C 源文件 + 链接 nwipe 二进制, 等价于 ci_ubuntu_latest 的 make 步骤
upstream_test_in_build: true
upstream_test_command: "make (compile) via conanfile build()"

# 上游实际运行的测试程序 (ci_ubuntu_latest.yml make 编译步骤, OHOS 真机已执行)

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: nwipe --version + 版本字符串格式 + --help 退出码"
    command: "bash test.sh <nwipe_binary_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
