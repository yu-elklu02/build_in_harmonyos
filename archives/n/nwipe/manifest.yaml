software: nwipe
display: "nwipe"
description: "Secure disk eraser — curses-based GUI for wiping disks via libparted"
category: utility
homepage: "https://github.com/martijnvanbrummelen/nwipe"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure.ac libconfig detection fixed (library name config, -lconfig, remove duplicated AC_CHECK_HEADERS)"
    - "Linux-specific kernel headers (<linux/hdreg.h>, <linux/fd.h>) guarded for OHOS userland portability"
    - "wait.h -> sys/wait.h for POSIX conformance"
  common_dependencies:
    - ncurses
    - libparted
    - libconfig
    - pthread
    - uuid

versions:
  "0.39":
    status: built
    build_date: "2026-07-29"
    conan_ref: "nwipe/0.39"
