package: ntl/11.6.0
homepage: https://libntl.org/
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: src/QuickTest.cpp
    source: ntl-11.6.0.tar.gz/src/QuickTest.cpp
    description: "Run NTL's quick arithmetic self-test"
    command: "make check"
  - file: src/TestScript
    source: ntl-11.6.0.tar.gz/src/TestScript
    description: "Run the 25 scripted NTL test programs, including two subset modes"
    command: "make check"
test_package_tests:
  - file: test_package.cpp
    description: "Multiply arbitrary-precision integers and verify the exact result"
    command: "./test_package"
assertion_count: 1
