# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nodenv/1.6.2
homepage: "https://github.com/nodenv/nodenv"

# 上游测试命令 (bats 测试框架)
upstream_check_command: "bats test/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (bats 测试)
upstream_tests:
  - file: test/--version.bats
    source: nodenv-1.6.2/test/--version.bats
    description: "上游 --version 命令测试"
    command: "bats test/--version.bats"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_nodenv.sh 验证 nodenv 脚本已安装、可执行且 --version 输出正确"
    command: "conan create (test_package: bash test_nodenv.sh <bin_dir>)"
  - file: test_nodenv.sh
    description: "真实冒烟测试: 检查 bin/nodenv 存在、shebang 为 bash、bash -n 语法检查通过、--version 输出 1.6.2"
    command: "bash test_nodenv.sh <package bin dir>"

assertion_count: 4
