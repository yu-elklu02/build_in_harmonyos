version: "6.0.2"
software: nbsdgames
status: built
build_date: "2026-07-16"
build_system: makefile

source:
  url: "https://github.com/abakh/nbsdgames/archive/refs/tags/v6.0.2.tar.gz"
  sha256: "9545b099f6edb2be08d8885eaae2e10cf3d114c3a8fa1fc3eefff156053f37ca"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "GAMES_DIR=${prefix}/bin"
    - "SCORES_DIR=${prefix}/var/games"
    - "MAN_DIR=${prefix}/share/man"
  dependencies:
    - ncurses/6.5
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-Makefile-xargs-compat.patch"

knowledge_gained:
  - "Makefile 项目，使用 make install 安装，需指定 GAMES_DIR/SCORES_DIR/MAN_DIR"
  - "依赖 ncurses 宽字符静态库，消费者链接需显式带上 ncurses 的 include/lib 参数"
