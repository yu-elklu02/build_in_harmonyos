software: nlohmann_json
version: "3.1.1"
build_system: cmake
# 真机 conan create + test_package 已通过（2026-08-11）。
status: built
source:
  url: "https://github.com/nlohmann/json/archive/refs/tags/v3.1.1.tar.gz"
  sha256: "9f3549824af3ca7e9707a2503959886362801fb4926b869789d6929098a79e47"
knowledge_gained:
  - "做 3.1.1 是因为 qiskit-aer 在两条路径上都钉这个版本；用 3.12.0 编出来的 aer 能构建能 import，但自带测试套件里 196 个噪声模型用例全报 Invalid noise_params JSON —— aer 把自定义 pybind11 caster 塞在 namespace std 里，nlohmann_json 3.2/3.9/3.11 改过 ADL 解析规则后找不到它。"
  - "CMake 4.x 拒绝 cmake_minimum_required(VERSION < 3.5)，2018 年的项目必撞；用 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 放行。"
  - "3.1.1 的 CMake config 装在 lib/cmake/（3.12 是 share/cmake/）；contains() 是 3.6.0 才有的 API，3.1.1 要用 count()。"

