software: nlohmann_json
version: "3.12.0"
build_system: cmake
# 真机 conan create + test_package 已通过（2026-08-10）。
status: built
source:
  url: "https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz"
  sha256: "4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187"
knowledge_gained:
  - "纯头文件库必须用 package_type=header-library + package_id 恒定（self.info.clear()）：否则 shared/fPIC 这两个对它毫无意义的选项会进 package_id，同一份逐字节相同的头文件产出多个互不匹配的二进制，消费方设置稍有不同就报 Missing binary。"
  - "头装在 include/nlohmann/，includedirs 必须是 include（下游写 #include <nlohmann/json.hpp>）。"
  - "CMake config 装在 share/cmake/nlohmann_json，pkgconfig 在 share/pkgconfig —— 与多数库的 lib/cmake、lib/pkgconfig 不同。"

