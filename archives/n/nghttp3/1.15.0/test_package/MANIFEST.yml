# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nghttp3/1.15.0
homepage: "https://github.com/ngtcp2/nghttp3"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/main.c
    source: nghttp3-1.15.0/tests/main.c
    description: "nghttp3 unit tests using munit framework (qpack, conn, stream, tnode, http, conv, settings, callbacks)"
    command: "./main"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 nghttp3_version() 和 nghttp3_settings_default() 验证库可用性"
    command: "./test_nghttp3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 50
