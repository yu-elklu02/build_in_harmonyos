# test_package/MANIFEST.yml
# CI L0e requires this file to exist as upstream test declaration

package: nginx/1.26.2
homepage: "https://nginx.org"

# nginx has no standard "make check" test suite — it is a server application.
# Tests are functional (start server, send request, verify response).
upstream_check_command: "nginx -t"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (nginx functional tests)
upstream_tests:
  - file: test_nginx.sh
    source: nginx-1.26.2/test_package/test_nginx.sh
    description: "Run nginx -V and verify version string"
    command: "./test_nginx.sh"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_nginx.sh
    description: "Smoke test: verify nginx binary runs and reports correct version"
    command: "./test_nginx.sh"

# Approximate assertion count
assertion_count: 1
