software: nginx
version: 1.26.2
status: built
build_system: custom
build_date: 2026-08-07
created_at: 2026-04-28
updated_at: 2026-08-07
knowledge_gained:
  - nginx configure is a custom script, not standard autotools
  - HarmonyOS detected via uname -s returning "HarmonyOS"
  - Patch auto/os/conf to add HarmonyOS:* case that sources auto/os/linux (epoll, sendfile, etc.)
  - nginx uses --with-cc-opt and --with-ld-opt to pass dependency include/lib paths
  - Dependencies: zlib/1.3.1, openssl/1.1.1w from Conan; PCRE2 from system (/data/service/hnp/pcre2.org/)
  - All modules enabled (no trimming): http_ssl_module, http_rewrite_module, http_gzip_module
  - Build: configure + make -j1 + make install DESTDIR
patches_applied:
  - 0001-add-harmonyos-os-detection.patch
source_url: https://nginx.org/download/nginx-1.26.2.tar.gz
configure_options:
  - "--prefix=/nginx"
  - "--with-http_ssl_module"
  - "--with-cc-opt=-I<zlib_include> -I<openssl_include>"
  - "--with-ld-opt=-L<zlib_lib> -L<openssl_lib>"
