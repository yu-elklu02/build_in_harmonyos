package: nextvi/7.0
homepage: "https://github.com/kyx0r/nextvi"

upstream_check_command: "/bin/sh test.sh"
upstream_test_in_build: true
upstream_test_command: "/bin/sh test.sh"

upstream_tests:
  - file: test.sh
    source: nextvi-7.0/test.sh
    description: "Official upstream POSIX shell test suite for ex commands and vi normal mode"
    command: "/bin/sh test.sh"
    result: "250/250 passed on OHOS real device"

test_package:
  type: smoke
  entry: test_nextvi.py
  description: "Runs nextvi in raw ex mode and exits immediately."
  assertions:
    - "packaged bin/vi exists"
    - "vi -s accepts a quit command and exits with code 0"

assertion_count: 252
