# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: n2n/3.1.1
homepage: "https://github.com/ntop/n2n"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tools/tests-auth.c
    source: n2n-3.1.1/tools/tests-auth.c
    description: "Authentication tests"
    command: "./tests-auth"
  - file: tools/tests-compress.c
    source: n2n-3.1.1/tools/tests-compress.c
    description: "Compression tests"
    command: "./tests-compress"
  - file: tools/tests-elliptic.c
    source: n2n-3.1.1/tools/tests-elliptic.c
    description: "Elliptic curve cryptography tests"
    command: "./tests-elliptic"
  - file: tools/tests-hashing.c
    source: n2n-3.1.1/tools/tests-hashing.c
    description: "Hashing tests"
    command: "./tests-hashing"
  - file: tools/tests-transform.c
    source: n2n-3.1.1/tools/tests-transform.c
    description: "Transform (encryption) tests"
    command: "./tests-transform"
  - file: tools/tests-wire.c
    source: n2n-3.1.1/tools/tests-wire.c
    description: "Wire protocol encode/decode tests"
    command: "./tests-wire"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: pearson hash + wire encode/decode round-trip"
    command: "./test_n2n"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
