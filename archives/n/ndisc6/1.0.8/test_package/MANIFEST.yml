# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ndisc6/1.0.8
homepage: "https://github.com/nomis/ndisc6"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ndisc6 has no automated test suite; make check passes trivially
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "编译验证测试 + ndisc6 --version 二进制验证"
    command: "./test_ndisc6 && ndisc6 --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
