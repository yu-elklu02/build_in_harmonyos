software: ncurses
display: "ncurses"
description: "Terminal handling library providing cursor movement, screen optimization, and window management"
category: system
homepage: "https://invisible-island.net/ncurses/"
license: X11
build_system: autotools

ohos_adaptation:
  key_points:
    - "必须使用 --without-shared 静态编译，否则 LD_LIBRARY_PATH 会劫持系统 libncursesw.so.6 导致 zsh 崩溃"
    - "必须使用 --enable-widec 编译 libncursesw（宽字符版本），readline 依赖它"
    - "必须使用 --enable-overwrite 让头文件安装到顶层 include/ 而非 include/ncursesw/"
    - "HMDFS 不支持 ln -s，使用 cp 复制代替软链接"
    - "toybox expr 复合正则表达式有 bug，需要先安装 GNU coreutils"
  common_dependencies:
    - gnu-coreutils

versions:
  "6.4":
    status: built
    build_date: "2026-08-11"
    conan_ref: "ncurses/6.4"
  "6.6":
    status: built
    build_date: "2026-08-06"
    conan_ref: "ncurses/6.6"
