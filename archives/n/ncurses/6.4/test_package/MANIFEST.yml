# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ncurses/6.4
homepage: "https://invisible-island.net/ncurses/"

# 上游测试命令 (ncurses test/ 目录, --without-tests 跳过编译)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 SHELL=/bin/sh check"

# 上游实际运行的测试程序 (ncurses test/programs 列出 86 个, --without-tests 不编译)
upstream_tests:
  - file: test/programs
    source: ncurses-6.4/test/programs
    description: "上游测试程序清单 (86 个条目, --without-tests 跳过编译)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ncurses_smoke.c
    description: "L1 smoke: 链接静态 ncursesw 库, 验证 curses_version/setupterm/tputs"
    command: "./test_ncurses_smoke"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
