# ncurses 6.4 编译档案
software: ncurses
version: "6.4"
status: built
build_system: autotools
compile_date: "2026-08-11"
conan_ref: "ncurses/6.4"

source:
  url: "https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz"
  sha256: "6931283d9ac87c5073f30b6290c4c75f21632bb4fc3603ac8100812bed248159"
  tar_format: tar.gz

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --disable-shared
    - --enable-static
    - --without-shared
    - --without-debug
    - --without-ada
    - --without-manpages
    - --without-tests
    - --without-cxx-binding
    - --enable-widec
    - --enable-overwrite
  cflags: "-fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: config.guess + config.sub 添加 HarmonyOS 检测
  - file: 0002-fix-expr-and-umask.patch
    purpose: 检测 toybox expr 复合正则 bug 并回退, 移除 config.status umask 077 (HMDFS 权限拒绝)

compatibility:
  level: high
  issues:
    - "toybox expr 复合正则表达式有 bug, 需要 GNU coreutils (已通过 0002 补丁检测并回退)"
    - "config.status umask 077 在 HMDFS 上创建的临时目录不可写 (0002 补丁移除 umask 077)"
  notes: |
    - 🔴 必须使用 --without-shared 静态编译 (R4/R26)
    - 系统zsh依赖libncursesw.so.6，共享库会导致Shell崩溃
    - --enable-widec 宽字符支持（readline/bash需要）
    - --enable-overwrite 头文件安装到顶层
    - 4个静态库：libncursesw.a libpanelw.a libmenuw.a libformw.a
    - 2851个terminfo条目
    - 11个工具：clear tput tic infocmp toe captoinfo infotocap reset tabs tset ncursesw6-config

test_results:
  type: manual
  passed: 3
  failed: 0
  note: "tput cols/colors/tic功能验证通过, 零共享库确认安全, make check 显示 test-programs are interactive"

knowledge_gained:
  - "ncurses 必须静态编译（--without-shared），否则 LD_LIBRARY_PATH 会劫持系统 libncursesw.so.6 导致 zsh 崩溃"
  - "--enable-widec 编译 libncursesw（宽字符版本），readline 依赖它"
  - "--enable-overwrite 让头文件安装到顶层 include/ 而非 include/ncursesw/"
  - "toybox expr 复合正则表达式有 bug, 会导致 config.status 生成乱码 Makefile (top_srcdir 乱码), 需要 GNU coreutils 或检测回退"
  - "config.status 的 umask 077 在 HMDFS 上创建的临时目录不可写, 需要移除 umask 077"

references:
  - https://invisible-island.net/ncurses/
  - https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz
