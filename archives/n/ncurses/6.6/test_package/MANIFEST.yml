package: ncurses/6.6
homepage: "https://invisible-island.net/ncurses/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1; verify test/programs targets 86/86; make -j1 check"

upstream_tests:
  - file: "test/programs"
    source: "ncurses-6.6/test/programs"
    description: "86 upstream terminal test program entrypoints; every target must build"
    command: "make -j1; verify all 86 test/programs targets"
  - file: "test/Makefile.in"
    source: "ncurses-6.6/test/Makefile.in"
    description: "Upstream make check compiles every generated public header independently"
    command: "make -j1 check"

test_package_tests:
  - file: "src/test_curses_module.c"
    description: "CMake FindCurses, version, wide character, tputs, terminfo, and window update"
    command: "test_curses_module <output> <input>"
  - file: "src/test_ncurses_components.c"
    description: "Conan CMake config target plus panel, menu, and form lifecycle APIs"
    command: "test_ncurses_components <output> <input>"
  - file: "src/test_metadata.c"
    description: "Relocatable ncursesw6-config consumer linked to the packaged static archive"
    command: "ncursesw6-config --cflags/--libs; compile, trace, and run test_metadata_config"
  - file: "src/test_metadata.c"
    description: "Relocatable formw pkg-config consumer referencing new_field and linked only to packaged static archives"
    command: "isolated pkg-config formw --cflags/--static --libs; compile, trace, and run"
  - file: "src/test_metadata.c"
    description: "Relocatable menuw pkg-config consumer referencing new_item and linked only to packaged static archives"
    command: "isolated pkg-config menuw --cflags/--static --libs; compile, trace, and run"
  - file: "src/test_metadata_cpp.cpp"
    description: "Relocatable ncurses++w C++ pkg-config consumer emitting NCursesWindow constructor and destructor references without terminal initialization at runtime"
    command: "isolated pkg-config ncurses++w --cflags/--static --libs; compile with clang++, trace, and run"
  - file: "src/test_metadata.c"
    description: "Relocatable ncursesw pkg-config consumer linked only to the packaged static archive"
    command: "isolated pkg-config ncursesw --cflags/--static --libs; compile, trace, and run"
  - file: "src/test_metadata.c"
    description: "Relocatable panelw pkg-config consumer referencing new_panel and linked only to packaged static archives"
    command: "isolated pkg-config panelw --cflags/--static --libs; compile, trace, and run"

assertion_count: 27
