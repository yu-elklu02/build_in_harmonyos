# ncurses 6.5 编译档案
software: ncurses
version: 6.5
status: built
build_system: autotools
compile_date: 2026-08-01

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --without-shared
    - --without-debug
    - --without-ada
    - --without-manpages
    - --without-tests
    - --without-cxx-binding
    - --enable-widec
    - --enable-overwrite
  cflags: "-fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: config.guess + config.sub 添加 HarmonyOS/OHOS 检测（继承 6.4 方案）
  - file: 0002-configure-umask-022.patch
    purpose: configure 临时目录 umask 077→022（OHOS 沙箱 0700 目录不可写，config.status 必需）
  - file: 0003-configure-as_expr-false.patch
    purpose: config.status 强制 as_expr=false 走 sed fallback（toybox expr 的 \| 链输出垃圾字节，ac_dir 提取必需）

compatibility:
  level: high
  issues: []
  notes: |
    - 🔴 必须使用 --without-shared 静态编译
    - 系统 zsh 依赖 libncursesw.so.6，共享库会导致 Shell 崩溃
    - --enable-widec 宽字符支持（readline/bash/multitail 需要）
    - --enable-overwrite 头文件安装到顶层 include/
    - 4 个静态库：libncursesw.a libpanelw.a libmenuw.a libformw.a
    - conanfile.py 引用版本：ncurses/6.5（multitail/aamath/joe/nethogs/progress 等依赖）

test_results:
  type: manual
  passed: 2
  failed: 0
  rate: "2/2 (100%)"
  note: "test_package 宽字符编译+运行验证通过（curses_version 版本检查 + setcchar/getcchar 宽字符往返）"

knowledge_gained:
  - "ncurses 必须静态编译（--without-shared），否则共享库会劫持系统 libncursesw.so.6 导致 zsh 崩溃"
  - "--enable-widec 编译 libncursesw（宽字符版本），readline/multitail 依赖它"
  - "--enable-overwrite 让头文件安装到顶层 include/ 而非 include/ncursesw/"
  - "6.5 的 config.guess/config.sub 与 6.4 行号不同，补丁需按 6.5 源码重新生成（6.4 补丁直接应用会 FAILED）"

references:
  - https://invisible-island.net/ncurses/
