# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nanorc/2020.10.10
homepage: https://github.com/scopatz/nanorc

# nanorc 为纯配置文件集合，无上游测试命令
upstream_check_command: "none"

# nanorc 无编译步骤，无上游测试
upstream_test_in_build: false
upstream_test_command: "none"

# nanorc 为纯配置文件，无上游测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 NANORC_PATH 环境变量设置和配置文件存在性"
    command: "conan test . nanorc/2020.10.10"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
