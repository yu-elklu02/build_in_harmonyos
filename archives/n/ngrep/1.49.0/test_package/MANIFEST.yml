# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ngrep/1.49.0
homepage: "https://ngrep.sourceforge.net/"

# 上游测试命令
upstream_check_command: "make check"

# ngrep has no upstream test suite (confirmed: Alpine APKBUILD uses options="!check")
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 ngrep -V 验证二进制完整性和版本字符串"
    command: "ngrep -V"

# 测试断言总数 (近似值)
assertion_count: 1
