# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nuttcp/8.2.2
homepage: "https://www.nuttcp.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# nuttcp has no formal test suite; the -V flag is the standard smoke test
upstream_tests:
  - file: test.sh
    source: nuttcp-8.2.2/test_package/test.sh
    description: "nuttcp -V version smoke test"
    command: "./test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 运行 nuttcp -V 验证二进制可用"
    command: "nuttcp -V"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
