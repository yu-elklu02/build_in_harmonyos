# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nmap/7.99
homepage: "https://nmap.org/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: nmap.c
    source: nmap-7.99/nmap.c
    description: "nmap 主程序源文件，编译后生成 nmap 二进制"
    command: "./nmap --version"
  - file: ncat/ncat_main.c
    source: nmap-7.99/ncat/ncat_main.c
    description: "ncat 主程序，netcat 替代工具"
    command: "./ncat --version"
  - file: nping/nping.cc
    source: nmap-7.99/nping/nping.cc
    description: "nping 主程序，网络探测工具"
    command: "./nping --version"

test_package_tests:
  - file: test_package/conanfile.py
    description: "Conan L1 消费者测试：验证 nmap 二进制存在、ELF 格式、版本字符串、musl 链接"
    command: "conan test test_package nmap/7.99"

assertion_count: 6
