# test_package/MANIFEST.yml — nanobind/2.13.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: nanobind/2.13.0
homepage: "https://github.com/wjakob/nanobind"

# Main recipe uses NB_TEST=OFF (Homebrew-aligned install-only build).
# Full upstream test suite (NB_TEST=ON) is heavy and Python-ABI bound.
upstream_check_command: "cmake --build build && ctest (when NB_TEST=ON)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: nanobind-2.13.0/tests/
    description: "Upstream nanobind test suite (not run in main recipe; NB_TEST=OFF)"
    command: "NB_TEST=ON cmake build + ctest"

test_package_tests:
  - file: my_ext.cpp
    description: "Homebrew-equivalent: nanobind_add_module + import my_ext; add(1,2)==3"
    command: "python3 -c \"import my_ext; assert my_ext.add(1, 2) == 3\""

assertion_count: 1

# Notes:
# - Main recipe NB_TEST=OFF matches Homebrew install formula.
# - Linux host conan create verified 2026-07-19: my_ext.add(1,2)==3.
# - Native OHOS aarch64 CI should re-run full test_package with system Python 3.12.
