software: nanobind
version: "2.13.0"
status: built
build_date: "2026-07-19"
conan_ref: "nanobind/2.13.0"
build_system: cmake

source:
  url: "https://github.com/wjakob/nanobind/archive/refs/tags/v2.13.0.tar.gz"
  sha256: "cb25a582ccade4b6067bc73c78b84ad9dbd0bbe0e537320711d18015ccafc4ef"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNB_TEST=OFF"
    - "-DNB_USE_SUBMODULE_DEPS=OFF"
    - "-DNB_CREATE_INSTALL_RULES=ON"
    - "-DNB_INSTALL_DATADIR=<package_folder>/nanobind  # absolute; see notes"
  dependencies:
    - robin-map/1.4.1
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  linux_x86_64:
    conan_create: pass
    test_package: "my_ext.add(1,2)==3"
    evidence: "reports/conan-create-linux.log"
  ohos_aarch64_cross:
    package_install: pass
    test_package: "deferred (needs native OHOS Python)"
    evidence: "reports/conan-create-ohos-package.log"

knowledge_gained:
  - "Homebrew 安装型配方：NB_TEST=OFF 时主工程不 find Python，功能由 test_package 验收"
  - "依赖 robin-map 提供 tsl-robin-map；nanobind-config.cmake 内 find_dependency"
  - "NB_INSTALL_DATADIR 为 CACHE PATH：相对路径会锚到 build 目录导致空包；须用 package_folder 绝对路径"
  - "package_info 导出 nanobind/cmake 供 find_package(nanobind CONFIG)"
  - "E092：OHOS 上 CMake 可能不识别系统名，generate() 中防御性映射（对齐 robin-map/valijson）"

knowledge_ref:
  - E092
