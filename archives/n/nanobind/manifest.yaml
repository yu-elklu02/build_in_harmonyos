software: nanobind
display: "nanobind"
description: "Tiny and efficient C++/Python bindings"
category: library
homepage: "https://github.com/wjakob/nanobind"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "对齐 Homebrew：NB_TEST=OFF、NB_USE_SUBMODULE_DEPS=OFF、NB_CREATE_INSTALL_RULES=ON"
    - "依赖 robin-map/1.4.1（tsl-robin-map）；方案 A（R36）"
    - "NB_INSTALL_DATADIR 须为绝对路径（相对值会被 CMake PATH 绝对化到 build 目录）"
    - "验收：test_package 编译 Python 扩展并 import 调用 API"
    - "Python 测试对齐制品仓 3.12.x"
  common_dependencies:
    - robin-map

versions:
  "2.13.0":
    status: built
    build_date: "2026-07-19"
    conan_ref: "nanobind/2.13.0"
