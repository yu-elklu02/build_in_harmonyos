# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: nbd/3.26.1
homepage: "https://github.com/NetworkBlockDevice/nbd"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from tests/run/ directory)
upstream_tests:
  - file: tests/run/handshake
    source: nbd-3.26.1/tests/run/handshake
    description: "NBD handshake protocol test"
    command: "./handshake"
  - file: tests/run/tls
    source: nbd-3.26.1/tests/run/tls
    description: "NBD TLS encryption test (fails on HarmonyOS due to /tmp read-only)"
    command: "./tls"
  - file: tests/run/tlswrongcert
    source: nbd-3.26.1/tests/run/tlswrongcert
    description: "NBD TLS wrong certificate rejection test"
    command: "./tlswrongcert"
  - file: tests/run/integrityhuge
    source: nbd-3.26.1/tests/run/integrityhuge
    description: "NBD large file integrity test (fails on HarmonyOS due to /tmp read-only)"
    command: "./integrityhuge"

# test_package consumer-side tests
test_package_tests:
  - file: test.c
    description: "Consumer link verification test"
    command: "./test_nbd"

# Approximate assertion count
assertion_count: 10
