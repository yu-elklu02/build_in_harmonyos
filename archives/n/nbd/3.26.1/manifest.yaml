software: nbd
version: "3.26.1"
status: built
build_date: "2026-08-07"
build_system: autotools

source:
  url: "https://github.com/NetworkBlockDevice/nbd/archive/refs/tags/nbd-3.26.1.tar.gz"
  sha256: "8f68b957f1d50492d6fdc9be6027a19b40c00cc826be226c945e22ccd5ed32e2"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--without-gnutls"
    - "--with-libnl"
    - "--disable-manpages"
  dependencies:
    - glib/2.84.0
    - libnl/3.7.0
  build_tools:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.ac.patch"
  - "0002-nbd-client.c.patch"

knowledge_gained:
  - "config.guess cannot detect HarmonyOS; must pass --build and --host explicitly"
  - "linux/socket.h redefines sockaddr_storage on HarmonyOS; need #define _UAPI_LINUX_SOCKET_H guard"
  - "glib >= 2.32 merged gthread into glib; need to create gthread-2.0.pc wrapper"
  - "configure.ac --disable-manpages has a bug: falls to 'don't know what to do here' error"
  - "config.status uses umask 077 for mktemp which fails on HarmonyOS HMDFS"
  - "make check: 5/17 tests fail due to /tmp read-only (E002); core functionality verified"
