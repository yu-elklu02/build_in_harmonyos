package: neovim/0.11.3
homepage: "https://neovim.io/"

upstream_check_command: "nvim --version && nvim --headless -u NONE -i NONE '+lua print(vim.version().major)' +qa"
upstream_test_in_build: true
upstream_test_command: "nvim --version; nvim --headless -u NONE -i NONE '+lua print(vim.version().major)' +qa"

upstream_tests:
  - file: bin/nvim
    source: installed package
    description: "Neovim executable version smoke"
    command: "nvim --version"
  - file: bin/nvim
    source: installed package
    description: "Neovim headless Lua smoke"
    command: "nvim --headless -u NONE -i NONE '+lua print(vim.version().major)' +qa"

test_package_tests:
  - file: test_headless.sh
    description: "Runs packaged nvim --version and headless Lua smoke"
    command: "sh test_headless.sh"

assertion_count: 2
