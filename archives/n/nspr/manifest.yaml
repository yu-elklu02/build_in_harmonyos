# NSPR 软件级元数据
# Netscape Portable Runtime

software: nspr
display: "NSPR (Netscape Portable Runtime)"
description: "Netscape Portable Runtime - 跨平台可移植运行时库，提供线程、IO、内存管理等基础功能的统一 API"
category: library
homepage: "https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSPR"
license: MPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需打补丁以识别 OHOS/HarmonyOS 系统类型 (E007)"
    - "configure 在 nspr/ 子目录下运行，需指定 build_script_folder='nspr'"
    - "需要设置 TMPDIR=/data/storage/el2/base/cache 避免 /tmp 不可写问题"
  common_dependencies: []

versions:
  "4.37":
    status: built
    build_date: "2026-07-16"