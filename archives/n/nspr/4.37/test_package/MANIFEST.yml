# test_package/MANIFEST.yml
# NSPR 4.37 — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nspr/4.37
homepage: "https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSPR"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cd pr/tests && make runtests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cd pr/tests && make runtests"

# 上游实际运行的测试程序 (pr/tests/ 目录)
# runtests.sh 定义了 100 个测试程序
upstream_tests:
  - file: pr/tests/runtests.sh
    source: nspr-4.37.tar.gz/pr/tests/runtests.sh
    description: "NSPR test runner — runs 100 test programs from pr/tests/"
    command: "./runtests.sh <dist>"
    count: 100

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "Comprehensive NSPR API test: PR_Init, PR_GetVersion, PR_Now, PR_IntervalNow, PR_AtomicIncrement/Decrement, PR_Malloc/Free, PR_NewLock/Lock/Unlock, PR_CreateThread/JoinThread, PR_Open/Write/Read/Close, PR_SetEnv/GetEnv, PR_LogPrint"
    command: "./test_nspr"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18