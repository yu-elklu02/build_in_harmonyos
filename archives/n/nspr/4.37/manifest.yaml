# NSPR 4.37 编译产物清单
# Netscape Portable Runtime

software:
  name: nspr
  version: "4.37"
  description: Netscape Portable Runtime - 提供平台无关的线程、IO、内存管理等基础功能
  homepage: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSPR
  license: MPL-2.0

status: built

build:
  date: "2026-07-16"
  platform: ohos-aarch64
  compiler: clang
  env:
    TMPDIR: /data/storage/el2/base/cache
  configure_options:
    - --prefix=/usr/local
    - --enable-64bit
    - --disable-debug

dependencies: []

provides:
  - libnspr4
  - libplc4
  - libplds4

libraries:
  - name: libnspr4
    type: shared+static
    description: NSPR 核心库，提供平台抽象层
    files:
      - libnspr4.so
      - libnspr4.a
  - name: libplc4
    type: shared+static
    description: NSPR PLC 库，提供附加功能
    files:
      - libplc4.so
      - libplc4.a
  - name: libplds4
    type: shared+static
    description: NSPR PLDS 库，提供数据结构
    files:
      - libplds4.so
      - libplds4.a

headers:
  directory: include/nspr
  count: 47
  description: NSPR 公共 API 头文件

related:
  - name: nss
    relationship: NSPR 是 NSS 的必需依赖
    note: NSS 编译需要 NSPR 的头文件和库文件

files:
  lib:
    - libnspr4.so
    - libnspr4.a
    - libplc4.so
    - libplc4.a
    - libplds4.so
    - libplds4.a
  include:
    - nspr/*.h
  patches: []

notes:
  - NSPR 是跨平台可移植运行时库，为上层应用提供统一的系统调用接口
  - 被 NSS、Firefox、Thunderbird 等项目广泛使用
  - 头文件对 NSS 编译至关重要