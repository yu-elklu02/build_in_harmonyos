software: nss-wrapper
display: "nss-wrapper"
description: "A wrapper for testing applications that use libc NSS calls"
category: system
homepage: "https://cwrap.org/nss_wrapper.html"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS needs a glibc-compatible NSS status enum patch because nss.h is unavailable"
    - "Runtime behavior depends on LD_PRELOAD interposition"
    - "test_package verifies LD_PRELOAD passwd/group/hostname interposition"
    - "Official upstream CTest suite requires cmocka and is documented separately"
  common_dependencies: []

versions:
  "1.1.16":
    status: built
    build_date: "2026-07-30"
