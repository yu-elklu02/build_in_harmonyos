    sha256: "dc79ab072779be4403b45b60cd044dd13780d4bb9675d27abf1932ada7c8a88d"
patches:
  - patch_file: "patches/0001-ohos-nss-status.patch"
    patch_description: "Define NSS status ABI constants when NSS headers are unavailable and guard getgrent_r binding"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-upstream-tests.patch"
    patch_description: "Adapt upstream cmocka tests to OHOS libc NSS and shadow capability detection"
    patch_type: "test"
  - patch_file: "patches/0003-guard-shadow-test-link.patch"
    patch_description: "Only link the shadow test target when the target was registered"
    patch_type: "test"
