package: ydiff/1.5
homepage: "https://github.com/ymattw/ydiff"

upstream_check_command: "python3 -m unittest discover -s tests -p 'test*.py' && tests/regression.sh"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test_ydiff.py
    source: "Official ydiff 1.5 source tag"
    description: "Run the 55 upstream Python unit tests"
    command: "python3 -m unittest discover -s tests -p 'test*.py'"
  - file: tests/regression.sh
    source: "Official ydiff 1.5 source tag"
    description: "Run 144 upstream rendering regression comparisons"
    command: "tests/regression.sh"

test_package_tests:
  - file: test_ydiff.py
    description: "Execute packaged ydiff version, unified stdin and side-by-side stdin checks"
    command: "python3 test_ydiff.py <packaged-ydiff>"

assertion_count: 3
