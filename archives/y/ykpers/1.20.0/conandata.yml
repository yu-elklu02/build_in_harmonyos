    patch_description: "libusb linux_netlink.c sockaddr_storage redefinition guard"
    patch_type: "portability"
  - patch_file: "patches/0007-libusb-linux_usbfs.c.patch"
    patch_description: "libusb linux_usbfs.c HongMeng kernel version detection"
