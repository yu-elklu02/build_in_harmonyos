  - "0005-libusb-configure-umask.patch"
  - "0006-libusb-linux_netlink.c.patch"
  - "0007-libusb-linux_usbfs.c.patch"
  - "0008-libyubikey-configure-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS 需要在 config.guess 中添加 aarch64:HarmonyOS:*:*) case"
  - "TRUE/FALSE 宏在 HarmonyOS 上未定义，需手动添加"
  - "头文件中直接定义变量会导致链接器重复符号错误，需使用 extern"
  - "libusb 在 HarmonyOS 上 linux/netlink.h 引入的 linux/socket.h 会重定义 sockaddr_storage（与 sys/socket.h 冲突），需用 #define 临时重命名符号为 __linux_sockaddr_storage"
