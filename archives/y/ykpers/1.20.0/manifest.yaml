# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://developers.yubico.com/yubikey-personalization/Releases/ykpers-1.20.0.tar.gz"
  sha256: "0ec84d0ea862f45a7d85a1a3afe5e60b8da42df211bb7d27a50f486e31a79b93"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # configure_options 反映 conanfile.py build() 中实际传递给 ykpers ./configure 的关键参数。
  # prefix/libyubikey-prefix/libusb-prefix 均指向 Conan build_folder 下的 staging 目录
  # （由 os.path.join(self.build_folder, "staging") 生成），不是本地 /storage/... 路径。
  configure_options:
    - "--host=aarch64-unknown-linux-gnu"
    - "--prefix=${BUILD_FOLDER}/staging"
    - "--enable-static --disable-shared"
    - "--with-libyubikey-prefix=${BUILD_FOLDER}/staging"
    - "--with-backend=libusb-1.0"
    - "--with-libusb-prefix=${BUILD_FOLDER}/staging"
  # dependencies 分类说明：
  # - libyubikey/1.13 和 libusb/1.0.27 无 OHOS Conan 配方，其上游 tarball 被捆绑到
  #   conandata.yml 中并在 build() 中编译到 staging 目录（bundled-source 模式）。
  # - json-c/0.18 是常规 Conan 依赖（requirements() 中声明），通过 cpp_info 注入路径。
  bundled_dependencies:
    - "libyubikey/1.13"
    - "libusb/1.0.27"
  conan_dependencies:
    - "json-c/0.18"
  # 构建全程仅使用 C 编译器（CC=clang），无 C++ 编译环节。
  cc: clang

# ============================================================
# 补丁信息
