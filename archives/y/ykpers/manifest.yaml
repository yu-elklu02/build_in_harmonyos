software: ykpers

display: "YubiKey Personalization"
description: "Yubico ykpers: libykpers-1 + ykpersonalize/ykchalresp/ykinfo"
category: utility
homepage: "https://developers.yubico.com/yubikey-personalization/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "libyubikey/1.13 and libusb/1.0.27 have no Conan recipes on OHOS; bundled into ykpers conandata.yml and built in-tree (unpaper/FFmpeg, bowtie2/simde pattern)."
    - "libyubikey (2013) and libusb (2022) config.guess do not recognize HarmonyOS; ykpers patched config.guess/config.sub are copied into both bundled deps."
    - "HMDFS umask 077 causes mktemp-d permission errors; ykpers and libusb configure patched umask 077 to 022."
    - "ykpers-args.h usage/optstring changed to extern to fix linker duplicate symbol errors."
    - "HarmonyOS system headers do not define TRUE/FALSE macros; added in ykpers-json.c."
    - "libusb linux_netlink.c sockaddr_storage redefinition conflict guarded with #define."
    - "libusb linux_usbfs.c get_kernel_version() cannot parse HongMeng Kernel X.Y.Z format; HongMeng keyword detection added."
    - "Command-line tool package requires commands.json (R38)."
    - "make -j1 to avoid HMDFS make jobserver mkfifo permission issues."
  common_dependencies:
    - "json-c/0.18"

versions:
  "1.20.0":
    status: built
    build_date: "2026-07-17"