# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: yadm/3.5.0
homepage: "https://yadm.io"

# 上游测试命令 (yadm 使用 pytest + docker，不适用于 Conan 测试环境)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (pytest 测试需要 docker 环境，CI 不执行)
upstream_tests:
  - file: test/test_yadm.py
    source: yadm-3.5.0/test/test_yadm.py
    description: "yadm 上游 pytest 测试套件（需要 docker 环境）"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "烟雾测试：验证 yadm --version 可执行"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
