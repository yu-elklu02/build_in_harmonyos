package: openldap-overlay-rwm/2.6.13
homepage: "https://www.openldap.org/"
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: >-
  tests/run -b ldif <selected-rwm-test> with CONFIG_SHELL, an isolated
  FIFO-capable USER_TESTDIR, and a unique SLAPD_BASEPORT block
upstream_tests:
  - file: tests/scripts/test028-idassert
    count: 1
    command: "tests/run -b ldif test028-idassert"
    description: "LDAP proxy identity assertion with rwm suffix rewriting"
  - file: tests/scripts/test030-relay
    count: 1
    command: "tests/run -b ldif test030-relay"
    description: "Relay and LDAP backend rwm mapping integration"
  - file: tests/scripts/test039-glue-ldap-concurrency
    count: 1
    command: "tests/run -b ldif test039-glue-ldap-concurrency"
    description: "Concurrent glue/LDAP backend rewriting"
  - file: tests/scripts/test047-ldap
    count: 1
    command: "tests/run -b ldif test047-ldap"
    description: "LDAP backend and rwm regression coverage"
  - file: tests/scripts/test079-proxy-timeout
    count: 1
    command: "tests/run -b ldif test079-proxy-timeout"
    description: "Proxy timeout and rwm suffix mapping"
  - file: tests/scripts/test087-librewrite
    count: 1
    command: "tests/run -b ldif test087-librewrite"
    description: "Rewrite engine regression coverage"
  - file: tests/scripts/test088-syncprov-glue-rwm
    count: 1
    command: "tests/run -b ldif test088-syncprov-glue-rwm"
    description: "Dynamic rwm module with syncprov/glue configuration"
  - file: tests/data/regressions/its9468/its9468
    count: 1
    command: "tests/run -b ldif its9468"
    description: "Rwm proxy timeout/no-rebind regression"
upstream_test_portability_changes:
  semantics_changed: false
  description: >-
    The original scripts and assertions are retained. On HMDFS, script and
    helper entry points are invoked through CONFIG_SHELL, test directories use
    group-accessible umask 007, and FIFO-dependent state is placed under a
    capability-probed native temporary directory. LDAP, relay, and syncprov
    are same-source build-only fixtures removed from the final package.
test_package_tests:
  - file: test_rwm.py
    count: 1
    description: "Verify packaged slapd, rwm.so, and core.schema; inspect generated rwm directives; then load the module with slapd -Tt"
    command: "python3 test_rwm.py <slapd> <rwm.so> <slapd-rwm.conf>"
target_runtime_evidence:
  environment: "fresh aarch64 HarmonyOS PC Shadow CI r16i"
  runner: "codex-openldap-overlay-rwm-issue-2044-r16i-final-upstream-tests-20260812-190906-919"
  upstream_identified: 8
  upstream_executed: 8
  upstream_passed: 8
  upstream_failed: 0
  upstream_skipped: 0
  upstream_unexecuted: 0
  upstream_pass_rate: "100%"
  consumer_executed: 1
  consumer_passed: 1
  package_contains_test_fixture_modules: false
test_case_count: 9
assertion_count: 9
