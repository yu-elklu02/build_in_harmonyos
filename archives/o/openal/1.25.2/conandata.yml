sources:
  url: "https://github.com/kcat/openal-soft/archive/refs/tags/1.25.2.tar.gz"
  sha256: "fb27e5839aa11f0e5b9d33756965291fad5d6909ab928ea1f796f4a1a6877894"
patches:
  - patch_file: "patches/0001-guard-empty-hrtf-targets.patch"
    patch_description: "Avoid an empty add_dependencies call when embedded HRTF data is disabled"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-libcpp15-compatibility.patch"
    patch_description: "Use the OHOS libc++15 ranges implementation and portable C++20 fallbacks"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-elements-view-compatibility.patch"
    patch_description: "Use a C++20 transform-based fallback for the missing elements view"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-clang15-compatibility.patch"
    patch_description: "Use portable C++20 constructs accepted by the OHOS Clang 15 frontend"
    patch_type: "portability"
