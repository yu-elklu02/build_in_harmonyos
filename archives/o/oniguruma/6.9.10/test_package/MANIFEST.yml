# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: oniguruma/6.9.10
homepage: "https://github.com/kkos/oniguruma"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_utf8.c
    source: oniguruma-6.9.10/test/test_utf8.c
    description: "UTF-8 encoding regex tests (1529 assertions)"
    command: "./test_utf8"
  - file: test/testc.c
    source: oniguruma-6.9.10/test/testc.c
    description: "Core regex tests (785 assertions)"
    command: "./testc"
  - file: test/test_syntax.c
    source: oniguruma-6.9.10/test/test_syntax.c
    description: "Syntax pattern tests (221 assertions)"
    command: "./test_syntax"
  - file: test/test_options.c
    source: oniguruma-6.9.10/test/test_options.c
    description: "Option behavior tests (47 assertions)"
    command: "./test_options"
  - file: test/testu.c
    source: oniguruma-6.9.10/test/testu.c
    description: "Unicode tests (720 assertions)"
    command: "./testcu"
  - file: test/test_regset.c
    source: oniguruma-6.9.10/test/test_regset.c
    description: "Regex set tests (13 assertions)"
    command: "./test_regset"
  - file: test/test_back.c
    source: oniguruma-6.9.10/test/test_back.c
    description: "Backreference tests (1225 assertions)"
    command: "./test_back"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: compile, init, match, cleanup"
    command: "./test_oniguruma"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4540
