    notes: >-
      首个鸿蒙 PC conan 配方。只做几何内核与数据交换（FoundationClasses/ModelingData/
      ModelingAlgorithms/ApplicationFramework/DataExchange），共 44 个 TK* 库；
      Visualization/Draw/DETools 与 OpenGL/GLES/XLib/VTK/TK/TCL/D3D/OpenVR 全部关闭
      ——它们依赖桌面图形栈或 Windows 专有 API，鸿蒙 PC 上不适用。
      真机 conan create 通过，141 个 .so 的 SONAME 与 DT_NEEDED 全部合规。
