# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openssl/3.5.6
homepage: https://www.openssl.org/

# OpenSSL has `make test` but it's extremely long-running.
# Verification is done through test_package consumer test.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_openssl.c
    description: "OpenSSL 版本号验证 + SHA256 哈希计算 + SSL 库初始化"
    command: "./test_openssl"

# 测试断言总数
assertion_count: 3
