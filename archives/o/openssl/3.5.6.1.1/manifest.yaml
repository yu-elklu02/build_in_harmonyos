# OpenSSL 3.5.6.1.1 编译档案
software: openssl
version: 3.5.6.1.1
status: built
build_system: openssl-perl
compile_date: 2026-08-03

# R37: 3.5.6.1.1 = 3.5.6 + 适配修复
#   制品仓已存在 openssl/3.5.6（recipe+binary, 2026-07-12 发布），
#   修复 build() 缺失 CC=clang 的问题，按 L0j/R37 递增版本后缀。
#   远端已存在 openssl/3.5.6.1（recipe），本地配方仍有修改，再递增到 3.5.6.1.1。

dependencies:
  required: [perl]
  optional: []

build_config:
  target: linux-aarch64
  configure_options:
    - linux-aarch64
    - --prefix=$DEFAULT_PREFIX
    - --openssldir=$DEFAULT_PREFIX/etc/ssl
    - --no-asm
    - --no-shared
    - --with-rand-seed=getrandom
    - CC=clang
  cflags: "-fPIC -pthread -Wa,--noexecstack -Qunused-arguments -O2"

patches_applied:
  - "0001-apps-speed.c.patch"
  - "0002-include-internal-sockets.h.patch"

compatibility:
  level: high
  issues: []
  notes: |
    - OpenSSL 3.5.6 内置 linux-aarch64 target，无需自定义平台配置
    - 本机无 gcc，conan 配方 build() 必须显式传 CC=clang（从 profile compiler_executables 读取）
    - conan create 干净构建通过（no-asm no-shared，静态库，R26 系统同名库隔离）
    - 测试套件因耗时过长记录为 partial（前 1/3 全部 ok，0 失败）

test_results:
  type: manual
  passed: 130
  failed: 0
  skipped: 1
  note: |
    - openssl version: OpenSSL 3.5.6 7 Apr 2026 ✅
    - make test 超时前 130 个测试文件 ok，0 失败（partial）
    - conan-verify G1-G4 + L2/L4/L5 全部通过

knowledge_gained:
  - "OpenSSL 3.5.6 内置 linux-aarch64 target，无需自定义平台配置文件"
  - "openssl Configure 默认选 gcc，无 gcc 环境必须显式传 CC=clang（R33）"
  - "Conan 2.29 支持 core.sources:download_cache，可用 sha256 预置源码包跳过网络"
  - "conan-verify 的 package_id 正则 (\w+/\w+@\w+/\w+):(\w+) 对带点版本号失效，G4/L2/L4/L5 会跳过"

precompiled_package:
  name: openssl-3.5.6.1-ohos-aarch64
  contents:
    - libcrypto.a
    - libssl.a
    - openssl (CLI tool)
    - include/openssl/*.h

references:
  - https://www.openssl.org/source/
  - https://github.com/openssl/openssl/releases/download/openssl-3.5.6/
