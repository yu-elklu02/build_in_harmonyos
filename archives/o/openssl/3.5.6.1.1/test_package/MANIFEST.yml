# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: openssl/3.5.6.1.1
homepage: "https://www.openssl.org/"

# 上游测试命令 (OpenSSL 使用 `make test`，内部是 test/run_tests.pl)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (harness 驱动的 Perl 测试套件，数百个 case)
upstream_tests:
  - file: test/run_tests.pl
    source: openssl-3.5.6/test/run_tests.pl
    description: "OpenSSL 官方测试套件 harness（TLS/加密算法/证书/X509/QUIC 等）"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_openssl.c
    description: "消费者测试：验证 openssl 版本号、SHA256 哈希、SSL_CTX 创建"
    command: "./test_openssl"

# 测试断言总数 (近似值)
assertion_count: 3
