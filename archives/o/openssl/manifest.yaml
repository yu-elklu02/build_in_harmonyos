software: openssl
display: "OpenSSL"
description: "Industry-standard TLS/SSL and cryptographic library"
category: crypto
homepage: "https://www.openssl.org/"
license: "Apache-2.0 (3.x); OpenSSL and SSLeay (1.1.1w)"
build_system: custom-perl

ohos_adaptation:
  key_points:
    - "使用 Perl Configure（大写C），而非 autotools 的 ./configure"
    - "3.5.6 内置 linux-aarch64 target，无需自定义平台配置"
    - "1.1.1w 需使用 no-asm 禁用汇编优化（ARM64汇编在 RSA-PSS 签名验证有 bug）"
    - "HMDFS 不支持 ln -s，Makefile 中需 sed 替换为 cp -a"
    - "核心加密功能完全可用（AES/RSA/TLS 1.3/QUIC）"
    - "许多软件依赖 OpenSSL（Python _ssl、curl、git 等）"
  common_dependencies:
    - perl

versions:
  "1.1.1w":
    status: published
    build_date: "2026-04-12"
    notes: "需使用 openharmony-aarch64 target 和 no-asm 选项"
  "3.5.6":
    status: published
    build_date: "2026-05-19"
    notes: "内置 linux-aarch64 target，测试套件跳过"
  "3.5.6.1":
    status: built
    build_date: "2026-08-03"
    notes: "3.5.6 适配修复（R37）：build() 显式传 CC=clang，conan-verify 全通过"
  "3.5.6.1.1":
    status: built
    build_date: "2026-08-03"
    notes: "3.5.6.1 再递增（远端已占用 3.5.6.1 recipe）：make build_sw -j2 适配 W3 600s 门禁"
