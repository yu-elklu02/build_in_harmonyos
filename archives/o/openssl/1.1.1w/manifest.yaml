software: openssl
version: 1.1.1w
status: success
build_system: custom-perl
compile_date: 2026-08-02

dependencies:
  required: [perl]
  optional: []

build_config:
  target: openharmony-aarch64
  configure_options:
    - --prefix=$package_folder
    - --openssldir=$package_folder/ssl
    - no-asm
    - no-shared
  cflags: "-fPIC"
  env:
    CC: clang

patches_applied:
  - file: 0001-Configurations-openharmony-conf.patch
    purpose: Add OpenHarmony aarch64 Configure target.
  - file: 0002-Configure.patch
    purpose: Use an OHOS-accessible perl shebang.

compatibility:
  level: high
  issues:
    - "OpenSSL 1.1.1w defaults to gcc unless CC is passed to Configure."
    - "Assembly is disabled with no-asm for OHOS portability."
  notes: |
    The recipe passes CC from the Conan/OHOS environment into Configure and
    builds static libssl/libcrypto for OHOS armv8.

test_results:
  type: upstream
  command: "make test"
  upstream_test_entries: 159
  passed: 159
  failed: 0
  note: "build() executes upstream make test; test_package separately runs 3 consumer assertions."

consumer_test:
  command: "conan test_package"
  assertion_count: 3
  passed: 3
  failed: 0
  assertions:
    - OpenSSL version query
    - SHA256 digest calculation
    - SSL context creation

knowledge_gained:
  - "OpenSSL 1.1.1w needs a custom OpenHarmony Configure target."
  - "Configure must receive CC=clang on OHOS; otherwise generated Makefile falls back to gcc."
  - "Official upstream tests must be run through make test instead of reporting a small smoke-test subset as upstream coverage."

references:
  - https://www.openssl.org/source/
  - https://github.com/openssl/openssl/tree/OpenSSL_1_1_1w
