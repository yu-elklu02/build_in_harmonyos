package: openssl/3.5.6.1
homepage: "https://www.openssl.org/"

upstream_check_command: "make test HARNESS_JOBS=1"
upstream_test_in_build: true
upstream_test_command: "make -j1 build_tests"
upstream_tests:
  - file: test/recipes
    description: "OpenSSL upstream Perl test recipe suite"
  - file: test
    description: "OpenSSL C test programs compiled by build_tests"

test_package_tests:
  - file: test_openssl.c
    description: "Exercise version, RAND_bytes entropy, SHA256, and TLS context APIs"
    command: "./test_openssl"
  - file: test_openssl_cli.sh
    description: "Exercise CLI version paths, SHA-256 digest, and random generation"
    command: "sh ./test_openssl_cli.sh"

assertion_count: 10
