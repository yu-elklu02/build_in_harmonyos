software: openh264
description: OpenH264 is a codec library which supports H.264 encoding and decoding
category: multimedia
license: BSD-2-Clause
url: https://github.com/cisco/openh264

versions:
  2.6.0:
    status: built
    date: 2026-07-25
    packaging: conan
    notes: |
      conan 配方（os=OHOS arch=armv8），真机原生 conan create 验证。
      主要消费方 FFmpeg --enable-libopenh264：BSD 许可，不像 x264/x265 那样强制 --enable-gpl。
      test_package 做真实 H.264 编码（EncodeFrame + NAL 累加），非仅版本查询。
    provides:
      - libopenh264.so.7

  2.4.1:
    status: built
    date: 2026-05-22
    notes: Added HarmonyOS platform support

current_version: 2.6.0