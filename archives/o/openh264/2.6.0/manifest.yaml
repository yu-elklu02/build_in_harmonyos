knowledge_gained:
  - 'conan 把 os=OHOS 映射成 meson system=harmonyos，而 meson.build:60 白名单只有 linux/android/ios/darwin → :143 报 FIXME Unhandled system；须把 harmonyos 补进该白名单（OHOS 同为 ELF+POSIX+clang，该分支处理完全适用）'
  - 'conan 的 MesonToolchain 不把 ar/ranlib 写进 native file，meson 按裸名探 llvm-ar 会失败；须把全路径注入 conan_meson_native.ini'
  - '选 openh264 而非 x264：x264/x265 在 FFmpeg 的 EXTERNAL_LIBRARY_GPL_LIST 里，启用会强制 --enable-gpl 使整包变 GPL；openh264 是 BSD 不传染'
  - 'DT_NEEDED 含 libc++_shared.so 属预期（openh264 是 C++ 库），test_package 须用 C++ 编写'
