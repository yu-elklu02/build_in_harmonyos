software: opencv
display: "OpenCV"
description: "Open Source Computer Vision Library"
category: gfx
homepage: "https://opencv.org"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 检测处理器为 'unknown'，需强制禁用 NEON（4.9.0 走自带 3rdparty/libpng 时的问题；4.12.0 改用 conan libpng 后不再出现）"
    - "修改 3rdparty/libpng/CMakeLists.txt 添加 add_definitions(-DPNG_ARM_NEON_OPT=0)"
    - "使用 -DENABLE_NEON:BOOL=OFF 显式指定布尔类型"
    - "OHOS SDK 的 llvm/bin 只有 llvm-ar、没有 llvm-ranlib，而 ohos.toolchain 把 CMAKE_RANLIB 指了过去 → 所有静态库归档报 'Error running link command: no such file or directory'，须显式 -DCMAKE_RANLIB 指到 hnp 下的软链"
    - "OpenCV 交叉编译时会自行禁用 pkg-config，须给 PKG_CONFIG_LIBDIR 或 -DOPENCV_ENABLE_PKG_CONFIG=ON，否则外部库（ffmpeg 等）一律探测不到"
    - "conan PkgConfigDeps 写进 .pc 的 Version 是 conan 包版本，OpenCV 按 libav* 真实 ABI 版本判下限 → 须用 ffmpeg 自带 .pc 覆盖"
    - "G-API 依赖的 ADE 拉不到时 gapi 模块被静默跳过，须预置到 <源码>/.cache/ade/<md5>-<file>"
  common_dependencies:
    - zlib
    - libpng
    - libjpeg
    - ffmpeg

versions:
  "4.12.0":
    status: built
    build_date: "2026-07-27"
    packaging: conan
    notes: |
      - conan 配方（os=OHOS arch=armv8），真机原生 conan create 验证，test_package 14 条断言全绿
      - 15 个模块：calib3d core dnn features2d flann gapi highgui imgcodecs imgproc ml
        objdetect photo stitching video videoio（world 关闭）
      - soname 统一为 libopencv_<模块>.so.412；全部 binary-sign-tool 重签
      - 图像编解码接 conan 依赖：libpng / libjpeg-turbo / libwebp / openjpeg；
        TIFF 与 protobuf(dnn 用) 走 OpenCV 自带 3rdparty 静态内链
      - videoio 接 ffmpeg/7.1.5（libavcodec.so.61 / libavformat.so.61 / libavutil.so.59 /
        libswscale.so.8），VideoWriter→VideoCapture 真机往返验证通过
      - highgui 为 headless（无 X11/GTK/Qt/Wayland，cv::imshow 不可用）
      - 不产命令行工具与语言绑定；JPEG 2000 仅支持 imwrite/imread，不支持 imencode（上游实现限制）
    dependencies:
      - zlib/1.3.1.1
      - libjpeg-turbo/3.2.0
      - libpng/1.6.58
      - libwebp/1.6.0
      - openjpeg/2.5.4
      - eigen/3.4.0
      - ffmpeg/7.1.5
    provides:
      - libopencv_core.so.412
      - libopencv_imgproc.so.412
      - libopencv_imgcodecs.so.412
      - libopencv_videoio.so.412
      - libopencv_dnn.so.412
      - libopencv_gapi.so.412
      - libopencv_calib3d.so.412
      - libopencv_features2d.so.412
      - libopencv_flann.so.412
      - libopencv_highgui.so.412
      - libopencv_ml.so.412
      - libopencv_objdetect.so.412
      - libopencv_photo.so.412
      - libopencv_stitching.so.412
      - libopencv_video.so.412
  "4.9.0":
    status: built
    build_date: "2026-05-25"
