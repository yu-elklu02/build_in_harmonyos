# ADE：G-API（gapi 模块）依赖的图框架。OpenCV 在**配置期**用 ocv_download 从 github 拉它，
# 拉不到就 ocv_module_disable(gapi) 把整个模块静默跳过（既不在 To be built 也不在 Disabled 里）。
# 这里改由 conan 下载（带 sha256 校验，且 CI 对 github.com 有镜像 fallback），再放进 OpenCV
# 自己的下载缓存目录，做到离线可复现。
# filename/md5 必须与 modules/gapi/cmake/DownloadADE.cmake 里写死的一致，否则命不中缓存。
