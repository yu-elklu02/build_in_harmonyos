software: opencv
version: "4.12.0"
build_system: cmake
status: built
source:
  url: "https://github.com/opencv/opencv/archive/refs/tags/4.12.0.zip"
  sha256: "fa3faf7581f1fa943c9e670cf57dd6ba1c5b4178f363a188a2c8bff1eb28b7e4"
knowledge_gained:
  - "OHOS SDK 的 llvm/bin 只有 llvm-ar、没有 llvm-ranlib，而 ohos.toolchain 却把 CMAKE_RANLIB 指过去：cmake 造静态库走 `AR qc && RANLIB`，表现为「.o 全编得动、一造 .a 就报 Error running link command: no such file or directory」。须显式 -DCMAKE_RANLIB=/data/service/hnp/bin/llvm-ranlib（该软链指向 llvm-ar，LLVM 工具按 argv[0] 改行为）。"
  - "OpenCV 交叉编译时会自己禁用 pkg-config（顶层 CMakeLists.txt:704），只给 PKG_CONFIG_PATH 不满足豁免条件，须给 PKG_CONFIG_LIBDIR 或 -DOPENCV_ENABLE_PKG_CONFIG=ON，否则 ocv_check_modules 一次都不跑、外部库全判 NO。"
  - "conan 的 PkgConfigDeps 给每个 .pc 写的 Version 是 conan 包版本（ffmpeg 写 7.1.5），而消费方常按库的真实 ABI 版本判下限（OpenCV 要 libavcodec>=54.35.0）→ 出现「各子库全 YES、总判却 NO」的自相矛盾。修法是用依赖包自带的 .pc 覆盖，仅重写 prefix= 一行。"
  - "OpenCV 的 G-API 依赖 ADE，由配置期 ocv_download 拉取；拉不到则 ocv_module_disable(gapi)，该模块既不出现在 To be built 也不出现在 Disabled，极易被忽略。可预置到 <源码>/.cache/<小写ID>/<md5>-<filename> 实现离线可复现。"
  - "OpenCV 的 ocv_clear_internal_cache_vars 只清 TYPE=INTERNAL 的缓存项，命令行 -D 建的是 UNINITIALIZED，因此「预设 Find 模块结果缓存变量」绕过交叉链 FIND_ROOT_PATH_MODE=ONLY 的手法对 OpenCV 成立。"
