software: opusfile
display: "opusfile"
description: "High-level Ogg Opus decoding, seeking, and URL access library"
category: library
homepage: "https://opus-codec.org/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Patch bundled config.guess and config.sub for aarch64-linux-ohos"
    - "Build real unversioned shared objects with Libtool -avoid-version"
    - "Keep HTTP and HTTPS support enabled through OpenSSL"
  common_dependencies:
    - "libogg/1.3.5"
    - "opus/1.5.2.1"
    - "openssl/3.5.6"

versions:
  "0.12":
    status: built
    build_date: "2026-07-21"
    build_type: conan-autotools
