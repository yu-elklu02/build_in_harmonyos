sources:
  "0.3.28":
    url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28.tar.gz"
    sha256: "f1003466ad074e9b0c8d421a204121100b0751c96fc6fcf3d1456bd12f8a00a1"
patches:
  "0.3.28":
    - patch_file: "patches/0001-ohos-flangnew-shared-link.patch"
      patch_description: "exports/Makefile 补 FLANGNEW 共享库链接分支。0.3.28 只有 FLANG 分支，FLANGNEW 会落到通用 else——那里虽已用 $(CC) 链接（正合所需），却不带 $(FEXTRALIB)，flang-rt/decimal 链不进 .so，导致 _FortranA* 未定义。补一个显式分支，与 0.3.29+ 上游结构一致。"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-musl-affinity.patch"
      patch_description: "OHOS musl 可移植性：openblas_setaffinity/getaffinity 加 !defined(__OHOS__) 守卫。OHOS musl 的 libc.so 不导出 pthread_setaffinity_np（仅 libc.a 有），NO_AFFINITY 挡不住这两个 OS_LINUX 函数。"
      patch_type: "portability"
