software: openblas
version: "0.3.28"
status: built
build_date: "2026-07-29"
build_system: makefile

source:
  url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28.tar.gz"
  sha256: "f1003466ad074e9b0c8d421a204121100b0751c96fc6fcf3d1456bd12f8a00a1"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  fc: flang
  # 设备原生：tool_requires flang-ohos/20.1.0 提供 Fortran 编译器编真 LAPACK
  make_args:
    - "TARGET=ARMV8"
    - "BINARY=64"
    - "F_COMPILER=FLANGNEW"
    - "NOFORTRAN=0"
    - "NO_SHARED=0"
    - "shared"
  dependencies: []
  tool_requires:
    - flang-ohos/20.1.0

patches_count: 2

knowledge_gained:
  - "OpenBLAS 0.3.28 的 f_check 与 Makefile.system 已支持 FLANGNEW（f_check:113 判 flang 主版本 ≥17），但 exports/Makefile 的 .so 链接规则只有 FLANG 分支、没有 FLANGNEW（0.3.29+ 才补）。FLANGNEW 会落到通用 else——那里已用 $(CC) 链接（正确），但不带 $(FEXTRALIB)，flang 运行时链不进 .so，报一堆 _FortranA* 未定义。须补显式 FLANGNEW 分支。"
  - "本仓旧的 0.3.28 配方传了 -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON，注释称『鸿蒙 HMDFS 不支持建符号链接』——该前提经实测不成立（同设备同目录下 ffmpeg/poppler/openblas 0.3.34 都正常建出两级版本软链）。误诊的代价是 SONAME 变成无版本的 libopenblas.so，不合上游惯例（应为 libopenblas.so.0），按 .so.0 查找的消费方会落空。"
  - "NOFORTRAN=ON + C_LAPACK=ON（f2c 翻译版 LAPACK）与真 Fortran LAPACK 的导出函数符号相差 1161 个（6353 vs 7514，均以 nm -D | grep ' T ' 同口径测量）。判断某个 OpenBLAS 制品是否『全』，数导出符号最直接——但务必前后用同一个工具：nm -D 只数已定义的 T 符号，readelf --dyn-syms 会把未定义/导入的 FUNC 一并算进去，两者相差几百个，混用会得出错误结论。"
  - "OpenBLAS 库实名编码了构建配置：libopenblas_<TARGET><线程后缀>-r<版本>.so。armv8p 即 TARGET=ARMV8 + pthread。PyPI 上 cvxopt/numpy 等 aarch64 wheel 内嵌的正是这种命名。"
