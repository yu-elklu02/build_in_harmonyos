sources:
  "0.3.34":
    url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.34/OpenBLAS-0.3.34.tar.gz"
    sha256: "cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed"
patches:
  "0.3.34":
    - patch_file: "patches/0001-ohos-flangnew-shared-link.patch"
      patch_description: "OHOS 交叉：exports/Makefile 的 FLANGNEW so 分支改用 $(CC) 链接 + 追加 $(FEXTRALIB)(flang-rt)。原用 $(FC)=flang 当交叉链接器会塞入 host 的 libLTO.dylib/libunwind/flang_rt 导致链接失败。"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-musl-affinity.patch"
      patch_description: "OHOS musl 可移植性：openblas_setaffinity/getaffinity 加 !defined(__OHOS__) 守卫。OHOS musl 的 libc.so 不导出 pthread_setaffinity_np(仅 libc.a 有)，NO_AFFINITY 挡不住这两个 OS_LINUX 函数。"
      patch_type: "portability"
