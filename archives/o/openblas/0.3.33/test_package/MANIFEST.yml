# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openblas/0.3.33
homepage: "https://github.com/OpenMathLib/OpenBLAS"

# conanfile.py build() 方法中已集成上游测试（_run_upstream_tests 在构建期内
# 真实构建+执行 utest/ctest，非手工替代）
upstream_test_in_build: true
upstream_test_command: "make -C utest && ./openblas_utest && ./openblas_utest_ext && make -C ctest all"

upstream_tests:
  - name: utest (C)
    source: "utest/ (openblas_utest + openblas_utest_ext)"
    case_basis: "1650 项（128 + 1522），已在 conan build 流程内真实执行"
    result: "1650/1650 通过（0 failed，0 skipped，exit=0）"
  - name: ctest/CBLAS (C)
    source: "ctest/ (xscblat1/2/3、xdcblat1/2/3、xccblat1/2/3、xzcblat1/2/3)"
    case_basis: "12 个可执行（level-2/3 以上游 sin2/din2/cin2/zin2、sin3/din3/cin3/zin3 输入）"
    result: "12/12 通过（全部 exit=0）"
  - name: test/ Fortran BLAS
    source: "test/ (14 个 .f 主程序)"
    case_basis: "14 项"
    result: "未执行——OHOS/aarch64 环境没有 gfortran/flang/flang-new；flang-ohos/20.1.0 从 ohpcd 下载返回 HTTP 404"
  - name: lapack-netlib Fortran
    source: "lapack-netlib/ (INSTALL 25 .f、BLAS/TESTING 12 .f、TESTING 1206 .f)"
    case_basis: "1243 项"
    result: "未执行——同上缺 Fortran 编译器（gfortran/flang/flang-new 不可用，flang-ohos 404）"

external_integration_note: >-
  可执行的 C 上游测试 1662/1662 通过（utest 1650 + ctest/CBLAS 12）；
  Fortran 上游测试 1257 项未执行（test/ 14 + lapack-netlib 1243）；
  当前上游完整测试通过率：N/A（未将未执行测试标记为通过，不得写成 100%）；
  恢复条件：待 OHOS Fortran 编译器及运行时可用后执行 make blas-test、make lapack-test。

test_package_tests:
  - file: test.c
    description: "适配后测试（独立于上游测试统计）：直接链接 libopenblas 并做真实数值计算——CBLAS 的 cblas_dgemm，LAPACK 的 dgesv_(解线性方程组)/dpotrf_(Cholesky)，LAPACKE 的 LAPACKE_dgesv，逐项校验计算结果而非仅解析符号；另核对 openblas_get_config() 的版本串含 0.3.33"
    command: "./test_probe"

assertion_count: 5
