software: openblas
version: "0.3.33"
status: built
build_system: makefile
build_date: 2026-04-27

source:
  url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.33/OpenBLAS-0.3.33.tar.gz"
  sha256: "6761af1d9f5d353ab4f0b7497be2643313b36c8f31caec0144bfef198e71e6ab"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  make_args:
    - "TARGET=ARMV8"
    - "BINARY=64"
    - "NOFORTRAN=1"
    - "NO_SHARED=0"
    - "NO_AFFINITY=1"
    - "shared"

patches_applied:
  - "patches/0002-ohos-musl-affinity.patch"

knowledge_gained:
  - "NOFORTRAN=1 是官方主变量（Makefile.system:387 自动置 C_LAPACK=1）；NO_FORTRAN 仅是顶层 Makefile 的别名包装，不作为主要配置变量"
  - "blas_server.c 的 openblas_setaffinity/getaffinity 由通用能力宏 HAVE_PTHREAD_SETAFFINITY_NP 门控（构建期编译+链接探测产生，无平台宏）；musl 工具链（如 OHOS）libc.so 不导出 pthread_setaffinity_np/getaffinity_np 且该段不受 NO_AFFINITY 保护，探测失败则不编译该段以避免链接错误"
  - "make jobserver 在 hmdfs 上 mkfifo 失败（Operation not permitted）仅是警告，-j20 仍并行，不影响产物"
  - "上游测试（真实数据）：可执行的 C 上游测试 1662/1662 通过（utest 1650 + ctest/CBLAS 12，已在 conan build 流程内真实执行）；Fortran 上游测试 1257 项未执行（test/ 14 + lapack-netlib 1243），原因：当前 OHOS/aarch64 执行环境没有 gfortran/flang/flang-new，flang-ohos/20.1.0 从 ohpcd 下载返回 HTTP 404；上游完整测试通过率 N/A（未将未执行测试标记为通过）；适配后 test_package 1 个可执行文件 5 项断言 5/5（100%，独立统计）；恢复条件：OHOS Fortran 编译器可用后执行 make blas-test/make lapack-test"

local_ci:
  w3: "通过"
  reason: "W3 本地 CI 模拟通过（外层 timeout=3300s = 内层 2700s + 600s 余量）；conan create 成功、test_package 5/5、L0/L1/L4/L5 通过、L2 因纯库无 bin 正常 skip；finish exit 0（.ci-result.json exit_code=0 真实生成）"
  detail: "全新构建目录/清理 Conan 缓存后重验证：conan create ✅、conan-verify ✅（G1-G4、L2/L4/L5）、test_package 5/5 ✅、finish EXIT_CODE=0 ✅、W3 本地 CI 模拟通过 ✅；上游测试集成到 conan build 流程内执行（utest 128+1522 用例、ctest 12 个 CBLAS 可执行全部通过）；Fortran 测试因设备无 gfortran/flang 未执行（真实跳过，见 knowledge_gained）"
