patches:
  "0.3.33":
    - patch_file: "patches/0002-ohos-musl-affinity.patch"
      patch_description: "portability：openblas_setaffinity/getaffinity 由通用能力宏 HAVE_PTHREAD_SETAFFINITY_NP 门控（#if defined(OS_LINUX) && defined(HAVE_PTHREAD_SETAFFINITY_NP)）。该宏由构建期真实编译+链接探测决定是否定义（conanfile.py _probe_pthread_setaffinity）：musl 工具链（如 OHOS）的 libc.so 不导出 pthread_setaffinity_np/getaffinity_np（仅 libc.a 有），NO_AFFINITY 挡不住这两个 OS_LINUX 函数；探测失败时不定义宏、affinity 代码不编译，避免 ld.lld --no-allow-shlib-undefined undefined reference。不使用 __OHOS__/OHOS 等平台条件宏。"
      patch_type: "portability"
