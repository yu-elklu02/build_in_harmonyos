software: openblas
display: "OpenBLAS"
description: "Optimized BLAS (Basic Linear Algebra Subprograms) library based on GotoBLAS2"
category: foundation
homepage: "https://github.com/OpenMathLib/OpenBLAS"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "高价值基础数学库，许多科学计算和机器学习框架依赖"
    - "使用 make 构建系统（非 autotools/cmake）"
    - "需要设置 TARGET=ARMV8 和 HOSTCC=gcc"
    - "务必编真 Fortran LAPACK（tool_requires flang-ohos）。用 NOFORTRAN=ON + C_LAPACK=ON 的 f2c 翻译版会少 1161 个导出函数符号（6353 vs 7514，nm -D 同口径实测）"
    - "别传 -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON。鸿蒙可正常建符号链接（ffmpeg/poppler/openblas 均已实证），关掉它会让 SONAME 退化成无版本的 libopenblas.so，不合上游惯例（应为 libopenblas.so.0）"
    - "库实名编码了构建配置：libopenblas_<TARGET><线程后缀>-r<版本>.so，如 armv8p = ARMV8 + pthread。PyPI 上 numpy/scipy/cvxopt 的 aarch64 wheel 内嵌的正是这种命名"

versions:
  "0.3.34":
    status: built
    build_date: "2026-07-24"
    notes: "含完整 LAPACK；tool_requires flang-ohos/20.1.0 提供 Fortran 编译器；numpy 2.5.1 已验证"
  "0.3.28":
    status: built
    build_date: "2026-07-29"
    notes: >-
      与 0.3.34 同法（make + flang 真 LAPACK）重做。选此版本是因为 PyPI 上 cvxopt 1.3.3
      的 aarch64 wheel 内嵌的正是 libopenblas_armv8p-r0.3.28.so，本配方产出的库实名与之
      逐字一致。取代此前 cmake + C_LAPACK 的旧配方（导出符号仅 6353，无静态库、无版本软链）
  "0.3.33":
    status: partial
    build_date: "2026-04-27"
