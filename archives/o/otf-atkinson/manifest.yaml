# 软件级 manifest 模板
# 文件位置: archives/o/otf-atkinson/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: otf-atkinson

# 显示名
display: "Atkinson Hyperlegible Fonts"

# 一句话描述
description: "Atkinson Hyperlegible OTF font family — enhanced legibility for low vision readers by Braille Institute"

# 分类标签
category: data

# 官网 URL
homepage: "https://github.com/googlefonts/atkinson-hyperlegible"

# 开源许可证（SPDX 标识）
license: OFL-1.1

# ============================================================
# 构建信息
# ============================================================

build_system: none

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "字体资源型数据包，无 build 步骤，package() 直接安装 .otf 文件到 share/fonts/OTF/"
    - "license 文件 (OFL.txt) 安装到 licenses/ 目录"
    - "test_package 使用 Python struct 自解析 OpenType name table 和 cmap，不依赖外部工具"
    - "上游无测试用例，PR 中测试通过率写 0/0 (N/A)"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.006":
    status: built
    build_date: 2026-07-28
