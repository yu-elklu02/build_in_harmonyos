# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ossp-uuid/1.6.2
homepage: "https://www.ossp.org/pkg/lib/uuid/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_dev.c
    source: ossp-uuid-1.6.2/test_dev.c
    description: "ossp-uuid development test program (generates and decodes UUID v1/v3/v4/v5)"
    command: "./test_dev"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建并生成v4 UUID, 导出为字符串, 验证长度"
    command: "./test_ossp-uuid"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
