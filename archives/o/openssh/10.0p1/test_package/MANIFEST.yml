# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: openssh/10.0p1
homepage: "https://www.openssh.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (openssh 有 regress/ 测试套件，但需要交互式环境)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "ELF 二进制检查 + ssh-keygen 执行验证"
    command: "conan test"
  - file: test.sh
    description: "ELF 魔数验证脚本"
    command: "sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
