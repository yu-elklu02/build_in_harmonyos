sources:
  url:
    - "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.0p1.tar.gz"
    - "https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.0p1.tar.gz"
  sha256: "021a2e709a0edf4250b1256bd5a9e500411a90dddabea830ed59cef90eb9d85c"

patches:
  - patch_file: "patches/0002-misc.c.patch"
    patch_description: "Skip safe_path file/directory permission checks on OHOS (HMDFS does not support chmod)"
    patch_type: "portability"
  - patch_file: "patches/0003-sshd-session.c.patch"
    patch_description: "Add OPENSSH_HOME env var support for resolving sshd-auth path at runtime"
    patch_type: "feature"
  - patch_file: "patches/0004-sshd.c.patch"
    patch_description: "Skip argv[0] absolute path check and add OPENSSH_HOME env var support for portable deployment"
    patch_type: "feature"
  - patch_file: "patches/0005-openbsd-compat-port-net.c.patch"
    patch_description: "Avoid linux/if.h header conflict on OHOS by using net/if.h instead"
    patch_type: "portability"
  - patch_file: "patches/0006-config.guess.patch"
    patch_description: "Add HarmonyOS platform detection to config.guess"
    patch_type: "portability"
  - patch_file: "patches/0007-config.sub.patch"
    patch_description: "Add OHOS triplet support to config.sub"
    patch_type: "portability"
  - patch_file: "patches/0008-includes.h.patch"
    patch_description: "Fix sockaddr_storage conflict between linux/socket.h and sys/socket.h on OHOS"
    patch_type: "portability"
