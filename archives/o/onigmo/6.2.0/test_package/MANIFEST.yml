package: onigmo/6.2.0
homepage: "https://github.com/k-takata/Onigmo"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check && make test_enc_utf8 && ./test_enc_utf8"
upstream_tests:
  - file: testc.c
    source: onigmo-6.2.0/testc.c
    description: "Onigmo C API and encoding regression suite"
    command: "./testc"
  - file: testp.c
    source: onigmo-6.2.0/testp.c
    description: "Onigmo POSIX API regression suite"
    command: "./testp"
  - file: testu.c
    source: onigmo-6.2.0/testu.c
    description: "Onigmo Unicode regression suite"
    command: "./testcu"
  - file: test_enc_utf8.c
    source: onigmo-6.2.0/test_enc_utf8.c
    description: "Onigmo UTF-8 encoding regression suite"
    command: "./test_enc_utf8"
test_package_tests:
  - file: test.c
    description: "Link against the packaged library and verify its public version API"
    command: "test_onigmo"
assertion_count: 2097
