sources:
  url: "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-7.5p1.tar.gz"
  sha256: "9846e3c5fab9f0547400b4d2c017992f914222b3fd1f8eee6c7dc6bc5e59f9f0"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "Allow Autoconf config.sub to accept linux-ohos triplets"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask.patch"
    patch_description: "Avoid umask 077 temporary directories on OHOS HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0003-openssl-1.1-accessors.patch"
    patch_description: "Use OpenSSL 1.1 RSA, DSA, and DH accessor APIs"
    patch_type: "portability"
  - patch_file: "patches/0004-xcrypt-guard-getspnam.patch"
    patch_description: "Guard getspnam call with HAVE_GETSPNAM for OHOS sysroot"
    patch_type: "portability"
  - patch_file: "patches/0005-test_sshkey-banana-typo.patch"
    patch_description: "Pass the_banana array not banana function pointer to memcpy"
    patch_type: "portability"

