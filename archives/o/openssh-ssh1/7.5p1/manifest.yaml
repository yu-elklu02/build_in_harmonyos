software: openssh-ssh1
version: "7.5p1"
status: built
compile_date: "2026-08-01"
build_system: autotools

source:
  url: "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-7.5p1.tar.gz"
  sha256: "9846e3c5fab9f0547400b4d2c017992f914222b3fd1f8eee6c7dc6bc5e59f9f0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-zlib=<conan:zlib>"
    - "--with-ssl-dir=<conan:openssl>"
    - "--with-sandbox=no"
    - "--without-zlib-version-check"
    - "--without-openssl-header-check"
    - "--disable-utmp"
    - "--disable-utmpx"
    - "--disable-wtmp"
    - "--disable-wtmpx"
    - "--disable-lastlog"
  dependencies:
    - zlib/1.3.1.1
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

test:
  upstream:
    command: "make tests"
    cases: 14
    source: "regress/Makefile REGRESS_TARGETS"
  test_package:
    command: "ssh -1 accepts SSH protocol 1 mode and ssh-keygen creates an RSA1 key pair"
    cases: 3

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-umask.patch"
  - "0003-openssl-1.1-accessors.patch"
  - "0004-xcrypt-guard-getspnam.patch"
  - "0005-test_sshkey-banana-typo.patch"

knowledge_gained:
  - "Autotools config.sub from OpenSSH 7.5p1 needs linux-ohos triplet support."
  - "OHOS HMDFS can make umask 077 temporary directories unusable; configure temp creation must avoid the strict umask."
  - "OpenSSH portable on OHOS should disable unsupported sandbox and login accounting integrations."
  - "OpenSSL 1.1.0 and later make RSA and DSA structures opaque, including 1.1.1w; OpenSSH 7.5p1 therefore needs RSA/DSA/DH accessor calls instead of direct member dereferences."
  - "OHOS sysroot ships <shadow.h> with struct spwd but no getspnam; configure must force ac_cv_header_shadow_h=no so defines.h never sets USE_SHADOW and the shadow branches fall through."
  - "OpenSSH 7.5p1 Makefile links final executables with LD directly; on OHOS this must be overridden to the clang driver and libcrypt probing disabled because old.lld cannot consume clang-driver flags and OHOS has no separate libcrypt."
  - "OHOS SELinux MAC denies execution of any ELF whose seclabel is u:object_r:hmdfs:s0 (conan cache lands here); only u:object_r:hnp_file:s0 partitions are executable but unwritable. Static linking cannot bypass this; test_package must skip execution on OHOS."
