software: openssh-ssh1
version: "7.5p1"
status: built
compile_date: "2026-08-01"
build_system: autotools

source:
  url: "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-7.5p1.tar.gz"
  sha256: "9846e3c5fab9f0547400b4d2c017992f914222b3fd1f8eee6c7dc6bc5e59f9f0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-zlib=<conan:zlib>"
    - "--with-ssl-dir=<conan:openssl>"
    - "--with-sandbox=no"
    - "--without-zlib-version-check"
    - "--without-openssl-header-check"
    - "--disable-utmp"
    - "--disable-utmpx"
    - "--disable-wtmp"
    - "--disable-wtmpx"
    - "--disable-lastlog"
  dependencies:
    - zlib/1.3.1.1
    - openssl/3.5.6
  cc: clang
  cxx: clang++

test:
  upstream:
    command: "make tests"
    cases: 14
    source: "regress/Makefile REGRESS_TARGETS"
  test_package:
    command: "ssh-keygen creates an Ed25519 key pair and asserts both files are non-empty"
    cases: 1

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-umask.patch"

knowledge_gained:
  - "Autotools config.sub from OpenSSH 7.5p1 needs linux-ohos triplet support."
  - "OHOS HMDFS can make umask 077 temporary directories unusable; configure temp creation must avoid the strict umask."
  - "OpenSSH portable on OHOS should disable unsupported sandbox and login accounting integrations."

