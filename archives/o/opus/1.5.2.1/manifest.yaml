knowledge_gained:
  - 'opus 头装在 include/opus/，上游 opus.pc 是 Cflags: -I${includedir}/opus，消费方按 #include <opus.h> 不带前缀写；包必须设 cpp_info.includedirs = ["include/opus","include"]，否则消费方编译期找不到头'
  - 'FFmpeg 报 "opus not found using pkg-config" 具误导性：pkg-config 找得到，失败的是随后的 check_func_headers 编译探测'
