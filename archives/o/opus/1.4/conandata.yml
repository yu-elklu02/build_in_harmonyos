sources:
  "1.4":
    url: "https://downloads.xiph.org/releases/opus/opus-1.4.tar.gz"
    sha256: "c9b32b4253be5ae63d1ff16eea06b94b5f0f2951b7a02aceef58e3a3ce49c51f"
patches:
  "1.4":
    - patch_file: "patches/0001-meson-build-order.patch"
      patch_description: "0001 configure CELT before SILK in Meson"
      patch_type: "portability"
    - patch_file: "patches/0002-meson-python-commands.patch"
      patch_description: "0002 invoke Meson source helpers through Python"
      patch_type: "portability"
    - patch_file: "patches/0003-meson-version-commands.patch"
      patch_description: "0003 invoke Meson version helpers through Python"
      patch_type: "portability"
    - patch_file: "patches/0004-meson-version-spacing.patch"
      patch_description: "0004 preserve Meson version block spacing"
      patch_type: "portability"
    - patch_file: "patches/0005-src-meson-kwargs-guard.patch"
      patch_description: "0005 omit versioned shared library names on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0006-src-meson-kwargs-spacing.patch"
      patch_description: "0006 preserve Meson library guard spacing"
      patch_type: "portability"
    - patch_file: "patches/0007-src-meson-version-kwargs.patch"
      patch_description: "0007 route shared library versions through kwargs"
      patch_type: "portability"
    - patch_file: "patches/0008-src-meson-library-kwargs.patch"
      patch_description: "0008 pass guarded version kwargs to the Opus library"
      patch_type: "portability"
    - patch_file: "patches/0009-src-meson-library-spacing.patch"
      patch_description: "0009 preserve Meson library declaration spacing"
      patch_type: "portability"
