# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance
package: optipng/7.9.1
homepage: "https://optipng.sourceforge.net/"

# Upstream test command (make check / make test)
upstream_check_command: "make test"

# conanfile.py build() does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests actually run (from make test)
upstream_tests:
  - file: src/optipng/testprog/bitset_test.c
    source: optipng-7.9.1/src/optipng/testprog/bitset_test.c
    description: "Bitset data structure unit test"
    command: "./bitset_test"
  - file: src/optipng/testprog/ratio_test.c
    source: optipng-7.9.1/src/optipng/testprog/ratio_test.c
    description: "Compression ratio computation test"
    command: "./ratio_test"
  - file: src/optipng/testimg/pngtest.png
    source: optipng-7.9.1/src/optipng/testimg/pngtest.png
    description: "Smoke test: optimize a test PNG and verify idempotency"
    command: "./optipng -o1 -q --clobber testimg/pngtest.png --out=pngtest.out.png"

# test_package tests (consumer-perspective verification)
test_package_tests:
  - file: test.sh
    description: "End-to-end: verify --version and PNG optimization"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 5
