software: osmctools
display: "osmctools"
description: "Fast OpenStreetMap data conversion/filter/update CLI tools (osmconvert, osmfilter, osmupdate)"
category: utility
homepage: "https://gitlab.com/osm-c-tools/osmctools"
license: AGPL-3.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "上游 0.9 GitLab tag archive 仅含 configure.ac + Makefile.am + 3 个 .c，无预生成 configure/Makefile.in"
    - "OHOS 真机工具链有 autoconf 2.72 但无 automake/aclocal，autoreconf --install 会失败"
    - "绕开 autotools bootstrap：三个 .c 均为单文件实现，直接 clang 编译即可（上游头注释推荐 gcc osmconvert.c -lz -O3 -o osmconvert）"
    - "osmconvert � zlib(-lz，gzopen/gzread/gzseek/gzclose)+libm(-lm，sin/cos)；osmfilter/osmupdate 仅 libc"
    - "osmconvert.c 内另两个 int main() 位于 #if 0 块（预处理器排除），无符号冲突"
    - "不使用 -Werror（E063）；上游 0.9 无任何测试套件，test_package 为消费者 smoke + 功能实测"
  common_dependencies:
    - zlib

versions:
  "0.9":
    status: built
    build_date: "2026-07-29"
    published_as: osmctools
    source_url: "https://gitlab.com/osm-c-tools/osmctools/-/archive/0.9/osmctools-0.9.tar.gz"
