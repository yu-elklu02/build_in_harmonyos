software: osmctools
build_system: custom
# 文件位置: archives/{letter}/{name}/0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitLab 上游 tag 0.9 官方 archive）
  url: "https://gitlab.com/osm-c-tools/osmctools/-/archive/0.9/osmctools-0.9.tar.gz"
  # 源码校验和
  sha256: "2f5298be5b4ba840a04f360c163849b34a31386ccd287657885e21268665f413"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # custom = 直接编译三个单文件 .c（绕开 autotools bootstrap）
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

  # 环境变量
  env:
    TMPDIR: "$HOME/tmp"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 0.9 GitLab tag archive 仅含 configure.ac + Makefile.am + 3 个 .c，无预生成 configure/Makefile.in"
  - "OHOS 真机工具链有 autoconf 2.72 但无 automake/aclocal，autoreconf --install 会以 'Can't exec aclocal' 失败"
  - "绕开 autotools bootstrap：osmconvert.c/osmfilter.c/osmupdate.c 均为单文件实现，直接 clang -c 编译即可（上游头注释即推荐 gcc osmconvert.c -lz -O3 -o osmconvert）"
  - "osmconvert.c 内有两个 int main() 位于 #if 0 块（cosrk.c/cosr.c 独立测试程序），预处理器排除后无符号冲突，真正 main 在 line 12602"
  - "osmconvert 链 zlib(-lz，gzopen/gzread/gzseek/gzclose)+libm(-lm，sin/cos)；osmfilter/osmupdate 仅 libc"
  - "不使用 -Werror（configure.ac 原有 AM_INIT_AUTOMAKE([foreign -Wall -Werror]) 会因 libc 头差异失败，E063）"
  - "HMDFS 不支持 mkfifo jobserver，但直接编译三个独立可执行文件无并行需求，无需 -j1 特殊处理"
