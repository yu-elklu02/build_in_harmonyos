# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: osmctools/0.9
homepage: "https://gitlab.com/osm-c-tools/osmctools"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: osmctools-0.9.tar.gz, sha256 2f5298be5b4ba840a04f360c163849b34a31386ccd287657885e21268665f413)
upstream_test_audit:
  source_tarball: "osmctools-0.9.tar.gz"
  source_sha256: "2f5298be5b4ba840a04f360c163849b34a31386ccd287657885e21268665f413"
  top_level_files:
    - configure.ac        # AC_CONFIG_FILES 列表仅 Makefile + src/Makefile, 无 tests/ 目录; 无 check 目标
    - Makefile.am         # 仅 SUBDIRS = src, 无 TESTS / check
    - src/Makefile.am     # 仅 bin_PROGRAMS = osmconvert/osmfilter/osmupdate, 无 check_PROGRAMS / TESTS
    - src/osmconvert.c    # 纯实现源, 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - src/osmfilter.c     # 纯实现源
    - src/osmupdate.c     # 纯实现源
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check target"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest / meson test 目标"
  scan_result: "0 matches — 上游仅含 3 个 C 实现 (osmconvert.c/osmfilter.c/osmupdate.c) + configure.ac/Makefile.am, 无任何测试代码或测试目录"
  make_check_output: "make check => 'Nothing to be done for 'check' in src' (无 check 目标)"
  reason: "osmctools 0.9 为纯 CLI 工具集, 上游 GitLab tag archive 不含任何测试套件, configure.ac/Makefile.am 无 check 目标, 无测试源文件"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件，故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke + 功能测试: osmconvert/osmfilter/osmupdate --help + osmconvert .osm→.o5m 转换 + osmfilter highway 标签过滤"
    command: "bash test.sh <osmctools_binary_dir>"
  - file: conanfile.py
    description: "Conan test() 入口, 调用 test.sh 运行三个二进制实测"
    command: "conan test test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
