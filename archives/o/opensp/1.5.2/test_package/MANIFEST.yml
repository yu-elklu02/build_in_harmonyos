# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: opensp/1.5.2
homepage: https://openjade.sourceforge.net/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# OpenSP 上游 tests/ 包含 20+ 个测试用例
upstream_tests:
  - file: tests/Makefile.am
    source: OpenSP/tests
    description: "OpenSP 上游测试 — SGML 解析/验证/规范化（约 20 个测试用例）"
    command: "make check"
    condition: "native 编译时执行，交叉编译跳过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 nsgmls、sgmlnorm、sx、spam 等二进制存在于 package 中"
    command: "conan create (test_package _check_binary_exists)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4