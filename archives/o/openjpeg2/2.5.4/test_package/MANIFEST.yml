package: openjpeg2/2.5.4
homepage: "https://github.com/uclouvain/openjpeg"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: >-
  ctest --output-on-failure && test_sparse_array &&
  bench_dwt -size 256 -offset 127 127 -num_resolutions 6 -check

upstream_tests:
  - file: tests/
    source: openjpeg-2.5.4/tests/
    description: >-
      The focused core-library build executes 26 self-contained upstream codec
      tests without building codec applications or optional image backends. It
      also executes both internal programs controlled by BUILD_UNIT_TESTS. Four
      legacy tests under tests/unit remain excluded: testjp2 needs openjpeg-data,
      while testempty0/1/2 are not part of the self-contained core gate.
    command: >-
      ctest --output-on-failure && test_sparse_array &&
      bench_dwt -size 256 -offset 127 127 -num_resolutions 6 -check
    total: 28
    upstream_total: 32
    coverage: "87.5%"
    passed: 28

test_package_tests:
  - file: test_openjpeg2.c
    description: "Lossless 2x2 grayscale J2K encode/decode consumer round trip."
    command: "./test_openjpeg2"

assertion_count: 6
