# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: orocos-kdl/1.5.3
homepage: "https://orocos.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DENABLE_TESTS=ON .. && make && ctest"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (需 cppunit 依赖)
upstream_tests:
  - file: tests/framestest.cpp
    source: orocos_kdl/tests/framestest.cpp
    description: "Frame arithmetic tests"
    command: "./framestest"
  - file: tests/kinfamtest.cpp
    source: orocos_kdl/tests/kinfamtest.cpp
    description: "Kinematics family tests (Chain construction and FK)"
    command: "./kinfamtest"
  - file: tests/solvertest.cpp
    source: orocos_kdl/tests/solvertest.cpp
    description: "Solver tests (FK, IK, Jacobian)"
    command: "./solvertest"
  - file: tests/inertiatest.cpp
    source: orocos_kdl/tests/inertiatest.cpp
    description: "Inertia computation tests"
    command: "./inertiatest"
  - file: tests/jacobiantest.cpp
    source: orocos_kdl/tests/jacobiantest.cpp
    description: "Jacobian computation tests"
    command: "./jacobiantest"
  - file: tests/jacobiandottest.cpp
    source: orocos_kdl/tests/jacobiandottest.cpp
    description: "Jacobian derivative tests"
    command: "./jacobiandottest"
  - file: tests/velocityprofiletest.cpp
    source: orocos_kdl/tests/velocityprofiletest.cpp
    description: "Velocity profile tests"
    command: "./velocityprofiletest"
  - file: tests/treeinvdyntest.cpp
    source: orocos_kdl/tests/treeinvdyntest.cpp
    description: "Tree inverse dynamics tests"
    command: "./treeinvdyntest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 验证 Frame 运算、正运动学、Jacobian 等核心 API"
    command: "./test_orocos-kdl"

# test.cpp 中 KDL_CHECK 的实际断言总数，用于质量评估
assertion_count: 5