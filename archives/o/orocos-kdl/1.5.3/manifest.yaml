# 版本级 manifest
# 文件位置: archives/o/orocos-kdl/1.5.3/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.5.3"
software: "orocos-kdl"
status: built
build_date: "2026-07-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/orocos/orocos_kinematics_dynamics/archive/refs/tags/1.5.3.tar.gz"
  sha256: "3895eed1b51a6803c79e7ac4acd6a2243d621b887ac26a1a6b82a86a1131c3b6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DEIGEN3_INCLUDE_DIR=$DEFAULT_PREFIX/include/eigen3"
  dependencies:
    - eigen/3.4.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "orocos-kdl 是 orocos_kinematics_dynamics monorepo 的子项目，需构建 orocos_kdl 子目录"
  - "依赖 Eigen3 header-only 库，需预装或打包时下载"
  - "CMake 构建，无需补丁即可在 OHOS 平台编译"