software: orocos-kdl
display: "Orocos KDL"
description: "Kinematics and Dynamics Library for robot chains"
category: library
homepage: "https://github.com/orocos/orocos_kinematics_dynamics"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "基于 CMake 构建系统编译"
    - "依赖 Eigen3 header-only 库，需预装或打包时下载"
    - "monorepo 结构，需构建 orocos_kdl 子目录"
  common_dependencies:
    - eigen/3.4.0

versions:
  "1.5.1":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方，未打补丁。test_package 造一个两连杆平面臂跑正解，
      与初等三角的解析解逐分量对账（<1e-9），另验末端姿态 yaw 与旋转矩阵
      乘其逆得单位阵。选平面两连杆是因为它的解析解能精确写出来，
      容差可以卡紧，而不是只看「没崩」。
  "1.5.3":
    status: built
    build_date: "2026-07-16"
    source_url: "https://github.com/orocos/orocos_kinematics_dynamics/archive/refs/tags/1.5.3.tar.gz"
