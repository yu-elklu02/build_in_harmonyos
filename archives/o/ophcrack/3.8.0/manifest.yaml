# 版本级 manifest
# 文件位置: archives/o/ophcrack/3.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.8.0"

# 软件名
software: "ophcrack"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-09"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool 权威镜像）
  url: "https://deb.debian.org/debian/pool/main/o/ophcrack/ophcrack_3.8.0.orig.tar.bz2"

  # 源码校验和
  sha256: "048a6df57983a3a5a31ac7c4ec12df16aa49e652a29676d93d4ef959d50aeee0"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-gui"
  - "--build=aarch64-unknown-linux-gnu"
  - "--host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "openssl/3.5.6"
  - "expat/2.8.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-ohos-portability.patch"
- "0002-configure-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS uname -s 返回 HarmonyOS：autotools configure 需显式 --build/--host 才能通过 config.guess"
- "OHOS hmfs 权限位保留不完整：configure 临时目录 umask 077 会致 config.status 子目录不可写，改 002"
- "OHOS musl libc 无 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype，需 no-op 宏兼容"
- "Windows 专用头（如 ntdll.h 的 windows.h）在 -MM 依赖解析阶段会被解析，需条件化 include"
