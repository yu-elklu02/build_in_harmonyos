# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: ophcrack/3.8.0
homepage: "https://ophcrack.sourceforge.io/"

# 上游无测试套件（ophcrack 源码树 src/test 仅为内部自测可执行，无断言框架）
upstream_check_command: "true"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "ophcrack -h"
    description: "验证二进制可执行且帮助输出含版本信息"
    command: "ophcrack -h"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
