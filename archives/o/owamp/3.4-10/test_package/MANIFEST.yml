# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 owamp 3.4-10 无 automake TESTS 目标（make check 为空），
# 唯一测试入口是 test/owtvec（bin_PROGRAMS，人工验证程序）——验证 OWAMP 规范
# Appendix B 的 AES 指数偏差。本包在构建阶段（conanfile.py build()）已实际执行
# owtvec，test_package 中再次运行以验证安装产物。

package: owamp/3.4-10
homepage: "https://software.internet2.edu/owamp/"

# 上游官方测试：无自动化测试框架（无 TESTS/check 目标）；
# 唯一真实测试入口 = test/owtvec（OWPExpContext AES 指数偏差自检，附录 B）
upstream_official_tests:
  - entry: test/owtvec
    description: "AES-based Exponential Deviates self-check (OWAMP spec Appendix B); bin_PROGRAMS, run manually (no TESTS target)"
    command: "./owtvec"

# 构建阶段执行的测试命令（conanfile.py build() 内直接运行 owtvec）
upstream_check_command: "./owtvec"
upstream_test_in_build: true
upstream_test_command: "./owtvec"

# 适配补全测试（自研，非上游）：无（上游已有 owtvec 测试入口，直接复用）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - description: "验证安装产物：owping/owampd/powstream/owtvec 均存在且可执行；owtvec 自检通过 (exit 0)"
    command: "owtvec (installed in bin/)"

# 断言统计：owtvec 4 个 SEED 用例 × 6 个 EXP/SUM 检查点 = 24 项输出，exit 0 视为通过
assertion_count: 24
