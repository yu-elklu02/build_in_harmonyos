# 版本级 manifest — owamp 3.4-10
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4-10"

# 软件名
software: "owamp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-13"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Internet2 官方 owamp 发布源）
  url: "https://software.internet2.edu/sources/owamp/owamp-3.4-10.tar.gz"

  # 源码校验和
  sha256: "059f0ab99b2b3d4addde91a68e6e3641c85ce3ae43b85fe9435841d950ee2fb3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（--build/--host 由 conanfile generate() 传入 OHOS triplet）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # i2util/1.2 为 configure.ac 硬性要求（AC_SEARCH_LIBS I2AddrByNode + 头文件检查）
  dependencies:
    - "i2util/1.2"

  # 编译器（OHOS SDK，来自 conan profile）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（全部真实 diff 生成，a/ b/ 相对路径）
patches_applied:
  - "patches/0001-configure.ac.patch"
  - "patches/0002-api.c.patch"
  - "patches/0003-time.c.patch"
  - "patches/0004-owpingP.h.patch"
  - "patches/0005-owtvec.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "补丁必须用真实 diff -u 生成且使用 a/ b/ 相对路径（手写 hunk/绝对路径都会导致 apply_conandata_patches 失败）"
  - "AutotoolsToolchain 注入 flags 用 extra_cflags/extra_ldflags；cpp_info 相对路径需拼 package_folder 为绝对路径"
  - "VPATH 外源码构建：OWPINCS/OWP_dir 等路径变量须同时含 -I${top_builddir}（config.h 生成在 build 目录）"
  - "OHOS musl libc 无 GNU 扩展 ntp_adjtime()，需 AC_CHECK_FUNCS + #ifdef HAVE_NTP_ADJTIME 守卫"
  - "上游 assert() 副作用 bug：NDEBUG Release 构建会把 assert 内赋值编译掉导致野指针（owtvec SIGSEGV）"
  - "config.sub (2009) 不识别 OHOS triplet，需 autoreconf -fi 重新生成（E074/E114 已知条目）"
  - "CI W3 L1 门禁会检测 test_package 假测试（self.run 含 true/echo），test() 必须真实执行"

patch_generation:
  method: real-diff-u
  generated_at: '2026-08-13'
  patches_count: 5

patch_classification:
  - file: 0001-configure.ac.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-api.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-time.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-owpingP.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0005-owtvec.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
