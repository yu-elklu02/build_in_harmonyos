# conandata.yml — owamp 3.4-10
# 源码 = Internet2 官方 owamp-3.4-10.tar.gz（自带 configure，但 config.sub 2009 版
#   不识别 aarch64-unknown-linux-ohos，需 autoreconf -fi 重新生成）
# 依赖 = i2util/1.2（configure.ac 硬性要求：AC_SEARCH_LIBS I2AddrByNode + 头文件检查，
#   缺失即 configure 报错）
# 补丁策略：仅 1 个修改文件补丁（configure.ac，现代化 automake 写法 +
#   AC_CONFIG_MACRO_DIR 使 aclocal 找到 config/c-attribute.m4 的 I2_C___ATTRIBUTE__）。

sources:
  url: "https://software.internet2.edu/sources/owamp/owamp-3.4-10.tar.gz"
  sha256: "059f0ab99b2b3d4addde91a68e6e3641c85ce3ae43b85fe9435841d950ee2fb3"

patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Modernize configure.ac: AM_INIT_AUTOMAKE([foreign]) + AC_CONFIG_HEADERS + AC_CONFIG_MACRO_DIR([config]) for automake 1.18 / autoconf 2.7x compatibility; OWPINCS adds -I${top_builddir} for out-of-tree config.h"
    patch_type: "platform"
  - patch_file: "patches/0002-api.c.patch"
    patch_description: "Fix -Wint-conversion error on clang 15: assign (off_t)0 instead of NULL to off_t oset_skiprecs"
    patch_type: "portability"
  - patch_file: "patches/0003-time.c.patch"
    patch_description: "Guard ntp_adjtime() calls with HAVE_NTP_ADJTIME (undefined symbol on OHOS musl libc)"
    patch_type: "portability"
  - patch_file: "patches/0004-owpingP.h.patch"
    patch_description: "Remove NDEBUG guard around opt.childwait (owping.c references it unconditionally; fails under -DNDEBUG Release builds)"
    patch_type: "portability"
  - patch_file: "patches/0005-owtvec.c.patch"
    patch_description: "Fix assert() side-effect bug in test/owtvec.c: NDEBUG Release builds compile out the assignment inside assert(), leaving exp uninitialized -> SIGSEGV. Move assignment out of assert()."
    patch_type: "portability"
