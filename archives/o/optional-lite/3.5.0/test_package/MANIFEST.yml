# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: optional-lite/3.5.0
homepage: "https://github.com/martinmoene/optional-lite"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17)
# 每个可执行文件包含 75 个 lest 测试用例
upstream_tests:
  - file: test/optional.t.cpp
    source: optional-lite-3.5.0/test/optional.t.cpp
    description: "optional 核心单元测试 (75 个 lest 用例: 构造/赋值/访问/value_or 等)"
    command: "ctest -R test-cpp11"
  - file: test/optional-main.t.cpp
    source: optional-lite-3.5.0/test/optional-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

test_package_tests:
  - file: test_optional_lite.cpp
    description: "消费者测试: 验证 optional-lite 库链接、optional 构造/value/value_or/make_optional/reset API"
    command: "./test_optional_lite"

assertion_count: 7
