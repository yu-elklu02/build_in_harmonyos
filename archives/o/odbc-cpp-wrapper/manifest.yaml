software: odbc-cpp-wrapper
display: "ODBC C++ Wrapper"
description: "SAP's C++ wrapper for ODBC API providing object-oriented database access"
category: db
homepage: "https://github.com/SAP/odbc-cpp-wrapper"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Static library only - no executable binaries"
    - "Requires unixODBC or iODBC development libraries"
    - "CMake project - need to specify ODBC paths in conanfile generate()"
    - "libiodbc installed via cmd-pkgs provides ODBC API"
  common_dependencies:
    - libiodbc

versions:
  "1.6":
    status: published
    build_date: "2026-08-07"
