# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: odbc-cpp-wrapper/1.6
homepage: "https://github.com/SAP/odbc-cpp-wrapper"

# Upstream test command
upstream_check_command: "ctest -N"

# upstream tests use GoogleTest and are not built in conan build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: test/EnvironmentTest.cpp
    source: odbc-cpp-wrapper-1.6/test/EnvironmentTest.cpp
    description: "Environment creation and connection tests (requires GoogleTest)"
    command: "./OdbcCppTest"
  - file: test/TypesTest.cpp
    source: odbc-cpp-wrapper-1.6/test/TypesTest.cpp
    description: "ODBC type wrapper tests (requires GoogleTest)"
    command: "./OdbcCppTest"
  - file: test/StringConverterTest.cpp
    source: odbc-cpp-wrapper-1.6/test/StringConverterTest.cpp
    description: "String conversion tests (requires GoogleTest)"
    command: "./OdbcCppTest"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.cpp
    description: "Consumer smoke test - creates ODBC environment via libiodbc"
    command: "./test_odbccpp"

# Approximate assertion count
assertion_count: 1
