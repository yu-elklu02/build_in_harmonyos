software: odbc-cpp-wrapper
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/SAP/odbc-cpp-wrapper/archive/refs/tags/v1.6.tar.gz"

  # 源码校验和
  sha256: "5057cb2af2ed86d05fe75cc3a3f5a19f89a5eaa119ffb3d127e866e9721ec1b2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 系统依赖
  system_dependencies:
    - "libiodbc/3.52.16 (cmd-pkgs)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake FindODBC module requires explicit ODBC_INCLUDE_DIR and ODBC_LIBRARY on OHOS"
  - "libiodbc (from cmd-pkgs) provides ODBC API compatible with odbc-cpp-wrapper"
  - "Static library build (BUILD_SHARED_LIBS=OFF) produces libodbccpp.a"
