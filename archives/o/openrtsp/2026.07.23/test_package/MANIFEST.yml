# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: openrtsp/2026.07.23
homepage: "http://www.live555.com/openRTSP/"

# 上游测试命令
# live555 上游无 make check / make test / make tests 目标，无官方自动化测试套件。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游无任何可集成的自动化测试，故 build() 不执行上游测试。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# live555 上游测试用例统计：单元/集成/其他均为 0（testProgs/ 下为示例程序，
# 非自动化 pass/fail 测试套件，无断言、无预期结果、无测试框架）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 消费者 smoke test：无参数运行 openRTSP，校验信号终止/预期 usage 退出码/Usage: 输出。
# 不再使用 openRTSP -h（在该平台触发 Signal 11，已知上游问题）。
test_package_tests:
  - file: test_openrtsp.sh
    description: "openRTSP 无参数消费者 smoke test：校验非信号退出、预期 usage 退出码、Usage: 输出"
    command: "sh test_openrtsp.sh <openRTSP>"
    exit: 0
