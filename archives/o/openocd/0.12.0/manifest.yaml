version: "0.12.0"
status: built
build_date: "2026-08-01"

source:
  url: "https://downloads.sourceforge.net/project/openocd/openocd/0.12.0/openocd-0.12.0.tar.bz2"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--disable-werror"
    - "--disable-internal-libjaylink"
    - "--disable-doxygen-html"
    - "--disable-doxygen-pdf"
    - "--disable-doxygen-man"
    - "--disable-doxygen-rst"
  dependencies: []

patches_applied:
  - "0001-port-for-ohos.patch"
  - "0002-jimtcl-export-cc.patch"
  - "0003-jimtcl-config-guess-ohos.patch"

knowledge_gained:
  - "GitHub tag tarball 不打包 git submodule 源码（jimtcl/libjaylink）"
  - "CI 沙箱缺 aclocal（automake），GitHub tarball 无法 autoreconf"
  - "SourceForge 官方 release tarball 自带预生成 configure 且打包子模块源码"
  - "libjaylink 可用 --disable-internal-libjaylink 禁用，不影响核心功能"
  - "config.status mktemp 在 OHOS 上可能因权限失败，需要 post-configure.sh 修复"

hints:
  post_configure: "hints/post-configure.sh"
