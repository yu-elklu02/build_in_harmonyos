# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: openocd/0.12.0
homepage: "https://openocd.org/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/event.test
    source: openocd-0.12.0/jimtcl/tests/
    description: "jimtcl 子模块 90 个 Tcl 测试用例，已在 OHOS 真机用 jimsh 运行（82/90 通过，8 个失败依赖信号/硬链接/套接字等受限内核能力）"
    command: "jimsh tests/*.test"

test_package_tests:
  - file: conanfile.py
    description: "消费者测试: 验证 openocd 二进制存在、--version 输出正确"
    command: "openocd --version"

assertion_count: 4
