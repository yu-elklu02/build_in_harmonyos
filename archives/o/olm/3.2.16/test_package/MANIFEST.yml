# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: olm/3.2.16
homepage: "https://gitlab.matrix.org/matrix-org/olm/"

# Upstream test command
upstream_check_command: "ctest --test-dir build/tests"

# conanfile.py build() method does NOT integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs (from CMake ctest)
upstream_tests:
  - file: test_base64.cpp
    source: olm-3.2.16/tests/test_base64.cpp
    description: "Base64 encoding/decoding tests"
    command: "./test_base64"
  - file: test_crypto.cpp
    source: olm-3.2.16/tests/test_crypto.cpp
    description: "Cryptographic primitive tests"
    command: "./test_crypto"
  - file: test_group_session.cpp
    source: olm-3.2.16/tests/test_group_session.cpp
    description: "Megolm group session tests"
    command: "./test_group_session"
  - file: test_olm.cpp
    source: olm-3.2.16/tests/test_olm.cpp
    description: "Olm session/account tests"
    command: "./test_olm"
  - file: test_session.cpp
    source: olm-3.2.16/tests/test_session.cpp
    description: "Olm session tests"
    command: "./test_session"
  - file: test_pk.cpp
    source: olm-3.2.16/tests/test_pk.cpp
    description: "Public key encryption tests"
    command: "./test_pk"
  - file: test_sas.cpp
    source: olm-3.2.16/tests/test_sas.cpp
    description: "Short authentication string tests"
    command: "./test_sas"
  - file: test_ratchet.cpp
    source: olm-3.2.16/tests/test_ratchet.cpp
    description: "Double ratchet tests"
    command: "./test_ratchet"

# test_package tests (consumer-perspective verification)
test_package_tests:
  - file: test.c
    description: "Consumer test: create account, generate identity keys"
    command: "./test_olm"

# Approximate assertion count (for quality assessment)
assertion_count: 50
