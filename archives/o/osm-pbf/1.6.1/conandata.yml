# conandata.yml — osm-pbf 1.6.1
# 对齐 Homebrew: https://github.com/Homebrew/homebrew-core/blob/master/Formula/o/osm-pbf.rb
# 上游: https://github.com/openstreetmap/OSM-binary/releases/tag/v1.6.1
# R39: 只写官方 URL，镜像由 CI 自动添加

sources:
  url: "https://github.com/openstreetmap/OSM-binary/archive/refs/tags/v1.6.1.tar.gz"
  sha256: "54e0f234ace310a4256dc7d4fc707837f532a509cc3ef2940dacbdc4ebd9ce15"

# 宿主 codegen 用 protoc（与目标 protobuf 34.1 对齐）
host_protoc:
  url: "https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip"
  # GitHub release asset protoc-34.1-linux-x86_64.zip
  sha256: "af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904"

# OHOS aarch64 预编译运行时依赖（cmd-pkgs）；sha256 为官方 release tar.gz
ohos_deps:
  - name: zlib
    version: "1.3.1"
    url: "https://gitcode.com/OpenHarmonyPCDeveloper/cmd-pkgs/releases/download/pkgs/zlib-1.3.1-ohos-aarch64.tar.gz"
    sha256: "38a89a117dec2776fbe443bc7d34c2769afba027442856ce7c4e27a54caf75fb"
  - name: abseil-cpp
    version: "20260107.1"
    url: "https://gitcode.com/OpenHarmonyPCDeveloper/cmd-pkgs/releases/download/pkgs/abseil-cpp-20260107.1-ohos-aarch64.tar.gz"
    sha256: "60ef9c639da1bebb3687bdcf5cdf6d08459099ac78b5d210743019ff645c7d56"
  - name: protobuf
    version: "34.1"
    url: "https://gitcode.com/OpenHarmonyPCDeveloper/cmd-pkgs/releases/download/pkgs/protobuf-34.1-ohos-aarch64.tar.gz"
    sha256: "2e6731db1381924501036cb78d4c348701560d2673bed8edd9fc3aa09e1a0f6e"
