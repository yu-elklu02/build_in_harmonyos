# test_package/MANIFEST.yml — osm-pbf 1.6.1
package: osm-pbf/1.6.1
homepage: https://github.com/openstreetmap/OSM-binary

# CMake 侧无 gtest/ctest；上游 C CI / Homebrew 冒烟为 osmpbf-outline
upstream_test_in_build: false
upstream_tests:
  - name: osmpbf-outline-sample
    description: "上游 C CI 与 Homebrew test：osmpbf-outline resources/sample.pbf"
    command: "osmpbf-outline share/osm-pbf/sample.pbf"

test_package_tests:
  - file: test.cpp
    description: "消费者 API：OSMPBF_VERSION/常量 + BlobHeader set/serialize/parse（链接 libosmpbf）"
    command: "ctest -R test_osmpbf"
  - file: conanfile.py
    description: "可运行时再执行 osmpbf-outline sample.pbf（对齐 Homebrew，断言 OSMHeader）"
    command: "osmpbf-outline share/osm-pbf/sample.pbf"

assertion_count: 7
