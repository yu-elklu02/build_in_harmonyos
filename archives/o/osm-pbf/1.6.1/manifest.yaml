software: osm-pbf
version: "1.6.1"
status: built
build_date: "2026-07-20"
build_system: cmake

source:
  url: "https://github.com/openstreetmap/OSM-binary/archive/refs/tags/v1.6.1.tar.gz"
  sha256: "54e0f234ace310a4256dc7d4fc707837f532a509cc3ef2940dacbdc4ebd9ce15"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=$OHOS_SDK/native/build/cmake/ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-Dprotobuf_MODULE_COMPATIBLE=ON"
    - "-DProtobuf_PROTOC_EXECUTABLE=<host-protoc-34.1>"
  dependencies:
    - protobuf/34.1
    - abseil-cpp/20260107.1
    - zlib/1.3.1
  cc: aarch64-unknown-linux-ohos-clang
  cxx: aarch64-unknown-linux-ohos-clang++
  sdk: "OpenHarmony 6.1.0.31"
  host: "Linux x86_64 Docker (oh_compile)"

patches_applied: []

artifacts:
  - packaging/osm-pbf-1.6.1-ohos-aarch64.tar.gz

knowledge_gained:
  - "Homebrew osm-pbf 对应上游 OSM-binary；CMake 同时产出 STATIC/SHARED libosmpbf 与 osmpbf-outline"
  - "交叉编译时必须用宿主 x86_64 protoc 做 codegen；OHOS aarch64 protoc 不能经 qemu 执行（SIGILL）"
  - "目标链接库可用 cmd-pkgs 预编译 protobuf/abseil/zlib（R18）；protoc 版本需与目标 protobuf 主版本一致"
  - "当前环境 qemu-aarch64 无法运行 OHOS musl 二进制（含最小 hello）；功能验证以链接产物 ELF 架构为准，真机再跑 sample.pbf"
