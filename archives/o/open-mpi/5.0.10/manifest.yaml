software: open-mpi
homepage: https://www.open-mpi.org
license: BSD-3-Clause
version: 5.0.10
status: published
published_as: open-mpi
build_date: '2026-08-04'

source:
  url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.10.tar.gz
  sha256: 5692cc80554a7117c99eaa725d35100edd8bbf73423a5e265ff867979192df7d
  tar_format: tar.gz

build:
  build_system: autotools
  configure_options:
  - --build=aarch64-unknown-linux-gnu
  - --host=aarch64-unknown-linux-ohos
  - --enable-mpi-fortran=no
  - --enable-mpi-cxx=no
  - --with-hwloc=internal
  - --with-libevent=internal
  - --with-pmix=internal
  - --with-prrte=internal
  - --with-libltdl=no
  - --disable-wrapper-rpath
  - --disable-wrapper-runpath
  - --with-pic
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
- 0001-3rd-party-prrte-src-mca-plm-ssh-plm_ssh_module.c.patch
- 0002-disable-sysv-shmem-on-ohos.patch

patch_classification:
- file: 0001-3rd-party-prrte-src-mca-plm-ssh-plm_ssh_module.c.patch
  type: portability
  platform_only: true
- file: 0002-disable-sysv-shmem-on-ohos.patch
  type: portability
  platform_only: true

knowledge_gained:
- 'musl libc 不提供 rindex()，需要 #define rindex strrchr'
- Open MPI 自带 libevent 和 hwloc，无需外部依赖
- config.guess/config.sub 已支持 aarch64-unknown-linux-ohos
- OHOS CI tee 管道会导致 SIGPIPE 杀死 conan，需 signal(SIGPIPE, SIG_IGN) + 删除 configure 中的 signal 13 trap
- OHOS 沙箱拒绝 mktemp -d 创建的 setgid 目录写入，需创建 exit 1 wrapper 作为 fallback
- autotools.configure()/make() 会因 SIGPIPE 检测误杀 conan，改用 subprocess + 日志文件绕过
- libevent 的 AC_CHECK_SIZEOF 需要交叉编译缓存 ac_cv_sizeof_pthread_t=8 避免运行不可用探测
- OHOS 沙箱拒绝 System V IPC shmget()，需禁用 SysV shared-memory 后端运行时探测

