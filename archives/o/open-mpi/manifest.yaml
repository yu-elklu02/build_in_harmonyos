software: open-mpi
display: Open MPI
description: High performance message passing library (MPI implementation)
category: network
homepage: https://www.open-mpi.org
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
  - 'musl libc 不提供 rindex()，需要 #define rindex strrchr'
  - 自带 libevent、hwloc、pmix、prrte，无需外部依赖
  - config.sub 批量补丁支持 aarch64-unknown-linux-ohos
  - OHOS CI tee 管道 SIGPIPE 需 signal(SIGPIPE, SIG_IGN) + 删除 configure signal 13 trap
  - OHOS 沙箱 mktemp -d setgid 限制需创建 exit 1 wrapper fallback
  - autotools.configure()/make() 需 subprocess + 日志文件绕过 SIGPIPE 误杀
  - libevent AC_CHECK_SIZEOF 需交叉编译缓存 ac_cv_sizeof_pthread_t=8
  - OHOS 沙箱拒绝 System V IPC shmget()，需禁用 SysV shmem 后端
  common_dependencies: []

