software: openfortivpn
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.24.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.24.1"
software: openfortivpn
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (GitHub git archive — no pre-generated configure)
  url: "https://github.com/adrienverge/openfortivpn/archive/refs/tags/v1.24.1.tar.gz"

  # 源码校验和
  sha256: "c40d33acd97b89c2e943bfd839c19b69e5a7a5997052e2fc9a595602745c0465"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-rt_dst=yes"
    - "--enable-proc=yes"
    - "--with-pppd=/usr/sbin/pppd"
    - "--with-resolvconf=DISABLED"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.5.6"
    - "automake/1.18"
    - "libtool/2.5.4"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-ac-remove-pthread-cancel-check.patch"
  - "0002-io-c-guard-pthread-cancel-for-ohos.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E051: pthread_cancel not available on HarmonyOS, configure.ac patched + src/io.c #ifndef __OHOS__ guard"
  - "E011: HMDFS umask 077 in configure script, fixed via _fix_configure_umask() and _fix_config_status()"
  - "OpenSSL .pc files in conan package have build-profile paths, set OPENSSL_CFLAGS/OPENSSL_LIBS env vars"
  - "AC_CHECK_FILE fails when cross-compiling, use --with-rt_dst=yes --enable-proc=yes --with-pppd=path"