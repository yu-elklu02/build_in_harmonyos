# MANIFEST.yml — test_package for openfortivpn 1.24.1
# Declares the upstream test source and adaptation notes.

package: openfortivpn
version: "1.24.1"

upstream_test_source:
  type: none
  description: "openfortivpn upstream has no automated test suite (no 'make check' tests)"
  reference: "https://github.com/adrienverge/openfortivpn"

test_package:
  type: smoke_test
  description: "Executes openfortivpn --version to verify the binary is functional"
  test_files:
    - conanfile.py
    - test_version.sh
  test_command: "openfortivpn --version"
  expected_output: "1.24.1"

adaptation_notes:
  - "Upstream openfortivpn has no 'make check' tests; test_package provides smoke test"
  - "Smoke test verifies binary executes and returns correct version string"
  - "R34: test genuinely depends on the package by executing its binary"
