package: opentelemetry-cpp/1.23.0
homepage: "https://opentelemetry.io"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

excluded_upstream_tests:
  - command: "upstream GoogleTest suite (BUILD_TESTING=ON)"
    reason: "Upstream tests (160 *_test.cc across api/test, sdk/test, exporters/*/test, opentracing-shim/test, resource_detectors/test, ext) require GoogleTest, which is not available in the OHOS cross-build environment; upstream tests are not integrated in this adaptation (documented in the PR description)."

upstream_tests: []

test_package_tests:
  - file: test_api.cpp
    description: "Compile and run a no-op tracer provider API consumer"
    command: "./test_api"

assertion_count: 2
