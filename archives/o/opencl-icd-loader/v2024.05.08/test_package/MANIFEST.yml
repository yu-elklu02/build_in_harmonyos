# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: opencl-icd-loader/v2024.05.08
homepage: "https://github.com/KhronosGroup/OpenCL-ICD-Loader"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/loader_test/main.c
    source: opencl-icd-loader-v2024.05.08/test/loader_test/main.c
    description: "ICD loader integration test (loads driver stub, verifies platform enumeration)"
    command: "./icd_loader_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 clGetPlatformIDs 验证 ICD Loader 库可链接和调用"
    command: "./test_opencl_icd_loader"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
