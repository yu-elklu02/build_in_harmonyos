package: openfpgaloader/1.1.1
upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - file: test.sh
    description: "Verify version and help output, then exercise hardware discovery without an attached programmer"
    command: "openFPGALoader -V"
  - file: test.sh
    description: "Verify the packaged command exposes its upstream help"
    command: "openFPGALoader --help"
  - file: test.sh
    description: "Run upstream FPGA detection and accept the expected no-hardware diagnostic"
    command: "openFPGALoader --detect"
assertion_count: 3
