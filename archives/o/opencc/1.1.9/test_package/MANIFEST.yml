# test_package/MANIFEST.yml
# CI L0e mandatory file
package: opencc/1.1.9
homepage: "https://github.com/BYVoid/OpenCC"

upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/UnitTest.cpp
    source: OpenCC-ver.1.1.9/test/UnitTest.cpp
    description: "OpenCC unit tests using GoogleTest (requires ENABLE_GTEST=ON)"
    command: "./UnitTest"

test_package_tests:
  - file: test.cpp
    description: "Consumer test: uses SimpleConverter API to convert simplified to traditional Chinese"
    command: "./test_opencc <resdir>"

assertion_count: 2
