software: opencc
display: "OpenCC"
description: "Open-source Chinese conversion library and tools (Simplified/Traditional)"
category: library
homepage: "https://github.com/BYVoid/OpenCC"
license: Apache-2.0

build_system: cmake

ohos_adaptation:
  key_points:
    - "Static library build (BUILD_SHARED_LIBS=OFF) to avoid dynamic linker issues on OHOS"
    - "Bundled marisa library used (USE_SYSTEM_MARISA=OFF)"
    - "Dictionary files (.ocd2) generated during build via opencc_dict tool"
    - "Requires Python for dictionary merge/reverse scripts during build"
  common_dependencies: []

versions:
  "1.1.9":
    status: built
    build_date: 2026-08-07
