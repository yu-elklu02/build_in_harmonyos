software: ocaml
# 版本级 manifest
# 文件位置: archives/o/ocaml/4.14.1.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
# 版本号（制品仓已有 4.14.1 且配方已改，按 R37 递增后缀）
version: "4.14.1.1.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ocaml/ocaml/archive/refs/tags/4.14.1.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "776006e6f0b9bcfb6d9d74381c588e587432ca85562fde93bb80472a5145b028"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表（configure --no-create + 手动 config.status）
  configure_options:
    - "--prefix=<package_folder>"
    - "--no-create"

  # 编译依赖列表（无外部 Conan 依赖）
  dependencies: []

  # 编译器（从 conan conf 读取，R33 不硬编码）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（见 patches/）
patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-configure-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS hmmac 策略拒绝直接执行带 shebang 的脚本（EACCES/126），无论 shebang 指向 /bin/sh 还是 bash；须用显式解释器调用（/bin/sh script）。E165 的『改 shebang 路径』方案在本真机不适用"
  - "OHOS 拒绝创建符号链接（ln -sf → Permission denied）；Makefile 中 LN 变量应改为 cp -f/-pf（上游 win32 分支即用 cp）"
  - "OHOS autoconf 体系只探测 gcc/cc/cl.exe，不认 clang；须显式注入 CC 指向 OHOS Clang（/data/service/hnp/bin/clang）"
  - "HMDFS 拒绝覆盖已存在文件（cp → Operation not permitted）；须先 rm -f 再 cp"
  - "config.guess/configure 的临时目录（TMPDIR）须指向可写目录，真机 HOME 受限"
  - "OCaml 4.14.1 自举构建（configure → config.status → make world.opt）在 OHOS aarch64 + Clang 15 下完整通过；make 内部脚本调用点（gen_primitives.sh/Compflags/generate_runtimedef.sh）均需显式解释器"
