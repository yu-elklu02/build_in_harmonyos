# conandata.yml — openal-soft 1.25.2
# 本地实测 SHA256（源码包）；上游 GitHub Release 未提供官方源码 SHA256，
# Release 页面二进制 zip digest 不是源码 hash。

sources:
  url: "https://github.com/kcat/openal-soft/archive/refs/tags/1.25.2.tar.gz"
  sha256: "fb27e5839aa11f0e5b9d33756965291fad5d6909ab928ea1f796f4a1a6877894"
  filename: "openal-soft-1.25.2.tar.gz"

# 正式配方补丁（自包含，不依赖 $HOME/tmp / 绝对路径 / 主机私有 shim）：
# 0001：OHOS libc++ 15.0.4 缺少 std::lexicographical_compare_three_way（C++20
#       [alg.three.way]），alstring.cpp 改为本地等价三路比较实现（匿名命名空间
#       内部辅助函数，无 ABI 影响，语义与标准算法一致）。
patches:
  - patch_file: "patches/0001-common-alstring.cpp.patch"
    patch_description: "OHOS libc++ 15.0.4 缺 std::lexicographical_compare_three_way，alstring.cpp 使用本地等价实现"
    patch_type: "portability"
  - patch_file: "patches/0002-common-polyphase_resampler.cpp.patch"
    patch_description: "Clang 15 标准禁止直接捕获结构化绑定，polyphase_resampler.cpp 改 init-capture [this,cutoff = cutoff]（语义等价）"
    patch_type: "portability"
  - patch_file: "patches/0003-alc-clang15-typename.patch"
    patch_description: "Clang 15 依赖类型前需 typename（effect.cpp×8/buffer.cpp/convolution.cpp/panning.cpp/voice.cpp 共 12 处），补 typename（语法正确性修复）"
    patch_type: "portability"
  - patch_file: "patches/0004-common-source_location.patch"
    patch_description: "OHOS libc++ 15.0.4 无 <source_location> 头，新增 common/source_location 正式兼容头（__builtin_FILE/LINE/COLUMN/FUNCTION 实现，自包含无外部依赖）"
    patch_type: "portability"
  - patch_file: "patches/0005-al-source-structured-binding.patch"
    patch_description: "Clang 15 标准禁止直接捕获结构化绑定，source.cpp 改 init-capture [&offset = offset]（语义等价）"
    patch_type: "portability"
  - patch_file: "patches/0006-common-ranges-compat.patch"
    patch_description: "OHOS libc++ 15.0.4 无 elements_view.h/split_view.h，新增 common/atomcode_ranges_compat.h 正式兼容头（elements=transform+get，split=单字符分隔 constexpr 视图，自包含）"
    patch_type: "portability"
  - patch_file: "patches/0007-ranges-compat-includes.patch"
    patch_description: "7 个使用 std::views::elements/split 的文件（alc.cpp/alu.cpp/reverb.cpp/bs2b.cpp/hrtf.cpp/hrtf_loader.cpp/hrtfbase.h）include atomcode_ranges_compat.h"
    patch_type: "portability"
  - patch_file: "patches/0008-alc-panning-p0960.patch"
    patch_description: "Clang 15 未实现 P0960 括号聚合初始化，panning.cpp 7 处 variant::emplace<T>(args...) 改为 emplace<T>(T{args...})（语义等价）"
    patch_type: "portability"
  - patch_file: "patches/0009-common-alformat-fmt.patch"
    patch_description: "OHOS libc++ 15.0.4 <format> 头存在但 libc++_shared.so 未导出 std::format_error（链接失败），alformat.hpp 在 _LIBCPP_VERSION<=15004 时强制走内置 fmt 实现"
    patch_type: "portability"
