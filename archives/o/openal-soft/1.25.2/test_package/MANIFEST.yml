# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openal-soft/1.25.2
homepage: "https://github.com/kcat/openal-soft"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 生产构建关闭 ALSOFT_TESTS（上游测试默认 OFF），测试构建单独在探针中
# 以 ALSOFT_TESTS=ON 执行（使用离线 GoogleTest 与 ATOMCODE_PROBE_FORCE_FMT）。
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build-tests --output-on-failure -V"

# 上游实际运行的测试程序
# OpenAL_Tests（tests/CMakeLists.txt，GoogleTest FetchContent）：
#   ExampleTest.Basic — 共 1 个测试。
#   探针实测：退出码 0，通过 1、失败 0，通过率 1/1（100%）。
#   限制：测试构建使用离线 GoogleTest 与 -DATOMCODE_PROBE_FORCE_FMT（OHOS 探针 workaround）。

# test_package 替代验证（无真实音频设备）
# 消费者程序 test_openal：
#   - alcOpenDevice("No Output") null 后端
#   - ALC_SOFT_loopback：alcLoopbackOpenDeviceSOFT + alcCreateContext
#     （ALC_FORMAT_CHANNELS_SOFT / ALC_FORMAT_TYPE_SOFT / ALC_FREQUENCY）
#   - alcRenderSamplesSOFT 渲染 960 samples
# 预期退出码 0、失败数 0。1.25.2 无 alcSetFormat，loopback 格式通过 context 属性列表设置。
test_package_command: "test_openal"
