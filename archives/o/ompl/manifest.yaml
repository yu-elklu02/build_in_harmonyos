software: ompl
display: "OMPL"
description: "Open Motion Planning Library: sampling-based motion planning"
category: library
homepage: "https://ompl.kavrakilab.org"
license: BSD-3-Clause
build_system: cmake

versions:
  "1.6.0":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方，未打补丁。test_package 真的跑一次规划：
      2D 方形空间里放一道竖直墙、中间留缺口，用 RRTConnect 从左规划到右，
      断言找到解、起终点吻合、路径逐段通过有效性检查、且确实经过了缺口。

      ⚠️ 逐点复验的判据必须与规划器**同源**。第一版用 interpolate(500) 逐点严判，
      第 269 点即误报「穿墙」——那些点落在墙的几何边界上（距缺口下沿差 1.15e-4），
      而规划器只保证「按 setStateValidityCheckingResolution 采样的点有效」。
      改用 SpaceInformation 自己的 checkMotion 逐段验证后通过：
      那把尺子才是规划器采信的。
