# test_package/MANIFEST.yml
# Upstream official test declaration file

package: openjpeg/2.5.4
homepage: "https://github.com/uclouvain/openjpeg"

# Upstream test command
upstream_check_command: "ctest"

# conanfile.py build() method: upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (not included in source archive, fetched separately)
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_openjpeg.c
    description: "Verifies openjpeg library linkage and API calls (opj_version, opj_create_decompress, opj_create_compress)"
    command: "./test_openjpeg"

# Approximate assertion count
assertion_count: 5
