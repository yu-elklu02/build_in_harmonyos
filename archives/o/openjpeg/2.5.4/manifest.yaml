# 版本级 manifest
# 文件位置: archives/o/openjpeg/2.5.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.5.4"
software: "openjpeg"
status: built
build_date: "2026-07-15"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz"
  sha256: "a695fbe19c0165f295a8531b1e4e855cd94d0875d2f88ec4b61080677e27188a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_STATIC_LIBS=OFF"
    - "-DBUILD_CODEC=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOC=OFF"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 在 OHOS 上不识别平台，需要手动设置 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 修复 SONAME"
  - "OpenJPEG 无需补丁即可在 OHOS 上编译"
  - "库实际名称为 openjp2，而非 openjpeg"
