software: "highs"
version: "1.13.1"
build_date: "2026-07-15"
build_system: "cmake"
status: "built"

source:
  url: "https://github.com/ERGO-Code/HiGHS/archive/refs/tags/v1.13.1.tar.gz"
  sha256: "d491448e585dbf08cd8945ca5dcbbe3b784d73b9c68eea4e7456274619d56164"
  tar_format: tar.gz

build:
  system: "cmake"
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-disable-out-of-source-check.patch"

knowledge_gained:
  - "HiGHS 的 CMakeLists.txt 强制要求 out-of-source 构建，Conan 的构建目录结构会触发此检查"
  - "通过补丁将 `if(EXISTS \"${LOC_PATH}\")` 改为 `if(FALSE)` 可绕过"
  - "HiGHS 无第三方依赖，纯 C++ 标准库实现，适配简单"
