# test_package/MANIFEST.yml

package: highs/1.13.1
homepage: "https://github.com/ERGO-Code/HiGHS"

# 上游测试命令
upstream_check_command: "ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游测试程序列表 (59 个测试源文件)
upstream_tests:
  - file: check/TestMain.cpp
    source: HiGHS-1.13.1/check/TestMain.cpp
    description: "主测试入口"
    command: "./TestMain"
  - file: check/TestBasis.cpp
    source: HiGHS-1.13.1/check/TestBasis.cpp
    description: "基矩阵测试"
    command: "./TestBasis"
  - file: check/TestLpSolvers.cpp
    source: HiGHS-1.13.1/check/TestLpSolvers.cpp
    description: "LP 求解器测试"
    command: "./TestLpSolvers"
  - file: check/TestMipSolver.cpp
    source: HiGHS-1.13.1/check/TestMipSolver.cpp
    description: "MIP 求解器测试"
    command: "./TestMipSolver"
  - file: check/TestQpSolver.cpp
    source: HiGHS-1.13.1/check/TestQpSolver.cpp
    description: "QP 求解器测试"
    command: "./TestQpSolver"
  # (其余 54 个测试源文件通过 ctest 统一运行)

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "验证 highs 库可正常初始化调用"
    command: "./test_highs"

# 测试断言总数
assertion_count: 59
