software: httpstat
display: "httpstat"
description: "Command-line visualization of curl request timing statistics"
category: network
homepage: "https://github.com/reorx/httpstat"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Package the upstream single-file Python tool as bin/httpstat"
    - "Use a Python 3 env shebang for the OHOS runtime"
    - "Require the system curl command at runtime"
  common_dependencies:
    - python3
    - curl

versions:
  "1.3.2":
    status: built
    build_date: "2026-07-17"
    conan_ref: "httpstat/1.3.2"
