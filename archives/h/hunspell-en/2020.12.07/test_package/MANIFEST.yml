package: hunspell-en/2020.12.07
homepage: "http://wordlist.aspell.net/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  counting_basis: "2 top-level Make test targets from the canonical rel-2020.12.07 tag"
  entries:
    - name: scowl_test
      description: "Build SCOWL database and Hunspell dictionaries, then run sql/test"
    - name: varcon_test
      description: "Run the American-to-Australian variant translation check"
  total: 2

test_package_tests:
  - file: test_hunspell_en.cpp
    scenario: normal
    description: "Validate six dictionary pairs, entry counts, UTF-8 settings, and dialect spellings"
    command: "./test_hunspell_en <dictionary-directory>"
  - file: test_hunspell_en.cpp
    scenario: fault-injection
    description: "Verify that a missing dictionary directory is rejected"
    command: "./test_hunspell_en --expect-missing <missing-directory>"

assertion_count: 13
