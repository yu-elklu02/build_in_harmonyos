# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: httperf/0.9.1
homepage: "https://github.com/httperf/httperf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# httperf 上游无自带测试套件，make check 为空操作
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（httperf 无上游测试，此处留空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 1. --version 冒烟测试；2. 对本地 loopback HTTP 服务器执行真实基准测试，
#    验证 connections/requests/replies 统计输出
test_package_tests:
  - file: test.sh
    description: "httperf --version 冒烟测试 + 本地 HTTP 服务器真实基准测试"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
