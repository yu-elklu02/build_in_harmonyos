# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.1"

# 软件名
software: "httperf"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/httperf/httperf/tar.gz/de8cd6ad8a79779a0cb74a4aa2175afa9e24df57"

  # 源码校验和
  sha256: "ba1c68b8eed4fcdae72e932c8810faf76bde77c50c5791b3a3d88d0f4f7e69b2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: config.status 创建 confXXXXXX 临时目录失败（HMDFS umask 077）— 在 conanfile.py build() 中 autoreconf 后 sed 替换 umask 077→022"
  - "codeload URL 无 .tar.gz 扩展名时 conan get 无法识别格式，必须在 conandata.yml sources 中显式声明 filename"
  - "GitHub tarball 只含 configure.ac 不含生成 configure，conanfile.py build() 必须调用 autotools.autoreconf()"
  - "test_package 中直接 subprocess.run 调用被测二进制会因缺 conanrun PATH 失败(rc=127)，必须用 self.run(env='conanrun')"
  - "R38: httperf 为命令行工具，需在软件级目录创建 commands.json（type=tool）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
