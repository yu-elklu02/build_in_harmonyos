# test_package/MANIFEST.yml — upstream and consumer test declaration
package: htslib/1.24-r0
homepage: https://www.htslib.org/

upstream_test_in_build: true
upstream_tests:
  - command: "make test/hts_endian test/test_kstring test/test_str2int && ./test/hts_endian && ./test/test_kstring && ./test/test_str2int"
    description: "Selected HTSlib upstream C regression tests that run reliably in the OHOS Conan environment"

test_package_tests:
  - file: test_htslib.c
    description: "Compile and run a consumer using hts_version() and sam_hdr_init()/sam_hdr_destroy()"
    command: "./test_htslib"

assertion_count: 2
