version: "1.24-r0"
software: htslib
status: built
build_date: "2026-07-14"
build_system: autotools

source:
  url: "https://github.com/samtools/htslib/releases/download/1.24/htslib-1.24.tar.bz2"
  mirror_url: "https://ghfast.top/https://github.com/samtools/htslib/releases/download/1.24/htslib-1.24.tar.bz2"
  sha256: "28a8de191381c7a97a35675ceac76fa1ea95e7b678d6a2e9d600a7874e4077de"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-bz2"
    - "--disable-libcurl"
    - "--disable-plugins"
    - "--disable-ref-cache"
    - "--with-libdeflate"
  dependencies:
    - "zlib/1.3.1"
    - "xz/5.6.2"
    - "libdeflate/1.25"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "HTSlib 1.24 configure 在 OHOS 中需 --host=aarch64-unknown-linux-ohos，否则 conftest 执行检测失败"
  - "HTSlib 依赖 zlib、xz/liblzma、libdeflate 可通过 Conan AutotoolsDeps/PkgConfigDeps 注入"
  - "完整 make check 中 htscodecs 数据运行测试在当前 OHOS Conan 环境不稳定，使用可复现的上游 C 小测试 + consumer API 测试覆盖基础功能"
  - "Makefile 中 ln -sf 需要改为 rm -f && ln -s 以兼容 HMDFS"

validation:
  conan_create: pass
  upstream_subset_tests:
    - "./test/hts_endian"
    - "./test/test_kstring"
    - "./test/test_str2int"
  test_package: pass

artifacts:
  libraries:
    - "lib/libhts.a"
  binaries:
    - "bin/annot-tsv"
    - "bin/bgzip"
    - "bin/htsfile"
    - "bin/tabix"
