software: htslib
display: "HTSlib"
description: "C library and command-line tools for SAM/BAM/CRAM/VCF/BCF files"
category: bioinformatics
homepage: "https://www.htslib.org/"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools configure 需显式 --host=aarch64-unknown-linux-ohos，避免 conftest 运行失败"
    - "使用 AutotoolsDeps/PkgConfigDeps 注入 zlib、xz、libdeflate Conan 依赖"
    - "禁用 bzip2/libcurl/plugins/ref-cache，保留核心 SAM/BAM/CRAM/VCF/BCF 读写能力"
    - "修复 configure umask 077 与 TMPDIR，以及 Makefile 中 ln -sf 软链接覆盖问题"
  common_dependencies:
    - zlib
    - xz
    - libdeflate

versions:
  "1.24-r0":
    status: built
    build_date: "2026-07-14"
