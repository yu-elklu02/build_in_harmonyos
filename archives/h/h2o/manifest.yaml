software: h2o
display: "H2O"
description: "Optimized HTTP server with HTTP/2 support"
category: network
homepage: "https://github.com/h2o/h2o"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Uses upstream custom check target rather than replacing it with CTest."
    - "Consumes libuv, OpenSSL, and zlib through Conan dependencies."
  common_dependencies:
    - libuv/1.52.1
    - openssl/3.5.6
    - zlib/1.3.1

versions:
  "2.2.6":
    status: pending
    build_date: ""
    notes: "Initial recipe; actual OpenHarmony PC upstream check results are required before it can be marked built."
