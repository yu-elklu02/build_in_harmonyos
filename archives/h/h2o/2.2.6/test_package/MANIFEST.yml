package: h2o/2.2.6
homepage: "https://github.com/h2o/h2o"
upstream_check_command: "cmake --build . --target check"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target check"
upstream_tests:
  - file: "t/*.t"
    source: "H2O custom CMake check target"
    description: "Upstream Perl integration suite plus unit-test binaries"
test_package_tests:
  - file: "test_h2o.sh"
    description: "Runs the installed H2O binary and validates its release version"
    command: "h2o -v"
assertion_count: 1
