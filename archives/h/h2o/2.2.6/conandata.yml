    required_file: "khash.h"
  - path: "deps/libgkc"
    required_file: "gkc.c"
  - path: "deps/libyrmcds"
    required_file: "close.c"
  - path: "deps/neverbleed"
    required_file: "neverbleed.c"
  - path: "deps/picohttpparser"
    required_file: "picohttpparser.c"
  - path: "deps/picotest"
    required_file: "picotest.c"
  - path: "deps/picotls"
    required_file: "lib/picotls.c"
  - path: "deps/ssl-conservatory"
    required_file: "openssl/openssl_hostname_validation.c"
  - path: "deps/yaml"
    required_file: "src/api.c"
  - path: "deps/yoml"
    required_file: "yoml.h"
