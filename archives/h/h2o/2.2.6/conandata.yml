# These directories are vendored in the official v2.2.6 source archive, not
# Git submodules. CMake compiles them for this recipe's default configuration
# (WITH_MRUBY=OFF, WITH_PICOTLS=ON), so source() verifies the complete closure
# before it applies the platform patches.
bundled_dependencies:
  - path: "deps/brotli"
    required_file: "enc/encode.cc"
  - path: "deps/cloexec"
    required_file: "cloexec.c"
  - path: "deps/golombset"
    required_file: "golombset.h"
