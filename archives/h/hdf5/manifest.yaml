software: hdf5
display: "HDF5"
description: "High-performance data management and storage suite"
category: data
homepage: "https://www.hdfgroup.org/solutions/hdf5/"
license: BSD-3-Clause
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CMake 构建需创建 TryRunResults 缓存文件处理交叉编译 TRY_RUN 测试"
    - "使用 CMAKE_SYSTEM_NAME=Linux（而非 OHOS）绕过平台未知警告"
    - "需要手动指定 ZLIB_INCLUDE_DIR 和 ZLIB_LIBRARY"
    - "HDFTests.c 需添加 HAVE_TM_ZONE 测试定义"
  common_dependencies:
    - zlib

# 版本索引
versions:
  "1.13.0":
    status: published
    build_date: "2026-05-20"
    package_size: "102MB"
    patches:
      - "0001-config-cmake_ext_mod-HDFTests.c.patch"
  "1.14.6":
    status: built
    build_date: "2026-08-01"
