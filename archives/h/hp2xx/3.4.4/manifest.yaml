# Version-level manifest for hp2xx 3.4.4

software: hp2xx
version: "3.4.4"
build_system: makefile
status: built
build_date: "2026-07-30"

source:
  url: "https://ftp.gnu.org/gnu/hp2xx/hp2xx-3.4.4.tar.gz"
  sha256: "47b72fb386a189b52f07e31e424c038954c4e0ce405803841bed742bab488817"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "PREVIEWER=no_prev"
    - "DEFINES=-DUNIX"
    - "CFLAGS include -DHP2XX_USE_MKSTEMP"
    - "EX_SRC/EX_OBJ/EX_DEFS/EX_LIBS empty"
  dependencies: []
  optional_dependencies_disabled:
    - x11
    - libpng
    - zlib
    - libtiff
    - libjpeg
    - pdflib
    - libemf
    - freetype
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-minimal-ohos-build.patch"

test_results:
  type: official-sample-plus-consumer-smoke
  total: 2
  passed: 2
  failed: 0
  notes:
    - "Recipe build converts upstream hp-tests/colors.hp to SVG."
    - "test_package runs --version and converts generated HP-GL to SVG."
    - "OHOS single-package ci/conan/build_and_test.sh passed on 2026-07-30."

issue: "#1622"
knowledge_gained:
  - "OHOS tmpfile() can select an unwritable default path; hp2xx uses TMPDIR-aware mkstemp when HP2XX_USE_MKSTEMP is enabled."
  - "Conan test_package test() runs from the generated build folder; shell smoke scripts should be invoked via self.recipe_folder."
