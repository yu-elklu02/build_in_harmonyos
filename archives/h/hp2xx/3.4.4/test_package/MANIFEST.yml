# test_package/MANIFEST.yml - hp2xx 3.4.4

package: hp2xx/3.4.4
homepage: "https://www.gnu.org/software/hp2xx/"

# Upstream ships hp-tests/*.hp samples; sources/Makefile's check target uses
# preview mode, which is disabled for this dependency-free package profile.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "hp2xx -q -m svg -f conan-smoke.svg hp-tests/colors.hp"

upstream_tests:
  - file: "hp-tests/colors.hp"
    description: "Official sample HP-GL converted to SVG during recipe build"
    command: "hp2xx -q -m svg -f conan-smoke.svg hp-tests/colors.hp"

test_package_tests:
  - file: "test_package/test.sh"
    description: "Run hp2xx --version and convert a generated HP-GL rectangle to SVG"
    command: "sh test.sh"

assertion_count: 4
