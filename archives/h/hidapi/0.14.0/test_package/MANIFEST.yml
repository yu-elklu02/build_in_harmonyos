# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hidapi/0.14.0
homepage: "https://github.com/libusb/hidapi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# hidapi 0.14.0 has hidtest/ directory with test.c, but tests require a physical HID device
# CI uses test_package instead
upstream_tests:
  - file: hidtest/test.c
    source: hidapi-0.14.0/hidtest/test.c
    description: "Upstream hidtest — requires physical HID device, not suitable for CI"
    command: "./hidtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: initializes hidapi, enumerates devices, verifies version"
    command: "./test_hidapi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
