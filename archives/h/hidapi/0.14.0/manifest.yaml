software: hidapi
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.14.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.14.0"
status: built
build_date: "2026-08-07"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz"
  sha256: "a5714234abe6e1f53647dd8cba7d69f65f71c558b7896ed218864ffcf405bcbd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DHIDAPI_NO_ICONV=ON"
  dependencies:
    - libusb/1.0.27
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMAKE_POLICY_VERSION_MINIMUM 需用 cache_variables 而非 variables (toolchain 加载晚于 cmake_minimum_required)"
  - "hidapi libusb/CMakeLists.txt 需 patch 支持 Conan CMakeDeps target (libusb-1.0::libusb-1.0)"
  - "includedirs 应为 include/ 而非 include/hidapi/ (代码 #include <hidapi/hidapi.h>)"
  - "hid_init() 在无头系统失败，test_package 需容忍此失败"
