# 软件级 manifest — hickle
# 遵循 ARCHIVE-SPEC v2.0

software: "hickle"
display: "hickle"
description: "HDF5 based version of pickle — serialize Python objects to HDF5"
category: data
homepage: "https://github.com/telegraphic/hickle"
license: "MIT"
build_system: "python"

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Python 包（py3-none-any），无需交叉编译/ELF 签名"
    - "直接拷贝 hickle/ 包目录到 site-packages 即可 import"
    - "运行期依赖 h5py/numpy 由目标 Python 环境提供，非 Conan requires"
    - "import hickle 级联触发 h5py/numpy 导入，test_package 需可选依赖 fallback"
  common_dependencies:
    - "h5py (需 HDF5)"
    - "numpy"

# 版本索引
versions:
  "5.0.3":
    status: built
    build_date: "2026-07-31"
