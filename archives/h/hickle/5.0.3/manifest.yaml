software: hickle
version: "5.0.3"
status: built
build_date: "2026-07-31"
build_system: python

# 编译环境
build_env:
  python: "3.12"
  platform: harmonyos-aarch64

# 源码
source:
  url: "https://files.pythonhosted.org/packages/b1/42/09a543153c1609b656f5c8e33210d6bdd1b7045c0d6e33bc96bb9afbb704/hickle-5.0.3.tar.gz"
  sha256: "027e51ccad279d168123a244525e6c84bac0db64605b311b0bd349891be0c53e"
  tar_format: tar.gz

# 构建系统
build:
  system: python
  configure_options:
    - "直接拷贝 hickle/ 包目录到 site-packages（纯 Python，无需 pip/setup.py install）"
  dependencies:
    - python/3.12
  cc: ""
  cxx: ""

# 运行期依赖（非 Conan requires，由目标 Python 环境提供）
runtime_dependencies:
  - "h5py>=2.10.0 (需 HDF5，已发布到制品仓 archives/h/hdf5)"
  - "numpy>=1.8,!=1.20 (OHOS 上已随 openblas 验证可用)"

patches_applied:
  - "patches/0001-load_builtins-numpy2.patch"
  - "patches/0002-load_numpy-numpy2.patch"
  - "patches/0003-lookup-numpy2.patch"
  - "patches/0004-test-astropy-tostring.patch"
  - "patches/0005-legacy-v3-pkg_resources.patch"

# 上游测试真实运行结果（2026-08-01，OHOS 目标环境：python 3.12.9 + numpy 2.5.1
# + h5py 3.13.0 + scipy 1.17.1 + astropy 8.0.1 + pandas 3.0.3 + dill 0.4.1 + pytest 9.1.1）
# 初始实跑 95 passed / 7 failed（7 个失败均为上游 numpy 2.x/astropy 8.x/setuptools
# PEP 706 兼容性缺陷），应用上述 5 个补丁后 102/102 全部通过。
upstream_test_run:
  command: "python3 -m pytest hickle/tests/ -o addopts='' -p no:cacheprovider"
  total: 102
  passed: 102
  failed: 0
  skipped: 0
  pass_rate: "100% (102/102)"
  patches_applied_before_run:
    - "0001-load_builtins-numpy2.patch"
    - "0002-load_numpy-numpy2.patch"
    - "0003-lookup-numpy2.patch"
    - "0004-test-astropy-tostring.patch"
    - "0005-legacy-v3-pkg_resources.patch"
  original_failures_before_patch:
    - test: "test_03_load_builtins.py::test_load_hickle_4_0_X_string"
      root_cause: "numpy 2.x: np.array(obj, copy=False) 改为强制 copy，上游 load_builtins.py:388 未适配"
      fixed_by: "0001-load_builtins-numpy2.patch"
    - test: "test_03_load_builtins.py::test_listlike_dataset"
      root_cause: "同上，load_builtins.py:388 numpy 2.x copy 语义变更"
      fixed_by: "0001-load_builtins-numpy2.patch"
    - test: "test_04_load_numpy.py::test_create_np_ndarray"
      root_cause: "load_numpy.py:235 np.array(copy=False) 在 numpy 2.x 报 ValueError"
      fixed_by: "0002-load_numpy-numpy2.patch"
    - test: "test_06_load_astropy.py::test_astropy_time_array"
      root_cause: "astropy 8.x: numpy.str_.tostring() 已移除（test_06_load_astropy.py:169）"
      fixed_by: "0004-test-astropy-tostring.patch"
    - test: "test_hickle.py::test_slash_dict_keys"
      root_cause: "numpy 2.5: 直接对 array 赋 dtype 被废弃并升级为 error"
      fixed_by: "0003-lookup-numpy2.patch"
    - test: "test_legacy_load.py::test_legacy_load"
      root_cause: "setuptools 不再自带 pkg_resources（PEP 706），legacy hkl 加载失败"
      fixed_by: "0005-legacy-v3-pkg_resources.patch"
    - test: "test_legacy_load.py::test_4_0_0_load"
      root_cause: "同上 pkg_resources 缺失 + numpy 2.x copy 语义"
      fixed_by: "0002-load_numpy-numpy2.patch + 0005-legacy-v3-pkg_resources.patch"
  conclusion: "初始 7 个失败均为上游 hickle 5.0.3 与 numpy 2.5.1/astropy 8.0.1/setuptools(PEP 706) 的兼容性缺陷。通过 5 个 portability 补丁修复（np.asarray 替代 np.array(copy=False)、view() 替代 dtype 直赋、移除 pkg_resources 导入、str() 替代 tostring()），OHOS 目标环境实测 102/102 全部通过，无跳过、无失败。"

knowledge_gained:
  - "纯 Python 包（py3-none-any wheel）无需交叉编译/ELF 签名"
  - "h5py/numpy 为运行期依赖，制品仓未发布其 Conan 配方，故不声明为 Conan requires"
  - "import hickle 会级联触发 h5py/numpy 导入（hickle.py:45-46），test_package 需做可选依赖 fallback"
  - "直接拷贝 hickle/ 目录到 site-packages 即可 import，避免 pip install 的 setuptools/build-isolation 依赖"
  - "hickle 5.0.3 上游与 numpy 2.x 存在兼容缺陷（np.array(copy=False)/dtype 直赋/tostring），适配时需打 portability 补丁；dill 为上游 tests 依赖（requirements_test.txt 声明），运行 pytest 前需安装"
