package: hickle/5.0.3
homepage: "https://github.com/telegraphic/hickle"

# 上游测试命令（hickle 用 pytest，需 h5py/numpy/scipy/astropy 等科学计算栈）
upstream_check_command: "python3 -m pytest hickle/tests/ -o addopts='' -p no:cacheprovider"
# 上游 pytest 未集成到 conanfile.py build()（build() 为纯拷贝无编译），仅在本机/真机单独运行验证，见 manifest.yaml upstream_test_run
upstream_test_in_build: false
upstream_tests:
