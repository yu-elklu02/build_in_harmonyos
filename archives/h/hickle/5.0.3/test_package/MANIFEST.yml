# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.py
    description: "包完整性校验（__version__==5.0.3 + 模块文件存在）+ h5py/numpy 可用时 dump/load 往返"
    command: "python3 test.py"

# 测试断言总数（近似值）
assertion_count: 3
