# conandata.yml — hickle 5.0.3
# 纯 Python 包（py3-none-any），setuptools 后端，无需编译/补丁。
# 运行期依赖 h5py>=2.10.0 与 numpy>=1.8(!=1.20) 由目标 Python 环境提供，
# 不作为 Conan requires 声明（制品仓未发布 h5py/numpy 配方）。
sources:
  url: "https://files.pythonhosted.org/packages/b1/42/09a543153c1609b656f5c8e33210d6bdd1b7045c0d6e33bc96bb9afbb704/hickle-5.0.3.tar.gz"
  sha256: "027e51ccad279d168123a244525e6c84bac0db64605b311b0bd349891be0c53e"

# numpy 2.x / astropy 8.x / setuptools(PEP 706) 兼容性补丁：
# 上游 hickle 5.0.3 在 numpy 2.x 下 7 个 pytest 用例失败，均为上游缺陷，
# 通过以下补丁修复后 102/102 全部通过。详见 manifest.yaml upstream_test_run。
patches:
  - patch_file: "patches/0001-load_builtins-numpy2.patch"
    patch_description: "numpy 2.x: np.asarray 替代 np.array(copy=False) (load_builtins.py)"
    patch_type: "portability"
  - patch_file: "patches/0002-load_numpy-numpy2.patch"
    patch_description: "numpy 2.x: np.asarray 替代 np.array(copy=False) (load_numpy.py)"
    patch_type: "portability"
  - patch_file: "patches/0003-lookup-numpy2.patch"
    patch_description: "numpy 2.5: 数组 dtype 直接赋值废弃, 改用 view() (lookup.py)"
    patch_type: "portability"
  - patch_file: "patches/0004-test-astropy-tostring.patch"
    patch_description: "astropy 8/numpy 2.x: numpy.str_.tostring() 已移除, 改用 str() (test_06_load_astropy.py)"
    patch_type: "portability"
  - patch_file: "patches/0005-legacy-v3-pkg_resources.patch"
    patch_description: "setuptools(PEP 706) 不再自带 pkg_resources, 移除未使用的导入 (legacy_v3/hickle.py)"
    patch_type: "portability"
