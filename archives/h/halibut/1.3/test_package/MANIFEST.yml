# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: halibut/1.3
homepage: "https://www.chiark.greenend.org.uk/~sgtatham/halibut/"

# 上游测试命令 (halibut 无独立测试框架，仅由 CMake 构建文档)
upstream_check_command: "cmake --build build --target manual"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（halibut 没有单独的测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 halibut 二进制可执行且 --version 和基本 HTML 输出正常"
    command: "./test_halibut"

# 测试断言总数
assertion_count: 2