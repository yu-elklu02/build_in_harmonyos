package: hunspell-ca/3.0.91
homepage: "https://www.softcatala.org/projectes/corrector-ortografic/"

upstream_check_command: "none (the upstream data archive has no test target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "No upstream test program or test target is shipped"
  total: 0

test_package_tests:
  - file: test_hunspell_ca.cpp
    scenario: normal
    description: "Validate three locale pairs, entry counts, aliases, and Catalan/Valencian words"
    command: "./test_hunspell_ca <dictionary-directory>"
  - file: test_hunspell_ca.cpp
    scenario: fault-injection
    description: "Verify that a missing dictionary directory is rejected"
    command: "./test_hunspell_ca --expect-missing <missing-directory>"

assertion_count: 10
