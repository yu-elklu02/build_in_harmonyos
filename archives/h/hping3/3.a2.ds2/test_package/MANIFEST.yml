# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: hping3/3.a2.ds2
homepage: http://www.hping.org/

# 上游测试命令
# hping3 上游 Makefile.in 中无 test/check 目标，无测试框架
upstream_check_command: ""
upstream_test_command: ""

# 上游实际运行的测试程序
# hping3 上游 Makefile.in 中无 test/check 目标，无测试框架
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/src/test_hping3.c
    description: "验证 hping3 二进制存在、--version/--help 输出（3 个断言）"
    command: "./test_hping3"

# 测试断言总数
assertion_count: 3
