# conandata.yml — hping3 3.a2.ds2

sources:
  url: "https://deb.debian.org/debian/pool/main/h/hping3/hping3_3.a2.ds2.orig.tar.gz"
  sha256: "be027ed1bc1ebebd2a91c48936493024c3895e789c8490830e273ee7fe6fc09d"

patches:
  - patch_file: "patches/0001-bytesex-aarch64.patch"
    patch_description: "bytesex.h: 添加 __aarch64__ 小端识别（OHOS aarch64 支持）"
    patch_type: "portability"
  - patch_file: "patches/0002-globals-pcap-optional.patch"
    patch_description: "globals.h: pcap 头文件/声明改为 USE_PCAP 条件编译（无 libpcap 也可编译）"
    patch_type: "portability"
  - patch_file: "patches/0003-makefile-cc-override.patch"
    patch_description: "Makefile.in: CC=gcc → CC?=gcc 允许交叉编译器覆盖 + 移除 libpcap_stuff.o"
    patch_type: "portability"
  - patch_file: "patches/0004-main-pcap-optional.patch"
    patch_description: "main.c: pcap 头文件/声明/open_pcap 调用 USE_PCAP 条件编译"
    patch_type: "portability"
  - patch_file: "patches/0005-script-pcap-optional.patch"
    patch_description: "script.c: pcap 头文件 USE_PCAP 条件编译"
    patch_type: "portability"
  - patch_file: "patches/0006-libpcap-stuff-optional.patch"
    patch_description: "libpcap_stuff.c: 整个文件 USE_PCAP 条件编译（默认不编译）"
    patch_type: "portability"
  - patch_file: "patches/0007-configure-no-pcap.patch"
    patch_description: "configure: PCAP 默认置空，不链接 -lpcap（无 libpcap 也可构建）"
    patch_type: "portability"
  - patch_file: "patches/0008-getlhs-pcap-optional.patch"
    patch_description: "getlhs.c: 无 USE_PCAP 时 get_linkhdr_size 返回默认以太网头部大小"
    patch_type: "portability"
  - patch_file: "patches/0009-sendip-pcap-optional.patch"
    patch_description: "sendip.c: close_pcap 调用 USE_PCAP 条件编译"
    patch_type: "portability"
  - patch_file: "patches/0010-statistics-pcap-optional.patch"
    patch_description: "statistics.c: close_pcap 调用 USE_PCAP 条件编译"
    patch_type: "portability"
  - patch_file: "patches/0011-waitpacket-pcap-optional.patch"
    patch_description: "waitpacket.c: pcap_recv 调用 USE_PCAP 条件编译"
    patch_type: "portability"
  - patch_file: "patches/0012-hping2-extern-delaytable.patch"
    patch_description: "hping2.h: delaytable 改为 extern 声明（消除 clang/lld 重复符号错误）"
    patch_type: "portability"
  - patch_file: "patches/0013-getifname-ohos-linux.patch"
    patch_description: "getifname.c: 条件编译增加 __linux__ 识别（OHOS 平台 get_if_name 可用）"
    patch_type: "portability"

