knowledge_gained:
  - "htop 3.4.1 有 bug: linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确"
  - "鸿蒙 SELinux 策略限制 /proc 文件系统访问，普通用户无法读取 /proc/stat"
  - "config.guess/config.sub 在 build-aux/ 子目录"
  - "HarmonyOS /bin/sh 无法访问 umask 077 创建的 mktemp 目录，需用 CONFIG_SHELL=bash + umask 022"
  - "make -j2 触发 mkfifo 权限错误，需用 -j1"

