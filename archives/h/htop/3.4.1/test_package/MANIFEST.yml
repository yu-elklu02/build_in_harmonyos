# test_package/MANIFEST.yml
# Upstream test declaration (L0e required)
# htop has no official test suite; verified via --version smoke test

package: htop/3.4.1
homepage: "https://htop.dev/"

upstream_check_command: "make check"

# htop has no upstream test suite
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (htop has no test suite)
upstream_tests: []

# Consumer-side verification: run htop --version
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: verify htop --version runs successfully"
    command: "htop --version"

assertion_count: 1
