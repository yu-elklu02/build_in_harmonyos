software: htop
display: "htop"
description: "Interactive process viewer for Unix systems"
category: system
homepage: "https://htop.dev/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 sudo 权限运行，鸿蒙 SELinux 限制 /proc 文件系统访问"
    - "ncursesw 需静态链接以避免 SELinux 限制"
    - "config.guess/config.sub 在 build-aux/ 子目录（不在根目录）"
    - "htop 3.4.1 有 bug: linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确"
    - "HarmonyOS /bin/sh 无法访问 umask 077 创建的 mktemp 目录，需用 CONFIG_SHELL=bash + umask 022"
    - "make -j2 触发 mkfifo 权限错误，需用 -j1"
  common_dependencies:
    - ncurses

versions:
  "3.4.1":
    status: built
    build_date: "2026-08-10"
