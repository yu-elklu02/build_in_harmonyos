# test_package/MANIFEST.yml
# CI script (build_and_test.sh L0e) requires this file to exist

package: heirloom-doctools/191015
homepage: "https://github.com/n-t-roff/heirloom-doctools"

# Upstream test command (make check uses test/ and doc/ subdirectories)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests
upstream_tests:
  - file: test
    source: heirloom-doctools-191015/test
    description: "Upstream troff/nroff test suite"
    command: "make test"

# Consumer-side test in test_package
test_package_tests:
  - file: conanfile.py
    description: "Run nroff with simple troff input to verify binary works"
    command: "echo '.TL Test Document' | nroff -Tutf8"

assertion_count: 1
