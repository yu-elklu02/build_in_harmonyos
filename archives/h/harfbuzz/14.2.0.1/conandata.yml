sources:
  url: "https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz"
  sha256: "94017020f96d025bb66ae91574e4cf334bcad23e8175a8a40565b3721bc2eaff"

patches:
  - patch_file: "patches/0001-static-tests.patch"
    patch_description: "OHOS: build paired static HarfBuzz archives (libharfbuzz_static, libharfbuzz_subset_static, libharfbuzz_{raster,vector,gpu}_static); route src/api/threads/fuzzing test executables and util/{hb-shape,hb-vector,hb-raster,hb-subset,hb-info,...} utility binaries to those static archives, fully replacing (not augmenting) libharfbuzz_dep / libharfbuzz_{subset,raster,vector,gpu}_dep in executable() dependencies/link_with. Root meson.build only adds comments — no static: on glib_dep/gobject_dep; static glib linkage (libglib-2.0.a / libintl.a) is handled by conanfile.py requires(glib, shared=False) and _inject_static_glib_intl(), not by this patch. Net effect: NO ELF NEEDED entry for libharfbuzz*.so, libglib-2.0.so, libgobject-2.0.so, or libintl.so on OHOS — tests run where namespace.default.lib.paths forbids dlopen from /storage."
    patch_type: "portability"
  - patch_file: "patches/0002-subset-repack-no-fonttools.patch"
    patch_description: "harmonyos/portable: gracefully degrade subset+repack tests when fontTools is missing — skip the redundant TTF-parse sanity check instead of sys.exit()'ing the whole test (allows 6 subset+repack tests to pass on Python installs without fontTools; aligns with run-tests.py graceful fallback pattern)"
    patch_type: "portability"
