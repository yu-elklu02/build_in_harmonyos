software: harfbuzz
display: "HarfBuzz"
description: "Text shaping library for OpenType fonts"
category: gfx
homepage: "https://harfbuzz.github.io/"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "依赖已发布的 freetype/2.14.3；该包禁用 harfbuzz，避免依赖环"
    - "使用 Meson 构建 core、subset 和 vector 三个库组件"
    - "14.2.0.1 启用 glib（OHOS 上 shared=False 静态链入）；gobject 在 OHOS 强制 disabled（PkgConfigDeps 不发射 glib_mkenums），其他平台保持 enabled；可选 cairo/icu/graphite 仍可关"
    - "Linux/OHOS 通过统一解析器从 Conan clang 路径解析绝对 LLVM 工具并保留版本后缀，Windows/MSVC 保持 Meson 原生处理"
    - "共享库签名：按 BINARY_SIGN_TOOL/LLVM_OBJCOPY → user.ohos conf → Conan clang 同目录 → PATH → 末位兜底 hnp/bin 解析绝对路径；命令参数经 shlex.quote"
  common_dependencies:
    - freetype
    - glib

versions:
  "14.2.0":
    status: built
    build_date: "2026-07-17"
  "14.2.0.1":
    status: recipe
    build_date: "2026-07-25"
    note: "R37 Conan meson; utilities=enabled; glib/2.84.0.1; meson test 236/236"
