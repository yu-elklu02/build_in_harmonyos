software: "harfbuzz"
version: "14.2.0"
status: built
build_date: "2026-07-17"
build_system: meson

source:
  url: "https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz"
  tar_format: tar.xz

configure_options:
  - "freetype=enabled"
  - "subset=enabled"
  - "vector=enabled"
  - "tests=enabled"
  - "utilities=disabled"

build:
  system: meson
  dependencies:
    - "freetype/2.14.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "freetype/2.14.3 已禁用 harfbuzz，可作为无环的已发布前置依赖"
  - "MesonToolchain 会从 shared 选项生成唯一 default_library，不应在 project_options 重复声明"
  - "PkgConfigDeps 可生成 freetype2.pc 并通过 pkg_config_path 供 Meson 使用"
  - "core/subset/vector 组件和 59 组上游测试可在同一配方中构建验证"
  - "OHOS Meson native file 需要通过统一解析器注入 clang 同目录的 llvm-ar/llvm-ranlib，并保留 clang-15 等版本后缀"
  - "OHOS Python posix_spawn 不可靠地解析裸工具名，上游测试需使用 clang 同目录 llvm-nm/llvm-objdump 的绝对路径"
  - "共享库签名工具从 Conan clang 同目录或 PATH 解析绝对路径，并对工具与库路径执行 POSIX shell quoting，禁止依赖固定 Worker 目录或裸路径拼接"
  - "Meson install 改写共享库 ELF 后需要在 OHOS 上重新 selfSign"
  - "静态 harfbuzz 消费者需要传播上游 harfbuzz.pc 的 pthread 和 m 私有链接库"
