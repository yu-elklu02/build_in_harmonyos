# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: htpdate/1.3.7
homepage: "https://github.com/twekkel/htpdate"

# 上游测试命令 (htpdate Makefile test 目标依赖网络, 不适合 CI)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# htpdate 上游 test 目标为网络测试, 不适合 CI 环境, 仅做消费者测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# htpdate 上游 Makefile test 目标为网络测试 (./htpdate -v, -p, -d 等), 不适合 CI
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "htpdate -v 版本检查 + htpdate -h 帮助输出验证"
    command: "htpdate -v && htpdate -h || true"

# 测试场景总数 (test_package 消费者测试场景)
# 注: 本字段按"测试场景数"统计, 不等同于断言数
assertion_count: 2
