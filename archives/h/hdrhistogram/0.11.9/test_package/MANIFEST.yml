package: hdrhistogram/0.11.9
homepage: "https://github.com/HdrHistogram/HdrHistogram_c"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: test/hdr_histogram_test.c
    source: HdrHistogram_c-0.11.9/test/hdr_histogram_test.c
    description: "Core histogram API tests"
    command: "./test/hdr_histogram_test"
  - file: test/hdr_histogram_atomic_test.c
    source: HdrHistogram_c-0.11.9/test/hdr_histogram_atomic_test.c
    description: "Atomic histogram API tests"
    command: "./test/hdr_histogram_atomic_test"
  - file: test/hdr_atomic_test.c
    source: HdrHistogram_c-0.11.9/test/hdr_atomic_test.c
    description: "Atomic primitive tests"
    command: "./test/hdr_atomic_test"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test for hdr_init, hdr_record_value, hdr_record_values, total_count field, and hdr_max"
    command: "./test_hdrhistogram"

assertion_count: 39
