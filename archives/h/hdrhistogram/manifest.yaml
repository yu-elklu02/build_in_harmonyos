software: hdrhistogram
display: "HdrHistogram C"
description: "High Dynamic Range Histogram C implementation for latency and performance measurement"
category: data
homepage: "https://github.com/HdrHistogram/HdrHistogram_c"
license: CC0-1.0 / BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "需添加 time.h/unistd.h 头文件和宏定义解决 CLOCK_MONOTONIC/CLOCK_REALTIME 未定义问题"
    - "hdr_histogram_perf 是长跑性能测试，需支持 --version/--help 以通过命令行安全探测"
    - "HDR_LOG 功能需 zlib，暂不可用时禁用（HDR_LOG_REQUIRED=OFF）"
    - "GitHub 无法直接访问，需用 jsdelivr CDN 镜像下载"
  common_dependencies: []

versions:
  "0.11.9":
    status: published
    build_date: "2026-04-20"
