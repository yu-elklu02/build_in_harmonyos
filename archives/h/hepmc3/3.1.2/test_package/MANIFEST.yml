# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hepmc3/3.1.2
homepage: "https://hepmc.hepforge.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序
# 12 个纯单元测试在 build() 中通过 cmake.test() 运行:
#   testBoost/testMass/testPrintBug/testPolarization/testMultipleCopies/testLoops/
#   testDelete/testIO1/testIO3/testIO6/testReaderFactory1/testThreads1
# 6 个外部依赖测试豁免 (OHOS 无对应依赖, CMake find_package 守卫未触发, 不构建):
#   testIO2/testIO4/testReaderFactory2 (需 ROOT)
#   testPythia1/testPythia2/testPhotos1 (需 Pythia8/Photos)
upstream_tests:
  - file: test/
    source: HepMC3-3.1.2/test/
    description: "HepMC3 内置单元测试套件 (ctest) — 12 个纯单元测试运行, 6 个外部依赖测试豁免"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_hepmc3.cpp
    description: "创建 GenEvent 并添加顶点和粒子，验证库可正常链接和事件结构正确"
    command: "./test_hepmc3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
