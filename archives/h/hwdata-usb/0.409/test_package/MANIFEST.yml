package: hwdata-usb/0.409
homepage: "https://github.com/vcrhonek/hwdata"

upstream_check_command: >-
  ./configure --disable-blacklist;
  lspci replay; check-pci-ids.py; bash check-usb-ids.sh;
  iconv validation for five ID files; report PCI/USB dates
upstream_test_in_build: true
upstream_test_command: "the commands from upstream make check, with two documented host-tool compatibility adaptations"
upstream_tests:
  counting_basis: "10 logical checks in make check; 3 additional FMF installed-system entries"
  make_check:
    lspci_replay_or_offline_dump_compatibility: 1
    pci_ordering: 1
    usb_container_or_offline_database_compatibility: 1
    utf8_files: 5
    date_reports: 2
    total: 10
  fmf_integration_entries:
    - tests/ids-files
    - tests/python-hwdata
    - tests/syntax
  fmf_total: 3
  adapted_cases:
    - original: "lspci -A dump -O dump.name=lspci-dump.txt -i pci.ids"
      condition: "the host lspci lacks the pciutils -A dump backend"
      adaptation: "parse every lspci-dump.txt device record and require its vendor/device pair in pci.ids"
    - original: "check-usb-ids.sh using a privileged Podman container"
      condition: "Podman is unavailable on the CI worker"
      adaptation: "parse usb.ids offline, enforce ordering and scale, and require known Linux Foundation root-hub IDs"

test_package_tests:
  - file: test_hwdata_usb.cpp
    scenario: normal
    description: "Read USB_IDS_FILE from the Conan run environment, then parse USB IDs and check ordering, scale, known IDs, and a negative lookup"
    command: "./test_hwdata_usb"
  - file: test_hwdata_usb.cpp
    scenario: fault-injection
    description: "Verify that a missing USB database path is rejected"
    command: "./test_hwdata_usb --expect-missing <missing-path>"

assertion_count: 10
