# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: highway/1.3.0
homepage: https://github.com/google/highway

# 上游测试命令
upstream_check_command: "cmake -DHWY_ENABLE_TESTS=ON -DHWY_ENABLE_EXAMPLES=OFF -DHWY_ENABLE_CONTRIB=OFF .. && cmake --build . --target hwy_test && ./hwy_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (highway 1.3.0 官方测试套件)
# Highway 上游使用 cmake 的 HWY_ENABLE_TESTS 开关控制测试构建，
# 所有测试编译为 hwy_test 单一可执行文件，通过 ctest 调度。
upstream_tests:
  - file: hwy/tests/
    source: highway-1.3.0/hwy/tests/
    description: "Highway SIMD 官方测试套件 — 200+ 用例覆盖算术/逻辑/类型转换/压缩/排序/密码学等"
    command: "cmake -DHWY_ENABLE_TESTS=ON .. && cmake --build . -j && ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(hwy REQUIRED CONFIG) + target_link_libraries hwy::hwy"
    command: "cmake --configure"
  - file: test_package/src/test_highway.cc
    description: "HWY_STATIC_DISPATCH + LoadU/Add/StoreU SIMD 向量运算 + HWY_ARCH 检测"
    command: "test_highway"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 210
