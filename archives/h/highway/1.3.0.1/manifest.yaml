software: highway
version: "1.3.0.1"
status: built
build_system: cmake
source:
  url: "https://github.com/google/highway/archive/refs/tags/1.3.0.tar.gz"
  sha256: "07b3c1ba2c1096878a85a31a5b9b3757427af963b1141ca904db2f9f4afe0bc2"
build:
  options:
    - "BUILD_SHARED_LIBS=OFF"
    - "with_upstream_tests=False (default)"
    - "HWY_ENABLE_CONTRIB=ON only with upstream tests"
    - "HWY_ENABLE_EXAMPLES=OFF"
    - "HWY_ENABLE_TESTS=ON only with upstream tests"
    - "HWY_TEST_STANDALONE=ON only with upstream tests"
    - "HWY_FORCE_STATIC_LIBS=ON"
libs:
  - hwy
requires: []
test_package:
  type: cmake-consumer
  checks: 7
adaptation_paths:
  - A
notes:
  - "Suffixed repair version for the already published upstream 1.3.0 package."
  - "Default package builds only the core library; with_upstream_tests=True enables the upstream and contrib test matrix."
  - "The opt-in upstream suite uses Highway's HWY_TEST_STANDALONE runner and does not download GoogleTest."
  - "HarmonyOS PC upstream-test evidence must be recorded separately after the current head executes it."
