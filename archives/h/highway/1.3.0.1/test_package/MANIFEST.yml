# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e.

package: highway/1.3.0.1
homepage: "https://github.com/google/highway"

upstream_check_command: "conan create archives/h/highway/1.3.0.1 -o highway/*:with_upstream_tests=True"
upstream_test_in_build: true
upstream_test_mode: "optional: -o highway/*:with_upstream_tests=True"
upstream_test_command: "conan create archives/h/highway/1.3.0.1 -o highway/*:with_upstream_tests=True"

upstream_tests:
  - file: hwy/tests/
    source: highway-1.3.0/hwy/tests/
    description: "Google Highway upstream SIMD target, vector operation, and contrib tests; enabled only by with_upstream_tests=True and run through Highway's standalone GTest-compatible runner."
    command: "ctest --output-on-failure --no-tests=error"

test_package_tests:
  - file: test_highway.cpp
    description: "Consumer test for target detection, capped lane count, SIMD load/arithmetic/store, and inactive-lane preservation."
    command: "./test_highway"

assertion_count: 7
