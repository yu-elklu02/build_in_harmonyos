# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: hexagonrpcd/0.4.0
homepage: "https://github.com/linux-msm/hexagonrpc"

# 上游测试命令
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（meson test：iobuffer / hexagonfs）
upstream_tests:
  - file: test_iobuffer.c
    source: tests/test_iobuffer.c
    description: "iobuffer 单元测试（上游 meson test iobuffer）"
    command: "meson test iobuffer"
  - file: test_hexagonfs.c
    source: tests/test_hexagonfs.c
    description: "hexagonfs 单元测试（上游 meson test hexagonfs）"
    command: "meson test hexagonfs"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libhexagonrpc，调用 fastrpc_create_context/destroy_context API"
    command: "./test_hexagonrpcd"

# 测试断言总数
assertion_count: 2
