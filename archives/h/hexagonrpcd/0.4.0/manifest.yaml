# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.0"

# 软件名
software: "hexagonrpcd"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-02"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/linux-msm/hexagonrpc/archive/refs/tags/v0.4.0.tar.gz"

  # 源码校验和
  sha256: "fe742549a2672902d59a90dafd741a9a0acbeca059e07ff5130e2b525a66574f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson 项目，纯 C，无硬外部依赖（json-c 为可选依赖，缺失时跳过 sscregistrygen）"
  - "上游 meson.build 未安装 public headers，conanfile.py package() 手动拷贝 include/libhexagonrpc"
  - "产物包含可执行文件 hexagonrpcd/chrecd + 共享库 libhexagonrpc.so（soversion 0.4）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/hexagonrpcd-0.4.0.orig
  source_work_dir: /storage/Users/currentUser/builds/hexagonrpcd-0.4.0.work
  source_orig_hash: ""
  source_work_hash: ""
  generated_at: ""
  patches_count: 0
