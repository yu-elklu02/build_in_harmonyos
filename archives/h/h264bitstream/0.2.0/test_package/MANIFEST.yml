# test_package/MANIFEST.yml
# h264bitstream has no upstream test suite (make check = "Nothing to be done")

package: h264bitstream/0.2.0
homepage: "https://sourceforge.net/projects/h264bitstream/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_package/test.c
    description: "Link against libh264bitstream and call h264_new/h264_free API"
    command: "./test_h264bitstream"

assertion_count: 3
