package: hypre/3.1.0
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"
upstream_tests:
  - file: src/test/TEST_ij/solvers.sh
    description: "Sequential IJ solver regression group"
    command: "ctest -R test_ij_solvers"
  - file: src/test/TEST_struct/solvers.sh
    description: "Sequential Struct solver regression group"
    command: "ctest -R test_struct_solvers"
  - file: src/test/TEST_sstruct/solvers.sh
    description: "Sequential SStruct solver regression group"
    command: "ctest -R test_sstruct_solvers"
upstream_test_count: 3
test_package_tests:
  - file: test.c
    description: "Initialize hypre, verify the exact version tuple, and finalize"
    command: "./test_hypre"
assertion_count: 6
