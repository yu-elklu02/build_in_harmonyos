package: kainjow-mustache/4.1
homepage: "https://github.com/kainjow/Mustache"

upstream_check_command: "make clang CXX=clang++ && ./mustache"
upstream_test_in_build: false
upstream_test_command: "make clang CXX=clang++ && ./mustache"

upstream_tests:
  - file: tests.cpp
    source: Mustache-4.1/tests.cpp
    description: "Upstream Catch suite covering parsing, rendering, sections, lambdas, and errors"
    command: "./mustache"

test_package_tests:
  - file: test.c
    description: "Consumer compiles mustache.hpp and verifies variable, section, and HTML-escaped rendering"
    command: "./test_kainjow_mustache"

assertion_count: 321
