# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kallisto/0.52.0
homepage: "https://pachterlab.github.io/kallisto/"

# 上游测试命令（CMake BUILD_TESTING + BUILD_FUNCTESTING 两个开关）
upstream_check_command: "cmake .. -DBUILD_TESTING=ON -DBUILD_FUNCTESTING=ON && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试（unit_tests 已集成实测）
upstream_test_in_build: true
upstream_test_command: "unit_tests/tests（Catch2 单测，build() 内直接运行）"

# 上游实际运行的测试程序（实测 2026-08-15，OHOS 环境）：
# - unit_tests/（Catch2，4 个测试源文件 + main.cpp）：build() 内实际运行
# - func_tests/runtests.sh（38 个功能测试）：所需数据文件（aa_ref.fasta、
#   simple.fasta、small.fastq.gz 等）未随上游 sdist 打包（sdist 中 func_tests/
#   仅含 CMakeLists.txt + runtests.sh，0 个数据文件），无法运行，按规则豁免
upstream_tests:
  - file: unit_tests/
    source: kallisto-0.52.0/unit_tests/
    description: "Catch2 单元测试（main.cpp + test_index/test_kmerhashtable/test_multinomial/test_weights，实测运行）"
    command: "unit_tests/tests"
  - file: func_tests/runtests.sh
    source: kallisto-0.52.0/func_tests/runtests.sh
    description: "功能测试（38 项 index/quant/bus 命令断言）；数据文件未随上游 sdist 打包，无法运行（豁免）"
    command: "func_tests/runtests.sh"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试：kallisto version 断言 + 上游 unit_tests/input 数据 index+quant 冒烟（产出 abundance.tsv）"
    command: "kallisto version && kallisto index && kallisto quant"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 4
