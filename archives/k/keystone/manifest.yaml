software: keystone
display: "Keystone Assembler Engine"
description: "Lightweight multi-platform, multi-architecture assembler framework based on LLVM"
category: dev
homepage: "https://github.com/keystone-engine/keystone"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "vendored LLVM 使用 common symbols，clang 15+ 需 -fcommon 合并以避免重复符号链接错误"
    - "cmake_minimum_required(VERSION 2.8.7) 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容新版 CMake"
    - "无外部依赖，LLVM 内嵌在 llvm/ 目录由 add_subdirectory 构建"
    - "混合类型：既有库 libkeystone 又有可执行文件 kstool，需 commands.json (R38)"
  common_dependencies: []

versions:
  "0.9.2":
    status: built
    build_date: "2026-07-28"
    conan_ref: "keystone/0.9.2"
