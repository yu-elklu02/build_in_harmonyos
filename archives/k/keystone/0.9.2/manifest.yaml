version: "0.9.2"
status: built
build_date: "2026-07-30"
conan_ref: "keystone/0.9.2"

source:
  url: "https://github.com/keystone-engine/keystone/archive/refs/tags/0.9.2.tar.gz"
  sha256: "c9b3a343ed3e05ee168d29daf89820aff9effb2c74c6803c2d9e21d55b5b7c24"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "BUILD_LIBS_ONLY=False"
    - "LLVM_TARGETS_TO_BUILD=all"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++
  extra_flags:
    - "-fcommon"

patches_applied:
  - "patches/0001-config-guess-harmonyos.patch"
  - "patches/0002-cmake-cmp0051-new.patch"
  - "patches/0003-cmake-harmonyos-platform.patch"

patches_description:
  0001-config-guess-harmonyos.patch: "Avoid the legacy LLVM host probe fallback and report aarch64-unknown-linux-ohos on HarmonyOS"
  0002-cmake-cmp0051-new.patch: "Replace the removed CMP0051 OLD behavior in both top-level and vendored LLVM CMake files"
  0003-cmake-harmonyos-platform.patch: "Load Linux-compatible CMake platform rules for HarmonyOS and set the UNIX platform flag before LLVM configuration"

knowledge_gained:
  - "keystone 基于内置 fork LLVM，无外部依赖，构建系统为 CMake"
  - "旧版 vendored LLVM 含 common symbols（临时定义），clang 15+ 需 -fcommon 合并以避免重复符号链接错误"
  - "cmake_minimum_required(VERSION 2.8.7) 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容新版 CMake"
  - "CMake 的 HarmonyOS 平台模块必须在 project() 前加入 CMAKE_MODULE_PATH；HarmonyOS-Initialize 设置 UNIX，HarmonyOS 平台文件复用 Linux ELF/链接规则，同时保持真机原生构建语义"
  - "keystone 既有库（libkeystone）又有可执行文件（kstool），需 commands.json (R38)"
  - "构建产物包括 libkeystone.a、kstool 可执行文件、keystone.pc pkg-config 文件"

ci_verification:
  scope: "本地 OHOS aarch64 交叉构建模拟；无已连接的 OHOS 设备，不等同于真机原生 W3"
  environment: "Windows host, Python 3.12.9, Conan 2.29.1, OHOS SDK Clang 15.0.4, CMake, Ninja"
  source: "PASS - 官方源码 SHA256 校验通过，三个补丁按 conandata.yml 顺序干净应用"
  configure: "PASS - 目标三元组 aarch64-unknown-linux-ohos，CMake 识别 AArch64，未再出现 Unable to determine platform"
  build: "PASS - Ninja 227/227，生成 libkeystone.a 与 kstool"
  artifacts: "PASS - libkeystone.a 与 kstool 均确认包含 AArch64 目标代码"
  test_package: "PARTIAL - test.cpp 已针对 libkeystone.a 编译并链接；未在目标设备运行"
  native_w3: "NOT RUN - hdc list targets 返回 [Empty]；远端 CI 结果为最终依据"
