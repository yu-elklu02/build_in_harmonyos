# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: keystone/0.9.2
homepage: "https://github.com/keystone-engine/keystone"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cd suite && bash test-all.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# keystone 上游测试位于 suite/ 目录，基于 shell/python 脚本驱动 kstool
# suite/test-all.sh 需要构建好的 kstool 在 PATH 中，不属于 CTest 框架
upstream_tests:
  - file: suite/test-all.sh
    source: keystone-0.9.2/suite/test-all.sh
    description: "上游回归测试脚本，驱动 kstool 对多架构汇编指令进行编码验证"
    command: "cd suite && bash test-all.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 验证 keystone 库链接和 ks_open/ks_asm/ks_close API"
    command: "./test_keystone"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
