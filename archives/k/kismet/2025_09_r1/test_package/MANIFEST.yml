package: kismet/2025_09_r1
homepage: "https://www.kismetwireless.net/"

upstream_check_command: "conan create archives/k/kismet/2025_09_r1 -o kismet/*:with_upstream_tests=True"
upstream_test_in_build: true
upstream_test_mode: "optional: -o kismet/*:with_upstream_tests=True"
upstream_test_command: "conan create archives/k/kismet/2025_09_r1 -o kismet/*:with_upstream_tests=True"

upstream_tests:
  - file: "datasource_virtual.h"
    source: "kismet-2025-09-R1/datasource_virtual.h"
    description: "Upstream virtual datasource compile gate; selected with mock/virtual source audit and excludes /dev/input, hidraw, and uinput hardware paths."
    command: "c++ -std=c++17 -DFMT_HEADER_ONLY -I. -fsyntax-only datasource_virtual.h"
    status: "pass"
    result: "virtual datasource header compiled with -fsyntax-only"
    reason: "Compile-only upstream virtual datasource coverage; no real input hardware access"
  - file: "alphanum.hpp"
    source: "kismet-2025-09-R1/alphanum.hpp"
    description: "Upstream TESTMAIN regression for natural-sort comparison; selected with virtual/mock source audit and excludes /dev/input, hidraw, and uinput hardware paths."
    command: "c++ -std=c++17 -DTESTMAIN -include string.h -x c++ alphanum.hpp -o kismet-alphanum-test && ./kismet-alphanum-test"
    status: "pass"
    result: "37 upstream asserts passed"
    reason: "Standalone upstream regression; no real input hardware access"

test_package_tests:
  - file: test_cli.py
    description: "Consumer test runs packaged Kismet command-line tools, verifies stable metadata/help output, and checks a missing-input failure path."
    command: "python test_cli.py"

assertion_count: 3
