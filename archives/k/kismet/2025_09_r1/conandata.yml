sources:
  url: "https://codeload.github.com/kismetwireless/kismet/tar.gz/refs/tags/kismet-2025-09-R1"
  filename: "kismet-2025-09-R1.tar.gz"
  sha256: "56c269e4f7357c327e6c190ebbc5d6b77e97b5b48c0ffc120d56ccf15087fa91"
patches:
  - patch_file: "patches/0001-config-sub-add-linux-ohos.patch"
    patch_description: "Recognize the aarch64-linux-ohos host triplet used by the OHOS Conan toolchain"
    patch_type: "portability"
  - patch_file: "patches/0002-disable-linux-hci-capture-on-ohos.patch"
    patch_description: "Do not build Linux-only capture helpers for linux-ohos targets"
    patch_type: "portability"
  - patch_file: "patches/0003-disable-datasource-captures-on-ohos.patch"
    patch_description: "Do not build datasource capture helper binaries that require pthread cancellation APIs unavailable on linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0004-guard-fmt-header-only-define.patch"
    patch_description: "Avoid redefining the bundled fmt header-only macro when the build also defines it for direct fmt includes"
    patch_type: "portability"
