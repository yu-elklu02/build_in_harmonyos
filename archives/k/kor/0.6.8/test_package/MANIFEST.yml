package: kor/0.6.8
homepage: "https://github.com/yonahd/kor"

upstream_check_command: "go test -count=1 ./..."
upstream_test_in_build: false
upstream_test_command: "go test -c -short -count=1 -timeout 120s -o <ext2>/<pkg>.test <pkg> && sign <pkg>.test && <pkg>.test -test.v -test.short"

upstream_tests:
  - file: pkg/kor/kor_test.go
    source: kor-0.6.8/pkg/kor/kor_test.go
    description: "Kubernetes resource discovery tests (fake clientsets, hermetic)"
    command: "go test ./pkg/kor/"
  - file: pkg/filters/filters_test.go
    source: kor-0.6.8/pkg/filters/filters_test.go
    description: "Filter options / owner-reference logic (hermetic)"
    command: "go test ./pkg/filters/"
  - file: pkg/utils/slack_test.go
    source: kor-0.6.8/pkg/utils/slack_test.go
    description: "Slack webhook payloads (httpmock, hermetic)"
    command: "go test ./pkg/utils/"

test_package_tests:
  - file: test.sh
    description: "Smoke test: kor version / --help"
    command: "bash test.sh"
