version: "0.6.8"
status: published
build_date: "2026-08-07"

software: kor
build_system: go

source:
  url: "https://github.com/yonahd/kor/archive/refs/tags/v0.6.8.tar.gz"
  sha256: "e651f3178e8c9cc1cd522661ac129b2518ed3fc981b0a9eebdf531e9c0b17b17"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0 go build -trimpath -ldflags=-s -ldflags=-w -o kor main.go"
    - "go mod download (GOPROXY=https://goproxy.cn,direct)"
  dependencies:
    - "go/1.25.7 (self-bootstrapped linux-arm64, E128 re-signed)"
  cc: go
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go 项目用 GOPROXY=https://goproxy.cn,direct 拉取模块依赖"
  - "CGO_ENABLED=0 + -ldflags=\"-s -w\" 生成静态剥离二进制"
  - "E128 规则:Go 工具链与产物 ELF 均需 binary-sign-tool 签名才能在鸿蒙 execve"
  - "E166 规则:Go linker mmap 输出在 HMDFS 上 permission denied, 路由到 ext2 分区"
  - "上游 120 个 Test 函数 (pkg/kor 110 + pkg/filters 3 + pkg/utils 7), 全部 fake clientset/hermetic, 可离线运行"

platform_workarounds:
  - problem: "hmbs 预检环境无 Go 工具链 (HMBS_BUILD_TOOLS 仅含 cmake/make/ninja/python3; ~/sdk/ 下无预装签名 Go)"
    solution: "build() 内自举下载 go1.25.7.linux-arm64.tar.gz (SHA-256 校验, 官方值 ba611a53...); 解压到 ext2 父目录再 os.rename 为 go1.25.7/ (boot_root/bin/go 真实存在); 对 bin/ + pkg/tool/linux_arm64/ 下每个 ELF 走 E077 四步签名 (llvm-objcopy 移段 -> binary-sign-tool selfSign -> chmod 0o755 复位 owner x 位); sentinel 缓存免重签"
    knowledge_ref: "E128 (Go ELF 需签名才能 execve) + E077 (ELF 签名四步) + E046 (HMDFS chmod 钳位但 owner 位保留)"
  - problem: "go 调用靠 PATH 查找在 Conan /bin/sh 下时序有坑"
    solution: "_go_env 改返回 (env, go_bin); build()/test() 全部用 %s 拼 go_bin 绝对路径, 不靠 PATH 查找"
    knowledge_ref: "E077 (PATH 注入时序) — 自有经验"
  - problem: "Go linker mmap 在 HMDFS 上 permission denied"
    solution: "GOCACHE/GOTMPDIR/linker 输出路由到 ext2 (/data/storage/el2/base/haps/entry/files), 与 nuclei/kubo/argo/tlsx 同款绕法"
    knowledge_ref: "E166 (HMDFS SELinux 限制 Go link mmap)"

upstream_tests:
  total: 120
  framework: "go test"
  command: "go test -c -short -count=1 -timeout 120s -o <ext2>/<pkg>.test <pkg> && sign <pkg>.test && <pkg>.test -test.v -test.short"
  notes: "3 个测试包共 120 个用例真跑通过 (0 fail / 0 skip)。kor 0.6.8 上游测试全部 hermetic: pkg/kor 用 k8s fake clientset, pkg/utils 用 httpmock (注册 mock responder 不真发网络), 无真实集群连接、无外部网络依赖。"
  packages_run:
    - "pkg/kor/ (110 用例, 0 fail 0 skip)"
    - "pkg/filters/ (3 用例, 0 fail 0 skip)"
    - "pkg/utils/ (7 用例, 0 fail 0 skip)"
  excluded_packages: []

bootstrap_verification:
  go_version: "1.25.7 (linux-arm64, self-bootstrapped)"
  go_sha256: "ba611a53534135a81067240eff9508cd7e256c560edd5d8c2fef54f083c07129"
  go_sha256_verified: "2026-08-07 (actual == pinned, golang.google.cn dl mirror, http 200 size 57276329)"
  download_urls:
    - "https://golang.google.cn/dl/go1.25.7.linux-arm64.tar.gz"
    - "https://dl.google.com/go/go1.25.7.linux-arm64.tar.gz"
  toolchain_runs_on_hongmeng: "true after re-signing (go version go1.25.7 linux/arm64 实测通过)"
