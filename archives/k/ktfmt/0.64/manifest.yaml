version: "0.64"

# 编译状态: published (conan-verify 8 道门禁全部通过, R29 条件满足)
status: published

# 编译日期
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/facebook/ktfmt/archive/refs/tags/v0.64.tar.gz"
  sha256: "e36494b88d8f42aad412573fbc834e3539e66aab40dba00e5e3433a6b04f0bfc"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: custom (gradle shadowJar, 非 cmake/autotools/meson)
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies:
    - "gradle/9.6.1"
    - "bishengjdk/17.0.13"

  # 编译器: 无 (JVM 应用, 使用 java/gradle)
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ktfmt 是 JVM 应用, 使用 gradle shadowJar 构建 fat JAR, 非传统 cmake/autotools"
  - "Gradle 构建需要配置 Maven 镜像源 (aliyun) 以加速依赖下载"
  - "/tmp 在 OHOS 上只读, 必须使用 $TMPDIR 或 $HOME/tmp 作为临时目录"
  - "GitHub 源码下载需要使用镜像 (gitcode) 加速"
  - "wrapper 脚本中不能使用 Python str.format() 因为 shell 变量 ${JAVA_HOME} 的花括号会被误解析"
  - "conanfile.py build() 中设置环境变量应直接修改 os.environ 而非传 env 参数给 self.run()"
  - "JVM 应用 conan 配方: settings 只需 os+arch, 不需要 compiler/build_type"
  - "package_info() 中 bindirs 指向 wrapper 脚本, libdirs/resdirs 指向 JAR 所在目录"
