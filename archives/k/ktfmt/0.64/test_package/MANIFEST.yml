# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ktfmt/0.64
homepage: "https://facebook.github.io/ktfmt/"

# 上游测试命令
upstream_check_command: "gradle test"
upstream_test_in_build: false
upstream_test_command: "gradle test"

# 上游实际运行的测试程序
upstream_tests:
  - file: "core/src/test/java/com/facebook/ktfmt/"
    source: "ktfmt-0.64.tar.gz/core/src/test/java/com/facebook/ktfmt/"
    description: "JUnit tests for ktfmt formatting logic (KotlinParser, DropRefComments, etc.)"
    command: "gradle test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.sh"
    description: "L1 smoke test: creates Test.kt, runs ktfmt --version/--help/--google-style, verifies formatting"
    command: "sh test.sh <ktfmt_bin> <work_dir>"

# 测试断言总数 (近似值)
assertion_count: 3
