# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: kalign/3.5.1
homepage: "https://github.com/TimoLassmann/kalign"

# 上游测试命令
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (CMakeLists.txt 中定义的 ctest 测试)
upstream_tests:
  - file: bpm_utest
    source: kalign-3.5.1/lib/src/bpm_test.c
    description: "BPM (backtracking profile matrix) unit test"
    command: "./bpm_utest"
  - file: alphabet_utest
    source: kalign-3.5.1/lib/src/alphabet.c
    description: "Alphabet detection unit test"
    command: "./alphabet_utest"
  - file: edist_utest
    source: kalign-3.5.1/lib/src/euclidean_dist.c
    description: "Edit distance unit test"
    command: "./edist_utest"
  - file: task_utest
    source: kalign-3.5.1/lib/src/task.c
    description: "Task queue unit test"
    command: "./task_utest"
  - file: kalign_io_test
    source: kalign-3.5.1/tests/kalign_io_test.c
    description: "I/O test for BAliBASE format sequences"
    command: "./kalign_io_test"
  - file: kalign_api_test
    source: kalign-3.5.1/tests/kalign_api_test.c
    description: "API integration test for sequence alignment"
    command: "./kalign_api_test"
  - file: kalign_cmp_test
    source: kalign-3.5.1/tests/kalign_cmp_test.c
    description: "MSA comparison test"
    command: "./kalign_cmp_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: calls kalign() API with two protein sequences and verifies alignment output"
    command: "./test_kalign"

# 测试断言总数 (近似值)
assertion_count: 14
