software: kdegraphics-mobipocket
version: "26.04.1"
build_system: cmake
status: built
build_date: "2026-08-06"

source:
  url: "https://download.kde.org/stable/release-service/26.04.1/src/kdegraphics-mobipocket-26.04.1.tar.xz"
  sha256: "de353837314402f4983893226483a88a9026266b53ddf64b07ef234d149ff7bd"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
  dependencies:
    - qtbase/6.11.1
    - ecm/6.20.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "kdegraphics-mobipocket uses cmake build system with ECM (Extra CMake Modules)"
  - "Depends on Qt6Core and Qt6Gui for QMobipocket6 library"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE needed because OHOS is not in KDE supported platform list"
  - "ECM_MODULE_PATH must be set manually when using CMakeDeps for ECM"
