# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kdegraphics-mobipocket/26.04.1
homepage: "https://invent.kde.org/graphics/kdegraphics-mobipocket"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: autotests/mobipockettest.cpp
    source: kdegraphics-mobipocket-26.04.1/autotests/mobipockettest.cpp
    description: "Mobipocket document parsing test with test.mobi data"
    command: "./mobipockettest"
  - file: autotests/bitreadertest.cpp
    source: kdegraphics-mobipocket-26.04.1/autotests/bitreadertest.cpp
    description: "BitReader unit test"
    command: "./bitreadertest_bin -iterations 1"
  - file: autotests/decompressortest.cpp
    source: kdegraphics-mobipocket-26.04.1/autotests/decompressortest.cpp
    description: "Decompressor unit test"
    command: "./decompressortest_bin -iterations 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mobipocket.cpp
    description: "Verifies QMobipocket6 library is linkable and Mobipocket::Document API is callable"
    command: "./test_mobipocket"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
