# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kdoctools/6.19.0
homepage: https://invent.kde.org/frameworks/kdoctools

# 上游测试命令 — kdoctools 上游用 ctest 运行 autotests/ 套件
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# kdoctools 上游 autotests/ 目录含 meinproc 文档转换测试
upstream_tests:
  - file: autotests/
    source: kdoctools-6.19.0/autotests/
    description: "kdoctools 上游 ctest 测试套件（meinproc DocBook 转换验证）"
    command: "ctest"
    condition: "native 编译时执行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 meinproc 二进制存在 + --help 输出用法信息检查（test_kdoctools.c popen 输出检查）"
    command: "conan create (test_package _check_binary_exists + --help 输出验证)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2