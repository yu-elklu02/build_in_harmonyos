# test_package/MANIFEST.yml

package: kakoune/2025.06.03
homepage: "https://github.com/mawww/kakoune"

# 上游测试命令: test/run 脚本运行 test/ 目录下的回归测试
upstream_check_command: "cd test && env SHELL=/bin/sh ./run"
upstream_test_in_build: true
upstream_test_command: "cd test && env SHELL=/bin/sh ./run"

# 上游测试用例: test/ 目录下包含大量回归测试脚本
upstream_tests:
  - file: test/run
    source: kakoune-2025.06.03/test/run
    description: "Kakoune 回归测试套件（含 commands/compose/display/highlight/hooks/indent/normal/prompt/regression/shell/tools 等子目录）"
    command: "cd test && env SHELL=/bin/sh ./run"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "验证 kak 二进制可执行"
    command: "./test.sh"

# 测试断言总数
assertion_count: 2050
