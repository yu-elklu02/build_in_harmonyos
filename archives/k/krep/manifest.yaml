software: krep
display: "krep"
description: "高性能文本搜索命令行工具，支持多算法、递归搜索、JSON Lines 输出和上下文显示"
category: developer-tools
homepage: "https://github.com/davidesantangelo/krep"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "plain Makefile 构建，无 configure 脚本"
    - "OHOS regex 不支持 GNU REG_STARTEND，需条件编译保护"
    - "OHOS 环境可能缺少 install 工具，安装规则改用 mkdir/cp/chmod"
    - "测试避免硬编码 /tmp，改为尊重 TMPDIR 或当前工作目录"
  common_dependencies: []

versions:
  "3.0.0":
    status: built
    build_date: "2026-07-14"
    source_url: "https://github.com/davidesantangelo/krep/archive/refs/tags/v3.0.0.tar.gz"
