# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: karchive/6.19.0
homepage: https://invent.kde.org/frameworks/karchive

# 上游测试命令 — karchive 上游用 ctest 运行 autotests/ 套件
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# 上游实际运行的测试程序
# karchive 上游 autotests/ 含 karchivetest/kcompressiondevicetest 等
upstream_tests:
  - file: autotests/
    source: karchive-6.19.0/autotests/
    description: "karchive 上游 ctest 测试套件（karchivetest/kcompressiondevicetest 等）"
    command: "ctest --output-on-failure"
    condition: "native 编译时执行，交叉编译跳过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "编译运行 test_karchive.cpp（KCompressionDevice API 验证），验证库可编译链接"
    command: "conan create (test_package: compile & run test_karchive.cpp)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2