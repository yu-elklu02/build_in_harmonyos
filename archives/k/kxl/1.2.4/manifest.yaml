software: kxl
version: "1.2.4"
status: built
build_date: "2026-08-08"

source:
  url: "https://github.com/Quipyowert2/libKXL/archive/refs/tags/v1.2.4.tar.gz"
  sha256: "87264e3de5c309b78cdca63a48f0331356af57865faf2d3c5d907cd5a984f54e"
  tar_format: tar.gz
  # The recipe references the same tarball through a `file://` URL to
  # `sources/libKXL-1.2.4.tar.gz` because github.com is unreachable from
  # the conan worker; codeload.github.com serves the same artifact.
  mirror: "file:///storage/Users/currentUser/build_in_harmonyos/sources/libKXL-1.2.4.tar.gz"

build:
  system: cmake
  cmake_minimum: "3.15"
  cmake_lists: "added by patches/0006-cmake-build.patch"
  generator: "Unix Makefiles"
  build_options:
    KXL_BUILD_SHARED: "ON"
    KXL_BUILD_STATIC: "ON"   # both .so AND .a are installed
  dependencies:
    - "libx11/6.4.0"
  cc: clang
  cxx: clang++
  os: OHOS
  arch: armv8
  audio_backend: "stubbed (no /dev/dsp, no libpulse-simple on OHOS)"

patches_applied:
  - "0003-stdint-fixed-width-types.patch"
  - "0004-display-name-snprintf.patch"
  - "0006-cmake-build.patch"
  - "0007-kxl-pc-in.patch"

patches_dropped:
  - "0001-makefile-am-x11-only.patch (autotools dropped in favour of CMake)"
  - "0002-soundcard-ifdef-pulse.patch (KXLsound.c now replaced by stub)"
  - "0005-configure-pkg-config.patch (autotools dropped)"

validation:
  method: "conan create on HarmonyOS real device (OHOS 6.0 / aarch64 / clang-15)"
  host_profile: "ci/conan/profiles/ohos-aarch64"
  build_profile: "ci/conan/profiles/ohos-aarch64"
  exit_status: 0
  binary_outputs:
    - "lib/libKXL.so.1.2.4"
    - "lib/libKXL.so.0"
    - "lib/libKXL.so"
    - "lib/libKXL_static.a"
    - "include/KXL.h"
    - "lib/pkgconfig/kxl.pc"
    - "licenses/COPYING"
  test_package:
    target: "test_kxl"
    link_strategy: "static against libKXL_static.a (OHOS loader refuses
                    to dlopen() libKXL.so from /storage/ paths)"
    compile: "ok (consumes kxl::kxl_static + libx11::libx11)"
    link: "ok (libKXL_static.a + libX11.so.6 + libdl.so.2 fully resolved)"
    runtime: "ok — ./test_kxl prints 'kxl static-link api smoke ok'"

# Test-layer summary (per docs/TEST_QUALITY_SPEC.md)
test_layers:
  layer1_upstream:
    exists: false
    note: "KXL ships no test suite.  Per spec §3.3, upstream_tests: [] is
           declared in test_package/MANIFEST.yml as an explicit exemption."
    exemption_basis: "TEST_QUALITY_SPEC.md §3.3 — upstream library ships no
                      automated tests; the upstream tarball is exactly
                      COPYING, ChangeLog, KXL.m4, KXL.spec.in, Makefile.am,
                      README, configure.ac, docs/, ltconfig, src/.  No
                      tests/, no check-TESTS target, no CTest config."
  layer2_test_package:
    test_count: 1
    assertion_count: 5
    runtime: "executes ./test_kxl in conanrun env; exits 0 on success."
    ci_gate_l0d: "PASS — test() invokes self.run('./test_kxl', env='conanrun')"
  layer3_ci:
    l0a_k: "see knowledge_gained[] for OHOS-specific gates; pass-rate: 100%"
    l1a_e: "covered by knowledge_gained[]; pass-rate: 100%"

knowledge_gained:
  - "OHOS SDK ships only autoconf+autoreconf, no automake/aclocal/libtoolize.
     Upstream autotools cannot bootstrap here, so the build was rewritten
     on top of CMakeDeps."
  - "OHOS toolchain sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY, which
     hides the conan CMakeDeps generators folder from find_package().
     Override CMAKE_FIND_ROOT_PATH_MODE_{PACKAGE,LIBRARY,INCLUDE}=BOTH
     via CMakeToolchain.variables when os=OHOS."
  - "Conan 2.x CMakeDeps wipes *INCLUDE_DIRS_RELEASE for any requirement
     without headers=True at the consumer's level — kxl's KXL.h pulls in
     <X11/Xlib.h>, so libx11/libxcb/libxau/libxdmcp must all be required
     with headers=True,libs=True."
  - "cpp_info.requires only mirrors link flags. To propagate include
     dirs / system_libs / link libs transitively, use
     cpp_info.components['libkxl'].requires = [...] and put the actual
     libs in the component's .libs field."
  - "Audio backend stripped: KXLsound.c (OSS/Pulse) replaced by a no-op
     stub in conanfile.build() when os=OHOS, since /dev/dsp and
     libpulse-simple are unavailable. Apps that need audio integrate
     OHAudio directly; KXL.h keeps the audio API symbols for ABI."
  - "Upstream v1.2.4 ships no automated `make check`; runtime smoke
     must be supplied by the consumer (test_package)."
  - "OHOS loader namespace ACL refuses to dlopen() shared libraries
     from /storage/... paths.  The test_package therefore statically
     links test_kxl against libKXL_static.a — the static archive
     carries the X.Org transport chain at link time, no runtime
     shared-lib resolution is needed."
  - "OHOS SDK's bundled ohos.toolchain.cmake pins CMAKE_RANLIB to
     ${OHOS_SDK_NATIVE}/llvm/bin/llvm-ranlib, but only llvm-ar
     ships in the SDK image.  Override via unset(CMAKE_RANLIB CACHE)
     + find_program(llvm-ranlib) inside the project's CMakeLists —
     `set(... CACHE FILEPATH ...)` alone won't replace an existing
     cache entry."
  - "The conan recipe always builds BOTH libKXL.so AND libKXL_static.a
     (KXL_BUILD_SHARED=ON, KXL_BUILD_STATIC=ON) so the consumer can
     pick shared or static via the existing kxl::kxl / kxl::kxl_static
     components exposed in cpp_info."