# test_package/MANIFEST.yml
#
# kxl 1.2.4 -- per docs/TEST_QUALITY_SPEC.md, the upstream layer test list.
# kxl's upstream tarball ships NO test suite (no `make check`, no CTest,
# no pytest); the `upstream_tests:` array is therefore empty per spec
# §3.3.  All consumer-side smoke tests live in test_package_tests below.
#
# `upstream_test_in_build: false` -- there is nothing to run upstream.
# `upstream_check_command: ""` -- nothing to verify.

package: kxl/1.2.4
homepage: "https://github.com/Quipyowert2/libKXL"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# --- Upstream test cases --------------------------------------------------
# KXL ships NO automated test suite.  The upstream tarball is exactly:
#   COPYING  ChangeLog  KXL.m4  KXL.spec.in  Makefile.am  README
#   configure.ac  docs/  ltconfig  src/
# There is no tests/, no check-TESTS target, no CTest config.  Per
# TEST_QUALITY_SPEC.md §3.3 ("upstream_tests: []" is allowed when the
# upstream library has no test suite), we declare the array empty.
upstream_tests: []

# --- Test package (Layer 2 consumer smoke tests) --------------------------
# The OHOS loader refuses to dlopen() shared libraries from /storage/...
# paths, so test_kxl is statically linked against libKXL_static.a; the
# static archive brings in the X.Org transport chain (libx11/libxcb/
# libxau/libxdmcp) at link time, so the test binary needs no shared
# libs to load at runtime.
test_package_tests:
  - file: test.c
    description: "Static-link consumer smoke test: KXL_Malloc/KXL_Free round-trip,
                 KXL_DisplayName does not crash on ':0', Sint32/Uint32 are LP64-safe
                 fixed-width integers, libX11 transitive deps wired into libKXL.a."
    command: "./test_kxl"

# --- Assertion count ------------------------------------------------------
# test_package/test.c has 2 _Static_asserts + 3 functional checks
# (KXL_Malloc non-NULL, KXL_DisplayName returns cleanly, Sint32/Uint32
# width at runtime) = 5 assertions per invocation.  Layer 3 CI gates run
# the test once per CMake build.
assertion_count: 5