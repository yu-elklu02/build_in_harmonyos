sources:
  # Official GitHub tag tarball (R39). CI rewrites https → file:// after
  # pre-download; do not commit machine-local file:// paths.
  url: "https://github.com/Quipyowert2/libKXL/archive/refs/tags/v1.2.4.tar.gz"
  sha256: "87264e3de5c309b78cdca63a48f0331356af57865faf2d3c5d907cd5a984f54e"

patches:
  - patch_file: "patches/0003-stdint-fixed-width-types.patch"
    patch_description: "Use fixed-width stdint types for Sint32/Uint32 on LP64"
    patch_type: "portability"
  - patch_file: "patches/0004-display-name-snprintf.patch"
    patch_description: "Use snprintf for display name to avoid buffer overrun"
    patch_type: "bugfix"
  - patch_file: "patches/0006-cmake-build.patch"
    patch_description: "Replace the upstream autotools build with a CMakeLists.txt driven by conan CMakeDeps (libx11/xorgproto); the autotools bootstrap is unavailable on the OHOS SDK"
    patch_type: "portability"
  - patch_file: "patches/0007-kxl-pc-in.patch"
    patch_description: "Add a kxl.pc.in template so the CMakeLists.txt can install a consumer-facing pkg-config file"
    patch_type: "portability"
