software: qpdf
display: "qpdf"
description: "Content-preserving PDF transformation library and CLI (C/C++ API)"
category: gfx
homepage: "https://github.com/qpdf/qpdf"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake 库，glfw 式自发现 ohos.toolchain + 裸 cmake（绕 conan_toolchain / ML-0035）"
    - "依赖 zlib(静态) + libjpeg-turbo(shared)；native crypto 内置，不需 openssl/gnutls"
    - "qpdf 用 find_path/find_library：交叉链 FIND_ROOT_PATH_MODE=ONLY，须预设 ZLIB_*/LIBJPEG_* 路径"
    - "conan 依赖 .pc prefix 烤死 → 关 PKG_CONFIG_USE_CMAKE_PREFIX_PATH 逼走 find_path"
    - "sed 掉无条件的 add_subdirectory(fuzz)（库不需，其静态库归档失败）"
  common_dependencies:
    - zlib
    - libjpeg-turbo

versions:
  "12.3.2":
    status: built
    build_date: "2026-07-14"
    format: conan
    note: "Conan 配方（真机已验）；11.6.3 为预编译 cmd-pkg"
  "11.6.3":
    status: published
    build_date: "2026-04-21"
