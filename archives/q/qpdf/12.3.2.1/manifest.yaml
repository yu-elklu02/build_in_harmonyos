  evidence: "裸 conan create rc=0；test dlopen libqpdf.so ok(qpdf_get_qpdf_version)；SONAME=libqpdf.so.30；DT_NEEDED libjpeg.so.62+libc++_shared.so；zlib 静态内链"
knowledge_gained:
  - "依赖 zlib/1.3.1.1（静态+fPIC；制品仓 zlib/1.3.1 非 fPIC 链进 .so 报 R_AARCH64 relocation，必须用 1.3.1.1），已内链无 DT_NEEDED + libjpeg-turbo(shared,DT_NEEDED libjpeg.so.62)；native crypto 内置，无需 openssl/gnutls"
  - "qpdf 用 find_path/find_library(非 find_package)：交叉 toolchain FIND_ROOT_PATH_MODE=ONLY 让 find 只搜 sysroot → 预设 ZLIB_H_PATH/ZLIB_LIB_PATH/LIBJPEG_H_PATH/LIBJPEG_LIB_PATH 绕过"
  - "conan 依赖包 .pc 的 prefix 烤死(/opt.../ 、//include)，pkg_check_modules 经 PKG_CONFIG_USE_CMAKE_PREFIX_PATH 会命中坏 .pc → 关掉它逼走 find_path"
  - "add_subdirectory(fuzz) 无条件且其静态库归档失败 → sed 掉(库不需 fuzz)"
