# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qwt/6.3.0
homepage: "https://qwt.sourceforge.io/"

# 上游测试命令 (qwt 是 qmake 项目，tests/ 子目录由 qmake 构建)
upstream_check_command: "make -C tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (qwt 上游 tests/ 目录)
upstream_tests:
  - file: tests/splinetest/main.cpp
    source: qwt-6.3.0/tests/splinetest/main.cpp
    description: "样条曲线核心算法验证 (Cardinal/Akima/Cubic 边界条件、曲率、重复点)"
    command: "./splinetest"
  - file: tests/splineprof/main.cpp
    source: qwt-6.3.0/tests/splineprof/main.cpp
    description: "样条性能分析程序 (bezierControlLines 计算)"
    command: "./splineprof"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_qwt.cpp
    description: "消费者测试：链接 libqwt 并验证样条斜率/曲率/多项式核心 API"
    command: "./test_qwt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
