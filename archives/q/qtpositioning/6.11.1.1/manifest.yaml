software: qtpositioning
version: "6.11.1.1"
status: built
build_date: "2026-08-13"
build_system: cmake

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtpositioning-everywhere-src-6.11.1.tar.xz"
  sha256: "d5e6b91801ae286e7630016caea3bdc5e1978b4291d6741d0d64c125650f78f5"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DQT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qtpositioning 是 Qt6 定位模块，依赖 qtbase/6.11.1（Qt Core/Network）"
  - "Qt6 子模块统一使用 download.qt.io / 国内镜像的 everywhere-src tarball"
  - "OHOS 适配：QT_QMAKE_TARGET_MKSPEC=harmonyos-clang，关闭不适用特性"
  - "6.11.1.1：补 qtdeclarative 依赖并构建 positioningquick 子模块（Qt::PositioningQuick），修复 qtlocation assertTargets 空包问题；制品仓 6.11.1 仅依赖 qtbase、不含 positioningquick"
