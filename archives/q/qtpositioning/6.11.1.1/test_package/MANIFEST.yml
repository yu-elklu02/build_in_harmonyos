# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtpositioning/6.11.1.1
homepage: "https://doc.qt.io/qt-6/qtpositioning-index.html"

# 上游测试命令: Qt 模块测试为 Qt Test (tst_*) 单元测试, 需 Qt6Test 基础设施;
# 本次适配构建 QT_BUILD_TESTS=OFF, 不执行上游 tst_* 测试。
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/auto/qgeocoordinate/tst_qgeocoordinate.cpp
    source: qtpositioning-everywhere-src-6.11.1/tests/auto/qgeocoordinate/tst_qgeocoordinate.cpp
    description: "Upstream QGeoCoordinate unit tests (not executed in this adaptation build)"
    command: "./tst_qgeocoordinate"
  - file: tests/auto/qgeocircle/tst_qgeocircle.cpp
    source: qtpositioning-everywhere-src-6.11.1/tests/auto/qgeocircle/tst_qgeocircle.cpp
    description: "Upstream QGeoCircle unit tests (not executed in this adaptation build)"
    command: "./tst_qgeocircle"
  - file: tests/auto/qgeopositioninfo/tst_qgeopositioninfo.cpp
    source: qtpositioning-everywhere-src-6.11.1/tests/auto/qgeopositioninfo/tst_qgeopositioninfo.cpp
    description: "Upstream QGeoPositionInfo unit tests (not executed in this adaptation build)"
    command: "./tst_qgeopositioninfo"

test_package_tests:
  - file: test_qtpositioning.cpp
    description: "Exercise QGeoCoordinate/QGeoCircle/QGeoRectangle/QGeoPositionInfo/QNmeaPositionInfoSource APIs"
    command: "./test_qtpositioning"

assertion_count: 8
