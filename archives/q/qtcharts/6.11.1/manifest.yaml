software: qtcharts
version: "6.11.1"
status: pending
build_system: cmake
build_date: ""

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtcharts-everywhere-src-6.11.1.tar.xz"
  sha256: "3fe3ed318c2a86d1417c5c29cf7494275e8fd4b537cd37453f5599c57365515c"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "QT_BUILD_TESTS=ON"
    - "QT_BUILD_EXAMPLES=OFF"
    - "QT_BUILD_BENCHMARKS=OFF"
    - "QT_BUILD_DOCS=OFF"
    - "BUILD_SHARED_LIBS=ON"
  dependencies:
    - qtbase-gui/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt Charts is not standalone: configuration requires Qt6 Core, Gui and Widgets from qtbase-gui."
  - "The OHOS CI image does not provide a system Qt6Config.cmake; the dependency must be declared through Conan."
  - "The stacked qtbase-gui recipe provides real Gui, Widgets and graphicsview targets while its dependency PR is reviewed."
  - "Consumer tests must find Qt6Charts directly because the module and qtbase-gui use separate Conan package prefixes."
  - "The upstream module_includes CMake self-test uses NO_DEFAULT_PATH sub-build lookups, so the recipe exposes qtbase-gui's Qt6Config.cmake through QT_BUILD_CMAKE_PREFIX_PATH."
