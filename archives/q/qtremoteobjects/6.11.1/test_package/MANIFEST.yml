package: qtremoteobjects/6.11.1
homepage: https://doc.qt.io/qt-6/qtremoteobjects-index.html
upstream_check_command: 'ctest -R "^(tst_pods|tst_repc_pods)$"'
upstream_test_in_build: true
upstream_test_command: 'ctest --test-dir <build> --output-on-failure -R "^(tst_pods|tst_repc_pods)$" -j1'
upstream_tests:
  - file: tests/auto/pods/tst_pods.cpp
    source: qtremoteobjects-everywhere-src-6.11.1/tests/auto/pods/
    description: "Run 2 upstream POD constructor and marshalling test functions"
    command: 'ctest -R "^tst_pods$"'
  - file: tests/auto/repc/pods/tst_pods.cpp
    source: qtremoteobjects-everywhere-src-6.11.1/tests/auto/repc/pods/
    description: "Run 3 upstream repc POD constructor, marshalling, and property test functions"
    command: 'ctest -R "^tst_repc_pods$"'
test_package_tests:
  - file: test_package.cpp
    description: "Construct a remote object node and verify its heartbeat and error state"
    command: "./test_package"
assertion_count: 17
