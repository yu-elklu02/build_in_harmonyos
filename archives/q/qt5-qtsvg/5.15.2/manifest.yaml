software: qt5-qtsvg
# 版本级 manifest 模板
# 文件位置: archives/q/qt5-qtsvg/5.15.2/manifest.yaml

version: "5.15.2"

# 构建系统
build_system: qmake

# 编译状态
status: built

# 编译日期
build_date: "2026-08-08"

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtsvg-everywhere-src-5.15.2.tar.xz"
  sha256: "8bc3c2c1bc2671e9c67d4205589a8309b57903721ad14c60ea21a5d06acb585e"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake qtsvg.pro -spec linux-clang"
  dependencies:
    - qt5-qtbase/5.15.2
  cc: clang
  cxx: clang++
  mkspec: linux-clang

patches_applied: []

packaging:
  aarch64: qt5-qtsvg-5.15.2-aarch64.tar.gz
  aarch64-debug: qt5-qtsvg-5.15.2-aarch64-debug.tar.gz

knowledge_gained:
  - "Qt5 addon modules use qmake build system, not cmake"
  - "qt5-qtbase Conan package has broken qt.conf and .pri files pointing to build directory, must be fixed in build()"
  - "qmake configure: qmake qtsvg.pro -spec linux-clang"
  - "QMAKE_STRIP must be empty to prevent stripping (OHOS loader rejects stripped ELF)"
  - "qtsvg builds without source modifications on HarmonyOS"
  - "Build produces libQt5Svg.so, image format plugin (libqsvg.so), icon engine plugin (libqsvgicon.so)"
