# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtsvg/5.15.2
homepage: https://www.qt.io/

# 上游测试命令
upstream_check_command: "make check"

# qtsvg does not build upstream auto-tests in this recipe (tests are not
# compiled by the qmake build to keep CI within timeout).
upstream_test_in_build: false
upstream_test_command: ""

upstream_test_changes: []

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "QSvgRenderer renders an inline SVG to QImage and verifies non-empty output"
    command: "./test_qt5_qtsvg"

assertion_count: 3
