software: quantlib
display: "QuantLib"
description: "A free/open-source library for quantitative finance"
category: library
homepage: "https://www.quantlib.org/"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Boost 1.84 sp_thread_sleep.hpp uses pthread_setcancelstate; define BOOST_SP_NO_PTHREAD_SETCANCELSTATE=1 on HarmonyOS."
    - "Boost.Math long double promotion can make QuantLib numeric tests fail on HarmonyOS; define BOOST_MATH_PROMOTE_DOUBLE_POLICY=0."
    - "Use static QuantLib build to avoid shared-library runtime relocation issues on HarmonyOS."
  common_dependencies:
    - boost

versions:
  - version: "1.43"
    status: built
    build_date: "2026-08-19"
    notes: "HarmonyOS PC aarch64 conan create passed; upstream quantlib-test-suite 1339/1339 PASS; test_package passed."
