# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: quantlib/1.43
homepage: "https://www.quantlib.org/"

# 上游测试命令
upstream_check_command: "ctest / quantlib-test-suite"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "test-suite/quantlib-test-suite"

# 上游实际运行的测试程序
upstream_tests:
  - file: test-suite/quantlib-test-suite
    source: QuantLib-1.43/test-suite/
    description: "QuantLib upstream C++ test suite covering pricing engines, term structures, instruments, models and math utilities"
    command: "test-suite/quantlib-test-suite"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_quantlib.cpp
    description: "Consumer smoke test: build and run QuantLib yield curve discount API check"
    command: "./test_quantlib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1340
