patches:
  - patch_file: "patches/0001-cmake-QtPlatformSupport.cmake-add-HarmonyOS.patch"
    patch_description: "Treat HarmonyOS as a Linux-compatible UNIX platform"
    patch_type: "portability"
  - patch_file: "patches/0002-mkspecs-add-harmonyos-clang.patch"
    patch_description: "Add the harmonyos-clang Qt mkspec"
    patch_type: "portability"
  - patch_file: "patches/0003-corelib-disable-pthread-cancel.patch"
    patch_description: "Use a capability macro when pthread cancellation APIs are unavailable"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-platforms-add-HarmonyOS.patch"
    patch_description: "Reuse CMake Linux shared-library platform rules"
    patch_type: "portability"
  - patch_file: "patches/0005-cmake-skip-android-autodetect.patch"
    patch_description: "Skip Android autodetection for the harmonyos-clang mkspec"
    patch_type: "portability"
  - patch_file: "patches/0006-corelib-disable-arm-aes-hash-on-harmonyos.patch"
    patch_description: "Use Qt's portable hash when HarmonyOS headers lack ARM AES intrinsics"
    patch_type: "portability"
