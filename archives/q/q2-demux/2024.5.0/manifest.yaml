knowledge_gained:
  - "q2-demux 是纯 Python QIIME 2 插件; 打包本身不需要 QIIME 2 运行时, 仅需复制源码"
  - "上游 88 条测试: test_ecc.py 13 条仅依赖 numpy 可在本流水线真实执行; 其余 75 条依赖 conda-only 的 QIIME 2 生态 (PyPI 404)"
