# ---------------------------------------------------------------------------
# 适配后测试用例子统计 (adapted test_package)
# ---------------------------------------------------------------------------
# R34 合规: test_package 真正依赖于被测包 (CI L1e 移走 lib/ 后测试会失败)。
# 两个测试类:
#   * ArchiveIntegrity  —— 新增的鸿蒙/消费者验证测试 (不依赖 QIIME 2 / numpy)
#   * UpstreamECC       —— 在适配层真实执行上游 test_ecc.py 的 13 条 (仅依赖 numpy)
test_package_tests:
  - file: "test_q2_demux.py::ArchiveIntegrity"
    description: "鸿蒙/消费者验证: 包正确归档于 lib/pythonX.Y/site-packages、暴露非空 __version__、纯 Python 无架构相关 ELF、PYTHONPATH 可消费"
    command: "python test_q2_demux.py <site-packages>"
    assertion_count: 5
    coverage: "包归档正确性 + 版本 API + 架构无关性 (OHOS 可消费性)"
  - file: "test_q2_demux.py::UpstreamECC"
    description: "在适配层真实执行上游 q2_demux.tests.test_ecc (13 条 unittest，仅依赖 numpy)；桩导入绕过 QIIME 2 专属 __init__"
    command: "python test_q2_demux.py <site-packages>"
    assertion_count: 13
    coverage: "真实执行上游 Golay 纠错码单元逻辑 (numpy-only 子集)"

# 适配后实际可执行用例: 新增 1 (ArchiveIntegrity) + 上游执行 13 (UpstreamECC) = 14
adapted_test_count: 14
adapted_test_new_count: 1
adapted_test_upstream_executed: 13

