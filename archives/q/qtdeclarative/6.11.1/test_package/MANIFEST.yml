# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtdeclarative/6.11.1
homepage: "https://doc.qt.io/qt-6/qtdeclarative-index.html"

# 上游测试命令: Qt 模块测试为 Qt Test (tst_*) 单元测试, 需 Qt6Test 基础设施;
# 本次适配构建 QT_BUILD_TESTS=OFF, 不执行上游 tst_* 测试。
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/auto/qml/qqmlengine/tst_qqmlengine.cpp
    source: qtdeclarative-everywhere-src-6.11.1/tests/auto/qml/qqmlengine/tst_qqmlengine.cpp
    description: "Upstream QQmlEngine unit tests (not executed in this adaptation build)"
    command: "./tst_qqmlengine"
  - file: tests/auto/qml/qqmlcomponent/tst_qqmlcomponent.cpp
    source: qtdeclarative-everywhere-src-6.11.1/tests/auto/qml/qqmlcomponent/tst_qqmlcomponent.cpp
    description: "Upstream QQmlComponent unit tests (not executed in this adaptation build)"
    command: "./tst_qqmlcomponent"

test_package_tests:
  - file: test_qtdeclarative.cpp
    description: "Exercise QQmlEngine/QQmlComponent instantiation and QJS evaluation"
    command: "./test_qtdeclarative"

assertion_count: 6
