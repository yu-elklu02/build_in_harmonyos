    description: "Upstream SVG CSS style resolution tests"
    command: "./tst_qsvgcss"
  - file: tests/auto/svg/qsvggenerator/tst_qsvggenerator.cpp
    source: qtsvg-everywhere-src-6.11.1/tests/auto/svg/qsvggenerator/tst_qsvggenerator.cpp
    description: "Upstream QSvgGenerator output tests"
    command: "./tst_qsvggenerator"
  - file: tests/auto/svg/qsvgplugin/tst_qsvgplugin.cpp
    source: qtsvg-everywhere-src-6.11.1/tests/auto/svg/qsvgplugin/tst_qsvgplugin.cpp
    description: "Upstream SVG image format plugin tests"
