package: qtbase-gui/6.11.1
homepage: "https://doc.qt.io/qt-6/qtbase-index.html"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

excluded_upstream_tests:
  - command: "ctest --test-dir build --output-on-failure"
    reason: "The full upstream Qt test matrix is not built in the OHOS cross-compiled package configuration; the 7 representative suites listed below are built and executed with the offscreen QPA backend, and test_package exercises the installed Core, Network, Gui, Widgets and Xml modules."

upstream_tests:
  - file: tests/auto/gui/painting/qcolor/tst_qcolor.cpp
