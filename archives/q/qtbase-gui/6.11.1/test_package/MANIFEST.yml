    description: "Upstream QColor parsing and conversion tests"
    command: "./tst_qcolor"
  - file: tests/auto/network/kernel/qhostaddress/tst_qhostaddress.cpp
    source: qtbase-everywhere-src-6.11.1/tests/auto/network/kernel/qhostaddress/tst_qhostaddress.cpp
    description: "Upstream QHostAddress tests"
    command: "./tst_qhostaddress"
  - file: tests/auto/widgets/kernel/qsizepolicy/tst_qsizepolicy.cpp
    source: qtbase-everywhere-src-6.11.1/tests/auto/widgets/kernel/qsizepolicy/tst_qsizepolicy.cpp
    description: "Upstream QSizePolicy value and serialization tests"
    command: "./tst_qsizepolicy"
  - file: tests/auto/widgets/kernel/qwidget/tst_qwidget.cpp
    source: qtbase-everywhere-src-6.11.1/tests/auto/widgets/kernel/qwidget/tst_qwidget.cpp
    description: "Upstream QWidget lifecycle and visibility tests"
    command: "./tst_qwidget"
  - file: tests/auto/gui/image/qimage/tst_qimage.cpp
    source: qtbase-everywhere-src-6.11.1/tests/auto/gui/image/qimage/tst_qimage.cpp
    description: "Upstream QImage raster tests"
