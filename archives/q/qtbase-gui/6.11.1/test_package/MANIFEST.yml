  - file: tests/auto/gui/painting/qpainter/tst_qpainter.cpp
    source: qtbase-everywhere-src-6.11.1/tests/auto/gui/painting/qpainter/tst_qpainter.cpp
    description: "Upstream QPainter raster tests"
    command: "./tst_qpainter"
  - file: tests/auto/xml/dom/qdom/tst_qdom.cpp
    source: qtbase-everywhere-src-6.11.1/tests/auto/xml/dom/qdom/tst_qdom.cpp
    description: "Upstream Qt XML DOM tests"
    command: "./tst_qdom"

test_package_tests:
  - file: test_qtbase_gui.cpp
    description: "Load offscreen QPA, show a QWidget, draw a raster image, and exercise Qt Xml DOM APIs"
    command: "./test_qtbase_gui"

assertion_count: 13
