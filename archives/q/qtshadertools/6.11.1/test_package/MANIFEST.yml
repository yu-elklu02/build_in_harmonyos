# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qtshadertools/6.11.1
homepage: "https://doc.qt.io/qt-6/qtshadertools-index.html"

# 上游测试命令: Qt 模块测试为 Qt Test (tst_*) 单元测试, 需 Qt6Test 基础设施;
# 本次适配构建 QT_BUILD_TESTS=OFF, 不执行上游 tst_* 测试。
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/auto/qshaderbaker/tst_qshaderbaker.cpp
    source: qtshadertools-everywhere-src-6.11.1/tests/auto/qshaderbaker/tst_qshaderbaker.cpp
    description: "Upstream QShaderBaker bake/remap unit tests (not executed in this adaptation build)"
    command: "./tst_qshaderbaker"
  - file: tests/auto/qsbdepfiles/tst_qsbdepfiles.cpp
    source: qtshadertools-everywhere-src-6.11.1/tests/auto/qsbdepfiles/tst_qsbdepfiles.cpp
    description: "Upstream qsb dependency-file tests (not executed in this adaptation build)"
    command: "./tst_qsbdepfiles"
  - file: tests/auto/buildtimeqsb/tst_buildtimeqsb.cpp
    source: qtshadertools-everywhere-src-6.11.1/tests/auto/buildtimeqsb/tst_buildtimeqsb.cpp
    description: "Upstream build-time qsb integration tests (not executed in this adaptation build)"
    command: "./tst_buildtimeqsb"

test_package_tests:
  - file: test_qtshadertools.cpp
    description: "Bake a GLSL fragment shader to SPIR-V through QShaderBaker/QShader and verify the payload"
    command: "./test_qtshadertools"
  - file: test.frag
    description: "Run the packaged qsb CLI to bake a fragment shader and produce a .qsb file"
    command: "qsb -o test.qsb test.frag"

assertion_count: 5
