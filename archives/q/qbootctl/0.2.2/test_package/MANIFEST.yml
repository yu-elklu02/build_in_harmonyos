# test_package/MANIFEST.yml — qbootctl 0.2.2
# 上游无自动化测试（无 tests/、无 meson test()、无 CI 脚本），
# 因此上游测试数 = 0；test_package 提供真实消费者安全测试。

package: qbootctl/0.2.2
homepage: "https://github.com/linux-msm/qbootctl"

# 上游测试命令（分析结论：meson.build 无 test()，无 make check 目标）
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：0（搜索 tar 包 15 个文件，无 tests/ 目录、无测试脚本）
upstream_tests: []

# test_package 自带测试（消费者视角，真实 self.run() 执行）
# 只运行测试专用构建 test/qbootctl-test（QBOOTCTL_TESTING 宏，纯内存/普通文件 mock；
# 位于包内 test/ 目录，不进入 bin/、不暴露于 cpp_info.bindirs）；
# 生产 bin/qbootctl 仅做"无 mock 开关 + 上游语义"验证。
test_package_tests:
  - file: test_qbootctl.py
    description: "安全消费者测试：生产二进制无 mock 开关与上游语义、测试专用构建的查询/写状态转换、无设备访问、临时文件隔离、许可证安装"
    command: "python3 test_qbootctl.py <prod-bin> <test-bin> <pkg>"

# 测试用例数：单脚本入口 = 1 case（test_qbootctl.py）
test_case_count: 1

# 断言总数（test_qbootctl.py 内 check() 调用次数，2026-08-13 实跑 30/30 通过）
assertion_count: 30
