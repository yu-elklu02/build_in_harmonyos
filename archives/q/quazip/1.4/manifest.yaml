software: quazip
version: "1.4"
status: built
build_date: "2026-07-28"
category: library

source:
  url: "https://github.com/stachenov/quazip/archive/refs/tags/v1.4.tar.gz"
  sha256: "79633fd3a18e2d11a7d5c40c4c79c1786ba0c74b59ad752e8429746fe1781dd6"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "QUAZIP_QT_MAJOR_VERSION=5"
    - "QUAZIP_ENABLE_TESTS=ON"
    - "QUAZIP_BZIP2=OFF"
  dependencies:
    - "qt5-qtbase/5.15.2"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

products:
  libraries:
    - libquazip1-qt5.so

patches_applied: []

knowledge_gained:
  - "QuaZip 1.4 uses find_package(Qt5 COMPONENTS Core), so CMakeDeps maps qt5-qtbase to the Qt5 CMake package name"
  - "The upstream qztest suite and the packaged ZIP round-trip consumer test run without bzip2 support"
