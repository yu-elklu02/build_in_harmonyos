    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

products:
  libraries:
    - libquazip1-qt5.a

dependencies:
  required:
    - "qt5-qtbase/5.15.2"
    - "zlib/1.3.1"
  optional: []

patches_applied:
  - "patches/0001-qztest-skip-root-write-on-ohos.patch"

test_results:
  type: official
  command: "ctest --output-on-failure"
  total: 125
  passed: 125
  failed: 0
  test_package: passed

knowledge_ref: []

knowledge_gained:
  - "QuaZip 1.4 uses find_package(Qt5 COMPONENTS Core), so CMakeDeps maps qt5-qtbase to the Qt5 CMake package name"
  - "The upstream qztest suite and the packaged ZIP round-trip consumer test run without bzip2 support"
