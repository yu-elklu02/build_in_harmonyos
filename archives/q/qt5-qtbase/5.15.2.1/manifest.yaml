software: qt5-qtbase
version: "5.15.2.1"
status: built
build_date: "2026-08-03"
category: qt-core

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  sha256: "909fad2591ee367993a75d7e2ea50ad4db332f05e1c38dd7a5a274e156a4e0f8"
  tar_format: tar.xz

build:
  system: configure+make
  configure_options:
    - "-opensource -confirm-license"
    - "-no-dbus -no-accessibility"
    - "-opengl es2 -no-xcb -no-eglfs -no-linuxfb"
    - "-no-feature-sql"
    - "-no-feature-systemsemaphore -no-feature-sharedmemory"
    - "-nomake tests -nomake examples"
    - "-no-iconv -no-glib -no-icu -no-vulkan"
    - "-no-openssl -no-libproxy -no-system-proxies"
    - "-system-zlib"
    - "-platform linux-clang"
    - "-recheck-all"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

products:
  libraries:
    - libQt5Core.so.5.15.2
    - libQt5Network.so.5.15.2 (with abstract socket patch)
    - libQt5Gui.so.5.15.2
    - libQt5Test.so.5.15.2
    - libQt5Concurrent.so.5.15.2
    - libQt5Widgets.so.5.15.2
    - libQt5PrintSupport.so.5.15.2
    - libQt5Xml.so.5.15.2
  headers:
    - QtCore, QtGui, QtNetwork, QtTest, QtConcurrent, QtWidgets, QtPrintSupport, QtXml

patches_applied:
  - "0001-abstract-socket.patch: QLocalServer abstract socket"
  - "0002-abstract-socket-client.patch: QLocalSocket abstract socket"
  - "0003-pthread-cancel-stub.patch: guard pthread_cancel calls with HAVE_PTHREAD_CANCEL feature detection"
  - "0004-socklen-t-ohos.patch: use POSIX socklen_t on supported Linux and OHOS targets"
  - "0005-qmake-ohos-host.patch: use LD_LIBRARY_PATH for unrecognized Q_OS_UNIX hosts"
  - "0006-benchmark-sql-module.patch: omit QtSql benchmarks when QtSql is disabled"
  - "0007-qmetatype-sched-yield.patch: use POSIX sched_yield in the qmetatype test"
  - "0008-qsslkey-no-ssl-test-init.patch: omit SSL curve discovery when SSL is disabled"
  - "0009-qpluginloader-clang-section-type.patch: use a consistent metadata section type under Clang"
  - "0010-qlocale-standard-fenv-test.patch: use standard floating-point exception flags"
  - "0011-qthreadpool-ohos-startup-sync.patch: synchronize OHOS thread pool startup"

knowledge_gained:
  - "OHOS stripped ELF dlopen 限制 (E215): musl 拒绝加载 stripped 共享库"
  - "OHOS Unix 域套接字 bind() 被拒绝: 需使用抽象套接字命名空间"
  - 'LD_LIBRARY_PATH 在 OHOS 上被忽略: 用 $ORIGIN RPATH 替代'
  - "qt5-qtbase configure -no-feature-testlib 导致 Qt5Test 缺失"
  - "Qt3D requires QtGui with the OpenGL ES 2 feature enabled"
  - "qmake host tools on OpenHarmony require an LD_LIBRARY_PATH fallback in qtAddTargetEnv"
