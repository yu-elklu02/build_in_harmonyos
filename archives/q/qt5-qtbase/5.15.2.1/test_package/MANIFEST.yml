# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtbase/5.15.2.1
homepage: https://www.qt.io/

# 上游测试命令：本配方不在 build() 中运行上游 auto-test 套件。原因：
# 1) CI 硬上限 45 分钟，全量 Qt auto-test 套件无法在时限内完成（PR #3804 CI #12438 超时根因）；
# 2) R8 改造（去除平台条件编译宏、抽象套接字无条件启用）后，运行期验证
#    统一交由 test_package 通过 CMake 链接+运行完成。
# 按 TEST_QUALITY_SPEC §3 申报豁免。
upstream_check_command: ""

# The recipe does NOT run the upstream Qt test suite during build().
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_exemption:
  reason: "CI 45 分钟硬超时；运行期验证已移至 test_package（链接并运行 Widgets/PrintSupport/Xml 组件）。上游 auto-test 套件不在 conan create 阶段执行"
  spec: "TEST_QUALITY_SPEC §3"

upstream_test_changes:
  - file: "tests/benchmarks/benchmarks.pro"
    reason: "QtSql is disabled in this package; only the QtSql benchmark subtree is skipped"
  - file: "tests/auto/corelib/kernel/qmetatype/tst_qmetatype.cpp"
    reason: "Replace non-standard pthread_yield with POSIX sched_yield on OHOS"
  - file: "tests/auto/network/ssl/qsslkey/tst_qsslkey.cpp"
    reason: "Do not enumerate SSL curves when the configured Qt feature set disables SSL"
  - file: "tests/auto/corelib/plugin/qpluginloader/fakeplugin.cpp"
    reason: "Keep test metadata in a section with a Clang-compatible data type"
  - file: "tests/auto/corelib/text/qlocale/tst_qlocale.cpp"
    reason: "Check standard floating-point exception flags instead of using non-standard feenableexcept"
  - file: "Qt feature configuration"
    reason: "Disable QSystemSemaphore and QSharedMemory because OHOS blocks the System V semaphore syscall; their upstream test directories are excluded by Qt feature guards"

# 以下仅为上游测试套件的位置说明（参考用），本配方不在 build() 中执行它们（见上方豁免）。
upstream_tests:
  - name: "QtCore"
    source: qtbase-everywhere-src-5.15.2/tests/auto/corelib/
    description: "QtCore 自动化测试 (qstring, qvariant, qobject 等) — 仅参考，不在 build() 执行"
  - name: "QtNetwork"
    source: qtbase-everywhere-src-5.15.2/tests/auto/network/
    description: "QtNetwork 自动化测试 (socket, ssl, http 等) — 仅参考，不在 build() 执行"
  - name: "QtGui"
    source: qtbase-everywhere-src-5.15.2/tests/auto/gui/
    description: "QtGui 自动化测试 (matrix, image, OpenGL context 等) — 仅参考，不在 build() 执行"
  - name: "QtTest"
    source: qtbase-everywhere-src-5.15.2/tests/auto/testlib/
    description: "QtTest 框架自身测试 — 仅参考，不在 build() 执行"
  - name: "QtConcurrent"
    source: qtbase-everywhere-src-5.15.2/tests/auto/concurrent/
    description: "QtConcurrent upstream automatic tests — 仅参考，不在 build() 执行"

# test_package 中自带的测试（覆盖本 PR 核心新增组件 Widgets/PrintSupport/Xml）
test_package_tests:
  - file: test.cpp
    description: "QtNetwork loopback 地址解析、QtGui 矩阵/图像运算，以及新增 QtWidgets(QWidget)/QtXml(QDomDocument)/QtPrintSupport(QPrinter) 组件的链接+运行验证"
    command: "./test_qt5_qtbase"

# The consumer test remains a separate package/link/runtime check.
assertion_count: 6
