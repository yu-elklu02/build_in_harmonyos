# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtbase/5.15.2
homepage: https://www.qt.io/

# 上游测试命令
upstream_check_command: "make check"

# The recipe enables QtBase tests and runs the upstream suite during build().
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream suites for every module shipped by this recipe.
upstream_tests:
  - name: "QtCore"
    source: qtbase-everywhere-src-5.15.2/tests/auto/corelib/
    description: "QtCore 自动化测试 (qstring, qvariant, qobject 等)"
  - name: "QtNetwork"
    source: qtbase-everywhere-src-5.15.2/tests/auto/network/
    description: "QtNetwork 自动化测试 (socket, ssl, http 等)"
  - name: "QtGui"
    source: qtbase-everywhere-src-5.15.2/tests/auto/gui/
    description: "QtGui 自动化测试 (matrix, image, OpenGL context 等)"
  - name: "QtTest"
    source: qtbase-everywhere-src-5.15.2/tests/auto/testlib/
    description: "QtTest 框架自身测试"
  - name: "QtConcurrent"
    source: qtbase-everywhere-src-5.15.2/tests/auto/concurrent/
    description: "QtConcurrent upstream automatic tests"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "QLocalServer/QLocalSocket IPC 与 QtGui 矩阵运算消费者测试"
    command: "./test_qt5_qtbase"

# The consumer test remains a separate package/link/runtime check.
assertion_count: 3
