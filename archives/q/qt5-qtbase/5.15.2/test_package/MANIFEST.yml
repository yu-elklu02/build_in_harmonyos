# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtbase/5.15.2
homepage: https://www.qt.io/

# 上游测试命令
upstream_check_command: "make check"

# 编译时使用了 -nomake tests，上游测试套件未构建
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游测试套件 (tests/ 目录，未构建)
upstream_tests:
  - name: "QtCore"
    source: qtbase-everywhere-src-5.15.2/tests/auto/corelib/
    description: "QtCore 自动化测试 (qstring, qvariant, qobject 等)"
  - name: "QtNetwork"
    source: qtbase-everywhere-src-5.15.2/tests/auto/network/
    description: "QtNetwork 自动化测试 (socket, ssl, http 等)"
  - name: "QtGui"
    source: qtbase-everywhere-src-5.15.2/tests/auto/gui/
    description: "QtGui 自动化测试 (matrix, image, OpenGL context 等)"
  - name: "QtTest"
    source: qtbase-everywhere-src-5.15.2/tests/auto/testlib/
    description: "QtTest 框架自身测试"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "QLocalServer/QLocalSocket IPC 与 QtGui 矩阵运算消费者测试"
    command: "./test_qt5_qtbase"

# 测试断言总数 (近似值)
assertion_count: 3
