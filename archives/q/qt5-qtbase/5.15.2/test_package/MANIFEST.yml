# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtbase/5.15.2
homepage: https://www.qt.io/

# 上游测试命令
upstream_check_command: "make check"

# The recipe enables QtBase tests and runs the upstream suite during build().
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_test_changes:
  - file: "tests/benchmarks/benchmarks.pro"
    reason: "QtSql is disabled in this package; only the QtSql benchmark subtree is skipped"
  - file: "tests/auto/corelib/kernel/qmetatype/tst_qmetatype.cpp"
    reason: "Replace non-standard pthread_yield with POSIX sched_yield on OHOS"
  - file: "tests/auto/network/ssl/qsslkey/tst_qsslkey.cpp"
    reason: "Do not enumerate SSL curves when the configured Qt feature set disables SSL"
  - file: "tests/auto/corelib/plugin/qpluginloader/fakeplugin.cpp"
    reason: "Keep test metadata in a section with a Clang-compatible data type"
  - file: "tests/auto/corelib/text/qlocale/tst_qlocale.cpp"
    reason: "Check standard floating-point exception flags instead of using non-standard feenableexcept"
  - file: "Qt feature configuration"
    reason: "Disable QSystemSemaphore and QSharedMemory because OHOS blocks the System V semaphore syscall; their upstream test directories are excluded by Qt feature guards"

# Upstream suites for every module shipped by this recipe.
upstream_tests:
  - name: "QtCore"
    source: qtbase-everywhere-src-5.15.2/tests/auto/corelib/
    description: "QtCore 自动化测试 (qstring, qvariant, qobject 等)"
  - name: "QtNetwork"
    source: qtbase-everywhere-src-5.15.2/tests/auto/network/
    description: "QtNetwork 自动化测试 (socket, ssl, http 等)"
  - name: "QtGui"
    source: qtbase-everywhere-src-5.15.2/tests/auto/gui/
    description: "QtGui 自动化测试 (matrix, image, OpenGL context 等)"
  - name: "QtTest"
    source: qtbase-everywhere-src-5.15.2/tests/auto/testlib/
    description: "QtTest 框架自身测试"
  - name: "QtConcurrent"
    source: qtbase-everywhere-src-5.15.2/tests/auto/concurrent/
    description: "QtConcurrent upstream automatic tests"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "QtNetwork loopback 地址解析与 QtGui 矩阵运算消费者测试"
    command: "./test_qt5_qtbase"

# The consumer test remains a separate package/link/runtime check.
assertion_count: 4
