software: qt5-qtbase
version: "5.15.2"
status: published
build_date: "2026-07-02"
category: qt-core

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  sha256: "909fad2591ee367993a75d7e2ea50ad4db332f05e1c38dd7a5a274e156a4e0f8"
  tar_format: tar.xz

build:
  system: configure+make
  configure_options:
    - "-opensource -confirm-license"
    - "-no-gui -no-widgets -no-dbus -no-opengl -no-accessibility"
    - "-no-feature-sql -no-feature-xml"
    - "-nomake tests -nomake examples"
    - "-no-iconv -no-glib -no-icu -no-openssl -no-libproxy"
    - "-platform linux-clang"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

products:
  libraries:
    - libQt5Core.so.5.15.2
    - libQt5Network.so.5.15.2 (with abstract socket patch)
    - libQt5Test.so.5.15.2
    - libQt5Concurrent.so.5.15.2
  headers:
    - QtCore, QtNetwork, QtTest, QtConcurrent

patches_applied:
  - "0001-abstract-socket.patch: QLocalServer abstract socket"
  - "0002-abstract-socket-client.patch: QLocalSocket abstract socket"
  - "0003-pthread-cancel-stub.patch: guard pthread_cancel calls with HAVE_PTHREAD_CANCEL feature detection"
  - "0004-socklen-t-ohos.patch: define QT_SOCKLEN_T as socklen_t on OHOS (fix accept4 type mismatch)"

knowledge_gained:
  - "OHOS stripped ELF dlopen 限制 (E215): musl 拒绝加载 stripped 共享库"
  - "OHOS Unix 域套接字 bind() 被拒绝: 需使用抽象套接字命名空间"
  - "LD_LIBRARY_PATH 在 OHOS 上被忽略: 用 \$ORIGIN RPATH 替代"
  - "qt5-qtbase configure -no-feature-testlib 导致 Qt5Test 缺失"
