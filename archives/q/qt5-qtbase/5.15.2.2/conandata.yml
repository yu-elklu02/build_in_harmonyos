sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/qt/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
    - "https://mirrors.ustc.edu.cn/qtproject/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
    - "https://mirrors.sjtug.sjtu.edu.cn/qt/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
    - "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtbase-everywhere-src-5.15.2.tar.xz"
  sha256: "909fad2591ee367993a75d7e2ea50ad4db332f05e1c38dd7a5a274e156a4e0f8"

patches:
  - patch_file: "patches/0001-abstract-socket.patch"
    patch_type: "portability"
    patch_description: "OHOS: use abstract Unix domain socket namespace in QLocalServer"
  - patch_file: "patches/0002-abstract-socket-client.patch"
    patch_type: "portability"
    patch_description: "OHOS: use abstract Unix domain socket namespace in QLocalSocket"
  - patch_file: "patches/0003-pthread-cancel-stub.patch"
    patch_type: "portability"
    patch_description: "Guard pthread cancellation calls when the toolchain does not provide pthread_cancel"
  - patch_file: "patches/0004-socklen-t-ohos.patch"
    patch_type: "portability"
    patch_description: "Use POSIX socklen_t for the supported modern Linux and OHOS targets"
  - patch_file: "patches/0005-qmake-ohos-host.patch"
    patch_type: "portability"
    patch_description: "Use LD_LIBRARY_PATH for unrecognized Q_OS_UNIX qmake hosts such as OpenHarmony"
  - patch_file: "patches/0006-benchmark-sql-module.patch"
    patch_type: "test"
    patch_description: "Build QtSql benchmarks only when the QtSql module is enabled"
  - patch_file: "patches/0007-qmetatype-sched-yield.patch"
    patch_type: "test"
    patch_description: "Use POSIX sched_yield in qmetatype tests because OHOS does not provide pthread_yield"
  - patch_file: "patches/0008-qsslkey-no-ssl-test-init.patch"
    patch_type: "test"
    patch_description: "Skip SSL curve enumeration in the qsslkey test when SSL is disabled by the configured Qt feature set"
  - patch_file: "patches/0009-qpluginloader-clang-section-type.patch"
    patch_type: "test"
    patch_description: "Use a writable metadata marker in the qpluginloader test so it shares the plugin pointer section type under Clang"
  - patch_file: "patches/0010-qlocale-standard-fenv-test.patch"
    patch_type: "test"
    patch_description: "Use standard floating-point exception flags in the qlocale test when feenableexcept is unavailable"
  - patch_file: "patches/0011-qthreadpool-ohos-startup-sync.patch"
    patch_type: "test"
    patch_description: "Synchronize QThreadPool peak-concurrency measurement with worker startup"
