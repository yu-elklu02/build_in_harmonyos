name: qtwebsockets
version: "6.11.1"
status: built
build_system: cmake
build_date: "2026-08-08"
conan_ref: "qtwebsockets/6.11.1"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtwebsockets-everywhere-src-6.11.1.tar.xz"
  sha256: "243e3aa11924c8c5c1645e892f62d013caa3766c57512ca926d5b58146646fbf"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DQT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
    - "-DQT_BUILD_BENCHMARKS=OFF"
    - "-DQT_BUILD_MANUAL_TESTS=OFF"
  dependencies:
    - qtbase/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "qtbase/6.11.1 provides the native Qt6 CMake package; qtwebsockets consumers must use that package instead of generated CMakeDeps wrappers."
  - "The published qtbase/6.11.1 package reports QT_FEATURE_private_tests=OFF, so Qt WebSockets private auto tests are not registered by upstream CMake."
  - "The Qt WebSockets QML auto test is guarded by Qt Quick/QuickTest and is outside the current qtbase-only dependency contract."
  - "The consumer test exercises a real loopback QWebSocketServer/QWebSocket text-message exchange."
