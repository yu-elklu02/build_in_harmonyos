package: qtwebsockets/6.11.1
homepage: https://doc.qt.io/qt-6/qtwebsockets-index.html
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"
upstream_tests:
  - file: tests/auto/cmake/CMakeLists.txt
    description: "Run the Qt WebSockets CMake package integration test"
    command: "ctest --output-on-failure"
  - file: tests/auto/websockets/qwebsocketcorsauthenticator/CMakeLists.txt
    description: "Run tst_qwebsocketcorsauthenticator"
    command: "ctest -R '^tst_qwebsocketcorsauthenticator$' --output-on-failure"
  - file: tests/auto/websockets/qwebsocket/CMakeLists.txt
    description: "Run tst_qwebsocket"
    command: "ctest -R '^tst_qwebsocket$' --output-on-failure"
  - file: tests/auto/websockets/qwebsocketserver/CMakeLists.txt
    description: "Run tst_qwebsocketserver"
    command: "ctest -R '^tst_qwebsocketserver$' --output-on-failure"
conditional_upstream_tests:
  - file: tests/auto/websockets/websocketprotocol/CMakeLists.txt
    description: "tst_websocketprotocol requires qtbase QT_FEATURE_private_tests=ON"
    condition: "QT_FEATURE_private_tests"
    command: "ctest -R '^tst_websocketprotocol$' --output-on-failure"
  - file: tests/auto/websockets/dataprocessor/CMakeLists.txt
    description: "tst_dataprocessor requires qtbase QT_FEATURE_private_tests=ON"
    condition: "QT_FEATURE_private_tests"
    command: "ctest -R '^tst_dataprocessor$' --output-on-failure"
  - file: tests/auto/websockets/websocketframe/CMakeLists.txt
    description: "tst_websocketframe requires qtbase QT_FEATURE_private_tests=ON"
    condition: "QT_FEATURE_private_tests"
    command: "ctest -R '^tst_websocketframe$' --output-on-failure"
  - file: tests/auto/websockets/handshakerequest/CMakeLists.txt
    description: "tst_handshakerequest requires qtbase QT_FEATURE_private_tests=ON"
    condition: "QT_FEATURE_private_tests"
    command: "ctest -R '^tst_handshakerequest$' --output-on-failure"
  - file: tests/auto/websockets/handshakeresponse/CMakeLists.txt
    description: "tst_handshakeresponse requires qtbase QT_FEATURE_private_tests=ON"
    condition: "QT_FEATURE_private_tests"
    command: "ctest -R '^tst_handshakeresponse$' --output-on-failure"
  - file: tests/auto/websockets/qdefaultmaskgenerator/CMakeLists.txt
    description: "tst_defaultmaskgenerator requires qtbase QT_FEATURE_private_tests=ON"
    condition: "QT_FEATURE_private_tests"
    command: "ctest -R '^tst_defaultmaskgenerator$' --output-on-failure"
  - file: tests/auto/qml/qmlwebsockets/CMakeLists.txt
    description: "tst_qmlwebsockets requires upstream Qt Quick and Qt QuickTest targets"
    condition: "TARGET Qt::Quick AND TARGET Qt::QuickTest"
test_package_tests:
  - file: test_package.cpp
    description: "Run a loopback QWebSocketServer/QWebSocket text echo exchange"
    command: "./test_package"
assertion_count: 6
