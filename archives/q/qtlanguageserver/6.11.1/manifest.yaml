version: "6.11.1"
status: failed
build_date: "2026-07-18"
conan_ref: "qtlanguageserver/6.11.1"

source:
  url: "https://download.qt.io/official_releases/qt/6.11/6.11.1/submodules/qtlanguageserver-everywhere-src-6.11.1.tar.xz"
  sha256: "50008537f2ca54abb3b8dc3f26759864e9cad2b2ad39e92e42fa718de2dd8aef"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DQT_QMAKE_TARGET_MKSPEC=harmonyos-clang"
    - "-DQT_BUILD_TESTS=ON"
    - "-DQT_BUILD_TESTS_BY_DEFAULT=ON"
    - "-DQT_BUILD_EXAMPLES=OFF"
  dependencies:
    - qtbase/6.11.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Qt private module discovery requires the qtbase CMake package path"
  - "qtbase/6.11.1 is available and both private libraries compile and link"
  - "QT_BUILD_TESTS configures the tests, while QT_BUILD_TESTS_BY_DEFAULT is also required for a normal CMake build to generate the test executables"
  - "Build #15341 registered five tests but built only the production libraries; its four missing-executable failures are not platform incompatibility evidence"
  - "Build #15413 compiled every configured test target and passed the complete upstream suite (5/5) on the official OHOS worker"
  - "The installed archives are libQt6LanguageServer.a and libQt6JsonRpc.a; Conan cpp_info.libs must export Qt6LanguageServer and Qt6JsonRpc without the Private suffix"
  - "Build #15584 passed all five upstream tests; its only failure was CMakeDeps looking for qtbaseConfig.cmake instead of the native Qt6Config.cmake"
  - "The installed Qt6LanguageServerPrivateConfig.cmake exports Qt6::LanguageServerPrivate and should be reused by Conan consumers"
