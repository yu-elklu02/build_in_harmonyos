package: qtlanguageserver/6.11.1
homepage: https://code.qt.io/cgit/qt/qtlanguageserver.git/
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1 (with Conan VirtualRunEnv)"
upstream_tests:
  - file: tests/auto/cmake/CMakeLists.txt
    description: "Run the QtJsonRpc CMake package integration test"
    command: "ctest -R '^test_qtjsonrpc_module$' --output-on-failure"
    ohos_status: passed
    ohos_reason: "Build #15413 passed this test on the official OHOS worker"
  - file: tests/auto/generated_lsp_types/CMakeLists.txt
    description: "Run tst_generated_lsp_types"
    command: "ctest -R '^tst_generated_lsp_types$' --output-on-failure"
    ohos_status: passed
    ohos_reason: "Build #15413 passed this test on the official OHOS worker"
  - file: tests/auto/typedjson/CMakeLists.txt
    description: "Run tst_typedjson"
    command: "ctest -R '^tst_typedjson$' --output-on-failure"
    ohos_status: passed
    ohos_reason: "Build #15413 passed this test on the official OHOS worker"
  - file: tests/auto/qlanguageserver/CMakeLists.txt
    description: "Run tst_qlanguageserver"
    command: "ctest -R '^tst_qlanguageserver$' --output-on-failure"
    ohos_status: passed
    ohos_reason: "Build #15413 passed this test on the official OHOS worker"
  - file: tests/auto/qjsonrpcprotocol/CMakeLists.txt
    description: "Run tst_qjsonrpcprotocol"
    command: "ctest -R '^tst_qjsonrpcprotocol$' --output-on-failure"
    ohos_status: passed
    ohos_reason: "Build #15413 passed this test on the official OHOS worker"
test_package_tests:
  - file: test_package.cpp
    description: "Include the installed LSP specification API and use TraceValue"
    command: "./test_package"
assertion_count: 1
