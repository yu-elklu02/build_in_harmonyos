software: qt5-qt3d
version: "5.15.2"
homepage: "https://wiki.qt.io/Qt3D"
license: "LGPL-3.0-only OR GPL-2.0-only"
category: qt-addon
status: recipe-ready

source:
  url: "https://github.com/qt/qt3d/archive/refs/tags/v5.15.2.tar.gz"
  sha256: "4752c8ea92070e742e5de4eae07b562e65f3e9ffe0e844f0f3830fe18162d5be"

build:
  system: qmake
  configure_options:
    - "-spec harmonyos-clang"
    - "-prefix <package_folder>"
  dependencies:
    - "qt5-qtbase/5.15.2"
    - "qt5-qtdeclarative/5.15.2"

tests:
  upstream: "Qt3D upstream test targets are built by qmake; device execution is pending."
  consumer: "test_package/test.cpp creates a QEntity hierarchy and verifies a QTransform component."
