# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: qt5-qtimageformats/5.15.2
homepage: https://www.qt.io/

# 上游测试命令：本配方不在 build() 中运行上游 auto-test 套件。
# qt5-qtimageformats is a pure addon module; its build produces only plugins.
# 运行期验证统一交由 test_package 完成。
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""
upstream_test_exemption:
  reason: "qt5-qtimageformats 是纯 addon 模块，仅产出 Qt5Gui 插件。运行期验证已移至 test_package（生成 TIFF/WebP 图像并回读验证插件功能）。上游 auto-test 套件不在 conan create 阶段执行"
  spec: "TEST_QUALITY_SPEC §3"

upstream_test_changes: []

# 上游测试套件位置说明（仅参考）
upstream_tests:
  - name: "Image Formats"
    source: qtimageformats-everywhere-src-5.15.2/tests/auto/
    description: "图像格式插件自动化测试 — 仅参考，不在 build() 执行"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "生成 TIFF 和 WebP 图像并回读验证，确认 qt5-qtimageformats 的 qtiff 和 qwebp 插件功能正常"
    command: "./test_qt5_qtimageformats"

assertion_count: 5
