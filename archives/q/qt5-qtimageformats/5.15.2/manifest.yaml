software: qt5-qtimageformats
version: "5.15.2"
status: built
build_system: qmake
build_date: "2026-08-08"
category: qt-addon

source:
  url: "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/qtimageformats-everywhere-src-5.15.2.tar.xz"
  sha256: "bf8285c7ce04284527ab823ddc7cf48a1bb79131db3a7127342167f4814253d7"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake qtimageformats.pro"
  dependencies:
    - qt5-qtbase/5.15.2.1
  cc: clang
  cxx: clang++

products:
  plugins:
    - plugins/imageformats/libqtga.so
    - plugins/imageformats/libqwbmp.so
    - plugins/imageformats/libqtiff.so
    - plugins/imageformats/libqwebp.so
    - plugins/imageformats/libqicns.so
  cmake_configs:
    - lib/cmake/Qt5Gui/Qt5Gui_QTgaPlugin.cmake
    - lib/cmake/Qt5Gui/Qt5Gui_QWbmpPlugin.cmake
    - lib/cmake/Qt5Gui/Qt5Gui_QTiffPlugin.cmake
    - lib/cmake/Qt5Gui/Qt5Gui_QWebpPlugin.cmake
    - lib/cmake/Qt5Gui/Qt5Gui_QICNSPlugin.cmake

patches_applied: []

knowledge_gained:
  - "Qt5 addon module built with qmake, requires qt5-qtbase for qmake tool and Qt5Core/Qt5Gui"
  - "Bundled 3rdparty libtiff and libwebp are used by default (no system-tiff/system-webp)"
  - "No source modifications needed for HarmonyOS/OHOS"
