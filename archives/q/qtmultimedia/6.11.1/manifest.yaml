knowledge_gained:
  - "qtmultimedia 顶层 CMakeLists 仅 REQUIRED Core，Gui 必须存在否则 return()；Qml/Quick/Widgets/Svg 等均为 OPTIONAL_COMPONENTS，核心 Multimedia 库只依赖 qtbase（Core/Gui/Network/Concurrent）+ qtshadertools"
  - "qtmultimedia 的 src/multimedia 使用 qt_internal_add_shaders 预编译 shader，必须在 CMakeToolchain 中显式设置 Qt6ShaderTools_DIR 指向 qtshadertools 包 lib/cmake/Qt6ShaderTools，否则 configure 报 Unknown CMake command"
  - "Qt Shader Baker（qsb）是构建期宿主工具，编译 shader 时需要 LD_LIBRARY_PATH 指向 qtshadertools/q tbase 包 lib，否则 symbol not found"
  - "OHOS 无音频/视频媒体后端（configure 报 No backend for low level audio found），上游设备类测试无法运行，消费者测试覆盖非设备 API"

