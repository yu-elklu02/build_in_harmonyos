package: qtmultimedia/6.11.1
homepage: "https://doc.qt.io/qt-6/qtmultimedia-index.html"
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"

excluded_upstream_tests:
  - command: "ctest --test-dir <build> --output-on-failure -j1"
    reason: "OHOS 无音频/视频媒体后端（configure 报 No backend for low level audio found），上游 74 个 auto tests 中绝大多数依赖真实媒体设备（qaudiosink/qcamera/qmediaplayer 等），仅核心非设备类 API 测试可运行；test_package 消费者测试覆盖安装包的 QMediaPlayer/QAudioOutput/QMediaDevices/QMediaMetaData API。"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test exercising QMediaPlayer/QMediaDevices/QMediaMetaData APIs from the installed Qt6Multimedia package"
    command: "./test_package"

assertion_count: 6
