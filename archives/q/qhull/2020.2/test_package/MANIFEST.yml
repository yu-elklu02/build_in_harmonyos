package: qhull/2020.2
homepage: "https://github.com/qhull/qhull"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "testqset; testqset_r; smoketest; rbox-10-qhull; rbox-10-qconvex; rbox-10-qdelaunay; rbox-10-qhalf; rbox-10-qvoronoi; user_eg; user_eg2; user_eg3"
upstream_tests:
  - file: src/testqset/testqset.c
    description: "Non-reentrant set implementation tests"
  - file: src/testqset_r/testqset_r.c
    description: "Reentrant set implementation tests"
  - file: src/user_eg/user_eg_r.c
    description: "Reentrant shared-library API example"
  - file: src/user_eg2/user_eg2_r.c
    description: "Extended reentrant API example"
  - file: src/user_eg3/user_eg3_r.cpp
    description: "C++ wrapper API example linked to the non-installed static test targets"

test_package_tests:
  - file: test.c
    description: "Compute a square convex hull with qh_new_qhull and validate vertices, facets, and cleanup"
    command: "./test_qhull"

assertion_count: 6
