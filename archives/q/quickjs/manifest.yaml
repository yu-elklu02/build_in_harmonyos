software: quickjs
display: "QuickJS"
description: "Fast, small, and embeddable JavaScript engine"
category: interpreter
homepage: "https://bellard.org/quickjs/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Bellard QuickJS 使用 Makefile 构建，CC/HOST_CC 直接指定编译器"
    - "qjsc 临时文件目录必须设置到 Conan 可写构建目录，避免 OHOS 只读 /tmp"
    - "CONFIG_BIGNUM=y 启用 BigInt 支持（R26 要求）"
    - "静态链接需链接 libm 和 libpthread"
  common_dependencies: []

versions:
  "2024-01-13":
    status: built
    build_date: "2026-07-15"
