# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: quickjs/2024-01-13
homepage: https://bellard.org/quickjs/

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# quickjs 上游测试
upstream_tests:
  - file: run-test262
    source: quickjs-2024-01-13.tar.xz/run-test262
    description: "ECMAScript 2020 测试套件"
    command: "./run-test262"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 quickjs API 验证 JavaScript 引擎功能"
    command: "./test_quickjs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
