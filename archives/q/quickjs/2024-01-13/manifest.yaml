software: quickjs
display: "QuickJS"
version: "2024-01-13"
status: built
build_date: "2026-07-15"

source:
  url: "https://bellard.org/quickjs/quickjs-2024-01-13.tar.xz"
  sha256: "3c4bf8f895bfa54beb486c8d1218112771ecfc5ac3be1036851ef41568212e03"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "CC/AR 从 Conan tools.build:compiler_executables 获取"
    - "HOST_CC 从 Conan conf c_host 或环境变量 HOST_CC 获取，默认 gcc"
    - "TMPDIR=<build_folder>/_tmp"
    - "CONFIG_BIGNUM=y"

patches_applied:
  - "0001-qjsc-use-tmpdir.patch"

knowledge_gained:
  - "QuickJS Makefile 会覆盖环境中的 CC/AR，需从 Conan profile 读取目标工具后显式传给 make"
  - "CONFIG_BIGNUM=y 启用 BigInt 支持（R26 要求）"
  - "静态链接需链接 libm 和 libpthread"
  - "可执行文件通过 runenv_info.append_path 注入 PATH"
  - "bellard.org 可被 CI Worker 直接访问，无需 GitCode 镜像"
  - "qjsc.c 原本硬编码 /tmp 且忽略 TMPDIR，需补丁改为优先使用 TMPDIR，并由 Conan 指向可写构建目录"
