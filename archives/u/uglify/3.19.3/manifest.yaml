version: "3.19.3"
software: "uglify"
status: built
build_date: "2026-07-29"
conan_ref: "uglify/3.19.3"

source:
  url: "https://codeload.github.com/mishoo/UglifyJS/tar.gz/refs/tags/v3.19.3"
  filename: "UglifyJS-v3.19.3.tar.gz"
  sha256: "6988b64d4169c150ce46b8ae6e2c369aa82b1d67adc755236abf972c38857737"
  tar_format: tar.gz

build:
  system: npm
  configure_options:
    - "NODE_OPTIONS=--jitless"
    - "UGLIFY_GITHUB_LAG=300000"
    - "UGLIFY_TEST_JOBS=4"
    - "npm install --ignore-scripts --no-audit --no-fund --no-package-lock --no-save"
    - "bash run_upstream_tests.sh"
  dependencies: []
  test_only_dev_dependencies:
    - "acorn ~8.7.1"
    - "semver ~6.3.0"
  cc: N/A
  cxx: N/A

patches_applied: []

artifacts:
  binaries:
    - "bin/uglifyjs"
  resources:
    - "res/uglify-js/bin"
    - "res/uglify-js/lib"
    - "res/uglify-js/tools"
    - "res/uglify-js/package.json"

knowledge_gained:
  - "The official npm metadata for uglify-js 3.19.3 declares no runtime, optional, peer, or bundled dependencies."
  - "The GitHub tag archive contains 126 compression fixture files and 25 mocha suite files, unlike the reduced npm distribution tarball."
  - "The complete upstream npm test suite requires only the acorn and semver dev dependencies, which are not packaged."
  - "Compression fixtures are split by upstream file and run in four parallel workers so the complete JIT-disabled suite fits the W3 timeout."
  - "The upstream-supported UGLIFY_GITHUB_LAG setting raises timing budgets for the intentionally slower --jitless runtime."
  - "The installed launcher executes Node.js with --jitless for HarmonyOS aarch64 runtime compatibility."
