package: uglify/3.19.3
homepage: "https://github.com/mishoo/UglifyJS"

upstream_check_command: "bash run_upstream_tests.sh"
upstream_test_in_build: true
upstream_test_command: "NODE_OPTIONS=--jitless UGLIFY_GITHUB_LAG=300000 UGLIFY_TEST_JOBS=4 bash run_upstream_tests.sh"

upstream_tests:
  - name: compression-regressions
    source: "UglifyJS-3.19.3/test/compress/"
    description: "Complete upstream compression, mangling, parsing, and output regression matrix."
    command: "node test/compress.js <fixture-file>"
    fixture_files: 126
    count: 4233
  - name: node-api-and-cli
    source: "UglifyJS-3.19.3/test/mocha/"
    description: "Complete upstream Node.js API, parser, source-map, token, and CLI behavior suites."
    command: "node test/mocha.js"
    suite_files: 25
    count: 264

test_package_tests:
  - file: test.sh
    description: "Runs the installed CLI for version, file compression and mangling, compressed-code execution, and stdin compression."
    command: "sh test.sh <uglifyjs-path>"
    count: 4

upstream_case_count: 4497
test_package_assertion_count: 4
assertion_count: 4501
