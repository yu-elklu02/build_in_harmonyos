version: "1.6.2-r1"
status: built
build_date: "2026-07-16"
build_system: cmake

source:
  url: "https://github.com/twogood/unshield/archive/refs/tags/1.6.2.tar.gz"
  sha256: "a937ef596ad94d16e7ed2c8553ad7be305798dcdcfd65ae60210b1e54ab51a2f"
  tar_format: tar.gz
  test_suite:
    source: "Vendored from upstream git tree (tag 1.6.2, commit 51de441) at recipe folder test_suite/"
    description: "unshield .gitattributes 标记 test export-ignore，所有 GitHub auto-tarball 均不含 test/。配方将 1.6.2 tag git tree 的 test/ 目录（19 个文件，48MB）vendoring 到 test_suite/，source() 阶段直接复制到源码树 test/，29 个 add_test CTest 用例"

build:
  system: cmake
  configure_options:
    - "-DUSE_OUR_OWN_MD5=ON"
    - "-DOPENSSL_ROOT_DIR=''"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - "zlib/1.3.1.1"
  cc: clang

patches_applied:
  - "0001-fix-rpath-soname.patch: Fix RPATH and SONAME for HarmonyOS (E207)"
  - "0002-fix-stack-memory-file-test-bugs.patch: Fix stack_memory_file in-memory IO harness (fseek || boundary, fread remaining-space check, remove EOF uint32 wrap, reset current_pointer on fopen)"
  - "0003-isolate-ctest-group-working-dirs.patch: Isolate each CTest extraction group's working directory to fix parallel CTest interference"

knowledge_gained:
  - "unshield 使用 CMake 构建系统，无特殊 OHOS 平台适配需求"
  - "依赖 zlib 进行 CAB 解压缩，OpenSSL 为可选（内建 MD5 备选）"
  - "上游测试接入（HMBS）：1.6.2 发布 tarball 不含 test/ 目录（GitHub auto-tarball 剥离），开发树（commit 51de441）有 29 个 add_test。配方将开发树 test/ 目录托管为 test-suite.tar.gz，source() 阶段解压到源码树根，让 CMakeLists.txt:15/95 守卫命中、CTest 发现并执行全部 29 个用例"
  - "产物包含 libunshield.so（共享库）、unshield CLI、unshield-deobfuscate CLI"
  - "非系统同名库，遵循默认动态链接策略（R26 不适用）"
  - "版本 1.6.2-r1 为适配修复版本，修复 zlib 依赖版本为 1.3.1.1（-fPIC 静态库）：静态 libz.a 链进 libunshield.so 时非 PIC 会报 R_AARCH64 relocation"
  - "E207: HarmonyOS CMake 使用相对路径（../lib/libunshield.so）作为 DT_NEEDED，需显式设置 SONAME 并使用 $ORIGIN/../lib RPATH"
  - "CTest 并行干扰：v0 5 组共享 TESTS_WORKING_DIRECTORY=${CMAKE_BINARY_DIR}/test_tmp_dir，某组 cleanup (rm -rf) 删除他组正在用目录，extractO 被并发组覆盖 → old_compression Failed → hashes_match Not Run 级联。修复：每组 CMakeLists.txt 顶部覆盖 TESTS_WORKING_DIRECTORY 为 test_tmp_dir_<group>"
  - "test_stack_memory_file 上游测试桩 4 个 bug：fseek 边界 && 应为 ||、fread 截断检查错误、fread EOF 经 uint32 回绕为 0xFFFFFFFF 导致越界写、fopen 不重置 current_pointer → 真机 segfault/Failed。纯测试桩修复"