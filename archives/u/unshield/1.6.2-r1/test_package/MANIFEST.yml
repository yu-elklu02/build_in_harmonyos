package: unshield/1.6.2-r1
homepage: "https://github.com/twogood/unshield"

# 上游测试审计
# unshield 1.6.2 官方发布 tarball（sources.url）不含 test/ 目录——GitHub
# 的 auto-tarball 在所有端点都剥离了 test/ 子目录。但开发树（git tag
# 1.6.2, commit 51de441）确含 test/：4 个 v0 组（avigomanager,
# baldurs_gate_patch_v1_1_4315_international, the-feeble-files-spanish,
# wireplay）+ 2 个 v5 组（CVE-2015-1386, stack_memory_file），共 29 个
# add_test CTest 用例。配方在 source() 阶段将开发树 test/ 目录（托管为
# test-suite.tar.gz，conandata test_suite，sha256
# b6bb2c28…dcad8f3）解压到源码树根，让上游 CMakeLists.txt 的
# `if(IS_DIRECTORY(.../test)) include(CTest) endif()`(L15) 与
# `if(BUILD_TESTING) add_subdirectory(test) endif()`(L95) 守卫命中，
# CTest 发现并执行全部 29 个用例。
upstream_tests_exist: true

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序（29 个 add_test CTest 用例）
upstream_tests:
  - file: test/CMakeLists.txt
    source: "dev tree tag 1.6.2 (commit 51de441) test/ 目录，托管为 test-suite.tar.gz"
    description: "v0/avigomanager 组：new/old compression + hashes match + extract/cleanup（6 用例）"
    command: "ctest"
  - file: test/CMakeLists.txt
    source: "dev tree tag 1.6.2 (commit 51de441) test/ 目录，托管为 test-suite.tar.gz"
    description: "v0/baldurs_gate + the-feeble-files + wireplay 三组各 6 用例（共 18 用例）"
    command: "ctest"
  - file: test/CMakeLists.txt
    source: "dev tree tag 1.6.2 (commit 51de441) test/ 目录，托管为 test-suite.tar.gz"
    description: "v5/CVE-2015-1386 组：new/old compression（WILL_FAIL True）+ create_tests_dir/cleanup（5 用例）"
    command: "ctest"
  - file: test/v5/stack_memory_file/CMakeLists.txt
    source: "dev tree tag 1.6.2 (commit 51de441) test/ 目录，托管为 test-suite.tar.gz"
    description: "v5/stack_memory_file 组：编译并运行 test_stack_memory_file.c（1 用例）"
    command: "ctest"

test_package_tests:
  - file: conanfile.py
    description: "conanfile.py 在 conanrun 环境调用 unshield --version，再编译 test_api.c 链接 libunshield 调用 unshield_open API（R34 实质测试）"
    command: "unshield --version / clang test_api.c -lunshield && ./test_unshield_api"

assertion_count: 2
