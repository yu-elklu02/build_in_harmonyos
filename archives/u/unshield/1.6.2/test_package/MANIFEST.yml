package: unshield/1.6.2
homepage: "https://github.com/twogood/unshield"

upstream_check_command: "make test (via CMake CTest)"
upstream_test_in_build: false
upstream_test_command: "ctest"

upstream_tests:
  - note: "上游有测试目录（test/），包含 29 个 CTest 集成测试用例，分布在 4 个 v0 组（avigomanager, baldurs_gate, the-feeble-files, wireplay）和 2 个 v5 组（CVE-2015-1386, stack_memory_file），需要 .cab 测试数据文件"

test_package_tests:
  - file: conanfile.py
    description: "conanfile.py 在 conanrun 环境调用 unshield --version，再编译 test_api.c 链接 libunshield 调用 unshield_open API（R34 实质测试）"
    command: "unshield --version / clang test_api.c -lunshield && ./test_unshield_api"

assertion_count: 2