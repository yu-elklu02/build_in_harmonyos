software: unshield
version: "1.6.2"
status: built
build_system: cmake
build_date: "2026-07-16"

source:
  url: "https://github.com/twogood/unshield/archive/refs/tags/1.6.2.tar.gz"
  sha256: "a937ef596ad94d16e7ed2c8553ad7be305798dcdcfd65ae60210b1e54ab51a2f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DUSE_OUR_OWN_MD5=ON"
    - "-DOPENSSL_ROOT_DIR=''"
  dependencies:
    - "zlib/1.3.1.1"
  cc: clang

patches_applied:
  - "0001-fix-rpath-soname.patch: Fix RPATH and SONAME for HarmonyOS (E207)"

knowledge_gained:
  - "unshield 使用 CMake 构建系统，无特殊 OHOS 平台适配需求"
  - "依赖 zlib 进行 CAB 解压缩，OpenSSL 为可选（内建 MD5 备选）"
  - "上游有测试目录（test/），包含 29 个 CTest 集成测试用例（6 个 v0 组 × 4 + v5 CVE + v5 stack_memory_file），需要 .cab 测试数据文件"
  - "产物包含 libunshield.so（共享库）、unshield CLI、unshield-deobfuscate CLI"
  - "非系统同名库，遵循默认动态链接策略（R26 不适用）"
  - "zlib 须用 1.3.1.1（-fPIC 静态库）：静态 libz.a 链进 libunshield.so 时非 PIC 会报 R_AARCH64 relocation"
  - "E207: HarmonyOS CMake 使用相对路径（../lib/libunshield.so）作为 DT_NEEDED，需显式设置 SONAME 并使用 $ORIGIN/../lib RPATH"

patch_classification: []