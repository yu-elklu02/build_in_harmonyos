package: unpaper/7.0.0
homepage: "https://github.com/unpaper/unpaper"

upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/unpaper_tests.py
    source: unpaper-7.0.0/tests/unpaper_tests.py
    description: "Pytest 金标图像比对套件（依赖 pytest + PIL + sphinx-build，OHOS worker 均无，故未在 build() 运行）"
    command: "meson test"

test_package_tests:
  - file: test.sh
    description: "conanfile.py 在 conanrun 环境调用 test.sh：运行 unpaper --version，再用 8x8 PPM 做一次真实图像往返，验证 libavformat/libavcodec 读写链路"
    command: "unpaper --version / unpaper --layout none in.ppm out.ppm"

assertion_count: 2
