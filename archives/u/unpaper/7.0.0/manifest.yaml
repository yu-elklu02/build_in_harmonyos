software: unpaper
version: "7.0.0"
status: built
build_system: meson
build_date: "2026-07-14"

source:
  url: "https://github.com/unpaper/unpaper/releases/download/unpaper-7.0.0/unpaper-7.0.0.tar.xz"
  sha256: "2575fbbf26c22719d1cb882b59602c9900c7f747118ac130883f63419be46a80"
  tar_format: tar.xz

ffmpeg_source:
  url: "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz"
  sha256: "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c"

build:
  system: "meson (bypassed: 直接编译 5 个 C 源)"
  configure_options:
    - "FFmpeg: --disable-everything --enable-{decoder,encoder}=ppm,pgm,pbm,png,rawvideo"
    - "FFmpeg: --enable-{demuxer,muxer}=image2,image2pipe --enable-protocol=file"
    - "FFmpeg: --enable-parser=png --enable-zlib --disable-{avdevice,avfilter,swscale,programs,doc,shared}"
    - "FFmpeg: --disable-vulkan（OHOS SDK 的 vulkan.h 缺 vulkan_beta.h，且 --disable-everything 不阻止 autodetect，须显式禁用）"
    - "unpaper: -std=c11 -D_POSIX_C_SOURCE=200809L -Werror=int-conversion"
  dependencies:
    - "zlib/1.3.1"
    - "FFmpeg 8.1.2 (源码内联静态构建)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ffmpeg-configure-harmonyos.patch"

knowledge_gained:
  - "OHOS 无 FFmpeg conan 包/系统库（仓库 archives/f/ffmpeg 各版本均为失败归档，ffprobe 的 av 库又禁用了 encoder/muxer 不满足 unpaper 写图需求），故在配方内从官方 FFmpeg 8.1.2 源码内联构建最小静态 av 库（仅 ppm/pgm/pbm/png/rawvideo 编解码 + image2 容器 + file 协议 + zlib）"
  - "FFmpeg configure 不识别 harmonyos OS，需补丁添加 harmonyos case（与 ffprobe 8.1.2 的 0001-configure.patch 同源同上下文）"
  - "FFmpeg configure 的 --disable-everything 不阻止 vulkan/v4l2_m2m 等 hwaccel 的 autodetect；OHOS SDK 的 vulkan.h 缺 vulkan_beta.h，编译 libavcodec/vulkan.o 时 fatal error。须显式 --disable-vulkan（与 ffprobe 一致）。本机构建容器无 OHOS SDK vulkan 头故本地不复现，仅在真机 worker 暴露"
  - "unpaper 上游为 Meson 项目，但 meson.build 强依赖 sphinx-build(生成手册)与 pytest+PIL(跑金标图像测试)，OHOS worker 均无；改为绕过 Meson 直接编译 file/imageprocess/parse/tools/unpaper 五个 C 源（与 meson.build 同源同标志：c11 + -D_POSIX_C_SOURCE=200809L + -Werror=int-conversion），version.h 由 version.h.in 替换 @version@ 生成"
  - "FFmpeg configure 直接调用 tr/uname/grep/mktemp；OHOS rootfs 缺 tr 且 GNU coreutils 装在默认 PATH 之外（如 /root/usr/local/bin），conanbuild 环境 PATH 不含该目录 → configure 报 'tr: inaccessible' 后 'Unknown OS'。配方 build() 开头探测并把该目录前置到 PATH（worker 上工具已在 PATH 则为空操作）"
  - "FFmpeg 8.x image2 muxer 写单图时打印 image-sequence-pattern 警告但实际写出有效图像，test_package 以 out.ppm 存在且非空断言，不阻塞"
  - "ELF 签名工具 binary-sign-tool 仅 CI/release worker 具备，本地容器缺失；_sign_elf 探测缺失则跳过（容器不强制签名，未签名 ELF 仍可运行做 test），worker 上工具齐备则签名失败即报错"

artifacts:
  binaries:
    - unpaper
  library_versions:
    libavutil: "60.26.102"
    libavcodec: "62.28.102"
    libavformat: "62.12.102"
    libswresample: "6.3.102"

patch_classification:
  - file: 0001-ffmpeg-configure-harmonyos.patch
    type: portability
    platform_only: true
    guard: none
