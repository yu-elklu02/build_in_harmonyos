package: unrtf/0.21.10
homepage: "https://www.gnu.org/software/unrtf/"

test_package_tests:
  - file: test.sh
    description: "运行 unrtf --version 验证命令行工具可执行"
    command: "unrtf --version"
  - file: test.sh
    description: "使用 sample.rtf 执行 unrtf -P <conf_dir> --text 并校验输出包含 Hello HarmonyOS"
    command: "unrtf -P \"$UNRTF_CONF_DIR\" --text sample.rtf"

test_sources:
  - test.sh
  - sample.rtf

assertion_count: 2
