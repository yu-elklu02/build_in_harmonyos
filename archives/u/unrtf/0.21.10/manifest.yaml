version: "0.21.10"
software: "unrtf"
status: built
build_date: "2026-07-15"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/unrtf/unrtf-0.21.10.tar.gz"
  sha256: "b49f20211fa69fff97d42d6e782a62d7e2da670b064951f14bbff968c93734ae"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: "--datarootdir=${prefix}/share"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-autotools-config.patch"

knowledge_gained:
  - "GNU autotools 项目在 HarmonyOS 上需处理 config.guess/config.sub 对 HarmonyOS/linux-ohos 的识别。"
  - "configure 生成 config.status 时的 umask 077 会导致临时 awk 文件权限问题，需改为 umask 022。"
  - "HarmonyOS/HMDFS 环境下 make jobserver FIFO 可能失败，构建与安装使用 -j1。"
