software: unzip
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（G4 必需字段）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/infozip/UnZip%206.x%20%28latest%29/UnZip%206.0/unzip60.tar.gz"

  # 源码校验和
  sha256: "036d96991646d0449ed0aa952e4fbe21b476ce994abc276e49d30e686708bd37"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（unzip 无 configure 步骤，直接 make -f unix/Makefile generic）
  configure_options: []

  # 构建目标（makefile 系统）
  build_target: generic
  build_flags:
    - "CC=clang"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁，conandata.yml patches: []）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E002: /tmp 只读，需设置 TMPDIR 环境变量"
  - "HMDFS 不支持硬链接，make install 使用 cp 代替"
  - "linux 目标需要 Intel 汇编，使用 generic 目标避免"
