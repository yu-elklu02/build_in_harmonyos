# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: unzip/6.0
homepage: "https://infozip.sourceforge.net/UnZip.html"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testmake.zip
    source: unzip-6.0/testmake.zip
    description: "Info-ZIP self-test archive"
    command: "unzip -t testmake.zip"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Consumer test: create ZIP, extract with unzip, verify content"
    command: "conan test test_package unzip/6.0"

# 测试断言总数
assertion_count: 3
