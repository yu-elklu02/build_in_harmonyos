    notes: "依赖 console_bridge + tinyxml2 + urdfdom_headers 三者，全走 find_package CONFIG，三个 config 目录布局各不相同（tinyxml2 用 lib/cmake/<name>，另两个用 lib/<name>/cmake），逐个显式给 <Pkg>_DIR。"
    status: built
    build_date: "2026-07-29"
