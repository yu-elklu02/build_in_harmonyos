# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: unbound/1.22.0
homepage: "https://www.nlnetlabs.nl/projects/unbound/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本适配已在探索阶段跑完并 100% 通过，
# 见 reports/test-report.md：unittest 1270038 checks + testbound 33 checks
# + 428 个 .rpl 回放场景全过）
upstream_tests:
  - file: testcode/unittest.c
    source: unbound-1.22.0/testcode/unittest.c
    description: "单元测试（authzone/dname/签名验证/缓存/解析 等）"
    command: "./unittest"
  - file: testcode/testbound.c
    source: unbound-1.22.0/testcode/testbound.c
    description: "testbound 回放框架（428 个 testdata/*.rpl 场景）"
    command: "./testbound -s && for x in testdata/*.rpl; do ./testbound -p $x; done"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 libunbound API (ub_ctx_create/set_option/get_option/delete) + 运行 unbound-checkconf 二进制"
    command: "./test_unbound && unbound-checkconf -h"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1270038
