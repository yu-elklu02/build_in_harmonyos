  - "-flto 链接在 clang 上极慢，configure 加 --disable-flto"
  - "libevent/openssl 配方未声明 shared 选项 → run 特性缺失 → 下游 run env 缺 LD_LIBRARY_PATH；conanfile.py requires 需显式 run=True"

