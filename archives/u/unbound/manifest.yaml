# 软件级 manifest — unbound
# 文件位置: archives/u/unbound/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: unbound
display: "Unbound"
description: "NLnet Labs 开发的验证型递归缓存 DNS 解析器（libunbound 库 + unbound 命令行工具集）"
category: network
homepage: "https://www.nlnetlabs.nl/projects/unbound/about/"
license: BSD-3-Clause
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需补丁识别 HarmonyOS 三元组 (E007)"
    - "configure 临时目录 umask 077→022 规避 HMDFS setgid 权限 (E129)"
    - "OHOS 上由构建配方注入 _UAPI_LINUX_SOCKET_H，规避 linux/net_tstamp.h 与 SDK sockaddr_storage 重复定义 (E119/R8)"
    - "testcode 临时文件用 getenv(TMPDIR)，鸿蒙 /tmp 只读 (E002)"
    - "clang 上 -flto 链接极慢，需 --disable-flto"
  common_dependencies:
    - openssl
    - libevent
    - expat

# 版本索引（所有已归档版本，含状态）
versions:
  "1.22.0":
    status: built
    build_date: "2026-08-06"
    conan_ref: "unbound/1.22.0"
