package: uglifycss/0.0.29
homepage: "https://github.com/fmarcia/uglifycss"

upstream_check_command: "sh run_upstream_tests.sh"
upstream_test_in_build: true
upstream_test_command: "node tests-yui.js plus sh tests-url.sh, with failure propagation enforced by run_upstream_tests.sh"

upstream_tests:
  - name: yui-css-regressions
    source: "UglifyCSS-0.0.29/tests-yui/"
    description: "70 upstream YUI CSS minification snapshot cases."
    command: "node tests-yui.js"
    count: 70
  - name: url-conversion
    source: "UglifyCSS-0.0.29/tests-url.sh"
    description: "Three upstream URL conversion scenarios: absolute paths, relative paths, and current working directory."
    command: "sh tests-url.sh"
    count: 3

test_package_tests:
  - file: test.sh
    description: "Runs the installed command for version, stdin, file input, and --output behavior."
    command: "sh test.sh <uglifycss-path>"
    count: 4

assertion_count: 77
