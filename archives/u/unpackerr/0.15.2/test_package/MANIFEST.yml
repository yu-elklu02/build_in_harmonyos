# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: unpackerr/0.15.2
homepage: "https://github.com/Unpackerr/unpackerr"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test ./... (executed by recipe build() before go build; OHOS uses a go test -exec wrapper that self-signs each generated test binary)"

# 上游实际运行的测试程序 (Go 单元测试)
upstream_tests:
  - "go test ./... — 3 *_test.go files (folder_recursion_test.go: 4, folder_test.go: 5, start_test.go: 6), 15 func Test definitions in pkg/unpackerr; executed on OHOS arm64: 15 passed / 0 failed / 0 errors / 0 skipped"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: unpackerr --version 断言 unpackerr 0.15.2 + --help 帮助输出 + 最小 TOML 配置启动守护进程并断言 'Starting!' 日志行"
    command: "bash test.sh <bin/unpackerr>"

# 测试断言总数 (近似值, 用于质量评估)
test_package_assertion_count: 4
assertion_count: 19
