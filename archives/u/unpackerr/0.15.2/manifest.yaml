# 版本级 manifest — unpackerr 0.15.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.15.2"

software: "unpackerr"

# 编译状态: built (verify 通过未 upload)
status: built

build_date: "2026-08-12"

# 构建系统 (必填顶层字段)
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/Unpackerr/unpackerr/archive/refs/tags/v0.15.2.tar.gz"
  sha256: "a3279d1d66964f392940097dd904b6e66c5a0ef4f1370fc2ca87d0ac58a72573"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # Go 项目，custom 构建（go build 根包，输出 unpackerr 二进制）
  system: go

  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS)"
    - "GOARCH=arm64 (armv8)"
    - "GOPROXY=https://goproxy.cn,direct (上游无 vendor/)"
    - "go mod download → go test ./... → go build -trimpath -ldflags '-s -w -X golift.io/version.Version=0.15.2' -buildvcs=false -o unpackerr ."
    - "Go 工具链 go1.26.3 (linux-amd64/linux-arm64) 自 mirrors.aliyun.com 下载，SHA256 校验，置于模块树外"
    - "Go 缓存/临时目录/链接输出置于非 hmfs 工作区 (E051/E166)"
    - "产物与测试二进制经 binary-sign-tool 自签 (E077)"

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "unpackerr 是纯 Go 守护进程（MIT），任务页 C++ 标签不准确，无 C/C++ 目标库，属于路径 A 应用类适配 (ref: E134)"
  - "上游无 vendor/ 目录：必须 GOPROXY 拉取模块（goproxy.cn），build() 中先 go mod download (ref: E134)"
  - "Go 测试二进制在 OHOS 上需 binary-sign-tool 自签后才能执行（go test -exec wrapper）(ref: E166)"
  - "Go linker mmap 在 hmdfs 上受限（E051/E134），链接输出与缓存目录放 /data/storage/el2/... 非 hmfs 工作区 (ref: E051, E134, E166)"
  - "版本号注入：ldflags -X golift.io/version.Version=0.15.2，unpackerr --version 输出含 0.15.2 (ref: E077)"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  total: 15
  passed: 15
  failed: 0
  errors: 0
  skipped: 0
  timeout: 0
  note: "go test ./... on OHOS arm64: 15 tests run, 15 passed, 0 failed, 0 skipped (pkg/unpackerr: folder_recursion_test.go 4, folder_test.go 5, start_test.go 6)."
