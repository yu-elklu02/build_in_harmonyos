# 软件级 manifest — unpackerr
# 遵循 ARCHIVE-SPEC v2.0

software: unpackerr

display: "unpackerr"

description: "自动解压下载目录（支持 Radarr/Sonarr/Lidarr/Readarr），纯 Go 守护进程"

# 分类标签
category: system-utility

# 官网 URL
homepage: "https://github.com/Unpackerr/unpackerr"

# 开源许可证（SPDX 标识）
license: MIT

# 常用构建系统
build_system: go

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Go 应用（CGO_ENABLED=0），无 C/C++ 目标库；任务页 C++ 标签不准确"
    - "上游无 vendor/，需 GOPROXY(goproxy.cn) 拉取模块依赖"
    - "Go 工具链与产物均需 binary-sign-tool 自签（Seccomp 拦截未签名 ELF）"
    - "Go linker/测试二进制工作目录放在非 hmfs 工作区（/data/storage/el2/...）"
    - "版本号通过 ldflags -X golift.io/version.Version=<版本> 注入"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  0.15.2:
    status: built
    build_date: 2026-08-12
