software: uvwasi
display: "uvwasi"
description: "WASI syscall API implementation built atop libuv"
category: library
homepage: "https://github.com/nodejs/uvwasi"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "改用 Conan libuv config 替代上游 FindLIBUV.cmake + FetchContent"
    - "HarmonyOS 视同 Linux 设置 _GNU_SOURCE/_POSIX_C_SOURCE 特性宏"
    - "仅构建静态库，避免共享库代码签名"
  common_dependencies:
    - libuv

versions:
  "0.0.23":
    status: published
    build_date: "2026-07-14"
