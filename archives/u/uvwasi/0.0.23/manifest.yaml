software: uvwasi
version: "0.0.23"
status: published
build_date: "2026-07-14"
build_system: cmake

source:
  url: "https://github.com/nodejs/uvwasi/archive/refs/tags/v0.0.23.tar.gz"
  sha256: "cdb148aac298883b51da887657deca910c7c02f35435e24f125cef536fe8d5e1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: "-DBUILD_TESTING=OFF"
  dependencies:
    - libuv/1.52.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-find-libuv-conan.patch"
  - "0002-cmake-harmonyos-linux.patch"
  - "0003-cmake-static-only.patch"

knowledge_gained:
  - "上游 CMakeLists 用自带 FindLIBUV.cmake + FetchContent 回退，OHOS 离线构建需改用 Conan libuv config"
  - "HarmonyOS 不被识别为 Linux，需补丁让 _GNU_SOURCE/_POSIX_C_SOURCE 特性宏生效"
  - "仅构建静态库 uvwasi_a，规避 OHOS 共享库代码签名"
