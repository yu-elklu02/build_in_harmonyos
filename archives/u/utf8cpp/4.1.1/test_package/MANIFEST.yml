# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: utf8cpp/4.1.1
homepage: "https://github.com/nemtrif/utfcpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 已集成: UTF8CPP_ENABLE_TESTS=ON, build() 中调用 cmake.test() 运行 6 个 CTest 用例
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# 上游 tests/ 目录包含 6 个测试, 使用 CTest 框架, 在 build() 阶段执行
upstream_tests:
  - file: tests/test_cpp11.cpp
    source: utfcpp-4.1.1/tests/test_cpp11.cpp
    description: "C++11 单元测试 (UTF-8 编解码、迭代器、校验、替换等)"
    command: "ctest -R cpp11_test"
  - file: tests/test_cpp17.cpp
    source: utfcpp-4.1.1/tests/test_cpp17.cpp
    description: "C++17 单元测试 (UTF-8 编解码、迭代器、校验等)"
    command: "ctest -R cpp17_test"
  - file: tests/test_cpp20.cpp
    source: utfcpp-4.1.1/tests/test_cpp20.cpp
    description: "C++20 单元测试 (UTF-8 编解码、迭代器、校验等)"
    command: "ctest -R cpp20_test"
  - file: tests/apitests.cpp
    source: utfcpp-4.1.1/tests/apitests.cpp
    description: "API 接口测试"
    command: "ctest -R api_test"
  - file: tests/negative.cpp
    source: utfcpp-4.1.1/tests/negative.cpp
    description: "负向测试 (无效 UTF-8 序列处理)"
    command: "ctest -R negative_test"
  - file: tests/noexceptionstests.cpp
    source: utfcpp-4.1.1/tests/noexceptionstests.cpp
    description: "无异常模式测试 (-fno-exceptions)"
    command: "ctest -R noexceptions_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_utf8cpp.cpp
    description: "消费者测试: 验证 utf8cpp 库链接、UTF-8 编解码、长度计算、迭代器"
    command: "./test_utf8cpp"

# 测试断言总数 (近似值, 用于质量评估)
# test_package 消费者测试 7 个断言 (上游 6 个 CTest 用例由 build() 阶段运行, 未计入此值)
assertion_count: 7
