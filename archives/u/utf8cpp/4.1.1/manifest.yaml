software: utf8cpp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-14"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nemtrif/utfcpp/archive/refs/tags/v4.1.1.tar.gz"

  # 源码校验和
  sha256: "1ca68016f0abc24172998e39ce0d8f8e2b7a26f7579a0ff85d4e1b9a7aea56f8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | header-only
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DUTF8CPP_ENABLE_TESTS=ON"
    - "-DUTF8CPP_ENABLE_BENCHMARKS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 本次适配无补丁，header-only 库直接使用源码

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "utf8cpp 是 header-only 库（CMake INTERFACE library），无需编译二进制"
  - "无任何依赖，仅包含头文件"
  - "头文件安装路径：include/utf8cpp/utf8.h 和 include/utf8cpp/utf8/"
  - "CMake 命名空间：utf8cpp::utf8cpp"
