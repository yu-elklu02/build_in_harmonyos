# 软件级 manifest 模板
# 文件位置: archives/u/uuid/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: uuid

# 显示名
display: "UUID Library"

# 一句话描述
description: "Universally Unique Identifier library - extracted from util-linux"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://cdn.kernel.org/pub/linux/utils/util-linux/"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "使用 --disable-all-programs --enable-libuuid 只编译 uuid 组件"
    - "util-linux 包含大量工具，只需编译 libuuid 即可"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.40":
    status: built
    build_date: "2026-06-03"
  "2.40.1":
    status: built
    build_date: "2026-07-18"
