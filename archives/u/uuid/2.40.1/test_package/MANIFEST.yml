package: uuid/2.40.1
homepage: "https://www.kernel.org/pub/linux/utils/util-linux/"

upstream_check_command: "make test_uuid_parser && ./test_uuid_parser"
upstream_test_in_build: true
upstream_test_command: "./test_uuid_parser"
upstream_tests:
  - file: libuuid/src/test_uuid.c
    description: "Validate 14 explicit valid and invalid UUID parser cases."

test_package_tests:
