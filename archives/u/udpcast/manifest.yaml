category: network
homepage: "https://udpcast.linux.lu/"
license: "GPL-2.0-only AND BSD-2-Clause"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Patch config.guess and config.sub to recognize HarmonyOS"
