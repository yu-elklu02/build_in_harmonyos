software: uwsgi-logzmq
version: "2.0.31"
status: adapted
build_system: custom
build_date: "2026-08-14"
source:
  url: "https://github.com/unbit/uwsgi/archive/refs/tags/2.0.31.tar.gz"
  sha256: "d5fb7b058a6e037cad1f0fb8841de56d673d80a3af036bba830143b60c67c3dc"
  tar_format: tar.gz
build:
  system: custom
  configure_options:
    - "logzmq_conan profile: zeromq include/lib paths injected, plugins=logzmq"
  dependencies:
    - "zeromq/4.3.5"
  outputs:
    - "lib/uwsgi/logzmq_plugin.so"
tests:
  upstream:
    total: 0
    source: "No standalone logzmq upstream test entry is registered; uWSGI Makefile has global check/tests targets."
  test_package:
    total: 1
patches_applied: []
knowledge_gained:
  - "uWSGI plugin recipes can use uwsgiconfig.py --plugin with a generated minimal profile and package the produced <name>_plugin.so."
  - "logzmq links against libzmq through plugins/logzmq/uwsgiplugin.py LIBS = ['-lzmq']; the recipe injects zeromq package include/lib paths into the generated profile."
