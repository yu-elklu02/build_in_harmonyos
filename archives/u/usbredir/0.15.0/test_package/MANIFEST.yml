# test_package/MANIFEST.yml - upstream test declaration
package: usbredir/0.15.0
homepage: https://gitlab.freedesktop.org/spice/usbredir

# The default package build keeps upstream tests disabled. The default-off
# with_upstream_tests option enables the two native Meson checks below.
upstream_test_in_build: true
upstream_test_command: "meson test -v"
upstream_tests:
  - tests/filter.c
  - tests/serializer.c

test_package_tests:
  - file: test_usbredir.c
    description: "Run parser capability/packet write path and host open/close when a libusb usbfs backend is available"
    command: "./test_usbredir"

assertion_count: 16
