software: usbredir
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.15.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.15.0"

# 编译状态
# published | built | failed | archived
status: pending

# 编译日期（YYYY-MM-DD）

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://spice-space.org/download/usbredir/usbredir-0.15.0.tar.xz"

  # 源码校验和
  sha256: "6dc2a380277688a068191245dac2ab7063a552999d8ac3ad8e841c10ff050961"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libusb/1.0.27
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
