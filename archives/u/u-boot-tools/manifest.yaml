# 软件级 manifest — u-boot-tools

software: u-boot-tools
display: "U-Boot Tools"
description: "U-Boot 引导加载程序主机端工具集（mkimage、dumpimage、mkenvimage、fdtgrep 等）"
category: build-tool
homepage: "https://github.com/u-boot/u-boot"
license: "GPL-2.0+"
build_system: makefile

ohos_adaptation:
  key_points:
    - "先执行 sandbox_defconfig 生成配置，再执行 tools-only 目标编译主机端工具"
    - "必须使用 HOSTCC=clang 设置编译器"
    - "make 必须使用 -j1 禁用 jobserver（HMDFS 不支持 mkfifo）"
    - "R33: 从 Conan conf 获取 CC，不可用 shell 环境变量"
  common_dependencies: []
