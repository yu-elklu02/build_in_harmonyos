# 版本级 manifest — u-boot-tools 2026.07-r0

version: "2026.07-r0"
software: "u-boot-tools"
status: built
build_date: "2026-07-13"
build_system: makefile

source:
  url: "https://ftp.denx.de/pub/u-boot/u-boot-2026.07.tar.bz2"
  sha256: "78e8bfc382fe388f9b55aa1daf8c563522a037779b5d4c349d1415e381f1243e"
  tar_format: tar.bz2

build:
  system: makefile
  configure_options:
    - "sandbox_defconfig HOSTCC=clang -j1"
    - "tools-only HOSTCC=clang HOSTLDSHARED='clang -shared' -j1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "U-Boot tools-only target builds host-side tools without full bootloader"
  - "sandbox_defconfig generated before make tools-only HOSTCC=clang -j1"
  - "OHOS /tmp is read-only; use $TMPDIR for build directory"
  - "HMDFS doesn't support mkfifo; make needs -j1 to disable jobserver"
  - "Conan build() must get CC from self.conf (R33), never shell env"
