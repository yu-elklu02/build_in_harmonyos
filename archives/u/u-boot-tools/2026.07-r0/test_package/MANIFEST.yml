# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: u-boot-tools/2026.07-r0
homepage: "https://github.com/u-boot/u-boot"

# U-Boot tools-only 目标不包含独立测试套件
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 mkimage --version 验证二进制可执行"
    command: "conan test (mkimage --version)"
  - file: test.sh
    description: "消费者 smoke test: mkimage --version + --help"
    command: "bash test.sh"

assertion_count: 2
