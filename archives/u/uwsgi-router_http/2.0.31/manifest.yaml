software: uwsgi-router_http
version: "2.0.31"
status: adapted
build_system: custom
build_date: "2026-08-08"
source:
  url: "https://github.com/unbit/uwsgi/archive/refs/tags/2.0.31.tar.gz"
  sha256: "d5fb7b058a6e037cad1f0fb8841de56d673d80a3af036bba830143b60c67c3dc"
  tar_format: tar.gz
build:
  system: custom
  configure_options:
    - "router_http_conan profile: pcre=true, routing=true, plugins=router_http"
  dependencies:
    - "pcre2/10.45"
  outputs:
    - "lib/uwsgi/router_http_plugin.so"
tests:
  upstream:
    total: 0
    source: "No standalone router_http upstream test entry is registered; uWSGI Makefile has global check/tests targets."
  test_package:
    total: 1
patches_applied: []
knowledge_gained:
  - "uWSGI out-of-tree plugin recipes should verify the plugin entry symbol name, e.g. router_http_plugin, instead of a generic UwsgiInit symbol."
  - "router_http needs the uWSGI routing and PCRE features enabled in the build profile; the recipe generates a local profile with pcre=true, routing=true, and no source patches."
