# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scamp/2.15.0
homepage: "https://www.astromatic.net/software/scamp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\")"

# 上游实际运行的测试程序 (make check 输出 5 个测试)
upstream_tests:
  - file: tests/test_chealpix.c
    source: scamp-2.15.0/tests/test_chealpix.c
    description: "HEALPix 像素索引基础测试"
    command: "./test_chealpix"
  - file: tests/test_chealpixstore.c
    source: scamp-2.15.0/tests/test_chealpixstore.c
    description: "HEALPix 像素存储 (PixelStore) 测试"
    command: "./test_chealpixstore"
  - file: tests/test_crossid_single_catalog.c
    source: scamp-2.15.0/tests/test_crossid_single_catalog.c
    description: "单星表交叉识别测试"
    command: "./test_crossid_single_catalog"
  - file: tests/test_crossid_single_catalog_moving.c
    source: scamp-2.15.0/tests/test_crossid_single_catalog_moving.c
    description: "单星表 (含自行) 交叉识别测试"
    command: "./test_crossid_single_catalog_moving"
  - file: tests/test_integration01.py
    source: scamp-2.15.0/tests/test_integration01.py
    description: "端到端集成测试: 运行 scamp 处理 megacam 测试数据并校验 XML 输出"
    command: "./test_integration01.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 运行 scamp --version 验证二进制可执行"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
