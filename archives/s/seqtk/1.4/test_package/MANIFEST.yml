package: seqtk/1.4
homepage: "https://github.com/lh3/seqtk"

upstream_check_command: "make -n"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: README.md
    source: seqtk-1.4/README.md
    description: "Upstream documents the Makefile build and zlib dependency"
    command: "make -n"

test_package_tests:
  - file: test_seqtk.sh
    description: "Convert a FASTQ record to FASTA and report its sequence size"
    command: "sh test_seqtk.sh <seqtk-binary>"

assertion_count: 3
