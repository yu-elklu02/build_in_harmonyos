software: suitesparse
display: "SuiteSparse"
description: "稀疏矩阵算法套件（AMD/CAMD/CCOLAMD/COLAMD/CHOLMOD/UMFPACK）"
category: foundation
homepage: "https://people.engr.tamu.edu/davis/suitesparse.html"
license: "LGPL-2.1-or-later AND GPL-2.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "用 SUITESPARSE_ENABLE_PROJECTS 只建需要的子库，跳过 GraphBLAS/SPQR/KLU/ParU 等体量大且无消费方的"
    - "BLAS 接线：设环境变量 BLA_VENDOR=OpenBLAS（SuiteSparseBLAS.cmake:21 会直接采纳、不再逐个 vendor 试）+ 预设 BLAS_LIBRARIES/LAPACK_LIBRARIES 绕过交叉链的 FIND_ROOT_PATH_MODE=ONLY"
    - "SUITESPARSE_USE_OPENMP=OFF：设备工具链是 clang，找 GNU libgomp 会落空（PyPI 的 cvxopt wheel 正因开着 OpenMP 才 vendored 了 libgomp）"
    - "SUITESPARSE_USE_STRICT=ON 让上述 OFF 成为硬约束，避免 CMake 当作偏好而悄悄回退"

versions:
  "7.8.3":
    status: built
    build_date: "2026-07-29"
    packaging: conan
    notes: |
      conan 配方（os=OHOS arch=armv8），只建 cvxopt 所需的 7 个子库。
      真机原生 conan create 验证，test_package 5 条真实稀疏矩阵计算断言全绿
      （cholmod 解正定方程残差 ‖Ax-b‖=1.18e-16、umfpack LU 解精确、amd/colamd 排列有效性）
    dependencies:
      - openblas/0.3.34
    provides:
      - libsuitesparseconfig.so.7
      - libamd.so.3
      - libcamd.so.3
      - libccolamd.so.3
      - libcolamd.so.3
      - libcholmod.so.5
      - libumfpack.so.6
