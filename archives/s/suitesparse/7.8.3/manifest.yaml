software: suitesparse
version: "7.8.3"
status: built
build_date: "2026-07-29"
build_system: cmake

source:
  url: "https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v7.8.3.tar.gz"
  sha256: "ce39b28d4038a09c14f21e02c664401be73c0cb96a9198418d6a98a7db73a259"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang
  configure_options:
    - "-DSUITESPARSE_ENABLE_PROJECTS=suitesparse_config;amd;camd;ccolamd;colamd;cholmod;umfpack"
    - "-DSUITESPARSE_USE_OPENMP=OFF"
    - "-DSUITESPARSE_USE_FORTRAN=OFF"
    - "-DSUITESPARSE_USE_CUDA=OFF"
    - "-DSUITESPARSE_USE_64BIT_BLAS=OFF"
    - "-DSUITESPARSE_USE_STRICT=ON"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - openblas/0.3.34

patches_count: 0

knowledge_gained:
  - "SuiteSparse 7.x 用 SUITESPARSE_ENABLE_PROJECTS 选择子项目，可只建需要的那几个（本包建 7 个：suitesparse_config/amd/camd/ccolamd/colamd/cholmod/umfpack），跳过 GraphBLAS/SPQR/KLU/ParU 等体量大又无消费方的。"
  - "BLAS 接线走环境变量 BLA_VENDOR=OpenBLAS——SuiteSparseBLAS.cmake:21 若发现 ENV{BLA_VENDOR} 就直接采纳、不再逐个 vendor 试（Intel/ARM/OpenBLAS/FLAME…），解析确定化。再配合预设 BLAS_LIBRARIES/LAPACK_LIBRARIES 缓存变量绕过交叉链的 FIND_ROOT_PATH_MODE=ONLY（CMake 的 FindBLAS 每个 vendor 分支都由 if(NOT BLAS_LIBRARIES) 守着，预设即全部跳过搜索）。"
  - "SUITESPARSE_USE_OPENMP=OFF：设备工具链是 clang，SuiteSparse 找 GNU libgomp 会落空。PyPI 的 cvxopt wheel 正是因为开着 OpenMP 才 vendored 了 libgomp。"
  - "SUITESPARSE_USE_STRICT=ON 让上述各项 OFF 成为硬约束，避免 CMake 把它们当偏好而悄悄回退。"
