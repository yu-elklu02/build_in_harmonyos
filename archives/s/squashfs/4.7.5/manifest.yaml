software: squashfs
# 版本级 manifest 模板
# 文件位置: archives/s/squashfs/4.7.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.7.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-16"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/plougher/squashfs-tools/archive/refs/tags/4.7.5.tar.gz"

  # 源码校验和
  sha256: "547b7b7f4d2e44bf91b6fc554664850c69563701deab9fd9cd7e21f694c88ea6"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表
  configure_options:
    - "XZ_SUPPORT=0"
    - "LZO_SUPPORT=0"
    - "LZ4_SUPPORT=0"
    - "ZSTD_SUPPORT=0"

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-mksquashfs-pthread-cancel-stub.patch"
  - "0002-restore-pthread-cancel-stub.patch"
  - "0003-pthread-cancel-stub-header.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙 musl libc 不实现 pthread_cancel()，需要使用 stub 替代"
  - "squashfs-tools 使用 Makefile 构建系统，非 autotools"
  - "预编译包缺少开发文件导致无法启用额外压缩支持"
