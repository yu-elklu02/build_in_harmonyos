package: sipsak/0.9.7.1
homepage: "https://sipsak.org"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "compiled and executed during build using the bundled minimal Check-compatible shim (files/check.h, files/check_shim.c)"

excluded_upstream_tests: []

upstream_tests:
  - file: tests/check_helper.c
    source: sipsak-0.9.7/tests/check_helper.c
    description: "Upstream helper-function unit tests (5 test cases), compiled and executed via the bundled Check-compatible shim"
    command: "./check_helper"
  - file: tests/check_md5.c
    source: sipsak-0.9.7/tests/check_md5.c
    description: "Upstream MD5 implementation unit tests (2 test cases), compiled and executed via the bundled Check-compatible shim"
    command: "./check_md5"

test_package_tests:
  - file: test_sipsak.sh
    description: "Run the packaged sipsak --version command"
    command: "sh test_sipsak.sh <package_folder>"

assertion_count: 2