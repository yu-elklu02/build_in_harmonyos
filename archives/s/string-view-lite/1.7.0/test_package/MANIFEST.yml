# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: string-view-lite/1.7.0
homepage: "https://github.com/martinmoene/string-view-lite"

upstream_check_command: "ctest -N"

upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17)
# 每个可执行文件包含 84 个 lest 测试用例
upstream_tests:
  - file: test/string-view.t.cpp
    source: string-view-lite-1.7.0/test/string-view.t.cpp
    description: "string_view 核心单元测试 (84 个 lest 用例: 构造/访问/substr/compare/find 等)"
    command: "ctest -R test-cpp11"
  - file: test/string-view-main.t.cpp
    source: string-view-lite-1.7.0/test/string-view-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

test_package_tests:
  - file: test_string_view_lite.cpp
    description: "消费者测试: 验证 string-view-lite 库链接、string_view 构造/substr/compare/find/empty API"
    command: "./test_string_view_lite"

assertion_count: 7
