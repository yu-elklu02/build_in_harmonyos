software: safekeep
version: "1.5.1"
status: built
build_date: "2026-08-01"
source:
  url: "https://codeload.github.com/dimipaun/safekeep/tar.gz/refs/tags/1.5.1"
  sha256: "c5efcbbdb8e141d6aeac648c4833f935f5982c01f58cd26ff6b35fcc43c609fb"
  tar_format: "tar.gz"
  local_archive: "safekeep-1.5.1.tar.gz.b64"
  fetch_strategy: "Use the exported base64 text archive first in CI; keep the upstream URL as provenance and fallback."
build:
  system: "conan"
  type: "python-script"
  profile: "win-mingw"
  runtime_dependencies:
    - "python3"
    - "rdiff-backup"
    - "openssh"
validation:
  - "Windows MinGW Conan create with latest OHOS test patch passed: safekeep/1.5.1#d898cdcabe2463356b45068f5c3fdfad:522dcea5982a3f8a5b624c16477e47195da2f84f#89d4b759f39c023325e67721fd8e19df"
  - "OHOS CI #18961 reached test_package and showed HNP Python rejects rdiff_backup.C from copied app-cache paths with dlopen Permission denied; the OHOS test now uses rdiff-backup signed-artifact checks instead of counting safekeep-test local execution as passed."
knowledge_gained:
  - "safekeep 1.5.1 ships a single upstream integration test driver, safekeep-test, with local and remote backup flows."
  - "The OHOS test patch executes safekeep-test local mode under SAFEKEEP_TEST_OHOS_LOCAL=1 with a local client emulator, disabled nice/ionice adjustments, an OHOS-safe safekeep wrapper cwd, and rdiff-backup's explicit restore CLI."
  - "HNP Python can reject signed rdiff-backup CPython extensions from Conan/cache-like user paths with dlopen Permission denied; safekeep's OHOS test_package therefore verifies rdiff-backup console metadata and signed extension artifacts instead of executing the local integration flow from those paths."
  - "The upstream local and remote integration flows are identified but not counted as passed in CI; remote still requires SSH, root setup, package deployment, and mutable client/server hosts."
  - "The package-level Python test validates packaged CLI/docs/config/sample data and rdiff-backup dependency artifacts; marker checks remain separate from upstream pass counts."
  - "The packaged command needs a portable #!/usr/bin/env python3 shebang on OpenHarmony because python3 is provided from the user runtime prefix, not /usr/bin/python3."
  - "The verified safekeep-1.5.1 source archive is committed as base64 text in this version directory and exported by the recipe, so CI does not need to reach GitHub/codeload for source retrieval or apply binary PR diffs."
