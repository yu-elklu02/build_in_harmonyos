package: symengine/0.14.0
homepage: https://github.com/symengine/symengine
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.test()"
upstream_tests:
  - file: CMakeLists.txt
    source: symengine-0.14.0.tar.gz/CMakeLists.txt
    description: "Run the 50 CTest entries enabled by BUILD_TESTS with the GMP integer backend"
    command: "ctest --output-on-failure"
    total_count: 50
test_package_tests:
  - file: test_package.cpp
    description: "Construct and stringify a symbolic addition expression"
    command: "./test_package"
assertion_count: 1
