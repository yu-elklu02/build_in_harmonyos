# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: secureboot-hook/0.2
homepage: "https://github.com/spflaumer/secureboot-hook-void"

# Upstream has no test suite (no make check target)
upstream_check_command: ""

# No upstream tests exist for this shell-only package
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (script-only package with no test suite)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify hook script and config file exist, are executable, and have correct content"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 5
