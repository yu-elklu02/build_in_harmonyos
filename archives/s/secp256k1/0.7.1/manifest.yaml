software: secp256k1
version: "0.7.1"
status: built
build_date: "2026-07-15"
conan_ref: "secp256k1/0.7.1"

source:
  url: "https://github.com/bitcoin-core/secp256k1/archive/refs/tags/v0.7.1.tar.gz"
  sha256: "958f204dbafc117e73a2604285dc2eb2a5128344d3499c114dcba5de54cb7a9e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "SECP256K1_ENABLE_MODULE_ECDH=ON"
    - "SECP256K1_ENABLE_MODULE_SCHNORRSIG=ON"
    - "SECP256K1_ENABLE_MODULE_EXTRAKEYS=ON"
    - "SECP256K1_BUILD_TESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub tag 源码归档不含预生成 configure，CI 又缺少 aclocal，因此改用上游正式支持的 CMake 构建系统"
  - "使用 BUILD_SHARED_LIBS=OFF 强制静态编译"
  - "启用 ECDH、Schnorr 签名和扩展密钥模块"
