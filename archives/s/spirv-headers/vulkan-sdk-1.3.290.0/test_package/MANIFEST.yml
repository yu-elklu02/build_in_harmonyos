package: spirv-headers/vulkan-sdk-1.3.290.0
homepage: https://github.com/KhronosGroup/SPIRV-Headers
upstream_check_command: "build upstream add_subdirectory, find_package, and pkg-config projects"
upstream_test_in_build: true
upstream_test_command: "cmake --build upstream-add-subdirectory && cmake --build upstream-find-package && cmake --build upstream-pkg-config && cmake --build upstream-pkg-config-absolute"
upstream_tests:
  - file: tests/example.cpp
    source: SPIRV-Headers-vulkan-sdk-1.3.290.0.tar.gz/tests/example.cpp
    description: "Build the upstream add_subdirectory integration target"
    command: "cmake --build upstream-add-subdirectory"
  - file: tests/find_package/CMakeLists.txt
    source: SPIRV-Headers-vulkan-sdk-1.3.290.0.tar.gz/tests/find_package/CMakeLists.txt
    description: "Build the upstream installed CMake package consumer"
    command: "cmake --build upstream-find-package"
  - file: tests/pkg_config/CMakeLists.txt
    source: SPIRV-Headers-vulkan-sdk-1.3.290.0.tar.gz/tests/pkg_config/CMakeLists.txt
    description: "Build the upstream pkg-config consumer with normal and absolute include installation paths"
    command: "cmake --build upstream-pkg-config && cmake --build upstream-pkg-config-absolute"
test_package_tests:
  - file: test_package.c
    description: "Compile and validate SPIR-V magic, version, and opcode constants"
    command: "./spirv_headers_c_test"
  - file: test_package.cpp
    description: "Compile and validate the C++ enum API against the C API"
    command: "./spirv_headers_cpp_test"
assertion_count: 7
