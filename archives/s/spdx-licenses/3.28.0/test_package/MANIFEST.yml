# test_package/MANIFEST.yml
# SPDX License List Data v3.28.0 — data/rule-list type package
# Upstream has no traditional test suite (APKBUILD: !check / no test suite).
# Verification is done via test_package smoke tests.

package: spdx-licenses/3.28.0
homepage: "https://spdx.org/licenses/"

# Upstream check: no traditional test suite
upstream_check_command: "N/A (data/rule-list package, no test suite)"
upstream_test_in_build: false
upstream_test_command: "N/A"

# Upstream tests: none
upstream_tests: []

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: test_package/conanfile.py
    description: |
      Smoke test: verify licenseListVersion=3.28.0, total licenses=727,
      deprecated licenses=32, total exceptions=84, deprecated exceptions=1,
      MIT/Apache-2.0/BSD-3-Clause/GPL-2.0-only found, NOT-A-REAL-SPDX-ID rejected.
    command: "conan create . (invokes test_package automatically)"

# Assertion count: 12 assertions in test_package
assertion_count: 12
