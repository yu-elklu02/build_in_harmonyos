software: sqlite
display: "SQLite"
description: "Self-contained, high-reliability, embedded, full-featured, public-domain, SQL database engine"
category: db
homepage: "https://www.sqlite.org/"
license: Public-Domain
build_system: manual

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "autosetup configure fails on HMDFS (jimsh0 exec limit), use manual clang compilation"
    - "需要修改 autosetup/autosetup-config.guess 和 autosetup-config.sub 支持 HarmonyOS/OHOS"
    - "Manual build: clang -c sqlite3.c + shell.c, llvm-ar for static lib"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "3.46.0":
    status: built
    build_date: "2026-05-28"
    published_as: sqlite3
  "3.53.3":
    status: built
    build_date: "2026-07-15"
