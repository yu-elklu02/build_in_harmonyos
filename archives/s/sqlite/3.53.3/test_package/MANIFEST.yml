# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sqlite/3.53.3
homepage: "https://www.sqlite.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# SQLite autoconf amalgamation does not include a test suite in the tarball.
# Testing is done via TH3 (proprietary) and the TCL test suite (separate download).
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Open in-memory DB, create table, insert, select via sqlite3 API"
    command: "./test_sqlite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
