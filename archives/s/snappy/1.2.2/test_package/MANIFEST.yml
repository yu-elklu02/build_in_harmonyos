# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: snappy/1.2.2
homepage: "https://github.com/google/snappy"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中未集成上游测试 (SNAPPY_BUILD_TESTS=OFF)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: snappy_unittest.cc
    source: snappy-1.2.2/snappy_unittest.cc
    description: "Snappy unit tests (compress/decompress round-trip)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_snappy.cpp
    description: "消费者冒烟测试: 使用 snappy C API 压缩/解压字符串并验证往返一致性"
    command: "./test_snappy"

# 上游测试用例总数 (SNAPPY_BUILD_TESTS=OFF 时实际编译运行的 ctest 数)
assertion_count: 1
