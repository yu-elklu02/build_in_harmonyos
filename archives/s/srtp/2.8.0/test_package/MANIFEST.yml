package: srtp/2.8.0
homepage: "https://github.com/cisco/libsrtp"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.test()"

upstream_tests:
  - file: "crypto/test/aes_calc.c"
    source: "libsrtp-2.8.0/crypto/test/aes_calc.c"
    description: "AES-128 known-answer test"
    command: "ctest -R aes_calc_128"
  - file: "crypto/test/aes_calc.c"
    source: "libsrtp-2.8.0/crypto/test/aes_calc.c"
    description: "AES-256 known-answer test"
    command: "ctest -R aes_calc_256"
  - file: "crypto/test/sha1_driver.c"
    source: "libsrtp-2.8.0/crypto/test/sha1_driver.c"
    description: "SHA-1 driver test"
    command: "ctest -R sha1_driver"
  - file: "crypto/test/datatypes_driver.c"
    source: "libsrtp-2.8.0/crypto/test/datatypes_driver.c"
    description: "Crypto datatype test"
    command: "ctest -R datatypes_driver"
  - file: "crypto/test/cipher_driver.c"
    source: "libsrtp-2.8.0/crypto/test/cipher_driver.c"
    description: "Cipher implementation test"
    command: "ctest -R cipher_driver"
  - file: "crypto/test/kernel_driver.c"
    source: "libsrtp-2.8.0/crypto/test/kernel_driver.c"
    description: "Crypto kernel test"
    command: "ctest -R kernel_driver"
  - file: "test/rdbx_driver.c"
    source: "libsrtp-2.8.0/test/rdbx_driver.c"
    description: "Extended replay database test"
    command: "ctest -R rdbx_driver"
  - file: "test/replay_driver.c"
    source: "libsrtp-2.8.0/test/replay_driver.c"
    description: "Replay protection test"
    command: "ctest -R replay_driver"
  - file: "test/roc_driver.c"
    source: "libsrtp-2.8.0/test/roc_driver.c"
    description: "Rollover counter test"
    command: "ctest -R roc_driver"
  - file: "test/srtp_driver.c"
    source: "libsrtp-2.8.0/test/srtp_driver.c"
    description: "In-memory SRTP driver test"
    command: "ctest -R srtp_driver"
  - file: "test/test_srtp.c"
    source: "libsrtp-2.8.0/test/test_srtp.c"
    description: "SRTP packet protection test"
    command: "ctest -R test_srtp"
  - file: "test/rtpw_test.sh"
    source: "libsrtp-2.8.0/test/rtpw_test.sh"
    description: "Sender and receiver integration test"
    command: "ctest -R rtpw_test"

test_package_tests:
  - file: "test_srtp.c"
    description: "Create and destroy an SRTP session with default policies"
    command: "./test_srtp"

assertion_count: 13
