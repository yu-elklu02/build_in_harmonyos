package: spirv-cross/1.4.341.0
homepage: https://github.com/KhronosGroup/SPIRV-Cross
upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"
upstream_tests:
  - file: tests-other/c_api_test.c
    description: "Validate the public C API and ABI version"
    command: "spirv-cross-c-api-test"
  - file: tests-other/small_vector.cpp
    description: "Validate the upstream small-vector implementation"
    command: "spirv-cross-small-vector-test"
  - file: tests-other/msl_constexpr_test.cpp
    description: "Validate MSL constexpr translation"
    command: "spirv-cross-msl-constexpr-test"
  - file: tests-other/msl_resource_bindings.cpp
    description: "Validate MSL resource bindings"
    command: "spirv-cross-msl-resource-binding-test"
  - file: tests-other/hlsl_resource_bindings.cpp
    description: "Validate HLSL resource bindings"
    command: "spirv-cross-hlsl-resource-binding-test"
  - file: tests-other/msl_ycbcr_conversion_test.cpp
    description: "Validate the first MSL YCbCr conversion module"
    command: "spirv-cross-msl-ycbcr-conversion-test"
  - file: tests-other/msl_ycbcr_conversion_test.cpp
    description: "Validate the second MSL YCbCr conversion module"
    command: "spirv-cross-msl-ycbcr-conversion-test-2"
  - file: tests-other/typed_id_test.cpp
    description: "Validate typed ID behavior"
    command: "spirv-cross-typed-id-test"
  - file: tests-other/debug-lines.cpp
    description: "Validate debug line handling"
    command: "spirv-cross-debug-lines-test"
  - file: tests-other/debug-info.cpp
    description: "Validate debug information handling"
    command: "spirv-cross-debug-info-test"
test_package_tests:
  - file: test_package.cpp
    description: "Parse a minimal compute module and generate GLSL through the C API"
    command: "./test_package"
  - file: test_package.cpp
    description: "Convert the generated module through the installed spirv-cross CLI"
    command: "spirv-cross minimal.spv --output minimal.glsl"
assertion_count: 7
