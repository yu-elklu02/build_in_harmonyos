software: spirv-cross
display: "SPIRV-Cross"
description: "KhronosGroup 的 SPIR-V 着色器交叉编译器，支持 GLSL、HLSL、MSL、C++ 等后端输出"
category: graphics
homepage: "https://github.com/KhronosGroup/SPIRV-Cross"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "核心库无需平台源码修改；测试补丁保留无需外部工具的原生测试目标"
    - "CMake 显示 'System is unknown' 警告，不影响编译结果"
    - "所有产物为静态库(.a)和CLI工具，无动态库(.so)"
    - "完整官方测试套件需要 glslang/SPIRV-Tools；当前构建执行无外部工具的原生测试和制品消费测试"
    - "版本号双体系：vulkan-sdk tag(1.4.341.0) 和 pkg-config(0.68.0)"
    - "静态库链接顺序：c → core + glsl + util"
    - "平台 lld 缺 libxml2，手动链接 C API 静态库受限（不影响 CMake 构建）"
  common_dependencies: []

versions:
  "1.4.341.0":
    status: built
    build_date: "2026-07-16"
    configure_options:
      - "SPIRV_CROSS_STATIC=ON"
      - "SPIRV_CROSS_CLI=ON"
      - "SPIRV_CROSS_ENABLE_TESTS=ON"
    patches:
      - "0001-keep-native-tests-without-external-tools.patch"
    build_cleanliness: patched
