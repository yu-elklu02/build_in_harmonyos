# conandata.yml — synfig 1.5.5
#
# 主源：官方 v1.5.5 tag 归档（GitHub "Source code (tar.gz)"）。此 tarball 是完整仓库，
# 内含 ETL/ + synfig-core/ + synfig-studio/ 与顶层 CMakeLists.txt，ETL 随主工程一起构建，
# 无需单独适配 ETL（见 ADAPTATION.md「ETL 结构结论」）。
#
# 兜底源 etl：若因下载策略改用 release 分离的 synfig-1.5.5.tar.gz（可能不含 ETL），
# conanfile.source() 会把 ETL-1.5.5.tar.gz 覆盖到 <src>/ETL。
# 注意：release 资产实际文件名/URL 需在真机核对（大小写 etl/ETL、是否有 -src 后缀）。
#
# ⚠️ sha256 为占位符，真机下载后必须填写（ADAPTATION.md §命令序列 Step 3）。
#    生成命令：sha256sum synfig-1.5.5.tar.gz / ETL-1.5.5.tar.gz

sources:
  synfig:
    url: "https://github.com/synfig/synfig/archive/refs/tags/v1.5.5.tar.gz"
    # 真机复核（2026-08-02 全量下载，gzip -t OK）：bcf859... 为正确值。
    # 2026-08-02 改为直连 github（302→codeload，证书校验通过）；ghfast.top 证书
    # hostname mismatch 导致 conan 严格校验下载失败（curl -k 可用但 conan 不行）。
    # R39：单一官方 URL（github tag 归档），不硬编码代理镜像列表（CI 统一管理镜像 fallback）。
    sha256: "bcf859b09bf6eeef5bce7246c00c09fbbe8cf43d9a79b408d83af09334499d4b"
  etl:
    url: "https://github.com/synfig/synfig/releases/download/v1.5.5/ETL-1.5.5.tar.gz"
    # 兜底源：仅当 v1.5.5 tag 归档内不含 ETL/ 时触发（conanfile.source() 检测）。
    # 真机实测（2026-08-02，sha256sum ETL-1.5.5.tar.gz）：主源 v1.5.5 tag 归档已含 ETL/，
    # 本次构建该兜底不触发；此 sha256 为 release 独立 ETL tarball 的真实值，非占位符。
    # R39：单一官方 URL（github releases），不硬编码代理镜像列表（CI 统一管理镜像 fallback）。
    sha256: "570c898f1c976fac3026866d718ea3f48f8bce1b232ed8cbedc65921c4e3cc25"

patches:
  - patch_file: "patches/0001-gate-synfig-studio.patch"
    patch_description: "Gate synfig-studio behind WITH_STUDIO option (default OFF) so the CLI-only build skips the gtkmm-3.0 GUI without patching upstream behavior"
    patch_type: "portability"
  - patch_file: "patches/0002-gate-optional-modules.patch"
    patch_description: "Gate mod_openexr behind the existence of the PkgConfig::OPENEXR target (it links OpenEXR headers/libs and the target would otherwise not exist), so the build does not fail when OpenEXR is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0003-ltdl-shim.patch"
    patch_description: "Add synfig-core/src/ltdl.h shim mapping the lt_dl* libltdl API used by module.cpp onto dlfcn (dlopen/dlsym/dlerror) — OHOS has no libltdl"
    patch_type: "portability"
  - patch_file: "patches/0004-ltdl-no-link.patch"
    patch_description: "Do not link -lltdl on HarmonyOS: the lt_dl* symbols come from the ltdl.h shim + dlfcn in libc, so LTDL_LIBRARIES must be empty"
    patch_type: "portability"
  - patch_file: "patches/0005-fribidi-include.patch"
    patch_description: "lyr_freetype includes <fribidi.h> but the conan fribidi package installs headers under include/fribidi/ (its generated fribidi.pc exports only the flat -I${includedir}); use the canonical <fribidi/fribidi.h> path like other consumers"
    patch_type: "portability"
  - patch_file: "patches/0006-version-macro.patch"
    patch_description: "Define VERSION/PACKAGE for the synfig_bin target: the autotools build gets them from config.h but the CMake build never defines them, so tool/definitions.h falls back to VERSION \"unknown\" and `synfig --version` prints 'synfig-tool unknown'"
    patch_type: "portability"
