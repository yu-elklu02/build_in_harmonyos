software: synfig
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.5.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.5"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-02"

# Conan 引用
conan_ref: "synfig/1.5.5@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致）
  url: "https://github.com/synfig/synfig/archive/refs/tags/v1.5.5.tar.gz"
  # 源码校验和
  sha256: "bcf859b09bf6eeef5bce7246c00c09fbbe8cf43d9a79b408d83af09334499d4b"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  # 关键 CMake 选项（CLI-only：关 studio 与可选依赖后端）
  configure_options:
    - "-DWITH_STUDIO=OFF"
    - "-DWITH_OPENEXR=OFF"
    - "-DWITH_MAGICKPP=OFF"
    - "-DWITH_FFMPEG=OFF"
    - "-DWITH_JACK=OFF"
    - "-DWITH_SDL=OFF"
    - "-DWITH_DLOPEN=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
  cc: clang
  cxx: clang++
  # Conan 依赖（ohpcd 制品仓，无 user/channel 与 conanfile requirements() 一致）
  dependencies:
    - "glibmm/2.66.9 (glibmm-2.4.pc，synfig-core 探测所需 2.4 ABI 线)"
    - "libxmlpp/2.42.3 (libxml++-2.6.pc，synfig-core 探测所需)"
    - "libsigc/2.10.8"
    - "cairo/1.18.4"
    - "freetype/2.14.3"
    - "fontconfig/2.18.1.1 (force=True，覆盖 cairo 传递的旧 pin)"
    - "fftw/3.3.10.1"
    - "zlib/1.3.1.1"
    - "libpng/1.6.58"
    - "libjpeg-turbo/3.2.0"
    - "harfbuzz/14.2.0"
    - "fribidi/1.0.16"
    # 系统依赖已移除（无 cmd-pkgs 系统包）：
    #   - libxml2 由 libxmlpp 的 conan 依赖链提供（libxmlpp requires libxml2/2.15.3，
    #     PkgConfigDeps 生成 libxml-2.0.pc）
    #   - pango 仅 synfig-studio（GUI，WITH_STUDIO=OFF 已关闭）使用，CLI-only 构建不依赖

# ============================================================
# 补丁清单
# ============================================================

patches_applied:
  - "patches/0001-gate-synfig-studio.patch (WITH_STUDIO 选项门控，CLI-only 跳过 gtkmm-3.0 GUI)"
  - "patches/0002-gate-optional-modules.patch (mod_openexr 以 PkgConfig::OPENEXR 目标存在性门控)"
  - "patches/0003-ltdl-shim.patch (ltdl.h shim：lt_dl* API 映射到 dlfcn，OHOS 无 libltdl)"
  - "patches/0004-ltdl-no-link.patch (OHOS 不链接 -lltdl，符号来自 shim+libc dlfcn)"
  - "patches/0005-fribidi-include.patch (<fribidi.h> → <fribidi/fribidi.h>，conan 包头文件在 include/fribidi/)"
  - "patches/0006-version-macro.patch (synfig_bin 定义 VERSION/PACKAGE，CMake 构建缺失致 --version 打印 unknown)"

# ============================================================
# 知识经验
# ============================================================

knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS 平台，配方以 ohos.toolchain.cmake 自发现处理"
  - "E130: OHOS libc++ 头文件要求 C++17，强制 CMAKE_CXX_STANDARD=17"
  - "E103/E187: cmake 4.x 向后兼容需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "E076: libxmlpp 静态链 libxml2.a 方案"
  - "上游设计：synfig-tool --version/--help 打印后抛 SYNFIGTOOL_HELP（退出码 3），test_package 需接受该退出码"

# ============================================================
# 产物
# ============================================================

artifacts:
  - "bin/synfig — 命令行渲染器（synfig-core，ELF aarch64，已 binary-sign-tool 自签）"
  - "lib/libsynfig.a — 核心动画库（静态）"
  - "lib/synfig/modules/*.so — 渲染模块（dlopen 加载，已签名）"
