# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制存在）。
# synfig 1.5.5 上游用 CMake：-DENABLE_TESTS=ON 时 synfig-core/test 注册 15 个
# add_test（test_synfig_*），build() 执行 ctest；CLI 冒烟验证放 test_package_tests。

package: synfig/1.5.5
homepage: "https://www.synfig.org/"

# 上游测试命令（ctest：由 conanfile build() 的 -DENABLE_TESTS=ON + ctest 执行）
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure"

# 上游实际运行的测试程序（synfig-core/test/CMakeLists.txt 注册的 add_test）
upstream_tests:
  - file: synfig-core/test/angle.cpp
    description: "test_synfig_angle — Angle basic ops"
    command: "ctest --test-dir build-ohos -R test_synfig_angle"
  - file: synfig-core/test/bline.cpp
    description: "test_synfig_bline — BLine basic ops"
    command: "ctest --test-dir build-ohos -R test_synfig_bline"
  - file: synfig-core/test/valuenode_maprange.cpp
    description: "test_synfig_valuenode_maprange — ValueNode_MapRange"
    command: "ctest --test-dir build-ohos -R test_synfig_valuenode_maprange"

# test_package 中自带的测试（消费者视角验证 CLI）
test_package_tests:
  - file: test.sh
    description: "smoke test: synfig --version / --help"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 3
