# test_package/MANIFEST.yml
# Upstream and consumer-test declarations for CI quality gates.

package: shntool/3.0.10
homepage: "http://shnutils.freeshell.org/shntool/"

# Upstream 3.0.10 provides no automated check/test target.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_shntool.sh
    description: "Validate shntool version output, modes, formats, and shnlen alias no-input/help behavior with stdin closed and bounded command timeouts."
    command: "./test_shntool.sh <shntool-bin>"

assertion_count: 8
