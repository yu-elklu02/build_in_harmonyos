package: softfloat/3e
homepage: "https://www.jhauser.us/arithmetic/SoftFloat.html"
upstream_check_command: "TestFloat-3e testsoftfloat -seed 1 -level 1 -errorstop -all1 && testsoftfloat -seed 1 -level 1 -errorstop -all2"
upstream_test_in_build: true
upstream_test_command: "testsoftfloat -seed 1 -level 1 -errorstop -all1; testsoftfloat -seed 1 -level 1 -errorstop -all2"
upstream_tests:
  - file: testsoftfloat
    source: "TestFloat-3e/source/testsoftfloat.c"
    description: "Official Berkeley TestFloat 3e differential test suite against its independent SlowFloat reference implementation"
    command: "./testsoftfloat -seed 1 -level 1 -errorstop -all1 && ./testsoftfloat -seed 1 -level 1 -errorstop -all2"
test_package_tests:
  - file: test.c
    description: "Consumer compilation and f32_add API test"
    command: "./test_softfloat"
assertion_count: 2
