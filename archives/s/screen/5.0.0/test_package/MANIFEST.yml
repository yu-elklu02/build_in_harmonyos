# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: screen/5.0.0
homepage: "https://www.gnu.org/software/screen/"

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "make check"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: tests/test-winmsgbuf
    source: screen-5.0.0/tests/test-winmsgbuf
    description: "Window message buffer formatting test"
    command: "./tests/test-winmsgbuf"
  - file: tests/test-winmsgcond
    source: screen-5.0.0/tests/test-winmsgcond
    description: "Window message condition evaluation test"
    command: "./tests/test-winmsgcond"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run screen --version and screen --help to verify binary functionality"
    command: "screen --version && screen --help"

# Test assertion count (approximate, for quality assessment)
assertion_count: 2
