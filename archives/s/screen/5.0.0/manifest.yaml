  sha256: "f04a39d00a0e5c7c86a55338808903082ad5df4d73df1a2fd3425976aed94971"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-pam"
  dependencies:
    - "ncurses 6.4 (system, via cmd-pkgs)"
    - "coreutils 9.10 (system, via cmd-pkgs, for GNU expr)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"
  - "0002-misc.c.patch"
  - "0003-socket.c.patch"
  - "0004-tests-macros.h.patch"
  - "0005-tests-mallocmock.c.patch"
  - "0006-tests-test-winmsgbuf.c.patch"
  - "0007-tests-test-winmsgcond.c.patch"

knowledge_gained:
  - "HMDFS: configure 脚本中 umask 077 创建的临时目录不可写，需改为 umask 022"
  - "OHOS poll() 在轮询大量 fd 时返回 ENOMEM，closeallfiles() 需改用直接 close() 循环"
  - "OHOS 不支持 seteuid/setegid，seteuid 调用应做失败容错处理（非 Panic）"
  - "OHOS 无 PAM 支持，需 --disable-pam"
  - "OHOS 无 __libc_malloc 符号，glibc malloc mock 需用 #ifdef __GLIBC__ 守卫（非平台宏）"
  - "OHOS 无传统 Unix passwd 条目，getpwuid() 失败影响会话管理 (非编译问题)"
  - "cmd-pkgs ncurses 只发库不发头文件，需从源码或 abook 归档提取头文件"
  - "screen 是命令行工具 (非库)，conanfile.py 已设 package_type=application, bindirs=[bin], 并创建 commands.json (R38)"

