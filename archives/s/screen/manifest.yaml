software: screen
display: "GNU Screen"
description: "Terminal multiplexer for managing multiple terminal sessions"
category: system
homepage: "https://www.gnu.org/software/screen/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure umask 077→022 适配 HMDFS 文件系统权限"
    - "misc.c closeallfiles(): OHOS poll() 返回 ENOMEM，改用直接 close() 循环"
    - "socket.c: seteuid/setegid 失败容错处理（非 Panic）"
    - "测试框架: glibc malloc mock 依赖 __libc_malloc (OHOS 无此符号)，需 #ifdef __GLIBC__ 守卫（非平台宏）"
    - "ncurses 通过 cmd-pkgs 系统安装，非 Conan 依赖"
    - "需要 --disable-pam (OHOS 无 PAM)"
  common_dependencies:
    - ncurses

versions:
  "5.0.0":
    status: published
    build_date: "2026-08-04"
    compile_date: "2026-08-04"
    patches_count: 7
    conan_verify: "PASS"
    ci_result: "PASS (L0-L5, L4=warn)"
    dependencies:
      - "ncurses 6.4 (cmd-pkgs)"
      - "coreutils 9.10 (cmd-pkgs)"
    artifacts:
      - "bin/screen (terminal multiplexer)"
