# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: s6/2.15.1.0
homepage: "https://skarnet.org/software/s6/"

# 上游测试命令 (skarnet 构建系统使用 make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (skarnet 系统的测试在 src/ 下)
upstream_tests:
  - file: src/supervision/s6-supervise.c
    source: s6-2.15.1.0/src/supervision/s6-supervise.c
    description: "服务监控器核心 (已修改: FIFO→socket)"
    command: "s6-supervise"
  - file: src/supervision/s6-svscan.c
    source: s6-2.15.1.0/src/supervision/s6-svscan.c
    description: "扫描器核心 (已修改: FIFO→socket)"
    command: "s6-svscan"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "s6 二进制 smoke test (s6-svc --help, s6-svscan usage)"
    command: "bash test.sh"

# 测试断言总数 (近似值)
assertion_count: 3
