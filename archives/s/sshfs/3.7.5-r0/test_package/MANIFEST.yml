# test_package/MANIFEST.yml — sshfs 3.7.5-r0

package: sshfs/3.7.5-r0
homepage: "https://github.com/libfuse/sshfs"

# 上游测试命令
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: test/test_sshfs.py
    source: sshfs-3.7.5/test/test_sshfs.py
    description: "sshfs integration tests"
    command: "meson test -C builddir"

# test_package 消费者验证测试
test_package_tests:
  - file: test.c
    description: "尝试执行 sshfs --version；若沙箱禁止 exec 则回退 ELF 头校验"
    command: "./test_sshfs"

assertion_count: 1
