# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scdoc/1.11.0
homepage: "https://git.sr.ht/~sircmpwn/scdoc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/inline
    source: scdoc-1.11.0/test/inline
    description: "scdoc inline formatting test"
    command: "./test/inline"
  - file: test/headers
    source: scdoc-1.11.0/test/headers
    description: "scdoc headers test"
    command: "./test/headers"
  - file: test/lists
    source: scdoc-1.11.0/test/lists
    description: "scdoc lists test"
    command: "./test/lists"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 scdoc 二进制，验证生成的 man page 输出包含预期内容"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
