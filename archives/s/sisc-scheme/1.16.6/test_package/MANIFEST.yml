package: sisc-scheme/1.16.6
homepage: "https://sisc-scheme.org/"

# The upstream release archive does not contain a recognizable test suite.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Package-level consumer smoke tests. These are not upstream tests.
test_package_tests:
  - file: test.sh
    description: "Run sisc --version and evaluate a small Scheme expression when java is available"
    command: "sisc --version && sisc -e \"(+ 1 2)\" -x"

assertion_count: 2
