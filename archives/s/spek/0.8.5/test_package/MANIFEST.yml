# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: spek/0.8.5
homepage: "https://www.spek.cc/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 spek 是 GUI 应用 (wxWidgets), 无自带测试套件, make check 目标不存在.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 上游无自动化测试用例 (GUI 应用, 无 tests/ 目录, 无 check_PROGRAMS).
# 上游测试用例核实方式: 解压 spek-0.8.5.tar.xz 确认无 tests/ 目录,
# Makefile.am 无 check target, configure 输出无测试套件注册.

# test_package 中自带的测试 (消费者视角验证)
# test.sh �验产物结构 + spek-cli --help smoke (HMDFS noexec 绕过, CI worker 上能 exec).
test_package_tests:
  - file: test.sh
    description: "spek-cli product structure + --help smoke test (4 assertions)"
    command: "bash test.sh <package_folder>"
  - file: conanfile.py
    description: "Driver that delegates to test.sh via self.run()"
    command: "self.run('bash test.sh <package_folder>')"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个: bin/spek-cli exists/executable, --help usage (HMDFS noexec skipped on dev), --info option
assertion_count: 4
