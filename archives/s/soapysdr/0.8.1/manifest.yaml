version: "0.8.1"
status: built
build_date: "2026-07-17"

source:
  url: "https://github.com/pothosware/SoapySDR/archive/refs/tags/soapy-sdr-0.8.1.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_PYTHON=OFF"
    - "-DENABLE_PYTHON3=OFF"
    - "-DENABLE_DOCS=OFF"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "SoapySDR 0.8.1 是 CMake 项目，C++11 标准，无外部依赖（仅 libdl + pthread）"
  - "Python 绑定和文档为可选功能，OHOS 上关闭"
  - "上游提供 4 个单元测试：TestTimeConversion、TestFormatParser、TestKwargsMarkup、TestConvertTypes"
  - "产物: libSoapySDR.so + SoapySDRUtil 命令行工具 + 头文件 + CMake 配置文件"
