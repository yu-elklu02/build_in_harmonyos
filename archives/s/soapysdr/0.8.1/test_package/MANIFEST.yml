# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: soapysdr/0.8.1
homepage: https://github.com/pothosware/SoapySDR

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest"

# ctest 实际运行的测试程序
upstream_tests:
  - file: tests/TestTimeConversion.cpp
    source: SoapySDR-soapy-sdr-0.8.1/tests/TestTimeConversion.cpp
    description: "时间转换函数单元测试"
    command: "./TestTimeConversion"
  - file: tests/TestFormatParser.cpp
    source: SoapySDR-soapy-sdr-0.8.1/tests/TestFormatParser.cpp
    description: "格式解析器单元测试"
    command: "./TestFormatParser"
  - file: tests/TestKwargsMarkup.cpp
    source: SoapySDR-soapy-sdr-0.8.1/tests/TestKwargsMarkup.cpp
    description: "键值对标记解析单元测试"
    command: "./TestKwargsMarkup"
  - file: tests/TestConvertTypes.cpp
    source: SoapySDR-soapy-sdr-0.8.1/tests/TestConvertTypes.cpp
    description: "类型转换单元测试"
    command: "./TestConvertTypes"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "SoapySDR C API 版本查询函数验证"
    command: "./test_soapysdr"

# 测试断言总数
assertion_count: 7