software: sipp
version: 3.7.7
status: built
build_system: cmake
build_date: 2026-07-16

source:
  url: https://github.com/SIPp/sipp/releases/download/v3.7.7/sipp-3.7.7.tar.gz
  sha256: e55b15f567760e9febeef366a1ab51a5239d197a132ce931b78c826d22d31e69
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - USE_SSL=OFF
    - USE_PCAP=OFF
    - USE_SCTP=OFF
    - USE_GSL=OFF
    - BUILD_STATIC=OFF
  dependencies:
    - name: gtest
      version: 1.17.0
  bundled_dependencies:
    - name: ncurses
      version: 6.5
      scope: private build dependency for SIPp curses UI
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - SIPp requires curses at configure time; this recipe privately builds ncurses 6.5 from source inside the SIPp build folder instead of adding an unpublished ncurses Conan dependency or a second recipe to the PR.
  - SIPp optional SSL, PCAP, SCTP, and GSL features can be disabled to keep the base package dependency-light for cross-build CI.
  - SIPp's `-v` / version banner path exits with upstream informational code `99` (`EXIT_OTHER`), so the packaged smoke test must validate both output and that documented exit code instead of assuming success is exit code 0.

test_results:
  type: smoke
  total: 1
  passed: 1
  failed: 0
knowledge_ref: []
