package: sparse/0.6.4
homepage: "https://sparse.sourceforge.net/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test-lexing.c
    source: sparse-0.6.4/test-lexing.c
    description: "Lexical analysis engine test"
    command: "./test-lexing"
  - file: test-parsing.c
    source: sparse-0.6.4/test-parsing.c
    description: "Parser test"
    command: "./test-parsing"
  - file: test-linearize.c
    source: sparse-0.6.4/test-linearize.c
    description: "Linearization test"
    command: "./test-linearize"

test_package_tests:
  - file: test.c
    description: "Verify sparse binary runs and detects warnings"
    command: "sparse --version"

assertion_count: 3
