# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sipcalc/1.1.6
homepage: "https://github.com/sii/sipcalc"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: sipcalc_1.1.6.orig.tar.gz, sha256 cfd476c667f7a119e49eb5fe8adcfb9d2339bc2e0d4d01a1d64b7c229be56357)
upstream_test_audit:
  source_tarball: "sipcalc_1.1.6.orig.tar.gz"
  source_sha256: "cfd476c667f7a119e49eb5fe8adcfb9d2339bc2e0d4d01a1d64b7c229be56357"
  top_level_files:
    - Makefile.am        # 仅含 EXTRA_DIST = configure / SUBDIRS = doc include src, 无 TESTS / check_PROGRAMS / test 目标
    - configure.ac       # AC_CONFIG_FILES 列表无 tests/ 目录
    - src/Makefile.am    # 仅 bin_PROGRAMS = sipcalc + 4 个 .c 源, 无 check_PROGRAMS / TESTS
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / test target"
    - "tests/ / test/ 目录"
  scan_result: "0 matches — 源码仅含 4 个 C 实现 (sub-func.c, interface.c, sub-output.c, sub.c) 及头文件, 无测试代码"
  make_check_output: "Making check in doc/include/src: 'Nothing to be done for 'check' (×3)"
  reason: "sipcalc 1.1.6 为纯 CLI 工具, 上游 tar 包不含任何测试套件, make check 无 check 目标"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件，故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: sipcalc --version + IPv4/24 subnet + IPv6/64 subnet"
    command: "bash test.sh <sipcalc_binary_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3