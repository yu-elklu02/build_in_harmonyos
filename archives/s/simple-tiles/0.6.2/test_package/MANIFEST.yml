# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: simple-tiles/0.6.2
homepage: https://github.com/propublica/simple-tiles

# 上游测试：Makefile `test` → build/test/runner + api + benchmark
# runner 内约 36 个 test_* 函数、约 116 处 assert（含集成用例）
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "build/test/runner"

upstream_tests:
  - name: runner
    description: "上游单元/集成测试可执行文件（test_bounds/list/map/query/style/layer/integration 等，约 36 个用例）"
  - name: api
    description: "上游 API 烟雾测试可执行文件（make test 会运行；主配方 build() 以 runner 为门禁）"
  - name: benchmark
    description: "上游基准测试可执行文件（make test 会运行）"

# test_package：对齐 Homebrew formula test（simplet_map_new/free）
test_package_tests:
  - file: test.c
    description: "消费者测试 — simplet_map_new/free（等价 Homebrew formula test）"
    command: "./test_simple_tiles"

assertion_count: 116
