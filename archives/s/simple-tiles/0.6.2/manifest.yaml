software: simple-tiles
version: "0.6.2"
# 配方与 L0 静态门禁已就绪；完整 conan create 交由 CI（本地按约定跳过）
status: built
build_system: waf
build_date: "2026-07-19"

source:
  url: "https://github.com/propublica/simple-tiles/archive/refs/tags/v0.6.2.tar.gz"
  sha256: "343ae52a0b20ee091b14bc145b7c78fed13b7272acd827626283b70f178dfa34"
  tar_format: tar.gz
build:
  system: waf
  configure_options:
    - "--prefix=$PREFIX"
  dependencies:
    - "cairo/1.18.4"          # Conan
    - "pango/1.50.14.1"       # Conan（pangocairo）
    - "gdal/3.9.2.1"          # Conan（需 ohpcd 或本地 cache 已有）
    - "glib/2.84.0.1"         # 显式 requires（pango 公共头依赖 glib-object.h）
    - "harfbuzz/14.2.0.1"     # pango 传递
    - "proj/9.3.1.1"          # gdal 传递
  cc: clang
  notes: |
    对齐 Homebrew formula revision 8：source() 按 URL 下载 waf（R19 不入库），并应用 clang_compilation_database 文本补丁。
    构建命令：python3 ./waf configure --prefix=... && python3 ./waf build && python3 ./waf install
    requires 已切到 Conan pango/gdal，不再依赖 cmd-pkgs 前缀探测。

patches_applied:
  - "0001-update-clang-compilation-database-py313.patch"
  - "0002-wscript-gdal-via-pkg-config.patch"

knowledge_gained:
  - "simple-tiles 使用 waf；Homebrew 用上游 commit 的 waf + clang_compilation_database patch 兼容 Python 3.12+；配方构建时下载 waf，不 vendor 二进制（R19）"
  - "waf configure 通过 pkg-config 检测 pangocairo，通过 gdal-config 检测 GDAL"
  - "cmd-pkgs 中 cairo/gdal 预编译包可能缺少开发头文件与 .pc，不能直接用于编译（需完整 Conan 包或补全开发文件）"
