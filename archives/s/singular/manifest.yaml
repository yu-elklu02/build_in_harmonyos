name: singular
description: 交换代数 / 代数几何 / 奇点论的计算机代数系统（多项式与 Gröbner 基）
category: math
license: GPL-2.0-or-later
website: https://www.singular.uni-kl.de/
source_url: https://github.com/Singular/Singular/releases
build_system: autotools
versions:
  - version: "4.4.1"
    status: built
    build_date: "2026-08-13"
    notes: >-
      SageMath / passagemath 计算代数栈中多项式与 Gröbner 基运算的后端。三个坑：
      ① 子包 omalloc 的 AX_PROG_CC_FOR_BUILD 用 _FOR_BUILD 变量族却混用普通 $LIBS，
      LDFLAGS_FOR_BUILD 没人设导致一个 -L 都没有，报成
      "C compiler cannot create executables"（极具误导性，实为缺搜索路径）；
      ② 必须依赖 mpfr/4.2.2.1（4.2.2 的 .la 烤死了 //lib/libgmp.la）；
      ③ make install 的 install-data-local 用 tar -jx 解 doc.tbz2，鸿蒙 tar 是
      toybox 的、无 bzip2 applet，删掉该压缩包即整段跳过（有 if test -e 保护）。
