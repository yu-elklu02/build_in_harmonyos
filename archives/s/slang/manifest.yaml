# slang 软件元数据
# 文件位置: archives/s/slang/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

# 软件名称（必须）
name: slang

# 软件描述（必须）
description: |
  Slang 是一个着色器语言编译器，支持 HLSL/Slang 到 SPIR-V/GLSL/HLSL 目标的编译。
  由 NVIDIA 开发，提供高性能着色器编译能力，支持模块化编程、接口、泛型等高级特性。

# 软件分类（必须）
category: tool

# 官方网站
website: https://github.com/shader-slang/slang

# 许可证
license: MIT

# ============================================================
# 版本索引（必须）
# ============================================================

# 已编译版本列表
versions:
  "2026.14":
    status: built
    build_date: "2026-07-27"
    notes: "shader-slang，静态库构建，含5个平台兼容性补丁"

# ============================================================
# 维护信息
# ============================================================

# 维护者
maintainer: openharmony-compile-agent

# 最后更新日期
last_updated: "2026-07-27"

# ============================================================
# 依赖信息
# ============================================================

# 核心依赖
dependencies:
  required: []

# 编译依赖
build_dependencies: []

# ============================================================
# 编译特性
# ============================================================

# 构建系统
build_system: cmake

# 支持的构建类型
build_types:
  - Release

# 编译器要求
compiler_requirements:
  c_standard: "11"
  cxx_standard: "20"
  minimum_clang_version: "15.0"
