# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 SLang_init_all API 调用"
    command: "./test_slang"

# 当前 OHOS 配置预期执行：97 个 src harness case + 16 个已配置模块脚本
# + 11 个 slsh 脚本 + 1 个 UTF-8 C 测试。配方会从生成的 Makefile 动态复核。
assertion_count: 125
