software: slang
# 版本级 manifest 模板
# 文件位置: archives/s/slang/2.3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.jedsoft.org/releases/slang/slang-2.3.3.tar.bz2"

  # 源码校验和
  sha256: "f9145054ae131973c61208ea82486d5dd10e3c5cdad23b7c4a0617743c8f5a18"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "slang 使用自定义 configure 脚本（非 automake），需要 patch config.guess/config.sub 以识别 HarmonyOS（E007/E160）"
  - "slang 编译简单，无外部依赖，仅需 libm/libdl/libpthread"
  - "slang 提供 libslang 库和 slsh 解释器"
  - "make check 覆盖 src、modules 和 slsh 测试；配方另行执行顶层 make check 未包含的 utf8/test_isxxx.c"
  - "测试数量从生成的 Makefile 动态统计，避免将旧的 94 固定值误当成真实执行数"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
