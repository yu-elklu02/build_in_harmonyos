# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: slang/2026.14
homepage: "https://github.com/shader-slang/slang"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# slang 上游测试需要完整的图形渲染环境，OHOS 平台无法运行
# 使用 test_package 中的消费者测试替代
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 使用 slangc 二进制功能测试（R34: 实质依赖被测包）
test_package_tests:
  - file: conanfile.py
    description: "运行 slangc 编译着色器到 C++/HLSL 目标，验证编译器核心功能"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
