# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: smex/3.0
homepage: https://github.com/nonsequitur/smex

# 上游测试命令
upstream_check_command: ""

# smex 是纯 Emacs Lisp 包，上游无 make check / test 套件
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试套件，仅在 Emacs 内通过 Cask 运行 ERT 测试
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "验证 smex.el 安装正确性（存在性、版本号、函数定义）"
    command: "conan test"

# 测试断言总数 (3 项: 文件存在 / 版本匹配 / 函数定义)
assertion_count: 3
