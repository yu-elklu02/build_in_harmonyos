software: smex
display: "Smex — Emacs M-x Enhancement"
description: "Emacs M-x 命令增强工具，基于 Ido 提供模糊匹配和最近/最常用命令排序"
category: editor
homepage: "https://github.com/nonsequitur/smex"
license: GPL-3.0-or-later
build_system: none

ohos_adaptation:
  key_points:
    - "smex 是纯 Emacs Lisp 包，无 configure/make/cmake 构建系统"
    - "package() 仅复制 smex.el 到 share/emacs/site-lisp/ 目录"
    - "package_id 使用 self.info.clear() 声明包与 OS/arch 无关"
    - "运行时依赖 Emacs 编辑器（非 Conan 依赖，由用户提供）"
  common_dependencies: []

versions:
  "3.0":
    status: built
    build_date: "2026-07-27"
