# test_package/MANIFEST.yml
package: screenresolution/1.6
homepage: "https://github.com/jhford/screenresolution"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: Makefile
    source: "screenresolution-1.6/Makefile"
    description: "macOS display get/list/set integration test that changes monitor resolution"
    command: "make test"
    status: "not_run_on_ohos"
    skip_reason: "Requires macOS CoreGraphics and physical display mode changes"

test_package_tests:
  - file: conanfile.py
    description: "Runs installed screenresolution -version on supported non-OHOS builds"
    command: "screenresolution -version"
  - file: test.sh
    description: "OHOS NativeDisplayManager backend smoke test for version/get/list/set capability boundary"
    command: "sh test.sh <screenresolution>"

assertion_count: 4
