# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: sfsexp/1.4.1
homepage: "https://github.com/mjsottile/sfsexp"

# 上游测试命令
# sfsexp 包含 8 个测试程序（readtests, ctest, bug, error_codes, partial,
# vis_test, read_and_dump, ctorture），通过 make check 或手动编译运行
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（位于源码 test/ 目录，需手动编译运行）
upstream_tests:
  - file: test/readtests.c
    source: sfsexp-1.4.1/test/readtests.c
    description: "解析/反解析定点验证（18 个表达式）"
    command: "./readtests"
  - file: test/ctest.c
    source: sfsexp-1.4.1/test/ctest.c
    description: "续体解析器边界测试（49→1字节 chunk）"
    command: "./ctest"
  - file: test/bug.c
    source: sfsexp-1.4.1/test/bug.c
    description: "基础解析/打印/销毁"
    command: "./bug"
  - file: test/error_codes.c
    source: sfsexp-1.4.1/test/error_codes.c
    description: "错误码处理（3 种错误条件）"
    command: "./error_codes"
  - file: test/partial.c
    source: sfsexp-1.4.1/test/partial.c
    description: "不完整表达式检测"
    command: "./partial"
  - file: test/vis_test.c
    source: sfsexp-1.4.1/test/vis_test.c
    description: "DOT 可视化测试"
    command: "./vis_test"
  - file: test/read_and_dump.c
    source: sfsexp-1.4.1/test/read_and_dump.c
    description: "解析/反解析验证（18 个表达式）"
    command: "./read_and_dump"
  - file: test/ctorture.c
    source: sfsexp-1.4.1/test/ctorture.c
    description: "性能/压力测试（100 次迭代）"
    command: "./ctorture"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_sfsexp.c
    description: "消费者测试: 解析/列表长度/打印/嵌套列表/查找元素，5 个断言"
    command: "./test_sfsexp"

# 测试断言总数（近似值）
# 上游 8 个测试程序 + test_package 5 个断言
assertion_count: 20
