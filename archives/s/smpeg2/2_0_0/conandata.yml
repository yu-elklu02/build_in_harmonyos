sources:
  url: "https://github.com/icculus/smpeg/archive/refs/tags/release_2_0_0.tar.gz"
  sha256: "fdd431bd607efcf0f35789fb3105d7535d4f0e8b46e673e9c0051726e8d1e701"

patches:
  - patch_file: "patches/0001-drop-x86-mmx-asm.patch"
    patch_description: "Do not build x86 MMX assembly sources for non-x86 targets"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-huffman-table-cxx17-narrowing.patch"
    patch_description: "Use explicit unsigned sentinels in Huffman table entries for C++17"
    patch_type: "portability"
  - patch_file: "patches/0003-autogen-respect-conan-tools.patch"
    patch_description: "Let autogen.sh use Conan-provided Autotools commands"
    patch_type: "portability"
