patches_applied:
  - "patches/0001-drop-x86-mmx-asm.patch"
  - "patches/0002-fix-huffman-table-cxx17-narrowing.patch"
  - "patches/0003-autogen-respect-conan-tools.patch"

knowledge_gained:
  - "Upstream release_2_0_0 has no tests or test runner in Makefile.am/configure.in."
  - "Makefile.am lists x86 MMX assembly sources unconditionally; remove them for portable aarch64 builds while --disable-mmx is used."
  - "Pass SDL_CONFIG from the Conan sdl2/2.30.10 package so upstream configure finds SDL2 without a system install."
  - "Publish the Conan SDL2 include/SDL2 directory because smpeg2/smpeg.h includes SDL.h and sdl2/2.30.10 CMakeDeps metadata has no include dirs."
  - "Replace three 0-1 unsigned Huffman table sentinels with equivalent ~0u to satisfy C++17 list initialization."
  - "Refresh GNU config.guess/config.sub from the Conan automake/1.18 tool package before configure so OHOS/aarch64 workers do not fail build-type detection."
  - "Pass explicit linux-ohos build/host triplets and patch GNU config helpers for HarmonyOS so config.guess does not need to create temporary probe files on OHOS workers."
  - "The package depends on SDL2 and installs libsmpeg2, smpeg2 headers, smpeg2-config, and plaympeg."
