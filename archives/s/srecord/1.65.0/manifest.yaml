knowledge_gained:
  - "SRecord 1.65.0 uses CMake despite being misdetected as autotools by the initializer"
  - "Upstream unconditionally forces /usr and must respect CMAKE_INSTALL_PREFIX_INITIALIZED_TO_DEFAULT"
  - "Generated documentation is part of the default ALL target and requires a large host-tool dependency chain"
  - "Runtime dependency collection must be Windows-only or installation copies the build host libc and loader"
  - "libgcrypt/1.11.0 is available on ohpcd; recipe requires it for crypto filters"
  - "On x86_64 SDK hosts with OHOS profiles, detect foreign aarch64 via platform.machine() rather than cross_building()"
  - "OHOS/HMDFS getcwd may fail in Conan build trees; CTest shell prelude must not require pwd(1)"
  - "HarmonyOS PATH may surface toybox /usr/bin/diff first; test_prelude.sh must probe for GNU diff explicitly or `diff -c` fails"
  - "OHOS rejects unsigned package ELF with Operation not permitted (E077); package() and test_package must binary-sign-tool selfSign srec_* before smoke_test.sh"

