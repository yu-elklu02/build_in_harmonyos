software: srecord
display: "SRecord"
description: "Tools and library for manipulating EPROM load file formats"
category: build-tool
homepage: "https://srecord.sourceforge.net/"
license: "GPL-3.0-or-later AND LGPL-3.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Respect an explicitly supplied CMAKE_INSTALL_PREFIX instead of forcing /usr"
    - "Allow generated documentation to be disabled to avoid host-only documentation tools"
    - "Do not collect host runtime libraries during non-Windows installation"
  common_dependencies:
    - cmake
    - libgcrypt
    - libgpg-error

versions:
  "1.65.0":
    status: built
    build_date: "2026-07-18"
    conan_ref: "srecord/1.65.0"
