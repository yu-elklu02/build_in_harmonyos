# test_package/MANIFEST.yml
package: siege/4.1.7
homepage: "https://www.joedog.org/siege-home/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: doc/siege.1.in
    source: siege-4.1.7/doc/siege.1.in
    description: "上游发布包未提供可在交叉构建环境稳定运行的自动化测试；适配包使用 CLI 版本检查作为消费者冒烟测试"
    command: "siege --version"

test_package_tests:
  - file: conanfile.py
    description: "运行已安装的 siege --version，验证 CLI 可执行文件可被 Conan 消费者定位并启动"
    command: "siege --version"

assertion_count: 1
