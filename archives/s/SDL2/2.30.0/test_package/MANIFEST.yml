package: SDL2/2.30.0
homepage: "https://www.libsdl.org/"

# SDL2 does not provide a standard `make check` target
# Upstream tests are available in the test/ directory but require manual compilation
upstream_check_command: "make check (not available — SDL2 does not provide this target)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.c
    description: "Verify SDL2 version, init, and quit"
    command: "./test_sdl2"

assertion_count: 4