# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.1"

# 软件名
software: "sdl2_mixer"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-08"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libsdl-org/SDL_mixer/archive/refs/tags/release-2.8.1.tar.gz"

  # 源码校验和
  sha256: "63804b4b2ba503865c0853f102231aeff489b1dfc6dea4750a69e2a8ef54b2bb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DSDL2MIXER_OPUS=OFF"
  - "-DSDL2MIXER_VORBIS=OFF"
  - "-DSDL2MIXER_FLAC=OFF"
  - "-DSDL2MIXER_MOD=OFF"
  - "-DSDL2MIXER_MIDI=OFF"
  - "-DSDL2MIXER_WAVPACK=OFF"
  - "-DSDL2MIXER_GME=OFF"
  - "-DSDL2MIXER_CMD=OFF"
  - "-DBUILD_SHARED_LIBS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - sdl2/2.30.10
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
