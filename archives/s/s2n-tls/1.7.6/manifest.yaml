# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.6"

# 软件名
software: "s2n-tls"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/aws/s2n-tls/archive/refs/tags/v1.7.6.tar.gz"

  # 源码校验和
  sha256: "31b7a6cc287799327fb414072d6d71168daa859939898726f84ca54fc6e45c3b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_TESTING=ON"
    - "SEARCH_LIBCRYPTO=ON"
    - "UNSAFE_TREAT_WARNINGS_AS_ERRORS=OFF"
    - "S2N_INTEG_TESTS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: ["aws-lc/5.4.0"]
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "s2n-tls 通过 CMAKE_PREFIX_PATH 定位 aws-lc 的 crypto-config.cmake"
  - "OHOS 不支持 execinfo/backtrace，s2n_stacktrace_test 需豁免"
  - "BUILD_TESTING=ON 后 282/283 上游单元测试在 OHOS 上通过"
  - "关闭 UNSAFE_TREAT_WARNINGS_AS_ERRORS 可避免测试代码的平台特定警告"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
