package: sane-backends/1.2.1
homepage: "https://gitlab.com/sane-project/backends"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: testsuite/sanei/sanei_usb_test.c
    description: "SANEI USB helper test."
    command: "sanei_usb_test"
  - file: testsuite/sanei/test_wire.c
    description: "SANE wire-protocol serialization test."
    command: "test_wire"
  - file: testsuite/sanei/sanei_check_test.c
    description: "SANE value-checking test."
    command: "sanei_check_test"
  - file: testsuite/sanei/sanei_config_test.c
    description: "SANE configuration parser test."
    command: "sanei_config_test"
  - file: testsuite/sanei/sanei_constrain_test.c
    description: "SANE constraint-processing test."
    command: "sanei_constrain_test"
  - file: testsuite/backend/genesys/tests.cpp
    description: "Genesys backend unit-test suite."
    command: "genesys_unit_tests"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc ASCII output comparison."
    command: "sane-desc -m ascii -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc HTML backend output comparison."
    command: "sane-desc -m html-backends-split -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc manufacturer HTML output comparison."
    command: "sane-desc -m html-mfgs -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc XML output comparison."
    command: "sane-desc -m xml -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc statistics output comparison."
    command: "sane-desc -m statistics -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc usermap output comparison."
    command: "sane-desc -m usermap -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc database output comparison."
    command: "sane-desc -m db -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc udev output comparison."
    command: "sane-desc -m udev -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc udev ACL output comparison."
    command: "sane-desc -m udev+acl -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc udev hwdb output comparison."
    command: "sane-desc -m udev+hwdb -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc hwdb output comparison."
    command: "sane-desc -m hwdb -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc plist output comparison."
    command: "sane-desc -m plist -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc HAL output comparison."
    command: "sane-desc -m hal -s ./data"
  - file: testsuite/tools/data/testfile.desc
    description: "sane-desc HAL-new output comparison."
    command: "sane-desc -m hal-new -s ./data"

test_package_tests:
  - file: test.c
    description: "Initializes the installed SANE API and enumerates available devices."
    command: "test_sane-backends"

upstream_execution_count: 20
upstream_execution_strategy: "OHOS builds all five SANEI tests, genesys_unit_tests, and sane-desc; the 14 sane-desc modes plus six Automake TESTS execute on a deployed OHOS runtime."
consumer_test:
  file: test.c
  description: "Configures the packaged test backend and verifies SANE initialization, enumeration, open, close, status conversion, and shutdown."
  command: "test_sane-backends"
assertion_count: 20
