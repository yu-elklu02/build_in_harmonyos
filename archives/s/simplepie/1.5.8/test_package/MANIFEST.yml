# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: simplepie/1.5.8
homepage: "http://simplepie.org/"

# 上游测试命令 (PHP library, uses phpunit)
# 上游 composer.json scripts.test = "phpunit"
# 上游 tests/AllTests.php 是 phpunit suite 入口
upstream_check_command: "phpunit tests/AllTests.php"

# conanfile.py build() 方法中是否已集成上游测试
# 鸿蒙 PC 工具链无 PHP runtime / phpunit, 上游测试无法在适配环境运行
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_not_run_reason: "鸿蒙 PC 工具链无 PHP runtime / phpunit, 上游 phpunit suite 无法执行"

# 上游实际运行的测试程序 (phpunit suite)
# 上游仓库 (https://github.com/simplepie/simplepie/tree/1.5.8/tests) 共 12 个测试文件
# 注意: release tarball (本配方源码) 不含 tests/ 目录, 测试文件仅存在于上游 GitHub 仓库
upstream_tests:
  - file: "tests/AllTests.php"
    description: "phpunit suite 入口, 聚合所有 Test 类"
  - file: "tests/CacheTest.php"
    description: "SimplePie 缓存后端单元测试"
  - file: "tests/EncodingTest.php"
    description: "字符编码检测/转换单元测试"
  - file: "tests/HTTPParserTest.php"
    description: "HTTP 响应解析单元测试"
  - file: "tests/IRITest.php"
    description: "IRI (International Resource Identifier) 解析单元测试"
  - file: "tests/ItemTest.php"
    description: "RSS/Atom Item 解析单元测试"
  - file: "tests/LocatorTest.php"
    description: "Feed 自动发现/定位单元测试"
  - file: "tests/SanitizeTest.php"
    description: "HTML/数据净化单元测试"
  - file: "tests/SubscribeUrlTest.php"
    description: "订阅 URL 处理单元测试"
  - file: "tests/bootstrap.php"
    description: "phpunit bootstrap (autoloader 注册)"
  - file: "tests/oldtests.php"
    description: "旧版测试兼容入口"
  - file: "tests/data/"
    description: "测试 fixture 数据目录 (RSS/Atom 样本)"
  - file: "tests/oldtests/"
    description: "旧版测试兼容目录"

# test_package 中自带的测试 (消费者视角验证)
# 因鸿蒙 PC 无 PHP runtime, test_package 验证为源码布局静态断言 (非运行时)
test_package_tests:
  - file: test.php
    description: "验证 simplepie PHP 源码布局（autoloader.php + library/SimplePie.php 存在 + PSR-0 引用）"
    command: "conan create test_package layout assertion"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 phpunit suite: 9 个 Test 类 (AllTests 聚合), 断言数未统计 (无法运行)
# test_package/conanfile.py: 3 个静态断言 (autoloader.php 存在 + SimplePie.php 存在 + autoloader 引用 SimplePie)
assertion_count: 3
upstream_assertion_count: "未统计 (鸿蒙 PC 无 PHP runtime, 上游测试未运行)"
