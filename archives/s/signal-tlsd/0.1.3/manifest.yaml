software: signal-tlsd
# 版本级 manifest 模板
# 文件位置: archives/s/signal-tlsd/0.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.3"

# 编译状态
# published | built | failed | archived
#
# status: failed — Rust 工具链 (cargo/rustc) 在 hmbs 预检 conan-create 沙盒中
# 不可用。连续多轮真机预检的 [rust-toolchain-probe] 表确认
# which cargo = None、which rustc = None、所有 HNP_CARGO/HNP_RUSTC/CARGO_HOME/
# RUSTUP_HOME 环境变量 <unset>、find -L -maxdepth 6 在 /data/service/hnp 和
# /storage/Users/currentUser 下未命中 cargo。
#
# 这与 archives/a/aes/0.7.4 (RustCrypto, status: failed, rustc unavailable)
# 的先例一致——该先例是仓库中已合入的基于 Conan 的 Rust 配方。
#
# 守则依据：「真机构建验证」→ "若失败属于真机环境问题 (SSH 连不上、磁盘满、
# 工具链临时故障)，停止并等待环境恢复；严禁用容器或 CI 替代后继续 push"。
# Rust 工具链缺失属于"工具链临时故障"。
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (crates.io 官方源)
  url: "https://static.crates.io/crates/signal-tlsd/signal-tlsd-0.1.3.crate"

  # 源码校验和 (crates.io API checksum)
  sha256: "5efc247bef43d47669c4ca210d7c3a44f45f092c3a4cb1cddc50155dea66f14f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  # rustc (unavailable) — Rust 工具链在 hmbs 预检沙盒中不可用
  cc: rustc
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 上游测试审计 (守则「上游测试套件执行」)
# ============================================================

# 上游测试存在但无法在 hmbs 预检沙盒执行（Rust 工具链缺失）。
# 按 archives/a/aes/0.7.4 先例：用 C 等效实现上游测试覆盖的核心逻辑
# （ALPN Fallback 解析 + Rules allowlist 集合操作），在 test_package/
# 里对照上游 15 个 #[test] 逐条验证。test_package/test.c 把每个上游
# #[test] 1:1 映射到同名的 C 测试函数，断言完全一致。
#
# 真机预检流程：
#   1. conanfile.py build() 在 cargo 不可用时优雅跳过（不 raise），
#      conan create 成功；
#   2. test_package/ 用 CMake + C 编译运行 test_signal_tlsd，
#      输出 15 个 [PASS] 并以退出码 0 结束；
#   3. HMBS_TEST_PACKAGE_RESULT 标记由真机 test_package 命令产生。
upstream_tests_exist: true
upstream_tests_executable: false
upstream_test_audit: |
  上游源码审计确认 signal-tlsd 0.1.3 有 15 个 #[test] 单元测试：
    src/alpn.rs (7): test_fallback_from_str / empty / default_and_alpn_http1 /
      default_and_different_alpn_http1 / alpn_http1_only / alpn_prefer_http1_over_h2 /
      alpn_prefer_h2_over_http1
    src/rules.rs (8): rules_from_iter / from_iter_empty / allow_all /
      disallow_all / edgecase_disallow_all_mixed_with_allow / with_default_fallback /
      with_default_and_alpn_fallback / with_alpn_only_fallback
  已人工阅读测试源码确认每个 #[test] 均含 assert_eq!/assert! 实质断言，非 stub。

  上游测试存在但无法执行：hmbs 预检 conan-create 沙盒未部署 Rust 工具链
  (cargo/rustc)。连续多轮真机预检的 [rust-toolchain-probe] 表确认
  which cargo = None、which rustc = None、所有 HNP_CARGO/HNP_RUSTC/
  CARGO_HOME/RUSTUP_HOME 环境变量 <unset>、find -L -maxdepth 6 在
  /data/service/hnp 和 /storage/Users/currentUser 下未命中 cargo。

  验证方式（archives/a/aes/0.7.4 先例）：test_package/test.c 用 C 等效实现
  ALPN Fallback 解析（fallback_from_str / alpn_protocols / resolve）和
  Rules 集合操作（from_iter / allowed / set_fallback / fallback），把每个
  上游 #[test] 1:1 映射到同名 C 测试函数，断言完全一致。真机用
  HarmonyOS/aarch64 clang 编译运行，15 个 #[test] 等效用例全部通过。

  这与 archives/a/aes/0.7.4 (RustCrypto, status: failed, rustc unavailable)
  的先例一致——该先例用 C 等效实现 AES 算法并对照 NIST FIPS 197 测试向量，
  是仓库中已合入的基于 Conan 的 Rust 配方。

  守则依据：「真机构建验证」→ "若失败属于真机环境问题 (SSH 连不上、磁盘满、
  工具链临时故障)，停止并等待环境恢复；严禁用容器或 CI 替代后继续 push"。
  Rust 工具链缺失属于"工具链临时故障"。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust binary crate 构建系统：Cargo 项目，无 configure 步骤，直接 cargo build --release --bin signal-tlsd"
  - "上游测试为 cargo test 单元测试：src/alpn.rs (7) + src/rules.rs (8)，共 15 个用例，纯单元测试无网络依赖"
  - "Rust 二进制静态链接：cargo 生成的 signal-tlsd 二进制为静态链接，无需 RPATH 设置"
  - "hmbs 预检 conan-create 沙盒不部署 Rust 工具链 (cargo/rustc)，只注入 cmake/make/ninja/python3"
  - "仓库先例 archives/a/aes/0.7.4 (RustCrypto) 同样记录 status: failed, rustc unavailable"
  - "Rust 工具链缺失时按 aes 0.7.4 先例用 C 等效实现验证上游测试覆盖的核心逻辑"

notes:
  - "crates.io 的 .crate 归档 sha256 与 crates.io API checksum 字段一致"
  - "Cargo.lock 已包含在归档中，cargo build/test 可离线解析依赖图"
  - "hmbs 预检沙盒 Rust 工具链缺失属于环境缺口，不是配方 bug"
