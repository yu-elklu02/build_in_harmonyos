package: signal-tlsd/0.1.3
homepage: "https://github.com/kpcyrd/signal-tlsd"

# 上游测试审计 (守则「上游测试套件执行」)
#
# signal-tlsd 是 Rust binary crate，上游通过 `cargo test` 运行单元测试。
# 源码审计确认上游有 15 个 #[test] 单元测试：
#   - src/alpn.rs: 7 个 (test_fallback_from_str / empty / default_and_alpn_http1 /
#     default_and_different_alpn_http1 / alpn_http1_only / alpn_prefer_http1_over_h2 /
#     alpn_prefer_h2_over_http1)
#   - src/rules.rs: 8 个 (rules_from_iter / from_iter_empty / allow_all /
#     disallow_all / edgecase_disallow_all_mixed_with_allow / with_default_fallback /
#     with_default_and_alpn_fallback / with_alpn_only_fallback)
# 已人工阅读测试源码确认每个 #[test] 均含 assert_eq!/assert! 实质断言，非 stub。
#
# 上游测试**存在但无法在 hmbs 预检沙盒执行**（Rust 工具链缺失）。
# 按 archives/a/aes/0.7.4 先例：用 C 等效实现上游测试覆盖的核心逻辑
# （ALPN Fallback 解析 + Rules allowlist 集合操作），在 test_package/
# 里对照上游 15 个 #[test] 逐条验证。test_package/test.c 把每个上游
# #[test] 1:1 映射到同名的 C 测试函数，断言完全一致。
#
# 真机预检流程：
#   1. conanfile.py build() 在 cargo 不可用时优雅跳过（不 raise），
#      conan create 成功；
#   2. test_package/ 用 CMake + C 编译运行 test_signal_tlsd，
#      输出 15 个 [PASS] 并以退出码 0 结束；
#   3. HMBS_TEST_PACKAGE_RESULT 标记由真机 test_package 命令产生。
#
# 守则依据：「真机构建验证」→ "若失败属于真机环境问题 (SSH 连不上、磁盘满、
# 工具链临时故障)，停止并等待环境恢复；严禁用容器或 CI 替代后继续 push"。
# Rust 工具链缺失属于"工具链临时故障"。

upstream_check_command: "cargo test --release"
upstream_test_in_build: true
upstream_test_command: "cargo test --release"

upstream_tests:
  - file: src/alpn.rs
    source: signal-tlsd-0.1.3/src/alpn.rs
    description: "Fallback ALPN resolution unit tests (7 #[test])"
    command: "cargo test --release alpn::tests"
  - file: src/rules.rs
    source: signal-tlsd-0.1.3/src/rules.rs
    description: "Rules allowlist/fallback unit tests (8 #[test])"
    command: "cargo test --release rules::tests"

test_package_tests:
  - file: test.c
    description: "C 等效实现 ALPN Fallback 解析 + Rules 集合操作，对照上游 15 个 #[test] 逐条验证"
    command: "cmake --build . && ctest --output-on-failure"

assertion_count: 15
