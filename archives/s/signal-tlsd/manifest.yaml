software: signal-tlsd
display: "signal-tlsd"
description: "Standalone Rust implementation of Signal's domain fronting TLS proxy"
category: network-tool
homepage: "https://github.com/kpcyrd/signal-tlsd"
license: MIT-0
build_system: cargo

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Rust binary crate，使用 cargo build --release --bin signal-tlsd 编译"
    - "需要 Rust 工具链 (cargo, rustc, harmonybrew 1.95.0, target aarch64-unknown-linux-ohos)"
    - "生成的二进制为静态链接，通常无需 RPATH 设置"
    - "上游测试为 cargo test 单元测试，纯单元测试无网络依赖"
  common_dependencies:
    - rust

# 版本索引
versions:
  "0.1.3":
    status: built
    build_date: "2026-08-05"
    published_as: signal-tlsd
