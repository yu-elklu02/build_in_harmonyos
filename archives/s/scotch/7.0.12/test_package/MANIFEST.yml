package: scotch/7.0.12
homepage: https://gitlab.inria.fr/scotch/scotch
upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"
upstream_tests:
  - file: src/check/CMakeLists.txt
    source: scotch-v7.0.12.tar.gz/src/check/CMakeLists.txt
    description: "Run the 117 sequential SCOTCH CTest entries executed by the active build options"
    command: "ctest --output-on-failure -j1"
    total_count: 117
test_package_tests:
  - file: test_package.c
    description: "Call SCOTCH_version and verify the packaged library version"
    command: "./test_package"
assertion_count: 3
