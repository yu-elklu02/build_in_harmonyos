# test_package/MANIFEST.yml — show-in-file-manager 1.1.4
# 上游官方测试声明（详见 docs/TEST_QUALITY_SPEC.md）
#
# 上游测试入口（仓库 src/rundoctest.py，对 src/showinfm/system/linux.py 的
# wsl_transform_path_uri doctest 运行 docstring 示例）：
#   python3 src/rundoctest.py
# 用例总数：wsl_transform_path_uri docstring 129 个 doctest 示例
#
# 运行情况（鸿蒙 PC 真机原生实测口径，打平台补丁后的源码树）：
#   - 129 个 doctest 用例：52 passed / 77 项为 WSL/Linux 宿主环境专属
#     不可执行（unrunnable）/ 0 errors / 0 timeout / 0 skipped。
#   - 77 项不可执行的原因均为上游 doctest 期望值依赖 WSL/Linux 宿主环境事实：
#     wslpath 命令、/mnt/c Windows 盘挂载、\\wsl.localhost 或 wsl$ 宿主 UNC、
#     /etc/fstab、/home 用户目录布局、特定 UID/passwd 等。本真机为
#     HarmonyOS（非 WSL，is_wsl=False），这些宿主环境事实不存在且无法在
#     真机上合法构造。77 项不属于 passed，也不属于上游条件性 skipped；
#     上游真实通过率 = 52/129（40.31%）。
#   - 诊断驱动（platform 映射/临时 wslpath/临时 HOME）的 81/48 仅用于根因
#     分析，不代表鸿蒙真机结果。
#   - 未修改任何上游测试文件、断言、数据、用例选择、skip 条件或预期结果。
#   - rundoctest.py 使用 doctest.run_docstring_examples 且不设退出码
#     （恒为 0），故以 doctest runner 的 attempted 统计为准。
#   - conanfile.py build() 仅做确定性构建与包内基础自检（wheel 构建、
#     import、CLI 入口），上游 doctest 按独立测试阶段运行并单独报告。

package: show-in-file-manager/1.1.4
homepage: "https://github.com/damonlynch/showinfilemanager"

upstream_check_command: "python3 src/rundoctest.py"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/rundoctest.py
    source: showinfilemanager-1.1.4/src/rundoctest.py
    description: "wsl_transform_path_uri doctest 运行器：129 个 doctest 用例，52 passed / 77 项 WSL/Linux 宿主环境专属不可执行（unrunnable），0 errors / 0 timeout / 0 skipped；上游真实通过率 52/129（40.31%）"
    command: "python3 src/rundoctest.py"
    result: "52_passed_77_unrunnable"

# test_package 中自带的测试（消费者视角验证，3 个 test case 与 5 项断言分离统计）
test_package_tests:
  - file: smoke.py
    description: "消费者测试 test case 1/3：真实消费最终包（import showinfm + 公共 API / 平台识别=Linux（补丁生效）/ URI 工具函数真实工作 / linux_desktop_humanize / CLI 入口存在可执行），内含 5 项断言 5/5 passed"
    command: "python3 smoke.py"
  - file: conanfile.py
    description: "消费者测试 test case 2/3：showinfilemanager --version 退出码 0；test case 3/3：showinfilemanager -h 退出码 0"
    command: "conan test test_package show-in-file-manager/1.1.4@"

# 测试统计（test case 与 assertion 分离）：
#   - 消费者 test case：3 个（smoke.py + CLI --version + CLI -h），3/3 passed
#   - smoke.py 断言：5 项（assertion_count），5/5 passed
#   - 上游 129 个 doctest 用例与消费者 test case/断言分离统计，不混入通过率
assertion_count: 5
