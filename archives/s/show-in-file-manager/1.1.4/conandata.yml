# conandata.yml — show-in-file-manager 1.1.4
# 源码来源：上游官方仓库 damonlynch/showinfilemanager tag v1.1.4
# （GitHub archive tarball；PyPI 同名 sdist show-in-file-manager-1.1.4.tar.gz
#  的 MANIFEST.in 排除了 src/rundoctest.py 与 src/cli.py，故采用完整仓库
#  tag tarball 作为源码，保证上游测试入口 rundoctest.py 可用）
# SHA256 已实测核对：
#   sha256sum = a2990d8145206d032cb8e45c546fe5732d8a240f436f6f53d81d62d4c09e3159
# 许可证：MIT

sources:
  url: "https://github.com/damonlynch/showinfilemanager/archive/refs/tags/v1.1.4.tar.gz"
  sha256: "a2990d8145206d032cb8e45c546fe5732d8a240f436f6f53d81d62d4c09e3159"

patches:
  - patch_file: "patches/0001-system-init-harmonyos.patch"
    patch_type: "platform"
    patch_description: "HarmonyOS 平台识别：platform.system() 返回 HarmonyOS 时按 Linux 处理，避免模块导入抛 NotImplementedError"
  - patch_file: "patches/0002-linux-proc-version.patch"
    patch_type: "platform"
    patch_description: "HarmonyOS 上 /proc/version 不可读：wsl_version()/detect_wsl() 捕获 OSError 返回 None/False"
