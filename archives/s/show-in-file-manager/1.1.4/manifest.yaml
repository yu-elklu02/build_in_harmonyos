# 版本级 manifest
# 文件位置: archives/s/show-in-file-manager/1.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名（Conan 包名，与任务平台库名一致）
software: show-in-file-manager

# 版本号（与任务平台版本一致）
version: "1.1.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-12"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方仓库 damonlynch/showinfilemanager tag v1.1.4；
  # PyPI 同名 sdist 的 MANIFEST.in 排除了测试入口 rundoctest.py，故用完整 tag tarball）
  url: "https://github.com/damonlynch/showinfilemanager/archive/refs/tags/v1.1.4.tar.gz"

  # 源码校验和（实测核对）
  sha256: "a2990d8145206d032cb8e45c546fe5732d8a240f436f6f53d81d62d4c09e3159"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python，PEP 517 / setuptools）
  system: custom

  # 配置选项列表
  configure_options: []

  # 运行时依赖（python3 解释器；packaging 为 linux.py 无条件导入；pyxdg 可选）
  dependencies:
    - "python3/3.12.8"
    - "packaging"

  # 不需要编译器（纯 Python，无 C 扩展）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-system-init-harmonyos.patch"
  - "0002-linux-proc-version.patch"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  total: 129
  passed: 52
  unrunnable: 77
  note: "上游唯一自动化测试入口 src/rundoctest.py（对 linux.py wsl_transform_path_uri 的 doctest）：共 129 个 doctest examples。鸿蒙 PC 真机原生执行 52 passed / 77 项为 WSL/Linux 宿主环境专属不可执行（unrunnable，依赖 wslpath 命令、/mnt/c Windows 盘挂载、\\\\wsl.localhost 宿主、/etc/fstab、/home 用户目录布局、特定 UID/passwd 等宿主环境事实，本真机无法构造），77 项不属于 passed，也不属于上游条件性 skipped；上游真实通过率 52/129（40.31%）；0 errors / 0 timeout。未修改任何上游测试文件、断言、数据、用例选择、skip 条件或预期；诊断驱动（platform 映射/临时 wslpath/临时 HOME）的 81/48 仅用于根因分析，不代表鸿蒙真机结果。test_package 消费者测试 3 个 test case 与 5 项断言单独统计（见 test_package/MANIFEST.yml）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "show-in-file-manager 是纯 Python 工具包（无 C 扩展），上游 system/__init__.py 仅识别 Windows/Linux/Darwin，HarmonyOS 上 platform.system() 返回 'HarmonyOS' 会抛 NotImplementedError，需按 Linux 处理（路径 A 常规平台补丁）"
  - "HarmonyOS 上 /proc/version 不可读（Permission denied），上游 detect_wsl()/wsl_version() 直接 open() 会崩溃，需捕获 OSError"
  - "纯 Python 包使用 settings=('os','arch')，无编译器、无 ELF 签名需求；PEP 517 wheel 产物平台无关"
  - "上游 doctest 期望值依赖 WSL 环境与具体文件存在性，非 WSL 真机下大量不匹配属于环境差异，如实记录 failed 而非伪造通过或改写为 skip"
