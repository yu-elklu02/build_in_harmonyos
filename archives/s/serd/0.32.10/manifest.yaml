software: serd
version: "0.32.10"
status: adapting
build_date: "2026-08-16"
build_system: meson

source:
  url: "https://download.drobilla.net/serd-0.32.10.tar.xz"
  sha256: "b0e93b49e52f01a049475b7886ef140407115a32d3b1e5dc5f95141c88275d1c"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=static"
    - "-Dchecks=enabled"
    - "-Ddocs=disabled"
    - "-Dman=disabled"
    - "-Dtests=enabled"
    - "-Dtools=enabled"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  status: pending
  framework: "Meson test"
  note: "build() enables upstream tests and runs meson.test(); true HarmonyOS result must be filled after device validation."

adapted_tests:
  status: pending
  cases: 2
  note: "test_package verifies both C API consumption and packaged serdi CLI Turtle-to-NTriples conversion."

knowledge_gained:
  - "Serd 0.32.10 is a small Meson-based C library/tool; docs/man/lint can be disabled while preserving upstream unit and data suite tests."
  - "Packaged OHOS command-line ELF tools must be re-signed before test_package executes them from the Conan cache."
