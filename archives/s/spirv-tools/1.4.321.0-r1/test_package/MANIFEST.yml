package: spirv-tools/1.4.321.0-r1
homepage: "https://github.com/KhronosGroup/SPIRV-Tools"

upstream_check_command: "ctest --test-dir <builddir> --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <builddir> --output-on-failure"

upstream_tests:
  - file: test/
    description: "Core binary, text, C/C++ interface, diagnostics, operands, extensions, and utility tests."
  - file: test/diff/
    description: "SPIR-V module diff regression tests."
  - file: test/link/
    description: "Linker validation and ID/type matching tests."
  - file: test/lint/
    description: "Linter analysis tests."
  - file: test/opt/
    description: "Optimizer, pass, IR, data-flow, and dominator analysis tests."
  - file: test/reduce/
    description: "Reducer and reduction-opportunity tests."
  - file: test/tools/
    description: "Command-line tool behavior tests."
  - file: test/util/
    description: "Shared test utility coverage."
  - file: test/val/
    description: "SPIR-V validation-rule tests."

test_package_tests:
  - file: test_spirv_tools_api.cpp
    description: "Verify packaged headers and libraries, compile a C++ API consumer, and run eight API assertions."
    command: "c++ test_spirv_tools_api.cpp -lSPIRV-Tools -pthread -o test_spirv_tools_api && ./test_spirv_tools_api"

assertion_count: 8
