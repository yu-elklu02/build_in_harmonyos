package: spirv-tools/vulkan-sdk-1.3.290.0
homepage: https://github.com/KhronosGroup/SPIRV-Tools
upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"
upstream_tests:
  - file: utils/check_copyright.py
    source: SPIRV-Tools-vulkan-sdk-1.3.290.0.tar.gz/utils/check_copyright.py
    description: "Run the upstream copyright policy check"
    command: "ctest -R '^spirv-tools-copyrights$' --output-on-failure"
  - file: test/tools/expect_unittest.py
    source: SPIRV-Tools-vulkan-sdk-1.3.290.0.tar.gz/test/tools/expect_unittest.py
    description: "Run the upstream expect helper unit tests"
    command: "ctest -R '^spirv-tools_expect_unittests$' --output-on-failure"
  - file: test/tools/spirv_test_framework_unittest.py
    source: SPIRV-Tools-vulkan-sdk-1.3.290.0.tar.gz/test/tools/spirv_test_framework_unittest.py
    description: "Run the upstream SPIR-V test framework unit tests"
    command: "ctest -R '^spirv-tools_spirv_test_framework_unittests$' --output-on-failure"
  - file: test/tools/opt/CMakeLists.txt
    source: SPIRV-Tools-vulkan-sdk-1.3.290.0.tar.gz/test/tools/opt/CMakeLists.txt
    description: "Run the upstream spirv-opt CLI tool tests"
    command: "ctest -R '^spirv_opt_cli_tools_tests$' --output-on-failure"
test_package_tests:
  - file: test_package.cpp
    description: "Construct a SPIRV-Tools context and validate its target environment"
    command: "./test_package"
assertion_count: 1
