software: screenfetch
version: 3.9.9
category: system
description: CLI Bash script to show system/theme info in screenshots
homepage: https://github.com/KittyKatt/screenFetch
url: https://github.com/KittyKatt/screenFetch/archive/refs/tags/v3.9.9.tar.gz
build_system: none
build_date: "2026-07-15"
configure_options: []
  # screenfetch has no configure script - pure shell tool
make_options: []
  # screenfetch has no Makefile - install is a file copy
has_c_code: false
has_tests: false
  # upstream ships a single Bash script with no test suite
test_result: passed
  # test_package smoke test (screenfetch --version / --help) passes
dependencies: []
status: built
notes:
  - screenfetch is a pure Bash script (screenfetch-dev) with no C code, no
    configure script and no Makefile
  - Install copies screenfetch-dev to bin/screenfetch (conventional command
    name, matching the screenfetch.1 man page) plus the man page and license
  - No ELF binaries - only a Bash script and a man page
  - Shebang #!/usr/bin/env bash is OHOS-compatible
  - Runtime needs Bash 4.0+ and common coreutils (awk/sed/grep/date), all
    present on HarmonyOS PC
  - screenfetch --version prints "screenFetch - Version 3.9.9"

verification:
  real_device:
    date: "2026-07-19"
    env: "HarmonyOS HAD 206.1.0 真机（aarch64 musl，OHOS SDK clang 15.0.4）"
    result: "pass"
