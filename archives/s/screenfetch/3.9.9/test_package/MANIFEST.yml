# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: screenfetch/3.9.9
homepage: "https://github.com/KittyKatt/screenFetch"

# screenfetch ships a single Bash script with no test suite.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer-side verification that runs the packaged script)
test_package_tests:
  - file: test.sh
    description: "Smoke test: screenfetch --version and --help"
    command: "bash test.sh"

# Assertion count (grep checks in test.sh)
assertion_count: 2
