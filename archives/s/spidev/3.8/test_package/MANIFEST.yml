# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: spidev/3.8
homepage: "https://github.com/doceme/py-spidev"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_test_status: "not-provided-in-sdist"

test_package_tests:
  - file: test_spidev.py
    description: "Consumer test on non-OHOS platforms: import spidev and verify version/API without opening a device"
    command: "python test_spidev.py"
  - file: test_spidev_static.py
    description: "OHOS artifact test: verify packaged extension ELF format, PyInit_spidev symbol, and .codesign section without HMDFS dlopen"
    command: "python test_spidev_static.py <packaged-spidev-extension.so>"

# Non-OHOS import/API path has 5 assertions; OHOS static artifact path has 6 checks.
assertion_count: 6
