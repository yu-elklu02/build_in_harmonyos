software: spidev
version: "3.8"
status: built
build_system: setuptools
build_date: "2026-07-30"

source:
  url: "https://files.pythonhosted.org/packages/67/87/039b6eeea781598015b538691bc174cc0bf77df9d4d2d3b8bf9245c0de8c/spidev-3.8.tar.gz"
  sha256: "2bc02fb8c6312d519ebf1f4331067427c0921d3f77b8bcaf05189a2e8b8382c0"
  tar_format: tar.gz

build:
  system: setuptools
  method: "pip install --prefix"

dependencies: []

platform_requirements:
  - "Target Python development headers"
  - "linux/spi/spidev.h and related Linux ioctl headers"
  - "SPI_IOC ioctl support"
  - "/dev/spidev* for hardware runtime transfer tests"

runtime_limitations:
  - "Hardware SPI transfer completeness requires manual confirmation on an OHOS target exposing /dev/spidev* and supporting SPI_IOC_* ioctls"
  - "Current automated validation covers build, package ELF signing, and OHOS static extension artifact checks; non-OHOS validation still imports the module and checks API shape"
  - "OHOS Python extension import from the Conan cache under /storage/Users/currentUser can be blocked by HMDFS/SELinux dlopen policy even after binary-sign-tool adds .codesign; actual import validation requires deployment into a loadable HNP/system Python path"

knowledge_gained:
  - "Do not pass a bare -lpython3.12 from sysconfig unless the shared library is actually present in that directory."
  - "On OHOS, prefer the active interpreter's mapped libpython path from /proc/self/maps before falling back to sysconfig LIBDIR/LIBPL."
  - "CPython extension modules installed into Conan packages must be re-signed for OHOS; CI-side HMDFS package paths cannot be used as a universal import/loadability oracle."

verification:
  local:
    - "python -m py_compile conanfile.py test_package/conanfile.py test_package/test_spidev.py test_package/test_spidev_static.py"
    - "conan inspect ."
    - "conan export . -> spidev/3.8#09a2442e4d883f6659d788d983e65fc5"
  pending:
    - "Manual hardware SPI transfer confirmation with a real /dev/spidev* node"
  completed:
    - "OHOS old-port conan create + import/API test_package"
    - "Upstream sdist test inventory recorded in reports/upstream-tests.md"
    - "No /dev/spidev* node was available on the old-port device"
