software: spidev
display: "spidev"
description: "Python bindings for Linux SPI access through the spidev kernel driver"
category: system
homepage: "https://github.com/doceme/py-spidev"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Requires Python headers for the target Python ABI"
    - "Requires Linux-compatible spidev kernel headers and SPI_IOC ioctl support"
    - "OHOS package() re-signs built CPython extension .so files and test_package performs static artifact checks under CI"
    - "Runtime transfer tests require /dev/spidev* device nodes"
    - "Hardware SPI transfer completeness requires manual confirmation on an OHOS target with /dev/spidev*"
  common_dependencies: []
  runtime_requirements:
    - "/dev/spidev* device node"
    - "Kernel-side spidev driver and SPI_IOC_* ioctl support"
  limitations:
    - "Automated OHOS CI validates build, package signing, and static extension artifact shape when no SPI device node is present"
    - "OHOS Python imports from the Conan cache under /storage/Users/currentUser can be rejected by HMDFS/SELinux dlopen policy even after signing; import validation requires deployment into a loadable HNP/system Python path"

versions:
  "3.8":
    status: built
    build_date: "2026-07-30"
