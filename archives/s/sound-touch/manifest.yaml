software: sound-touch
display: "SoundTouch Audio Processing Library"
description: "SoundTouch 是一个开源音频处理库，用于独立调整音频的节奏(Tempo)、音高(Pitch)和播放速率(Playback Rates)"
category: multimedia
homepage: "https://www.surina.net/soundtouch/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "基于 autotools 构建系统，源码包不含 configure 脚本，需先运行 bootstrap (autoreconf)"
    - "HMDFS 文件系统下 autoreconf 生成的 configure 包含 umask 077，需 sed 替换为 022 (E100)"
    - "OHOS aarch64 需要 -lclang_rt.builtins 解决 __powidf2 符号 (E098)"
    - "NEON 优化在 OHOS aarch64 上需禁用 --disable-neon-optimizations (E099)"
  common_dependencies: []

versions:
  - version: "homebrew"
    status: built
    build_date: "2026-07-17"
    source_url: "https://codeberg.org/soundtouch/soundtouch/archive/2.4.1.tar.gz"