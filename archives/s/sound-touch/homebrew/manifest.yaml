software: sound-touch
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型 (G4 门禁要求)
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (Homebrew 官方源)
  url: "https://codeberg.org/soundtouch/soundtouch/archive/2.4.1.tar.gz"

  # 源码校验和 (来自 Homebrew formula)
  sha256: "35d404e6e8c2ebd12fb4000da6fadd75c99e37eed2126a04721828c11c0377ec"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DNEON=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 预配置步骤（G0 干净构建需要）
  # SoundTouch 使用 CMake 构建，无需 bootstrap；NEON 通过 CMake 选项禁用
  pre_configure: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-include-soundtouch_config.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS aarch64 需要 -lclang_rt.builtins 解决 __powidf2 符号 (ref: E098)"
  - "NEON 优化在 OHOS aarch64 上需要禁用 (-DNEON=OFF) (ref: E099)"
  - "源代码包同时支持 CMake 和 Autotools 构建；CMake 无需 bootstrap，避免 automake 依赖"
  - "soundtouch_config.h 在 CMake 构建中仍需存在，通过 patch 提供配置版本"
patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/sound-touch-homebrew.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/sound-touch-homebrew.work
