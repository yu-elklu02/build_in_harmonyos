software: sparsehash
display: "sparsehash"
description: "Google hash map library providing memory-efficient sparse and dense hash maps (header-only)"
category: data
homepage: "https://github.com/sparsehash/sparsehash"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Header-only package generates target sparseconfig.h and config.h through the Conan recipe"
    - "OHOS musl uses standard uint16_t instead of the BSD u_int16_t spelling"
    - "Seven upstream tests and a real consumer are cross-compiled for AArch64"
  common_dependencies: []

versions:
  "2.0.4":
    status: built
    build_date: "2026-07-18"
    conan_ref: "sparsehash/2.0.4"
