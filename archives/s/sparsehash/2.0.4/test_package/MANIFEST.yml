package: sparsehash/2.0.4
homepage: "https://github.com/sparsehash/sparsehash"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "template_util_unittest; type_traits_unittest; libc_allocator_with_realloc_test; sparsetable_unittest; hashtable_test; simple_test; simple_compat_test"
upstream_tests:
  - file: src/template_util_unittest.cc
    description: "Template utility traits"
  - file: src/type_traits_unittest.cc
    description: "Internal type traits"
  - file: src/libc_allocator_with_realloc_test.cc
    description: "Realloc-capable allocator"
  - file: src/sparsetable_unittest.cc
    description: "Sparse table storage and iteration"
  - file: src/hashtable_test.cc
    description: "Hash table behavior"
  - file: src/simple_test.cc
    description: "Public sparsehash API smoke test"
  - file: src/simple_compat_test.cc
    description: "Legacy google include compatibility"

test_package_tests:
  - file: test.cpp
    description: "Consumer test for sparse_hash_map and dense_hash_map insertion, lookup, and erase"
    command: "./test_sparsehash"

assertion_count: 11
