# test_package/MANIFEST.yml
# GNU sed 4.9 — upstream test manifest
# Upstream testsuite: Autotools make check via testsuite/local.mk
# T list: ~68 Automake tests + 2 check_PROGRAMS (C)
# See: testsuite/local.mk in sed-4.9.tar.xz

package: sed/4.9
homepage: "https://www.gnu.org/software/sed/"

# Upstream test command (Automake test harness)
upstream_check_command: "make check"

# conanfile.py build() does NOT include make check (manually verified)
upstream_test_in_build: false
upstream_test_command: "手动验证：cd build-dir && TMPDIR=$HOME/tmp make check -j1"

# Upstream tests: managed via testsuite/local.mk T variable
# Approximately 68 shell/Perl tests + 2 C check programs
upstream_tests:
  - file: "testsuite/local.mk"
    source: "sed-4.9/testsuite/local.mk"
    description: "Automake test harness — ~68 tests (sh/pl) + 2 C check_PROGRAMS"
    command: "make check"

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: "test.sh"
    description: "sed --version + basic substitution + global s/// + -E regex + -i in-place"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 75
