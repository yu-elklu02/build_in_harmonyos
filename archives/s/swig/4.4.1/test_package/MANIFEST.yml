# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: swig/4.4.1
homepage: "https://www.swig.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# SWIG's make check runs CCache test suite (which fails on HMDFS due to hard link limitation)
# The main SWIG functionality (code generation) is tested via the SWIG examples
upstream_tests:
  - file: CCache/test.sh
    source: swig-4.4.1/CCache/test.sh
    description: "CCache test suite — fails on HMDFS (hard link not supported)"
    command: "make check"
  - file: Examples/Makefile
    source: swig-4.4.1/Examples/Makefile
    description: "SWIG examples — multi-language code generation tests"
    command: "make -C Examples check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.i
    description: "SWIG interface file — generates Python wrapper code via 'swig -python test.i'"
    command: "swig -python -o test_wrap.c test.i"
  - file: test.c
    description: "C function implementations matching test.i interface declarations"
    command: ""

# 测试断言总数
assertion_count: 3
