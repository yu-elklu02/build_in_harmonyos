# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.4.1"

# 软件名
software: "swig"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-23"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://prdownloads.sourceforge.net/swig/swig-4.4.1.tar.gz"
  homepage: "https://www.swig.org/"

  # 源码校验和
  sha256: "40162a706c56f7592d08fd52ef5511cb7ac191f3593cf07306a0a554c6281fcf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "PCRE2_CONFIG="
    - "PCRE2_CFLAGS=-I<pcre2>/include -DPCRE2_STATIC"
    - "PCRE2_LIBS=-L<pcre2>/lib -lpcre2-8 -lpcre2-posix"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "pcre2/10.45"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CCache-configure.patch"
  - "0002-Tools-config-config.guess.patch"
  - "0003-Tools-config-config.sub.patch"
  - "0004-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pcre2-config 脚本 prefix=/ 返回错误路径，需通过 configure 参数直接设置 PCRE2_CFLAGS/PCRE2_LIBS"
  - "SWIG 二进制内嵌安装前缀路径，conan DESTDIR 安装后路径不匹配，需设置 SWIG_LIB 环境变量"
  - "CCache 测试套件因 HMDFS 不支持硬链接而失败，不影响 SWIG 主功能"
  - "SourceForge /download URL 在 conan 中返回 HTML，需改用 prdownloads.sourceforge.net URL"

