# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: scala/2.12.21
homepage: "https://www.scala-lang.org/"

# Scala is a JVM precompiled distribution — no upstream test suite
# (no configure/make/make check). Smoke tests verify tool functionality.
upstream_check_command: "scala -version"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (JVM distribution — no source tests)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Scala tools smoke test (scala, scalac, scaladoc, scalap, fsc)"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
