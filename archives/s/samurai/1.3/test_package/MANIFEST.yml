# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: samurai/1.3
homepage: "https://git.sr.ht/~mcf/samurai"

# 上游测试命令
upstream_check_command: ""

# samurai has no `make check` target — no upstream test suite
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (samurai 无测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "smoke test: samu --version"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 2
