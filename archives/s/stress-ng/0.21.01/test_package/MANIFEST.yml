# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: stress-ng/0.21.01
homepage: "https://github.com/ColinIanKing/stress-ng"

# 上游测试命令 (stress-ng 没有 make check，使用 --version 作为 smoke test)
upstream_check_command: "stress-ng --version"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: stress-ng --version
    source: stress-ng-0.21.01/stress-ng
    description: "版本检查 smoke test"
    command: "stress-ng --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 stress-ng --version 验证二进制可用"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
