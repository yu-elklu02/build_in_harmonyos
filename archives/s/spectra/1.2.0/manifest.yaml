# 版本级 manifest
# 文件位置: archives/s/spectra/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名
software: "spectra"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-13"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/yixuan/spectra/archive/refs/tags/v1.2.0.tar.gz"

  # 源码校验和
  sha256: "fdfccacba1c77d9b4ffefae7258c760c99e3c8a2823ca87ea5b11a50d297a73b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  # eigen/3.4.0 不在 Conan 注册表中, 由 CPM.cmake 自动下载并打包
  dependencies:
    - "catch2/2.13.10-r0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-use-conan-catch2.patch"
  - "0002-increase-test-iteration-limits.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "spectra 是 header-only 库, 基于 Eigen, 使用 CMake INTERFACE 目标"
  - "Eigen 依赖通过 CPM.cmake 自动下载 (DOWNLOAD_ONLY), 无需手动管理"
  - "eigen/3.4.0 不在 Conan 注册表中 (仅有 manifest.yaml, status=built), 需在 package() 阶段将 CPM 下载的 Eigen 头文件一并打包"
  - "E092: CMake 不识别 OHOS 平台, 需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "上游测试通过 catch2/2.13.10-r0 Conan 包编译，并由 CTest 运行完整测试集"
