# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: spectra/1.2.0
homepage: "https://github.com/yixuan/spectra"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# 上游 test/CMakeLists.txt 注册 30 个 C++ 测试目标, 使用 Catch2 + CMake/CTest 框架
upstream_tests:
  - file: Example1.cpp
    source: spectra-1.2.0/test/Example1.cpp
    description: "循环拉普拉斯矩阵特征值求解 (SymEigsSolver + SymEigsShiftSolver)"
    command: "ctest -R example_144"
  - file: GenEigs.cpp
    source: spectra-1.2.0/test/GenEigs.cpp
    description: "一般矩阵特征值求解 (GenEigsSolver)"
    command: "ctest -R GenEigs"
  - file: SymEigs.cpp
    source: spectra-1.2.0/test/SymEigs.cpp
    description: "对称矩阵特征值求解 (SymEigsSolver)"
    command: "ctest -R SymEigs"
  - file: ComplexEigs.cpp
    source: spectra-1.2.0/test/ComplexEigs.cpp
    description: "复数特征值求解"
    command: "ctest -R ComplexEigs"
  - file: DavidsonSymEigs.cpp
    source: spectra-1.2.0/test/DavidsonSymEigs.cpp
    description: "Davidson 对称特征值求解 (DavidsonSymEigsSolver)"
    command: "ctest -R DavidsonSymEigs"
  - file: BKLDLT.cpp
    source: spectra-1.2.0/test/BKLDLT.cpp
    description: "Bunch-Kaufman LDLT 分解测试"
    command: "ctest -R BKLDLT"
  - file: Arnoldi.cpp
    source: spectra-1.2.0/test/Arnoldi.cpp
    description: "Arnoldi 分解测试"
    command: "ctest -R Arnoldi"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_spectra.cpp
    description: "对称矩阵特征值计算: 构造 6x6 循环拉普拉斯矩阵, 用 Spectra 求最大 2 个特征值, 与 Eigen 交叉验证"
    command: "./test_spectra"

# 测试断言总数 (近似值, 用于质量评估)
# 3 个断言: 计算成功 + 特征值误差 < 1e-9 + 交叉验证
assertion_count: 3
