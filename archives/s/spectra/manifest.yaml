# 软件级 manifest
# 文件位置: archives/s/spectra/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: spectra

# 显示名
display: "Spectra"

# 一句话描述
description: "基于 Eigen 的大规模特征值求解 C++ 模板库 (header-only)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/yixuan/spectra"

# 开源许可证（SPDX 标识）
license: MPL-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Header-only 库 (CMake INTERFACE 目标), 无需编译库文件"
    - "依赖 Eigen, 通过 CPM.cmake 自动下载 (eigen/3.4.0 不在 Conan 注册表中)"
    - "需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 (OHOS 适配)"
    - "需在 package() 阶段将 Eigen 头文件一并打包到 include/eigen3/"

  # 跨版本通用依赖
  common_dependencies:
    - eigen

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.0":
    status: built
    build_date: 2026-07-13
