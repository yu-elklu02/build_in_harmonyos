version: "5.0.1"
status: built
build_date: "2026-07-17"
build_system: autotools

source:
  url: "https://ccrma.stanford.edu/software/stk/release/stk-5.0.1.tar.gz"
  sha256: "afc35faea3bb8baacacb8d9db3fa745e4f7d8dd46f36aac5436ca377d565a184"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-realtime"
    - "--disable-shared"
    - "--enable-static"
    - "--prefix=/"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "REALTIME=OFF avoids platform audio backends and builds the portable DSP library only."
  - "The top-level all target still builds examples, so the Conan recipe invokes make -C src directly."
  - "The upstream install target expects a shared library; static packaging is installed manually."
  - "Realtime/network headers are excluded from the public package because their objects are not built with --disable-realtime."
  - "OHOS HMDFS rejects Autotools config.status temp files created with umask 077, so configure is patched to use umask 022."
  - "OHOS CI requires runnable ELF files to be self-signed, so test_package signs the generated test runner and chmods it before execution."

test:
  upstream: "No upstream make check or ctest suite is provided."
  test_package: "Links against libstk.a and verifies SineWave plus ADSR synthesis energy."
