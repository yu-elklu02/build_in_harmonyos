# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: sqlite3/3.49.1
homepage: "https://www.sqlite.org/"

# 上游测试情况：sqlite3 autoconf 包无独立测试套件，通过 test_package CRUD 验证
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角：内存数据库 CRUD + 版本验证）
test_package_tests:
  - file: test.c
    description: "sqlite3 内存数据库 CRUD 操作（建表、插入、查询）+ 结果验证"
    command: "ctest"

assertion_count: 4
