software: shpotify
display: "shpotify"
description: "A command-line interface to Spotify (pure Bash script)"
homepage: "https://github.com/hnarayanan/shpotify"
license: MIT
category: utility
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Bash 脚本包，无编译步骤，install 为文件拷贝"
    - "Shebang #!/usr/bin/env bash 兼容 OHOS"
    - "playback/search 子命令依赖 macOS osascript，仅无参数用法入口在 OHOS 可运行"
  common_dependencies:
    - bash
    - curl

versions:
  "2.1":
    status: built
    build_date: "2026-08-14"
