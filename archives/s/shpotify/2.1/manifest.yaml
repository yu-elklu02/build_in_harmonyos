software: shpotify
version: 2.1
category: utility
description: A command-line interface to Spotify (pure Bash script)
homepage: https://github.com/hnarayanan/shpotify
url: https://github.com/hnarayanan/shpotify/archive/refs/tags/2.1.tar.gz
sha256: b41d8798687be250d0306ac0c5a79420fa46619c5954286711a5d63c86a6c071
build_system: none
build_date: "2026-08-14"
configure_options: []
  # shpotify has no configure script - pure Bash tool
make_options: []
  # shpotify has no Makefile - install is a file copy
has_c_code: false
has_tests: false
  # upstream tarball ships only README.md + spotify script; no test suite
test_result: passed
  # test_package smoke test (no-args usage, bash -n, executable, shebang) passes
dependencies:
  required: []
  optional:
    - bash
    - curl
    - base64
    - grep
    - sed
    - tr
status: built
notes:
  - shpotify is a pure Bash script (spotify) with no C code, no configure
    script and no Makefile
  - Install copies spotify to bin/spotify and README.md to share/doc + licenses
  - No ELF binaries - only a Bash script
  - Shebang #!/usr/bin/env bash is OHOS-compatible
  - Upstream controls the macOS Spotify desktop app via osascript; those
    subcommands are macOS-only by design. On OHOS the runnable entry point is
    `spotify` with no arguments, which prints usage and exits 0
  - Runtime needs Bash and common coreutils (curl/base64/grep/sed/tr), all
    present on HarmonyOS PC
  - License: MIT, embedded in README.md ("Copyright and license" section) and
    the script header; upstream tarball has no standalone LICENSE file

verification:
  real_device:
    date: "2026-08-14"
    env: "HarmonyOS PC 构建环境（aarch64 OHOS，clang 15.0.4）"
    result: "pass"
