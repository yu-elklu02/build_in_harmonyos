# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: shpotify/2.1
homepage: "https://github.com/hnarayanan/shpotify"

# shpotify ships a single Bash script with no automated test suite
# (tarball contains only README.md and the spotify script; no test files,
# no test target, no Makefile).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer-side verification that runs the packaged script)
test_package_tests:
  - file: test.sh
    description: "Smoke test: spotify no-args usage, bash -n, executable + shebang"
    command: "bash test.sh"

# Assertion count (grep/checks in test.sh: Usage:, "spotify <command>",
# bash -n, -x, shebang)
assertion_count: 5
