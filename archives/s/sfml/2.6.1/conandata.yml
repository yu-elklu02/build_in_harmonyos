sources:
  url: "https://github.com/SFML/SFML/archive/refs/tags/2.6.1.tar.gz"
  sha256: "82535db9e57105d4f3a8aedabd138631defaedc593cab589c924b7d7a11ffb9d"

patches:
  - patch_file: "patches/0001-cmake-Config.cmake.patch"
    patch_description: "Recognize HarmonyOS as a Unix platform"
    patch_type: "portability"
  - patch_file: "patches/0002-src-SFML-System-Unix-ThreadImpl.cpp.patch"
    patch_description: "Disable unavailable pthread cancellation APIs on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0003-src-SFML-System-CMakeLists.txt.patch"
    patch_description: "Detect pthread_cancel/pthread_setcanceltype via CMake check_function_exists"
    patch_type: "portability"
  - patch_file: "patches/0004-test-CMakeLists-gated-runtests.patch"
    patch_description: "Gate runtests deps on module flags so ctest works with Window/Graphics disabled"
    patch_type: "portability"
