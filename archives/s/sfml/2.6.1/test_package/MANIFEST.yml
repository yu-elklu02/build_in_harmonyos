package: sfml/2.6.1
homepage: "https://www.sfml-dev.org/"
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest (test-sfml-system, test-sfml-network, via cmake.test() in build())"
upstream_tests:
  - name: test-sfml-network
    file: Packet.cpp
    source: test/src/Network/Packet.cpp
    description: "Validates sf::Packet serialization for integer types"
    command: "ctest -R test-sfml-network"
  - name: test-sfml-system
    file: Vector2.cpp
    source: test/src/System/Vector2.cpp
    description: "Validates sf::Vector2 operations"
    command: "ctest -R test-sfml-system"
test_package_tests:
  - file: test.cpp
    description: "Validates System timing and Network packet serialization APIs"
    command: "test_sfml"
assertion_count: 3
