# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: shtool/2.0.8
homepage: "https://www.gnu.org/software/shtool/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (mdate case platform-skipped on OHOS)"

upstream_tests:
  - file: test.sh
    source: shtool-2.0.8/test.sh
    description: "GNU shtool 官方测试套件；18/19 子命令测试运行，mdate 因 OHOS ls 输出解析兼容性平台限制跳过"
    command: "make check"
  - file: test.db
    source: shtool-2.0.8/test.db
    description: "GNU shtool 官方测试数据；适配时将 mdate 单项替换为平台 skip"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "消费者视角：实际运行 shtool version/echo/mkdir/install/path 子命令"
    command: "sh test.sh"
  - file: conanfile.py
    description: "Conan test() 中直接运行 shtool version 和 echo，并调用 test.sh"
    command: "conan test"

assertion_count: 9
