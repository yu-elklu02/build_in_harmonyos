knowledge_gained:
  - "shtool 2.0.8 是纯 Shell 命令行工具，Autotools 构建生成 shtool/shtoolize 后通过 make install 安装到 usr/bin"
  - "命令行工具包需要软件级 commands.json，并在 test_package 中真实运行 shtool 子命令验证功能"
