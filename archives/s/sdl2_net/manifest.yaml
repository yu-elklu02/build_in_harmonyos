software: sdl2_net
display: "SDL2_net"
description: "Portable TCP and UDP networking library for SDL2"
category: network
homepage: "https://github.com/libsdl-org/SDL_net"
license: "Zlib"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream CMake build and disable sample programs explicitly"
    - "Keep SDL2 and SDL2_net shared options identical"
    - "Install one real unversioned shared library on OHOS and retain upstream versioning elsewhere"
    - "Verify the shared-library SONAME, NEEDED, and RPATH contract on HMDFS"
    - "Atomically sign native OHOS shared libraries and test executables before runtime"
  common_dependencies:
    - sdl2

versions:
  "2.2.0":
    status: pending
    build_date: "2026-07-23"
    conan_ref: "sdl2_net/2.2.0"
