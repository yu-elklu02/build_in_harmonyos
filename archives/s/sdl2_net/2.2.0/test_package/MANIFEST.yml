package: "sdl2_net/2.2.0"
homepage: "https://github.com/libsdl-org/SDL_net"

upstream_check_command: "cmake -S cmake/test -B <build> && cmake --build <build>"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - id: upstream-cmake-installed-consumer
    file: "test_upstream_cmake_consumer.c"
    source: "SDL2_net-2.2.0/cmake/test/main.c"
    description: "Installed CMake package lookup, link, and process-start consumer"
    command: "./test_upstream_cmake_consumer"
    independent_count: 1
    note: "The vendored source is byte-identical to upstream; shared and static use the same input and are counted once"

test_package_tests:
  - id: init-version-byteorder
    file: "test_init_version_byteorder.c"
    description: "Strict SDL/SDL_net initialization, linked version, and 16/32-bit network byte order"
    command: "./test_init_version_byteorder"
  - id: packet-boundaries
    file: "test_packet_boundaries.c"
    description: "Single packet minimum allocation, large resize, and packet-vector lifecycle"
    command: "./test_packet_boundaries"
  - id: resolve-errors
    file: "test_resolve_errors.c"
    description: "Local overlong-host error plus numeric loopback and wildcard address conversion"
    command: "./test_resolve_errors"
  - id: udp-loopback
    file: "test_udp_loopback.c"
    description: "UDP send and receive with payload verification on 127.0.0.1"
    command: "./test_udp_loopback"
  - id: tcp-loopback
    file: "test_tcp_loopback.c"
    description: "TCP listen, connect, accept, and bidirectional payload verification on 127.0.0.1"
    command: "./test_tcp_loopback"
  - id: socket-set
    file: "test_socket_set.c"
    description: "Socket-set add, readiness, receive, delete, and cleanup using local UDP"
    command: "./test_socket_set"

test_counting:
  unit: "independent executable flow"
  upstream_independent_total: 1
  adapted_independent_total: 6
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

execution:
  status: not_run
  reason: "Formal W3 requires freshly consuming sdl2/2.30.10 as a published artifact; the frozen local candidate is not sufficient"
