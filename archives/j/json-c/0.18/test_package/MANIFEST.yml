# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: json-c/0.18
homepage: "https://github.com/json-c/json-c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test1.c
    source: json-c-0.18/tests/test1.c
    description: "Core JSON parse/format test"
    command: "./test1"
  - file: tests/test_null.c
    source: json-c-0.18/tests/test_null.c
    description: "Null object handling test"
    command: "./test_null"
  - file: tests/test_parse.c
    source: json-c-0.18/tests/test_parse.c
    description: "JSON token parsing test"
    command: "./test_parse"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建/序列化/反序列化 JSON 对象"
    command: "./test_json-c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
