package: jsoncpp/1.9.8
homepage: "https://github.com/open-source-parsers/jsoncpp"

upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# Logical tests are counted once even though shared and static packages both
# execute them. CTest wrappers, writer modes, and individual assertions are not
# counted as additional cases.
upstream_tests:
  - file: src/test_lib_json/main.cpp
    source: jsoncpp-1.9.8/src/test_lib_json/main.cpp
    description: "127 fixtures registered and executed on HarmonyOS; the _WIN32-only escapeTabCharacterWindows fixture is excluded"
    command: "ctest --test-dir build -R '^jsoncpp_test$' --output-on-failure"
    case_count: 127
    excluded_count: 1
  - file: test/data/*.json
    source: jsoncpp-1.9.8/test/data
    description: "69 distinct parser/writer JSON inputs; three writer-mode passes are not recounted"
    command: "ctest --test-dir build -R '^jsoncpp_readerwriter$' --output-on-failure"
    case_count: 69
  - file: test/jsonchecker/*.json
    source: jsoncpp-1.9.8/test/jsonchecker
    description: "27 runnable JSONChecker inputs after the upstream runner excludes 9 known cases"
    command: "ctest --test-dir build -R '^jsoncpp_readerwriter_json_checker$' --output-on-failure"
    case_count: 27
    excluded_count: 9

test_package_tests:
  - file: unit.cpp
    description: "One consumer flow covering Json::Value object, array, scalar, and default-value APIs"
    command: "ctest --test-dir build -R '^jsoncpp_unit_consumer$' --output-on-failure"
  - file: integration.cpp
    description: "One parse-modify-write-reparse integration flow using the installed CMake target"
    command: "ctest --test-dir build -R '^jsoncpp_integration_consumer$' --output-on-failure"
  - file: ohos_portability.cpp
    description: "One HarmonyOS flow covering target identity, arm64 ABI, UInt64, and Unicode parsing"
    command: "ctest --test-dir build -R '^jsoncpp_ohos_portability$' --output-on-failure"

assertion_count: 26
