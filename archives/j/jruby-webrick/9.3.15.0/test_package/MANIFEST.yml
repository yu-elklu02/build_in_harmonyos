package: jruby-webrick/9.3.15.0
homepage: "https://github.com/jruby/jruby"

upstream_check_command: "ruby test/webrick/test_httpserver.rb"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: test/webrick/test_httpserver.rb
    source: "https://github.com/ruby/webrick/blob/master/test/webrick/test_httpserver.rb"
    description: "WEBrick HTTPServer unit tests (requires Ruby/JRuby runtime)"
    command: "ruby -Ilib -Itest test/webrick/test_httpserver.rb"

# test_package tests (Python validation of .rb file content)
test_package_tests:
  - file: test_webrick.py
    description: "Python validation of WEBrick .rb files: module/class declarations, file existence, SSL/proxy support"
    assertions:
      - "webrick.rb exists and non-empty"
      - "webrick.rb contains module WEBrick"
      - "webrick/server.rb contains class SimpleServer or class GenericServer"
      - "webrick/httpserver.rb contains class HTTPServer"
      - "webrick/httprequest.rb contains class HTTPRequest"
      - "webrick/httpresponse.rb contains class HTTPResponse"
      - "webrick/config.rb contains module Config"
      - "webrick/ directory has >= 15 .rb files"
      - "webrick/ssl.rb exists (SSL support)"
      - "webrick/httpproxy.rb exists (proxy support)"

assertion_count: 10
