# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jackson-core/2.14.1
homepage: "https://github.com/FasterXML/jackson-core"

# 上游测试通过 Maven Surefire 运行（./mvnw clean package -B，package 阶段含 test）
# 上游测试框架：JUnit 5 (junit-jupiter 5.8.2) + JUnit Vintage (junit-vintage-engine 5.8.2)
upstream_check_command: "./mvnw clean package -B"
upstream_test_in_build: true
upstream_test_command: "./mvnw clean package -B"

# 上游 JUnit 测试用例（在 build() 中运行）
# 统计来源：src/test/java/com/fasterxml/jackson/core/ 目录
# 223 个测试文件，104 个 @Test 方法
upstream_tests:
  - file: src/test/java/com/fasterxml/jackson/core/
    source: jackson-core-2.14.1.tar.gz/src/test/java/com/fasterxml/jackson/core/
    description: "上游 JUnit 测试套件（104 个 @Test 方法，223 个测试文件）"
    command: "./mvnw clean package -B"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: test.sh
    description: "编译并运行 Java 测试程序，调用 jackson-core JsonFactory/JsonParser API 解析 JSON (R34 实质性验证)"
    command: "bash test.sh"

# 测试断言总数
# 上游：104 个 @Test 方法（在 build() 中通过 ./mvnw clean package 运行，package 阶段含 test）
# test_package：9 个断言（1 JAR + 1 编译 + 6 解析 + 1 PASS）
assertion_count: 113
