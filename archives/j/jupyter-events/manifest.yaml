software: jupyter-events
display: "Jupyter Event System"
description: "Jupyter Event System — 结构化事件日志与 schema 验证（纯 Python CLI）"
category: data
homepage: https://github.com/jupyter/jupyter_events
license: BSD-3-Clause
build_system: hatchling

ohos_adaptation:
  key_points:
    - "纯 Python 包，无 C/C++ 编译，conan recipe 用 pip install 装入 staging 后整体拷贝"
    - "运行时依赖为 pip 包（referencing/jsonschema/pyyaml 等），通过 PYTHONPATH 提供，不声明 conan requires"
    - "OHOS Python 的 subprocess 对裸命令名 PATH 解析异常（posix_spawn quirk），测试与 launcher 需用绝对路径/模块方式调用"
    - "pyyaml/rpds-py 在社区源有 ohos_aarch64 预编译 wheel，pip install 直接命中，无需本地编译"
  common_dependencies: []

versions:
  "0.12.0":
    status: built
    build_date: "2026-08-01"
