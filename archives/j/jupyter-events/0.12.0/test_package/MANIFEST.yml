# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: jupyter-events/0.12.0
homepage: "https://github.com/jupyter/jupyter_events"

# Upstream test command — pure-Python hatchling package, no autotools/CMake:
#   python -m pytest tests/ -v  (requires pytest + pytest-asyncio + pytest-console-scripts)
upstream_check_command: "python -m pytest tests/ -v"

# conanfile.py build() method - upstream test integration
# (not integrated: 7 CLI subprocess tests are broken by an OHOS subprocess
#  PATH quirk; CLI behavior is covered by test_package instead)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: tests/test_cli.py
    source: jupyter_events-0.12.0/tests/test_cli.py
    description: "CLI tests (--version, --help, validate good/bad/malformed schemas)"
    command: "python -m pytest tests/test_cli.py"
  - file: tests/test_logger.py
    source: jupyter_events-0.12.0/tests/test_logger.py
    description: "EventLogger tests (config file, schema registration)"
    command: "python -m pytest tests/test_logger.py"
  - file: tests/test_schema.py
    source: jupyter_events-0.12.0/tests/test_schema.py
    description: "EventSchema tests (load, validate, yaml/json)"
    command: "python -m pytest tests/test_schema.py"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run jupyter-events binary: --version, --help, validate good (exit 0) and bad (exit 1) schemas"
    command: "jupyter-events --version && jupyter-events --help && jupyter-events validate schemas/good.json && jupyter-events validate schemas/bad.json"
  - file: test.sh
    description: "Shell script running the same CLI assertions on the jupyter-events binary"
    command: "sh test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 4
