patches_applied: []

knowledge_gained:
  - "纯 Python CLI：conan recipe 用 `pip install --prefix=<stage>` 装包 + `pip install --target=<site>` 装运行时依赖，package() 整体拷贝，package_info() 设 PYTHONPATH"
  - "OHOS Python subprocess.run 对裸命令名（非绝对路径）做 PATH 查找失败（posix_spawn quirk），脚本/测试须用绝对路径调用二进制"
  - "pytest tmp_path 在 HMDFS 上报 'temporary directory not owned by current user'，需用 --basetemp 指定可写目录"
  - "社区源 pypi.cnb.cool 提供 pyyaml/rpds-py 的 cp312-ohos_aarch64 预编译 wheel，pip 直接命中免编译"
