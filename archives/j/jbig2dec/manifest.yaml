software: jbig2dec
display: "jbig2dec"
description: "JBIG2 decoder library"
category: doc
homepage: "https://github.com/ArtifexSoftware/jbig2dec"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "E007: config.guess 不认 HarmonyOS → 用补丁修改 config.guess/config.sub（禁止 --build/--host 绕过）"
    - "HMDFS TMPDIR 权限问题，需重定向到 ~/.conan_build_tmp"
    - "configure 脚本 umask 077 需替换为 umask 022"
    - "禁用 libpng 可选依赖（--without-libpng）"
  common_dependencies: []

versions:
  "0.20":
    status: published
    build_date: "2026-04-24"
  "0.20.1":
    status: built
    build_date: "2026-07-22"
