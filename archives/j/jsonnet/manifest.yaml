software: jsonnet
display: "Jsonnet"
description: "Jsonnet is a data templating language for app and tool developers"
category: data
homepage: "https://jsonnet.org/"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "HMDFS 不支持 ln -sf 覆盖，需使用 rm -f && ln -s 替代"
    - "纯 Makefile 构建，无 configure 步骤"
    - "内置 rapidyaml 和 md5 库，无外部依赖"
    - "CMakeLists.txt 版本要求过旧 (cmake_minimum_required 2.8.7)，使用 Makefile 构建"
  common_dependencies: []

versions:
  "v0.20.0":
    status: built
    build_date: "2026-07-15"
