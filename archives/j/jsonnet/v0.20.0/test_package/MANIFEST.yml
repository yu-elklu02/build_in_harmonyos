# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jsonnet/v0.20.0
homepage: "https://jsonnet.org/"

# 上游测试命令 (make test runs all test suites)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: core/libjsonnet_test_snippet.c
    source: jsonnet-v0.20.0/core/libjsonnet_test_snippet.c
    description: "C API snippet evaluation test"
    command: "./libjsonnet_test_snippet"
  - file: core/libjsonnet_test_file.c
    source: jsonnet-v0.20.0/core/libjsonnet_test_file.c
    description: "C API file evaluation test"
    command: "./libjsonnet_test_file"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: evaluate Jsonnet expression via C API"
    command: "./test_jsonnet"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
