# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: judy/1.0.5
homepage: "https://judy.sourceforge.net/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream test is integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test/Checkit
    source: judy-1.0.5/test/Checkit
    description: "Checkit: tests Judy1/JudyL/JudyHS/JudySL functionality"
    command: "./Checkit"

# test_package consumer test
test_package_tests:
  - file: test.c
    description: "Consumer test: Judy1 bitmap set/test and JudyL insert/get"
    command: "./test_judy"

# Approximate assertion count
assertion_count: 5
