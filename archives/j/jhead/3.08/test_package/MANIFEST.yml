# test_package/MANIFEST.yml
# jhead has a test suite in tests/ directory (runtests script)
# The test_package runs the binary directly (R34: test must depend on tested package)

package: jhead/3.08
homepage: "https://github.com/Matthias-Wandel/jhead"

# jhead has a 'tests/runtests' script but no 'make check' target
upstream_check_command: "cd tests && bash runtests"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tests/runtests
    source: jhead-3.08/tests/runtests
    description: "Regression test suite: parses normal and strange JPEG files, tests date manipulation, thumbnail operations"
    command: "cd tests && bash runtests"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_jhead.sh
    description: "Run jhead -V and jhead -h to verify binary works"
    command: "sh test_jhead.sh"

# Approximate assertion count
assertion_count: 2
