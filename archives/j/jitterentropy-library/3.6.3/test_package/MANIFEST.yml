# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jitterentropy-library/3.6.3
homepage: "https://github.com/smuellerDD/jitterentropy-library"

# 上游测试命令 (make check 运行上游自带测试)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：初始化熵收集器、读取随机熵、验证返回值"
    command: "./test_jitterentropy"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
