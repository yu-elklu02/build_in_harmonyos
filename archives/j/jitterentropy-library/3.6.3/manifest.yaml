software: jitterentropy-library
version: "3.6.3"
status: built
build_date: "2026-05-29"
build_duration: 120
build_system: makefile

source:
  url: "https://github.com/smuellerDD/jitterentropy-library/archive/refs/tags/v3.6.3.tar.gz"
  size: 118784
  sha256: "9b3819e275e6473a94c70cfaae7cc2a87a11f60b862e694745daa5d232b0eea3"

build:
  system: makefile
  compiler: clang
  configure_options: []
  make_options:
    - "CC=clang"
    - "PREFIX=/storage/Users/currentUser/usr/local"
  parallel_jobs: 1
  build_log: "reports/build.log"

artifacts:
  shared_library: "lib/libjitterentropy.so.3.6.3"
  static_library: "lib/libjitterentropy.a"
  headers:
    - "include/jitterentropy.h"
    - "include/jitterentropy-base-user.h"
  symlinks:
    - "lib/libjitterentropy.so.3 -> libjitterentropy.so.3.6.3"
    - "lib/libjitterentropy.so -> libjitterentropy.so.3"

packaging:
  archive: "packaging/jitterentropy-library-3.6.3-ohos-aarch64.tar.gz"
  size: 118784
  strip: true
  elf_signed: true

quality_gates:
  G0_clean_build: passed
  G1_binary_integrity: passed
  G2_functionality: passed
  G3_portability: passed
  G4_archive_integrity: passed

test_results:
  test_program: "test_jitterentropy.c"
  test_passed: true
  test_output: "reports/test-report.md"

knowledge_gained:
  - "No configure step required, direct Makefile compilation"
  - "Must set CC=clang for OHOS platform"
  - "install command unavailable, need manual directory creation and file copying"
  - "Source tarball contains symbolic link loop in tests/raw-entropy/recording_userspace, must exclude during extraction"
  - "Makefile uses egrep which is obsolescent, shows warnings but not fatal"
  - "Library API simple: jent_entropy_init(), jent_entropy_collector_alloc(), jent_read_entropy(), jent_entropy_collector_free()"

issues_resolved:
  - issue: "SSL certificate verification failed when downloading from GitHub"
    solution: "Used curl -k to skip certificate verification"
  - issue: "install command not available in OHOS"
    solution: "Manual directory creation and file copying with cp and ln -sf"

differences_from_previous:
  version: "3.4.0"
  changes:
    - "Version bump from 3.4.0 to 3.6.3 (minor version update)"
    - "No significant API changes, backward compatible"
    - "Build process identical to 3.4.0"
    - "Same manual installation approach required"