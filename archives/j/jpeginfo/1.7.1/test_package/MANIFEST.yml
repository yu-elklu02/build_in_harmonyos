# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e
package: jpeginfo/1.7.1
homepage: "https://github.com/tjko/jpeginfo"

# Upstream test command (for analysis)
upstream_check_command: "make test"

# conanfile.py build() method — upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (from test/ directory)
upstream_tests:
  - file: test/test.py
    source: jpeginfo-1.7.1/test/test.py
    description: "Python3 test suite: 15 tests covering basic output, broken image, check mode, comments, CSV, grayscale, JSON, MD5, SHA-256, SHA-512, progressive detection, version"
    command: "python3 test/test.py -v"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Runs jpeginfo --version and processes a minimal JPEG file to verify binary functionality"
    command: "conan test ."

# Approximate assertion count
assertion_count: 18
