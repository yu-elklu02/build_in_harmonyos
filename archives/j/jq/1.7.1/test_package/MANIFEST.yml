# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jq/1.7.1
homepage: "https://jqlang.github.io/jq/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/jqtest
    source: jq-1.7.1/tests/jqtest
    description: "jq language and filter tests"
    command: "./tests/jqtest"
  - file: tests/onigtest
    source: jq-1.7.1/tests/onigtest
    description: "oniguruma regex integration tests"
    command: "./tests/onigtest"
  - file: tests/utf8test
    source: jq-1.7.1/tests/utf8test
    description: "UTF-8 handling tests"
    command: "./tests/utf8test"
  - file: tests/base64test
    source: jq-1.7.1/tests/base64test
    description: "base64 encode/decode tests"
    command: "./tests/base64test"
  - file: tests/optionaltest
    source: jq-1.7.1/tests/optionaltest
    description: "optional features tests"
    command: "./tests/optionaltest"
  - file: tests/manonigtest
    source: jq-1.7.1/tests/manonigtest
    description: "manual oniguruma tests"
    command: "./tests/manonigtest"
  - file: tests/shtest
    source: jq-1.7.1/tests/shtest
    description: "shell integration tests (known platform limitation: BusyBox script -e)"
    command: "./tests/shtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Runs jq binary to verify JSON processing and regex (oniguruma) support"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
