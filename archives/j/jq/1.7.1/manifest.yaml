knowledge_gained:
  - "含 autotools 子模块（oniguruma）的项目需单独修复子模块 config.guess/config.sub"
  - "HMDFS 文件系统 umask 077 导致 config.status 创建的临时目录跨 uid 不可访问，需改为 umask 000"
  - "jq --with-oniguruma=builtin 启用 bundled oniguruma，完整正则表达式支持"
  - "BusyBox script 不支持 -e 选项，导致 shtest 失败（平台限制，非功能问题）"

