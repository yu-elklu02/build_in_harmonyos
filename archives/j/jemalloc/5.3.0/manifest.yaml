# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-cxx"
    - "--disable-initial-exec-tls"
    - "--disable-libdl"
    - "--disable-syscall"
    - "CFLAGS=-Wno-array-bounds"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "JEMALLOC_CXX_THROW incompatible with OHOS stdlib.h, must use --disable-cxx"
  - "rtree.h RTREE_CACHE_CHECK_L2 macro causes array-bounds warning at i=0, need -Wno-array-bounds"
  - "config.guess needs HarmonyOS (__OHOS__) detection and portable TMPDIR"
  - "config.sub needs ohos-linux triplet recognition"

