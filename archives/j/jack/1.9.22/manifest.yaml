software: jack
version: "1.9.22"
status: built
build_system: waf
build_date: "2026-07-29"

source:
  url: "https://github.com/jackaudio/jack2/archive/refs/tags/v1.9.22.tar.gz"
  sha256: "1e42b9fc4ad7db7befd414d45ab2f8a159c0b30fcd6eee452be662298766a849"
  tar_format: tar.gz

build:
  system: waf
  configure_options:
    - "--prefix=/"
    - "--libdir=/lib"
    - "--pkgconfigdir=/lib/pkgconfig"
    - "--platform=linux"
    - "--classic"
    - "--autostart=none"
    - "--alsa=no"
    - "--samplerate=no"
    - "--systemd=no"
    - "--tests=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-common-JackControlAPI.cpp.patch"
  - "0002-linux-alsa-hammerfall.c.patch"
  - "0003-posix-JackPosixThread.h.patch"
  - "0004-waflib-Context.py.patch"
  - "0005-posix-JackPosixThread.cpp.patch"
  - "0006-common-JackControlAPI-signal.patch"

knowledge_gained:
  - "jack2 uses a bundled waf build system; Conan recipe stages installation with --prefix=/ and waf install --destdir=<package_folder>."
  - "OpenHarmony libc may expose pthread cancellation constants while omitting pthread cancellation functions; the OHOS recipe defines JACK_DISABLE_PTHREAD_CANCEL and patches gate cancellation behavior on that feature switch."
  - "Bundled waf 2.0.12 uses imp.new_module, which is incompatible with Python 3.12; patch uses types.ModuleType."
  - "jack2 waf treats --dbus as a value-less enable flag; omitting --dbus keeps DBus off, while --dbus=no is invalid and fails configure."
  - "Knowledge drafts E319 and E320 record the bundled Waf/Python 3.12 module-loader repair and the joinable-thread lifecycle fallback required when pthread cancellation APIs are absent."
  - "qjackctl only needs the JACK client library/package metadata; first dependency PR disables ALSA, DBus, samplerate, systemd, optional network codecs, and upstream tests."

patch_classification:
  - file: 0001-common-JackControlAPI.cpp.patch
    type: platform_compat
    platform_only: true
    guard: "defined(PTHREAD_CANCEL_ASYNCHRONOUS) && !defined(JACK_DISABLE_PTHREAD_CANCEL)"
  - file: 0002-linux-alsa-hammerfall.c.patch
    type: platform_compat
    platform_only: false
    guard: "!defined(__ANDROID__) && defined(PTHREAD_CANCEL_ASYNCHRONOUS) && !defined(JACK_DISABLE_PTHREAD_CANCEL)"
  - file: 0003-posix-JackPosixThread.h.patch
    type: platform_compat
    platform_only: false
    guard: "defined(PTHREAD_CANCEL_ASYNCHRONOUS)"
  - file: 0004-waflib-Context.py.patch
    type: python_compat
    platform_only: false
    guard: "Python 3.12+"
  - file: 0005-posix-JackPosixThread.cpp.patch
    type: platform_compat
    platform_only: true
    guard: "defined(JACK_DISABLE_PTHREAD_CANCEL) selects SIGUSR1 fallback; otherwise pthread_cancel()"
  - file: 0006-common-JackControlAPI-signal.patch
    type: platform_compat
    platform_only: true
    guard: "defined(JACK_DISABLE_PTHREAD_CANCEL) keeps SIGUSR1 unblocked for targeted thread exit"
