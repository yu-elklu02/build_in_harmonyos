package: jack/1.9.22
homepage: https://jackaudio.org/

upstream_test_source: true
upstream_test_command: "python3 ./waf configure --tests=yes && python3 ./waf build"
upstream_test_in_build: false
upstream_test_reason: "The dependency PR builds a minimal cross-platform JACK package and disables upstream tests to avoid server/audio-device runtime requirements on OHOS CI."

test_type: consumer_smoke
test_sources:
  - "test_jack.cpp"

verification_steps:
  - "Find jack through Conan CMakeDeps as jack::jack"
  - "Link a C++ consumer against libjack"
  - "Execute JACK version, size-limit, and ringbuffer API checks without requiring a running jackd server"

adapted_tests:
  total: 1
  scope: "Conan test_package consumer smoke only"

assertion_count: 10
