software: janet
display: "Janet"
description: "Janet is a functional and imperative programming language and runtime. Lisp-like, C-level performance, embeddable."
category: library
homepage: "https://janet-lang.org"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "自定义 Makefile 编译，无需 configure 步骤，直接 make 即可"
    - "OHOS 缺少 pthread_cancel()，需用 SIGUSR1 信号替代线程取消（ev.c 补丁）"
    - "2 个 OHOS 平台限制性测试失败（suite-ev.janet 文件管道写入 + Unix Domain Socket SO_REUSEADDR）"
  common_dependencies: []

versions:
  "1.41.2":
    status: built
    build_date: "2026-07-16"
    format: conan