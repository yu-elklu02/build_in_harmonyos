sources:
  url: "https://github.com/janet-lang/janet/archive/refs/tags/v1.41.2.tar.gz"
  sha256: "168e97e1b790f6e9d1e43685019efecc4ee473d6b9f8c421b49c195336c0b725"

patches:
  - patch_file: "patches/0001-src-core-ev.c.patch"
    patch_description: "将 ev.c 中 3 处 JANET_ANDROID 条件宏扩展为 defined(JANET_ANDROID)||defined(JANET_NO_PTHREAD_CANCEL)，使缺少 pthread_cancel() 的平台使用 SIGUSR1 信号替代线程取消机制"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile-bootstrap-cflags.patch"
    patch_description: "在 BOOT_CFLAGS 末尾追加 $(CFLAGS)，使命令行 CFLAGS（如 -DJANET_NO_PTHREAD_CANCEL）也能被 bootstrap 编译使用。generic POSIX 构建系统修复，不引入平台宏"
    patch_type: "backport"