# test_package/MANIFEST.yml
# 上游官方测试声明文件；CI (build_and_test.sh L0e) 强制要求此文件存在
package: janet/1.41.2
homepage: https://janet-lang.org

# build() 已集成上游测试 — 通过 conanfile._run_upstream_tests() 逐个运行 test/suite*.janet
upstream_test_in_build: true
upstream_test_command: "build/janet test/suite*.janet"
upstream_tests:
  - type: unit
    count: 2610
    framework: "janet-suite"
    description: "janet 上游官方测试套件，包含 suite-ev.janet 等测试文件，通过 build/janet 逐个运行"
    known_failures: 2
    failure_details: "suite-ev.janet 中 2 个 OHOS 平台限制性失败：file writing 1(os/execute 管道) 和 unix-domain socket reuseaddr"

# test_package 自带测试（消费者视角，链接 libjanet 调真实导出符号）
test_package_tests:
  - file: test.c
    description: "链接 libjanet，调用 janet_init/janet_deinit 验证 janet C API 可用"
    command: "ctest test_janet"

assertion_count: 1