source:
  url: "https://github.com/janet-lang/janet/archive/refs/tags/v1.41.2.tar.gz"
  sha256: "168e97e1b790f6e9d1e43685019efecc4ee473d6b9f8c421b49c195336c0b725"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-core-ev.c.patch"
  - "0002-Makefile-bootstrap-cflags.patch"

knowledge_gained:
  - "OHOS 与 Android 类似缺少 pthread_cancel()，需用 SIGUSR1 信号替代线程取消。ev.c 中 JANET_ANDROID 宏需扩展为 defined(JANET_ANDROID)||defined(JANET_NO_PTHREAD_CANCEL)，通过 conanfile.py 编译探测 pthread_cancel 可用性，不可用时定义 JANET_NO_PTHREAD_CANCEL 功能宏（R8 合规，避免平台宏 __OHOS__）"
  - "janet suite-ev.janet 测试中有 2 个 OHOS 平台限制性失败：file writing 1(os/execute 管道) 和 unix-domain socket reuseaddr"
  - "janet 使用自定义 Makefile 编译，无需 configure 步骤，直接 make 即可"
  - "Makefile 使用 -Wl,-soname,libjanet.so.1.41 编译共享库，package() 必须创建 soname 符号链接 libjanet.so.1.41 → libjanet.so，否则运行时链接器找不到 NEEDED 条目"

ci_fixes:
  - date: "2026-07-16"
    build: 4065
    step: conan-build-test
    root_cause: "Makefile 设置 SOAME=libjanet.so.1.41，但 conanfile.py 的 package() 只复制 libjanet.so 而未创建版本化 soname 符号链接，导致 test_package 运行时 libjanet.so.1.41 找不到"
    fix: "在 package() 中创建 os.symlink('libjanet.so', 'libjanet.so.1.41')"
    status: "waiting CI"
  - date: "2026-07-16"
    build: 4074
    step: conan-build-test
    root_cause: "test_package 可执行文件链接了 libjanet.so.1.41（SONAME），但 conanrun 环境未设置 LD_LIBRARY_PATH 包含 janet 库目录，运行时动态链接器找不到 SONAME 条目"
    fix: "在 package_info() 中添加 self.runenv_info.append_path('LD_LIBRARY_PATH', os.path.join(self.package_folder, 'lib'))"
    status: "waiting CI"
  - date: "2026-07-18"
    build: 7699
    step: conan-build-test
    root_cause: "Makefile 中 BOOT_CFLAGS 未包含 $(CFLAGS)，bootstrap 编译忽略命令行 CFLAGS（含 -DJANET_NO_PTHREAD_CANCEL），导致 ev.c 仍调用 pthread_cancel() 导致链接错误 undefined symbol: pthread_cancel"
    fix: "创建 patches/0002-Makefile-bootstrap-cflags.patch，在 BOOT_CFLAGS 末尾追加 $(CFLAGS)，使命令行 CFLAGS 也能被 bootstrap 编译使用"
    status: "waiting CI"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/janet-1.41.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/janet-1.41.2.work
  source_orig_hash: 12802863e0388b37
  source_work_hash: fba38c25de925c0e
  generated_at: '2026-05-28T10:57:56'
  patches_count: 2

patch_classification:
  - file: 0001-src-core-ev.c.patch
    type: platform_compat
    description: "将 ev.c 中 3 处 JANET_ANDROID 条件宏扩展为 defined(JANET_ANDROID)||defined(JANET_NO_PTHREAD_CANCEL)，使缺少 pthread_cancel() 的平台使用 SIGUSR1 信号替代线程取消机制"
    platform_only: false
    guard: '#if defined(JANET_ANDROID) || defined(JANET_NO_PTHREAD_CANCEL)'
  - file: 0002-Makefile-bootstrap-cflags.patch
    type: build_system
    description: "在 BOOT_CFLAGS 末尾追加 $(CFLAGS)，使命令行 CFLAGS 也能被 bootstrap 编译使用。generic POSIX 构建系统修复，不引入平台宏"
    platform_only: false
    guard: 'BOOT_CFLAGS += $(CFLAGS)'
