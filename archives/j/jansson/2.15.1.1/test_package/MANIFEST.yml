# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jansson/2.15.1
homepage: "https://github.com/akheron/jansson"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/suites/api/test_simple.c
    source: jansson-2.15.1/test/suites/api/test_simple.c
    description: "Simple API tests"
    command: "./test_simple"
  - file: test/suites/api/test_pack.c
    source: jansson-2.15.1/test/suites/api/test_pack.c
    description: "json_pack() API tests"
    command: "./test_pack"
  - file: test/suites/api/test_unpack.c
    source: jansson-2.15.1/test/suites/api/test_unpack.c
    description: "json_unpack() API tests"
    command: "./test_unpack"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: encode/decode/parse JSON with jansson API"
    command: "./test_jansson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 215
