# test_package/MANIFEST.yml
# Upstream and consumer test declaration for CI L0/L1 quality gates.

package: jsmn/1.1.0
homepage: "https://github.com/zserge/jsmn"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test CC=<conan tools.build:compiler_executables.c>"

upstream_tests:
  - file: test/tests.c
    source: jsmn-1.1.0/test/tests.c
    description: "Default parser behavior test suite"
    command: "make test_default"
  - file: test/tests.c
    source: jsmn-1.1.0/test/tests.c
    description: "Strict JSON parser behavior test suite"
    command: "make test_strict"
  - file: test/tests.c
    source: jsmn-1.1.0/test/tests.c
    description: "Parent-link token behavior test suite"
    command: "make test_links"
  - file: test/tests.c
    source: jsmn-1.1.0/test/tests.c
    description: "Strict parser with parent-link token behavior test suite"
    command: "make test_strict_links"

test_package_tests:
  - file: test.c
    description: "Consumer test: compile and parse object, array and primitive tokens with jsmn API"
    command: "./test_jsmn"

assertion_count: 324
