software: jbigkit
version: "2.1"
build_system: makefile
status: built
source:
  url: "https://www.cl.cam.ac.uk/~mgk25/jbigkit/download/jbigkit-2.1.tar.gz"
  sha256: "de7106b6bfaf495d6865c7dd7ac6ca1381bd12e0d81405ea81e7f2167263d932"
build:
  system: makefile        # 手写 Makefile，非 cmake/autotools/meson（生成器不支持，手写 recipe）
  targets: ["libjbig.a"]  # 只编 T.82 的 libjbig（libtiff 用它），跳过 jbig85/tstcodec
  cflags: "-fPIC -O2"     # -fPIC：静态库要能链进 libtiff.so 等共享库
  ar_ranlib: "硬编码 ar/ranlib → 替 hnp llvm-ar/llvm-ranlib"
  cc: clang
libs:
  - jbig                  # libjbig.a（静态）
requires: []              # 无外部依赖
knowledge_gained:
  - "libtiff 的 JBIG codec 依赖（T.82）；只需 libjbig，不需 jbig85(T.85)"
  - "手写 Makefile：libjbig/Makefile 的 ar/ranlib 硬编码非 $(AR)，OHOS 须替 llvm-ar/llvm-ranlib"
  - "静态库 + -fPIC（libtiff.so 链它），无 .so 故无需签名；test_package 走 link+run（非 dlopen）"
verified:
  device: "HarmonyOS PC 2in1 (3QC0124C11000718), ohos-sdk 26.0.0.18"
  date: "2026-07-11"
  evidence: "裸 conan create rc=0；make libjbig.a（llvm-ar/ranlib 归档）；test link+run jbg_dec_init 通过；libjbig.a 含 T jbg_dec_init"
