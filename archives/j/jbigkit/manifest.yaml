software: jbigkit
display: "JBIG-KIT"
description: "Lossless JBIG (ITU-T T.82) bi-level image compression library"
category: gfx
homepage: "https://www.cl.cam.ac.uk/~mgk25/jbigkit/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 Makefile（非 cmake/autotools/meson）；libjbig/ 下 make libjbig.a"
    - "Makefile 硬编码 ar/ranlib → 替 hnp llvm-ar/llvm-ranlib"
    - "静态库 + -fPIC（供 libtiff.so 等共享库链接）"
  common_dependencies: []

versions:
  "2.1":
    status: built
    build_date: "2026-07-11"
    format: conan
    note: "libtiff 的 JBIG codec 依赖（T.82）"
