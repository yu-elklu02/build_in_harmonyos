software: jackson-jr
display: "Jackson jr"
description: "FasterXML Jackson 的轻量级 JSON 数据绑定、组合器与简单 Tree 实现"
category: foundation
homepage: "https://github.com/FasterXML/jackson-jr"
license: "Apache-2.0"
build_system: maven

ohos_adaptation:
  key_points:
    - "使用经校验的同一 JDK 17 构建；普通运行时类兼容 Java 8，版本化 JPMS 描述符为 Java 9"
    - "构建与 test_package 共享 conandata 中固定版本和 SHA-256 的 BiSheng JDK 17 回退"
    - "运行 Maven reactor 的完整上游测试，而不是仅重打包预编译 JAR"
    - "提供五个精确模块 JAR，并逐个执行非空、ZIP CRC 和字节码验证"
    - "jr-all 包含 objects、stree 和重定位 Jackson Core，可作为自包含消费 JAR"
    - "licenses 仅安装 LICENSE，上游 README 安装到 share/doc/jackson-jr"
    - "JAR 架构无关，不使用 OpenHarmony C/C++ 交叉编译器"
  common_dependencies: []

versions:
  "2.14.0":
    status: built
    build_date: "2026-07-30"
    conan_ref: "jackson-jr/2.14.0"
