package: jackson-jr/2.14.0
homepage: "https://github.com/FasterXML/jackson-jr"

upstream_check_command: "./mvnw -B -ntp -Dmaven.javadoc.skip=true clean verify"
upstream_test_in_build: true
upstream_test_command: "./mvnw -B -ntp -Dmaven.javadoc.skip=true clean verify"

upstream_tests:
  - file: "jr-objects/src/test/java/**/*.java"
    source: "jackson-jr-parent-2.14.0/jr-objects/src/test/java"
    description: "22 Surefire suites covering object, collection, bean, composer, sequence, feature, and error behavior"
    command: "maven-surefire-plugin:test (104 tests)"
  - file: "jr-stree/src/test/java/**/*.java"
    source: "jackson-jr-parent-2.14.0/jr-stree/src/test/java"
    description: "8 Surefire suites covering simple tree creation, traversal, read, write, and equality"
    command: "maven-surefire-plugin:test (20 tests)"
  - file: "jr-annotation-support/src/test/java/**/*.java"
    source: "jackson-jr-parent-2.14.0/jr-annotation-support/src/test/java"
    description: "5 Surefire suites covering aliases, ignore rules, rename, reorder, and visibility"
    command: "maven-surefire-plugin:test (26 tests)"

test_package_tests:
  - file: "TestJacksonJr.java"
    description: "Compile and run 25 Jackson jr API assertions, plus 29 validations covering all five exact JARs, ZIP integrity, required entries, class count, all ordinary classes, and JPMS bytecode levels"
    command: "python3 test.py --lib <package-lib> --version 2.14.0 --work <dir> --java <java> --javac <javac> --source TestJacksonJr.java"

assertion_count: 54
