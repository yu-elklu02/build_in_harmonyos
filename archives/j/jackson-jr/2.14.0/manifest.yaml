version: "2.14.0"
software: "jackson-jr"
status: built
build_date: "2026-07-30"
conan_ref: "jackson-jr/2.14.0"

source:
  url: "https://github.com/FasterXML/jackson-jr/archive/refs/tags/jackson-jr-parent-2.14.0.tar.gz"
  sha256: "020d7b3f3fb0f9a08648a7836f098ebe6530574a91c38ac66a2533fd84cffe94"
  commit: "bb965a3d57056491b33599bed2bdadb660f75749"
  tar_format: tar.gz

build:
  system: maven
  configure_options:
    - "clean verify"
    - "-Dmaven.javadoc.skip=true"
  dependencies:
    - "BiSheng JDK 17.0.13 pinned archive (shared by build and test_package fallback) or a preinstalled verified JDK 17"
    - "Maven 3.6.3 (upstream wrapper)"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Jackson jr 2.14.0 is a six-module Maven reactor with 150 upstream tests in 35 Surefire suites"
  - "The jr-all artifact contains objects, stree, and a relocated Jackson Core, so it is a self-contained consumer JAR"
  - "Ordinary runtime classes use Java major 52 while versioned JPMS descriptors use major 53"
  - "All five exact module JARs are checked before and after packaging, including ZIP CRC validation"
  - "The retrofit2 and jr-all modules have no standalone upstream test sources; their compilation and packaging remain part of the reactor"
  - "The tested dependency's conandata supplies the same pinned JDK URL, version, and SHA-256 to test_package without duplicating tool metadata"
  - "The upstream README is installed under share/doc/jackson-jr; only LICENSE is installed under licenses"
