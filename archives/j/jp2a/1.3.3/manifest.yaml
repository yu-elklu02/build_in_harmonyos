software: jp2a
version: "1.3.3"
status: built
build_date: "2026-07-14"
build_system: autotools

source:
  url: "https://github.com/Talinx/jp2a/releases/download/v1.3.3/jp2a-1.3.3.tar.bz2"
  sha256: "8aa995f570235321c94dcf705ca12d3e499f2a6b78213698de3c152534e38c0e"

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-ohos"
    - "--disable-curl"
    - "--disable-termlib"
  dependencies:
    - "libjpeg-turbo/3.2.0"
    - "libwebp/1.6.0"

knowledge_gained:
  - "jp2a 1.3.3 uses autotools and requires libjpeg; WebP support is linked through libwebp"
  - "libcurl, libpng, libexif and terminal-size detection can be disabled or patched out to avoid unavailable dependencies"
