software: json-glib
# 版本级 manifest
# 文件位置: archives/j/json-glib/1.6.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/json-glib/1.6/json-glib-1.6.6.tar.xz"
  mirror_urls:
    - "https://repo.huaweicloud.com/gnome/sources/json-glib/1.6/json-glib-1.6.6.tar.xz"
    - "https://mirrors.ustc.edu.cn/gnome/sources/json-glib/1.6/json-glib-1.6.6.tar.xz"

  # 源码校验和
  sha256: "96ec98be7a91f6dde33636720e3da2ff6ecbb90e76ccaa49497f31a6855a490e"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（实际使用meson）
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--buildtype=release"
    - "--default-library=static"
    - "-Dintrospection=disabled"
    - "-Dgtk_doc=disabled"
    - "-Dtests=false"
    - "-Dman=false"

  # 编译依赖列表
  dependencies:
    - glib/2.84.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson-enum-types.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Meson构建系统使用gnome.mkenums生成enum文件，但subprocess.Popen调用glib-mkenums会遇到权限问题"
  - "OpenHarmony上/bin/sh无法调用/usr/bin/rm（toybox），需要修改build.ninja使用完整路径"
  - "静态库编译成功，但工具程序链接失败（缺少libintl、libffi等依赖）"
