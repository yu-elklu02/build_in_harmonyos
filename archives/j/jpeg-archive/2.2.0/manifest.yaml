name: jpeg-archive
software: jpeg-archive
version: "2.2.0"
homepage: "https://github.com/danielgtaylor/jpeg-archive"
license: MIT
type: tool
status: adapting
build_date: "2026-08-04"
build_system: makefile

source:
  url: "https://github.com/danielgtaylor/jpeg-archive/archive/refs/tags/v2.2.0.tar.gz"
  sha256: "3da16a5abbddd925dee0379aa51d9fe0cba33da0b5703be27c13a2dda3d7ed75"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "MOZJPEG_PREFIX=<mozjpeg_pkg_dir>"
  dependencies:
    - "mozjpeg/4.1.1"

patches_applied: []

artifacts:
  - bin/jpeg-archive
  - bin/jpeg-recompress
  - bin/jpeg-compare
  - bin/jpeg-hash

upstream_tests:
  command: "make test"
  case_count: 1
  status: "not_run_during_cross_build"
  reason: "upstream Makefile test builds and executes a target test binary, which is not runnable on the cross-build host"

test_package:
  command: "sh test_jpeg_archive.sh <package_bin_dir>"
  assertions:
    - "jpeg-recompress converts a generated PPM image into JPEG output"
    - "jpeg-compare successfully compares the generated JPEG with itself"
    - "jpeg-hash returns the same hash for repeated runs on the generated JPEG"
    - "all four installed commands are present and executable"
