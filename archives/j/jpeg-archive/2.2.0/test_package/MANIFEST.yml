test_sources:
  - test_jpeg_archive.sh

binaries_under_test:
  - jpeg-recompress
  - jpeg-compare
  - jpeg-hash
  - jpeg-archive

test_assertions:
  - jpeg-recompress converts a generated PPM image into JPEG output
  - jpeg-compare successfully compares the generated JPEG with itself
  - jpeg-hash returns the same hash for repeated runs on the generated JPEG
  - all four installed commands are present and executable
