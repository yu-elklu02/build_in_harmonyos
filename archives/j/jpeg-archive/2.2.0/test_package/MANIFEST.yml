# MANIFEST.yml — jpeg-archive/2.2.0 test_package
# R34: tests must actually exercise the package binaries

test_sources:
  - test_jpeg_archive.sh

binaries_under_test:
  - jpeg-recompress
  - jpeg-compare
  - jpeg-hash
  - jpeg-archive

test_assertions:
  - jpeg-recompress encodes a synthetic JPEG without error
  - jpeg-compare returns a numeric similarity score for identical images (≥ 0.99)
  - jpeg-hash produces identical hashes for the same image twice
  - jpeg-archive --help prints usage without crash
  - all four binaries are present in bin/ and executable
