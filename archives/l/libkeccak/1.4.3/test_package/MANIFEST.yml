# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libkeccak/1.4.3
homepage: https://github.com/maandree/libkeccak

# 上游自带测试：make check 编译 test.c 并执行 ./test（依赖仓库内 .testfile 与 sha256sum）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "./test"

upstream_tests:
  - file: test.c
    description: "上游单一测试程序：Keccak/SHA-3/SHAKE/RawSHAKE/cSHAKE 摘要、状态序列化与文件摘要校验"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "libkeccak API 验证: SHA3-256(\"\") 与 SHA3-256(\"abc\") 比对 NIST 标准向量 + HMAC-SHA3-256 摘要"
    command: "./test_package"

# 测试断言总数
assertion_count: 3
