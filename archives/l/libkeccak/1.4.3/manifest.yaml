version: "1.4.3"
software: "libkeccak"
status: built
build_date: "2026-07-12"
build_system: makefile

source:
  url: "https://github.com/maandree/libkeccak/archive/refs/tags/1.4.3.tar.gz"
  sha256: "e535e5884c883609cc0abd938ab549cd475159d239fc875affd815603f3a0eb2"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  make_targets:
    - "libkeccak.a"
  make_variables:
    - "CC=<conan toolchain c compiler>"
    - "AR=<conan toolchain ar>"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libkeccak 上游 config.mk 硬编码 CC=c99，makefile 内赋值会覆盖环境变量，必须用命令行 make CC=... 覆盖（R33 场景下从 self.conf 取编译器）"
  - "上游 make install 会安装 man3/man7 并用 ln -sf 建软链接，HMDFS 下软链接不可覆盖；改用 copy() 打包，shared 时在 package() 内 os.remove + os.symlink 复刻 soname 布局"
  - "libkeccak 源码 1.4.3 未实际调用 alloca（仅 common.h 保留 ALLOCA_LIMIT 宏与条件包含），musl 下无 alloca.h 缺失问题，无需补丁"
  - "libkeccak_hmac_initialise 会对 state->key_opad 调用 realloc，调用方必须先将 struct libkeccak_hmac_state 清零，否则 realloc 野指针崩溃（消费者代码注意事项）"
