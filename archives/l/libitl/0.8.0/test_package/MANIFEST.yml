# test_package/MANIFEST.yml
package: libitl/0.8.0
homepage: "https://github.com/arabeyes-org/ITL"

# Upstream CMake build has no make check / ctest suite.
# Smoke coverage uses bundled demos (demo_hijri, demo_prayer) from conanfile build().
upstream_check_command: ""

upstream_test_in_build: true
upstream_test_command: "./demo_hijri && ./demo_prayer"

upstream_tests:
  - file: hijri/demo_hijri.c
    source: libitl-0.8.0/hijri/demo_hijri.c
    description: "Gregorian↔Hijri conversion demo (smoke)"
    command: "./demo_hijri"
  - file: prayertime/demo_prayer.c
    source: libitl-0.8.0/prayertime/demo_prayer.c
    description: "Prayer times / Qibla demo for sample cities (smoke)"
    command: "./demo_prayer"

test_package_tests:
  - file: test.c
    description: "Consumer API: G2H + getPrayerTimes"
    command: "./test_libitl"

assertion_count: 4
