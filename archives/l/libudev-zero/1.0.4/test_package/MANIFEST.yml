# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libudev-zero/1.0.4
homepage: "https://github.com/illiliti/libudev-zero"

# 上游测试命令
# libudev-zero is a library with no upstream test suite (no 'make check' target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libudev-zero has no upstream test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 udev_new/udev_ref/udev_unref API 调用"
    command: "./test_libudev-zero"

# 测试断言总数
assertion_count: 3
