software: laniakea-spark
display: "Laniakea Spark"
description: "Generic Laniakea job runner and package build executor."
category: development
homepage: "https://laniakea-hq.readthedocs.io/"
license: LGPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Python package; install spark modules and a relocatable lk-spark launcher."
    - "The launcher supports --version/--help without starting the daemon so CI can validate the packaged command without a Lighthouse server."
    - "Full daemon operation still requires the upstream runtime environment and Debian builder tools."
  common_dependencies:
    - "Python 3"
    - "tomlkit"
    - "pyzmq"
    - "python-debian"
    - "firehose"
    - "six (transitive import dependency of firehose 0.5)"

versions:
  "0.1.1":
    status: built
    build_date: "2026-07-30"
    conan_ref: "laniakea-spark/0.1.1"
