version: "0.1.1"
software: "laniakea-spark"
status: built
build_date: "2026-07-30"
build_system: custom
conan_ref: "laniakea-spark/0.1.1"

source:
  url: "https://files.pythonhosted.org/packages/36/88/0062d7ddeef56b5de29fa56449f96b6a2549e05bdd133fc69780a0e9d001/laniakea-spark-0.1.1.tar.gz"
  sha256: "923d3782f1b8f669a461d01207a68d2b2b63ccc41e8d395bb44d1c213d3af967"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "Install pure Python spark modules under lib/python."
    - "Generate a relocatable bin/lk-spark launcher."
    - "Keep --version/--help lightweight so package validation does not start the daemon."
  dependencies:
    - "Python 3"
    - "tomlkit==0.15.1 (test/runtime dependency)"
    - "pyzmq==27.1.0 (test/runtime dependency)"
    - "python-debian==1.1.1 (test/runtime dependency)"
    - "firehose==0.5 (test/runtime dependency)"
    - "six==1.17.0 (transitive dependency required by firehose.model import)"

patches_applied: []

knowledge_gained:
  - "The PyPI 0.1.1 source release ships no upstream test suite."
  - "PEP517 pip build isolation fails because setup.py imports spark before metadata generation."
  - "firehose 0.5 imports six but does not install it automatically, so six is required for firehose-backed runtime checks."
  - "The connected HarmonyOS PC emulator does not provide python/python3, so runtime evidence must not be claimed there."
