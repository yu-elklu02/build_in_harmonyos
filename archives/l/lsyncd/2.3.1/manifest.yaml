software: lsyncd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-17"

conan_ref: "lsyncd/2.3.1"

# 构建系统类型（顶级字段，与其他包保持一致）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/axkibe/lsyncd/archive/refs/tags/release-2.3.1.tar.gz"

  # 源码校验和
  sha256: "fc19a77b2258dc6dbb16a74f023de7cd62451c26984cedbec63e20ff22bcbdd8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "WITH_INOTIFY=True"
    - "WITH_FSEVENTS=False"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.3.6  # 从 lua.org 官方源码构建（cmd-pkgs 无 OHOS aarch64 预编译包）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-CMakeLists.txt-gnuinstalldirs.patch"

patches_description:
  0001-CMakeLists.txt.patch: "修复 include 目录顺序，确保 build 目录的 config.h 优先于 Lua 头文件目录中的 config.h，避免编译冲突"
  0002-CMakeLists.txt-gnuinstalldirs.patch: "添加 include(GNUInstallDirs) 使 CMAKE_INSTALL_MANDIR 设置为相对路径 share/man，修复 man page 安装到绝对路径 /man1 导致的失败；同时移除 prepare_tests 目标的 ALL 关键字，避免默认构建强制创建 tests 符号链接"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmd-pkgs 中无 OHOS aarch64 预编译 Lua 包（HTTP 404），需从 lua.org 官方源码构建"
  - "交叉编译 Lua 需分两步：host cc 构建 lua 解释器（运行 bin2carray.lua），target cc 构建 liblua.a（链接到 lsyncd）"
  - "CMake find_package(Lua) 需显式传递 LUA_INCLUDE_DIR、LUA_LIBRARIES 和 LUA_EXECUTABLE 参数"
  - "上游使用 LUA_COMPILER 调用 host luac 生成 runner.out 和 defaults.out，交叉编译时必须显式传递"
  - "Lua 头文件目录中的 config.h 与 lsyncd build 目录的 config.h 冲突，需调整 include 顺序"
  - "lsyncd 是工具类型（application），需创建 commands.json (R38)"
  - "CI worker Python 可能缺少 ssl 模块，Lua 源码下载应使用 curl 替代 urllib"
