# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lsyncd/2.3.1
homepage: "https://github.com/axkibe/lsyncd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# lsyncd 上游无 ctest 测试，交叉编译环境跳过上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# lsyncd 上游无自动化测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 由 test_package/conanfile.py 的 test() 方法驱动，通过 Conan 框架执行
test_package_tests:
  - file: test.sh
    description: "消费者测试: 验证 lsyncd 二进制可执行且 --version 退出码为 0"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
# 1. lsyncd 二进制存在于 PATH (command -v lsyncd 检查)
# 2. lsyncd --version 退出码为 0 (失败时回退 -version)
assertion_count: 2
