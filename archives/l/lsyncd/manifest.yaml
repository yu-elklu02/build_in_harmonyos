software: lsyncd
display: "Lsyncd"
description: "Live Syncing Daemon - monitors local dirs and syncs via rsync"
category: system
homepage: "https://github.com/axkibe/lsyncd"
license: GPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmd-pkgs 无 OHOS aarch64 预编译 Lua 包，需从 lua.org 官方源码构建 Lua 5.3.6"
    - "交叉编译 Lua 分两步：host cc 构建 lua 解释器（运行 bin2carray.lua），target cc 构建 liblua.a"
    - "CMake find_package(Lua) 需显式传递 LUA_INCLUDE_DIR、LUA_LIBRARIES 和 LUA_EXECUTABLE"
    - "需应用 0001-CMakeLists.txt.patch 修复 include 目录顺序，确保 build 目录的 config.h 优先于 Lua 的 config.h"
    - "工具类型（application），需 commands.json (R38)"
    - "交叉编译环境跳过上游测试（lsyncd 无 ctest 测试套件）"
  common_dependencies:
    - lua

versions:
  "2.3.1":
    status: built
    build_date: "2026-07-17"
    conan_ref: "lsyncd/2.3.1"
