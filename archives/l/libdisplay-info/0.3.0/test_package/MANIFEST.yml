# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdisplay-info/0.3.0
homepage: "https://gitlab.freedesktop.org/emersion/libdisplay-info"

# 上游测试命令 (meson test --list)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: di-edid-print.c
    source: libdisplay-info-0.3.0/test/di-edid-print.c
    description: "EDID print tool test (requires test data files)"
    command: "meson test"
  - file: edid-decode-check.sh
    source: libdisplay-info-0.3.0/test/edid-decode-check.sh
    description: "EDID decode check against reference output"
    command: "./edid-decode-check.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 di_info_parse_edid 和 di_info_destroy API 可调用且正确拒绝无效 EDID"
    command: "./test_libdisplay-info"

# 测试断言总数 (近似值)
assertion_count: 2
