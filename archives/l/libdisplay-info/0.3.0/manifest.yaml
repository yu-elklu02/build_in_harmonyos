software: libdisplay-info
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.3.0/libdisplay-info-0.3.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: meson

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "-Dc_std=c11"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - hwdata/0.366

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson 项目需要手动 PKG_CONFIG_PATH 设置来安装 hwdata 依赖"
  - "meson install 使用 DESTDIR 环境变量而非命令行参数"
  - "测试套件使用 mktemp -d，在 HarmonyOS 上需 TMPDIR=$HOME/tmp"
  - "ELF 签名是运行二进制的必要步骤（鸿蒙安全机制）"
