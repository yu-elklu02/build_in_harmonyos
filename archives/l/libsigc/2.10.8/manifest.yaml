software: libsigc

# 版本号
version: "2.10.8"

# 构建系统（扁平字段，用于 G4 门禁）
build_system: meson

# 编译状态: published | built | failed | archived
status: built

# 编译日期
build_date: "2026-07-12"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/libsigcplusplus/libsigcplusplus/releases/download/2.10.8/libsigc++-2.10.8.tar.xz"
  sha256: "235a40bec7346c7b82b6a8caae0456353dc06e71f14bc414bcc858af1838719a"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dmaintainer-mode=false"
    - "-Dbuild-documentation=false"
    - "-Dvalidation=false"
    - "-Dbuild-pdf=false"
    - "-Dbuild-examples=false"
    - "-Dbenchmark=false"
    - "-Dwrap_mode=nodownload"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libsigc++ 2.10.8 官方 tarball 由 meson dist 生成，不含 configure 脚本，只能走 meson 构建"
  - "MesonToolchain 只写入 compiler_executables 的 c/cpp，需把 llvm-ar/llvm-ranlib 全路径注入 conan_meson_native.ini，否则 meson 按裸名探测归档器失败"
  - "tarball 非 git 构建时 maintainer-mode 自动关闭，预生成源码在 untracked/ 下，无需 m4/mm-common"
  - "wrap_mode=nodownload 可阻止 docs/reference 通过 subprojects/mm-common.wrap 联网拉子项目"
  - "sigc++config.h 安装在 lib/sigc++-2.0/include，cpp_info.includedirs 必须同时包含 include/sigc++-2.0 与该路径"
