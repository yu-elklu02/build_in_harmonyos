# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsigc/2.10.8
homepage: https://github.com/libsigcplusplus/libsigcplusplus

# 上游 meson 测试套件（tests/ 下 32 个程序）在 build() 中通过 meson.test() 执行
upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

upstream_tests:
  - file: tests/test_signal.cc
    description: "signal 连接、发射、slot 列表管理"
  - file: tests/test_slot.cc
    description: "slot 构造、拷贝、调用"
  - file: tests/test_trackable.cc
    description: "trackable 析构时自动断开 slot"
  - file: tests/test_mem_fun.cc
    description: "mem_fun 适配器绑定成员函数"
  - file: tests/test_ptr_fun.cc
    description: "ptr_fun 适配器绑定自由函数"
  - file: tests/test_bind.cc
    description: "bind 适配器固定实参"
  - file: tests/test_disconnect.cc
    description: "connection::disconnect 语义"
  - file: tests/test_cpp11_lambda.cc
    description: "C++11 lambda 作为 slot"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.cpp
    description: "libsigc++ API 验证: signal emit + ptr_fun/mem_fun/bind 适配器 + connection::disconnect + trackable 析构自动断开 + void signal 接 lambda"
    command: "./test_libsigc"

# 测试断言总数
assertion_count: 11
