software: libsigc
display: "libsigc++"
description: "C++ 类型安全的信号/槽（signal-slot）回调库，glibmm / gtkmm 等 GNOME C++ 绑定的基础依赖"
category: library
homepage: "https://github.com/libsigcplusplus/libsigcplusplus"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "官方 tarball 由 meson dist 生成，无 configure 脚本，走 meson 构建"
    - "纯 C++ 库，零补丁，运行期仅依赖 libc++ 与系统 libc"
    - "sigc++config.h 安装在 lib/sigc++-2.0/include，需一并声明为 includedir"
    - "Windows 到 OHOS 的 Meson 交叉构建需显式补全 target、sysroot、POSIX prefix 和 LLVM archiver"
  common_dependencies: []

versions:
  "2.10.8":
    status: built
    build_date: "2026-07-12"
    source_url: "https://github.com/libsigcplusplus/libsigcplusplus/releases/download/2.10.8/libsigc++-2.10.8.tar.xz"
  "2.12.1":
    status: built
    build_date: "2026-07-19"
    source_url: "https://github.com/libsigcplusplus/libsigcplusplus/releases/download/2.12.1/libsigc++-2.12.1.tar.xz"
