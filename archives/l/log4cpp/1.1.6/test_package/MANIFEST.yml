package: log4cpp/1.1.6
homepage: "https://github.com/log4cpp/log4cpp"

upstream_check_command: "ctest --test-dir <build-folder> --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-folder> --output-on-failure --no-tests=error"
upstream_tests:
  - file: "tests/testCategory.cpp"
    description: "Category hierarchy, appenders, priorities, and formatted logging"
    command: "ctest -R '^testCategory$'"
  - file: "tests/testDLL.cpp"
    description: "Dynamic library API behavior"
    command: "ctest -R '^testDLL$'"
  - file: "tests/testDailyRollingFileAppender.cpp"
    description: "Daily rolling file appender behavior"
    command: "ctest -R '^testDailyRollingFileAppender$'"
  - file: "tests/testErrorCollision.cpp"
    description: "ERROR macro collision handling"
    command: "ctest -R '^testErrorCollision$'"
  - file: "tests/testFilter.cpp"
    description: "Logging filter decisions"
    command: "ctest -R '^testFilter$'"
  - file: "tests/testFixedContextCategory.cpp"
    description: "Fixed context category behavior"
    command: "ctest -R '^testFixedContextCategory$'"
  - file: "tests/testNDC.cpp"
    description: "Nested diagnostic contexts"
    command: "ctest -R '^testNDC$'"
  - file: "tests/testPattern.cpp"
    description: "Pattern layout formatting"
    command: "ctest -R '^testPattern$'"
  - file: "tests/testPriority.cpp"
    description: "Priority name and value conversions"
    command: "ctest -R '^testPriority$'"
  - file: "tests/testPropConfig.cpp"
    description: "Property configuration parsing"
    command: "ctest -R '^testPropConfig$'"
  - file: "tests/testProperties.cpp"
    description: "Properties file loading"
    command: "ctest -R '^testProperties$'"
  - file: "tests/testPropertyConfig.cpp"
    description: "Property configurator integration"
    command: "ctest -R '^testPropertyConfig$'"
  - file: "tests/testRollingFileAppender.cpp"
    description: "Size-based rolling file appender behavior"
    command: "ctest -R '^testRollingFileAppender$'"
  - file: "tests/testSimpleConfig.cpp"
    description: "Simple configuration integration"
    command: "ctest -R '^testSimpleConfig$'"
  - file: "tests/test_convenience.cpp"
    description: "Convenience logging API"
    command: "ctest -R '^test_convenience$'"
  - file: "tests/testbench.cpp"
    description: "Logging benchmark execution"
    command: "ctest -R '^testbench$'"
  - file: "tests/testmain.cpp"
    description: "Main logging integration scenario"
    command: "ctest -R '^testmain$'"

test_package_tests:
  - file: "test_log4cpp.cpp"
    description: "Validate priorities, NDC, appenders, and formatted messages through the packaged public API"
    command: "test_log4cpp"

assertion_count: 34
