software: log4cpp
version: "1.1.6"
build_system: cmake
status: built
build_date: "2026-07-28"

source:
  url: "https://github.com/log4cpp/log4cpp/archive/refs/tags/REL_1.1.6_Mar_12_2026.tar.gz"
  sha256: "00a4c14e92bef300328c38405ac505f237bbd720cba69497305fd8a12d10c251"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DLOG4CPP_BUILD_EXAMPLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local_native:
    conan_create: passed
    upstream_tests: "17/17"
    consumer_assertions: "17/17"
  ohos_aarch64:
    compile: passed
    upstream_test_targets: "17/17 compiled and linked"
    consumer_target: "compiled and linked"
    artifact: "ELF64 AArch64"
    runtime: not_run
    note: "使用 OpenHarmony API 20 SDK 交叉编译；未在鸿蒙 PC 真机运行"

knowledge_gained:
  - "上游 CMake 在静态库构建时仍会让 examples 链接仅共享库目标，因此关闭 examples，但保留并执行全部 17 项 CTest"
  - "交叉编译时不运行目标平台测试；原生构建会强制执行 CTest，且无测试时直接失败"
  - "消费者测试通过打包后的 log4cpp 公共 API 验证优先级、NDC、Appender 和格式化日志"
  - "OpenHarmony API 20 SDK 可编译并链接库、17 个上游测试目标和消费者目标，产物为 ELF64 AArch64"
