# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lua-pc/5.4.7
homepage: "https://www.lua.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: lua-5.4.7/test.c
    description: "Lua C API test: creates state, runs Lua script, verifies result"
    command: "./test_lua_pc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 Lua C API 可正常创建状态、执行脚本并获取结果"
    command: "./test_lua_pc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
