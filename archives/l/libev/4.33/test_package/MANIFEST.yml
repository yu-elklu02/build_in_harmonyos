# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libev/4.33
homepage: "https://software.schmorp.de/pkg/libev.html"

# libev 4.33 does not ship an upstream test target or test source directory.
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: unit_test.c
    description: "3 C API unit cases for version, loop userdata, and one-shot timers"
    command: "ctest --output-on-failure --no-tests=error"
  - file: test.c
    description: "Consumer test for version, the default event loop, and a timer callback"
    command: "./test_libev"

# 11 unit assertions plus 3 consumer assertions.
assertion_count: 14
