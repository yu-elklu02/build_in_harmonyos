# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: libaccounts-glib/1.27
homepage: "https://gitlab.com/accounts-sso/libaccounts-glib"

# Upstream test command (meson-based project)
upstream_check_command: "meson test -C builddir"

# Upstream tests are run in the build() method
upstream_test_in_build: true
upstream_test_command: "meson test -C builddir --timeout-multiplier=16"

# Upstream test programs
upstream_tests:
  - file: tests/check_ag.c
    source: libaccounts-glib-1.27/tests/check_ag.c
    description: "Core accounts-glib test suite using check framework"
    command: "./accounts-glib-testsuite"

# test_package consumer-side tests
test_package_tests:
  - file: test.c
    description: "Create AgManager and verify GObject type system"
    command: "./test_libaccounts-glib"

# Test assertion count (approximate)
assertion_count: 4
