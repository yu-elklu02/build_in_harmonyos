software: libccd
display: "libccd"
description: "Library for collision detection between convex shapes (GJK/MPR)"
category: library
homepage: "https://github.com/danfis/libccd"
license: BSD-3-Clause
build_system: cmake

versions:
  "2.1":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方。打了一个补丁让链接 libm 变成**可选**：
      musl 把数学函数并入 libc，sysroot 里只有静态 libm.a、没有 libm.so，
      上游 `find_library(m)` 必然落空。不填假值是有意的——试过 `-DLIBM_LIBRARY=m`
      与 `=-lm`，CMake 都把它当文件依赖，报 `No rule to make target`；
      设备实测带不带 -lm 都能链接并运行，这个链接项在 musl 上本就多余。
      对 glibc 平台无影响。

      另关掉了上游 testsuites（它 find_library(rt) 硬失败，而 musl 无 librt）。
      验收以我们自己的 test_package 为准：球体相交判定 3 例 + 长方体穿透深度 2 例，
      精确吻合到 1e-9。穿透深度断言特意用长方体而非球体——EPA 在曲面上只渐近收敛，
      球体上会给出 0.777 而解析解是 0.8，那是算法性质不是缺陷。
