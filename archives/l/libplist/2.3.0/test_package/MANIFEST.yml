# test_package/MANIFEST.yml
# libplist 2.3.0 upstream test declaration

package: libplist/2.3.0
homepage: "https://libimobiledevice.org/"

# Upstream test command (from test/ directory)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test/plist_test.c
    source: libplist-2.3.0.tar.bz2/test/plist_test.c
    description: "Comprehensive plist read/write test"
    command: "./plist_test"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test.c
    description: "Create plist dict, serialize to XML, parse back, verify boolean value"
    command: "./test_libplist"

# Test assertion count (approximate)
assertion_count: 8
