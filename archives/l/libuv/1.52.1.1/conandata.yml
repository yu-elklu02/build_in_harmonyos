# conandata.yml — libuv 1.52.1

sources:
  url: "http://dist.libuv.org/dist/v1.52.1/libuv-v1.52.1.tar.gz"
  sha256: "66d511b9e6e334c0e62279eb234fbfb2b3110b1479c09b95b44c7afca8cff9e7"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "CMakeLists.txt: add HarmonyOS to Linux-like platform conditions"
    patch_type: "portability"
  - patch_file: "patches/0002-src-unix-core.c.patch"
    patch_description: "src/unix/core.c: exclude OHOS from Linux CPU affinity API (sched_getaffinity/cpu_set_t)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-unix-internal.h.patch"
    patch_description: "src/unix/internal.h: exclude OHOS from UV__CPU_AFFINITY_SUPPORTED"
    patch_type: "portability"
  - patch_file: "patches/0004-src-unix-udp.c.patch"
    patch_description: "src/unix/udp.c: exclude OHOS from Linux mmsg API (sendmmsg/recvmmsg/struct mmsghdr)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-unix-core.c-ohos-account.patch"
    patch_description: "src/unix/core.c: fallback to OH_OsAccount_GetName when getpwuid_r fails (app UID not in /etc/passwd)"
    patch_type: "portability"
  - patch_file: "patches/0006-test-ohos-test-gating.patch"
    patch_description: "test/: gate OHOS-unsupported upstream tests (link/chown, fchmod on bound pipes, dir watch, thread priority/affinity, EADDRINUSE semantics, pre-epoch utime, recvmmsg, /etc/passwd-group, platform output) via __OHOS__ RETURN_SKIP"
    patch_type: "test"
