# test_package/MANIFEST.yml — libuv 1.52.1
package: libuv/1.52.1.1
homepage: "https://libuv.org/"

# 上游测试命令
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/runner.c
    source: libuv-1.52.1/test/runner.c
    description: "libuv test runner: 507 cases, 484 PASS, 23 SKIP, 0 FAIL on OHOS armv8"
    command: "./uv_run_tests_a"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 uv_version_string/uv_default_loop/uv_timer_init/uv_os_get_passwd 验证 API 可用"
    command: "./test_libuv"

# 测试断言总数（近似值）
assertion_count: 8
