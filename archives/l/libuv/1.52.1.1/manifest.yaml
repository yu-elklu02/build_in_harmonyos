software: libuv
version: "1.52.1.1"
status: published
build_date: "2026-04-30"
build_system: cmake

source:
  url: "http://dist.libuv.org/dist/v1.52.1/libuv-v1.52.1.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-unix-core.c.patch"
  - "0003-src-unix-internal.h.patch"
  - "0004-src-unix-udp.c.patch"
  - "0005-src-unix-core.c-ohos-account.patch"
  - "0006-test-ohos-test-gating.patch"

validation:
  status: passed
  upstream_tests:
    command: "uv_run_tests_a (manual OHOS armv8 validation)"
    cases: 507
    passed: 484
    skipped: 23
    failed: 0
    note: "OHOS platform limitations are explicitly gated; no test failures were observed."
  test_package:
    command: "./test_libuv"
    cases: 1
    passed: 1
    note: "Consumer test exercises libuv version, event loop, timer and account APIs."

knowledge_gained:
  - "OHOS lacks Linux-specific CPU affinity APIs (CPU_SETSIZE, cpu_set_t, sched_getaffinity, CPU_COUNT)"
  - "OHOS lacks Linux-specific mmsg APIs (struct mmsghdr, recvmmsg, sendmmsg)"
  - "Need to exclude OHOS from __linux__ conditionals for these APIs"
  - "CMakeLists.txt needs to treat HarmonyOS as Linux-like platform for compilation"
  - "cmake .. -DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"

