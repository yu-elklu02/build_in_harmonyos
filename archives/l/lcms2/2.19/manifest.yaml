version: "2.19"
status: built
build_date: "2026-07-17"

source:
  url: "https://github.com/mm2/Little-CMS/releases/download/lcms2.19/lcms2-2.19.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-jpeg"
    - "--without-tiff"
    - "--without-zlib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-hmdfs-umask.patch"

knowledge_gained:
  - "AutotoolsToolchain 已自动映射 shared/static 选项，不应重复追加开关"
  - "config.sub 补丁必须保留上游 2024 脚本，并使用有锚点的替换块兼容 Conan patch-ng"
  - "E129: HMDFS 下 config.status 使用 umask 077 创建 confXXXXXX 后可能无法写入，需仅将该临时目录块的两处掩码改为 022"
  - "shared/static 模式均通过 270 项 testbed 检查和消费者色彩转换测试"
  - "Conan 平台分支直接使用 self.settings.os in (Linux, OHOS) 形式，符合 R32 和仓库既有配方"
  - "库产物按平台后缀和运行时约定打包：Windows DLL 放入 bin、导入库放入 lib，macOS dylib 与 Linux/OHOS so 放入 lib"
