package: libressl/3.9.1
homepage: "https://www.libressl.org/"

upstream_check_command: "ctest -N && ctest --output-on-failure --no-tests=error --parallel 2"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error --parallel 2"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: libressl-3.9.1/tests/CMakeLists.txt
    description: "ENABLE_EXTRATESTS=ON 时注册的完整 128 项 CTest 测试集"
    command: "ctest --output-on-failure --no-tests=error --parallel 2"

test_package_tests:
  - file: test_libressl.c
    description: "验证 SHA-256、SSL 上下文、libtls 初始化及缺失 CA 文件错误路径"
    command: "./test_libressl"

assertion_count: 7
