patches:
  "3.9.1":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Apply Linux feature definitions and platform libraries on OHOS/HarmonyOS."
      patch_type: "portability"
    - patch_file: "patches/0002-crypto-bio-b_sock.c.patch"
      patch_description: "Harden numeric IPv4 host and service parsing across libc implementations."
      patch_type: "portability"
    - patch_file: "patches/0003-tests-CMakeLists.txt.patch"
      patch_description: "Bound network/PID extra tests and enable deterministic getpid wrapping."
      patch_type: "portability"
    - patch_file: "patches/0004-tests-ocsptest.sh.patch"
      patch_description: "Replace the stale OCSP endpoint with a working upstream-equivalent endpoint."
      patch_type: "portability"
    - patch_file: "patches/0005-tests-pidwraptest.c.patch"
      patch_description: "Model PID reuse deterministically while comparing the first parent and child PRNG outputs."
      patch_type: "portability"
