software: librevenge
version: "0.0.5"
status: published
build_date: "2026-06-01"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/libwpd/files/librevenge/librevenge-0.0.5/librevenge-0.0.5.tar.xz/download"
  sha256: "106d0c44bb6408b1348b9e0465666fa83b816177665a22cd017e886c1aaeeb34"
  tar_format: tar.xz

build:
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "boost/1.90.0@ohpcd/stable"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-src-lib-librevenge-generators.rc.patch"
  - "0004-src-lib-librevenge-stream.rc.patch"
  - "0005-src-lib-librevenge.rc.patch"
  - "0006-configure-umask-fix.patch"

knowledge_gained:
  - "librevenge 使用 autotools，需要更新 config.guess/config.sub 支持 OHOS"
  - "产出 3 个库: librevenge-0.0, librevenge-generators-0.0, librevenge-stream-0.0"
  - "头文件路径: include/librevenge-0.0/"
  - "E011: configure umask 077→022 修复 HMDFS 权限问题"
