# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librevenge/0.0.5
homepage: "https://sourceforge.net/p/librevenge/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: librevenge-0.0.5/tests/
    description: "librevenge upstream unit tests (cppunit-based)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试: RVNGString/RVNGStringVector/RVNGPropertyList API 调用"
    command: "librevenge_api_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
