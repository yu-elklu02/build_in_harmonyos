# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: libyaml/0.2.5
homepage: "https://pyyaml.org/wiki/LibYAML"

# Upstream test command
upstream_check_command: "ctest -N"

# conanfile.py build() method upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tests/test-version.c
    source: libyaml-0.2.5/tests/test-version.c
    description: "Version info test"
    command: "./test-version"
  - file: tests/test-reader.c
    source: libyaml-0.2.5/tests/test-reader.c
    description: "Reader test"
    command: "./test-reader"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: parse YAML and verify token stream"
    command: "./test_libyaml"

# Approximate assertion count
assertion_count: 3
