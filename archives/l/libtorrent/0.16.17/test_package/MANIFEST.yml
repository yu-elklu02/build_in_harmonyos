package: libtorrent/0.16.17
homepage: https://github.com/rakshasa/libtorrent

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: test/torrent/net/test_address_info.cc
    source: libtorrent-0.16.17/test/torrent/net/test_address_info.cc
    description: "Address, file-descriptor, and socket-address CppUnit cases"
    command: "./test/LibTorrent_Test_Torrent_Net"
  - file: test/torrent/utils/test_extents.cc
    source: libtorrent-0.16.17/test/torrent/utils/test_extents.cc
    description: "Extents, logging, directory-event, queue, thread, and URI CppUnit cases"
    command: "./test/LibTorrent_Test_Torrent_Utils"
  - file: test/torrent/object_test.cc
    source: libtorrent-0.16.17/test/torrent/object_test.cc
    description: "Object, bencode stream, tracker list, controller, and timeout CppUnit cases"
    command: "./test/LibTorrent_Test_Torrent"
  - file: test/data/test_chunk_list.cc
    source: libtorrent-0.16.17/test/data/test_chunk_list.cc
    description: "Chunk list and hash queue CppUnit cases"
    command: "./test/LibTorrent_Test_Data"
  - file: test/main.cc
    source: libtorrent-0.16.17/test/main.cc
    description: "Network helper and fixture CppUnit executable"
    command: "./test/LibTorrent_Test_Net"
  - file: test/tracker/test_tracker_http.cc
    source: libtorrent-0.16.17/test/tracker/test_tracker_http.cc
    description: "HTTP tracker CppUnit cases"
    command: "./test/LibTorrent_Test_Tracker"
  - file: test/protocol/test_request_list.cc
    source: libtorrent-0.16.17/test/protocol/test_request_list.cc
    description: "Range and peer request-list CppUnit cases"
    command: "./test/LibTorrent_Test"

test_package_tests:
  - file: test_libtorrent.cpp
    description: "Round-trip a bencoded map through installed public APIs and validate its SHA-1"
    command: "./test_libtorrent"

assertion_count: 1282
