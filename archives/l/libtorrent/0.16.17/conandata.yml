sources:
  url: "https://github.com/rakshasa/libtorrent/archive/refs/tags/v0.16.17.tar.gz"
  sha256: "14b502a00f0eeebee9293f7c6cf0d3ec356a5a3792c0d320290edd19c7a65d0b"

patches:
  - patch_file: "patches/0001-clang15-structured-binding-capture.patch"
    patch_description: "Avoid capturing structured bindings, unsupported by the device Clang 15"
    patch_type: "portability"
  - patch_file: "patches/0002-libcxx15-heap-algorithms.patch"
    patch_description: "Use iterator heap algorithms available in the device libc++ 15"
    patch_type: "portability"
  - patch_file: "patches/0003-cppunit-chrono-assertion.patch"
    patch_description: "Avoid formatting chrono durations unsupported by CppUnit 1.15.1"
    patch_type: "portability"
  - patch_file: "patches/0004-writable-test-directory.patch"
    patch_description: "Use writable test fixtures and isolate the symlink-only test"
    patch_type: "portability"
