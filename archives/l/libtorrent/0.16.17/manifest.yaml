software: libtorrent
version: "0.16.17"
status: built
compile_date: "2026-08-01"
build_system: autotools

source:
  url: "https://github.com/rakshasa/rtorrent/releases/download/v0.16.17/libtorrent-0.16.17.tar.gz"
  sha256: "9efd7f3176a03f7935b5616ff57695524e99a3184e43ec01110d13d960d2abf6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - libcurl/8.5.0
    - zlib/1.3.1.1
    - openssl/3.5.6
    - cppunit/1.15.1 (test)

test:
  upstream:
    command: "make check"
    source: "test/ CppUnit suite"
  test_package:
    command: "creates and verifies torrent::Object values"
    cases: 3

patches_applied:
  - "0001-config-sub-ohos.patch"
  - "0002-configure-umask.patch"
  - "0003-proxy-manager-clang15-structured-binding.patch"

knowledge_gained:
  - "Use rakshasa rtorrent release assets instead of GitHub codeload for generated configure/Makefile.in files."
  - "config.sub needs linux-ohos triplet support for OHOS cross builds."
  - "OHOS HMDFS can make umask 077 temporary directories unusable; configure temp creation must avoid the strict umask."
  - "OHOS clang 15 cannot capture structured binding variables in lambdas; rewrite affected bindings to named variables."
  - "OpenSSL 3 APIs are supported by libtorrent 0.16.17 through accessor-based calls."
