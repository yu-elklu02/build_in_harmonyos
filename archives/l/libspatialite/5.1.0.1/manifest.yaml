knowledge_gained:
  - "Reuse the existing Autotools HMDFS TMPDIR and Libtool -avoid-version patterns."
  - "knowledge_ref: E264 draft - Generate a signed geos-config ELF adapter from the exact Conan dependency metadata when upstream configure requires the legacy executable protocol."
  - "Guard nano HTTP cleanup with LIBXML_HTTP_ENABLED because libxml2 2.15 removed the built-in client."
  - "Compare strcmp results with zero; C only guarantees the sign of a nonzero return value."
  - "GEOS 3.13.1 changed zero-length LineString predicate behavior in both operand orders, so the pinned dependency needs explicit relations7 and relations8 expectation updates."
  - "Conan test_package compile, signing and execution must use a writable build-local TMPDIR because HarmonyOS /tmp is read-only; its manual link closure must include librttopo."
  - "Public consumers must include sqlite3.h before spatialite.h because the upstream SpatiaLite header exposes sqlite3 types without including their declarations."
  - "The test_package directly requires sqlite3/3.49.1 because its source calls SQLite APIs; skipped Conan dependency nodes must not contribute relative include/lib paths."

