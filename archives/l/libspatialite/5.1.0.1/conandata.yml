sources:
  url: "https://www.gaia-gis.it/gaia-sins/libspatialite-sources/libspatialite-5.1.0.tar.gz"
  sha256: "43be2dd349daffe016dd1400c5d11285828c22fea35ca5109f21f3ed50605080"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Recognize HarmonyOS in config.guess"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Preserve the linux-ohos canonical triplet in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Create config.status temporary directories under TMPDIR with an HMDFS-safe umask"
    patch_type: "portability"
  - patch_file: "patches/0004-src-wfs-wfs_in.c.patch"
    patch_description: "Call nano HTTP cleanup only when libxml2 provides the legacy HTTP client"
    patch_type: "portability"
  - patch_file: "patches/0005-test-check_spatialindex.c.patch"
    patch_description: "Compare the exact successful SQLite result without assuming a strcmp return magnitude"
    patch_type: "test"
  - patch_file: "patches/0006-test-sql_stmt_geos_tests-relations7.testcase.patch"
    patch_description: "Align the zero-length LineString relation expectations with pinned GEOS 3.13.1 behavior"
    patch_type: "test"
  - patch_file: "patches/0007-test-sql_stmt_geos_tests-relations8.testcase.patch"
    patch_description: "Align the reversed zero-length LineString relation expectations with pinned GEOS 3.13.1 behavior"
    patch_type: "test"
