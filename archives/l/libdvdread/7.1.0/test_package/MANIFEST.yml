package: libdvdread/7.1.0
homepage: "https://www.videolan.org/developers/libdvdnav.html"

upstream_check_command: "none (libdvdread 7.1.0 ships no test target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "No upstream test directory or Meson test entry is shipped"
  total: 0

test_package_tests:
  - file: test_libdvdread.c
    scenario: normal
    description: "Verify version/API constants, open an existing directory, and reject a missing title"
    command: "./test_libdvdread"
  - file: test_libdvdread.c
    scenario: fault-injection
    description: "Verify DVDOpen returns NULL for a nonexistent path"
    command: "./test_libdvdread --missing-path"

assertion_count: 6
