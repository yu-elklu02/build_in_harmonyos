name: linbox
description: 精确线性代数库（整数/有限域上的行列式、秩、解方程、Smith 标准形等）
category: math
license: LGPL-2.1-or-later
website: https://github.com/linbox-team/linbox
source_url: https://github.com/linbox-team/linbox/releases
build_system: autotools
versions:
  - version: "1.7.0"
    status: built
    build_date: "2026-08-12"
    notes: >-
      SageMath / passagemath 计算代数栈的顶层聚合库，把 givaro / fflas-ffpack /
      ntl / flint / iml / openblas / gsl / mpfr / gmp 串在一起。三个坑均非「编不过」：
      ① configure 无条件 `cp doc/mainpage.doxy doc/`，out-of-source 下鸿蒙 cp 忽略
      末尾斜杠、把 doc 建成普通文件，随后 config.status 建 doc/Makefile 撞
      "Not a directory"；② 必须依赖 mpfr/4.2.2.1（4.2.2 的 .la 烤死了 //lib/libgmp.la）；
      ③ __udivti3 编译链接全过、加载时才炸，须显式链 compiler-rt 的 builtins 归档
      （-rtlib=compiler-rt 被 libtool 丢弃，无效）。
