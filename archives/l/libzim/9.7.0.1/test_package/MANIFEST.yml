package: libzim/9.7.0.1
homepage: "https://github.com/openzim/libzim"

upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "test/*.cpp"
    source: "libzim-9.7.0/test/"
    description: "Upstream GTest suite covering ZIM file creation, reading, and manipulation"
    command: "meson test -C build"
    disabled_reason: "Upstream tests require GTest >=1.10.0; Conan test_package provides equivalent ZIM write+read API validation"

test_package_tests:
  - file: test.cpp
    description: "Smoke test: loads libzim shared library (validates ELF signing) and calls zim::getVersions() API to verify version info"
    command: "./test_libzim"

assertion_count: 2
