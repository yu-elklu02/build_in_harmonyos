  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器 (纯 shell 脚本工具，无需编译器)
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（实际不使用 patch 机制，源码修改通过 conanfile.py replace_in_file() 完成）
# patches/ 目录下的补丁文件仅作为文档归档
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
