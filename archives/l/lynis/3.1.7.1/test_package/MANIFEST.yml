# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lynis/3.1.7.1
homepage: "https://cisofy.com/lynis/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# lynis 是纯 shell 脚本工具, 上游无 make check/ctest 集成, 用 sh -n 语法检查
upstream_check_command: "sh -n lynis"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "sh -n lynis"

# 上游实际运行的测试程序
upstream_tests:
  - file: lynis
    source: lynis-3.1.7/lynis
    description: "Shell script syntax check"
    command: "sh -n lynis"

# test_package 中自带的测试 (消费者视角验证)
# test.sh 验产物结构而非调 lynis 主入口 (lynis 有 root 属主安全检查,
# Conan 沙箱环境非 root 阻断; CI worker 上以 root 跑会正常, 但本地验证
# 绕过属主检查验产物结构更稳妥). 13 个断言覆盖 wrapper/shebang/include/
# osdetection HarmonyOS 分支/functions OHOS_PLATFORM+HMDFS trust/early
# --version/SCRIPT_DIR/etc profile/全脚本 shebang.
test_package_tests:
  - file: test.sh
    description: "Verify installed lynis product structure (13 assertions)"
    command: "/data/service/hnp/bin/bash test.sh <package_folder>"
  - file: conanfile.py
    description: "Driver that delegates to test.sh via self.run()"
    command: "self.run('/data/service/hnp/bin/bash test.sh <package_folder>')"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
