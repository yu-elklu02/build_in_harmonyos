software: lynis
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.7.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 溧码下载 URL (GitHub tag 溧码包, cisofy release URL 下载失败 404/被墙)
  url: "https://github.com/CISOfy/lynis/archive/refs/tags/3.1.7.tar.gz"

  # 溧码校验和
  sha256: "48d829d0dc2c583a3e838cc09a7190b69a3af844bcb913c7cf9c0226b04b95c5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器 (纯 shell 脚本工具, 无需编译器)
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 构建时由 apply_conandata_patches() 按 conandata.yml 应用以下补丁。
# 补丁 0001+0002+0003 来自远端 feat/lynis-3.1.7.1 初版适配 (OHOS 运行时适配,
# 真价值: TMPDIR/OHOS_PLATFORM/PSOPTIONS/HMDFS 属主信任/早 --version/SCRIPT_DIR).
# 补丁 0003 已删 zsh shebang 教改 (上游真实 shebang 是 #!/bin/sh 非 zsh,
# 已扫 65 个脚本确认), 保留其 OHOS 适配真价值改动.
# 补丁 0004 是我的新增: 65 个脚本 shebang #!/bin/sh -> #!/data/service/hnp/bin/bash
# (OHOS bash 路径, 正确方案替代远端的 zsh 教改).
patches_applied:
  - 0001-include-functions.patch
  - 0002-include-osdetection.patch
  - 0003-lynis.patch
  - 0004-ohos-shebang.patch

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lynis 是纯 shell 安全审计工具, 无编译需求, 路径 A 基础适配"
  - "上游真实 shebang 是 #!/bin/sh (已扫 65 个脚本确认), 非远端误认的 #!/usr/bin/zsh"
  - "OHOS bash 路径 /data/service/hnp/bin/bash, 补丁 0004 统一改 65 个脚本 shebang"
  - "osdetection 用 uname -s 分流: HarmonyOS -> Linux 分支 + OHOS_PLATFORM=1 (补丁 0002)"
  - "include/functions 加 OHOS_PLATFORM 检测 + PSOPTIONS 适配 + HMDFS 属主信任 (补丁 0001)"
  - "lynis 主入口加早 --version 处理 + SCRIPT_DIR 路径检测 + non-blocking stdin (补丁 0003)"
  - "Toybox ps 缺 procps -C/-ax/-aux flags, ohos-ps wrapper 降级为默认进程列表 (补丁 ohos-ps)"
  - "package() 装整个 lynis 树到 share/lynis/ (lynis 用 WORKDIR=$(pwd) 找 ./include, 不能 flatten 到 bin/)"
  - "bin/lynis wrapper 脚本 cd 到 share/lynis/ 再 exec bash lynis, 保留 WORKDIR 姑约"
  - "lynis 主入口有 root 属主安全检查 (upstream 设计), Conan 沙箱环境非 root 阻断; CI worker 上以 root 跑会正常"
  - "test.sh 验产物结构而非调 lynis 主入口, 绕过属主检查, 13 个断言覆盖 wrapper/shebang/include/osdetection/functions/early --version/SCRIPT_DIR/etc profile/全脚本 shebang"

patch_generation:
  method: integrated-merge
  source_orig_dir: /storage/Users/currentUser/builds/.lynis-merge.orig
  source_work_dir: /storage/Users/currentUser/builds/.lynis-merge.work
  generated_at: '2026-07-29T20:54'

patch_classification:
  - file: 0001-include-functions.patch
    type: portability
    platform_only: true
    guard: HMDFS ownership + Toybox ps + TMPDIR compatibility
  - file: 0002-include-osdetection.patch
    type: portability
    platform_only: true
    guard: HarmonyOS OS detection -> Linux audit path
  - file: 0003-lynis.patch
    type: portability
    platform_only: true
    guard: early --version + SCRIPT_DIR + non-blocking stdin + MYID fallback (zsh shebang 错改已删)
  - file: 0004-ohos-shebang.patch
    type: portability
    platform_only: true
    guard: shebang #!/bin/sh -> /data/service/hnp/bin/bash across 65 scripts
