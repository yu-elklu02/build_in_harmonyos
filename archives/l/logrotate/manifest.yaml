software: logrotate
display: "logrotate"
description: "Utility that rotates, compresses and mails system logs"
category: system
homepage: "https://github.com/logrotate/logrotate"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "libpopt is a hard requirement but not yet in the registry — vendored and statically linked"
    - "config.guess cannot classify HarmonyOS uname — build triplet given explicitly (native, no --host)"
    - "mktemp -d / umask 077 config.status workarounds for HarmonyOS temp-dir perms"
  common_dependencies: []

versions:
  "3.22.0":
    status: built   # PR 阶段 CI 尚未 upload → built；CI upload 成功后再改 published
    build_date: "2026-07-13"
