# test_package/MANIFEST.yml — upstream test declaration (CI L0e requires this file)
package: logrotate/3.22.0
homepage: "https://github.com/logrotate/logrotate"

# Upstream ships a shell-driven test suite under test/ (run via `make check`).
upstream_check_command: "make check"

# The upstream suite is not run inside build() — it depends on a full GNU
# userland (sed/grep/find behaviours) and is unrelated to recipe correctness.
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: test/test
    source: logrotate-3.22.0/test/test
    description: "Upstream functional rotation test harness"
    command: "make check"

# Consumer-side test bundled with this recipe.
test_package_tests:
  - file: test.sh
    description: "Drives logrotate through a real rotation cycle and asserts the rotated file exists"
    command: "bash test.sh"

assertion_count: 2
