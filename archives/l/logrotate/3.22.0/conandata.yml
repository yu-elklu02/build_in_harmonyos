# conandata.yml — logrotate 3.22.0
# Single source of truth for source URLs + SHA256.
#
# logrotate hard-requires libpopt (configure.ac: AC_MSG_ERROR "libpopt required
# but not found"). libpopt is not yet published to the artifact registry, so it
# is vendored here and statically linked into the logrotate binary (see notes.md).

sources:
  url:
    - "https://github.com/logrotate/logrotate/releases/download/3.22.0/logrotate-3.22.0.tar.xz"
  sha256: "42b4080ee99c9fb6a7d12d8e787637d057a635194e25971997eebbe8d5e57618"

# Vendored required dependency: libpopt (upstream rpm-software-management/popt),
# fetched from the OpenBSD distfiles mirror and built as a static library.
popt:
  url:
    - "https://ftp.openbsd.org/pub/OpenBSD/distfiles/popt-1.16.tar.gz"
  sha256: "e728ed296fe9f069a0e005003c3d6b2dde3d9cad453422a10d6558616d304cc8"
