version: "3.22.0"
software: "logrotate"
status: built   # PR 阶段 CI 尚未 upload → built；CI upload 成功后再改 published
build_date: "2026-07-13"
build_system: "autotools"

source:
  url: "https://github.com/logrotate/logrotate/releases/download/3.22.0/logrotate-3.22.0.tar.xz"
  sha256: "42b4080ee99c9fb6a7d12d8e787637d057a635194e25971997eebbe8d5e57618"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

vendored:
  - name: popt
    version: "1.16"
    url: "https://ftp.openbsd.org/pub/OpenBSD/distfiles/popt-1.16.tar.gz"
    sha256: "e728ed296fe9f069a0e005003c3d6b2dde3d9cad453422a10d6558616d304cc8"
    reason: "libpopt is a hard requirement not yet in the registry; built static and linked in"

patches_applied: []

knowledge_gained:
  - "logrotate hard-requires libpopt — vendor + static link keeps the recipe self-contained"
  - "config.guess cannot classify HarmonyOS; give --build explicitly (native, not --host) — E007"
  - "HarmonyOS mktemp/umask 077 config.status temp-dir workarounds"

verification:
  real_device:
    date: "2026-07-19"
    env: "HarmonyOS HAD 206.1.0 真机（aarch64 musl，OHOS SDK clang 15.0.4）"
    result: "pass"
