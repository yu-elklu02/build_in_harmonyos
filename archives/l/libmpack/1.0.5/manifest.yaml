# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.5"

# 软件名
software: "libmpack"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libmpack/libmpack/archive/refs/tags/1.0.5.tar.gz"

  # 源码校验和
  sha256: "4ce91395d81ccea97d3ad4cb962f8540d166e59d3e2ddce8a22979b49f108956"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libmpack uses GNU libtool which is not available on HarmonyOS; built via amalgamation approach instead"
  - "Amalgamation: concat all .h files (remove #include lines) -> mpack.h, concat mpack.h + all .c files -> mpack.c"
  - "Library name in Makefile is 'mpack' (NAME := mpack), not 'libmpack'"
  - "All 11624 upstream tests pass with clang 15 on aarch64-ohos"
