# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmpack/1.0.5
homepage: "https://github.com/libmpack/libmpack"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/mpack.c
    source: libmpack-1.0.5/test/mpack.c
    description: "libmpack main test suite with 11624 assertions covering packing/unpacking of all msgpack types"
    command: "./run-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者视角: mpack_pack_uint/mpack_read/mpack_unpack_uint round-trip 测试"
    command: "./test_libmpack"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11624
