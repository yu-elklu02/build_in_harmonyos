# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtap/0.1.0
homepage: "https://github.com/zorgnax/libtap"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/simple.c
    source: libtap-0.1.0/t/simple.c
    description: "Basic ok/pass/fail tests with 24 assertions"
    command: "./t/simple"
  - file: t/synopsis.c
    source: libtap-0.1.0/t/synopsis.c
    description: "Synopsis example with is/cmp_ok/dies_ok/lives_ok"
    command: "./t/synopsis"
  - file: t/is.c
    source: libtap-0.1.0/t/is.c
    description: "String comparison tests (is/isnt)"
    command: "./t/is"
  - file: t/like.c
    source: libtap-0.1.0/t/like.c
    description: "Regex match tests (like/unlike)"
    command: "./t/like"
  - file: t/cmpok.c
    source: libtap-0.1.0/t/cmpok.c
    description: "Numeric comparison tests (cmp_ok)"
    command: "./t/cmpok"
  - file: t/cmp_mem.c
    source: libtap-0.1.0/t/cmp_mem.c
    description: "Memory comparison tests (cmp_mem)"
    command: "./t/cmp_mem"
  - file: t/diesok.c
    source: libtap-0.1.0/t/diesok.c
    description: "Process death detection tests (dies_ok/lives_ok)"
    command: "./t/diesok"
  - file: t/skip.c
    source: libtap-0.1.0/t/skip.c
    description: "Skip directive tests"
    command: "./t/skip"
  - file: t/todo.c
    source: libtap-0.1.0/t/todo.c
    description: "TODO directive tests"
    command: "./t/todo"
  - file: t/notediag.c
    source: libtap-0.1.0/t/notediag.c
    description: "Note/diag output tests"
    command: "./t/notediag"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 libtap API (plan/ok/is/done_testing)"
    command: "./test_libtap"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 62
