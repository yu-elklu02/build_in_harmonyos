software: lua-stringy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# 构建系统 (top-level for flat YAML parser)
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (v0.7-0 tagged release)
  url: "https://github.com/mdeneen/lua-stringy/archive/v0.7-0.tar.gz"

  # 源码校验和
  sha256: "f4664ccd433eb202b030524bc22fd4142bbb30f74d8d6cf4e2852afd463c8986"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom

  # 配置选项列表
  configure_options:
    - "CFLAGS=-O3 -Wall -Werror -fPIC"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.4.8
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-join-lua54-buffinit-stack.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lua/5.4.8 conan package provides liblua.a with -fPIC but no interpreter binary"
  - "Lua interpreter can be built from source (lua.c) linked against conan liblua.a"
  - "stringy.so must be linked against liblua.a (undefined symbols not allowed by lld)"
  - "Source files are in stringy/ subdirectory (v0.7-0 tag layout)"
