# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lua-stringy/0.7
homepage: "https://github.com/mdeneen/lua-stringy"

# 上游测试命令
upstream_check_command: "make"
# lua-stringy Makefile runs `lua stringy_test.lua` as part of `all` target

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: stringy_test.lua
    source: lua-stringy-0.7-0/stringy/stringy_test.lua
    description: "Upstream test suite covering split, strip, startswith, endswith, find, count, join"
    command: "lua stringy_test.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_stringy.lua
    description: "Consumer test verifying split, strip, startswith, endswith, find, count, join functions"
    command: "lua test_stringy.lua"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
