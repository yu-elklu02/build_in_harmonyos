package: libxdmcp/1.1.5
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxdmcp"

# Upstream ships one Automake check_PROGRAM in a `test/` SUBDIR:
# `Array`, declared in upstream test/Makefile.am as
# `check_PROGRAMS = Array` / `TESTS = $(check_PROGRAMS)`. Source
# file: `test/Array.c` (≈95 lines). The check is gated by
# `XORG_ENABLE_UNIT_TESTS([yes])` in configure.ac, which is
# **on by default** (--enable-unit-tests yes).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "./Array"
upstream_tests:
  - name: "Array"
    file: "test/Array.c"
    description: "TestAllocOversizeArrays() + TestZeroFillARRAYofARRAY8(): XdmcpAlloc/Realloc/Dispose* reject oversized allocations and zero-fill new arrays. 18+ assert() calls; main() exits 0 on success."
    source_dir: "test"
    expected_assertions: 18   # 8 TestAllocOversize * 3 asserts + 8 TestZeroFill * 2 asserts ≈ 18+

test_package_tests:
  - file: test.c
    description: "Link libXdmcp and round-trip CARD8/CARD16/CARD32 values through an XdmcpBuffer using XdmcpWriteCARD8/16/32 + XdmcpReadCARD8/16/32; verify pointer increments and XdmcpReadRemaining at EOF."
    command: "test_libxdmcp"

assertion_count: 13
