# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbcrypt/1.3
homepage: "https://www.openwall.com/crypt/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: crypt_test.c
    source: crypt_blowfish-1.3/wrapper.c
    description: "Upstream crypt_test: runs bcrypt self-test and benchmark"
    command: "./crypt_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verifies crypt_rn() and crypt_gensalt_rn() produce valid bcrypt hashes"
    command: "./test_libbcrypt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
