# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lmod/9.2.5
homepage: https://github.com/TACC/Lmod

# 上游测试命令
upstream_check_command: module --version

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

# Lmod 上游测试套件（busted 框架）
upstream_tests:
  - name: "Lmod Test Suite"
    source: https://github.com/rtmclay/Lmod_test_suite
    description: "Lmod 上游 busted 测试框架，1300+ 单元测试"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "module 命令完整生命周期测试（version/help/avail/list/load/unload/purge/spider/env_vars）"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 20
