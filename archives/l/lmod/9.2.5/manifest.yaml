software: lmod
version: "9.2.5"
status: built
build_date: "2026-07-26"
build_system: autotools

source:
  url: "https://github.com/TACC/Lmod/archive/refs/tags/9.2.5.tar.gz"
  sha256: "e913f9199a77104cc915a3c1a65e4c700ed048cef15857e93881d79887efc568"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-lua=<lua-package-folder> (由 Conan dependencies 动态设置)"
  dependencies:
    - lua/5.5.0
    - luaposix/36.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "lmod 是 Autotools 构建的 Lua 应用程序，需要 --with-lua 指定 Lua 安装路径 (R26)"
  - "作为工具型包（tool），需要创建 commands.json 声明可执行文件"
  - "依赖 lua/5.5.0 已在项目中被适配，使用 Conan 依赖管理"
