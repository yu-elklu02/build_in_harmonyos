# test_package/MANIFEST.yml — libfuse/3.18.2

package: libfuse/3.18.2
homepage: "https://github.com/libfuse/libfuse"

# Upstream test command
upstream_check_command: "meson test -C builddir"

# conanfile.py build() does not run upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (from upstream test/ directory)
upstream_tests:
  - file: test/test_syscalls.c
    source: libfuse-3.18.2/test/test_syscalls.c
    description: "Test fuse system calls"
    command: "./test_syscalls"

# test_package consumer-side test
test_package_tests:
  - file: test.c
    description: "Verify libfuse3 API linkage (fuse_parse_cmdline)"
    command: "./test_libfuse"

assertion_count: 1
