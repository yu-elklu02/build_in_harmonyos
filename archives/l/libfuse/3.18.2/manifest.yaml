knowledge_gained:
- libfuse uses Meson build system, not Autotools
- 'OHOS: host_machine.system() returns ''harmonyos'' (not ''linux''), so startswith(''linux'')
  checks in meson.build fail — need to add harmonyos support'
- 'OHOS: mount_bsd.c is selected instead of mount.c — need patch meson.build to treat
  ''harmonyos'' like ''linux'''
- 'OHOS: pthread_cancel/pthread_setcancelstate not available — need POSIX feature
  detection (HAVE_PTHREAD_CANCEL) in meson.build + source guards'
- dl and rt libraries are integrated into libc on OHOS — no extra linking needed
- Conan validate() must accept OHOS alongside Linux and FreeBSD
