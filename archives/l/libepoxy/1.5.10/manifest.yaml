software: libepoxy
# 版本级 manifest
# 文件位置: archives/l/libepoxy/1.5.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.10"
status: built
build_date: "2026-08-02"

source:
  url: "https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.tar.gz"
  sha256: "a7ced37f4102b745ac86d6a70a9da399cc139ff168ba6b8002b4d8d43c900c15"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dglx=no"
    - "-Degl=no"
    - "-Dx11=false"
    - "-Dtests=false"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-python3-gen-dispatch.patch"

knowledge_gained:
  - "OHOS 无窗口系统：禁用 GLX/EGL/X11（-Dglx=no -Degl=no -Dx11=false）"
  - "gen_dispatch.py 需 python3 显式调用（设备文件系统无法 shebang 直接执行，E081 同类）"
  - "R26：静态构建避免污染 /lib"
  - "llvm-ar/llvm-ranlib 需注入 conan_meson_native.ini（clang 工具链在 /data/service/hnp/bin）"
