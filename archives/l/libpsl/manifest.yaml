  "0.21.5.1":
    packaging: conan
    status: built
    build_date: "2026-08-07"
    notes: >-
      首个 conan 配方（原 0.21.5 条目是手工构建时代的记录，带 patches、无 conanfile.py）。
      版本取 0.21.5.1 按仓内 repack 惯例另起，不动既有条目；源码仍是上游 0.21.5。
      **本包未打任何补丁**——手工时代那版带 patches，本包一个都不需要。
      运行时 IDNA 选 libidn2（IDNA2008，上游默认），不选 libicu（仓里无对应包）与 libidn（过时的 IDNA2003）。
      真机 conan create 通过；test_package 用 PSL 有唯一答案的查询精确对账（com 是公共后缀、
      example.com 不是、co.uk 是、bar.co.uk 不是、www.example.com 的可注册域是 example.com、
      a.b.bar.co.uk 的是 bar.co.uk、com 本身无可注册域须返回 NULL），
      另加内置数据规模检查（实测 9556 条）——数据被截断时前面的断言仍可能侥幸通过，只有这条能抓住。
