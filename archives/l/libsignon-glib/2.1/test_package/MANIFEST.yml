# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: libsignon-glib/2.1
homepage: "https://gitlab.com/accounts-sso/libsignon-glib"

# Upstream test command
upstream_check_command: "meson test --list"

# conanfile.py build() does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (tests/check_signon.c)
upstream_tests:
  - file: tests/check_signon.c
    source: libsignon-glib-2.1/tests/check_signon.c
    description: "Signon GLib integration test using libcheck"
    command: "meson test"

# test_package tests (consumer verification)
test_package_tests:
  - file: test.c
    description: "Consumer test - verifies signon_identity_new(), SIGNON_TYPE_IDENTITY, and signon_error_quark()"
    command: "./test_libsignon-glib"

# Test assertion count (approximate)
assertion_count: 3
