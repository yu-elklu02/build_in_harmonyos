test_package:
  type: consumer
  language: c
  requires:
    - lua-penlight/1.15.0
    - luafilesystem/1.8.0-1
    - lua/5.4.8.1
  entrypoint: test_lua_penlight.c
  checks:
    - require Penlight modules through LUA_PATH
    - require lfs through LUA_CPATH
    - verify pl.path, pl.dir, and pl.tablex behavior
