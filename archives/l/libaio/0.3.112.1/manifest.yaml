version: "0.3.112.1"
software: libaio
build_system: makefile
status: built
build_date: "2026-08-11"

source:
  url: "https://releases.pagure.org/libaio/libaio-0.3.112.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-harness-cases-13.t.patch"
  - "0002-harness-cases-22.t.patch"
  - "0003-io_pgetevents-ohos-sigsys.patch"

knowledge_gained:
  - "libaio uses plain Makefile (not autotools), top-level Makefile delegates to src/Makefile"
  - "Compiler path must be obtained from Conan conf (self.conf.get) not shell env vars (R33)"
  - "tools.build:compiler_executables is a dict, access via .get('c') not sub-key syntax"
  - "make -C self.source_folder needed because Conan runs build in a subfolder"
  - "Some AIO test cases segfault on HarmonyOS due to unimplemented syscalls (E051)"
  - "OHOS kernel triggers SIGSYS (signal 31) for io_pgetevents (syscall 292) instead of returning -ENOSYS like Linux"
  - "libaio _body_io_syscall macro assumes syscall() always returns — OHOS violates this for unimplemented syscalls"
  - "Fix: undef __NR_io_pgetevents on __OHOS__ to fall through to -ENOSYS stub in io_pgetevents.c"
  - "package_info must declare system_libs=['c'] because libaio depends on syscall() and __errno_location() from libc"
