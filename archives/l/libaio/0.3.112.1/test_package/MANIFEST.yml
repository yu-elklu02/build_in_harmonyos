# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libaio/0.3.112.1
homepage: "https://pagure.io/libaio"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make partcheck"

# 上游实际运行的测试程序
upstream_tests:
  - file: harness/cases/2.t
    source: libaio-0.3.112/harness/cases/2.t
    description: "io_setup parameter validation"
    command: "./cases/2.p"
  - file: harness/cases/3.t
    source: libaio-0.3.112/harness/cases/3.t
    description: "io_submit parameter validation"
    command: "./cases/3.p"
  - file: harness/cases/14.t
    source: libaio-0.3.112/harness/cases/14.t
    description: "io_submit with zero iocbs"
    command: "./cases/14.p"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: io_queue_init + io_queue_release 生命周期验证"
    command: "./test_libaio"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
