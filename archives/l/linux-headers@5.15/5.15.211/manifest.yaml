software: linux-headers@5.15
version: "5.15.211"
status: built
build_date: "2026-07-16"
build_system: custom

source:
  url:
    - "https://mirrors.ustc.edu.cn/kernel.org/linux/kernel/v5.x/linux-5.15.211.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/kernel/v5.x/linux-5.15.211.tar.xz"
    - "https://mirrors.edge.kernel.org/pub/linux/kernel/v5.x/linux-5.15.211.tar.xz"
    - "https://www.kernel.org/pub/linux/kernel/v5.x/linux-5.15.211.tar.xz"
    - "https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.15.211.tar.xz"
  sha256: "beb954e53617928b751944a89b6670bf9a9c7177c641b24c5dba504e46f1d961"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "make headers_install ARCH=arm64 INSTALL_HDR_PATH=$DEFAULT_PREFIX"
  dependencies:
    - "rsync/3.3.0 (build tool)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "linux-headers@5.15 is packaged as the legal Conan reference linux-headers-5.15/5.15.211."
  - "Kernel UAPI headers should be installed with make headers_install instead of raw include copying."
  - "Linux 5.15 headers_install invokes rsync, so rsync/3.3.0 is an explicit build requirement."
  - "Conan tool requirements are not guaranteed to expose cpp_info.bindirs on PATH during package(), so the rsync package bin directory is explicitly prepended for make headers_install."
  - "The 126.8MB upstream kernel tarball can be too slow on the CI worker's direct kernel.org route, so source() checks DOWNLOAD_CACHE and tries same-hash authoritative kernel mirrors before the canonical kernel.org URLs."
