# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: lice5/5.3.0
homepage: "https://salsa.debian.org/debian/lice5"

# lice5 is a pure script resource package with no upstream test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (pure script package)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify script resources exist and directory structure is complete"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 5
