# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.4.2.1"

# 软件名
software: libavif

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/AOMediaCodec/libavif/archive/refs/tags/v1.4.2.tar.gz"

  # 源码校验和
  sha256: "2b645287340ba5a631d268b551dc2d72bd73ac33335962dd36dcdb6d8366921d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DAVIF_CODEC_DAV1D=SYSTEM"
  - "-DAVIF_LIBYUV=OFF"
  - "-DAVIF_BUILD_APPS=OFF"
  - "-DAVIF_BUILD_TESTS=OFF"
  - "-DAVIF_BUILD_EXAMPLES=OFF"
  - "-DAVIF_BUILD_MAN_PAGES=OFF"
  - "-DBUILD_SHARED_LIBS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - dav1d/1.5.0
  - libjpeg-turbo/3.2.0
  - libpng/1.6.58
  - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []
