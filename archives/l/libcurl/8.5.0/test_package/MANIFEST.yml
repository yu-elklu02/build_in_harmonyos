# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcurl/8.5.0
homepage: https://curl.se

# 上游测试命令 (探索阶段执行)
# 本机 OHOS 构建环境实测: Debug 构建 (ENABLE_DEBUG=ON + BUILD_TESTING=ON) 下运行
upstream_check_command: "perl tests/runtests.pl -c src/curl -a"
upstream_test_in_build: false
upstream_test_command: "make testdeps && perl tests/runtests.pl -c src/curl -a"

# 上游测试套件实测 (2026-07-31, HarmonyOS PC aarch64, 本机运行)
# 通过率: unit 44/45, 协议/工具测试 1022/1022
upstream_tests:
  - name: "unit 单元测试 (tests/unit/)"
    source: tests/unit/unit*.c
    description: "curl 内部单元测试 (llist/netrc/urlapi/fnmatch/altsvc/httppost 等), 离线运行"
    count: 45
    passed: 44
    failed:
      - name: unit1307
        reason: "系统 fnmatch 平台差异: OHOS (musl) 的 fnmatch 行为与 glibc 不同, 非适配缺陷"
  - name: "协议/工具测试 (tests/ via runtests.pl)"
    source: tests/data/test* + tests/libtest/lib*.c
    description: "HTTP/FTP/IMAP/POP3/SMTP/RTSP/TFTP 等协议级用例, 本地服务器 (127.0.0.1) 驱动, 不依赖外部网络"
    count: 1022
    passed: 1022
  - name: "符号校验脚本 (test1119/test1167)"
    source: tests/symbol-scan.pl + tests/badsymbols.pl
    description: "symbols-in-versions 与头文件同步校验; OHOS 环境注入 clang-cpp 为 cpp 后通过"
    count: 2
    passed: 2

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libcurl.c
    description: "libcurl init/version/setopt: curl_global_init → curl_easy_init → curl_version → curl_easy_setopt(URL)"
    command: "./test_libcurl"

# 测试断言总数 (approximate: unit 45 + 协议 1022 + 符号校验 2)
assertion_count: 1069
