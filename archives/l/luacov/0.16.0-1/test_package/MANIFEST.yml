test_package:
  type: conan
  language: c
  framework: lua-embed-smoke
  tests:
    - name: require-luacov
      command: ./test_luacov
      expected: "luacov smoke ok"
  dependencies:
    - "lua/5.4.8.1"
    - "datafile/0.11-1"
  notes:
    - "Compiles a C Lua embedding smoke test and loads luacov modules through Conan LUA_PATH."

