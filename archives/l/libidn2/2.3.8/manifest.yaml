software: libidn2
version: "2.3.8"
build_system: autotools
status: pending            # mac 交叉编译验证通过（编译/链接/ELF/符号面），待真机 conan create + test_package 运行断言
source:
  url: "https://ftpmirror.gnu.org/gnu/libidn/libidn2-2.3.8.tar.gz"
  sha256: "f557911bf6171621e1f72ff35f5b1825bb35b52ed45325dcdee931e5d3c0787a"
knowledge_gained:
  - "libidn2 依赖 libunistring（IDNA/Unicode 表）+ libiconv；接制品仓 libunistring/1.0 + libiconv/1.17（均 static .a），产物 .so 把二者静态并入，DT_NEEDED 仅剩 libc.so"
  - "config.sub 原生认 aarch64-linux-ohos（2.3.8 的 build-aux 够新），无需补丁"
  - "公开头是 <idn2.h>（非 libidn2.h）；导出符号带 IDN2_0.0.0 版本标记（idn2.map version script）"
  - "设备 conan create 需 -r ohpcd：conancenter 的 libiconv/1.17 旧修订(9923bc…)会抢占制品仓修订(894aea…)，算出的 package_id 远端无二进制 → Missing binary"
  - "mac 交叉验证坑①：PATH 里 DevEco sdk/openharmony/toolchains 的 diff 任何参数都返回 0，会 shadow 系统 diff，令 config.status 永判 config.h unchanged 从不落盘"
  - "mac 交叉验证坑②：configure 在 mac 找到 Apple ld64 → with_gnu_ld=no → libtool archive_cmds 为空、.so 静默不链接；须显式 LD=<sdk>/llvm/bin/ld.lld + --with-gnu-ld（设备原生编译无此问题）"
  - "构建期生成器 gendata/gentr46map 用 $(CC) 编译（无 CC_FOR_BUILD 机制），交叉时是 aarch64 二进制、构建机跑不了；发布 tarball 自带预生成的 lib/{data,tr46map_data}.c，保持其 mtime 新于 gendata.c 即不触发重生成（设备/CI 原生编译则无碍）"
