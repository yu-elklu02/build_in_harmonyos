# 软件级 manifest
# 文件位置: archives/l/libidn2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libidn2

# 显示名
display: "libidn2"

# 一句话描述
description: "IDNA 2008 国际化域名处理库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://www.gnu.org/software/libidn/libidn2/"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "依赖 libunistring，需先编译安装"
    - "标准 autotools 构建系统，无需特殊补丁"
    - "musl 动态链接器限制，需静态链接"

  # 跨版本通用依赖
  common_dependencies:
    - libunistring

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.3.8":
    status: published
    build_date: "2026-05-20"
    build_type: static_linked
  "2.3.7.1":
    packaging: conan
    status: built
    build_date: "2026-08-07"
    notes: >-
      首个 conan 配方。版本取 2.3.7.1 而非 2.3.7：archives/l/libidn2/2.3.7
      已是手工构建时代**已发布**的条目（status: published，16 个补丁，build_system: autoconf），
      按仓内 repack 惯例另起版本号做 conan 化，不改动那个既有条目；源码仍是上游 2.3.7。
      **本包未打任何补丁** —— 手工时代那版打了 16 个（config.guess/config.sub 的 HarmonyOS 识别等），
      本包一个都不需要，大概率是 conan 的 AutotoolsToolchain 把 --build/--host 三元组给全了。
      真机 conan create 通过；test_package 用 RFC 标准测试向量精确对账
      （münchen→xn--mnchen-3ya 等 3 组）+ A-label 往返还原 + ASCII 透传 + 超长标签必须报错。
