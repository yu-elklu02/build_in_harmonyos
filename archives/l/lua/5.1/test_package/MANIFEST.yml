package: lua/5.1
homepage: "https://www.lua.org/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - file: test/hello.lua
    source: lua-5.1.tar.gz/test/hello.lua
    description: "Run the official hello.lua script with the freshly built interpreter"
    command: "make test"

test_package_tests:
  - file: test_lua51.c
    description: "Create a Lua 5.1 state and verify the math/package libraries, version, and require function"
    command: "./test_lua51"

assertion_count: 6
