package: lua/5.4.8.1
homepage: https://www.lua.org/

upstream_check_command: "make -C src test"
upstream_test_in_build: true
upstream_test_command: "make -C src test"
upstream_tests:
  - file: src/Makefile
    source: lua-5.4.8.tar.gz/src/Makefile
    description: "Run the official test target with the freshly built Lua interpreter"
    command: "make -C src test"

test_package_tests:
  - file: test_lua.c
    description: "Create a Lua state, execute code, and validate the result"
    command: "./test_lua"
  - file: conanfile.py
    description: "Run packaged lua and luac version commands"
    command: "lua -v && luac -v"

assertion_count: 4
