software: lua
version: "5.4.8.1"
status: built
build_date: "2026-08-07"
build_system: makefile
package_type: static-library
license: MIT
homepage: "https://www.lua.org/"

source:
  url: "https://www.lua.org/ftp/lua-5.4.8.tar.gz"
  sha256: "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae"
  tar_format: tar.gz

build:
  system: makefile
  target: generic
  dependencies: []
  cc: clang
  ar: llvm-ar
  ranlib: llvm-ranlib
  cflags:
    - "-fPIC"
    - "-DLUA_USE_POSIX"
    - "-DLUA_USE_DLOPEN"
  system_libs:
    - dl
    - m

artifacts:
  - include/lua.h
  - include/lualib.h
  - include/lauxlib.h
  - include/lua.hpp
  - include/luaconf.h
  - lib/liblua.a
  - bin/lua
  - bin/luac

validation:
  upstream_tests: "make -C src test is executed during build()"
  consumer_smoke: true
  pathb_usage: "Consumed as the Lua CLI/static-library baseline in the Neovim/Vusted/Busted Path B integration chain."

notes:
  - "This is an OHOS package revision of upstream Lua 5.4.8."
  - "The package exposes lua/luac through bin/ and Conan runenv PATH for Lua-based upstream test runners."
  - "The recipe uses the generic target and does not require readline."
