# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.5.0"

# 软件名
software: "lua"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-16"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.lua.org/ftp/lua-5.5.0.tar.gz"

  # 源码校验和
  sha256: "57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建系统（质量门禁兼容字段）
  build_system: makefile

  # 配置选项列表（Lua 使用 make 参数，不是 configure）
  configure_options:
    - "linux"
    - "CC=clang"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Lua 5.5.0 使用 'linux' 平台目标（非 linux-readline），无需 readline 依赖"
  - "鸿蒙系统默认使用 clang，需通过 CC=clang 指定"
  - "Lua Makefile 不支持 DESTDIR，使用 INSTALL_TOP 指定安装目录"
