# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lua/5.5.0
homepage: "https://www.lua.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: lua.c
    source: lua-5.5.0/src/lua.c
    description: "Lua interpreter - runs lua -v to verify version"
    command: "./lua -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 lua C API 执行 2+3 并验证结果"
    command: "./test_lua"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
