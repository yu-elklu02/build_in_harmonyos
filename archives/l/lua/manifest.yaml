software: lua
display: "Lua"
description: "A powerful, efficient, lightweight, embeddable scripting language"
category: language
homepage: "https://www.lua.org"
license: MIT
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "鸿蒙系统默认使用 clang，需要指定 CC=clang"
    - "Lua Makefile 不支持标准 DESTDIR 模式，需使用 INSTALL_TOP"
    - "linux-readline 变体可用于交互式命令行编辑"
    - "5.4.8.1 包修订使用 generic 目标，并打包 lua/luac CLI 供 Lua 测试框架复用"
  common_dependencies:
    - "readline（仅 linux-readline 变体需要）"

# 版本索引
versions:
  "5.4.8":
    status: built
    build_date: "2026-05-26"
  "5.4.8.1":
    status: built
    build_date: "2026-08-07"
  "5.5.0":
    status: built
    build_date: "2026-05-26"
