package: lua/5.4.8
homepage: https://www.lua.org/

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - file: src/lua.c
    source: lua-5.4.8.tar.gz/src/lua.c
    description: "Run the freshly built official Lua interpreter version test"
    command: "make test"

test_package_tests:
  - file: test_lua.c
    description: "Create a Lua state, execute code, and validate the result"
    command: "./test_lua"

assertion_count: 4
