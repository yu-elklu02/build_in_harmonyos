software: libsmb2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（顶层字段，用于G4门禁检查）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-23"
compile_date: "2026-07-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sahlberg/libsmb2/archive/refs/tags/libsmb2-6.2.tar.gz"

  # 源码校验和
  sha256: "8e1f9efc6b2e0f6546f0fe121ac0ddf4fc2f0908ae5a6bd1f185be7c9e0bcbb3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 'System is unknown to cmake' 警告不阻塞编译，CMake 仍能正确检测鸿蒙平台编译器和头文件"
  - "libsmb2 仅依赖 libc.so，无外部库依赖，适合鸿蒙嵌入式环境"
  - "上游 .pc 文件版本号硬编码为 6.1.0，实际编译版本 6.2，不影响功能"
  - "gssapi/krb5 头文件缺失不影响核心 SMB 功能（NTLM 认证足够）"
  - "上游 tests/ 目录包含 2 个 C 单元测试和 13 个 shell 集成测试，由 autotools make check 执行；CMake 构建未集成测试目标，shell 测试需运行中的 SMB 服务端"

# 测试结果
test_passed: 20
test_failed: 0
test_results:
  upstream_unit_tests: "未执行 (CMake 构建未集成 autotools 测试目标; aes128ccm-test.c 和 smb2-dcerpc-coder-test.c 需手动编译)"
  upstream_integration_tests: "未执行 (13个 shell 脚本需要运行中的 SMB 服务端, 鸿蒙环境无可用服务端)"
  functional_test: "PASS (20/20 自定义功能测试全部通过)"
  elf_integrity: "PASS (64-bit ARM ELF, 仅依赖 libc.so)"
  pkg_config: "PASS (modversion/cflags/libs 查询正常)"
  link_test: "PASS (编译链接成功，运行无错误)"
