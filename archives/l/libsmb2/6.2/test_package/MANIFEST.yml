# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsmb2/6.2
homepage: "https://github.com/sahlberg/libsmb2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游使用 autotools (make check / make test) 执行测试
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
# CMake 构建不集成 autotools 测试，C 单元测试需手动编译
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 来源: tests/ 目录 (autotools Makefile.am)
upstream_tests:
  # C 单元测试 (无需 SMB 服务端)
  - file: "tests/aes128ccm-test.c"
    type: unit
    description: "AES-128-CCM 加密/解密单元测试"
  - file: "tests/smb2-dcerpc-coder-test.c"
    type: unit
    description: "DCE-RPC 编解码单元测试"
  # Shell 集成测试 (需要运行中的 SMB 服务端)
  - file: "tests/test_0100_ls_basic.sh"
    type: integration
    description: "ls 基本功能测试"
  - file: "tests/test_0101_ls_basic_valgrind.sh"
    type: integration
    description: "ls + valgrind 内存检查"
  - file: "tests/test_0102_ls_basic_socket_error.sh"
    type: integration
    description: "ls socket 错误注入测试"
  - file: "tests/test_0103_ls_basic_valgrind_malloc_error.sh"
    type: integration
    description: "ls valgrind malloc 错误注入测试"
  - file: "tests/test_0200_mkdir.sh"
    type: integration
    description: "mkdir 基本功能测试"
  - file: "tests/test_0201_mkdir_valgrind.sh"
    type: integration
    description: "mkdir + valgrind 内存检查"
  - file: "tests/test_0210_cp_basic.sh"
    type: integration
    description: "cp 基本功能测试"
  - file: "tests/test_0211_cp_valgrind.sh"
    type: integration
    description: "cp + valgrind 内存检查"
  - file: "tests/test_0212_cp_valgrind_socket_error.sh"
    type: integration
    description: "cp valgrind socket 错误注入测试"
  - file: "tests/test_0300_cat_basic.sh"
    type: integration
    description: "cat 基本功能测试"
  - file: "tests/test_0301_cat_valgrind.sh"
    type: integration
    description: "cat + valgrind 内存检查"
  - file: "tests/test_0302_cat_valgrind_socket_error.sh"
    type: integration
    description: "cat valgrind socket 错误注入测试"
  - file: "tests/test_900_dcerpc.sh"
    type: integration
    description: "DCE-RPC 功能测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsmb2.c
    description: "消费者测试 - 调用 smb2_get_libsmb2Version/smb2_init_context/smb2_set_user/smb2_parse_url/smb2_destroy_context API"
    command: "./test_libsmb2"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 2 C 单元测试 + 13 shell 集成测试 = 15
# test_package: 4 断言
assertion_count: 19
