# 软件级 manifest
# 文件位置: archives/l/libsmb2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libsmb2

# 显示名
display: "libsmb2"

# 一句话描述
description: "Client library for accessing SMB shares via SMB2/SMB3 protocol"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: network

# 官网 URL
homepage: "https://github.com/sahlberg/libsmb2"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "CMake 检测到 'System is unknown to cmake' 警告，不阻塞编译，CMake 仍能正确检测编译器和头文件"
    - "项目同时支持 CMake 和 autotools，推荐使用 CMake"
    - "gssapi/krb5 头文件缺失不影响核心 SMB 功能（NTLM 认证足够）"
    - "无需任何源码补丁即可编译通过"
    - "上游 .pc 文件版本号可能硬编码，实际版本以 tag 为准"

  # 跨版本通用依赖
  common_dependencies: []
  # libsmb2 是纯 C 实现，仅依赖 libc，无外部库依赖

# ============================================================
# 版本索引
# ============================================================

versions:
  "6.2":
    status: published
    build_date: "2026-07-23"
    build_system: cmake
