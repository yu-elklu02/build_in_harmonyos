# 软件级 manifest — libdvdnav
# 文件位置: archives/l/libdvdnav/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / 模板 templates/manifest-software.yaml

# ============================================================
# 必须字段
# ============================================================

software: libdvdnav
display: "libdvdnav"
description: "DVD 导航库（菜单/多角度/交互回放）"
category: library
homepage: "https://www.videolan.org/developers/libdvdnav.html"
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: meson

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "meson 构建，wrap_mode=nodownload，禁联网 wrap"
    - "依赖 libdvdread >=6.0.0，按官方 CI vendoring 为 subprojects/libdvdread"
    - "dvdread 通过 dlfcn 动态探测 libdvdcss，OHOS dlopen 可用"
    - "默认静态（R26 非系统同名库，default_library=static）"
  common_dependencies:
    - libdvdread
    - pthread

# ============================================================
# 版本索引
# ============================================================

versions:
  "7.0.0":
    status: built
    build_date: "2026-07-28"
