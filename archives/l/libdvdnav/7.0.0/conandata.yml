# conandata.yml — libdvdnav 7.0.0
# 本文件是源码 URL + SHA256 + 补丁声明的单一真相来源。
# conanfile.py 通过 self.conan_data["sources"] 读取，apply_conandata_patches() 应用补丁。
#
# 源码全部来自官方正式源（videolan.org 官方 release）：
#   - libdvdnav 7.0.0 主源码
#   - libdvdread 7.1.1 vendored 子项目源码（官方 .gitlab-ci.yml 做法：
#     git clone ... subprojects/libdvdread；此处用官方 tarball 替代 git clone）
#
# R39：URL 指向官方正式源；CI 自动添加镜像 fallback。

sources:
  libdvdnav:
    url: "https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz"
    sha256: "a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e"
  libdvdread:
    url: "https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz"
    sha256: "a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9"
  # meson 构建工具源码：hmbs 预检真机 HMBS_PYTHON3 的 site-packages 无 mesonbuild，
  # vendor meson 1.11.2 源码，解压到 site-packages（directx-headers notes 验证版本）。
  meson:
    url: "https://github.com/mesonbuild/meson/releases/download/1.11.2/meson-1.11.2.tar.gz"
    sha256: "698feae069cef3ecd4d7aaf281d7df359bdfcf555a9a1564383d3b913fa8a736"

# 补丁说明：libdvdread 的 musl off64_t 移植补丁不以 conandata.yml 的 patches 节声明，
# 因 Conan apply_conandata_patches 按版本号匹配 patches 键，vendored 子项目用 "libdvdread"
# 非标准键不匹配任何包版本——声明了也是静默空操作。
# 补丁实际由 conanfile.py 的 build() 方法内联类常量 _MUSL_OFF64_T_PATCH + save() + patch -p1
# 直接打到 self.source_folder/subprojects/libdvdread/ 编译副本，详见该方法注释。
