# 版本级 manifest — libdvdnav 7.0.0
# 遵循 ARCHIVE-SPEC v2.0 / 模板 templates/manifest-version.yaml

# ============================================================
# 必须字段
# ============================================================

version: "7.0.0"
software: libdvdnav

# 编译状态：published | built | failed | archived
# 实测通过后由 CI/fill 写为 published；本地预检为 built。
status: built

build_date: "2026-07-28"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz"
  sha256: "a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e"
  tar_format: tar.xz

# vendored 子项目源码（官方 .gitlab-ci.yml 做法）
vendored_sources:
  - name: libdvdread
    url: "https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz"
    sha256: "a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9"
    destination: "subprojects/libdvdread"

# ============================================================
# 构建配置
# ============================================================

compiler: clang 15
platform: OpenHarmony aarch64
default_options:
  shared: false
  fPIC: true
  with_dvdcss: false

# 上游无测试套件：.gitlab-ci.yml 仅 meson compile（无 meson test），
# tarball 仅含 examples/ 与 doc/，无 test/ 目录。
# test_package 自建真实调用 libdvdnav API 的最小验证程序。
upstream_tests_exist: false

# ============================================================
# 产物
# ============================================================

products:
  - name: libdvdnav
    type: static-library
    file: lib/libdvdnav.a
  - name: libdvdnav
    type: shared-library
    file: lib/libdvdnav.so.4.4.0

headers:
  - include/dvdnav/dvdnav.h
  - include/dvdnav/dvdnav_events.h
  - include/dvdnav/dvd_types.h
  - include/dvdnav/version.h

pkg_config: lib/pkgconfig/dvdnav.pc

dependencies:
  - name: libdvdread
    version: ">=6.0.0"
    relation: vendored-meson-subproject
  - name: pthread
    relation: system

patches_applied: []

knowledge_gained:
  - "libdvdnav 7.0.0 为 meson 项目，依赖 libdvdread >=6.0.0"
  - "libdvdread 不在归档中，按官方 .gitlab-ci.yml vendoring 为 subprojects/libdvdread"
  - "上游无测试套件（.gitlab-ci.yml 仅 meson compile）"
  - "libdvdread 默认通过 dlfcn 动态探测 libdvdcss，OHOS dlopen 可用"
