  meson_test_list_output: "meson test --list → No tests defined"
  reason: "libdvdnav 7.0.0 上游无测试套件：meson.build 无 test()/benchmark()，meson_options 无 enable_tests，.gitlab-ci.yml 仅 meson compile，tarball 仅 examples/ 与 doc/ 无 test/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
