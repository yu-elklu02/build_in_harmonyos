  source_sha256: "a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e"
  top_level_files:
    - meson.build           # 仅 project() + subdir('src') + subdir('doc') + subdir('examples')，无 test() / benchmark()
    - meson_options.txt     # 仅 enable_docs / enable_examples，无 enable_tests
    - .gitlab-ci.yml        # 仅 meson compile（无 meson test / meson test --setup）
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "meson.build test() / benchmark()"
