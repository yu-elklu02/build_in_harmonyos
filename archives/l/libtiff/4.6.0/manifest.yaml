software: libtiff
version: "4.6.0"
status: built
build_date: "2026-07-15"
build_system: cmake

source:
  url: "https://gitlab.com/libtiff/libtiff/-/archive/v4.6.0/libtiff-v4.6.0.tar.gz"
  sha256: "fdd1a2a35b20734a5232527a81d7365eb66e54732bfc44474a3124bcb85221c7"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "CMAKE_SYSTEM_NAME=Linux"
    - "BUILD_SHARED_LIBS=OFF"
    - "tiff-docs=OFF"
    - "tiff-tests=OFF"
    - "jbig=OFF"
    - "lerc=OFF"
    - "lzma=OFF"
    - "zstd=OFF"
    - "webp=OFF"
    - "deflate=OFF"

dependencies:
  - "zlib/1.3.1"
  - "libjpeg/10"

products:
  libs:
    - libtiff.a
    - libtiffxx.a
  tools:
    - tiffinfo
    - tiffcp
    - tiffdump
    - tiffset
    - tiffsplit

knowledge_gained:
  - "libtiff 4.6.0 supports CMake build system"
  - "CMake 4.x requires CMAKE_POLICY_VERSION_MINIMUM=3.5 for doc/CMakeLists.txt"
  - "CMake does not recognize HarmonyOS, use CMAKE_SYSTEM_NAME=Linux (E092)"
  - "Source tree has a build/ subdirectory that conflicts with in-source builds"
  - "Dependencies: zlib/1.3.1, libjpeg/10"
