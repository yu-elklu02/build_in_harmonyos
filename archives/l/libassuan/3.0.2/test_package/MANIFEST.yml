package: libassuan/3.0.2
homepage: "https://gnupg.org/software/libassuan/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - name: version
    description: "Checks header and runtime version compatibility."
  - name: pipeconnect
    description: "Runs an Assuan client/server transaction over spawned-process pipes."
  - name: fdpassing
    description: "Checks descriptor passing when supported by the target platform."
  - name: fdpassing-socket.sh
    description: "Checks descriptor passing over a Unix-domain socket when supported."

test_package_tests:
  - file: test.c
    description: "Creates an Assuan server and client over socketpair, sends ECHO data, validates the response, and performs a clean BYE transaction."
    command: "./test_libassuan"
