# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lua-socket/3.1.0
homepage: "https://github.com/lunarmodules/luasocket"

# 上游测试命令
upstream_check_command: "lua test/hello.lua"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/hello.lua
    source: lua-socket-3.1.0/test/hello.lua
    description: "Loads socket and mime modules, prints version info"
    command: "lua test/hello.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Embeds Lua, loads socket/mime modules via require(), tests TCP socket creation, DNS lookup, and MIME base64 round-trip"
    command: "./test_lua_socket <package_folder>"

# 测试断言总数 (近似值)
assertion_count: 12
