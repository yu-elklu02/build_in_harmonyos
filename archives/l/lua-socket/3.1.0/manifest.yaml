software: lua-socket
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# 构建系统类型 (顶层字段，自检需要)
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lunarmodules/luasocket/archive/refs/tags/v3.1.0.tar.gz"

  # 源码校验和
  sha256: "bf033aeb9e62bcaa8d007df68c119c966418e8c9ef7e4f2d7e96bddeca9cca6e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "LUAV=5.4"
    - "CC_linux=clang"
    - "LD_linux=clang"
  # 注: LUAINC_linux 和 MYLDFLAGS 由 Conan 配方从依赖自动获取

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.4.8

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "LuaSocket 使用简单 Makefile，通过 make linux 目标构建，非 autotools/cmake"
  - "Lua C 扩展模块是 .so 文件，由 Lua 解释器运行时加载，非传统链接库"
  - "需要从 Conan 依赖获取 Lua 头文件和库路径"
  - "测试需嵌入 Lua 解释器并通过 require() 加载模块"
