# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libclastfm/0.5
homepage: "https://liblastfm.sourceforge.net/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: true

# 上游测试审计 (源码: libclastfm-0.5.tar.gz, sha256 c9aa7817b557f8d8ef834755740fc813f9351f3185b5bdf4de249bee3675ee42)
upstream_test_audit:
  source_tarball: "libclastfm-0.5.tar.gz"
  source_sha256: "c9aa7817b557f8d8ef834755740fc813f9351f3185b5bdf4de249bee3675ee42"
  top_level_files:
    - Makefile.am        # 仅 SUBDIRS = src + pkgconfig, 无 check 目标
    - configure.ac       # AC_PROG_CC/PKG_CHECK_MODULES(CURL,libcurl), 无 enable_testing/ctest
    - src/Makefile.am    # noinst_PROGRAMS = test example (构建不运行); lib_LTLIBRARIES = libclastfm.la
  upstream_test_files:
    - file: "src/test.c"
      discovered_tests: 5
      tests:
        - { name: "test_artist_get_info",       api: "artist.getInfo"        }
        - { name: "test_album_get_info",         api: "album.getInfo"         }
        - { name: "test_album_search",           api: "album.search"          }
        - { name: "test_track_get_similar",      api: "track.getSimilar"      }
        - { name: "test_user_get_recent_tracks", api: "user.getRecentTracks" }
      upstream_requires:
        - "argv[1]=Last.fm API_KEY (32-char personal developer credential)"
        - "argv[2]=Last.fm API_SECRET (32-char personal developer credential)"
        - "outbound HTTPS to http://ws.audioscrobbler.com/2.0/"
        - "live Last.fm server responses (no fixture/mock injection point in upstream)"
      behavior_without_credentials: "upstream main() returns 1 immediately when argc != 3"
      adaptation: "配方补丁 src/test.c 接受 argc<3 回退到 dummy 凭据 ('0'/'0'); 补丁 lfm_helper.c 用 HMBS_OFFLINE_FIXTURE 拦截每个 curl 调用并返回 vendored Last.fm XML fixtures, 让 5 个测试在隔离环境断言离线 fixture"
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am check target"
    - "ctest / enable_testing"
  scan_result: "0 GTest/pytest matches; upstream uses a hand-rolled main() in src/test.c with 5 hardcoded integration test functions against live Last.fm API. Makefile.am has no check target (noinst_PROGRAMS only builds test/example, does not run them)."
  make_check_output: "Making check in src: Nothing to be done for 'check' (upstream Makefile.am has no check target; 配方绕 libtool 在 build() 手动铆接+运行 ./test 0 0)"
  reason: >-
    libclastfm 0.5 上游 src/test.c 存在 5 个 Last.fm API 集成测试, 上游原生形态依赖
    在线凭据 (API_KEY/API_SECRET) 与外网到 ws.audioscrobbler.com 的实时响应。
    配方通过补丁注入离线 fixture: (1) src/test.c 接受 argc<3 回退 dummy 凭据;
    (2) lfm_helper.c 的 HMBS_OFFLINE_FIXTURE 拦截 curl 调用返回 vendored Last.fm
    XML fixtures; (3) build() 绕过 libtool 铆接 (上游 Makefile.am 硬编码 -static,
    且 libtool 从 libcurl.pc 追 -lssl/-lcrypto 在 OHOS 找不到), 手动 clang 邦
    test.o+libclastfm.a+libcurl.so 铆接后运行 ./test 0 0。5 个测试全部真执行并
    断言 fixture 数据, 退出码 0。故 discovered=5, executed=5, passed=5, skipped=0。

# 上游测试命令 (实际在配方 build() 中执行)
upstream_check_command: "./test 0 0  # 配方 fixture 注入后离线执行, 5 个上游集成测试断言 vendored XML"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test 0 0 (offline fixtures, HMBS_OFFLINE_FIXTURE)"

# 上游实际运行的测试程序 (upstream_tests_exist: true, 配方 fixture 注入后 executed:5)
upstream_tests:
  - file: "src/test.c"
    source: "libclastfm-0.5.tar.gz/src/test.c"
    description: "5 个 Last.fm API 集成测试 (artist.getInfo/album.getInfo/album.search/track.getSimilar/user.getRecentTracks), 配方补丁后离线 fixture 执行"
    command: "./test 0 0"
    executed: true
    passed: 5
    reason: "配方补丁 src/test.c + lfm_helper.c 注入 HMBS_OFFLINE_FIXTURE, curl 调用返回 vendored XML, 5 个测试在真机预检断言通过"

# test_package 中自带的测试 (消费者视角验证, 离线补全)
test_package_tests:
  - file: "test_clastfm.c"
    description: "离线消费者 smoke test: LASTFM_init(\"0\",\"0\")+LASTFM_dinit (curl_global_init 不联网) + 公共枚举/结构体符号可见性"
    command: "./test_clastfm"
  - file: "conanfile.py"
    description: "ctest 调度 test_clastfm 并输出 HMBS 证据标记"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
# test_clastfm.c: 3 断言 (符号可见 / init 成功 / dinit 成功); 上游 5 个集成测试断言 fixture
assertion_count: 8
