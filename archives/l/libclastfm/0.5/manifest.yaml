knowledge_gained:
  - E011: "HMDFS umask 077 权限问题 — configure 的 mktemp ./confXXXXXX 创建的目录权限 070、owner 为 HMDFS 元数据 UID，进程无写权限。解决方案：补丁改用 ${TMPDIR:-$HOME/tmp}/confXXXXXX 并去掉 umask 077。"
  - "上游 5 个集成测试 (src/test.c) 需在线 Last.fm API key/secret + 外网到 ws.audioscrobbler.com，CI 与真机预检隔离环境均不可执行；按守则在 MANIFEST.yml 如实声明 discovered:5/executed:0。"

