package: libkate/0.4.3
homepage: "https://wiki.xiph.org/Kate"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  counting_basis: "6 Automake entries + 3 static groups + 41 round-trip iterations"
  automake_entries:
    - bitwise
    - check_sizes
    - language
    - metadata
    - overflow
    - text
  automake_entry_count: 6
  static_check_groups: 3
  srt_round_trips: 11
  lrc_round_trips: 11
  kate_stream_round_trips: 19
  total_logical_groups: 50

test_package_tests:
  - file: test_libkate.c
    scenario: normal
    description: "Verify version, info lifecycle, valid language, and matching APIs"
    command: "./test_libkate"
  - file: test_libkate.c
    scenario: fault-injection
    description: "Verify that an invalid language tag returns KATE_E_INVALID_PARAMETER"
    command: "./test_libkate --invalid-language"

assertion_count: 9
