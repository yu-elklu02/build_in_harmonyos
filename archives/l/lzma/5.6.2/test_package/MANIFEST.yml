# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzma/5.6.2
homepage: "https://tukaani.org/xz/"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_bcj_exact_size.c
    source: tests/test_bcj_exact_size.c
    description: "Tests BCJ filter with exact size"
    command: "./test_bcj_exact_size"
  - file: test_block_header.c
    source: tests/test_block_header.c
    description: "Tests block header encoding/decoding"
    command: "./test_block_header"
  - file: test_check.c
    source: tests/test_check.c
    description: "Tests integrity check functions (CRC32, CRC64, SHA-256)"
    command: "./test_check"
  - file: test_filter_flags.c
    source: tests/test_filter_flags.c
    description: "Tests filter flags encoding/decoding"
    command: "./test_filter_flags"
  - file: test_filter_str.c
    source: tests/test_filter_str.c
    description: "Tests filter string parsing"
    command: "./test_filter_str"
  - file: test_hardware.c
    source: tests/test_hardware.c
    description: "Tests hardware detection functions"
    command: "./test_hardware"
  - file: test_index.c
    source: tests/test_index.c
    description: "Tests index handling"
    command: "./test_index"
  - file: test_index_hash.c
    source: tests/test_index_hash.c
    description: "Tests index hash computation"
    command: "./test_index_hash"
  - file: test_lzip_decoder.c
    source: tests/test_lzip_decoder.c
    description: "Tests lzip decoder"
    command: "./test_lzip_decoder"
  - file: test_memlimit.c
    source: tests/test_memlimit.c
    description: "Tests memory limit checking"
    command: "./test_memlimit"
  - file: test_stream_flags.c
    source: tests/test_stream_flags.c
    description: "Tests stream flags encoding/decoding"
    command: "./test_stream_flags"
  - file: test_vli.c
    source: tests/test_vli.c
    description: "Tests variable-length integer encoding"
    command: "./test_vli"
  - file: test_microlzma.c
    source: tests/test_microlzma.c
    description: "Tests MicroLZMA encoding/decoding"
    command: "./test_microlzma"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Compression/decompression round-trip test using lzma API"
    command: "./test_lzma"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
