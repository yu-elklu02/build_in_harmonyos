version: "5.6.2"
software: lzma
status: built
build_date: "2026-07-15"
build_system: cmake

source:
  url: "https://github.com/tukaani-project/xz/releases/download/v5.6.2/xz-5.6.2.tar.xz"
  tar_format: tar.xz
  sha256: "a9db3bb3d64e248a0fae963f8fb6ba851a26ba1822e504dc0efd18a80c626caf"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  build_tool: cmake
  notes: >
    Uses CMake instead of Autotools because autotools config.status
    fails on HarmonyOS due to HMDFS temp directory permission issues.

products:
  libraries:
    - liblzma
  executables:
    - xz
    - xzdec
    - lzmadec
    - lzmainfo
