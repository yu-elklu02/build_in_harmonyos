# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libgsf/1.14.51
homepage: "https://gitlab.gnome.org/GNOME/libgsf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libgsf 测试为 perl 脚本套件 (tests/t*.pl)。
# 适配修复：shebang 改为 /usr/bin/env perl；XML::Parser 2.59 已从清华 CPAN 镜像
# 源码编译安装 (expat 本地库 + Makefile.PL rpath 解决 HMDFS 加载)。
# make check 结果：7 PASS / 2 SKIP / 0 FAIL / 0 ERROR——zipinfo 已存在于制品仓
# (zipinfo/6.0.2 独立包已合入 main)，原因 zipinfo 缺失而 SKIP 的 7 个测试
# (t1000-t1005/t9999) 恢复实际执行并全部 PASS；剩余 2 SKIP (t8000/t8020)
# 因 valgrind 不可用（valgrind 3.24.0 已本地编译成功，但本环境运行时 SIGSEGV
# 无法执行被测程序），属测试可选依赖。
upstream_tests:
  - file: tests/t1000-zip-single.pl
    source: libgsf-1.14.51/tests/t1000-zip-single.pl
    description: "ZIP 单文件读写测试 (perl，依赖 XML::Parser)"
    command: "./t1000-zip-single.pl"
  - file: tests/t1001-zip-multiple.pl
    source: libgsf-1.14.51/tests/t1001-zip-multiple.pl
    description: "ZIP 多文件读写测试"
    command: "./t1001-zip-multiple.pl"
  - file: tests/t1002-zip-aaaa.pl
    source: libgsf-1.14.51/tests/t1002-zip-aaaa.pl
    description: "ZIP 文件追加测试"
    command: "./t1002-zip-aaaa.pl"
  - file: tests/t1003-zip-noise.pl
    source: libgsf-1.14.51/tests/t1003-zip-noise.pl
    description: "ZIP 容错测试"
    command: "./t1003-zip-noise.pl"
  - file: tests/t1004-zip-zip64.pl
    source: libgsf-1.14.51/tests/t1004-zip-zip64.pl
    description: "ZIP64 测试"
    command: "./t1004-zip-zip64.pl"
  - file: tests/t1005-zip-nonseekable.pl
    source: libgsf-1.14.51/tests/t1005-zip-nonseekable.pl
    description: "非 seekable 流 ZIP 测试"
    command: "./t1005-zip-nonseekable.pl"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: gsf_init + gsf_input_memory_new + gsf_input_size + gsf_input_read 实质调用"
    command: "./test_libgsf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
