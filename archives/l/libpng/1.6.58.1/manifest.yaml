version: '1.6.58.1'
status: built
build_date: '2026-08-06'

source:
  url: 'https://downloads.sourceforge.net/libpng/libpng-1.6.58.tar.gz'
  sha256: '8c9b05b675ca7301a458df2c2e46f26e1d41ff36b8863f8c33530bc58c2e6225'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--enable-shared --disable-static'
    - '--disable-shared --enable-static'
  dependencies:
    - 'zlib/1.3.2'
  cc: clang

patches_applied: []

knowledge_gained:
  - '选 autotools 而非 CMake：libtool 自管 SONAME libpng16.so.16，避开 ML-0035'
  - '用 POSIX shell 解释 configure，并以 clang -dumpmachine 能力探测值避开 config.guess 平台名猜测'
  - '按 E129 在临时构建副本中放宽 Autoconf 私有 umask，避免 config.status 的 HMDFS setgid 写入失败'
  - '显式重签测试 ELF，并用 POSIX shell 解释 HMDFS 上的外层与嵌套上游测试脚本'
  - 'shared/static 两种配置均执行 36 项上游测试和 2 项消费者断言，唯一总数不重复计数'
  - '两个 pkg-config 文件均使用相对前缀；移除 HMDFS 不可直接执行的 config shell，显式重签两个工具 ELF'
  - '库 png16、pc libpng（install 出 libpng16.pc + libpng.pc 软链）、头 png.h'
  - '适配修复后缀 1.6.58.1 保持上游 v1.6.58 源码不变，将依赖闭包更新到 zlib/1.3.2'

test_results:
  type: official
  total: 36
  passed: 36
  failed: 0
  note: 'Fresh device W3 r17 passed; upstream 36/36; consumer flow 1/1 with 2/2 assertions'
