# Upstream and consumer test declaration for CI L0e.
package: libvorbis/1.3.7
homepage: https://xiph.org/vorbis/

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "./libvorbis_upstream_test"

upstream_tests:
  - file: test/test.c
    source: libvorbis-1.3.7.tar.gz/test/test.c
    description: "Official encode/decode round-trip matrix for 1-8 channels and six sample rates"
    command: "./libvorbis_upstream_test"

test_package_tests:
  - file: test_libvorbis.c
    description: "Version, encoder initialization, comment API, and vorbisfile link validation"
    command: "./test_libvorbis"

assertion_count: 4
