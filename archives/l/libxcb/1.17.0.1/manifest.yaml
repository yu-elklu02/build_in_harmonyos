# 版本级 manifest — libxcb 1.17.0.1
# 文件位置: archives/l/libxcb/1.17.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 继承自 archives/l/libxcb/1.16（status=published, CI 全 L0-L5 通过）

# ============================================================
# 必须字段
# ============================================================

version: "1.17.0.1"

software: libxcb

# 编译状态
# published | built | failed | archived
# built = 配方编写完成，待 HMBS 真机完整验证
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 X.Org archive，tar.xz）
  url: "https://xorg.freedesktop.org/archive/individual/lib/libxcb-1.17.0.tar.xz"

  # 源码校验和（来自 libxcb-1.17.0 announce post, lists.x.org 2024-04-15）
  sha256: "599ebf9996710fea71622e6e184f3a8ad5b43d0e5fa8c4e407123c88a59a6d55"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-devel-docs"
    - "--with-doxygen=no"
    - "--enable-shared"
    - "--disable-static"

  # 编译依赖列表（格式: name/version）
  dependencies:
    required:
      - xorgproto/2025.1
      - libxau/1.0.12      # 1.16 用 1.0.11；升级到 1.0.12（当前归档 + 下游 xcb-util-renderutil 所用）
      - libxdmcp/1.1.5
    build:
      - xcb-proto/1.17.0
    test:
      - check/0.15.2
    optional:
      - "pthread-stubs/0.4（未发布到 ohpcd；OHOS 平台 C runtime 已提供 pthread 符号，configure 对 linux* 主机不要求 pthread-stubs）"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# 0001/0002 针对 1.17.0 tarball 重新生成（LF 行尾、hunks 锚定 1.17.0 实际上下文）；
# 1.16 的 0003（xcb-present.pc.in 加 xcb-dri3）删除——上游 1.17.0 已自带该依赖。
patches_applied:
  - "0001-support-ohos-configure.patch"      # config.sub 接受 linux-ohos triplet + configure umask 077→022 + TMPDIR
  - "0002-use-tmpdir-in-display-test.patch"  # parse_display_unix 测试用 TMPDIR 替代只读 /tmp

# ============================================================
# 知识沉淀
# ============================================================

knowledge_used:
  - "R36: 依赖必须先发布到制品仓——libxcb 的全部依赖（xcb-proto/xorgproto/libxau/libxdmcp/check）均已在 archives/ 下适配"
  - "R37: 制品仓已存在 libxcb/1.17.0（upstream main 依赖链配方 86ec94ec5）→ 适配修复必须递增版本号后缀 1.17.0.1（cnb.cool 不支持同版本多 revision 并存）"
  - "E002: configure umask 077 在 HMDFS 强制 SGID 下创建不可执行临时目录 → 补丁 0001 改 umask 022 + TMPDIR"
  - "E205: config.sub 不识别 linux-ohos triplet → 补丁 0001 加 ohos* OS 与 linux-ohos* kernel-OS 校验"
  - "1.16 真机验证经验：CK_FORK=no、PATH bootstrap、compiler fallback、pkg-config shim、xorgproto transitive component"

knowledge_gained:
  - "HMBS_INSTALL 提供的 install 工具不支持多源调用（install -c -m 644 f1..fN dest 静默 exit 64）；autotools 配方 package() 改为 make install-exec（libtool 单文件安装）+ Conan copy() 手动拷贝头文件/*.pc/man（2026-08-11 真机 Error 64 实测）"

# ============================================================
# 测试信息（HMBS 真机 evidence 填充，本表不臆测数字）
# ============================================================

tests:
  upstream:
    framework: "libcheck（HAVE_CHECK-gated automake check_PROGRAM check_all）+ check-pc-requires"
    build_phase: "make check"
    # 1.16 真机实测：6 total / 5 passed / 0 failed / 1 skipped（L2 no bin/）
    # 1.17.0 真机数字由 HMBS evidence 摘录填入 pr-body 测试表
    result: "（pending true-machine evidence）"
  test_package:
    file: test_package/test.c
    command: "./test_libxcb"
    description: >-
      xcb_parse_display() round-trip + xcb_big_requests_id 生成符号链接验证，
      不依赖真实 X server；继承 1.16 验证过的测试设计
  ci_gates_1_16_reference:
    L0: "pass: all checks passed"
    L1: "pass: upstream tests + test_package executed"
    L2: "skip: no bin/ dir（纯库包，无可执行文件）"
    L4: "pass: patches clean"
    L5: "pass: lib/ has content"
    L1e: "negative test confirmed — test genuinely depends on libxcb"
