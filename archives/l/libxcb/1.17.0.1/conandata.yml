# conandata.yml — libxcb 1.17.0
# Official X.Org release tarball (tar.xz). SHA256 from the libxcb-1.17.0
# announce post on lists.x.org (2024-04-15).
#
# Patches 0001/0002 are re-generated against the 1.17.0 tarball (LF line
# endings, hunks anchored to 1.17.0's actual context). The 1.16 hunks do
# NOT apply verbatim: build-aux/config.sub grew cos*/mbr* variants and the
# configure mingw/mktemp regions drifted in line number. Patch 0003 from
# 1.16 is dropped because upstream 1.17.0's xcb-present.pc.in already
# lists xcb-dri3 in Requires.private.
# 1.16's conandata.yml did not declare per-patch sha256, so this recipe
# follows the same shape (patch_file/description/type/strip only).

sources:
  "1.17.0.1":
    url: "https://xorg.freedesktop.org/archive/individual/lib/libxcb-1.17.0.tar.xz"
    sha256: "599ebf9996710fea71622e6e184f3a8ad5b43d0e5fa8c4e407123c88a59a6d55"

patches:
  "1.17.0.1":
    - patch_file: "patches/0001-support-ohos-configure.patch"
      patch_description: "Accept linux-ohos Autotools triplets and avoid Linux-only abstract socket probing on OHOS."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-use-tmpdir-in-display-test.patch"
      patch_description: "Use TMPDIR for parse_display_unix test temporary files on systems with read-only /tmp."
      patch_type: "portability"
