# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxcb/1.17.0.1
homepage: "https://xcb.freedesktop.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# tests/Makefile.am gates check_all on HAVE_CHECK, set by configure's
# PKG_CHECK_MODULES(CHECK, [check >= 0.9.4]). With check/0.15.2 in
# test_requires, make check compiles check_all, links it against libcheck,
# and runs the START_TEST suite (xcb_parse_display, xcb_simple, xcb_fixed,
# xcb_open, and the extension-specific cases compiled by check_suites.h /
# check_public.c) against the freshly built libxcb.la.
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# tests/Makefile.am declares two make-check targets:
#   1. check-pc-requires — validates installed xcb*.pc Requires.private
#      metadata (xcb-present -> xcb-dri3 after patch 0003).
#   2. check_all — the HAVE_CHECK-gated libcheck unit suite, built from
#      check_all.c + check_suites.h + check_public.c and linked against
#      @CHECK_LIBS@ + libxcb.la.
# The exact START_TEST case count inside check_all.c is version-specific
# (1.16 recorded 40 expected_assertions); the HMBS upstream-test evidence
# marker captures the real count from the true-machine make check output,
# so the pr-body upstream-test row is never guessed.
upstream_tests:
  - name: "check-pc-requires"
    file: "check-pc-requires"
    description: "Validates installed pkg-config Requires.private metadata for generated xcb*.pc files."
    source_dir: "."
    expected_assertions: 1
  - name: "check_all"
    file: "tests/check_public.c"
    description: "Check-based public API tests including xcb_parse_display."
    source_dir: "tests"
    expected_assertions: 40

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      Links libxcb and exercises xcb_parse_display plus the generated
      xcb_big_requests_id link symbol without requiring an X server.
      Inherits the validated 1.16 test design.
    command: "test_libxcb"

# 测试断言总数 (近似值, 用于质量评估)
# 1.16 recorded 45 total (1 check-pc-requires + 40 check_all START_TEST
# cases + test_package's 2 expect_parse + 1 bigreq symbol). 1.17.0's exact
# upstream START_TEST count is captured by the HMBS evidence marker from
# the true-machine conan create output; the test_package contribution is
# fixed at 3 (two expect_parse calls + one bigreq symbol touch).
assertion_count: 45
