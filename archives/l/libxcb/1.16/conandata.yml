sources:
  "1.16":
    url: "https://xcb.freedesktop.org/dist/libxcb-1.16.tar.gz"
    sha256: "bc0f75f84b28e6496a19a1d094d7e47def861a50cb7cce5b23b62eecdc2a4479"

patches:
  "1.16":
    - patch_file: "patches/0001-support-ohos-configure.patch"
      patch_description: "Accept linux-ohos Autotools triplets and avoid Linux-only abstract socket probing on OHOS."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-use-tmpdir-in-display-test.patch"
      patch_description: "Use TMPDIR for parse_display_unix test temporary files on systems with read-only /tmp."
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-fix-present-pc-requires.patch"
      patch_description: "Add xcb-dri3 to xcb-present pkg-config private requirements."
      patch_type: "portability"
      strip: 1
