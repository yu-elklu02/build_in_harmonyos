software: libxcb
version: "1.16"
status: published
build_system: autotools
compile_date: 2026-08-06

source:
  url: "https://xcb.freedesktop.org/dist/libxcb-1.16.tar.gz"
  sha256: "bc0f75f84b28e6496a19a1d094d7e47def861a50cb7cce5b23b62eecdc2a4479"
  tar_format: tar.gz

dependencies:
  required:
    - "xcb-proto/1.17.0"
    - "xorgproto/2025.1"
    - "libxau/1.0.11"
    - "libxdmcp/1.1.5"
  test:
    - "check/0.15.2"
  optional:
    - "pthread-stubs/0.4 (not published in ohpcd; not required on OHOS because pthread is provided by the platform C runtime)"

build:
  system: autotools
  configure_options:
    - "--disable-devel-docs"
    - "--with-doxygen=no"
    - "--enable-shared"
    - "--disable-static"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-support-ohos-configure.patch"
  - "0002-use-tmpdir-in-display-test.patch"
  - "0003-fix-present-pc-requires.patch"

test_results:
  type: ohos_single_package_ci
  status: passed
  command: "CI_PACKAGES=\"archives/l/libxcb/1.16\" zsh ci/conan/build_and_test.sh"
  log: "/storage/Users/currentUser/libxcb-ci-full-xorgproto-component-fix.log"
  total: 6
  passed: 5
  failed: 0
  skipped: 1
  passed_items:
    - "L0_RESULT=pass: all checks passed"
    - "L1_RESULT=pass: upstream tests + test_package executed"
    - "L4_RESULT=pass: patches clean"
    - "L5_RESULT=pass: lib/ has content"
    - "L1e negative test confirmed the test genuinely depends on libxcb"
  skipped_items:
    - "L2_RESULT=skip: no bin/ dir"

knowledge_gained:
  - "libxcb 1.16 is the upstream version required by the libX11 1.8.10 xcb >= 1.11.1 dependency."
  - "xcb-proto, libxau, libxdmcp and check are present in ohpcd; libpthread-stubs is not."
  - "OpenHarmony provides pthread symbols in the platform C runtime; libpthread-stubs is pkg-config metadata only and is not modeled as a Conan runtime dependency."
  - "The upstream config.sub must be patched to accept the linux-ohos triplet used by the project Conan profile."
  - "Do not generate a Conan PkgConfigDeps build-context xcb-proto.pc for libxcb; xcb-proto's package-provided pc file carries the required xcbincludedir and pythondir variables."
  - "Do not patch configure.ac in the release tarball; touching Autotools inputs makes make try to rerun aclocal-1.16 on OHOS."
  - "OHOS /tmp is read-only in this validation environment; libxcb's parse_display_unix test needs TMPDIR-aware temporary files and Check needs CK_FORK=no."
  - "xcb-present.pc.in in libxcb 1.16 needs xcb-dri3 in Requires.private to satisfy upstream check-pc-requires."
  - "xorgproto is exported as a transitive header dependency of the xcb component, matching the existing xorgproto handling in libxau/libxdmcp/libice recipes and satisfying Conan direct dependency validation."
  - "Do not add PATH with Conan Environment.prepend_path() in build(); contest CI can raise KeyError while applying EnvVars for PATH. Mutate os.environ['PATH'] directly before invoking Autotools."
  - "Derive OHOS Autotools build/host triplets from Conan settings, then normalize Conan's raw aarch64-ohos form to aarch64-unknown-linux-ohos so libtool keeps shared library support enabled."
  - "CONFIG_SHELL and SHELL fallbacks must resolve to an existing executable; /data/service/hnp/bin/bash is not safe as an unconditional fallback on all OHOS workers."
  - "Conan-generated env .sh files call printenv before applying profile PATH, so OHOS CI with a minimal base PATH needs recipe-side PATH bootstrapping inside those generated scripts before Autotools/CMake helpers run."
  - "The linux-ohos configure case patch must include the existing mingw case terminator as context; a zero-context insertion can land before the terminator and create an invalid case statement."
  - "Official CI #14595 exposed a package-agnostic pre-download regression where the old main script expanded an unset BUILD_DIR. After rebasing to the fixed main script, libxcb keeps conandata.yml so CI source pre-download remains active."
  - "Some validation devices do not provide /data/service/hnp/bin/clang even though the OHOS profile names it; both the recipe and test_package fall back to clang/clang++ found in PATH only when the configured compiler path is missing."
