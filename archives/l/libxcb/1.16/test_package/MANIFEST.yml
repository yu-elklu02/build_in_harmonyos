package: libxcb/1.16
homepage: "https://xcb.freedesktop.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: "check-pc-requires"
    file: "check-pc-requires"
    description: "Validates installed pkg-config Requires.private metadata for generated xcb*.pc files."
    source_dir: "."
    expected_assertions: 1
  - name: "check_all"
    file: "tests/check_public.c"
    description: "Check-based public API tests including xcb_parse_display."
    source_dir: "tests"
    expected_assertions: 40

test_package_tests:
  - file: test.c
    description: "Links libxcb and exercises xcb_parse_display plus the generated xcb_big_requests_id link symbol without requiring an X server."
    command: "test_libxcb"

assertion_count: 45
