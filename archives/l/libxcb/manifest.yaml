software: libxcb
display: "libxcb"
description: "X11 client-side C binding library (XCB), replaces Xlib for low-level X protocol access"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需 E205 OHOS triplet 补丁（同 libxau/libxdmcp）"
    - "configure 中 umask 077 需改为 022（E002 HMDFS）"
    - "configure / build-aux shebang 需替换为 /data/service/hnp/bin/bash（OHOS 无 /bin/sh）"
    - "上游 tests/Makefile.am 用 HAVE_CHECK 条件编译，需 libcheck（check/0.15.2）才能接入 make check"
    - "xcb.pc.in 含 @XCBPROTO_VERSION@ 自定义变量，需在 generate() 中补入 Conan 生成的 xcb.pc"
    - "configure 需通过 pkg-config 读取 xcb-proto 的 xcbincludedir，需 PkgConfigDeps + buildenv PKG_CONFIG_PATH"
  common_dependencies:
    - xorgproto
    - xcb-proto
    - libxau
    - libxdmcp

versions:
  "1.16":
    status: published
    build_date: "2026-08-06"
    notes: |
      - X11 C Binding (libxcb) 1.16 HarmonyOS PC 适配（已发布，CI 全 L0-L5 通过）
      - 下游链：xcb-proto -> libxcb -> libX11 / xcb-util-* 系列
      - 1.16 真机实测：L0=pass / L1=pass / L2=skip(no bin/) / L4=pass / L5=pass / L1e confirmed
  "1.17.0.1":
    status: built
    build_date: "2026-08-12"
    notes: |
      - X11 C Binding (libxcb) 1.17.0 HarmonyOS PC 适配（R37: 制品仓已存在 1.17.0 依赖链配方 → 后缀递增为 1.17.0.1）
      - 继承自 1.16（status=published）的全部 OHOS 适配方案，仅升级上游版本 + libxau 依赖版本
      - 下游链：xcb-proto -> libxcb -> libX11 / xcb-util-* 系列
