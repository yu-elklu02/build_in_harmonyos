package: lightgbm/4.6.0
homepage: https://github.com/microsoft/LightGBM

upstream_check_command: ctest -N
upstream_test_in_build: true
upstream_test_command: BUILD_CPP_TEST=ON during conan create; ctest --output-on-failure runs from conanfile.py build()

upstream_tests:
  - file: tests/cpp_tests/
    source: LightGBM-4.6.0/tests/cpp_tests/
    description: Upstream C++ test suite is enabled with BUILD_CPP_TEST=ON and executed through CTest after build.
    command: ctest --output-on-failure

test_package_tests:
  - file: test_lightgbm_api.cpp
    description: Consumer API smoke test compiles and links against LightGBM C API, creates a tiny in-memory DatasetHandle with LGBM_DatasetCreateFromMat, and frees it with LGBM_DatasetFree when execution is available.
    command: test_lightgbm_api
  - file: conanfile.py
    description: Runtime smoke test verifies the packaged lightgbm CLI is installed alongside the library when executable artifacts are available.
    command: check packaged lightgbm binary exists

assertion_count: 12
pass_rate: "Upstream CTest is executed by conanfile.py; package API and CLI smoke assertions run when the target binary can execute."
runtime_pass_note: Runtime CTest pass count is recorded from CI/OpenDesk logs.
