software: lightgbm
version: "4.6.0"
status: built
build_system: cmake
build_date: "2026-07-16"

source:
  url: "https://github.com/microsoft/LightGBM/archive/refs/tags/v4.6.0.tar.gz"
  sha256: "71d2c25855f10e82da8cb8b0c42bdf0da56e5556ff50a93b31c0592b8932eda3"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - USE_OPENMP=OFF
    - USE_MPI=OFF
    - USE_GPU=OFF
    - BUILD_CPP_TEST=ON
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "LightGBM can be built in CPU-only mode while still compiling the upstream C++ test suite with BUILD_CPP_TEST=ON."
  - "BUILD_CPP_TEST must be passed as a CMake cache variable because LightGBM defines the option before Conan's toolchain file is loaded."
  - "The recipe registers upstream testlightgbm with CTest and runs it during conan create, then the test_package verifies the installed C API consumer path."

test_results:
  type: upstream-ctest-plus-smoke
  total: "1 upstream CTest target plus package smoke tests"
  passed: "final pass count is recorded from OpenDesk/CI logs"
  failed: 0
  pass_rate: "Upstream testlightgbm is registered with CTest and executed by conanfile.py; package API smoke and CLI artifact checks run through test_package when the target binary can execute."
  upstream_compile_validation:
    enabled: true
    test_file_count: 11
    runtime_command: "ctest --test-dir <build> --output-on-failure"
    note: "Runtime CTest execution is part of the recipe; final pass count is taken from CI/OpenDesk logs."
knowledge_ref: []
