software: leptonica
display: "Leptonica"
description: "Open source library for image processing and image analysis"
category: gfx
homepage: "https://github.com/DanBloomberg/leptonica"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5 解决版本兼容问题"
    - "通过 CMAKE_DISABLE_FIND_PACKAGE_* 禁用可选图像库（PNG/JPEG/TIFF/GIF/WebP/OpenJPEG），仅链接 zlib"
    - "autogen.sh 失败（libtoolize shebang 路径错误），改用 cmake 构建系统"
    - "纯库软件，生成静态库 libleptonica.a，无可执行文件"
  common_dependencies:
    - zlib

versions:
  "1.84.1":
    status: built
    build_date: "2026-05-20"
    conan_ref: "leptonica/1.84.1"
  "1.87.0":
    status: published
    build_date: "2026-07-09"
    conan_ref: "leptonica/1.87.0@ohpcd/stable"
