version: "1.87.0"
status: published
build_date: "2026-07-09"
conan_ref: "leptonica/1.87.0@ohpcd/stable"

source:
  url: "https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.87.0.tar.gz"
  sha256: "fa2b40c5caea96d1bb93a97486262aed8731b69ce25a84a6bf5d25323e33f631"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "BUILD_PROG=OFF"
    - "CMAKE_DISABLE_FIND_PACKAGE_PNG=ON"
    - "CMAKE_DISABLE_FIND_PACKAGE_JPEG=ON"
    - "CMAKE_DISABLE_FIND_PACKAGE_TIFF=ON"
    - "CMAKE_DISABLE_FIND_PACKAGE_GIF=ON"
    - "CMAKE_DISABLE_FIND_PACKAGE_WebP=ON"
    - "CMAKE_DISABLE_FIND_PACKAGE_OpenJPEG=ON"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "autogen.sh 失败（libtoolize shebang 路径错误），改用 cmake 构建系统"
  - "通过 CMAKE_DISABLE_FIND_PACKAGE_* 禁用可选图像库，仅链接 zlib 避免符号冲突"
  - "cmake 警告 'System is unknown' 可忽略（鸿蒙不在 cmake 已知平台列表中）"
  - "纯库软件，无可执行文件，CI L2 smoke test 跳过"

ci_verification:
  environment: "Python 3.12.9, Conan 2.29.1, Clang 15.0.4"
  L0: "PASS — 依赖 zlib/1.3.1 已在制品仓，首次发布，库无需 commands.json"
  L1: "PASS — test_leptonica Passed, leptonica version: leptonica-1.87.0"
  L1e: "PASS — 破坏性反向验证通过（移除 lib/include 后测试失败）"
  L2: "SKIP — 纯库软件无 bin/"
  L4: "PASS — 无补丁"
  L5: "PASS — lib/ 有内容"
