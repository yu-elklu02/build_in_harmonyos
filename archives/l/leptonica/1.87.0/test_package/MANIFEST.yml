# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: leptonica/1.87.0
homepage: "https://github.com/DanBloomberg/leptonica"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# leptonica cmake build does not provide a 'check' target;
# upstream tests are in prog/ directory and require test data images.
upstream_tests:
  - file: test_package/test.c
    source: leptonica-1.87.0/test_package/test.c
    description: "Consumer smoke test: create a PIX and check version string"
    command: "./test_leptonica"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 leptonica 库链接和基本 API"
    command: "./test_leptonica"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
