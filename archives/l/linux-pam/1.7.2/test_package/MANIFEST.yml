# test_package/MANIFEST.yml
# Test declaration for upstream Meson tests plus Conan L1 consumer smoke test.

package: linux-pam/1.7.2
homepage: "https://github.com/linux-pam/linux-pam"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests:
  - file: "tests"
    source: "Linux-PAM-1.7.2/tests"
    description: "Core libpam API tests covering dlopen, pam_start/end, authentication/session/account/password APIs, item/data/env helpers, and pam_start_confdir"
    command: "meson test --print-errorlogs"
    status: "run_in_build"
    result: "required during default conan create validation"

test_package_tests:
  - file: test_linux_pam.c
    description: "Consumer test: create an isolated pam_start_confdir service using installed pam_permit.so, run auth/account checks, and verify pam_misc_setenv/pam_getenv"
    command: "./test_linux_pam"

assertion_count: 25
