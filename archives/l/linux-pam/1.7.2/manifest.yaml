software: linux-pam
version: "1.7.2"
status: built
build_system: meson
build_date: "2026-08-03"
issue: 1765

source:
  url: "https://github.com/linux-pam/linux-pam/releases/download/v1.7.2/Linux-PAM-1.7.2.tar.xz"
  sha256: "3d86b6383fb5fd9eb9578d2cd47d92801191f4bf3f9bc61419bfefc8aa1e531a"
  tar_format: tar.xz

build:
  system: meson
  options:
    - "default_library=shared"
    - "i18n=disabled"
    - "docs=disabled"
    - "audit=disabled"
    - "econf=disabled"
    - "logind=disabled"
    - "elogind=disabled"
    - "openssl=disabled"
    - "pwaccess=disabled"
    - "selinux=disabled"
    - "nis=disabled"
    - "examples=false"
    - "xtests=false"
    - "pam_userdb=disabled"
    - "pam_lastlog=disabled"
    - "pam_unix=disabled"
    - "minimal module patch builds pam_permit only"

dependencies:
  runtime: []
  build_tools:
    - "meson: expected from OHOS worker environment or meson/1.11.0"
    - "ninja: expected from OHOS worker environment"
  disabled_optional:
    - audit
    - gettext/intl
    - libeconf
    - libsystemd/elogind
    - openssl
    - libpwaccess
    - libselinux
    - libtirpc/libnsl via NIS
    - db/gdbm/ndbm via pam_userdb
    - libxcrypt via pam_unix

patches:
  - "0001-ohos-minimal-module-set.patch"
  - "0002-ohos-getspnam-fallback.patch"
  - "0003-ohos-meson-test-helper-shell.patch"
  - "0004-ohos-isolated-pam-start-tests.patch"

platform_requirements:
  - "POSIX dlopen/dlsym support"
  - "Shared-library loading for PAM modules"
  - "Writable per-test configuration directory for pam_start_confdir"

verification:
  local:
    - "Downloaded official Linux-PAM-1.7.2 release tarball and computed sha256"
    - "Inspected meson_options.txt, top-level meson.build, libpam, libpam_misc, libpamc, tests, and module template"
    - "Prepared Conan Meson recipe and non-empty test_package"
    - "python -m py_compile conanfile.py test_package/conanfile.py"
    - "git diff --check -- archives/l/linux-pam/1.7.2"
  not_run_locally:
    - "conan download/create: local Windows host has no conan executable"
  ohos_real_device:
    - "Run: /storage/Users/currentUser/ohos-test-runs/codex-linux-pam-linux-pam-linux-pam-1.7.2-1765-r1-conan11-20260804-100641-21320"
    - "L0 pass: conan create completed"
    - "L1 pass: test_package executed and printed linux-pam pam_permit and pam_misc smoke test passed"
    - "L2 skip: no bin/ directory"
    - "L4 pass: patch scan clean"
    - "L5 pass: lib/ has content"

next_commands:
  real_device_or_shadow_ci:
    - "CI_PACKAGES=\"archives/l/linux-pam/1.7.2\" zsh ci/conan/build_and_test.sh"
    - "/path/to/run-ohos-shadow-ci.sh archives/l/linux-pam/1.7.2"
