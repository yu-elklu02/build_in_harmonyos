sources:
  "1.7.2":
    url: "https://github.com/linux-pam/linux-pam/releases/download/v1.7.2/Linux-PAM-1.7.2.tar.xz"
    sha256: "3d86b6383fb5fd9eb9578d2cd47d92801191f4bf3f9bc61419bfefc8aa1e531a"
patches:
  - patch_file: "patches/0001-ohos-minimal-module-set.patch"
    patch_description: "Build only the pure pam_permit module for the initial OHOS provider package"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-getspnam-fallback.patch"
    patch_description: "Return NULL from pam_modutil_getspnam on OHOS when shadow lookup APIs are unavailable"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-meson-test-helper-shell.patch"
    patch_description: "Run Meson test helper scripts through sh on OHOS permission-restricted filesystems"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-isolated-pam-start-tests.patch"
    patch_description: "Run pam_start core tests against an isolated test confdir instead of the system PAM config"
    patch_type: "portability"

