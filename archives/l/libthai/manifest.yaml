software: libthai
display: "libthai"
description: "Thai language support library: word breaking, line breaking and character classification"
category: text
homepage: "https://github.com/tlwg/libthai"
license: LGPL-2.1-only
build_system: autotools

versions:
  "0.1.29":
    status: built
    build_date: "2026-08-04"
    notes: >-
      首个鸿蒙 PC conan 配方。依赖 libdatrie/0.2.13；构建期另需其 bin/ 里的 trietool
      生成断词词典，故同时用 tool_requires（conan 只把 tool_requires 的 bindirs 放进
      构建期 PATH）。词典装在 share/libthai，经 runenv LIBTHAI_DICTDIR 声明给消费方，
      避免烤死绝对路径。真机 conan create 通过，test_package 对泰文断词位置做精确断言。
