# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libiconv/1.17
homepage: "https://www.gnu.org/software/libiconv/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/check-stateless
    source: libiconv-1.17/tests/check-stateless
    description: "Stateless charset conversion tests (EUC-TW, BIG5, CP950, etc.)"
    command: "./check-stateless . <encoding>"
  - file: tests/check-stateful
    source: libiconv-1.17/tests/check-stateful
    description: "Stateful charset conversion tests (ISO-2022-CN, HZ, BIG5-HKSCS, etc.)"
    command: "./check-stateful . <encoding>"
  - file: tests/check-translit
    source: libiconv-1.17/tests/check-translit
    description: "Transliteration tests"
    command: "./check-translit . <table> <from> <to>"

test_package_tests:
  - file: test.c
    description: "消费者测试: UTF-8→ASCII 字符集转换验证"
    command: "./test_libiconv"

assertion_count: 3
