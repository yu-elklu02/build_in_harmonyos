# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnfnetlink/1.0.2
homepage: "https://www.netfilter.org/projects/libnfnetlink/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: utils/iftest.c
    source: libnfnetlink-1.0.2/utils/iftest.c
    description: "Interface index to name translation test (requires CAP_NET_ADMIN)"
    command: "make check (iftest)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: call nfnl_addattr32 API to verify linking"
    command: "./test_libnfnetlink"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
