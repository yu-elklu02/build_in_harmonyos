package: "libsm/1.2.6"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libsm"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The top-level Makefile.am declares only SUBDIRS=src doc. The source
  Makefile declares no TESTS, check_PROGRAMS, check-local, or custom test
  target, so the generated Automake check target contains zero test entries.

test_package_tests:
  - id: "error-handler-contract"
    source: "handler_contract.c"
    command: "libsm_handler_contract"
    description: >-
      Round-trip the public client and manager error-handler registration APIs,
      restore the prior handlers, and verify the published protocol constants.
  - id: "memory-lifecycle-contract"
    source: "memory_contract.c"
    command: "libsm_memory_contract"
    description: >-
      Allocate a complete multi-value SmProp and a reason-message vector, then
      release them through SmFreeProperty and SmFreeReasons.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 16
