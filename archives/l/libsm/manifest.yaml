software: libsm
display: "X.Org Session Management Library"
description: "X11 Session Management protocol client and manager library"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libsm"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognizes the native aarch64-linux-ohos Autotools triplet"
    - "Uses released libice, xorgproto, and xtrans Conan recipes"
    - "Preserves the upstream libSM.so.6 ABI and public headers"
  common_dependencies:
    - libice
    - xorgproto
    - xtrans

versions:
  "1.2.4":
    status: archived
    note: "Legacy pre-Conan archive retained for history; superseded by 1.2.6"
  "1.2.6":
    status: built
    build_date: "2026-08-06"
    conan_ref: "libsm/1.2.6"
    issue: 1889
