# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsm/1.2.4
homepage: "https://gitlab.freedesktop.org/xorg/lib/libsm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: "N/A"
    source: "libSM-1.2.4/src/"
    description: "libSM 1.2.4 has no automated test suite in make check (Makefile.am has no TESTS)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "API contract test: SmcSetErrorHandler, SmFreeProperty, SmFreeReasons"
    command: "./libsm_api_contract"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
