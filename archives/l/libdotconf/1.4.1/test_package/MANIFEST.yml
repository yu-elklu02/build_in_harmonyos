package: libdotconf/1.4.1
homepage: "https://github.com/williamh/dotconf"

upstream_check_command: "cd examples && bash maketest.sh"
upstream_test_in_build: true
upstream_test_command: "nine example builds followed by output comparison"

upstream_tests:
  - file: "examples/maketest.sh"
    source: "dotconf-1.4.1/examples"
    description: "Nine example regression scenarios compared with upstream expected output files"
    command: "build each example, run it, and compare testoutput with output"

test_package_tests:
  - file: "test_libdotconf.c"
    description: "Twelve packaged-library assertions through the public parser API"
    command: "test_libdotconf"

assertion_count: 21
