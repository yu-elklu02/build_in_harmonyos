# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libffi/3.4.4
homepage: "https://github.com/libffi/libffi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/libffi.test/ffi.exp
    source: libffi-3.4.4/test/libffi.test/ffi.exp
    description: "libffi DejaGnu 测试套件 (ffi_call, ffi_prep_cif, 类型转换)"
    command: "make check"
  - file: test/libffi.test/ffi_call.exp
    source: libffi-3.4.4/test/libffi.test/ffi_call.exp
    description: "ffi_call 功能测试 (aarch64 闭包汇编, OHOS 上跳过)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "ffi_prep_cif 消费者冒烟测试 (不调用 ffi_call)"
    command: "./test_libffi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
