patches:
  - patch_file: "patches/0001-config-guess-sub-ohos.patch"
    patch_description: "Recognize HarmonyOS and the linux-ohos triplet"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-hmdfs-umask.patch"
    patch_description: "Use an HMDFS-compatible configure mask only for linux-ohos hosts"
    patch_type: "portability"
  - patch_file: "patches/0003-tramp-hmdfs-path.patch"
    patch_description: "Resolve static trampoline backing files through HMDFS mounts"
    patch_type: "portability"
  - patch_file: "patches/0004-tramp-posix-capability.patch"
    patch_description: "Gate static trampolines on configure-detected POSIX mmap and pthread interfaces"
    patch_type: "portability"
