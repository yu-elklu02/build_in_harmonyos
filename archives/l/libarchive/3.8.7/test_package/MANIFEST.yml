# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libarchive/3.8.7
homepage: https://www.libarchive.org/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件 (libarchive 自带 C 测试程序)
upstream_tests:
  - name: "libarchive_test"
    source: libarchive-3.8.7/libarchive/test/
    description: "libarchive 核心库单元测试 (archive_read/write 各格式)"
    command: "make check"
  - name: "bsdtar_test"
    source: libarchive-3.8.7/tar/test/
    description: "bsdtar 命令行工具测试"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libarchive.c
    description: "bsdtar --version + libarchive 内存 tar 读取往返验证"
    command: "./test_libarchive"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20