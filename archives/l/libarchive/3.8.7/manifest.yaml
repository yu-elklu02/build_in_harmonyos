version: "3.8.7"
software: libarchive
build_system: autotools
status: published
build_date: "2026-08-07"

source:
  # Official GitHub release tarball (same content as website .tar.xz, identical SHA256).
  # CI Worker's fallback chain auto-mirrors GitHub URLs; only website origins like
  # www.libarchive.org are unreachable on the Worker (see CI diagnostics on #4620).
  url: "https://github.com/libarchive/libarchive/releases/download/v3.8.7/libarchive-3.8.7.tar.xz"
  sha256: "d3a8ba457ae25c27c84fd2830a2efdcc5b1d40bf585d4eb0d35f47e99e5d4774"
  tar_format: tar.xz
  original_url: "https://www.libarchive.org/downloads/libarchive-3.8.7.tar.xz"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--without-xml2"
  dependencies:
    - zlib (conan, cnb 制品仓)
    - xz/liblzma (conan, cnb 制品仓)
  cc: clang

patches_applied:
  - "0001-build-autoconf-config.guess.patch"
  - "0002-configure.patch"
  - "0003-test-utils-test-main-mode.patch"

knowledge_gained:
  - "E007: config.guess needs HarmonyOS recognition (aarch64:HarmonyOS case)"
  - "OHOS hmfs 不支持硬链接 (Operation not permitted)，bsdtar/bsdcpio 硬链接用例为平台限制"
  - "OHOS hmfs 权限位不完整保留（强制 setgid、裁剪 other 位），测试 mode 断言需放宽为 owner 位比较"