# Upstream and consumer test declaration for CI L0e.
package: libusb/1.0.27
homepage: https://github.com/libusb/libusb

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/stress.c
    source: libusb-1.0.27.tar.bz2/tests/stress.c
    description: "Context lifecycle and device-list stress tests"
    command: "./stress"
  - file: tests/stress_mt.c
    source: libusb-1.0.27.tar.bz2/tests/stress_mt.c
    description: "Multithreaded context and enumeration tests"
    command: "./stress_mt"
  - file: tests/set_option.c
    source: libusb-1.0.27.tar.bz2/tests/set_option.c
    description: "Context option and logging callback tests"
    command: "./set_option"
  - file: tests/init_context.c
    source: libusb-1.0.27.tar.bz2/tests/init_context.c
    description: "Context initialization option tests"
    command: "./init_context"

test_package_tests:
  - file: test_libusb.c
    description: "Version metadata and stable error-string API validation"
    command: "./test_libusb"

assertion_count: 3
