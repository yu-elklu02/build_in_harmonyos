    无法解析 'HongMeng Kernel 1.12.0' 格式）。
    推荐使用 LIBUSB_OPTION_NO_DEVICE_DISCOVERY 初始化。

platform_notes:
  - "默认初始化失败：sysfs /sys/bus/usb/devices/ 不可访问（SELinux errno=13）"
  - "热插拔不可用：netlink socket 在沙箱中受限（errno=9 EBADF）"
  - "推荐初始化方式：libusb_init_context + LIBUSB_OPTION_NO_DEVICE_DISCOVERY"
  - "动态链接和静态链接均可正常使用"

knowledge_gained:
  - id: E091
    description: "sockaddr_storage 重定义冲突（linux/socket.h vs sys/socket.h）"
  - id: E112
    description: "HMDFS umask 077 导致临时目录权限异常"
  - description: "HongMeng 内核版本格式 'HongMeng Kernel X.Y.Z' 无法被 libusb get_kernel_version() 解析"
    fix: "#ifdef __OHOS__ 检测 HongMeng 关键字，报告现代 Linux 内核版本"
