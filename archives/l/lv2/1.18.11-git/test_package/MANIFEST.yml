package: lv2/1.18.11-git
homepage: "https://lv2plug.in/"

upstream_test_command: "meson setup build -Dtests=enabled -Ddocs=disabled -Dtools=disabled -Dlint=false && meson test -C build"
upstream_test_in_build: false
upstream_tests:
  - framework: meson
    case_count: 29
    suites:
      - build
      - unit
      - spec
    prerequisite: "Python rdflib module"

test_package_tests:
  - file: test_lv2.c
    description: "Compile and run a minimal LV2 consumer and verify packaged metadata."
    command: "cc -I<package>/include test_lv2.c -o test_lv2 && ./test_lv2"

assertion_count: 7
