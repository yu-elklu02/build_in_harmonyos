software: luasystem
display: "luasystem"
description: "Platform-independent system calls for Lua"
category: development
homepage: "https://github.com/lunarmodules/luasystem"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Build the native system.core Lua C module with the Conan profile compiler"
    - "Install Lua wrapper files and the core shared object in Lua 5.4 module paths"
    - "Export LUA_PATH and LUA_CPATH for downstream Busted/Vusted consumers"
  common_dependencies:
    - lua

versions:
  "0.6.3-1":
    status: built
    build_date: "2026-08-05"
    conan_ref: "luasystem/0.6.3-1"
    conan_full_ref: "luasystem/0.6.3-1#bdbf78eacd232ef66e65eec70c31a5c6:d0a7aaee7b96749a4c4ebd94e497ff9f3de4d251#3a7bc6173a7cc226ab3a02fe1fd640b2"
