software: libjpeg-turbo
version: "3.2.0"
build_system: cmake
status: built            # 真机 conan create + test_package 已过（2026-07-11, PC 2in1, SDK 26.0.0.18）
source:
  url: "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz"
  sha256: "6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e"
build:
  system: cmake
  toolchain: "自发现 ohos.toolchain.cmake + 裸 cmake（绕开 conan_toolchain，与 glfw/3.4.6 同法；recipe 自包含，裸 conan create 即可）"
  cmake_options:
    - "CMAKE_INSTALL_LIBDIR=lib"   # ohos.toolchain 64 位默认 lib64/，须强制 lib/
    - "ENABLE_SHARED=ON"
    - "ENABLE_STATIC=OFF"
    - "WITH_TOOLS=OFF"
    - "WITH_TESTS=OFF"
    - "WITH_SIMD=OFF"              # E096 平台识别致 SIMD 链接失败，须禁（既有适配结论）
    - "OHOS_ARCH=arm64-v8a"
  cc: clang
  sign_so: true                    # SDK toolchain 产的 .so 自签无效，package() 用 binary-sign-tool -selfSign 重签
libs:
  - jpeg        # libjpeg.so.62 (SONAME libjpeg.so.62) — 经典 libjpeg API，libtiff 走 -ljpeg
  - turbojpeg   # libturbojpeg.so.0 — TurboJPEG API
requires: []    # 无外部依赖；aarch64 不用 nasm
verified:
  device: "HarmonyOS PC 2in1 (3QC0124C11000718), ohos-sdk 26.0.0.18"
  date: "2026-07-11"
  evidence: "conan create rc=0；test_package dlopen libjpeg.so ok(dlsym jpeg_std_error)；SONAME=libjpeg.so.62"
knowledge_gained:
  - "作为 libtiff 的 Conan 依赖先行适配"
  - "cmake 库 ML-0035：自发现 ohos.toolchain.cmake + 裸 cmake（绕开 conan_toolchain），recipe 自包含、不依赖 CI profile host 段（同 glfw）"
  - "WITH_SIMD=OFF：E096 HarmonyOS 平台识别致 SIMD 链接失败，须禁（沿用 2.1.5.1/3.1.4.1 结论）"
  - "ohos.toolchain 64 位默认装 lib64/，须 -DCMAKE_INSTALL_LIBDIR=lib 否则 conan/test 在 lib/ 找不到 → dlopen No such file"
  - "SDK toolchain 产的 .so 自签无效，dlopen 报 Permission denied，须 binary-sign-tool -selfSign 重签"
  - "设备/CI 无 github 直连时：mac 下 tarball → send → conan download_cache（按 sha256 命名）离线 source()"
