software: libjpeg-turbo
display: "libjpeg-turbo"
description: "JPEG image codec with SIMD acceleration"
category: gfx
homepage: "https://libjpeg-turbo.org/"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建需要禁用 SIMD (-DWITH_SIMD=0) 解决 E096 链接失败问题"
    - "CMake 无法识别 HarmonyOS 平台，但不影响核心功能"
    - "同时编译 libjpeg API 和 TurboJPEG API"
  common_dependencies: []

