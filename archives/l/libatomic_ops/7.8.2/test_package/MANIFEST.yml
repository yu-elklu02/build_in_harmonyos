# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libatomic_ops/7.8.2
homepage: "https://github.com/ivmai/libatomic_ops"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_atomic.c
    source: libatomic_ops-7.8.2/tests/test_atomic.c
    description: "Test atomic operations (fetch_add, CAS, barriers)"
    command: "./test_atomic"
  - file: tests/test_atomic.c
    source: libatomic_ops-7.8.2/tests/test_atomic.c
    description: "Test generalized atomic operations emulation"
    command: "./test_atomic_generalized"
  - file: tests/test_atomic.c
    source: libatomic_ops-7.8.2/tests/test_atomic.c
    description: "Test atomic operations with pthread definitions"
    command: "./test_atomic_pthreads"
  - file: tests/test_stack.c
    source: libatomic_ops-7.8.2/tests/test_stack.c
    description: "Test lock-free stack implementation"
    command: "./test_stack"
  - file: tests/test_malloc.c
    source: libatomic_ops-7.8.2/tests/test_malloc.c
    description: "Test atomic malloc implementation"
    command: "./test_malloc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: AO_fetch_and_add, AO_test_and_set, AO_store/load"
    command: "./test_libatomic_ops"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
