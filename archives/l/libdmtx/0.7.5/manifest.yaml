software: libdmtx
version: "0.7.5"
status: built
build_date: "2026-08-10"
build_system: cmake

source:
  url: "https://github.com/dmtx/libdmtx/archive/refs/tags/v0.7.5.tar.gz"
  tar_format: tar.gz

build:
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libdmtx 0.7.5 uses autotools build system which fails on HarmonyOS due to missing automake/libtool"
  - "CMakeLists.txt generated in conanfile.py source() enables CMake-based build"
  - "dmtx.c includes all other .c source files via #include, so only dmtx.c needs compilation"
  - "Library depends only on libm (math library)"
