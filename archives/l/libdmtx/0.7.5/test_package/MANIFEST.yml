# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: libdmtx/0.7.5
homepage: "https://github.com/dmtx/libdmtx"

# Upstream test command analysis
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (not applicable - autotools build not available on OHOS)
upstream_tests: []

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "Consumer test: call dmtxVersion() to verify library linkage"
    command: "./test_libdmtx"

# Approximate assertion count
assertion_count: 1
