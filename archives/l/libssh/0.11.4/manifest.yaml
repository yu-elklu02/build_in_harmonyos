version: "0.11.4"
status: built
build_date: "2026-08-07"
software: libssh
build_system: cmake

source:
  url: "https://www.libssh.org/files/0.11/libssh-0.11.4.tar.xz"
  sha256: "002ac320e3d66c9e100ec6576e3e84aa0c48949efde3bf5b40a2802992297701"
  tar_format: tar.xz

build:
  system: cmake
  options:
    - BUILD_SHARED_LIBS=OFF
    - WITH_ZLIB=ON
    - WITH_SFTP=ON
    - WITH_SERVER=ON
    - WITH_PCAP=ON
    - WITH_GEX=ON
    - WITH_EXEC=ON
    - WITH_GSSAPI=ON
    - WITH_NACL=ON
    - UNIT_TESTING=OFF
    - WITH_EXAMPLES=OFF

dependencies:
  - openssl/1.1.1w
  - zlib/1.3.1

patches:
  - 0001-CMakeLists.txt.patch

notes: |
  libssh 0.11.4 uses CMake (not autotools as previously recorded).
  Built as static library because zlib/1.3.1 binary in artifact repo was
  not compiled with -fPIC, preventing shared library linking.
  Patch adds CMake target aliases (ZLIB::ZLIB, OpenSSL::Crypto) for
  Conan CMakeDeps compatibility.
  GSSAPI and NaCl auto-disabled by CMake (libraries not available on OHOS).
  All other features enabled (no trimming).
