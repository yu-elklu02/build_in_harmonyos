# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: libssh/0.11.4
homepage: "https://www.libssh.org/"

# Upstream test command (for make -n check / ctest -N analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build() method
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
# Note: libssh uses CMocka for unit testing (UNIT_TESTING option).
# CMocka is not available on OHOS, so upstream tests are not run.
upstream_tests:
  - file: tests/unittests/torture_init.c
    source: libssh-0.11.4/tests/unittests/torture_init.c
    description: "libssh initialization test (requires CMocka)"
    command: "./torture_init"

# test_package consumer-side test
test_package_tests:
  - file: test.c
    description: "Consumer test: calls ssh_init() and ssh_version() to verify library linkage"
    command: "./test_libssh"

# Approximate assertion count
assertion_count: 2
