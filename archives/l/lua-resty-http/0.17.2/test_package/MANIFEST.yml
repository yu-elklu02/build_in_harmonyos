# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lua-resty-http/0.17.2
homepage: "https://github.com/ledgetech/lua-resty-http"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01-basic.t
    source: lua-resty-http-0.17.2/t/01-basic.t
    description: "Basic HTTP request test (requires OpenResty)"
    command: "prove t/01-basic.t"
  - file: t/02-chunked.t
    source: lua-resty-http-0.17.2/t/02-chunked.t
    description: "Chunked transfer encoding test (requires OpenResty)"
    command: "prove t/02-chunked.t"
  - file: t/12-case_insensitive_headers.t
    source: lua-resty-http-0.17.2/t/12-case_insensitive_headers.t
    description: "Case-insensitive headers test (requires OpenResty)"
    command: "prove t/12-case_insensitive_headers.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: Lua module 文件存在性 + 内容验证"
    command: "bash test.sh"
  - file: conanfile.py (inline Python test)
    description: "消费者测试: 3 个 Lua 模块文件验证 + 模块定义内容检查"
    command: "conan test (file existence + content verification)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
