# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: lzip/1.25
homepage: "https://www.nongnu.org/lzip/"

# Upstream test command (from make check analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: "make check"

# Upstream test programs actually run
upstream_tests:
  - file: check
    source: lzip-1.25/check
    description: "lzip self-test suite: tests compression, decompression, bad input"
    command: "make check"

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Version check + compress/decompress roundtrip integrity test"
    command: "conan test"

# Approximate assertion count for quality assessment
assertion_count: 10
