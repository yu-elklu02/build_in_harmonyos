knowledge_gained: []
notes: >-
  2.15.3.1: 在 2.15.3 基础上补充 export_sources()（export_conandata_patches），
  满足当前框架 G1 配方完整性门禁（export_sources 检查 1b2078003 早于 2.15.3 合入，
  原配方缺此方法无法通过 conan-verify G1）；制品仓已锁定 2.15.3，
  按 R37 递增版本号。构建方式（_ohos_toolchain 自发现 + 裸 cmake）与 2.15.3 相同。
  规则4 修复：build() 读取 self.options.shared（不再硬编码 BUILD_SHARED_LIBS=ON），
  并启用 LIBXML2_WITH_TESTS=ON + PROGRAMS=ON 接入上游测试套件；OHOS 真机实跑
  runtest 3880 用例通过率 97.3%（失败为上游 tarball 缺 result 参考文件/辅助 cmake
  脚本及少量输出格式差异，非平台能力缺失），6 个独立测试程序全过。
  CI 修复：源码改官方 GitHub tag archive 单值 URL，启用 CI 镜像 fallback
  （download.gnome.org 在 Worker 上不可达）。
