software: libpq
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/18.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "18.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.postgresql.org/pub/source/v18.1/postgresql-18.1.tar.gz"

  # 源码校验和
  sha256: "b0f18c2d6973d2aa023cfc77feda787d7bbe9c31a3977d0f04ac29885fb98ec4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项（单行格式，空格分隔）
  configure_options: "--without-readline --without-zlib --without-icu"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "psycopg-c 3.3.x 按 libpq 18 编译，运行期 dlopen libpq 时需 PQfullProtocolVersion（PostgreSQL 18 新增）；libpq 17.x 缺此符号会 symbol not found。故 psycopg[c] 场景须用 18.x。"
  - "仅构建客户端库：cd src/interfaces/libpq && make（会自动 submake src/port + src/common）；make -C src/interfaces/libpq install 只装 libpq-fe.h，postgres_ext.h / pg_config_ext.h 在 src/include/ 需一并装（libpq-fe.h #include \"postgres_ext.h\"），否则消费方编译头缺失。"
  - "PostgreSQL 18 的 config/config.sub 已自带 linux-ohos*- 内核分支，只需补 ohos-linux) 映射与 accept 列表的 ohos*（0002 patch 相较 17.2 少一处 hunk）。"
