# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: liquid-dsp/1.8.0
homepage: "https://liquidsdr.org"

# 上游测试命令 (CMake 构建的 autotest 程序)
upstream_check_command: "./xautotest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./xautotest"

# 上游实际运行的测试程序 (autotest 汇总所有模块测试)
upstream_tests:
  - file: autotest/null_autotest.c
    source: liquid-dsp-1.8.0/autotest/null_autotest.c
    description: "liquid-dsp autotest harness: 1341 tests / 716520 checks all pass"
    command: "./xautotest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer link and API test (liquid_nextpow2, liquid_version, windowf)"
    command: "./test_liquid_dsp"

# 测试断言总数 (近似值)
assertion_count: 1341
