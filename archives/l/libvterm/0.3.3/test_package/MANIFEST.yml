# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libvterm/0.3.3
homepage: "https://github.com/neovim/libvterm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/harness.c
    source: libvterm-0.3.3/t/harness.c
    description: "Terminal emulator test harness - runs VT100/xterm escape sequence tests"
    command: "perl t/run-test.pl t/[0-9]*.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Functional API test: vterm_new, resize, input_write, screen_get_cell"
    command: "./test_libvterm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
