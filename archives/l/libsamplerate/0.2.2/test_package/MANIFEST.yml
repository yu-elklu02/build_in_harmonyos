# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: libsamplerate/0.2.2
homepage: "https://libsndfile.github.io/libsamplerate/"

# Upstream test command
upstream_check_command: "ctest"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from CMakeLists.txt tests/ directory)
upstream_tests:
  - file: tests/misc_test.c
    source: libsamplerate-0.2.2/tests/misc_test.c
    description: "Miscellaneous API tests"
    command: "./misc_test"
  - file: tests/termination_test.c
    source: libsamplerate-0.2.2/tests/termination_test.c
    description: "Termination test"
    command: "./termination_test"
  - file: tests/callback_hang_test.c
    source: libsamplerate-0.2.2/tests/callback_hang_test.c
    description: "Callback hang test"
    command: "./callback_hang_test"
  - file: tests/downsample_test.c
    source: libsamplerate-0.2.2/tests/downsample_test.c
    description: "Downsample test"
    command: "./downsample_test"
  - file: tests/simple_test.c
    source: libsamplerate-0.2.2/tests/simple_test.c
    description: "Simple API test"
    command: "./simple_test"
  - file: tests/callback_test.c
    source: libsamplerate-0.2.2/tests/callback_test.c
    description: "Callback API test"
    command: "./callback_test"
  - file: tests/reset_test.c
    source: libsamplerate-0.2.2/tests/reset_test.c
    description: "Reset test"
    command: "./reset_test"
  - file: tests/clone_test.c
    source: libsamplerate-0.2.2/tests/clone_test.c
    description: "Clone test"
    command: "./clone_test"
  - file: tests/nullptr_test.c
    source: libsamplerate-0.2.2/tests/nullptr_test.c
    description: "Nullptr test"
    command: "./nullptr_test"
  - file: tests/multi_channel_test.c
    source: libsamplerate-0.2.2/tests/multi_channel_test.c
    description: "Multi-channel test"
    command: "./multi_channel_test"
  - file: tests/varispeed_test.c
    source: libsamplerate-0.2.2/tests/varispeed_test.c
    description: "Varispeed test"
    command: "./varispeed_test"
  - file: tests/float_short_test.c
    source: libsamplerate-0.2.2/tests/float_short_test.c
    description: "Float/short conversion test"
    command: "./float_short_test"
  - file: tests/snr_bw_test.c
    source: libsamplerate-0.2.2/tests/snr_bw_test.c
    description: "SNR bandwidth test"
    command: "./snr_bw_test"

# Consumer-side tests in test_package
test_package_tests:
  - file: test.c
    description: "Consumer test: version check, converter name, src_simple() conversion, src_new()/src_delete()"
    command: "./test_libsamplerate"

# Approximate assertion count
assertion_count: 8
