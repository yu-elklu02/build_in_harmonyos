# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libconfig/1.7.3
homepage: "https://github.com/hyperrealm/libconfig"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/libconfig_tests.c
    source: libconfig-1.7.3/tests/libconfig_tests.c
    description: "libconfig unit tests via tinytest framework"
    command: "./libconfig_tests"
  - file: examples/c/example1.c
    source: libconfig-1.7.3/examples/c/example1.c
    description: "C example 1: read and write config"
    command: "./example1"
  - file: examples/c/example2.c
    source: libconfig-1.7.3/examples/c/example2.c
    description: "C example 2: read config"
    command: "./example2"
  - file: examples/c/example3.c
    source: libconfig-1.7.3/examples/c/example3.c
    description: "C example 3: manipulate settings"
    command: "./example3"
  - file: examples/c/example4.c
    source: libconfig-1.7.3/examples/c/example4.c
    description: "C example 4: nested settings"
    command: "./example4"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 使用 libconfig API 读写配置文件"
    command: "./test_libconfig"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
