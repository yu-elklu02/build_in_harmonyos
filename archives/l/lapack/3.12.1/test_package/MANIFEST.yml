# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lapack/3.12.1
homepage: "https://www.netlib.org/lapack/"

# 上游自带 TESTING/ 测试套件（BLAS/LAPACK Fortran 测试），但需完整 Fortran
# 测试框架 + LAPACK_TESTING 构建，CI 受限环境以 test_package 消费者验证为主。
upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: false
upstream_test_command: ""

# 补全测试说明：test_package 新增 C 消费者验证（CBLAS/LAPACKE C 接口）
supplementary_tests:
  - file: test_package/test.c
    count: 3
    description: >-
      1) cblas_dgemm 矩阵乘法断言；2) LAPACKE_dgesv 线性方程组求解断言；
      3) 验证 liblapack/libblas/liblapacke/libcblas 链接正确（R34）。
