software: lame
display: "LAME"
description: "High quality MPEG Audio Layer III (MP3) encoder"
category: audio
homepage: "https://lame.sourceforge.io/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools：config.sub 不认 aarch64-linux-ohos → configure 覆盖 --host/--build 为 gnu 三元组(原生 build==host)"
    - "uname-shim 修 config.guess(设备 uname=HarmonyOS)"
    - "--disable-frontend 只建 libmp3lame"

versions:
  "4.0":
    status: built
    build_date: "2026-07-25"
    packaging: conan
    notes: |
      版本升级。相对 3.100 的差异：保留 frontend 另出 bin/lame CLI（配套软件级 commands.json，R38）；
      三元组改用 musl（贴合设备真实 libc）。
      LAME 4.0 起 external mpg123 解码器变为默认必需，缺 libmpg123 会 configure 中止 → 用 --disable-decoder
      （本包定位是提供 MP3 编码，解码 FFmpeg 自带）。
    provides:
      - libmp3lame.so.0
      - bin/lame
  "3.100":
    status: built
    build_date: "2026-07-24"
