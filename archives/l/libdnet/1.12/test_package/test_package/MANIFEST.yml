# test_package/MANIFEST.yml
# CI script (build_and_test.sh L0e) requires this file to exist

package: libdnet/1.12
homepage: "https://github.com/dugsong/libdnet"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/check/addr.c
    source: libdnet-1.12/test/check/addr.c
    description: "Address manipulation tests (addr_pton, addr_ntoa, addr_cmp)"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Consumer test: addr_pton/addr_ntoa round-trip conversion"
    command: "./test_libdnet"

assertion_count: 3
