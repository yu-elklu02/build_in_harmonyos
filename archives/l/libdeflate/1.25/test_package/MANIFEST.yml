# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdeflate/1.25
homepage: https://github.com/ebiggers/libdeflate

# build() 为 glfw 式裸 cmake，只编库，未集成上游测试套件
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角，链接 libdeflate 真实调用公开 C API）
test_package_tests:
  - file: test.c
    description: "libdeflate 压缩/解压 roundtrip：alloc_compressor → deflate_compress → alloc_decompressor → deflate_decompress → memcmp 校验原文"
    command: "ctest test_libdeflate"

# 测试断言总数 (近似值)
assertion_count: 5
