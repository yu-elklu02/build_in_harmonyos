knowledge_gained:
  - "libmcrypt 2.5.8 disables dynamic loading by default and can preload all algorithms/modes into the library."
  - "The release tarball ships stale config.status/config.log/libtool files that must be removed after extraction."
  - "Old Autotools configure on OHOS needs explicit LLVM AR/RANLIB/NM/LD/STRIP and CPP/CXXCPP."
  - "Out-of-source builds need source/build root include paths because some modules include headers as <lib/libdefs.h>."
  - "Out-of-source libtool links need lib/libmcrypt.sym copied into the build lib directory."
  - "Out-of-source static builds need the generated lib/Makefile mcrypt_symb.c rule pointed at a build-local module source mirror so disabled dynamic loading still preloads algorithms and modes."
  - "Out-of-source static builds also need generated lib/Makefile libmcrypt_la_LIBADD filled from modules/*/Makefile metadata because upstream configure computes EXTRA_OBJECTS with source-tree-relative file probes."
  - "Autotools helper shebangs must use a job-local shell on the OHOS worker."
  - "Historical config.guess/config.sub patch files in this archive did not apply cleanly to the official tarball; the recipe now applies those OHOS hooks programmatically."

