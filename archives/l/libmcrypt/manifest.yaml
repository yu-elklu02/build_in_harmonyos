software: libmcrypt
display: "libmcrypt"
description: "Thread-safe symmetric encryption algorithm library"
category: security
homepage: "https://mcrypt.sourceforge.net/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Old Autotools config scripts need HarmonyOS/linux-ohos triplet support."
    - "Dynamic module loading is disabled so algorithms and modes are built into libmcrypt."
    - "OHOS configure uses explicit LLVM binutils, CPP/CXXCPP and a job-local shell."
    - "Out-of-source static builds need generated module objects and the preloaded symbol table fixed in generated Makefiles."
    - "Upstream make check registers ciphertest and aestest under src/."
  common_dependencies: []

versions:
