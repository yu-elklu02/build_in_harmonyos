# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.2"

# 软件名
software: "libtpms"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-13"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/stefanberger/libtpms/archive/refs/tags/v0.10.2.tar.gz"

  # 源码校验和
  sha256: "edac03680f8a4a1c5c1d609a10e3f41e1a129e38ff5158f0c8deaedc719fb127"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--build=aarch64-unknown-linux-ohos"
  - "--host=aarch64-unknown-linux-ohos"
  - "--with-openssl"
  - "--with-tpm2"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "openssl/3.5.6"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-bootstrap-autotools-snapshot.patch"
- "0002-tests-support-harmonyos-stat.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_ref:
- "E175"
- "E259"

knowledge_gained:
- "knowledge_ref: E175 — GitHub 标签源码不含预生成的 configure，需在源码目录执行 autoreconf --install --force"
- "knowledge_ref: E259 — Conan Release 工具链注入的 NDEBUG 会编译掉测试里带副作用的 assert，需置 tc.ndebug=None"
- "reference: patches/0002-tests-support-harmonyos-stat.patch — HarmonyOS 的 uname -s 需在 tests/common 的 get_filesize 中按 Linux 分支处理 stat -c%s"
