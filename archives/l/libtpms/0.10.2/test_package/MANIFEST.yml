# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtpms/0.10.2
homepage: "https://github.com/stefanberger/libtpms"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (WITH_TPM2 + ENABLE_STATIC_TESTS 静态构建，共 10 项)
upstream_tests:
  - file: base64decode.sh
    source: libtpms-0.10.2/tests/base64decode.sh
    description: "Base64 编解码往返一致性"
    command: "./base64decode.sh"
  - file: fuzz.sh
    source: libtpms-0.10.2/tests/fuzz.sh
    description: "TPM2 命令语料模糊测试 (984 个语料，每个执行 4 轮)"
    command: "./fuzz.sh"
  - file: nvram_offsets.c
    source: libtpms-0.10.2/tests/nvram_offsets.c
    description: "NVRAM 结构体偏移与大小断言"
    command: "./nvram_offsets"
  - file: object_size.c
    source: libtpms-0.10.2/tests/object_size.c
    description: "TPM2 对象内存占用静态检查"
    command: "./object_size"
  - file: tpm2_createprimary.sh
    source: libtpms-0.10.2/tests/tpm2_createprimary.sh
    description: "TPM2 创建主密钥"
    command: "./tpm2_createprimary.sh"
  - file: tpm2_cve-2023-1017.sh
    source: libtpms-0.10.2/tests/tpm2_cve-2023-1017.sh
    description: "CVE-2023-1017 回归测试"
    command: "./tpm2_cve-2023-1017.sh"
  - file: tpm2_cve-2023-1018.sh
    source: libtpms-0.10.2/tests/tpm2_cve-2023-1018.sh
    description: "CVE-2023-1018 回归测试"
    command: "./tpm2_cve-2023-1018.sh"
  - file: tpm2_pcr_read.sh
    source: libtpms-0.10.2/tests/tpm2_pcr_read.sh
    description: "TPM2 PCR 寄存器读取"
    command: "./tpm2_pcr_read.sh"
  - file: tpm2_selftest.sh
    source: libtpms-0.10.2/tests/tpm2_selftest.sh
    description: "TPM2 自检"
    command: "./tpm2_selftest.sh"
  - file: tpm2_setprofile.sh
    source: libtpms-0.10.2/tests/tpm2_setprofile.sh
    description: "TPM2 配置 profile 设置"
    command: "./tpm2_setprofile.sh"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libtpms 并调用 TPMLIB_GetVersion() 验证返回非零版本号"
    command: "./test_libtpms"

# 测试断言总数 (近似值, 用于质量评估)
# 984 个 fuzz 语料 + 其余 9 项测试程序
assertion_count: 1000
