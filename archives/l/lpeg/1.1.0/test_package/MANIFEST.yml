# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lpeg/1.1.0
homepage: "https://www.inf.puc-rio.br/~roberto/lpeg/"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.lua
    source: lpeg-1.1.0/test.lua
    description: "Upstream lpeg test suite (pattern matching tests)"
    command: "lua test.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.lua
    description: "Consumer test: load lpeg.so and verify P, R, S, C, match API"
    command: "lua test.lua"

# 测试断言总数
assertion_count: 15
