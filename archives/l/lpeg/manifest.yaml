software: lpeg
display: "LPeg"
description: "Parsing Expression Grammars for Lua — a powerful pattern-matching library"
category: library
homepage: "https://www.inf.puc-rio.br/~roberto/lpeg/"
license: MIT
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "lpeg 编译为 .so 共享库，由 Lua 运行时通过 require 加载"
    - "编译时需要 Lua headers（通过 LUADIR make 变量指定）"
    - "Lua 尚未作为 Conan 配方发布，conanfile.py 从源码构建 Lua 获取 headers"
    - "无需补丁，通过 make 变量 CC=clang 和 LUADIR 即可完成编译"
  common_dependencies:
    - lua

# 版本索引
versions:
  "1.1.0":
    status: built
    build_date: "2026-07-15"
