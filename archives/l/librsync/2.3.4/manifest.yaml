version: "2.3.4"
software: "librsync"
status: built
build_date: "2026-08-04"
build_system: cmake

source:
  url: "https://github.com/librsync/librsync/releases/download/v2.3.4/librsync-2.3.4.tar.gz"
  sha256: "a0dedf9fff66d8e29e7c25d23c1f42beda2089fb4eac1b36e6acd8a29edfbd1f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_RDIFF=ON"
    - "-DENABLE_COMPRESSION=OFF"
    - "-DENABLE_TRACE=OFF"
    - "-DUSE_LIBB2=OFF"
  dependencies:
    - "popt/1.16"
  tool_dependencies:
    - "perl/5.42.2"
  dependency_resolution:
    popt:
      remote: "ohpcd"
      recipe_revision: "cca44e0c65c2ff043d329f27a068a956"
      verified_command: "conan download \"popt/1.16\" -r=ohpcd --only-recipe"
      evidence: "reports/dependency-resolution.md"
      note: "The repository tree has an old partial popt archive; this package consumes the published remote Conan recipe."
  cc: clang
  cxx: clang++

patches_applied: []

test:
  upstream_framework: "CTest"
  upstream_tests_total: 15
  upstream_tests_passed: 15
  upstream_tests_skipped: 0
  upstream_library_tests_total: 7
  upstream_library_tests_passed: 7
  optional_rdiff_cli_tests_total: 8
  optional_rdiff_cli_tests_passed: 8
  optional_rdiff_cli_tests_skipped: 0
  test_package: "CMake consumer executable calls rs_sig_args and validates rs_librsync_version"
  reports:
    - "reports/upstream-tests.md"
    - "reports/dependency-resolution.md"

knowledge_gained:
  - "Upstream registers seven library CTest cases independently of the optional rdiff executable."
  - "The optional rdiff CLI and its eight script tests require popt; published popt/1.16#cca44e0c65c2ff043d329f27a068a956 can now be consumed by librsync."
  - "Upstream mutate.test requires perl; published perl/5.42.2 can be consumed as a Conan tool requirement so the full CTest suite runs on OHOS."
