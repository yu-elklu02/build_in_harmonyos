  - patch_file: "patches/0003-configure.patch"
    patch_description: "Use fixed relative tmp dir ./.hmbs_tmp (recipe pre-creates via Python os.makedirs), and introduce unified ac_out variable: subdirectory files (ac_file contains /) resolve to absolute $ac_top_srcdir/$ac_file (srcdir, where source tarball subdirs live), root files to relative $ac_file (builddir cwd, proven writable). All cp/cat/grep/rm/mv use $ac_out so writes and subsequent grep reads target the same file (out-of-tree build puts subdirs in srcdir not builddir; HMDFS getcwd fails so relative subdirectory paths cannot be resolved)."
    patch_type: "portability"
    sha256: "b68453208743bd786a1dca06097de768f53b8e7e588a486a4f875a12f0ef7fa8"
  - patch_file: "patches/0004-cdk_compat-MAX_LINES.patch"
    patch_description: "Hoist #define MAX_LINES 5000 out of the #ifdef CDK_VERSION_PATCH block in include/cdk_compat.h, defining it unconditionally after #include <cdk.h>. toybox sed in config.status cannot run the autoconf subs-tmp.sed fragments (s,@VAR@,value,;t t + :t label + b/t branches), so the generated include/cdk_version.h is empty and CDK_VERSION_PATCH is never defined. Without this fix cdk_compat.c:60 fails with 'use of undeclared identifier MAX_LINES' because the #else branch only defines ObjOf/ScreenOf (CI build #14380)."
    patch_type: "portability"
    sha256: "61207e4d689974931c1386ad45d07a47629377beb79ab2755683a5e885df7efb"
