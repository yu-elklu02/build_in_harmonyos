# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcdk5/5.0.20260119
homepage: "https://invisible-island.net/cdk"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# CDK (Curses Development Kit) 是交互式 curses widget 库，上游无自动化测试套件
# 已审计上游源码 (cdk-5.0-20260119.tgz)：
#   - 顶层 Makefile.in 的 check 目标仅打印 "This interactive program has no automated tests"
#   - cli/ demos/ examples/ 子目录的 Makefile.in 均无 check/test 目标
#   - 无 gtest/TEST()/TEST_F/TAP/pytest/unittest/ctest/cmake_test 任何自动化测试框架
#   - include/cdk_test.h 仅定义 ExitProgram()（用于 ncurses leak-checking，非测试断言）
#   - examples/ 与 demos/ 是人工交互演示程序，需 controlling tty，非自动化测试
upstream_check_command: "make -n check"
upstream_tests_exist: false

# conanfile.py build() 方法中是否已集成上游测试
# 上游无测试套件，无法集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# CDK 上游零自动化测试用例
upstream_tests: []

# 上游测试审计结论（HMBS 要求：缺少显式审计时必须拒绝放行）
upstream_test_audit:
  audited_tag: "5.0-20260119"
  audited_url: "https://invisible-mirror.net/archives/cdk/cdk-5.0-20260119.tgz"
  source_files_total: 95
  has_test_directory: false
  has_pytest_config: false
  has_unittest_main: false
  has_github_actions_test: false
  has_gtest_framework: false
  has_autotools_check_target: true
  check_target_content: "echo \"This interactive program has no automated tests\""
  conclusion: "CDK 上游 5.0-20260119 为交互式 curses widget 库，顶层 Makefile.in 的 check 目标仅打印 \"This interactive program has no automated tests\"，cli/demos/examples 子目录无 check/test 目标，无 gtest/TAP/pytest 等任何自动化测试框架。确认上游自动化测试用例数为 0。"
  reason: "CDK 上游不提供自动化测试套件；test_package 为适配后补全的烟雾测试，链接 -lcdkw 并调用 CDKVersion() + vSWINDOW 枚举 + cdk5-config --version。"

# test_package 中自带的测试 (消费者视角验证)
# 验证 CDK 静态库可链接、头文件可用、CDKVersion() 返回有效版本、cdk5-config 可执行
test_package_tests:
  - file: test_cdk.c
    description: "C 烟雾测试：链接 -lcdkw -lncursesw，调用 CDKVersion() 并检查 vSWINDOW widget 枚举"
    command: "${CC:-cc} -o test_cdk test_cdk.c -lcdkw -lncursesw && ./test_cdk"
  - file: test.sh
    description: "Shell 包装：运行 test_cdk 二进制与 cdk5-config --version"
    command: "sh test.sh"
  - file: conanfile.py
    description: "Conan 测试入口：build() 编译链接 test_cdk.c，test() 运行二进制 + cdk5-config --version"
    command: "conan build . && conan test ."

# 测试断言总数 (近似值, 用于质量评估)
# 3 个测试场景: 链接 libcdkw 成功、CDKVersion() 非空、vSWINDOW 枚举为正
assertion_count: 3
