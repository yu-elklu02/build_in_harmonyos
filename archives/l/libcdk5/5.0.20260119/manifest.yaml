software: libcdk5
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0.20260119/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.20260119"

# 编译状态
# published | built | failed | archived
# built: conanfile.py 已就位、真机预检通过后由 HMBS 提交推送
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://invisible-mirror.net/archives/cdk/cdk-5.0-20260119.tgz"

  # 源码校验和
  sha256: "46bb68441e698a7b1f642e2564968a7700afef0386442afd5cf2e7b296d30ee5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: autotools
  system: autotools

  # 配置选项列表
  # --enable-static / --disable-shared: R26 系统同名库静态
  # --with-curses-dir=$prefix: 指向 cmd-pkgs 安装的 ncursesw
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-curses-dir=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  # ncurses 通过 cmd-pkgs 系统安装（非 conan 依赖），与 abook 一致
  dependencies:
    - ncurses (system, via cmd-pkgs, widechar 6.4)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 上游测试审计
# ============================================================

# 上游无自动化测试套件（详见 test_package/MANIFEST.yml）
upstream_tests_exist: false
upstream_test_count: 0

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需 HarmonyOS 平台识别（__OHOS__ LIBC 检测 + ohos-linux 元组 + HarmonyOS uname 分支）"
  - "HMDFS: configure/config.status 无法经 mktemp 或 mkdir 创建可写 tmp 子目录，runner 注入的 $TMPDIR 也不可写；getcwd() 失败导致内核无法解析相对路径子目录（根目录文件成功、子目录文件失败）；out-of-tree build 时子目录文件在 srcdir 不在 builddir cwd，需用源码补丁引入统一 ac_out 变量（子目录文件 = $ac_top_srcdir/$ac_file 绝对，根目录文件 = $ac_file 相对 cwd），所有 cp/cat/grep/rm/mv 都用 ac_out 确保写入与后续 grep 读取一致；tmp 指向固定相对路径 ./.hmbs_tmp（配方用 Python os.makedirs 预创建），禁用 trap 的 rm -rf $tmp"
  - "cmd-pkgs ncurses 6.4 仅提供运行期库不含开发头文件，需从上游 ncurses 源码补齐头文件"

patch_generation:
  method: python-difflib-unified
  source_orig_dir: .hmbs/tmp/gen/a
  source_work_dir: .hmbs/tmp/gen/b
  generated_at: '2026-07-28T22:15'

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: filesystem-fix
    platform_only: True
    guard: 'HMDFS-umask'
