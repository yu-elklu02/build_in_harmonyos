# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libedit/20240808
homepage: https://thrysoee.dk/editline/

# libedit 无标准 make check 测试套件（行编辑库需终端交互，难以自动化）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_main.c
    description: "libedit history API 验证 (history_init/H_ENTER/H_ADD/history_end)"
    command: "./test_libedit"

# 测试断言总数
assertion_count: 3
