# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: libgsm/1.0.18
homepage: "http://kbs.cs.tu-berlin.de/~jutta/gsm/"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from tst/ directory in source)
upstream_tests:
  - file: tst/toast_test.sh
    source: libgsm-1.0.18/tst/toast_test.sh
    description: "Toast round-trip encode/decode test"
    command: "./tst/toast_test.sh"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "GSM encode/decode round-trip test"
    command: "./test_libgsm"

# Approximate assertion count
assertion_count: 3
