package: luau/0.689-r0
homepage: "https://github.com/luau-lang/luau"

upstream_check_command: "Build with LUAU_BUILD_TESTS=ON and run all three test binaries"
upstream_test_in_build: true
upstream_test_command: "Luau.UnitTest && Luau.Conformance && Luau.CLI.Test"

upstream_tests:
  - name: Luau.UnitTest
    source: luau-0.689/tests/*.test.cpp
    description: "Compiler, type checker, parser, code generation, and VM unit tests"
    command: "./Luau.UnitTest"
  - name: Luau.Conformance
    source: luau-0.689/tests/Conformance.test.cpp
    description: "Luau language and VM conformance tests"
    command: "./Luau.Conformance"
  - name: Luau.CLI.Test
    source: luau-0.689/tests/Repl.test.cpp
    description: "REPL, require, coverage, and profiler tests"
    command: "./Luau.CLI.Test"

test_package_tests:
  - file: test.cpp
    description: "Luau C API state, load, execute, and result validation"
    command: "ctest --output-on-failure"
  - file: conanfile.py
    description: "Packaged luau command-line executable smoke test"
    command: "luau --help"

# 34266 upstream assertions plus 6 C API checks and 1 CLI check.
assertion_count: 34273
