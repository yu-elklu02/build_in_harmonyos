# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libXau/1.0.12
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxau"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: Autest.c
    source: libXau-1.0.12/Autest.c
    description: "XauWriteAuth() writes an Xauth record to a tmpfile and returns 0"
    command: "./Autest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 测试：XauFileName/XauWriteAuth->XauReadAuth 往返/XauDisposeAuth(NULL)/sizeof(Xauth) ABI"
    command: "./test_libxau"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
