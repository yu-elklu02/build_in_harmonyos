package: libxau/1.0.11
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxau"

# Upstream ships exactly one Automake check_PROGRAM: `Autest`,
# declared in upstream Makefile.am as `check_PROGRAMS=Autest` /
# `TESTS=Autest`. Source file: `Autest.c` (77 lines) at the package
# root. It exercises XauWriteAuth() round-trip on a tmpfile and
# returns 0 on success.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "./Autest"
upstream_tests:
  - name: "Autest"
    file: "Autest.c"
    description: "Round-trip XauWriteAuth() to a tmpfile; exit 0 = success, 1 = write failure"
    source_dir: "."   # relative to package root
    expected_assertions: 1   # 1 implicit assertion: return code

test_package_tests:
  - file: test.c
    description: "Link libXau and exercise XauFileName() (returns path or NULL), XauDisposeAuth(NULL) (documented no-op), sizeof(Xauth) ABI sanity, and output integrity."
    command: "test_libxau"

assertion_count: 4
