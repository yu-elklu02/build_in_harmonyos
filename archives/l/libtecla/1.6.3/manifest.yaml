# 版本级 manifest — libtecla 1.6.3
# 遵循 ARCHIVE-SPEC v2.0

version: "1.6.3"
software: "libtecla"

status: built

build_date: "2026-08-11"
build_system: makefile

source:
  url: "https://www.astro.caltech.edu/~mcs/tecla/libtecla-1.6.3.tar.gz"
  sha256: "f2757cc55040859fcf8f59a0b7b26e0184a22bece44ed9568a4534a478c1ee1a"
  tar_format: tar.gz

build:
  system: custom
  configure_options: ["--build=aarch64-linux-ohos", "--host=aarch64-linux-ohos"]
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libtecla 是 Tecla 命令行编辑库（纯 C，静态库 libtecla.a/libtecla_r.a）；tarball 条目带 ./ 前缀导致 conan strip_root 只剥 .，源码落在 source_folder/libtecla/ → 配方用 _src_root() 动态定位 configure 所在目录"
  - "libtecla 自带 2003 版 config.guess/config.sub（不识别 OHOS）且旧 configure 生成的 config.status 在 OHOS 上临时目录 Permission denied → 用现代 autoconf 重新生成 configure + 替换现代 config.guess/sub + 固定 --build/--host 三元组（E007/E072/E046 模式）"
  - "configure 内部 umask 077 建临时目录（HMDFS 拒绝 700 权限）→ 重新生成后 sed umask 077→022（E046）"
  - "make 的 .so 链接直接用 ld.lld -lc（绕过 clang 驱动）→ OHOS 找不到 libc → configure 后 sed Makefile 在 -lc 前插入 sysroot -L（/data/service/hnp/ohos-sdk.org/ohos-sdk_*/ohos/native/sysroot/usr/lib/aarch64-linux-ohos）"
