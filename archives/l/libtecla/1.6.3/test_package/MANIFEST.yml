# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtecla/1.6.3
homepage: "https://sites.astro.caltech.edu/~mcs/tecla/"

# 上游测试命令 (上游无 make check；demo 程序为交互式示例, 无自动化测试入口)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libtecla 上游无自动化测试套件（demo 程序为交互式命令行示例，非自动化断言）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libtecla.sh
    description: "验证静态库包装完整性：头文件/lib 存在 + 编译链接 C 程序调用 libtecla_version() 断言 1.6.3（R34 实质调用 API）"
    command: "sh test_libtecla.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 1 头文件 + 1 lib + 1 编译链接运行版本断言 = 3
assertion_count: 3
