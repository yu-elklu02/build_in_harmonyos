# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libhdhomerun/20260313
homepage: "https://www.silicondust.com"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libhdhomerun does not have a formal test suite; the Makefile has no "check" target
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Validate hdhomerun_discover_validate_device_id API from the library"
    command: "./test_libhdhomerun"

# 测试断言总数
assertion_count: 2
