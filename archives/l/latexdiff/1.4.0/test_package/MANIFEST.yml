package: latexdiff/1.4.0
homepage: "https://github.com/ftilmann/latexdiff"

upstream_check_command: "make test-ext && make test-so && make test-fast"
upstream_test_in_build: false
upstream_test_command: "make test-ext && make test-so && make test-fast"

upstream_tests:
  - file: Makefile
    description: "Run the release archive example with the system Algorithm::Diff module."
    command: "make test-ext"
  - file: Makefile
    description: "Run the release archive example with the self-contained latexdiff-so script."
    command: "make test-so"
  - file: Makefile
    description: "Run the release archive example with the diff-backed latexdiff-fast script."
    command: "make test-fast"

test_package_tests:
  - file: test_latexdiff.py
    description: "Verify packaged wrappers, libexec scripts, manpages, version output, and a real old/new TeX diff."
    command: "python test_latexdiff.py <package-folder>"

assertion_count: 26
