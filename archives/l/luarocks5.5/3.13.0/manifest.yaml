software: luarocks5.5
version: "3.13.0"
status: built
build_date: "2026-08-02"
build_system: configure-make

source:
  url: "https://luarocks.org/releases/luarocks-3.13.0.tar.gz"
  sha256: "245bf6ec560c042cb8948e3d661189292587c5949104677f1eecddc54dbe7e37"
  tar_format: tar.gz

build:
  system: configure-make
  build_system: configure-make
  configure_options:
    - "--prefix=/"
    - "--sysconfdir=/etc"
    - "--force-config"
    - "--lua-version=5.5"
    - "--with-lua-bin=<lua/5.5.0>/bin"
    - "--with-lua-include=<lua/5.5.0>/include"
    - "--with-lua-lib=<lua/5.5.0>/lib"
  dependencies:
    - lua/5.5.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "LuaRocks 3.13.0 configure explicitly supports Lua versions 5.1 through 5.5."
  - "The release archive contains 44 upstream *_spec.lua files plus smoke_test.sh and test_regression.sh."
  - "The upstream rockspec declares Busted-based tests with luacov and busted-htest test dependencies and excludes ssh/git tags on Unix."
  - "A reproduced Busted run with Lua 5.5 executed 55 cases from 43 test files: 52 passed, 3 skipped, and 178 setup/integration errors occurred because the suite tries to install luacov 0.15.0, whose dependency range is lua >= 5.1, < 5.5."
  - "OHOS worker Lua can fail os.tmpname() inside LuaRocks util.popen_read; the packaged util.lua now prefers TMPDIR/TMP/TEMP for deterministic temporary files before falling back to os.tmpname()."

knowledge_ref:
  - "knowledge/doc/E215.md"
  - "knowledge/graph/E215.kv"
