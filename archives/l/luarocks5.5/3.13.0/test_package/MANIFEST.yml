package: luarocks5.5/3.13.0
homepage: "https://luarocks.org"

upstream_check_command: "busted --exclude-tags=ssh,git -Xhelper lua_dir=$(LUA_DIR) -Xhelper lua=$(LUA)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  counting_basis: "44 upstream *_spec.lua files in luarocks-3.13.0/spec plus smoke_test.sh and test_regression.sh inventory; Busted test execution requires upstream test dependencies luacov and busted-htest"
  spec_files: 44
  smoke_scripts: 2
  total_inventory_files: 46
  reproduced_busted_attempt:
    files_run: 43
    cases_run: 55
    passed: 52
    skipped: 3
    errors: 178
    result: "not Path A; luacov 0.15.0-1 declares lua >= 5.1, < 5.5 while the task targets Lua 5.5"
  rockspec_test_dependencies:
    - luacov
    - busted-htest
  unix_excluded_tags:
    - ssh
    - git

test_package_tests:
  - file: test_luarocks55.py
    scenario: normal
    description: "Run packaged luarocks and luarocks-admin commands with Lua 5.5 and inspect configuration/help output"
    command: "python3 test_luarocks55.py"
  - file: test_luarocks55.py
    scenario: fault-injection
    description: "Verify invalid luarocks command and invalid rockspec lint fail deterministically"
    command: "python3 test_luarocks55.py"

assertion_count: 10
