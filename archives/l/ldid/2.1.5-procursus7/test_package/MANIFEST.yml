# test_package/MANIFEST.yml — ldid 2.1.5-procursus7
# CI L0e requires this file to exist.

package: ldid/2.1.5-procursus7
homepage: "https://github.com/ProcursusTeam/ldid"

# ldid has no upstream test suite (Makefile project, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs ldid --version (verifies 'Link Identity Editor' output and Usage display)"
    command: "bash test.sh"

# Approximate assertion count (--version check + -h check)
assertion_count: 2
