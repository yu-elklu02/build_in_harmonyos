software: ldid
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.5-procursus7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.5-procursus7"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"
conan_adapt_date: "2026-08-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (ProcursusTeam/ldid on GitHub)
  url: "https://github.com/ProcursusTeam/ldid/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: "a56feb1dfeada538be055eaccd306963683fb5eecdb45d48e5b04b39b3b5ac11"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # ldid uses simple Makefile, no configure script
  # Build: make CC=clang CXX=clang++
  # Key: PKG_CONFIG_PATH must include libplist-2.0 and libcrypto .pc files
  # Conan recipe generates PkgConfigDeps .pc files and creates libcrypto.pc wrapper

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libplist/2.3.0
  - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# No patches needed - ldid builds cleanly with PKG_CONFIG_PATH set

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ldid requires libplist-2.0 and libcrypto (openssl) as dependencies"
  - "ldid uses simple Makefile build system, no configure script"
  - "Makefile uses pkg-config to find libplist-2.0 and libcrypto"
  - "openssl Conan package generates openssl.pc not libcrypto.pc; recipe creates libcrypto.pc wrapper in generate()"
  - "PKG_CONFIG_PATH must be set explicitly in build() to point to PkgConfigDeps output"
  - "ldid --version outputs 'Link Identity Editor <version>' followed by Usage, not just version number"
  - "ldid -h prints CDHash (not help); --version shows both version and usage"
