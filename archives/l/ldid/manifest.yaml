# 软件级 manifest — ldid
# 遵循 ARCHIVE-SPEC v2.0

software: ldid
display: "ldid"
description: "Mach-O 伪代码签名工具（Link Identity Editor）— 处理 Mach-O 二进制的代码签名、entitlements 和 requirements"
category: utility
homepage: "https://github.com/ProcursusTeam/ldid"
license: AGPL-3.0-only
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本，无 make check 目标"
    - "依赖 libplist-2.0（plist 解析）和 libcrypto（openssl 加密库）"
    - "Makefile 使用 pkg-config 查找 libplist-2.0 和 libcrypto"
    - "openssl Conan 包生成 openssl.pc 而非 libcrypto.pc，需在 generate() 中创建 libcrypto.pc 包装"
    - "ldid 是 Mach-O 格式处理工具，鸿蒙 ELF 签名使用 ohc-run.py sign-elf，ldid 作为补充工具"
    - "ldid --version 输出 'Link Identity Editor <version>' 加 usage 信息，非标准版本号格式"
  common_dependencies:
    - libplist/2.3.0
    - openssl/3.5.6

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.5-procursus7":
    status: published
    build_date: "2026-06-17"
    conan_adapt_date: "2026-08-10"
