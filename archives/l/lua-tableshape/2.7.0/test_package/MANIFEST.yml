# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lua-tableshape/2.7.0
homepage: "https://github.com/leafo/tableshape"

# 上游测试命令
upstream_check_command: "luarocks make --local tableshape-dev-1.rockspec && busted spec/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: spec/tableshape_spec.moon
    source: tableshape-2.7.0/spec/tableshape_spec.moon
    description: "Core tableshape type checking tests (1138 lines)"
    command: "busted spec/tableshape_spec.moon"
  - file: spec/transform_spec.moon
    source: tableshape-2.7.0/spec/transform_spec.moon
    description: "Transform and repair tests (935 lines)"
    command: "busted spec/transform_spec.moon"
  - file: spec/tags_spec.moon
    source: tableshape-2.7.0/spec/tags_spec.moon
    description: "Tag and scope state tests (432 lines)"
    command: "busted spec/tags_spec.moon"
  - file: spec/json_schema_spec.moon
    source: tableshape-2.7.0/spec/json_schema_spec.moon
    description: "JSON Schema extension tests (827 lines)"
    command: "busted spec/json_schema_spec.moon"
  - file: spec/moonscript_spec.moon
    source: tableshape-2.7.0/spec/moonscript_spec.moon
    description: "MoonScript extension tests (346 lines)"
    command: "busted spec/moonscript_spec.moon"
  - file: spec/with_args_spec.moon
    source: tableshape-2.7.0/spec/with_args_spec.moon
    description: "with_args extension tests (235 lines)"
    command: "busted spec/with_args_spec.moon"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_tableshape.c
    description: "C harness that embeds Lua and validates require('tableshape'), types.string, types.number, types.shape, and json_schema extension"
    command: "./test_tableshape"

# 测试断言总数 (近似值)
assertion_count: 60
