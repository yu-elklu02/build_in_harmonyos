# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lua-pty/1.1
homepage: "https://github.com/AshleighAdams/lua-pty"

# 上游测试命令
upstream_check_command: "make check"

# 上游无独立测试程序，Makefile 的 pty.lua target 仅做语法检查 (luac -p)
upstream_test_in_build: false
upstream_test_command: "luac -p src/pty.lua"

# 上游实际运行的测试
upstream_tests:
  - file: src/pty.lua
    source: lua-pty-1.1/src/pty.lua
    description: "Lua syntax check via luac -p"
    command: "luac -p src/pty.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Load pty.core module and call getenvs()"
    command: "./test_lua_pty"

# 测试断言总数
assertion_count: 2
