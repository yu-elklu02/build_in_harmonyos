software: libcgicc
version: "3.2.19"
status: built
build_date: "2026-07-30"
conan_ref: "libcgicc/3.2.19@ohpcd/stable"

source:
  url: "https://ftp.gnu.org/gnu/cgicc/cgicc-3.2.19.tar.gz"
  sha256: "2a17b976248de03447f9e36d6ce18a80749990d8543e2dfeea09c413eb67f7f0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-demos"
    - "--disable-fcgi-demos"
    - "DOXYGEN=echo"
  upstream_test_command: "make check -j1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-support-config-sub-ohos.patch"
  - "0002-support-config-guess-ohos.patch"
  - "0003-configure-hmdfs-umask.patch"
  - "0004-disable-doc-subdir.patch"

knowledge_gained:
  - "GNU cgicc 3.2.19 uses Autotools/libtool and has no runtime Conan dependencies."
  - "Upstream release contains no populated test/ directory; make check is retained but expected to be mostly a build-system smoke target."
  - "Default demos are optional CGI examples, so they are disabled for the library package to avoid networking/FastCGI side paths."
  - "OHOS needs config.guess/config.sub linux-ohos triplet recognition and HMDFS-friendly configure umask handling."
  - "TMPDIR/TMPPREFIX must point at writable per-run directories on OHOS; /tmp is read-only on the tested device."
  - "Autotools/libtool may need LD=CC and LLVM binutils in PATH when only ld.lld exists without a bare ld symlink."
  - "GNU cgicc release documentation is not needed for the library package and fails in out-of-tree builds when Doxygen is stubbed."
