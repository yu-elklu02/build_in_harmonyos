package: lizard/2.1
homepage: "https://github.com/inikep/lizard"

upstream_check_command: "make -C examples test"
upstream_test_in_build: true
upstream_test_command: "make -C examples test"

upstream_tests:
  - file: examples/printVersion.c
    source: lizard-2.1/examples/printVersion.c
    description: "Example program that queries the Lizard library version"
    command: "./printVersion"
  - file: examples/blockStreaming_doubleBuffer.c
    source: lizard-2.1/examples/blockStreaming_doubleBuffer.c
    description: "Streaming compression/decompression example"
    command: "./doubleBuffer Makefile"
  - file: examples/frameCompress.c
    source: lizard-2.1/examples/frameCompress.c
    description: "Frame API compression example linked against liblizard"
    command: "./frameCompress Makefile"

test_package_tests:
  - file: test.c
    description: "Consumer test: version check plus Lizard_compress/Lizard_decompress_safe round trip"
    command: "./test_lizard"

assertion_count: 4
