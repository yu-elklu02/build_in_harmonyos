# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcuckoo/0.3.1
homepage: "https://github.com/efficient/libcuckoo"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libcuckoo uses Catch testing framework for unit tests, but the Catch version
# bundled with v0.3.1 is incompatible with OHOS C++ standard library (std::uniform_int_distribution
# concept check fails). The library itself is header-only and fully functional.
upstream_tests:
  - file: tests/unit-tests/test_runner.cc
    source: libcuckoo-0.3.1/tests/unit-tests/test_runner.cc
    description: "Catch-based unit tests (incompatible with OHOS stdlib, not built)"
    command: "./unit_tests"
  - file: tests/stress-tests/stress_tests.cc
    source: libcuckoo-0.3.1/tests/stress-tests/stress_tests.cc
    description: "Stress tests for concurrent operations (not built on OHOS)"
    command: "./stress_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cc
    description: "Consumer test: insert, find, erase, update operations on cuckoohash_map"
    command: "./test_libcuckoo"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
