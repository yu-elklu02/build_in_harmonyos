# test_package/MANIFEST.yml
# Upstream official test declaration

package: lzbench/2.2
homepage: "https://github.com/inikep/lzbench"

# lzbench has no formal test suite (benchmark tool)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (none)
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run lzbench -V to verify binary is installed and reports version"
    command: "conan create (test_package: lzbench -V)"

assertion_count: 1
