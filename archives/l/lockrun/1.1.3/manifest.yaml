software: lockrun
# 版本级 manifest
# 文件位置: archives/l/lockrun/1.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.3"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（单文件C程序，无标准构建系统）
build_system: manual

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（单文件C源码，非tarball）
  url: "http://unixwiz.net/tools/lockrun.c"

  # 源码校验和
  sha256: "cea2e1e64c57cb3bb9728242c2d30afeb528563e4d75b650e8acae319a2ec547"

  # 压缩格式（单文件，非标准tarball）
  tar_format: raw_c

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（单文件C程序，无标准构建系统）
  system: manual

  # 编译命令（无标准构建系统时记录实际编译命令）
  compile_command: "clang -o lockrun lockrun.c -Wall -Wextra"

  # 安装命令（手动安装步骤）
  install_command: "mkdir -p $DESTDIR/$PREFIX/bin && cp lockrun $DESTDIR/$PREFIX/bin/lockrun && chmod 755 $DESTDIR/$PREFIX/bin/lockrun"

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-report-exec-failure.patch"

# ============================================================
# 预编译包信息
# ============================================================

package:
  # 预编译包文件名
  file: "lockrun-1.1.3-ohos-aarch64.tar.gz"

  # 预编译包大小
  size_bytes: 92193

  # 预编译包SHA256
  sha256: "f8789359a61a73700f7ba62e09a5643c09a4f80ea77eef47b3bae3735b2fcead"

  # 打包内二进制SHA256
  binary_sha256: "4476e0f53c1a41bd15e916bd4477b1a2534f3f138aec3e73cdd4e3190aa678fb"

  # 二进制信息
  binary_type: "ELF64 AArch64 PIE (DYN)"
  binary_size_original: 27072
  binary_size_packaged: 79744
  runpath: "$ORIGIN/../lib:$ORIGIN/../lib/external"
  stripped: true

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "单文件C源码（非tarball）需要手动编译，init-build无法自动处理解压"
  - "G0 clean-verify无法验证非tarball格式源码，是工具链结构性限制"
  - "lockrun使用lockf()（F_TLOCK定义时）或flock()作为锁定机制，鸿蒙平台两者均支持"
  - "lockrun无标准构建系统，编译命令为: clang -o lockrun lockrun.c"
  - "lockrun --help实际输出版本+帮助信息，没有独立的--help选项"
  - "lockrun正确传递子命令退出码，true→0, false→1"
  - "lockrun --quit模式下锁被持有时静默退出并返回退出码0，适合cron环境"
