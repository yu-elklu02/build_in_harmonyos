package: latex2html/2026
homepage: "https://www.latex2html.org/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: "make test TESTCASE=basic"

upstream_tests:
  - test: "make check"
    description: "Perl 语法检查 (138+ 文件)"
    expected: "0"
  - test: "make test TESTCASE=basic"
    description: "文档转换测试 — basic.tex (无公式，纯文本)"
    expected: "0"
  - test: "make test TESTCASE=l2htest"
    description: "文档转换测试 — l2htest.tex (含公式，触发 TeX 图像链路)"
    expected: "非 0（OHOS 缺 TeX 工具链）"

test_package_tests:
  - file: "test_latex2html.sh"
    description: "验证 latex2html 二进制通过 --version 可执行"
    command: "latex2html --version"

assertion_count: 1