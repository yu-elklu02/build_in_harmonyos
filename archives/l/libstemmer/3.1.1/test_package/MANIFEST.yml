# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libstemmer/3.1.1
homepage: "https://snowballstem.org/"

# libstemmer has no independent test suite; verification via test_package consumer test
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libstemmer.c
    description: "English stemmer API test: stem(\"connected\")->\"connect\", stem(\"running\")->\"run\", sb_stemmer_list()"
    command: "./test_libstemmer"

# 测试断言总数
assertion_count: 3
