software: libjodycode
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeberg.org/jbruchon/libjodycode/archive/v4.0.tar.gz"

  # 源码校验和
  sha256: "71da5fb27ffb4f8c4bc5bab4ff4456f2d8b2fb2ee0317834e8bf1ca10179de43"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: makefile

  # 配置选项列表（Makefile 使用 PREFIX/DESTDIR 而非 configure）
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "DESTDIR=$TEST_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile 类型库在鸿蒙平台编译时 SIMD 自动禁用，无需修改源码"
  - "无 configure 脚本的纯 Makefile 库使用 PREFIX 和 DESTDIR 变量替代 --prefix 和 DESTDIR"
