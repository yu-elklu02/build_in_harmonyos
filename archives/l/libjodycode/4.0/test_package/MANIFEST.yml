# test_package/MANIFEST.yml — libjodycode 4.0
# Declares the upstream test provenance for CI L1 compliance

upstream_test_source: "none"
# libjodycode upstream only provides a dummy test.sh (echo "OK")
# This test_package provides a real API-level test that exercises:
# - jc_version, jc_api_version (version info)
# - jc_streq, jc_strneq (string comparison)
# - jc_numeric_strcmp (numeric string sort)

upstream_test_command: "make test"
upstream_test_result: "OK (dummy test script)"

our_test_command: "ctest --output-on-failure"
our_test_description: "CMake-based test that links against libjodycode and calls multiple API functions"

test_modifications:
  - "Upstream test.sh only prints 'OK' without exercising the library"
  - "Replaced with CMake test that links against libjodycode and calls jc_streq, jc_strneq, jc_numeric_strcmp, and reads jc_version"
