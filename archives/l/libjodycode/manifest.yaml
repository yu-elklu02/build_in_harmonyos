software: libjodycode
display: "libjodycode"
description: "Jody Bruchon's universal utility function library for string, hash, file system, and path operations"
category: utility
homepage: "https://codeberg.org/jbruchon/libjodycode"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本，使用 PREFIX/DESTDIR 变量"
    - "SIMD 在非 x86_64 平台自动禁用，无需修改源码"
    - "无外部依赖，仅依赖 libc"
    - "Makefile 使用 ln -sf 创建符号链接，在 HMDFS 环境下需注意 R5"
  common_dependencies: []

versions:
  "4.0":
    status: built
    build_date: "2026-07-15"
