package: libbitarray/2.0
homepage: "https://github.com/noporpoise/BitArray"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: dev/bit_array_test.c
    source: "BitArray-2.0/dev/bit_array_test.c"
    description: "Official comprehensive bit array API test program covering copy, byte access, parity, interleave, reverse, toggle, cycle, shift, compare, search, counts, save/load, hex/string/decimal conversion, arithmetic and wrapper APIs."
    command: "./dev/bit_array_test"
  - file: dev/bitlock_test.c
    source: "BitArray-2.0/dev/bitlock_test.c"
    description: "Official pthread bit lock exercise built from bit_macros.h."
    command: "./dev/bitlock_test"
  - file: examples/example.c
    source: "BitArray-2.0/examples/example.c"
    description: "Official C example compiled by the upstream examples Makefile."
    command: "./examples/example_c"
  - file: examples/example.cpp
    source: "BitArray-2.0/examples/example.cpp"
    description: "Official C++ example compiled by the upstream examples Makefile."
    command: "./examples/example_cpp"

test_package_tests:
  - file: test.c
    description: "Consumer API test covering creation, bit updates, counting, searches, word extraction, clone/compare, shifts, binary string conversion and decimal conversion."
    command: "./test_libbitarray"

assertion_count: 27
