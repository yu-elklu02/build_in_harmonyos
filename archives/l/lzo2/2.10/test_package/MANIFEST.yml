# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzo2/2.10
homepage: "https://www.oberhumer.com/opensource/lzo/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/chksum.c
    source: lzo-2.10/tests/chksum.c
    description: "LZO checksum test"
    command: "./tests/chksum"
  - file: tests/sizes.c
    source: lzo-2.10/tests/sizes.c
    description: "LZO data type size test"
    command: "./tests/sizes"
  - file: tests/align.c
    source: lzo-2.10/tests/align.c
    description: "LZO alignment test"
    command: "./tests/align"
  - file: minilzo/testmini.c
    source: lzo-2.10/minilzo/t-testmini.c
    description: "MiniLZO self-contained test"
    command: "./minilzo/testmini"
  - file: lzotest/lzotest.c
    source: lzo-2.10/lzotest/lzotest.c
    description: "LZO full algorithm test suite (37 algorithms)"
    command: "./lzotest/lzotest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "LZO1X-1 compress/decompress round-trip test"
    command: "./test_lzo2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
