version: "0.20.8"

# published | built | failed | archived
# R29: conan_verify 通过后才可标记 published；本地 create 通过先标 built
status: built

build_date: "2026-08-11"
build_system: autotools

source:
  url: "https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz"
  sha256: "189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee"
  tar_format: tar.xz

build:
  system: autotools
  configure_options: []
  # glib/2.84.0 为制品仓依赖；configure 用 PKG_CHECK_MODULES 检查
  # glib-2.0/gobject-2.0/gio-2.0 >= 2.36（pkg-config 注入）
  dependencies:
    - "glib/2.84.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"

knowledge_gained:
  - "libgee 是 GObject 集合库（Vala 编写），Autotools 构建，官方 tarball 自带预生成的 .c 与 vala stamp，无需 valac"
  - "VALA_CHECK 通过 checkfile（.stamp）存在与否决定是否启用 vala 模式，tarball 自带 stamp → enable_vala=no"
  - "GOBJECT_INTROSPECTION_CHECK 默认 auto，OHOS 无 gobject-introspection 时自动降级不报错"
  - "config.guess/sub 需加 HarmonyOS → aarch64-unknown-linux-ohos 支持（同 vala 配方补丁）"
  - "make check 使用 gtester（glib 提供），需把 glib 包 bin 加入 PATH、lib 加入 LD_LIBRARY_PATH"
  - "libgee 头文件安装在 include/gee-0.8（geeincludedir），pkg-config 名 gee-0.8"

