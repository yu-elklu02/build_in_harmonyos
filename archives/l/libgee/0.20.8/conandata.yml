# conandata.yml — libgee 0.20.8
# 上游：GNOME libgee（GObject 集合库，官方发布物）
# R39：官方源 download.gnome.org 或其权威镜像；此处用南京大学镜像
# （sha256 与官方 release 一致；download.gnome.org 在本机网络不可达）
sources:
  url: "https://mirror.nju.edu.cn/gnome/sources/libgee/0.20/libgee-0.20.8.tar.xz"
  sha256: "189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      config.guess 增加 HarmonyOS 检测：UNAME_SYSTEM=HarmonyOS 时输出
      aarch64-unknown-linux-ohos（同 vala 配方 0001 补丁）。
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: >-
      config.sub 增加 ohos-linux OS 支持（基本系统类型 + kernel-os 校验），
      使 configure 接受 aarch64-unknown-linux-ohos triplet。
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: >-
      configure 临时目录 umask 077 改为 022：HMDFS 文件系统下 077 导致
      config.status 创建 subs1.awk 等临时文件 "Permission denied"
      （E011 同类问题，与 akku/guile 补丁相同）。
    patch_type: "portability"
