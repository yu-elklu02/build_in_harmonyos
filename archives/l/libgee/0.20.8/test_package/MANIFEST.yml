# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libgee/0.20.8
homepage: "https://wiki.gnome.org/Projects/Libgee"

# 上游测试：libgee 自带 gtester 驱动的 C 测试套件（tests/ 目录），
# make check 会构建 tests 程序并用 gtester 运行（需 glib 包提供 gtester）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# test_package 冒烟测试：C 程序实质调用 GeeArrayList/GeeCollection API
supplementary_tests:
  - file: test_package/test.c
    count: 2
    description: >-
      创建 GeeArrayList，gee_collection_add 添加 2 个字符串元素，
      gee_collection_get_size 校验集合大小为 2（2 次 API 调用断言）。
