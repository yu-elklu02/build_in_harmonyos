# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmp3lame/3.100
homepage: "https://lame.sourceforge.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# LAME 的 make check 没有实际测试用例（仅遍历子目录无操作）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# LAME 3.100 没有自动化测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 lame_init/lame_init_params/lame_close 验证库可用性"
    command: "./test_libmp3lame"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
