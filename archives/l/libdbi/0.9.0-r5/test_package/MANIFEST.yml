package: libdbi/0.9.0-r5
homepage: "https://libdbi.sourceforge.net/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# The 0.9.0 release has no TESTS or check_PROGRAMS declarations. The recipe
# still executes the upstream check target before the consumer test.
upstream_tests: []

test_package_tests:
  - file: test_libdbi.c
    description: "Consumer test for version, instance lifecycle, driver lookup and public data types"
    command: "./test_libdbi <empty-driver-directory>"

assertion_count: 29
