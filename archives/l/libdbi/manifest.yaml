software: libdbi
display: "libdbi"
description: "Database-independent abstraction layer for C"
category: database
homepage: "https://libdbi.sourceforge.net/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognize native and cross-compiled aarch64 HarmonyOS targets"
    - "Avoid configure-time umask calls unsupported by HMDFS"
    - "Disable documentation and optional libltdl integration"
    - "Package the core library without external database drivers"
  common_dependencies: []

versions:
  "0.9.0-r5":
    status: built
    build_date: "2026-07-17"
