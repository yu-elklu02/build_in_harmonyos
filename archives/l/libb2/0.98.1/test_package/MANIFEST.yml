# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libb2/0.98.1
homepage: "https://github.com/BLAKE2/BLAKE2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: blake2s-test.c
    source: libb2-0.98.1/src/blake2s-test.c
    description: "blake2s known answer test (KAT) — 256 input sizes, 32-byte output"
    command: "./blake2s-test"
  - file: blake2b-test.c
    source: libb2-0.98.1/src/blake2b-test.c
    description: "blake2b known answer test (KAT) — 256 input sizes, 64-byte output"
    command: "./blake2b-test"
  - file: blake2sp-test.c
    source: libb2-0.98.1/src/blake2sp-test.c
    description: "blake2sp (parallel) known answer test"
    command: "./blake2sp-test"
  - file: blake2bp-test.c
    source: libb2-0.98.1/src/blake2bp-test.c
    description: "blake2bp (parallel) known answer test"
    command: "./blake2bp-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: blake2b KAT 验证 + 增量API与一次性API一致性检查"
    command: "./test_libb2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
