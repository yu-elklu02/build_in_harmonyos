# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lv/4.51-10
homepage: "http://www.ff.iij4u.or.jp/~nrt/lv/"

# 上游测试命令
upstream_check_command: "make check"

# lv has no automated test suite (interactive terminal program)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# lv 源码无 make check 目标，无自动化测试套件
# 功能验证需用户部署后手动测试（交互式终端程序）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "smoke test: lv -V version check + lgrep symlink check"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
