package: leveldb/1.23
homepage: "https://github.com/google/leveldb"

upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "30 POSIX LevelDB CTest targets in the static upstream-tests build tree"
upstream_tests:
  - file: db/c_test.c
    description: "C API tests"
  - file: db/fault_injection_test.cc
    description: "Filesystem fault-injection tests"
  - file: issues/issue178_test.cc
    description: "Issue 178 regression test"
  - file: issues/issue200_test.cc
    description: "Issue 200 regression test"
  - file: issues/issue320_test.cc
    description: "Issue 320 regression test"
  - file: util/env_test.cc
    description: "Environment abstraction tests"
  - file: util/status_test.cc
    description: "Status API tests"
  - file: util/no_destructor_test.cc
    description: "NoDestructor utility tests"
  - file: db/autocompact_test.cc
    description: "Automatic compaction tests"
  - file: db/corruption_test.cc
    description: "Database corruption handling tests"
  - file: db/db_test.cc
    description: "Core database behavior tests"
  - file: db/dbformat_test.cc
    description: "Internal database format tests"
  - file: db/filename_test.cc
    description: "Database filename parsing tests"
  - file: db/log_test.cc
    description: "Write-ahead log tests"
  - file: db/recovery_test.cc
    description: "Database recovery tests"
  - file: db/skiplist_test.cc
    description: "Skip-list tests"
  - file: db/version_edit_test.cc
    description: "Version edit encoding tests"
  - file: db/version_set_test.cc
    description: "Version set tests"
  - file: db/write_batch_test.cc
    description: "Write batch tests"
  - file: helpers/memenv/memenv_test.cc
    description: "In-memory environment tests"
  - file: table/filter_block_test.cc
    description: "Filter block tests"
  - file: table/table_test.cc
    description: "SSTable tests"
  - file: util/arena_test.cc
    description: "Arena allocator tests"
  - file: util/bloom_test.cc
    description: "Bloom filter tests"
  - file: util/cache_test.cc
    description: "LRU cache tests"
  - file: util/coding_test.cc
    description: "Integer encoding tests"
  - file: util/crc32c_test.cc
    description: "CRC32C tests"
  - file: util/hash_test.cc
    description: "Hash function tests"
  - file: util/logging_test.cc
    description: "Logging utility tests"
  - file: util/env_posix_test.cc
    description: "POSIX environment tests"

test_package_tests:
  - file: test.cpp
    description: "Open a database and validate Put, Get, WriteBatch, Delete, and cleanup"
    command: "./test_leveldb"

assertion_count: 11
