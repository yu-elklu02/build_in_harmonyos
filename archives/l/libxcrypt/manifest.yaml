software: libxcrypt
display: "libxcrypt"
description: "Modern extended crypt library supporting descrypt, md5crypt, bcrypt, and sha256crypt/sha512crypt"
category: crypto
homepage: "https://github.com/besser82/libxcrypt"
license: LGPL-2.1-or-later
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "需要修改 configure 中的 umask 077 为 umask 022（HMDFS 权限限制）"
    - "需要修补 config.guess/config.sub 添加 HarmonyOS 平台识别"
    - "需要添加 -Wno-error=language-extension-token，且保留其他上游 -Werror 检查"
    - "HMDFS 上 Libtool 测试 wrapper 需要通过 shell 启动"
    - "目标 libc 缺少 API 时，独立测试目标需要显式链接库内 fallback 对象"
  common_dependencies: []

# 版本索引
versions:
  "4.4.36":
    status: built
    build_date: "2026-05-25"
  "4.5.2":
    status: built
    build_date: "2026-07-19"
    conan_ref: "libxcrypt/4.5.2"
