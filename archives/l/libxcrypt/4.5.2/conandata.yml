sources:
  url: "https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz"
  sha256: "71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071"

patches:
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "Run helper scripts through the configured shell and link the explicit_bzero fallback test object"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile.in.patch"
    patch_description: "Apply the generated Makefile counterpart of the HarmonyOS build and test fixes"
    patch_type: "portability"
  - patch_file: "patches/0003-build-aux-m4-autogen-config.guess.patch"
    patch_description: "Recognize HarmonyOS and emit an aarch64 linux-ohos triplet"
    patch_type: "portability"
  - patch_file: "patches/0004-build-aux-m4-autogen-config.sub.patch"
    patch_description: "Canonicalize the ohos-linux shorthand as linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0005-configure.patch"
    patch_description: "Use an HMDFS-compatible mode for config.status temporary directories"
    patch_type: "portability"
  - patch_file: "patches/0006-test-explicit-bzero.c.patch"
    patch_description: "Exercise the upstream explicit_bzero dead-stack test through an OHOS pthread stack backend when ucontext functions are unavailable"
    patch_type: "portability"
  - patch_file: "patches/0007-test-getrandom-fallbacks.c.patch"
    patch_description: "Exercise the upstream random-byte fallback test on OHOS even when the target libc provides arc4random_buf"
    patch_type: "portability"
