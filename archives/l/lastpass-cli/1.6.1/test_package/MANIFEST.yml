# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lastpass-cli/1.6.1
homepage: "https://github.com/lastpass/lastpass-cli"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_login.c
    source: lastpass-cli-1.6.1/test/test_login.c
    description: "Test login flow"
    command: "./lpass-test test_login"
  - file: test/test_add_account.c
    source: lastpass-cli-1.6.1/test/test_add_account.c
    description: "Test adding account"
    command: "./lpass-test test_add_account"
  - file: test/test_show.c
    source: lastpass-cli-1.6.1/test/test_show.c
    description: "Test show command"
    command: "./lpass-test test_show"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 lpass --version 验证二进制可执行"
    command: "conan test"

# 测试断言总数
assertion_count: 1
