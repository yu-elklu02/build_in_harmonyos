# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

name: lastpass-cli

# 软件名（required field）
software: lastpass-cli

# 版本号
version: "1.6.1"

# 编译状态
status: built

# 编译日期
build_date: "2026-08-10"

# 构建系统
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/lastpass/lastpass-cli/archive/refs/tags/v1.6.1.tar.gz"
  sha256: "9989ef0650db18bc3f80ba52964202b778abda0548f95dcd321e9c7c39a1a24e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "cmake_minimum_required bumped to 3.15 for CMake 4.x compatibility"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5 set in CMakeToolchain"
  dependencies:
    - openssl/1.1.1w
    - libcurl/8.5.0
    - libxml2/2.15.3
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-fix-cmake-modern-targets.patch: Update cmake_minimum_required to 3.15 and use modern CMake targets"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4.x requires cmake_minimum_required(VERSION 3.5) minimum, upstream uses 3.1"
  - "OHOS-adapted conan CMakeToolchain sets CMAKE_SYSTEM_NAME=HarmonyOS enabling CMake build"
  - "CMakeLists.txt uses old-style variables (OPENSSL_INCLUDE_DIR) not set by CMakeDeps, needs modern targets"
