package: libp11/0.4.16-r0
upstream_check_command: "Linux/native only: make -C tests -j1 check LOG_COMPILER=bash"
upstream_test_in_build: false
upstream_test_command: "OHOS official CI skips the upstream SoftHSM integration suite because it requires libtool-built PKCS#11 shared modules, while this package intentionally builds a static library"
upstream_tests:
  - file: tests/Makefile.am
    source: libp11-0.4.16.tar.gz/tests
    description: "Run all 33 upstream SoftHSM integration scripts with isolated SoftHSM and OpenSC test tools on native/Linux; OHOS static-library CI skips them because pkcs11.la/pkcs11prov.la are shared libtool modules"
    command: "make -C tests -j1 check LOG_COMPILER=bash (native/Linux only)"
    total_count: 33
    executed_count: 0
    target_pass_rate: "not applicable on OHOS official CI; shared-module integration suite is documented as skipped"
    test_dependencies:
      - "SoftHSM 2.6.1 from the official OpenHarmonyPCDeveloper cmd-pkgs release"
      - "OpenSC 0.26.1-r0 pkcs11-tool from the official OpenHarmonyPCDeveloper cmd-pkgs release"
test_package_tests:
  - file: test_package.c
    description: "Allocate and release a real libp11 context"
    command: "./test_package"
assertion_count: 2
