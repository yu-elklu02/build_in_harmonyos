# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lzo/2.10
homepage: "https://www.oberhumer.com/opensource/lzo/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testmini.c
    source: lzo-2.10/minilzo/testmini.c
    description: "minilzo self-test (mini LZO library)"
    command: "./testmini"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "LZO compression/decompression round-trip test"
    command: "./test_lzo"

# 测试断言总数 (近似值)
assertion_count: 5
