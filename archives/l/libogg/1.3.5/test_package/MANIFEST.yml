package: libogg/1.3.5
homepage: "https://xiph.org/ogg/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - file: test_bitwise.c
    source: libogg-1.3.5/test/test_bitwise.c
    description: "Bitwise ogg stream operations correctness test (18 assertions)"
    command: "./test_bitwise"
  - file: test_framing.c
    source: libogg-1.3.5/test/test_framing.c
    description: "Ogg page framing and packet encoding test"
    command: "./test_framing"

test_package_tests:
  - file: test.c
    description: "Consumer test: ogg_stream_init + packetin + pageout round-trip"
    command: "./test_libogg"

assertion_count: 3
