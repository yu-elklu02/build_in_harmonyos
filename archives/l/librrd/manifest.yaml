software: librrd
display: "librrd"
description: "librrd — RRDtool 时间序列 Round Robin 数据库 C 库（rrd_create/rrd_update/rrd_fetch）"
category: system
homepage: "https://oss.oetiker.ch/rrdtool/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 release tarball 含预生成 configure（免 automake）：rrdtool-1.10.2.tar.gz"
    - "rrd_create.c 正则支持：无 glib 时走 pcre 分支（依赖 pcre/8.45），0004 补丁提供最小 GList 替代"
    - "必须禁用图形特性（--disable-rrd_graph/--disable-rrdcgi）和脚本绑定，仅编译纯 C 库"
    - "OHOS 沙箱 configure 临时目录 umask 077→022（0700 目录不可写）"
    - "toybox expr 的 \\| 多分支链有 bug，需强制 config.status as_expr=false 走 sed fallback"
    - "构建方式：make -C src librrd.la，package() 手动打包 librrd.a/librrd.so*"
  common_dependencies:
    - pcre

versions:
  "1.10.2":
    status: built
    build_date: "2026-08-01"
