# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: librrd/1.10.2
homepage: https://oss.oetiker.ch/rrdtool/

# 上游测试命令（RRDtool 1.10.2 的 make check）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（规则 5）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游 tests/ 目录实测（GitHub API 62 条目；release tarball 60 条目）
# make check 的 TESTS 列表（tests/Makefile.am）实际运行 28 个用例：
#   modify1-5 tune1-2 graph1-3 rpn1-2 rrdcreate compat-cloexec dump-restore
#   create-with-source-1..4 create-with-source-and-mapping-1 create-from-template-1
#   dcounter1 vformatter1 xport1-3 list1 pdp-calc1
upstream_tests:
  - file: tests/Makefile.am
    source: rrdtool-1.x-1.10.2/tests/
    description: "上游 make check — tests/ 目录 62 条目（GitHub API），TESTS 列表 28 个用例"
    command: "make check"

# make check 本地实测结果（conan create 构建中运行，见构建日志）
#   TOTAL: 28  PASS: 15  FAIL: 13
#   13 个 FAIL 均为配方 --disable-rrd_graph/--disable-rrd_restore/--disable-rrdcached
#   禁用的图形/XML/守护进程功能用例（rrdtool 报 "compiled without graphics"），
#   属预期失败；核心数据路径 create/update/dump/tune/modify 全部 PASS。
upstream_test_result:
  total: 28
  passed: 15
  failed: 13
  expected_failures: "graph1/2/3 rpn1/2 xport1/2/3 vformatter1 create-with-source-4（--disable-rrd_graph 预期）；dump-restore（--disable-rrd_restore 预期）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/src/test_librrd.c
    description: "验证 librrd API 链接与核心读写链路：rrd_strversion/rrd_version + rrd_create/rrd_update/rrd_fetch（5 个断言）"
    command: "./test_librrd"

# 测试断言总数（上游 make check 28 用例 + test_package 5 断言）
assertion_count: 33
