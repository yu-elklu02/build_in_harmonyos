# conandata.yml — librrd 1.10.2 (RRDtool 时间序列数据库库)

sources:
  url: "https://github.com/oetiker/rrdtool-1.x/releases/download/v1.10.2/rrdtool-1.10.2.tar.gz"
  sha256: "9787114551ee9b5db7c72722736388dcc54bf00ded51b5dd47feed11fb179fe4"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: "config.guess: 添加 aarch64 OHOS/HarmonyOS 平台识别"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "config.sub: 添加 ohos-linux 三元组识别"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-no-glib-pcre.patch"
    patch_description: "configure: glib/pcre 硬性检查降级为警告 + umask 077→022（OHOS 沙箱可写临时目录）"
    patch_type: "portability"
  - patch_file: "patches/0004-rrd-create-no-glib.patch"
    patch_description: "rrd_create.c: 条件包含 glib.h + 无 glib 时最小 GList 替代实现（pcre 分支可用）"
    patch_type: "portability"
  - patch_file: "patches/0005-rrd-config-pcre.patch"
    patch_description: "rrd_config.h: 预生成头文件改为 HAVE_PCRE_COMPILE + 取消 ENABLE_NLS（无 glib/gettext）"
    patch_type: "portability"
  - patch_file: "patches/0006-rrd-utils-no-glib.patch"
    patch_description: "rrd_utils.c: glib.h 条件包含 + g_thread_init 守卫（无 glib 时跳过）"
    patch_type: "portability"
  - patch_file: "patches/0007-rrd-update-no-glib.patch"
    patch_description: "rrd_update.c: glib.h 条件包含 + GTree 缓存条件化（无 glib 时直接查文件）"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-shebang-env-bash.patch"
    patch_description: "tests 脚本 shebang #!/bin/bash → #!/usr/bin/env bash（OHOS 沙箱无 /bin/bash，make check 可运行）"
    patch_type: "portability"
  - patch_file: "patches/0009-rrd-config-undef-graph.patch"
    patch_description: "rrd_config.h: HAVE_RRD_GRAPH → undef（与 configure 生成版一致，避免源码树旧头污染 rrd_tool.c 编译致 rrdtool 链接失败）"
    patch_type: "portability"
