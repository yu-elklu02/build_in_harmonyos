# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtree/3.2.0-dev
homepage: "https://github.com/haampie/libtree"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/01_origin
    source: libtree-3.2.0-dev/tests/01_origin
    description: "Tests $ORIGIN rpath/runpath resolution"
    command: "make -C tests/01_origin check"
  - file: tests/02_rpath_of_parents_parent
    source: libtree-3.2.0-dev/tests/02_rpath_of_parents_parent
    description: "Tests rpath of parent's parent directory"
    command: "make -C tests/02_rpath_of_parents_parent check"
  - file: tests/03_direct_and_absolute_rpath
    source: libtree-3.2.0-dev/tests/03_direct_and_absolute_rpath
    description: "Tests direct and absolute rpath resolution"
    command: "make -C tests/03_direct_and_absolute_rpath check"
  - file: tests/04_rpath_over_env_over_runpath
    source: libtree-3.2.0-dev/tests/04_rpath_over_env_over_runpath
    description: "Tests rpath priority over LD_LIBRARY_PATH over runpath"
    command: "make -C tests/04_rpath_over_env_over_runpath check"
  - file: tests/05_32_bits
    source: libtree-3.2.0-dev/tests/05_32_bits
    description: "Tests 32-bit vs 64-bit library resolution"
    command: "make -C tests/05_32_bits check"
  - file: tests/06_symbol_versions
    source: libtree-3.2.0-dev/tests/06_symbol_versions
    description: "Tests symbol version resolution"
    command: "make -C tests/06_symbol_versions check"
  - file: tests/07_origin_is_relative_to_symlink_location_not_realpath
    source: libtree-3.2.0-dev/tests/07_origin_is_relative_to_symlink_location_not_realpath
    description: "Tests $ORIGIN relative to symlink location"
    command: "make -C tests/07_origin_is_relative_to_symlink_location_not_realpath check"
  - file: tests/08_nodeflib
    source: libtree-3.2.0-dev/tests/08_nodeflib
    description: "Tests NODEFLIB flag behavior"
    command: "make -C tests/08_nodeflib check"
  - file: tests/10_rpath_order
    source: libtree-3.2.0-dev/tests/10_rpath_order
    description: "Tests rpath search order"
    command: "make -C tests/10_rpath_order check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: runs libtree --version and functional check"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
