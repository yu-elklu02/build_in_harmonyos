software: lldpd
# 版本级 manifest
# 文件位置: archives/l/lldpd/1.0.21/manifest.yaml

version: "1.0.21"
status: built
build_date: "2026-07-15"

source:
  url: "https://github.com/lldpd/lldpd/releases/download/1.0.21/lldpd-1.0.21.tar.gz"
  sha256: "d0a96e601f2d2a168dd168d5fc46de0ca83f6ad04638ee104d175e15511e1874"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-embedded-libevent"
    - "--disable-privsep"
    - "--disable-hardening"
    - "--without-readline"
    - "--without-snmp"
    - "--without-seccomp"
    - "--without-libbsd"
    - "--disable-doxygen-doc"
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "lldpd 内置 libevent 副本，--with-embedded-libevent 可零外部依赖编译，无需引入 conan libevent"
  - "liblldpctl 库本身不依赖 libevent，仅守护进程/客户端二进制依赖；故 test_package 可离线测试 liblldpctl 连接生命周期 API"
  - "lldpd 源码自带 config.guess 时间戳 2022-01-09，不识别 HarmonyOS/ohos，需在 build() 内联补丁（E007），容器内 uname=Linux 不触发，CI worker uname=HarmonyOS 触发"
  - "特权分离 (--disable-privsep) 默认开启需要 lldpd 用户/组与 chroot，OHOS 无此设施，故关闭"
  - "lldpctl_new(NULL,NULL,NULL) 仅分配连接并建立内部自管道，不立即连接 Unix 套接字（连接在 sync_send/sync_recv 实际发送时才建立），因此可在无运行中 lldpd 的环境下测试"
