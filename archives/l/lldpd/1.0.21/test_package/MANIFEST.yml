# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lldpd/1.0.21
homepage: "https://lldpd.github.io/"

# 上游测试命令 (lldpd 源码 tests/ 目录提供基于 libcheck 的单元测试)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：上游 make check 依赖 libcheck，且多数测试 (decode/check_*) 需要内部
# lldpd.h 结构与 PCAP 样本，不适合作为 Conan 消费者测试。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/)
upstream_tests:
  - file: tests/check_lldp.c
    source: lldpd-1.0.21/tests/check_lldp.c
    description: "LLDP 帧编/解码单元测试"
    command: "./check_lldp"
  - file: tests/check_cdp.c
    source: lldpd-1.0.21/tests/check_cdp.c
    description: "CDP 帧编/解码单元测试"
    command: "./check_cdp"
  - file: tests/check_fixedpoint.c
    source: lldpd-1.0.21/tests/check_fixedpoint.c
    description: "定点数运算单元测试"
    command: "./check_fixedpoint"
  - file: tests/check_marshal.c
    source: lldpd-1.0.21/tests/check_marshal.c
    description: "序列化/反序列化单元测试"
    command: "./check_marshal"

# test_package 中自带的测试 (消费者视角验证)
# test.c 离线调用 liblldpctl 公共 API（连接生命周期 + 错误处理），无需运行中的 lldpd
test_package_tests:
  - file: test.c
    description: "liblldpctl API 烟雾测试 (连接生命周期/错误处理，离线)"
    command: "./test_lldpd"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
