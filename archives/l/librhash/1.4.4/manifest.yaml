version: "1.4.4"
status: built
build_date: "2026-07-28"

source:
  url: "https://github.com/rhash/RHash/archive/refs/tags/v1.4.4.tar.gz"
  sha256: "8e7d1a8ccac0143c8fe9b68ebac67d485df119ea17a613f4038cda52f84ef52a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--cc=clang"
    - "--ar=llvm-ar"
    - "--enable-lib-shared"
    - "--disable-static"
    - "--disable-openssl"
  cc: clang
  cxx: ""

patches_applied:
  - "librhash/Makefile: 移除 SOLINK_TARGET 依赖（LIBRHASH_SO_MAJ == LIBRHASH_SHARED 时返回非零中断构建），构建期 sed 处理"

knowledge_gained:
  - "configure + make 构建共享库，--enable-lib-shared 仅构建 librhash 库"
  - "上游产物 librhash.so.1 需创建 librhash.so 符号链接供 CMake find_package 发现"
  - "OHOS 共享库需 llvm-objcopy 剥离 .codesign 段 + binary-sign-tool 自签名"
  - "签名工具路径从环境变量读取（LLVM_OBJCOPY/BINARY_SIGN_TOOL/LLVM_READELF），避免硬编码"
  - "构建并打包 rhash CLI，test_package 移植上游 tests/test_rhash.sh 断言（assertion_count=6）"
