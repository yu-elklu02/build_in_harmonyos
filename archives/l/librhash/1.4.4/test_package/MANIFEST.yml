# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: librhash/1.4.4
homepage: https://github.com/rhash/RHash

upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "librhash C API 直接测试：rhash_library_init/rhash_count/rhash_get_digest_size/rhash_msg/rhash_print_bytes/rhash_init/rhash_update/rhash_final/rhash_print/rhash_free，覆盖单哈希、多哈希组合上下文、摘要大小查询与格式化输出"
    command: "conan test"
  - file: test_rhash_cli.sh
    description: "rhash CLI smoke test: --message CRC32/MD5/SHA1/SHA256, empty-message MD5, --list-hashes（断言移植自上游 tests/test_rhash.sh）"
    command: "conan test"

# 测试断言总数（test.c 9 项 + test_rhash_cli.sh 7 项 = 16）
assertion_count: 16
