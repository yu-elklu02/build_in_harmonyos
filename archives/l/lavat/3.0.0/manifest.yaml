software: lavat
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# 构建系统
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/AngelJumbo/lavat/archive/refs/tags/v3.0.0.tar.gz"

  # 源码校验和
  sha256: "c5364203a75395953560b173fae90c316b753a046acb8f557c9e684eec6d76ba"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "lavat 是简单 Makefile 项目（非 autotools），无 configure 脚本，直接 make 编译"
- "简单 Makefile 项目需要补丁添加 DESTDIR 支持，符合 R20 DESTDIR 模式铁律"
- "DESTDIR 不可写入 manifest configure_options，会导致 G0 clean-verify 传入两个冲突的 DESTDIR 参数"
- "lavat 没有 make check/test 目标，属于 demo 类软件"
- "任务提供的源码 URL (angel-pazos/lavat) 不存在，实际仓库为 AngelJumbo/lavat"
- "许可证实际为 MIT（不是任务描述中的 GPL-2.0-or-later）"
- "lavat 不支持 --version 参数，是终端图形 demo 的设计特点"

