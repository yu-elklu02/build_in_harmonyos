# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lavat/3.0.0
homepage: "https://github.com/AngelJumbo/lavat"

# lavat is a demo application with no upstream test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: N/A
    source: N/A
    description: "lavat is a demo application with no upstream test suite"
    command: "N/A"

test_package_tests:
  - file: test.sh
    description: "Binary smoke test - verifies lavat -h prints usage"
    command: "bash test.sh"

assertion_count: 2
