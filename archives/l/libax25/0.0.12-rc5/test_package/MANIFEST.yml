# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libax25/0.0.12-rc5
homepage: "https://linux-ax25.in-berlin.de/wiki/Libax25"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libax25 has no test suite in the source tarball; make check returns 0 with no tests
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 libax25 API (ax25_aton_entry, ax25_ntoa, ax25_validate, strupr)"
    command: "./test_libax25"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
