# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: libevent/2.1.12
homepage: "https://libevent.org/"

# 上游测试情况：libevent 使用 Autotools，make check 运行 regress 测试套件
upstream_test_in_build: false
upstream_tests:
  - file: test/regress.c
    description: "libevent regress 测试套件（event/evbuffer/bufferevent 等）"
    command: "make check"

# test_package 自带测试（消费者视角：版本验证 + event_base 创建/释放）
test_package_tests:
  - file: test.c
    description: "libevent 版本验证 + event_base_new/free 基本功能测试"
    command: "./test_libevent"

assertion_count: 4
