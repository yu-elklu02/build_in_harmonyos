sources:
  url: "https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz"
  sha256: "f7e9383b8c0baa81b687e5b5eecc01beefaf1b19b64151d95ed61647fe7a315c"

patches:
  - patch_file: "patches/0001-cmake-ohos-unversioned-shared-libraries.patch"
    patch_description: "0001: Build real unversioned HarmonyOS shared libraries without symlinks"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-disable-poll-early-close-feature.patch"
    patch_description: "0002: Do not advertise POLLRDHUP early-close support on HarmonyOS poll"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-correct-epoll-early-close-feature.patch"
    patch_description: "0003: Report EPOLLRDHUP early-close capability only when HarmonyOS epoll implements it"
    patch_type: "portability"
  - patch_file: "patches/0004-backport-lock-address-reuse-test-fix.patch"
    patch_description: "0004: Backport upstream lock-tracer support for allocator address reuse"
    patch_type: "backport"
  - patch_file: "patches/0005-backport-test-tmpdir.patch"
    patch_description: "0005: Backport upstream TMPDIR support for regression test files"
    patch_type: "backport"
  - patch_file: "patches/0006-ohos-preserve-dns-emfile-semantics.patch"
    patch_description: "0006: Assert successful localhost lookup before HarmonyOS EMFILE socket failure"
    patch_type: "portability"
