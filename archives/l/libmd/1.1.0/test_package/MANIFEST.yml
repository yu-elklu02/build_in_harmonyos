# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmd/1.1.0
homepage: "https://libbsd.freedesktop.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libmd 上游用 Autotools 标准 `make check` 目标 (TESTS = check_PROGRAMS),
# 构建 + 执行 test/{md2,md4,md5,rmd160,sha1,sha2}.c 6 个测试程序,
# 每个含硬编码 hash 断言 (md2/md4/md5/rmd160/sha1/sha2 输出 vs 期望值).
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# build() 末尾跑 `make check -j1` 真调用上游 6 个测试程序 (非注释字面量).
# HMDFS noexec 用 try/except 捕获 noexec 相关错误 (PermissionError/OSError
# errno.EPERM) 并 warn, 其他异常重新抛出防静默吞编译失败.
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序 (make check 构建 + 执行的 6 个 test/*.c)
upstream_tests:
  - file: test/md2.c
    source: libmd-1.1.0/test/md2.c
    description: "MD2 hash test program with hardcoded assertions"
    command: "./test/md2"
  - file: test/md4.c
    source: libmd-1.1.0/test/md4.c
    description: "MD4 hash test program with hardcoded assertions"
    command: "./test/md4"
  - file: test/md5.c
    source: libmd-1.1.0/test/md5.c
    description: "MD5 hash test program with hardcoded assertions"
    command: "./test/md5"
  - file: test/rmd160.c
    source: libmd-1.1.0/test/rmd160.c
    description: "RIPEMD-160 hash test program with hardcoded assertions"
    command: "./test/rmd160"
  - file: test/sha1.c
    source: libmd-1.1.0/test/sha1.c
    description: "SHA-1 hash test program with hardcoded assertions"
    command: "./test/sha1"
  - file: test/sha2.c
    source: libmd-1.1.0/test/sha2.c
    description: "SHA-2 (SHA-224/256/384/512) hash test program with hardcoded assertions"
    command: "./test/sha2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 libmd 头文件和链接 (消费者场景)"
    command: "./test_libmd"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 6 个测试程序 (每个含多组硬编码 hash 断言) + test_package 1 个链接验证
assertion_count: 7
