test_package:
  type: consumer
  language: c
  requires:
    - luafilesystem/1.8.0-1
    - lua/5.4.8.1
  entrypoint: test_luafilesystem.c
  checks:
    - require lfs through LUA_CPATH
    - verify current directory attributes
    - iterate current directory entries
    - recipe build runs adapted upstream tests/test.lua with TMPDIR and hardlink capability guard
