software: lld
display: "LLD"
description: "LLVM project high-performance linker"
category: build-tool
homepage: "https://lld.llvm.org/"
license: Apache-2.0 WITH LLVM-exception
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build from the official llvm-project monorepo with only the lld project enabled"
    - "Disable optional third-party integrations so the recipe has no unpublished Conan dependencies"
    - "Package command aliases as real files because HMDFS symbolic links are unreliable"
    - "Run the complete check-lld entry point with exact OHOS XFAILs; tests requiring unbuilt backends remain unsupported"
    - "Replace an early-closing grep assertion with FileCheck to keep the dead-strip test deterministic on OHOS"
  common_dependencies: []

versions:
  "20.1.8":
    status: built
    build_date: "2026-08-02"
    conan_ref: "lld/20.1.8"
