conan_ref: lld/20.1.8
source:
  url: https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz
  sha256: 6898f963c8e938981e6c4a302e83ec5beb4630147c7311183cf61069af16333d
  tar_format: tar.xz
build:
  system: cmake
  configure_options:
  - -DBUILD_SHARED_LIBS=OFF
  - -DLLVM_ENABLE_PROJECTS=lld
  - -DLLVM_TARGETS_TO_BUILD=AArch64
  - -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-ohos
  - -DLLVM_INCLUDE_TESTS=ON
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
- 0001-llvm-cmake-config-guess-harmonyos.patch
- 0002-llvm-handle-options-harmonyos.patch
- 0003-lld-dead-strip-avoid-early-pipe-close.patch
knowledge_gained:
  - "Package lld command aliases as regular files to avoid HMDFS symbolic-link behavior (ref:E050)"
  - "Use a pre-created HOME/tmp directory and bypass config.guess umask 077 on HMDFS (ref:E011)"
  - "Teach LLVM config.guess to map aarch64 HarmonyOS to aarch64-unknown-linux-ohos (ref:E007)"
  - "Classify CMAKE_SYSTEM_NAME=HarmonyOS as a Unix platform in HandleLLVMOptions (ref:L3)"
  - "Run the upstream check-lld target as part of conan create (ref:L3)"
  - "Set LIT_PRESERVES_TMP so lit does not create an inaccessible 0700 HMDFS temporary directory (ref:E011)"
  - "Validate LLD PAX reproduction archives with Python tarfile and require response.txt (ref:L3)"
  - "Use FileCheck for the dead-strip PAGEZERO assertion to avoid grep -q broken-pipe exit 74 (ref:L3)"
  - "Limit LLVM code generation backends to AArch64 for the OHOS armv8 package (ref:L3)"
  - "Use Ninja and optional ccache compiler launchers for clean CI builds (ref:L3)"
  - "Use exact LIT_XFAIL paths for known OHOS filesystem limitations without disabling check-lld (ref:E046)"
  - "Cap concurrent links (LLVM_PARALLEL_LINK_JOBS=2) to keep the check-lld test-tool build within CI worker RAM; unbounded parallel links OOM-kill conan create silently after lit passes (ref:L3)"
  - "Keep full compile parallelism (tools.build:jobs=20) — capping to -j8 pushed the build past the 2700s CI timeout; LLVM_PARALLEL_LINK_JOBS=2 alone caps link memory without slowing the build (ref:L3)"
verification:
  result: passed
  reason: Clean OHOS AArch64 CI passed conan create, check-lld (444 PASS, 2597 UNSUPPORTED,
    1 XFAIL, 0 FAIL), reproduction validation, packaging, test_package, and L0/L1/L2/L4/L5
