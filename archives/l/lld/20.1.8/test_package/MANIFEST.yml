package: lld/20.1.8
homepage: "https://lld.llvm.org/"

upstream_check_command: "cmake --build build --target check-lld"
upstream_test_in_build: true
upstream_test_command: "cmake.build(target=check-lld)"

upstream_tests:
  - file: "lld/test"
    source: "llvm-project-20.1.8.src/lld/test"
    description: "Complete upstream LLD lit regression suite"
    command: "check-lld"

upstream_test_exemptions:
  - file: "COFF/lto-cache-errors.ll"
    status: "xfail"
    reason: "Requires chmod to make an LTO cache directory unwritable; HMDFS does not enforce that permission transition"
  - file: "COFF/thinlto-emit-imports.ll"
    status: "xfail"
    reason: "Requires chmod to make an imports file unwritable; HMDFS does not produce the expected EACCES"
  - file: "ELF/lto/resolution-err.ll"
    status: "xfail"
    reason: "Requires chmod to make the resolution output unwritable; HMDFS does not produce the expected EACCES"
  - file: "ELF/lto/thinlto-cant-write-index.ll"
    status: "xfail"
    reason: "Requires chmod to make the ThinLTO index unwritable; HMDFS does not produce the expected EACCES"
  - file: "ELF/lto/thinlto-emit-imports.ll"
    status: "xfail"
    reason: "Requires chmod to make an imports file unwritable; HMDFS does not produce the expected EACCES"
  - file: "MachO/invalid/invalid-lto-object-path.ll"
    status: "xfail"
    reason: "Requires chmod to make an object-path directory unwritable; HMDFS does not produce the expected failure"
  - file: "MachO/lto-object-path.ll"
    status: "xfail"
    reason: "Checks for a cache hard link count of two, while HMDFS stores the fallback copy with link count one"
  - file: "MachO/thinlto-emit-imports.ll"
    status: "xfail"
    reason: "Requires chmod to make an imports file unwritable; HMDFS does not produce the expected EACCES"

upstream_test_adjustments:
  - file: "MachO/dead-strip.s"
    change: "Replace grep -q with FileCheck for the __PAGEZERO assertion"
    reason: "grep -q closes the pipe after a match, causing llvm-otool to return IO error 74 under OHOS lit pipefail semantics"

test_package_tests:
  - file: "CMakeLists.txt"
    description: "Validate the absolute packaged ld.lld path and force it during linking"
    command: "cmake configure and build"
  - file: "test_lld.c"
    description: "Run an executable linked by the packaged ld.lld driver"
    command: "./test_lld"
  - file: "conanfile.py"
    description: "Execute all five packaged LLD driver commands"
    command: "conan test"

assertion_count: 8
