  - "0002-cmake-minimum-version-3.5.patch"
  - "0003-cmake-boost-compat-include.patch"
  - "0004-cmake-cxx-standard-17.patch"
  - "0005-gtest-port-tmpdir-env.patch"

test_results:
  type: upstream
  command: "build/tests"
  expected_upstream_tests: 14
  passed: 0
  failed: 0
  note: "Recipe created; OHOS conan create validation pending."

knowledge_gained:
  - "The v0.17 archive leaves Eigen and GoogleTest submodules empty; source() supplies pinned release archives."
  - "OHOS CPU-only builds must skip the upstream REQUIRED OpenCL discovery and link step."
  - "CMake 4.x requires cmake_minimum_required >= 3.5 for this project."
  - "Boost 1.90.0.1.1 binary in ohpcd may miss Boost.Format headers; leela-zero overlays pinned Boost.Format and Boost.Spirit headers to avoid rebuilding the large Boost source package."
