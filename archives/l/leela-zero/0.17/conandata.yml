patches:
  - patch_file: "patches/0001-cpu-only-no-opencl.patch"
    patch_description: "Allow CPU-only builds without an OpenCL runtime"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-minimum-version-3.5.patch"
    patch_description: "Raise cmake_minimum_required for CMake 4 compatibility"
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-boost-compat-include.patch"
    patch_description: "Allow recipe-provided Boost header overlay before Conan Boost includes"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-cxx-standard-17.patch"
    patch_description: "Bump CMAKE_CXX_STANDARD from 14 to 17 for std::optional in Boost.Spirit overlay"
    patch_type: "portability"
  - patch_file: "patches/0005-gtest-port-tmpdir-env.patch"
    patch_description: "Read TMPDIR env var for gtest captured-stream temp files (OHOS ships read-only /tmp)"
    patch_type: "portability"
