# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.3"

# 软件名
software: "libxxhash"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.3.tar.gz"

  # 源码校验和
  sha256: "aae608dfe8213dfd05d909a57718ef82f30722c392344583d3f39050c7f29a80"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DXXHASH_BUILD_XXHSUM=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "xxHash 0.8.3 CMake build (cmake_unofficial/) works on HarmonyOS without patches"
  - "CMake detects aarch64 + NEON automatically"
  - "49,948 sanity tests pass via make check"
