# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: libxxhash/0.8.3
homepage: "https://github.com/Cyan4973/xxHash"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests integrated in build()
upstream_test_in_build: false
upstream_test_command: "make check"

# Upstream test programs
upstream_tests:
  - file: cli/xsum_sanity_check.c
    source: libxxhash-0.8.3/cli/xsum_sanity_check.c
    description: "Sanity check with 49948 test vectors"
    command: "./xxhsum --sanity"

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "Consumer test: XXH64 one-shot, streaming, XXH32, seed variation"
    command: "./test_libxxhash"

# Approximate assertion count
assertion_count: 7
