# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: luasql/2.4.0
homepage: "https://github.com/lunarmodules/luasql"

# 上游测试命令
upstream_check_command: "make sqlite3 && lua tests/test.lua"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.lua
    source: luasql-2.4.0/tests/test.lua
    description: "LuaSQL upstream test suite (requires database drivers)"
    command: "lua tests/test.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_luasql.lua
    description: "SQLite3 driver CRUD operations test (create table, insert, query, update, delete)"
    command: "lua test_luasql.lua"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
