# 软件级 manifest
# 文件位置: archives/l/luasql/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: luasql
display: "LuaSQL"
description: "LuaSQL is a simple interface from Lua to a DBMS"
category: db
homepage: "https://github.com/lunarmodules/luasql"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "Lua extension modules require explicit -llua linking on OHOS (no dynamic symbol export)"
    - "config file needs manual modification (PREFIX, LUA_SYS_VER, LUA_INC paths)"
    - "SQLite3 configure fails on OHOS — use amalgamation direct compile instead"
    - "Lua 'make linux' target works on HarmonyOS"
  common_dependencies:
    - lua
    - sqlite3

versions:
  "2.3.5":
    status: built
    build_date: "2026-06-10"
  "2.4.0":
    status: published
    build_date: "2026-07-15"
