package: libgcrypt/1.12.2
homepage: "https://gnupg.org/software/libgcrypt/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: tests/Makefile.am
    source: libgcrypt-1.12.2/tests/Makefile.am
    description: "Official Automake regression suite; final enabled inventory is recorded from the device test log"
    command: "make check"
test_package_tests:
  - file: test.c
    description: "15 independent installed-library API commands"
    cases:
      - version
      - sha256
      - sha512
      - sha3-256
      - hmac-sha256
      - cmac-aes
      - aes128-ecb-encrypt
      - aes128-ecb-decrypt
      - aes256-cbc
      - chacha20
      - pbkdf2-sha256
      - mpi-add
      - mpi-mod
      - sexp
      - nonce
    command: "./libgcrypt_consumer <case>"
test_flow_count: 15
assertion_count: 19
