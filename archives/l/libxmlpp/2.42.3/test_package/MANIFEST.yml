# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libxmlpp/2.42.3
homepage: "https://libxmlplusplus.github.io/libxml++/"

# 上游 meson 测试套件已启用：conanfile.py 设置 build-tests=true，上游 3 个
# saxparser_* 测试随构建编译，非交叉编译时在 build() 中执行 meson test
# （cross_building 守卫；meson test 注入依赖 libdir 解决 libglib 的 gettext 符号）。
# 本地 CI 实测 3/3 通过。test_package 另承担消费者视角验证。
upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests: []

# test_package 中自带的测试（消费者视角验证 2.6 API）。
# ⚠️ 2.42.3 无 Document::parse_file 静态工厂（5.x 才有）；2.6 解析入口是
# DomParser::parse_file/parse_memory，Document 由 Parser 持有。
test_package_tests:
  - file: test_libxmlpp.cpp
    description: "libxml++ 2.6 API 验证: DomParser::parse_file + get_document + get_root_node + 属性/NodeList 子节点遍历 + parse_memory"
    command: "./test_libxmlpp"

# 测试断言总数 (近似值)
assertion_count: 7
