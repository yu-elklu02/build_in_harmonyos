software: libxmlpp
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.42.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.42.3"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-02"

# Conan 引用
conan_ref: "libxmlpp/2.42.3@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致）
  url: "https://download.gnome.org/sources/libxml++/2.42/libxml++-2.42.3.tar.xz"
  # 源码校验和（GNOME 官方 sha256sum）
  sha256: "74b95302e24dbebc56e97048e86ad0a4121fc82a43e58d381fbe1d380e8eba04"
  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  cc: clang
  cxx: clang++
  # Conan 依赖（与 conanfile.py requirements() 一致，无 user/channel）
  dependencies:
    - "glibmm/2.66.9 (glibmm-2.4，libxml++ 2.x 专用依赖；版本裁决见 notes.md)"
    - "libxml2/2.15.3 (ohpcd conan 配方，PkgConfigDeps 生成 libxml-2.0.pc；不再依赖 cmd-pkgs 系统包)"

# ============================================================
# 补丁清单
# ============================================================

patches_applied: []

# ============================================================
# 知识经验
# ============================================================

knowledge_gained:
  - "版本裁决：synfig 1.5.5 探测 pc 名 libxml++-2.6，只与 2.x 旧 API 线兼容；2.x 线官方最新为 2.42.3（不存在 2.46 线）；5.x 是 NEW-API 线不满足"
  - "libxml2 已 conan 化（ohpcd libxml2/2.15.3 配方，PkgConfigDeps 生成 libxml-2.0.pc）；原 cmd-pkgs 系统包方案（shared、无静态 libxml2.a，E076 静态化前提不成立）已废弃"

# ============================================================
# 角色说明（2026-08-03 更新）
# ============================================================

role: "synfig 依赖项"
note: "作为 synfig 1.5.5 的依赖项随 PR 提交（synfig-core 探测 libxml++-2.6.pc REQUIRED），由 CI 从源码构建；不依赖制品仓预发布"
