package: lcms1/1.19
homepage: "https://www.littlecms.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: testbed/testcms.c
    source: lcms-1.19/testbed/testcms.c
    description: "Little CMS 1.x testbed。main() 实际调用 26 个测试函数：CheckEndianess、CheckSwab、CheckQuickFloor、TestFixedPoint、TestFixedScaling、TestJointCurves、TestReversingOfCurves、TestLinearInterpolation、TestReverseLinearInterpolation、Test3D、TestMatrixCreation、GetInfoTest、Test_sRGB、RealProfilesTest、TestInducedError、TestPreview、TestMultiprofile、TestLinearizationDevicelink、TestDeviceLinkGeneration、TestLinearizationDevicelink2、TestInkLimiting、TestSaveToMem、TestNamedColor、TestIT8、TestPostScript、TestColorantTableTag"
    command: "./testcms"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: create sRGB/Lab profiles, verify colorspace/device class, run RGB->Lab transform"
    command: "./test_lcms1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26
