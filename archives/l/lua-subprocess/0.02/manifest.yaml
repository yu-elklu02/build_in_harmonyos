software: lua-subprocess
version: "0.02"
status: published
build_date: "2026-08-07"
build_system: makefile

source:
  url: "https://github.com/xlq/lua-subprocess/archive/b5f84612acb625a0b564aa50f18614180a2a404e.tar.gz"
  sha256: "bbd4c50eb76c5f3633a4dfc62de896a79afd41599227f52563a734029434ea45"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
  dependencies:
    - lua/5.4.8
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "lua-subprocess is a Lua C extension module, not a standalone library"
  - "The .so is NOT linked against liblua.a — symbols resolved at runtime via dlopen"
  - "API uses subprocess.popen, not subprocess.spawn"
  - "Options (stdout, stdin, etc.) must be in the same table as positional args"
