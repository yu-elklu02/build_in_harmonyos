# test_package/MANIFEST.yml
# Upstream test declaration
# CI script (build_and_test.sh L0e) requires this file

package: lua-subprocess/0.02
homepage: "https://github.com/xlq/lua-subprocess"

# lua-subprocess has no built-in test suite in the Makefile
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (none — lua-subprocess Makefile has no check target)
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_subprocess.c
    description: "Embeds Lua, loads subprocess module, spawns 'echo', verifies output"
    command: "./test_subprocess"

# Approximate assertion count
assertion_count: 2
