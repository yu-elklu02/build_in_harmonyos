software: lua-subprocess
display: "Lua Subprocess"
description: "Lua C extension module for spawning subprocesses and managing I/O"
category: system
homepage: "https://github.com/xlq/lua-subprocess"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile build, compiles subprocess.c + liolib-copy.c into subprocess.so"
    - "Shared Lua C module, not linked against liblua.a (symbols resolved at runtime)"
    - "Conan recipe depends on lua/5.4.8"
  common_dependencies:
    - lua/5.4.8

versions:
  "0.02":
    status: published
    build_date: "2026-08-07"
