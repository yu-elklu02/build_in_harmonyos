package: libx11/6.4.0
homepage: "https://gitlab.freedesktop.org/xorg/lib/libx11"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: "nls/compose-check.pl"
    source: "libX11-1.8.10/nls/compose-check.pl"
    description: "Validate generated X11 compose locale mappings."
    command: "make -C nls check"

test_package_tests:
  - file: "test.c"
    description: "Compiles and runs a consumer using Xlib, Xresource, XKBlib, and Xlib-xcb entry points without opening a display."
    command: "./libx11_consumer"

assertion_count: 5
