package: libx11/1.8.13
homepage: "https://gitlab.freedesktop.org/xorg/lib/libx11"

# Upstream ships:
#   1. nls/compose-check.pl — a Perl test script that validates the
#      Compose/Compose.dir locale data files. Gated by HAVE_PERL.
#      Runs as part of `make check` in the nls/ subdirectory.
#      PASS confirmed in our log.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: "compose-check.pl"
    file: "nls/compose-check.pl"
    description: "Perl test script validating Compose/Compose.dir locale data files. Runs as part of `make check` in nls/ subdirectory. PASS confirmed on OHOS aarch64."
    source_dir: "nls"
    expected_assertions: 1   # exit 0 / non-zero

test_package_tests:
  - file: test.c
    description: |
      Link libX11 and exercise the public X11 client-side API: XOpenDisplay
      on an unreachable display (must return NULL), XDisplayName lookup
      (must return non-NULL), XSetIOErrorHandler/XSetErrorHandler callback
      registration, XFree(NULL) safety, and X_PROTOCOL constant check.
    command: "test_libx11"

assertion_count: 6
