# 软件级 manifest - libvpx
# 文件位置: archives/l/libvpx/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

name: libvpx
description: VP8/VP9 video codec library - 开源视频编解码库，用于 WebM/WebRTC
category: multimedia

# 版本索引
versions:
  - version: "1.16.0"
    status: built
    build_date: "2026-07-25"
    packaging: conan
    notes: "conan 配方（os=OHOS armv8），真机原生 conan create 通过；消费方 FFmpeg --enable-libvpx（内建只有 VP8/VP9 解码，编码需外接）；test_package 做真实 VP8 编码"
    provides:
      - "libvpx.so.12"
  - version: "1.14.1"
    status: built
    build_date: "2026-05-29"
    notes: "G0 验证失败，需要环境 hints"

# 软件级元数据
metadata:
  homepage: "https://www.webmproject.org/"
  repository: "https://github.com/webmproject/libvpx"
  license: "BSD-3-Clause"
  
  # 构建特性
  build_system: custom  # libvpx 使用自定义 configure 脚本
  supports_shared: true   # 1.16.0 conan 配方产 libvpx.so.12（--enable-shared）
  supports_static: true
  
  # 编译器支持
  compilers:
    - clang
    - gcc

  # 目标平台
  targets:
    - arm64-linux-gcc
    - arm64-darwin-gcc
    - x86_64-linux-gcc

# 环境依赖（编译前必须设置）
environment_hints:
  required:
    - "LD_LIBRARY_PATH 包含 ohos-sdk llvm/lib 路径"
  optional:
    - "diff 工具（用于 configure）"
  hint_file: "hints/environment.sh"

# API 稳定性
api_stability: stable
abi_stability: stable  # 静态库无 ABI 问题