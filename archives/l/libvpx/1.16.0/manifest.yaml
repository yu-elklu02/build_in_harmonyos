version: '1.16.0'
status: built
build_date: '2026-07-25'

source:
  url: 'https://github.com/webmproject/libvpx/archive/refs/tags/v1.16.0.tar.gz'
  sha256: '7a479a3c66b9f5d5542a4c6a1b7d3768a983b1e5c14c60a9396edc9b649e015c'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--target=arm64-linux-gcc'
    - '--enable-shared'
    - '--disable-static'
    - '--enable-pic'
    - '--enable-vp8'
    - '--enable-vp9'
    - '--enable-multithread'
    - '--disable-examples'
    - '--disable-tools'
    - '--disable-docs'
    - '--disable-install-docs'
    - '--disable-unit-tests'
  dependencies: []
  cc: clang

patches_applied: []

verification:
  device: 'HarmonyOS PC (3QC0124C11000718)'
  result: 'conan create rc=0, 31s, 2.1M'
  soname: 'libvpx.so.12'
  test: 'vpx_codec_enc_config_default -> enc_init -> img_alloc -> encode 320x240 + flush -> CX_FRAME_PKT 379 bytes'

knowledge_gained:
  - 'libvpx 的 configure 是手写 shell 脚本（无 configure.ac），与 FFmpeg 同类：只认 --prefix/--libdir/--target=，连 --includedir 都没有，未知选项 die_unknown 退出 → 不能用 AutotoolsToolchain'
  - 'configure:195 按裸名调 diff（:199 调 perl），conan self.run 走 /bin/sh 时 PATH 可能不含 /data/service/hnp/bin → 报 "diff missing" 但设备上 diff 其实存在（GNU diffutils 3.10），须把 hnp bin 前置进 PATH'
  - 'build/make/configure.sh:745 是 CC=${CC:-${CROSS}gcc}；--target=arm64-linux-gcc 会让 CROSS 默认为 aarch64-linux-gnu- 前缀，须置 CROSS="" 并导出 CC/AR/NM 等全路径'
  - 'API 约束：每次 vpx_codec_encode 后须立刻 drain（迭代器只覆盖本次调用）；VP8 默认 g_lag_in_frames=25 会缓冲单帧，测试须置 0'
  - '版本取 1.16.0（最新正式 tag），不取 v1.17.0-rc1'
