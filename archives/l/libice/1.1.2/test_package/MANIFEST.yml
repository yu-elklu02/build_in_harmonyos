package: "libice/1.1.2"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libice"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The top-level Makefile.am declares only SUBDIRS=doc specs src. The source
  Makefiles declare no TESTS, check_PROGRAMS, check-local, or custom test
  target, so the generated Automake check target contains zero test entries.

test_package_tests:
  - id: "authority-file-round-trip"
    source: "auth_roundtrip.c"
    command: "libice_auth_roundtrip"
    description: >-
      Write and read one complete IceAuthFileEntry through the public API,
      compare every field, require EOF termination, and clean the file.
  - id: "public-api-contract"
    source: "api_contract.c"
    command: "libice_api_contract"
    description: >-
      Verify ICEAUTHORITY path resolution, generate a nonzero 32-byte magic
      cookie, round-trip error-handler registration, and exercise NULL-safe
      cleanup.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 18
