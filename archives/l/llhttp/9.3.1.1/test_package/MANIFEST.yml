# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: llhttp/9.3.1
homepage: "https://github.com/nodejs/llhttp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# llhttp has no built-in test suite; tests are part of Node.js
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libllhttp.so，覆盖 GET 基础解析、PATCH 方法识别、错误原因获取、pause/resume 状态（21 项断言）"
    command: "./test_llhttp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 21
