# conandata.yml — libde265 1.0.18
# Source: official GitHub release tarball (R39: official source).
# sha256 computed from the release artifact.

sources:
  url: "https://github.com/strukturag/libde265/releases/download/v1.0.18/libde265-1.0.18.tar.gz"
  sha256: "800478f3bf35f0621b14928ceb317579f3e8b23de4bd2aac29b6cb8be962bbd8"

# Platform adaptation patches (W2: every patch under patches/ is declared
# here; conanfile.py build() calls apply_conandata_patches() to apply them).
# - 0001: disables ARMv7-A assembly on aarch64 (incompatible; crashes the
#   assembler). Complements the HAVE_NEON=FALSE cache variable set in
#   generate() by also turning off ENABLE_ARM on ARM64.
# - 0002: explicitly links the C++ runtime (libc++ or libstdc++) for dec265,
#   which is required on musl/libc++-based systems (e.g. OHOS) where the
#   default toolchain does not implicitly link the C++ standard library.
patches:
  - patch_file: "patches/0001-arm64-platform.patch"
    patch_description: "Detect aarch64 platform in top-level CMakeLists.txt and disable ARM (ARMv7-A) assembly optimization, which is invalid on aarch64"
    patch_type: "portability"
  - patch_file: "patches/0002-libcpp-link.patch"
    patch_description: "Explicitly link the C++ standard library (libc++ or libstdc++) for dec265 CLI to avoid 'symbol not found' runtime errors on libc++/musl-based systems"
    patch_type: "portability"
