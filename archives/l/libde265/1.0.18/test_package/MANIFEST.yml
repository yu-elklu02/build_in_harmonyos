# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libde265/1.0.18
homepage: "https://github.com/strukturag/libde265"

# 上游测试命令 (libde265 uses CMake; no `make check` target ships in the
# release tarball — dec265 is a CLI tool, not a test harness).
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# The 1.0.18 release tarball contains no dedicated unit-test sources; the
# dec265 CLI (dec265/dec265.cc) is the primary build artifact exercised at
# runtime. No automated upstream test suite is present.
upstream_tests:
  - file: dec265/dec265.cc
    source: libde265-1.0.18/dec265/dec265.cc
    description: "dec265 H.265 decoder CLI (built as a binary, no assertion test)"
    command: "./dec265"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 de265_new_decoder/de265_get_version/de265_flush_data/de265_decode/de265_get_next_picture/de265_free_decoder 验证解码器 API"
    command: "./test_libde265"

# 测试断言总数 (近似值, 用于质量评估)
# test.c: version string check + new_decoder NULL check + flush_data check +
#         get_next_picture NULL check + free_decoder check = 5 assertions
assertion_count: 5
