# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libevdev/1.13.3
homepage: "https://www.freedesktop.org/wiki/Software/libevdev/"

# 上游测试命令 (meson test --list)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libevdev 上游测试需要 /dev/input 设备，在 HarmonyOS 构建机上无法运行
# 因此 test_package 仅验证 API 可调用性
upstream_tests:
  - file: test/test-event-codes.c
    source: libevdev-1.13.3/test/test-event-codes.c
    description: "上游事件码测试（需要 /dev/input，构建机跳过）"
    command: "./test-event-codes"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 libevdev API 可用性: libevdev_event_type_get_name, libevdev_event_code_get_name, libevdev_new/free"
    command: "./test_libevdev"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
