# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: lha/1.14.20211125
homepage: "https://github.com/jca02266/lha"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests are shell-based test scripts run via tests/lha-test.in
upstream_test_in_build: false
upstream_test_command: "cd tests && ./lha-test"

# Upstream actual test programs
upstream_tests:
  - file: tests/lha-test.in
    source: lha-1.14.20211125/tests/lha-test.in
    description: "Main test runner script (autoconf-templated)"
    command: "cd tests && ./lha-test"
  - file: tests/lha-test1
    source: lha-1.14.20211125/tests/lha-test1
    description: "Create test data — prerequisite for all other tests"
    command: "sourced by lha-test.in"
  - file: tests/lha-test2
    source: lha-1.14.20211125/tests/lha-test2
    description: "Basic archive creation and extraction"
    command: "sourced by lha-test.in"
  - file: tests/lha-test14
    source: lha-1.14.20211125/tests/lha-test14
    description: "Symbolic link handling"
    command: "sourced by lha-test.in"
  - file: tests/lha-test16
    source: lha-1.14.20211125/tests/lha-test16
    description: "Level 0/1/2/g header extraction"
    command: "sourced by lha-test.in"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Verifies lha binary is installed and reports version"
    command: "lha --version"

# Test assertion count (approximate)
assertion_count: 15
