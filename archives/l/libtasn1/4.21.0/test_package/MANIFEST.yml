package: libtasn1/4.21.0
homepage: "https://www.gnu.org/software/libtasn1/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/version.c
    source: libtasn1-4.21.0/tests/version.c
    description: "Version check test"
    command: "./version"
  - file: tests/decoding.sh
    source: libtasn1-4.21.0/tests/decoding.sh
    description: "ASN.1 decoding test"
    command: "./decoding.sh"
  - file: tests/coding.sh
    source: libtasn1-4.21.0/tests/coding.sh
    description: "ASN.1 coding test"
    command: "./coding.sh"

test_package_tests:
  - file: test.c
    description: "Consumer test: verify libtasn1 version via asn1_check_version API"
    command: "./test_libtasn1"

assertion_count: 3
