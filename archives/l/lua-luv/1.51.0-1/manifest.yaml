software: lua-luv
version: "1.51.0-1"
status: built
build_date: "2026-07-29"
build_system: cmake

source:
  url: "https://codeload.github.com/luvit/luv/tar.gz/refs/tags/1.51.0-1"
  sha256: "d4a11178ae8e16ba5886799ea91905dd9b0b479c75aebd67866d37373e41526f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DWITH_LUA_ENGINE=Lua"
    - "-DLUA_BUILD_TYPE=System"
    - "-DWITH_SHARED_LIBUV=ON"
    - "-DBUILD_MODULE=ON"
    - "-DBUILD_STATIC_LIBS=ON"
  dependencies:
    - "lua/5.4.8"
    - "libuv/1.52.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-link-system-lua-on-ohos.patch"

knowledge_gained:
  - "Use the already adapted Lua and libuv Conan packages instead of luv's bundled submodules."
