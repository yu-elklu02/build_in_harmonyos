package: lua-luv/1.51.0-1
homepage: "https://github.com/luvit/luv"

upstream_test_in_build: true
upstream_test_command: "./test run_ohos_tests.lua && ./test tests/manual-test-external-loop.lua"
upstream_tests:
  - file: tests/test-*.lua
    source: luv-1.51.0-1/tests
    description: "Runs 19 of 22 upstream Lua test scripts; loop callback-count, pipe socket, and UDP recvmmsg scripts are skipped for documented OHOS host limitations."
    command: "./test run_ohos_tests.lua"
  - file: src/test.c
    source: luv-1.51.0-1/src/test.c
    description: "Upstream C test driver exercising luv with an external libuv loop."
    command: "./test tests/manual-test-external-loop.lua"

test_package_tests:
  - file: test.c
    description: "Loads luv.so and verifies version and timer APIs through Lua."
    command: "./test_lua_luv <package>/lib/lua/5.4/luv.so"

assertion_count: 4
