# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzfse/1.0
homepage: "https://github.com/lzfse/lzfse"

# 上游测试命令 (CMake/CTest)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# lzfse uses CMake CTest with round-trip tests on all source files
upstream_tests:
  - file: tests/round-trip.cmake
    source: lzfse-1.0/tests/round-trip.cmake
    description: "Round-trip compression/decompression test via CMake script"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: lzfse_encode_buffer + lzfse_decode_buffer round-trip"
    command: "./test_lzfse"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
