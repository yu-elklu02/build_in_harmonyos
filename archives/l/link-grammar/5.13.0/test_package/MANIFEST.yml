package: link-grammar/5.13.0
homepage: https://opencog.github.io/link-grammar-website/

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: tests/dict-reopen.cc
    description: "Repeated dictionary open and close lifecycle"
    command: "tests/dict-reopen"
  - file: tests/multi-dict.cc
    description: "Concurrent use of multiple dictionaries"
    command: "tests/multi-dict"
  - file: tests/multi-thread.cc
    description: "Multi-threaded parsing"
    command: "tests/multi-thread"
  - file: tests/mem-leak.cc
    description: "Parser lifecycle and memory cleanup"
    command: "tests/mem-leak"

test_package_tests:
  - file: test.cpp
    description: "Version, dictionary loading, sentence parsing, and linkage consumer test"
    command: "test_link_grammar <package>/share/link-grammar"
  - file: conanfile.py
    description: "Packaged link-parser version and English sentence parsing tests"
    command: "<package>/bin/link-parser --version; link-parser <package>/share/link-grammar/en -!batch"

assertion_count: 12
