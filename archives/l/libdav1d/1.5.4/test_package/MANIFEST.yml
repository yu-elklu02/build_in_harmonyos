# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: libdav1d/1.5.4
homepage: "https://code.videolan.org/videolan/dav1d"

upstream_check_command: "meson test -v"
upstream_test_in_build: true
upstream_test_command: "meson test -v"

upstream_tests:
  - file: "tests/header_test.c"
    source: "dav1d-1.5.4/tests/header_test.c"
    description: "Meson header API tests for common.h, data.h, dav1d.h, headers.h, picture.h, and version.h"
    command: "meson test -v"
  - file: "tests/checkasm/*"
    source: "dav1d-1.5.4/tests/checkasm"
    description: "checkasm suite identified but not executed for the C-only package profile; it requires enable_asm=true and the external checkasm wrap dependency"
    command: "meson test checkasm"
  - file: "tests/dav1d-test-data"
    source: "external dav1d-test-data repository"
    description: "testdata suite identified but not executed because the release archive does not vendor the data repository"
    command: "meson test with -Dtestdata_tests=true"

test_package_tests:
  - file: test_package.c
    description: "Consumer test: include dav1d/dav1d.h, link libdav1d, and call dav1d_version()"
    command: "./test_package"

assertion_count: 7
