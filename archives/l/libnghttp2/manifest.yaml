software: libnghttp2
display: "libnghttp2"
description: "HTTP/2 C library with HPACK compressor/decompressor"
category: network
homepage: "https://nghttp2.org"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Autotools 构建在 HMDFS 上存在临时文件创建问题，推荐使用 CMake"
    - "需要替换 config.guess/config.sub 为支持 HarmonyOS 的版本"
  common_dependencies: []

versions:
  "1.69.0":
    status: built
    build_date: "2026-05-20"
  "1.70.0":
    packaging: conan
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个 conan 配方（原 1.69.0 条目是手工构建时代的文档记录，无 conanfile.py）。
      未打补丁，ENABLE_LIB_ONLY=ON 只产库、不带上游命令行工具与示例。
      真机 conan create 通过；test_package 跑 HPACK 压缩/解压往返，断言 3 条头部逐字节还原，
      并要求同组头部第二次压缩更短（31→14 字节）以证明动态表真的在工作 —— 只压一遍看不出这一点。
