software: libxsmm
version: "1.17"
build_system: makefile
status: built
build_date: "2026-07-29"
source:
  url: "https://codeload.github.com/libxsmm/libxsmm/tar.gz/refs/tags/1.17"
  sha256: "8b642127880e92e8a75400125307724635ecdf4020ca4481e5efe7640451bb92"
  tar_format: tar.gz
build:
  system: makefile
  configuration: "armv8 fallback, static, JIT disabled, BLAS disabled, Fortran disabled"
  configure_options:
    - "PLATFORM=1"
    - "JIT=0"
    - "BLAS=0"
    - "STATIC=1"
    - "FC="
    - "COMPATIBLE=1"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-support-ohos-toybox-build-tools.patch"
knowledge_gained:
  - "LIBXSMM 1.17 requires Intel-compatible CPUs by default; PLATFORM=1 enables its documented generic fallback path."
  - "The generic OpenHarmony armv8 package disables LIBXSMM JIT and BLAS-dependent functionality."
  - "OpenHarmony armv8 uses the upstream clock_gettime timer fallback instead of the x86-only RDTSC path."
