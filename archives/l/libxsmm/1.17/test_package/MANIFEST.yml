package: libxsmm/1.17
homepage: "https://github.com/libxsmm/libxsmm"

upstream_test_in_build: true
upstream_test_command: "make -j1 PLATFORM=1 JIT=0 BLAS=0 STATIC=1 FC= COMPATIBLE=1 tests"
upstream_tests:
  - file: tests/test.sh
    source: "LIBXSMM 1.17 tests"
    description: "Upstream C test suite executed through make tests using the generic fallback configuration."
    command: "make -j1 PLATFORM=1 JIT=0 BLAS=0 STATIC=1 FC= COMPATIBLE=1 tests"

test_package_tests:
  - file: test.c
    description: "Links the packaged static archives and validates initialization, target reporting, and memory allocation."
    command: "./test_libxsmm"

assertion_count: 2
