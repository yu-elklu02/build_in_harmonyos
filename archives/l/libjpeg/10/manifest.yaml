software: libjpeg
version: "10"
build_system: autotools
status: built
build_date: "2026-07-12"

source:
  url: "https://www.ijg.org/files/jpegsrc.v10.tar.gz"
  sha256: "8b9eaa13242690ebd03e1728ab1edf97a81a78ed6e83624d493655f31ac95ab5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch - HarmonyOS 平台识别（E007）"
  - "0002-configure.patch - HMDFS umask 限制修复（E011）"

knowledge_gained:
  - "E007: jpeg-10 自带 config.guess(2024-07-27) 不识别 UNAME_SYSTEM=HarmonyOS，需新增分支输出 aarch64-unknown-linux-ohos"
  - "config.sub(2024-05-27) 已内置 linux-ohos*/ohos* 三元组，无需再打补丁"
  - "E011: configure 用 umask 077 创建临时目录，HMDFS 下 config.status 无法写入，改为 umask 022"
  - "libjpeg 与系统同名（R26），仅构建静态库，避免 .so 污染系统库路径"
  - "上游 Makefile.am check-local 是可复用的自测集（7 组逐字节 cmp 断言），已集成到 build()"
