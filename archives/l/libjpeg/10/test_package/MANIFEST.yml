# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libjpeg/10
homepage: "https://www.ijg.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（Makefile.am check-local）
upstream_tests:
  - file: Makefile.am
    source: jpeg-10/Makefile.am
    description: "check-local: cjpeg/djpeg/jpegtran 编解码 testorig.jpg / testimg.ppm / testprog.jpg，与参考图像逐字节 cmp 比对（7 组）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 jpeg_mem_dest/jpeg_mem_src 完成 RGB 图像内存编码-解码往返，校验 SOI 标记、输出尺寸与像素误差"
    command: "./test_libjpeg"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
