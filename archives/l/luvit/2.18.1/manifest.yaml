name: luvit
version: 2.18.1
description: Luvit — Asynchronous I/O for Lua (Node.js-style runtime)
license: Apache-2.0
homepage: https://luvit.io/
upstream: https://github.com/luvit/luvit
adaptation:
  path: A
  toolchain: clang 15 / cmake / LuaJIT (bundled in luvi-source)
  notes: |
    luvit 是 Lua 元包，本体 Lua 代码运行于 luvi（C 运行时，自包含源码含
    LuaJIT/libuv/lpeg/pcre2/lua-openssl/miniz）。鸿蒙适配要点：
    1) 内嵌 libuv 1.48 需 patch（CPU 亲和性 API/mmsg 缺失 + CMake Linux 判定，
       同 main 仓库 libuv/1.52.1 思路），patch 见 0001-ohos-libuv.patch；
    2) luvi 完整构建需 OpenSSL（制品仓 openssl/3.5.6.1 二进制注入，
       WithSharedOpenSSL=ON 用 find_package 而非 FetchContent 自下载）；
    3) 不构建 lit/luvit 自执行 zip 二进制（HMDFS 沙箱执行 "Operation not
       permitted"），改用 termux 同款 bin/luvit 启动脚本
       `exec luvi share/luvit -- "$@"`，实测 luvi 跑 luvit 源码目录 OK。
test:
  assert_count: 2
  cases:
    - luvit --version 输出 luvit 2.18.1
    - luvit -e 'print(...)' 执行 Lua 代码
