# test_package/MANIFEST.yml — luvit 2.18.1
# 上游官方测试声明文件（L0e 门禁要求）
package: luvit/2.18.1
homepage: "https://luvit.io/"

# 上游测试命令（luvit Makefile test 目标：./luvi . -- tests/run.lua）
upstream_check_command: "./luvi . -- tests/run.lua"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/ 目录 87 个 test-*.lua，run.lua 驱动）
upstream_tests:
  - file: tests/run.lua
    source: luvit-2.18.1/tests/run.lua
    description: "luvit upstream TAP test runner (drives tests/test-*.lua)"
    command: "./luvi . -- tests/run.lua"

# test_package 中自带的测试（消费者视角验证运行时可用）
test_package_tests:
  - file: test.py
    description: "消费者测试：luvit --version 与 luvit -e 'print(...)' 验证 Lua 运行时可用"
    command: "python3 test.py"

# 测试断言总数（近似值：2 个用例，各 1 次断言）
assertion_count: 2
