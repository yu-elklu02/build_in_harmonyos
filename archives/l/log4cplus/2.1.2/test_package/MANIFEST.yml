# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: log4cplus/2.1.2
homepage: https://github.com/log4cplus/log4cplus

# 上游测试命令
upstream_check_command: "cmake -DLOG4CPLUS_BUILD_TESTING=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# log4cplus 上游使用 CMake 的 LOG4CPLUS_BUILD_TESTING 开关控制测试构建，
# 测试套件涵盖日志级别、Appender、Layout、Filter、线程安全等核心功能
upstream_tests:
  - file: tests/
    source: log4cplus-2.1.2/tests/
    description: "log4cplus 官方测试套件 — 覆盖日志级别/Appender/Layout/Filter/线程安全等"
    command: "cmake -DLOG4CPLUS_BUILD_TESTING=ON .. && cmake --build . && ctest --output-on-failure"

# 上游 ctest 实测结果（build() 中 cmake.test() 运行，见构建日志）
#   tests/ 目录 19 个 .at 套件（GitHub API REL_2_1_2 核实），ctest 注册 16 个测试
#   本地实测：16/16 全过（100% tests passed, 0 tests failed out of 16，
#   Total Test time 12.35s），断言总数 206（assertion_count）
upstream_test_result:
  total: 16
  passed: 16
  failed: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(log4cplus CONFIG) + target_link_libraries log4cplus::log4cplus"
    command: "cmake -S . -B build"
  - file: test_package/src/test_log4cplus.cc
    description: "log4cplus::initialize + Logger 创建 + ConsoleAppender + LOG4CPLUS_INFO 日志写入 + getLogLevel 检测"
    command: "./test_log4cplus"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 206
