software: libabigail
display: "libabigail"
description: "The ABI Generic Analysis and Instrumentation Library — 比较 ELF 二进制 ABI 差异的 C++ 库与工具集（abidw/abidiff/abilint/abicompat/abipkgdiff/kmidiff）"
category: system
homepage: "https://sourceware.org/libabigail/"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 补丁识别 HarmonyOS（aarch64-unknown-linux-ohos，E007）"
    - "configure umask 077→022 规避 HMDFS 临时目录写入失败（E129）"
    - "tr1/* → std/* C++11 现代化（libc++ 无 <tr1/...> 头）"
    - "temp_file 改 std::fstream + TMPDIR（libc++ 无 __gnu_cxx::stdio_filebuf；/tmp 只读 E002）"
    - "依赖 libelf/libdw（elfutils）、libxml2、fts（musl-fts）"
  common_dependencies:
    - libxml2
    - elfutils
    - musl-fts

versions:
  "1.4":
    status: built
    build_date: "2026-08-04"
    conan_ref: "libabigail/1.4"
