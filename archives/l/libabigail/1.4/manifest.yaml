knowledge_gained:
  - "E007: config.guess/sub 需补丁识别 HarmonyOS；2015 版 config.guess 每个 case 分支必须自带 echo+exit"
  - "E129: HMDFS setgid + umask 077 导致 configure/config.status 临时目录写入 Permission denied，须 umask 022"
  - "libc++ 无 tr1/* 头与 __gnu_cxx::stdio_filebuf，需 C++11 现代化 + std::fstream"
  - "AArch64 long double 是 quad-float，产生 __floatditf/__fixtfdi 未定义符号；避免 long double 运算或链 compiler-rt"
  - "temp_file 硬编码 /tmp 在 OHOS 只读（E002），改 TMPDIR"

