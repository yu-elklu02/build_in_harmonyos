# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libabigail/1.4
homepage: "https://sourceware.org/libabigail/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: runtestreaddwarf
    source: libabigail-1.4/tests/runtestreaddwarf
    description: "读取 ELF/DWARF 生成 abixml 并与基线比对"
    command: "./runtestreaddwarf"
  - file: runtestreadwrite
    source: libabigail-1.4/tests/runtestreadwrite
    description: "abixml 读-写往返一致性"
    command: "./runtestreadwrite"
  - file: runtestabidiff
    source: libabigail-1.4/tests/runtestabidiff
    description: "abidiff 工具行为"
    command: "./runtestabidiff"
  - file: runtestdiffdwarf
    source: libabigail-1.4/tests/runtestdiffdwarf
    description: "DWARF 差异分析"
    command: "./runtestdiffdwarf"
  - file: runtesttypesstability
    source: libabigail-1.4/tests/runtesttypesstability
    description: "IR 读取稳定性（两次读取一致）"
    command: "./runtesttypesstability"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libabigail.cc
    description: "链接 libabigail 并调用 abigail::ir::environment / get_library_version_string；另执行 abidw --version"
    command: "./test_libabigail"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
