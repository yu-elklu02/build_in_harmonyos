# conandata.yml — libzmf 0.0.2
# Source: official Document Liberation Project release tarball via the
# libreoffice.org dev-www host. libzmf 0.0.2 ships a pre-generated
# `configure` script, so no autoreconf is needed under normal circumstances.
# R39: HTTPS official source (dev-www.libreoffice.org serves HTTPS).

sources:
  url: "https://dev-www.libreoffice.org/src/libzmf-0.0.2.tar.xz"
  sha256: "27051a30cb057fdb5d5de65a1f165c7153dc76e27fe62251cbb86639eb2caf22"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    description: "Replace config.guess with OHOS-aware version (E007/E072)"
  - patch_file: "patches/0002-config.sub.patch"
    description: "Replace config.sub with OHOS-aware version (E007/E072)"
  - patch_file: "patches/0003-configure.patch"
    description: "configure umask 077 → 022 (HMDFS refuses writes to 700-permission mktemp subdirs, E046)"
  - patch_file: "patches/0004-src-lib-libzmf_utils.cpp.patch"
    description: "Replace ICU ucnv_* with Latin-1 byte passthrough under ZMF_NO_ICU; ICU unavailable on OHOS worker"
