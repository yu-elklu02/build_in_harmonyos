package: libunistring/1.0
homepage: "https://www.gnu.org/software/libunistring/"

upstream_check_command: "CFLAGS='-g -O2 -Wno-incompatible-pointer-types' ./configure --disable-shared --enable-static --disable-rpath --disable-dependency-tracking && make -j4 && make check"
upstream_test_in_build: false
upstream_test_command: "MSYS2 MinGW64 local upstream check on 2026-07-26"

upstream_tests:
  - name: "libunistring make check suite"
    source: "libunistring-1.0/tests"
    description: "Local make check completed: TOTAL 580, PASS 525, SKIP 30, FAIL 25; pass rate 525/550 = 95.45% excluding skips, 525/580 = 90.52% overall. Non-100% failures are local Windows/MSYS environment differences (locale/codepage behavior, chmod/tempdir permission semantics, POSIX stat/lstat/ftruncate/select/signal/thread behavior, and related runtime crashes), not OHOS recipe changes. First GCC 14 run needed -Wno-incompatible-pointer-types because libunistring 1.0 bundles older gnulib signature checks. MSYS POSIX GCC 15 was also tried but stopped at test-stdalign compile incompatibility, so the completed MinGW64 run is recorded."

test_package_tests:
  - file: test.c
    description: "Consumer smoke test for u8_strlen and u8_check"
    command: "./test_libunistring"

assertion_count: 2
