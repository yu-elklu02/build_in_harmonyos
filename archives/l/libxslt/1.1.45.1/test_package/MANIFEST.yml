package: libxslt/1.1.45.1
homepage: "https://gitlab.gnome.org/GNOME/libxslt"

upstream_check_command: "ctest --test-dir <build> -N"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build> -VV"
upstream_tests:
  - name: "runtest"
    source: "release tests/runtest.c with tests/{REC,REC2,general,encoding,documents,numbers,keys,namespaces,extensions,reports,exslt}"
    description: "libxslt upstream regression suite; CTest output: Total 748 tests, no errors"
    command: "ctest -R runtest -VV"
  - name: "testThreads"
    source: "release xsltproc/testThreads.c"
    description: "libxslt upstream thread smoke test"
    command: "ctest -R testThreads -VV"

test_package_tests:
  - file: test.c
    description: "消费者测试：编译、链接并运行最小 libxslt 版本探针"
    command: "conan test (compile/link test_probe + run)"
  - file: test.xsl
    description: "消费者测试：执行 xsltproc 完成一次 XSLT 文本转换"
    command: "xsltproc test.xsl test.xml"

assertion_count: 751
