software: libxslt
version: "1.1.45.1"
status: built
build_date: "2026-07-28"
build_system: cmake
conan_ref: "libxslt/1.1.45.1"

source:
  url: "https://github.com/GNOME/libxslt/archive/refs/tags/v1.1.45.tar.gz"
  sha256: "023900618fbf789dba364f38f184a0fe2d3ebad2b2ab06003ffd2d1ee2d5461c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DLIBXSLT_WITH_PROGRAMS=ON"
    - "-DLIBXSLT_WITH_CRYPTO=OFF"
    - "-DLIBXSLT_WITH_PYTHON=OFF"
    - "-DLIBXSLT_WITH_TESTS=OFF"
  dependencies:
    - "libxml2/2.15.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Morpheus 构建阶段必须执行 xsltproc 生成 MorpheusML 转换规则"
  - "现有 libxslt/1.1.45 recipe 设置 LIBXSLT_WITH_PROGRAMS=OFF，不能提供 xsltproc"
  - "本 recipe 开启 xsltproc，关闭 EXSLT crypto，避免引入 libgcrypt 依赖"
  - "OHOS 包内可执行 ELF 必须在 package() 后重签；当前真机环境签名工具位于 PATH 的 usr/local/bin，而不是 /data/service/hnp/bin"
  - "默认静态构建可避开 HMDFS 下 CMake install 创建版本化 .so 软链接的权限问题，同时满足 Morpheus 对 xsltproc 的构建期需求"
  - "2026-07-28 OHOS 真机 Conan/test_package 与 release 源码 CTest 均已通过"
