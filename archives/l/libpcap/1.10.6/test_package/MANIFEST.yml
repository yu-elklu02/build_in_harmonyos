# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libpcap/1.10.6
homepage: "https://www.tcpdump.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libpcap testprogs/ 目录下有测试程序，但依赖 autotools 构建系统，
# 本配方使用 cmake，上游测试未集成到构建中
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 pcap_lib_version(), pcap_open_dead()+pcap_compile(), pcap_findalldevs() API 链接及基本功能"
    command: "./test_libpcap"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
